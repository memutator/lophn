id: token-budget-and-auto-compact
version: 0.9.0
title: '입력 예산을 실제 token에 가깝게 세고, 넘치면 turn 안 결과를 줄이고 다음 turn 전에 자동으로 Compact한다'
modules: [packages/core/lophn-agent, packages/core/main, packages/protocol]
checked: [architecture-run, architecture-agent-chat, architecture-layers]
change: |
  전: 입력 예산은 wire JSON의 UTF-8 byte를 그대로 token으로 셌다. 영어·code는 byte가 token의 3~4배라 200k 창 model이 실제 약 5만 token에서 `context_limit`으로 막혔다. 넘치면 turn이 그대로 끝났고, turn 안 tool loop는 줄일 길이 없었다. Compact는 사람이 부를 때만 했고 요약 상한도 byte로 세어 약 1k token이었다.
  후:
  - 입력 예산은 같은 turn 앞 call의 실제 prompt token(`input + cache_read + cache_write`)에 늘어난 byte를 더해 잰다. 앞 call이 없으면 byte/3이다. 이미지는 그대로 하나에 4096이다. compact 요약의 chunk와 본문 상한(`min(예산/10, 4000)`)도 같은 세기다.
  - 조립한 요청이 예산의 85%를 넘으면 turn 안 가장 오래된 tool 결과부터 본문을 고정 문장으로 바꿔 60% 아래로 내린다. 최근 결과 묶음 둘과 `skill.read` 결과는 그대로다. provider가 입력이 크다고 거절하면 같은 방식으로 줄여 다시 보낸다(turn마다 두 번까지).
  - turn의 첫 call이 예산의 절반보다 크고 이전 대화가 예산의 5분의 1 이상이면, 또는 turn이 `context_limit`으로 끝나면, 그 session의 다음 turn을 시작하기 전에 runtime이 Compact한다. `RequestSessionCompact`의 actor에 `machine`이 더해졌다. agent는 여전히 열 수 없다.
  - 요약 지시: 앞 요약이 있으면 갱신하고, 끝에 답을 기다리는 질문·요청은 그대로 남긴다. "token은 UTF-8 byte로 센다" 문장을 지웠다.
why: |
  넘치는 곳은 거의 turn 안이다(앱 짓기 turn은 call 약 100번, tool 결과 하나 약 24 KiB). turn 사이 이력은 글뿐이라 turn 사이에 Compact하면 된다. OMP 분석(`research_notes/omp-cache-compaction-tool-loading/compaction.md`)의 threshold·prune·overflow 회복을 lophn 모양으로 줄였다.
decisions:
  - text: |
      context가 넘칠 때 lophn이 사람 없이 줄인다: turn 안은 오래된 tool 결과 본문을 바꾸고, turn 사이는 자동 Compact한다.
    by: person
  - text: |
      실제 provider로 확인하는 일(cache, OAuth TTL, OpenAI tool search)은 보류한다.
    by: person
  - text: |
      앞 call이 없을 때 byte/3으로 센다. 영어·code와 한국어 모두 대개 실제보다 크게 센다. 낮게 센 경우는 provider overflow 회복이 받는다.
    by: agent
  - text: |
      줄인 결과의 원문은 tool 호출 기록에 그대로 두고 model 입력에서만 바꾼다. model은 필요하면 tool을 다시 부른다. 버린 길: model로 turn 안 tool loop를 요약하기(호출이 하나 더 들고 요약이 틀릴 수 있다).
    by: agent
  - text: |
      자동 Compact 판단은 runtime 메모리에 둔다. runtime이 다시 뜨면 잊고, 넘치는 turn이 다시 정한다. 저장하면 표나 칸이 하나 더 는다.
    by: agent
  - text: |
      자동 Compact는 pump가 다음 turn을 시작하기 직전에 그 session에만 한다. 끝난 turn 뒤에 바로 요청을 열면 같은 순간 새 입력이 turn을 시작해 요청이 실패한다.
    by: agent
follow_up: |
  `project-docs/plan/context-cache/`의 나머지(cache 표시 위치, OpenAI cache key, OAuth TTL, OpenAI tool 지연)는 그대로 남는다.
