    journeys: [project-register-first, project-agent-session-first-message, agent-edits-open-document, document-conflict-keep-mine, terminal-coding-agent-first-run]
    edges: [폴더 밖 파일 열기, 열린 문서를 agent가 먼저 저장, 문서가 디스크에서 바뀜]
