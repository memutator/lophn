schema_version: 1
catalog: ../boundary-catalog.yaml
interfaces:
  - coding-agent-harness-api
requirements:

  - id: req-0097
    status: accepted
    subject: coding-agent
    statement: coding agent에게 여는 CLI 명령은 앱 개발과 앱 고치기에 쓴다.
    acceptance:
      - coding agent가 lophn의 CLI 명령으로 앱을 만들고 고칠 수 있다.
    related:
      - coding-agent-cli-interface

  # 연결과 자격

  - id: req-1050
    status: accepted
    subject: coding-agent
    statement: "Claude Code, Codex, OpenCode, Hermes, pi, Gemini CLI, OpenClaw의 session이 lophn의 CLI와 skill로 연결되어 앱 개발과 앱 고치기에 쓰인다."
    acceptance:
      - "일곱 제품 각각에서 검증된 연결로 CLI 호출이 성공한다."
      - "연결한 session이 skill을 필요할 때 읽는다."

  - id: req-1051
    status: accepted
    subject: coding-agent
    statement: "외부 coding agent process는 App Engineer가 ticket을 맡길 때만 열린다."
    acceptance:
      - "lophn을 시작하거나 문제가 생겨도 새 coding agent process가 열리지 않는다."
      - "App Engineer가 ticket을 맡기면 고른 harness 하나만 열린다."

  - id: req-1052
    status: accepted
    subject: coding-agent
    statement: "App Engineer가 session을 띄울 때 lophn은 그 앱 하나 범위의 coding token을 새로 만들어 session 환경 변수로 넘기고, session이나 ticket이 끝나면 회수한다."
    acceptance:
      - "띄운 session의 CLI가 그 token으로 그 앱의 조회와 변경을 한다."
      - "session이 끝나거나 ticket이 끝나면 그 token의 새 호출이 거절된다."

  # 폐기: 세부다.
  - id: req-1053
    status: rejected
    subject: coding-agent
    statement: "coding 자격을 만드는 중 준비나 commit이 실패하면 그 자격은 쓸 수 없게 정리한다."
    acceptance:
      - "자격을 준비하는 도중 실패를 일으키면 그 자격으로 하는 호출이 거절된다."
      - "commit 단계에서 실패를 일으켜도 같다."

  - id: req-1054
    status: accepted
    subject: coding-agent
    statement: "사람이 Settings에서 coding agent 제품(harness)을 연결하면 lophn이 그 제품에 lophn skill을 설치하고, 설치 실패는 따로 보인다."
    acceptance:
      - "연결한 제품에 lophn skill이 설치된다."
      - "설치를 실패시키면 연결 결과에 설치 실패가 따로 보인다."
    related:
      - shell

  # 폐기: App Engineer가 session을 띄우니 이름이 이미 정해진다.
  - id: req-1055
    status: rejected
    subject: coding-agent
    statement: "연결의 표시 이름은 명시한 이름 옵션, 제품 환경이 주는 이름, MCP 초기화 때 client가 알린 이름의 순서로 정한다."
    details:
      ordering:
        - "명시한 이름 옵션"
        - "제품 환경이 주는 이름"
        - "MCP 초기화 때 client가 알린 이름"
    acceptance:
      - "같은 제품의 두 연결이 서로 다른 이름으로 구별되어 기록된다."
      - "이름 옵션을 주면 환경이 주는 이름보다 우선한다."

  - id: req-1056
    status: accepted
    subject: coding-agent
    statement: "coding token의 인증이 실패해도 사람 자격으로 대신하거나 회수한 token을 저절로 다시 발급하지 않는다."
    acceptance:
      - "인증 실패를 일으켜도 새 token 발급이나 사람 자격 사용이 일어나지 않는다."

  # 폐기: coding token은 keychain에 두지 않고 session마다 환경 변수로 넘긴다(req-1052).
  - id: req-1057
    status: rejected
    subject: coding-agent
    statement: "MCP server와 CLI는 시작할 때 연결 참조로 OS keychain에서 자격을 받는다."
    acceptance:
      - "설정 파일, prompt, wrapper에 token 없이 연결 참조만 있어도 MCP 초기화와 CLI 호출이 성공한다."

  # 폐기: req-1057과 같은 이유다.
  - id: req-1058
    status: rejected
    subject: coding-agent
    statement: "keychain이 잠겼거나 읽을 수 없거나 자격이 없으면 MCP server와 CLI는 사용할 수 없다고 알리고, 다른 자격이나 평문 파일로 대신하지 않는다."
    acceptance:
      - "keychain이 잠긴 상태에서 초기화하면 사용 불가 이유가 나오고 다른 자격으로 호출되지 않는다."
      - "평문 파일이나 사람 자격으로 넘어가지 않는다."

  # 폐기: coding agent는 shell로 같은 loader를 부를 수 있어 자격을 agent에게서 숨길 수 없다. 지키는 것은 범위와 회수다.
  - id: req-1059
    status: rejected
    subject: coding-agent
    statement: "coding MCP와 CLI는 시작할 때 신뢰하는 loader가 현재 연결, 범위, process 결합을 확인한 뒤 보호된 process 안 통로로만 자격을 전달받는다."
    acceptance:
      - "연결이 회수됐거나 범위가 다르거나 다른 process에서 온 시작은 자격을 받지 못하고 거절된다."
      - "확인을 거친 시작은 자격을 받아 호출이 성공한다."
      - "자격이 인자나 파일로 전달되지 않는다."

  # 폐기: req-1052에 합쳤다.
  - id: req-1060
    status: rejected
    subject: coding-agent
    statement: "lophn이 터미널 탭에서 연 coding agent에는 자격 원문 대신 연결 참조만 넘기고, 그 아래에서 시작하는 MCP server와 CLI가 같은 방법으로 자격을 받는다."
    acceptance:
      - "터미널 탭에서 연 session의 환경과 출력에 자격 원문이 없다."
      - "그 session의 MCP와 CLI가 keychain에서 자격을 받아 성공한다."

  - id: req-1061
    status: accepted
    subject: coding-agent
    statement: "coding token을 회수하면 그 token으로 잡은 claim도 풀리고, claim 정리가 늦어도 회수된 token의 새 호출은 거절된다."
    acceptance:
      - "회수 직후 그 token이 쥔 claim이 풀린 것으로 읽힌다."
      - "claim 정리를 늦춰도 회수된 token의 읽기와 쓰기가 거절된다."

  - id: req-1062
    status: accepted
    subject: coding-agent
    statement: "ticket이 취소되면 lophn은 그 ticket의 coding agent session을 멈추고 token을 회수한다."
    acceptance:
      - "ticket을 취소하면 그 session process가 끝나고 token의 새 호출이 거절된다."
    related:
      - app-tickets

  # 범위와 파일 접근

  - id: req-1063
    status: accepted
    subject: coding-agent
    statement: "coding agent의 자격은 늘 앱 하나 범위이고, 새 앱은 lophn이 먼저 등록한 뒤 그 앱의 App Engineer가 맡긴다."
    acceptance:
      - "새 앱을 만드는 ticket을 맡기면 lophn이 등록한 그 앱 범위의 token이 session에 넘어간다."
    related:
      - apps

  - id: req-1064
    status: accepted
    subject: coding-agent
    statement: "앱 하나 범위 token의 결과(목록, 검색, 본문, 첨부, ticket 근거)는 그 앱의 정보, 문제, ticket과 공통 SDK, 템플릿만 담는다."
    acceptance:
      - "다른 앱이나 project의 문제, ticket, 근거를 가리켜 읽으면 제목과 본문이 나오지 않는다."
      - "검색 결과와 목록 건수에 범위 밖 자료가 섞이지 않는다."

  # 폐기: req-1064에 합쳤다.
  - id: req-1065
    status: rejected
    subject: coding-agent
    statement: "앱 하나 범위 연결은 그 앱의 ticket과 근거를 읽고, 근거의 목록, 첨부, 추가 조회에서도 같은 범위 검사를 받는다."
    acceptance:
      - "다른 앱을 가리키는 근거는 제목과 본문 없이 읽을 수 없다는 사실만 보인다."
      - "근거를 추가로 달아도 범위 밖 자료는 읽히지 않는다."

  # 폐기: req-1064에 합쳤다. 결과의 redaction은 base가 맡는다.
  - id: req-1066
    status: rejected
    subject: coding-agent
    statement: "모든 tool과 명령의 결과(목록, 검색, 요약, 본문, 첨부, 이어 읽기, 다음 안내)는 연결된 범위 안의 자료만 담고 redaction을 거친다."
    acceptance:
      - "범위 밖 앱의 제목, 본문, 건수, 첨부가 나오지 않는다."
      - "결과 어디에도 token이 없다."

  - id: req-1067
    status: accepted
    subject: coding-agent
    statement: "App Engineer는 coding agent session을 그 앱의 source 폴더를 작업 위치로 띄운다."
    acceptance:
      - "띄운 session의 작업 위치가 그 앱의 source 폴더다."

  # 폐기: token이 앱 하나를 가리켜 찾을 것이 없다.
  - id: req-1068
    status: rejected
    subject: coding-agent
    statement: "대상 앱은 명시한 선택, 앱 환경 설정, 현재 작업 폴더의 blueprint 순으로 찾고, 찾은 결과가 연결의 범위를 넓히지 않는다."
    details:
      ordering:
        - "명시한 선택"
        - "앱 환경 설정"
        - "현재 작업 폴더의 blueprint"
    acceptance:
      - "세 방법으로 각각 같은 앱을 찾는다."
      - "범위 밖 앱을 명시해도 접근이 거절된다."

  # 폐기: coding token의 범위는 core-server req-0206이 정한다. 하지 못하는 일을 하나씩 늘어놓지 않는다.
  - id: req-1069
    status: rejected
    subject: coding-agent
    statement: "coding agent의 자격으로는 harness 설치, session 시작과 재개, 권한 응답을 호출하지 못한다."
    acceptance:
      - "그 호출을 직접 보내면 거절된다."

  # CLI가 지키는 것

  - id: req-1070
    status: accepted
    subject: coding-agent
    statement: "CLI는 core API를 거치는 통로이고, 같은 자격과 입력이면 core API를 직접 부를 때와 같은 허용 여부와 결과와 거절을 낸다."
    acceptance:
      - "같은 자격과 입력으로 core API와 CLI를 각각 불러 결과와 거절 이유를 비교하면 같다."
      - "통로를 바꿔도 허용 범위가 넓어지지 않는다."
      - "통로가 도메인 기록을 직접 쓰지 않고 core API의 변경 경로를 거친다."
    related:
      - coding-agent-cli-interface

  # 폐기: lophn이 session을 띄울 때 daemon 주소를 넘긴다.
  - id: req-1071
    status: rejected
    subject: coding-agent
    statement: "MCP server와 CLI는 daemon을 명시한 주소 옵션, daemon 주소 환경 설정, 현재 daemon의 연결 정보, 설치 설정, 기본 loopback port 7431 순으로 찾는다."
    details:
      ordering:
        - "명시한 주소 옵션"
        - "daemon 주소 환경 설정"
        - "현재 daemon의 연결 정보"
        - "설치 설정"
        - "기본 loopback port 7431"
    acceptance:
      - "각 설정을 다르게 두어 우선순위대로 고른다."
      - "주소 설정이 없으면 port 7431로 간다."

  # 폐기: session은 lophn 안에서 돈다.
  - id: req-1072
    status: rejected
    subject: coding-agent
    statement: "보통 조회와 MCP 사용은 lophn 창이 떠 있지 않아도 daemon이 떠 있으면 동작한다."
    acceptance:
      - "창이 닫힌 상태에서 MCP tool과 CLI 조회가 성공한다."

  # 폐기: 사람 승인은 core-approvals가 맡는다(req-0303).
  - id: req-1073
    status: rejected
    subject: coding-agent
    statement: "사람의 승인이 필요한 요청은 coding agent 통로에서 실행되지 않고, 승인 대기 사실과 정확한 대상과 영향, 사람이 결정할 확인 링크만 돌려준다."
    acceptance:
      - "release 준비와 앱 호출의 결과에서 대기와 적용을 구별해 읽을 수 있다."
      - "링크를 읽는 것만으로는 승인되지 않는다."
      - "승인 대상이 호출 때의 release, app-api, 입력과 같다."
      - "승인 요청을 열지 않거나 닫거나 기한이 지나면 아무것도 바뀌지 않는다."
      - "coding 자격의 호출이 사람의 결정으로 기록되지 않는다."
      - "TTY 여부와 headless 여부에 상관없이 같은 안내가 나온다."
      - "대기 응답 뒤 같은 연결로 permission 변경이나 secret 값 읽기를 시도하면 거절된다."
    related:
      - approvals
      - coding-agent-cli-interface

  # 폐기: 같은 컴퓨터 안 loopback이라 드물고, 당연한 구현 품질이다.
  - id: req-1074
    status: rejected
    subject: coding-agent
    statement: "변경 요청의 응답이 끊겨 결과를 모르면 성공이나 실패로 추측하지 않고 자동으로 다시 실행하지 않으며, 현재 상태를 읽을 곳을 안내한다."
    acceptance:
      - "기록 직후 응답을 끊어도 같은 변경이 두 번 생기지 않는다."
      - "결과 불명으로 표시되고 현재 상태를 읽는 방법이 나온다."
    related:
      - coding-agent-cli-interface

  # harness 찾기와 설치

  - id: req-1075
    status: accepted
    subject: coding-agent
    statement: "lophn은 지원하는 제품마다 실행 파일 찾기, 띄우기, skill 설치 위치를 adapter로 가진다."
    acceptance:
      - "지원하는 제품마다 실행 파일을 찾고, 띄우고, skill을 설치할 수 있다."

  # 폐기: 세부다.
  - id: req-1076
    status: rejected
    subject: coding-agent-harness-api
    statement: "감지는 PATH와 제품 catalog가 정한 유한한 대체 위치만 읽는다."
    acceptance:
      - "PATH 밖의 정해진 대체 위치에 있는 실행 파일은 발견된다."
      - "그 밖의 위치는 순회하지 않는다."

  # 폐기: 화면 동작의 세부다.
  - id: req-1077
    status: rejected
    subject: coding-agent-harness-api
    statement: "재감지는 사람이 요청할 때만 한다."
    acceptance:
      - "화면에 다시 들어오거나 결과가 비거나 timeout이 나도 재감지와 설치가 자동으로 실행되지 않는다."
      - "사람이 요청하면 재감지가 돈다."

  - id: req-1078
    status: accepted
    subject: coding-agent-harness-api
    statement: "Settings는 제품마다 실행 파일을 찾았는지, version, 로그인 여부를 따로 보이고, 확인하지 못한 것은 확인 못함으로 보인다."
    acceptance:
      - "실행 파일은 찾았지만 version 확인이 timeout된 제품은 version이 확인 못함으로 보인다."
      - "로그인 여부를 확인하지 못한 제품이 로그인됨으로 보이지 않는다."
    related:
      - shell

  # 폐기: 세부다.
  - id: req-1079
    status: rejected
    subject: coding-agent-harness-api
    statement: "감지, 설치, 시작은 이 컴퓨터의 native 환경만 대상으로 하고, 관측과 receipt는 실행 환경과 profile마다 따로 둔다."
    acceptance:
      - "다른 실행 환경(WSL, 원격) 요청은 지원하지 않는다는 안내로 끝난다."
      - "다른 profile의 실행 파일과 설치 결과가 재사용되지 않는다."

  - id: req-1080
    status: accepted
    subject: coding-agent-harness-api
    statement: "사람은 Settings에 기본 실행 옵션(제품, model 등)을 둘 수 있다. App Engineer는 맡길 때마다 지침이나 사람의 메시지를 보고 제품과 실행 옵션을 고르고, 따로 고르지 않으면 기본 실행 옵션을 쓴다."
    acceptance:
      - "기본만 두고 맡기면 기본 제품과 옵션으로 띄워진다."
      - "App Engineer가 다른 제품이나 model을 고르면 그것으로 띄워진다."
      - "연결되지 않은 제품을 고르면 띄우지 않고 그 이유가 App Engineer에게 돌아간다."
    related:
      - agent-roles

  # 폐기: 화면 세부다.
  - id: req-1081
    status: rejected
    subject: coding-agent-harness-api
    statement: "기본 harness가 비어 있으면 설치가 확인된 실행 가능한 후보가 하나일 때 그 후보를 제안하고 여럿이면 사람이 고르게 한다."
    acceptance:
      - "후보가 하나면 제안이 나오고 여럿이면 선택을 묻는다."
      - "후보가 없으면 연결 안내가 나온다."

  # 폐기: req-1083에 합쳤다.
  - id: req-1082
    status: rejected
    subject: coding-agent-harness-api
