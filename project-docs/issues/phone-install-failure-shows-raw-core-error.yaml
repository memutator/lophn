id: phone-install-failure-shows-raw-core-error
title: 폰 앱의 설치 실패 화면이 컴퓨터가 낸 오류 글을 그대로 보여 한국어 내부 글이 영어 화면에 나온다
kind: bug
status: open
topic: app-sync
modules: [packages/mobile, packages/core/apps]
now: |
  폰에서 도는 앱의 설치가 실패하면 앱 화면은 `mobile.local.install-failed.*` 문장 아래에 `detail`로 `state.failure`를 보인다(`packages/mobile/src/screens/apps/index.tsx`). 그 값은 컴퓨터의 답 오류 글을 그대로 옮긴 것이다(`packages/mobile/src/apps/local/transfer.ts`의 `failed`가 `reply.error.message`를 쓴다). core의 `internal` 오류에는 한국어 글이 있다(`packages/core/apps/write-link.ts`의 "ledger에 기록할 수 없다" 같은 것). 개발 core의 emulator 확인에서 한 줄의 한국어 글이 영어 화면에 나왔다.
impact: |
  사람이 폰에서 보는 영어 화면에 한국어 내부 글이 섞이고 그 글은 사람이 할 일을 말하지 않는다. 앱 agent에게 옮겨도 core의 내부 사정이라 쓸모가 적다. 데이터를 잃지는 않는다.
fix: |
  - 작음(추천): 폰이 `detail`에 오류 code와 폰 쪽 영어 문장(어느 단계에서 실패했나: file을 받음, snapshot을 확인함, migration)만 보이고 컴퓨터의 글은 log로만 남긴다.
  - 중간: core가 폰 gate 밖으로 나가는 오류 글의 언어를 정한다(경계의 `internal` 글을 영어로). 이 한 곳만이 아니라 core 전체의 규칙이라 비용이 크다.
