# flows — area 지도
#
# area 하나가 file 하나(areas/<id>.yaml)다. 칸:
# - entries: 이 area가 소유를 맡는 entry의 정의 path. file이나 폴더(끝에 /). entry 하나는 가장 긴 path가 맞는
#   area 하나에 든다. 맞는 area가 없는 entry는 `node tools/flows.ts entries`가 따로 보인다.
# - owns: `system:`·`ui:` flow처럼 code에서 뽑히지 않는 동작 가운데 이 area가 맡는 mechanism. 여기 없는 것을
#   찾으면 쓰지 않고 보고한다. 같은 mechanism을 두 area에 적지 않는다.
# - read: 읽을 architecture 문서(project-docs 기준)와 code path. 다른 area와 겹쳐도 된다. 읽기만 한다.
# test_groups는 tests/<id>.yaml, journey_groups는 journeys/<id>.yaml이다. test file 하나는 가장 긴 path가 맞는 group에 든다.

areas:

  - id: sessions
    title: session, 메시지, ACP, event stream
    entries:
      - packages/protocol/acp/
      - packages/protocol/events/
      - packages/core/router/
      - packages/core/lophn-agent/session/
      - packages/protocol/lophn-agent/sessions.ts
      - packages/protocol/lophn-agent/agent-sessions.ts
      - packages/protocol/lophn-agent/messages.ts
      - packages/protocol/lophn-agent/inputs.ts
      - packages/protocol/lophn-agent/received-messages.ts
      - packages/protocol/lophn-agent/message-images.ts
      - packages/protocol/lophn-agent/message-search.ts
      - packages/protocol/lophn-agent/session-status.ts
      - packages/protocol/lophn-agent/session-lifecycle.ts
      - packages/protocol/lophn-agent/app-calls.ts
      - packages/protocol/lophn-agent/commands.ts
      - packages/protocol/attention/
    owns:
      - session 열기, 닫기, archive, 이름
      - 메시지 넣기와 queue, steer(turn이 도는 중의 메시지), router가 받는 session을 고르기
      - ACP snapshot, draft, 화면이 다시 붙을 때 이어 받기
      - Gateway 연결과 event 전달(commit 뒤 event, 남지 않는 event)
      - 이미지 첨부, 메시지 검색, slash command 목록
      - thread bookmark
      - 주의(attention): host가 보고한 presence, 못 본 turn 끝(unseen), 터미널 signal
    read:
      - architecture/acp.md
      - architecture/agent-chat.md
      - architecture/event.md
      - architecture/workspace-session.md
      - packages/core/lophn-agent/session/
      - packages/core/attention/
      - packages/core/router/
      - packages/core/events/
      - packages/shell/renderer/conversation/
      - packages/shell/main/thread-bookmarks/

  - id: turns
