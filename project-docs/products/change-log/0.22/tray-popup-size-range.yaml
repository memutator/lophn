id: tray-popup-size-range
version: 0.22.0
title: "tray popup 크기를 범위로 선언해 내용에 맞춘다"
modules: [packages/protocol, packages/core/agent-workspaces, packages/core/apps, packages/sdk, packages/shell/preload, packages/shell/ipc, packages/shell/renderer, tools, tests]
checked: []
change: |
  전: tray 크기는 숫자 고정뿐이었다. 목록이 짧아도 선언한 높이 그대로였다.
  후:
    - `tray`의 각 쪽은 숫자(고정)나 `{min?, max?}`(범위)다. 범위면 화면 내용에 맞춰 그 안에서 늘고 준다. 높이는 내용 높이를 따르고, 너비는 min(없으면 기본값을 범위 안으로 맞춘 값)에서 시작해 내용이 가로로 넘칠 때만 max까지 넓어진다.
    - `tray` 자리의 앱 preload가 내용 크기(`scrollWidth`, body 높이)를 `app:content-size`로 올리고 popup이 받아 맞춘다. 앱 code는 할 일이 없다. 단, html·body·root가 `height: 100%`면 높이를 잴 수 없어 처음 높이에 머문다.
    - SDK: `@lophn/declaration` 4.2.0(범위, type `TraySide`), `@lophn/app-ui` 2.9.0(declaration pin만). migrate-sdk 메모와 Instruction diff가 있다.
  저장 모양: 바뀌지 않는다. 숫자 선언은 그대로 읽힌다.
  옮기기: 없다.
why: |
  고정 크기가 답답했다. 사람이 max 같은 범위를 받아 내용에 맞추기를 원했다(사람).
decisions:
  - text: |
      범위 선언으로 맞춘다. 실행 중 앱이 크기를 정하는 hook(`useTraySize`)은 두지 않는다.
    by: person
  - text: |
      4.1.0을 고치지 않고 4.2.0으로 올린다. 4.1.0은 이미 설치된 package로 나가 앱 agent가 메모를 읽었을 수 있다.
    by: agent
  - text: |
      너비는 넘칠 때만 넓힌다. 폭을 채우는 화면의 "자연 너비"는 늘 최대라 줄어드는 너비를 잴 수 없다.
    by: agent
