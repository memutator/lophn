id: git-worktree-stage1
version: 0.23.189
platform_note: none
title: "git worktree 1단계(화면 밖): core 엔진·source control·session/terminal/command/workflow/team 격리·CLI·앱 SDK"
modules:
  - packages/protocol
  - packages/core/projects
  - packages/core/approvals
  - packages/core/agent-workspaces
  - packages/core/lophn-agent
  - packages/core/terminals
  - packages/core/terminal-agents
  - packages/core/workflows
  - packages/core/router
  - packages/core/remote
  - packages/core/main
  - packages/cli
  - packages/sdk
  - packages/shell/ipc
  - packages/shell/main
  - packages/shell/preload
  - packages/shell/renderer
  - packages/mobile
change: |
  - **protocol·ledger 계약**: `wkt` ID 접두사, 예약 앱 slug `worktree`, `worktrees/*`·`source_control/*` route, `WorktreesChanged`·`WorktreeStatusChanged` event, `worktree_remove` GateCall, `sessions.worktree_id`, `terminals/open`·`project_commands/run|restart`·`team/spawn`·workflow 선언 및 flow wire의 `worktree` 계약을 추가했다. ledger schema step `projects.worktrees`로 `project_worktrees`, `project_worktree_settings`, `sessions.worktree_id`를 추가했다.
  - **core worktree 엔진**: 전역 설정 `projects.worktrees_folder`(`locked: true`, 기본 `<data>/worktrees`, 안전 경로 검증), Windows 220자 예산·예약 이름 회피 경로 생성, 비대화형 하드닝 `runGit`과 per-repo mutex·lock retry, 좁은 `.git` HEAD watcher, `unmounted` 방어 및 Windows/WSL cross-OS prune 차단, `copy_patterns`(git check-ignore + CoW + 덮어쓰기 금지 + 2 GiB/50,000 상한)와 `.worktreeinclude` 읽기 전용 감지, setup/teardown Project Command 훅, 3중 소유권 검증(`provenance`, managed root, `git_common_dir`/`.git` 포인터)과 hard/soft 삭제 가드, CAS 브랜치 삭제, 기동 시 `creating`/`removing` crash 복구를 구현했다.
  - **core source control route**: `source_control/{status,diff,log,show,branches,stage,unstage,discard,commit,branch_create,switch,pull,push}`를 추가했다. 쓰기 route는 user 전용이며 충돌 상태·충돌 마커 커밋 가드, 턴 중 switch 차단, `--ff-only` pull, force push 미노출, 인증 실패 시 `unauthorized` + 1줄 `git -C` 명령 반환을 강제한다.
  - **격리·승인·workflow·팀**: `sessions.worktree_id` 불변 바인딩, lophn agent file scope 치환 및 `PROJECT_ROOT`/`WORKTREE_*` 환경 변수 주입, harness agent(background·GUI 탭)·터미널·Project Command의 worktree cwd/env 적용, `folderOfCwd`의 managed worktree 허용, agent 삭제의 `worktree_remove` 승인 판정, YAML/flow `worktree: "new" | "inherit"` 및 `team spawn --worktree new|inherit|<wkt_id>`를 연결했다.
  - **CLI·앱 bridge·SDK·원격**: `lophn worktree list|get|status|create|adopt|rename|remove`, `lophn team spawn --worktree`, 앱 화면 읽기 전용 `lophnApp.projects.worktrees`·`onWorktreesChanged`·`@lophn/app-ui` `2.27.0` `useWorktrees`, `@lophn/flow` `2.2.0` `agent({ worktree })`, `@lophn/agent` `1.21.0` `worktree_remove`를 추가했고 원격 기기 route/event allowlist를 갱신했다.
  - **2단계 범위 제외**: renderer/폰 화면 UI(Explorer worktree 메뉴, Source Control 패널, 새 session/터미널 picker, 배지, Project Settings worktree 탭, `worktree_remove` 현지화 i18n 문구)는 2단계에서 같은 branch에 이어 구현한다.
why: |
  한 git project에서 여러 agent session·harness·터미널·workflow step·team worker가 서로 working tree를 덮어쓰지 않고 안전하게 병렬 작업할 수 있도록 1단계(화면 밖) 기반을 구축한다(`project-docs/products/roadmap/git-worktree.md`).
decisions:
  - text: "`WorktreeRecord`에 `desk_key`를 두지 않는다(로드맵 결정이 spec보다 우선). desk 배치는 shell layout의 관심사로 남긴다."
    by: person
  - text: "adopted worktree 삭제는 ledger 추적 해제(`untrack_only`)만 수행하고 디스크·브랜치를 절대 지우지 않으며, managed worktree 삭제도 3중 소유권 검증과 hard/soft 가드·CAS 브랜치 삭제를 통과해야만 허용한다."
    by: agent
  - text: "`team spawn --worktree new`는 SQLite writer Worker tx 바깥에서 worktree를 먼저 생성하고 spawn command가 실패하면 즉시 롤백해 고아 worktree를 남기지 않는다."
    by: agent
  - text: "1단계에서는 `@lophn/i18n` catalog 변경 없이 `worktree_remove` 승인 카드 switch exhaustiveness만 영문 문구로 맞추고, 현지화 및 화면 UI는 2단계에 맡긴다."
    by: agent
follow_up: |
  2단계(renderer 및 폰 화면 UI)를 같은 branch(`feat/git-worktree`)에 이어 구현한다.
checklist:
  - "`lophn worktree create|list|status|rename|remove`가 정상 동작하고 `adopted` 삭제가 디스크를 건드리지 않는지 확인한다"
  - "worktree가 묶인 session·터미널·project command·workflow step·`team spawn`이 해당 worktree 경로와 `WORKTREE_*` env로 격리되는지 확인한다"
