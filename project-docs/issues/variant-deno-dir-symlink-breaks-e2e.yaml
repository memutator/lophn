id: variant-deno-dir-symlink-breaks-e2e
title: "variant의 e2e deno-dir symlink로 gate의 앱 E2E가 모두 떨어진다"
kind: bug
status: fixed
topic: eval
modules: [tests]
now: |2
  `prepareVariant`(`tests/eval/experiment/variant/prepare.ts`)는 variant에 `.dev-data/e2e/deno-dir`이 없으면 지금 checkout의 것을 symlink로 잇는다. 앱 E2E는 core에 `DENO_DIR=<variant>/.dev-data/e2e/deno-dir`(`tests/support/coding/deps.ts`의 `appCoreEnv`)을 주고, release 준비가 그 안의 esbuild를 띄우다 `child.unref` 오류와 `ui_build_failed`로 떨어진다. 같은 test가 지금 checkout에서는 통과하고, variant에서 symlink를 지우고 `deno task e2e:deps`를 돌리면 통과한다. 첫 experiment의 gate가 앱 E2E 11개 실패로 멈췄다.
impact: |2
  앱 code를 건드리지 않은 variant도 gate의 e2e 단계에서 멈춰 experiment를 못 돈다(손으로 deps를 받아야 한다).
fix: |2
  - symlink 대신 variant에서 `deno task e2e:deps`를 돌린다(작음. 처음 한 번 내려받는 시간이 든다). 추천.
  - symlink를 두고 core에 실제 경로(realpath)를 넘긴다(작음. 왜 symlink 경로가 깨지는지 확인이 먼저다).
decided: |2
  앞의 것. variant에서 `deno task e2e:deps`를 돌린다. 원인을 몰라도 지금 checkout과 같은 길이라 맞다(agent).
closed: |2
  `prepareVariant`가 symlink를 잇지 않고, variant의 `.dev-data/e2e/deno-dir`이 비었으면 variant에서 `deno task e2e:deps`를 돈다. 실패하면 `unavailable`이다. 이미 symlink가 있는 옛 variant worktree는 비지 않은 것으로 보여 건너뛰므로 지우고 다시 만든다.
guard: 없음
