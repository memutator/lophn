schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  - id: req-0250
    status: accepted
    subject: supervision
    statement: 사용자 코드가 도는 child process의 메모리, IPC, 환경에서 core 자격을 조회해도 나오지 않는다.
    acceptance:
      - 앱 코드가 도는 child에서 core 자격을 찾아도 값이 없다.
      - test 코드가 도는 child에서 core 자격을 찾아도 값이 없다.

  - id: req-0251
    status: accepted
    subject: supervision
    statement: child process 하나가 무한 loop, 응답 없음, crash여도 다른 child와 core의 응답은 멈추지 않는다.
    acceptance:
      - 앱 child 하나를 무한 loop시키거나 죽여도 다른 앱과 core의 호출이 계속 응답한다.
