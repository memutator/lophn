schema_version: 1
catalog: ../boundary-catalog.yaml
interfaces:
  - coding-agent-cli-interface
requirements:

  # 호출과 출력

  - id: req-1200
    status: accepted
    subject: coding-agent-cli
    statement: "CLI는 coding agent의 연결 자격으로 core API를 불러 앱 개발과 고치기의 조회, 변경, 보고를 한다."
    acceptance:
      - "연결 자격이 있는 session에서 CLI로 조회, 변경, 보고가 성공한다."
      - "연결 자격이 없으면 CLI 호출이 거절된다."

  - id: req-1201
    status: accepted
    subject: coding-agent-cli-interface
    statement: "모든 command는 JSON 출력을 낼 수 있다."
    acceptance:
      - "도움말, test, 승인 대기, ticket을 JSON으로 읽을 수 있다."

  - id: req-1202
    status: accepted
    subject: coding-agent-cli-interface
    statement: "성공은 종료 값 0이고, 입력 오류, 권한 거절, 실행 실패, 효과를 확인할 수 없는 경우는 0이 아닌 종료 값이다."
    acceptance:
      - "실패한 호출과 결과 불명인 호출이 종료 값 0으로 끝나지 않는다."
      - "부적합 blueprint 검사도 0으로 끝나지 않는다."

  - id: req-1203
    status: accepted
    subject: coding-agent-cli-interface
    statement: "JSON을 고르면 stdout에는 완전한 결과 하나만 쓰고 stderr에는 안전한 오류와 추가 안내만 쓴다."
    acceptance:
      - "stdout을 redirect해 JSON으로 파싱할 수 있다."
      - "daemon 연결이 끊긴 실패에서도 stdout이 깨지지 않고 오류에 다음 조회가 있다."

  - id: req-1204
    status: accepted
    subject: coding-agent-cli-interface
    statement: "입력은 필수 위치 인자, 선택 옵션, 숫자 범위, JSON 종류, 지원하는 command인지를 실행 전에 검사해 거절한다."
    acceptance:
      - "빠진 필수 값, 범위 밖 숫자, 깨진 JSON, 모르는 command를 넣으면 아무것도 바뀌지 않고 거절된다."

  - id: req-1205
    status: accepted
    subject: coding-agent-cli-interface
    statement: "JSON 본문은 inline이나 지정한 파일 하나에서만 읽고, 상대 위치는 현재 작업 위치 기준으로 해석한다."
    acceptance:
      - "inline과 파일을 함께 주면 거절된다."
      - "공백이 든 위치와 인자가 그대로 전달된다."
      - "상대 경로가 호출한 위치 기준으로 열린다."

  - id: req-1206
    status: accepted
    subject: coding-agent-cli-interface
    statement: "도움말은 지원하는 command마다 목적, 필수와 선택 입력, JSON 출력, 읽기와 변경의 구분, 사람 결정이 필요한지, 다음 조회를 알려 준다."
    acceptance:
      - "도움말 목록에서 test, blueprint, SDK, ticket 명령을 찾는다."
      - "도움말에 나온 command가 모두 실제로 동작한다."

  # daemon과 설치

  # 폐기: CLI에 daemon을 켜고 끄는 명령이 없다. coding token의 범위는 core-server req-0206이 정한다.
  - id: req-1207
    status: rejected
    subject: coding-agent-cli
    statement: "coding 자격으로는 daemon 시작과 중지를 하지 못한다."
    acceptance:
      - "coding 자격으로 daemon 시작과 중지를 부르면 거절된다."

  # 폐기: 사람은 desktop app으로 lophn을 켜고 끄고 진단을 본다.
  - id: req-1208
    status: rejected
    subject: coding-agent-cli-interface
    statement: "사람은 lophn 창 없이도 daemon을 시작하고 멈추고, 현재 연결 상태와 redaction을 거친 daemon log를 CLI로 읽는다."
    acceptance:
      - "이미 시작하거나 멈춘 상태에서 다시 부르면 현재 상태로 응답한다."
      - "daemon 장애의 안전한 이유를 읽는다."
      - "log에 secret이 없다."

  # 폐기: MCP를 두지 않는다.
  - id: req-1209
    status: rejected
    subject: coding-agent-cli-interface
    statement: "MCP 설정 출력은 선택한 coding agent 제품에 맞는 실행 파일, 나뉜 인자, 환경 설정 조각을 돌려주고 제품의 설정 파일은 고치지 않는다."
    acceptance:
      - "제품마다 유효한 조각이 나온다."
      - "출력 뒤 제품의 기존 설정 파일이 그대로다."
      - "secret 원문과 운영 data 위치가 출력에 없다."

  # 폐기: 사람은 Settings에서 coding agent를 연결하고 skill을 설치한다. 화면의 일을 CLI에 두 번 두지 않는다.
  - id: req-1210
    status: rejected
    subject: coding-agent-cli-interface
    statement: "skill은 설치할 수 있는 목록의 이름, 설명, version을 읽고 사람이 고른 target에 설치한다."
    acceptance:
      - "목록에 세 가지가 나온다."
      - "고른 target에만 설치된다."

  # 폐기: req-1210과 같은 이유다.
  - id: req-1211
    status: rejected
    subject: coding-agent-cli-interface
    statement: "설치 점검은 daemon, 인증, 설정의 결과와 coding agent가 실제로 tool을 발견해 불러 오는 단계별 결과를 따로 돌려준다."
    acceptance:
      - "단계마다 성공, 실패, 확인 못함과 다음 확인 방법이 나온다."

  # 폐기: req-1210과 같은 이유다.
  - id: req-1212
    status: rejected
    subject: coding-agent-cli-interface
    statement: "CLI는 coding agent 제품의 catalog 조회, 감지, 선택 target의 설치 계획, 설치, 갱신, 제거, 관측을 화면과 같은 adapter와 규칙으로 한다."
    acceptance:
      - "고르지 않은 제품은 바뀌지 않는다."
      - "사람이 고친 파일과 충돌하면 같은 결과가 나온다."
      - "loading 관측 결과가 화면과 같다."

  # 사람이 여는 화면

  # 폐기: App Engineer 흐름에서 coding agent는 사람과 이야기하지 않으니 사람 화면 링크가 쓸모없다. 문제를 닫는 권한은 problems와 app-tickets가 맡는다.
  - id: req-1213
    status: rejected
    subject: coding-agent-cli-interface
    statement: "문제 제보와 문제 닫기(확인, 무시)는 CLI에서 처리하지 않고, 사람이 여는 화면의 링크와 대기 사실만 돌려준다."
    acceptance:
      - "이 명령을 부른 것만으로 문제나 제보의 상태가 바뀌지 않는다."
      - "coding 자격의 호출은 실행 전에 거절된다."
      - "돌려준 링크의 화면에서 요청한 결정을 할 수 있다."

  # 작업 항목

  - id: req-1216
    status: accepted
    subject: coding-agent-cli
    statement: "coding agent는 CLI로 맡은 ticket을 읽고, claim하고, 갱신하고, 반납하고, release를 잇고, 완료를 보고한다."
    acceptance:
      - "맡은 ticket의 본문, 현재 claim, 조건별 검사를 읽을 수 있다."
      - "CLI로 claim, 갱신, 반납, release 연결, 완료 보고를 할 수 있다."
      - "완료 주장, 승인 대기, activation, 확인됨이 따로 읽힌다."
    related:
      - app-tickets

  - id: req-1491
    status: accepted
    subject: coding-agent-cli
    statement: "coding agent는 CLI로 자기에게 일을 맡긴 App Engineer session에 메시지를 보낸다. 언제 보낼지는 coding agent가 판단한다."
    acceptance:
      - "CLI로 보낸 메시지가 맡긴 App Engineer session에 보낸 쪽(coding agent session)과 근거 ticket이 붙은 입력으로 들어온다."
      - "맡긴 App Engineer session이 닫혀 있으면 그 앱의 App Engineer 새 session이 열려 그 메시지를 받는다."
      - "메시지는 ledger에 남지 않고 받는 session 기록에 남는다."
    related:
      - app-tickets
      - events

  # 폐기: ticket 생성과 취소는 App Engineer가 lophn 안에서 하고, 확인됨과 확인 실패는 App Engineer가 정한다(req-0746). coding token의 범위는 core-server req-0206이 정한다.
  - id: req-1217
    status: rejected
    subject: coding-agent-cli
    statement: "coding 자격은 ticket을 만들거나, 목표를 고치거나, 취소하거나, 확인 판정을 내리지 못한다."
    acceptance:
      - "coding 자격으로 ticket 생성, 목표 수정, 취소, 확인 판정을 부르면 거절된다."
    related:
      - app-tickets

  # 폐기: req-1216에 합쳤다. claim은 CLI로 한다.
  - id: req-1218
    status: rejected
    subject: coding-agent-cli
    statement: "claim은 MCP로만 하고 CLI는 읽기와 보고, MCP claim 안내를 제공하며 자체 claim을 실행하지 않는다."
    acceptance:
      - "CLI의 claim 시도가 MCP 연결 안내로 끝난다."
      - "MCP가 없는 session은 읽을 수는 있어도 claim 없이 code를 쓰지 못한다."

  # 허락

  - id: req-1219
    status: accepted
    subject: coding-agent-cli-interface
    statement: "읽기 명령과 변경 명령은 이름만으로 구별되어, 이름 pattern으로 읽기 명령만 허락할 수 있다."
    acceptance:
      - "읽기 명령만 고르는 이름 pattern에 변경 명령이 하나도 걸리지 않는다."
      - "도움말의 읽기·변경 구분과 이름의 구분이 같다."

  # hook

  - id: req-1517
    status: accepted
    subject: coding-agent-cli
    statement: "CLI는 harness hook이 부르는 명령으로 hook 내용을 session의 coding token으로 core에 넘기고, core는 그것을 agent event로 바꾼다."
    acceptance:
      - "hook 명령을 부르면 그 session의 agent event가 난다."
      - "회수된 token으로 hook 명령을 부르면 거절된다."
      - "adapter가 모르는 hook 내용은 event를 내지 않고, 그 상태는 unknown으로 둔다."
    related:
      - coding-agent
      - events
