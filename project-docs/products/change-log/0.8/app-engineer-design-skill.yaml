id: app-engineer-design-skill
version: 0.8.0
title: 'App Engineer의 설계를 내장 skill `design-app`으로 옮기고 kit guide에 props를 싣는다'
modules: [packages/core/apps, packages/core/agent-workspaces, packages/protocol]
checked: [architecture-layers, architecture-approval, architecture-testing, architecture-activation, architecture-app-call, architecture-workflow, architecture-artifact, tool-e2e, tool-check-deps, tests-support]
change: |
  전:
  - `DESIGN.md`의 일곱 절과 화면 지침이 App Engineer role prompt에 있었다. 화면 지침은 Screens 한 줄("같은 종류의 잘 알려진 앱의 관례에서 시작하라", "`@lophn/ui` 부품 이름을 적어라")뿐이었다.
  - `package.get @lophn/ui`의 guide는 분류마다 export 이름과 "언제 쓰나" 한 줄이었다. App Engineer는 설치 사본을 file tool로 읽지 못해(`path is outside the place`) props를 몰랐다.
  후:
  - 새 내장 skill `design-app`(App Engineer, 끌 수 없음, `/` 메뉴 없음)이 셋을 갖는다.
    - `DESIGN.md`의 일곱 절. 이름과 순서는 그대로라 eval의 `design-first`가 같은 순서를 본다.
    - 있는 것 찾기: `package.list`·`package.get`·`app.tools`. Screens를 쓰기 전에 `@lophn/ui` guide를 읽고, kit에 없을 때만 직접 만든다.
    - 화면 원칙: lophn이 이미 보이는 앱 이름과 상태를 되풀이하지 않는다, 머리줄은 하나이고 막대를 쌓지 않는다, 다른 제목을 다시 말하는 제목과 화면 설명 글을 두지 않는다, spacing·글자 크기·색은 token에서만, 패널·카드는 줄여 넣지 말고 덜 보인다.
  - role prompt의 설계 절은 사람에게 묻지 않을 것과 "짓거나 고치기 전에 `design-app`을 읽는다" 한 줄이다.
  - guide가 "언제 쓰나" 줄마다 props를 싣는다(`apps/packages/builtin.ts`). 같은 export 문이 내보내는 type의 정의를 component source에서 주석째 옮기고, `extends`가 가리키는 같은 file의 type(`NativeInput` 등)도 붙인다. 내보낸 type이 없는 component는 `export function`의 인자 type이다. 지금 kit에서 props가 없는 항목은 상수와 hook 다섯뿐이고 guide는 38KB다.
why: |
  eval 캘린더 앱이 앱 view 안에 머리줄을 겹쳐 쌓았다(AppShell 제목, 기간 이동 줄, Tabs 줄). 화면 원칙이 없고, kit의 props를 몰라 추측했다.
decisions:
  - text: '화면 지침은 slop을 없애는 원칙만 둔다. 어떤 component를 쓰라고 지시하지 않고, 무엇을 쓸지는 App Engineer가 guide에서 찾는다.'
    by: person
  - text: '설계 절차, kit 찾기, 화면 원칙은 role prompt가 아니라 skill에 둔다.'
    by: person
  - text: 'guide에 props는 싣고 쓰는 예는 싣지 않는다.'
    by: person
  - text: 'props는 생성 파일이 아니라 `packages.builtin`이 읽을 때 설치 사본의 source에서 뽑는다. 버린 길: design에 `guide.md`를 생성해 두기. 생성물과 그 check가 하나 더 는다.'
    by: agent
follow_up: |
  - 다음 eval에서 instruction `app_engineer`와 skill `design-app`이 registry의 새 n을 받는다.
  - 남은 것: `AppShell`의 `title`이 필수라 앱 view 안 머리줄을 하나 강제한다. 앱 template 첫 화면이 앱 이름을 AppShell 제목으로 둔다. template `AGENTS.md`는 App Engineer가 읽지 못하는 설치 사본의 `guide.md`와 분류 `mod.ts`를 가리킨다.
