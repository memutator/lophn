id: missing-tool-reason-unreachable
title: '목록에서 빠진 tool의 이유 구별(grant·release·거절)이 run-loop에서 닿지 않는다'
kind: defect
status: fixed
topic: agent-definition
modules: [packages/core/lophn-agent]
now: |
  `packages/core/lophn-agent/run-loop/tool-batch.ts`의 `one`은 목록에 없는 tool(`control.tools.info`가 없음)을 `not_found` "tool is not available"로 먼저 닫는다. 그래서 `packages/core/lophn-agent/tools/work.ts`의 `executeToolCall`이 받는 `missingReason`(prepare.ts가 `appApiMissingReason`으로 채움)과 app-api의 `missing.ts`의 `removed_from_release`·`removed_from_grant`·`denied`·`unknown_tool`, `packages/core/lophn-agent/tools/wire.ts`의 `MISSING_TOOL_MESSAGES`는 부를 길이 없다. `tests/e2e/operator_test.ts`의 `excluded` 행이 model이 받는 tool_result가 `not_found`임을 보였다.
impact: |
  session 도중 사람이 grant에서 앱 tool을 빼거나 release가 api를 없애도 agent는 "없는 tool"로만 듣고 이유를 모른다. 쓰이지 않는 이유 구별 코드와 문구가 남아 고칠 때 헷갈린다.
fix: |
  - (추천) 이유 구별을 지운다(`missing.ts`의 `appApiMissingReason`·`AppApiMissingState`, `missingReason` 인자, `MISSING_TOOL_MESSAGES`, `missingState`). 목록에 없는 tool은 `not_found` 하나다. `grantAllows`는 `app-tools.ts`가 쓰니 남긴다.
  - 또는 `tool-batch.ts`가 `not_found` 대신 `control.tools`에 이유를 물어 그 code로 닫는다. agent가 이유를 들어야 할 근거가 문서에 생기면 이쪽이다.
closed: |
  이유 구별을 지웠다(app-api의 `missing.ts`, `missingReason` 인자, `MISSING_TOOL_MESSAGES`, `missingState`, prepare의 `offered`). 목록에 없는 tool은 `not_found` "tool is not available" 하나다. `grantAllows`는 쓰는 `tools/app-tools.ts` 안으로 옮겼다.
guard: 없음
