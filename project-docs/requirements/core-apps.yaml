schema_version: 1
catalog: ../boundary-catalog.yaml
interfaces:
  - app-spi
requirements:

  # blueprint의 내용

  - id: req-0700
    status: accepted
    subject: app-spi
    statement: "blueprint는 이름, 한 줄 설명, 화면, app-api, permission과 그 이유, 정확한 version의 의존을 담고, 화면이 없는 앱은 빈 화면 목록을 가진다."
    acceptance:
      - "화면이 없는 blueprint를 받는다."
      - "항목이 빠졌거나 겹치거나 모르는 항목이 든 정의는 고칠 이유와 함께 거절된다."

  - id: req-0701
    status: accepted
    subject: app-spi
    statement: "화면과 app-api는 표시 이름과 따로 정해진 식별자로 가리킨다."
    acceptance:
      - "표시 이름이나 번역만 바꾼 정의에서도 같은 식별자가 같은 app-api를 가리킨다."

  - id: req-0702
    status: accepted
    subject: app-spi
    statement: "화면은 제공하는 크기(전체, 패널, 카드)를 하나 이상 선언한다."
    acceptance:
      - "크기를 하나도 선언하지 않은 화면은 거절된다."
      - "크기를 여럿 선언한 화면은 선언한 크기가 모두 읽힌다."

  # 폐기: core-app-releases req-0802와 같다.
  - id: req-0703
    status: rejected
    subject: app-spi
    statement: "다른 앱의 app-api를 쓰려는 앱은 대상 앱과 app-api를 정의에 선언한다."
    acceptance:
      - "없는 앱이나 app-api를 가리키는 선언은 거절된다."

  # app-api 입력 schema

  - id: req-0704
    status: accepted
    subject: app-spi
    statement: "app-api 입력은 JSON Schema의 일부(타입, enum, 선택 값, 기본값, 길이와 수 범위)로 선언하고, lophn은 호출 전에 입력을 검사하며, 지원하지 않는 keyword가 든 schema는 받지 않는다."
    acceptance:
      - "필수 값 누락, 타입 오류, 선언하지 않은 속성, 길이나 수 범위 위반은 거절된다."
      - "생략한 값은 기본값으로 채워진다."
      - "외부 참조나 지원하지 않는 keyword가 든 blueprint는 거절된다."

  # 폐기: req-0704에 합쳤다.
  - id: req-0705
    status: rejected
    subject: app-spi
    statement: "외부 schema 참조, union, 사용자 정의 format, 실행 코드, 모르는 keyword가 든 입력 schema는 받지 않는다."
    acceptance:
      - "원격 참조나 지원하지 않는 keyword가 있는 정의는 거절된다."
      - "정의를 검사하는 동안 network 호출과 앱 code 실행이 일어나지 않는다."

  # app-api의 효과와 사람 확인

  - id: req-0706
    status: accepted
    subject: app-spi
    statement: "app-api는 효과 하나를 선언한다. read는 바꾸지 않고, write는 앱 DB만 바꾸며 core가 되돌릴 수 있고, external은 앱 DB 밖을 바꿔 되돌림을 보장하지 않는다. 섞이면 가장 큰 것을 선언한다."
    acceptance:
      - "효과가 없거나 셋 밖의 값을 선언한 app-api는 거절된다."
      - "외부에서 가져와 앱 data에 저장하는 app-api는 write로, 외부 캘린더에 일정을 만드는 app-api는 external로 선언할 수 있다."

  # 폐기: req-0706에 합쳤다. 어느 효과인지 고르는 것은 App Engineer의 판단이다.
  - id: req-0707
    status: rejected
    subject: app-spi
    statement: "효과가 섞인 app-api는 external, write, read 순으로 가장 큰 효과를 선언하며, 앱 밖의 상태를 바꾸는 동작(메일·메시지 보내기, 결제, 외부 서비스의 생성·수정·삭제)은 external, 바깥에서 가져오기만 하는 요청은 read, 가져온 것을 업무 data에 저장하면 write다."
    acceptance:
      - "외부 일정 조회는 read로, 가져와 저장하는 동기화는 write로, 외부 캘린더에 일정을 만드는 app-api는 external로 선언된다."
      - "read app-api를 호출하기 전과 후에 업무 data와 외부 대상이 같다."

  # 폐기: "사람 확인이 필요한 app-api" 선언을 없앴다. external은 grant의 물음이 맡는다(approvals req-1493).
  - id: req-0708
    status: rejected
    subject: app-spi
    statement: "app-api의 확인 필요 여부는 선언한 값만으로 정해지고 secret을 쓰는지로 바뀌지 않는다."
    acceptance:
      - "secret을 쓰는 read나 write app-api를 확인 불필요로 선언해도 받아들여지고, 호출마다 추가로 묻지 않는다."

  # 읽기 app-api의 결과

  # 폐기: 결과의 뜻은 그 app-api의 응답 계약이 정한다. lophn이 결과 모양을 강제하지 않는다.
  - id: req-0709
    status: rejected
    subject: app-spi
    statement: "읽기 app-api의 결과는 정상적인 0행과 원천 미수집, 일부 범위, 신선도 부족을 구별해 돌려준다."
    acceptance:
      - "미수집 응답과 실제 0행 응답이 다르다."
      - "일부 범위만 읽은 응답과 신선도가 부족한 응답도 정상 응답과 구별된다."

  # 폐기: 앱 구현 세부다.
  - id: req-0710
    status: rejected
    subject: app-spi
    statement: "페이지를 이어 읽을 때 처음 조건, 정렬, 데이터 기준이 바뀌었으면 거절한다."
    acceptance:
      - "기간이나 정렬을 바꾼 뒤 처음 조회에서 받은 이어 읽기 값을 쓰면 거절된다."

  # 폐기: 설명의 질은 App Engineer가 판단한다. 기계로 판정할 규칙이 없다.
  - id: req-0711
    status: rejected
    subject: app-spi
    statement: "화면과 app-api의 설명은 결과, 시작 위치, 선택, 예시, 다루는 정보의 종류, 제약을 사람이 읽고 알 수 있게 담는다."
    acceptance:
      - "설명만 읽은 사람이 화면과 app-api의 쓰임을 말할 수 있다."
      - "설명만 읽은 사람이 자료가 없을 때 결과가 무슨 뜻인지 설명할 수 있다."

  # 폐기: core가 write invocation의 DB 변경(changeset)으로 되돌린다. 앱은 되돌림 app-api를 두지 않는다(core-app-runtime req-1496).
  - id: req-0714
    status: rejected
    subject: app-spi
    statement: "write app-api는 되돌림 지원 여부를 선언하고, 지원하면 같은 앱의 되돌림 app-api와 변경에 묶인 되돌림 자료를 돌려주는 계약을 선언한다."
    acceptance:
      - "지원 여부 선언이 없거나 되돌림 app-api가 없는 선언은 거절된다."
      - "변경 뒤 되돌림을 실행하면 원래 업무 상태로 돌아간다."

  # 앱 등록

  # 폐기: req-0700(화면이 없으면 빈 목록)이 맡는다.
  - id: req-0716
    status: rejected
    subject: apps
    statement: "화면이 없고 사람이 보지 않아도 도는 앱도 등록할 수 있다."
    acceptance:
      - "화면 없는 앱과 화면 있는 앱이 모두 등록되고 조회된다."

  - id: req-0717
    status: accepted
    subject: apps
    statement: "새 앱은 이름, slug, 한 줄 목적만으로 코드, release, source 없이 등록된다."
    acceptance:
      - "source도 release도 없는 앱을 등록하고 조회한다."
      - "이름, slug, 목적 중 하나가 없으면 거절된다."

  - id: req-0718
    status: accepted
    subject: apps
    statement: "앱은 project를 고르지 않고 등록되며 project와 따로 조회된다."
    acceptance:
      - "project가 하나도 없는 상태에서 앱을 등록하고 앱 목록에서 찾는다."

  - id: req-0719
    status: accepted
    subject: apps
    statement: "사람이나 lophn이 앱을 등록한다. 앱을 등록하면 그 앱의 App Engineer가 생긴다."
    acceptance:
      - "사람의 요청으로 앱이 만들어진다."
      - "lophn의 요청으로 앱이 만들어진다."
      - "앱이 만들어지면 그 앱의 App Engineer를 부를 수 있다."
    related:
      - agent-roles

  # 폐기: 앱은 App Engineer가 등록하고, coding agent의 자격은 늘 앱 하나 범위다(req-1063).
  - id: req-0720
    status: rejected
    subject: apps
    statement: "앱 개발에 연결된 coding agent는 연결 범위가 전체일 때만 앱을 등록할 수 있다."
    acceptance:
      - "전체 범위로 연결된 coding agent의 등록은 받아들여진다."
      - "앱 하나 범위로 연결된 coding agent의 등록은 거절된다."

  - id: req-0721
    status: accepted
    subject: apps
    statement: "사람이나 App Engineer는 임의 위치의 git 폴더를 앱의 source로 연결할 수 있다."
    acceptance:
      - "lophn 관리 위치 밖의 git 폴더를 연결하면 실제 경로가 앱의 연결 정보로 조회된다."
    related:
      - agent-roles

  # 폐기: release가 바뀌지 않는 bundle이라는 것(req-0806)에서 따라 나온다.
  - id: req-0722
    status: rejected
    subject: apps
    statement: "source를 연결하거나 바꿔도 운영 bundle, 채택한 release, 업무 data는 바뀌지 않는다."
    acceptance:
      - "source를 다시 연결하기 전후로 기존 release hash와 앱 data가 같다."

  - id: req-0723
    status: accepted
    subject: apps
    statement: "사람은 앱을 archive하고 다시 꺼낼 수 있고, archive한 앱은 돌지 않으며 release와 data는 그대로 남는다."
    acceptance:
      - "archive 뒤 새 호출은 거절된다."
      - "archive 뒤에도 이전 release와 앱 data를 찾을 수 있다."
      - "다시 꺼낸 앱은 전과 같이 쓰인다."

  # 폐기: req-0723에 합쳤다.
  - id: req-0724
    status: rejected
    subject: apps
    statement: "앱을 archive해도 release 이력은 남는다."
    acceptance:
      - "archive 뒤에도 이전 release를 찾을 수 있다."

  # agent tool

  - id: req-0725
    status: accepted
    subject: apps
    statement: "앱의 app-api는 blueprint에서 그대로 agent tool로 드러나고, tool은 이름, 설명, 입력 schema, 효과를 담는다."
    acceptance:
      - "blueprint만으로 만든 tool 목록에서 app-api의 이름, 설명, 필수 입력, 효과를 읽을 수 있다."
    related:
      - agent-tools

  - id: req-0726
    status: accepted
    subject: apps
    statement: "앱 template은 진입 code, blueprint, 정확한 SDK 의존 설정, test, fixture, React 화면을 담는다."
    acceptance:
      - "template으로 새 앱을 만들면 진입 code, blueprint, 정확한 SDK 의존 설정, test, fixture, React 화면이 모두 들어 있다."

  # 폐기: template은 설치가 주는 것 하나로 시작한다. 사람이 고르는 template은 지금 두지 않는다.
  - id: req-0727
    status: rejected
    subject: apps
    statement: "template은 사람이 지정한 것을 먼저 쓰고, 없으면 설치가 제공한 것을 쓴다."
    acceptance:
      - "template을 지정해 앱을 만들면 지정한 template으로 만들어진다."
      - "template을 지정하지 않고 앱을 만들면 설치가 제공한 template으로 만들어진다."

  # 앱 화면 annotation

  - id: req-1487
    status: accepted
    subject: apps
    statement: annotation 하나는 메모, 고른 요소나 영역의 screenshot, 요소를 그린 SDK component와 앱 source 위치, 앱 release, 화면 위치를 담는다.
    acceptance:
      - SDK component로 그린 요소를 고르면 그 component 이름과 그 요소를 그린 source 파일과 줄이 담긴다.
      - 영역을 고르면 그 영역의 screenshot과 화면 위치가 담긴다.
      - annotation에 그때의 앱 release가 담긴다.
    related:
      - shell
      - sdk

  # project 범위

  - id: req-1512
    status: accepted
    subject: apps
    statement: "blueprint는 app-api마다 project 범위인지 선언하고, project 범위 app-api의 handler는 그 호출이 도는 project를 받는다."
    acceptance:
      - "project 범위로 선언한 app-api의 handler는 호출마다 project ID를 받는다."
      - "project 범위가 아닌 app-api는 project 없이 돈다."
    related:
      - sdk
      - app-runtime
