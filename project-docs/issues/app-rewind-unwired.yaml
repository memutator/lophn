id: app-rewind-unwired
title: 앱 rewind가 안 된다
kind: bug
status: fixed
topic: app-call
modules: [packages/core/apps, packages/core/lophn-agent, packages/core/main]
now: |
  session rewind는 파일과 대화만 되돌린다. 앱 데이터 되돌리기 요청은 wiring(`ctx.peek.appRewind`)이 비어 늘 `unavailable`로 rejected가 남는다.
impact: |
  앱 데이터는 rewind로 되돌릴 수 없다.
fix: |
  앱 rewind 계약을 짓고 wiring을 채운다.
closed: |
  `core/main/daemon/wiring/apps.ts`가 `createAppRewind`로 만든 값을 `ctx.provide("appRewind", rewind)`로 내놓고, `wiring/lophn-agent-session.ts`의 `requestRewind`가 `ctx.peek.appRewind.apply(app, from, "user")`를 부른다. 앱 module 쪽 계약(`apps/rewind`, `appRewind` route)도 등록돼 있다. 연결 자체를 보는 test는 없다(`apps/rewind/rewind_test.ts`는 앱 rewind, `lophn-agent/session/rewind/rewind_test.ts`는 가짜 `requestRewind`).
guard: 없음
