id: agent-credential-route-names
version: 0.2.0
title: "agent credential 상한을 tool 이름이 아니라 tool이 부르는 route 이름으로 만듦"
modules: [packages/core/lophn-agent, packages/core/main]
checked: [architecture-agent-definition, architecture-approval, roadmap]
change: |
  전: tool 정의의 `contract`가 tool 이름(`ticket.create`)이라 agent credential의 operation 상한에 tool 이름이 들었다. core는 route 이름(`CreateTicket`)으로 대조하므로 이름이 다른 command tool이 `forbidden`이었다: App Engineer의 `ticket.create|update|verify|cancel`·`app.link_source`, PM의 `context.draft|submit`·`operator.create|update`, 모든 role의 `call`·`reply`·`cancel`, `visual.show`. core를 띄워 App Engineer의 `CreateTicket`이 403인 것을 확인했다. tool 정의의 `revision`은 builtin이 모두 상수 `"1"`이라 정의가 바뀌어도 tool 알림과 기록이 구별하지 못했다.
  후: `ToolDefinition.operations`가 그 tool이 core에 부르는 route 이름이고(`defineTool`의 `routes`), credential 상한은 그 합집합에 보조 operation을 더한 것이다. "정의가 바뀌었나"는 이름, 설명, 입력 JSON schema, effect의 hash(`definitionHash`)로 본다. 앱 tool과 MCP tool도 같고, release가 바뀌어도 정의가 같으면 알림이 나가지 않는다. 옛 칸(`revision`, `contract`, `confirm`, `reversible`, `idempotent`)은 지웠고 tool 기록의 `confirm`은 `false`로 쓴다. agent가 보는 tool 이름, 입력, 순서, role별 목록은 같다(전후 snapshot 비교).
why: |
  harness와 domain을 나누는 계획의 첫 단계에서 registry가 조립 쪽이 넘긴 tool 목록을 받게 하면서 옛 칸을 지우다 찾았다.
decisions:
  - text: |-
      tool 정의가 부르는 route를 helper가 부르는 것까지 `routes`에 적는다. 빠지면 그 route가 command일 때 `forbidden`이다. 버린 길: 이름이 다른 tool만 route 이름을 더하는 작은 fix(정의와 상한이 따로 놀아 다음에 또 어긋난다).
    by: agent
  - text: |-
      rewind route와 App Engineer의 `annotations.get`은 tool의 `routes`가 아니라 role 상한에 그대로 둔다(상한이 바뀌지 않게).
    by: agent
