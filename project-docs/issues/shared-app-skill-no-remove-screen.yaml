id: shared-app-skill-no-remove-screen
title: coding agent에게 준 공유 skill을 끄는 화면이 없다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/shell/renderer, packages/core/approvals]
now: "`lophn app share --coding-agents`를 승인하면 앱 slug가 설정 `coding-agent.shared_apps`에 들어가고, `lophn harness sync-skills`가 그 앱의 public skill을 harness skill 폴더에 깐다. 그 목록에서 앱을 빼는 화면은 없다. 사람은 `~/.lophn/settings.json`을 직접 고쳐야 하고, 고치면 다음 sync가 사본을 지운다."
impact: coding agent가 더 이상 그 앱의 skill을 보지 않게 하려는 사람이 설정 파일 key 이름을 알아야 한다.
fix: Settings의 coding agent 쪽에 공유 앱 목록과 빼기를 둔다(작음). 추천.
closed: Settings › Coding agents에 "Apps shared with coding agents" 목록과 앱마다 Remove가 있다(`packages/shell/renderer/desktop/settings/connections/`). 지우기는 쓰기 직전에 값을 다시 읽어 slug 하나만 뺀다(같은 값에 승인이 덧붙는다). 바뀌면 shell main이 `SettingsChanged`로 skill sync를 돈다. General 화면은 이 key를 더 보이지 않는다. 목록은 앱 이름이 아니라 slug다.
guard: 없음
