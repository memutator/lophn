id: phone-drive-type-skips-press
title: phone 탭의 type·fill이 손가락과 달리 칸의 onPress를 부르지 않고 keyboard를 띄우지 않는다
kind: bug
status: fixed
topic: phone-screen
modules: [packages/mobile]
now: |
  `Drive.kt`의 `enterText`는 칸을 누르지 않고 `requestFocus()`로 focus한 뒤 InputConnection의 `commitText`로 치고 soft keyboard를 내린다. 누르면 guest의 TextInput이 JS에서 다시 focus해 keyboard를 띄우고, guest는 keyboard에 줄지 않아 사람의 화면을 덮는데 agent의 snapshot·screenshot에는 보이지 않아서다(주석). 그래서 TextInput의 `onPressIn`·`onPress`는 불리지 않고 keyboard가 뜬 모양은 확인되지 않는다. `onFocus`·`onChangeText`·`onSubmitEditing`은 불린다.
impact: |
  칸을 누를 때 상태를 바꾸는 화면(누르면 저장 단추가 나타나는 form 따위)은 agent가 친 뒤 사람이 손으로 칠 때와 다른 화면을 본다. keyboard가 입력란을 가리는 문제(`packages/mobile/README.md`의 알려진 한계)는 phone 탭으로 찾지 못한다.
fix: |
  - 작음(추천): `phone-check.md`의 한계에 "type·fill은 칸을 누르지 않는다. 누를 때의 동작은 click으로 먼저 본다"를 더한다.
  - 중간: type 전에 click을 먼저 하고 keyboard가 뜬 화면도 screenshot에 담는다(guest가 keyboard에 줄지 않는 문제를 같이 풀어야 한다).
closed: |
  `phone-check.md`가 `type`·`fill`은 칸을 누르지 않으니 먼저 `click`하라고 말한다.
guard: 없음
