id: gui-working-after-escape
title: harness GUI에서 Escape로 멈춘 뒤에도 작업 중 표시가 남는다
kind: bug
status: open
topic: harness-gui
modules: [packages/shell/main, packages/shell/renderer]
now: |
  사람이 Claude GUI에서 Escape로 멈췄는데 작업 중 표시가 꺼지지 않았다. 사람의 transcript(2026-11-13)에는 interrupt 표시 뒤 10초·3분 만에 `SessionStart:resume`이 찍혀, 사람이 탭을 다시 열거나 TUI를 오가며 풀었던 것으로 보인다.
  화면의 작업 중 표시는 turn phase(`turn_ended`로 끝난다)와 확인 전의 보낸 말(`sending`·`accepted`)로 정한다. adapter는 stop에서 `q.interrupt()`를 부르고 CLI의 `result`로 turn을 닫는다. 녹화 `steer_send_now`와 plain interrupt 녹화(`~/harness-recordings/interrupt_tool.jsonl`, 2026-11-13)에서 모두 interrupt 뒤 2ms 안에 `result`(`aborted_streaming`)가 왔다. 그래서 adapter가 turn을 닫는 길은 녹화에서는 정상이다. 그 녹화의 interrupt는 tool 도중이 아니라 글 쓰는 중에 들어갔다.
  남은 후보: (1) 멈춘 뒤에도 background task·subagent는 산다(`perTaskStopAffordance`). 그것이 끝나면 CLI가 알림으로 스스로 새 turn을 연다(녹화에서 `sleep 40`이 interrupt 뒤에도 돌았다). (2) turn 중에 줄에 세운 말이 있으면 interrupt 뒤 CLI가 그 말로 새 turn을 연다(TUI는 줄의 말을 입력칸에 돌려놓는다).
impact: |
  멈췄는지 알 수 없어 사람이 탭을 다시 열거나 TUI를 오간다.
fix: |
  `interrupt_tool` scenario를 녹화해 plain interrupt 뒤의 메시지를 보고, 사람에게 그때 줄에 세운 말·도는 subagent가 있었는지 확인한다. 원인에 따라 adapter가 turn을 닫거나, stop 때 줄의 말을 입력칸으로 돌려놓는다.
