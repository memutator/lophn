id: browser-vault
version: 0.23.5
title: Home memory를 전역 memory로 싣고, 사람이 넣은 site login을 agent가 handle로 browser 탭에 채우고, agent가 login 입력을 요청한다
modules: [packages/core/agent-workspaces, packages/core/lophn-agent, packages/core/secrets, packages/core/host-queue, packages/core/main, packages/protocol, packages/cli, packages/coding-agent, packages/shell/main, packages/shell/renderer, packages/shell/ipc, packages/sdk]
change: |
  - 전역 memory: Home memory(`<data>/home/memory.md`)를 모든 workspace의 lophn·사람이 만든 agent가 `global memory` 출처로 받는다(순서 global → workspace → agent, custom은 받지 않음, Home session은 한 번만). project·app prompt의 "Home lophn에 물어라(`to: {agent: "lophn"}`)" 줄들은 자기 workspace lophn으로 가던 bug라 "global memory를 보고 없으면 사람에게 묻는다"로 바꿨다. Agents 탭 memory 안내가 Home과 project·app으로 나뉜다. `@lophn/agent` 1.9.0(지침만 바뀐 minor, migrate-sdk 메모 `agent-1.9.0.md`).
  - site login 저장: `<data>/logins.json`(0600) metadata `{id: lgn_…, label, origin, username, note}`와 `secrets.json`의 `login.<id>.password|totp`. memory route `logins/list`(user·agent), `logins/save`·`logins/delete`(user), `logins/release`(shell capability를 입력에 실어야 함, origin 글자 일치, totp면 지금 code). `login.` 이름은 전송 부착으로 나가지 않는다. 앱 slug `login`을 예약했다. CLI `lophn login list [--origin]`. Settings › Browser › Logins와 보호 입력 창 purpose `login`.
  - 채우기: `browserActSchema`에 `fill_login {ref, login, field}`, CLI `lophn browser act <tab> fill-login`. core는 없는 id를 `not_found`로 막고 queue에 id만 싣는다(username은 metadata로 `fill`). shell main이 ref가 든 frame의 `securityOrigin`을 CDP로 재 `logins/release`를 부르고, 한 글자씩 치며 frame이 이동하면 `conflict`로 멈춘다. 결과는 `filled: true`.
  - browser 결과(snapshot, act, navigate, evaluate, logs, wait의 text와 read의 url·title)가 caller에 가기 전에 known-value redaction을 거친다. 전에는 거치지 않았다. snapshot은 `type=password` 칸의 value를 `••••`로 찍는다.
  - 요청: `lophn login request <tab> --ref eN --mode save|once [--label]`(`login_request/ask|read|cancel|hold|done`). `ask`와 같은 session 대기열에 서고 대화에 card로 뜬다. 사람이 card를 눌러야 창이 열린다. save는 새 login, once는 값을 그 session 동안 known value로만 붙들고 다시 잰 frame origin이 같으면 친다.
why: |
  agent가 처음 가는 site나 cookie가 만료된 site에 로그인하려면 비밀번호를 `type`에 평문으로 넣어야 했고, 그 값이 transcript와 ledger에 남았다. Hermes·Skyvern처럼 model에게 handle만 주고 origin을 확인한 쪽이 값을 친다. 계정 선택 같은 workspace를 건너는 사실은 memory에 두는데 memory가 workspace마다 나뉘어 있어 Home memory를 전역으로 올렸다.
decisions:
  - text: "Home memory가 전역 memory다. 새 파일을 두지 않고, 쓰는 것은 Home lophn과 사람뿐이다. 버린 길: project·앱 lophn이 Home에 알리는 길(한 workspace에서 속은 agent가 모든 prompt에 글을 넣는다)."
    by: agent
  - text: "login은 전역 하나이고 소유자가 없다. 버린 길: workspace·agent별 login(cookie partition이 이미 전역이라 막는 것이 없다)."
    by: agent
  - text: "origin은 ref 요소가 든 frame의 CDP securityOrigin이고 저장된 origin과 글자 그대로 같을 때만 값을 내준다. 버린 길: 최상위 URL 비교(다른 origin의 iframe 칸에 값이 들어간다), 와일드카드·상위 도메인."
    by: agent
  - text: "release의 자격은 입력에 실은 shell capability로 확인한다. route handler가 요청 header를 보지 못하고, process 조건으로는 renderer가 shell main의 일반 통로로 중계한 호출과 구별되지 않는다."
    by: agent
  - text: "`secrets.json`은 암호화하지 않는다. 같은 사용자의 process에는 파일 키도 막지 못한다."
    by: agent
  - text: "agent는 보호 입력 창을 직접 열지 못하고 card를 사람이 눌러야 한다. 창의 origin은 shell main이 잰 값이다."
    by: agent
  - text: "`evaluate`와 screenshot은 비밀을 넣은 탭에서도 막지 않는다. 탭 주인 제한, untrusted 감싸기, take control로 충분하다(AGENTS.md 속도)."
    by: agent
follow_up: |
  - 이슈 `home-memory-workspace-map-empty`: global memory의 workspace 지도를 채우는 길(추천: Home lophn이 각 workspace에 물어 채운다).
