id: tui-use
version: 0.23.184
platform_note: none
title: agent가 대화형 터미널 프로그램을 열고 보고 다루는 TUI use(`lophn terminal`, `tab open --terminal`)를 더한다
modules:
  - packages/protocol
  - packages/core/terminals
  - packages/core/host-queue
  - packages/core/approvals
  - packages/core/lophn-agent
  - packages/core/agent-workspaces
  - packages/core/main
  - packages/cli
  - packages/coding-agent
  - packages/design
  - packages/shell/main
  - packages/shell/renderer
change: |
  - protocol: `terminal/read|snapshot|act|wait|resize`(`actors: ["agent", "user"]`), `terminals/control`(`actors: ["user"]`), `TerminalRuntime.agent_control`, `tabs/open`의 `terminal` target과 `tool_call`, `tabs/hand`의 `terminal` 칸, `GateCall.shell.opaque`, `UNTRUSTED_SOURCES`의 `terminal.*`, `RESERVED_APP_SLUGS`의 `"terminal"`을 더했다.
  - PTY host와 입력 인코더(`packages/core/terminals`): `@xterm/headless` 화면에 `TerminalModes`(DECCKM·bracketed paste·alt screen·cursor·mouse·Kitty stack)·`highlights`·`visual_hash`·32 KiB 아래 행 보존 절단과 desktop xterm lease가 없을 때만 답하는 조건부 질의 회신(DA/DSR/OSC 10·11/Kitty)을 더했다. 순수 입력 인코더(`type`/`paste`/`press`/`mouse`)를 두고 기존 `commandInput`도 같은 `paste` 인코더를 쓰게 고쳤다.
  - core 탭 표·승인·실행(`packages/core/host-queue`, `packages/core/approvals`, `packages/core/main`): `tab open --terminal`(기본 120×36·접힌 `work` 탭, session당 4개·전체 16개 상한, `--command`는 기존 `shell` 판정, 명령 없는 대화형 shell은 `shell` `opaque: true` 판정), `tabs/hand`의 로컬 일반 터미널 탭 넘기기(`dedicated` 제외), `tab give` 터미널 지원, `SessionEnded` 시 agent가 연 터미널의 프로세스 그룹 정리와 넘긴 터미널 반환, 사람 키 입력 시 자동 take control, `terminal/*` 실행기(베이스라인 선캡처 + 이벤트 구동 `wait`, known-value redaction)를 더했다.
  - CLI·UI·지침(`packages/cli`, `packages/shell`, `packages/design`, `packages/core/agent-workspaces`, `packages/coding-agent`): `lophn terminal read|snapshot|act|wait|resize`와 `lophn tab open --terminal`을 더하고, shell renderer에 터미널 탭 넘기기("Hand to" / `[Take back]`), 상단 take control 줄, 관전 중 PTY 비-리사이즈 중재를 더했다. workspace prompt와 `lophn-agent` skill에 사용 지침을 적었다.
why: |
  비대화형 명령은 `shell.run`으로 실행할 수 있지만 `vim`·`psql`·`gdb`·REPL·TUI처럼 화면을 그리고 키를 기다리는 프로그램은 다룰 수 없었다. 기존 core PTY host, 탭 주인·넘기기·take control·redaction·shell 승인 모델을 확장해 agent가 대화형 터미널을 안전하게 다루게 한다.
decisions:
  - text: "명령 그룹 이름을 `lophn terminal`로 두고 `tab open --terminal [--command \"<명령줄>\"]` 단일 명령줄을 받아 기존 `shell` 승인 판정에 태운다(명령 없는 대화형 shell은 `opaque: true`). 버린 길: `lophn tui` 별도 이름, `--program/--args` 직접 실행, 터미널 전용 승인 범주 신설."
    by: person
  - text: "take control 상태를 core(`HostQueue` + `TerminalRuntime.agent_control`)에 두고 사람의 키 입력(`onHumanInput`)과 `[Take control]`/`[Hand back]`(`terminals/control`)이 같은 상태를 갱신하게 한다. 버린 길: shell main에만 상태 두기(창 없는 터미널과 다중 창 동기화에 불리)."
    by: agent
  - text: "desktop xterm의 `terminals/watch` lease 수로 PTY host의 `client_attached`를 전환해, 창이 붙지 않은 동안만 headless 화면이 DA/DSR/OSC 10·11/Kitty 질의에 답하게 한다. 버린 길: 무조건 답하기(desktop xterm과 중복 응답) 또는 답하지 않기(`vim`·`less` 시작 멈춤)."
    by: agent
  - text: "비밀번호·2FA prompt는 `tab show` + `ask`로 사람이 직접 입력하게 하고 터미널용 보호 입력 창·`fill-login`을 두지 않는다(터미널에는 browser의 origin 경계가 없다)."
    by: person
