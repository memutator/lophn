id: view-call-undefined-input
version: 0.23.69
title: 화면이 값이 undefined인 칸을 넣어 부른 operation이 desktop에서 거절되던 것을 고친다
modules: [packages/shell/main]
change: |
  - desktop의 앱 화면이 `callOperation`에 값이 undefined인 칸이 든 입력을 주면 `invalid_input: call is invalid`로 실패했다(요청이 core에 가지 않았다). 이제 shell main이 입력을 JSON 값으로 만들어 보낸다: 입력이 없으면 null, 값이 undefined인 칸은 빠진다. 폰 bridge와 같은 규칙이다.
  - 계약(route, schema)은 그대로다.
why: |
  화면 view를 core view 표로 옮기면서 shell main의 JSON 왕복이 빠졌고, core 통로의 client 쪽 입력 검사(canonical JSON)가 undefined 값을 거절했다. Mahas의 세션 탭처럼 고르지 않은 거르기 값을 undefined로 넘기는 화면이 모두 "Couldn't load"가 됐다.
decisions:
  - text: >-
      shell main에서 정규화한다. 버린 길: preload에서 하기(page와 같은 process라 main이 다시 봐야 한다), canonical JSON 검사를 undefined에 너그럽게 하기(hash의 근거가 되는 검사라 느슨하게 하지 않는다).
    by: agent
  - text: >-
      handler에 닿기 전에 거절된 화면 호출이 기록에 남지 않는 것은 이번에 고치지 않고 이슈 view-call-rejection-unrecorded로 남겼다.
    by: agent
checklist:
  - Mahas 앱의 세션 탭을 열어 목록이 뜨는지 본다
