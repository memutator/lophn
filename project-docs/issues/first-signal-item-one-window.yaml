id: first-signal-item-one-window
title: 첫 신호 대기 항목은 터미널이 열릴 때 runtime을 받은 창에만 뜬다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/shell/renderer, packages/protocol, packages/core/main]
now: "`coding_start` 항목(`packages/shell/renderer/desktop/connection/events/waiting-store.ts` `watchStart`)은 `TerminalApi.onRuntime`으로 터미널이 열리는 것을 본 창의 store만 센다. 터미널이 열린 뒤에 만든 창은 그 runtime event를 받지 못해 항목이 없다. event stream이 끊긴 사이 첫 신호를 들은 session의 runtime event가 다시 붙은 뒤 오면 `done`에 없어 5초 뒤 항목이 다시 뜨고, 다음 snapshot까지 남는다."
impact: 사람이 뒤에 연 창에서 일하면 trust 화면에서 멈춘 맡기기를 알지 못한다(먼저 연 창에는 뜬다). 다시 붙은 뒤에는 이미 시작한 session에 "Check the terminal"이 잠깐 잘못 뜰 수 있다.
fix: snapshot에서 `state === "unknown"`인 열린 coding session도 세고, runtime으로 센 session도 snapshot의 state로 거른다(작음). 추천.
closed: session snapshot이 coding session의 `harness`를 싣는다(`packages/protocol/events/snapshot.ts`, `packages/core/main/daemon/wiring/session-snapshots.ts`). `waiting-store.ts` `replace`가 snapshot에서 `unknown`이고 첫 신호가 `SessionStarted`인 harness의 coding session에 runtime 길과 같은 `waitStart` delay를 걸고, 첫 신호를 들은 coding session은 `done`에 넣어 다시 붙은 뒤 온 runtime event가 항목을 다시 띄우지 않는다.
guard: 없음
