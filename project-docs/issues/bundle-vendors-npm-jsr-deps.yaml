id: bundle-vendors-npm-jsr-deps
title: npm·jsr 의존을 준비 때 받아 bundle에 통째로 담는다
kind: defect
status: kept
topic: activation
modules: [packages/core/apps]
now: |
  release 준비(`releases/prepare/from-source.ts` `fetchExternal`)가 잠근 `npm:`/`jsr:` 값을 `deno cache`로 받아 `vendor/`, `node_modules/`를 만들고, `bundle/vendor.ts` `readVendorFiles`가 symlink를 풀어 전부 읽어 bundle에 담는다(`prepare/flow.ts` `vendorCopies`). `bundle/read.ts`는 `vendor/`, `node_modules/`를 생성 폴더(예약)로 거절한다. 운영 앱이 network 없이 뜨게 하려는 것이다.
impact: |
  bundle 크기와 hash 계산이 의존 크기만큼 커지고, 준비가 network와 `deno cache`에 걸린다. 이 경로 전체(vendor.ts, fetchExternal, 예약 거절, `dependencies` 검사)가 유지 비용이다.
fix: |
  - MVP는 npm·jsr 의존을 막고 sdk와 `@me`만 허용한다. 위 경로를 지운다(중간, 앱이 라이브러리를 못 씀).
  - 그대로 둔다(0).
  추천: 막는다.
closed: |
  남긴다. 앱은 자기 의존성(예: 공휴일 data를 주는 라이브러리)을 쓸 수 있어야 한다. 그런 것을 coding agent가 다 짜거나 SDK가 다 줄 수 없다.
guard: 없음
