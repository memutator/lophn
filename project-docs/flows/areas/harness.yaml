area: harness
flows:
  # ---- harness host: core 메모리의 harness queue와 session ----
  - id: harness-take
    title: harness 입력 하나를 꺼내지 않고 본다
    actor: shell
    entries: [route:harness/take]
    boundary: [harness-host-interface, harness-host-core]
    code:
      - packages/protocol/lophn-agent/harness-host.ts
      - packages/core/main/daemon/wiring/harness.ts
    steps:
      - "shell main의 extension harness host가 1초마다 사람 token으로 부른다. 설정 extensions.harness.enabled가 꺼져 있으면 unavailable"
      - "대기 중인 session을 앞에서부터 보고, 도는 turn이나 TUI hold가 있는 session은 건너뛴다"
      - "session이 없거나 harness가 아니면 그 session의 queue를 비우고 다음으로 간다"
      - "입력 본문을 session 기록에서 읽어 prompt를 만든다. 본문이 없어졌으면 queue에서 뺀다"
      - "첫 입력의 정보와 prompt를 돌려준다. 시작할 입력이 없으면 input이 null이다"
    outcomes:
      - id: input
        observe: [response]
      - id: none
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "설정 extensions.harness.enabled가 꺼져 있다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token(shell main)이 아닌 자격이 부른다"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-turn-start
    title: harness 입력 하나로 turn을 연다
    actor: shell
    entries: [route:harness/start_turn]
    pre: [harness-take:input]
    boundary: [harness-host-interface, harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/main/daemon/wiring/harness-credential.ts
      - packages/protocol/lophn-agent/turns.ts
    steps:
      - "shell host가 take로 받은 input_message를 넘긴다. 설정이 꺼져 있으면 unavailable"
      - "session이 없으면 not_found, harness session이 아니면 forbidden으로 끝낸다"
      - "queue 머리가 그 입력이고 session이 입력을 받으며 돌거나 hold되지 않았는지 본다. 아니면 conflict"
      - "턴 한도 설정을 읽고 잘못되었으면 invalid_input. 그다음 turn 자격(credential)을 발급한다"
      - "StartTurn을 machine 자격으로 쓰고(ledger turns), queue에서 그 입력을 꺼내 running으로 표시한다"
      - "StartTurn이 입력 메시지 없음으로 실패하면 queue에서도 빼고 not_found를 돌려준다. 실패한 자격은 바로 끝낸다"
      - "turn id와 credential을 돌려준다. credential은 harness process의 env로만 넘어간다"
    outcomes:
      - id: started
        observe: [ledger:turns, event:TurnStarted, response]
      - id: conflict
        code: conflict
        when: "입력이 queue 머리가 아니거나, session이 입력을 받지 않거나, turn이 돌거나, TUI hold 중이다. 또는 StartTurn이 같은 입력으로 이미 turn을 열었거나 session에 도는 turn이 기록에 있다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없거나 입력 메시지가 없어졌다(StartTurn이 입력 메시지를 못 찾은 것 포함)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token(shell main)이 아닌 자격이 부르거나, session의 runtime이 harness가 아니다. 또는 StartTurn의 machine 검사가 거절했다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "턴 한도 설정이 양의 정수가 아니다. 또는 StartTurn이 읽은 한도가 기록 시점의 설정과 다르다(그사이 설정이 바뀌었다). 또는 turn 자격 범위가 맞지 않다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "설정 extensions.harness.enabled가 꺼져 있다. session 기록을 읽지 못했다. ledger에 쓰지 못했다. StartTurn이 턴 한도를 정하지 못했다. turn 자격 발급이나 기록이 실패했다"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "방금 발급한 turn 자격을 registry가 다시 찾지 못했다"
        observe: [response]
    crosses_process: false
    risk: [permission, secret]
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-turn-record
    title: harness가 낸 글과 tool 기록을 대화에 넣는다
    actor: shell
    entries: [route:harness/record]
    pre: [harness-turn-start:started]
    boundary: [harness-host-interface, harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/protocol/lophn-agent/harness-host.ts
    steps:
      - "shell host의 실행 loop가 CLI 출력 한 줄마다 text나 harness_tool part로 부른다"
      - "session이 있고 harness인지 본다(아니면 not_found 또는 forbidden)"
      - "RecordMessage를 machine 자격으로 쓰고(ledger messages), model_call이 없는 MessageRecorded를 낸다"
      - "turn이 이미 끝났으면 conflict다. 호출한 host는 conflict를 받으면 CLI process를 멈춘다"
    outcomes:
      - id: recorded
        observe: [ledger:messages, event:MessageRecorded, response]
      - id: conflict
        code: conflict
        when: "turn이 이미 끝났다. 같은 message id가 다른 내용에 쓰였다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없거나, turn이 없거나 그 session의 turn이 아니다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token(shell main)이 아닌 자격이 부르거나, session의 runtime이 harness가 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "session 기록을 읽지 못했다. ledger나 본문 저장에 쓰지 못했다"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-turn-finish
    title: harness turn을 끝낸다
    actor: shell
    entries: [route:harness/finish_turn]
    pre: [harness-turn-start:started]
    boundary: [harness-host-interface, harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/main/daemon/wiring/custom-reply.ts
      - packages/protocol/lophn-agent/turns.ts
    steps:
      - "turn을 읽는다. 없으면 not_found, 그 session이 harness가 아니면 forbidden"
      - "outcome이 interrupted면 schema가 invalid_input으로 막는다(이 flow의 갈래가 아니다). 멈춤과 재시작은 core가 닫는다"
      - "FinishTurn을 machine 자격으로 turn의 state_seq에 맞춰 쓴다. 이미 끝났거나 재시작으로 닫혔으면 conflict"
      - "TurnEnded를 turn마다 한 번 낸다. queue는 running을 내리고 turn 자격을 끝낸다"
      - "입력이 answer를 기다리는 result call이면 마지막 기록 메시지가 그 답이 된다(custom-reply가 TurnEnded를 듣고 보낸다)"
    outcomes:
      - id: finished
        observe: [ledger:turns, event:TurnEnded, response]
      - id: conflict
        code: conflict
        when: "turn이 이미 끝났거나 재시작으로 interrupted가 되었다. 읽은 뒤 turn 상태가 바뀌었다(state_seq가 맞지 않다)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "turn이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token(shell main)이 아닌 자격이 부르거나, turn의 session이 harness가 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "session 기록을 읽지 못했다. ledger에 쓰지 못했다"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-session-bind
    title: harness가 알려 준 CLI session id를 lophn session에 둔다
    actor: shell
    entries: [route:harness/set_external_id]
    pre: [harness-turn-start:started]
    uses: [harness-bind-session:bound, harness-bind-session:unchanged]
    boundary: [harness-host-interface, harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/lophn-agent/session/harness.ts
    steps:
      - "CLI가 session id를 알리면 shell host의 실행 loop가 부른다"
      - "session이 없으면 not_found, harness session이 아니면 forbidden"
      - "BindHarnessSession(machine 자격)에 맡긴다. 같은 id면 아무것도 쓰지 않는다"
      - "다음 turn의 take가 이 id를 external_session_id로 돌려주어 CLI가 이어 간다"
    outcomes:
      - id: bound
        observe: [ledger:sessions, response]
      - id: unchanged
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token(shell main)이 아닌 자격이 부르거나, session의 runtime이 harness가 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "session 기록을 읽지 못했다. ledger에 쓰지 못했다"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-bind-session
    title: 같은 core 안에서 harness session id를 ledger에 쓴다
    actor: system
    entries: [route:harness/bind_session]
    boundary: [harness-host-core]
    code:
      - packages/core/lophn-agent/session/harness.ts
      - packages/core/main/daemon/wiring/harness.ts
    steps:
      - "사람과 agent는 부를 수 없다(machine 전용). harness-session-bind의 handler가 core 안에서 부른다"
      - "session이 harness인지 harnessOf로 본다"
      - "같은 harness_session이면 아무것도 쓰지 않는다"
      - "다르면 sessions의 harness_session을 바꾸고 state_seq를 올린다"
    outcomes:
      - id: bound
        observe: [ledger:sessions, response]
      - id: unchanged
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니거나(requireMachine), session의 runtime이 harness가 아니다"
        observe: [response]
    crosses_process: false
    declared_only: [conflict]
    unclear:
      - "route가 conflict를 선언하지만 handler는 내지 않는다. session이 없으면 not_found, harness가 아니면 forbidden, 같은 값이면 unchanged다. 선언을 고칠 곳이다."
    refs: [P6]
    docs: [architecture/coding-agent.md]

  # ---- host queue: core 메모리의 host 요청과 agent가 연 탭 ----
  - id: host-link
    title: shell main이 /host-link로 붙어 host 요청을 받고 답·보고·coding·터미널 frame을 올린다
    actor: shell
    entries: [system:host-link]
    boundary: [host-queue-interface, host-queue-core, server]
    code:
      - packages/core/server/server.ts
      - packages/core/server/host-link.ts
      - packages/core/host-queue/queue.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/host-link/frames.ts
    steps:
      - "shell main이 GET /host-link(subprotocol lophn.host-link.1)로 upgrade를 건다. Gateway와 같은 gate다: 헤더가 한도를 넘거나 host가 허용되지 않으면 invalid_input, 자격이 없으면 unauthorized, Origin이 있으면 forbidden이다. 사람 자격(actor user)이 아니면 forbidden, GET이 아니거나 subprotocol이 없으면 invalid_input으로 거절한다. event 연결 한도(사람 token의 Gateway·CLI watch 몫)는 쓰지 않는다. 연결은 한 번에 하나라 새 연결이 오면 옛 연결을 닫는다(아래 닫힘과 같다)"
      - "첫 frame은 hello {version 1, workspaces, tui}다. 받으면 queue가 그 연결에 붙고(attached. 연결이 열려 있는 동안만이다) 보이는 workspace에 닿는 대기 요청을 request frame으로 바로 밀며, 새 요청도 들어오는 대로 민다. 붙으면 shell을 띄우려던 시도의 기록(시작한 때, 실패한 때)을 지운다. tool_call·browser_call·terminal_interrupt·coding_*·terminal_stream·terminal_input은 workspace 없이 간다. browser 탭의 tab_open과 tab_close도 그렇다(page가 창 단위로 살아 그 workspace를 보이는 창이 없어도 열고 닫는다). coding_*·terminal_stream·terminal_input은 연결이 없으면 넣지 않고 바로 unavailable이다"
      - "연결이 열린 동안 1초마다 기한이 지난 호출을 거두고, 다시 대기한 요청(retry, 빌린 지 10초가 지난 탭 요청)을 다시 밀고, 마지막 tui 목록으로 TUI hold를 갱신한다. 결과를 기다리는 요청(tool_call, browser_call, terminal_interrupt, browser tab_open, 연결 요청)은 두 번 실행하면 안 되어 다시 밀지 않는다"
      - "visible은 보이는 workspace와 tui 목록을 바꾼다. response는 요청을 끝내거나(done) 맨 뒤로 보내 다시 대기시킨다(retry). done이면 결과를 기다리던 쪽(extension tool 호출, browser/* route, 앱의 session stop, coding route)에 output을 넘기고(content는 성공, error는 실패), output이 없으면 그쪽은 unavailable로 끝난다. 없는 id면 아무것도 하지 않는다. 연결이 닫히면 그 연결로 빌려 간 결과 요청(tool_call, browser_call, browser tab_open, terminal_interrupt)과 모든 연결 요청을 unavailable로 거두고, 빌려 간 탭 요청은 바로 다시 대기시키고, onClose 처리기를 부른다. TUI hold 갱신이 멈춰 10초 뒤 풀린다. server가 내려갈 때 1001로 닫는다"
      - "report는 host 탭의 browser 상태(url, title, loading)를 적거나, closed면 탭을 표에서 뺀다(이후 browser/*는 not_found). closed는 사람이 탭을 닫거나 browser 탭의 page가 상한(창마다 12개)이나 page를 든 창의 닫힘으로 없어졌을 때 온다. 모르는 탭이면 아무것도 하지 않는다"
      - "coding_report·coding_sync·coding_closed·terminal_screen은 onFrame으로 단 wiring에 넘긴다"
      - "frame이 JSON이 아니거나 schema에 맞지 않거나, 첫 frame이 hello가 아니거나 hello가 다시 오거나, binary frame이면 1008로 닫는다. 16 MiB를 넘는 frame은 ws가 1009로 닫는다. 보내는 버퍼가 1 MiB를 넘으면 1013으로 닫는다"
    outcomes:
      - id: open
        when: "hello를 받아 queue가 연결에 붙었다"
        observe: [request:shell]
      - id: done
        when: "response done을 받아 요청을 끝냈다. 결과를 기다리던 호출에는 output을 넘긴다(output이 없으면 unavailable)"
        observe: [response]
      - id: retry
        when: "response retry를 받았다(창이 열지 못했다). 요청을 맨 뒤로 보내 다음 tick에 다시 민다"
        observe: [response]
      - id: tab-state
        when: "report로 표에 있는 탭의 browser 상태를 적었다"
        observe: [response]
      - id: tab-closed
        when: "report closed로 탭을 표에서 뺐다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "헤더가 한도를 넘었다, host가 허용되지 않았다, GET이 아니다, 또는 subprotocol이 없다"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "인증 자격(bearer)이 없거나 맞지 않아 gate에서 거절했다"
        observe: [response, log:api]
      - id: forbidden
        code: forbidden
        when: "Origin이 있다, 또는 사람 자격(actor user)이 아니다"
        observe: [response]
      - id: bad-frame
        when: "frame이 틀렸거나 순서가 틀려(hello 앞의 다른 frame, 두 번째 hello) 1008로 닫았다"
        observe: [response]
      - id: closed
        when: "연결이 닫혔다(끊김, 새 연결, 느린 host, 내려감). 그 연결로 나간 결과 요청과 연결 요청은 unavailable로 끝나고 빌려 간 탭 요청은 다시 대기한다"
        observe: [response]
    crosses_process: false
    risk: [permission, secret]
    docs: [architecture/coding-agent.md, architecture/browser-tab.md]
    unclear:
      - "tool_call 요청 payload에 credential이 실려 shell로 간다. 이 credential을 실제로 누가 받는지는 extension-tools 쪽 flow가 정한다"

  - id: host-tab-open
    title: agent나 사람 token이 session 탭을 열어 달라고 요청한다
    actor: agent
    entries: [route:tabs/open]
    when: "target이 session일 때. browser(--url)는 host-browser-tab-open, tui는 harness-tui-open, preview는 host-preview-tab-open, artifact는 host-artifact-tab-open, coding은 host-coding-handoff-open이 맡는다"
    boundary: [host-queue-interface, host-queue-core]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/protocol/lophn-agent/host-queue.ts
    steps:
      - "lophn tool이나 lophn tab open 명령이 agent 자격이나 사람 token으로 부른다. 탭의 주인은 agent면 그 session, 사람 token이면 모두 같은 주인 person이다"
      - "사람 token은 session 대상을 열지 못한다. invalid_input"
      - "agent면 자격의 session 행을 읽는다. 없으면 not_found, session 자격이 없으면 forbidden"
      - "같은 workspace의 열린 session인지 본다. 아니면 not_found"
      - "탭 표에 주인을 적고 tab_open 요청을 host queue에 넣는다. workspace는 agent면 부른 session의 것(home이면 home), 사람 token이면 입력의 workspace(없으면 home)다. --as로 말한 relation(peer, stage, aside, work, glance)을 요청에 그대로 싣는다(말하지 않으면 null). 자리는 core가 정하지 않고 renderer가 relation과 target으로 정한다"
      - "기다리지 않고 tab id와 accepted를 돌려준다. 실제 탭은 shell main이 /host-link로 받아 연다. 그 workspace를 보이는 창이 없으면 요청은 기다린다"
    outcomes:
      - id: accepted
        observe: [response]
      - id: not_found
        code: not_found
        when: "호출 session이 없거나, 대상 session이 없거나 닫혔거나 다른 workspace다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "사람 token이 browser·preview·artifact가 아닌 대상(session, tui)을 열려 한다"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/workspace-layout.md]

  - id: host-browser-tab-open
    title: agent나 사람 token이 browser 탭(--url)을 열어 달라고 요청하고 page가 붙을 때까지 기다린다
    actor: agent
    uses: [route:tabs/open, host-shell-launch:launched, desktop-window-open-inactive:opened, host-link:open, host-link:done]
    when: "target이 browser일 때(`lophn tab open --url`)"
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/protocol/lophn-agent/host-queue.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/renderer/app-frame/workspace-views.tsx
    steps:
      - "agent면 자격의 session 행을 읽는다(없으면 not_found, session 자격이 없으면 forbidden). 사람 token의 주인은 person이다. url이 http나 https가 아니면 invalid_input"
      - "shell이 붙어 있지 않으면(/host-link 연결이 없으면) 앱을 띄운다(host-shell-launch). 띄울 길이 없으면 바로 unavailable이다. 띄우는 시도가 쉬는 중이거나 바로 실패해도 unavailable이다"
      - "탭 표에 주인과 workspace(agent면 그 session의 것, 사람 token이면 입력의 workspace나 home)를 적고 tab_open 요청을 넣는다. 요청은 workspace를 가리지 않고 아무 shell main이 가져간다"
      - "shell main은 그 workspace를 보이는 창(가장 최근에 focus를 받은 것), 없으면 가장 최근 일반 창에 보낸다. 일반 창이 하나도 없으면 focus 없이 하나 연다(desktop-window-open-inactive)"
      - "창이 그 workspace를 mount하고 있으면 평소처럼 자리를 정해 탭을 연다. mount하지 않았으면 그 workspace의 pool에 page만 숨은 항목으로 만들고 자리는 다음 mount로 미룬다(agent-browser-page-host). 어느 쪽이든 ack한다"
      - "page의 guest가 dom-ready로 붙어 창이 bind를 알리면 shell main이 done으로 답하고 core는 tab id와 accepted를 돌려준다. 기한은 shell이 붙어 있으면 10초, 앱을 띄웠으면 30초(앱 시작과 창 열기와 page까지)다. 같은 시도를 기다리던 열기는 함께 끝난다"
      - "실패하면 표에서 탭을 빼고(shell이 가져간 적이 있으면 닫기 요청을 보낸다) unavailable과 고정 문장을 돌려준다. 탭이 남지 않는다"
    outcomes:
      - id: opened
        when: "page가 붙었다. 이미 떠 있던 앱의 창이 받았다"
        observe: [response, "process:창의 pool에 page가 있다(mount되지 않은 workspace면 숨은 항목)"]
      - id: opened-new-window
        when: "일반 창이 하나도 없어 focus 없이 창을 열고 거기에 page가 붙었다"
        observe: [response, "process:desktop 창 하나가 focus 없이 생긴다"]
      - id: opened-app-started
        when: "shell이 붙어 있지 않아 core가 앱을 띄웠고 그 앱의 창에 page가 붙었다(기한 30초)"
        observe: [response, "process:앱 process가 detached로 뜬다"]
      - id: shell-not-attached
        code: unavailable
        when: "shell이 붙어 있지 않은데 앱을 띄울 길이 없다(그 core를 띄운 쪽이 켜지 않았거나, build하지 않은 개발 저장소). 앱을 열라고 사람에게 알리라는 고정 문장"
        observe: [response]
      - id: start-failed
        code: unavailable
        when: "앱을 띄우지 못했다: spawn 실패, 30초 안에 shell이 붙지 않음, 앞선 실패 뒤 5분 안이라 다시 띄우지 않음"
        observe: [response, "log:host-queue shell_launch_failed(spawn 실패일 때)"]
      - id: page-timeout
        code: unavailable
        when: "shell이 붙어 있는데 10초 안에 page가 붙지 않았다(첫 응답이 느린 site 포함, dom-ready까지 기다린다). 만들어졌을지 모르는 page를 닫으라는 요청이 나간다"
        observe: [response]
      - id: shell-lost
        code: unavailable
        when: "기다리는 동안 shell이 떨어졌다, 받을 창을 만들지 못했다, page를 둘 창이 답하기 전에 닫혔다, 요청이 대기 200개를 넘어 버려졌다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "호출 session 행이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "url이 http나 https가 아니다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md, architecture/platform.md]
    unclear:
      - "page가 붙은 뒤 사람이 그 창을 최소화하면 그리지 않아 screenshot이 실패한다. 열기 자체는 성공한다"
      - "열기가 끝난 뒤 ack 1.5초나 창 안 열기 실패는 retry로 되돌려 다시 시도하고 기한이 끝나면 위 unavailable 가운데 하나가 된다"

  - id: host-shell-launch
    title: browser 탭을 열려는데 shell이 없으면 core가 앱을 띄운다(--agent-window)
    actor: system
    entries: [system:host-shell-launch]
    boundary: [host-queue-core, core-control-protocol]
    code:
      - packages/core/main/daemon/shell-launcher.ts
      - packages/core/main/daemon/main.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/cli/connection/client/node.ts
      - packages/shell/main/desktop/core/supervise.ts
    steps:
      - "launcher는 그 core를 띄운 쪽(shell main의 core 감독, CLI의 detached 시작)이 환경 LOPHN_LAUNCH_SHELL=1을 준 core에만 있다. test, boot, E2E가 띄운 core에는 없다. 설치본이 아닌 개발 저장소에서 shell entry를 build하지 않았으면 없다"
      - "browser 탭 열기가 shell 없이 오면 queue가 launcher를 부른다. 이미 시도 중이고 30초가 안 지났으면 부르지 않고 그 시도를 같이 기다린다. 앞선 실패 뒤 5분 안이면 부르지 않고 실패로 답한다"
      - "launcher가 core의 platform 배치에서 명령을 만든다(설치본은 core를 띄운 Electron 실행 file, 개발은 build한 shell entry 추가). ELECTRON_RUN_AS_NODE를 빼고 `--home <data root> --agent-window`를 붙여 detached로 띄우고 놓는다"
      - "spawn이 던지거나 error event가 오면 로그를 한 줄 남기고 기다리던 열기를 바로 끝낸다. 띄운 뒤의 일은 알 길이 없어 shell이 /host-link로 붙는지로 본다. 30초 안에 붙지 않으면 시도가 실패다"
      - "shell이 /host-link로 붙으면 시도와 실패 기록을 지운다"
    outcomes:
      - id: launched
        when: "launcher가 앱을 띄웠다(처음 시도이거나 앞 시도가 끝났다)"
        observe: ["process:앱 process가 detached로 뜬다(--agent-window)"]
      - id: shared
        when: "30초 안에 이미 띄운 시도가 있다. 다시 띄우지 않고 그 시도에 같이 기다린다"
        observe: ["process:띄운 앱이 하나뿐이다"]
      - id: backoff
        when: "앞선 시도가 실패한 지 5분 안이다. 띄우지 않고 열기를 바로 실패시킨다. shell이 붙으면 풀린다"
        observe: [response]
      - id: spawn-failed
        when: "spawn이 던졌거나 error event가 왔다. 5분 쉬는 상태로 들어간다"
        observe: ["log:host-queue shell_launch_failed"]
      - id: not-enabled
        when: "launcher가 없다(켜지 않은 core, 띄울 길을 모름). browser 탭 열기는 shell-not-attached로 끝난다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/platform.md, architecture/workspace-layout.md]
    unclear:
      - "앱 Quit 뒤에도 띄운다. 사람이 앱을 껐다고 의도하지 않았는지를 판단하는 장치는 없다(승인한 job의 browser 사용으로 본다, 사람 2026-11-10)"

  - id: host-preview-tab-open
    title: agent나 사람 token이 앱의 지금 preview를 앱마다 하나인 preview 탭으로 열어 달라고 요청한다
    actor: agent
    uses: [route:tabs/open]
    when: "target이 preview일 때"
    boundary: [host-queue-interface, host-queue-core, app-runtime]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/core/config/shell-settings.ts
    steps:
      - "agent면 자기 session이 그 앱의 workspace인지 본다. 아니면 앱이 있는지도 알리지 않고 not_found다. 사람 token은 어느 앱이든 된다"
      - "앱이 있는지 본다. 없으면 not_found"
      - "device가 있으면 설정 shell.devices의 이름인지 본다. 없으면 not_found"
      - "그 앱의 preview가 지금 돌고 있는지 본다. 없으면 conflict(preview start를 먼저)"
      - "앱마다 preview 탭은 하나다. 이미 있으면 새로 만들지 않고 그 탭 id를 돌려주며 주인이 새로 연 쪽이 된다. device를 줬으면 같은 탭 id로 tab_open을 다시 넣는다"
      - "없으면 새 탭을 표에 올리고 앱 workspace로 tab_open을 넣은 뒤 accepted를 돌려준다"
    outcomes:
      - id: accepted
        when: "새 preview 탭을 접수했다"
        observe: [response]
      - id: reused
        when: "그 앱의 preview 탭이 이미 있다. 같은 tab id를 돌려주고 주인이 바뀐다(device를 줬으면 기기만 다시 알린다)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "agent의 session이 없거나 그 앱 workspace의 것이 아니다, 앱이 없다, device 이름이 shell.devices에 없다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 앱에서 돌고 있는 preview가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: read-failed
        when: "앱 조회나 지금 preview 조회가 실패했다(그 code를 그대로 돌려준다)"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]
    unclear:
      - "preview 탭 접수 뒤 preview가 멈추거나 바뀌면 shell이 어떻게 그 탭을 다루는지는 shell-workspace 쪽이 본다"

  - id: host-artifact-tab-open
    title: agent나 사람 token이 그 workspace의 artifact를 artifact마다 하나인 host 탭으로 열어 달라고 요청한다
    actor: agent
    uses: [route:tabs/open]
    when: "target이 artifact일 때"
    boundary: [host-queue-interface, host-queue-core]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/shell/renderer/workspace/use-surface-requests.ts
    steps:
      - "workspace는 agent면 자기 session의 것, 사람 token이면 입력의 workspace(없으면 home)다. 남의 workspace를 고를 길이 없다"
      - "home이면 artifact가 없어 invalid_input이다"
      - "그 workspace의 artifacts/<name>/이 폴더이고 입구 index.html이 일반 file인지 lstat으로 본다(symlink는 아니다). 아니면 not_found"
      - "artifact마다 host 탭은 하나다. 이미 있으면 그 탭 id를 돌려주고 주인이 새로 연 쪽이 된다"
      - "없으면 새 탭을 표에 올리고 그 workspace로 tab_open을 넣은 뒤 accepted를 돌려준다. 창은 사람이 연 같은 artifact 탭이 있으면 그 자리에 host 탭을 열고 그것을 닫는다"
    outcomes:
      - id: accepted
        when: "새 artifact 탭을 접수했다"
        observe: [response]
      - id: reused
        when: "그 artifact의 host 탭이 이미 있다. 같은 tab id를 돌려주고 주인이 바뀐다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "agent의 session이 없다, 그 workspace에 그 이름의 artifact(입구 index.html)가 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "workspace가 home이다(agent의 session이 home이거나 사람 token이 workspace를 주지 않았다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
