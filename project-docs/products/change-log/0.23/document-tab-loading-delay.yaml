id: document-tab-loading-delay
version: 0.23.48
title: 문서 탭을 바꿀 때 잠깐 보이던 skeleton을 없앤다
modules: [packages/shell/renderer]
change: |
  md·text·이미지·pdf 파일 탭이 글을 읽는 동안 skeleton을 즉시 그렸다. 이제 다른 읽기 화면과 같은 규칙(300ms)을 쓴다.
  - 읽기가 300ms 안에 끝나면 아무것도 그리지 않고 바로 본문을 그린다. 그보다 오래 걸리면 그때 skeleton 6줄을 보인다.
  - 화면 밖에서 열지 못한 경우와 안내 문구는 그대로다.
why: |
  탭을 오갈 때마다 본문이 unmount돼 파일을 다시 읽는데(창의 편집 session이 entry를 놓는다), 그 1 frame 동안 회색 6줄이 번쩍였다. 디스크 읽기는 거의 항상 300ms보다 짧아서, 느린 조회를 위한 표시가 정상 동작에서만 보이는 상태였다.
decisions:
  - text: >-
      탭마다 디스크를 다시 읽는 비용 자체는 이번에 고치지 않고 표시만 지연 규칙에 맞췄다. 탭 전환마다 다시 읽는 것을 없애려면 document_editor kind에 keep을 주거나 편집 session을 탭이 닫힐 때까지 들고 있어야 하는데, 저장 상태·충돌 감시가 붙어 있어 따로 다룬다.
    by: agent
