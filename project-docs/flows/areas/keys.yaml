area: keys

flows:
  # ---------- 창 안 키 판정 (main before-input-event와 renderer keydown) ----------
  - id: key-press
    title: "창 안에서 누른 키를 표와 맞춰 command를 부르거나 page로 넘긴다"
    actor: person
    entries: [ui:key-press]
    uses: [ipc:shell:shortcut]
    boundary: [shell]
    code:
      - packages/protocol/shell/keybindings.ts
      - packages/shell/main/desktop/shortcuts.ts
      - packages/shell/renderer/commands/keybinding-service.ts
      - packages/shell/renderer/commands/window.ts
    steps:
      - "main의 before-input-event가 표에서 main이 먼저 받는 줄(tab 이동·닫기·다시 열기, new.browser, palette·Home, desk.next·prev·nth, app.panel:* 등)을 맞추면 삼키고 창 renderer에 binding id를 shell:shortcut으로 보낸다. browser page(context browser)는 그 줄만 본다"
      - "그 밖의 키는 renderer의 document keydown capture가 받는다. 안쪽 context부터 사람 > 등록 > 표 순서로 맞춘다. context가 owns한 chord(터미널의 Linux·Windows Ctrl+글자 등)는 바깥 binding에 가지 않는다"
      - "맞은 binding의 command를 registry가 지금 부를 수 있을 때(canRun)만 실행하고 키를 삼킨다. 눌러 둔 반복은 부르지 않고 삼키기만 한다"
      - "두 타의 머리면 1.5초(SEQUENCE_WAIT_MS) 기다린다. 둘째 타가 맞으면 실행하고, 다른 키면 머리를 버리고 그 키를 새로 맞추며, 시간이 다 되면 첫 타의 홑 binding을 부른다"
      - "조합 중이거나 새 키를 받는 칸(data-key-capture) 안이거나 맞는 binding이 없으면 키를 넘겨 focus가 있는 page나 입력칸이 받는다"
    outcomes:
      - id: command-run
        observe: ["process:맞은 command의 handler가 돈다. 어느 flow인지는 key:<command>의 link가 정한다"]
      - id: passed-on
        when: "맞는 binding이 없거나, 맞아도 command를 지금 부를 수 없거나, context가 owns한 chord이거나, 조합 중이거나 새 키 칸이다"
        observe: ["process:키가 focus가 있는 page나 입력칸으로 간다"]
    crosses_process: true
    docs: [architecture/keybindings.md]

  # ---------- 사람이 단 키 저장 ----------
  - id: key-record
    title: "Settings › Keyboard에서 사람이 새 키를 고르고 저장한다"
    actor: person
    entries: [ui:key-record]
    uses: [settings-update:changed]
    boundary: [shell, config]
    code:
      - packages/shell/renderer/desktop/settings/keyboard/keyboard-panel.tsx
      - packages/shell/renderer/desktop/settings/keyboard/model.ts
      - packages/shell/renderer/desktop/settings/keyboard/core-source.ts
      - packages/shell/renderer/commands/window.ts
    steps:
      - "새 키를 받는 칸이 누른 chord를 checkChord로 본다. 두 타면 타마다 본다. modifier 없는 키(F1~F12 빼고)와 RESERVED(전역 팔레트 키, 글자 편집 Ctrl·Cmd 키, OS 키)는 거절하고 이유를 보인다"
      - "다른 줄이 쓰는 chord(taken)는 거절하지 않고 바꾸기를 준다. 사람이 고르면 그 chord를 가진 다른 줄에서 빼고 한 번에 저장한다"
      - "통과하면 WindowCommands.setOverrides로 이 창의 binding을 먼저 바꾼다"
      - "shell.keybindings 값을 settings-update로 쓴다. 쓰기가 거절되거나 실패하면 이전 값으로 되돌리고 저장되지 않았다고 보인다"
    outcomes:
      - id: saved
        observe: ["disk:<root>/settings.json", "event:StateChanged", "screen:settings-keyboard-changed"]
      - id: saved-taking-keys
        when: "다른 줄이 쓰던 chord를 바꾸기로 빼고 같은 저장으로 함께 쓴다"
        observe: ["disk:<root>/settings.json", "event:StateChanged", "screen:settings-keyboard-changed"]
      - id: rejected-needs-modifier
        when: "modifier 없는 키다. 입력칸의 글자를 삼키기 때문이다"
        observe: ["screen:settings-keyboard"]
      - id: rejected-reserved
        when: "RESERVED에 든 키다. lophn이나 OS가 먼저 쓴다"
        observe: ["screen:settings-keyboard"]
      - id: not-saved
        when: "settings-update가 rejected나 unavailable로 돌아왔다. 화면은 이전 값으로 되돌아간다"
        observe: ["response", "screen:settings-keyboard"]
    crosses_process: true
    docs: [architecture/keybindings.md]
    unclear:
      - "settings-update는 rejected를 ok 응답의 목록으로 준다. keyboard source(declared.ts chooseSetting)가 이것을 오류 code로 바꾸므로 not-saved 안의 실패 code는 나누지 않았다"

  - id: key-reset
    title: "Settings › Keyboard에서 줄 하나를 기본 키로 되돌린다"
    actor: person
    entries: [ui:key-reset]
    uses: [settings-update:changed]
    boundary: [shell, config]
    code:
      - packages/shell/renderer/desktop/settings/keyboard/keyboard-panel.tsx
      - packages/shell/renderer/desktop/settings/keyboard/model.ts
    steps:
      - "사람이 바꾼 줄에만 있는 [Reset to default]를 누른다. 번호 묶음 줄이면 묶음의 모든 줄을 되돌린다"
      - "그 줄의 사람이 단 키를 stored에서 빼고(key-record와 같은 저장 길) 이 창의 binding을 먼저 바꾼 뒤 shell.keybindings를 쓴다"
      - "쓰기가 거절되거나 실패하면 이전 값으로 되돌리고 저장되지 않았다고 보인다"
    outcomes:
      - id: reset
        observe: ["disk:<root>/settings.json", "event:StateChanged", "screen:settings-keyboard"]
      - id: not-saved
        when: "settings-update가 rejected나 unavailable로 돌아왔다. 화면은 이전 값으로 되돌아간다"
        observe: ["response", "screen:settings-keyboard"]
    crosses_process: true
    docs: [architecture/keybindings.md]

  - id: key-reset-all
    title: "Settings › Keyboard에서 이 OS의 모든 키를 기본으로 되돌린다"
    actor: person
    entries: [ui:key-reset-all]
    uses: [settings-update:changed]
    boundary: [shell, config]
    risk: [data-loss]
    code:
      - packages/shell/renderer/desktop/settings/keyboard/keyboard-panel.tsx
      - packages/shell/renderer/desktop/settings/keyboard/model.ts
    steps:
      - "바뀐 줄이 하나라도 있을 때만 보이는 [Reset all shortcuts]를 누른다. 확인을 묻지 않는다"
      - "stored에서 이 OS의 사람이 단 키를 모두 빼고(다른 OS의 키는 둔다) key-record와 같은 저장 길로 쓴다"
      - "쓰기가 거절되거나 실패하면 이전 값으로 되돌리고 저장되지 않았다고 보인다"
    outcomes:
      - id: reset-all
        observe: ["disk:<root>/settings.json", "event:StateChanged", "screen:settings-keyboard"]
      - id: not-saved
        when: "settings-update가 rejected나 unavailable로 돌아왔다. 화면은 이전 값으로 되돌아간다"
        observe: ["response", "screen:settings-keyboard"]
    crosses_process: true
    docs: [architecture/keybindings.md]

  # ---------- 사람이 단 키 되살리기 (창을 열 때와 설정이 바뀔 때) ----------
  - id: key-overrides-restore
    title: "저장된 사람의 키를 창을 열 때와 설정이 바뀔 때 다시 적용한다"
    actor: system
    entries: [system:key-overrides-restore]
    uses: [settings-read:ok]
    boundary: [shell, config]
    code:
      - packages/shell/renderer/desktop/main.tsx
      - packages/shell/renderer/desktop/settings/keyboard/core-source.ts
      - packages/protocol/shell/keybindings.ts
    steps:
      - "desktop 창이 core가 준비되면 shell.keybindings를 읽는다(settings-read). 설정이 바뀌었다는 event StateChanged(settings)가 오거나 Gateway가 다시 붙으면 다시 읽는다. Settings 화면, `lophn settings set`, agent 어느 쪽이 바꿔도 같다"
      - "parseKeyOverrides로 검사하고 이 OS 것만 골라 WindowCommands.setOverrides로 창의 binding을 덮는다"
      - "읽기가 실패하면 아무것도 덮지 않아 표의 기본 키로 남는다"
    outcomes:
      - id: restored
        observe: ["process:창의 키 표가 사람이 바꾼 키로 덮인다"]
      - id: read-failed
        when: "settings-read가 실패했다. 창은 표의 기본 키 그대로다"
        observe: ["process:창의 키 표는 기본 키 그대로다"]
    crosses_process: true
    docs: [architecture/keybindings.md]
    unclear:
      - "Settings › Keyboard 화면을 열 때의 load도 같은 setOverrides를 부른다(keyboard-panel.tsx). 그 경로는 화면 열기의 일이라 따로 두지 않았다"

  # ---------- main이 먼저 받는 키도 설정을 따른다 ----------
  - id: key-overrides-main
    title: "main이 core 설정의 사본을 따라 먼저 받는 키도 사람이 바꾼 키로 맞춘다"
    actor: system
    entries: [system:key-overrides-main]
    uses: [route:settings/list]
    boundary: [shell, config]
    code:
      - packages/protocol/shell/keybindings.ts
      - packages/shell/main/desktop/core/settings.ts
      - packages/shell/main/desktop/wiring/desktop.ts
    steps:
      - "shell main은 core 설정의 사본을 둔다. Gateway가 붙으면 settings/list로 전체를 읽고 StateChanged(settings)가 오면 다시 읽는다"
      - "사본이 바뀔 때마다 shell.keybindings에서 이 OS 것을 골라 parseKeyOverrides로 검사하고 resolveBindings와 compileBindings로 main의 표를 바꾼다. 틀린 줄만 버리고 나머지는 산다"
      - "사본을 아직 읽지 못했으면 표의 기본 키다"
    outcomes:
      - id: applied
        observe: ["process:main의 before-input-event 표가 사람이 바꾼 키를 따른다"]
      - id: not-read
        when: "settings/list를 읽지 못했다(core가 준비되지 않았다). 지금 표를 그대로 두고 다음 준비나 event 때 다시 읽는다"
        observe: ["process:main의 키 표는 그대로다"]
    crosses_process: true
    docs: [architecture/keybindings.md, architecture/settings.md]

  # ---------- 전역 팔레트 키 (OS 전역 단축키) ----------
  - id: global-palette-register
    title: "전역 팔레트 키(CommandOrControl+Shift+K)를 OS에 건다. 못 걸면 알린다"
    actor: system
    entries: [system:global-palette-register]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/global-shortcut.ts
      - packages/shell/main/desktop/headless.ts
      - packages/shell/main/desktop/wiring/desktop.ts
      - packages/shell/ipc/shortcuts.ts
    steps:
      - "shell 기동 중 desktop wiring이 installGlobalPalette로 GLOBAL_PALETTE_ACCELERATOR를 OS port에 건다"
      - "headless면 guardShortcuts가 등록을 거절하고 log만 남긴다. 그러면 아래 unavailable 경로도 탄다(tray가 없어 안내는 보이지 않는다)"
      - "등록이 false를 주거나 throw하면 다른 키로 대신 걸지 않고 tray에 사용 불가 안내(global-search-unavailable)를 보인다"
      - "shell이 멈출 때 dispose가 자기 key만 푼다"
    outcomes:
      - id: registered
        observe: ["process:OS에 전역 팔레트 키 하나가 걸린다"]
      - id: headless-skipped
        when: "LOPHN_SHELL_HEADLESS라 OS에 걸지 않았다"
        observe: ["log:headless global-shortcut 줄"]
      - id: unavailable
        when: "다른 앱이 이미 쓰거나 등록이 throw했다"
        observe: ["log:전역 팔레트를 등록하지 못했다 줄", "process:tray에 사용 불가 안내 한 줄"]
    crosses_process: false
    docs: [architecture/keybindings.md]

  - id: global-palette-press
    title: "다른 앱에 focus가 있어도 전역 팔레트 키를 누르면 lophn 창을 앞으로 가져온다"
    actor: person
    entries: [ui:global-palette-key]
    uses: [desktop-window-intent:sent, desktop-window-intent:opened]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/global-shortcut.ts
      - packages/shell/main/desktop/wiring/desktop.ts
    steps:
      - "OS가 전역 키를 주면 installGlobalPalette의 callback이 desktop.send(\"global-palette\")를 부른다"
      - "desktop-window-intent가 최근 창을 앞으로 가져와 global-palette intent를 창 renderer에 보낸다"
    outcomes:
      - id: handed-over
        observe: ["process:창 renderer가 shell:intent(global-palette)를 받는다"]
    crosses_process: true
    docs: [architecture/keybindings.md]
    unclear:
      - "팔레트 화면을 여는 flow는 아직 없다(palette.open과 같은 missing-domain-flow). 여기서는 창으로 전달하는 데까지만 본다"

