id: native-secret-card-stale
title: "design native kit의 SecretCard가 '컴퓨터에서 넣는다'는 옛 모양으로 남아 있다"
kind: defect
status: open
topic: mobile
modules: [packages/design]
now: |
  core-setup의 setup-phone 뒤로 폰은 agent의 secret 요청에 직접 답한다(card 안 입력 칸과 [Save]). design native kit의 `SecretCard`(`packages/design/native`)는 "secret은 컴퓨터에서 넣는다" 모양 그대로이고, mod.ts의 "언제 쓰나" 줄과 kit gallery 견본도 그 말이다. 폰 앱은 이제 이 component를 쓰지 않는다(site login 요청의 "컴퓨터에서 하세요" 줄만 비슷하다).
impact: |
  kit을 보고 폰 화면을 짓는 사람이나 agent가 옛 모양을 고른다. 쓰는 곳 없는 component가 남는다.
fix: |
  `SecretCard`를 site login 요청 모양으로 바꾸거나 지우고, mod.ts 줄과 kit 견본(`packages/mobile/src/gallery/parts.tsx`)을 맞춘다.
