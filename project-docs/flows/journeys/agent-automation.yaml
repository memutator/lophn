      - {do: "gate가 허락을 받아 명령을 실행한다", flow: tool-gate-check:run-after-allow}
      - {do: "같은 명령을 다시 부르면 규칙에 걸려 묻지 않고 실행된다", flow: tool-gate-check:run}

