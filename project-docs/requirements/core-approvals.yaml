schema_version: 1


catalog: ../boundary-catalog.yaml
requirements:

  # request가 결정 전에 보여 줄 것

  - id: req-0300
    status: accepted
    subject: approvals
    statement: "request 카드는 program이 intent에서 만든 대상, 정규화한 입력, 효과를 보이고, activation이면 이전 release와의 비교를 보인다."
    acceptance:
      - "external app-api 호출의 request에서 대상 app-api, 정규화한 입력, 효과를 결정 전에 읽을 수 있다."
      - "activation request에서 이전 release보다 늘어난 선언과 data 손실 측정을 결정 전에 읽을 수 있다."
      - "request 내용은 요청한 agent가 쓴 설명 없이도 만들어진다."

  # 폐기: 카드 내용은 program이 intent에서 만든다(req-0300). agent가 쓴 설명에 기대지 않는다(tmp/architecture/approval.md 4장).
  - id: req-0301
    status: rejected
    subject: approvals
    statement: 필수 설명(이유, 변경 범위)이 없거나 공백뿐이면 request를 만들지 않는다.
    acceptance:
      - 이유를 비우거나 공백만 넣어 요청하면 거절되고 대기 request가 생기지 않는다.
      - 변경 설명을 비우거나 공백만 넣어 요청해도 같다.

  # 폐기: 수리 결과의 확인은 tickets에서 App Engineer가 정하기로 닫혔다.
  - id: req-0302
    status: rejected
    subject: approvals
    statement: 수리 동작의 request는 바뀌는 범위와 함께 보존되는 data와 실제 검증 기준을 제시한다.
    details:
      contains:
        - 바뀌는 범위
        - 보존되는 data
        - 실제 검증 기준
    acceptance:
      - 수리 release를 허락 대기로 올리면 결정 전에 보존되는 data 목록과 검증 근거를 읽을 수 있다.
    related:
      - problems

  # 결정은 누가 내리는가

  - id: req-0303
    status: accepted
    subject: approvals
    statement: "request는 사람 자격의 결정 command로만 결정하고, agent, coding agent, 앱, MCP server는 결정하지 못한다."
    acceptance:
      - "agent, coding agent, 앱, MCP server의 자격으로 결정을 보내면 거절되고 request는 대기로 남는다."
      - "사람 자격의 결정 command로만 request의 상태가 바뀐다."

  # 폐기: req-0303에 합쳤다.
  - id: req-0304
    status: rejected
    subject: approvals
    statement: 사람 token으로 온 호출이라는 사실만으로는 사람이 직접 결정한 것이 되지 않고, 사람의 결정은 사람이 고른 선택을 그 request의 정확한 대상과 입력에 한 번 적용한 경우에만 기록된다.
    acceptance:
      - 사람 token으로 보낸 호출이 사람이 선택을 고른 결정이 아니면 request는 대기로 남고 사람의 결정으로 기록되지 않는다.
      - 사람이 고른 선택을 그 request의 정확한 대상과 입력에 한 번 적용하면 사람의 결정으로 기록된다.
    related:
      - core-api

  - id: req-0305
    status: accepted
    subject: approvals
    statement: "request에는 기본 선택이 없고, 침묵이나 카드 닫기는 결정이 아니다."
    acceptance:
      - "request에 아무 답을 하지 않거나 카드를 닫아도 request는 대기로 남는다."

  # 폐기: "사람 확인이 필요한 app-api" 선언을 없앴다. 요청자는 intent의 actor다(tmp/architecture/approval.md 4장).
  - id: req-0306
    status: rejected
    subject: approvals
    statement: 사람이 확인해야 하는 앱 app-api의 request는 실제로 부른 주체(agent나 다른 앱)를 요청자로 남기고 사람의 결정과 구별해 기록한다.
    acceptance:
      - agent나 다른 앱이 부른 app-api를 사람이 허락해도 request의 요청자가 원래 호출 주체로 남는다.
      - 기록에서 요청자와 결정한 사람이 구별된다.
    related:
      - app-runtime

  - id: req-0307
    status: accepted
    subject: approvals
    statement: "사람은 이유 없이 거절할 수 있고, 적은 이유는 요청한 agent에게 그대로 간다."
    acceptance:
      - "이유 없이 거절할 수 있다."
      - "거절 이유를 적으면 요청한 agent가 그 이유를 그대로 받는다."

  # 허락의 묶임과 사용

  # 폐기: req-0310에 합쳤다.
  - id: req-0308
    status: rejected
    subject: approvals
    statement: 허락은 사람이 본 호출 주체, 동작, 정확한 대상, 전체 입력, 비교 기준과 필요한 agent 정의, tool, MCP 연결에만 묶이고, 그중 하나가 바뀌거나 허락된 범위를 넓히려면 새 request가 필요하다.
    acceptance:
      - 대상의 현재 release, 입력 값 하나, MCP 연결, agent 정의를 각각 바꾸면 이전 허락으로는 시작되지 않고 새 request가 생긴다.
      - 허락된 범위를 넓히는 요청에는 새 request가 필요하다.

  # 폐기: 당연한 구현 품질이다(기준 5).
  - id: req-0309
    status: rejected
    subject: approvals
    statement: request의 요청자, 동작, 영향, 설명, 기한은 생성 뒤 바뀌지 않고, 끝난 결정은 고치거나 다시 열 수 없다.
    acceptance:
      - 결정 전후에 request의 내용을 고치려 하면 거절된다.
      - 끝난 request에 늦은 결정을 보내면 거절된다.
      - 바뀐 제안은 새 request가 된다.

  - id: req-0310
    status: accepted
    subject: approvals
    statement: "허락은 그 request의 intent에 한 번만 쓰이고, 실행 직전에 intent(대상, 입력, 활성 release)가 같은지 다시 보아 다르면 실행하지 않는다."
    acceptance:
      - "허락된 request로 한 번 실행한 뒤 같은 허락으로 다시 실행하면 거절된다."
      - "허락 뒤 대상, 입력, 활성 release 중 하나가 바뀌면 실행하지 않는다."

  # 폐기: req-0310에 합쳤다.
  - id: req-0311
    status: rejected
    subject: approvals
    statement: 허락을 받은 뒤에도 적용 직전에 현재 권한, 대상, 비교 기준, 원래 일의 유효성을 다시 검사하고, 맞지 않으면 시작하지 않는다.
    acceptance:
      - 허락 뒤에 대상을 보관하거나 권한을 회수하거나 release를 바꾸면 적용이 거절된다.

  - id: req-0312
    status: accepted
    subject: approvals
    statement: 허락의 접수와 실제 적용의 성공은 구별해 알리고, 허락이 저장됐다는 이유만으로 동작이 끝난 것으로 표시하지 않는다.
    acceptance:
      - 허락한 뒤 적용 쪽을 실패시키면 결정은 허락으로 남고 결과는 적용 실패로 보인다.

  # 기한, 취소, 종료

  # 폐기: 기한을 두지 않는다. 원래 일이 끝나면 req-0315가 닫는다.
  - id: req-0313
    status: rejected
    subject: approvals
    statement: request에 기본 기한은 없고, 지정한 기한에 닿으면 새 결정과 허락 사용이 모두 거절되며 자동으로 허락되지 않는다.
    acceptance:
      - 기한 직전에는 결정과 허락 사용이 받아들여지고 기한 뒤에는 둘 다 거절된다.
      - 기한을 지정하지 않은 request는 시간이 지나도 만료되지 않는다.
      - 이미 내린 허락의 기록은 기한 뒤에도 남는다.

  # 폐기: 사람은 거절로 끝내고, 원래 일이 끝나면 req-0315가 닫는다.
  - id: req-0314
    status: rejected
    subject: approvals
    statement: 사람과 원래 요청자는 대기 중인 request를 취소할 수 있다.
    acceptance:
      - 대기 request를 사람이 취소하면 늦은 결정과 사용이 적용되지 않는다.
      - 요청자가 취소해도 같다.

  - id: req-0315
    status: accepted
    subject: approvals
    statement: "원래 일이 끝나면 대기 request는 cancelled로 끝난다. turn 안 request는 그 turn이 끊기거나 session이 끝날 때, 보류 request인 activation 허락은 같은 앱에서 더 새 release의 activation이 시작될 때다. 요청자는 cancelled와 거절을 구별해 받는다."
    acceptance:
      - "turn이 끊기거나 session이 끝나면 그 turn의 turn 안 request가 cancelled로 끝난다."
      - "같은 앱에서 더 새 release의 activation이 시작되면 이전 release의 activation request가 cancelled로 끝난다."
      - "더 새 release가 준비만 되면 이전 release의 activation request는 그대로 남는다."
      - "요청자는 cancelled와 거절을 구별해 받는다."

  # 폐기: req-0315에 합쳤다. 만료는 없다.
  - id: req-0316
    status: rejected
    subject: approvals
    statement: 거절, 만료, 취소는 그 호출을 실행하지 않은 채 끝나고 서로 구별되는 결과로 남는다.
    acceptance:
      - 거절, 만료, 취소를 각각 만들면 호출이 시작되지 않고 결과가 거절, 만료, 취소로 구별된다.

  # session 허락

  - id: req-0317
    status: accepted
    subject: approvals
    statement: "app-api와 MCP tool의 request 선택은 한 번, 이 session 동안, 항상, 거절이고, \"항상\"은 그 grant를 묻지 않음으로 바꾼다. activation과 lophn 쪽 설정 고치기는 허락, 거절이다."
    acceptance:
      - "app-api와 MCP tool의 request에서 한 번, 이 session 동안, 항상, 거절을 고를 수 있다."
      - "항상을 고르면 그 대상의 grant가 묻지 않음으로 바뀌고 다음 호출부터 묻지 않는다."
      - "activation과 lophn 쪽 설정 고치기의 request에서는 허락과 거절만 고를 수 있다."
    related:
      - agent-tools
      - shell

  - id: req-0318
    status: accepted
    subject: approvals
    statement: "session 허락을 고르면 같은 session에서 같은 대상은 다시 묻지 않는다."
    acceptance:
      - "session 허락 뒤 같은 session에서 같은 대상을 다른 입력으로 불러도 묻지 않는다."
      - "다른 대상은 다시 묻는다."
    related:
      - agent-sessions

  - id: req-0319
    status: accepted
    subject: approvals
    statement: session 허락은 그 session이 닫히거나 archive되거나 지워지면 사라지고, 다시 열어도 되살아나지 않으며 다른 session이나 run으로 넘어가지 않는다.
    acceptance:
      - session을 닫고 다시 열거나 archive한 뒤 같은 동작을 시키면 다시 묻는다.
      - 다른 session에서 같은 동작을 시켜도 묻는다.
    related:
      - agent-sessions

  # 폐기: req-0317에 합쳤다.
  - id: req-0320
    status: rejected
    subject: approvals
    statement: session 허락은 agent tool call의 확인 request에만 적용되고, 앱 app-api 확인이나 release 적용처럼 정확한 대상 하나를 보고 결정하는 request는 매번 사람에게 묻는다.
    acceptance:
      - session 허락을 준 뒤에도 앱 app-api 확인이나 release 적용 request는 매번 새로 생긴다.
    related:
      - agent-tools

  # gate와 grant

  - id: req-1492
    status: accepted
    subject: approvals
    statement: "동작은 grant에 비춰 막음, 실행, 물음 중 하나로 판정한다. grant 밖이면 막고 이유를 돌려주며, 묻지 않음이면 실행하고, 물음이면 request를 만든다."
    acceptance:
      - "grant 밖의 호출은 실행되지 않고 막힌 이유가 돌아온다."
      - "grant 안이고 묻지 않음인 호출은 request 없이 실행된다."
      - "grant 안이고 물음인 호출은 request를 만들고 결정 전에는 실행되지 않는다."
      - "같은 grant와 같은 호출에는 언제나 같은 판정이 나온다."
    related:
      - app-runtime

  - id: req-1493
    status: accepted
    subject: approvals
    statement: "사람은 agent에게 앱 app-api, 외부 MCP tool, 다른 agent, lophn 쪽 설정을 할당할 때 대상마다 실행 때 묻는지를 정한다. 기본은 read와 write는 묻지 않고, external과 lophn 쪽 설정 고치기는 묻는다."
    acceptance:
      - "할당 때 고르지 않으면 read와 write app-api는 묻지 않음, external app-api와 lophn 쪽 설정 고치기는 물음으로 정해진다."
      - "사람이 할당 때 external app-api를 묻지 않음으로 바꾸면 그 뒤 호출은 묻지 않고 실행된다."
      - "할당하지 않은 대상을 agent가 부르면 막힌다."
    related:
      - agents

  - id: req-1494
    status: accepted
    subject: approvals
    statement: "새 일을 여는 domain event(문제 열림과 다시 열림, 앱 반복 종료, activation 실패, context 위반)마다 Settings에 agent session을 여는지와 묻는지를 두고, 기본은 열고 묻지 않는다. 맡긴 call을 닫는 domain event(완료 보고, claim 만료, 완료 보고 없는 coding agent session 끝)는 이 설정으로 끄지 못하고 늘 맡긴 App Engineer에게 간다."
    acceptance:
      - "Settings를 바꾸지 않으면 새 일을 여는 domain event가 생겼을 때 정해진 agent session이 묻지 않고 열린다."
      - "그 domain event를 끄면 session이 열리지 않고, 묻게 하면 request가 생긴다."
      - "완료 보고, claim 만료, 완료 보고 없는 session 끝은 Settings와 상관없이 맡긴 App Engineer에게 들어간다."
    related:
      - events
      - config

  - id: req-1495
    status: accepted
    subject: approvals
    statement: "turn 안의 request는 session snapshot의 대기 권한 요청으로 남고, activation과 reaction의 request는 꺼졌다 켜져도 남으며 결정 뒤 이어 실행된다."
    acceptance:
      - "turn 안의 대기 request는 화면이 다시 붙어도 session snapshot에서 보인다."
      - "turn 안에서 물음이 생기면 사람이 그 session을 보고 있지 않아도 toast가 뜬다."
      - "activation request는 lophn을 다시 켜도 남는다."
      - "결정이 난 뒤 실행 전에 lophn이 꺼지면 다시 켰을 때 이어 실행된다."
    related:
      - events
