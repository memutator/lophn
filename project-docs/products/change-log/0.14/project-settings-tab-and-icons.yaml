id: project-settings-tab-and-icons
version: 0.14.0
title: 'Project settings 탭, 사람이 올리는 앱·project icon, panel 화면 안내'
modules: [packages/shell/renderer, packages/shell/main, packages/core/apps, packages/core/projects, packages/protocol, packages/core/agent-workspaces]
checked: []
change: |
  전:
    - project의 이름·목적·폴더는 launcher 카드의 [Details] dialog에서만 고쳤다. project 창에는 설정 화면이 없었다.
    - activity bar에 고정한 앱 panel은 늘 칸에 붙어(docked) 열렸고, 고정 목록을 한곳에서 보거나 순서를 바꿀 수 없었다.
    - 앱 icon은 앱 선언으로만 넣었다. project icon은 보일 자리(`PlaceMark`)만 있고 넣을 길이 없었다.
    - 앱 agent의 `design-app` skill은 화면 `sizes`가 어디서 열리는지, panel 화면을 따로 두는 기준을 말하지 않았다.
  후:
    - project 창에 `project_settings` 탭이 생겼다(창마다 하나, 고정 key `project-settings`, Detach 없음). 상단 경로의 `project ▾` menu와 palette의 "Project settings"로 연다. General(icon, 이름, 목적, 폴더 — launcher dialog와 같은 `ProjectForm`)과 App panels(고정 목록, 더하기, 빼기, 위·아래 순서, Dock·Float)가 있다.
    - `rail_apps[]`에 선택 칸 `open: "dock" | "float"`이 생겼다. 없으면 dock이다. 고정 앱을 누를 때 같은 앱·화면 탭이 없으면 그 방식으로 연다(float는 480×640).
    - App details 맨 위에 Icon 칸이 생겼다. 사람이 올린 icon이 선언한 icon보다 먼저다(`apps.icon` 출력에 `uploaded`). project icon은 Project settings와 launcher dialog에서 올린다(`projects.icon` read, `project.set_icon`·`app.set_icon` command). 둘 다 svg·png·webp 64 KiB 이하이고 byte가 type과 맞아야 한다. ledger에 표 `app_icons`·`project_icons`가 생겼다(schema step `apps.registration.icons`·`projects.registry.icons`).
    - `design-app` skill에 "Where screens open" 절이 생겼다. 한 가지 일을 panel 화면으로 떼어 내고, 넓어야 하는 화면은 panel을 빼고, `useContainerSpace()`로 배치하고, 마지막 입력을 `localStorage`에 둔다. 앱 template `AGENTS.md`와 `@lophn/declaration` guide에 `sizes`의 뜻을 적었다.
why: |
  project마다 쓸 앱 panel과 그 열기 방식을 정할 자리가 필요했다. project·앱 icon은 보일 자리만 있고 넣을 길이 없었다. 앱 agent가 panel을 모르면 "이 기능만 옆에 띄우기"(예: Mahas의 session 분석)를 앱 안의 탭 하나로 만든다.
decisions:
  - text: 'Project settings는 설정 화면이다.'
    by: person
  - text: 'Project settings는 따로 창이 아니라 project 창의 탭이다. 고정 목록(`rail_apps`)이 그 창의 layout에 있어 바로 고친다.'
    by: agent
  - text: '앱 icon은 App details에서 사람이 올리고, 선언의 `icon`도 남긴다. 사람이 올린 것이 먼저다.'
    by: person
  - text: '올린 icon은 blob 저장소가 아니라 ledger 표에 base64로 둔다. 64 KiB 이하라 prepare·relay·GC가 필요 없고 한 번에 읽는다.'
    by: agent
  - text: 'panel 안내는 기존 앱의 agent도 받도록 template이 아니라 내장 skill `design-app`에 둔다.'
    by: agent
