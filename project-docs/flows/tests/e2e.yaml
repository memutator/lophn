  - path: tests/e2e/app-restart_test.ts
    covers: [app-core-restart-recovery:invocations-unknown, app-rewind-plan:planned-blocked, app-command-call:succeeded, app-command-call:unknown, app-supervisor-reconcile:started, app-child-exit:restarted, app-child-exit:halted, app-record-unavailable:halted, app-runtime-read:state-unavailable]
