id: harness-agent-runtime
version: 0.18.0
title: "harness agent: Claude Code, Codex, OpenCode를 agent runtime으로"
modules: [packages/protocol, packages/core/lophn-agent, packages/core/router, packages/core/main, packages/core/config, packages/core/agent-workspaces, packages/core/workflows, packages/cli, packages/coding-agent, packages/shell/main, packages/shell/renderer, packages/design, tools]
checked: [architecture-run, architecture-testing, architecture-eval, architecture-activation, architecture-app-call, architecture-artifact, tool-check, tool-dev, tool-eval, tests-support, tool-test-live, tool-models-snapshot, tool-worktree-prep, architecture-workspace-layout, architecture-ui-kit, architecture-appearance, skill-ui-design]
change: |
  전: lophn은 coding agent에게 일을 맡기지 않았다. 정의의 `runtime`은 `lophn | bare`였고 workflow의 harness 참가자는 `not_handed`였다.
  후: `runtime`에 `claude-code`, `codex`, `opencode`가 있다. 그런 agent의 session은 core의 harness queue가 받고, extension `harness`(Settings › System › Extensions, 설정 `extensions.harness.enabled`)가 입력마다 그 harness의 headless 명령(`claude -p`, `codex exec`, `opencode run`)을 place 폴더에서 돌려 출력을 메시지와 `harness_tool` part로 기록한다. harness의 session id를 session에 두어(ledger step `lophn-agent.sessions.harness`) 다음 입력과 각 CLI의 resume이 같은 대화를 잇는다. turn마다 그 session·turn에만 쓰이는 agent 자격을 env `LOPHN_AGENT_CREDENTIAL`로 넘겨 harness가 자기 shell에서 `lophn call reply|send`, `session list`, `agent card`를 부르고, 내장 skill `lophn-agent`가 그 쓰는 법을 harness skill 폴더에 둔다. result call은 답하지 않으면 마지막 메시지가 답이다. workflow step은 `{agent}` 참가자로 harness agent에 간다. 편집기는 켜졌을 때 harness runtime을 고르게 한다. 본체 안 extension의 entry를 따로 build해 .deb의 설치 root `extensions/`에 넣고, manifest 판이 제품 판과 다르면 build가 멈춘다. extension process는 stdout·stderr를 따로 받고 stdin을 닫을 수 있고 `LOPHN_HOME`을 늘 받는다. ACP의 `message_recorded`는 `model_call: null`을 받는다(`project-docs/architecture/coding-agent.md`의 "harness agent").
why: |
  사람이 "third party agent harness도 우리 agent로 등록해서 프로그램틱 호출, tui 열기가 가능하게 할거야 워크플로우에서 쓰기 위해서", "그 실행은 cli command가 맡는거고"라고 했다(`project-docs/products/roadmap/agent-platform.md` 단계 7).
decisions:
  - text: |
      harness는 programmatic 실행을 공식으로 지원하므로 사람 없이(workflow, job) 돌려도 된다.
    by: person
  - text: |
      host는 shell main의 extension `harness`이고 켜기는 extension 설정 하나다. 계획 extension이 먼저 land했다.
    by: agent
  - text: |
      harness가 쓴 tool은 lophn이 실행한 것이 아니라 gate·rewind chain에 넣지 않고 `harness_tool {name, summary, status}` part로만 남긴다.
    by: agent
  - text: |
      전부 허락 flag(`bypassPermissions`, `danger-full-access`)는 쓰지 않는다. Claude Code는 `acceptEdits`와 `Bash(lophn *)` allow(그 밖의 쓰기 Bash 거절, 읽기 명령은 Claude Code 자체 규칙으로 통과), 정의의 deny는 disallow다. Codex는 `workspace-write`이고 deny를 옮길 수 없어 deny가 있는 정의는 띄우지 않는다.
    by: agent
  - text: |
      Codex의 sandbox가 loopback까지 막아 CLI가 core에 닿도록 `network_access=true`를 넣는다. Codex가 돌리는 명령이 인터넷에도 닿는다. harness-lab의 emdash·orca는 sandbox를 끄고 happy는 host tool을 MCP로 넘긴다는 조사를 보고 정했다(2026-11-04).
    by: person
  - text: |
      harness는 MCP bridge가 아니라 `lophn` CLI를 쓰고, 쓰는 법은 skill로 harness skill 폴더에 배포한다(2026-11-04).
    by: person
  - text: |
      opencode에는 권한 flag가 없어 사람의 opencode 설정대로 돈다(2026-11-04).
    by: person
  - text: |
      자격은 기존 `CredentialRegistry`로 내고 범위는 그 place 종류의 `lophn` 명령 route다(file·rewind·gate·ask 없음). user token은 넘기지 않는다.
    by: agent
  - text: |
      실제 harness 실행(Claude Code 2.1.318, codex-cli 0.166.0, opencode 2.1.4)으로 parser fixture를 녹화하고, argv와 resume, Claude→Codex call send와 `lophn call reply`, opencode의 `lophn` 호출, Claude의 쓰기 Bash 거절을 확인했다. 사람이 허락했다.
    by: person
follow_up: |
  - harness session의 steer와 fork가 harness에 닿지 않는다, home에서 돌지 않고 opencode는 git root에 쓴다, opencode 권한을 좁히기(`project-docs/issues/coding-agent.md`).
  - 이름 없는 `{kind: harness}` workflow 참가자 지우기(`project-docs/issues/workflow.md`).
  - TUI 열기 화면은 없다. 같은 session id로 각 CLI가 resume한다(단계 8과 같이).
