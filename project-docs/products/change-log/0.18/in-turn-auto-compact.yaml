id: in-turn-auto-compact
version: 0.18.0
title: "turn 안 자동 Compact"
modules: [packages/core/lophn-agent, packages/core/main, packages/protocol]
checked: [architecture-agent-definition]
change: |
  - 전: 자동 Compact(요약)는 turn 사이에만 돌았다. turn 안에서 예산을 넘으면 가장 오래된 tool 결과의 본문을 고정 문장으로 바꿔 지웠고, 요약은 남지 않아 agent가 앞서 읽은 파일 내용을 잃었다.
  - 후: turn 안 조립 추정이 예산의 85%를 넘거나 provider가 입력이 크다고 거절하면, 그 turn이 자기 session을 Compact(이 turn의 진행 포함)하고 같은 turn을 이어 간다. turn당 두 번까지이고, 실패하면 tool 결과 지우기로 물러난다. `RequestSessionCompact`·`CompactSession`이 `turn`을 받고, core는 turn이 도는 동안 그 turn 자신(machine)의 Compact만 받는다. `CompactStarted.turn`이 null이 아닐 수 있다.

  옮기기: 없음.
why: |
  Codex·opencode·Claude Code·omp는 모두 turn 안 model 요청 사이에 요약하고 이어 간다. 사람이 같게 정했다.
decisions:
  - text: |
      turn 안 Compact를 먼저 하고, 지우기는 물러날 길로 남긴다.
    by: person
  - text: |
      최근 사람 메시지 몇 개는 turn 안 Compact에서도 원문으로 남긴다. 그래서 이 turn의 agent 메시지가 다음 turn에 요약 옆에 한 번 더 보일 수 있다(잃지는 않는다).
    by: agent
follow_up: |
  - turn 안 Compact 전에 받은 steering은 덮인 메시지가 아니라 요약으로만 남는다.
  - tool 결과 하나가 요약 입력 예산의 절반보다 크면 요약이 `too_large`로 실패하고 지우기로 물러난다.
