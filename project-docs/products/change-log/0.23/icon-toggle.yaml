id: icon-toggle
version: 0.23.45
title: "pin·bookmark·즐겨찾기 단추를 design의 IconToggle 하나로 그린다"
modules: [packages/design, packages/shell/renderer]
checked: []
change: |
  전: 선 아이콘을 채워 켠 상태를 보이는 단추가 자리마다 따로 있었다. tray popup pin과 thread index bookmark는 각자 CSS로 aria-pressed 모양을 덮었고, float 패널 pin은 pin·unpin 두 단추를 data 속성 CSS로 갈랐고, browser 별과 coding agent 즐겨찾기는 감싸는 span의 `.filled` class로 칠했다. thread bookmark는 켜면 BookmarkCheck로 아이콘이 바뀌었다. coding agent 즐겨찾기 열은 표 맨 오른쪽이었다.
  후: `@lophn/ui/primitives`의 `IconToggle`(icon, label, pressed)이 모두를 그린다. 켜면 테두리·선택 배경 없이 아이콘 안쪽이 글자색으로 차고 아이콘은 그대로다. Settings › Coding agents 표의 즐겨찾기 별은 맨 왼쪽 열이다.
why: |
  사람: "pin, bookmark 그런 거 ... 다 따로 구현되어 있어서 하나의 컴포넌트로 만들고 coding agent 즐겨찾기에서도 그런 식으로 바꾸고 그 버튼을 제일 왼쪽으로 옮겨".
decisions:
  - text: |
      IconToggle은 button.module.css를 같이 쓰고 켠 모양 규칙을 공통 aria-pressed 규칙 뒤에 둔다. 우선순위가 같아 같은 file 안 순서로 이긴다. 이름은 호출자가 고른다(pin·unpin처럼 상태마다 다를 수 있다).
    by: agent
