id: remote-terminal-notice-does-not-open-tab
title: 다른 컴퓨터의 터미널 coding agent 알림을 눌러도 그 터미널 탭이 열리지 않는다
kind: bug
status: fixed
topic: terminal-agent
modules: [packages/shell/main, packages/shell/renderer, packages/shell/ipc, packages/shell/preload]
now: |
  다른 컴퓨터의 터미널 agent가 묻거나 끝나면 shell main이 그 컴퓨터의 `TerminalAgentSignaled`를 받아 `{kind: "terminal", terminal_ref, machine}` 목표로 toast나 OS 알림을 띄운다(`packages/shell/main/desktop/wiring/notice.ts`). 누르면 `reveal()`이 창을 앞으로 가져오지만 `send()`의 `target.machine !== undefined` 갈래가 바로 끝난다("이 컴퓨터는 그 터미널의 project를 모른다"). 이 컴퓨터의 터미널은 `projectOf(terminal_ref)`로 project를 알아 `TERMINAL_REVEAL_CHANNEL`로 탭을 고르게 한다. 다른 컴퓨터의 터미널에는 보내는 것이 없고 `NOTICE_REVEAL_CHANNEL`의 `NoticeReveal`에도 터미널 모양이 없다.
impact: |
  다른 컴퓨터에서 도는 coding agent가 사람을 기다리거나 끝났다는 알림을 눌러도 창만 앞으로 나오고 그 터미널로 가지 않는다. 사람이 sidebar나 Inbox에서 그 줄을 찾아 열어야 하고, 알림 하나로 답하던 흐름이 끊긴다. 이 컴퓨터의 터미널은 그대로 열린다.
fix: |
  - 중간(추천): 알림이 가리키는 터미널의 project를 renderer가 안다(그 컴퓨터의 `coding_sessions/list`가 `project`를 준다). `NoticeReveal`에 `{terminal, machine}`을 더하고 preload가 받아, renderer의 toast 행동이 그 컴퓨터의 목록에서 project를 찾아 `openProject(project, { terminal, machine })`로 연다. 바꾸는 곳: `ipc/notice.ts`, `preload/notice-api.ts`, `main/desktop/wiring/notice.ts`, `toast-host.tsx`와 toast 행동.
  - 큼: core가 터미널의 project를 `TerminalAgentSignaled`에 싣게 한다. protocol과 기기 event를 고치고 옛 판은 project 없이 온다.
closed: |
  NoticeReveal에 {terminal, machine}을 실어 원격 터미널 알림을 누르면 해당 기계·project로 이동해 터미널 탭을 열거나 선택한다.
guard: 없음
