  # ---------- activation 읽기 ----------
  - id: activation-state-read
    title: activation의 도는 줄, 선언 비교, 동의 대기를 읽는다
    actor: person
    entries:
      - route:activations/queue
      - route:activations/compare
      - route:activations/consents
    boundary: [app-releases]
    code:
      - packages/core/apps/releases/reads.ts
      - packages/core/apps/releases/activation/assembly.ts
    steps:
      - "queue: 메모리의 도는 줄과 ledger의 동의 대기 줄을 합쳐 돌려준다. 단계와 붙잡은 호출 수를 싣는다"
      - "compare: release의 고정 선언을 지금 활성 release와 active grant에 견줘 묻는 사유를 돌려준다. 볼 수 없는 release는 not_found다"
      - "consents: 동의 대기 줄을 읽을 수 있는 앱의 것만 골라 돌려준다. 앱을 볼 수 없으면 그 줄은 뺀다"
    outcomes:
      - id: ok
        when: "읽기가 답했다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "compare에서 release가 없거나 범위 밖"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "권한 판정 port가 답하지 않음(조립 누락), queue 줄 읽기가 ledger 연결 실패로 unavailable로 답함"
        observe: [response]
      - id: internal
        code: internal
        when: "compare·consents가 읽는 저장 행이 맞지 않음(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: []
    refs: [A11, E6]
    docs: [architecture/activation.md]

