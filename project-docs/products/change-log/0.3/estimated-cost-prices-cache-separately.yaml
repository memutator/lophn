id: estimated-cost-prices-cache-separately
version: 0.3.0
title: '추정 비용이 cache read·write를 각자 요율로 센다'
modules: [packages/core/lophn-agent]
change: |
  전: `estimatedCost`가 cache read·write token을 input 요율로 셌다. `price_basis`의 `cache_read`·`cache_write` 요율을 쓰지 않았다.
  후: 새 입력, cache read, cache write를 각자 요율로 세고, cache 요율이 없으면 input 요율이다. 저장된 `input`은 adapter가 이미 cache를 뺀 새 입력이라 다시 빼지 않는다. `rate_basis`에 실제로 쓴 token과 요율(`charged`)이 남는다.
  계약: 바뀐 것 없음.
why: |
  사람이 가격을 적게 했으니(계획 `model-info`) 기록되는 추정 비용이 맞아야 한다. provider는 금액을 주지 않는다: OpenAI·Anthropic은 token 수만 주고, b.ai 응답의 `usage`도 token 수뿐이다(사람 허락으로 한 번 호출해 확인).
decisions:
  - text: '대화 화면에 비용 합을 보이는 일은 뺐다. 계획 중 만든 composer 아래 비용 줄은 merge 뒤 되돌렸다.'
    by: person
  - text: 'cache 요율이 없으면 input 요율로 센다.'
    by: agent
  - text: '계획은 "OpenAI 계열이 cache를 두 번 센다"고 잘못 보고 `cache_in_input`이 true면 input에서 cache를 빼게 했다. adapter(`chatUsage`, Responses usage)가 저장 전에 이미 빼므로 그 빼기가 cache를 두 번 빼서 비용을 적게 셌다. land 직후 빼기를 지우고, 같은 일을 막는 test로 바꿨다(`usage/cost_test.ts`).'
    by: person
follow_up: |
  provider가 금액을 주는 곳(OpenRouter의 usage cost 등)을 `reported`로 읽는 일은 실제 응답을 확인한 뒤 따로 한다.
