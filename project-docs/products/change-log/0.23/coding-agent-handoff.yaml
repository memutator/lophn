id: coding-agent-handoff
version: 0.23.9
title: "lophn이 즐겨찾기 coding agent에게 handoff는 TUI로, 일회성 일은 headless로 넘긴다"
modules: [packages/protocol, packages/core/lophn-agent, packages/core/config, packages/core/host-queue, packages/core/main, packages/core/agent-workspaces, packages/cli, packages/coding-agent, packages/shell/renderer]
checked: []
change: |
  전: agent가 Claude Code 같은 coding agent를 부르려면 사람이 `runtime: claude-code` 정의를 만들어야 했고, 없으면 `agent.card`가 "tool target is not available"만 돌려줘 agent가 handle을 추측하다 멈췄다. coding agent를 사람이 이어서 쓰는 TUI로 넘기는 길은 없었다(`tab open --tui`는 첫 headless turn이 끝난 harness session만). headless Claude Code는 `--permission-mode acceptEdits`로 `lophn` 밖 Bash를 못 돌렸고 Codex는 `-s workspace-write`로 떴다. 왼쪽 sidebar에는 Agents 탭 입구가 없었다.
  후:
  - 즐겨찾기(`shell.coding_agents.favorites`) 가운데 headless runtime이 있는 Claude Code·Codex·OpenCode는 정의 없이 전역 내장 agent(id `coding_<harness>`, handle `claude`·`codex`·`opencode`)다. harness extension이 켜졌을 때만 보인다. 세 handle은 예약이고, 내장 agent는 지우지 못하고 handle·runtime·범위가 잠긴다.
  - `lophn tab open --coding <harness> --handoff <글>`: project의 새 터미널 탭에 사람의 즐겨찾기 명령으로 그 coding agent TUI를 띄우고 handoff를 첫 prompt로 준다. 글은 `<data root>/handoffs/<tab>.md`에 쓰고 터미널에는 고정 글과 경로만 친다. 즐겨찾기 가운데 첫 prompt 인자를 아는 claude·codex·opencode·omp가 된다.
  - project prompt, 내장 skill `lophn-agent`, `tab`·`team`·`call` help: 사람이 이어서 만질 handoff는 TUI, 결과만 받으면 되는 일회성 일은 `team spawn`으로 headless.
  - headless harness의 permission mode·sandbox는 사람의 CLI 설정대로다. `Bash(lophn *)` 허락, Codex `network_access=true`, 정의 deny는 남는다.
  - `agent.card`의 not_found가 모르는 handle과 부를 수 있는 handle을 말한다. `lophn agent create` help가 harness runtime을 적는다. 왼쪽 sidebar Jobs 아래에 Agents 줄이 있다.
why: |
  사람이 "claude code한테 인수 좀 해봐"라고 했는데 lophn이 정의가 없는 Claude Code를 찾지 못하고 HANDOFF file만 썼다. 사람: "agent definition 없어도 즐겨찾기한 agent들 쓸 수 있게", "handoff 같은 맥락은 tui로, 일회성은 헤드리스로", "permission mode는 사용자가 기본 세팅 해놓은대로".
decisions:
  - text: |
      내장 coding agent의 handle은 harness id(`claude`)다. 버린 길: runtime 값(`claude-code`). 즐겨찾기 이름과 `tab open --coding`의 이름이 같아야 agent가 헷갈리지 않는다.
    by: agent
  - text: |
      TUI handoff 탭은 사람의 터미널이다(lophn session·hold 없음). 결과는 lophn에 돌아오지 않는다. 버린 길: harness session을 만들어 TUI로 열기. 첫 turn 전에는 CLI session id가 없어 열 수 없고, headless runtime이 없는 omp는 쓸 수 없다.
    by: agent
  - text: |
      handoff 글은 file로 넘기고 터미널에는 고정 글과 경로만 친다. 터미널은 사람의 login shell에 글자를 치는 길뿐이라 agent가 쓴 글을 shell마다 quoting하지 않는다. 경로에 `"`·`$`·backtick·`\\`·줄바꿈이 있으면 열지 않는다.
    by: agent
  - text: |
      Codex `network_access=true`와 Claude Code `Bash(lophn *)` 허락은 남긴다. permission mode가 아니라 harness가 `lophn`으로 core에 닿는 길이다.
    by: agent
follow_up: |
  진짜 Electron 창에서 sidebar Agents 줄과 `tab open --coding` 탭, 실제 CLI의 첫 prompt 실행은 사람이 아직 보지 않았다. handoff file은 탭을 닫아도 지우지 않는다. harness-gui(터미널 탭의 GUI)는 여전히 자기 권한 mode를 고정한다.
