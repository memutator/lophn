  # ---------- 앱 선언 읽기와 검사 ----------
  - id: declaration-check
    title: 앱 source의 lophn.ts를 지금 검사한다
    actor: agent
    entries: [route:declarations/check]
    pre: [route:apps/connect_source]
    boundary: [app-releases]
    code:
      - packages/core/apps/declaration/check.ts
      - packages/core/apps/releases/ui-build/eval-declaration.ts
      - packages/protocol/apps/declaration/
    steps:
      - "범위와 연결된 source를 확인한다. 범위 밖(권한 거절 포함), 보관한 앱, source 없음은 not_found다"
      - "lophn.ts가 없으면 errors에 적는다. package.json이 가리키는 SDK 사본과 node_modules가 어긋나면 npm install을 권하는 errors를 싣는다"
      - "Node 자식으로 lophn.ts를 평가한다. 최소 환경으로 돌고 10초가 넘으면 끊는다"
      - "평가 결과를 선언 검증기에 넣는다. 평가 실패, JSON이 아님, 검증 실패는 errors로 돌아간다"
      - "통과하면 설명이 빈 칸인 곳을 warnings로, permission 선언을 permission_review로 돌려준다. release는 만들지 않는다"
    outcomes:
      - id: passed
        when: "errors가 비었다. warnings와 permission_review를 싣는다"
        observe: [response]
      - id: errors
        when: "lophn.ts 없음, SDK 사본과 node_modules 어긋남, 평가 실패(exit 0 아님), default export가 JSON이 아님, 선언 검증 실패 중 하나. 응답은 ok이고 errors에 사유가 든다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "범위 밖 앱(권한 거절 포함), 보관한 앱, source 폴더 없음. release 준비의 sourceRootOf는 권한 거절도 not_found로 바꾼다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "평가 자식이 끝나지 않음(spawn 오류 또는 10초 상한), 앱 사실이나 slug를 ledger에서 못 읽음"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    refs: [A7]
    docs: [architecture/app-call.md, architecture/package.md]
    unclear:
      - "평가 자식은 앱 source의 lophn.ts를 돌리므로 prepare child와 같은 종류로 셌다. crosses_process를 false로 볼 수도 있다"

  - id: app-declaration-read
    title: 앱의 active release 선언에서 command와 화면 목록을 읽는다
    actor: agent
    entries:
      - route:apps/tools
      - route:apps/tool_index
    pre: [release-activate:active]
    boundary: [app-releases]
    code:
      - packages/core/apps/declaration/reads.ts
      - packages/core/apps/releases/store.ts
    steps:
      - "app.tools: 앱 하나의 고정 선언을 준다. 없는 앱, 범위 밖 앱, active release 없음은 같은 not_found다. operation은 사람, supervisor(machine), 그 앱 workspace session에만 보인다"
      - "app.tool_index: 앱마다 active 선언의 바깥 command 목록을 준다. 다른 앱의 비공개 command는 그 앱 workspace session과 사람에게만 보인다"
      - "tool_index는 앱을 하나 지정했을 때만 command의 호출 모양(inputSchema)을 싣는다. 지정한 앱에 보일 선언이 없으면 not_found다"
    outcomes:
      - id: ok
        when: "선언을 돌려줬다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "tools: 없는 앱, 범위 밖(권한 거절 포함), release 없음. tool_index: 지정한 앱이 목록에 없음(보관·비활성 앱 포함)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "권한 판정 port가 답하지 않음(조립 누락)"
        observe: [response]
      - id: internal
        code: internal
        when: "앱이나 active 선언 행을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: []
    refs: [A21]
    docs: [architecture/app-call.md]

  - id: app-icon-read
    title: 앱 icon을 읽는다
    actor: person
    entries: [route:apps/icon]
    boundary: [app-releases]
    code:
      - packages/core/apps/screens/icon.ts
      - packages/core/apps/routes.ts
    steps:
      - "사람이 올린 icon이 있으면 그것을 base64로 준다(uploaded)"
      - "없으면 active release 선언의 icon 파일을 bundle 사본에서 읽는다(declared)"
      - "파일이 없거나 64 KiB를 넘거나 빈 파일이거나 지원하지 않는 형식이거나 bundle 밖을 가리키면 icon을 null로 둔다(none). 오류가 아니다"
    outcomes:
      - id: uploaded
        when: "사람이 올린 icon을 돌려줬다. uploaded가 true다"
        observe: [response]
      - id: declared
        when: "선언한 icon 파일을 bundle 사본에서 읽어 돌려줬다"
        observe: [response]
      - id: none
        when: "icon이 없다. icon이 null이다. 선언이 없거나 active release가 없는 것, 파일 문제, bundle 사본이 없는 것도 모두 여기다"
        observe: [response]
      - id: internal
        code: internal
        when: "업로드 icon이나 active 선언을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: [sandbox]

  - id: app-skills-read
    title: 앱이 공개한 skill 본문을 읽는다
    actor: system
    entries: [route:apps/skills]
    pre: [release-activate:active]
    boundary: [app-releases]
    code:
      - packages/core/apps/screens/skills.ts
      - packages/core/apps/routes.ts
    steps:
      - "slug마다 active release 선언의 public skill을 bundle 사본에서 읽는다"
      - "SKILL.md 본문과 옆의 .md 파일 본문을 싣는다. bundle 밖을 가리키는 경로는 읽지 않는다"
      - "없는 slug, 보관한 앱, active release 없는 앱, 읽을 수 없는 skill은 오류 없이 뺀다"
    outcomes:
      - id: ok
        when: "읽힌 skill 목록을 돌려줬다. 빠진 것이 있어도 오류가 아니다"
        observe: [response]
      - id: internal
        code: internal
        when: "앱 목록이나 active 선언을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    refs: [A21]
    docs: [architecture/app-call.md]
    unclear:
      - "actor를 system으로 적었다. agent runtime의 skill folder 읽기는 machine 자격으로 core가 부른다(skill-folders.ts). coding agent harness 사본도 같은 route를 읽는데 그쪽 호출 자격은 확인하지 못했다"

  # ---------- 사용자 package ----------
  - id: package-register-version
    title: 사용자 package의 판을 catalog에 등록한다
    actor: system
    entries: [route:packages/register_version]
    boundary: [package-registry]
    code:
      - packages/core/apps/packages/commands.ts
      - packages/core/apps/packages/install.ts
      - packages/core/apps/packages/blobs.ts
    steps:
      - "machine 자격이 아니면 forbidden이다. package.publish가 이 자격으로 부른다"
      - "이름이 없으면 새 package와 첫 판을 넣는다. 있으면 주인 앱이 입력의 owner_app과 같은지 본다. 다르면 forbidden이다"
      - "주인이 없는 package면 이 앱을 주인으로 정한다"
      - "같은 name·version이 있고 bundle·guide hash와 permission이 같으면 같은 사실의 재시도로 받는다. 빠진 blob 참조만 붙인다. 하나라도 다르면 conflict다"
      - "새 판이면 판, blob 참조, PackageVersionRegistered를 같은 tx에 넣는다. 설명은 새 판의 값으로 바꾼다"
      - "guide나 bundle blob의 hash·목적이 맞지 않거나 이 호출자가 준비한 blob이 아니면 invalid_input이다"
    outcomes:
      - id: registered
        when: "새 package 또는 새 판이 들어갔다"
        observe: ["ledger:packages", "ledger:package_versions", "ledger:blob_refs", "event:PackageVersionRegistered"]
      - id: same-version
        when: "같은 판의 재시도다. 새 판 행과 event는 없고 빠진 blob 참조만 붙는다"
        observe: ["ledger:blob_refs"]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니거나(package.publish가 부른 경우 포함) 주인 앱이 다름"
        observe: [response]
      - id: conflict
        code: conflict
        when: "같은 판인데 bundle·guide hash나 permission이 다르다. 공개 판은 바뀌지 않는다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "guide 또는 bundle blob의 hash나 목적이 맞지 않는다, 또는 blob이 이 호출자가 준비한 것이 아니다"
        observe: [response]
      - id: internal
        code: internal
        when: "방금 넣은 판을 다시 읽지 못함(registered version missing)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [A17]
    docs: [architecture/package.md]

  - id: package-publish
    title: 앱 workspace session이 자기 앱 code의 package를 사용자 package로 낸다
    actor: agent
    entries: [route:packages/publish]
    pre: [route:apps/connect_source]
    uses: [route:packages/register_version]
    boundary: [user-package, package-registry]
    code:
      - packages/core/apps/packages/publish.ts
      - packages/core/apps/releases/prepare/git-extract.ts
      - packages/core/apps/packages/install.ts
    steps:
      - "그 앱 workspace의 agent session만 받는다. 아니면 forbidden이다"
      - "이름이 @me/로 시작하는지 본다. 아니면 invalid_input이다"
      - "source 폴더의 HEAD commit을 읽는다. source 연결이 없으면 invalid_input, HEAD를 못 읽으면 unavailable이다"
      - "commit의 tracked·untracked 변경이 없는지, symlink나 밖을 가리키는 경로가 없는지 본다. 어긋나면 invalid_input이다. git이 커밋 내용을 뽑지 못하면 unavailable이다"
      - "package 폴더의 파일을 뽑아 이름과 판이 맞는지, 내부 @lophn/cap-* 의존이 요구하는 permission을 낸 permission이 덮는지 본다"
      - "bundle과 안내(Purpose·API·Examples)를 blob으로 준비하고 package.register_version을 machine 자격으로 부른다. blob 준비는 I/O worker를 거친다"
      - "설치 사본을 data root의 sdk/@me 아래에 쓴다. 같은 byte면 그대로 둔다. 쓰기가 실패하면 unavailable로 답하지만 판은 이미 등록돼 남는다. 다음 기동이나 같은 내용의 재시도가 사본을 채운다"
    outcomes:
      - id: published
        when: "판이 등록되고 설치 사본이 있다. 같은 판의 재시도도 같은 답이다"
        observe: ["ledger:packages", "ledger:package_versions", "ledger:blob_refs", "disk:data root의 sdk/@me 설치 사본"]
      - id: invalid_input
        code: invalid_input
        when: "이름이 @me/로 시작하지 않음, source 연결 없음, HEAD가 commit이 아님, dirty tree·uncommitted 파일, symlink, 밖 경로, git metadata, 빈 package 폴더, package.json 이름·판 불일치, 설치 경로 오류, 파일 모양 오류, permission 누락"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 앱 workspace의 session이 아님, 또는 register에서 주인 앱이 다름"
        observe: [response]
      - id: conflict
        code: conflict
        when: "같은 판이 다른 bytes나 permission으로 이미 있다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "git으로 HEAD를 못 읽음, git으로 커밋 내용을 뽑지 못함(git_failed), blob 준비가 unavailable(I/O worker), 설치 사본 쓰기 실패(이때 판은 이미 등록돼 있다)"
        observe: [response, "ledger:package_versions"]
    crosses_process: true
    risk: [sandbox, permission]
    refs: [A17]
    docs: [architecture/package.md]
    unclear: []

  - id: package-catalog-read
    title: 사용자 package 목록, 판, 사용처를 읽는다
    actor: agent
    entries:
      - route:packages/list
      - route:packages/versions
      - route:packages/usage
    boundary: [package-registry]
    code:
      - packages/core/apps/packages/reads.ts
      - packages/core/apps/packages/store.ts
    steps:
      - "list: @me 이름을 @lophn보다 먼저 정렬해 준다. name을 주면 그 package 하나를 준다"
      - "versions: package의 주인 앱과 판 목록을 준다. 등록 안 된 package는 not_found다"
      - "usage: 그 판을 sdk_dependencies로 고정한 active release 목록을 준다. 등록 안 된 package는 not_found다"
    outcomes:
      - id: ok
        when: "목록이나 판, 사용처를 돌려줬다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "versions와 usage에서 package가 등록돼 있지 않다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "list의 cursor가 이 요청과 맞지 않는다"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 package·판 행을 읽지 못함(store·rows가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: []
    refs: [A17]
    docs: [architecture/package.md]

  - id: package-guide-read
    title: SDK 안내와 사용자 package 안내 원문을 읽는다
    actor: agent
    entries:
      - route:packages/builtin
      - route:packages/guide_body
    boundary: [package-registry, sdk]
    code:
      - packages/core/apps/packages/builtin.ts
      - packages/core/main/daemon/wiring/apps.ts
    steps:
      - "builtin: 설치된 @lophn 사본을 이름순으로 디스크에서 읽는다. name을 주면 그 SDK 하나와 최신 판의 안내를 준다. 안내는 256 KiB에서 자른다"
      - "builtin: 이름이 설치돼 있지 않으면 not_found이고, 설치 사본을 못 읽으면 unavailable이다"
      - "guide_body: 호출자의 operation과 앱 조건을 본다. 맞지 않으면 forbidden이다. 정확한 판의 안내 blob 구간을 준다(I/O worker로 읽는다). 이 field 하나만 열린다. 등록 안 된 판이나 안내 없는 판은 not_found다"
    outcomes:
      - id: ok
        when: "목록이나 안내 본문을 돌려줬다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "builtin: 설치 안 된 @lophn 이름. guide_body: 등록 안 된 판이나 안내 없는 판"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "guide_body: packages.guide_body operation이 credential에 없거나 조건이 맞지 않음(authorize가 낸 forbidden)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "builtin: 설치된 SDK 사본을 읽을 수 없음. guide_body: blob 읽기가 붙지 않았거나 참조를 읽지 못함"
        observe: [response]
    crosses_process: true
    risk: []
    docs: [architecture/package.md]
    unclear:
      - "builtin 읽기는 core 안에서 끝나지만 guide_body는 I/O worker로 바이트를 읽는다. 한 flow에 묶었으므로 crosses_process는 true다"

  # ---------- preview ----------
  - id: preview-start
    title: release나 bundle을 fixture data로 preview 프로세스에 띄운다
    actor: agent
    entries: [route:previews/start]
    boundary: [app-runtime]
    code:
      - packages/core/apps/preview/service.ts
      - packages/core/apps/preview/launcher.ts
      - packages/core/apps/preview/area.ts
    steps:
      - "사람이나 그 앱 agent만 받는다. machine이나 앱 credential은 forbidden이다. 권한 밖 앱과 없는 앱은 not_found다"
      - "release를 주면 그 release가 이 bundle을 가리키는지 본다. 없는 release나 다른 앱의 release는 not_found, 다른 bundle이면 conflict다"
      - "bundle을 열고 fixture 파일이 bundle 안에 있는지 본다. 없으면 invalid_input이다"
      - "같은 앱의 지금 preview를 먼저 멈춘 뒤 disposable 영역을 만들고 fixture를 app.sqlite로 놓는다"
      - "supervisor에 preview 자식을 띄운다. 운영 DB와 backup에는 닿지 않는다. 응답은 ready가 false다. 준비 확인은 뒤에서 된다"
    outcomes:
      - id: started
        when: "preview 자식을 띄우라고 supervisor에 넘겼다"
        observe: [response, "process:preview 자식", "disk:apps/<app>/preview/<nonce>/"]
      - id: not_found
        code: not_found
        when: "앱, bundle, release가 없거나 범위 밖(권한 거절 forbidden도 not_found로 바뀐다)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "release가 이 bundle을 가리키지 않는다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "fixture가 bundle의 파일이 아니다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine이나 앱 credential(사람과 agent가 아닌 actor)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "preview service·bundle·release 조회가 붙지 않음(core에 supervisor가 안 붙음), 영역을 못 만듦, 이전 preview를 멈추지 못함, supervisor가 닫히는 중이거나 start가 실패함, bundle 열기·release 조회·앱 존재 읽기가 실패함"
        observe: [response]
      - id: internal
        code: internal
        when: "preview nonce 형식이 맞지 않음(validNonce 실패)"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    refs: [A8]
    docs: [architecture/app-call.md]
    unclear:
      - "release 없이 bundle hash만으로 띄우는 경로가 있다(release가 null). 같은 outcome이지만 호출자가 다르게 쓰는지 확인 못 했다"

  - id: preview-observe
    title: 지금 preview 프로세스의 관측을 읽는다
    actor: agent
    entries: [route:previews/get]
    pre: [preview-start:started]
    boundary: [app-runtime]
    code:
      - packages/core/apps/preview/service.ts
      - packages/core/apps/preview/reads.ts
    steps:
      - "사람이나 그 앱 agent만 받는다. machine이나 앱 credential은 forbidden이다. 범위 밖이거나 없는 앱은 not_found다"
      - "nonce가 없거나 이 service가 띄운 지금 preview가 아니면 observation을 null로 준다"
      - "supervisor에 물어 관측을 돌려준다. ready이거나, 준비 중이거나 실패 사유를 싣는다"
      - "supervisor가 모르는 preview면(재시작 뒤) service 기록과 영역을 버리고 observation을 null로 준다"
    outcomes:
      - id: observed
        when: "관측이 있다. ready 값과 reason을 그대로 싣는다"
        observe: [response]
      - id: none
        when: "지금 살아 있는 preview가 없거나 nonce가 다르다"
        observe: [response]
      - id: lost
        when: "supervisor가 그 nonce를 모른다. 영역을 버렸다"
        observe: [response, "disk:apps/<app>/preview/<nonce>/ 폐기"]
      - id: not_found
        code: not_found
        when: "범위 밖 앱이거나 없는 앱(권한 거절 forbidden도 not_found로 바뀐다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine이나 앱 credential(사람과 agent가 아닌 actor)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "supervisor 질의에 실패하거나 preview service가 붙지 않음"
        observe: [response]
    crosses_process: true
    risk: []
    refs: [A8]
    docs: [architecture/app-call.md]

  - id: preview-stop
    title: preview 프로세스를 멈추고 영역을 지운다
    actor: agent
    entries: [route:previews/stop]
    pre: [preview-start:started]
    boundary: [app-runtime]
    code:
      - packages/core/apps/preview/service.ts
      - packages/core/apps/preview/launcher.ts
    steps:
      - "사람이나 그 앱 agent만 받는다. machine이나 앱 credential은 forbidden이다. 범위 밖이거나 없는 앱은 not_found다"
      - "nonce가 지금 preview의 nonce가 아니면 not_found다"
      - "supervisor가 preview 자식을 끝내고 종료를 확인한다. 정지 유예는 10초다"
      - "종료가 확인되면 영역을 지운다. 확인하지 못하면 영역을 남긴다. 자식이 아직 쓸 수 있다"
    outcomes:
      - id: stopped
        when: "종료가 확인됐다. 영역을 지웠다"
        observe: ["process:preview 자식 종료", "disk:apps/<app>/preview/<nonce>/ 폐기"]
      - id: not_found
        code: not_found
        when: "범위 밖이거나 없는 앱(권한 거절 forbidden도 not_found로 바뀐다), 또는 nonce가 지금 preview가 아님"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine이나 앱 credential(사람과 agent가 아닌 actor)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "종료를 확인하지 못하거나 preview service가 붙지 않음. 영역은 그대로다"
        observe: [response, "process:preview 자식"]
    crosses_process: true
    risk: []
    refs: [A8]
    docs: [architecture/app-call.md]

  - id: preview-discard-stale
    title: core 시작 때 지난 실행의 preview 영역을 지운다
    actor: system
    entries: [system:preview-discard-stale]
    boundary: [app-runtime]
    code:
      - packages/core/apps/preview/area.ts
      - packages/core/apps/control.ts
    steps:
      - "core가 뜰 때 한 번 부른다"
      - "앱마다 apps/<app>/preview 폴더를 지운다. 앱 폴더의 다른 것과 운영 data는 건드리지 않는다"
      - "지우다 실패한 것은 무시한다. 시작을 막지 않는다. apps 폴더를 못 읽으면 아무것도 지우지 않고 넘어간다"
    outcomes:
      - id: discarded
        when: "지난 실행이 남긴 preview 폴더를 지웠거나 남은 것이 없다"
        observe: ["disk:apps/<app>/preview 폴더 제거"]
      - id: kept
        when: "지우지 못한 preview 폴더가 남았다(rm 실패, apps 폴더 읽기 실패). 무시하고 core 시작을 계속한다"
        observe: ["disk:apps/<app>/preview 폴더 남음"]
    crosses_process: false
    risk: []
    docs: [architecture/app-call.md]

  # ---------- 기동과 timer ----------
  - id: builtin-sdk-install
    title: 내장 SDK 사본과 사용자 package 설치 사본을 맞춘다
    actor: system
    entries: [system:builtin-sdk-install]
    boundary: [sdk, package-registry]
    code:
      - packages/core/main/daemon/wiring/sdk-install.ts
      - packages/core/apps/packages/install.ts
      - packages/core/apps/packages/restore.ts
    steps:
      - "build 때 packages/sdk 아래 package.json이 있는 폴더마다 판을 data root의 sdk 아래에 푼다. 하나라도 실패하면 build가 멈추고 core는 뜨지 않는다. node·npm shim과 앱 template 설치도 build에서 같이 돈다"
      - "start 때 catalog의 @me 판을 읽는다. 읽지 못하면 start가 멈춘다"
      - "catalog의 @me 판마다 설치 사본과 bundle blob이 맞는지 본다. blob은 I/O worker를 거쳐 읽는다"
      - "사본이 없거나 다르면 blob에서 다시 쓴다. blob이 없으면 사본 byte가 bundle_hash와 맞을 때만 blob을 다시 붙인다. 주인 앱이 없는 판은 붙이지 않는다"
      - "되살리지 못한 판은 log me_copy_skipped로 남기고 core는 계속 뜬다"
    outcomes:
      - id: installed
        when: "build가 SDK 사본을 다 풀었다"
        observe: ["disk:data root의 sdk/<part>/<ver>/"]
      - id: build-failed
        when: "sdk source를 못 읽거나 설치가 실패해 build가 멈춘다. node·npm shim이나 앱 template 설치 실패도 build를 멈춘다. core는 뜨지 않는다"
        observe: ["log:core 기동 실패"]
      - id: start-failed
        code: internal
        when: "start에서 @me catalog를 읽지 못함(readMeVersions가 낸 internal). core 기동을 멈춘다"
        observe: ["log:core 기동 실패"]
      - id: restored
        when: "@me 설치 사본을 blob에서 다시 썼다"
        observe: ["disk:data root의 sdk/@me/<name>/<ver>/"]
      - id: attached
        when: "blob이 없던 판에 사본 byte로 만든 bundle blob을 다시 붙이고 blob 참조를 등록했다"
        observe: ["ledger:blob_refs"]
      - id: skipped
        when: "사본도 blob도 못 쓰는 판이거나 주인 앱이 없는 판. 그 판을 쓰는 앱의 sync만 실패한다"
        observe: ["log:me_copy_skipped"]
    crosses_process: true
    risk: []
    docs: [architecture/package.md]
    unclear:
      - "같은 build에 node·npm shim과 앱 template 설치가 있다. 두 개는 이 flow의 owns 밖이라 build-failed에 적기만 했다. 각각 자기 flow를 가질지 정할 것"

  - id: activation-resume
    title: 끊긴 activation 시도를 ledger와 실제 관측으로 이어받는다
    actor: system
    entries: [system:activation-resume]
    pre: [activation-start:started]
    uses: [route:apps/record_unavailable]
    boundary: [app-releases, app-runtime, app-data]
    code:
      - packages/core/apps/releases/activation/recovery.ts
      - packages/core/apps/releases/activation/assembly.ts
      - packages/core/main/daemon/wiring/apps.ts
    steps:
      - "core가 다시 뜨면 재시작 점검이 activating 행을 읽기 전용으로 unknown에 남긴다. 이 점검은 아무것도 바꾸지 않는다"
      - "sweep이 ledger의 activating 행을 앱 줄에 세운다. 앱이 바쁘면 다음 sweep이 다시 본다"
      - "ledger가 이미 채택한 release면 복원하지 않고 그 release를 다시 띄운다. release 행이 없거나 activation 기록이 없으면 할 일이 없다"
      - "아직 진행 중이면 알려진 복구본으로만 복원하고, 확인한 뒤 activation.fail로 닫고 이전 release를 띄운다. 모르는 migration은 다시 적용하지 않는다"
      - "복원이나 종료를 확인하지 못하거나 core 조회가 실패하면 앱을 사용 불가로 두고(app.record_unavailable) 붙든 채 다음 sweep을 기다린다"
    outcomes:
      - id: active
        when: "채택됐던 release를 다시 띄웠다"
        observe: ["process:앱 자식", "log:앱 log"]
      - id: failed
        when: "진행 중이던 시도를 복원해 failed로 닫았거나, 이미 failed인 release의 이전 release를 다시 띄웠다(이전이 없으면 띄우지 않는다)"
        observe: ["disk:data 복원", "ledger:releases", "ledger:notices", "process:이전 release 자식"]
      - id: held
        when: "복원이나 종료를 확인하지 못하거나 core 조회가 실패해 앱을 사용 불가로 두고 붙든 채 남았다(termination_unconfirmed, restore_failed, restore_not_recorded, schema_unconfirmed, fail_not_recorded, core_unreachable)"
        observe: ["ledger:notices", "ledger:apps"]
      - id: none
        when: "release가 없거나 activation 기록이 없어 이어받을 것이 없다"
        observe: ["ledger:releases"]
    crosses_process: true
    risk: [data-loss]
    refs: []
    docs: [architecture/activation.md]
    unclear:
      - "held는 code가 없는 상태 이름이다. 사용 불가 표시가 app 쪽 outcome(app.record_unavailable)과 맞는지는 app-runtime과 확인할 것"
      - "재시작 점검의 unknown 표시는 읽기 전용 관측이라 이 flow의 outcome으로 세지 않았다. 기록을 남기는지 확인할 것"

  - id: activation-sweep
    title: 허락됐거나 요청된 activation을 시작하고 앱 상태를 맞춘다
    actor: system
    entries: [system:activation-sweep]
    boundary: [app-releases, app-runtime]
    code:
      - packages/core/apps/releases/activation/assembly.ts
      - packages/core/apps/releases/activation/handler.ts
      - packages/core/apps/releases/activation/queue.ts
      - packages/core/apps/control.ts
    steps:
      - "supervisor가 붙어 있으면 1초마다 돈다. core가 끝날 때 멈춘다"
      - "사람이 허락한 동의 줄을 고른다. 허락 뒤 비교가 허락한 것과 같은지 본다. 다르면 다시 판정해 다시 묻는다. 같으면 시작 큐에 넣는다"
      - "activation_requests에 쓰인 돌아가기 요청 행도 같은 방식으로 시작 큐에 넣는다"
      - "시작 큐는 앱마다 하나라서 도는 앱은 건너뛴다. 줄과 요청 행은 남아 다음 sweep이 다시 본다"
      - "활성 release가 있는 앱마다 supervisor에 원하는 상태를 맞춘다. 마지막으로 알린 상태와 같으면 supervisor에 보내지 않고 넘어간다"
      - "supervisor가 다시 떠서 앱을 모르면(observe가 null) 마지막으로 알린 원하는 상태를 다시 알린다"
    outcomes:
      - id: started
        when: "허락된 줄이나 돌아가기 요청 행을 시작 큐에 넣고 activation-start를 불렀다. activation-start가 받아들이면 release가 activating이 되고, 거절하면 release는 그대로다"
        observe: ["ledger:releases"]
      - id: reasked
        when: "허락 뒤 비교가 허락한 것과 달라져 시작하지 않고 다시 판정했다. 동의가 또 필요하면 새 동의 줄이 선다"
        observe: ["ledger:activation_consents", "event:ActivationConsentRequested"]
      - id: deferred
        when: "앱이 바빠서 줄과 요청 행이 그대로 남았다. 허락 뒤 비교 읽기나 큐 등록이 실패해도 줄은 남고 sweep이 그 오류를 버린다"
        observe: ["ledger:activation_consents"]
      - id: desired-synced
        when: "활성 release가 있는 앱의 원하는 상태를 supervisor에 알렸다. 근거(App 행)가 같으면 supervisor에 보내지 않는다"
        observe: ["process:supervisor 원하는 상태"]
      - id: desired-deferred
        when: "봉인 사본을 못 읽거나 supervisor가 받지 않아 알리지 못했다. 다음 sweep이 다시 본다"
        observe: ["process:supervisor 원하는 상태(갱신 없음)"]
      - id: desired-resent
        when: "supervisor가 다시 떠서 앱을 모르면(observe가 null) 마지막으로 알린 원하는 상태를 다시 알렸다"
        observe: ["process:supervisor 원하는 상태"]
    crosses_process: true
    risk: [permission]
    refs: [A11, E6]
    docs: [architecture/activation.md]
    unclear:
      - "activation.start가 conflict나 invalid_input으로 거절되면 같은 줄을 매 sweep(1초)마다 다시 시작하는지 확인하지 못했다. runOne이 거절을 조용히 돌려준다"
