  - id: assignment-set
    title: 사람이 agent에게 앱을 붙이고 그 앱에서 뺄 command를 고른다
    actor: person
    entries: [route:agent_assignments/set]
    pre: [route:agent_assignments/get]
    boundary: [approvals, agents]
    code: [packages/core/approvals/assignment/commands.ts, packages/core/main/daemon/wiring/assignment-file.ts, packages/core/lophn-agent/agents/store.ts]
    steps:
      - "사람만 바꾼다. route의 actors와 handler가 같이 막는다."
      - "revision을 비교한다. 화면이 읽은 값과 다르면 conflict이고, 화면이 다시 읽는다."
      - "앱 id는 slug로, 뺀 command는 `lophn(<slug> <command>)` deny 규칙으로 바꾼다. 없는 앱과 active 선언에 없는 command는 버린다(조용히 빠진다)."
      - "agent 정의 파일의 `apps`와 `permissions.deny`만 다시 쓴다. 이 할당이 다루는 옛 앱과 새 앱의 command 규칙만 바꾸고 그 밖의 deny 규칙은 지킨다. 본문과 다른 칸은 그대로다."
      - "정의 파일이 없는 일반 agent면 not_found다. 아무것도 쓰지 않는다. lophn 기본 agent는 파일이 없어도 새로 쓴다."
      - "쓴 뒤 다시 읽은 할당과 새 revision을 돌려준다."
    outcomes:
      - id: saved
        observe: ["disk:agents/<agent>.md", "response"]
      - id: conflict
        code: conflict
        when: "revision이 화면이 읽은 값과 다름"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "agent가 없거나 정의 파일이 없음. 정의 파일을 읽지 못해 agent를 찾지 못한 경우도 이 code다(읽기 오류가 not_found로 바뀐다). 아무것도 쓰지 않는다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님"
        observe: ["response"]
      - id: file-unavailable
        code: unavailable
        when: "정의 파일을 읽거나 쓰지 못함, 또는 ledger 위치를 알 수 없음. 파일 쓰기는 ledger transaction으로 되돌아가지 않는다(쓰기가 실패했으면 아무것도 바뀌지 않았다)"
        observe: ["response"]
      - id: definition-invalid
        code: invalid_input
        when: "정의 파일이 정의 schema로 읽히지 않아 다시 쓰지 못함. 아무것도 쓰지 않는다"
        observe: ["response"]
      - id: lookup-failed
        when: "앞 read(할당, 앱, 선언)가 실패해 그 code가 그대로 간다(깨진 값이면 internal). 쓴 뒤 다시 읽기가 실패하면 정의 파일은 이미 바뀌어 남는다(transaction은 되돌아가도 파일은 되돌리지 않는다)"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    refs: ["P4", "G1", "C25"]
    docs: [architecture/approval.md, architecture/agent-definition.md]
    unclear:
      - "agent를 찾는 길(agentDirectory.agent)은 정의 파일을 읽지 못하면 null을 돌려 not_found가 된다. 읽기 실패를 unavailable로 구별하지 못한다. 그대로 두었다."

  - id: assignment-file-migrate
    title: 옛 agent_assignments 표의 할당을 agent 정의 파일로 옮기고 deny 규칙을 앱 slug로 바꾼다
    actor: system
    entries: [system:assignment-file]
    boundary: [storage, agents]
    code: [packages/core/main/daemon/wiring/assignment-file.ts, packages/core/storage/migration/]
    steps:
      - "옛 표의 schema step(id `agent_assignments`)은 목록에 남는다. 이미 적용한 ledger가 그 id를 기록하고 있어 빼면 기동을 거절한다."
      - "data step `approvals.assignment-file`이 표 줄마다 agent 정의 파일에 `apps`와 `permissions.deny`를 쓰고 표를 지운다. 쓰기는 줄의 값으로 두 칸을 통째로 바꾼다."
      - "앱이 없는 줄, active 선언에 없는 command, 정의 파일이 없거나 틀린 agent의 줄, 값이 JSON이 아니거나 schema에 맞지 않는 줄은 버린다. 앱 slug가 하나도 남지 않은 줄은 파일을 건드리지 않는다."
      - "뒤의 data step `approvals.deny-rule-slug`가 파일의 `lophn(<domain> <낱말>)` 규칙을 앱 slug로 바꾼다. 못 찾은 규칙은 그대로다. 규칙이 바뀐 파일은 frontmatter를 YAML로 다시 쓴다."
      - "순서는 `agents.skills-off`(옛 `skills`를 옮김)가 먼저다(assembly.ts WIRINGS 순서로 확인). 순서가 바뀌면 옛 `skills`가 남은 파일이 거절되어 할당이 버려진다."
    outcomes:
      - id: moved
        observe: ["disk:agents/<agent>.md", "ledger:agent_assignments"]
      - id: row-dropped
        when: "쓸 곳이 없는 줄(앱 없음, command 없음, 정의 파일 없음·틀림, 줄 값이 schema에 안 맞음)은 버리고 표는 지운다"
        observe: ["ledger:agent_assignments"]
      - id: deny-rule-slugged
        when: "파일의 lophn(<domain>) 규칙이 앱 slug로 바뀜"
        observe: ["disk:agents/<agent>.md"]
      - id: step-failed
        when: "ledger를 열지 못함(unavailable), 앱·선언을 읽지 못함(그 code가 그대로, 깨진 값이면 internal), 정의 파일을 읽거나 쓰지 못함(unavailable). 표가 아직 남아 있으면 다음 기동이 다시 한다. 이미 쓴 줄의 파일은 되돌리지 않는다(다시 돌아도 같은 값으로 덮는다). deny-rule-slug 단계가 실패하면 표는 이미 지워져 있고 다음 기동이 그 단계만 다시 한다"
        observe: ["log:data-step"]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/approval.md, architecture/agent-definition.md]
    unclear:
      - "옛 표 줄이 있는 agent 파일의 `apps`와 `permissions.deny`를 표 값으로 통째로 바꾼다(store.ts writeAgentAssignment가 두 칸을 줄 값으로 덮는다, 사람이 `assignment-set`으로 쓴 길처럼 그 밖의 deny 규칙을 지키지 않는다). 표에 없는 앱이나 deny 규칙이 파일에 있었다면 사라진다. 옛 쓰기가 파일과 표를 항상 같이 썼는지 확인하지 못했다. 사람이 확인할 일이다."
      - "data step이 실패하면 기동을 막는지는 storage/migration의 규칙이라 확인하지 않았다."
      - "deny-rule-slug 단계는 규칙이 바뀐 파일의 frontmatter를 YAML로 다시 쓴다. 주석과 서식이 바뀔 수 있다(본문은 그대로다)."

