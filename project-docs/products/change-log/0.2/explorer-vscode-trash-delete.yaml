id: explorer-vscode-trash-delete
version: 0.2.0
title: "Explorer를 VS Code Explorer처럼 쓸 수 있게 하고 지우기를 휴지통으로 바꿈"
modules: [packages/shell/renderer, packages/shell/main, packages/shell/ipc, packages/shell/preload, packages/design, tools]
checked: []
change: |
  전: tree는 펼치기, 일부 keyboard, 우클릭 Open·Rename·Delete(Rename은 dialog)만 있었다. 지우기는 영구 삭제이고 빈 폴더만 지웠다.
  후:
  - 머리 줄에 hover·focus하면 New File, New Folder, Refresh, Collapse All 단추가 보인다. 새 파일·폴더와 이름 바꾸기는 tree 안 inline 입력이다(`a/b/c.md`는 중간 폴더도 만든다, 이미 있는 이름은 입력 아래 오류, Esc·focus 잃음은 취소).
  - 지우기는 확인 dialog 뒤 OS 휴지통(`shell.trashItem`)이다. 비어 있지 않은 폴더도 된다. 휴지통을 못 쓰면 지우지 않고 실패로 알리고, 영구 삭제로 되돌아가지 않는다. 편집기 view bar의 Delete도 같은 길이다.
  - 파일·폴더를 폴더로 끌어 옮기고(확인 dialog, 같은 이름·자기 안은 거절), 우클릭 menu는 New File, New Folder, Reveal in File Manager, Copy Path, Copy Relative Path, Rename, Delete 순서다(빈 자리는 루트 기준).
  - keyboard: 방향키, Home/End, 글자 찾기, F2, Delete. 고른 탭의 파일은 tree에서 자동으로 펼쳐 골라진다. 펼친 폴더는 3초마다와 창 focus 때 다시 읽어 바깥 변경을 따라간다.
  - IPC: `shell:file-create`(`{ path, kind }`, 없는 위쪽 폴더도 만들고 이미 있으면 `conflict`)와 `shell:file-reveal`을 더했다. `shell:file-delete`는 휴지통으로 가며 휴지통을 못 쓰면 `unavailable`이다. `shell:file-rename`은 폴더를 자기 안으로 옮기면 `invalid_input`이다. `WorkspaceSource`에 create·rename·trash·reveal이 늘었다.
  - design `Menu` 항목에 `separatorBefore`(구분선)를 더했다.
why: |
  파일 tree를 평소 쓰는 편집기처럼 쓰게 하고, 사용자 파일을 영구히 잃을 길을 없애려고.
decisions:
  - text: |-
      바깥 변경은 file watch(편집기 파일 전용 목록)를 나누지 않고 renderer가 펼친 폴더를 주기적으로 다시 읽는다.
    by: agent
  - text: |-
      Open in Integrated Terminal은 뺐다. 터미널 탭은 project 폴더 참조(folder_ref)로만 열려 임의 하위 폴더에서 열 수 없다.
    by: agent
  - text: |-
      우클릭 menu에서 Open을 뺐다(VS Code 순서를 따름). 클릭으로 연다.
    by: agent
follow_up: |-
  Open in Integrated Terminal은 터미널 통로가 임의 폴더를 받게 된 뒤.
