    docs: [architecture/browser-tab.md]
    steps:
      - "Your other computers 구역의 Switch가 `shell.browser.share_with_computers`(기본 켬, 사람만 바꾼다)를 settings/update로 쓴다. 고른 값은 저장 전에도 보이고 저장하지 못하면 앞 값으로 돌아가며 오류 한 줄을 보인다"
      - "끄면 이 컴퓨터는 다른 컴퓨터에 vault를 내주지도 받지도 않는다. 이미 받은 것은 남는다. 켜면 link가 붙은 컴퓨터마다 곧 받는다"
    outcomes:
      - id: saved
        observe: ["response", "event:StateChanged", "screen:settings-browser-share"]
      - id: failed
        code: unavailable
        when: "core가 닿지 않거나 쓰기가 거절됐다"
        observe: ["response"]
    crosses_process: false
    risk: [secret]

  - id: browser-profile-delete
    title: "Settings에서 browser profile을 지운다(그 profile의 login과 data도 지운다)"
    actor: person
    entries: [ui:browser-profile-delete]
    uses: [ipc:shell:browser-clear-data, route:browser_profiles/delete]
    boundary: [shell]
    code:
      - packages/shell/renderer/desktop/settings/browser/profile-rows.tsx
      - packages/shell/renderer/desktop/settings/browser/window-source.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "[Delete]는 확인 dialog를 보인다: 지울 저장 login 수(password·TOTP 포함)와 cookie·site data, 이 profile을 쓰던 agent는 기본 profile로 떨어진다는 문장, 나누기가 켜져 있고 명단에 다른 컴퓨터가 있으면 거기서도 지워진다는 문장. 로그인 목록을 읽지 못했으면 단추가 꺼져 있다"
      - "확인하면 ① 그 profile의 partition data를 clear-data IPC로 지운다 ② browser_profiles/delete가 그 profile의 login 값, login, profile을 지운다(흔적이 다른 컴퓨터로 가서 거기서도 지운다)"
      - "어느 단계가 실패하면 거기서 멈추고 오류 한 줄을 보인다. 목록은 ②에서만 바뀌므로 profile이 남아 있어 다시 할 수 있다"
      - "그 profile을 가리키던 agent 정의는 고치지 않는다. 열 때 기본 profile로 떨어지고 편집기가 Deleted profile로 보인다"
    outcomes:
      - id: deleted
        observe: ["disk:<root>/browser-vault.json", "disk:persist:lophn-browser-<bpf id>", "response", "event:StateChanged", "screen:settings-browser-profile-delete", "screen:agent-settings-browser-profile-deleted"]
      - id: stopped
        code: unavailable
        when: "partition data 지우기나 browser_profiles/delete가 실패했다. 앞 단계는 이미 끝났을 수 있고 profile은 목록에 남는다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]

  - id: browser-bookmarks-read
    title: "browser bookmark 목록을 읽는다"
    actor: person
    uses: [ipc:shell:bookmarks-list]
    boundary: [shell]
    code:
      - packages/shell/main/browser/bookmark-ipc.ts
      - packages/shell/main/browser/bookmarks.ts
      - packages/shell/renderer/browser/bookmarks.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "bookmark를 보이는 화면(새 탭, 별 단추, 설정)이 열리거나 bookmarks-changed를 받으면 useBookmarks가 목록을 다시 읽는다"
      - "main은 보낸 창이 desktop 본문 main frame인지 본다(bookmark IPC guard). 입력은 없다"
      - "<dataRoot>/shell/bookmarks.json이 없으면 빈 목록을 준다"
      - "JSON이 아니거나 schema·version이 다르면 오류가 아니라 corrupt 상태를 준다. 화면은 목록 자리에 그것을 보인다"
      - "그 밖의 읽기 오류(ENOENT 밖)는 unavailable로 답한다"
    outcomes:
      - id: ok
        observe: ["response", "screen:browser-new-tab-bookmarks", "screen:browser-bookmark-menu"]
        when: "파일이 맞거나 없다(없으면 빈 목록)"
      - id: corrupt
        observe: ["response", "screen:settings-browser-bookmarks-corrupt"]
        when: "JSON이 아니거나 schema·version이 다르다. 오류 code가 아니라 state corrupt로 답한다"
      - id: unavailable
        code: unavailable
        when: "bookmarks.json을 읽지 못했다(ENOENT 밖의 읽기 오류)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(bookmark IPC guard)"
        observe: ["response"]
    crosses_process: false

  - id: browser-bookmark-save
    title: "bookmark를 더하거나 고치거나 지운다"
    actor: person
    entries: [ui:browser-bookmark-save]
    uses:
      - ipc:shell:bookmarks-add
      - ipc:shell:bookmarks-update
      - ipc:shell:bookmarks-remove
      - ipc:shell:bookmarks-changed
      - key:browser.bookmark
    boundary: [shell]
    code:
      - packages/shell/main/browser/bookmarks.ts
      - packages/shell/main/browser/bookmark-ipc.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "main이 <dataRoot>/shell/bookmarks.json을 읽고, 깨졌으면 corrupt로 두어 어떤 쓰기도 덮지 않는다"
      - "title은 200자 이하, url은 http·https이고 userinfo가 없고 8192자 이하인지 본다. 목록은 1000개까지다"
      - "같은 href가 있으면 conflict로, 고치거나 지울 항목이 없으면 not_found로 거절한다"
      - "temp 파일에 쓰고 rename으로 바꾼다(폴더 0700, 파일 0600). 쓰기는 promise 줄로 세운다"
      - "바뀐 목록을 열린 모든 shell 창에 bookmarks-changed로 알린다"
    outcomes:
      - id: saved
        observe: ["disk:<dataRoot>/shell/bookmarks.json", "response", "screen:settings-browser-bookmarks", "screen:browser-star-empty"]
      - id: invalid-input
        code: invalid_input
        when: "title이나 url이 맞지 않거나 1000개를 넘는다, 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: duplicate
        code: conflict
        when: "같은 href의 bookmark가 있다"
        observe: ["response"]
      - id: missing
        code: not_found
        when: "고치거나 지울 bookmark가 없다"
        observe: ["response"]
      - id: corrupt-refused
        code: unavailable
        when: "bookmarks.json이 JSON이 아니거나 schema·version이 다르다. 쓰기를 거절하고 파일은 그대로 둔다"
        observe: ["disk:<dataRoot>/shell/bookmarks.json", "response"]
      - id: unreadable
        code: unavailable
        when: "bookmarks.json을 읽지 못했다(ENOENT 밖의 읽기 오류)"
        observe: ["response"]
      - id: unwritable
        code: unavailable
        when: "temp 쓰기나 rename이 실패했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(bookmark IPC guard)"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]

  - id: browser-native-place
    title: "browser의 native view(크기 준 popup, DevTools) 자리를 맞춘다"
    actor: person
    uses: [ipc:shell:view-bounds]
    boundary: [shell]
    code:
      - packages/shell/main/app-frame/view-ipc.ts
      - packages/shell/main/browser/native-bounds.ts
      - packages/shell/main/browser/native-view.ts
      - packages/shell/renderer/browser/native-bounds.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "renderer가 칸과 스크롤 경계로 자른 자리의 사각형(CSS pixel)과 layer를 보낸다. 사각형이 비면 renderer가 views-hidden으로 숨긴다"
      - "main은 보낸 창이 desktop 본문인지, 입력이 schema에 맞는지 본다. 그 창이 연 native view가 아니면 invalid_input이다(다른 창의 view도 같다)"
      - "같은 frame의 bounds는 16ms마다 한 번만 적용한다. page zoom을 곱해 창 DIP로 바꾸고 창 본문과 교차한 것만 붙인다"
      - "교차가 없으면 뗀다. 기다리던 bounds는 숨김이 먼저 오면 버리고 숨김 결과로 답한다. 창을 옮기거나 닫아 버려지면 invalid_input이다"
      - "view가 붙을 창이 열려 있지 않으면 unavailable이다"
    outcomes:
      - id: placed
        observe: ["response", "screen:browser-devtools-bottom", "screen:browser-oauth-popup"]
      - id: off-body
        observe: ["response"]
        when: "창 본문과 교차가 없어 view를 뗀다(스크롤 밖이거나 사각형이 비었다)"
      - id: superseded
        observe: ["response"]
        when: "같은 frame에서 기다리던 bounds가 숨김보다 늦어 버려졌다. 답은 숨김 결과(ok)다"
      - id: invalid-input
        code: invalid_input
        when: "그 창이 연 native view가 아니다, 또는 입력이 schema와 다르다(정수가 아닌 사각형, layer가 0..32 밖), 또는 기다리던 bounds가 창 옮기기·닫기로 버려졌다"
        observe: ["response"]
      - id: window-closed
        code: unavailable
        when: "view가 붙을 창이 열려 있지 않다, 또는 native view를 붙이지 못했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 창 본문 main frame이 아니다(view IPC guard)"
        observe: ["response"]
    crosses_process: false

  - id: browser-native-hide
    title: "browser의 native view(popup, DevTools)를 바로 뗀다"
    actor: person
    uses: [ipc:shell:views-hidden]
    boundary: [shell]
    code:
      - packages/shell/main/app-frame/view-ipc.ts
      - packages/shell/main/browser/native-bounds.ts
      - packages/shell/renderer/browser/native-bounds.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "renderer가 탭 전환, 자리 비움, 사각형이 빈 것을 보고 숨길 view 목록을 보낸다. 탭 전환은 옛 view를 먼저 숨긴다"
      - "main은 보낸 창이 desktop 본문인지, 입력이 schema에 맞는지 본다"
      - "view가 모두 그 창의 것인지 본다. 하나라도 아니면 아무것도 숨기지 않는다"
      - "16ms 묶음을 기다리지 않고 바로 뗀다. 기다리던 bounds는 버린다"
    outcomes:
      - id: hidden
        observe: ["response", "screen:browser-tab"]
      - id: invalid-input
        code: invalid_input
        when: "view 가운데 하나라도 그 창이 연 native view가 아니다(그러면 하나도 숨기지 않는다), 또는 입력이 schema와 다르다(빈 목록 포함)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 창 본문 main frame이 아니다(view IPC guard)"
        observe: ["response"]
    crosses_process: false

  - id: browser-guest-attach
    title: "shell 문서가 <webview>를 붙일 때 browser 쪽 설정을 덮는다"
    actor: system
    entries: [system:browser-guest-attach]
    boundary: [shell]
    code:
      - packages/shell/main/browser/webview-guest.ts
      - packages/shell/main/desktop/wiring/browser.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "will-attach-webview는 붙이는 문서가 lophn-shell://desktop인지 본다. 아니면 거절한다"
      - "src가 등록된 app·artifact guest와 같으면 그 target을 쓰고, 아니고 partition이 알려진 browser profile의 partition 가운데 하나이면 browser target으로 본다"
      - "renderer가 넣은 preload·webpreferences·nodeintegration 같은 값은 지우고 hardened 값으로 덮은 뒤 partition과 preload를 다시 넣는다"
      - "browser의 첫 src는 decideNavigation을 지나야 하고, 못 지나면 about:blank로 바꾼다"
      - "did-attach-webview에서 받아 둔 붙이기를 FIFO로 guest 항목(wv-<id>)에 묶는다"
    outcomes:
      - id: attached-browser
        observe: ["screen:browser-tab"]
      - id: attached-registered-view
        observe: ["screen:artifact-tab"]
      - id: rejected
        observe: ["request:outside-server"]
        when: "shell 밖 문서에서 붙였다, 또는 browser partition도 아니고 등록된 app·artifact view의 src도 아니다, 또는 resolver가 받아 주지 않았다(다른 창의 view·이미 쓴 src)"
      - id: first-src-blocked
        observe: ["screen:browser-blank"]
    crosses_process: false
    risk: [sandbox]

  - id: browser-navigation
    title: "browser page가 가는 목적지를 decideNavigation으로 정한다"
    actor: system
    entries: [system:browser-navigation]
    pre: [browser-guest-attach:attached-browser]
    boundary: [shell]
    code:
      - packages/shell/main/browser/navigation.ts
      - packages/shell/main/browser/electron-view.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "will-frame-navigate와 will-redirect에서 main frame과 subframe의 목적지를 본다(will-navigate는 쓰지 않는다)"
      - "main frame의 http·https는 userinfo가 없을 때만 간다"
      - "subframe은 http·https와 data·blob·about을 받고 그 밖은 막는다"
      - "main frame의 mailto·tel은 막고, 이 컴퓨터 사람의 입력이 fresh면 OS로 넘긴다. lophn(agent, 멀리서 보기)이 그 page에 넣은 input은 popup·download에는 활동이지만 OS로 넘기기에는 세지 않는다"
    outcomes:
      - id: allowed
        observe: ["request:outside-server"]
      - id: blocked
        observe: ["request:outside-server"]
        when: "decideNavigation이 막았다: 허락되지 않은 scheme, main frame의 userinfo가 있는 http·https, 입력 없는 mailto·tel, 주소를 읽을 수 없음"
      - id: os-handoff
        observe: ["process:os-opener"]
        when: "main frame의 mailto·tel이고 이 컴퓨터 사람의 입력이 fresh이다(lophn이 넣은 input은 세지 않는다)"
    crosses_process: false
    risk: [sandbox]

  - id: browser-popup
    title: "page의 window.open을 floated 탭, docked 탭, 막기 가운데 하나로 고른다"
    actor: system
    entries: [system:browser-popup]
    pre: [browser-page-open:loaded]
    uses:
      - ipc:shell:browser-adopt
      - ipc:shell:browser-event
    boundary: [shell]
    code:
      - packages/shell/main/browser/popup.ts
      - packages/shell/main/browser/popup-host.ts
      - packages/shell/main/browser/registry.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "popup 목적지를 decideNavigation으로 보고 사용자 입력이 5000ms 안인지 본다"
      - "입력이 없으면 deny하고 popup-blocked 이벤트를 창에 보낸다"
      - "width와 height가 둘 다 있으면 native popup view를 만들어 opener를 남기고 floated 탭을 열게 한다. adopt 전에는 state를 밀지 않는다"
      - "크기 없는 popup은 deny하고 open-tab 이벤트로 renderer가 연 탭 뒤에 webview 탭을 연다"
      - "adopt는 소유 창에서 한 번만 된다. 다른 창이 부르면 invalid_input, 두 번째면 forbidden이다"
    outcomes:
      - id: floated
        observe: ["screen:browser-oauth-popup"]
      - id: docked
        observe: ["screen:browser-popup-new-tab"]
      - id: popup-blocked
        observe: ["screen:browser-popup-blocked"]
        when: "목적지는 허락되지만 사용자 입력이 5000ms 안에 없다"
      - id: denied-scheme
        when: "목적지가 scheme·credentials·읽을 수 없는 모양으로 막혔다(입력이 있어도 OS로 넘기지 않는다)"
      - id: os-handoff
        observe: ["process:os-opener"]
        when: "막힌 목적지가 mailto·tel이고 이 컴퓨터 사람의 입력이 5000ms 안이다(lophn이 넣은 input은 popup에는 세지만 여기에는 세지 않는다)"
      - id: adopt-wrong-window
        code: invalid_input
        when: "popup을 연 창이 아닌 창이 adopt를 불렀다, 또는 adopt 입력이 schema와 다르다"
        observe: ["response"]
      - id: adopt-twice
        code: forbidden
        when: "이미 adopt된 view를 다시 adopt한다, 또는 보낸 창이 등록된 desktop 창 본문 main frame이 아니다(browser IPC guard)"
        observe: ["response"]
    crosses_process: false
    risk: [sandbox]

  - id: browser-session-policy
    title: "browser partition의 permission, device, download를 정한다"
    actor: system
    entries: [system:browser-session-policy]
    boundary: [shell]
    code:
      - packages/shell/main/browser/session.ts
      - packages/shell/main/browser/permission.ts
      - packages/shell/main/browser/electron-session.ts
    docs: [architecture/browser-tab.md, products/change-log/0.17/browser-google-sign-in.yaml]
    steps:
      - "permission request·check는 clipboard-sanitized-write를 main frame의 http·https 요청에만 허락하고 나머지는 모두 거절한다"
      - "device permission은 전부 거절한다"
      - "will-download는 시작한 contents를 알고 사용자 입력이 fresh일 때만 받는다. 아니면 취소한다"
      - "받는 중인 download의 처음과 끝을 contents마다 세어 창에 알린다"
      - "요청 header와 UA에서 Electron/x만 빼고 lophn/x는 남긴다"
    outcomes:
      - id: permission-granted
        observe: ["response"]
        when: "clipboard-sanitized-write이고 main frame의 http·https 요청이다"
      - id: permission-denied
        observe: ["response"]
        when: "그 밖의 permission request·check다(device 포함하지 않는다)"
      - id: device-denied
        observe: ["response"]
        when: "device permission(카메라·마이크 등)을 요청했다. 전부 거절한다"
      - id: download-started
        observe: ["process:os-save-dialog", "screen:browser-tab"]
        when: "시작한 contents를 알고 사용자 입력이 fresh이다. 저장 dialog를 띄운다"
      - id: download-refused
        observe: ["request:outside-server"]
        when: "시작한 contents를 모르거나 사용자 입력이 fresh하지 않다(요청은 이미 나갔고 저장 dialog와 파일은 없다)"
      - id: user-agent-stripped
        observe: ["request:outside-server"]
        when: "UA(세션 설정과 요청 header)에서 Electron/x만 빠지고 앱 이름 token(lophn/x)은 남는다"
    crosses_process: false
    risk: [sandbox, twice-fixed]

  # ---- terminal bridge (core, coding agent의 $BROWSER) ----

  - id: browser-bridge-start
    title: "앱을 켤 때 terminal bridge의 run 폴더와 socket을 준비한다"
    actor: system
    entries: [system:browser-bridge-start]
    boundary: [shell, coding-agent]
    code:
      - packages/core/terminal-agents/bridge/run-dir.ts
      - packages/core/terminal-agents/bridge/shim.ts
      - packages/core/terminal-agents/bridge/socket.ts
      - packages/core/terminal-agents/bridge/bridge.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "data root의 instance lock을 잡은 core만 terminal-agents wiring의 prepare에서 run 폴더(core-<pid>)를 만든다. 같은 자리의 옛 실행 폴더는 자기 pid나 죽은 pid의 것만 지운다(옛 판 shell이 만들던 shell-<pid> 포함)"
      - "shim을 per-run 폴더에 쓴다(POSIX sh 0700, 공통 browser.js 0600, Electron Node로 실행)"
      - "bridge socket을 0600 file로 listen한다(Windows는 named pipe)"
      - "두 endpoint 경로가 ipcPathLimit을 넘으면 hook과 bridge를 끄고 로그 한 줄만 남긴다. 앱과 shell 탭은 그대로 뜬다"
      - "core가 끝날 때(closeWork) 자기 폴더만 동기로 지운다"
    outcomes:
      - id: listening
        observe: ["disk:run/core-<pid>/"]
        when: "lock을 가졌고 폴더, shim, socket이 모두 준비됐다(bridge가 켜졌다)"
      - id: no-lock
        observe: ["disk:run/core-<pid>/"]
        when: "data root의 instance lock을 얻지 못했다(두 번째 core). wiring까지 가지 않아 폴더를 만들지 않는다"
      - id: path-too-long
        observe: ["log:bridge"]
        when: "두 endpoint 경로가 ipcPathLimit을 넘는다. 폴더를 건드리지 않고 hook과 bridge를 끈다"
      - id: run-dir-failed
        observe: ["log:bridge"]
        when: "socket 디렉터리 계산이나 옛 실행 폴더 정리·mkdir·chmod가 실패했다. hook과 bridge를 끈다"
      - id: shim-failed
        observe: ["log:bridge"]
        when: "shim 쓰기가 실패했다. 폴더와 hook은 남고 bridge만 꺼진다"
      - id: listen-failed
        observe: ["log:bridge"]
        when: "bridge socket listen이 실패했다, 또는 0600 chmod가 실패했다. 폴더와 hook은 남고 bridge만 꺼진다"
      - id: cleaned
        observe: ["disk:run/core-<pid>/"]
        when: "core가 끝날 때 자기 폴더를 동기로 지운다(지우지 못하면 다음 실행이 정리한다)"
    crosses_process: false
    risk: [sandbox]

  - id: browser-bridge-request
    title: "터미널 child가 $BROWSER로 연 URL을 browser 탭으로 넘기거나 OS browser로 돌린다"
    actor: coding-agent
    entries: [system:browser-bridge-request]
    pre: [browser-bridge-start:listening]
    boundary: [shell, coding-agent]
    code:
      - packages/core/terminal-agents/bridge/bridge.ts
      - packages/core/terminal-agents/bridge/policy.ts
      - packages/core/terminal-agents/bridge/shim.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "shim이 {v:1, key, url} 한 줄을 b.sock에 쓴다. main은 JSON, v 1, key 64 hex, 8 KiB 이하를 검사한다"
      - "key 표에서 그 key를 묶은 terminal을 찾는다. 없으면 declined다"
      - "설정 shell.browser.web_links·local_links를 main이 요청마다 core settings/list로 읽는다. browser_tab이 아니면 declined다"
      - "desktop 앱이 붙어 있으면 core가 그 터미널의 project에 browser 탭 열기(tab_open)를 host queue에 넣고 pane으로 답한다. 앱이 붙어 있지 않으면 declined다"
      - "shim은 pane이면 끝내고, declined·접속 실패·3초 초과면 BROWSER와 LPN env를 지운 env로 xdg-open·open·cmd start를 부른다"
    outcomes:
      - id: pane
        observe: ["screen:browser-bridge-pane", "response"]
        when: "key가 묶인 terminal이 있고 설정이 browser_tab이고 창의 ack가 1500ms 안에 opened true로 왔다"
      - id: declined
        observe: ["response", "process:os-opener"]
        when: "요청 줄이 검사에 못 맞다(JSON·v 1·key 64 hex·8 KiB), key가 묶인 terminal이 없다, 설정이 browser_tab이 아니다, 열린 창이 없다, 1500ms 안에 ack가 없다(ack가 거절된 것 포함). shim 쪽 접속 실패·3초 초과도 같은 OS opener로 간다"
      - id: os-opener-direct
        observe: ["process:os-opener"]
        when: "relayable 검사를 못 지난 target(http·https가 아니거나 userinfo가 있는 것)은 main에 묻지 않고 바로 OS opener에 넘긴다"
    crosses_process: true
    risk: [sandbox]
    unclear:
      - "shim은 relayable이 아닌 target도 openWithSystem으로 OS opener에 넘긴다(scheme 검사가 없다). 파일이나 javascript: 같은 target이 열릴 수 있는지 의도 확인이 필요하다"

  - id: browser-terminal-link
    title: "terminal에서 Ctrl·Cmd로 누른 link를 browser 탭이나 OS browser로 연다"
    actor: person
    entries: [ui:terminal-link-open]
    uses:
      - ipc:shell:terminal-link
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/terminal.ts
      - packages/shell/main/desktop/terminal-link.ts
      - packages/shell/renderer/workspace/kinds/terminal.tsx
    docs: [architecture/browser-tab.md]
    steps:
      - "terminal의 link 클릭(Ctrl·Cmd-click)이 shell:terminal-link로 main에 온다. main은 창이 등록된 desktop 본문인지 보고 입력 schema(8192자 이하)를 본다"
      - "http·https 절대 URL이고 userinfo가 없는 것만 다음으로 간다. 그 밖은 아무 일도 하지 않는다"
      - "설정 target(shell.browser.web_links·local_links)이 browser_tab이면 main이 tab으로 답하고 창이 그 터미널 탭 옆에 browser 탭을 연다"
      - "설정이 system_browser면 main이 OS browser로 연다"
    outcomes:
      - id: browser-tab
        observe: ["screen:browser-bridge-pane"]
        when: "설정이 browser_tab이다. 누른 창이 그 터미널 탭 옆에 연다"
      - id: system-browser
        observe: ["process:os-browser"]
        when: "설정이 system_browser다"
      - id: dropped
        observe: ["response"]
        when: "http·https 절대 URL이 아니거나 userinfo가 있다. 아무 일도 하지 않는다"
      - id: invalid-input
        code: invalid_input
        when: "terminal link 입력이 schema와 다르다(url이 8192자를 넘는 것 포함)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(terminal IPC guard)"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]
    unclear:
      - "openLink은 http·https가 아닌 URL을 아무 흔적 없이 버린다. 문서는 조용히 사라지는 URL이 없다고 적었으므로 의도인지 확인이 필요하다"

  - id: project-clone
    title: "이 기계에 없는 project를 git URL에서 받아 등록한다"
    actor: agent
    entries: [route:projects/clone]
    uses: [route:projects/create]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/clone/clone.ts
      - packages/core/projects/add.ts
      - packages/core/projects/clone/runner.ts
      - packages/core/projects/clone/setting.ts
      - packages/core/main/daemon/wiring/project-clone.ts
      - packages/protocol/projects/clone-api.ts
    steps:
      - "user·agent만 부른다(agent는 lophn project clone, 사람은 desktop 목록 menu의 [Clone to this computer]가 shell:machines-clone-here로). URL에 자격(https의 userinfo, user:pass@)이 있으면 git을 띄우기 전에 invalid_input으로 거절한다(remote 설정에 token이 남는다)"
      - "identity는 사람(user)만 준다(창의 [Clone to this computer]). agent가 주면 git을 띄우지 않고 forbidden이다. agent의 clone은 새 id로 등록되고 자동 match가 remote key로 잇는다. identity를 주었고 그 id를 가진 project의 첫 폴더가 이 기계에 있으면 받지 않고 그 project를 cloned false로 돌려준다. 그 id를 이 기계의 project가 지금 갖지만 폴더를 잃었거나 옛 identity로 가지면(사람이 나눴다) git을 띄우지 않고 conflict(identity_in_use, details.project)다"
      - "부모 폴더는 parent, 없으면 설정 projects.folder(사람이 처음 한 번 정한다. 값에 기계 id를 붙이지 않는다)다. 없거나 폴더가 아니면 parent를 안 준 경우 projects_folder_unset, 준 경우는 그냥 invalid_input이다. 설정이 비었거나 그 폴더가 없어졌을 때 parent가 폴더이면 설정에 기억한다"
      - "폴더 이름은 name이나 URL 마지막 조각에서 .git을 뗀 것이다. /, \\, .., 빈 글은 invalid_input이다. <부모>/<이름>이 이미 있으면 아무것도 쓰지 않고 conflict(target_exists)다"
      - "<부모>/.lophn-clone-<random>에 git clone한다. 이 기계의 git 설정(credential helper, ssh)을 그대로 쓰되 GIT_TERMINAL_PROMPT=0 같은 env로 묻는 창 없이 바로 실패하게 한다. 10분이 넘으면 멈춘다. 실패하면 임시 폴더를 지우고 stderr로 가른다: 자격이면 git_auth와 사람이 풀 명령(gh auth login, ssh -T git@host, 그 밖은 git clone <url>), git이 없으면 git_not_found, 시간 초과면 timeout, 그 밖은 git_failed와 stderr 끝 줄"
      - "rename 바로 앞에 대상이 아직 없는지 다시 보고(생겼으면 임시 폴더를 지우고 conflict target_exists) rename한다. 받은 저장소의 file을 읽지 않는다"
      - "project.create를 machine:projects-clone 자격으로 낸다. identity를 주었으면 그 id로 등록해 받자마자 다른 기계의 project와 같은 project다. title은 title이나 폴더 이름이고 slug는 project-add와 같은 규칙으로 title에서 만들어 겹치면 번호를 붙여 다섯 번까지 해 본다. 실패하면 받은 폴더는 지우지 않고(받은 것을 잃지 않게) 오류에 path를 싣는다"
    outcomes:
      - id: cloned
        observe: ["disk:project-folder", "ledger:projects", "response"]
      - id: already-here
        when: "identity가 가리키는 project의 첫 폴더가 이 기계에 있다. 받지도 쓰지도 않는다"
        observe: ["response"]
      - id: folder-unset
        code: invalid_input
        when: "parent를 주지 않았고 설정 projects.folder가 비었거나 폴더가 아니다(details.reason projects_folder_unset). 에이전트가 사람에게 폴더를 한 번 묻고 parent로 준다"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "URL에 자격이 있다, parent가 폴더가 아니다, 폴더 이름이 /, \\, .., 빈 글이다"
        observe: ["response"]
      - id: target-exists
        code: conflict
        when: "<부모>/<이름>이 이미 있다(details.reason target_exists, details.path). 그 안에 아무것도 쓰지 않는다"
        observe: ["disk:project-folder", "response"]
      - id: identity-in-use
        code: conflict
        when: "identity를 이 기계의 project가 폴더를 잃은 채 갖거나 옛 identity로 갖는다(details.reason identity_in_use, details.project). 받지 않는다"
        observe: ["response"]
      - id: auth
        code: unavailable
        when: "이 기계의 git이 그 저장소를 읽을 자격이 없다(details.reason git_auth, details.command). 임시 폴더는 지운다. 사람에게 명령을 보이고 기다린다"
        observe: ["response"]
      - id: git-not-found
        code: unavailable
        when: "git 실행 file이 없다(details.reason git_not_found)"
        observe: ["response"]
      - id: timeout
        code: unavailable
        when: "받기가 10분을 넘었다(details.reason timeout)"
        observe: ["response"]
      - id: git-failed
        code: unavailable
        when: "그 밖의 git 실패(details.reason git_failed, stderr 끝 줄)"
        observe: ["response"]
      - id: register-failed
        code: conflict
        when: "받은 폴더를 등록하지 못했다(slug 이름이 다섯 번 다 겹쳤거나 project.create가 거절했다). 폴더는 남고 details.path가 온다"
        observe: ["disk:project-folder", "response"]
      - id: forbidden
        code: forbidden
        when: "actor가 user·agent가 아니다(route 검사), 또는 agent가 identity를 주었다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss, sandbox]
    docs: [architecture/project-identity.md]

  - id: artifacts-delete
    title: project 또는 app의 artifact 폴더를 삭제하고 필요 시 인계 follow-up을 남긴다
    actor: person
    entries: [route:artifacts/delete]
    boundary: [projects, core-api]
    code: [packages/core/projects/artifacts/mod.ts]
    steps:
      - 대상 폴더를 검증해 삭제하고 clean_up 지정에 따라 후속 정리를 인계한다
    outcomes:
      - id: deleted
        observe: [disk:artifact-folder, response]
      - id: not-found
        code: not_found
        when: artifact가 없다
        observe: [response]
      - id: forbidden
        code: forbidden
        when: 권한 밖 작업 공간이다
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/artifact.md]
    declared_only: [invalid_input, unavailable]

  # ---- project commands (core) ----

  - id: project-commands-list
    title: "project의 명령 정의, 현재 실행 상태, agent 설정을 읽는다"
    actor: person
    entries: [route:project_commands/list]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/store.ts
      - packages/protocol/projects/project-commands.ts
    steps:
      - "ledger에서 project의 명령 정의와 agent 설정을 읽고 메모리 runtime의 실행 상태를 붙인다"
      - "env 값은 로컬 사람 자격이 include_env: true로 부른 경우에만 싣고, agent와 원격 기기에는 키 이름(env_keys)만 남긴다"
      - "원격 기기이면 remote_grants의 터미널 입력 허락 여부를 can_run으로 싣는다"
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출 자격이 허용되지 않는다"
        observe: [response]
    crosses_process: false
    risk: [secret, permission]
    docs: [architecture/project-command.md]

  - id: project-commands-detect
    title: "project 등록 폴더에서 읽기 전용으로 명령 후보를 감지한다"
    actor: person
    entries: [route:project_commands/detect]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/commands/detect.ts
      - packages/core/projects/commands/handlers.ts
    steps:
      - "project의 등록 폴더를 읽고 package.json, Makefile, justfile, 타 도구 설정에서 후보를 뽑아 already_registered와 unsupported_notes를 함께 돌려준다. 어떤 파일도 쓰지 않는다"
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "허용되지 않은 호출자다"
        observe: [response]
    crosses_process: false
    docs: [architecture/project-command.md]

  - id: project-commands-mutate
    title: "project 명령 정의를 더하거나 고치거나 지우거나 순서를 바꾸거나 가져온다"
    actor: person
    entries:
      - route:project_commands/add
      - route:project_commands/update
      - route:project_commands/remove
      - route:project_commands/reorder
      - route:project_commands/import
    uses: [route:project_commands/store, route:tool_gate/check]
    boundary: [projects, approvals, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/store.ts
    steps:
      - "agent가 agents·ask_before_run 칸을 넣거나 reorder·import를 부르면 forbidden으로 거절한다"
      - "agent의 add·update·remove는 project의 approve_agent_writes가 켜져 있으면 tool_gate/check에 project_command_definition으로 사람 승인을 거치고, 대기 중 정의가 바뀌면 conflict로 쓰지 않는다"
      - "project_commands/store로 ledger를 갱신하고 ProjectCommandsChanged를 발행한다"
    outcomes:
      - id: ok
        observe: [ledger:project_commands, event:ProjectCommandsChanged, response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema·상한(50개)에 어긋난다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project 또는 대상 명령 id가 없다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "중복 id이거나 승인 대기 사이 정의가 바뀌었다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent가 잠긴 정책 칸을 바꾸려 했거나, 승인 거절·needs_approval이다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "writer 또는 승인 gate를 사용할 수 없다"
        observe: [response]
    crosses_process: false
    risk: [permission, secret]
    docs: [architecture/project-command.md, architecture/approval.md]

  - id: project-commands-set-settings
    title: "사람이 project commands의 agent 정책(허용 agent, 실행 전 묻기, 정의 쓰기 승인)을 바꾼다"
    actor: person
    entries: [route:project_commands/set_settings]
    uses: [route:project_commands/store]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/store.ts
    steps:
      - "사람 자격만 허용하고 agent 호출은 forbidden으로 거절한다"
      - "project_commands/store로 project_command_settings를 저장하고 ProjectCommandsChanged를 발행한다"
    outcomes:
      - id: ok
        observe: [ledger:project_command_settings, event:ProjectCommandsChanged, response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격 등 사람이 아닌 호출이다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "writer를 사용할 수 없다"
        observe: [response]
    crosses_process: false
    risk: [permission]
    docs: [architecture/project-command.md]

  - id: project-commands-run
    title: "project 명령을 전용 PTY에서 실행한다"
    actor: person
    entries: [route:project_commands/run]
    uses: [route:tool_gate/check]
    boundary: [projects, core, approvals, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/runtime.ts
    steps:
      - "원격 기기 호출은 remote_grants의 터미널 입력 허락을 확인해 없으면 forbidden으로 거절한다"
      - "agent 호출은 허용 agent 목록을 검사하고, ask_before_run이 켜진 명령은 tool_gate/check에 project_command로 승인을 거친다"
      - "실행 직전 folderOfCwd로 기준 등록 폴더 아래 realpath를 검사하고(symlink 탈출 시 invalid_input), 이미 돌고 있으면 conflict를 낸다"
      - "전용 PTY를 열어 상태 변화를 ProjectCommandRunChanged로 발행하고, wait: true인 action은 종료까지 기다려 redaction된 출력 꼬리를 함께 돌려준다"
    outcomes:
      - id: started
        observe: [event:ProjectCommandRunChanged, response]
      - id: invalid-input
        code: invalid_input
        when: "입력 오류이거나 cwd가 등록 폴더 밖·symlink 탈출이다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project 또는 명령 id·이름이 없다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "명령이 이미 starting 또는 running 중이다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "원격 기기에 터미널 입력 허락이 없거나, 허용되지 않은 agent이거나, 실행 승인이 거절됐다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY host가 없거나 기동에 실패했다"
        observe: [response]
    crosses_process: true
    risk: [permission, sandbox, secret]
    docs: [architecture/project-command.md, architecture/terminal-agent.md, architecture/approval.md]

  - id: project-commands-stop
    title: "도는 project 명령 하나 또는 전체를 프로세스 트리째 멈춘다"
    actor: person
    entries: [route:project_commands/stop]
    boundary: [projects, core, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/runtime.ts
    steps:
      - "원격 기기 호출은 터미널 입력 허락을 확인하고, agent 호출은 허용된 명령만 멈춘다"
      - "명령별 직렬 큐에서 전용 PTY 프로세스 그룹에 SIGTERM → 3초 → SIGKILL(Windows taskkill /T /F)을 보내 stopped 상태로 전이한다. dismiss: true면 끝난·실패 실행 상태와 터미널 참조까지 정리하고 idle로 발행한다"
    outcomes:
      - id: stopped
        observe: [event:ProjectCommandRunChanged, response]
      - id: invalid-input
        code: invalid_input
        when: "command와 all이 모두 없거나 입력이 틀리다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project 또는 대상 명령이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "원격 기기 허락 없음 또는 허용되지 않은 agent다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY 중지를 확인하지 못했다"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/project-command.md]

  - id: project-commands-restart
    title: "project 명령을 직렬 큐에서 멈춘 뒤 같은 전용 PTY 참조로 다시 시작한다"
    actor: person
    entries: [route:project_commands/restart]
    uses: [route:tool_gate/check]
    boundary: [projects, core, approvals, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/runtime.ts
    steps:
      - "원격 기기 허락과 agent 권한·실행 전 승인(ask_before_run)을 확인한다"
      - "명령별 직렬 큐에서 실행 중이면 멈춘 뒤 같은 terminal_ref(generation + 1)로 다시 시작한다"
    outcomes:
      - id: restarted
        observe: [event:ProjectCommandRunChanged, response]
      - id: invalid-input
        code: invalid_input
        when: "입력 오류이거나 cwd realpath가 등록 폴더 밖이다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project 또는 대상 명령이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "원격 기기 허락 없음, 허용되지 않은 agent, 또는 승인 거절이다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY 중지 또는 재기동에 실패했다"
        observe: [response]
    crosses_process: true
    risk: [permission, sandbox]
    docs: [architecture/project-command.md]

  - id: project-commands-logs
    title: "명령의 실행 중 링버퍼 또는 종료 후 보존 꼬리 로그를 마스킹해 읽는다"
    actor: person
    entries: [route:project_commands/logs]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/commands/handlers.ts
      - packages/core/projects/commands/runtime.ts
      - packages/core/projects/commands/log-buffer.ts
    steps:
      - "원격 기기 호출은 터미널 입력 허락을 확인한다"
      - "해당 명령의 로그 버퍼(종료 후 최대 200줄/32 KiB)에서 요청 줄 수를 잘라 정의의 env 값과 제품 redactor로 가려 돌려준다"
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "project 또는 대상 명령이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "원격 기기에 터미널 입력 허락이 없거나 허용되지 않은 agent다"
        observe: [response]
    crosses_process: false
    risk: [secret, permission]
    docs: [architecture/project-command.md]

  - id: project-commands-store
    title: "내부 machine 명령으로 project_commands와 project_command_settings 표를 갱신한다"
    actor: system
    entries: [route:project_commands/store]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/commands/store.ts
      - packages/core/projects/commands/schema.ts
    steps:
      - "machine:project-commands 자격으로 project 존재 여부를 확인하고 project_commands와 project_command_settings 표를 하나의 tx로 갱신한다"
    outcomes:
      - id: ok
        observe: [ledger:project_commands, ledger:project_command_settings, response]
      - id: not-found
        code: not_found
        when: "project가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine:project-commands 자격이 아니다"
        observe: [response]
    crosses_process: false
    docs: [architecture/project-command.md]
    declared_only: [invalid_input, conflict]
