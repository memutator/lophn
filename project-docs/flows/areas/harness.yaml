      - "탭이 없으면 not_found. 주인이 다른 탭(다른 session이 연 탭, agent가 연 탭을 사람이, 사람이 연 탭을 agent가)이면 forbidden"
      - "탭을 표에서 빼고 tab_close 요청을 그 탭의 workspace로 넣는다"
      - "화면에서 닫는 것은 shell host take가 가져가 한다. 터미널 탭을 닫으면 PTY도 닫힌다"
    outcomes:
      - id: accepted
        observe: [response]
      - id: not_found
        code: not_found
        when: "탭이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "주인이 다른 탭이거나, agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: false
    docs: [architecture/terminal-agent.md, architecture/workspace-layout.md]

