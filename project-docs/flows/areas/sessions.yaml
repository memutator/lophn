  # ---- 메시지 넣기와 queue ----
  - id: session-send
    title: "사람 메시지를 session에 넣는다(도는 turn이 없으면 다음 turn)"
    actor: person
    entries: [route:messages/send]
    boundary: [agent-sessions, router]
    when: "도는 turn이 없거나 delivery가 next_turn일 때. steer로 보내도 도는 turn이 없으면 여기로 온다"
    code:
      - packages/core/lophn-agent/session/message-commands.ts
      - packages/core/lophn-agent/session/message-body.ts
      - packages/core/lophn-agent/session/rewind/checkpoints.ts
      - packages/core/lophn-agent/run-loop/queue.ts
    steps:
      - "부르기 전 앞 단계가 글을 검사하고 redaction해 blob으로 준비한다. 검사에 걸리거나 준비가 안 되면 여기서 끝난다(invalid_input, unavailable)."
      - "session이 받을 수 있는지 본다. 없으면 not_found다. archive됐거나 workspace가 보관됐으면 conflict다."
      - "사람이 아니면 forbidden이다(writeHuman의 requireUser). 같은 id를 같은 내용으로 다시 보내면 저장과 배달 없이 같은 결과를 돌려준다. 같은 id에 다른 내용이면 conflict다. 처음 접수하는 메시지에 seen(화면이 아는 마지막 사람 메시지, null은 하나도 못 봄, 없으면 검사하지 않음: CLI·run·relay)이 있으면 같은 tx 안에서 그 session의 사람 메시지(`!` 기록과 rewind가 숨긴 것은 뺀다) 가운데 seen 뒤의 것이 있는지 본다. 있으면 아무것도 넣지 않고 conflict(details.reason changed_elsewhere)다. seen이 이 session의 메시지가 아니면 invalid_input이다."
      - "도는 turn이 있고 delivery가 steer면 steer로, 아니면 next_turn으로 정한다."
      - "메시지 행과 본문 blob 참조를 같은 tx에 쓴다. next_turn이면 checkpoint를 만들고, 첫 사람 요청이면 자동 제목을 정한다(steer는 둘 다 하지 않는다)."
      - "Router(from human)로 queue에 넣는다. next_turn은 줄에 쌓이고, steer는 steering 목록에 들어간다. 이 tx 안에서 실패하면 쓴 메시지도 함께 되돌아간다."
      - "commit 뒤 MessageReceived를 낸다(steer 여부 포함)."
    outcomes:
      - id: ok
        observe: [ledger:messages, ledger:checkpoints, ledger:sessions, event:MessageReceived, response]
        when: "next_turn으로 접수했다(도는 turn이 있으면 queue에 쌓여 ACP의 queued로 보인다), 또는 같은 id·같은 내용의 재전송이라 이전 결과다"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(writeHuman의 requireUser), 또는 준비 참조의 주체가 보낸 자격과 다르다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "메시지 content가 계약 밖이다(준비 단계의 schema 검사 또는 redaction 뒤 상한 초과), 또는 준비된 본문 참조가 없다(준비가 사라졌다)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "redaction이 끝나지 않았거나 blob 준비 경로가 없거나 준비가 실패했다(준비 단계에서 막는다)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다, 또는 router가 받는 길을 찾지 못했다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "session이 archive됐거나 workspace가 보관됐다(새 입력을 받지 않는다), 같은 id가 다른 내용으로 쓰였다, 또는 router가 닫힌 session으로 거절했다"
        observe: [response]
      - id: changed-elsewhere
        code: conflict
        when: "seen 뒤에 다른 사람 메시지가 있다(다른 기기가 먼저 보냈다). 메시지·turn·queue가 하나도 생기지 않고 details.reason이 changed_elsewhere다"
        observe: [response]
      - id: internal
        code: internal
        when: "checkpoint 행을 쓰고 다시 읽지 못했다(내부 오류, tx가 되돌아간다)"
        observe: [response]
    crosses_process: true
    refs: [T1]
    docs: [architecture/agent-chat.md, architecture/workspace-session.md]
    unclear: []

