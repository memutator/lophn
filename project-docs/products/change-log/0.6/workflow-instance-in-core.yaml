id: workflow-instance-in-core
version: 0.6.0
title: "workflow instance를 core에서 돌린다 (화면 전)"
modules: [packages/protocol, packages/core/workflows, packages/core/router, packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/main, packages/coding-agent, packages/design, packages/shell/main, packages/shell/renderer, tools, tests]
checked: [tool-check, architecture-testing, architecture-activation, architecture-app-call, architecture-browser-tab, architecture-appearance, tool-context-review, tool-worktree-prep, tool-e2e, tool-test-live, tool-dev, tests-support, tool-models-snapshot]
change: |
  전:
  - 사람과 agent가 step을 넘기며 도는 일을 적을 곳도, 한 번 돌린 것(instance)을 추적할 곳도 없었다.
  - kit의 `GraphDiagram` node는 이름만 있었고, 봉한 artifact view는 kit을 쓸 길이 없었다.
  후:
  - 새 module `packages/core/workflows`와 protocol `packages/protocol/workflows`. 정의는 `<data>/projects/<prj>/workflows/<name>/`의 `workflow.yaml`(lophn은 `kind`, `participants`, `steps`의 `by`·`with`·`prompt`·`in`·`out`·`next`만 읽는다), `workflow.md`, 고르는 artifact(`artifacts/static`, `artifacts/instance`)다. 틀린 선언은 그 workflow만 빠지고 이유가 `workflow.list`에 보인다. `kind: flow`는 시작하지 못한다.
  - route: `ListWorkflows`, `StartWorkflow`(user만), `ReportWorkflow`, `EditWorkflow`, `StopWorkflow`(user만), `ReadWorkflowInstance`, `ListWorkflowInstances`. 기록은 `workflow_instances`와 고치지도 지우지도 않는 `workflow_lines` 표다(줄 여덟 종류: started, report, edit, handed, not_handed, ended, stopped, lophn_restarted). core 안 machine 자격만 쓰는 command `CreateWorkflowInstance`, `ApplyWorkflowChange`가 같은 tx에서 상태를 바꾸고 줄을 남기고 Router로 step 메시지를 넣는다. commit 뒤 남지 않는 event `WorkflowInstanceChanged`가 나간다.
  - lophn은 말한 대로 기록하고 전할 뿐이다. 순서, 결과, 고칠 자격을 판정하지 않는다. `ended`는 기록일 뿐이라 step을 실제로 넘긴 report나 `hand_now`가 오면 다시 running이 된다. 사람이 멈춘 `stopped`만 넘기지 않고 고치기를 `conflict`로 거절한다(report는 줄만 남긴다). 담당을 풀 수 없으면(harness, 없는 이름, 없는 step) 넘기지 않고 `not_handed` 줄을 남긴다.
  - 새 입력 종류 `step`: Router가 받는 session에 `<lophn-step instance step>` tag로 넣고 unattended 표시를 싣는다. call 행이 없다. `messages` 표에 `step_instance`, `step_name` 열이 제자리에서 더해졌다. 켤 때 넘겼는데 turn이 가져가지 않았거나 restart로 끊긴 step은 다시 넣지 않고 `lophn_restarted` 줄을 남긴다.
  - agent tool `workflow.list`, `workflow.get`, `workflow.report`, `workflow.edit`을 모든 role이 받는다. 시작하는 tool은 없다. 모든 role의 제품 규칙에 step tag와 report 쓰는 법이, PM 지침에 workflow 책임과 내장 skill `guide-workflows`가 들어갔다. PM의 place 정보에 `Workflows folder:` 줄이 생기고, project의 `workflows/`는 그 project의 PM만 file tool로 쓴다.
  - CLI: `lophn workflow start|report|stop|show`(user token).
  - kit `GraphDiagram` node에 `status`(label, tone)와 `note`가 생겼다. component는 상태 값의 뜻을 모른다. renderer build가 판을 고정한 kit IIFE(`dist/artifact-kit/entry.js`·`entry.css`, 전역 `LophnKit.renderGraph`)를 같이 만든다. 봉한 scheme이 workflow artifact에 `_lophn/kit.js`·`kit.css`와 instance view의 `data/_instance.json`을 내주고, instance가 바뀌면 그 view를 다시 load한다. artifact 탭이 workflow artifact를 연다.
why: |
  큰 일은 사람과 agent 여럿이 step을 넘기며 돈다(예: eval loop). 정책과 예외는 workflow 안의 agent가 다루고 lophn program은 최대한 약하게 둔다(`project-docs/products/roadmap/workflow.md` "원칙").
decisions:
  - by: person
    text: |-
      시작과 멈춤은 사람이 한다(화면, CLI). agent가 시작하는 tool은 두지 않는다. (roadmap)
  - by: agent
    text: |-
      정본은 core 표다. instance는 시작할 때 선언의 step을 옮겨 갖고 그 뒤에는 agent가 고친다.
  - by: agent
    text: |-
      report 글과 `hand_now` 글은 8 KiB(UTF-8) 이하다. 긴 결과는 file에 두고 경로를 적는다.
follow_up: |
  개발 data는 `messages`의 새 열 때문에 지우고 새로 만든다(migration 없음). 모든 role의 prompt cache가 한 번 깨지고 PM session은 place 정보 한 줄로 한 번 더 깨진다. 화면(workflow 탭, project sidebar의 activity bar)은 wireframe 승인 뒤 같은 계획이 잇는다. architecture 문서와 context 조각은 계획이 끝날 때 고친다.
