id: tab-switch-focuses-composer
version: 0.23.45
title: "탭을 옮기면 대화 입력칸에 focus가 간다"
modules: [packages/shell/renderer]
checked: []
change: |
  전:
    - tab 줄을 눌러 탭을 옮기면 focus가 tab 줄에 남아 대화 key(PageUp·PageDown·Ctrl+End)와 글 입력이 그 탭에 닿지 않았다.
    - `claude gui`로 터미널 탭이 GUI로 바뀌면 xterm이 사라지며 focus가 body로 떨어졌다.
  후:
    - 탭 본문이 알린 `[data-tab-focus]`(대화 입력칸)를 먼저 focus한다. tab 줄 click, Ctrl+Tab·Ctrl+PageDown, pane의 ‹ ›로 탭을 옮겨도 입력칸에 focus가 간다.
    - GUI로 바뀌는 탭이 지금 보고 있는 탭이면 그 입력칸에 focus가 간다.
why: |
  GUI chat을 열자마자나 다른 탭에서 돌아왔을 때 바로 칠 수 있어야 하고, 대화 scroll key도 focus가 대화 안에 있어야 동작한다.
decisions:
  - text: |
      tab을 고르면 먼저 볼 자리를 tab 본문이 `[data-tab-focus]`로 알린다. 모든 탭의 첫 focusable로 두지 않고 marker를 둔 것은 대화 탭의 입력칸이 머리 단추보다 먼저 와야 하기 때문이다.
    by: agent
