      - "bundle 폴더와 file을 realpath로 풀어 file이 폴더 안일 때만 읽는다(앱 화면 file과 같은 규칙). 밖을 가리키는 symlink, 폴더, 8 MiB 넘는 file은 없는 file과 같다"
