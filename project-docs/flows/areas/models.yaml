area: models
flows:

  # ---- 설정 file (settings.json) ----

  - id: settings-read
    title: "설정 선언과 사람이 고른 값을 읽는다"
    actor: person
    entries: [route:settings/list]
    boundary: [config]
    code: [packages/core/config/routes.ts, packages/core/config/store.ts]
    steps:
      - "요청의 key 목록으로 선언(registry)을 거르고 없으면 전부 낸다"
      - "선언의 type을 JSON Schema로 바꾸고 설명, locked(사람만 바꾼다), 기본값과 사람이 고른 값(chosen)을 붙인다. 파일에 없는 값은 chosen이 없다"
      - "folder 설정(shell.themes)은 folders에 따로 낸다: 설명, folder 이름, 항목의 JSON Schema, 항목(id와 값), 읽지 못한 file(이름과 이유)"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
    crosses_process: false
    refs: []
    docs: []
    declared_only: [unavailable]
    unclear:
      - "settings/list가 unavailable을 선언하지만 handler는 메모리의 registry와 chosen만 읽어 내지 않는다. 선언을 고칠 곳이다"

  - id: settings-update
    title: "설정 값을 바꾼다"
    actor: person
    entries: [route:settings/update]
    boundary: [config]
    code: [packages/core/config/store.ts, packages/core/config/routes.ts, packages/core/config/registry.ts, packages/core/config/shell-settings.ts]
    steps:
      - "입력 모양을 본다. 부른 쪽이 기기(principal `device:`)이고 `remote.`로 시작하는 key가 하나라도 있으면 아무것도 쓰지 않고 forbidden이다. 부른 쪽이 agent이고 locked인 key가 하나라도 있으면 아무것도 쓰지 않고 그 key를 locked로 돌려준다. 사람(Settings 화면)은 지난다"
      - "부른 쪽이 agent이고 선언이 `approval: \"person\"`인 key(folder.destinations)가 있으면 그 값의 타입·뜻 검사를 먼저 하고, 바뀜을 선언의 describe로 줄(이름과 전체 경로)로 만들어 agent 자격 그대로 `tool_gate/check`에 `setting`으로 묻고 사람의 답을 기다린다. 묻는 자리는 입력의 `tool_call`과 credential의 session·turn이다. 허락이면 기다린 동안 바뀜이 그대로인지 다시 보고 그 값을 그대로 쓴다. 허락은 이 호출 하나에만 쓰이고 남지 않는다. 사람 자격은 묻지 않는다"
      - "선언에 없는 key나 타입·범위가 틀린 값이 하나라도 있으면 파일을 읽지 않고 rejected 목록만 돌려준다. `<folder key>.<id>`는 folder 설정의 항목이고 id가 규칙에 안 맞으면 없는 key다"
      - "쓰기 직전에 settings.json을 다시 읽는다. 못 읽거나 JSON이 아니면 unavailable이다. 그 raw object에서 바뀐 key만 덮는다. 선언을 지운 key나 모르는 key는 파일에 남는다. 항목 변경이 닿는 folder도 다시 읽는다"
      - "쓰려는 항목과 같은 이름의 file이 이미 있는데 읽지 못한 것이거나(JSON이 깨졌다 등) 대소문자만 다른 이름이면 거절한다. 256 KB를 넘는 항목도 거절한다. 변경을 모두 얹은 값으로 뜻 검사를 한다(없는 theme id, 모드가 다른 theme, 쓸 수 없는 theme, 모르는 단축키 id와 chord, 글꼴 이름). 하나라도 거절이면 아무것도 쓰지 않고 이유(message)와 함께 rejected로 돌려준다"
      - "쓰는 순서는 항목 쓰기, settings.json, 항목 지우기다. 항목은 `<root>/<folder>/<id>.json`을 임시 file과 rename으로 쓰고, unset은 그 file 하나를 지운다. settings.json은 덮은 내용이 파일과 같으면 쓰지 않고, 다르면 같은 폴더의 임시 파일(0600)에 쓰고 rename한다. 실패하면 unavailable이다"
      - "값이 실제로 바뀐 key가 있을 때만 StateChanged(settings)를 낸다. 쓰되 알릴 것(theme의 버린 색, 모자란 대비)은 notes로 돌려준다"
    outcomes:
      - id: changed
        observe: ["disk:<root>/settings.json", "disk:<root>/themes/<id>.json", "event:StateChanged", "response"]
        when: "선언에 맞는 값이 실제로 바뀐 key가 있다. event는 바뀐 key 목록을 싣는다. 항목을 쓰거나 지웠으면 그 file만 바뀐다. notes가 같이 올 수 있다"
      - id: unchanged
        when: "바꿀 값이 지금 값과 같다(없는 key를 unset한 것 포함). 파일을 쓰지 않는다"
        observe: ["response"]
      - id: cleared-invalid
        when: "선언에 맞지 않아 무시되던 key를 unset해 파일만 바뀌었다. chosen은 그대로라 event가 없다"
        observe: ["disk:<root>/settings.json", "response"]
      - id: rejected
        when: "선언에 없는 key, 틀린 타입·범위, 뜻 검사가 거절한 값, 256 KB를 넘는 항목, 사람이 둔 읽지 못한 file과 이름이 같은 항목이 하나라도 있다. ok 응답의 rejected 목록이고 아무 file도 쓰지 않는다"
        observe: ["response"]
      - id: locked
        when: "agent가 locked인 key(승인 규칙, call 정책, MCP server, skill, extension 켜기, turn 한도, coding agent 실행 명령어 등)를 바꾸려 했다. ok 응답의 rejected 목록(reason locked)이고 같이 보낸 변경도 쓰지 않는다"
        observe: ["response"]
      - id: needs-approval
        when: "agent가 approval 설정을 바꾸려 했는데 허락을 받지 못했다: 묻는 자리(tool_call, credential의 turn)가 없다, 사람이 거절했다(사람의 이유가 message에 실린다), unattended turn이나 팀 자식이라 Gate가 막았다, 기다림이 turn 끝·session 닫힘·재시작으로 풀렸다, 묻기가 실패했다, 사람이 결정하는 사이 그 설정이 바뀌었다. ok 응답의 rejected 목록(reason needs_approval)이고 아무것도 쓰지 않는다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "settings.json을 읽지 못했다(ENOENT 아님), JSON이 아니거나 object가 아니다(사람이 고칠 때까지 쓰지 않는다), 항목의 folder를 읽지 못했다, 같은 폴더 임시 파일 쓰기나 rename이 실패했다, 항목 file을 쓰거나 지우지 못했다. 실패하기 전에 쓴 것은 남고, 순서 때문에 settings.json이 없는 항목을 가리키지는 않는다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다(같은 key가 두 번 들어옴 포함)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
      - id: device-remote-refused
        code: forbidden
        when: "기기 자격(터미널 입력 허락이 있어도)이 `remote.*` key를 바꾸려 했다. 같이 보낸 다른 key도 쓰지 않는다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss, permission]
    refs: []
    docs: [architecture/settings.md, architecture/approval.md]
    unclear:
      - "settings.json 쓰기에는 revision 비교가 없다. 두 창이 같은 key를 바꾸면 마지막 쓰기가 이긴다. 목록 전체를 한 key에 싣는 화면(MCP 서버 배열)은 읽은 뒤 쓰기 사이에 다른 창이 바꾼 값을 지울 수 있다"

  - id: settings-file-watch
    title: "손으로 고친 settings.json과 folder 설정의 file을 다시 읽는다"
    actor: system
    entries: [system:settings-file-watch]
    boundary: [config]
    code: [packages/core/config/store.ts, packages/core/main/daemon/wiring/config.ts]
    steps:
      - "기동 때(store를 만들 때) settings.json을 한 번 읽어 chosen 값을 맞춘다. 선언에 없는 key나 틀린 값은 log만 남기고 그 key만 무시한다. JSON이 깨졌으면 chosen은 비어 있다"
      - "start에서 폴더 watch를 건다. 못 걸면 log만 남기고 신호를 받지 않는다"
      - "settings.json 신호는 100ms 묶음으로 한 번 다시 읽는다. 못 읽으면 log만 남기고 이전 값을 둔다. JSON이 깨졌거나 object가 아니면 이전 값을 두고 log만 남긴다"
      - "내용이 마지막으로 읽거나 쓴 것과 같으면 무시한다. 자기 쓰기가 여기다"
      - "내용이 달라졌으면 선언에 맞는 값을 chosen과 견줘 값이 바뀐 key만 StateChanged(settings)로 낸다. 바뀐 key가 없으면 아무것도 내지 않는다"
      - "folder 설정의 folder(`<root>/themes/`)는 없으면 만들고 `*.json`을 모두 읽는다. 이름이 id 규칙에 안 맞는 file, 256 KB를 넘는 file, JSON이 아닌 file, 모양이 틀린 file은 항목이 되지 않고 읽지 못한 file로 남는다. 고치거나 지우지 않는다"
      - "그 folder의 신호도 100ms 묶음으로 다시 읽어, 달라진 항목의 key(`shell.themes.<id>`)를 StateChanged(settings)로 낸다. 읽지 못한 file 목록이 달라지면 folder key를 낸다"
    outcomes:
      - id: loaded
        when: "기동 때 읽어 chosen을 맞췄다. 밖으로 내는 것은 없다"
        observe: []
      - id: changed
        when: "watch가 읽은 내용에서 선언에 맞는 chosen 값이 바뀐 key가 있다"
        observe: ["event:StateChanged"]
      - id: entry-changed
        when: "folder의 file이 생기거나 바뀌거나 없어져 항목이 달라졌다(사람이 둔 file 포함). 읽지 못한 file 목록만 달라져도 folder key로 알린다"
        observe: ["event:StateChanged"]
      - id: same-text
        when: "읽은 내용이 마지막으로 읽거나 쓴 내용과 같다(자기 쓰기 포함). folder는 항목이 그대로다"
        observe: []
      - id: same-values
        when: "내용은 달라졌지만 선언에 맞는 chosen 값은 그대로다"
        observe: []
      - id: rejected-key
        when: "선언에 없는 key나 틀린 값이 있다(기동이나 watch 때). 그 key만 기본값으로 두고 나머지는 적용한다"
        observe: ["log:settings"]
      - id: broken-json
        when: "JSON이 깨졌거나 object가 아니다. 이전 값을 그대로 두고 쓰기도 거절된다(사람이 고칠 때까지)"
        observe: ["log:settings"]
      - id: unreadable
        when: "settings.json을 읽지 못했다(ENOENT 아님). 이전 값을 그대로 둔다"
        observe: ["log:settings"]
      - id: watch-failed
        when: "settings 폴더를 watch하지 못했다. 이후 손 편집은 다음 기동 전까지 반영되지 않는다"
        observe: ["log:settings"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear: []

  # ---- MCP 서버 로그인 (agent-mcp-auth) ----

  - id: mcp-auth-begin
    title: "MCP 서버 로그인을 시작하고 browser에 열 주소를 받는다"
    actor: person
    entries: [route:agent-mcp-auth/begin]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-auth-control.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/lophn-agent/extensions/mcp-auth.ts]
    steps:
      - "입력 모양(서버 이름, client_id, scopes)을 본다. 소유자(workspace, agent)를 둘 다 적었으면 거절한다. workspace는 project·앱 id이거나 Home(`{kind: home}`)이고 전역 서버는 null이다"
      - "등록 서버 목록(전역, Home·project·앱, agent 정의)에서 (이름, 소유자)를 찾는다. 없거나 http가 아니거나 oauth2가 아니면 거절한다. 사람이 적은 client_id가 등록한 것과 같아야 한다"
      - "임의의 loopback port(127.0.0.1, port 0)에 callback listener를 연다. 열지 못하면 unavailable이다"
      - "발급자 metadata를 발급자 요청 대기열(agent runtime)로 받는다. 끝점을 찾지 못하면 발급자 아래 기본 끝점(/authorize, /token)을 쓴다. authorization 끝점이 https가 아니거나 URL이 아니면 listener를 닫고 거절한다"
      - "PKCE verifier와 무작위 state를 만들어 authorization 주소를 만든다. 시작 값은 메모리에만 있고 5분 시한이 걸린다. 이미 기다리는 시작이 있으면 conflict다"
      - "authorization 주소와 callback port를 돌려준다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "그 소유자에 등록되지 않은 서버다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다(서버 이름, client_id, scopes). 소유자를 둘 다 적었다. 등록된 서버가 http가 아니거나 oauth2가 아니다. client_id가 등록한 것과 다르다. authorization 끝점이 https가 아니거나 URL이 아니다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "이미 기다리는 시작이 있다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "loopback callback port를 열 수 없다(listen 실패) 또는 등록 서버 목록을 읽지 못했다(ledger 읽기 실패)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
    crosses_process: true
    refs: []
    docs: [architecture/agent-definition.md]
    unclear:
      - "callback port는 임의 port(0)다. 등록된 port를 쓰지 않아 EADDRINUSE로 인한 conflict는 나지 않는다. conflict는 시작 중복뿐이다"
      - "발급자 metadata 요청이 실패하면 기본 끝점으로 조용히 넘어간다. 발급자에 닿지 않아도 begin은 ok로 끝나고 browser에서 막힐 수 있다"

  - id: mcp-auth-finish
    title: "MCP 서버 로그인의 callback을 받아 token을 보관한다"
    actor: person
    entries: [route:agent-mcp-auth/complete, route:agent-mcp-auth/callback]
    boundary: [lophn-agent, secrets]
    code: [packages/core/lophn-agent/extensions/mcp-auth.ts, packages/core/lophn-agent/extensions/mcp-auth-control.ts, packages/core/lophn-agent/extensions/callback-handoff.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/lophn-agent/extensions/mcp-oauth-vault.ts]
    steps:
      - "입력 모양과 소유자를 본다. 등록 서버 목록에서 (이름, 소유자)를 찾는다. 없으면 not_found, 목록을 못 읽으면 registry-failed, http나 oauth2가 아니면 invalid_input이다"
      - "진행 중인 로그인을 찾는다. 없으면 no-session이다. 시작한 뒤 5분이 지났으면 세션을 닫고 같은 no-session이다"
      - "callback을 기다린다(5분 시한, 사람의 cancel이 끊는다). 발급자가 error로 거절했으면 refused, 기다리는 중 cancel이면 cancelled, 시한이면 timed-out이다. 돌아온 state가 시작의 것과 다르면 세션을 닫고 state-mismatch다"
      - "token endpoint에 code를 교환한다(발급자 요청 대기열, agent runtime). 닿지 못했거나 200이 아니거나 응답이 JSON·객체·access_token 꼴이 아니면 exchange-failed다. 끝점이 https도 loopback http도 아니면 endpoint-invalid다"
      - "교환한 token(access, refresh, 접근 meta)을 secrets.json의 mcp-oauth.<소유자>.<서버> 이름들에 쓴다. 설정 파일에는 쓰지 않는다. 쓰지 못하면 store-failed다"
    outcomes:
      - id: completed
        observe: ["disk:<root>/secrets.json", "response"]
      - id: no-session
        code: conflict
        when: "시작하지 않은 상태에서 완료를 불렀다. 시작 뒤 5분이 지나 세션이 시한으로 닫힌 뒤 불러도 여기다"
        observe: ["response"]
      - id: cancelled
        code: conflict
        when: "기다리는 중이나 token 교환 중에 사람이 cancel을 불렀다"
        observe: ["response"]
      - id: refused
        code: forbidden
        when: "발급자가 browser의 callback에 error를 실어 로그인을 거절했다(state가 이 시도의 것일 때). 실패 사유는 exchange_failed로 남는다"
        observe: ["response"]
      - id: state-mismatch
        code: invalid_input
        when: "callback의 state가 시작의 state와 다르다. 실패 사유 state_mismatch"
        observe: ["response"]
      - id: timed-out
        code: unavailable
        when: "기다리는 중에 5분이 지나 시한이 끝났다. 시한 뒤에 반환이 도착한 경쟁도 여기다. 실패 사유 callback_timeout"
        observe: ["response"]
      - id: exchange-failed
        code: unavailable
        when: "token endpoint에 닿지 못했다(다른 origin으로의 redirect 포함), 200이 아니다(거절 포함), token 응답 모양이 틀리다. 실패 사유 exchange_failed"
        observe: ["response"]
      - id: endpoint-invalid
        code: invalid_input
        when: "token 끝점이 https도 loopback http도 아니다"
        observe: ["response"]
      - id: store-failed
        code: unavailable
        when: "token을 secrets.json에 쓰지 못했다. 실패 사유 store_failed"
        observe: ["response"]
      - id: registry-failed
        code: unavailable
        when: "등록 서버 목록(ledger, agent 정의)을 읽지 못했다"
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "등록하지 않은 서버다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다(서버 이름 등). 소유자(workspace, agent)를 둘 다 적었다. 등록된 서버가 http가 아니거나 oauth2가 아니다"
