id: relay-abuse-limits
title: lophn relay에 IP마다의 연결 한도와 전송량 한도가 없어 누구나 자원을 쓰거나 공짜 통로로 쓸 수 있다
kind: bug
status: open
topic: platform
modules: [packages/relay]
now: |
  relay(`packages/relay/relay.ts`의 `createRelay`)는 control socket이 key를 증명하면 그 key의 자리를 준다. 증명은 "그 key의 비밀을 안다"만 보므로 누구나 새 key를 만들어 자기 host 자리를 잡고, 자기 폰 연결을 이어 relay를 두 끝 사이의 통로로 쓸 수 있다. 한도는 host마다 폰 연결 16(`RELAY_PHONES_PER_HOST`), 붙기 전 든 message 16, 받는 쪽이 1 MiB 넘게 밀리면 그 짝을 닫기(`RELAY_BUFFER_MAX_BYTES`), 증명과 data socket을 기다리는 10초뿐이다. IP마다 열 수 있는 socket 수, host 수, 초마다 넘기는 byte에는 한도가 없다. Fly.io 쪽 한도는 machine 전체의 연결 수(`packages/relay/fly.toml`의 soft 500, hard 1000)뿐이다. relay는 시작 줄 말고 log를 남기지 않아 남용을 알 길도 없다.
impact: |
  인터넷의 누군가가 socket을 많이 열거나 큰 전송을 이어 가면 Fly.io machine의 연결 자리와 대역을 다 써서, 사람의 폰이 밖에서 컴퓨터에 붙지 못한다. 전송량은 lophn이 내는 Fly.io 요금으로 간다.
fix: |
  - 작음(추천): IP마다 동시 socket 수(예: 32)와 host 자리 수(예: 4), 연결마다 초당 byte 한도를 둔다. 넘으면 닫는다. 남용을 볼 수 있게 분마다 연결 수와 넘긴 byte 합만 log로 남긴다(IP와 key는 남기지 않는다).
  - 중간: lophn이 발급한 token이 있어야 host 자리를 준다. 남용은 거의 막지만 core마다 등록 길이 생긴다.
