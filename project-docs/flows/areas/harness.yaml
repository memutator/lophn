  - id: terminal-paste
    title: "OS clipboard의 글을 focus가 있는 터미널에 사람이 친 글처럼 붙인다"
    actor: person
    uses: [key:terminal.paste, ipc:shell:terminal-paste, terminal-input:sent]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/terminal.ts
      - packages/shell/renderer/terminal/xterm-view.ts
    steps:
      - "Ctrl+Shift+V(terminal.paste)가 focus가 있는 탭의 paste를 부른다"
      - "main이 OS clipboard의 글을 돌려준다. 읽지 못했거나 clipboard가 없으면 빈 글이다"
      - "글이 있으면 xterm이 붙여 넣고, 그 입력이 terminal-input을 탄다. focus 검사와 사람 입력 알림을 그대로 거친다. 큰 글은 조각으로 나뉘어 가고 한 조각이 거절되면 그 paste의 나머지는 보내지 않는다(닫는 표지 없이 끝나거나 중간이 빠진 채 PTY에 들어가지 않게 한다)"
    outcomes:
      - id: pasted
        when: "글이 있다. focus가 없으면 terminal-input:not-focused로 PTY에 가지 않는다. 한 조각이 거절되면 뒤 조각은 보내지 않고 input_refused를 trace에 남긴다"
        observe: [process:pty-shell]
      - id: empty
        when: "clipboard가 비었거나 읽지 못했거나 clipboard가 없다(headless)"
        observe: []
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true

  - id: terminal-trace
    title: "터미널 진단 기록을 logs file에 덧붙인다(설정 diagnostics.trace가 켜졌을 때만)"
    actor: shell
    uses: [ipc:shell:terminal-trace]
    boundary: [shell]
    code:
      - packages/shell/ipc/terminal.ts
      - packages/shell/main/desktop/terminal-trace.ts
    steps:
      - "renderer가 모은 진단 event(이름, mode, 좌표, 개수)를 최대 500개 보낸다"
      - "main이 core 설정 diagnostics.trace를 읽는다(StateChanged(settings)가 오면 다시 읽는다). 읽지 못하면 꺼진 것으로 본다"
      - "켜져 있으면 main이 창 번호와 함께 logs/terminal-trace.jsonl에 덧붙인다. 10 MiB를 넘기 전에 terminal-trace.1.jsonl로 넘기고 둘만 남긴다. 쓰기 실패는 버린다"
      - "꺼져 있으면 아무것도 쓰지 않고 false를 돌려줘 renderer가 5초 동안 모으지 않는다. 그 뒤 다시 묻는다"
      - "친 글과 출력 내용은 싣지 않는다(비밀번호와 token이 지나간다)"
    outcomes:
      - id: recorded
        observe: ["disk:<data root>/logs/terminal-trace.jsonl", response]
      - id: off
        when: "설정 diagnostics.trace가 꺼져 있다(기본)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: false

  - id: terminal-agent-session-list
