    note: "extension handler의 core 호출 자격 범위와 해제. 호출 자격 발급은 extension-tool-judge:handed-to-host"

  - path: packages/core/main/daemon/wiring/harness-credential_test.ts
    covers: [harness-turn-start:started]
    note: harness turn 자격이 자기 session·turn에만 닿고 turn 끝에 멈춘다. user 자격의 call.reply 발급 거절은 outcome이 없다

  - path: packages/core/main/daemon/shell-launcher_test.ts
    covers:
      - host-shell-launch:launched
      - host-shell-launch:not-enabled
      - host-shell-launch:spawn-failed
    note: "앱을 띄우는 명령은 개발(build한 shell entry 필요)과 설치본(실행 file만)이 다르고 ELECTRON_RUN_AS_NODE를 빼고 --agent-window를 붙인다. 켜지 않은 core(test, boot)와 build하지 않은 개발 저장소는 launcher가 없고 spawn 오류는 알린다. test·boot가 띄운 core가 사람 장치에 앱을 띄우면 안 되어서다"

  - path: packages/core/main/daemon/wiring/host-queue_test.ts
    covers:
      - host-preview-tab-open:accepted
      - host-preview-tab-open:reused
      - host-preview-tab-open:not_found
      - host-preview-tab-open:conflict
      - host-tab-open:invalid_input
      - host-artifact-tab-open:accepted
      - host-artifact-tab-open:reused
      - host-artifact-tab-open:not_found
      - host-artifact-tab-open:invalid_input
      - host-coding-handoff-open:accepted
      - host-coding-handoff-open:invalid_input
      - host-tab-close:accepted
      - host-tab-close:forbidden
      - host-tab-close:not_found
      - host-browser-inspect:not_found
      - host-browser-inspect:unavailable
      - host-browser-act:not_found
      - host-browser-read:not_found
      - host-browser-tab-open:opened
      - host-browser-tab-open:opened-app-started
      - host-browser-tab-open:shell-not-attached
      - host-browser-tab-open:start-failed
      - host-browser-tab-open:page-timeout
      - host-shell-launch:shared
      - host-shell-launch:backoff
    note: "createTabHandlers 직접 호출. preview 탭은 그 앱 workspace의 session과 사람 token만 열고(다른 앱·project·home session은 not_found), 사람 token은 session 탭을 열지 못하며(invalid_input), 돌고 있는 preview가 없으면 conflict. 같은 앱의 preview 탭은 하나고 주인은 나중에 연 쪽이라 이전 주인의 close는 forbidden. browser 호출은 주인만 하고 남이나 사람이 연 탭은 not_found, 주인은 shell이 붙지 않아 unavailable. device 이름 not_found와 shell 쪽 판정(낡은 ref 등)은 covers 밖. browser 탭 열기는 workspace를 띄운 창 없이도 shell에 가고 page가 붙어야 성공하며 기한이 지나면 unavailable에 탭이 남지 않는다. shell이 없으면 한 번만 띄우고 붙어서 bind되면 성공하고, 30초 안에 붙지 않거나 spawn이 실패하면 같은 시도가 함께 unavailable이며 5분은 다시 띄우지 않고 바로 실패한다. 앱이 끝나 shell이 없으면 browser 탭은 표에서 빠지고 없는 탭과 같은 not_found 문장이다. preview·artifact 탭은 shell이 없어도 띄우지 않는다"

