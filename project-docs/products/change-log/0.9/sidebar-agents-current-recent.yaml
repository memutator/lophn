id: sidebar-agents-current-recent
version: 0.9.0
title: 'project sidebar의 Agent 쪽이 Agents · Current · Background · Recent로 나뉘고, 터미널 coding agent session을 저장해 다시 연다'
modules: [packages/protocol, packages/shell/ipc, packages/shell/main, packages/shell/preload, packages/shell/renderer, packages/design, tools]
checked: [architecture-terminal-agent, skill-ui-design, tool-wireframes, tool-dev]
change: |
  전: agent 줄 아래에 그 agent의 열린 session을 들여 썼고 상태 점은 제목 왼쪽이었다. 터미널 탭의 coding agent는 탭 icon·점에만 보였고 sidebar에는 없었다. hook의 session id는 버렸다.
  후:
  - Agents는 lophn agent만이다(hover +). Current는 열린 lophn session과 hook을 한 번이라도 보낸 터미널 coding agent를 시각순으로 섞어 `[아이콘][제목][상태 점]`으로 보인다. 점은 줄 오른쪽 끝이다. Recent는 끝난 lophn session과 저장한 터미널 session이다.
  - shell main이 hook의 session id(`SessionStarted`), harness, folder, cwd, 첫 prompt 첫 줄, 시각을 `<data root>/shell/agent-sessions/<project>.json`에 project마다 50개까지 저장한다. 상태는 저장하지 않는다. IPC `shell:terminal-agent-sessions`(읽기)와 `shell:terminal-agent-sessions-changed`(push)가 생겼다.
  - Current의 터미널 줄을 누르면 그 탭으로 간다. Recent의 터미널 줄을 누르면 그 folder에서 새 터미널을 열고 main이 harness의 resume 명령(`HARNESS_ADAPTERS[id].session.resume`, 예: `claude --resume <id>`, `codex resume <id>`)을 친다. 규칙이 없는 harness(pi, amp, command-code, muse, codebuddy, prime-agent, mimocode)는 새 터미널만 연다.
  - `TerminalAgent`에 `hooked`, `session`, `title`, `TerminalOpen`에 `resume`이 생겼다.
  - harness마다 흩어져 있던 hook 위치(`HARNESS_HOOKS`), event 표(`HOOK_EVENT_TABLE`), hook stdout(`HOOK_STDOUT`), session id 키 목록이 `HARNESS_ADAPTERS[id]` 한 항목(`hook`, `events`, `stdout`, `session.id`, `session.resume`)이 됐다. session id는 SessionStarted만이 아니라 모든 hook event에서 읽고, 값이 바뀌면(`/clear`, resume) 탭의 session을 바꾸고 제목을 새 prompt로 다시 받는다.
why: |
  sidebar에서 지금 도는 agent와 다시 열 session을 lophn agent와 터미널 coding agent를 가리지 않고 한 곳에서 보려고.
decisions:
  - text: |
      agent 정의(Agents)와 열린 session(Current)을 나눈다. agent마다 들여 쓰면 session이 생길 때마다 아래 agent가 밀리고 `+`를 찾기 어렵다.
    by: person
  - text: |
      터미널 coding agent는 Agents에 두지 않는다.
    by: person
  - text: |
      아이콘은 줄 맨 왼쪽, 상태 점은 오른쪽 끝.
    by: person
  - text: |
      터미널 session은 탭 상태로 두고 identity만 저장한다. `terminal-agent.md`의 "session이 아니라 탭 상태다"를 고쳤다.
    by: person
  - text: |
      resume 규칙은 이 컴퓨터의 `--help`로 확인한 것(claude, codex, opencode, omp, kiro-cli, agy, grok, devin, hermes, cline)과 herdr의 표에서 가져와 실행해 보지 못한 것(copilot, droid, qwen, qoder, cursor, kimi, kilo, letta)이 섞여 있다.
    by: agent
  - text: |
      resume 명령은 main이 host에 바로 써서 사람 입력의 focus 검사를 거치지 않는다. id는 schema가 `[A-Za-z0-9._:-]`만 받아 따옴표가 필요 없다.
    by: agent
