id: allow-reresolves-intent-before-run
title: 허락 뒤 `resolve`를 한 번 더 불러 intent를 다시 만든다
kind: defect
status: kept
topic: approval
modules: [packages/core/approvals, packages/core/lophn-agent]
now: |
  `lophn-agent/tool-judgment/tool-gate.ts`의 `check`가 `intentOf`로 `deps.resolve`를 불러 intent를 만들어 `judge`에 넘긴다. 물음이 허락으로 끝나면 `intentOf`를 한 번 더 불러 새로 만든 intent를 `consumeTurnAllow`(`approvals/turn-requests.ts`)에 넘겨 request의 지문과 비교한다. 같은 tool call에서 `resolve`가 최대 두 번 돈다(앱 app-api는 활성 release 선언을 읽고, MCP tool은 annotation을 본다).
impact: |
  허락과 실행 사이에 release나 선언이 바뀌어 효과가 달라진 호출을 막는 장치다(데이터·권한 경계). 대가는 허락마다 읽기 한 번이 더 든다는 것, `resolve`가 같은 입력에 같은 값을 준다고 믿는다는 것이다.
fix: |
  추천: 남긴다(kept). architecture 문서가 "실행 직전에 intent의 지문을 다시 비교한다"를 불변 조건으로 두고 있어 지우면 보호가 사라진다. 이유를 `check`의 해당 주석에 한 줄 더하고 닫는다.
closed: |
  남긴다. 허락과 실행 사이에 효과가 바뀐 호출을 막는다.
guard: 없음
