  - id: extension-tool-call
    title: agent가 extension tool을 부르면 할당을 판정하고 shell main handler에 넘긴다
    actor: agent
    entries: [route:extension_tools/call]
    pre: [route:extension_tools/publish]
    boundary: [extension-api, host-queue-interface, approvals]
    code: [packages/core/main/daemon/wiring/extension-tools.ts, packages/core/lophn-agent/tools/extension-tools.ts]
    steps:
      - "agent가 ext__<extension>__<tool> 이름으로 부르면 core가 정의의 extensions 할당과 켜진 catalog로 Gate extension_tool을 판정한다"
      - "할당이 없으면 not-assigned, 뺀 tool이면 removed로 forbidden을 돌려준다"
      - "shell이 붙어 있지 않으면 unavailable을 돌려준다"
      - "이 호출에만 쓰는 harness credential을 빌려 host queue의 tool_call로 shell main handler를 부른다"
      - "기다리는 동안 shell이 떨어지면 호출을 버린다. 결과 content는 감싸지 않고 돌려준다"
    outcomes:
      - id: ran
