id: events-check-misses-reactor-backoff
title: "events 점검이 Reactor backoff를 보지 못한다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/main, packages/core/events]
now: |
  `core/main/daemon/wiring/events.ts`의 `events` 점검은 연결이 열려 있고 `start` 뒤인지, `events` 표를 한 번 읽을 수 있는지만 본다. `ReactorRunner`에 상태를 내는 칸이 없어 handler가 실패해 backoff 중이어도 `available`이다. 두 점검 모두 마지막 응답 시각은 보지 않는다.
impact: |
  reaction이 멈춰 있어도 Diagnostics는 정상으로 보인다.
fix: |
  `ReactorRunner`에 마지막 성공 시각이나 backoff 여부를 내는 읽기를 더하고 점검이 본다(작음). 필요해질 때 한다.
closed: |
  Reactor와 그 연결만 보던 `events` 점검을 지웠다. ledger 읽기는 `ledger` 점검(`packages/core/diagnostics/components.ts`, reader 상태)이 본다.
guard: 없음
