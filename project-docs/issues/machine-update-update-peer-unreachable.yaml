id: machine-update-update-peer-unreachable
title: 폴더 꼴 판 범위 판정과 update_peer 갈래를 지키는 test가 없고 지금 판에서는 한 번도 돌지 않는다
kind: defect
status: open
topic: folder-sync
modules: [packages/core/folder, packages/shell/renderer]
now: |
  packages/core/folder/import/compat.ts의 exchangeWith가 기계 기록의 lophn.folder로 ok·update_this·update_peer를 가르고, 범위 밖이면 import(mod.ts, scan.ts)가 그 기계의 data·source·release file을 열지도 지우지도 않는다. 이 판정과 "범위 밖이면 file을 건드리지 않는다"를 보는 test가 없다(grep `exchangeWith`·`update_peer`가 _test.ts에 없다). 모든 build가 FOLDER_FORMAT {version 1, min_version 1}이라 실제로는 ok만 나온다. 끝에서 끝 확인은 기록을 손으로 고쳐 update_this만 보았다(cursor 그대로, file 지움 없음, 되돌리자 그 cursor부터 이음). update_peer와 그 문구("<이름> runs an older lophn. Update it on that machine.")는 꼴 판을 처음 올리는 판이 나올 때 처음 돈다.
impact: |
  범위 밖 기계의 file을 건드리지 않는 것은 data를 잃지 않는 규칙이다. 꼴 판을 처음 올리는 판에서 이 갈래가 틀리면 옛 판 기계의 file을 잘못 읽거나 아무 안내 없이 멈추고, 그때는 이미 두 판이 사람의 기계에 깔려 있다.
fix: |
  작음(추천): exchangeWith의 표 test(같은 판, 상대가 새 판, 상대의 하한이 높음, 상대가 옛 판)와 import test 하나(범위 밖 기계의 file은 held로도 복사되지 않고 cursor와 file이 그대로, 범위 안으로 돌아오면 그 cursor부터 읽는다)를 더한다.
