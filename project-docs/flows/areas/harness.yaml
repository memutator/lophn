      - packages/core/host-queue/queue.ts
      - packages/shell/renderer/workspace/use-surface-requests.ts
    steps:
      - "workspace는 agent면 자기 session의 것, 사람 token이면 입력의 workspace(없으면 home)다. 남의 workspace를 고를 길이 없다"
      - "home이면 artifact가 없어 invalid_input이다"
      - "그 workspace의 artifacts/<name>/이 폴더이고 입구 index.html이 일반 file인지 lstat으로 본다(symlink는 아니다). 아니면 not_found"
      - "artifact마다 host 탭은 하나다. 이미 있으면 그 탭 id를 돌려주고 주인이 새로 연 쪽이 된다"
      - "없으면 새 탭을 표에 올리고 그 workspace로 tab_open을 넣은 뒤 accepted를 돌려준다. 창은 사람이 연 같은 artifact 탭이 있으면 그 자리에 host 탭을 열고 그것을 닫는다"
    outcomes:
      - id: accepted
        when: "새 artifact 탭을 접수했다"
        observe: [response]
      - id: reused
        when: "그 artifact의 host 탭이 이미 있다. 같은 tab id를 돌려주고 주인이 바뀐다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "agent의 session이 없다, 그 workspace에 그 이름의 artifact(입구 index.html)가 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "workspace가 home이다(agent의 session이 home이거나 사람 token이 workspace를 주지 않았다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/artifact.md, architecture/browser-tab.md, architecture/workspace-layout.md]

  - id: harness-tui-open
    title: harness agent session을 TUI 탭으로 연다(CLI session을 hold한다)
    actor: agent
    uses: [route:tabs/open]
    when: "target이 tui일 때"
    pre: [harness-turn-start:started]
    boundary: [host-queue-interface, host-queue-core, harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/shell/main/terminal/harness-tui.ts
    steps:
      - "host-tab-open과 같은 판정을 거친다. 사람 token이면 invalid_input, session이 없거나 닫혔거나 다른 workspace면 not_found"
      - "harness session이 아니거나 project workspace가 아니면 invalid_input. home과 app은 터미널이 없다"
      - "CLI session id가 아직 없으면(첫 turn 전) conflict. turn이 돌거나 이미 hold되어 있어도 conflict"
      - "통과하면 그 자리에서 30초 hold를 예약하고 resume 값(adapter id, CLI session id)을 tab_open 요청에 싣는다"
      - "shell host가 터미널 탭을 열고 CLI resume 명령을 친다. 탭이 있는 동안 그 session의 headless turn은 시작하지 않는다"
    outcomes:
      - id: accepted
        observe: [response, process:cli-tui]
      - id: not_found
        code: not_found
        when: "호출 session이나 대상 session이 없거나 닫혔거나 다른 workspace다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "대상이 harness session이 아니거나 project workspace가 아니다. 또는 사람 token이 불렀다(사람 token은 browser·preview·artifact 탭만 연다)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "CLI session id가 없거나, turn이 돌거나, 이미 hold되어 있다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "TUI가 끝내 뜨지 않으면 사람이 탭을 닫을 때까지 hold가 남는다. 그 release 경로는 system:harness-tui-hold가 맡는다"

  - id: host-tab-close
    title: agent나 사람 token이 자기가 연 탭을 닫는다
    actor: agent
    entries: [route:tabs/close]
    pre: [host-tab-open:accepted]
