area: app-runtime

flows:

  # ---------- 앱 등록과 정보 ----------

  - id: app-create
    title: "새 앱을 등록하고 source 폴더를 깐다"
    actor: person
    entries: [route:apps/create]
    uses: [route:apps/connect_source]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/registration/source-folder.ts]
    steps:
      - "사람(agent는 whole scope 요청만)이 slug, 이름, 설명으로 등록을 청한다. 미리 정한 id는 사람만 쓴다."
      - "내장 명령 이름(RESERVED_APP_SLUGS), slug 중복, id 중복을 거른다."
      - "같은 transaction에서 AppCreated event와 apps 행을 쓴다(source_path null, run_enabled false, status active)."
      - "commit 뒤 source-folder writer가 apps/<id>/source에 template을 깔고 commit한 뒤, machine 자격으로 connect_source를 부른다."
      - "폴더가 이미 있으면 commit이 있을 때만 그대로 쓰고, commit이 없으면 덮지 않고 거절한다. 깔 때 scaffold는 이미 있는 파일을 덮지 않고 빠진 파일만 채운다."
      - "깔기나 잇기가 실패해도 create는 ok다. 앱은 source_path null로 남고 core log에 source_folder_unprepared가 남는다."
    outcomes:
      - id: linked
        when: "source를 새로 깔아 이었거나, 이미 commit된 폴더가 있어 그대로 이었다"
        observe: ["ledger:apps", "event:AppCreated", "disk:apps/<app>/source"]
      - id: unlinked
        when: "source 깔기나 잇기가 실패함(create는 이미 commit됨). commit 없이 남은 폴더가 있어 덮지 않고 거절한 것도 여기다"
        observe: ["ledger:apps", "event:AppCreated", "log:core"]
      - id: forbidden
        code: forbidden
        when: "사람도 agent도 아님(requireCreator), agent가 whole scope가 아닌 요청(앱 범위 조건을 가짐), 사람이 아닌데 id를 미리 정함, 앱 범위 판정(authorizeApp)이 거절함"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "slug가 내장 명령 이름과 같음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "slug나 미리 정한 id가 이미 있음"
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음(app dependency unavailable), 저장된 앱 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false
    declared_only: [not_found]
    unclear:
      - "route가 not_found를 선언하지만 handler는 내지 않는다. 새 앱 id라 보관한 앱(archivedToAgent)이나 범위 불일치로 가려질 앱이 없고, 이미 있는 앱은 conflict다. 선언을 고칠 곳이다."
    refs: [P5, L4]
    docs: [architecture/app-call.md]

  - id: app-connect-source
    title: "앱의 source 폴더를 잇는다"
    actor: person
    entries: [route:apps/connect_source]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/registration/source-folder.ts]
    steps:
      - "source_path 폴더를 writer 앞에서 확인한다. 있고, git 저장소의 맨 위이고, commit이 있어야 한다(git은 외부 CLI라 process로 세지 않는다). 이 확인은 권한과 revision 검사보다 먼저라 남의 앱이어도 폴더가 잘못되면 invalid_input이다."
      - "호출한 쪽이 사람, 그 앱 workspace의 agent, core 안 machine(앱 생성 직후)인지 본다. agent는 자기 session의 앱만 잇는다."
      - "없는 앱은 not_found다. 범위 밖 앱은 revision 비교보다 먼저 없는 앱과 같이 닫고, base_revision이 다르면 conflict다."
      - "source_path만 바꾼다. active_release, run_enabled, status는 그대로다."
      - "AppSourceConnected event를 쓰고 apps 행을 바꾼다."
    outcomes:
      - id: connected
        observe: ["ledger:apps", "event:AppSourceConnected"]
      - id: invalid-folder
        code: invalid_input
        when: "폴더가 없음, git 저장소가 아님, 저장소 맨 위가 아님, commit이 없음(권한과 revision 검사보다 먼저 답한다)"
        observe: [response]
      - id: git-failed
        code: unavailable
        when: "git 실행이 실패함(프로세스를 띄우지 못함), 또는 폴더 경로 확인이 예외로 끝남"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람·agent·machine이 아님, agent가 자기 session의 앱이 아닌 앱을 잇려 함"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다름"
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 저장된 앱 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    refs: [A17]

  - id: app-rename
    title: "앱 이름을 바꾼다"
    actor: person
    entries: [route:apps/rename]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다(requireUser). 범위 밖 앱은 없는 앱과 같이 닫는다."
      - "base_revision이 현재 revision과 같은지 본다."
      - "AppRenamed event를 쓰고 apps 행의 이름과 revision을 바꾼다. revision이 바뀌어 supervisor는 다음 sweep에 같은 상태로 맞추며 자식을 다시 띄우지는 않는다."
    outcomes:
      - id: renamed
        observe: ["ledger:apps", "event:AppRenamed"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 저장된 앱 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false

  - id: app-edit-folders
    title: "앱에 더한 폴더 목록을 통째로 바꾼다"
    actor: person
    entries: [route:apps/edit_folders]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다(requireUser). 앱이 없으면 not_found다."
      - "폴더끼리, 그리고 source 폴더와 겹치면 invalid_input이다. 범위 검사보다 먼저 본다. 같은 파일이 두 root로 잡히면 rewind 기록이 갈린다."
      - "범위 밖 앱은 없는 앱과 같이 닫고, base_revision을 비교한다."
      - "AppFoldersEdited event를 쓰고 apps 행과 app_folders 표를 바꾼다."
    outcomes:
      - id: edited
        observe: ["ledger:apps", "ledger:app_folders", "event:AppFoldersEdited"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: overlapping
        code: invalid_input
        when: "폴더가 반복되거나 source와 겹침(범위 검사보다 먼저 답한다)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 저장된 앱 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false
    risk: [sandbox]

  - id: app-set-icon
    title: "사람이 올린 앱 icon을 정하거나 지운다"
    actor: person
    entries: [route:apps/set_icon]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다(requireUser). icon이 있으면 올린 형식과 크기를 검사한다. 이 검사는 앱 존재 확인보다 먼저다."
      - "앱이 없거나 범위 밖이면 not_found다."
      - "app_icons 표를 쓴다. revision과 event는 바뀌지 않는다."
    outcomes:
      - id: uploaded
        observe: ["ledger:app_icons"]
      - id: cleared
        when: "icon을 null로 보냄"
        observe: ["ledger:app_icons"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: invalid-icon
        code: invalid_input
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 저장된 앱 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false

  - id: app-archive
    title: "앱을 보관한다"
    actor: person
    entries: [route:apps/archive]
    boundary: [apps, app-runtime]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/runtime/supervisor/supervisor.ts]
    steps:
      - "사람만 부른다(requireUser). 범위 밖 앱은 없는 앱과 같이 닫는다. base_revision과 현재 status(active)를 본다."
      - "같은 transaction에서 status를 archived로, run_enabled를 false로 바꾸고 AppArchived event를 쓴다."
      - "그 앱의 notice를 지운다(clearAppNotices)."
      - "돌고 있는 자식은 다음 supervisor reconcile이 user_stop으로 멈춘다(app-supervisor-reconcile의 stopped). 이 command는 멈춤을 기다리지 않는다."
      - "agent에게 그 앱은 없는 앱이 된다(authorizeApp의 archived 필터)."
    outcomes:
      - id: archived
        observe: ["ledger:apps", "event:AppArchived", "ledger:notices"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: not-active
        code: conflict
        when: "status가 active가 아님(이미 보관됨 포함)"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 저장된 앱 행이 깨짐(internal), 행 저장이 실패함"
        observe: [response]
    crosses_process: false

  - id: app-unarchive
    title: "보관한 앱을 되살린다"
    actor: person
    entries: [route:apps/unarchive]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다(requireUser). base_revision과 status(archived)를 본다."
      - "status를 active로 바꾸고 AppUnarchived event를 쓴다. run_enabled는 false로 남는다(되살리기가 실행 재개의 동의가 아니다)."
    outcomes:
      - id: unarchived
        observe: ["ledger:apps", "event:AppUnarchived"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-archived
        code: conflict
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 저장된 앱 행이 깨짐(internal), 행 저장이 실패함"
        observe: [response]
    crosses_process: false

  - id: app-delete
    title: "보관한 앱을 영구히 지운다"
    actor: person
    entries: [route:apps/delete]
    uses: [session-delete:ok, agent-delete:deleted]
    pre: [app-archive:archived]
    boundary: [apps, app-runtime]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/registration/delete.ts, packages/core/main/daemon/wiring/apps-delete.ts]
    steps:
      - "쓰기 앞 처리기(apps-delete wiring)가 먼저 본다. 보관한 앱의 preview를 멈추려 하고, 보관한 앱의 살아 있는 supervisor 자식(멈추는 중 포함)이 있으면 지우지 않고 unavailable로 끝낸다. 이 판정은 사람 확인과 revision 검사보다 먼저다."
      - "그 다음 사람만 받는다. 앱이 보관 상태이고 base_revision이 맞아야 한다. 활성 앱이면 conflict다."
      - "같은 transaction에서 그 앱 workspace의 session을 session.delete와 같은 규칙으로 지우고, 앱 범위 agent 정의와 다른 agent의 할당, job을 지운다. 열린 공유 요청은 지우고 ShareRequestClosed(reject)를 남긴다."
      - "blob 참조, annotation batch와 annotation, notice를 지운 뒤 erase window 안에서 apps, releases, grants, invocations, app_rewinds, 활성화 요청·동의, 데이터 기록, 폴더·icon 표를 지운다."
      - "commit 뒤 apps/<id> 폴더를 지우고(읽기 전용 폴더도), session의 tool-results와 되돌리기 저장소를 지우고, 설정에서 이 앱을 가리키는 것을 뺀다. 실패는 log만 남긴다."
      - "남지 않는 event AppRemoved를 내 shell이 browser 저장소와 layout을 정리하게 한다. AppDeleted event는 남는다."
    outcomes:
      - id: deleted
        observe: ["ledger:apps", "ledger:sessions", "ledger:share_requests", "ledger:annotation_batches", "ledger:annotations", "ledger:invocations", "ledger:releases", "ledger:grants", "ledger:app_rewinds", "ledger:app_folders", "ledger:activation_requests", "ledger:activation_consents", "event:AppDeleted", "event:AppRemoved", "event:ShareRequestClosed", "disk:apps/<app>/", "disk:agents/<id>.md"]
      - id: not-archived
        code: conflict
        when: "status가 archived가 아님(only an archived app can be deleted)"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: still-running
        code: unavailable
        when: "보관한 앱의 자식 process가 아직 살아 있음(멈추는 중 포함). 쓰기 앞 처리기가 사람 확인과 revision 검사보다 먼저 판정한다"
        observe: [response, "ledger:apps"]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine). 보관한 앱이 살아 있으면 still-running이 이 검사보다 먼저 나온다"
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp의 권한 port가 없거나 답이 맞지 않음, 다른 module 기록 지우기(세션 삭제, agent 정의, 할당, job, 공유 요청)나 blob·annotation 정리가 낸 오류 그대로. 한 transaction이라 아무것도 지우지 않는다"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]
    unclear:
      - "보관한 앱의 preview 멈추기(stopPreview)가 사람 확인보다 먼저 돈다. agent가 범위 안에서 부르면 권한 거절 전에 preview가 멈출 수 있다(apps-delete.ts). 의도인지 확인이 필요하다."

  - id: app-read
    title: "앱 목록과 한 앱을 읽는다"
    actor: person
    entries: [route:apps/list, route:apps/get]
    boundary: [apps]
    code: [packages/core/apps/registration/reads.ts]
    steps:
      - "목록은 status 필터와 cursor로 자르고 범위 밖 앱은 뺀다. agent에게는 보관한 앱이 없다(authorizeApp)."
      - "한 앱은 없거나 범위 밖이면 not_found다. agent workspace data도 같은 두 route를 쓴다."
      - "읽기만 하므로 기록을 남기지 않는다."
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "목록 cursor가 깨졌거나(base64·JSON·schema), status나 limit이 처음 조회와 다르거나, offset이 보이는 목록 끝 이상"
        observe: [response]
      - id: not-found
        code: not_found
        when: "get의 앱이 없거나 범위 밖임(agent에게는 보관한 앱도 없음)"
        observe: [response]
      - id: read-failed
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable), 저장된 앱 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false

  # ---------- 실행 상태 ----------

  - id: app-execution-enable
    title: "앱 실행을 켠다"
    actor: person
    entries: [route:apps/enable_execution]
    pre: [route:releases/activate]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "사람만 부른다(route actors). base_revision이 맞고, status가 active이고, 활성 release가 있어야 한다."
      - "범위 판정(authorizeApp)을 거치고 run_enabled를 true로 바꾸고 AppExecutionEnabled event를 쓴다."
      - "자식은 여기서 띄우지 않는다. 다음 1초 sweep이 (release, run_enabled, status)가 바뀐 것을 보고 reconcile을 알리고, app-supervisor-reconcile의 started가 띄운다."
      - "사람은 App details 탭의 Run 절 Switch로 켠다. 실패하면 탭 위쪽 toast로 알리고 Switch는 읽은 상태로 돌아간다."
    outcomes:
      - id: enabled
        observe: ["ledger:apps", "event:AppExecutionEnabled", "screen:new-app-run-running"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine). route actors가 dispatch에서 거른다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없음"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: archived
        code: conflict
        when: "보관한 앱은 실행을 켤 수 없다"
        observe: [response]
      - id: no-active-release
        code: invalid_input
        when: "활성 release가 없음"
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp이 거절(forbidden 또는 not_found)하거나 권한 port가 없음, 저장된 앱 행이 깨짐(internal), 행 저장이 실패함"
        observe: [response]
    crosses_process: false
    risk: [sandbox]

  - id: app-execution-disable
    title: "앱 실행을 끈다"
    actor: person
    entries: [route:apps/disable_execution]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "사람만 부른다(route actors). base_revision을 비교한다. 활성 release가 없어도 끌 수 있다."
      - "범위 판정(authorizeApp)을 거치고 run_enabled를 false로 바꾸고 AppExecutionDisabled event를 쓴다."
      - "도는 자식은 다음 reconcile이 user_stop으로 멈춘다. OS 종료를 확인하면 record_stopped가 AppStopped를 남긴다(app-supervisor-reconcile, app-record-stopped)."
      - "사람은 App details 탭의 Run 절 Switch로 끈다. 실패하면 탭 위쪽 toast로 알린다."
    outcomes:
      - id: disabled
        observe: ["ledger:apps", "event:AppExecutionDisabled", "screen:new-app-run-stopped"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine). route actors가 dispatch에서 거른다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없음"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: dependency-failed
        when: "authorizeApp이 거절하거나 권한 port가 없음, 저장된 앱 행이 깨짐(internal), 행 저장이 실패함"
        observe: [response]
    crosses_process: false

  - id: app-runtime-read
    title: "앱의 지금 실행 상태를 읽는다"
    actor: agent
    entries: [route:apps/runtime]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/reads.ts, packages/core/apps/runtime/model.ts]
    steps:
      - "앱 행(활성 release, status, run_enabled)과 supervisor의 현재 관측을 합쳐 상태를 계산한다. 상태는 저장하지 않는다."
      - "활성 release가 없으면 preparing이다. 보관했거나 실행을 껐으면 stopped다(자식이 아직 살아 있으면 termination_pending이 true). 실행인데 관측이 없으면 unavailable(no_observation)이다."
      - "관측이 현재 release이고 ready이며 accepting이면 running이다. 관측이 있어도 현재 release가 아니거나 ready·accepting이 아니면 unavailable이고 자식이 든 사유를 싣는다. 과거 event로 살아 있다고 추정하지 않는다."
      - "사람의 화면과 agent runtime(허락 뒤 nonce 재검사, machine 자격)도 같은 route를 쓴다."
    outcomes:
      - id: state-running
        when: "관측이 현재 release이고 ready이며 accepting"
        observe: [response]
      - id: state-stopped
        when: "보관했거나 실행이 꺼짐(활성 release 있음). 자식이 살아 있으면 termination_pending이 true"
        observe: [response]
      - id: state-preparing
        when: "활성 release가 없음"
        observe: [response]
      - id: state-unavailable
        when: "실행인데 관측이 없음(no_observation), 또는 관측이 현재 release가 아니거나 ready·accepting이 아님(자식의 사유를 실음)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "없는 앱이거나 agent에게 보관한 앱"
        observe: [response]
      - id: read-failed
        when: "앱 행 읽기나 범위 판정이 실패함(app dependency unavailable, invalid stored app)"
        observe: [response]
    crosses_process: true
    refs: [A2, L7, E2]

  # ---------- 감독: supervisor가 자식을 띄우고 멈추고 다시 띄운다 ----------

  - id: app-supervisor-reconcile
    title: "supervisor가 앱 자식을 원하는 상태에 맞춰 띄우거나 멈춘다"
    actor: system
    entries: [system:app-supervisor-reconcile]
    uses: [app-record-started:started, app-record-stopped:stopped, app-record-unavailable:recorded, app-record-unavailable:halted]
    boundary: [app-runtime, child-supervision-protocol]
    code: [packages/core/apps/runtime/supervisor/supervisor.ts, packages/core/apps/control.ts, packages/core/main/app-supervisor/assembly.ts, packages/core/apps/runtime/processes/spawn.ts]
    steps:
      - "core가 기동하면 appsControl.start가 1초 sweep을 켠다. activation의 reconcileProduct가 앱의 (활성 release, run_enabled, status)가 마지막으로 알린 것과 다르면 reconcile을 알린다. supervisor가 그 앱을 잊었으면(observe가 null) control sweep이 알린다. 알릴 때 원하는 상태(release, bundle hash, 실행 여부, 보관 여부)를 보낸다. 그 흐름은 app-release area가 쓴다."
      - "원하는 상태가 실행이 아니거나 보관이면 돌고 있는 자식을 user_stop으로 멈추고 OS 종료를 확인한다(record_stopped). 확인하지 못하면 아무것도 띄우지 않고 다음 sweep이 다시 본다."
      - "같은 release와 bundle의 자식이 이미 돌면 아무것도 하지 않는다. activation이 그 앱을 붙들고 있으면(pause) 건드리지 않는다."
      - "release나 bundle이 다른 자식은 release_change로 멈춘 뒤 새로 띄운다."
      - "실행이면 app credential을 발급받아 자식 process를 띄운다. 발급이 실패하면 start_failed다."
      - "자식이 ready 통로로 hash, handler, schema, 연결을 probe한다(30초 안에). 맞지 않거나 시간을 넘기면 start_failed로 자식을 끝낸다. probe 중 자식이 바뀌었으면 아무것도 기록하지 않는다."
      - "통과하면 open하고 record_started로 AppStarted를 남긴다. open이 안 되면 start_failed다. start_failed는 자동으로 다시 하지 않고 다음 reconcile까지 unavailable로 둔다. core가 닫히는 중이면 core_eof로 멈추고 AppStopped는 남기지 않는다."
    outcomes:
      - id: started
        when: "probe와 open을 통과하고 record_started가 새 관측으로 기록됨"
        observe: ["process:app-child", "event:AppStarted"]
      - id: start-failed
        when: "credential 발급 실패, ready timeout, bundle hash 불일치, handler나 data schema 불일치, open 실패"
        observe: ["process:app-child", "event:AppUnavailable", "log:app", "ledger:notices"]
      - id: stopped
        when: "실행이 꺼졌거나 보관됨(user_stop). AppStopped는 그 자식이 AppStarted를 남겼을 때만 남는다"
        observe: ["process:app-child", "event:AppStopped"]
      - id: release-changed
        when: "돌던 자식의 release나 bundle이 원하는 것과 다름(release_change로 멈춘 뒤 새 자식을 띄움. 결과는 started나 start-failed)"
        observe: ["process:app-child", "event:AppStopped"]
      - id: stop-unconfirmed
        when: "멈추라고 했지만 OS 종료를 확인하지 못함. 아무것도 띄우지 않음"
        observe: ["process:app-child"]
      - id: child-replaced
        when: "probe나 open 중 자식이 바뀜. 이 시도는 아무것도 기록하지 않고 끝남"
        observe: ["process:app-child"]
      - id: core-closing
        when: "core가 닫히는 중(core_eof). 자식을 멈추고 AppStopped는 남기지 않음"
        observe: ["process:app-child"]
      - id: halted-crash-loop
        when: "reconcile이 왔을 때 창 안 예상 밖 종료가 한도를 넘어 있음. run_enabled는 켜진 채다. 종료 기록은 껐다 켜도 비워지지 않고 10분 창에서 빠질 때만 줄어서, 새 release 활성화나 Run Switch를 껐다 켜는 reconcile도 창 안에서는 다시 halted가 된다"
        observe: ["event:AppUnavailable", "event:AppRestartHalted", "screen:new-app-run-halted"]
      - id: held-by-activation
        when: "activation이 그 앱을 붙들고 있음(pause)"
        observe: ["process:app-child"]
    crosses_process: true
    risk: [sandbox]
    refs: [E2]
    docs: [architecture/activation.md, architecture/app-call.md]
    unclear:
      - "halted가 된 앱은 창이 지나도 스스로 다시 뜨지 않는다(timer가 없고 다음 reconcile이 와야 한다). 사람이 Run을 껐다 켜거나 새 release를 활성화해야 한다. 의도인지 확인이 필요하다"
      - "start_failed 뒤 자동 재시도가 없다(다음 reconcile까지 unavailable). activation 실패는 다시 하지 않는다는 규칙과 같은지, 일반 앱 시작에도 그 뜻인지 확인이 필요하다."

  - id: app-record-started
    title: "자식이 열렸음을 기록한다(AppStarted)"
    actor: system
    entries: [route:apps/record_started]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts, packages/core/apps/routes.ts]
    steps:
      - "supervisor가 probe와 open을 끝낸 뒤 machine 자격으로 record_started를 부른다. attestation의 release가 있어야 한다."
      - "같은 release와 자식 nonce의 AppStarted가 이미 있으면 event를 다시 쓰지 않는다."
      - "새 관측이면 AppStarted(release, process_nonce, data_schema)를 쓴다."
      - "시작 때 DB가 바뀌었으면(start_changeset) withStartInvocation이 start invocation을 쓰고 changeset을 붙인다. 이전 시작 release가 같으면 restart, 다르면 activation이다."
    outcomes:
      - id: started
        when: "새 관측. DB가 바뀐 시작이면 start invocation도 남긴다"
        observe: ["event:AppStarted", "ledger:invocations"]
      - id: replayed
        when: "같은 release와 nonce의 AppStarted가 이미 있음(재전송)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine이 아님(route actors)"
        observe: [response]
      - id: no-release
        code: invalid_input
        when: "attestation의 release가 null"
        observe: [response]
      - id: not-registered
        code: invalid_input
        when: "앱 행이 없음"
        observe: [response]
      - id: dependency-failed
        when: "앱 행 읽기가 실패함(invalid stored app)"
        observe: [response]
    crosses_process: false
    declared_only: [conflict]
    unclear:
      - "route가 conflict를 선언하지만 handler는 내지 않는다(없는 앱은 invalid_input, 재전송은 replayed). 선언을 고칠 곳이다."

  - id: app-record-stopped
    title: "자식이 종료됐음을 기록한다(AppStopped)"
    actor: system
    entries: [route:apps/record_stopped]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "supervisor가 자식의 OS 종료를 확인한 뒤 machine 자격으로 record_stopped를 부른다. core가 꺼질 때는 남기지 않는다."
      - "같은 release와 nonce의 AppStopped가 없으면 쓴다."
      - "관측 없이 상태를 계산해 돌려준다."
    outcomes:
      - id: stopped
        when: "같은 release와 nonce의 AppStopped가 없음(새 관측)"
        observe: ["event:AppStopped"]
      - id: replayed
        when: "같은 release와 nonce의 AppStopped가 이미 있음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine이 아님(route actors)"
        observe: [response]
      - id: not-registered
        code: invalid_input
        when: "앱 행이 없음"
        observe: [response]
      - id: dependency-failed
        when: "앱 행 읽기가 실패함(invalid stored app)"
        observe: [response]
    crosses_process: false
    declared_only: [conflict]
    unclear:
      - "route가 conflict를 선언하지만 handler는 내지 않는다(없는 앱은 invalid_input, 재전송은 replayed). 선언을 고칠 곳이다."

  - id: app-record-unavailable
    title: "앱이 쓸 수 없게 됐음을 기록한다(AppUnavailable)"
    actor: system
    entries: [route:apps/record_unavailable]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "supervisor가 start_failed, 예상 밖 종료, crash loop 멈춤을 machine 자격으로 알린다."
      - "마지막 근거(release와 reason)와 같으면 event를 다시 쓰지 않는다."
      - "새 근거면 AppUnavailable을 쓰고, 앱마다 현재 상태 한 줄인 program notice(app_unavailable)를 같은 transaction에 남긴다."
      - "근거가 crash_loop이면 commit 뒤 남지 않는 event AppRestartHalted를 내 shell이 사람에게 자동 재시작이 멈췄음을 알린다."
    outcomes:
      - id: recorded
        when: "crash_loop이 아닌 새 근거(unexpected_exit, start_failed 등)"
        observe: ["event:AppUnavailable", "ledger:notices"]
      - id: halted
        when: "새 근거가 crash_loop"
        observe: ["event:AppUnavailable", "event:AppRestartHalted", "ledger:notices"]
      - id: same-reason
        when: "마지막 근거와 같음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine이 아님(route actors)"
        observe: [response]
      - id: not-registered
        code: invalid_input
        when: "앱 행이 없음"
        observe: [response]
      - id: dependency-failed
        when: "앱 행 읽기가 실패함(invalid stored app), 앱 한 줄 notice 쓰기가 실패함"
        observe: [response]
    crosses_process: false
    declared_only: [conflict]
    unclear:
      - "route가 conflict를 선언하지만 handler는 내지 않는다(없는 앱은 invalid_input, 같은 근거는 same-reason). 선언을 고칠 곳이다."

  - id: app-child-exit
    title: "앱 자식이 예상 밖으로 끝나면 다시 띄우거나 자동 재시작을 멈춘다"
    actor: system
    entries: [system:app-child-exit]
    uses: [app-record-unavailable:recorded, app-record-unavailable:halted, app-supervisor-reconcile:started]
    boundary: [app-runtime, child-supervision-protocol]
    code: [packages/core/apps/runtime/supervisor/supervisor.ts, packages/core/apps/runtime/supervisor/restart-policy.ts, packages/core/apps/runtime/processes/terminate.ts]
    steps:
      - "자식이 끝나면 supervisor가 OS 종료를 확인하고 exit 사실을 남긴다. 정지를 요청해 끝난 종료는 여기서 아무것도 하지 않는다(intended-ignored)."
      - "종료 코드가 0이 아니면 예상 밖 종료로 세고 10분 창 안의 종료 수에 넣는다. 원하는 상태가 꺼짐·보관이거나 core가 닫히는 중이면 AppUnavailable도 재시작도 없다."
      - "창 안 종료가 한도(5)를 넘으면 자동 재시작을 멈추고 record_unavailable(crash_loop)을 부른다."
      - "아니면 record_unavailable(unexpected_exit)을 부르고 backoff(1초, 2초, 4초 … 최대 5분) 뒤 reconcile로 다시 띄운다."
      - "시작 실패(start_failed)는 예상 밖 종료로 세지 않는다."
    outcomes:
      - id: restarted
        observe: ["event:AppUnavailable", "log:app", "process:app-child"]
      - id: halted
        observe: ["event:AppUnavailable", "event:AppRestartHalted", "log:app"]
      - id: exit-zero-ignored
        when: "종료 코드가 0인 예상 밖 종료. AppUnavailable도 재시작도 없다. 앱 log에는 unexpected_exit 한 줄만 남는다(crash.ts는 code 0도 센다)"
        observe: ["log:app", "process:app-child"]
      - id: intended-ignored
        when: "정지를 요청해 끝난 종료(user_stop, release_change, restart 등). 여기서 아무것도 하지 않는다"
        observe: ["process:app-child"]
      - id: not-restarted-disabled
        when: "예상 밖 종료였지만 종료 뒤 원하는 상태가 꺼짐·보관이거나 core가 닫히는 중. AppUnavailable도 재시작도 없다"
        observe: ["log:app", "process:app-child"]
    crosses_process: true
    refs: [E2]
    docs: [architecture/app-call.md]
    unclear:
      - "종료 코드 0으로 예상 밖 종료한 앱은 AppUnavailable도 재시작도 없다(supervisor.ts onChildExit가 unexpected()를 거른다). 의도인지, 그러면 app이 멈춘 채 남는 것이 맞는지 확인이 필요하다."
      - "crash loop로 멈춘 앱은 자동으로 풀리지 않는다. 다음 reconcile이 와야 apply가 창을 다시 보는데, reconcile은 실행 켜기·끄기, 이름·폴더 바꾸기처럼 revision이 바뀔 때만 온다(코드 읽기로 본 것이고 실행으로 확인하지 않았다)."
      - "예상 밖 종료 뒤에는 record_stopped가 없어 마지막 process 사실이 AppStarted로 남는다. 그래서 grant revoke가 process-running으로 막힌다(app-grant-revoke의 unclear 참고)."

  - id: app-core-restart-recovery
    title: "core가 다시 켜질 때 끝내지 못한 호출과 rewind를 닫는다"
    actor: system
    entries: [system:app-core-restart-recovery]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/invocations/restart.ts, packages/core/apps/rewind/store.ts, packages/core/main/daemon/wiring/apps.ts]
    steps:
      - "apps wiring이 start될 때 running으로 남은 invocation을 찾는다(ledger.unfinished)."
      - "각각을 unknown(summary reason core_restarted, observation result_not_observed, 근거 열)으로 닫는다. changeset은 붙이지 않는다. 한 건을 닫지 못하면 그 건은 running으로 남고, wiring이 결과를 보지 않아 조용히 넘어간다."
      - "applying으로 남은 rewind는 cancelled(reason core_restarted)로 닫는다. invocations를 []로 두고 finished_at을 쓴다. 접수 닫힘은 메모리라 재시작하면 열려 있다."
      - "이전 core의 앱 process는 이미 없으므로 같은 호출을 다시 부르지 않는다."
    outcomes:
      - id: invocations-unknown
        observe: ["ledger:invocations"]
      - id: close-failed
        when: "unfinished 목록을 읽지 못하거나 invocation 한 건을 닫지 못함. 그 건은 running으로 남고 결과는 버려진다"
        observe: ["ledger:invocations"]
      - id: rewind-cancelled
        observe: ["ledger:app_rewinds"]
    crosses_process: false

  # ---------- 앱 log ----------

  - id: app-log-write
    title: "supervisor가 앱 log 한 줄을 쓴다"
    actor: system
    entries: [system:app-log-write]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/observations/log-file.ts, packages/core/apps/runtime/observations/stream-decoder.ts, packages/core/apps/runtime/view-errors.ts, packages/core/main/app-supervisor/log-redact.ts]
    steps:
      - "앱 stdout·stderr 줄, reportProblem 줄, 잡히지 않은 예외(원래 source 줄로 푼 frame), 화면 오류, process_exit 근거를 줄 하나로 만든다. 의도한 정지와 preview 자식의 출력은 쓰지 않는다. dataRoot가 없으면 쓸 곳이 없어 stdout·stderr를 읽어 버린다."
      - "줄마다 redaction을 먼저 하고 300자로 자른다. 300자를 넘으면 뒤는 잘려 버린다. 머리의 [inv=<id>]는 떼어 invocation 칸에 둔다."
      - "app.log에 JSON Lines 한 줄을 붙인다. 붙이면 8 MiB를 넘을 때 app.log를 app.log.1로 옮기고(앞 .1은 버린다) 새 app.log에 쓴다."
      - "쓰기 실패는 버리고 supervisor는 계속 돈다. 다음 줄에서 다시 쓴다."
      - "stdout·stderr 한 줄이 16 KiB를 넘으면 redaction 전에 자를 수 없어 다음 줄바꿈까지 통째로 버린다."
    outcomes:
      - id: written
        observe: ["log:app", "disk:apps/<app>/logs/app.log"]
      - id: rotated
        when: "쓰기 전에 app.log를 app.log.1로 옮김"
        observe: ["log:app", "disk:apps/<app>/logs/app.log.1"]
      - id: truncated
        when: "redaction 뒤 줄이 300자를 넘어 뒤가 조용히 잘림"
        observe: ["disk:apps/<app>/logs/app.log"]
      - id: dropped
        when: "쓰기 실패로 줄이 버려짐"
        observe: ["disk:apps/<app>/logs/app.log"]
      - id: line-too-long
        when: "stdout·stderr 한 줄이 16 KiB를 넘음. redaction 전에 자를 수 없어 다음 줄바꿈까지 통째로 버린다"
        observe: ["disk:apps/<app>/logs/app.log"]
      - id: not-logged
        when: "의도한 정지, preview 자식의 출력, preview 화면 오류, dataRoot가 없어 쓸 곳이 없음"
        observe: ["log:app"]
    crosses_process: false
    risk: [secret]
    refs: [A15]
    docs: [architecture/app-call.md]

  - id: app-log-read
    title: "앱 log의 최근 줄을 읽는다"
    actor: agent
    entries: [route:apps/logs]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/reads.ts, packages/core/apps/runtime/observations/log-file.ts]
