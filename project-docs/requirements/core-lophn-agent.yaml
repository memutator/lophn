schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # agents

  - id: req-0030
    status: accepted
    subject: agents
    statement: App Engineer와 Operator는 place(project 또는 앱)에, Project Manager는 project place에 놓이고, lophn은 place에 놓이지 않고 lophn 전체에 하나다. 앱에서도 lophn, App Engineer, 그 앱의 Operator를 쓴다.
    acceptance:
      - App Engineer와 Operator는 project 하나나 앱 하나에 놓여 있고, Project Manager는 project 하나에 놓여 있다.
      - lophn은 하나이고, 어느 project나 앱에서 불러도 같은 lophn이다.
      - 앱 하나에서 lophn, App Engineer, 그 앱의 Operator를 각각 부를 수 있다.
    related:
      - shell

  - id: req-0031
    status: accepted
    subject: agents
    statement: Operator는 place에 놓여 그 place의 일을 하는 agent이고, 주기 실행이 없어도 Operator다.
    acceptance:
      - 주기를 정하지 않고 Operator를 만들고 그 Operator와 session을 연다.

  - id: req-0032
    status: accepted
    subject: agents
    statement: 사람은 project마다 Operator를 필요한 만큼 만든다.
    acceptance:
      - 한 project에 Operator를 여럿 만들 수 있다.
      - 한 project에서 만든 Operator는 다른 project의 Operator 목록에 나오지 않는다.

  - id: req-0033
    status: accepted
    subject: agents
    statement: Operator와 그 project의 context는 N:M으로 잇고, Operator에 context가 없어도 된다.
    acceptance:
      - context 없이 Operator를 만들 수 있다.
      - Operator 하나에 context 여럿을 붙일 수 있다.
      - context 하나를 여러 Operator에 붙일 수 있다.
      - 다른 project의 context는 Operator에 붙일 수 없다.
    related:
      - contexts

  - id: req-0034
    status: accepted
    subject: agents
    statement: Operator 같은 agent 정의는 project 폴더가 아니라 lophn data 안 project별 폴더에 둔다.
    acceptance:
      - Operator를 만들어도 project 폴더에 새 파일이 생기지 않는다.
      - Operator 정의는 lophn data 안 그 project의 폴더에 있다.
    related:
      - storage

  - id: req-0035
    status: accepted
    subject: agents
    statement: Project Manager는 project마다 하나이고, project를 등록하면 생기며 더하거나 지울 수 없다.
    acceptance:
      - project를 등록하면 그 project의 Project Manager가 하나 생긴다.
      - Project Manager는 자기 project의 context만 맡고, 다른 project의 context는 그 project의 Project Manager가 맡는다.
      - 사람은 Project Manager를 더하거나 지울 수 없다.

  - id: req-0036
    status: accepted
    subject: agents
    statement: lophn agent는 project 폴더의 LOPHN.md를 project 지침으로 읽고, AGENTS.md는 읽지 않는다.
    acceptance:
      - project 폴더 root의 LOPHN.md 내용이 그 project의 agent 지침에 들어간다.
      - project에 AGENTS.md만 있으면 그 내용은 lophn agent에게 가지 않는다.

  - id: req-0037
    status: accepted
    subject: agents
    statement: project 지침은 그 project에 놓인 모든 agent가 같이 읽고, place에 놓이지 않은 lophn은 그 project의 일을 할 때 tool로 읽는다.
    acceptance:
      - 같은 project에 놓인 Project Manager와 Operator들은 모두 같은 project 지침을 받는다.
      - 앱 source가 등록 project 안에 있으면 그 앱의 App Engineer도 그 project 지침을 받고, 어느 project에도 없으면 project 지침 없이 돈다.
      - lophn의 prompt에는 project 지침이 들어가지 않고, 지침 읽기 tool로 고른 project의 지침을 읽는다.
    related:
      - agent-roles

  - id: req-0038
    status: accepted
    subject: agents
    statement: agent 설정(skill, MCP, 지침, model)은 전역, project, Operator 층에서 정한다.
    acceptance:
      - 전역에서 정한 설정은 모든 project의 agent에 쓰인다.
      - project에서 정한 설정은 그 project의 agent에 쓰인다.
      - Operator에서 정한 설정은 그 Operator에만 쓰인다.
    related:
      - shell

  - id: req-0039
    status: accepted
    subject: agents
    statement: agent의 model은 agent 설정에서 정한다.
    acceptance:
      - agent 설정에서 고른 model로 그 agent가 돈다.
    related:
      - models
      - shell

  - id: req-0040
    status: accepted
    subject: agents
    statement: agent마다 프로필로 icon이나 사람이 올린 이미지를 정한다.
    acceptance:
      - agent의 프로필을 icon 목록에서 고를 수 있다.
      - 사람이 올린 이미지를 agent의 프로필로 쓸 수 있다.
    related:
      - shell

  - id: req-0098
    status: accepted
    impl: partial
    gap: 전역 끄기만 된다. project 층에 끈 표시를 둘 곳이 없어, Agents 탭의 skill 스위치는 눌러도 바뀌지 않는다.
    subject: agents
    statement: skill은 전역과 project 층에서 끌 수 있고, 끄면 지우지 않고 꺼짐으로 표시한다. lophn에 내장된 skill은 skill마다 끌 수 있는지가 정해져 있고, 끌 수 없는 것은 끄지 않는다.
    acceptance:
      - project에서 skill을 끄면 그 project의 agent turn이 그 skill을 쓰지 않고, 다른 project의 agent는 그대로 쓴다.
      - 전역에서 skill을 끄면 모든 project의 agent turn이 그 skill을 쓰지 않는다.
      - 끈 skill은 목록에 꺼짐으로 남고, 다시 켜면 다음 turn부터 쓰인다.
      - 내장 skill은 목록에 내장으로 보이고, 끌 수 있는 것에만 끄는 스위치가 있다.
      - 끌 수 있는 내장 skill을 끄면 사람이 둔 같은 이름의 skill로 대신할 수 있다.
    related:
      - shell

  # agent-roles


  - id: req-1525
    status: accepted
    subject: agents
    statement: Project Manager는 lophn에 내장된 skill context-init과 context-update를 갖는다. context-init은 새 context의 첫 판을 짜는 절차이고, context-update는 적용된 판에서 새 판을 짜는 절차다.
    acceptance:
      - Project Manager의 skill 목록에 context-init과 context-update가 내장 skill로 있다.
      - 두 skill은 끌 수 없다.
      - 다른 role의 agent에는 두 skill이 없다.
      - context-init은 목적을 정하고 첫 판의 계약과 검색 script를 짜서 test를 거쳐 낸다.
      - context-update는 적용된 판을 바탕으로 새 판을 짜서 test를 거쳐 낸다.

  - id: req-1526
    status: accepted
    subject: agents
    statement: Project Manager는 자기 project에, App Engineer는 자기 앱에 놓인 Operator를 만들고 고친다. lophn은 Operator를 만들거나 고치지 않고 그 place의 Project Manager나 App Engineer에게 call로 맡긴다.
    acceptance:
      - Project Manager가 자기 project에 Operator를 만들고 그 정의를 고칠 수 있다.
      - App Engineer가 자기 앱에 Operator를 만들고 그 정의를 고칠 수 있다.
      - 다른 project나 앱의 Operator를 만들거나 고치려 하면 거절된다.
      - lophn에는 Operator를 만들거나 고치는 tool이 없고, Operator가 필요하면 그 place의 Project Manager나 App Engineer에게 call을 보낸다.
      - 기본 agent grant에서 Operator를 만들거나 고치는 호출은 사람에게 묻는다.
      - agent가 만든 Operator에는 agent grant가 없고, grant는 사람이 할당한다.
      - 앱에 놓인 Operator가 일할 project 폴더는 사람이 정한다.
  - id: req-0041
    status: accepted
    subject: agent-roles
    statement: Project Manager는 context 계약, 검색 script와 그 최적화를 만들고 고친다.
    acceptance:
      - Project Manager session에서 계약과 검색 script의 초안을 만들고 고칠 수 있다.
    related:
      - contexts

  - id: req-0042
    status: accepted
    subject: agent-roles
    statement: Project Manager는 context 사이 참조가 최소가 되게 context의 경계를 긋는다.
    acceptance:
      - Project Manager의 role 지침에 context 경계 설계(안은 단단히 뭉치고 밖과는 적게 잇기)가 책임으로 들어 있다.
    related:
      - contexts

  - id: req-1450
    status: accepted
    impl: partial
    gap: "App Engineer와 이야기하며 ticket을 만들 수는 있지만, coding agent를 띄우고 일을 시키는 것은 아직 사람이 한다."
    subject: agent-roles
    statement: 앱을 만들고 고치는 일에서 사람의 창구는 App Engineer다.
    acceptance:
      - 앱 제작이나 수리를 요청하는 사람은 App Engineer session에서 요청하고 진행과 결과를 받는다.
      - 사람이 coding agent session을 열지 않아도 요청한 일이 ticket과 완료 보고까지 이어진다.
    related:
      - app-tickets

  - id: req-1451
    status: accepted
    impl: done
    subject: agent-roles
    statement: App Engineer는 사람의 요청으로 ticket을 만든다.
    acceptance:
      - App Engineer session에서 앱을 만들어 달라거나 고쳐 달라고 요청하면 그 앱의 ticket이 만들어진다.
    related:
      - app-tickets

  - id: req-1452
    status: accepted
    impl: done
    subject: agent-roles
    statement: App Engineer는 앱의 문제로 ticket을 만든다.
    acceptance:
      - 열린 문제를 근거로 App Engineer가 수리 ticket을 만들면 그 문제가 ticket에 묶인다.
    related:
      - app-tickets
      - problems

  - id: req-1453
    status: accepted
    impl: todo
    subject: agent-roles
    statement: App Engineer는 ticket을 coding agent에게 맡긴다.
    acceptance:
      - App Engineer가 맡긴 ticket을 coding agent가 claim하면 그 ticket에 claim이 남는다.
    related:
      - app-tickets

  - id: req-1454
    status: accepted
    subject: agent-roles
    statement: "App Engineer는 완료 보고, claim 만료, 완료 보고 없는 coding agent session 끝, coding agent의 메시지를 입력으로 받는다. 개발 진행은 따로 동기화하지 않는다. 지금 돌고 있는지는 coding agent session 상태로 알고, 자세한 진행은 사람이 터미널 탭에서 본다."
    acceptance:
      - "완료 보고, claim 만료, 완료 보고 없는 session 끝, coding agent의 메시지가 각각 App Engineer session에 입력으로 들어온다."
      - "맡긴 App Engineer session이 닫혀 있으면 그 앱의 App Engineer 새 session이 열려 그 입력을 받는다."
      - "App Engineer가 맡긴 coding agent session의 상태(running, waiting, idle, unknown)를 읽는다."
    related:
      - app-tickets
      - events

  - id: req-1455
    status: accepted
    impl: todo
    subject: agent-roles
    statement: App Engineer는 coding agent의 완료 보고를 ticket의 acceptance check로 검증하고 그 결과를 사람에게 올린다.
    acceptance:
      - 완료 보고가 접수된 ticket에서 App Engineer가 조건별 통과, 실패, 미확인과 근거를 읽고 사람에게 알린다.
      - App Engineer가 사람에게 올린 결과가 ticket의 조건별 검사 결과와 같다.
    related:
      - app-tickets

  - id: req-1456
    status: accepted
    subject: agent-roles
    statement: App Engineer는 앱의 blueprint(app-api, 입력, 효과, permission, SDK 의존)를 쓰고 고치며, blueprint 검사의 오류, 경고, permission 검토를 따로 읽는다.
    acceptance:
      - App Engineer session에서 앱의 blueprint를 고칠 수 있다.
      - blueprint 검사 결과에서 오류, 경고, permission 검토가 따로 읽힌다.
    related:
      - apps
      - coding-agent

  - id: req-1457
    status: accepted
    subject: agent-roles
    statement: App Engineer는 앱이 쓸 package(lophn SDK, 사용자 package, npm과 jsr package)와 정확한 version을 고르고, 맡기기 전에 blueprint의 의존 선언에 고정하며, 이미 다른 version이 있으면 바꾸지 않고 충돌로 알린다.
    acceptance:
      - App Engineer가 lophn package를 설명이나 API 이름으로 찾는다.
      - App Engineer가 npm이나 jsr package를 정확한 version으로 고른다.
      - 고른 package의 정확한 version이 앱의 의존 선언에 고정된다.
      - 이미 다른 version이 선언돼 있으면 바뀌지 않고 충돌이 알려진다.
    related:
      - package-registry
      - coding-agent

  - id: req-1488
    status: accepted
    subject: agent-roles
    statement: 사람이 보낸 annotation은 그 앱의 App Engineer session에 메시지로 들어가고, App Engineer가 그 요청으로 ticket을 만들면 ticket 근거로 붙는다.
    acceptance:
      - annotation을 보내면 App Engineer session에서 메모와 screenshot을 읽는다.
      - 그 요청으로 만든 ticket의 근거에 annotation이 붙고, 맡은 coding agent가 CLI로 읽는다.
    related:
      - shell
      - app-tickets
      - coding-agent

  - id: req-1490
    status: accepted
    subject: agent-roles
    statement: "agent는 자기 책임 범위를 지키고, 넘어가는 일은 그 일을 맡은 agent에게 call로 맡긴다. call은 답을 받지 않거나, 결과 하나를 받거나, 대화로 주고받으며, 부를 수 있는 agent는 agent grant가 정한다."
    acceptance:
      - "Operator가 앱을 고쳐야 하는 일을 만나면 직접 고치지 않고 그 앱의 App Engineer에게 call로 맡긴다."
      - "Operator가 context 계약을 바꿔야 하면 직접 고치지 않고 Project Manager에게 call로 맡긴다."
      - "결과를 받는 call의 결과는 보낸 agent의 session에 입력으로 돌아온다."
      - "agent grant에 없는 agent를 부르면 막힌다."
    related:
      - agents

  # agent-sessions

  - id: req-0043
    status: accepted
    subject: agent-sessions
    statement: session의 role은 session을 만들 때 정해진다. 다른 role과 일하려면 새 session을 연다.
    acceptance:
      - 다른 role을 고르면 새 session이 새 탭에 열리고, 원래 session의 role은 그대로다.
    related:
      - agent-roles
      - shell

  - id: req-0044
    status: accepted
    subject: agent-sessions
    statement: 되돌리기는 agent session이 살아 있는 동안만 되고, session 안의 시점으로 대화와 그 session에서 agent가 file tool로 바꾼 파일을 되돌린다. shell이 바꾼 파일은 되돌리지 않는다.
    acceptance:
      - session 안의 한 시점으로 되돌리면 그 뒤의 대화와 그 뒤에 agent가 file tool로 바꾼 파일이 그 시점 상태로 돌아간다.
      - shell 명령이 바꾼 파일은 되돌린 뒤에도 그대로 남는다.
      - session이 끝난 뒤에는 그 session의 되돌리기를 할 수 없다.

  - id: req-0045
    status: accepted
    subject: agent-sessions
    statement: session은 이름을 바꾸고, archive하고, 지울 수 있다.
    acceptance:
      - session의 이름을 바꾸면 session 목록에 새 이름이 보인다.
      - session을 archive하면 그 session은 archive된 상태로 남는다.
      - 지운 session은 session 목록에서 사라진다.
    related:
      - shell

  - id: req-1489
    status: accepted
    subject: agent-sessions
    statement: "사람은 session의 composer에서 slash command를 부른다. slash command는 harness가 바로 실행하는 것(예: /compact), 정해진 prompt를 agent에게 보내는 것(예: Claude Code와 Codex의 /init), 그 agent에 붙은 skill을 실행하는 것 세 가지다."
    acceptance:
      - composer에 /를 치면 그 session에서 쓸 수 있는 slash command가 나온다.
      - /compact를 부르면 agent에게 prompt를 보내지 않고 harness가 바로 대화를 compact한다.
      - prompt command를 부르면 정해진 prompt가 agent에게 간다.
      - skill 이름으로 부르면 그 skill이 실행된다.
    related:
      - shell
      - agents

  # run-loop

  - id: req-0099
    status: accepted
    impl: partial
    gap: run은 skill 본문이 아니라 hash만 고정한다. 그래서 도는 중에 파일이 바뀌면 그 run의 skill 읽기가 changed로 실패하고, 처음 읽은 내용을 끝까지 쓰지 못한다.
    subject: run-loop
    statement: skill을 더하거나 고치면 lophn을 다시 띄우지 않아도 다음 turn부터 바뀐 skill이 쓰인다.
    acceptance:
      - skill 폴더에 새 skill을 두면 lophn을 다시 띄우지 않아도 다음 turn에서 그 skill을 쓸 수 있다.
      - skill 본문을 고치면 다음 turn이 고친 본문을 읽는다.
      - 도는 중인 turn은 시작할 때 읽은 skill을 끝까지 쓴다.
    related:
      - agents

  # agent-tools

  # 폐기: 쓰기 tool을 가진 agent는 모두 place에 놓이고 file tool은 place 폴더 안에서만 쓴다(S4 3장, S8 9장 3). lophn은 쓰기 tool이 없고 call로 맡긴다.
  - id: req-0046
    status: rejected
    subject: agent-tools
    statement: agent가 project 밖에서 문서를 쓰려면 먼저 어느 project에 둘지 사람에게 묻는다.
    details:
      ordering:
        - 사람이 project를 고른 뒤에 파일을 쓴다.
    acceptance:
      - project에 놓이지 않은 session에서 문서를 쓰게 하면 agent가 먼저 project를 묻는다.
      - 사람이 고른 project 폴더에 그 파일이 생긴다.
    related:
      - projects

  - id: req-0047
    status: accepted
    subject: agent-tools
    statement: 앱에 붙은 Operator는 앱 data를 특정 project 폴더에 파일로 쓸 수 있다.
    acceptance:
      - 앱 Operator가 앱 data를 정한 project 폴더에 파일로 쓰면 그 파일이 그 project의 문서가 된다.
    related:
      - app-data
      - projects

  # models

  - id: req-0048
    status: accepted
    subject: models
    statement: model 목록과 model마다의 variant는 data로 받는다.
    acceptance:
      - data에 model이나 variant 값을 더하면 model picker에 나온다.

  - id: req-0049
    status: accepted
    subject: models
    statement: 고를 수 있는 effort 값은 model마다 다르다.
    acceptance:
      - model을 고르면 그 model이 가진 effort 값만 고를 수 있다.

  - id: req-0050
    status: accepted
    subject: models
    statement: model의 variant는 effort만이 아니다. 속도(fast) 같은 다른 축도 model마다 가진다.
    acceptance:
      - OpenAI model에서 service_tier priority(fast)를 고를 수 있다.
      - xAI grok model에서 fast를 고를 수 있다.

  - id: req-0051
    status: accepted
    subject: models
    statement: provider마다 연결은 하나다.
    acceptance:
      - 연결된 provider마다 credential이 하나 있다.

  # agent call

  - id: req-1499
    status: accepted
    subject: agent-sessions
    statement: "agent는 call을 보낸 뒤 기다리며 막히지 않고, 답은 보낸 session에 새 입력으로 들어온다."
    acceptance:
      - "call tool은 call ID를 바로 돌려주고 보낸 agent의 turn은 이어 간다."
