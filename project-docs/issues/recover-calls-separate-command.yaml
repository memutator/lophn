id: recover-calls-separate-command
title: "켤 때 `RecoverCalls`가 별도 command다"
kind: defect
status: kept
topic: agent-call
modules: [packages/core/router]
now: |
  켤 때 main이 `RecoverCalls`(`router/commands.ts`의 `recoverCallsCommand`, core 자격만)를 한 번 부른다. `failLostOnStart`가 `accepted`이고 `consumed = 0`인 call을 `lophn_restarted`로 닫고 보낸 session에 알리며, `interruptRunningTurns`로 돌던 turn도 같은 tx에서 `interrupted`로 닫는다. 같은 시점에 `coding/recover.ts`의 `recoverCoding`이 앱 줄과 대기열 표를 비운다.
impact: |
  별도 command 하나, 별도 route 하나, 켤 때 호출 순서(agent runtime이 turn을 읽기 전)에 기댄다. 대신 입력함·앱 줄이 꺼지면 사라지는 대신 조용히 사라지는 call이 없다는 보장이 이 한 곳에서 선다.
fix: |
  추천: 남긴다(kept). 입력함이 메모리인 한 켤 때 정산은 필요하고, 합칠 만한 기존 command가 없다.
closed: |
  입력함이 메모리인 한 켤 때 정산은 필요하고 합칠 만한 기존 command가 없다.
guard: 없음
