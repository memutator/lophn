  - id: extension-tool-call
    title: agent가 extension tool을 부르면 할당을 판정하고 shell main handler에 넘긴다
    actor: agent
    entries: [route:extension_tools/call]
    pre: [route:extension_tools/publish]
    boundary: [extension-api, host-queue-interface, approvals]
    code: [packages/core/main/daemon/wiring/extension-tools.ts, packages/core/lophn-agent/tools/extension-tools.ts]
    steps:
      - "agent session과 turn 조건이 없으면 forbidden이다. 이름이 ext__<extension>__<tool> 꼴이 아니면 not_found다"
      - "session과 agent 정의의 extensions를 읽는다(읽기 오류는 그대로 간다). Gate extension_tool을 판정한다: 할당이 없으면 not-assigned, 켜진 catalog에 tool이 없으면 removed다"
      - "shell이 붙어 있지 않으면 unavailable이다. 이 호출만 쓰는 harness credential을 빌려(ledger 기록) host queue의 tool_call로 shell main handler를 부른다. host queue가 가득 차 가장 앞이라 밀려나면 unavailable이다"
      - "기다리는 동안 1초마다 shell이 붙었는지 보고 떨어지면 호출을 버린다(unavailable). shell이 결과 없이 끝내면 unavailable, 오류를 돌려주면 그 code가 그대로 간다"
      - "결과 content는 감싸지 않고 돌려준다. 이 호출 자격은 자기 session·turn의 lophn 명령 route에만 닿고(사람 전용 route와 다른 session은 막힌다), 끝나면 release해 더는 쓰이지 않는다"
    outcomes:
      - id: ran
        observe: [response, process:shell-main]
        when: shell main handler가 결과를 돌려줬다
      - id: not-assigned
        code: forbidden
        observe: [response]
        when: 정의의 extensions에 그 extension이 없다
      - id: removed
        code: forbidden
        observe: [response]
        when: 켜진 catalog에 그 tool이 없다(뺐거나 껐다)
      - id: not-extension-tool
        code: not_found
        observe: [response]
        when: 이름이 ext__ 꼴이 아니다
      - id: not-agent
        code: forbidden
        observe: [response]
        when: agent session과 turn 자격이 없다
      - id: shell-detached
        code: unavailable
        observe: [response]
        when: "shell이 붙어 있지 않거나(판정 뒤) 기다리는 중 떨어져 호출을 버렸다(abandon)"
      - id: read-failed
        observe: [response]
        when: session이나 agent 정의를 읽지 못했다. 그 오류가 그대로 간다
      - id: credential-failed
        observe: [response]
        when: 이 호출용 agent 자격을 발급하지 못했거나 ledger에 기록하지 못했다. 그 오류가 그대로 간다
      - id: handler-failed
        observe: [response, process:shell-main]
        when: shell main handler가 오류를 돌려줬다(그 code가 그대로 간다)
      - id: no-result
        code: unavailable
        observe: [response, process:shell-main]
        when: shell main handler가 결과 없이 끝났다(done에 output이 없다)
      - id: queue-full
        code: unavailable
        observe: [response]
        when: host queue가 가득 차 이 호출이 가장 앞이라 밀려났다. shell에 닿지 못했다
    crosses_process: true
    risk: [permission]
    refs: [H3]
    docs: [architecture/extension.md, architecture/approval.md]
    unclear:
      - "abandon은 기다림만 풀고 shell 쪽 실행은 막지 못한다. shell이 떨어진 뒤 handler가 돌았는지는 이 flow에서 알 수 없다"

  # ---- OAuth 발급자 호출 대기열 ----
  - id: issuer-request-relay
    title: core의 OAuth 발급자 호출을 agent runtime이 대신 보내고 답을 돌려준다
    actor: system
    entries: [route:issuer-requests/take, route:issuer-requests/done]
    boundary: [child-supervision-protocol, models]
    code: [packages/core/lophn-agent/issuer-requests.ts, packages/core/main/agent-runtime/issuer-pump.ts, packages/protocol/lophn-agent/issuer-requests.ts]
    steps:
      - "core가 MCP와 provider의 token 교환, 갱신, JWKS, device code 요청을 queue에 올린다. URL은 https이거나 loopback http만, method는 GET이나 POST만, 본문은 상한 안만 허용한다. 밖이면 queue에 올리지 않고 바로 연결 실패로 거절한다"
      - "runtime의 issuer pump가 TakeIssuerRequest로 하나씩 가져가 보낸다. queue가 비었으면 request가 null이다. redirect는 따라가지 않고 6초로 끊는다"
      - "응답의 status, Location, body를 FinishIssuerRequest로 돌려준다. body가 상한을 넘거나 닿지 못하면 response를 null로 준다"
      - "core는 8초 안에 답이 없으면 요청을 대기열에서 빼고 실패로 돌린다. 늦은 답은 받지 않는다"
      - "요청과 응답 본문은 ledger, event, log 어디에도 남기지 않는다"
    outcomes:
      - id: answered
        observe: [request:oauth-issuer, response]
        when: 발급자가 답했고 core가 그 응답을 받았다
      - id: unreached
        code: unavailable
        observe: [response]
        when: runtime이 발급자에 닿지 못했다고 done(null)을 보냈다(body 상한 초과 포함). core 호출자는 연결 실패로 받는다
      - id: deadline
        code: unavailable
        observe: [request:oauth-issuer, response]
        when: 8초 안에 runtime 답이 없어 core가 기한 초과로 실패시켰다
      - id: late-done
        observe: [response]
        when: 기한이 지난 뒤 늦게 done이 왔다. accepted가 false다
      - id: refused-request
        observe: [response]
        when: "core가 보내려는 요청이 허용 밖이다(https도 loopback http도 아닌 URL, GET·POST 밖의 method, 본문 상한 초과). queue에 올리지 않고 연결 실패로 거절했다"
      - id: none-waiting
        observe: [response]
        when: take할 요청이 없다(request null)
      - id: invalid-input
        code: invalid_input
        observe: [response]
        when: take나 done의 입력이 맞지 않는다
      - id: forbidden
        code: forbidden
        when: "이 route의 actor 종류가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: true
    risk: [secret, sandbox]
    refs: []
    docs: [architecture/agent-definition.md]
    unclear:
      - "areas.yaml은 OAuth token 갱신을 models area에 두었다. 이 입구 파일이 turns area라 여기 적었다. models 쪽 flow와 겹치지 않게 조율이 필요하다"

  # ---- trace와 사용량 읽기 ----
  - id: agent-trace-read
    title: turn, session, model 호출 하나의 원본 참조 trace를 읽는다
    actor: person
    entries: [route:agent-traces/read]
    boundary: [core-api]
    code: [packages/core/lophn-agent/observability/reads.ts, packages/protocol/lophn-agent/traces.ts]
    steps:
      - "원본 표(turns, events, model_calls, tool_calls, messages, blob_refs)를 읽기만 하고 아무것도 쓰지 않는다"
      - "agent 자격은 자기 session의 것만 보고 그 밖은 없는 대상과 같은 not_found다"
      - "기간(from_at, through_at)과 cursor로 거른다. 빈 기간이나 뒤집힌 기간은 schema에서 invalid_input이다. cursor는 session 대상에서만 쓰고 풀지 못하면 invalid_input이다"
    outcomes:
      - id: ok
        observe: [response]
        when: trace 조각을 돌려줬다
      - id: not-found
        code: not_found
        observe: [response]
        when: 대상이 없거나 agent 자격이 다른 session이거나 기간 밖이다
      - id: bad-period
        code: invalid_input
        observe: [response]
        when: 기간이 비었거나 뒤집혔다(schema)거나 session 대상의 cursor를 풀 수 없다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/observability.md]
    unclear: []

  - id: agent-usage-read
    title: model 호출의 사용량과 비용을 turn, session, model, 기간별로 합산한다
    actor: person
    entries: [route:agent-usage/read]
    boundary: [core-api]
    code: [packages/core/lophn-agent/usage/reads.ts, packages/protocol/lophn-agent/traces.ts]
    steps:
      - "model 호출 기록을 turn, session, model, 기간(started_at)으로 거르고 통화별로 나눠 usage와 cost를 합산한다"
      - "합계는 model_calls 원본에서 다시 계산한다. missing_records는 0, complete는 true로 고정이다(빠진 기록을 세지 않는다)"
    outcomes:
      - id: ok
        observe: [response]
        when: 묶음별 합계를 돌려줬다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/observability.md]
    unclear:
      - "missing_records와 complete가 고정이라 기록이 빠진 호출을 알리지 못한다. 설계와 맞는지 확인이 필요하다"
