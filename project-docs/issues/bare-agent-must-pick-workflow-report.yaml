id: bare-agent-must-pick-workflow-report
title: 'custom agent가 `workflow.report`를 고르지 않으면 step을 끝내지 못한다'
kind: bug
status: open
topic: workflow
modules: [packages/core/lophn-agent, packages/core/main]
now: |
  step 입력 글(`packages/core/lophn-agent/run-loop/input-text.ts`의 `inputParts`, `step` 갈래)은 runtime과 상관없이 "report it with `lophn workflow report`"다. custom session은 정의 `tools`에 `workflow.report`를 고르지 않았으면 `lophn` tool에 그 명령이 없고 실행 목록에도 없다(`packages/core/lophn-agent/run-loop/prepare.ts`의 `visibleTools`, `runnableTools`). result call은 custom이면 turn이 끝날 때 마지막 응답이 답이지만 step에는 그런 규칙이 없다.
impact: |
  사람이 custom agent를 workflow 참가자로 두고 `workflow.report`를 고르는 것을 잊으면 step이 보고되지 않아 instance가 멈춘다. custom의 result call 자동 답이 막으려던 것과 같은 실패다.
fix: |
  - step도 result call처럼 custom이면 `answer_completed` turn의 마지막 응답을 `workflow.report`(다음 step 없이 진행 기록, 또는 끝)로 보낸다. 다음 step을 고르는 `--next`를 model이 못 주므로 flow가 다음을 정하는 workflow만 맞다. 중간.
  - custom 정의가 workflow에 참가하면 편집 화면과 저장이 `workflow.report`를 요구한다. 어느 agent가 참가자인지는 flow 실행 때 정해져 저장 때 모른다. 중간.
  - 편집 화면 Tools의 도움말에 workflow 참가자는 `workflow.report`를 골라야 한다고 적는다. 잊는 것은 그대로 막지 못한다. 작음.

  추천: 첫째. harness 참가자(roadmap `agent-platform.md` 단계 7)도 같은 길이 필요하다.
