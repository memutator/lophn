  - path: tests/e2e/oauth_test.ts
    covers: [provider-login-start:started, provider-login-finish:pending, provider-login-finish:connected, provider-login-finish:not_found, provider-login-cancel:cancelled, provider-read:ok, provider-token-refresh:refreshed, provider-token-refresh:revoked, secret-attach:sent, turn-loop:failed-configuration-unavailable, turn-finish:completed, model-call-run:complete, model-call-read:ok, secret-status:ok, provider-token-refresh:not-due]
    note: "device code 로그인은 발급자 간격을 지키고 secret 셋을 저장한다. PKCE 로그인은 고정 callback으로 끝나고 token은 secrets.json 밖에 없다. 취소하면 listener가 닫힌다. 구독 token은 Bearer로만 나간다. 만료 전 갱신은 회전한 값을 저장하고, 갱신이 거절되면 revoked이고 model 요청이 나가지 않는다. 만료가 먼 token을 갱신 없이 건네는 것은 provider-token-refresh:not-due. connectOAuthProvider는 helper라 그 안의 로그인은 직접 본 결과만 적었다."
