  - path: packages/core/main/daemon/wiring/secret-slot_test.ts
    covers:
      - input-request-ask:forbidden
      - input-request-ask:not_found
      - input-request-ask:invalid_input
      - input-request-ask:conflict
    note: "createSecretSlots 직접 호출. provider·custom provider 자리는 home session만, 앱 자리는 그 앱과 home session만 청한다(그 밖은 forbidden). MCP 자리는 session이 닿는 층(home은 전역·Home·자기 정의, project·앱은 자기 정의와 자기 workspace)의 server만 풀리고 다른 층·다른 workspace의 server는 not_found, 같은 이름은 agent 층이 이긴다. 모르는 정의와 허락받지 않은 secret 이름, 청할 것이 없는 server는 not_found, 로그인 없는 정의의 sign_in·http가 아닌 custom 주소·내장과 겹치는 custom 이름·청할 것이 여럿인 server의 part 누락은 invalid_input, 이미 연결된 provider에 로그인과 앱 OAuth client id 없음은 conflict다. secret 이름과 목적지는 정의·grant·설정에서 나오고(agent가 이름을 정하지 못한다), key와 로그인을 둘 다 가진 provider는 기본이 key다. card에 뜨는 것과 결과 stored·signed_in은 covers 밖"

  - path: packages/core/main/daemon/wiring/host-queue_test.ts
    covers:
      - host-preview-tab-open:accepted
      - host-preview-tab-open:reused
      - host-preview-tab-open:not_found
      - host-preview-tab-open:conflict
      - host-tab-open:invalid_input
      - host-artifact-tab-open:accepted
      - host-artifact-tab-open:reused
      - host-artifact-tab-open:not_found
      - host-artifact-tab-open:invalid_input
      - host-coding-handoff-open:accepted
      - host-coding-handoff-open:invalid_input
      - host-tab-close:accepted
      - host-tab-close:forbidden
      - host-tab-close:not_found
      - host-browser-inspect:not_found
      - host-browser-inspect:unavailable
      - host-browser-act:not_found
      - host-browser-read:not_found
      - host-browser-tab-open:opened
      - host-browser-tab-open:opened-app-started
      - host-browser-tab-open:shell-not-attached
      - host-browser-tab-open:start-failed
      - host-browser-tab-open:page-timeout
      - host-shell-launch:shared
      - host-shell-launch:backoff
    note: "createTabHandlers 직접 호출. fill_login은 없는 login id가 not_found이고 queue 항목에 login id만 있으며 username은 metadata의 글로 fill이 되고 결과에 filled가 붙는다. browser 결과의 알려진 secret 값은 지워진다. preview 탭은 그 앱 workspace의 session과 사람 token만 열고(다른 앱·project·home session은 not_found), 사람 token은 session 탭을 열지 못하며(invalid_input), 돌고 있는 preview가 없으면 conflict. 같은 앱의 preview 탭은 하나고 주인은 나중에 연 쪽이라 이전 주인의 close는 forbidden. browser 호출은 주인만 하고 남이나 사람이 연 탭은 not_found, 주인은 shell이 붙지 않아 unavailable. device 이름 not_found와 shell 쪽 판정(낡은 ref 등)은 covers 밖. browser 탭 열기는 workspace를 띄운 창 없이도 shell에 가고 page가 붙어야 성공하며 기한이 지나면 unavailable에 탭이 남지 않는다. shell이 없으면 한 번만 띄우고 붙어서 bind되면 성공하고, 30초 안에 붙지 않거나 spawn이 실패하면 같은 시도가 함께 unavailable이며 5분은 다시 띄우지 않고 바로 실패한다. 앱이 끝나 shell이 없으면 browser 탭은 표에서 빠지고 없는 탭과 같은 not_found 문장이다. preview·artifact 탭은 shell이 없어도 띄우지 않는다"

