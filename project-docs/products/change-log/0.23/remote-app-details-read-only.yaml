id: remote-app-details-read-only
version: 0.23.98
title: 다른 컴퓨터의 artifact 탭과 앱 App details를 이 컴퓨터의 창에서 읽기 전용 탭으로 연다
modules: [packages/protocol, packages/core/projects, packages/shell/ipc, packages/shell/main, packages/shell/renderer]
change: |
  - 다른 컴퓨터의 project·앱 artifact 탭이 "This opens only on <이름>" 대신 이 컴퓨터의 창에서 읽기 전용으로 열린다(기계 꼬리표 표시, `[Edit source]`·`[Annotate]`·삭제·agent 조작은 없다). 디스크 `.html` file과 workflow artifact는 이 컴퓨터만 연다.
  - core에 `artifacts/list`(목록)와 `artifacts/file`(봉한 artifact 폴더 안 file stream, 가상 `data/_entries.json` 포함, 4 MiB 상한, `lstat`·`realpath`·`O_NOFOLLOW` 경계 검사)을 더하고 기기 route 목록(`REMOTE_ALLOWED_ROUTES`)에 넣었다(`REMOTE_AGENT_ROUTES` 밖). shell main의 봉한 `lophn-artifact:` server가 다른 기계의 artifact는 그 기계의 link로 받아 같은 CSP·상한 규칙으로 내보낸다.
  - 다른 컴퓨터의 앱 workspace에도 App details 단추가 서고, 탭은 "This opens only on <이름>" 대신 그 컴퓨터의 core를 읽어 그린다(Run 실행 상태, Folders 이은 폴더 목록, Version의 release 줄과 이전 release, Access의 grant, Activity의 호출 기록과 영구 기록, Machines 절).
  - App details는 읽기만 한다. 이름·보관·icon(General, Icon 절)과 실행 switch, 폴더 더하기·빼기, 돌아가기, 거두기, secret 값·OAuth 로그인, rewind 단추는 그리지 않고 안내 한 줄이 서 있다. 동의 card를 여는 단추와 호출 기록의 session link도 없다.
  - 기기 route 목록에 App details 읽기 route를 더했다: `apps/logs`, `activations/queue`, `activations/compare`, `apps/sdk_status`, `apps/update_state`, `apps/oauth_state`(token·client secret 값은 없다). 쓰는 route는 더하지 않았다.
  - secret이 든 지(`secrets/status`)는 사람의 route라 허락 없는 기기에는 모른다고 보인다(전에는 Access 탭 읽기가 통째로 실패했다).
why: |
  다른 컴퓨터의 agent와 앱을 한 창에서 쓰는데 그 컴퓨터의 agent가 만든 artifact나 앱의 release·Activity·grant를 보려면 그 컴퓨터로 가야 했다. 보는 일은 기기 route와 봉한 partition으로 안전하게 열 수 있고 쓰는 일만 그 컴퓨터의 사람 몫이라, 보는 쪽만 연다.
decisions:
  - text: >-
      App details의 쓰는 단추는 막지 않고 감춘다. 받는 기계가 쓰는 route를 거절하는 것이 권한이고 화면은 안내다. 버린 길: 쓰는 route를 기기 목록에 더하기(앱 보관과 grant 거두기를 폰까지 열게 된다).
    by: agent
  - text: >-
      `secrets/status`는 기기 목록에 더하지 않고 모른다고 보인다. 두 목록(`REMOTE_ALLOWED_ROUTES`, `REMOTE_PERSON_ROUTES`)이 겹치지 않는 규칙을 지킨다.
    by: agent
  - text: >-
      다른 컴퓨터의 artifact는 `kind: "artifact"`(project·앱 data root 안)만 열고 디스크 `.html`과 workflow artifact는 `thisComputerOnly`로 남긴다. 버린 길: 임의 디스크 경로를 기기 route로 열기(경계 확장).
    by: agent
