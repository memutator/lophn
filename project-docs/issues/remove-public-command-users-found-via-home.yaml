id: remove-public-command-users-found-via-home
title: AGENT.md A21은 쓰는 그릇의 lophn에게 알리고 사람에게 묻지 않는다고 쓰는데 앱 지침은 사람에게 물으라고 하고 앱 session은 누가 쓰는지 읽지 못한다
kind: bug
status: open
topic: app-call
modules: [packages/core/apps, packages/core/agent-workspaces]
now: |
  - `project-docs/products/AGENT.md` A21: 공개 command를 지우려면 앱 workspace의 session이 activate하기 전에 "쓰는 그릇 workspace의 lophn에게 결과를 받는 call로 알린다 … 사람에게는 묻지 않는다(F2)."
  - 앱 지침(`packages/core/agent-workspaces/prompts/app.md`)은 "Before you activate, ask the person (lophn at home sees who uses each public command), or bring the command back"이라고 쓴다. A21·F2와 반대다.
  - 앱 workspace session은 쓰는 그릇이 어디인지 읽을 수 없다. `apps/usage`(`packages/core/apps/usage/reads.ts`)는 home session이 아니면 `forbidden`이다. `release.prepare`의 `removed_public_tools`(`packages/protocol/apps/releases.ts`)는 지워지는 command만 싣고 쓰는 곳은 싣지 않는다.
impact: |
  앱 lophn이 지침대로 하면 software 결정(공개 command 지우기)을 사람에게 묻고(F2가 묻지 않는다고 정한 것), A21대로 하려 하면 쓰는 그릇을 찾을 길이 없어 막힌다. 쓰는 쪽에 알리지 않고 지우면 그 command에 기대던 다른 앱·project의 일이 깨진다.
fix: |
  - 작음(추천): 앱 지침을 "home의 lophn에게 결과를 받는 call로 알린다(`workspace: {home: true}`). home이 `apps/usage`로 쓰는 그릇을 찾아 그 lophn들에게 전하고 답을 모아 준다. 옮길 수 없다는 답이 오면 command를 되살린다. 사람에게는 묻지 않는다"로 고치고, A21에 home을 거친다는 것을 적는다. `app.md`는 앱 agent가 읽는 지침이라 `migrate-sdk` 메모가 든다.
  - 중간: `release.prepare`의 `removed_public_tools`에 쓰는 그릇을 실어 앱 session이 바로 그 lophn을 부른다. 그릇을 넘는 읽기라 P12와 부딪혀 권하지 않는다.
decided: |
  앞의 것으로 한다. F2가 공개 command를 agent가 정한다고 했으니 지침에서 "사람에게 묻는다"를 빼고, P12(경계는 그릇)를 지켜 쓰는 곳 찾기는 home을 거친다. 앞서 정한 "A21 문장을 지침에 맞게 고친다"는 A21이 F2에 맞게 바뀐 뒤라 방향이 반대가 됐다.
