id: command-result-overflow-to-file
version: 0.16.0
title: 명령 결과가 model 한도를 넘으면 버리지 않고 파일로 두고 경로를 준다
modules: [packages/core/lophn-agent, packages/protocol, packages/core/main]
checked: []
change: |
  전: 내장 명령 결과는 24 KiB를 넘으면 배열 뒤쪽을 버리고 `omitted` 수만 남겼다. 앱 command 결과는 24 KiB를 넘으면 통째로 `result: null`과 "the result was too large to show"로 바뀌었다. 나머지를 볼 길이 없어, 앱 지침이 "command 결과는 작게"를 요구하고 앱이 스스로 범위를 줄였다(calendar `agenda` 62일).
  후: handler는 전체를 돌려주고, 넘치면 runtime이 전체를 `<data root>/tool-results/<session>/<tool call>.json`에 쓰고 model에는 앞부분과 경로를 준다. 그 session의 file tool은 자기 결과 폴더만 읽기로 연다.
why: |
  결과를 model에 맞게 줄이는 것은 agent runtime의 책임이다. 그 한도 때문에 앱의 기능이 깎이면 안 된다.
decisions:
  - text: >-
      넘친 결과는 파일로 두고 경로를 준다(Claude Code가 큰 tool 출력을 파일로 두고 미리보기와 경로를 주는 것과 같다).
    by: person
  - text: >-
      스스로 창을 나누는 tool(file.read 등)은 이 길을 타지 않는다. 넘친 file.read를 다시 파일로 쓰는 고리를 막는다.
    by: agent
  - text: >-
      결과 폴더는 읽기 범위에 섞지 않고 따로 연다. 작업 폴더가 되지 않게 한다.
    by: agent
