  - id: app-sessions-stop
    title: "앱이 볼 수 있는 session의 도는 turn을 멈춘다"
    actor: app
    entries: [route:app_sessions/stop]
    uses: [route:turns/stop, host-link:done]
    boundary: [agent-sessions, run-loop, core-api]
    code: [packages/core/lophn-agent/session/lifecycle.ts, packages/core/main/daemon/wiring/session-lifecycle.ts, packages/core/host-queue/queue.ts]
    steps:
      - "app-sessions-list와 같이 앱을 정하고 session이 앱에 보이는지 본다(안 보이면 not_found). 승인·rewind·fork·지움은 이 길에 없다"
      - "lophn·harness session은 도는 turn을 core 안 machine 자격으로 StopTurn한다(turn이 interrupted로 닫히고 model 요청과 도는 shell.run이 끊긴다. harness runtime은 turn이 닫히면 host가 CLI를 group째 끊는다). 도는 turn이 없으면 stopped false다"
      - "멈췄으면 앱이 멈췄다는 program 기록(session_stopped_by_app, 앱과 session 제목)을 남긴다"
      - "터미널 session은 host queue에 terminal_interrupt를 넣고 shell main의 결과를 기다린다. shell main이 그 harness의 끊기 key를 치고 tracker가 사람이 친 것과 같이 상태를 unknown으로 내린다. key가 없는 harness, 탭이 없음, shell이 붙어 있지 않거나 기한(10초)이 지남은 오류로 돌아온다"
    outcomes:
      - id: stopped
        when: "도는 turn을 멈췄다(터미널은 끊기 key를 쳤다)"
        observe: [response, "ledger:turns", "ledger:notices"]
      - id: nothing-to-stop
        when: "도는 turn이 없다(stopped false)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "없는 session이거나 앱에게 보이지 않는다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "터미널: 그 harness에 끊기 key가 없음, shell main이 붙어 있지 않거나 기한 안에 답하지 않음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "앱 자격이 다른 앱을 입력에 적었다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않거나 사람 자격인데 app이 없다"
        observe: [response]
      - id: core-failed
        when: "StopTurn이 실패했다(그 오류 그대로. 이미 끝난 turn이면 conflict)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/workspace-session.md]

  - id: terminal-sessions-report
    title: "shell main이 터미널 coding agent의 지금 집합을 core에 알린다"
    actor: shell
    entries: [system:terminal-sessions-report]
    uses: [system:host-link]
    boundary: [agent-sessions, core-api]
    code: [packages/core/lophn-agent/session/lifecycle.ts, packages/core/main/daemon/wiring/session-lifecycle.ts, packages/shell/main/desktop/wiring/agent.ts]
    steps:
      - "shell main이 /host-link의 coding_report frame으로 집합(터미널 탭, project, harness, 상태, CLI session id, 제목, cwd, PTY shell pid, view, handoff, foreground, 최대 64)을 바뀔 때와 연결이 열릴 때마다 보낸다(coding-relay-sync). core는 메모리를 통째로 바꾼다. schema에 맞지 않는 frame은 연결이 닫는다(host-link:bad-frame)"
      - "새로 생긴 탭은 session.started(상태가 running·waiting이면 그 상태 event도), 사라진 탭은 session.ended, 상태가 바뀐 탭은 session.<상태>를 낸다(session-lifecycle-publish). unknown 상태로 바뀌는 것은 event가 없다"
      - "같은 집합이 coding relay(폰의 coding session 목록)에도 간다"
      - "연결이 닫히고 3초 유예 안에 다시 붙지 않으면 표와 coding relay를 비운다. core를 다시 켜면 비고 다시 붙은 연결이 채운다"
    outcomes:
      - id: reported
        observe: [event:StateChanged]
      - id: cleared
        when: "연결이 닫히고 3초 유예 안에 다시 붙지 않았다"
        observe: [event:StateChanged]
    crosses_process: false
    docs: [architecture/terminal-agent.md, architecture/workspace-session.md]

  # ---------- 주의: host가 보고한 presence와 못 본 turn 끝(unseen) ----------

  - id: presence-report
    title: "desktop이나 폰이 지금 앞에서 무엇을 보는지 core에 알린다"
    actor: person
    entries: [route:presence/report]
    boundary: [attention, core-api]
    code: [packages/core/attention/presence.ts, packages/core/attention/mod.ts, packages/core/main/daemon/wiring/attention.ts]
    steps:
      - "보고한 쪽은 입력이 아니라 자격(principal)이 정한다: shell main은 사람 자격, 기기는 device:<id>(보고를 받을 때 기기의 kind를 ctx.deviceKind로 읽어 phone인지 정한다). 보고(focused, idle_ms, 보고 중인 session 최대 32)로 그 쪽의 이전 보고를 바꾼다(메모리뿐, 표가 없다)"
      - "90초가 지난 보고는 없는 것이다(죽은 desktop이 push를 막지 않게). kind phone 기기는 focused일 때, 그 밖(사람의 shell main, kind desktop 기기)은 focused이고 idle이 120초 아래일 때 앞에 있다"
      - "앞에 있는 host가 새로 보는 session의 unseen을 끈다(StateChanged unseen)"
    outcomes:
      - id: recorded
        observe: [response, event:StateChanged]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다(looking이 32개를 넘음, idle_ms가 음수, session 참조 모양 오류)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]

  - id: unseen-list
    title: "못 본 turn 끝(finished·failed) 목록을 읽는다"
    actor: person
    entries: [route:unseen/list]
    boundary: [attention, core-api]
    code: [packages/core/attention/unseen.ts, packages/core/main/daemon/wiring/attention.ts]
    steps:
      - "메모리의 못 본 session(session, finished 또는 failed, 시각)을 돌려준다. 승인·질문 대기는 들지 않는다"
    outcomes:
      - id: ok
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]

  - id: unseen-dismiss
    title: "못 본 turn 끝을 사람이 지운다(보는 것과 같은 효과)"
    actor: person
    entries: [route:unseen/dismiss]
    boundary: [attention, core-api]
    code: [packages/core/attention/unseen.ts, packages/core/main/daemon/wiring/attention.ts]
    steps:
      - "그 session이 못 본 목록에 있으면 지우고 StateChanged unseen을 낸다. 다음 turn 시작과 session 끝도 같이 지운다"
    outcomes:
      - id: dismissed
        observe: [response, event:StateChanged]
      - id: nothing-to-dismiss
        when: "그 session이 목록에 없다(dismissed가 false)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "session 참조가 ses_ 또는 term: 모양이 아니다"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]

  - id: push-send
    title: "사람을 기다리는 일이 생기면 보고 있지 않은 폰에 Expo Push를 보낸다"
    actor: system
    entries: [system:push-send]
    uses: [route:presence/report, route:terminal_sessions/signal, route:devices/clear_push, route:devices/push_targets]
    boundary: [attention, remote, events]
    code:
      - packages/core/attention/triggers.ts
      - packages/core/attention/decide.ts
      - packages/core/attention/message.ts
      - packages/core/attention/push/mod.ts
      - packages/core/main/daemon/wiring/attention.ts
      - packages/core/main/daemon/wiring/remote.ts
    steps:
      - "Bus event(승인, 질문, 앱 동의·공유 요청, 안 읽은 앱 notice와 알려야 하는 program 기록, job의 놓친 차례, 60초 넘게 일한 turn의 끝)나 터미널 signal(대기, 60초 넘은 끝·실패)이 계기가 된다. 팀 자식의 요청·질문과 앱이 연 session의 turn 끝은 계기가 아니다"
      - "token이 있는 기기마다 정한다. 그 계기의 설정 칸이 꺼졌거나, 그 폰이 앞에 있거나, quiet_when_present이고 앞에 있는 desktop이 있으면 보내지 않는다. 지연은 없다"
      - "글은 고정 문장에 session 제목, agent 이름, 앱 이름, job 이름, notice 제목만 끼워 core가 만든다(show_names가 꺼져 있으면 일반 문장). 대화 글, 명령, 질문 글, 마지막 답, notice 본문은 싣지 않는다"
      - "remote.push가 비었거나 remote를 켠 적이 없어 컴퓨터의 key를 못 풀었으면 보내지 않는다. 아니면 Expo send를 부른다. 네트워크·429·5xx는 1, 2, 4초 뒤 세 번까지 다시 하고 그 밖의 실패는 버린다. 못 보낸 글은 다시 보내지 않는다"
      - "ticket이 ok면 id를 기억해 15분 뒤 영수증을 한 번 묻는다. ticket이나 영수증이 DeviceNotRegistered를 알리면 core 안 machine 자격이 그 기기의 token만 지운다(devices/clear_push)"
    outcomes:
      - id: sent
        when: "알릴 기기가 있고 Expo가 ticket을 ok로 돌려줬다"
        observe: ["request:expo-push"]
      - id: not-needed
        when: "설정 칸이 꺼졌거나 보고 있는 기기라서, 또는 계기가 아니라서 보낼 기기가 없다"
        observe: ["request:expo-push"]
      - id: push-off
        when: "remote.push가 비었거나 remote를 켠 적이 없다. fetch를 부르지 않는다"
        observe: ["request:expo-push"]
      - id: dropped
        when: "재시도 뒤에도 네트워크·429·5xx이거나 400처럼 다시 해도 안 되는 응답이다. 던지지 않고 버린다"
        observe: ["request:expo-push"]
      - id: dead-token
        when: "Expo가 ticket이나 영수증에서 DeviceNotRegistered를 알렸다. 그 기기의 token이 입력과 같을 때만 지우고 설정 칸은 남는다. 이미 없는 기기면 log만 남긴다(push_token_not_cleared)"
        observe: ["ledger:devices", "log:remote push_token_not_cleared"]
    crosses_process: false
    docs: [architecture/attention.md, architecture/remote.md]
    unclear:
      - "remote를 켰다가 끄면 같은 기동 안에서는 push가 계속 나간다(push-off가 아니다). 이슈 push-continues-after-remote-off"
      - "앱이 session을 멈춘 program 기록(session_stopped_by_app)은 desktop toast에는 뜨지만 push 계기에 없다. 이슈 push-alert-program-kinds-differ"
      - "GUI 탭의 승인은 계기가 아니다. 이슈 push-misses-gui-tab-approvals"

  - id: terminal-sessions-signal
    title: "shell main이 터미널 coding agent의 계기(대기, 끝, 실패)를 core에 알린다"
    actor: shell
    entries: [route:terminal_sessions/signal]
    boundary: [attention, core-api]
    code: [packages/core/attention/mod.ts, packages/core/attention/triggers.ts, packages/core/main/daemon/wiring/attention.ts]
    steps:
      - "사람 token(shell main)만 부른다. report가 목록이라면 이 route는 순간이다: tracker의 debounce 뒤 한 번씩 보낸다"
      - "waiting이면 그 터미널의 unseen을 끄고 push 계기(needs_you)가 된다. finished·failed이면 보고 있는 present host가 없을 때 unseen을 세우고, active_ms가 60초 이상이면 push 계기(long_finish)가 된다"
    outcomes:
      - id: signaled
        observe: [response, event:StateChanged]
      - id: forbidden
        code: forbidden
        when: "사람 token이 아닌 자격이 부른다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
    crosses_process: false
    docs: [architecture/terminal-agent.md]

  # ---------- 앱이 A2A의 한쪽이 된다(call 보내기, 답 받기, session 열기·끝내기) ----------

  - id: app-call-send
    title: "앱이 agent나 보이는 session에 일을 맡긴다(call)"
    actor: app
    entries: [route:app_calls/send, route:calls/app-send]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/router.ts, packages/core/router/commands.ts, packages/core/main/daemon/wiring/app-calls.ts, packages/core/main/daemon/wiring/app-principal.ts, packages/protocol/lophn-agent/app-calls.ts]
    steps:
      - "사람 자격(shell main이 앱 화면을 대신한다)만 부른다. 앱은 입력의 app이고 shell main이 sender view에서 정해 싣는다(앱 process에는 이 route가 없다). 사람이 앱 화면에서 보낸 call이라 받는 turn은 attended다"
      - "입력(받는 곳, reply none|result, 글, 선택 key)을 core 안 machine 자격의 calls.app-send로 넘긴다. 본문은 redaction과 blob 준비를 거친다. 같은 앱의 같은 key는 첫 call을 돌려준다(Router의 dedup)"
      - "Router가 앱의 지금 slug로 보낸 쪽을 얼린다(없는 앱 not_found, 보관한 앱 conflict). 받는 곳을 푼다: workspace를 뺀 agent는 그 앱 workspace에 열리고 {home: true}는 Home이다(같은 정책을 받는다). 대화 reply는 없다"
      - "주소가 안 풀리거나 session이 닫혔으면 call 행을 failed로 남기고 state로 돌려준다. 통과하려면 앱 workspace에서 call로 닿을 수 있는 workspace여야 하고(call 정책의 workspace 규칙, agent 쌍·팀 규칙은 없다) 받는 agent의 명함(modality, 답 방식)에 맞아야 한다. 거르면 tx가 되돌아가 행도 새 session도 없다"
      - "통과하면 agent_calls에 앱이 보낸 accepted 행(from_app은 앱 id와 slug)을 쓰고 받는 session의 queue에 봉투를 넣는다. 받은 message의 보낸 쪽은 app이고 입력 tag는 from=app:<slug>다. 새로 열린 session에는 그 앱이 열었다는 표시가 붙는다"
    outcomes:
      - id: accepted
        observe: [ledger:agent_calls, ledger:messages, event:MessageReceived, response]
        when: "열린 session에 넣었거나 새 session을 열었다"
      - id: deduplicated
        observe: [ledger:agent_calls, response]
        when: "같은 앱과 key의 call이 이미 있다. 새 행과 session을 만들지 않고 그 상태를 돌려준다"
      - id: failed-not-found
        observe: [ledger:agent_calls, response]
        when: "받는 이름이나 session을 풀지 못했다. ok 응답의 state가 failed이고 fail_reason이 not_found다"
      - id: failed-closed
        observe: [ledger:agent_calls, response]
        when: "주소의 session이 닫혔거나 workspace가 보관됐다. fail_reason이 closed다"
      - id: call-policy-refused
        code: forbidden
        when: "call 정책이 그 앱 workspace에서 받는 workspace로 닿는 것을 막는다(private workspace, workspace 쌍 규칙). 행도 session도 남지 않는다"
        observe: [response]
      - id: card-refused
        code: invalid_input
        when: "받는 agent 명함의 입력 modality나 답 방식에 없다, 또는 입력이 schema에 맞지 않거나 사람 자격인데 app이 없다"
        observe: [response]
      - id: app-not-found
        code: not_found
        when: "앱이 없다"
        observe: [response]
      - id: app-archived
        code: conflict
        when: "앱이 보관됐다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "harness runtime의 session인데 harness가 꺼졌거나 Router·본문 준비가 아직 없다"
        observe: [response]
      - id: internal
        code: internal
        when: "Router가 앱 call의 ID를 주지 않았다(우리 코드의 결함)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/agent-call.md, architecture/app-call.md]

  - id: app-call-settle
    title: "앱이 보낸 call이 끝나면 그 앱에 call.settled event가 간다"
    actor: system
    entries: [system:app-call-settled]
    uses: [route:app_events/publish]
    boundary: [router, events]
    code: [packages/core/router/router.ts, packages/core/router/store.ts, packages/core/main/daemon/wiring/router.ts]
    steps:
      - "앱이 보낸 call이 끝나는 tx(받는 쪽의 답, 취소, 받는 session이 끝나거나 lophn이 다시 켜져 닫힘, 답 없는 call의 소비)가 call 행을 done·failed·cancelled로 옮긴다. result call의 답은 같은 update로 행의 result(글)에 남는다. 앱에는 받을 queue가 없어 보낸 session의 늦은 실패 알림 같은 입력은 가지 않는다"
      - "commit 뒤 main thread가 발행자 lophn의 call.settled(call, state, fail_reason)를 그 앱에만(audience) 앱 event 전달 길로 낸다. event는 한 번이고 저장되지 않는다. 구독을 선언하지 않았거나 process·화면이 꺼져 있으면 닿지 않는다"
    outcomes:
      - id: settled
        when: "앱이 보낸 call이 끝났다"
        observe: ["ledger:agent_calls", "ledger:invocations", "event:AppEventPublished"]
      - id: not-delivered
        when: "그 앱이 구독을 선언하지 않았거나 닿지 못한다. 앱은 app_calls.read로 읽는다"
        observe: ["ledger:app_event_publications"]
    crosses_process: true
    docs: [architecture/agent-call.md, architecture/event.md]

  - id: app-call-read
    title: "앱이 자기가 보낸 call 하나를 읽는다(답 글 포함)"
    actor: app
    entries: [route:app_calls/read]
    boundary: [router, core-api]
    code: [packages/core/main/daemon/wiring/app-calls.ts]
    steps:
      - "app-call-send와 같이 앱을 정한다(사람 자격만). 이 앱이 보낸 call만 읽힌다(남이나 agent가 보낸 call은 없는 call과 같다)"
      - "행의 state, fail_reason, result call이 done이면 답 글(result)을 돌려준다"
    outcomes:
      - id: read
        observe: [response]
      - id: not-found
        code: not_found
        when: "없는 call이거나 이 앱이 보낸 것이 아니다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
    crosses_process: false
    docs: [architecture/agent-call.md]

  - id: app-call-cancel
    title: "앱이 자기가 보낸 call을 취소한다"
    actor: app
    entries: [route:app_calls/cancel, route:calls/app-cancel]
    boundary: [router, core-api]
    code: [packages/core/router/router.ts, packages/core/router/commands.ts, packages/core/main/daemon/wiring/app-calls.ts]
    steps:
      - "app-call-send와 같이 앱을 정하고 core 안 machine 자격으로 취소한다. 자기가 보낸 call만 취소된다"
      - "끝나지 않은 call이면 cancelled로 옮기고 받는 session에 취소 알림이 간다. 이미 끝난 call은 그대로 돌려준다. call.settled가 간다(app-call-settle)"
    outcomes:
      - id: cancelled
        observe: [ledger:agent_calls, response]
      - id: not-yours
        code: forbidden
        when: "남이 보낸 call이다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "call이나 앱이 없다"
        observe: [response]
      - id: app-archived
        code: conflict
        when: "앱이 보관됐다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "Router가 아직 연결되지 않았다(기동 중)"
        observe: [response]
    declared_only: [internal]
    unclear: ["calls.app-cancel이 internal을 선언하지만 handler는 내지 않는다(선언을 고칠 곳)"]
    crosses_process: false
    docs: [architecture/agent-call.md]

  - id: app-calls-list
    title: "앱이 보이는 session이 받았거나 보낸 call들을 읽는다"
    actor: app
    entries: [route:app_calls/list]
    boundary: [router, core-api]
    code: [packages/core/main/daemon/wiring/app-calls.ts, packages/core/router/store.ts]
    steps:
      - "app-call-send와 같이 앱을 정하고 session이 앱에 보이는지 본다(앱 workspace에서 call로 닿을 수 있는 workspace의 session)"
      - "그 session이 받았거나 보낸 call 행을 새것부터 최대 50개 돌려준다. 답 글(result)은 이 앱이 보낸 call에만 차 있다"
    outcomes:
      - id: listed
        observe: [response]
      - id: not-found
        code: not_found
        when: "없는 session이거나 앱에게 보이지 않는다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
    crosses_process: false
    docs: [architecture/agent-call.md]

  - id: app-agents-list
    title: "앱이 자기 workspace에서 부를 수 있는 agent들의 명함을 읽는다"
    actor: app
    entries: [route:app_agents/list, route:agents/cards]
    boundary: [agents, core-api]
    code: [packages/core/main/daemon/wiring/app-calls.ts, packages/core/lophn-agent/agents/card.ts, packages/core/lophn-agent/agents/reads.ts]
    steps:
      - "app-call-send와 같이 앱을 정하고(보관한 앱은 conflict) core 안 machine 자격으로 그 앱 workspace에서 보이는 agent(전역, 이 앱의 범위 agent, 이 앱 workspace의 lophn)의 명함을 한 번에 읽는다. 틀린 정의 file은 뺀다"
    outcomes:
      - id: listed
        observe: [response]
      - id: app-not-found
        code: not_found
        when: "앱이 없다"
        observe: [response]
      - id: app-archived
        code: conflict
        when: "앱이 보관됐다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
    crosses_process: false
    docs: [architecture/agent-call.md]

  - id: app-sessions-open
    title: "앱이 agent의 새 session을 연다(자기 workspace나 닿을 수 있는 workspace)"
    actor: app
    entries: [route:app_sessions/open, route:sessions/app-open]
    boundary: [agent-sessions, core-api]
    code: [packages/core/main/daemon/wiring/session-lifecycle.ts, packages/core/lophn-agent/workspaces/lifecycle.ts, packages/core/lophn-agent/session/commands.ts]
    steps:
      - "사람 자격(shell main이 앱 화면을 대신한다)만 부른다. 앱은 입력의 app이다(앱 process에는 이 route가 없다). 앱이 없거나 보관됐으면 not_found다"
      - "workspace를 빼면 그 앱 workspace다. 주면 call 정책(mayReachWorkspace)이 그 앱에서 그 workspace로 닿게 허락해야 하고 아니면 forbidden이다"
      - "agent handle을 그 workspace에서 푼다(전역, 그 workspace의 범위 agent, 그 workspace의 lophn). 못 풀면 not_found다"
      - "core 안 machine 자격의 OpenAppSession으로 연다. session에 opened_by_app(이 앱)이 달리고 바뀌지 않는다(사람 자격의 OpenSession은 이 표시를 받지 않는다). workspace가 보관됐으면 conflict다. title이 있으면 RenameSession으로 붙이는데 못 붙여도 열린 채다"
    outcomes:
      - id: opened
        observe: ["ledger:sessions", "event:SessionStarted", response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 보관됐거나 agent handle이 이 앱 workspace에서 풀리지 않는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "call 정책이 그 앱 workspace에서 고른 workspace로 닿는 것을 막는다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
      - id: core-failed
        when: "OpenSession이 낸 오류 그대로(harness가 꺼져 unavailable 등)"
        observe: [response]
    crosses_process: false
    docs: [architecture/workspace-session.md]

  - id: app-sessions-end
    title: "앱이 자기가 연 session을 끝낸다"
    actor: app
    entries: [route:app_sessions/end]
    uses: [route:sessions/archive]
    boundary: [agent-sessions, core-api]
    code: [packages/core/main/daemon/wiring/session-lifecycle.ts, packages/core/lophn-agent/workspaces/lifecycle.ts]
    steps:
      - "app-call-send와 같이 앱을 정한다(shell main이 싣는 사람 자격만). 이 앱이 연(opened_by_app) session이어야 한다. 사람이나 다른 앱이 연 session은 forbidden이다"
      - "이미 끝난 session은 ended false다. 열린 session은 ArchiveSession과 같은 영향으로 끝낸다: 도는 turn 중단, 받은 call 실패(receiver_ended), 대기 요청 취소, queue 비움"
    outcomes:
      - id: ended
        observe: ["ledger:sessions", "event:SessionEnded", response]
      - id: already-ended
        observe: [response]
        when: "이 앱이 연 session이 이미 끝났다(ended false)"
      - id: not-opener
        code: forbidden
        when: "이 앱이 연 session이 아니다(사람이나 다른 앱이 연 session)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "없는 session이거나 앱에게 보이지 않는다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않는다"
        observe: [response]
      - id: core-failed
        when: "ArchiveSession이 낸 오류 그대로(그 사이 session이 바뀌어 conflict)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    docs: [architecture/workspace-session.md]

  - id: state-changed
    title: "상태를 바꾼 route가 선언한 changes를 commit 뒤 StateChanged 하나로 낸다"
    actor: system
    entries: [system:state-changed]
    boundary: [storage, events, event-stream]
    code:
      - packages/protocol/events/changes.ts
      - packages/core/storage/ledger/after-commit.ts
      - packages/core/storage/ledger/writer-worker.ts
      - packages/core/main/daemon/wiring/state-changes.ts
      - packages/core/server/dispatch.ts
    steps:
      - "writer Worker는 command handler가 성공할 때마다(다른 command 안에서 tx.call로 돈 것 포함) 그 route의 changes를 입력·결과로 풀어 모은다"
      - "tx가 commit되고 재전달이 아니면 모은 것을 결과에 실어 main thread로 보낸다. 되돌아간 tx의 것은 버린다"
      - "main thread는 같은 {name, id}를 한 번만 실어 StateChanged 하나로 Bus에 낸다. 내기가 실패해도 command는 실패하지 않는다"
      - "memory route와 upload는 handler가 성공하면 dispatch가 그 route의 changes를 같은 함수로 낸다"
    outcomes:
      - id: published
        observe: ["event:StateChanged"]
      - id: nothing-declared
        observe: []
        when: "돈 command의 changes가 모두 빈 목록이다(대화 command 등). event를 내지 않는다"
      - id: rolled-back
        observe: []
        when: "tx가 되돌아갔거나 재전달이다. 모은 선언을 버리고 event를 내지 않는다"
    crosses_process: false
    docs: [architecture/event.md]

ignore:
  - {entry: "route:events/list", reason: "core에 handler가 없다(reads에 등록이 없어 부르면 read unavailable). ROUTES와 agent runtime 허용 목록에만 있다. 옛 ledger event 읽기 잔재로 보이니 지울지 사람이 정한다"}
  - {entry: "route:messages/list", reason: "handler가 없다. registry.ts가 ROUTES에서 뺐고 agent runtime 허용 목록에만 있다. 옛 읽기 잔재"}
  - {entry: "route:messages/receive", reason: "handler가 없고 호출하는 곳도 없다. compare가 assignment_revision·assignment_state를 든 옛 assignment 입력이라 설계와 맞지 않는다. 지울지 정한다"}
