id: forked-harness-session-loses-history
title: fork한 harness session이 harness 쪽 앞 대화를 물려받지 않는다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/core/lophn-agent]
now: "fork한 harness session(`packages/core/lophn-agent/workspaces/lifecycle.ts` `startSession`)은 외부 session id(`sessions.harness_session`)를 물려받지 않아 harness 쪽 대화가 새로 시작한다. (같이 적었던 steer는 고쳤다: harness session은 ACP `steer` capability가 꺼져 있고 send-now가 `unavailable`이다.)"
impact: 사람이 harness session을 fork하면 harness가 앞 대화를 모른다.
fix: |
  - 한 것: 하지 않았다. fork 원본의 harness session id를 넘기려면 계약 넷이 바뀐다: harness take 출력(`packages/protocol/lophn-agent/harness-host.ts`), `wiring/harness.ts`, 내장 extension `harness/host.ts`, headless 명령의 `--resume <id> --fork-session`(`packages/protocol/coding-agent/headless/claude.ts`). harness의 기록은 원본의 끝까지라 `through_seq`가 원본의 마지막 메시지일 때만 넘긴다.
  - headless resume이 fork를 지원하는 harness(`claude --resume --fork-session` 등)만 id를 물려주고 나머지는 지금처럼 새로 시작한다(중간).
closed: |
  fork한 session이 harness session을 아직 갖지 않았고 원본의 마지막 메시지에서 갈라졌으면 원본의 harness session id를 넘긴다. Claude는 `--resume <id> --fork-session`, OpenCode는 `--session <id> --fork`로 잇고 Codex는 새로 시작한다. 실제 CLI로 돌려 보지는 않았다.
guard: 없음
