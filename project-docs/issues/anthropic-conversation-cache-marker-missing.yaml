id: anthropic-conversation-cache-marker-missing
title: 'Anthropic 요청이 대화에 cache 표시를 달지 않아 긴 turn이 매 call 대화 전체를 cache 없이 낸다'
kind: bug
status: fixed
topic: agent-definition
modules: [packages/core/lophn-agent]
now: |
  `models/binding.ts`의 `anthropicPacker`는 "cache 표시는 system 층에 이미 있다"며 `buildRequest`의 경계를 모두 끈다(`final_user: false`). 그래서 cache 표시는 `prompt-assembly/layers.ts`의 system 층에만 붙고, tool을 오가며 길어지는 messages에는 붙지 않는다. model call마다 system과 tools만 cache로 읽히고 그 뒤 대화 전체는 cache 없는 input으로 매겨진다. 재현: App Engineer가 앱을 직접 짠 일회성 eval(`claude-sonnet-5-5`, model call 96번). input 2,648,568 중 cache_read 2,390,890, cache_write 662였다. call마다 system·tools 약 25k만 cache였고 대화 평균 약 27.6k는 매번 새로 매겨졌다. 같은 model의 Claude Code coding agent는 같은 앱을 만들 때 input 6.47M 가운데 cache 없는 input이 144였다.
impact: |
  tool을 여러 번 부르는 turn일수록 돈이 크게 샌다. 위 run에서 App Engineer는 $5.97을 썼고 그중 약 $5.3이 cache 없는 대화 input이다. 같은 양을 cache로 읽었으면 $1 아래다. 앱 설계·검증처럼 짧은 turn도 call마다 대화가 다시 매겨진다.
fix: |
  - Anthropic 요청에서 마지막 message의 마지막 content block에 cache 표시를 단다(system 2개 + 대화 끝 1개, 상한 4개 안). 지금 `markLast`는 message 객체 자체에 다는데 API는 content block의 표시만 본다(작음). **추천.**
  - 대화 중간에도 일정 간격으로 표시를 단다(중간. 대화가 cache 최소 길이보다 짧을 때와 표시 개수 상한을 같이 다뤄야 한다).
closed: |
  `buildRequest`(`packages/core/lophn-agent/providers/adapters/messages.ts`)가 마지막 message의 마지막 content block에 cache 표시를 단다. 늘 꺼져 있던 경계 칸(`CacheBoundaries`, `markLast`)은 지웠다. 표시는 system 층 셋과 대화 끝 하나다. 대화 중간 표시(둘째 안)는 하지 않았다.
guard: '`packages/core/lophn-agent/models/binding_test.ts`의 "Anthropic 요청은 대화 끝 content block에 cache 표시를 달고 표시는 넷을 넘지 않는다"'
