id: secret-input-loadurl-failure-hangs
title: 보호 입력 창의 `loadURL`이 실패하면 열기가 끝나지 않고 앱 입력이 막힌 채 남는다
kind: bug
status: open
topic: shell
modules: [packages/shell/main]
now: |
  `openSecretInputWindow`(`packages/shell/main/secret-input/window.ts`)는 `void window.loadURL(SECRET_INPUT_URL)`로 실패를 받지 않는다. 창은 `show: false`로 만들어지고 page가 그려진 뒤 부르는 `fit`만 창을 보인다. `blockAppInput`이 부모의 앱·artifact·browser view 입력을 이미 막았다. 로드가 실패하면 `fit`이 불리지 않아 창이 숨은 채 남고 `onClosed`·`onCrashed`도 불리지 않아 `registerSecretInputIpc`(`ipc.ts`)의 `done`이 불리지 않는다. 그래서 `shell:secret-input-open`의 promise가 끝나지 않고, `active`가 남아 다음 열기는 `conflict`다.
impact: |
  설치 묶음의 secret-input 페이지가 깨졌거나 protocol 처리에서 로드가 거절되면, API key 연결이 영원히 대기하고 그 창의 앱 view 키 입력이 앱을 다시 켜기 전까지 막힌다. 평소에는 안 일어나지만 보호 창 쪽에는 실패를 알릴 다른 길이 없다.
fix: |
  `loadURL(...)`에 `.catch(() => input.onCrashed())`를 붙인다(작음). 추천: 이것.
