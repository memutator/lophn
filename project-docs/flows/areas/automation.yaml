        code: invalid_input
        when: "at이 있는데 every가 d 단위가 아님, event job에 every나 at"
        observe: [response]
      - id: not_found
        code: not_found
        when: "job이 없거나 다른 agent가 만든 job"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent session을 모름"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 job이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    declared_only: [conflict]
    refs: [J2, H9]
    docs: [architecture/job.md]
    unclear:
      - "route가 conflict를 선언하지만 handler는 내지 않는다. job에는 revision이나 compare가 없고(마지막 쓰기가 이김) 충돌 갈래가 승인(approve)에만 있다. 선언을 고칠 곳이다."
      - "job.update, job.delete, job.list는 agent 도구와 Jobs 탭이 함께 쓴다. actor는 agent로 두었다(scope 판정이 agent 쪽이라서)"

  - id: job-delete
    title: "job을 지운다(job run 기록도 함께 지운다)"
