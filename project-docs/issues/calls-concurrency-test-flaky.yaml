id: calls-concurrency-test-flaky
title: "`apps/calls/calls_test.ts`의 동시성 test가 병렬 check 부하에서 가끔 깨진다"
kind: bug
status: fixed
topic: code-health
modules: [packages/core/apps]
now: |
  "write는 앱마다 한 번에 하나씩 돌고 read는 동시에 돈다"가 `deno task check:full`(`--parallel`)에서 한 번 실패했다. 같은 file만 돌리면 다섯 번 모두 통과했고, 같은 branch에서 check:full을 다시 돌리면 통과했다. 이 test file을 건드리지 않은 다른 변경의 check에서도 여러 번 같은 실패가 났다. 모두 다른 check:full이 같이 돌 때였다. test의 `until(done)`은 `setTimeout(0)`을 1000번 돌고 조건이 안 되어도 조용히 끝나며, 그다음 `assertEquals(t.sent.length, 4)`가 깨진다. 기다림이 시간이 아니라 tick 수라 부하가 크면 조건보다 먼저 끝날 수 있다.
impact: |
  lead의 merge·land가 코드와 상관없이 멈춘다(계획 둘이 full check를 같이 돌릴 때 늘어난다). 사람이 원인을 찾느라 시간을 쓴다.
fix: |
  `until`이 조건이 안 되면 실패를 던지게 하고 기다림을 시간 상한(예: 2초)으로 바꾼다(작음). 추천: 이 안.
closed: |
  `until`은 2초 시간 상한까지 기다리고 조건이 안 되면 던진다. 부하에서 같은 앱의 두 write가 queue에 들기 전에(`fingerprint` 해시) 순서가 바뀌는 것도 원인이었다. test는 이제 "앱 a의 write가 정확히 하나 돌고 풀면 남은 하나가 돈다"를 보고 호출 순서는 가정하지 않는다.
guard: packages/core/apps/calls/calls_test.ts
