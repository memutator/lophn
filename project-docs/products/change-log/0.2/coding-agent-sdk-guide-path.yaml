id: coding-agent-sdk-guide-path
version: 0.2.0
title: "계획 셋을 마무리하며 coding agent의 SDK guide 안내를 바로잡고 이슈를 정리함"
modules: [packages/coding-agent]
checked: [architecture-coding-agent]
change: |
  전: coding agent skill(`lophn-build-app`)이 내장 SDK(`@lophn/app-ui`, `@lophn/blueprint`, `@lophn/cap-*`)의 guide를 `package show`로 읽으라고 했다. 내장 sdk는 package catalog에 없어 빈 결과였다.
  후: skill이 앱 `.lophn/import-map.json`이 가리키는 설치 사본 폴더의 `guide.md`를 읽게 한다. `package list`·`package show`는 사용자 package 몫이다.
why: |
  coding agent가 SDK API를 짐작으로 써서 build와 release 준비가 깨지는 앱이 나올 수 있었다. catalog 등록보다 skill 문장이 싸다.
decisions:
  - text: |-
      내장 SDK guide는 catalog 등록 대신 설치 사본의 `guide.md`로 읽는다. 버린 길: 기동 때 `register_version`. 같은 판의 byte가 바뀌면 `conflict`라 개발 중 sdk를 고치고 다시 띄우면 기동이 막힌다.
    by: agent
  - text: |-
      보낸 chip을 message 본문의 `attached` part로 남기게 바꾼다. 앞 provider 항목의 "보낸 chip은 message 본문에 남기지 않는다"를 뒤집는다. 고치는 비용이 작고, 다시 시도한 turn에서 agent가 위반을 잃는다. 고치는 것은 다음 계획이다(`project-docs/issues/shell.md`).
    by: agent
  - text: |-
      harness에 남은 domain import 9개 file과 I/O worker 전 daemon crash의 log는 kept로 닫는다. 앞의 것은 면제 목록이 새 위반을 막고, 뒤의 것은 stderr와 exit 1이 남으며 agent runtime 재기동은 supervisor가 3번에서 멈춘다.
    by: agent
  - text: |-
      worker 지시문에 "다른 module의 표를 SQL로 직접 읽지 않는다"와 "바꾼 이름·숫자를 grep해 주석과 오류 메시지까지 고친다, 규칙 사본을 새로 만들지 않는다"를 넣는다. 계획 README마다 손으로 옮기던 문장과 lead가 네 번 따로 고친 옛 이름 주석 때문이다.
    by: agent
