id: mobile-browser-use
version: 0.23.68
title: 컴퓨터의 agent가 사람의 폰에 뜬 앱 preview 화면을 보고 누르고 친다(phone 탭)
modules: [packages/protocol, packages/core/host-queue, packages/core/apps, packages/core/main, packages/core/agent-workspaces, packages/cli, packages/coding-agent, packages/design, packages/sdk, packages/mobile]
change: |
  - 새 탭 종류 `phone`: `lophn tab open --phone <app> [--screen <key>]`(`tabs/open`의 target `{phone: {app, screen}}`)이 사람의 폰에 뜬 그 앱의 preview 화면을 탭으로 연다. 기존 `lophn browser snapshot|act|screenshot|wait|read`가 그 탭을 다룬다. 그 앱 workspace의 session과 사람만 연다(다른 앱 workspace는 `not_found`). preview가 돌지 않으면 `conflict`, 폰이 그 preview(`--screen`이면 그 화면)를 보이지 않으면 `unavailable`이다. 탭은 core 표에만 있고 shell에는 생기지 않는다(`tab show`는 `invalid_input`). 앱마다 하나이고, 기기와 view는 부를 때마다 그 앱의 기기 preview view 가운데 가장 최근 쓴 것을 고른다. live view와 desktop의 view는 고르지 않는다.
  - 되는 act는 click, type, fill, press Enter, scroll(`--ref`나 세로 `--dy`)이고 navigate, evaluate, logs, hover, select, fill_login, 다른 press, `wait --url`은 정한 문장과 `invalid_input`이다. snapshot은 desktop과 같은 줄 말에 flag(`disabled`, `checked`, `selected`, `scrollable`, `offscreen`)를 더하고 첫 줄이 `screen <key> <w>x<h>dp`다. ref 번호는 core가 탭 counter로 매기고 마지막 snapshot이 아닌 ref는 폰에 묻지 않고 `conflict`다. 결과는 known-value redaction과 untrusted 감싸기를 거친다. `browser/screenshot`의 `media_type`이 `image/png | image/jpeg`가 되었고 phone 탭은 JPEG(q80, 긴 변 1080 px)이며 CLI는 `.jpg`로 쓴다.
  - core가 폰에 묻는 길에 kind `drive.snapshot`, `drive.act`, `drive.screenshot`, `drive.wait`가 더해졌다(입력에 `view`와 부르는 agent 이름 `by`). `unavailable` 이유에 `no_preview`, `screen_off`, `covered`가, `conflict` 이유 `taken_over`, `stale_ref`, `off_screen`이 생겼고 core가 각각을 agent에게 할 일을 말하는 고정 문장(`PHONE_TAB_TEXT`)으로 바꾼다. 폰은 `drive.*`를 `hello.capabilities`에 적는다. 적지 않은 옛 폰은 "update the lophn app" 문장이다.
  - `apps/phone_screens` 출력에 `previews`(컴퓨터에서 지금 도는 preview의 폰 화면, release가 없을 수 있다)가 더해졌다. 새 route는 없다.
  - 폰 앱: native module `lophn-drive`(Kotlin, Android)가 view id로 guest를 찾아 view tree를 읽고, guest만 찍고, guest 표면에 touch를 넣고, InputConnection으로 글을 치고 keyboard를 내린다. drive controller는 이 폰이 그 컴퓨터를 위해 연 preview view가 아니면 native를 부르지 않는다. 앱 화면 ⋯ menu의 "Preview from lophn"(preview가 돌 때만)이 preview 화면을 열고(`apps/screen_file`의 preview target, `app_views/open {mode: "preview"}`), live 폰 화면이 아직 없는 앱은 preview가 도는 동안 Home과 sidebar의 앱 줄에 "Preview" 표시가 붙어 바로 preview 화면을 연다. preview 화면은 "Preview" 줄, 요청이 오는 동안 "<agent> is driving this screen"과 [Take control]/[Hand back] 줄을 보이고, preview가 다시 지어지면 새 bundle로 다시 띄우고, 멈추면 "The preview stopped" 화면이 서고, 열린 동안 화면을 켜 둔다. 여러 폰 화면은 preview 화면의 ⋯ menu에서 고른다.
  - kit: `@lophn/ui-native` 0.2.0. `Input`이 감싼 `Field`의 label(없으면 placeholder)을 accessibility 이름으로 갖는다(`@lophn/app-ui-native` 1.3.0이 같이 오른다. `migrate-sdk` 메모 `ui-native-0.2.0.md`).
  - agent 지침: `design-app` skill에 `phone-check.md`(폰에서 확인하는 때와 길, 답의 뜻, 한계)가 더해졌고 kit 메모에 Instruction diff가 있다. `lophn-agent` skill과 `tab`·`browser` 명령 설명이 phone 탭을 말한다.
why: |
  mobile roadmap 단계 10이다. 앱 agent는 폰 화면을 desktop preview(react-native-web)로만 확인해 입력, soft keyboard, scroll, 글꼴, 실제 크기를 보지 못했고 사람이 마지막 확인을 혼자 했다. 사람이 폰을 들고 있을 때 agent가 그 폰의 preview 화면을 직접 보고 누르면 이 빈틈이 좁아진다. 새 도구 없이 desktop의 탭과 browser 명령에 대상 하나를 더했다.
decisions:
  - text: >-
      agent는 폰의 preview 화면만 다룬다. live 화면, lophn 자신의 화면, 다른 앱, system UI, OS dialog는 다루지 않는다. 이유: live 화면은 사람의 실제 data에 operation을 부른다(desktop의 "앱은 preview만"과 같다).
    by: agent
  - text: >-
      사람이 폰에서 preview를 여는 것이 동의다. 동작마다 묻지 않고 대신 누가 다루는지 보이고 사람이 언제든 take control한다. 컴퓨터는 폰을 깨우거나 lophn 앱을 앞으로 부르지 못하고, 앱이 앞에 없거나 화면이 꺼지면 `unavailable`이다. 이유: 사람이 폰을 들고 있을 때 하는 확인이고 사람이 모르는 사이에 폰이 움직이면 안 된다.
    by: agent
  - text: >-
      보기와 입력은 lophn 폰 앱 안의 Kotlin native module이 guest의 Android view tree를 걷고 guest 표면에 touch를 넣어 한다. 버린 길: Accessibility service(Play 정책상 이 용도로 쓰기 어렵고 사람이 설정에서 켜야 하며 다른 앱과 system UI까지 닿는다), adb(cable이나 개발자 옵션), guest 쪽 JS tree(AI가 쓴 화면 code가 답을 꾸밀 수 있다).
    by: agent
  - text: >-
      요청은 core가 폰에 묻는 길 하나(`PhoneLink`, kind `drive.*`)로 간다. `AppViewEvent`의 drive 갈래나 폰이 부르는 답 route는 만들지 않는다. 이유: 단계 8의 폰 기능과 같은 길이고 기한과 짝을 한 곳에서 맞춘다.
    by: agent
  - text: >-
      phone 탭은 앱마다 하나이고 기기와 view를 부를 때마다 고른다. ref 번호는 core가 매기고 폰은 snapshot id와 자기 node 번호만 낸다. 버린 길: 조사의 `<app>:<device>` 탭과 core가 counter 시작값을 보내는 안(사람이 preview를 다시 열면 탭이 깨지고 두 쪽 상태가 어긋날 곳이 많다).
    by: agent
  - text: >-
      live 폰 화면이 아직 없는 앱(첫 폰 화면을 짓는 중)은 preview가 도는 동안 폰의 앱 목록에 "Preview" 표시로 들고 그 줄이 바로 preview를 연다. 이유: "Preview from lophn"이 live 앱 화면의 menu에 있어 첫 폰 화면을 폰에서 열 길이 없었다. 버린 길: live 화면 없이 menu만 띄우는 빈 앱 화면.
    by: agent
  - text: >-
      앱이 앞에 있는데 무언가(sheet, dialog, notification shade)가 preview를 덮으면 `unavailable`의 새 이유 `covered`로 답하고 문장이 사람에게 닫아 달라고 하고 그 부분은 손으로 보라고 한다. 이유: "앞에 없다"고 하면 agent가 틀린 부탁을 하고, guest의 sheet 안은 view tree 밖이라 읽지 못한다.
    by: agent
  - text: >-
      새 자동 emulator E2E test는 만들지 않았다. 끝 확인은 lead가 emulator와 개발 core로 손으로 했다(roadmap 규칙: emulator를 띄우는 test는 사람에게 먼저 묻는다).
    by: agent
follow_up: |
  - **실제 폰에서 보지 못했다.** emulator(`lophn-phone`, x86_64 API 36)의 release build와 개발 core로만 보았다. 실제 폰에 이 build를 까는 것은 사람의 일이고 깔기 전에 planner가 묻는다(서명 key가 다르면 지우고 다시 깔아 pairing을 다시 한다).
  - **실제 model의 agent turn은 보지 못했다.** 개발 core에는 model이 없어 앱 workspace session의 turn에서 fake model이 `lophn` tool을 부르게 했다(agent 자격의 길은 진짜다). model이 snapshot을 읽고 스스로 고르는 것은 보지 못했다.
  - iOS는 짓지 않았다. core에서 기기를 끊었을 때(`devices/unpair`)는 보지 않았고 폰 network를 끊은 것만 보았다(8초 안에는 시간 초과 문장).
  - 알려진 빈틈은 이슈다: `phone-drive-cannot-reach-sheet`, `phone-drive-settle-timing`, `phone-drive-lists-partial`, `phone-drive-type-skips-press`, `phone-drive-two-devices-pick`.
checklist:
  - "해야: 폰에서 preview를 다루려면 폰에 이 판의 lophn 앱 build를 새로 깐다(native module `lophn-drive`가 들었다. 깔기 전에 planner에게 묻는다)"
  - "폰 화면이 있는 앱에서 앱 agent에게 폰 화면 하나를 고치고 폰에서 확인해 달라고 청한다. agent가 `preview start` 뒤 폰에서 앱 ⋯ › Preview from lophn을 열어 달라고 부탁하는지, 열면 \"lophn is driving this screen\" 줄이 서고 agent가 누르고 친 결과를 말하는지 본다"
  - "폰에서 Take control을 누른 뒤 agent의 누르기가 멈추고(손은 된다) Hand back 뒤 다시 되는지 본다"
  - "폰 화면이 아직 없는 앱에서 첫 폰 화면을 청하고, preview가 도는 동안 폰의 Home과 sidebar에 그 앱이 \"Preview\"로 보이고 누르면 바로 preview가 열리는지 본다"
  - "preview 화면에서 lophn 앱을 뒤로 보내거나 화면을 끄거나 sheet를 열었을 때 agent가 사람에게 부탁하는 말을 하는지 본다"
