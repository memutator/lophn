id: missing-folder-blocks-app-coding
title: "`app.link_source`가 없는 폴더를 받아 그 앱의 coding agent가 뜨지 못한다"
kind: bug
status: fixed
topic: coding-agent
modules: [packages/core/apps]
now: "`app.link_source`(`apps/agent-tools/app.ts`)는 경로를 풀어 `app.connect_source`로 넘기고, 그 command(`apps/registration/commands.ts`의 `connectSource`)는 폴더가 있는지 보지 않고 `source_path`를 적는다. 맡기기 전 template 깔기(`apps/tickets/coding/scaffold-source.ts`)는 `source_path`가 비었을 때만 하므로 건너뛴다. coding 터미널은 없는 폴더에서 열리다 실패하고(`open_failed`), session은 보고 없이 끝난다. 재현: eval `calendar-user`·`calendar-dev` 셋째 run. App Engineer가 blueprint를 먼저 쓰려다 `blueprint.check` not_found를 받고 `…/apps/<id>/calendar`를 지어내 연결했다. 그 뒤 다시 넘긴 다섯 번 모두 터미널이 열리지 않았다."
impact: agent 실수 한 번으로 그 앱의 코딩이 막힌다. App Engineer에게는 call이 accepted로 보이고 session이 바로 끝날 뿐이라 이유를 모른다. 사람이 Settings에서 source를 다시 고치기 전까지 풀리지 않는다.
fix: |
  - 연결 전에 폴더가 있고 git 저장소인지 본다. command는 tx 안이라 파일을 못 보므로 template 깔기처럼 writer 앞에서 본다(작음). **추천.**
  - App Engineer의 `app.link_source`를 뺀다(작음. 사람이 가리킨 기존 저장소를 App Engineer가 잇는 길이 없어진다).
closed: "`app.connect_source`는 writer 앞 처리(`packages/core/apps/registration/source-folder.ts`의 `withSourceFolder`)가 폴더가 있고, git 저장소의 맨 위이고, commit이 있는지 먼저 보고 아니면 `invalid_input`이다. 새 앱의 source 폴더는 `app.create`가 commit된 뒤 core가 깔고 잇는다. git subprocess가 필요해 test는 두지 않았다."
guard: 없음
