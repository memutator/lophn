id: gui-handoff-copies-adapter-table
title: shell main의 GUI_HANDOFF가 harness-gui adapter 표를 손으로 베낀 것이다
kind: defect
status: kept
topic: harness-gui
modules: [packages/shell/main]
now: |
  `packages/shell/main/terminal/gui.ts`의 `GUI_HANDOFF`(claude·omp·antigravity는 `restart`, codex·opencode는 `shared`)는 extension harness-gui의 adapter가 선언하는 `handoff`와 같아야 한다고 주석이 말하는 손으로 베낀 표다. 꺼질 수 있는 extension의 code를 shell main이 import하지 못해서다. `desktop/wiring/agent.ts`가 handle이 없는 터미널(foreground TUI)의 `coding_report.handoff`에 이 표를 쓴다. handle이 있으면 `handle.handoff`(adapter 값)가 진실이다. `Record<GuiHarness, …>`라 GUI harness를 더하면 컴파일이 막지만 값이 어긋나는 것은 막는 것이 없다. 지금 폰과 core는 이 값이 null인지만 보고(`coding-relay`의 `blockedOf`) restart와 shared의 차이를 어디서도 보이지 않는다.
impact: |
  adapter의 handoff를 바꾸거나 폰이 restart·shared를 가려 보이게 되는 날 TUI 터미널의 보고만 옛 값을 말한다. 지금은 사람이 보는 동작이 같아 개발 비용이고, 걸리는 일이 생겨야 손해가 구체적이다.
fix: |
  - 작음(추천): handoff를 protocol의 GUI harness 표(`packages/protocol/extensions`의 `GUI_HARNESSES` 옆)에 두고 adapter와 이 표가 같은 값을 읽게 한다. extension은 protocol을 import할 수 있다.
  - 없음: 지금 값이 어디에도 안 보이므로 폰이 이 값을 쓰기 전까지 둔다(kept).
closed: |
  restart와 shared의 차이를 폰과 core가 어디서도 가려 쓰지 않아 표가 어긋나도 잃는 것이 없다. 같아야 한다는 것은 `GUI_HANDOFF`의 주석이 말한다. 폰이 이 값을 가려 보이게 되면 그 변경에서 handoff를 protocol의 `GUI_HARNESSES` 옆으로 옮긴다.
guard: 없음
