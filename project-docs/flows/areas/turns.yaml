  - id: tool-call-enter
    title: tool 호출의 판정을 기록하고 started로 바꾼다
    actor: system
    entries: [route:tool-calls/decide, route:tool-calls/start]
    pre: [route:tool-calls/request]
    boundary: [approvals, run-loop]
    code: [packages/core/lophn-agent/tools/commands.ts, packages/core/lophn-agent/run-loop/core-ports.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 호출 행이 없으면 not_found다"
      - "Gate가 허락한 호출이면 gate_run, 묻지 않은 호출이면 no_gate로 allow 판정을 기록한다(ToolCallDecided). 판정이 있고 아직 requested인 행만 started로 바꾼다(ToolCallStarted)"
      - "start 직전의 권한과 범위 재검사는 실행기가 한다. 이 command는 기록 상태만 본다. 기록이 실패하면 실행기가 tool handler를 돌리지 않고 닫는다"
    outcomes:
      - id: decided
        observe: [ledger:tool_calls, event:ToolCallDecided]
        when: 판정이 기록됐다
      - id: started
        observe: [ledger:tool_calls, event:ToolCallStarted]
        when: 행이 started로 바뀌었다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: decision-conflict
        code: conflict
        observe: [response]
        when: 판정이 이미 있거나 행이 requested가 아니다
      - id: start-conflict
        code: conflict
        observe: [response]
        when: 판정 없이 시작하려 했거나 이미 started다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: not-found
        code: not_found
        observe: [response]
        when: tool 호출 행이 없다
    crosses_process: false
    risk: []
    refs: [H3]
    docs: [architecture/approval.md]
    unclear: []

  - id: tool-call-finish
    title: tool 실행 결과를 finished로 기록한다
    actor: system
    entries: [route:tool-calls/finish]
    pre: [route:tool-calls/start]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/tools/commands.ts, packages/core/lophn-agent/run-loop/core-ports.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 호출 행이 없으면 not_found다. 이미 finished면 conflict다"
      - "requested 상태에서 success로 끝내는 것은 conflict다"
      - "결과 JSON이 core 요청 한도(256 KiB, 깊이 16, 항목 4096)를 넘으면 server 경계에서 invalid_input으로 거절되고, runtime이 줄인 기록으로 한 번 더 쓴다(finish-compact). 전체는 output blob에 남는다"
      - "tool handler가 끝나면 outcome, output blob, 결과 요약을 finished로 쓰고 ToolCallFinished를 낸다. output blob 등록이 거절되면 tx 전체를 rollback한다"
    outcomes:
      - id: finished
        observe: [ledger:tool_calls, ledger:blob_refs, event:ToolCallFinished]
        when: 행이 finished로 남았다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: already-finished
        code: conflict
        observe: [response]
        when: 행이 이미 finished다
      - id: success-before-start
        code: conflict
        observe: [response]
        when: requested 상태에서 success로 끝내려 했다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: not-found
        code: not_found
        observe: [response]
        when: tool 호출 행이 없다
      - id: result-too-large
        code: invalid_input
        observe: [response]
        when: "결과 JSON이 core 요청 한도를 넘어 server 경계에서 거절됐다. 이 거절 뒤 runtime이 줄인 기록으로 다시 쓴다(finish-compact)"
      - id: blob-invalid
        code: invalid_input
        observe: [response]
        when: output 준비 참조가 살아 있지 않거나(TTL이 지남) schema와 다르다. 행은 그대로 started다
      - id: blob-forbidden
        code: forbidden
        observe: [response]
        when: output 준비 참조의 주체가 이 자격과 다르다. 행은 그대로 started다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear: []

