id: private-workspace-call-policy
version: 0.18.0
title: "private workspace: 다른 workspace와 call을 주고받지 않는다"
modules: [packages/protocol, packages/cli, packages/core/lophn-agent, packages/core/main, packages/core/router, packages/shell/renderer, packages/design]
checked: []
change: |
  전: call 정책은 workspace 쌍과 agent 쌍 규칙뿐이었다. workspace 하나를 떼어 놓으려면 다른 workspace마다 쌍을 하나씩 적어야 했고, 새 project·앱은 기본 허용으로 빠져나갔다. 명함 `callable`은 자기 workspace에서 부를 때만 셌는데, workspace를 빼고 부르면 home에 열렸다.
  후:
  - 설정 `lophn-agent.call_policy`에 `private`(project·앱)이 있다. private workspace는 다른 workspace(home 포함)와 call을 주고받지 않고 안에서는 부른다. 판정은 agent 쌍 → workspace 쌍 → private → 기본 허용이다. home은 private이 될 수 없다.
  - 명함 `callable`이 `{home, here}`다. `lophn agent card`가 두 줄로 보인다.
  - Settings › Agents의 "Calls between workspaces" 절 맨 위에 "Private workspaces" 목록이 있다.

  옮기기: data step `settings.call-policy-private`이 `settings.json`의 옛 call 정책에 `private: []`를 채운다. 규칙과 다른 설정은 그대로다. `settings.call-policy-workspaces`와 다른 key만 만져 순서가 상관없다.
why: |
  사람이 workspace마다 private/public을 처음에 가르자고 했고, 방향(들어오는 call, 나가는 call)을 나누면 경우가 너무 많아져 통째로 떼어 놓기로 했다(사람, 2026-11-05, `project-docs/products/roadmap/agent-platform.md` 정한 것 13).
decisions:
  - text: |
      private은 방향 없이 통째로 떨어진다.
    by: person
  - text: |
      기본은 public이고 home은 고르지 않는다. home은 전역 agent가 어디서든 불리는 자리다. agent 추천을 사람이 받았다.
    by: person
  - text: |
      쌍 규칙이 private보다 앞서 예외가 된다. agent 쌍 규칙은 workspace를 보지 않아 모든 private workspace를 뚫는다. agent 추천을 사람이 받았다.
    by: person
follow_up: |
  agent 쌍 규칙에 workspace 조건이 없다. 한 workspace 안에서만 여는 agent 예외는 만들 수 없다.
