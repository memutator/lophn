id: terminal-agent-child-status
version: 0.18.0
title: "터미널 coding agent가 subagent가 도는 동안 진행 중으로 보이고 finished 알림은 일이 다 끝났을 때 한 번 간다"
modules: [packages/protocol, packages/coding-agent, packages/shell/main]
checked: [architecture-coding-agent, boundary-catalog, architecture-agent-chat, architecture-browser-tab, architecture-keybindings, architecture-workspace-layout, architecture-appearance, tool-worktree-prep, tool-dev]
change: |
  전: 터미널 탭의 상태는 main turn 하나만 봤다. Claude Code의 main이 Stop하면 subagent가 돌아도 idle이 되고 finished 알림이 나갔다. background agent가 끝나 main이 다시 깨면 running으로 돌아갔다가 끝날 때 알림이 또 나갔다. `agent_id`가 붙은 hook은 권한 물음과 tool 끝(PermissionResolved)만 넘기고 나머지는 버렸다. OpenCode 계열은 하위 session의 상태를 버렸다.
  후:
  - `HookSignal`에 `ChildStarted {child}`, `ChildEnded {child}`가 생겼다. `TurnEnded`에는 `children?`가 붙는다.
    - Claude 꼴(claude, qwen, qoder) 설치 목록에 `SubagentStart`·`SubagentStop`이 더해졌다.
    - `agent_id`가 붙은 `PostToolUse`·`PostToolUseFailure`는 `ChildStarted`다. `ChildEnded`가 없는 harness와 `hook-agent-` id에서는 예전대로 `PermissionResolved`다.
    - Claude Stop payload의 `background_tasks`에서 `type: "subagent"`이고 running·pending인 id가 `children`이다. 배열이 있으면 비어 있어도 싣는다. shell, monitor, workflow, MCP task, teammate는 싣지 않는다.
    - OpenCode 계열 plugin은 하위 session의 `session.status`를 `properties.lophn_child`를 달아 root의 것으로 넘기고, busy·retry는 `ChildStarted`, idle은 `ChildEnded`가 된다.
  - shell main tracker는 terminal마다 child 집합(id → 마지막 신호 시각)을 둔다.
    - 보이는 상태: 권한 물음이 있으면 waiting이고, 그다음 main turn이 돌거나 child가 있으면 running이다.
    - `TurnEnded.children`이 있으면 집합을 그것으로 바꾼다.
    - session 경계, 사람의 끊기 key, harness가 바뀌거나 떠남은 집합을 비운다.
    - 10분 동안 신호가 없는 child는 뺀다.
    - `ChildStarted`는 대기 중인 권한 물음도 푼다.
  - turn 끝 알림(완료·실패)은 child가 남았으면 보내지 않는다. 보이는 상태가 idle이 되고 1.5초 동안 다시 running·waiting이 되지 않을 때 한 번 보낸다. 상태와 unseen은 바로 바꾼다. 실패한 turn의 알림도 이렇게 늦어진다. 권한 물음 알림은 그대로 바로 간다.
  - 바깥 모양(`TerminalAgent.state`의 넷, IPC, 화면)은 그대로다.

  옮기기: 없음. 상태는 메모리뿐이다. 이미 hook을 놓은 사람의 설정에는 새 event가 없다. Claude 꼴은 `SubagentStart`·`SubagentStop`이 없고, OpenCode 계열은 plugin 본문이 바뀌었다. 그래서 dry_run이 `missing`으로 보고, 처음 알아볼 때 다시 묻고, Settings에는 [Install hooks]가 다시 보인다. 사람에게 묻지 않고 고치지 않는다.
why: |
  subagent가 도는 동안 탭이 idle로 보이고 알림이 두 번 갔다. Orca, T3, Paseo, Emdash, herdr를 비교한 harness-lab 보고서의 "적용할 점"을 따랐다. main turn과 child를 따로 들고 합친다. 흔들림은 상태가 아니라 알림에서 흡수한다.
decisions:
  - text: |
      표시 상태는 main turn 상태와 child 집합을 합쳐 계산한다. child를 따로 세기만 하는 길(Paseo)은 증상이 남아 버렸다.
    by: agent
  - text: |
      child 근거는 hook만 쓴다. 화면 문구로 읽는 길(herdr)은 버렸다. Codex와 그 밖 harness의 child는 hook에 근거가 없어 그대로다.
    by: agent
  - text: |
      background shell, monitor, workflow는 진행 중으로 치지 않는다(T3, herdr Claude). 늘 도는 dev server 때문에 영원히 running이 되는 것을 막는다.
    by: agent
  - text: |
      child가 남으면 finished를 보내지 않고 다 끝나 idle이 될 때 한 번 보낸다(T3). 알림은 1.5초 늦추고 상태는 바로 바꾼다(Orca).
    by: agent
  - text: |
      child는 `SubagentStop`, session 경계, 사람의 끊기 key로 지우고, 10분 동안 신호가 없으면 지운다. Stop의 `background_tasks`가 있으면 그것이 정본이다(Orca).
    by: agent
  - text: |
      Claude payload의 꼴과 id 일치(`background_tasks`의 id = `agent_id`)는 Claude Code CLI 2.1.316 bundle을 읽어 정했다. 실제 harness를 돌려 녹화하지 않았다. 실제 model을 부르는 일이라 사람의 허락을 기다린다. test fixture는 문서와 bundle로 만들었다.
    by: agent
  - text: |
      새 hook event가 빠진 설정은 지금의 설치 화면이 다시 놓으라고 보이는 길을 쓴다. 사람에게 묻지 않고 고치지 않는다.
    by: agent
follow_up: |
  이미 hook을 놓은 사람은 [Install hooks]를 다시 누르거나 처음 물을 때 허락해야 child 상태가 보인다. 실제 Claude Code payload로 fixture를 확인하는 녹화가 남았다.
