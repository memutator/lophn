schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # schema migration

  - id: req-0052
    status: accepted
    impl: done
    subject: storage
    statement: lophn은 기동할 때 번호를 붙인 schema step을 순서대로 적용하고 적용 이력을 남긴다.
    acceptance:
      - 적용하지 않은 step이 있으면 기동할 때 번호 순서대로 적용된다.
      - 적용한 step은 이력에 남고 다음 기동에서 다시 적용되지 않는다.

  - id: req-0053
    status: accepted
    impl: done
    subject: storage
    statement: schema step은 step마다 transaction 하나로 적용하고, 실패하면 그 step 전체를 rollback한다.
    acceptance:
      - step 하나가 중간에 실패하면 그 step이 바꾼 것이 하나도 남지 않는다.
      - 실패한 step 앞의 step은 적용된 채로 남는다.

  - id: req-0054
    status: accepted
    impl: partial
    gap: 세 경우 모두 시작을 거절하고 원본을 지키지만, 화면은 일반 시작 실패("lophn didn't start")만 보이고 lophn update 안내 화면은 연결 코드가 쓰지 않는다.
    subject: storage
    statement: 지원하는 것보다 높은 schema, 내용 hash가 다른 이력, 손상된 원본을 만나면 시작하지 않고 원본을 그대로 둔다.
    details:
      on_failure:
        - 사람에게 보이는 안내는 lophn update뿐이다.
    acceptance:
      - 지원하는 것보다 높은 schema의 기록으로 기동하면 lophn이 시작하지 않고 원본이 바뀌지 않는다.
      - 적용 이력의 내용 hash가 다르면 lophn이 시작하지 않고 원본이 바뀌지 않는다.
      - 손상된 원본으로 기동하면 lophn이 시작하지 않고 원본이 바뀌지 않는다.

  - id: req-0056
    status: accepted
    impl: done
    subject: storage
    statement: schema를 바꾸는 동안 다른 쓰기와 worker를 멈춘다.
    acceptance:
      - migration이 도는 동안 다른 쓰기 요청과 worker가 기록을 바꾸지 않는다.

  - id: req-0057
    status: accepted
    impl: partial
    gap: 변환 직전 복구본은 만들지만 그 전 복구본을 지우지 않고, 다음 기동이 정상이어도 복구본을 자동으로 지우지 않는다.
    subject: storage
    statement: 변환 직전 복구본은 가장 최근 것 하나만 두고, 다음 기동이 정상이면 자동으로 지운다.
    acceptance:
      - step을 적용하기 직전에 복구본이 하나 생기고, 그 전 복구본은 남지 않는다.
      - 변환 뒤 다음 기동이 정상으로 끝나면 복구본이 사람 조작 없이 지워진다.
