id: sidebar-draft-tab-and-rename
version: 0.18.0
title: "sidebar에 새 lophn 탭이 뜨고, 다른 place 터미널 줄도 연필·x가 있다"
modules: [packages/shell/renderer, packages/design]
checked: []
change: |
  전: 첫 메시지 전의 lophn Agent 탭("New session")은 session id가 없어 sidebar에 줄이 없었다. 다른 place의 coding agent 터미널 줄은 hover해도 연필·x가 없었다(`actions: false`).
  후: session 없는 이 창의 Agent 탭은 current의 draft 줄(`SidebarSessionKind` `draft`, ref는 탭 key, 제목 "New session")이다. 누르면 그 탭을 고르고 x는 탭을 닫는다. 연필은 없다. 첫 메시지를 보내면 session 줄로 바뀐다. 다른 place의 터미널 줄 연필은 그 place의 저장된 탭 이름과 저장한 coding agent session 이름을 바꾸고, x는 창의 terminal store로 닫기 확인을 거쳐 PTY를 닫은 뒤 그 place의 저장된 layout에서 탭을 지운다. `PlaceWindow`의 `terminalStore` prop은 `windowTerminal`(TerminalDeps)이 되었다.
why: |
  사람이 새 lophn 탭이 agent session으로 안 뜨는 것과, 고른 project가 아닌 줄에도 rename·x가 뜨게 해 달라고 요청했다(사람 2026-11-04).
decisions:
  - text: |
      session은 지금처럼 첫 메시지 때 만든다. 탭을 열 때 만들면 안 쓴 빈 session이 Recent에 쌓인다.
    by: agent
  - text: |
      draft 줄은 이 창의 탭만이다. 다른 place의 저장된 layout에 남은 session 없는 Agent 탭은 줄이 없다.
    by: agent
  - text: |
      다른 place를 다른 창에서 열어 두었으면 그 창이 다음에 저장할 때 이 고침을 덮는다. 다른 place의 lophn 탭 닫기와 같은 한계라 그대로 둔다.
    by: agent
