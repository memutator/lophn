id: multi-screen-app-map-no-mappings
title: "화면이 둘 이상인 앱의 합친 `app.js.map`에 `mappings`가 없다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/apps]
now: |
  `core/apps/releases/ui-build/build.ts`가 화면별 source map을 `app.js.map` 하나로 합칠 때, 화면이 둘 이상이면 `mappings`를 담지 않는다. `core/problems/snapshots/work.ts`는 앱 오류 stack을 앱 source 위치로 풀 때 이 `mappings`를 읽는다. annotation의 source 위치 잇기를 지운 뒤 이 map을 읽는 곳은 problems뿐이다.
impact: |
  화면이 둘 이상인 앱의 오류는 stack을 source 위치로 풀지 못하고 bundle 위치로만 남는다. App Engineer가 고칠 곳을 찾는 데 시간이 든다.
fix: |
  - 화면별 map을 따로 봉인하고 problems가 stack의 화면 bundle에 맞는 map을 읽는다(중간).
  - 합친 map에 index map(`sections`)을 쓴다(중간. 읽는 쪽이 sections를 풀어야 한다).

  추천: 첫째.
closed: |
  화면 build(`ui-build/build.ts`)가 화면마다 `screens/<key>/main.js.map`을 bundle file로 내고 합친 `app.js.map`은 없다. problems(`snapshots/work.ts`의 `frameFromScreenMap`)는 stack에서 `/screens/<key>/main.js`를 가리킨 첫 site의 화면 map으로 앱 source 위치를 풀고, 그것을 `framesInsideBundle`보다 먼저 시도한다. 위치를 모르는 stack에서 map 전체를 푸는 가지는 지웠다. mappings 문자열 한도(`stack_bytes`, 16 KiB)를 넘는 큰 화면은 여전히 bundle 위치로만 남는다.
guard: "packages/core/problems/snapshots/work_test.ts"
