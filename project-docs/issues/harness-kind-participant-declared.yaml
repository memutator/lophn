id: harness-kind-participant-declared
title: '이름 없는 `{kind: harness}` 참가자가 아직 선언된다'
kind: defect
status: fixed
topic: workflow
modules: [packages/protocol, packages/core/workflows, packages/shell/renderer]
now: |
  harness agent는 runtime이 harness인 이름 있는 agent라 `{agent}` 참가자로 넘긴다. 그런데 옛 설계의 `{kind: "harness"}`가 protocol(`packages/protocol/workflows/declaration.ts`, `values.ts`, `instances.ts`의 not_handed 이유 `harness`), core(`packages/core/workflows/declaration.ts`, `plan.ts`), renderer(`packages/shell/renderer/workspace/source.ts`)에 남아 선언으로 받고 넘길 때 `not_handed`(`unresolved`)가 된다.
impact: |
  workflow를 쓰는 사람이나 agent가 받을 곳 없는 참가자를 선언할 수 있고, 지울 때까지 세 package가 쓰이지 않는 꼴을 지닌다.
fix: |
  kind를 지우고 저장된 instance `participants`의 `{kind: "harness"}`를 옮기는 ledger step을 더한다(중간). 추천.
closed: |
  protocol, core, renderer, `write-workflow` skill에서 `{kind: "harness"}`와 not_handed 이유 `harness`를 지웠다. ledger step `workflows.no-harness-kind`(목록 끝)가 저장된 instance의 harness 참가자를 지우고 `harness` not_handed 줄을 `unresolved`로 바꾼다(줄 trigger를 잠시 내렸다 같은 정의로 다시 건다). `workflow.yaml`에 아직 `{kind: harness}`가 있으면 `invalid_declaration`이고 손으로 고쳐야 한다(agent 이름을 알 수 없다).
guard: '`packages/core/workflows/schema_test.ts` "harness 참가자와 harness 이유가 저장된 행은 step 뒤 새 schema로 읽힌다"'
