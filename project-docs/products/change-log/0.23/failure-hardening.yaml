id: failure-hardening
version: 0.23.45
title: 다른 harness가 막아 둔 실패 가운데 lophn에 없던 것을 고친다
modules: [packages/protocol, packages/coding-agent, packages/core/apps, packages/core/host-queue, packages/core/lophn-agent, packages/core/main, packages/core/server, packages/core/storage, packages/design, packages/shell/main, packages/shell/renderer, packages/shell/terminal-host]
change: |
  깨진 입력 하나, 죽은 자식 하나, 조용히 끝난 Worker 하나가 앱이나 session을 멈추지 않게 하고, 실패하면 사람과 model이 원인을 알게 했다.
  - core 수명: ready 뒤 ledger writer Worker가 죽으면 core가 `writer_dead`를 남기고 exit 1한다(ready 전이면 기동 실패). 종료 전체 기한 90초(`shutdown_deadline`), HTTP drain 10초. `run/running.marker`로 다음 기동이 `previous_unclean_exit`를 남긴다. shell은 ready 뒤 60초를 못 산 core를 다섯 번까지 1·2·4·8초 쉬며 다시 띄우고, 넘으면 시작 실패 화면에 멈춘다. 두 번째 shell은 single-instance lock을 잡기 전에 core를 건드리지 않고, Quit·`Stop lophn`은 돌던 ensure를 끊는다.
  - 저장소: 오류 글에 원인(disk full, locked, corrupt, io)을 싣고 corrupt면 writer 연결을 fault로 만든다. 정지 maintenance가 본문이 없다고 확인된 blob의 purpose 기록과 미참조 표지만 지우고 고아 기록을 정지마다 2,000개까지 쓸어 낸다.
  - agent runtime: runtime이 끝나면 `shell.run` 자식 group을 죽인다. `shell.run` 시간 초과는 `uncertain`이다. 감독이 포기하면 60초 뒤 한 번 다시 띄운다. idle-exit가 도는 lophn agent turn을 일로 친다. git이 없으면 "git was not found"로 끝난다. extension tool 호출 기한 5분.
  - run-loop: 빈 응답은 한 번 되묻고 `no_answer`로 끝낸다. 같은 tool 호출이 같은 실패로 세 번 이어지면 네 번째부터 돌리지 않고 여섯 번이면 `repeated_tool_failure`로 끝낸다. 없는 tool 이름 hint, 잘린 응답 hint, 재시도 jitter와 연결 끊김 사다리(5·15·30초). 기록하지 못한 tool 호출은 읽기만 돌린다. `FinishTurn`이 실패한 turn을 failed로 닫는다. Compact가 세 번 이어 실패하면 turn 앞 Compact를 멈추고 요약 호출은 일시 실패를 재시도한다. 재시작은 열린 tool call을 `uncertain`으로 닫고 다음 turn에 알린다. Stop한 turn도 마지막 tool round를 이력에 남긴다. provider가 거절한 image는 그 turn에서 빼고 다시 보낸다.
  - provider: reset 정보 없는 429는 일시 제한으로 재시도한다(30초 넘는 reset만 quota). `max_tokens` 인자 오류는 overflow가 아니다. refresh 실패는 `invalid_grant`·`invalid_client`·`unauthorized_client`만 영구다. 요청 중 401은 강제 갱신 뒤 한 번 다시 보낸다. 실패 문구가 원인(사용량 한도, 로그인 거절, rate limit)을 말한다(ACP error notice evidence에 `http_status`).
  - tools: `file.grep`·`file.glob`은 Worker에서 10초에 끊는다. `file.edit`은 BOM·CRLF를 지키고 UTF-8이 아닌 file을 거절한다. 쓰기는 임시 file 뒤 rename이고 10 MiB 상한이다. MCP `isError` 본문을 그대로 model에 준다. 보낸 뒤 답이 없는 MCP 호출은 `uncertain`이다. 죽은 stdio server를 알아채 다시 붙는다. 큰 MCP·extension 결과는 file로 넘긴다.
  - 터미널: host 안 요청 하나의 예외가 host를 끝내지 않는다. main이 사라지면 host가 PTY 자식을 정리하고 끝난다. env 청소가 `SSH_AUTH_SOCK`·`XAUTHORITY`·`GIT_AUTHOR_*`·`GIT_COMMITTER_*`·proxy 변수를 남긴다. supervisor 요청 기한 10초, host 종료 원인 log 한 줄, 거절된 paste의 나머지는 보내지 않는다. harness 설정 file은 symlink를 따라 임시 file 뒤 rename으로 쓰고, 읽은 뒤 바뀌었으면 한 번 다시 읽는다. `lophn hook`은 stdin을 1초까지만 기다린다.
  - extension과 harness GUI: extension 자식 pipe 오류가 앱을 끝내지 않고, exit는 한 번, spawn 실패 원인을 알린다. login shell env는 extension spawner가 가진다. 앱이 끝날 때 살아 있는 자식 group에 SIGTERM을 보낸다. 네 adapter는 깨지거나 큰 frame을 버리고, 요청 30초 기한, 실패하면 자식을 끝내고, stderr의 credential을 가린다. Claude rewind·fork가 실패하면 앞 session을 지킨다. OpenCode는 끊긴 SSE를 다시 구독하고 그 사이 끝난 turn을 닫는다.
why: |
  다른 harness 15개가 이미 막아 둔 실패 201개를 lophn에 대어 본 조사(`project-docs/products/roadmap/failure-hardening.md`)에서 그대로 있다고 확인된 표준·흔함 항목과 lophn 고유 항목을 고쳤다. 넣지 않은 것과 이유는 roadmap 문서에 남는다.
decisions:
  - text: 범위는 대조에서 그대로 있다고 확인된 표준·흔함 항목과 lophn 고유 항목이다. 모범 사례는 같은 file을 고치는 김에 한두 줄로 되는 것만 넣었다(atomic write, harness stderr의 secret 가리기).
    by: agent
  - text: shell은 core의 pipe 방어를 import하지 않고 spawn하는 곳(extension spawner, terminal supervisor)에 직접 쓴다. 이유는 check-deps가 shell → core를 막고 base는 `node:` import를 못 쓰며, 한 줄이라서다.
    by: agent
  - text: harness-gui는 adapter file마다 task 하나로 나눴다. 공통 실패 꼴은 만들지 않고 ACP error `code`에 공통 오류 코드를 쓴다.
    by: agent
  - text: ledger writer가 죽으면 writer만 다시 띄우지 않고 core가 exit 1한다. 버린 길은 writer만 다시 띄우기(writer 안 기억을 잃고 새 상태와 화면이 필요하다)와 graceful shutdown(shell이 다시 띄우지 않는다)이다.
    by: agent
  - text: reset 정보가 없는 429는 quota 소진이 아니라 일시 제한으로 보고 2초, 4초로 두 번 다시 보낸다. 잃는 것은 정말 소진된 계정에서 요청 둘이다.
    by: agent
  - text: 같은 tool 호출이 같은 실패로 세 번 이어지면 네 번째부터 돌리지 않고, 여섯 번이면 turn을 `repeated_tool_failure`로 끝낸다. 바로 이어진 똑같은 호출만 보아 진행하는 turn은 건드리지 않는다("기본 상한 없음"과 부딪히지 않는다).
    by: agent
  - text: 빈 응답은 한 번 되묻고, 또 비면 turn을 `no_answer`로 끝낸다.
    by: agent
  - text: Stop 뒤 마지막 tool round는 이력만 싣는 checkpoint 한 번으로 남긴다. 다음 turn의 model이 방금 쓴 file을 모르고 다시 쓰지 않게 한다.
    by: agent
  - text: 기록하지 못한 tool 호출은 읽기만 돌린다. 기록 실패면 model 호출을 보내지 않는 규칙과 같다.
    by: agent
  - text: "`file.grep`·`file.glob`은 Worker에서 돌리고 10초에 끊는다. 버린 길은 ripgrep(OS별 포장과 Rust regex 문법 차이)과 줄 길이 상한만 두기(`(a+)+$`를 못 막는다)다."
    by: agent
  - text: MCP `isError` 본문은 감싸지 않고 model에 준다(`project-docs/architecture/approval.md`가 MCP 결과를 감싸지 않기로 했다). extension tool 호출 기한은 5분이고 tool별 기한 칸은 만들지 않는다.
    by: agent
  - text: 저장소 오류는 원인을 오류 글에 싣고 새 화면은 만들지 않는다. blob 부속 기록은 본문이 없다고 확인된 것만, 멈출 때 도는 maintenance에서만 지운다.
    by: agent
  - text: 터미널 env 청소는 정확한 이름 허용 목록을 둔다. local port 값을 지우는 규칙은 그 밖의 이름에 그대로 둔다.
    by: agent
  - text: login shell env는 extension spawner가 가진다. headless harness도 같은 PATH를 얻고, 느린 rc file이면 extension이 최대 5초 늦게 뜬다(앱 시작은 막지 않는다).
    by: agent
  - text: 종료 전체 기한은 90초(단계 기한의 합 65초보다 길게), core 재시작 상한은 ready 뒤 60초 안에 다섯 번이다. agent runtime 감독이 포기하면 60초 뒤 한 번 다시 띄우고 알림은 띄우지 않는다(맞는 알림 종류가 없고 새로 만들면 protocol이 바뀐다).
    by: agent
  - text: 실패 문구는 원인을 말하고 [Retry]는 그대로 둔다. quota 상태를 남겨 보내기 전에 막는 일은 넣지 않았다(roadmap).
    by: agent
follow_up: |
  - `turnList`에 순서와 개수가 없어 turn 시작마다 끝난 turn을 다 읽는다(이슈 `cut-off-notice-scans-all-turns`).
  - 앱이 끝날 때 extension 자식에는 SIGTERM만 간다. SIGTERM을 무시하는 CLI와 Windows의 CLI(비동기 tree kill)는 남을 수 있다.
  - harness GUI 탭 아래 CLI를 죽이는 확인은 실제 앱에서 하지 않았다(아래 checklist).
  - SDK의 ACP type(`packages/sdk/agent/acp-types.ts`)에는 error notice evidence의 `http_status`가 없다. 선택 칸이라 SDK 판은 올리지 않았다.
checklist:
  - 터미널 탭에서 `ssh-add -l`과 `git config user.name`이 앱 밖 터미널과 같은 답을 내는지 본다
  - core process를 kill하면 앱이 core를 다시 띄우고, 60초 안에 다섯 번 죽이면 시작 실패 화면에 멈추는지 본다
  - 터미널 탭에서 `claude gui`(또는 `codex gui`)를 연 뒤 그 CLI process를 kill해도 앱이 살아 있고 탭에 실패가 보이며 CLI 자식이 남지 않는지 본다
  - 앱을 Quit한 뒤 harness GUI가 띄운 CLI process가 남지 않는지 본다
