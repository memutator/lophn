id: claude-bang-output-shown-at-end
title: Claude GUI의 `!` 출력이 끝나야 보인다
kind: defect
status: open
topic: harness-gui
modules: [packages/shell/main]
now: |
  `claude.ts`는 `!` 출력을 process가 끝날 때 tool item `body`에 한 번에 싣는다(ACP에 도는 tool의 본문 갱신이 없다). shell은 `/bin/sh`로 박혀 있다. cwd는 앞 `!`가 끝난 곳에서 이어진다.
impact: |
  오래 도는 `!` 명령은 끝날 때까지 출력이 비어 보인다. Windows에서는 `!`가 돌지 않는다.
fix: |
  출력 흐름은 tool body를 덧붙이는 갱신이 ACP에 생길 때 같이 한다. 작음.
