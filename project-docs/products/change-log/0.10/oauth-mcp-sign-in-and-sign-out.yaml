id: oauth-mcp-sign-in-and-sign-out
version: 0.10.1
title: "OAuth MCP server를 붙이고 sign-in한다. 앱 secret을 지우고 sign-out한다. 일시 오류로 sign-in이 끊기지 않는다"
modules: [packages/core/lophn-agent, packages/core/apps, packages/core/secrets, packages/core/main, packages/protocol, packages/shell/main, packages/shell/renderer, packages/design, tools]
checked: []
change: |
  전:
  - MCP server form은 인증으로 None, Bearer, API key만 골랐다. 설정 file에 oauth2를 손으로 써도 sign-in 단추가 없어 그 server는 늘 Needs sign-in이었다. 끝점은 ${issuer}/authorize|token으로만 만들었고 client_credential은 읽는 곳이 없어 client secret 없이 교환했다.
  - MCP OAuth는 refresh 응답이 400 이상이면 모두 거절로 보고 token을 지웠다. 발급자가 잠깐 503을 내도 사람이 다시 sign-in해야 했다.
  - 앱 Access 탭은 값을 넣기만 했다. 넣은 API key를 지우거나 OAuth sign-in을 끝낼 길이 없었다.
  후:
  - Settings › Tools and skills와 project 층의 server form이 OAuth 2.1(issuer, client ID, scopes)을 받는다. client secret은 더한 뒤 보호 입력으로 mcp.<scope>.<server>.client에 넣고, 넣지 않으면 public client다. OAuth 줄은 로그인 전 [Sign in], 기다리는 동안 [Cancel]이다.
  - MCP sign-in은 발급자의 /.well-known/oauth-authorization-server를 먼저 읽어 https 끝점을 쓰고, 없으면 ${issuer}/authorize|token이다. client secret은 교환과 refresh 본문에만 실린다.
  - 앱 OAuth와 MCP OAuth의 refresh가 같은 규칙이다: 400·401·invalid_grant만 거절이고, 그 밖에는 만료 전 token을 그대로 쓴다.
  - 앱 Access 탭의 plain secret 줄은 값이 있으면 [Remove value], OAuth 줄은 signed_in·failed일 때 [Sign out]이 있다. Sign out은 access·refresh·meta를 지우고 client id·secret은 남긴다.
  - secrets/put과 shell의 secret 제출이 byte 배열을 0으로 덮던 코드를 지웠다. 같은 값이 이미 JS 문자열로 있어 효과가 없었다.
  계약:
  - 생긴 것: route apps.oauth_sign_out({app, name} → {signed_out: true}), McpOAuth.signOut, createMcpAuthControl deps의 secrets, MCP runtime oauth2 auth의 client_secret(secret 이름).
  - 지운 것: McpOAuthServer.refreshRejected, refreshToken 입력의 rejected, createMcpOAuth의 keepValidOnUnavailable.
why: |
  hosted MCP server 대부분이 OAuth인데 사람이 붙일 길이 없었고, 앱에 넣은 key와 refresh token은 lophn 안에서 지울 수 없었다. 발급자의 잠깐 오류로 sign-in을 잃는 일은 앱 OAuth에서 이미 막았는데 MCP만 남아 있었다.
decisions:
  - text: "dynamic client registration은 하지 않는다. 사람이 그 서비스에 만든 client를 넣는다(앱 OAuth와 같다)."
    by: agent
  - text: "agent 정의 층 server는 OAuth를 고르지 않게 둔다. core에 그 층의 sign-in 길이 없어서다. 남은 일은 issues/agent-definition.md다."
    by: agent
  - text: "grant [Revoke]는 앱 secret 값을 지우지 않는다. 이름이 전역이라 다른 앱이 같은 값을 쓴다."
    by: agent
  - text: "과하다고 본 secret 장치 가운데 앱 log를 읽을 때의 redaction, supervisor의 60초 보관과 redirect 뒤 다시 붙이지 않기는 남긴다. 앞의 것은 core만 아는 값을 지우고, 뒤의 둘은 invocation 끝을 모르는 supervisor와 바깥 서버의 redirect를 막는다."
    by: agent
follow_up: |
  issues/agent-definition.md의 "agent 정의 층의 OAuth MCP server는 sign-in할 길이 없다".
