id: session-snapshots-list-read-missing
title: core에 `session_snapshots/list` read가 없다
kind: bug
status: fixed
topic: event
modules: [packages/core/lophn-agent, packages/core/approvals, packages/core/main, packages/shell/renderer]
now: |
  `packages/protocol/events/snapshot.ts`가 `sessionSnapshotsList`(session의 지금 상태, 대기 중인 permission request, 질문)를 정의하고 `packages/protocol/registry.ts`에 올라 있지만, core에 그 read handler를 다는 곳이 없다. `packages/core/server/dispatch.ts`의 `read()`가 handler를 못 찾아 `unavailable: read unavailable`을 낸다. `packages/core/approvals/approvals.ts`가 service에 `turnRequests`를 내놓지만 부르는 곳이 없다. `tests/e2e/approval_test.ts`와 `tests/e2e/restart_test.ts`가 `waitPermission`(`tests/support/core/human.ts`)에서 재현한다.
impact: |
  renderer의 `readSessions`(`packages/shell/renderer/conversation/agent-tab-core-source-sessions.ts`)는 session이 하나라도 있으면 이 read를 부르고, 실패하면 목록 전체를 실패로 돌려준다. 화면이 붙거나 다시 붙을 때 대기 중인 허락 요청과 질문을 snapshot으로 다시 맞추는 길(`architecture/event.md`)이 없다.
fix: |
  - read handler를 단다(중간): session 상태는 lophn-agent의 turn 기록에서, `permission_requests`는 approvals의 `turnRequests`에서, 질문은 그 저장소에서 모은다. 조립은 `main/daemon/wiring/`에서 한다(approvals와 lophn-agent를 잇는 곳).
  - 추천: read handler를 단다. snapshot은 architecture가 정한 계약이다.
closed: |
  `main/daemon/wiring/session-snapshots.ts`가 read를 단다. lophn session은 `lophn-agent/session/model.ts`의 함수로, coding session은 `apps/tickets/coding/store.ts`의 함수로 읽고, `permission_requests`는 approvals의 `turnRequests`, 질문은 approvals wiring이 `questionWaits`로 낸 기다림의 `list`에서 온다. `sessions`를 생략하면 열린 session 전부, 없는 id는 뺀다.
guard: tests/e2e/approval_test.ts, tests/e2e/restart_test.ts
