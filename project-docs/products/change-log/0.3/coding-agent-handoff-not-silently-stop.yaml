id: coding-agent-handoff-not-silently-stop
version: 0.3.0
title: 'coding agent에 맡긴 일이 조용히 멈추지 않게'
modules: [packages/core/lophn-agent, packages/core/agent-workspaces, packages/coding-agent, packages/protocol, packages/shell/renderer, packages/design]
checked: [architecture-eval, architecture-approval, architecture-agent-definition, architecture-workspace-layout]
change: |
  전:
  - coding agent가 `lophn message send`로 물으면 App Engineer가 받는 봉투에 답하는 길이 없었다. 글로만 답하면 터미널에 가지 않아 coding agent가 멈췄다. `lophn message send --help`는 `refs (선택, array)`로만 적었다.
  - Claude Code가 새 앱 source 폴더마다 folder trust를 묻는 동안 hook이 돌지 않는데, lophn 화면에는 아무것도 보이지 않았다.
  후:
  - coding agent가 보낸 call의 봉투에 `Plain text does not reach its terminal. To answer, use call with to:{session:"<id>"} and reply:"conversation".` 한 줄이 붙는다. App Engineer 지침에 같은 길과 "`to:{role:"coding_agent", place}`는 새 ticket 맡기기 전용"을 적었다.
  - CLI help가 입력 칸의 schema description을 보인다. `refs`는 "ticket IDs, e.g. ["tkt_…"]"다.
  - 터미널을 열고 5초 안에 첫 hook 신호가 없는 coding session(첫 신호가 `SessionStarted`인 harness)이 대기 목록에 "Check the terminal"로 보인다. 누르면 그 탭으로 focus가 가고, 첫 신호·session 끝·터미널 exit에 사라진다.
why: |
  eval의 첫 진짜 run에서 두 길 모두 사람 모르게 맡기기가 멈췄다.
decisions:
  - text: '답하는 길은 봉투와 지침으로 알린다. 답할지, 무엇을 답할지는 App Engineer가 정하고 core는 글을 터미널로 보내지 않는다.'
    by: person
  - text: '그 줄은 `from.kind === "coding_agent"`로 정한다. 받은 turn과 뒤 이력이 같은 함수로 같은 bytes를 만들어 cache가 깨지지 않는다.'
    by: agent
  - text: '`lophn message send --help`가 `refs`는 ticket id 문자열의 배열이라고 적는다.'
    by: agent
  - text: 'trust는 대기 목록으로 알린다. 화면 글은 긁지 않고 `~/.claude.json`은 쓰지 않는다.'
    by: person
  - text: '조건은 core가 아니라 shell renderer가 센다. 5초는 정상 SessionStart가 오는 시간의 기록이 없어 정한 값이다.'
    by: agent
follow_up: |
  App Engineer 지침과 `packages/core/lophn-agent`, CLI·protocol이 바뀌어 eval의 `instruction:app-engineer`, `runtime`, `core`가 올랐다. 그래서 commit된 eval run은 낡음으로 보인다. 그대로 두고 계획 `eval-experiment`의 baseline이 새로 잰다. 열린 이슈: `project-docs/issues/coding-agent.md`(`session.list`에 열린 coding session이 없음, 뒤에 연 창에는 첫 신호 대기 항목이 없음).
