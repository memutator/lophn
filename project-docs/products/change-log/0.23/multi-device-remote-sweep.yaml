change: |
  - **Remote·보안·세션 경계**:
    - `sessions/archive`는 도는 turn이 있으면 `stop_turn: true` 없이 `conflict`(`turn_running`)로 거절하고 desktop 화면이 확인을 받는다.
    - `acp/send`의 기기 coding session 입력에서 `set_mode`를 `forbidden`으로 막고 `run_shell`(`!`)은 터미널 입력 허락을 본다. `edit_queued`·`move_queued` 변경을 `AcpUpdated`로 중계한다.
    - `coding_sessions/switch`에 선택 `stops` 계획을 더해 `switch_plan` 이후 멈출 일이 달라지면 `conflict`(`stale_plan`)로 거절한다(desktop·폰 화면 연동).
    - `instructions/read_global`·`write_global`(`base_hash` 낙관적 잠금)과 `terminals/name`·`terminals/rename_saved`를 `REMOTE_PERSON_ROUTES`에, `app_views/log_error`(caller의 `(owner, view)` binding 한정)를 `REMOTE_ALLOWED_ROUTES`에 추가했다.
    - `jobs/create`가 private workspace의 remote event job 생성을 `forbidden`으로 거절하고, `core/remote/links`가 `AppEventPublished` 수신 rate cap(20/s, burst 40)을 적용하며, remote port bind 실패 이유를 초대·합류 오류에 싣는다. release 내보내기·받기가 NFC+소문자 대소문자 충돌 경로를 거절한다.
    - harness GUI 탭의 승인·질문 대기도 폰 push 계기를 낸다. page-host는 모든 browser 탭이 닫힌 뒤 5분간 idle이면 종료한다.
  - **Antigravity(`agy`)·터미널·Linux 패키징**:
    - `foreground` `MAX_ARGS`를 32로 늘리고, TUI의 명시적 `--dangerously-skip-permissions` flag를 `agy acp`·`tuiCommand`·`carry`로 TUI↔GUI 전환 동안 보존한다.
    - `sessionOfProcess`와 비 Linux `expectResume`, `antigravity` `SessionStart` hook으로 resume 직후 첫 메시지 전에도 GUI 전환을 허용한다.
    - `antigravity` `PreInvocation`의 `lastUserInput`을 prompt로 읽고, GUI ACP 제목을 `AgentSessionStore`에 저장(고정 이름 보존)·재개 시 복원하며, renderer의 기본 라벨 덮어쓰기·저장된 session 이름 바꾸기 누락을 고쳤다.
    - shell main 터미널 clipboard IPC를 await·catch로 고치고, Linux 패키징 시 `node-pty`의 `cfsetispeed`/`cfsetospeed`를 GLIBC 2.2.5/2.17에 고정하며 GLIBC 상한(2.35) 검사를 추가했다.
    - 원격 터미널 탭의 위로 scroll 시 점프 방지, 마지막 창 닫힘 시 `terminal_view/watch` lease 즉시 해제, 알림 클릭 시 원격 터미널 탭 열기·이동, 탭 이름 바꾸기를 연결했다.
  - **Desktop UI·Provider·Inbox**:
    - `DisconnectProvider`가 definition key별 provider id를 기억해 재연결 시 재사용하고, 끊긴 provider를 가리키는 기본 model을 unset으로 취급한다. API key 앞뒤 공백 정리·내부 공백 거절 및 비밀 입력창 보기 토글을 추가했다.
    - `MachineScope`의 원격 Manage models 라우팅과 model 변경 뒤 composer model picker 자동 갱신을 고쳤다.
    - desktop Inbox History가 연결된 모든 컴퓨터의 영구 기록을 시각순 병합해 보이고, Sync Settings에서 중복 machine key를 경고하며, My devices의 disputed 행 key 표기·View only 안내, App details의 미해결 원격 구독 표시, job 승인 카드의 앱 이름 표시를 더했다.
    - 왼쪽 sidebar에서 열지 않은 project의 Recent session을 유지하고 0ms 전체 폭 Skeleton 깜박임을 정리했다.
  - **폰 앱(`packages/mobile`)**:
    - 폰 실행 앱이 모든 짝지은 컴퓨터에 걸쳐 앱당 단일 폴더·SQLite DB(`files/apps/<app>/`)와 컴퓨터별 pull cursor를 쓰도록 통합하고 기존 폴더를 자동 이관한다.
    - guest sandbox에서 `Modal`/`RCTModalHostView`를 차단하고, unmount 시 타이머·참조·임시 디렉터리를 정리하며, 연속 release 갱신을 350ms 창으로 합친다.
    - live 컴퓨터 호스팅 폰 화면 실패(`fatal`·`crashed`·`did_not_start`)를 `app_views/log_error`로 컴퓨터 앱 log에 남긴다.
    - 터미널 입력 재시도 시 동일 `key` 재사용, carry 건너뛴 file 기억·미저장 신뢰 컴퓨터 보관 판단, view 전환 시 입력 초안 유지, 콜드 스타트 딥링크 대기, Android 위젯 Pretendard 글꼴, 모바일 테스트의 flow catalog 등록을 마쳤다.
why: |
  멀티 기기(desktop·원격 컴퓨터·폰)와 Antigravity(`agy`)·터미널·provider 사용 중 보고된 50건의 버그·결함을 일괄 해소하고, 남기기로 정한 6건의 이슈 판단을 기록한다.
decisions:
  - text: "turn이 도는 session 보관 시 conflict(turn_running)로 거절하고 확인 후 stop_turn: true로 진행한다. 버린 길: 확인 없이 즉시 중단(다른 기기가 방금 시작한 turn이 말없이 끊긴다)."
    by: person
  - text: "컴퓨터별 터미널 입력 허락 스위치는 하나로 유지하고 앱 public command 호출도 함께 열린다고 문구에 명시한다. 버린 길: typing/app-commands 두 스위치로 분리(초대·합류 UI 복잡도 증가)."
    by: person
  - text: "같은 machine id를 단 복수 컴퓨터 key는 명단 충돌 규칙을 바꾸지 않고 Sync Settings에서 경고와 Remote 설정 이동을 제공한다. 버린 길: 명단에서 자동 충돌 처리(복구·정상 dual-boot 시나리오 손상)."
    by: person
  - text: "기기의 coding session acp/send는 set_mode를 forbidden으로 막고 run_shell은 터미널 입력 허락이 켜진 기기만 허용한다. 버린 길: 모든 coding session 입력을 무조건 통과."
    by: person
  - text: "Antigravity는 ACP mode에 bypass가 없어 사용자가 TUI에서 명시적으로 켠 --dangerously-skip-permissions flag만 TUI↔GUI 전환에서 그대로 이어 간다. Claude·Codex의 bypass 금지 원칙은 유지한다."
    by: agent
  - text: "폰 화면 오류 기록은 caller가 앱을 고르는 apps/log_view_error를 열지 않고 (owner, view) binding으로 대상을 고정하는 app_views/log_error route로 분리한다."
    by: agent
  - text: "폰에서 도는 sync 앱은 컴퓨터별 사본 대신 앱당 단일 로컬 폴더·SQLite DB와 컴퓨터별 pull cursor를 둔다. 버린 길: 컴퓨터별 사본 유지(기기마다 앱 상태가 갈라진다)."
    by: agent
checklist:
  - "해야: desktop 앱과 폰 앱(Android APK)을 새 판으로 다시 build한다"
  - "해야: Antigravity(agy) hook을 쓰는 환경이면 Settings에서 hook을 다시 설치해 SessionStart를 반영한다"
  - "원격 컴퓨터의 터미널 탭 이름 바꾸기, Settings › Agents 전역 지침 편집, Manage models가 해당 컴퓨터에 적용되는지 확인한다"
  - "agy --dangerously-skip-permissions TUI↔GUI 전환, resume 직후 GUI 전환, session 이름 유지가 동작하는지 확인한다"
  - "폰에서 sync 앱이 여러 컴퓨터와 단일 DB로 동기화되고 터미널 입력 재시도 시 중복 입력되지 않는지 확인한다"
