  - id: provider-connect-key
    title: "provider를 API key로 잇는다(core가 id를 정하고 값을 옮긴다)"
    actor: person
    entries: [route:providers/connect-key]
    uses: [route:providers/connect, route:providers/list]
    boundary: [models, secrets]
    code: [packages/core/lophn-agent/providers/connect-key.ts, packages/core/lophn-agent/providers/login.ts, packages/core/main/daemon/wiring/lophn-agent.ts]
    steps:
      - "입력 모양을 본다. body를 선언한 길이대로 읽어 UTF-8 값으로 만든다. 길이가 다르거나 UTF-8이 아니면 invalid_input이다"
      - "연결 대상을 정한다: 내장 정의 key면 그 정의의 주소(model 목록 주소의 base)와 첫 protocol이다. 모르는 key는 not_found, 주소를 알 수 없거나 API key 방식이 없는 정의는 invalid_input이다. Custom은 https나 이 기계의 http 주소만 받는다(아니면 invalid_input)"
      - "부른 사람의 자격으로 providers/list를 읽어 그 정의가 이미 이어져 있으면 conflict다. 아니면 core 메모리의 표(정의 key → id)에서 끊었던 id를 다시 쓰거나 새 pvd id를 만든다"
      - "값을 임시 이름 provider.<id>.new.<무작위>에 넣는다. 못 넣으면 unavailable이다"
      - "그 이름으로 ConnectProvider를 부른 사람의 context로 접은 writer에 보낸다. 쓰기 앞 처리기가 commit 뒤 값을 provider.<id>로 옮긴다. 어느 갈래로 끝나도 임시 이름은 지운다"
    outcomes:
      - id: connected
        observe: ["disk:<root>/secrets.json", "ledger:providers", "ledger:provider_credentials", "event:StateChanged", "response"]
      - id: not_found
        code: not_found
        when: "모르는 내장 정의 key다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "그 정의가 이미 이어져 있다. ConnectProvider가 같은 id로 conflict인 것도 같다. 값은 남지 않는다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력이나 body가 맞지 않는다. 정의에 API key 방식이나 주소가 없다. Custom 주소가 규칙 밖이다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "값을 secrets.json에 넣지 못했다. 연결이 commit된 뒤 provider.<id>로 옮기지 못했다(provider는 key 없이 남는다)"
        observe: ["response"]
      - id: internal
        code: internal
        when: "writer가 던졌다. 임시 이름은 지운다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
    crosses_process: false
    risk: [secret]
    refs: []
    docs: [architecture/agent-definition.md]
    unclear: []

