  - id: mcp-server-connect
    title: "턴이 시작할 때 설정한 MCP 서버에 붙어 tool을 쓴다"
    actor: system
    entries: [system:mcp-server-connect]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-toolkit.ts, packages/core/lophn-agent/extensions/mcp-config.ts, packages/core/lophn-agent/extensions/mcp-snapshot.ts, packages/core/lophn-agent/extensions/mcp-connections.ts]
    steps:
      - "turn 준비가 전역 설정, workspace 층(Home, project, 앱), agent 정의 층을 차례로 덮어 이 agent가 쓸 서버를 정한다. 전역 설정을 못 읽으면 turn 준비가 실패한다(settings-unreadable). workspace와 agent 층은 못 읽으면 없는 것과 같다"
      - "끈 서버(층의 mcp_off, agent 정의가 끈 것)와 skip한 서버, 설정 검사에서 틀린 서버, 재조회 실패로 failed인 서버는 연결하지 않는다(excluded). 나머지는 서버마다 연결(initialize, 30초 기한)을 얻고 tools/list를 읽는다"
      - "연결이나 목록 읽기가 실패하면 unreachable이다. 연결이 인증 거절(forbidden)로 끝나면 sign-in-required다"
      - "요청마다 인증 토큰은 secret 부착(system:secret-attach)이 청한다. OAuth2 서버는 만료가 가까우면 core가 refresh한다. refresh가 거절되면 forbidden이라 요청 없이 막혀 sign-in-required가 된다. 닿지 못했는데 token이 아직 살아 있으면 그대로 쓴다. 닿지 못하고 만료면 unavailable이라 unreachable이다"
      - "tool 호출마다 지금 설정을 다시 읽는다. 사람이 끈 서버나 지워진 서버, 재조회가 진행·실패 중인 서버, 등록되지 않은 서버는 call-rejected다. 연결이 끊기면 다시 연결(답을 받지 못하고 이어진 횟수가 최대 3번)하고 전체 목록을 다시 읽는다. 재연결이나 재조회가 실패하면 call-rejected다. stdio server process가 죽으면 연결이 그것을 알아채 다음 호출이 다시 연결하고, 답을 받으면 그 횟수를 비운다"
      - "호출을 거절한 이유가 값 없음(비밀 부착이 not_found)이나 인증 거절(failed_auth)이면 오류 details에 빈 자리 {mcp, part}를 싣는다. part는 설정에서 역산한 역할(credential, sign_in, client, header:<이름>)이다. tool 실행기가 이 자리를 고정 문장 `lophn ask secret --mcp <서버> --part <역할>`로 agent의 실패 요약에 붙인다. tool 목록(Grants)의 sign_in은 사람 화면용이라 agent에게 가지 않는다"
      - "보낸 뒤 서버가 답하면 결과를 감싸지 않고 model에 그대로 준다. 서버가 isError로 답했으면 본문이 그대로 가고 호출은 failure(tool-error)다. 응답을 받지 못하면 uncertain이다. 글이 큰 결과는 runtime이 파일로 옮기고 앞부분만 준다"
    outcomes:
      - id: attached
        observe: ["request:mcp-server"]
        when: "연결과 tools/list가 되었다. 그 서버의 tool이 이 turn에 실린다"
      - id: excluded
        observe: []
        when: "끈 서버, 층이 skip한 서버, agent 정의가 끈 서버, 설정 검사에서 틀린 서버, 재조회 실패로 failed인 서버다. 연결하지 않는다. 설정 검사에서 틀린 서버는 원인을 알리지 않는다"
      - id: unreachable
        observe: ["request:mcp-server"]
        when: "연결 시도가 서버에 닿지 못했거나 initialize 응답이 이상했다(30초 기한 포함), tools/list가 실패했다, 또는 token을 갱신하지 못해 만료된 token을 쓸 수 없다(이 경우 요청은 나가지 않는다). 그 서버의 tool은 이 turn에 실리지 않는다"
      - id: sign-in-required
        observe: ["request:mcp-server"]
        when: "재로그인이 필요하다. 서버가 401로 답했다, 또는 OAuth token이 없어 비밀 부착이 forbidden이다(이 경우 요청은 나가지 않는다). 발급자가 갱신을 거절해 token을 지운 경우는 refresh-rejected다. 그 서버의 tool은 이 turn에 실리지 않는다"
      - id: refresh-rejected
        observe: ["disk:<root>/secrets.json", "request:issuer"]
        when: "만료가 가까운 접근 token을 갱신하다가 발급자가 400·401·invalid_grant로 거절했다(forbidden). 보관한 셋(access, meta, refresh)을 secrets.json에서 지우고 실패 사유 refresh_rejected를 남긴다. 이 요청은 나가지 않는다. 지운 뒤의 호출은 token이 없어 sign-in-required다. 다시 로그인하면 복구된다"
      - id: settings-unreadable
        code: unavailable
        observe: ["response"]
        when: "전역 설정을 읽지 못해 turn 준비가 실패했다. 읽기 오류를 그대로 돌려준다"
      - id: called
        observe: ["request:mcp-server"]
        when: "서버가 tool 결과를 성공으로 돌려줬다"
      - id: tool-error
        observe: ["request:mcp-server"]
        when: "서버 tool이 isError로 답했다. 본문이 감싸지 않은 채 model에게 가고 호출 결과는 failure다(오류 code는 없다)"
      - id: uncertain
        observe: ["request:mcp-server"]
        when: "요청을 보낸 뒤 응답을 받지 못했다(call_timeout_ms 초과, 연결 끊김, server process가 죽음, 서버 HTTP 오류 포함). 보내기 전에 막힌 것(비밀 부착 거절, 401)도 connections가 uncertain으로 감싸 여기로 온다. 호출 결과는 오류가 아니라 status uncertain이다. 효과가 났을 수 있다고 model에게 알린다"
      - id: call-rejected
        code: unavailable
        observe: ["response"]
        when: "서버에 닿기 전에 거절했다: 재조회 중이거나 재조회가 실패한 서버, 등록되지 않은 서버, 사람이 끈 서버나 지워진 서버(설정을 읽지 못한 것 포함), 회수된 설정(not_executed), 재연결 실패(한도 3번 초과, 인증 거절 포함), 재연결 뒤 재조회 실패. 이유가 값 없음이나 인증 거절이면 실패 요약에 빈 자리와 `lophn ask secret` 문장이 붙는다"
    crosses_process: true
    risk: [sandbox]
    refs: [H3]
    docs: [architecture/agent-definition.md]
    unclear:
      - "revokeServer를 부르는 곳이 저장소에 없다. 도는 turn을 서버 제거로 끊는 경로는 없고 다음 tool 호출부터 막힌다"
      - "turn 준비(연결 시도)는 인증 거절과 연결 실패를 구별하지 않는다. 구별은 connections의 failed_auth 상태(진단용 views)에만 남는다"
      - "refresh-rejected에서 token 셋을 지우다 하나가 실패해도 mcp-oauth의 discard가 그 결과를 버리고 refresh_rejected를 남긴다. 그러면 지우지 못한 이름이 secrets.json에 남을 수 있다. 같은 discard는 설정(발급자·URL·client)이 바뀐 때와 만료된 token을 갱신할 수 없을 때도 token을 지운다. 그 둘은 이 flow의 갈래로 적지 않았다"

