id: app-place-linked-folders
version: 0.10.2
title: "앱 place에 source 밖 폴더를 이어 agent가 읽고 쓰게 한다"
modules: [packages/protocol, packages/core/apps, packages/core/agent-workspaces, packages/core/main, packages/core/projects, packages/shell/renderer, packages/design]
checked: []
change: |
  전: app place session의 file 범위는 앱 source 폴더와 받은 domain 폴더뿐이었다. 다른 repo나 문서를 보게 하려면 shell로 우회하거나 project place에서 해야 했다.
  후:
  - 앱에 project 연결 폴더와 같은 모양의 폴더 목록({path, description})이 있다. 새 command app.edit_folders(사람만, compare base_revision)가 목록을 통째로 바꾸고 event AppFoldersEdited를 남긴다. 폴더끼리나 source와 겹치면 invalid_input이다.
  - placeScope가 app place의 read·write에 source 다음으로 더한 폴더를 넣는다. 쓰기는 rewind 기록에 남는다. rewind 쓰기 폴더(place-folders-glue), kind 감시 root, place 정보의 Folders: 줄도 같이 따른다.
  - App details 패널 Domains 아래에 Folders 절이 있다. Add folder는 OS 선택기로 더하고, 줄 끝 Remove는 앱에서 뺀다(디스크는 그대로).
  계약:
  - 생긴 것: route app.edit_folders, event AppFoldersEdited, App.folders, ledger step apps.registration.folders(표 app_folders). 쓰던 앱은 빈 목록으로 이어진다.
why: |
  앱 agent가 source 밖의 참고 repo나 문서를 읽고 고칠 길이 없었다. project에는 이미 같은 기능(연결 폴더)이 있었다.
decisions:
  - text: "project 연결 폴더와 같은 모양과 같은 권한(읽기·쓰기)으로 둔다. 버린 길: 읽기만. 사람이 project와 같게 골랐다."
    by: person
  - text: "폴더를 바꾸는 곳은 App details 패널이다."
    by: person
  - text: "release에는 source만 봉인한다. 더한 폴더는 agent의 작업 범위일 뿐 앱 code가 아니다."
    by: agent
  - text: "agent가 폴더를 더하는 tool은 두지 않는다. 범위를 넓히는 것은 사람의 결정이다."
    by: agent
