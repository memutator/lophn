        observe: ["process:detached-window", "disk:<data>/shell/workspaces/<workspace>.json"]
      - id: conflict
        code: conflict
        when: "같은 탭 key의 창이 이미 있어 그 창을 앞으로 가져왔다"
        observe: ["process:detached-window"]
      - id: invalid
        code: invalid_input
        when: "project가 창과 맞지 않거나 view가 그 창의 것이 아니거나 스키마가 틀리다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "보낸 detached 창의 항목이 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "새 창을 만들지 못했거나 popup view를 옮기지 못했다. 만든 창은 없던 일로 한다"
        observe: ["response"]
      - id: save-refused
        code: invalid_input
        when: "project 창이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
