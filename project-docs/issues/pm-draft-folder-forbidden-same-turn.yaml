id: pm-draft-folder-forbidden-same-turn
title: PM이 초안 폴더를 연 같은 turn에 쓰면 forbidden이다
kind: bug
status: fixed
topic: workspace-session
modules: [packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/main, packages/core/projects]
now: file tool이 닿는 폴더(`scope`)는 turn을 시작할 때 `run-loop/prepare.ts`가 `deps.placeData`(`agent-roles/place/place-data.ts`)로 한 번 채운다. 열린 초안 폴더는 `openDraftFolders`가 그때 읽는다. Project Manager가 `context.draft`(`agent-roles/tools/context/draft.ts`의 `openDraft`)로 폴더를 새로 열어도 `ctx.scope`에는 더하지 않아, 같은 turn의 `file.write`가 scope 밖으로 거절된다. 다음 turn부터 된다. 두 번째 문제는 rewind 쪽이다. `main/daemon/rewind-glue.ts`의 `placeFoldersOf`가 따로 폴더 목록을 만드는데 Project Manager의 project 폴더와 App Engineer의 source만 있고 초안 폴더가 없다. `StageRewindFile`/`RecordRewindWrite`가 `the folder is not open to this session`으로 거절하고, `recordBeforeWrite`는 그래도 쓰기를 하되 `recorded=false`를 낸다. 초안 폴더 쓰기는 다음 turn부터도 rewind로 되돌릴 수 없다.
impact: PM이 폴더를 열고 바로 계약을 쓰지 못해 turn 하나를 헛돈다(token). 초안 파일 쓰기는 "쓴 뒤 되돌리기"가 안 되어 rewind 약속(파일 쓰기는 되돌릴 수 있다)이 이 경로에서만 깨진다.
fix: |
  - A. `openDraft`가 성공하면 `ctx.scope`의 read·write에 `folder`를 더한다(타입은 readonly지만 실체는 `prepare.ts`의 가변 배열). 한 줄이고 비용 작다.
  - B. scope를 만드는 곳을 하나로 합친다. `placeFoldersOf`가 `agent-roles/place/place-data.ts`와 같은 규칙을 쓰게 해(초안 폴더와 project Operator 포함) 같은 모양의 복사본 둘을 없앤다. 비용 중간.
  - 추천: A를 지금, B를 같이 한다. 폴더 목록이 둘이라 한쪽만 고치면 이번처럼 어긋난다.
closed: '`PlaceScope`에 `open(folder)`를 두고 `openDraft`가 초안 폴더를 연 뒤 부른다(`run-loop/prepare.ts`가 그 turn의 read·write에 더한다). 폴더 목록 규칙은 `agent-roles/place/place-folders.ts`의 `placeScope` 하나이고, turn scope(`place-data.ts`)와 rewind의 쓰기 폴더(`main/daemon/place-folders-glue.ts`의 `placeFoldersOf`)가 같은 것을 쓴다. rewind는 이제 PM의 열린 초안 폴더와 project Operator의 폴더를 기록한다. `rewind-glue.ts`의 사본과 직접 SQL은 지웠다(조회는 projects·apps의 `lookups.ts`).'
guard: packages/core/agent-roles/place/place-folders_test.ts
