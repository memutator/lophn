id: open-issues-batch-fixes
version: 0.18.0
title: "열린 이슈 묶음 고침(설정 덮어쓰기, 실패 이유, provider 증거, harness 참가자 외)"
modules: [packages/core/agent-workspaces, packages/core/apps, packages/core/config, packages/core/lophn-agent, packages/core/main, packages/core/storage, packages/core/workflows, packages/design, packages/protocol, packages/sdk, packages/shell/main, packages/shell/renderer, tests, tools]
checked: []
change: |
  전·후:
  - `settings.json`: update가 앞서 읽은 값에서 시작해 손으로 고친 key를 덮을 수 있었다. 이제 쓰기 직전에 다시 읽고, 못 읽으면 `unavailable`로 쓰지 않는다.
  - turn loop가 던진 예외는 `configuration_unavailable`로 닫혔다. 이제 새 실패 이유 `internal`(`TURN_OUTCOME_REASONS.failed`)이고 화면 문구도 따로다.
  - 실패한 model 호출의 outcome에 secret이 아닌 `evidence`(`verdict_path`, content-type, allow-list header의 request id, 모르는 SSE event type 셋까지)가 남고, ACP `error` notice의 `evidence`로 화면 실패 줄에 판정 경로와 request id가 보인다. Responses의 최상위 `error` event는 code를 단 실패다. 본문은 여전히 남기지 않는다.
  - workflow 참가자 `{kind: harness}`와 not_handed 이유 `harness`가 없다.
  - MCP·앱 sign-in에서 발급자가 거절하면 `callback_timeout`이 아니라 `exchange_failed`다.
  - SDK 사본이 없어 release 준비가 실패하면 이유에 고정한 판, 깔린 판, 할 일이 실린다.
  - Settings › Coding agents에 공유 앱 목록과 Remove가 있다(General에서 그 key를 뺐다).
  - harness session은 ACP `steer` capability가 꺼져 있고 send-now가 `unavailable`이다. session read 출력에 `harness`가 있다.
  - home의 harness agent가 `<data root>/harness-home/<session>/`에서 돈다. opencode는 폴더가 git root가 아니면 띄우지 않는다. extension context에 `dataFolder(name)`가 있다.
  - Claude GUI는 CLI가 끝난 뒤 다음 send에서 같은 session을 다시 열고, `!`의 cwd가 이어진다. Codex GUI는 lane 전에 온 자식 이벤트를 쌓았다 붓고 다시 열 때 도는 자식을 다시 구독한다.
  - Settings › Keyboard 번호 줄의 Remove는 겹친 번호만 비운다.
  - session을 지우면 그 session의 `tool-results` 폴더도 지운다.
  - bare 정의 저장이 어느 꼴도 아닌 `tools` 이름을 `invalid_input`으로 거절한다.
  - `npm run dev`가 fake provider를 심을 때 이미 있던 같은 data root의 process를 죽이지 않는다.

  옮기기:
  - ledger step `workflows.no-harness-kind`(목록 끝): 저장된 instance의 `{kind: harness}` 참가자를 지우고 not_handed 이유 `harness` 줄을 `unresolved`로 바꾼다. `workflow.yaml`에 남은 `{kind: harness}`는 옮기지 않는다(`invalid_declaration`, 손으로 고친다).
  - `model_calls.outcome`은 JSON이라 `evidence`가 없는 옛 행도 그대로 읽힌다.
why: |
  코드와 대조한 열린 이슈 가운데 데이터 손실, 진단, 옛 꼴 잔재와 작은 bug를 한 번에 고쳤다(`project-docs/issues/archived/`).
decisions:
  - text: |
      provider 실패의 응답 본문은 이번에도 남기지 않는다. 남길지는 사람이 정한다(`project-docs/issues/agent-definition.md`).
    by: agent
  - text: |
      `tools` 이름 검사는 꼴만 본다. 할당과 설정은 나중에 바뀌므로 보지 않는다.
    by: agent
  - text: |
      opencode는 directory option이 없어 git root가 아닌 폴더에서는 띄우지 않는다.
    by: agent
