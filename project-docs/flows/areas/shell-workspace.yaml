  # ---- 앱 panel, 빠른 실행 ----
  - id: app-panel-open
    title: "앱 panel 화면 하나를 연다"
    actor: person
    entries: [ui:app-panel-open]
    when: "빠른 실행 App hover 목록의 줄, 고정한 빠른 실행 단추, app.panel:<app>:<surface> 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/kinds/app-panel.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/global-floats/store.ts
    steps:
      - "그 화면이 전역 float이면 새로 열지 않고 펴서 맨 위로 올린다"
      - "같은 앱과 화면의 탭이 이 창 어디든 있으면 그 자리에서 고른다(float이면 펴고, detached면 창을 앞으로 가져온다)"
      - "없으면 shell.app_launch의 open(tab 또는 float)대로 새로 연다. float은 마지막 rect를 float 층 안으로 당겨 쓰고, 없으면 60% 가운데다. float 층을 못 쟀으면 tab으로 연다"
      - "float이 20개 상한이면 openFloatTab이 조용히 아무것도 안 한다"
      - "앱이나 화면이 목록에서 없어졌으면(목록을 읽은 뒤 키로 부른 경우) 아무것도 하지 않는다"
    uses: [ipc:shell:workspace-layout-save, ipc:shell:global-floats-save]
    outcomes:
      - id: tab-opened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: float-opened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: shown-existing
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: expanded-global
        observe: ["disk:<data>/shell/global-floats.json"]
      - id: float-full
        when: "float으로 열 자리인데 desk float이 20개 상한이다. 아무 일도 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: unchanged
        when: "앱이나 화면이 목록에 없다, 또는 키의 인자가 틀렸다, 또는 이 창에 앱 화면 통로가 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

