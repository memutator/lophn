  - id: run-agent-end
    title: "agent run의 입력이 연 turn이 끝나면 run의 답이나 실패를 닫는다"
    actor: system
    entries: [system:run-turn-ended]
    uses: [route:runs/settle]
    pre: [run-agent-start:running]
    boundary: [runs, run-loop, events]
    code: [packages/core/runs/service.ts, packages/core/runs/text.ts, packages/core/main/daemon/wiring/turn-answer.ts]
    steps:
      - "TurnEnded가 오면 실행 중 run 가운데 입력 메시지를 그 turn에 넣은 run을 고른다. Bus 이벤트는 찾는 데만 쓰고 믿지 않는다"
      - "입력 메시지의 turn을 표에서 읽는다. turn이 끝나지 않았으면 그대로 둔다"
      - "completed면 그 turn에서 session agent가 남긴 마지막 메시지 글을 답으로 하고, 글이 없으면 no_answer. failed면 turn_failed이고 reason은 turn의 실패 이유다(빈 응답 뒤 끝난 turn은 no_answer). schema가 있으면 code fence 하나를 벗겨 JSON으로 읽어 검사하고 틀리면 invalid_output"
      - "SettleRun으로 running일 때만 닫는다. WaitRun도 같은 길로 표를 다시 본다"
    outcomes:
      - id: done
        observe: [ledger:runs]
      - id: invalid-output
        when: "schema가 있는데 답이 JSON이 아니거나 schema에 맞지 않음"
        observe: [ledger:runs]
      - id: no-answer
        when: "turn이 completed로 끝났는데 agent의 답 글이 없음(옛 turn의 빈 마지막 응답. 지금 loop는 빈 응답을 no_answer로 끝낸 failed turn으로 두므로 새 turn은 turn-failed로 온다)"
        observe: [ledger:runs]
      - id: turn-failed
        when: "turn outcome이 failed. error.reason은 turn_failed이고 message가 turn의 실패 이유다(no_answer, repeated_tool_failure 포함)"
        observe: [ledger:runs]
      - id: turn-interrupted
        when: "turn이 user_stopped나 session_ended로 끝남"
        observe: [ledger:runs]
      - id: lophn-restarted
        when: "turn이 restarted로 끊김"
        observe: [ledger:runs]
      - id: kept
        when: "turn이 아직 돌거나 입력이 아직 turn을 얻지 못함, 또는 turn이나 답을 읽지 못함(오류). 닫지 않는다"
        observe: [ledger:runs]
    crosses_process: false
    refs: [J3, R7, R8]
    docs: [architecture/run.md]
    unclear:
      - "TurnEnded는 agent runtime에서 core로 한 번 건너는 알림이고, 답 읽기와 닫기는 core 표만 본다. 그래서 crosses_process를 false로 두었다"

  - id: run-tool-end
    title: "앱 tool 호출이 돌아오면 tool run을 닫는다"
    actor: system
    entries: [system:tool-run-call-returned]
    uses: [route:runs/settle]
    pre: [run-tool-start:running]
    boundary: [runs, app-runtime, child-supervision-protocol]
    code: [packages/core/runs/service.ts, packages/core/main/daemon/wiring/runs.ts]
    steps:
      - "앱 호출의 결과(succeeded, failed, denied, unknown)나 호출 자체의 오류를 받는다. 호출이 throw하면 internal로 본다"
      - "succeeded면 done으로 result와 invocation을 적는다"
      - "failed면 tool_failed, denied나 호출 오류면 tool_denied, unknown이면 tool_unknown으로 failed를 적는다"
      - "run이 이미 cancelled면 SettleRun이 conflict라 기록을 고치지 않는다. 취소된 run의 호출은 멈추지 않았다"
    outcomes:
      - id: done
        observe: [ledger:runs]
      - id: tool-failed
        observe: [ledger:runs]
      - id: tool-denied
        when: "호출이 denied로 막힘, 호출 오류, 앱에 그 tool이 없음"
        observe: [ledger:runs]
      - id: tool-unknown
        observe: [ledger:runs]
      - id: after-cancel
        when: "run이 이미 cancelled. 결과는 닫힌 행에 쓰이지 않는다"
        observe: [ledger:runs]
    crosses_process: false
    refs: [J4]
    docs: [architecture/run.md, architecture/app-call.md]

