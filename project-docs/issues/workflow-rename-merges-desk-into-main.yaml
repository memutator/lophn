id: workflow-rename-merges-desk-into-main
title: workflow 폴더 이름을 바꾸면 그 desk가 Main으로 합쳐진다
kind: bug
status: kept
topic: workspace-layout
modules: [packages/shell/renderer]
now: |
  desk key가 workflow 이름이다. `packages/shell/renderer/workspace/workspace-window.tsx`의 `mergeVanished`가 workflow 목록을 읽을 때마다 목록에 없는 desk를 `mergeDesks`(`mergeDeskIntoMain`)로 Main에 합친다. 이름을 바꾼 workflow는 옛 이름이 목록에서 사라져 합쳐지고, 새 이름은 빈 새 desk가 된다. workflow 이름을 바꾸는 화면이나 명령은 없다. 폴더(`workflows/<name>/`)를 손으로 옮기거나 agent가 file로 옮길 때만 난다.
impact: |
  그 workflow desk에 늘어놓은 탭 배치(group, floated, detached)가 Main에 섞인다. 탭은 잃지 않는다.
fix: |
  (중간) desk key로 쓸 바뀌지 않는 workflow id가 있어야 한다. 지금 workflow는 폴더 이름(`name`)으로만 가리킨다(`packages/shell/renderer/workspace/source.ts`의 `WorkflowEntryView`. `key`도 `<project 이름>/<name>`이다). 추천: 이름 바꾸기가 실제로 잦아질 때 한다.
closed: |
  workflow 이름 바꾸기 기능이 없어 사람이 제품 안에서 이 길에 닿지 않는다. 폴더를 손으로 옮기면 탭은 남고 배치만 Main에 섞인다. 이름 바꾸기를 만들 때 바뀌지 않는 workflow id를 같이 둔다(`workspace-layout.md` "열린 것").
guard: 없음
