  # ---- model 호출 기록 ----
  - id: model-call-run
    title: model 호출 하나를 보내고 완전한 응답, 재시도, partial, 문맥 초과를 판정한다
    actor: system
    entries: [system:model-call-run]
    uses: [model-call-start:started, model-call-finish:finished]
    pre: [turn-pump-start:started]
    boundary: [run-loop, models, child-supervision-protocol]
    code: [packages/core/lophn-agent/run-loop/turn.ts, packages/core/lophn-agent/run-loop/retry.ts, packages/core/lophn-agent/run-loop/limits.ts, packages/core/lophn-agent/run-loop/core-ports.ts, packages/core/lophn-agent/run-loop/live-turns.ts]
    steps:
      - "요청 body를 지금의 redaction으로 안전화해 저장한 뒤 보낸다. 안전화를 못 끝내면 보내지 않고 turn을 configuration_unavailable로 끝낸다"
      - "호출은 한도 안에서만 시작한다. 시도 수나 무진행 시간이 상한에 닿으면 model을 부르지 않는다"
      - "진행 없는 시간 한도에 닿으면 timer가 호출을 중단한다. 중단 뒤 grace(5초) 안에 답이 없으면 불명확으로 보고 turn을 끝낸다"
      - "일시 실패(temporary)만 같은 입력으로 최대 2번 다시 보낸다. 대기는 서버가 준 시각을 지키고 없으면 2초, 4초다"
      - "대기 중 멈춤, 새 입력, provider 회수가 오면 retry를 취소한다. 새 입력이면 turn이 다시 조립한다"
      - "partial 응답은 tool을 시작하지 않고 잘림을 기록한다. 3회 연속이면 model_error로 끝낸다. context_exceeded는 turn 안 Compact(최대 2회)나 tool 결과 줄이기로 다시 조립한다"
      - "쓰는 중 글은 알려진 secret을 가려 ModelOutputStreamed로 보낸다. 두 batch에 걸쳐 나뉜 값도 조각이 밖으로 나가지 않는다"
    outcomes:
      - id: complete
        observe: [ledger:model_calls, event:MessageRecorded]
        when: 완전한 응답을 받았다. 글이나 tool 호출이 있다
      - id: transient-retry
        observe: [ledger:model_calls]
        when: 일시 실패 뒤 같은 입력으로 새 시도를 했다(attempt_kind retry, retry_of 연결)
      - id: partial-continue
        observe: [ledger:model_calls]
        when: 잘린 partial 응답을 남기고 잘림 사실을 이력에 붙여 다음 판단으로 간다
      - id: retry-cancelled
        observe: [ledger:model_calls]
        when: retry 대기 중 멈춤, 새 입력, 회수가 와서 재시도를 취소했다
      - id: context-relieved
        observe: [ledger:model_calls]
        when: provider가 입력이 크다고 거절해 이력을 줄여 다시 보낸다
      - id: cancelled
        observe: [ledger:model_calls]
        when: "진행 중인 호출이 멈춤, 회수, 한도로 중단됐다. grace 안에 답이 없으면 불명확으로 보고 turn을 끝낸다(호출 기록은 늦게 끝난다)"
      - id: failed
        observe: [ledger:model_calls]
        when: "일시 실패가 아니거나 재시도가 소진된 실패다(호출 기록은 failed). 401·403 같은 비일시 HTTP 실패와 Responses의 최상위 error event도 여기다. 기록에는 허용된 header 값과 판정 길만 남고 본문과 secret은 남지 않는다. 이어서 turn은 failed-model-error나 configuration_unavailable로 끝난다. invoke 자체가 실패하면 credential_unavailable로 기록된다"
      - id: not-called
        observe: [ledger:turns, event:TurnEnded]
        when: "호출 전에 한도(시도 수 상한, 무진행 시간)에 닿아 model을 부르지 않았다. turn은 그 한도 사유로 끝난다"
      - id: start-rejected
        observe: [ledger:turns, event:TurnEnded]
        when: "호출 기록 시작(StartModelCall)이 거절됐다(provider 연결 없음, 같은 시도 id, ledger 기록 실패 등) 또는 그 뒤 steer 반영 정리가 실패했다. model은 부르지 않고 입력(steer)은 queue에 남는다. turn은 configuration_unavailable로 끝난다"
      - id: output-unstored
        observe: [ledger:model_calls, ledger:turns, event:TurnEnded]
        when: "응답 글을 blob으로 저장하지 못했다. 호출 기록은 failed(unknown)로 끝나고 turn은 configuration_unavailable로 끝난다"
      - id: redaction-blocked
        observe: [ledger:turns, event:TurnEnded]
        when: 요청 안전화를 끝내지 못해 model 호출 기록 없이 turn을 configuration_unavailable로 끝낸다
      - id: live-secret-held
        observe: ["event:ModelOutputStreamed"]
        when: "쓰는 중 글에 알려진 secret이 있다. 두 batch에 걸쳐 나뉘어도 앞부분을 포함해 가려져 REDACTION 자리표만 live delta로 나가고, 그 값의 어느 조각도 나가지 않는다. 호출은 이어진다"
    crosses_process: true
    risk: [secret]
    refs: []
    docs: [architecture/agent-chat.md, architecture/observability.md]
    unclear:
      - "retry.ts 주석의 연속 partial 한도 설명에 시도 한도(30)가 있다. 실제 PARTIAL_RUN_MAX는 3이라 주석이 낡았다"
      - "쓰는 중 글은 core 메모리에만 있다(live-turns). ModelOutputStreamed를 ACP로 넘기는 쪽은 이 flow 밖이다"

  - id: model-call-start
    title: model 호출 기록을 started로 쓰고 그 요청이 가져간 steer를 반영한다
    actor: system
    entries: [route:model-calls/start]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/usage/commands.ts, packages/protocol/lophn-agent/model-calls.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 호출 기록이 schema와 다르면 internal이다"
      - "provider가 연결되어 있는지 본다. 연결이 없으면 시작하지 않는다. 같은 시도 id나 요약 call의 시도 순번이 있으면 conflict다"
      - "runtime이 보낸 입력과 기준 blob 참조를 등록하고 호출 기록(model_calls)을 started로 쓴다"
      - "같은 transaction에서 이 요청이 가져간 steer(applied_messages)를 반영한다. 등록이나 반영이 거절되면 기록도 남지 않는다"
    outcomes:
      - id: started
        observe: [ledger:model_calls, response]
        when: 호출 기록이 started로 남았다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: record-invalid
        code: internal
        observe: [response]
        when: 호출 기록이 modelCallRecordSchema와 다르다(assertCall)
      - id: provider-missing
        code: unavailable
        observe: [response]
        when: provider가 연결되어 있지 않다(Disconnect 뒤)
      - id: attempt-duplicate
        code: conflict
        observe: [response]
        when: 같은 시도 id가 있거나 요약 call의 시도 순번이 겹친다
      - id: blob-invalid
        code: invalid_input
        observe: [response]
        when: 입력이나 basis 준비 참조가 살아 있지 않거나(TTL이 지남) schema와 다르다. 기록도 남지 않는다
      - id: blob-forbidden
        code: forbidden
        observe: [response]
        when: 입력이나 basis 준비 참조의 주체가 이 자격과 다르다. 기록도 남지 않는다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear:
      - "applyMessages(takeSteering)의 not_found 갈래와 미연결 conflict는 turn 있는 call에서 닿지 않는다. register.ts가 항상 연결하고, steer는 turn이 있는 call에만 붙는다. outcome에서 뺐다"

  - id: model-call-finish
    title: model 호출 기록을 결과(outcome, usage, cost, 시간)로 끝낸다
    actor: system
    entries: [route:model-calls/finish]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/usage/commands.ts, packages/protocol/lophn-agent/model-call-values.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 응답이 끝나면 runtime이 결과 blob, outcome, usage, cost, 시간을 보낸다. price가 있으면 추정 비용을 같이 쓴다"
      - "호출 기록이 없으면 not_found다. state_seq 비교가 다르면 conflict다. started인 행만 끝내고 이미 끝난 행이면 conflict다"
      - "결과 blob을 영구 참조로 등록한다(거절되면 전체 rollback)"
      - "outcome(complete, partial, failed, cancelled, uncertain)과 failure code를 그대로 쓴다"
    outcomes:
      - id: finished
        observe: [ledger:model_calls, response]
        when: 호출 기록이 finished로 바뀌었다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: already-finished
        code: conflict
        observe: [response]
        when: 행이 이미 finished다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: not-found
        code: not_found
        observe: [response]
        when: 호출 기록이 없다
      - id: blob-invalid
        code: invalid_input
        observe: [response]
        when: 결과 준비 참조가 살아 있지 않거나(TTL이 지남) schema와 다르다. 행은 그대로 started다
      - id: blob-forbidden
        code: forbidden
        observe: [response]
        when: 결과 준비 참조의 주체가 이 자격과 다르다. 행은 그대로 started다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear: []

  - id: model-call-supplement
    title: 끝난 model 호출에 늦게 온 usage, cost, 사실을 덧붙인다
    actor: system
    entries: [route:model-calls/supplement]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/usage/commands.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 호출 기록이 없으면 not_found, state_seq가 다르면 conflict다"
      - "끝난 호출에 늦게 온 usage, cost, outcome, basis를 supplement 행으로 더한다. 호출이 아직 started면 conflict다"
      - "원래 본문, 결과, 최초 사실과 가격은 덮지 않는다. 같은 supplement_key 재전송은 conflict다"
    outcomes:
      - id: supplemented
        observe: [ledger:model_call_supplements, response]
        when: supplement 행이 더해졌다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: needs-finished
        code: conflict
        observe: [response]
        when: 호출이 아직 started다
      - id: duplicate-key
        code: conflict
        observe: [response]
        when: 같은 supplement_key가 이미 있다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: not-found
        code: not_found
        observe: [response]
        when: 호출 기록이 없다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/observability.md]
    unclear:
      - "호출하는 곳이 코드에 없다. runtime-access 목록에도 없고 core-ports도 쓰지 않는다. 죽은 route로 보인다. 지울지 정한다"

  - id: model-call-read
    title: model 호출 한 건이나 turn·session별 목록을 읽는다
    actor: person
    entries: [route:model-calls/read, route:model-calls/list]
    boundary: [core-api, acp]
    code: [packages/core/lophn-agent/usage/reads.ts]
    steps:
      - "화면과 trace가 model 호출 한 건을 id로 읽거나 turn, session으로 거른 목록을 읽는다"
      - "목록은 id 순서로 cursor를 잇는다. cursor를 풀 수 없으면 invalid_input이다"
    outcomes:
      - id: ok
        observe: [response]
        when: 호출 기록이나 목록을 돌려줬다
      - id: not-found
        code: not_found
        observe: [response]
        when: 호출 기록이 없다
      - id: bad-cursor
        code: invalid_input
        observe: [response]
        when: list cursor를 풀 수 없다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/observability.md]
    unclear:
      - "read 핸들러가 자격(ctx)을 보지 않는다. agent 자격이 다른 session의 model 호출을 읽을 수 있는지는 credential의 operation 목록에 달렸다. 확인이 필요하다"

  # ---- 문맥 줄이기(Compact) ----
  - id: compact-summarize
    title: 이전 대화의 앞 구간을 요약 call로 줄여 session에 잇는다
    actor: system
    entries: [system:compact-summary]
    uses: [route:sessions/request-compact, route:sessions/compact, route:sessions/fail-compact, route:sessions/compact-requests, route:rewind/summary-take, route:rewind/summary-done]
    boundary: [agent-sessions, models, child-supervision-protocol]
    code: [packages/core/lophn-agent/session/compactor.ts, packages/core/lophn-agent/session/compact.ts, packages/core/main/agent-runtime/product-driver.ts]
    steps:
      - "세 길로 열린다. 사람이 청한 요청을 pump가 집거나, 끝난 turn이 정한 다음 turn 전 Compact(compactNow), 도는 turn이 예산을 넘는 turn 안 Compact(compactInTurn)다"
      - "최근 사람 메시지 3개는 요약하지 않고 원문으로 남긴다. 덮을 구간의 끝은 확정 메시지다. 대화나 요청 목록을 읽지 못하면 요청을 닫지 않고 다음 주기에 다시 본다"
      - "요약 model을 고르고(summaryChoice, resolveModel) 요약 call을 시작한다. 재료가 입력 예산 절반을 넘으면 chunk로 나눠 앞 요약을 이어받는다"
      - "요약 call을 끝까지 받는다. 완전한 출력이 없거나 본문이 상한을 넘으면 FailCompact로 이유와 함께 요청만 닫는다. session과 원문은 그대로다"
      - "성공하면 CompactSession으로 구간과 요약 call을 session에 잇고 CompactEnded(ok)를 낸다. 요약하는 사이 turn이 시작됐거나 session이 바뀌었으면 session_changed로 닫는다"
      - "rewind의 Summarize from here도 같은 요약 call을 쓰지만 요청과 확정은 rewind route다"
    outcomes:
      - id: compacted
        observe: [ledger:sessions, ledger:session_compact_requests, ledger:model_calls, event:CompactEnded]
        when: 요약이 성공해 session에 이어졌다
      - id: failed-nothing-to-summarize
        observe: [ledger:session_compact_requests, event:CompactEnded]
        when: 덮을 확정 메시지가 없다
      - id: failed-model-unavailable
        observe: [ledger:session_compact_requests, event:CompactEnded]
        when: "요약 model을 고르지 못했다, 또는 요약 call을 시작하지 못했다(StartModelCall 거절, 재료 안전화나 저장 실패)"
      - id: failed-model-failed
        observe: [ledger:session_compact_requests, event:CompactEnded]
        when: "요약 model call이 완전한 출력 없이 끝났다, 또는 출력 저장이나 call 기록 끝내기가 실패했다"
      - id: failed-too-large
        observe: [ledger:session_compact_requests, event:CompactEnded]
        when: "재료가 요약 입력 예산에 들지 않는다(예산 계산 실패와 chunk로 나눌 수 없는 경우 포함)"
      - id: failed-summary-too-long
        observe: [ledger:session_compact_requests, event:CompactEnded]
        when: 요약 본문이 상한을 넘었다
      - id: failed-session-changed
        observe: [ledger:session_compact_requests, event:CompactEnded]
        when: 요약하는 사이 turn이 시작되었거나 session이 바뀌어 CompactSession이 거절됐다
      - id: idle-read-failed
        observe: []
        when: "대화나 요청 목록을 읽지 못했다(core에 닿지 않음). 요청은 열린 채 다음 주기에 다시 본다"
      - id: not-requested
        observe: []
        when: "자동 Compact에서 요약할 메시지가 없거나, session 상태 읽기나 RequestSessionCompact가 거절됐다. 요청은 열리지 않는다"
      - id: skipped
        observe: [response]
        when: turn 안 Compact에서 덮을 것이 없어(보이는 메시지가 없고 앞 요약과 이 turn의 진행이 함께 있지 않다) 요청을 열지 않았다. turn은 그대로 간다
      - id: in-turn-failed
        observe: [response]
        when: "turn 안 Compact가 실패했다(대화나 session 읽기 실패, 요청 열기 거절, 요약 실패). loop는 줄이기로 넘어간다"
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear:
      - "rewind의 Summarize from here는 approvals의 rewind route(summary-take, summary-done)를 쓴다. 두 flow의 경계를 확인이 필요하다. nextRange가 읽지 못하면 요청을 가져간 채 남긴다"

  # ---- 사람에게 묻기(ask) ----
  - id: ask-wait
    title: ask tool이 질문 묶음을 올리고 사람, 부모, 또는 turn 끝을 기다려 결과를 받는다
    actor: agent
    entries: [route:ask/wait]
    uses: [tool:ask]
    boundary: [approvals, agent-tool-spi]
    code: [packages/core/lophn-agent/tools/bundles/ask.ts, packages/core/lophn-agent/tools/questions/wait.ts, packages/core/main/daemon/wiring/approvals.ts]
    steps:
      - "agent의 ask tool이 질문 1~4개(선택지 2~4개)를 runtime을 거쳐 core에 올린다. 자격의 session과 turn이 입력과 같아야 한다(아니면 forbidden)"
      - "session과 turn 기록을 읽는다(읽기 오류는 그대로 간다). turn이 unattended면 묻지 않고 바로 unattended를 돌려준다. 팀 자식의 질문은 이 규칙에서 빠진다"
      - "그 밖이면 메모리 대기 목록에 올리고 QuestionAsked를 낸다. 팀 자식의 질문은 사람 대신 부모에게 간다"
      - "한 session에서 사람에게 가는 질문은 하나만 열린다. 병렬 ask 호출의 나머지는 줄을 서고(QuestionAsked 없음, 읽거나 답할 수 없다) 앞 질문이 풀리면 차례로 열린다"
      - "답(ask/answer), 그 session의 사람 메시지(MessageReceived from human), turn 끝(TurnEnded), session 닫힘(SessionEnded) 가운데 먼저 오는 것으로 기다리던 tool에 결과를 준다"
      - "기다리는 동안 turn의 active 시간은 세지 않는다"
    outcomes:
      - id: submitted
        observe: [event:QuestionAsked, event:QuestionResolved, response, event:TurnResumed]
        when: 사람이 질문 순서대로 답을 냈다
      - id: human-message
        observe: [event:QuestionResolved, event:TurnResumed]
        when: 기다리는 중 사람이 그 session에 메시지를 보냈다. 답인지는 LLM이 읽는다
      - id: parent-reply
        observe: [event:QuestionResolved, event:TurnResumed]
        when: 팀 자식의 질문에 부모가 call reply로 답했다
      - id: cancelled
        observe: [event:QuestionResolved]
        when: turn이 끝났거나 session이 닫혔거나 core가 내려갔다
      - id: unattended
        observe: [response]
        when: 사람 없는 turn이라 묻지 않았다. QuestionAsked는 나지 않는다
      - id: not-owner
        code: forbidden
        observe: [response]
        when: 자격의 session이나 turn이 입력과 다르다
      - id: read-failed
        observe: [response]
        when: session이나 turn 기록을 읽지 못했다. 그 읽기 오류가 그대로 간다
      - id: unavailable
        code: unavailable
        when: "reader를 쓸 수 없어 session이나 turn 기록을 읽지 못했다"
        observe: [response]
    crosses_process: false
    risk: []
    refs: [R4]
    docs: [architecture/approval.md, architecture/acp.md]
    unclear:
      - "skip 세션의 ask: askWaitHandler는 unattended만 바로 돌려주므로 skip이면 사람에게 묻는다. approval.md 47행은 unattended와 skip에서 run이 된다고 적었다. 어느 쪽이 맞는지 확인이 필요하다"
      - "대기 목록은 메모리다. lophn을 껐다 켜면 비고 열린 call은 restarted로 닫힌다"

  - id: ask-answer
    title: 사람이 질문 카드에서 질문 순서대로 답한다
    actor: person
    entries: [route:ask/answer]
    pre: [route:ask/wait]
    boundary: [approvals, acp]
    code: [packages/core/lophn-agent/tools/questions/wait.ts, packages/core/main/daemon/wiring/approvals.ts]
    steps:
      - "사람 자격이 아니면 forbidden이다. 사람 자격의 요청이 session과 tool call로 대기 목록의 질문을 찾는다"
      - "답 개수와 질문 문장이 질문 순서와 맞는지 본다"
      - "맞으면 submitted 결과를 기다리던 tool(child)에 주고 QuestionResolved를 낸다"
    outcomes:
