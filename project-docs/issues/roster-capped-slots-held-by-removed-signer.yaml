id: roster-capped-slots-held-by-removed-signer
title: 빠진 컴퓨터가 서명한 쓰레기 빼기가 상한(512)을 계속 채워 아직 믿지 않는 서명자의 statement가 닿자마자 밀려난다
kind: bug
status: kept
topic: remote
modules: [packages/protocol, packages/core/remote]
now: |
  keep(`packages/protocol/remote/roster.ts`의 `rosterView`)은 지금 믿지 않는 서명자의 것과 서명자를 아직 모르는 것을 상한 안(capped)에 두고 canonical 글 순서로 앞선 `ROSTER_UNKNOWN_MAX`(512)개만 남긴다. T0의 어느 항목에도 없는 key의 빼기도 믿는 컴퓨터의 것이 아니면 버리지 않고 상한 안이다(버리면 닿은 순서가 엇갈림의 결과를 바꾼다. `architecture/remote.md` "keep"). 그래서 믿는 동안이나 빠진 뒤에 아무 key의 빼기를 많이 서명해 둔 컴퓨터(도둑)의 빼기가, 그 컴퓨터가 빠진 뒤에도 그 명단을 든 모든 기계에서 상한을 계속 채운다(canonical 글이 앞서도록 꾸밀 수 있다). 그 뒤 아직 믿지 않는 서명자의 정직한 statement는 닿자마자 밀려나고, 그 서명자를 믿게 되거나 믿는 컴퓨터의 서명이 붙은 것이 다시 올 때만 남는다. 믿는 컴퓨터가 쓴 것과 엇갈림을 정하는 빼기는 상한 밖이라 밀려나지 않는다(review에서 구경꾼 Z가 정직한 statement 21개 가운데 9개만 남겼고 풀리면 돌아왔다).
impact: |
  도둑맞은 컴퓨터를 뺀 뒤 그 명단을 든 컴퓨터에서, 아직 믿지 않는 컴퓨터를 거쳐 온 새 기기나 이름 바꾸기가 믿는 컴퓨터가 다시 보낼 때까지 My devices에 서지 않는다. 기기를 잃지는 않지만 늦게 보이고, 엇갈림을 다 풀기 전에는 엇갈린 컴퓨터의 자기 항목과 그 컴퓨터만 서명한 기기가 빠진 채로 보인다.
fix: |
  - (작음, 추천) 그대로 둔다. 늦음이고, 출처가 다시 보내 저절로 맞는다. 사람이 다시 볼 일이 생기면 아래로 간다.
  - (중간) 빠진 서명자(T0가 믿었다가 정해진 빼기로 빠진 컴퓨터)의 statement 가운데 대상 key가 어느 항목에도 없는 빼기는 정해진 빼기가 선 뒤 버린다. 정해지지 않은 동안은 지금처럼 상한 안에 둬야 닿은 순서가 결과를 바꾸지 않는다. 잃는 것: 규칙이 하나 늘고 keep이 정해짐에 기대게 된다.
closed: |
  명단 상한(512)에 도달하는 것은 악의적 서명자 시나리오뿐이고 출처 컴퓨터가 다시 보내면 저절로 회복되므로 복잡한 keep 예외 규칙을 미리 넣지 않고 그대로 둔다.
guard: 없음
