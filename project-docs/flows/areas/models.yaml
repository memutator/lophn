      - "provider가 아직 없으므로 ledger와 secret은 건드리지 않는다"
    outcomes:
      - id: cancelled
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "그 provider의 로그인 세션이 없다"
        observe: ["response"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear: []

  # ---- secret 파일 (secrets.json) ----

  - id: secret-status
    title: "secret 이름이 설정되었는지 읽는다"
    actor: person
    entries: [route:secrets/status]
    boundary: [secrets]
    code: [packages/core/secrets/routes.ts, packages/core/secrets/file-store.ts]
    steps:
      - "사람은 설정된 이름을 모두 configured 여부와 함께 받는다. 이름을 적으면 있든 없든 같게 답한다"
      - "값은 읽지 않는다. 파일을 열지 못했으면 이름 목록을 답할 수 없다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: empty
        when: "사람이 아닌 actor(agent, app, machine)가 이름 없이 불렀다. 빈 목록을 돌려준다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 actor가 이름을 적었다. 어느 이름이 있는지 알리지 않는다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "이름 모양이 맞지 않는다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "secrets.json을 열지 못했거나 깨져 있다"
        observe: ["response"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear: []

  - id: secret-put
    title: "secret 값을 secrets.json에 저장한다"
    actor: person
    entries: [route:secrets/put]
    uses: [ipc:shell:secret-input-open, ipc:secret-input:submit]
    boundary: [secrets]
    code: [packages/core/secrets/routes.ts, packages/core/secrets/file-store.ts, packages/core/secrets/secret-store.ts, packages/shell/main/secret-input/submit.ts]
    steps:
      - "보호 입력 창이 값을 shell main에 보내고 main이 이름과 byte 수를 header로 붙여 upload로 올린다. 값은 renderer의 일반 통로를 지나지 않는다"
      - "byte 수와 body 길이가 맞고 UTF-8이며 1 byte 이상 64KiB 이하인지 본다"
      - "쓰기 전에 새 값을 알려진 값(redaction)에 먼저 등록한다"
      - "파일 전체를 임시 파일(0600)에 쓰고 fsync한 뒤 rename한다. 같은 이름의 옛 값은 확인 없이 바뀐다"
      - "쓰지 못하면 이전 파일이 그대로이고 쓰이지 않은 값은 알려진 값에서 회수된다"
    outcomes:
      - id: stored
        observe: ["disk:<root>/secrets.json", "response"]
      - id: invalid_input
        code: invalid_input
        when: "이름이 맞지 않거나 byte 수가 body와 다르거나 UTF-8이 아니거나 빈 값이거나 64KiB를 넘는다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "secrets.json을 열지 못했거나 임시 파일 쓰기나 rename이 실패했다"
        observe: ["log:secrets", "response"]
    crosses_process: true
    risk: [secret, data-loss]
    refs: [H10]
    docs: []
    unclear: []

  - id: secret-delete
    title: "secret 값을 지운다"
    actor: person
    entries: [route:secrets/delete]
    boundary: [secrets]
    code: [packages/core/secrets/routes.ts, packages/core/secrets/file-store.ts, packages/core/secrets/secret-store.ts]
    steps:
      - "secret 파일을 열 수 있는지 본다"
      - "이름이 있으면 그 줄을 뺀 전체를 임시 파일에 써서 rename하고 알려진 값에서 회수한다. 없으면 파일을 건드리지 않고 configured false를 돌려준다"
      - "이 이름을 provider나 MCP 서버가 쓰는지는 보지 않는다. 쓰는 연결이 있어도 지워진다"
    outcomes:
      - id: deleted
        observe: ["disk:<root>/secrets.json", "response"]
      - id: absent
        when: "이름이 파일에 없다. 파일은 그대로이고 configured false로 답한다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "secrets.json을 열지 못했거나 쓰지 못했다"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    refs: []
    docs: []
    unclear:
      - "provider나 MCP 연결이 쓰는 secret을 지워도 막지 않는다. 다음 호출이 unavailable로 실패한다"

  - id: secret-store-open
    title: "기동할 때 secrets.json을 열고 알려진 값을 맞춘다"
    actor: system
    entries: [system:secret-store-open]
    boundary: [secrets]
    code: [packages/core/secrets/file-store.ts, packages/core/secrets/secret-store.ts, packages/core/main/daemon/wiring/secrets.ts]
    steps:
      - "파일 mode가 0600보다 넓으면 0600으로 고치고 log를 남긴다. Windows는 mode를 보지 않는다"
      - "파일을 파싱해 이름과 값을 메모리 사본에 올린다. 파일이 없으면 빈 저장소다"
      - "파일의 모든 값을 reader pool의 알려진 값 통로에 올린다. 그 전까지 redaction은 막혀 있다(fail-closed)"
      - "못 읽으면 secret 기능만 unavailable로 두고 2초부터 30초까지 backoff로 다시 맞춘다. reader가 다시 뜨면 현재 값을 다시 올린다"
    outcomes:
      - id: opened
        observe: ["disk:<root>/secrets.json"]
      - id: mode-fixed
        observe: ["disk:<root>/secrets.json", "log:secrets"]
      - id: unreadable
        when: "파일을 읽지 못했거나 모양이 맞지 않거나 mode를 고치지 못했다. 기동은 계속되고 secret 기능은 막힌다"
        observe: ["log:secrets"]
    crosses_process: true
    risk: [secret]
    refs: []
    docs: []
    unclear: []

  - id: secret-attach
    title: "목적지가 맞을 때만 secret 값을 요청에 붙인다"
    actor: system
    entries: [system:secret-attach]
    uses: [route:provider-credentials/refresh-result]
    pre: [route:secrets/put]
    boundary: [secrets, lophn-agent]
    code: [packages/core/secrets/file-attach.ts, packages/core/lophn-agent/secret-destinations.ts, packages/core/lophn-agent/run-loop/runtime-secret.ts, packages/core/main/agent-runtime/secret-link.ts]
    steps:
      - "agent runtime이나 앱 child가 supervision pipe로 이름, 목적지, operation을 청한다. 같은 generation의 child만 받는다"
      - "core가 machine 자격과 process가 살아 있는지 본다"
      - "이름 앞머리로 용도를 정한다. provider., mcp., mcp-oauth.는 외부 credential이고 앞머리가 없으면 앱 secret이다. provider-oauth.와 app-oauth.는 누구에게도 보내지 않는다"
      - "provider와 MCP는 그 이름을 쓰는 연결의 origin(https 또는 loopback http)과 목적지가 같을 때만 허용한다. 앱 secret은 앱 grant 판정(apps)에 맡긴다"
      - "보내기 전에 token을 갱신한다. provider는 refresh-result 흐름을, MCP OAuth는 mcp-auth-control의 갱신을 쓴다"
      - "통과하면 값을 transmit callback의 인자로만 주고 응답에는 전송 여부만 남긴다. 10초 안에 답이 없으면 값 없이 실패한다"
    outcomes:
      - id: sent
        observe: ["request:destination"]
      - id: forbidden
        code: forbidden
        when: "machine이 아니거나 process가 죽었거나 용도와 호출 종류가 맞지 않거나(앱 secret을 앱 아닌 호출이 청함) 목적지가 허용 목록 밖이거나 redirect로 host가 바뀌었다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "secrets.json에 그 이름이 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "값을 읽지 못했다, 10초 답 시한이 지났다, token 갱신이 실패했다"
        observe: ["response"]
    crosses_process: true
    risk: [secret, sandbox, permission]
    refs: []
    docs: [architecture/app-call.md]
    unclear:
      - "mcp. 이름의 oauth2 client_credential은 이 목적지 대조를 거치지 않는다. core가 직접 읽어 설정한 issuer의 token endpoint로 보낸다(mcp-auth-control.ts oauthServerOf)"
      - "앱 secret 목적지 판정은 apps의 allowance에 있어 이 flow의 outcome이 apps 쪽 grant 판정과 맞는지는 apps 영역에서 확인해야 한다"

  # ---- system 흐름 (provider 회수) ----

  - id: provider-disconnect-revoke
    title: "끊은 provider로 도는 turn을 멈춘다"
    actor: system
    entries: [system:provider-disconnect-revoke]
    boundary: [models, lophn-agent]
    code: [packages/core/lophn-agent/providers/watch.ts, packages/core/main/agent-runtime/product-driver.ts, packages/core/lophn-agent/run-loop/driver.ts]
    steps:
      - "agent runtime의 turn pump가 매 주기 core에서 provider 목록을 읽는다. 처음 본 목록은 기준일 뿐 회수하지 않는다"
      - "앞에 있던 provider가 목록에서 사라졌으면 그 provider로 도는 turn마다 쓸 수 있는지 본다"
      - "쓸 수 없으면 model 호출을 중단하고 provider 회수로 표시한다. 목록을 읽지 못하면 아는 목록을 바꾸지 않아 다음 주기에 같은 차이를 다시 본다"
    outcomes:
      - id: revoked
        observe: ["event:TurnEnded"]
    crosses_process: true
    risk: []
    refs: []
    docs: []
    unclear:
      - "회수된 turn이 TurnEnded로 어떤 사유로 끝나는지 저장소에서 확인하지 못했다. revoke는 loop의 providerRevoked 플래그와 model 호출 중단만 한다"
