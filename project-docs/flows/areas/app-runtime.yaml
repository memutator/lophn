  # ---------- 되돌리기 ----------

  - id: app-rewind-plan
    title: "앱 data를 고른 호출 시점으로 되돌릴 목록을 계산한다"
    actor: person
    entries: [route:apps/rewind_plan]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/plan.ts, packages/core/apps/rewind/reads.ts]
    steps:
      - "고른 invocation이 활성 release의 live 기록이고, write나 external이며, denied가 아니고, 아직 되돌리지 않은 것인지 본다."
      - "그 invocation부터 최신까지 같은 release의 live 기록 가운데 write와 external(data_change 제외)을 모은다. 목록이 잘려 시작이 빠지면 계획을 내지 않는다."
      - "범위 안에 결과를 모른 채 changeset 없이 닫힌 write가 있으면 blocked(unrecoverable_write)를 함께 낸다."
      - "읽기만 한다. 실제 되돌리기는 app-rewind-apply가 한다."
    outcomes:
      - id: planned
        observe: [response]
      - id: planned-blocked
        when: "범위 안에 결과를 모르는 write가 있음"
        observe: [response]
      - id: not-pickable
        code: invalid_input
        when: "preview, 이전 release의 호출, data_change, read, denied, 이미 되돌린 호출, 활성 release 없음"
        observe: [response]
      - id: list-incomplete
        code: unavailable
        when: "호출 목록이 잘려 시작 호출이 빠짐"
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
    crosses_process: false
    docs: [architecture/app-call.md]

  - id: app-rewind-apply
    title: "사람이 고른 호출 시점부터 앱 data를 되돌린다"
    actor: person
    entries: [route:apps/rewind]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/run.ts, packages/core/apps/rewind/commands.ts, packages/core/apps/rewind/store.ts, packages/core/apps/rewind/plan.ts]
    steps:
      - "사람만 부른다. 계획을 다시 만들고, 범위 안에 결과를 모르는 write가 있거나 이미 applying인 rewind가 있으면 conflict로 거절한다."
      - "app_rewinds에 applying 행을 쓰고 그 앱의 접수를 닫는다. 새 호출은 붙잡아 둔다."
      - "60초 안에 도는 호출이 끝나길 기다린다. 넘으면 cancelled(running calls did not finish)다."
      - "계획을 다시 계산하고 changeset을 가져와 최신부터 뒤집는다(base). 뒤집기가 실패하면 cancelled다."
      - "뒤집은 changeset 전부를 한 요청으로 app process가 한 transaction에 적용한다. 충돌이나 process 문제면 통째로 취소한다."
      - "적용되면 invocation에 reverted_by를 붙이고 rewind를 applied로 끝낸다. 어느 길로 끝나도 접수를 다시 연다."
    outcomes:
      - id: applied
        observe: ["ledger:app_rewinds", "ledger:invocations", "disk:apps/<app>/data"]
      - id: cancelled-running
        when: "도는 호출이 유예 안에 끝나지 않음"
        observe: ["ledger:app_rewinds"]
      - id: cancelled-conflict
        when: "drain 사이에 계획이 바뀜, changeset을 읽거나 뒤집지 못함, app 쪽이 conflict를 돌려줌"
        observe: ["ledger:app_rewinds"]
      - id: cancelled-app-unavailable
        when: "app process에 적용 요청을 보내지 못함"
        observe: ["ledger:app_rewinds"]
      - id: forbidden
        code: forbidden
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "계획에서 고를 수 없는 호출"
        observe: [response]
      - id: conflict
        code: conflict
        when: "결과를 모르는 write가 범위에 있음, 이미 applying인 rewind가 있음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "호출 목록이 잘림"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]

