# lophn — Module Catalog
#
# 코드 module(폴더)과 추상화(boundary)를 잇는 한 파일이다. 어느 폴더가 어느 boundary인지만 정한다.
# boundary는 project-docs/boundary-catalog.yaml의 ID(elements를 재귀로 돈 것과 interfaces 중 하나)다.
# 세분도: packages/ 바로 아래 package, packages/core/ 바로 아래 module, shell은 바로 아래 폴더, tools/.
# import 허용 규칙은 여기 없다. tools/check-deps.ts가 원본이다.
#
# 칸: path(필수), boundary(필수), notes(코드만 보면 모를 것 한두 줄, 없으면 칸을 두지 않는다),
#     doc(그 module에 AGENTS.md가 있을 때만).
# tools/check-modules.ts가 본다: path가 있는지, boundary ID가 있는지, 세분도의 폴더가 빠짐없이 올라 있는지,
# AGENTS.md가 있는 module에 doc이 있는지. boundary-catalog.yaml 자체의 ID·참조·kind별 칸도 같이 본다.

modules:

  - path: packages/base
    boundary: base

  - path: packages/protocol
    boundary: protocol
    notes: 구현을 두지 않는다. machine/requester.ts는 컴퓨터끼리 부르는 call의 요청한 쪽(`screen`·`terminal`·`agent`·`app`)과 컴퓨터 이름 풀기이고, remote/grants.ts는 받는 컴퓨터가 터미널 입력 허락을 읽고 쓰는 machine route, apps/calls/remote.ts는 다른 컴퓨터의 앱 command 입구와 caller `remote`의 계약이다. remote/carry.ts는 기계 사이로 옮기는 file(서명한 manifest와 목록 사슬, 명단 file, event file, route `carry/*`)의 계약이고 폰도 읽어 Node 내장이 없다(폴더 계약과 remote 계약이 서로를 import하지 않게 remote에 둔다). phone/은 core와 폰이 주고받는 `request`·`response` frame, kind 표(`PHONE_KINDS`), `unavailable`의 이유를 고정한다. 의존 없는 순수 함수를 shell과 core가 같이 써야 할 때만 예외다(shell은 core를 import할 수 없고 protocol은 된다). acp/의 reduceAcp와 events/acp-project.ts의 acpUpdatesOf가 그 예다.

  - path: packages/protocol/apps/sync
    boundary: app-sync
    notes: sync core다. 컴퓨터의 app runtime과 폰 host가 같은 module을 쓴다. 폰 앱이 Metro로 이 폴더를 바로 읽고 앱 process의 entrypoint도 상대 path로 읽어서 zod와 `node:` module을 import하지 않는다(Node driver와 test만 예외). 숨은 표 `lophn_sync_*`의 칸 이름은 폰 native module(`packages/mobile/modules/lophn-app-db`)이 C++에서 쓰므로 바꾸면 그쪽도 바꾼다.

  - path: packages/remote-client
    boundary: remote-client
    notes: 폰과 core(다른 컴퓨터로 가는 link)가 같이 쓰는 remote client다(연결, 초대장으로 들어가기, 명단으로 채우는 컴퓨터 목록). 폰은 Metro가 source를 읽어서 protocol과 base만 상대 path로 import하고 `node:`·React Native·zod를 import하지 않는다(test만 `node:test`). key와 컴퓨터 목록·명단의 저장은 하지 않고 쓰는 쪽이 넣는다(`load`/`save`). 컴퓨터의 `request`에 답하기와 폰의 화면 칸도 쓰는 쪽의 것이다.

  - path: packages/relay
    boundary: relay
    notes: 저장소에서 짓지만 사람의 기계가 아니라 인터넷의 서버에서 돈다. protocol과 base만 import한다.

  - path: packages/cli
    boundary: coding-agent-cli
    notes: remote-core.ts는 `--on <컴퓨터>`가 붙은 명령의 core 호출을 이 컴퓨터 core의 `machines/call`로 바꾼다(capability가 없어 `terminal`이다). `--on`은 parser가 어느 해석보다 먼저 뗀다.

  - path: packages/coding-agent
    boundary: coding-agent

  - path: packages/design
    boundary: design
    notes: lophn 화면 문구는 직접 쓰지 않고 i18n message key로 쓴다(i18n/).

  - path: packages/design/native
    boundary: design-native
    notes: 폰 앱의 React Native kit(`@lophn/ui-native`). SDK part이기도 해서 앱의 폰 화면이 설치 사본(`sdk/ui-native/<판>`)으로 import한다(packages/design의 `@lophn/ui` 사본에는 섞지 않는다). token과 i18n catalog는 packages/design의 것을 읽는다. Metro alias와 packages/mobile의 tsconfig `paths`로 풀리고, `npm run check`의 kit 단계는 이 폴더를 보지 않는다(폰 앱의 typecheck가 본다).

  - path: packages/sdk
    boundary: sdk
    notes: 앱 backend가 폰의 위치를 읽는 part `cap-phone`이 있고 `cap-notify`가 위젯 값(`setWidget`)도 낸다. 폰 화면의 hook part `app-ui-native`가 있다. desktop `app-ui`의 DOM 없는 file을 다시 내고(설치 사본은 vendor/로 담는다) `@lophn/ui-native`를 optional peer로 쓴다. root workspace에서 `@lophn/ui-native`는 member가 아니라 check의 deps가 그 import를 예외로 둔다.

  - path: packages/core/approvals
    boundary: approvals
    notes: 정의 파일도 앱 표도 모르고 import하지 않는다. 할당 읽기·쓰기와 앱 공유 요청이 이름을 푸는 길은 ports.ts의 port이고 core/main의 wiring/assignment-file.ts와 wiring/share-requests.ts가 끼운다. 옛 할당 표의 data step도 거기 있다.

  - path: packages/core/apps
    boundary: apps
    notes: calls/forward.ts는 다른 컴퓨터의 앱 command를 부르는 길(보내기 전의 private, 받은 호출의 hop, 할당, grant 검사)이고 calls/remote-entry.ts는 받는 쪽의 입구 `apps/remote_call`(`remote` caller를 만든다)이다. widgets/는 앱의 위젯 값(memory)과 `app_widgets.list`, phone-request/는 앱이 폰에 묻는 `app_phone.request`다. 어느 폰에 묻는지(기준 폰)와 폰으로 보내는 일은 port이고 core/main의 wiring이 core/remote의 `PhoneLink`를 끼운다. `phone.use` grant는 permissions/(broker `phone`)에 있다.

  - path: packages/core/apps/sync
    boundary: app-sync
    notes: sync 앱의 ledger sync log(`app_sync_log`. 폰·컴퓨터·다른 기계(origin `machine`)의 변경, rewind, 다시 snapshot, held 줄), 폰이 부르는 `app_sync/*` route, 임시 snapshot. 앱 DB는 열지 않고(앱 process가 연다) 변경은 앱 process의 `apps.sync_apply`·`apps.snapshot`으로 적용한다. 폴더 쪽(`core/folder`)은 이 log를 port로 읽고 쓴다.

  - path: packages/core/apps/follow
    boundary: app-releases
    notes: 다른 기계가 폴더로 낸 앱의 새 release를 고르고(git 조상) take-in과 activation에 넘긴다. 계기와 폴더 쪽(앱 기록 사본, take-in)은 folder wiring이 넘긴다. 설치 실패와 거절의 기억은 메모리뿐이다.

  - path: packages/core/apps/update-state
    boundary: app-releases
    notes: route `apps/update_state`의 읽기. 따라가기 상태, 폴더 읽기의 held와 꼴 판 범위, 기록 사본, release 행을 모은다. route 등록은 folder wiring이 한다(둘을 거기서 만든다).

  - path: packages/core/apps/releases/phone-backend
    boundary: app-releases
    notes: 폰에서 도는 앱의 backend를 묶고(`phone/backend.js`와 manifest) 빈 context에 실어 보는 검사다. 앱 code는 release 준비가 띄우는 짧은 child process 안에서만 돈다.

  - path: packages/core/config
    boundary: config

  - path: packages/core/diagnostics
    boundary: diagnostics

  - path: packages/core/events
    boundary: events

  - path: packages/core/install-and-update
    boundary: core
    notes: 맞는 하위 boundary가 없어 core로 둔다(data root 해석, 실행 metadata, instance lock).

  - path: packages/core/agent-workspaces
    boundary: agent-workspaces
    notes: lophn workspace 층. workspace 종류별 tool 목록, agent 정의 tool, credential의 workspace 몫, 제품 고정 규칙과 workspace 종류 prompt, workspace 정보, file tool hook, lophn 내장 정의, 이름 규칙(session 목록 이름과 주소 풀기), workspace 폴더 규칙, data root 아래 자리와 project 설정 층, 지침 읽기 규칙, 내장 skill(사용 안내 `guide-*`와 사람이 `/`로 부르는 skill, 컴퓨터를 잇는 지침 `connect-computers`). harness(lophn-agent) 위에 있고 feature module과 서로 import하지 않는다. 조립(core/main)이 harness에 꽂는다.

  - path: packages/core/lophn-agent
    boundary: lophn-agent
    notes: runtime이 harness인 agent의 session은 run-loop가 돌리지 않는다. session/harness.ts(입력 transport, 외부 session id)와 wiring/harness.ts(queue, host route)가 core 쪽이고 실행은 core의 extension harness host(`packages/core/extensions/bundled/harness/host.ts`)가 한다(boundary harness-host-core).

  - path: packages/core/main
    boundary: core
    notes: process entry(daemon, agent-runtime, worker, app-supervisor)와 조립만 한다. 업무 규칙을 두지 않고 module이 main을 import하지 않는다. daemon은 module마다 wiring/<module>.ts가 끼우고 assembly.ts의 목록이 순서를 정한다. wiring file은 필요하면 서로 import하고, 둘 이상이 쓰는 값은 wiring/context.ts로 나눈다. flow-host/는 flow process를 띄우는 host와 workflow.check다(runs와 apps를 같이 알아야 해서 module이 아니라 여기 있다).

  - path: packages/core/host-queue
    boundary: core
    notes: core가 host(desktop 앱의 shell main, display 없는 Linux의 page host)에 시킬 일(탭 열기·닫기·보이기, browser 호출)의 메모리 queue와 agent가 연 탭의 표. host가 붙은 `/host-link` 연결(core/server/host-link.ts)이 queue의 요청을 받아 frame으로 민다. 다른 module을 import하지 않고 base와 protocol만 쓴다. handler는 core/main의 wiring/host-queue.ts가 붙인다. phone 탭(`phone.ts`)은 shell에 가지 않고 폰 link(`drive.*`)로 간다. 멀리서 보기(`page-view.ts`, `page_view/*`)는 보는 principal의 lease와 browser 탭마다 host가 민 마지막 frame(메모리)을 들고 연결 요청(`callLink`)으로 host에 frame 켜기·입력·take control을 시킨다.

  - path: packages/core/terminal-agents
    boundary: core
    notes: 터미널 안 coding agent의 원본. tracker와 hook(socket, key), GUI handle(harness-gui가 연 ACP handle을 터미널마다 하나), coding session 목록과 대화(redaction을 지나 `acp/*`·`coding_sessions/*`로 낸다), 저장한 session(`<data root>/terminal-agents/sessions/`), resume으로 연 터미널의 hold, per-run 폴더(`core-<pid>`)와 `$BROWSER` bridge, harness 감지와 hook 설치. base, protocol과 core/terminals(port), core/extensions(ACP handle type)만 쓴다. Bus·attention·extension host·host queue는 deps이고 core/main의 wiring/terminal-agents.ts가 끼운다.

  - path: packages/core/terminal-view
    boundary: core
    notes: 기기(폰, 연결된 컴퓨터의 창)가 보는 터미널(이 기계의 어느 터미널이든)의 최신 화면(메모리, lease 동안 PTY host에서 읽는다), 보는 principal의 lease(30초), 기기가 잡은 PTY 크기를 놓기. 여는 것과 입력은 `terminals/*`가 한다. base, protocol과 core/terminals(port)만 쓴다. Bus·입력 허락(snapshot의 input)은 view.ts의 deps이고 wiring/terminal-view.ts가 끼운다.

  - path: packages/core/terminals
    boundary: core
    notes: 사람의 터미널. PTY host(host/, core가 자식으로 띄운다), 그 감독, 터미널 service(열기 순서, 출력 lease, route handler), 사람의 login env와 `lophn` 경로. 다른 module을 import하지 않고 base와 protocol만 쓴다. 다른 쪽은 ports.ts의 `Terminals`·`PersonEnv`로 닿고 core/main의 wiring/terminals.ts가 끼운다.

  - path: packages/core/extensions
    boundary: extension-host
    notes: core 안 extension host(registry, CLI를 띄우는 spawner, ACP handle, tool 호출). base, protocol과 core/terminals(사람의 env와 session 표지 이름)만 쓴다. 다른 쪽은 ports.ts의 `ExtensionHost`로 닿고 core/main의 wiring/extensions.ts가 끼운다. bundled/<id>/는 본체 안 extension code(shell-extension)라 protocol, base, 자기 폴더만 import한다(tools/check-deps.ts).

  - path: packages/core/projects
    boundary: projects

  - path: packages/core/router
    boundary: router
    notes: 사람 메시지, call tool, program의 반응(reaction)을 session queue로 보낸다. feature module을 import하지 않고 ports.ts의 port만 안다. 구현은 wiring이 끼운다.

  - path: packages/core/runs
    boundary: runs
    notes: lophn-agent와 다른 feature module을 import하지 않는다. agent 이름 풀기, 메시지 넣기, turn 읽기, 앱 호출은 ports.ts의 port이고 core/main의 wiring/runs.ts가 끼운다.

  - path: packages/core/workflows
    boundary: workflows
    notes: lophn-agent와 다른 feature module을 import하지 않는다. 정의 file 읽기, project 이름 풀기, turn 멈추기와 읽기는 ports.ts의 port이고 core/main의 wiring/workflows.ts와 wiring/workflows-files.ts가 끼운다.

  - path: packages/core/jobs
    boundary: jobs
    notes: lophn-agent와 다른 feature module을 import하지 않는다. agent·앱·project 이름 풀기, 시간대, timer, 이 기계 id(주인 기계 비교)는 ports.ts의 port이고, run 시작과 instance 시작은 core/main의 wiring/jobs.ts가 runs·workflows service로 끼운다. 다른 module의 표를 SQL로 읽지 않는다.

  - path: packages/core/secrets
    boundary: secrets

  - path: packages/core/server
    boundary: server

  - path: packages/core/machine
    boundary: machine
    notes: machine.json의 유일한 주인. core 안에서는 `ctx.machine`, wiring 밖(data step, app supervisor)은 `readMachineId`·`readMachineIdSync`로만 읽는다. OS 기계 값은 binding을 만드는 데만 쓰고 남기지 않는다.

  - path: packages/core/always-on
    boundary: always-on
    notes: always-on.json의 유일한 주인. OS 등록과 keep-awake는 port다. `os/`가 구현하고(OS 명령, child, file, hash는 deps로 받는다) core 입구(`packages/core/main/daemon/main.ts`)가 설치 layout일 때만 꽂는다. 다른 module은 wiring context의 `alwaysOn`으로만 읽는다.

  - path: packages/protocol/always-on
    boundary: always-on
    notes: route `always_on/status`·`always_on/set`과 `AlwaysOnStatus`. 구현을 두지 않는다.

  - path: packages/core/folder
    boundary: folder
    notes: export/(data stream, snapshot, compaction, settled, 기계 기록), import/(기록 사본, stream 따라가기, held 복사), apps/(앱 기록, release·source 교환, take-in), environment.ts(읽기 명령과 section 자리)다. `computers`("내 컴퓨터들") 폴더는 replica.ts(link·폰·거울이 가져온 다른 기계의 manifest와 file을 검사해 두는 받는 자리. 읽기는 이 폴더를 이름 붙인 폴더처럼 읽는다), mirror.ts(사람의 폴더 `folder.shared`를 그 폴더의 거울로), carry-routes.ts(route `carry/manifests|wants|file|put`), carry-status.ts(route `carry/status`), export/manifest.ts·roster.ts·events.ts(manifest와 앱 목록, 명단 file, event file 쓰기), import/roster.ts·events.ts(폴더의 명단 file과 기계를 건너는 event 읽기), import/follow.ts(따라갈 때 묻는 규칙)가 맡는다. 앱 DB와 sync log에는 ports.ts의 port(`FolderApply`, sync log)로만 닿고 core/main의 wiring/folder.ts가 core/apps의 구현을 꽂는다. 계기(감시, timer, 물러남)도 그 wiring이 갖는다. 자기 하위 폴더 밖에 쓰지 못하게 writer가 막고, 다른 기계의 하위 폴더는 받는 자리만 서명한 목록에 맞는 file로 쓴다.

  - path: packages/protocol/folder
    boundary: folder
    notes: 폴더 배치와 file 이름(manifest, 앱 목록, 명단 file, event file 포함), changes·snapshot 꼴, 기록 schema(모르는 칸을 버린다), 꼴 판 범위, 수치(limits.ts), 상태와 `machine.environment` 출력 schema, route `machine/environment`·`machine/forget`·`apps/take_in`·`apps/sync_held`·`apps/sync_resume`. 구현을 두지 않는다.

  - path: packages/core/remote
    boundary: remote
    notes: roster.ts는 내 기기 명단의 main thread 사본이다(받기, 서명, 저장을 하나씩. 서명 key는 writer Worker로 넘기지 않고 machine 자격 `roster/store`로 쓴다). links.ts는 명단의 다른 컴퓨터마다 드는 link이고 붙는 engine은 `packages/remote-client`다. carry.ts는 붙은 컴퓨터마다 상대가 든 manifest와 file 가운데 이 컴퓨터에 없는 것을 `carry/*`로 받아 폴더의 받는 자리에 넘긴다(검증하거나 쓰지 않는다). host.ts는 붙는 연결(폰, 다른 컴퓨터) 하나하나를 `join`과 명단으로 받아들이고 call.ts가 그 연결의 call을 요청한 쪽(`by`)으로 거른다(폰, 컴퓨터의 `screen`·`terminal`·`agent`·`app`, `by` 없는 컴퓨터의 core). machine-routes.ts는 이 컴퓨터가 다른 컴퓨터를 부르는 `machines/call`·`machines/app_tools`(요청한 쪽을 자격으로 정하고 다른 컴퓨터의 command 목록을 다시 거른다)이고, grants.ts는 터미널 입력 허락의 표(받는 컴퓨터의 `remote_grants`)다. subscriptions.ts는 이 컴퓨터의 job과 앱이 다른 컴퓨터의 앱 event를 받는 구독의 두 쪽(건 쪽과 내주는 쪽 거르기)이다. host-key.ts는 host key와 서명 key 둘을 같이 만들고 지운다. phone-link.ts는 core가 폰에 `request`를 보내고 `response`를 받는 길이다. 연결은 host가 붙이고 떼며 알린다. phone-link는 kind를 모르고 입력·출력 검사는 부르는 쪽이 한다.

  - path: packages/core/attention
    boundary: attention
    notes: 다른 feature module을 import하지 않는다. 기기 목록, push 보내기, session 조회는 port이고 core/main의 wiring이 끼운다(기기 목록과 push 보내기는 wiring/remote.ts가 꽂는다). push/는 Expo Push sender(fetch와 timer는 인자)다.

  - path: packages/core/storage
    boundary: storage

  - path: packages/core/supervision
    boundary: supervision

  - path: packages/shell/main
    boundary: shell
    notes: core main과 같은 꼴이다. desktop/main.ts는 조립만 하고 영역마다 desktop/wiring/의 한 file이 자기 값을 등록한다. desktop/viewer/는 다른 기계 보기로, 화면이 준 기계(`shell:core-call`·`core-watch`의 `machine`)로 core의 `machines/*` 길을 고르는 규칙(machine-route.ts)과 기계 목록 읽기(list.ts)다. 창은 기계에 묶이지 않는다. 다른 기계에 붙는 key와 연결은 core가 들고 shell은 `@lophn/remote-client`를 import하지 않는다. 터미널·coding agent·extension host는 core가 갖고 shell main에는 OS와 창에 붙은 것만 남는다(터미널 입력·다시 시작의 focus 검사(desktop/terminal-focus.ts, 검사를 지난 입력만 shell capability를 실어 core에 넘긴다), clipboard, terminal link를 열 곳, 진단 기록, core event로 띄우는 알림. desktop/wiring/terminal.ts·notice.ts). page-host/는 display 없는 Linux에서 core가 띄우는 launch mode `--page-host`다(창·tray·renderer 없이 탭마다 offscreen page를 들고 desktop과 같은 driver·stream·browser profile을 쓴다. desktop/main.ts가 argv로 가른다). browser/agent/stream.ts는 다른 기기가 보는 browser 탭의 CDP screencast frame을 `/host-link`로 밀고 그 기기의 입력과 take control을 page에 넣는다(desktop은 desktop/wiring/surface.ts, page host는 page-host/main.ts가 잇는다).

  - path: packages/shell/renderer
    boundary: shell
    notes: desktop/machines/는 창 하나가 짝지은 모든 컴퓨터를 보이는 층이다(기계 목록 source, 화면이 "어느 컴퓨터"를 고르는 범위 `MachineScope`, 탭마다의 범위 `TabScope`, 이 컴퓨터에서만 열리는 kind의 한 줄). desktop/settings/sync/는 Settings › Sync(폴더, 컴퓨터, 앱의 지금 길)다.

  - path: packages/shell/preload
    boundary: shell

  - path: packages/shell/ipc
    boundary: shell

  - path: packages/mobile
    boundary: mobile
    notes: root npm workspace 밖의 Expo project다(자기 package.json과 lock). `npm run check` 밖이라 `cd packages/mobile; npm run typecheck; npm test`로 본다. Metro가 packages/ 아래 protocol, design(kit과 i18n), desktop renderer의 순수 `.ts`를 source로 읽는다. check의 deps는 이 폴더를 보지 않는다. modules/lophn-widgets는 폰의 홈 화면 native 층(Kotlin Expo module 하나. 위젯 그리기·놓기·새로 하기, 앱 아이콘 pin·disable·enable)이다. widgets/, shortcuts/, open/, link/는 위젯 store, 아이콘, open target, 컴퓨터의 `request`에 답하는 handler다. modules/lophn-drive는 guest의 Android view tree를 읽고 누르는 Kotlin Expo module이다(그 view가 이 폰이 연 preview인지는 `src/apps/drive`가 먼저 본다). `guest/`는 사용자 앱의 폰 화면을 돌리는 guest runtime의 base bundle(폰 앱 build가 Hermes bytecode로 컴파일해 APK에 싣는다)이고 `patches/`의 patch가 `@callstack/react-native-sandbox`를 고친다(`npm ci`의 postinstall이 적용한다). `src/apps/carry/`는 폰이 컴퓨터 사이에서 `computers`의 file을 읽지 않고 나르는 규칙(받아 두기, 넘기기, 지우기, 모바일 데이터의 크기 선택)을 React Native 없이 두고(`carry.test.ts`가 `node --test`로 돈다), `src/apps/local/`이 폰에서 도는 앱의 설치, sync, release 바뀜, 지우기 규칙을 React Native 없이 두고(`node --test`로 돈다) `src/data/local-apps.ts`와 `local-stores.ts`가 그것을 화면에 잇는다.

  - path: packages/mobile/modules/lophn-app-db
    boundary: mobile
    notes: 폰에서 도는 앱의 SQLite native module(C++ JSI, Android만)이다. 폰 앱의 host와 앱 화면의 guest가 같은 `.so`로 같은 file을 열고 guest의 연결은 host가 file 하나에 묶는다(ATTACH, `VACUUM INTO`, extension, `lophn_sync_*`, trigger, call 안의 transaction 제어를 거절한다). 공식 SQLite amalgamation 한 쌍을 손대지 않고 저장소에 둔다(`sqlite/VERSION`이 판과 sha256).

  - path: tools
    boundary: null
    notes: 개발 도구(check, wireframes)라 맞는 boundary가 없다.

  - path: tests
    boundary: null
    notes: harness(loop, wire), core E2E, provider live test와 그 support·fixture다. 제품 코드는 여기를 import하지 않는다.
