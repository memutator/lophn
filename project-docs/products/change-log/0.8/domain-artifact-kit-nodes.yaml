id: domain-artifact-kit-nodes
version: 0.8.0
title: 'domain artifact에서도 kit으로 node를 그린다'
modules: [packages/core/agent-workspaces]
checked: [context-component-registry, architecture-layers, architecture-approval, architecture-eval, architecture-workflow, architecture-agent-definition, architecture-artifact, tool-check-deps]
change: |
  전:
  - kit(`_lophn/kit.js`의 `LophnKit.renderGraph`)은 모든 artifact view에 있었지만 쓰는 법은 PM skill `guide-workflows`에만 있었다. domain artifact를 쓰는 App Engineer와 Operator는 kit을 몰랐다.
  후:
  - 내장 skill `guide-artifact`(PM, App Engineer, Operator)에 "Drawing nodes with the kit"과 "Drawing a domain" 절이 생겼다. kit을 부르는 법, node·edge 모양, tone 값이 이 한 곳에 있다. kit이 그림 전체를 오류로 그리는 경우(빈 id나 겹친 id, 없는 node를 가리키는 edge, 자기 자신으로 가는 edge, 다섯 값 밖의 tone)도 처음 적었다. 순환은 된다.
  - domain에서 그리는 것은 둘이다. kind 지도는 kind가 node, `ref` 칸이 edge(label은 칸 이름)이고 item 수를 `kind.list`의 `aggregate` count로 세어 note에 둔다. 상태 흐름은 상태를 뜻하는 `enum` 칸의 값이 node이고 값마다 item 수(`group_by`)를 note에 둔다. 값 사이 edge는 `DOMAIN.md`나 사람의 말에서 오고 모르면 edge 없이 그린다. 그리기 전에 `ask`로 묻는다.
  - artifact는 `kinds.yaml`을 읽지 못하므로 agent가 그림 data를 `data/*.json`에 쓴다. `kinds-yaml` skill: kind 지도 artifact가 있으면 kind 파일을 바꿀 때 그 data도 고친다.
  - `guide-workflows`의 "Drawing nodes with the kit"은 `guide-artifact`를 가리키고 workflow에만 걸린 것(static·instance artifact, `data/_instance.json`, 예 HTML)만 남겼다. instance 예는 자기 자신을 `next`에 둔 step의 edge를 뺀다.
why: |
  사람이 workflow의 node 그림 방식을 domain에도 쓰기로 했다(2026-10-22, `project-docs/products/roadmap/workflow.md` "정한 것 (사람)"). kit은 이미 모든 view에 있어서 남은 것은 domain artifact를 쓰는 agent가 쓰는 법과 무엇을 그릴지를 아는 것이었다.
decisions:
  - text: 'kit 쓰는 법은 `guide-artifact` 한 곳에 둔다. domain artifact를 쓰는 세 role이 모두 받고, 같은 API 설명이 두 곳에 있으면 갈라진다.'
    by: agent
  - text: 'domain에서 그리는 것은 kind 지도와 상태 흐름 둘이다. 그림은 domain 주인 agent가 artifact로 그리고 program이 저절로 그리지 않는다. 상태 값 사이 순서는 domain의 뜻이라 agent가 정한다.'
    by: agent
  - text: '그리기 전에 묻는다. workflow artifact에 사람이 정한 것("모든 workflow에 필요한 것은 아니다. PM이 물어보면 된다")을 domain에 그대로 썼다.'
    by: agent
  - text: 'kind 지도의 data는 kind 파일을 바꾼 agent가 같이 고친다.'
    by: agent
  - text: '자기 kind를 가리키는 `ref`는 kind 지도에 edge로 그리지 않고, 필요하면 node의 note에 쓴다. kit은 self-edge 하나로 그림 전체를 오류로 그린다.'
    by: agent
