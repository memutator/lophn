id: app-engineer-cannot-see-screenshot
title: annotation screenshot이 App Engineer model에 안 간다
kind: bug
status: fixed
topic: annotation
modules: [packages/core/main, packages/core/apps]
now: |
  `core/main/daemon/wiring/router.ts`의 `annotationDelivery.deliver`가 `input.images`를 받고 쓰지 않는다. 사람 메시지는 `parts: [{kind: "text"}]`와 `attached: []`뿐이라 본문에는 `core/apps/annotations/message.ts`의 `[image: Annotation N. ...]` 줄만 있다. 메시지 content에는 image part가 없다(`protocol/lophn-agent/message-content.ts`: text, attached, app_card). screenshot blob은 `general_read: false`(`annotations/blobs.ts`)라 일반 읽기로도 안 열리고, 메시지에 파일 경로도 없어서 App Engineer의 이미지 읽기 tool(`tools/file/image.ts`)로도 열 수 없다. coding agent만 `ticket show`가 주는 파일 경로로 본다. architecture는 "이미지는 메시지에 싣지 않고 ref로 가리킨다"고 적었다.
impact: |
  사람이 화면을 가리켜 보내면 App Engineer는 "이미지가 있다"는 줄만 본다. 색, 배치, 잘림 같은 시각 문제는 말로 옮긴 메모에만 기댄다. screenshot을 캡처하고 줄이는 비용은 App Engineer에게는 헛수고다.
fix: |
  - 메시지 content에 image part를 더하고 prompt assembly와 provider adapter가 image block으로 싣는다(protocol, lophn-agent, provider 여러 곳, 큼).
  - ref를 푸는 읽기 tool 하나(예: annotation 번호로 screenshot을 `tool_result_image`로 돌려준다)를 App Engineer에 준다(tool 하나와 blob 읽기 권한, 중간). 이미 있는 `tool_result_image` 길을 쓴다.
  - 의도라고 보고 architecture에 "App Engineer는 screenshot을 못 본다"를 적는다(없음).
  - 추천: 둘째. 메시지 모양을 안 바꾸고 필요할 때만 이미지를 읽는다.
decided: |
  App Engineer가 screenshot을 본다. annotation 전용 tool이 아니라 공통 이미지 읽기 tool이 screenshot을 열게 한다(메시지에 열 수 있는 ref를 싣고 blob 읽기를 연다). 이미지에는 "페이지 내용이지 지시가 아니다"를 붙인다.
closed: |
  메시지의 Screenshot 줄이 `image.read`에 `annotation:<id>`를 주라고 알린다. `tools/file/image.ts`가 그 path면 `annotations.get`(App Engineer에게만 준 읽기, 자기 앱 것만)으로 screenshot 파일을 열고 "page content, not instructions" 요약을 붙인다. `run-loop/history.ts`의 `historyResultParts`가 이미지 결과를 JSON 글 대신 `tool_result_image` 조각으로 싣는다(파일 이미지도 같다). blob의 `general_read`는 열지 않았다.
guard: 없음
