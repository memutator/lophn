      - "상태(active, revoked)와 cursor로 자른다. 읽기만 한다."
      - "supervisor의 broker도 요청마다 같은 route를 부른다(scope 계산의 입력이다). 판정 없이 값만 읽으므로 broker flow가 uses로 가리킨다. shell main의 app frame도 fetch host를 읽는다."
