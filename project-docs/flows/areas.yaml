      - packages/protocol/lophn-agent/turn-reads.ts
      - packages/protocol/lophn-agent/tool-calls.ts
      - packages/protocol/lophn-agent/model-calls.ts
      - packages/protocol/lophn-agent/traces.ts
      - packages/protocol/lophn-agent/ask-tool.ts
      - packages/protocol/lophn-agent/extension-tools.ts
      - packages/protocol/lophn-agent/issuer-requests.ts
    owns:
      - turn 시작, 끝, 멈춤, 실패 분류, turn의 운명(끊긴 turn의 회복)
      - model 호출, retry, idle 한도, compact
      - prompt 조립(규칙, 지침, workspace 정보)
      - 질문 tool(ask)과 그 답
      - extension tool 호출, trace, 사용량
    read:
