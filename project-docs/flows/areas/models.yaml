  - id: provider-connect
    title: "provider를 API key나 인증 없는 loopback 주소로 연결한다"
    actor: person
    entries: [route:providers/connect]
    boundary: [models]
    code: [packages/core/lophn-agent/providers/commands.ts, packages/core/lophn-agent/providers/model.ts, packages/core/lophn-agent/providers/model-list.ts, packages/protocol/lophn-agent/provider-inputs.ts]
    steps:
      - "입력 모양을 검사한다. endpoint는 https나 loopback http여야 하고 protocol과 auth_kind가 정의에 있어야 한다. none은 credential이 null이고 loopback 주소일 때만 된다. api_key는 credential이 있어야 한다"
      - "api_key면 credential 이름이 provider.<id>여야 한다. 다른 이름의 secret이 endpoint로 가는 것을 막는다"
      - "같은 id가 없으면 provider 줄과 credential 줄을 함께 쓴다. revision은 1이고 연결 시각을 남긴다"
      - "사용자 정의 provider(내장 정의가 아님)라면 응답을 기다리지 않고 뒤에서 endpoint의 /models를 읽어 model 목록을 저장한다. 실패하면 목록은 비어 있다"
    outcomes:
      - id: connected
        observe: ["ledger:providers", "ledger:provider_credentials", "response"]
      - id: conflict
        code: conflict
        when: "같은 id의 provider가 이미 있다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "credential 이름이 provider.<id>가 아니다. 입력 schema가 endpoint, protocol, auth_kind, credential 짝을 막는 것은 이 갈래에 넣지 않았다"
        observe: ["response"]
    crosses_process: false
    risk: [secret]
    refs: []
    docs: []
    unclear:
      - "custom provider의 definition key가 내장 key와 같아도 막지 않는다. 그러면 model 목록을 읽지 않고 사람이 적은 model 정보도 저장되지 않는다"
      - "api_key 연결에서 secret 저장(secret-put)은 renderer가 먼저 부른다. 같은 id가 이미 있으면(conflict) 새 key가 기존 provider의 secret 값을 먼저 덮어쓴다"

