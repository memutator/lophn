      - id: settled-by-turn
        observe: [ledger:runs]
      - id: lost
        observe: [ledger:runs]
      - id: kept
        when: "turn이 아직 돌고 있음. 닫지 않는다"
        observe: [ledger:runs]
    crosses_process: false
    refs: [J6]
    docs: [architecture/run.md]

  - id: run-read
