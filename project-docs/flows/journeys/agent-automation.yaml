    title: "부모가 답 없이 archive되면 팀원의 질문은 취소로 풀린다"
    actor: person
    goal: "팀원의 질문을 받은 부모 session을 사람이 archive하면 질문 대기가 취소로 풀리고 팀원은 취소를 결과로 받는다"
