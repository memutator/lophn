id: explorer-folder-collapse-fix
version: 0.9.0
title: 'Explorer의 펼친 폴더가 저절로 닫히지 않고, scrollbar 위의 wheel과 끌기가 옆 손잡이에 먹히지 않는다'
modules: [packages/shell/main, packages/shell/renderer, packages/design]
checked: []
change: |
  전:
  - 폴더를 열여섯 개쯤 넘게 펼치면 3초마다 몇 개씩 저절로 닫혔다. `useFileTree`는 펼친 폴더마다 `list`를 한꺼번에 보내고, shell main의 file adapter는 `list`마다 core `projects/list`를 불러 연결 폴더를 읽었다. core의 principal당 HTTP 동시 한도(16, queue 없음)를 넘은 호출이 `unavailable`이 되고, `useFileTree`는 이미 읽은 폴더의 실패를 이유와 상관없이 "폴더가 사라짐"으로 보고 펼침을 지웠다. 같은 순간의 renderer core 호출도 `unavailable`로 졌다.
  - scrollbar 일부가 옆 크기 손잡이 밑에 깔려, 그 위의 wheel은 scroll하지 않고 thumb을 끌면 scroll 대신 크기 끌기가 시작했다. sidebar 폭 resizer가 Explorer scrollbar 3px를, 칸 경계(`panes.module.css`의 `.grab`)가 왼쪽 칸 scrollbar 4px를, floated 패널의 오른쪽·아래 손잡이(`float-panel.module.css`의 `.e`·`.s`)가 패널 본문의 세로·가로 scrollbar 6px씩을 덮었다.
  후:
  - file adapter는 같은 순간의 `list`들이 연결 폴더 읽기 한 번을 나눠 쓴다(`connectedFolders`). 펼친 폴더 200개를 다시 읽어도 core 호출은 한 번이다.
  - `useFileTree`는 `not_found`일 때만 펼친 하위 폴더를 닫는다. 다른 실패면 앞서 읽은 항목을 둔다.
  - 손잡이가 들어오는 폭만큼 본문 쪽을 비운다. sidebar 본문은 오른쪽 margin 4px, 경계 왼쪽 칸 본문은 오른쪽에 바탕색 테두리 4px, floated 패널 본문은 오른쪽과 아래에 바탕색 테두리 6px를 둔다. 손잡이 자리와 잡는 폭은 그대로다. 남는 겹침은 floated 패널 모서리 손잡이(12px)가 두 scrollbar 끝 6px를 덮는 것뿐이다.
why: |
  사람이 개발 앱에서 쓰다 찾았다. 원인은 worktree 앱(CDP)에서 재현해 확인했다. 동시 `list` 40개 중 20개 안팎이 `unavailable`, 펼친 폴더 20개가 6초 만에 9개로 줄었다. 고치기 전 손잡이 밑 scrollbar 자리에서는 wheel이 듣지 않았고 thumb 끌기가 크기를 바꿨다. 고친 뒤 같은 자리에서 wheel과 thumb 끌기가 scroll하고 손잡이 끌기는 그대로 크기를 바꾼다.
decisions:
  - text: |
      연결 폴더 목록을 cache하지 않고 동시에 도는 읽기만 합친다. 프로젝트 폴더를 고치면 다음 `list`가 바로 새 목록을 본다.
    by: agent
  - text: |
      core HTTP 한도는 그대로 둔다. 한도는 남이 core를 막지 못하게 하는 장치이고, 문제는 한 사람의 동작 하나가 core 호출 N개로 불어난 것이다.
    by: agent
