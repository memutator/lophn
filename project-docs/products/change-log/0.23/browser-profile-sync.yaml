id: browser-profile-sync
version: 0.23.126
title: browser profile 정의와 저장 login(값 포함)이 컴퓨터 사이 link로 사람의 다른 컴퓨터에 간다
modules: [packages/protocol, packages/core/config, packages/core/main, packages/core/remote, packages/core/secrets, packages/design, packages/shell/main, packages/shell/renderer]
change: |
  저장 모양. 전: profile 목록은 컴퓨터마다의 locked 설정 `shell.browser_profiles`, 저장 login metadata는 `<data>/logins.json`(배열), 값은 `secrets.json`의 `login.<id>.password|totp`였다. 후: profile 정의와 login metadata가 `<data>/browser-vault.json`(0600) 하나다(`{format: 1, profiles, logins, removed, clear}`). 항목마다 칸 stamp(`revs`, login은 password·totp 칸 포함), 지운 것의 흔적(`removed`: 지운 때와 지울 때 본 칸 stamp), partition data를 지울 profile(`clear`)을 든다. secret 이름은 그대로다. data step `browser.vault`(secrets wiring)가 옛 설정과 `logins.json`을 같은 id와 칸으로, 칸 stamp 0으로 옮기고(vault를 먼저 쓰고) 설정 key와 file을 지운다. 설정 `shell.browser_profiles`는 없어지고 `shell.browser.share_with_computers`(boolean, 기본 켬, locked)가 생겼다.
  route. 새 `browser_profiles/list`(user, `{profiles, clear}`)·`save`(user, `{id?, name, color}` → `{id}`, 만들거나 바꾼 이름의 겹침과 새 profile 16개 넘음은 `conflict`)·`delete`(user, 그 profile의 login 값, login, profile을 지우고 흔적을 남긴다)·`cleared`(shell capability만, `logins/release`와 같다). `logins/save|delete`와 `secrets/put|delete`의 `login.` 이름은 칸 stamp를 올린다. 새 `browser_vault/exchange`(memory, user)는 vault와 값을 낸다. 새 기기 route 목록 REMOTE_COMPUTER_CORE_ROUTES에만 들어 명단의 컴퓨터의 core가 요청한 쪽 없이 부를 때만 받고(폰, `screen`·`terminal`·`agent`·`app` 요청은 `forbidden`) handler가 지금 명단의 컴퓨터인지와 나누기를 다시 본다. 새 change 이름 `browser_profiles`.
  맞추기. remote가 켜진 동안 컴퓨터마다 link가 붙을 때, 상대의 `StateChanged{browser_profiles|logins}`, 5분마다, 나누기를 켤 때 그 컴퓨터의 exchange를 불러 칸마다 합친다: 칸은 stamp가 큰 쪽, 흔적은 지울 때 몰랐던 새 칸이 있으면 되살아나고, 지운 profile의 몰랐던 login은 profile을 되살린다. 첫 합치기는 합집합이다. 값은 secret store로 먼저 쓰고 vault를 쓴 뒤 vault 밖 login의 값을 지운다. 폴더(`computers`, 같이 보는 폴더), 폰, relay가 읽는 곳에는 아무것도 쓰지 않는다. 다른 컴퓨터에서 지워져 합치기가 지운 profile은 shell main이 partition data를 지운다.
  shell main은 profile 목록을 설정 대신 `browser_profiles/list`의 사본(core 준비와 `StateChanged{browser_profiles}`에 다시 읽음)으로 partition을 가린다. Settings › Browser의 Profiles는 profile 하나씩 저장하고, 지우기는 partition data를 먼저 지운 뒤 route가 login과 profile을 지운다. 새 구역 Your other computers(한 줄 설명과 Switch). 나누는 동안 profile·login 지우기 확인은 다른 컴퓨터에서도 지워진다고 말한다.
why: |
  profile과 저장 login이 컴퓨터마다 따로라 사람은 컴퓨터마다 profile을 만들고 login을 다시 넣어야 했다. 사람이 2026-11-21에 profile 정의와 저장 login을 기계 사이에 맞추기로 정했다(cookie, 저장소, agent의 profile은 컴퓨터마다).
decisions:
  - text: 'profile 정의와 저장 login(password, TOTP seed 포함)을 기계 사이에 맞춘다. cookie와 저장소, 어느 agent가 어느 profile을 쓰는지는 컴퓨터마다다. provider key와 git token은 그대로 맞추지 않는다.'
    by: person
  - text: '길은 명단의 컴퓨터 사이 link(두 core 사이 Noise IK) 하나이고 폴더에는 metadata(profile 이름, origin, username)도 쓰지 않는다. 대가: 두 컴퓨터가 같은 때 켜져 있어야 맞는다(dual boot는 맞지 않는다). 버린 길: 받는 컴퓨터의 host key로 암호화한 file을 폴더로 보내기(새 암호 code, 뒤에 key가 새면 cloud의 옛 사본이 열림, 명단이 바뀔 때마다 다시 암호화), metadata만 폴더에 평문으로 두기(어느 site의 어느 계정인지가 cloud에 드러난다).'
    by: agent
  - text: '나누기는 짝지은 컴퓨터마다 자동이고 컴퓨터마다 끄는 스위치 하나(기본 켬)다. 버린 길: 항목마다 고르는 화면, 기본 끔(사람이 컴퓨터마다 켜야 한다).'
    by: agent
  - text: '합치기는 칸마다 stamp가 큰 쪽이 이기고, 지울 때 몰랐던 고침이 있으면 지운 login이 되살아나며, 지운 profile에 몰랐던 login이 있으면 profile도 되살아난다. 같은 칸을 두 컴퓨터가 고치면 나중 것만 남는다. 버린 길: 항목 통째 새 쪽(옛 사본의 note 고침이 새 password를 덮는다), 엇갈린 같은 칸을 login 둘로 나누기(목록이 지저분해진다), 나중 것이 이기는 지우기(고친 login이 말없이 사라질 수 있다).'
    by: agent
  - text: '첫 합치기는 합집합이고 같은 이름의 profile은 둘로 남는다. 이름 겹침 검사는 이 컴퓨터에서 만들거나 이름을 바꿀 때만 한다(같은 이름의 둘 가운데 하나의 색만 바꾸는 것은 받는다). 버린 길: 이름에 번호를 붙이기(program이 사람의 profile 이름을 바꾼다).'
    by: agent
  - text: '기본 profile의 login도 맞춘다. 대가: 다른 컴퓨터에서 profile을 달지 않은 agent도 그 login을 친다(handle과 origin 일치는 그대로).'
    by: agent
  - text: '명단에서 뺀 컴퓨터는 곧바로 받지 못한다(자격과 연결을 거둔다). 이미 받은 것은 거둘 수 없다.'
    by: agent
  - text: 'profile 목록을 설정에서 저장 login과 같은 vault file로 옮긴다. 칸마다 합치려면 stamp와 흔적이 있어야 하는데 설정은 컴퓨터마다의 값이고 화면이 목록을 통째로 쓴다. 버린 길: 설정을 두고 합치는 쪽이 목록 차이로 고침을 추리기(진실이 두 곳).'
    by: agent
  - text: '기계 사이 route는 새 기기 route 목록 REMOTE_COMPUTER_CORE_ROUTES에 두어 폰과 요청한 쪽이 있는 call을 막는다. 지금 REMOTE_CORE_ROUTES(`carry/*`)는 폰도 나르므로 그대로 둔다.'
    by: agent
  - text: '받기만 있고 보내기는 없다. 늘 켜 둔 컴퓨터가 저절로 가운데가 되어 A의 것이 B를 거쳐 C에 간다. vault를 통째로 주고받는다(link frame 16 MiB 안). 상대가 나누기를 껐거나 옛 판이면 물러나지 않고 상대가 바뀔 때마다 한 번씩만 묻는다.'
    by: agent
checklist:
  - "해야: 이 판으로 올리면 Settings › Browser의 profile과 저장 login(password, TOTP key 포함)이 짝지은 모든 컴퓨터로 저절로 간다. 그러고 싶지 않은 컴퓨터에서는 Settings › Browser › Your other computers의 Share profiles and saved logins를 끈다"
  - "해야: 맞추려면 두 컴퓨터가 같은 때 켜져 있어야 한다(직접이든 relay든). 같이 켜지지 않는 컴퓨터(dual boot 등)는 맞춰지지 않는다. 늘 켜 둔 컴퓨터가 있으면 그 컴퓨터를 거쳐 간다"
  - "두 컴퓨터에서 Settings › Browser의 Profiles와 Logins가 같아지는지, 한쪽에서 login의 password를 바꾸면 다른 쪽 agent가 새 password로 로그인하는지 본다"
