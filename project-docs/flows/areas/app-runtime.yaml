        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: internal
        code: internal
        when: "core 응답 모양이 맞지 않음, 또는 core의 읽기·기록 오류가 그대로 전달됨"
        observe: [response]
