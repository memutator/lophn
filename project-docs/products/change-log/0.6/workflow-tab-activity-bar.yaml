id: workflow-tab-activity-bar
version: 0.6.0
title: "workflow 탭과 project sidebar의 activity bar"
modules: [packages/shell/renderer, packages/shell/main, packages/design, tools]
checked: []
change: |
  전:
  - 사람이 workflow 목록과 instance를 볼 화면이 없었다. 시작과 멈춤은 CLI뿐이었다.
  - project sidebar는 위쪽 icon segmented control(Explorer, Agent, Artifacts, Domains)과 접힌 rail(Terminal, Agent, Search 바로 가기)이었다.
  후:
  - project sidebar는 VS Code 꼴의 activity bar다. 왼쪽 끝 56px icon 줄(Explorer, Agents, Artifacts, Domains, Workflows)을 늘 두고, 누르면 그 panel(240px)을 열고, 열린 icon을 다시 누르면 bar만 남게 접는다. 아래쪽에 Terminal, Agent, Search 바로 가기가 있다. 열린 sidebar는 panel 폭에 bar 폭을 더한 것이다. 앱 공간은 그대로다.
  - Workflows panel은 project의 workflow 목록(이름, 도는 instance 수, 틀린 선언 표시)이고 줄을 누르면 그 workflow의 탭을 연다.
  - workflow 탭(kind `workflow`, key `workflow:<name>`)은 workflow 하나다. 머리(이름, 도는 수, [Start], [Open artifact]), instance 목록, 고른 instance의 step 줄(상태, 마지막 report, 줄 기록, 넘기지 못함·restart 이유), 사람 차례와 [Open conversation], [Stop], [Open instance artifact]를 보인다. graph는 그리지 않는다. 틀린 선언과 `flow`는 이유와 [Refresh]만 있다.
  - 화면은 `ListWorkflows`, `StartWorkflow`, `StopWorkflow`만 부른다. `WorkflowInstanceChanged`가 오면 instance를 다시 읽는다.
  - artifact 탭이 workflow artifact(static, instance)를 연다. gallery Screens에 workflow 영역과 sidebar page가 생겼고, 승인용 Drafts와 그 mock은 지웠다.
why: |
  instance가 추적되고 화면에 보여야 한다(사람, roadmap). sidebar 항목이 늘어 segmented control로는 감당하지 못한다(사람).
decisions:
  - by: person
    text: |-
      wireframe을 추천안 그대로 승인했다: activity bar 56px, 열린 항목은 왼쪽 띠와 배경, workflow 하나가 탭 하나, instance view는 목록과 글뿐, [Start] dialog와 artifact 단추 자리. (2026-10-22)
  - by: agent
    text: |-
      sidebar panel이 목록과 도는 수를 source에서 직접 읽는다. `workspace.tsx`는 두 줄만 바꾸고 workflow별 layout(`workflow-shell`)이 이어 고친다.
  - by: agent
    text: |-
      사람 화면은 report와 고치기를 부르지 않는다. 사람이 순서를 바꾸려면 그 agent에게 말한다. (roadmap)
follow_up: |
  workflow별 layout과 title bar selector는 계획 `workflow-shell`이다. sidebar는 열린 workflow 탭의 줄을 표시하지 않는다(`workflow-shell`이 열린 workflow를 넘길 때 더한다). domain artifact의 kit 쓰는 법은 `roadmap/domain.md`다.
