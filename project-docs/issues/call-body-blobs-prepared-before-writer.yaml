id: call-body-blobs-prepared-before-writer
title: 본문과 고정 문구를 writer 앞 처리기에서 blob으로 미리 준비한다
kind: defect
status: kept
topic: agent-call
modules: [packages/core/main, packages/core/router]
now: |
  받는 session 기록의 본문이 blob이어야 하는데 tx 안에서는 blob을 못 만든다. 그래서 `main/daemon/wiring/router.ts`의 `createCallBodyPreparer`가 writer 앞에서 call 본문(redaction 포함)과 `FAILURE_TEXTS` 다섯 개(not_found, not_allowed, closed, receiver_ended, lophn_restarted)와 `CANCEL_TEXT`(빈 글)를 `prepareTexts`로 미리 blob에 둔다. `callSend`는 본문에 고정 문구 다섯을 모두 더해서 준비하고, 켤 때 `start`도 `lophn_restarted`를 따로 준비한다.
impact: |
  call 하나를 보낼 때마다 쓰지 않을 수도 있는 고정 문구 blob 쓰기가 같이 돈다. 새 고정 문구나 command를 더하면 이 처리기에도 이름을 더해야 한다(빠뜨리면 tx 안에서 실패).
fix: |
  - A. 고정 문구는 blob 대신 짧은 inline 글로 기록한다. 받는 session 기록의 message 꼴(blob 참조)을 바꾸는 계약 변경이라 읽는 쪽도 같이 고친다. 비용 큼.
  - B. 지금처럼 둔다. 고정 문구가 다섯 개뿐이라 실제 비용은 작다.
  - 추천: B. 이유를 `createCallBodyPreparer` 주석에 한 줄 더한다.
closed: |
  고정 문구가 다섯 개뿐이라 실제 비용이 작고, inline으로 바꾸려면 받는 session 기록의 message 꼴(계약)을 읽는 쪽까지 고쳐야 한다. 이유를 `createCallBodyPreparer` 주석에 둔다.
guard: 없음
