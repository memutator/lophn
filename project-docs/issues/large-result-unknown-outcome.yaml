id: large-result-unknown-outcome
title: changeset을 빼도 `result`가 control frame을 넘으면 결과 모름으로 닫힌다
kind: bug
status: fixed
topic: app-call
modules: [packages/core/apps]
now: |
  앱 호출 결과 값 상한 `RESULT_MAX_BYTES`(1MiB, `entrypoint/limits.ts`)가 응답이 지나는 control frame(256KiB)보다 크다. `fitChangeset`은 changeset만 빼므로 `result`가 256KiB 근처를 넘으면 relay가 응답을 거절하고 호출이 결과 모름(`unknown`)으로 닫힌다.
impact: |
  큰 읽기 결과를 내는 앱 호출이 실패가 아니라 결과 모름이 되고, write라면 rewind가 막힌다.
fix: |
  - `RESULT_MAX_BYTES`를 frame 한도 아래로 낮춘다(작음). 추천.
  - 응답을 bytes frame stream으로 보낸다(중간).
closed: |
  `RESULT_MAX_BYTES`는 `CALL_RESPONSE_MAX_BYTES - 1024`(결과 밖 칸 몫)라 상한 안의 결과는 changeset을 빼면 늘 control frame에 든다. 같은 이유로 입력 상한 `CALL_BODY_MAX_BYTES`도 `CONTROL_MAX_BYTES - 2 * 1024`(target·envelope 몫)로 낮췄고, core가 그보다 큰 입력은 보내기 전에 `invalid_input`으로 거절한다(`createAppProcessLink.call`). 큰 값은 blob이나 file로 넘긴다.
guard: packages/core/apps/runtime/entrypoint/fit_test.ts
