schema_version: 1
catalog: ../boundary-catalog.yaml
interfaces:
  - app-capability
  - app-direct-protocol
requirements:

  # 시작과 준비

  - id: req-0850
    status: accepted
    subject: app-runtime
    statement: 앱 하나당 운영 process는 많아야 하나이고, 이전 process의 종료를 확인하기 전에는 같은 DB를 쓰는 다음 process를 띄우지 않는다.
    acceptance:
      - 재시작과 activation을 겹쳐 요청해도 같은 DB에 쓰는 process가 둘이 되지 않는다.
      - activation 중 이전 process의 종료를 확인하기 전에 새 process가 시작되지 않는다.

  # 폐기: req-0860이 맡는다.
  - id: req-0851
    status: rejected
    subject: app-runtime
    statement: 앱 process는 시작할 때 현재 release와 현재 허용 범위를 받는다.
    acceptance:
      - release를 교체하고 허용 범위를 바꾼 뒤 시작하면 process가 새 release와 새 범위로 동작한다.

  # 폐기: handler와 선언의 일치는 release 준비의 필수 검사(core-app-releases req-0818)가 activation 전에 막고, 운영 앱은 그 고정 bundle만 돈다. 시작 실패를 관측해 보이는 것은 req-0936이 맡는다. bundle과 schema를 알리는 것은 구현 안의 확인이다.
  - id: req-0852
    status: rejected
    subject: app-runtime
    statement: 앱 process가 30초 안에 실제 bundle, handler 목록, data schema, 직접 연결 준비를 알리지 못하거나 실제 handler 목록이 blueprint와 다르면 시작 실패로 표시하고 이유를 보인다.
    acceptance:
      - handler 목록이 blueprint와 다른 앱과 응답하지 않는 앱을 각각 시작하면 30초 안에 unavailable과 시작 실패 이유가 보인다.

  - id: req-0853
    status: accepted
    subject: app-runtime
    statement: 시작 준비 중인 앱은 업무 쓰기와 외부 동작을 받지 않는다.
    acceptance:
      - 준비 중에 업무 쓰기를 부르면 거절된다.
      - 준비 중에 외부 동작을 부르면 거절된다.

  - id: req-0854
    status: accepted
    subject: app-runtime
    statement: 운영 앱은 prompt, 임의 설정, 원격 import, npm·jsr 다운로드 없이 미리 준비한 상대 코드와 고정된 SDK만으로 시작하고 실행한다.
    acceptance:
      - network가 없는 환경에서 설치한 앱이 시작한다.
      - remote, npm, jsr import를 시도하는 앱은 시작에 실패한다.
      - 준비된 상대 코드와 SDK를 import하는 앱은 시작한다.
      - 실행 중 원격 import는 거절된다.

  - id: req-0855
    status: accepted
    subject: app-runtime
    statement: 앱 process에는 lophn이 정한 환경 변수만 넘기고, 부모 환경(provider credential 포함)을 물려주지 않는다.
    acceptance:
      - 부모 환경에 넣은 API token이 앱 process의 환경에 없다.
      - 앱 process의 환경 변수가 lophn이 정한 목록과 같다.

  # 격리와 접근 경계

  - id: req-0856
    status: accepted
    subject: app-runtime
    statement: 앱 process의 기본 접근 범위는 자기 bundle 읽기와 자기 data 읽기·쓰기이고, lophn의 DB·credential 파일·제어 통로와 다른 앱의 저장소, source, log에는 닿지 못한다.
    acceptance:
      - 운영 중인 앱이 자기 data를 읽고 쓸 수 있다.
      - 앱 process에서 lophn 내부 DB나 credential 파일을 열면 거절된다.
      - core의 제어 통로에 직접 연결하면 거절된다.
      - 같은 앱이 source나 다른 앱의 DB에 접근하면 거절된다.

  - id: req-0857
    status: accepted
    subject: app-runtime
    statement: 앱 process는 prompt, 전체 접근, subprocess, FFI, 시스템 접근, 환경 전체 읽기를 쓸 수 없고, 앱의 DB migration 코드도 같은 경계 안에서 돈다.
    acceptance:
      - 파일 승인이 있어도 subprocess, native code, FFI는 거절된다.
      - migration 코드에서도 같다.

  # 폐기: test 격리는 req-0193(core-app-releases)이 맡는다.
  - id: req-0858
    status: rejected
    subject: app-runtime
    statement: 진단과 수리 시험을 돌려도 앱의 권한이나 lophn의 보호 경계는 넓어지지 않는다.
    acceptance:
      - 진단 runner가 다른 앱이나 lophn의 파일을 요청하면 거절된다.

  # 외부 접근 승인

  - id: req-0859
    status: accepted
    subject: app-runtime
    statement: "앱의 외부 파일·network·secret 접근은 blueprint가 선언하고 activation 때 사람이 허락하면 열리며, 선언만으로는 열리지 않는다."
    acceptance:
      - "선언만 하고 activation 허락 전인 접근은 쓸 수 없다."
      - "activation 때 허락한 접근은 호출마다 묻지 않고 쓴다."

  - id: req-0860
    status: accepted
    subject: app-runtime
    statement: "앱이 지금 쓸 수 있는 접근은 현재 release의 선언과 앱 grant의 교집합이다."
    acceptance:
      - "선언에 있지만 앱 grant에서 거둔 접근은 쓸 수 없다."
      - "grant는 있지만 지금 release가 선언하지 않은 접근은 쓸 수 없다."

  - id: req-0861
    status: accepted
    subject: app-runtime
    statement: 같은 범위를 선언한 뒤 release는 기존 승인을 그대로 쓰고, 새 host·port·경로·secret 이름은 새 사람 결정을 받아야 쓴다.
    acceptance:
      - 승인된 host·port는 새 release에서도 추가 결정 없이 연결된다.
      - 새 host·port는 새 승인 전까지 거절된다.

  - id: req-0862
    status: accepted
    subject: app-runtime
    statement: 외부 파일의 읽기와 쓰기는 따로 승인하며 실제 절대 경로와 그 하위에만 적용하고, 쓰기 승인은 읽기를 포함하지 않는다.
    acceptance:
      - 쓰기만 승인한 외부 파일을 읽으면 거절된다.
      - 승인한 경로와 이름 앞부분만 같은 다른 폴더에 접근하면 거절된다.

  # 폐기: 실제 경로 기준은 req-0862가 맡고, 경고는 화면 세부다.
  - id: req-0863
    status: rejected
    subject: app-runtime
    statement: 파일 승인의 home 축약, 상대 경로, symlink는 승인할 때 실제 절대 경로로 풀어 기준으로 삼고, 폴더 밖을 가리키는 symlink는 승인 화면에서 경고한다.
    acceptance:
      - 폴더 밖으로 향하는 symlink를 포함한 경로를 승인하면 경고가 보인다.
      - 승인 뒤 접근 판정은 풀린 실제 경로로 한다.

  - id: req-0864
    status: accepted
    subject: app-runtime
    statement: home 전체, SSH·AWS·GnuPG credential, keychain, lophn의 보호 경로, 그리고 다른 앱의 DB나 source를 품는 넓은 부모 경로는 승인으로도 열 수 없다.
    acceptance:
      - 다른 앱 폴더를 감싸는 부모 경로를 승인하려 하면 거절된다.
      - 민감한 credential 경로를 승인하려 하면 거절된다.

  - id: req-0865
    status: accepted
    subject: app-runtime
    statement: 외부 network 접근은 정확한 DNS host 또는 IP와 1부터 65535까지의 port 하나씩만 승인하며, localhost, 127.0.0.1, ::1은 서로 다른 host로 다룬다.
    acceptance:
      - wildcard, 모든 host, port 0, 전체 port를 청하면 거절된다.
      - 승인한 host·port로만 연결된다.
      - localhost만 승인한 앱이 127.0.0.1로 바꿔 접근하면 거절된다.

  # 폐기: 세부다.
  - id: req-0866
    status: rejected
    subject: app-runtime
    statement: network 선언의 주소와 port는 정해진 순서로 정규화하고, 잘못된 값과 중복 요청은 오류로 거절한다.
    acceptance:
      - 같은 선언을 다른 순서로 적어도 비교 결과가 같다.
      - 중복 주소와 잘못된 값은 거절된다.

  - id: req-0867
    status: accepted
    subject: app-runtime
    statement: 앱의 OAuth callback 듣기는 localhost, 127.0.0.1, ::1의 정해진 host와 port에서만 열린다.
    acceptance:
      - 승인한 localhost port의 callback 듣기가 열린다.
      - 0.0.0.0이나 외부 주소로 듣기를 청하면 거절된다.

  # 폐기: 세부다.
  - id: req-0868
    status: rejected
    subject: app-runtime
    statement: callback 듣기 승인은 그 앱 화면의 network 권한을 넓히지 않는다.
    acceptance:
      - callback 듣기를 승인한 앱의 화면이 같은 host·port로 연결하면 거절된다.

  # 폐기: req-0856(제어 통로에 닿지 못한다)이 맡는다.
  - id: req-0869
    status: rejected
    subject: app-runtime
    statement: 앱이 닿을 수 있는 모든 loopback host에서 lophn이 쓰는 port로의 연결은 막고, 듣기와 연결 방향을 구별해 강제할 수 없는 요청은 거절한다.
    acceptance:
      - callback port 듣기는 열려도 lophn이 쓰는 port로의 연결은 실패한다.
      - 방향을 구별할 수 없는 요청은 더 넓은 권한으로 바꿔 허용하지 않고 거절된다.

  # 폐기: 허락한 서버는 이미 data를 받으니 redirect를 막아도 막아지는 위험이 거의 없고, Deno가 redirect에도 net 권한을 검사한다.
  - id: req-0870
    status: rejected
    subject: app-runtime
    statement: 앱의 컴퓨터 밖 전송은 사람이 허용한 목적지 안에서만 하고, 전송과 redirect마다 목적지를 다시 검사한다.
    acceptance:
      - 승인하지 않은 host로 보내면 거절된다.
      - 승인한 host가 승인하지 않은 host로 redirect해도 따라가지 않고 거절된다.

  # 폐기: diagnostics req-0464를 뺀 것과 같은 이유다. 사람은 승인 화면에서 둘 다 본다.
  - id: req-0871
    status: rejected
    subject: app-runtime
    statement: 파일 읽기와 network 접근을 함께 청하면 자료가 밖으로 나갈 수 있는 조합임을 승인 request에 드러내고 자동으로 허락하지 않는다.
    acceptance:
      - 두 접근을 함께 청한 request에 조합 경고가 담긴다.
      - 사람의 승인 전에는 두 접근 모두 거절된다.

  - id: req-0872
    status: accepted
    subject: app-runtime
    statement: 이름별 선언과 사람의 승인이 있는 secret은 호출마다 확인하지 않고 쓰며, 누가 app-api를 불렀는지(사람 화면, agent, 다른 앱)로 막지 않는다.
    acceptance:
      - 승인된 앱의 app-api를 사람 화면, agent, 다른 앱이 불러도 secret이 붙는다.
      - 승인을 거두면 그다음 사용부터 거절된다.

  - id: req-0873
    status: accepted
    subject: app-runtime
    statement: "사람이 앱 grant를 거두면 새 호출부터 막고 이전 process 종료를 확인한 뒤 새 범위로 다시 시작하며, agent grant를 거두면 그 agent의 새 호출부터 막는다."
    acceptance:
      - "앱 grant를 거두는 중 이전 process의 종료가 확인되기 전에는 새 process가 뜨지 않는다."
      - "새 process는 새 범위의 접근만 갖는다."
      - "agent grant를 거두면 그 agent의 다음 호출이 막힌다."

  # 폐기: secrets req-0409를 뺀 것과 같은 이유다.
  - id: req-0874
    status: rejected
    subject: app-runtime
    statement: 승인 변경과 회수는 요청을 받은 것과 실제로 적용된 것을 구별해 알리고, 이전 process의 종료를 확인하기 전에는 적용된 것으로 알리지 않는다.
    acceptance:
      - 종료 확인을 지연시키면 회수가 진행 중으로 보인다.
      - 종료가 확인된 뒤에 회수 완료가 된다.
      - A에서 B로의 승인을 거두는 동안 A의 종료를 확인하지 못하면 진행 중으로 보인다.

  # 폐기: 당연한 동작이다.
  - id: req-0875
    status: rejected
    subject: app-runtime
    statement: 권한 회수는 회수 전에 이미 일어난 업무 쓰기와 외부 요청을 취소한 것으로 다루지 않는다.
    acceptance:
      - 전송한 뒤 권한을 회수해도 그 전송은 일어난 사실로 남는다.

  # agent의 앱 app-api 호출

  # 폐기: approvals req-1493(할당 때의 agent grant)이 맡는다.
  - id: req-0876
    status: rejected
    subject: app-runtime
    statement: agent가 앱 app-api를 부르는 승인은 앱마다 사람이 정확한 app-api 목록을 열어야 생기고, 앱 사이 호출 승인이나 화면 열기와 따로 기록한다.
    acceptance:
      - 앱을 열거나 앱 사이 호출을 승인해도 agent의 호출은 거절된다.
      - 사람이 따로 승인한 app-api만 agent가 부를 수 있다.

  # 폐기: approvals req-1492, req-1493이 맡는다.
  - id: req-0877
    status: rejected
    subject: app-runtime
    statement: agent가 실제로 부를 수 있는 앱 app-api는 앱의 agent 승인, 앱이 지금 선언한 app-api, 그 agent 정의가 허용하는 범위의 교집합이다.
    acceptance:
      - 같은 앱 승인이라도 agent 정의마다 허용된 app-api만 보인다.
      - 앱이 더는 선언하지 않는 app-api는 승인이 남아 있어도 호출되지 않는다.
    related:
      - agent-tools

  # app-api 호출

  - id: req-0878
    status: accepted
    subject: app-runtime
    statement: "app-api 호출의 효과는 호출자의 주장이 아니라 활성 release의 blueprint 선언에서 읽는다."
    acceptance:
      - "호출자가 다른 효과를 내세워도 판정은 활성 release의 선언을 따른다."

  - id: req-0879
    status: accepted
    subject: app-runtime
    statement: app-api 입력은 검증, 기본값 적용, 정규화를 거친 뒤 확인과 실행의 기준이 된다.
    acceptance:
      - 기본값을 생략한 입력과 기본값을 적은 입력은 같은 확인 대상으로 판정된다.
      - 사람이 확인한 입력과 실행한 입력이 같다.

  # 직접 통로

  # 폐기: 구현 품질이다(기준 5). 판정은 req-0860과 approvals req-1492가 맡는다.
  - id: req-0880
    status: rejected
    subject: app-capability
    statement: 앱의 capability 통로는 그 사용자 계정만 닿을 수 있는 로컬 통로이고 network로 열리지 않는다.
    acceptance:
      - 다른 사용자 계정이 연결하면 거절된다.
      - network 주소로는 연결할 수 없다.

  # 폐기: 구현 품질이다(기준 5). 판정은 req-0860과 approvals req-1492가 맡는다.
  - id: req-0881
    status: rejected
    subject: app-capability
    statement: capability 호출은 호출한 앱의 현재 선언과 승인에 대조해 판정하고, SDK의 capability client를 import했다는 사실만으로는 권한이 생기지 않는다.
    acceptance:
      - 선언과 승인이 없는 앱이 capability client를 import해 호출하면 거절된다.
      - 선언과 승인이 있는 앱의 같은 호출은 허용된다.

  # 폐기: 구현 품질이다(기준 5). 판정은 req-0860과 approvals req-1492가 맡는다.
  - id: req-0882
    status: rejected
    subject: app-capability
    statement: 거절된 capability 호출의 오류에는 필요한 permission 이름과 범위가 담긴다.
    acceptance:
      - 승인되지 않은 파일 경로나 network 대상을 청하면 오류에 필요한 permission 이름과 범위가 담긴다.

  # 폐기: 직접 통로를 없앤다. app-api 호출은 core를 거친다(req-0887).
  - id: req-0883
    status: rejected
    subject: app-direct-protocol
    statement: 앱 화면과 app-api의 직접 통로도 그 사용자 계정만 닿을 수 있는 로컬 통로이고, 통로의 위치는 앱 화면에 알려지지 않는다.
    acceptance:
      - 다른 사용자 계정이 연결하면 거절된다.
      - 앱 화면의 코드에서 통로 위치를 읽을 수 없다.

  # 폐기: 직접 통로를 없앤다. app-api 호출은 core를 거친다(req-0887).
  - id: req-0884
    status: rejected
    subject: app-runtime
    statement: 통로가 놓이는 디렉터리는 그 사용자만 쓸 수 있고(0700), 앱 이름이 길어도 통로 경로가 길이 한도를 넘지 않는다.
    acceptance:
      - 런타임 디렉터리가 없는 환경에서도 사용자 전용 디렉터리에 통로가 열린다.
      - 긴 앱 이름으로도 앱이 시작한다.

