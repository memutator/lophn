id: app-a2a
version: 0.23.35
title: "앱이 A2A와 ACP에 선다: agent에게 call을 보내고 답을 받고, session을 열고 끝내고, 보이는 session에 붙는다"
modules: [packages/protocol, packages/core/router, packages/core/lophn-agent, packages/core/main, packages/core/apps, packages/core/storage, packages/sdk, packages/shell/main, packages/shell/preload, packages/shell/ipc, packages/shell/renderer, packages/core/agent-workspaces]
checked: []
change: |
  전: 앱은 agent를 화면의 채팅 session으로만 부렸다. 앱이 연 session은 shell 메모리가 기억했고, 앱 화면은 자기 앱 workspace의 session에만 붙었다.
  후:
  - Router의 보낸 쪽에 `app`이 생겼다(`{kind: app, app, slug}`). 앱 화면이 부르면 shell main이 sender view에서 앱을 정하고 core wiring이 core 안 machine 명령 `calls.app-send|app-cancel`로 Router에 넣는다. 앱 process에는 이 길이 없다(view-first: AI가 만든 process가 상한 없이 unattended turn을 열 수 없게). 시야는 call 정책의 workspace 규칙(`mayReachWorkspace`)이고 agent 쌍·팀 규칙은 없다. 받는 agent 명함 검사는 같다. workspace를 뺀 call은 그 앱 workspace에 열리고 `{home: true}`로 Home(전역 agent)을 밝혀 적을 수 있다(같은 정책). reply는 none과 result뿐이고 모든 앱 call은 attended다. 선택 `key`는 `(from_app, dedup)` unique index와 Router의 dedup 경로로 첫 call을 돌려준다(SDK가 send마다 만든다).
  - 받은 message의 `from_kind`에 `app`이 더해졌다. `from_ref`는 `<앱 id>|<slug>`이고 입력 tag는 `from="app:<slug>"`이고 끝의 고정 줄은 앱이 보냈다고 말한다(agent의 줄은 byte 그대로). slug를 message에 얼려 이력 재생 bytes가 같다. harness GUI는 `app:` 보낸 쪽을 앱 sender로 읽는다(tag에 앱 id가 없어 sender의 app은 null일 수 있다). 시스템 prompt와 `lophn-agent` skill에 `from="app:<slug>"`를 적었다. ACP message sender에 `{kind: app, app, name}`이 더해졌고(SDK `acp-types` 사본과 type 대조 포함) 채팅의 보낸 쪽 chip이 slug를 보인다.
  - ledger step 셋: `router.app-sender.messages`(messages 표를 다시 짜 from_kind에 app. checkpoints·reverts가 `on delete restrict`로 걸려 FK를 끄고 도는 step을 위해 적용기가 `foreignKeys: "off"` step을 지원한다: step 앞뒤로 FK를 끄고 켜고 commit 전에 foreign_key_check. 이 flag는 hash에 들어가고, 다시 켜지 못하면 오류로 올린다), `router.app-sender.agent-calls`(보낸 쪽이 session이거나 앱, 답 글 `result`, 앱 dedup unique index), `router.app-sender.session-opener`(`sessions.opened_by_app`와 변경 막기). 파일 ledger로 행·index·trigger·FK가 그대로인지 보는 test를 더했다.
  - 답: 앱에는 입력함이 없어 result call의 답은 call 행의 글(`result`, 글 block만)로 남고, 끝남(답, 실패, 취소, 답 없는 call의 소비)은 발행자 `lophn`의 `call.settled`(call, state, fail_reason)가 그 앱에만 간다. 앱은 `app_calls.read`로 읽는다.
  - route(actor user, shell main이 앱 화면을 대신한다): `app_calls.send|read|cancel|list`(list는 받은 call과 보낸 call), `app_agents.list`(reader `agents.cards`로 한 번에 명함), `app_sessions.open|end`. `app_sessions.list`(actor app·user)에 `session` 한 건 거르기. 앱 화면은 한 IPC 통로 `app:agents`(`{op, input}`)와 `lophnApp.calls|agents|sessions.end`, `lophnApp.agent.open({workspace?})`로 부른다. 앱 process는 stage 2의 `sessions.list|status|stop` 말고 쓸 수 있는 길이 없다(broker·자식 credential 허용 목록에 더하지 않았다).
  - 앱이 연 session: 새 machine 명령 `OpenAppSession`이 `opened_by_app`(바뀌지 않는다)을 단다(사람 자격 `OpenSession`은 표시를 받지 않는다). 앱이 call로 열게 한 session도 같다. `app_sessions.open`은 call 정책이 닿게 허락한 workspace에 열 수 있다. 앱은 자기가 연 session만 `ArchiveSession`과 같은 영향으로 끝낸다. 알림 규칙은 shell 메모리 집합 대신 core의 `opened_by_app`을 읽는다(shell을 다시 켜도 남는다. turn 끝 알림 억제가 영구해졌다).
  - ACP 붙이기: 앱 화면은 그 앱에 보이는 lophn·harness session이면 workspace와 상관없이 `snapshot`·`send`한다(읽을 때마다 core에 묻는다, 터미널 `term:` 거절). 입력은 `send|stop|answer|rename` 그대로다.
  - 지움: 받은 session을 지우면(`DeleteSession`) 그 session이 받은 앱 call 행(답 글)이 같이 지워지고, 앱을 지우면 그 앱이 보낸 call 행이 지워진다.
  - SDK `@lophn/agent` 1.12.0(화면 전용): `calls`(send에 key), `useAgentCalls`, `useAgents`, `onCallSettled`, `useSessions().end`, `useAgentSession({workspace})`. process 입구는 stage 2 그대로다. 지침(guide)과 migrate 메모(`agent-1.12.0`)를 더했다.
why: 앱의 process가 agent에게 일을 맡기고 결과를 받을 길이 없었다. 앱을 agent와 같은 보낸 쪽으로 세우면 시야·명함·실패·취소가 한 벌이다. 앱의 session을 ledger가 알게 해 shell 메모리와 두 곳으로 갈리던 것을 없앴다.
decisions:
  - text: "앱을 Router의 보낸 쪽으로 둔다(앱 전용 입구를 만들지 않는다). 시야는 agent 쌍 규칙과 팀 규칙 없이 workspace 규칙만 쓴다."
    by: person
  - text: "보낸 쪽 식별은 message `from_ref`와 call 행에 `<앱 id>|<slug>`로 얼린다. 앱 이름이 바뀌어도 이력 tag bytes가 같다. 버린 길: 읽을 때 slug를 조회(이력 bytes가 바뀐다)."
    by: agent
  - text: "앱의 답은 call 행의 글로 둔다(message 아님). 앱에 session이 없고 읽는 길이 한 곳이다. 글 block만 담는다(알려진 한계). `call.settled` event는 본문 없이 알림만 한다."
    by: agent
  - text: "앱이 보내는 reply는 none과 result뿐이다. 앱 call은 선택 key로 dedup한다(같은 앱의 같은 key는 첫 call)."
    by: agent
  - text: "call 보내기와 session 열기·끝내기는 앱 화면만 한다(view-first, roadmap의 하지 않는 것). 앱 process가 보내면 상한 없이 unattended turn을 열 수 있다. 모든 앱 call은 attended다."
    by: person
  - text: "messages를 다시 짜는 step은 FK 자식(checkpoints·reverts)이 restrict라 `foreignKeys: off` step 종류를 더해 적용기가 FK를 끄고 돌린다. 버린 길: 자식 다섯 표를 모두 다시 짜기, writable_schema로 표 정의 고치기."
    by: agent
  - text: "앱이 끝낼 수 있는 session은 자기가 연 것뿐이다(`opened_by_app`). 앱이 연 session은 turn 끝 알림을 내지 않는다(승인·질문은 낸다)."
    by: person
  - text: "ACP 붙이기는 보이는 모든 lophn·harness session이고 입력 허용 목록은 그대로다. 터미널 탭은 ACP session이 아니라 거절한다."
    by: person
follow_up: |
  - result의 글이 아닌 block(이미지·파일 참조)은 앱에 담기지 않는다.
  - 정책이 바뀌어 안 보이게 된 session의 이미 붙은 화면 갱신은 그 화면이 다시 읽을 때까지 이어진다.
  - 켤 때 닫힌 call(`lophn_restarted`)의 `call.settled`는 가지 않는다(앱이 read로 읽는다).
  - 진짜 Electron 창에서 앱 화면의 call·session 길은 사람이 아직 보지 않았다(core는 throwaway harness로 끝까지 확인).
