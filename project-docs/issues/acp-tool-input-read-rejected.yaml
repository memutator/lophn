id: acp-tool-input-read-rejected
title: 대화 화면의 질문 요약이 답한 뒤 "Answered 0 questions"로 보인다
kind: bug
status: fixed
topic: acp
modules: [packages/core/main, packages/protocol]
now: |
  ACP는 `ask`·`call.send`·`file.edit` tool 줄의 칸(질문 header와 답, 받는 쪽과 맡긴 일, 편집 path와 줄 수)을 tool 입력 본문에서 뽑는다(`packages/core/main/daemon/wiring/acp-build.ts`의 `toolDetailOf`가 `bodyOf(env, "tool_call_input", …)`로 `turns/body`를 읽는다). core의 읽기(`packages/core/lophn-agent/run-loop/turn-body-reads.ts`의 `SOURCES`)는 `tool_call_input`을 알지만 route 입력 schema(`packages/protocol/lophn-agent/turn-reads.ts`의 `TURN_BODY_KINDS`)에 그 값이 없어 모든 입력 읽기가 `invalid_input`으로 거절됐다. 결과 본문은 읽혀서 질문 묶음은 outcome `submitted`에 줄이 0개가 됐다. ACP 단위 test의 가짜 읽기는 route schema를 거치지 않아 이 거절을 몰랐다.
impact: |
  사람이 lophn agent의 질문에 답해도 대화에 "Answered 0 questions"만 남고 무엇을 답했는지 볼 수 없다. 탭을 다시 열거나 앱을 다시 켜도 같다. 같은 이유로 call 카드의 받는 쪽·맡긴 일과 edit 카드의 path·줄 수도 비어 있었다.
fix: |
  - `TURN_BODY_KINDS`와 id prefix에 `tool_call_input`을 더한다. 작음. 추천.
closed: |
  `turns/body`가 `tool_call_input`을 받는다. ACP의 질문 줄은 질문 header마다 답을, call·edit 카드는 입력에서 뽑은 칸을 다시 보인다. ACP test의 가짜 읽기는 route 입력 schema로 먼저 거른다.
guard: packages/core/main/daemon/wiring/acp-build_test.ts "tool의 종류는 시작 때부터 있고 실패해도 지킨다"
