  - id: assignment-set
    title: 사람이 agent에게 앱을 붙이고 그 앱에서 뺄 command를 고른다
    actor: person
    entries: [route:agent_assignments/set]
    pre: [route:agent_assignments/get]
    boundary: [approvals, agents]
    code: [packages/core/approvals/assignment/commands.ts, packages/core/main/daemon/wiring/assignment-file.ts, packages/core/lophn-agent/agents/store.ts]
    steps:
      - "사람만 바꾼다. route의 actors와 handler가 같이 막는다."
      - "revision을 비교한다. 화면이 읽은 값과 다르면 conflict이고, 화면이 다시 읽는다."
      - "앱 id는 slug로, 뺀 command는 `lophn(<slug> <command>)` deny 규칙으로 바꾼다. 없는 앱과 active 선언에 없는 command는 버린다(조용히 빠진다)."
      - "agent 정의 파일의 `apps`와 `permissions.deny`만 다시 쓴다. 이 할당이 다루는 옛 앱과 새 앱의 command 규칙만 바꾸고 그 밖의 deny 규칙은 지킨다. 본문과 다른 칸은 그대로다."
      - "정의 파일이 없는 agent면 not_found다. 아무것도 쓰지 않는다."
      - "쓴 뒤 다시 읽은 할당과 새 revision을 돌려준다."
    outcomes:
      - id: saved
        observe: ["disk:agents/<agent>.md", "response"]
      - id: conflict
        code: conflict
        when: "revision이 화면이 읽은 값과 다름"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "agent가 없거나 agent 정의 파일이 없음"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님"
        observe: ["response"]
      - id: file-unavailable
        code: unavailable
        when: "정의 파일이나 ledger 위치를 읽거나 쓰지 못함"
        observe: ["response"]
      - id: definition-invalid
        code: invalid_input
        when: "정의 파일이 정의 schema로 읽히지 않아 다시 쓰지 못함"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    refs: ["P4", "G1", "C25"]
    docs: [architecture/approval.md, architecture/agent-definition.md]
    unclear:
      - "정의 파일 쓰기는 ledger transaction 안에서 일어나고 파일은 transaction으로 되돌아가지 않는다(store.ts는 읽기·쓰기 실패를 unavailable로, 파일 parse 실패를 invalid_input으로 낸다)."

  - id: assignment-file-migrate
    title: 옛 agent_assignments 표의 할당을 agent 정의 파일로 옮기고 deny 규칙을 앱 slug로 바꾼다
    actor: system
    entries: [system:assignment-file]
    boundary: [storage, agents]
    code: [packages/core/main/daemon/wiring/assignment-file.ts, packages/core/storage/migration/]
    steps:
      - "옛 표의 schema step(id `agent_assignments`)은 목록에 남는다. 이미 적용한 ledger가 그 id를 기록하고 있어 빼면 기동을 거절한다."
      - "data step `approvals.assignment-file`이 표 줄마다 agent 정의 파일에 `apps`와 `permissions.deny`를 쓰고 표를 지운다. 쓰기는 줄의 값으로 두 칸을 통째로 바꾼다."
      - "앱이 없는 줄, active 선언에 없는 command, 정의 파일이 없거나 틀린 agent의 줄은 버린다."
      - "뒤의 data step `approvals.deny-rule-slug`가 파일의 `lophn(<domain> <낱말>)` 규칙을 앱 slug로 바꾼다. 못 찾은 규칙은 그대로다."
      - "순서는 `agents.skills-off`(옛 `skills`를 옮김)가 먼저다. 순서가 바뀌면 옛 `skills`가 남은 파일이 거절되어 할당이 버려진다(approval.md의 주장, assembly.ts는 확인하지 않았다)."
    outcomes:
      - id: moved
        observe: ["disk:agents/<agent>.md", "ledger:agent_assignments"]
      - id: row-dropped
        when: "쓸 곳이 없는 줄(앱 없음, command 없음, 정의 파일 없음·틀림)은 버리고 표는 지운다"
        observe: ["ledger:agent_assignments"]
      - id: deny-rule-slugged
        when: "파일의 lophn(<domain>) 규칙이 앱 slug로 바뀜"
        observe: ["disk:agents/<agent>.md"]
      - id: step-failed
        code: unavailable
        when: "ledger를 열지 못함, 앱·선언을 읽지 못함(그 오류 code가 그대로 감), 정의 파일을 읽거나 쓰지 못함(unavailable). 표는 남고 다음 기동이 다시 한다"
        observe: ["log:data-step"]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/approval.md, architecture/agent-definition.md]
    unclear:
      - "옛 표 줄이 있는 agent 파일의 `apps`와 `permissions.deny`를 표 값으로 통째로 바꾼다(store.ts writeAgentAssignment가 두 칸을 줄 값으로 덮는다, 사람이 `assignment-set`으로 쓴 길처럼 그 밖의 deny 규칙을 지키지 않는다). 표에 없는 앱이나 deny 규칙이 파일에 있었다면 사라진다. 옛 쓰기가 파일과 표를 항상 같이 썼는지 확인하지 못했다. 사람이 확인할 일이다."
      - "data step이 실패하면 기동을 막는지는 storage/migration의 규칙이라 확인하지 않았다."

  - id: share-request-open
    title: 앱 workspace의 agent가 그 앱을 다른 agent와 coding agent에게 공유하도록 청한다
    actor: agent
    entries: [route:share_requests/open]
    boundary: [approvals, app-runtime]
    code: [packages/core/approvals/share-requests/commands.ts, packages/core/approvals/share-requests/schema.ts, packages/core/main/daemon/wiring/share-requests.ts]
    steps:
      - "agent 자격만 받는다(`lophn app share`가 부른다). 사람이나 program이 부르면 forbidden이다."
      - "앱은 입력이 아니다. credential의 `conditions.app`이 고정한 앱이고, 앱 workspace가 아니면 forbidden이다."
      - "받을 agent id가 없으면 invalid_input이다. 받을 agent도 coding agent도 없는 요청은 schema가 막는다."
      - "`share_requests` 표에 앱마다 한 줄로 쓴다. 같은 앱의 열린 요청이 있으면 새 요청이 대신한다. turn이 끝나도 재시작해도 남는다."
      - "어느 agent의 정의도 바꾸지 않는다. commit 뒤 ShareRequestOpened(앱 이름)를 Bus로 낸다."
    outcomes:
      - id: opened
        when: "새 요청을 쓰거나 같은 앱의 열린 요청을 대신함"
        observe: ["ledger:share_requests", "event:ShareRequestOpened", "response"]
      - id: forbidden
        code: forbidden
        when: "agent 자격이 아니거나 앱 workspace 밖의 session"
