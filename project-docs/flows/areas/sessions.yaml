  # ---- 사람의 ! 명령과 ACP 화면 조작 ----
  - id: acp-read
    title: "화면이 한 session의 대화 상태(ACP snapshot)나 첫 메시지 전 session 설정(draft)을 읽는다"
    actor: person
    entries: [route:acp/snapshot, route:acp/draft]
    boundary: [acp, agent-sessions]
    code:
      - packages/core/main/daemon/wiring/acp.ts
      - packages/core/main/daemon/wiring/acp-build.ts
      - packages/protocol/acp/routes.ts
      - packages/protocol/acp/reduce.ts
    steps:
      - "snapshot은 session의 메시지, turn, tool 호출, 숨긴 구간을 읽어 ACP 항목과 순번(seq)으로 조립한다. 메시지 본문은 blob 읽기로 가져오고, 못 읽으면 그 항목은 본문 없이 낸다(오류로 돌려주지 않는다). 쓰는 중인 글과 queue, 대기 승인·질문을 더한다."
      - "나가는 글은 지금의 redaction을 거친다. 알려진 값을 다 모르면 글을 비운다."
      - "draft는 session 없이 agent와 workspace로 model 묶음과 명령 목록을 읽는다(title, usage, cli_session은 null)."
      - "화면은 갱신을 접는 reducer(reduce.ts)로 상태를 맞춘다. 순번이 빠지거나 글 offset이 맞지 않으면 reread를 세우고, 그때 화면이 이 snapshot을 다시 읽는다."
    outcomes:
      - id: ok
        observe: [response]
        when: "상태나 설정을 돌려줬다(못 읽은 메시지 본문은 글 없이 낸다)"
      - id: reread
        observe: []
        when: "화면의 접기가 순번 빈틈, 글 offset 어긋남, 첫 갱신의 칸 누락으로 reread를 세웠다(화면이 snapshot을 다시 읽는다. 그 읽기는 ok다)"
      - id: not_found
        code: not_found
        when: "snapshot의 session이 없거나 보이지 않는다(메시지 목록이나 turn 목록 read가 낸 not_found)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "입력 schema가 맞지 않는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: true
    risk: [secret]
    docs: [architecture/acp.md]
    unclear: []

  - id: acp-send
    title: "화면의 대화 조작 하나(ACP 입력)를 지금 있는 route로 넘긴다"
    actor: person
    entries: [route:acp/send]
    uses:
      - route:messages/send
      - route:session_inputs/steer_now
      - route:session_inputs/remove
      - route:session_inputs/edit
      - route:session_inputs/move
      - route:sessions/change-model
      - route:sessions/change-skip
      - route:sessions/request-compact
      - route:sessions/rename
      - route:sessions/fork
      - route:sessions/read
      - route:turns/stop
      - route:ask/answer
      - route:turn_requests/decide
      - route:rewind/preview
      - route:rewind/apply
    boundary: [acp, agent-sessions]
    code:
      - packages/core/main/daemon/wiring/acp-send.ts
      - packages/core/main/daemon/wiring/acp.ts
    steps:
      - "입력 꼴을 schema로 검사하고 부른 사람의 자격을 그대로 넘긴다. core 안 machine 자격으로 대신 부르지 않는다."
      - "send는 messages/send, stop은 turns/stop, 묻기 답은 ask/answer, 승인은 turn_requests/decide, 줄 고치기 넷은 session_inputs, model·mode·이름·compact·fork·rewind는 각 route로 간다. send·retry·run_command는 본문 준비(I/O)를 거치므로 이 flow도 crosses_process다."
      - "run_shell은 shell-run flow가 맡고, 내장 명령 이름을 run_command로 보내면 거절한다(화면이 opens로 처리한다)."
      - "lophn agent에 없는 입력(stop_child, steer_child, stop_task, background_tool, stop_shell, set_toggle, set_goal, use_role, open_session)과 harness session의 send_queued는 unavailable로 막는다."
      - "send 입력의 seen(화면이 아는 마지막 사람 메시지, null은 하나도 못 봄, 없으면 검사하지 않음)은 messages/send로 그대로 넘긴다. harness(coding agent) session의 send는 relay가 받아 seen을 보지 않는다."
      - "fork는 답에 새 session id를 싣는다. 나머지는 가는 route의 답을 그대로 준다."
    outcomes:
      - id: ok
        observe: [response]
        when: "가는 route가 성공했다(fork는 새 session id를 싣는다)"
      - id: invalid_input
        code: invalid_input
        when: "입력 schema가 틀렸다, 내장 명령을 run_command로 보냈다, model id에 provider가 없다, mode가 ask·skip이 아니다, 제목이 비었다, decide가 session이나 mode 범위를 싣는다, retry할 본문이 비었다, 또는 가는 route가 입력을 거절했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "lophn agent에 없는 입력이거나 harness session의 send_queued다, 또는 가는 route나 memory handler가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "가는 route가 부른 사람의 자격을 거절했다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "가는 route가 session이나 대상을 못 찾았다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "가는 route가 충돌을 돌려줬다(도는 turn이 없어 steer가 안 됨, 이미 가져간 메시지, rewind blocked)"
        observe: [response]
      - id: changed-elsewhere
        code: conflict
