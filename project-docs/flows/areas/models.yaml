    entries: [route:provider-credentials/refresh-result]
    uses: [route:provider-credentials/record-models, route:issuer-requests/take, route:issuer-requests/done]
    boundary: [models, secrets]
    code: [packages/core/lophn-agent/providers/oauth-refresh.ts, packages/core/lophn-agent/providers/oauth-secrets.ts, packages/core/main/daemon/wiring/lophn-agent-runtime.ts]
    steps:
      - "agent runtime이 provider.<id>의 값을 청할 때 secret 부착의 provider hook이 부른다. 만료가 5분 안이면 갱신하고 아니면 지금 token을 그대로 건넨다"
      - "provider마다 한 번에 하나만 돈다. refresh_token grant를 발급자 요청 대기열(agent runtime)로 보낸다"
      - "회전한 refresh token을 먼저 secrets.json에 저장하고 access token을 저장한 뒤 refresh-result로 만료 시각을 기록한다"
      - "발급자가 400·401·invalid_grant로 거절하면 credential을 revoked로 기록하고 token은 건네지 않는다. 기록 revision이 바뀌었으면 한 번 다시 읽어 기록한다"
      - "ChatGPT나 Antigravity 계정의 model 목록은 token을 건넨 뒤 뒤에서 읽는다. 실패는 삼킨다"
    outcomes:
      - id: refreshed
        observe: ["ledger:provider_credentials", "disk:<root>/secrets.json", "request:issuer"]
      - id: still-valid
        when: "발급자에 닿지 못했거나 응답이 이상했지만 지금 token이 아직 살아 있다. 아무것도 기록하지 않고 token을 건넨다"
        observe: ["request:issuer"]
      - id: revoked
        code: forbidden
        when: "발급자가 grant를 거절했다. credential을 revoked로 기록하고 다시 로그인하라고 답한다"
        observe: ["ledger:provider_credentials", "request:issuer"]
      - id: unavailable
        code: unavailable
        when: "저장된 token이 없다, Antigravity 계정에 project가 없다, token 저장이 3번 다 실패했다, 만료됐는데 갱신하지 못했다, 연결이 그 사이 바뀌었다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "두 번 기록해도 revision이 맞지 않는다"
        observe: ["response"]
    crosses_process: true
    risk: [secret, data-loss]
    refs: []
    docs: []
    unclear: []

  - id: provider-availability-record
    title: "실패 판정을 provider credential의 사용 가능 상태로 기록한다"
    actor: system
    entries: [route:provider-credentials/record-availability]
    boundary: [models]
    code: [packages/core/lophn-agent/providers/commands.ts, packages/core/lophn-agent/providers/credentials.ts, packages/core/lophn-agent/providers/failures.ts]
    steps:
      - "provider revision이 요청과 같은지 본다. 다르면 conflict다"
      - "상태 전이를 정한다. revoked는 Disconnect 뒤 Connect로만 벗어나므로 되살리려 하면 conflict다"
      - "credential 상태와 until, revision을 바꾸고, model 전용 block이 있으면 그 model 줄만 바꾼다. provider revision을 올린다"
    outcomes:
      - id: recorded
        observe: ["ledger:provider_credentials", "ledger:provider_credential_model_blocks", "response"]
      - id: not_found
        code: not_found
        when: "provider가 없다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "revision이 바뀌었거나 revoked credential을 되살리려 한다"
        observe: ["response"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear:
      - "이 route를 부르는 코드가 저장소에 없다. 실패 분류(failures.ts)는 만들어지지만 run-loop는 credential 상태를 바꾸지 않는다. 호출자가 아직 없는지 확인해야 한다"

  - id: provider-login-start
    title: "구독 계정 로그인을 시작하고 사람이 열 주소를 받는다"
    actor: person
    entries: [route:providers/login-begin]
    uses: [route:issuer-requests/take, route:issuer-requests/done]
    boundary: [models]
    code: [packages/core/lophn-agent/providers/login.ts, packages/core/lophn-agent/providers/oauth.ts, packages/core/lophn-agent/providers/oauth-chatgpt.ts, packages/core/lophn-agent/providers/oauth-claude.ts, packages/core/lophn-agent/providers/oauth-antigravity.ts]
    steps:
      - "정의에 OAuth 로그인이 있고 endpoint가 맞는지 본다. provider는 아직 없다. 로그인이 끝나면 core가 Connect한다"
      - "PKCE 제품(ChatGPT, Claude, Antigravity)은 정의된 고정 callback port에 loopback listener를 먼저 열고 S256 challenge와 state로 주소를 만든다"
      - "device code 제품(SuperGrok)은 발급자의 device 주소를 대기열로 불러 user code와 확인 주소를 받는다"
      - "로그인 세션(state, verifier, device code)은 메모리에만 두고 기한을 정한다. ledger, event, log에는 쓰지 않는다"
    outcomes:
      - id: started
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "정의된 callback port를 다른 프로그램이 쓰고 있다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "정의에 OAuth 로그인이 없거나 endpoint와 protocol이 정의 밖이다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "발급자가 device code를 주지 않았거나 응답에 값이 모자라거나 8초 안에 발급자 답이 없다"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: []
    docs: []
    unclear: []

  - id: provider-login-finish
    title: "구독 로그인이 끝났는지 보고 끝났으면 token을 저장하고 provider를 연결한다"
    actor: person
    entries: [route:providers/login-complete]
    uses: [route:provider-credentials/record-models, route:issuer-requests/take, route:issuer-requests/done]
    boundary: [models, secrets]
    code: [packages/core/lophn-agent/providers/login.ts, packages/core/lophn-agent/providers/oauth.ts, packages/core/lophn-agent/providers/oauth-secrets.ts, packages/core/lophn-agent/providers/oauth-chatgpt.ts, packages/core/lophn-agent/providers/oauth-claude.ts, packages/core/lophn-agent/providers/oauth-antigravity.ts]
    steps:
      - "세션을 찾는다. 없거나 device 기한이 지났으면 not_found다. 아직 기다리는 중이면 pending과 다음 간격을 돌려준다"
      - "PKCE는 callback이 왔는지 보고 state를 확인한다. device code는 token endpoint를 한 번 poll한다. slow_down이면 간격을 늘린다"
      - "token을 받으면 refresh, meta, access 세 이름을 secrets.json에 쓴 뒤 같은 정보로 ConnectProvider를 부른다"
      - "Connect가 실패하면 conflict가 아닐 때 token 세 이름을 지운다. 연결이 되면 계정 model 목록을 뒤에서 읽어 record-models로 저장한다"
    outcomes:
      - id: pending
        observe: ["response"]
      - id: connected
        observe: ["disk:<root>/secrets.json", "ledger:providers", "ledger:provider_credentials", "response"]
      - id: not_found
        code: not_found
        when: "로그인 세션이 없거나 device 기한이 지났다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "callback이 아직 안 왔다, state가 이 시도의 것이 아니다, 발급자가 거절했다, token 응답에 access나 refresh가 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "발급자에 닿지 못했다, token 교환이 실패했다, token을 secrets.json에 쓰지 못했다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "같은 id의 provider가 이미 있다. token 세 이름은 지우지 않는다"
        observe: ["disk:<root>/secrets.json", "response"]
    crosses_process: true
    risk: [secret, data-loss]
    refs: []
    docs: []
    unclear:
      - "conflict 경로에서 token 저장(login.ts saveProviderTokens)이 Connect보다 먼저라 같은 id의 기존 provider의 token 세 이름이 새 로그인의 값으로 이미 덮인 뒤 conflict가 난다. 코드 주석의 '지우지 않는다'는 지우는 일만 피한 것이다. login-begin이 provider id의 존재를 보지 않아 호출하는 쪽이 id를 다시 쓸 때만 닿는다"
      - "SuperGrok은 계정 정보가 없어 model 목록을 읽지 않는다. ChatGPT는 Codex 목록을, Antigravity는 project의 roster를 뒤에서 읽는다"

  - id: provider-login-cancel
    title: "기다리는 구독 계정 로그인을 그만둔다"
    actor: person
    entries: [route:providers/login-cancel]
    boundary: [models]
    code: [packages/core/lophn-agent/providers/login.ts, packages/core/lophn-agent/providers/oauth.ts]
    steps:
