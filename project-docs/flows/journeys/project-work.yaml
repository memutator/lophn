group: project-work
journeys:
  - id: project-register-first
    title: "project를 등록하고 그 작업대를 처음 연다"
    actor: person
    goal: "Home에서 project를 등록하고 sidebar로 그 작업대에 들어간다"
    refs: [P10]
    steps:
      - {do: "Home의 Workspaces에서 Register project를 열고 폴더 칸의 Browse로 OS 폴더 선택기에서 폴더를 고른다", screen: home-register, flow: folder-pick:picked}
      - {do: "이름과 목적을 적고 등록한다", screen: home-register, flow: project-register:ok}
      - {do: "왼쪽 sidebar의 새 project 줄을 누른다", screen: shell-left-sidebar-project, flow: workspace-switch:to-project}
      - {do: "layout 파일이 없어 기본 layout(Main 하나)으로 그린다", screen: shell-empty, flow: layout-restore:fresh-absent}

  - id: project-register-share-identity
    title: "git 폴더를 등록하며 다른 컴퓨터에서도 같은 project로 만든다"
    actor: person
    goal: "git 저장소 폴더를 등록할 때 켬 줄을 켜 두면 폴더에 id file이 생기고, 상세에서 그 상태를 본다"
    steps:
      - {do: "등록 dialog에서 git 폴더를 고르면 Same project on my other computers 줄이 기본 켜짐으로 선다", screen: shell-project-identity, flow: project-identity-register-line:registered-shared}
      - {do: "등록하면 .lophn-project.json이 폴더에 생긴다. 사람이 commit한다", screen: shell-project-identity, flow: project-identity-register-line:registered-shared}
      - {do: "상세의 Other computers 줄이 상태를 보인다. 아직 id가 없으면 [Set up]으로 만든다", screen: shell-project-identity, flow: project-identity-row:set-up}

  - id: project-register-refused
    title: "겹치는 폴더로 등록이 막히면 폴더를 바로잡아 다시 등록한다"
    actor: person
    goal: "같은 project에 겹치는 폴더를 넣으면 등록이 막히고, 고쳐서 다시 등록한다"
    refs: [P10]
    steps:
      - {do: "같은 폴더나 서로 겹치는 폴더를 넣고 등록을 누른다", screen: home-register, flow: project-register:folders-overlap}
      - {do: "겹친 폴더를 빼고 다시 등록한다", screen: home-register, flow: project-register:ok}

  - id: project-settings-edit
    title: "project 설정에서 폴더, 아이콘, 빠른 실행 순서를 고친다"
    actor: person
    goal: "project의 이름과 폴더 목록, 아이콘, 빠른 실행 단추 순서를 바꾼다"
    refs: [P10]
    steps:
      - {do: "project 작업대에서 Project settings 탭을 연다", screen: project-settings, flow: workspace-switch:to-project}
      - {do: "General에서 폴더를 더하거나 뺀다", screen: project-settings, flow: project-edit:ok}
      - {do: "아이콘 이미지를 올린다", screen: project-settings, flow: project-icon-set:uploaded}
      - {do: "Quick launch에서 단추 순서를 바꿔 저장한다", screen: project-settings, flow: quick-launch-edit:saved-project}

  - id: project-folder-moved
    title: "옮겨진 등록 폴더를 새 위치로 잇는다"
    actor: person
    goal: "디스크에서 옮겨진 폴더를 project에 다시 연결한다"
    refs: [P10]
    steps:
      - {do: "project를 열면 등록 폴더가 없다고 표시된다", flow: project-read:ok}
      - {do: "project 줄 ⋯ 메뉴의 새 위치 고르기로 OS 폴더 선택기에서 폴더의 새 위치를 고른다", screen: home-workspaces-menu, flow: folder-pick:picked}
      - {do: "고른 위치를 잇는다", flow: project-relink-folder:ok}

  - id: project-archive-restore
    title: "project를 보관했다가 다시 연다"
    actor: person
    goal: "쓰지 않는 project를 보관하고 필요할 때 되살린다. 폴더의 파일은 건드리지 않는다"
    steps:
      - {do: "Home으로 간다", screen: shell-workspaces-panel, flow: workspace-switch:to-home}
      - {do: "project 줄 ⋯ 메뉴에서 Archive를 누른다", screen: shell-workspaces-menu, flow: project-archive:archived}
      - {do: "Archived 구역을 펼쳐 줄 끝 단추로 되살린다", screen: shell-workspaces-archived, flow: project-unarchive:unarchived}

  - id: document-open-edit-save
    title: "Files에서 문서를 열고 고쳐서 저장한다"
    actor: person
    goal: "project 폴더의 문서를 편집기 탭에서 고치고 디스크에 저장한다"
    steps:
      - {do: "오른쪽 sidebar를 열어 Files panel을 보인다", screen: new-explorer-root, flow: sidebar-toggle-right:opened}
      - {do: "Files panel에 focus를 주고 문서를 고른다", screen: new-explorer-root, flow: explorer-focus:focused}
      - {do: "문서를 누르면 미리보기 탭으로 열린다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "본문을 고치기 시작하면 미리보기 탭이 고정 탭이 된다", screen: new-document-tab, flow: preview-tab-pin:pinned}
      - {do: "입력이 멈추면 자동으로 디스크에 저장한다", screen: new-document-editing, flow: editor-save:saved}

  - id: document-file-create
    title: "Files panel에서 새 파일을 만든다"
    actor: person
    goal: "project 폴더 안에 새 파일을 만들면 편집기 탭으로 열린다. 이미 있는 이름은 덮지 않고 막는다"
    steps:
      - {do: "Files panel의 New File로 이름 칸을 열고 이름을 쳐 만든다", screen: new-explorer-new-file, flow: file-create:created}
      - {do: "새 파일이 편집기 탭으로 열린다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "같은 이름으로 다시 만들면 아무것도 덮지 않고 이름이 이미 있다고 보인다", screen: new-explorer-name-exists, flow: file-create:name-exists}

  - id: document-file-rename-move
    title: "Files panel에서 파일 이름을 바꾸거나 끌어서 옮긴다"
    actor: person
    goal: "파일이나 폴더의 이름을 바꾸거나 다른 폴더로 옮기면 열린 탭이 새 경로로 따라간다. 이미 있는 이름은 덮지 않는다"
    steps:
      - {do: "줄의 이름 바꾸기로 새 이름을 친다", screen: new-explorer-rename, flow: file-rename:moved}
      - {do: "파일을 다른 폴더로 끌어 놓는다", screen: new-explorer-move, flow: file-rename:moved}
      - {do: "같은 이름이 있는 폴더로 옮기면 아무것도 바꾸지 않고 이름이 있다고 보인다", screen: new-explorer-name-exists, flow: file-rename:name-exists}
      - {do: "폴더를 자기 안으로 끌면 막힌다", flow: file-rename:into-self}

  - id: document-file-trash
    title: "Files panel에서 파일을 휴지통으로 보낸다"
    actor: person
    goal: "확인한 파일이나 폴더가 OS 휴지통으로 가고 그 파일의 열린 탭이 닫힌다. 영구 삭제로 가지 않는다"
    steps:
      - {do: "Move to Trash나 Delete 키를 누르고 dialog에서 확인한다", screen: new-file-delete, flow: file-delete:trashed}
      - {do: "휴지통을 쓸 수 없으면 아무것도 지우지 않고 실패 문구만 보인다", screen: new-file-delete, flow: file-delete:unavailable}
      - {do: "열린 탭에 저장 안 된 글이 있는데 저장 확인을 취소하면 지우지 않는다", flow: file-delete:tab-save-refused}

  - id: document-quick-open
    title: "Ctrl/Cmd+P로 파일 이름을 쳐서 문서를 연다"
    actor: person
    goal: "팔레트를 파일 빠른 열기로 쓰면 Files panel을 거치지 않고 문서 탭이 열린다"
    steps:
      - {do: "files.quick-open 키로 파일 빠른 열기를 연다. 팔레트가 파일 목록을 보인다", flow: files-quick-open:opened}
      - {do: "파일 이름을 고르면 문서 탭으로 열린다", screen: new-document-tab, flow: editor-open:ready}

  - id: document-conflict-keep-mine
    title: "편집 중 밖에서 바뀐 파일을 내 글로 덮는다"
    actor: person
    goal: "디스크가 바뀐 것을 알고 내 편집 글을 유지하기로 정한다"
    steps:
      - {do: "문서를 열고 고친다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "다른 편집기나 git이 같은 파일을 바꾸면 편집기는 충돌 상태로 두고 쓰지 않는다", screen: new-file-conflict, flow: editor-disk-watch:conflict}
      - {do: "저장을 시도하면 디스크가 바뀌었다며 쓰지 않고 막는다", screen: new-file-conflict, flow: editor-save:conflict}
      - {do: "Compare로 두 쪽을 나란히 보고 Keep my version을 누른다", screen: new-file-conflict-compare, flow: editor-conflict-resolve:kept-mine}

  - id: document-conflict-take-disk
    title: "충돌에서 디스크 글을 받고 내 편집을 버린다"
    actor: person
    goal: "디스크 쪽 글을 받기로 하면 편집 중이던 글은 버려진다"
    refs: []
    steps:
      - {do: "문서를 열고 고친 뒤 저장하려 한다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "저장이 디스크 변경으로 충돌을 알린다", screen: new-file-conflict, flow: editor-save:conflict}
      - {do: "Use disk version을 누른다. 편집 중이던 글은 버려진다", screen: new-file-conflict-compare, flow: editor-conflict-resolve:took-theirs}

  - id: document-save-denied-keep-open
    title: "저장이 실패해도 편집 글을 잃지 않고 권한을 고쳐 저장한다"
    actor: person
    goal: "디스크 권한 때문에 저장이 실패해도 편집기는 글을 메모리에 두고, 고친 뒤 다시 저장한다"
    steps:
      - {do: "문서를 열고 고친다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "디스크 권한이 없어 저장이 실패하고 편집기는 failed가 된다", screen: new-document-editing, flow: editor-save:denied}
      - {do: "탭을 닫으려다 저장 안 된 글을 묻는 dialog에서 취소한다", flow: tab-close:kept}
      - {do: "권한을 고치면 편집 글이 다시 저장된다", flow: editor-save:saved}
      - {do: "탭을 다시 닫는다", flow: tab-close:closed}

  - id: document-close-discard
    title: "저장 안 된 글을 버리고 문서 탭을 닫는다"
    actor: person
    goal: "저장되지 않은 편집 글을 버리기로 하고 탭을 닫는다. 되돌릴 수 없다"
    steps:
      - {do: "문서를 열고 고친다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "저장이 실패해 글이 저장 안 된 상태로 남는다", screen: new-document-editing, flow: editor-save:denied}
      - {do: "탭을 닫는 확인 dialog에서 버리고 닫기를 고른다. 저장 안 된 글은 사라진다", flow: tab-close:confirmed-closed}

  - id: document-window-close-guard
    title: "저장 안 된 문서가 있으면 창 닫기를 막고 묻는다"
    actor: person
    goal: "창을 닫을 때 저장 안 된 편집이 있으면 사람에게 묻고, 저장을 끝낸 뒤 닫는다"
    steps:
      - {do: "문서를 열고 고친다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "저장이 실패해 편집 글이 저장 안 된 상태로 남는다", flow: editor-save:denied}
      - {do: "창을 닫으면 저장 안 된 글을 묻고, 사람이 취소한다", flow: editor-window-close:kept-open}
      - {do: "권한을 고쳐 저장한다", flow: editor-save:saved}
      - {do: "다시 창을 닫는다", flow: editor-window-close:closed}

  - id: document-tab-keep-reveal
    title: "미리보기 탭을 고정하고 경로를 복사해 Files에서 찾는다"
    actor: person
    goal: "열어 둔 문서를 고정하고 경로를 가져가며 Files panel에서 그 파일을 찾는다"
    steps:
      - {do: "문서를 미리보기 탭으로 연다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "미리보기 탭을 더블클릭해 고정 탭으로 만든다", flow: tab-keep-open:pinned}
      - {do: "탭 메뉴 Copy Path로 경로를 복사한다", screen: new-editor-tab-menu, flow: tab-copy-path:copied}
      - {do: "Reveal in Explorer로 Files panel에서 파일을 찾는다", screen: new-explorer-root, flow: tab-reveal:revealed}
      - {do: "← 단추로 앞 자리로 돌아간다", flow: nav-trail:walked}

  - id: project-find-in-files
    title: "project 폴더에서 글자를 찾아 그 줄을 연다"
    actor: person
    goal: "Search 탭에서 project 등록 폴더의 글자를 찾고 결과 줄로 문서를 연다"
    steps:
      - {do: "Ctrl/Cmd+Shift+F나 sidebar 검색으로 Search 탭을 연다", screen: new-file-search, flow: search-tab-open:opened}
      - {do: "검색어를 치고 폴더를 골라 찾는다", screen: new-file-search-folder, flow: project-search:ok}
      - {do: "결과를 누르면 그 줄로 문서가 열린다", screen: new-file-search-opened, flow: editor-open:ready}

  - id: session-message-search-open
    title: "agent session의 메시지 글에서 찾아 그 session을 연다"
    actor: person
    goal: "session 제목만이 아니라 메시지 글에서 찾아 그 대화를 연다"
    steps:
      - {do: "session 목록 검색칸에 글을 치면 제목과 메시지 글에서 찾는다", screen: new-agent-session-search, flow: session-message-search:ok}
      - {do: "결과를 누르면 그 session을 열고 찾기 줄에 query를 넣는다", screen: new-agent-find, flow: session-read:ok}

  - id: thread-message-bookmark
    title: "대화의 message에 bookmark를 켜고 끈다"
    actor: person
    goal: "긴 대화에서 다시 볼 message를 bookmark로 표시하면 열린 모든 창에 같이 반영되고, 다시 열어도 남는다"
    steps:
      - {do: "message 하나의 bookmark를 켠다. 파일에 적고 열린 모든 창에 changed가 간다", flow: thread-bookmark-set:ok}
      - {do: "changed를 받은 창과 session 탭을 다시 열 때 bookmark된 message key 목록을 읽는다", flow: thread-bookmark-list:ok}
      - {do: "같은 message의 bookmark를 끈다", flow: thread-bookmark-set:ok}
      - {do: "bookmark 파일이 깨져 있으면 쓰지 않고 그대로 둔다. 덮어쓰지도 옮기지도 않는다", flow: thread-bookmark-set:unavailable}

  - id: agent-writes-artifact-open
    title: "agent에게 결과 문서를 artifact로 만들게 하고 대화 link로 연다"
    actor: person
    goal: "project session이 쓴 결과 문서를 대화의 artifact link로 연다"
    refs: [C28]
    steps:
      - {do: "project session에 결과를 artifact로 만들어 달라고 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "queue의 입력으로 turn이 시작된다", flow: turn-pump-start:started}
      - {do: "agent가 project 폴더에 index.html과 자료 파일을 쓴다", screen: new-agent-tool-running, flow: tool-file-write:created}
      - {do: "답이 끝나고 대화에 artifact 경로 link가 남는다", screen: artifact-chat-link, flow: turn-loop:completed}
      - {do: "link를 누르면 artifact 탭이 열린다", screen: artifact-tab, flow: artifact-open:opened}

  - id: artifact-live-update
    title: "열린 artifact는 폴더가 바뀌면 다시 불러지고 바깥 link는 밖으로 간다"
    actor: person
    goal: "agent가 artifact 파일을 고치면 탭이 따라가고, page 안의 바깥 link는 OS browser로 연다"
    refs: [C28]
    steps:
      - {do: "Artifacts 목록에서 artifact를 고른다", screen: artifact-sidebar-list, flow: artifact-open:opened}
      - {do: "agent가 파일을 고치면 탭이 잠시 뒤 다시 불러진다", screen: artifact-tab, flow: artifact-watch:reloaded}
      - {do: "본문의 바깥 link는 OS 기본 browser로 연다", flow: artifact-navigation:external-link-opened}

  - id: artifact-guest-crash
    title: "artifact 화면이 죽으면 탭이 알리고 다시 연다"
    actor: person
    goal: "artifact guest가 죽거나 멈추면 탭에 안내를 띄우고 Try again으로 되살린다"
    steps:
      - {do: "artifact를 연다", screen: artifact-tab, flow: artifact-open:opened}
      - {do: "화면 프로세스가 죽으면 탭이 안내와 Try again을 그린다", screen: artifact-tab, flow: artifact-guest-health:crashed}
      - {do: "Try again을 누르면 새 화면 세대가 열린다", screen: artifact-tab, flow: artifact-guest-health:recovered}

  - id: artifact-folder-gone
    title: "폴더가 사라진 artifact를 다시 열면 안내를 본다"
    actor: person
    goal: "artifact 폴더가 지워지면 탭이 조용히 멈추고, 다시 열 때 없다는 안내를 본다"
    steps:
      - {do: "artifact를 연다", screen: artifact-tab, flow: artifact-open:opened}
      - {do: "감시하던 폴더가 사라지면 watch가 조용히 멈춘다", screen: artifact-tab, flow: artifact-watch:watch-stopped}
      - {do: "다시 열면 폴더가 없다는 안내와 Try again을 본다", screen: artifact-missing, flow: artifact-open:not-found}

  - id: browser-open-page-bookmark
    title: "browser 탭에서 page를 열고 bookmark로 더해 다시 연다"
    actor: person
    goal: "주소로 page를 열고, 뒤로 가기와 새로 고침을 쓰고, bookmark로 저장해 새 탭에서 다시 연다"
    steps:
      - {do: "탭 줄 끝 menu의 Browser로 빈 browser 탭을 연다", screen: browser-blank, flow: browser-tab-new:opened}
      - {do: "주소를 치고 Enter를 누른다", screen: browser-tab, flow: browser-page-open:loaded}
      - {do: "뒤로, 앞으로, 새로 고침을 쓴다", screen: browser-tab, flow: browser-chrome-command:done}
