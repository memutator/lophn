id: desktop-remote
version: 0.23.71
title: desktop 앱이 다른 기계의 lophn을 kind desktop 기기로 pairing해 그 기계의 창으로 본다
modules: [packages/remote-client, packages/shell/main, packages/shell/renderer, packages/shell/preload, packages/shell/ipc, packages/core/lophn-agent, packages/core/main, packages/protocol, packages/design, packages/mobile, tools]
change: |
  전: 다른 기계의 lophn은 폰으로만 볼 수 있었다. core는 kind desktop 기기를 받을 수 있었지만 desktop 쪽 client가 없었고, 연결 조각(연결, 컴퓨터 목록, pairing)은 폰 앱 안에 있었다. 두 화면이 한 session에 쓰면 서로 못 본 메시지 뒤에 그대로 쌓였다.
  후:
  - "공용 package `packages/remote-client`(`@lophn/remote-client`): 연결(주소 경주, 재연결, dial, 자격 전 기계 id 확인), 기계 목록 store, pairing text 읽기와 pair, unpair. protocol과 base만 import한다. 폰과 shell main이 상대 path로 같은 source를 읽는다. 한 연결이 한 번에 여는 call은 8개까지이고 나머지는 앞의 답을 기다린다(core가 한 caller의 read를 8개 넘게 줄 세우지 않아 창 하나의 묶음이 깨졌다)."
  - "shell main이 짝지은 기계마다 연결 하나를 든다. 기기 key와 목록은 shell data `viewer/key.json`(`{machine, secret_key}`)과 `viewer/machines.json`(`{machine, computers, start, last, seen}`), 0600, temp에 쓰고 rename. 기계 표지가 이 기계와 다르면 둘 다 버리고, 못 읽는 file은 덮지 않고 기계 보기를 끈다(`unreadable`). 어느 내보내기에도 실리지 않는다."
  - "pairing: 이 컴퓨터 창의 Settings › Remote \"Computers you view\"에 다른 기계의 \"Show as text\"를 붙여 넣는다(카메라 길 없음). 자기 자신의 글은 pair 전에 거절한다. hello `name`은 이 기계의 이름, `pair`는 kind desktop과 OS다. 이 기계 이름을 바꾸면 main이 `machine/rename`의 답을 보고 연결을 다시 열어 보는 기계들이 바로 새 이름을 받는다. 다른 기계 쪽 문구는 \"phone\"이 \"phone or computer\"가 되었다."
  - "기계마다 창 하나: 기계 고르기(title bar 왼쪽, 짝이 없으면 그리지 않는다)가 그 기계의 창을 열거나 앞으로 가져온다. 창 제목은 \"<이름> — lophn\". 다른 기계의 창은 따로 preload(`preload-remote`)를 받고 main이 보낸 창으로 기계를 정해 `shell:core-*`를 그 기계의 연결로 보낸다. 그 밖의 IPC는 모든 handler 앞의 guard 한 곳이 허락 목록(`shell:machines-list|open|this-window|visible`, 창 단추, 외부 링크) 밖을 `forbidden`으로 답한다. 새 IPC `shell:machines-list|changed|pair|remove|rename|start|open|this-window|visible`, preload bridge `lophnMachines`."
  - "다른 기계의 창에서 끄는 것: 터미널과 coding agent 터미널·GUI, 편집기·file tree·file 열기(빈 desk의 Open file 포함), 지침·memory 편집, secret 창, browser·artifact 탭, agent가 여는 탭, 앱 화면·앱 panel·앱 창, detached 탭, Settings, provider 설정, agent·앱·project·job 만들기와 고치기(job은 켜고 끄기만), extension, thread bookmark, 그 기계의 OS 알림, session 지우기, 권한 mode 메뉴와 mode 순환 키. 탭 kind가 `thisComputerOnly`를 선언하고 그 탭 자리에 \"This opens only on <이름>\"이 선다. Settings 자리는 \"<이름>'s settings are changed on <이름>\"과 [Open this computer]다."
  - "다른 기계의 앱 화면은 띄우지 않는다. layout은 저장하지 않고 창이 사는 동안 메모리에만 둔다(다시 열면 Home). 창 자리도 저장하지 않는다."
  - "gate: 한 번도 붙지 않은 창은 connecting·offline gate([Try again]·[This computer]), 붙은 뒤의 끊김은 마지막 화면 위 한 줄, 그 기계가 이 desktop을 지우면 removed gate."
  - "시작 기계: 고른 기계, 아니면 마지막에 쓴 기계(연결된 채 focus를 받은 마지막 창), 목록에 없으면 이 컴퓨터. core를 기다리지 않고 저장된 목록에서 고르고 꺼진 기계도 창을 바로 연다. 이 컴퓨터의 알림, presence, 전역 키, agent 창은 늘 이 컴퓨터의 창이고, 알림을 누를 때 다른 기계의 창만 있으면 이 컴퓨터의 창을 연다."
  - "presence: 다른 기계의 창이 focus를 가졌거나 보이는 session이 바뀌면 shell main이 그 기계에 기기 자격으로 `presence/report`를 보낸다. 기기 route에 `unseen/list|dismiss`를 더했다(폰도 받는다)."
  - "stale send: `acp/send`의 send와 `messages/send`가 `seen`(그 화면이 아는 마지막 사람 메시지, null은 하나도 못 봄)을 싣는다. core가 같은 transaction에서 그 뒤의 사람 메시지(`!` 기록과 rewind가 숨긴 것은 세지 않는다)를 보면 아무것도 넣지 않고 `conflict`(`details.reason: \"changed_elsewhere\"`)로 끝낸다. `seen`이 없으면(CLI, run, relay) 검사하지 않는다. desktop과 폰 composer는 글과 첨부를 남기고 한 줄을 보인 뒤 대화를 다시 읽는다. coding agent session은 대상이 아니다."
  - "개발: `npm run dev -- --viewer`가 두 번째 desktop을 `.dev-data/viewer`로 띄운다(fake provider와 push는 host 쪽의 것을 쓴다)."
why: |
  roadmap `multi-machine` 순서 1(줄 1, 다른 기계 보기)이다. 한 사람이 집 컴퓨터에 앉아 회사 컴퓨터나 미니 PC의 lophn에서 session을 보고, 말하고, 승인에 답하려면 폰을 꺼내지 않고 desktop에서 열 수 있어야 한다. 연결 조각을 폰과 desktop이 같이 쓰도록 옮겨 Noise 연결이 두 벌이 되지 않게 했다. 두 기기가 한 session에 쓰게 되어 못 본 메시지 뒤에 말이 쌓이지 않게 보내기를 막았다.
decisions:
  - text: "다른 기계의 앱 화면(앱 panel, 앱 창, 앱 view)은 띄우지 않는다. 미룬 것이 아니라 하지 않는 것이다: 다른 기계에서 필요한 것은 session, 대화, 승인이고 앱은 그 기계나 폰에서, sync 앱이면 이 기계의 사본으로 쓴다."
    by: person
  - text: "desktop 기기의 권한은 폰과 같다. allowlist를 kind로 가르지 않고 desktop 때문에 관리 route를 넣지 않는다. 더하는 route는 `unseen/list|dismiss` 둘이다."
    by: person
  - text: "꺼진 기계에 맡겨 두는 queue는 없다. 연결이 없으면 보내기는 `unavailable`이고 화면이 쓴 글을 남긴다."
    by: person
  - text: "한 창은 사는 동안 한 기계이고 기계마다 창이 하나다. 버린 길: 한 창에서 기계 바꾸기(renderer가 창마다 core 하나를 module 수준에서 잡고 layout이 기계 안 id에 묶인다)."
    by: agent
  - text: "다른 기계와의 연결은 shell main이 들고 main이 보낸 창으로 기계를 가른다. renderer가 기계를 주장하지 못한다. 버린 길: renderer가 직접 붙기(CSP `connect-src 'self'`, 기기 key가 renderer에 온다)."
    by: agent
  - text: "다른 기계의 창은 따로 preload를 받고 main이 그 밖 IPC를 handler 앞 한 곳에서 거절한다. 이유: handler마다 막으면 하나를 빠뜨린다."
    by: agent
  - text: "다른 기계 창의 layout은 저장하지 않는다(창이 사는 동안 메모리). 이유: layout file이 기계 안 id에 묶이고 detached 창까지 다른 기계에 묶인다."
    by: agent
  - text: "desktop의 기기 key는 OS keyring이 아니라 shell data의 0600 file에 기계 표지와 같이 둔다. 이유: core의 host key가 같은 보호이고 keyring 없는 Linux에서 실패 갈래만 는다."
    by: agent
  - text: "pairing은 붙여 넣기만이다. 카메라 길은 없다."
    by: agent
  - text: "시작 기계는 보는 쪽마다 하나이고 기본은 마지막에 쓴 기계다. 정한 기계가 꺼져 있어도 그 창을 바로 열어 offline gate를 보인다."
    by: agent
  - text: "두 기기가 한 session에 쓰면 보내기가 `seen`을 싣고 core가 같은 transaction에서 거절한다. 합치지 않는다. coding agent session은 대상이 아니다."
    by: agent
  - text: "이 기계 이름을 바꾸면 main이 `machine/rename`의 답을 보고 보는 기계들에 다시 알린다. 이유: 이름 바꾸기에는 event가 따르지 않는다. 버린 길: 다시 시작할 때만 알리기."
    by: agent
  - text: "한 remote 연결의 call 수를 client가 8로 막는다. 버린 길: core의 caller별 read 줄 한도를 늘리기(이 컴퓨터의 창에도 같은 한도가 걸려 이슈로 따로 본다)."
    by: agent
checklist:
  - 설치한 desktop 둘을 준비해, 한쪽의 Settings › Remote에서 "Add phone or computer" › "Show as text"를 복사하고 다른 쪽의 "Computers you view" › [Add computer]에 붙여 [Pair]를 누른다. 첫 쪽의 기기 목록에 "Desktop · <OS>" 줄이 생기는지 본다
  - title bar의 기계 고르기를 열어 짝지은 기계를 고르면 "<이름> — lophn" 창이 열리고, 다시 고르면 같은 창이 앞으로 오는지 본다
  - 그 창에 터미널, 편집기, 앱 화면, Settings 항목, session Delete, 권한 mode 메뉴가 없고, 문서 같은 탭 자리에 "This opens only on <이름>"이 서는지 본다
  - 같은 session을 두 기계의 창에 띄우고 한쪽에서 보낸 직후 다른 쪽에서 보내면 "This conversation changed on another device"가 서고 쓴 글이 입력칸에 남는지 본다
  - macOS나 Windows라면 다른 기계의 창에서 단축키(팔레트, 탭 닫기)와 창 단추가 되는지 본다
