id: gui-member-resume-loses-replies
title: 닫힌 GUI 팀원 탭에 reply가 도착해 --resume으로 재기동할 때 즉시 실패해 reply가 유실되고 실패 사유도 남지 않는다
kind: bug
status: open
topic: terminal-agent
modules: [packages/core/terminal-agents, packages/core/harness-gui, packages/core/main]
now: |
  `packages/core/terminal-agents/member.ts`의 `closeIfDone`은 core가 연 GUI 팀원 탭 가운데 `team spawn`이 아닌 탭(`!member.team`)을 턴이 끝나면 닫고, 다음 입력(worker reply 등)이 오면 `openFor` → `CodingOpen.member`로 `claude --gui --resume <id>` 새 터미널 탭을 열어 이어받게 되어 있다.

  실사용 workflow(`feature-cleanroom`)에서 `research` step을 맡은 Claude Code GUI 세션이 worker 6개를 `team spawn`으로 띄우고 턴을 마치자 `closeIfDone`이 탭을 닫았고, 이후 worker 6명의 reply가 도착할 때마다 core가 새 터미널 탭을 열어 `--resume`을 시도했으나 6번 모두 `StartTurn` 직후 90~112ms 만에 `FinishTurn(failed/model_error)`로 끝나고 다시 닫혔다. 원본 Claude session jsonl에는 어떤 reply 메시지도 기록되지 않았고, `harness-lab` layout에는 빈 터미널 탭 6개만 남았다.

  또한 `packages/core/main/daemon/wiring/harness.ts`의 `outcomeOf`가 `end === "failed"`를 일괄 `{ kind: "failed", reason: "model_error" }`로만 기록하고 adapter의 오류 메시지(`update.error.message`·stderr)를 남기지 않아, 왜 100ms 만에 실패했는지(예: `claude.ts`의 비동기 `replay(resume)`와 `member.ts`의 `send` 레이스인지, CLI `--resume` 종료인지) 사후 추적이 불가능하다.
impact: |
  workflow step 담당자가 하위 worker를 띄우고 답을 기다리는 패턴에서 모든 worker reply가 조용히 유실되어 workflow가 영영 다음 step으로 넘어가지 못한다. 사람은 빈 터미널 탭이 여러 개 열린 것만 보고 실패 원인도 알 수 없다.
fix: |
  1. `claude --gui --resume <id>`로 재기동 직후 `member.ts`가 입력을 넣는 경로를 로컬 재현해 ~100ms 실패의 정확한 원인을 고친다(`replay` 중 `idle` 판정/레이스 여부 및 CLI stderr 확인).
  2. 전달하지 못한 reply가 조용히 사라지지 않게 지키고, 실패한 turn의 오류 메시지(redaction 후)를 ledger/instance에 남겨 원인이 드러나게 한다.
  3. 열린 `agent_calls`의 reply를 기다리는 중이거나 활성 workflow step을 맡은 세션은 `closeIfDone`이 조기 종료해 불필요한 `--resume` 재기동과 자체 subagent 단절을 일으키지 않도록 검토한다.
