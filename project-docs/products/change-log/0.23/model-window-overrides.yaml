id: model-window-overrides
version: 0.23.49
title: 모든 provider의 model 한도를 고치고 Codex window를 API catalog와 분리한다
modules: [packages/protocol, packages/cli, packages/core/lophn-agent, packages/core/main, packages/core/storage, packages/shell/renderer, packages/design, tools]
change: |
  Manage models의 모든 model에 Edit을 연다. 내장·구독은 context/input/output 한도를 고치고
  빈 칸은 자동 값, Reset limits는 override 삭제다. custom은 정보 전체와 Add/Remove를 유지한다.
  SaveUserModelInfo는 내장·구독 정의도 받고 null field는 catalog metadata를 유지한다.
  Codex 목록에서 기본/확장 context와 output 한도를 이름과 함께 저장하는 ledger step을 더했다.
  Codex는 서버 기본 window(없으면 272000)를 쓰며 명시한 context는 서버/curated 확장 상한 안에서 적용한다.
  gpt-6-astra·gpt-6.1-sol의 curated 확장 입력 상한은 omp와 같은 922000이다.
  model별 override는 API key·구독 연결에 공통이고 유효 Codex window 계산만 연결 종류에 따라 다르다.
  상태 표시가 마지막 call의 옛 window를 재사용하지 않으며 저장·reset 뒤 대화 usage를 갱신한다.
  CLI model 목록, picker, 실행과 compact가 같은 유효 context를 쓴다.
  명시한 output을 32000이나 context의 4분의 1로 다시 자르지 않는다.
why: |
  내장·구독 model에는 한도를 고칠 길이 없었고 ChatGPT 구독도 일반 OpenAI API의 1.05M을 써서
  실제 운영 window보다 compact 예산을 크게 잡았다. 같은 model의 한도를 바꿔도 상태 표시에는
  마지막 call의 한도가 남았다. 한도를 덮을 때 effort wire·media·가격까지 잃지 않아야 한다.
decisions:
  - text: Codex는 운영 window와 확장 상한을 나누고 확장은 context override로 명시한다. 모델을 바꿀 때 요약 호출을 즉시 만들지 않고 다음 turn 첫 호출 전에 새 예산으로 기존 자동 compact를 판단한다.
    by: agent
  - text: override key는 기존 provider 정의·model 이름을 유지한다. 별도 설정 파일이나 UI를 만들지 않고 기존 model editor·seq 충돌 방지를 쓴다.
    by: agent
  - text: 자동 output 요청 예산은 32000(Anthropic thinking 예산은 추가)을 유지하되 명시한 output은 우선한다. Codex·Cloud Code는 서버가 output 인자를 받지 않아 설정을 입력 예산 예약에만 적용한다.
    by: agent
checklist:
  - "해야: 앱을 다시 build하고 재시작해 새 ledger step을 적용한다"
  - Manage models에서 내장·ChatGPT model의 Edit에 한도 셋과 Reset limits가 보이고 Codex 기본 context가 API의 1.05M이 아닌지 본다
