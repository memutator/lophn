id: migration-failure-reason-worker-route-removed
version: 0.6.0
title: "activation의 migration 실패가 단계와 오류 글을 싣고, API server의 worker route 통로를 지운다"
modules: [packages/core/apps, packages/core/main, packages/core/server, packages/core/storage, packages/core/supervision, packages/protocol, packages/shell/main]
checked: [boundary-catalog, architecture-layers, architecture-event, architecture-approval, architecture-testing, architecture-activation, architecture-agent-call, architecture-app-call, architecture-agent-definition, architecture-browser-tab, architecture-artifact, architecture-workspace-layout, architecture-ui-kit, architecture-appearance, tool-worktree-prep, tool-test-live, tool-check-deps, tool-dev, tool-models-snapshot, skill-ui-design, tool-wireframes]
change: |
  전:
  - activation의 migration 단계가 운영 data에서 되돌아가면 `release.activate`의 `failed`는 `migration_failed`와 "the data change failed"만 실었다. data job 자식은 되돌아간 단계와 SQLite 오류 글을 알았지만 결과 줄에 싣지 않았다.
  - API server에 route 종류 `worker`(`defineWorker`, `WorkerRoute`, dispatch의 worker 갈래, `forwardToWorker`, 등록의 `workerRoutes`)와 그것을 쓰는 `packages.guide`가 남아 있었다. core가 worker 대상을 넘기지 않아 `packages.guide`는 늘 `unavailable`이었다.
  후:
  - data job 결과 줄에 `failed: {step, message}`가 있고, activation이 `migration_failed` summary에 `the data change failed: step 2-3 was rolled back: <SQLite 오류 글>`을 싣는다. release 준비 검사와 같은 글 꼴(`rolledBackStepText`, `packages/protocol/apps/activation/data-job.ts`)이다.
  - route 종류는 read, command, memory, upload, file이다. handler 없는 file route는 dispatch가 바로 `unavailable`로 답한다. 내장 package 안내 본문은 `packages.guide_body`가 읽는다.
  닫은 이슈: activation "activation의 migration 실패 이유가 실패한 단계와 SQLite 오류 글을 싣지 않는다"(고침), code-health "API server의 worker route 통로가 남았다"(고침).
why: |
  release 준비 검사는 빈 fixture DB와 active release의 schema로 돌아, 기존 행이 새 제약에 걸리는 실패는 activation에서야 드러난다. 그 이유가 없으면 App Engineer는 고칠 곳을 모르고 다시 짓는다. worker route는 켜는 곳이 없는 죽은 통로였다.
decisions:
  - by: agent
    text: |-
      실패 글은 data job protocol에 싣고 port signature는 그대로 둔다. `data.migrate`가 되돌아간 단계를 err로 낸다.
  - by: agent
    text: |-
      글 꼴 helper는 protocol data-job module에 둔다. activation 쪽 core가 앱 DB를 여는 `data/worker`를 import하지 않게.
follow_up: |
  agent-definition "Agents 탭의 Instructions 카드가 LOPHN.md 내용을 늘 비워 보인다"(renderer의 `Link.worker`와 IPC kind `"worker"`가 그 읽기 하나 때문에 남았다).
