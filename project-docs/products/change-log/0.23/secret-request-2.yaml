id: secret-request-2
version: 0.23.43
title: agent가 custom provider, MCP server secret, 로그인을 요청하고 값이 빈 실패가 그 자리를 알린다. 화면에는 오류 줄과 MCP server에서 바로 넣는 button이 생긴다
modules: [packages/protocol, packages/core/main, packages/core/lophn-agent, packages/core/apps, packages/core/agent-workspaces, packages/cli, packages/coding-agent, packages/sdk, packages/shell/main, packages/shell/renderer, packages/design]
change: |
  - `lophn ask secret`의 자리가 넷이다. flag는 자리 칸과 같다.
    - `--provider <key> [--sign-in]`: 내장 정의. API key와 구독 로그인을 둘 다 가진 정의(anthropic, openai, xai)는 기본이 key이고 `--sign-in`이면 로그인이다. 로그인뿐인 정의는 늘 로그인이다. home만.
    - `--display-name <이름> --base-url <https 주소> --protocol <protocol>`: Custom provider. card가 host를 보이고, key를 넣으면 연결한다(실패하면 key를 지운다). 정의 key는 이름의 slug이고 내장 key나 다른 주소의 같은 key는 거절한다. home만.
    - `--app <id> --secret <name>`(앱 workspace에서는 `--app` 생략): 앱이 선언해 허락받은 secret. OAuth로 선언했으면 로그인이다. 옛 `--name`은 `--secret`이 됐다.
    - `--mcp <server> [--part <sign_in|client|credential|header:<이름>>]`: 설정에 있는 MCP http server. card가 server URL origin을 보인다. home은 전역·Home 층·자기 정의 층, project·앱 session은 자기 정의 층과 자기 workspace 층의 server를 청한다. 같은 이름이면 가까운 층(정의 > workspace > 전역)이다. stdio server와 청할 것이 없는 server는 `not_found`다.
  - 요청 종류 `sign_in`: 넣을 값이 없는 자리는 card의 [Sign in]이 지금 화면의 로그인 흐름(provider 로그인과 device code, 앱 OAuth, MCP OAuth)을 그대로 돈다. 로그인할 곳은 core가 자리에서 읽은 값이다. 결과는 `{signed_in: true}`이고 renderer가 `input_request/done`으로 알린다(renderer allowlist에 `done`이 더해졌다. core는 결과가 요청 종류에 맞는지만 본다). 이미 연결된 provider에 로그인을 청하면 `conflict`, 로그인으로 연결된 provider에 key를 청해도 `conflict`(token을 key로 덮지 않는다), client id가 없는 앱 OAuth는 `conflict`다.
  - 빈 자리 알리기: 앱 호출이 secret 값이 없거나 로그인이 안 돼 실패하면 core가 그 invocation을 기억해 실패 결과에 `missing: [{app, secret}]`을 싣고, MCP tool 호출이 빈 secret이나 인증 거절로 막히면 `details.missing`(`{mcp, part}`)을 싣는다. tool 실행기가 고정 문장 "A secret value or sign-in is missing. Ask the person with `lophn ask secret …`."을 붙인다. SDK는 바뀌지 않았다.
  - 화면: provider key가 없거나 안 맞아 멈춘 turn의 오류 줄에 [Enter <provider> key](API key로 연결된 provider면 보호 창, 아니면 Settings › Providers를 연다)가 생겼다. Settings › Tools and skills와 agent 편집기의 MCP server에 secret을 가리키는 칸마다 값을 넣거나 바꾸는 button이 생겼다(전에는 server를 만들 때만 넣을 수 있었다).
  - Settings의 Custom provider 검사 규칙이 `packages/protocol/lophn-agent/custom-provider.ts` 하나로 모였고 요청과 같이 쓴다. provider 로그인 흐름과 앱 OAuth 시작은 `desktop/settings/sign-in.ts`로 옮겨 Settings·앱 상세·card가 같이 쓴다.
  - agent 지침: 공통·home·project·앱 prompt, `lophn-agent` skill, CLI 도움말, `@lophn/cap-secret` 1.1.0 guide가 새 자리와 로그인, 실패가 알리는 명령을 말한다(`migrate-sdk/cap-secret-1.1.0.md`).
why: |
  순서 1 뒤에도 "River 연결해 줘", 구독 provider·앱 OAuth·MCP server 연결은 agent가 "Settings에 가서 하세요"라고 글로 안내하는 데서 끝났다. 앱이나 MCP 호출이 값이 없어 실패해도 agent는 어느 자리가 비었는지 몰라 사람에게 묻거나 추측했다. key가 없어 turn이 못 도는 경우는 agent가 요청할 수 없어 화면에 길이 있어야 했다(`roadmap/secret-request.md` 순서 2).
decisions:
  - text: "project·앱 session의 MCP 자리에 자기 workspace 층을 더했다. roadmap은 자기 agent 정의 층만이었다. workspace 층은 그 workspace에만 닿고 사람이 거기 단 server라, 앱 agent가 다른 앱이나 전역을 건드리지 못한다는 취지는 그대로다. 사람에게 알리고 진행했다."
    by: agent
  - text: "sign-in은 shell main이 아니라 card가 돈다. 버린 길: main에서 돌기(device code를 card에 보일 수 없고 로그인 흐름 사본이 하나 더 생긴다)."
    by: agent
  - text: "빈 자리는 core가 스스로 알린다. 버린 길: SDK `CapabilityError`에 자리 칸 더하기(SDK 판을 올리고 앱마다 채워야 하며, 앱이 오류를 삼키면 사라진다). 앱 호출의 짝은 시각이 아니라 invocation id로 맞춘다."
    by: agent
  - text: "MCP 실패는 server가 쓴 글을 넘기지 않고 core가 설정에서 만든 자리와 고정 문장만 넘긴다."
    by: agent
  - text: "provider 오류 줄의 key 창은 API key로 연결된 provider에만 연다. 구독 provider의 `provider.<id>`는 token이라 key로 덮으면 연결이 깨진다."
    by: agent
follow_up: |
  - turn을 시작할 때 붙지 못한 MCP server는 tool이 실리지 않아 알릴 실패가 없다. 시작 때 notice로 알리는 일은 따로다.
  - 만료된 구독 provider를 agent가 다시 로그인 요청하는 길은 없다(지금은 `conflict`).
checklist:
  - Home 대화에서 lophn에게 "River 연결해 줘"(https 주소와 OpenAI 호환)라고 하면 card에 host가 보이고, key를 넣으면 Settings › Providers에 River가 뜨는지 본다
  - Home 대화에서 구독 provider(예 ChatGPT) 로그인을 청하게 하면 card의 [Sign in]이 browser 로그인을 열고 끝나면 연결되는지 본다
  - provider key를 지운 뒤 turn이 멈추면 오류 줄의 [Enter <provider> key]로 key를 넣고 Retry가 되는지 본다
  - Settings › Tools and skills의 MCP server에서 값을 바꾸는 button이 보호 창을 여는지 본다
