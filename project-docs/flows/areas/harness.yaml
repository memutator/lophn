      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/terminals/service.ts
      - packages/core/terminal-agents/hold.ts
    steps:
      - "host-tab-open과 같은 판정을 거친다. 사람 token이면 invalid_input, session이 없거나 닫혔거나 다른 workspace면 not_found"
      - "harness session이 아니거나 project workspace가 아니면 invalid_input. home과 app은 터미널이 없다"
      - "CLI session id가 아직 없으면(첫 turn 전) conflict. turn이 돌거나 이미 hold되어 있어도 conflict"
      - "통과하면 그 자리에서 30초 hold를 예약하고, core가 그 project에 새 터미널을 열어 그 harness의 resume 명령(adapter id, CLI session id)을 친다"
      - "그 터미널이 그 session을 쥐고(harness-tui-hold) tab_open(target terminal {terminal_ref})을 넣는다. 창이 없어도 터미널은 돈다. 터미널이 쥔 동안 그 session의 headless turn은 시작하지 않는다"
    outcomes:
      - id: accepted
        observe: [response, process:cli-tui]
      - id: not_found
        code: not_found
        when: "호출 session이나 대상 session이 없거나 닫혔거나 다른 workspace다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "대상이 harness session이 아니거나 project workspace가 아니다, 사람 token이 불렀다(사람 token은 browser·preview·artifact 탭만 연다), 또는 project에 등록 폴더가 없다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "CLI session id가 없거나, turn이 돌거나, 이미 hold되어 있다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY를 띄우지 못했다(spawn_failed, host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "TUI가 끝내 뜨지 않으면 터미널이 끝날 때까지 hold가 남는다. 그 release 경로는 system:harness-tui-hold가 맡는다"

  - id: host-tab-close
    title: agent나 사람 token이 자기가 연 탭을 닫는다
