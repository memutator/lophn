id: agents-tab-instructions-card-empty
title: 'Agents 탭의 Instructions 카드가 LOPHN.md 내용을 늘 비워 보인다'
kind: bug
status: fixed
topic: agent-definition
modules: [packages/shell/renderer, packages/shell/ipc]
now: |
  Agents 탭의 Instructions 카드(`packages/shell/renderer/workspace/agents/agents-tab.tsx` 132의 미리보기)는 `core-source.ts`의 `instructionsOf`가 `core-extensions.ts`의 `readInstructions`로 채운다. `readInstructions`는 `instructions.open`(`packages/shell/ipc/instructions.ts`)으로 document와 version을 받은 뒤 `link.worker("documents", "read", …)`를 부른다. `documents.read` route는 protocol에 없고, main의 allowlist(`packages/shell/main/desktop/core/allowlist.ts`)는 `worker` 종류를 받지 않으며, core의 worker route 종류도 지웠다(changelog 0.6.0). 그래서 실패를 `""`로 삼키고 카드는 늘 빈 미리보기다. renderer의 `Link.worker`(`core-link.ts` 29·43·59·73)와 IPC kind의 `"worker"`(`packages/shell/ipc/core.ts` 13)도 이것 하나 때문에 남았다.
impact: |
  사람이 Agents 탭에서 project 지침이 비어 있는 줄 안다. 실제로는 그 project의 모든 agent prompt에 LOPHN.md가 실린다(`instructions.get`). [Edit]으로 열면 내용이 있다.
fix: |
  - [Edit]이 여는 길(`instructions.open`이 주는 `path`)의 본문을 shell main이 읽어 돌려주게 하고 `Link.worker`와 `"worker"` kind를 지운다(작음). **추천.** 지침 본문을 읽는 user route(`instructions.preview`)는 전역 층만 받아, project 층을 더하면 core route를 넓혀야 한다.
  - core `instructions.preview`에 `layer: "project"`와 `place`를 더한다(중간. route와 actor 판정을 같이 고친다).
closed: |
  첫째 안으로 고쳤다. `readInstructions`(`packages/shell/renderer/workspace/agents/core-extensions.ts`)가 `instructions.open`이 주는 path를 shell main의 file read(`lophnFiles.read`, `FILE_READ_CHANNEL`)로 읽고, 파일이 없거나 읽지 못하면 빈 글이다. renderer의 `Link.worker`와 IPC kind `"worker"`를 지웠다. core route는 넓히지 않았다. 화면에 보일 data를 채우는 길이라 test는 두지 않았다.
guard: 없음
