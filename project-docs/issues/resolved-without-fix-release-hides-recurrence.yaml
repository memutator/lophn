id: resolved-without-fix-release-hides-recurrence
title: 고친 release 없이 resolved로 바꾸면 같은 release의 새 발생이 묻힌다
kind: bug
status: fixed
topic: problems
modules: [packages/protocol, packages/core/agent-workspaces]
now: |
  - `problem.set_state`(`packages/core/problems/grouping/commands.ts`, actors agent와 user)는 resolved로 바꿀 때 고친 release가 있는지 보지 않는다.
  - 해결됨인 problem은 새 발생의 release가 해결 시각 뒤에 activate되었을 때만 다시 열린다(`packages/core/problems/reporting/model.ts`의 `reopenDecision`). 그보다 앞선 release의 발생은 쌓이기만 한다(`packages/core/problems/reporting/commands.ts`의 `reopenIfRecurred`).
  - App Engineer 지침은 "Use `problem.set_state` only when the evidence supports the new state"라고만 한다.
impact: |
  App Engineer가 고친 release 없이 problem을 resolved로 바꾸면, 같은 release에서 계속 나는 발생이 그 problem에 조용히 쌓인다. `ProblemReopened`가 없으니 program은 App Engineer를 다시 부르지 않고, 사람의 열린 문제 목록에서도 빠진다. 앱이 계속 실패하는데 아무도 모른다.
fix: |
  - agent 자격이 resolved로 바꿀 때는, 마지막 발생의 release보다 뒤에 activate된 active release가 있어야 받는다(작음). 사람은 지금처럼 바꿀 수 있다. 고친 release 없이 닫을 일(설정을 바꿔 고친 것)은 agent가 사람에게 묻는다.
  - 해결됨 뒤의 발생은 release와 상관없이 다시 연다(작음). 다만 옛 release가 drain되는 동안의 발생에도 다시 열려, reaction이 되풀이된다.
  - 지침에 "고친 release가 active가 된 뒤에만 resolved"를 쓴다(작음). program이 막지는 않는다.
  - 추천: 첫째.
decided: |
  program이 막는다(사람). agent 자격의 resolved는 마지막 발생의 release보다 뒤에 activate된 active release가 있을 때만 받는다. 사람은 지금처럼 바꾼다. App Engineer 지침에는 같은 조건을 썼다(고친 release가 active가 된 뒤에만 resolved, 고친 release 없이 닫아야 하면 `ask`). program이 막는 것은 남았다.
closed: |
  `problem.set_state`(`packages/core/problems/grouping/commands.ts`)가 agent 자격의 resolved를 마지막 발생의 release보다 뒤에 activate된 다른 active release가 있을 때만 받고(`agentResolveDecision`), 아니면 `conflict`다. 비교할 수 없으면(모르는 release, 같은 release, activate 시각 없음) 닫지 않는다. 사람은 이 조건 없이 바꾼다. tool 설명과 App Engineer 지침이 같은 조건과 `ask`를 말한다.
guard: packages/core/problems/reporting/model_test.ts의 agentResolveDecision
