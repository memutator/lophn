id: remote-app-self-call-and-win-packaging
version: 0.23.176
platform_note: none
title: "같은 앱의 원격 self-call·slug 풀이와 Windows 패키징·npm-entry 수정"
modules: [packages/protocol, packages/core/apps, tools]
change: |
  전:
    - `brokerAppCallInputSchema`와 `toolCallInputSchema`의 `target.app`이 `app_` id만 받아 앱이 slug로 `connectCommands`를 부르면 `invalid_input`으로 거절됐다.
    - 같은 앱이 다른 컴퓨터의 자기 command를 부를 때도 보내는 쪽(`forward.ts`)에서 `app.call` grant를 요구하고, 받는 쪽(`gate.ts`)에서 `public: true`만 허용해 `app_connections: []`·비공개 command 구조의 원격 자기 호출이 막혔다.
    - Windows에서 `npm-entry.ts`가 Windows 절대 경로를 `file://` URL 없이 `import()`해 실패했고, `tools/package/main.ts`가 `@lophn/*` `.ts` 파일을 `node_modules`에 그대로 복사해 Node 24 type stripping 거부와 `tools/empty-package` 누락 문제가 있었다.
  후:
    - `appRefSchema`로 `app_` id와 slug를 함께 받고, core(`service.ts`·`routes.ts`)가 이 기계의 `apps` 표에서 slug를 `app_` id로 푼다.
    - 보내는 쪽은 `caller.app === target.app`이면 `app.call` grant를 묻지 않고, 받는 쪽은 같은 앱의 원격 호출(`sameApp`)이면 `public: false` command도 허용한다(workspace `private` 규칙과 터미널 입력 허락은 그대로 유지).
    - `npm-entry.ts`가 `pathToFileURL(cli).href`로 import하고, Windows 패키징은 `@lophn/*`를 `platform/packages/*`를 상대 경로로 re-export하는 `.mjs` stub으로 만들며 `tools/empty-package`를 staging 후 정리한다.
why: |
  Agent Monitor처럼 `connectCommands(<slug>, ..., { on })`로 다른 컴퓨터의 자기 command를 부르는 앱이 slug 거절과 self-call Gate·grant 체크에 막혔고, Windows 설치본의 앱 패키징과 `npm-entry` 실행이 깨졌다.
checklist:
  - "해야: Windows와 원격 머신(VM 등) 양쪽 lophn을 0.23.176으로 업데이트한다"
  - "Agent Monitor에서 다른 컴퓨터(VM)를 골랐을 때 정상적으로 프로세스 목록이 보이는지 확인한다"
