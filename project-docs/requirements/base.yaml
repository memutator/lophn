schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # secret 찾기

  - id: req-0600
    status: accepted
    subject: base
    statement: 등록된 secret 값은 개수와 상관없이 긴 값부터 정확히 찾아 출력에서 모두 가린다.
    acceptance:
      - 서로 겹치는 값, 65개가 넘는 값을 등록하고 출력을 만들면 어느 값도 남지 않는다.

  - id: req-0601
    status: accepted
    subject: base
    statement: lophn을 다시 띄우거나 잠금을 푼 뒤에도 secret을 쓰기 전에 다시 등록해 가림이 이어진다.
    acceptance:
      - lophn을 다시 시작한 뒤 secret을 쓰는 출력을 만들면 원문이 가려진다.

  - id: req-0602
    status: accepted
    subject: base
    statement: 등록하지 않은 secret도 고정한 규칙(잘 알려진 key prefix, PEM 개인 키)으로 입력과 출력에서 같은 판정으로 찾는다.
    acceptance:
      - OpenAI, Anthropic, GitHub, AWS, Slack key, JWT, PEM 표본이 입력과 출력에서 모두 찾아진다.
      - 규칙을 바꾸면 입력과 출력 양쪽에 같이 적용된다.

  - id: req-0603
    status: accepted
    subject: base
    statement: Authorization·Cookie header, URL의 사용자 이름·password·인증 query, JSON의 secret·token·password·credential 값은 중첩 구조와 오류 안에서도 가린다.
    acceptance:
      - 중첩 배열과 object 안의 header, URL, JSON 인증 값을 무작위 문자열로 바꿔도 저장과 출력에 원문이 남지 않는다.

  - id: req-0604
    status: accepted
    subject: base
    statement: stream 조각 경계에 걸친 secret도 text와 JSON 출력에서 가린다.
    acceptance:
      - secret을 여러 조각에 나눠 보내면 이어 붙인 출력에 원문이 없다.

  # 가린 표시

  - id: req-0605
    status: accepted
    subject: base
    statement: 가린 자리는 값의 길이나 종류와 상관없이 같은 표시 하나로 바꾸고, 앞뒤 문자, 원래 길이, hash를 남기지 않는다.
    acceptance:
      - 길이와 종류가 다른 secret이 같은 표시로 바뀐다.
      - 표시에서 원래 길이와 일부 문자를 알 수 없다.

  # 개인정보와 밖으로 보내는 자료

  - id: req-0606
    status: accepted
    subject: base
    statement: 자료를 밖으로 보내기 전에는 그 자료의 소유자가 선언한 칸만 남기고, 선언하지 않은 칸은 빼거나 자료 안에서만 통하는 표식으로 바꾼다.
    acceptance:
      - 선언하지 않은 칸(중첩 값, email, 개인 경로가 든 칸 포함)이 있는 자료를 처리하면 결과에는 선언한 칸만 남는다.

  # 폐기: 값만 보고 개인정보인지 판정할 수 없다. 밖으로 보낼 때 선언한 칸만 남기는 것은 req-0606이 맡는다.
  - id: req-0607
    status: rejected
    subject: base
    statement: 필드 이름만 바꾼 개인정보는 통과시키지 않는다.
    acceptance:
      - 이름만 바꾼 개인정보를 넣으면 걸러진다.

  - id: req-0608
    status: accepted
    subject: base
    statement: 가명 표식은 정해진 범위 안에서만 비교되고, 그 범위 밖에서는 비교할 수 없다.
    acceptance:
      - 가명 표식을 정해진 비교 범위 밖에서 비교할 수 없다.

  # 폐기: "값을 짐작할 수 있는 구조"의 기준이 없어 판정할 수 없다.
  - id: req-0609
    status: rejected
    subject: base
    statement: 값의 type과 길이도 공개 기준으로 검사하고, 빼기로 한 값은 그 값을 짐작할 수 있는 구조까지 뺀다.
    acceptance:
      - 길이로 값을 추정할 수 있는 필드와 통째로 제외한 필드를 넣으면 결과에서 길이와 구조가 드러나지 않는다.

  # 실패할 때와 저장된 자료

  # 폐기: redaction에 실패하거나 지원하지 않는 매체라고 원문을 막는 coding agent는 없다. 사람이 annotate mode로 고른 screenshot도 model에 보낸다.
  - id: req-0610
    status: rejected
    subject: base
    statement: 가리기가 실패하거나 한도를 넘거나 지원하지 않는 매체를 만나면 원문을 내보내지 않고, 빠진 범위와 안전한 이유만 남긴다.
    acceptance:
      - 검사 예외, timeout, 지원하지 않는 이미지, 한도 초과를 각각 넣으면 원문과 부분 원문이 나오지 않고 생략 이유가 남는다.
      - 가릴 수 없는 원문이 든 오류 상세를 진단에서 펼쳐도 처리되지 않은 원문과 stack이 나오지 않고 제외 이유가 보인다.

  - id: req-0611
    status: accepted
    subject: base
    statement: 이미 가려서 저장한 자료도 조회와 model 전송 전에 현재 규칙으로 다시 가리고, 저장된 원본은 바꾸지 않는다.
    acceptance:
      - 규칙을 강화한 뒤 저장 자료를 조회하면 새로 걸리는 값이 출력에서 가려진다.
      - 저장된 원본의 hash는 그대로다.

  - id: req-0612
    status: accepted
    subject: base
    statement: 잘못 모은 secret이나 개인정보를 지우거나 막은 기록에는 값, 공개 hash, 값의 일부를 다시 담지 않는다.
    acceptance:
      - 민감 자료를 막은 뒤 남은 event, 오류, 정리 결과에서 원값과 일부를 찾을 수 없다.

  - id: req-0613
    status: accepted
    subject: base
    statement: 가릴 수 있는 최소 길이보다 짧은 값은 secret으로 등록하지 않는다.
    acceptance:
      - 최소 길이보다 짧은 값을 secret으로 등록하려 하면 거절되고 그 이유가 나온다.
