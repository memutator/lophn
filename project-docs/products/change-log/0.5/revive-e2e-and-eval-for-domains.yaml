id: revive-e2e-and-eval-for-domains
version: 0.5.0
title: e2e와 eval을 domain 설계에 맞춰 되살리고 land의 e2e 검사를 다시 켬
modules: [packages/core/projects, tests]
checked: [tool-e2e]
change: |
  전:
  - domain 계획 여섯은 e2e를 돌리지 않고 type만 맞췄다. e2e 29 file 가운데 셋(`app-call`, `app-data-rewind`, `operator`)이 떨어졌고 land는 `LOPHN_LAND_SKIP_E2E=1`로 돌았다.
  - domain을 만들면 kind 감시가 domain 폴더가 생기기 전에 열려 감시가 열리지 않았다. 그래서 처음 쓴 `kinds.yaml`의 위반이 다음 command까지 domain problem이 되지 않았다.
  - eval 자료는 옛 선언(`app_api`, `@lophn/cap-app-api`, `project_scope`)과 project의 kind 파일을 썼다. eval 참가자는 App Engineer를 몰랐고, 앱의 일을 `<slug>-project`의 Project Manager에게 보내는지 쟀다. registry는 file의 n이 `max + 1`이 아니면 run을 멈췄다.
  후:
  - kind 감시가 감시를 열기 전에 domain 폴더를 만든다(`packages/core/projects/kinds/host/watch/service.ts`). 만들지 못하면 전처럼 `incomplete`로 두고 다음 command에서 다시 연다.
  - 떨어지던 셋은 새 설계대로 숨겨진 것이었다. template tool은 `public: false`라 domain을 맡지 않은 lophn과 project의 Operator에게 보이지 않는다. 그래서 그 행들은 앱 place의 Operator로 부른다.
  - 새 e2e flow 셋이 생겼다.
    - `app-release_test.ts`의 `coding-mcp-preview-only`: coding token으로 core `/mcp`를 부르면 preview가 없을 때는 `unavailable`이고, preview가 있으면 그 preview에만 닿는다. live ledger와 data는 그대로다.
    - `kinds_test.ts`: 처음 쓴 kind 파일의 위반이 kinds worker를 거쳐 domain problem이 되고, 그 project의 Project Manager session이 한 번 열린다.
    - `operator_test.ts`의 `domain-narrowed`: domain 하나로 좁힌 Operator의 model 요청에는 그 domain의 `DOMAIN.md`와 tool, 다른 domain의 public tool만 있다.
  - 전체 e2e는 30 file 59 test가 8분 29초에 통과한다. land는 다시 e2e를 돈다.
  - eval 자료의 새 판이 생겼다: `notify-app@2`, `date-range@2`, `calendar-call@3`, `calendar-app@2`, `calendar-app-bug@2`, `calendar-data@2`, `tax-kinds@2`, `operators-home@4`. 옛 판은 그대로다.
  - eval 참가자는 role 넷 모두다. 앱의 일은 그 앱의 App Engineer가 받는다. PM이 앱 일을 하던 CA1-ask·CA12는 `scenarios/app-engineer/`의 A1-ask·A12로 돌아갔다. criterion `card-covered`·`asked-again`·`root-cause`는 `@3`이다.
  - registry는 가장 큰 n보다 큰 새 n을 받는다(빈 n을 건너뛰어도 된다). variant는 자기 `.dev-data/e2e/deno-dir`이 비었으면 `deno task e2e:deps`를 돈다.
  닫은 이슈: eval "variant의 e2e deno-dir symlink로 gate의 앱 E2E가 모두 떨어진다", "L7의 `read-all`은 `app.get` 이름만 받는다", "T19-op은 막힌 call이 생기지 않아 재지 못한다", "eval materials의 앱 source가 옛 app-api 선언과 SDK 이름을 쓴다", "tax-kinds material이 kind 파일을 project에 둔다"; agent-call "e2e의 Project Manager 줄이 PM 요청을 옛 App Engineer 줄로 보낸다".
why: |
  e2e를 돌리지 않은 채 domain 계획 여섯이 쌓여 land가 e2e를 건너뛰었고, eval은 옛 선언으로 앱을 깔지 못해 돌지 않았다. 둘 다 새 설계로 다시 돌아야 다음 계획이 회귀를 본다.
decisions:
  - text: |
      옛 e2e는 고쳐 살리지 않는다. 그대로 통과하면 두고, flow가 있으면 새 설계로 다시 쓰고, flow가 없어졌으면 지운다.
    by: agent
  - text: |
      새 e2e flow는 셋이다(coding agent MCP preview, kind 위반에서 domain problem까지, Operator domain 좁히기). (2026-10-20)
    by: person
  - text: |
      비공개 앱 tool을 부르는 e2e 행은 tool을 `public: true`로 바꾸지 않고 앱 place의 Operator로 부른다. public tool 장치(`app.usage`, release 막기)를 끌어들이지 않으려는 것이다.
    by: agent
  - text: |
      eval 재료 판은 불변이다. 내용이 같아도 needs가 옛 판을 가리키면 needs만 바꾼 새 판을 만든다.
    by: agent
  - text: |
      전체 e2e가 9분 안이라 `reaction_test` crash-loop를 unit으로 내리는 task는 띄우지 않았다.
    by: agent
  - text: |
      wave 1의 land는 `LOPHN_LAND_SKIP_E2E=1` 대신 e2e를 포함해 돌았다. classifier가 skip을 막았고, 모든 e2e가 통과했다.
    by: agent
follow_up: |
  바꾼 시나리오를 진짜 model로 한 번씩 돌려 되살아났는지 본다. 이 계획에서는 auto mode classifier가 진짜 provider 호출을 막아 돌리지 못했다(사람이 정한다). 월말정리 Operator를 앱 place로 옮기는 일은 `project-docs/issues/eval.md`가 안다.
