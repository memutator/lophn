id: machine-environment-lacks-update-state
title: agent가 따라가기 상태, 기다리는 변경, 기계의 꼴 판 범위를 읽을 길이 없다
kind: bug
status: open
topic: folder-sync
modules: [packages/core/folder, packages/cli]
now: |
  agent가 읽는 `machine/environment`(`packages/core/folder/environment.ts`)의 답에는 기계마다의 폴더 꼴 판 범위(`exchange`)와 앱마다의 따라가기 상태(`follow`), 기다리는 변경, 기계마다의 release(`apps/update_state`가 화면에 내는 값)가 없다: 끝에서 끝 확인에서 `lophn machine environment`는 lophn_version, record_at만 보였고, Beta가 범위 밖일 때도 imports 오류 말고는 아무것도 말하지 않았다. 같은 값을 내는 route apps/update_state는 actor에 agent가 있지만 CLI 명령이 없어 lophn agent의 tool로 부를 수 없다.
impact: |
  사람이 앱 agent에게 "왜 다른 컴퓨터가 새 release로 안 바뀌나", "왜 변경이 안 오나"를 물으면 agent는 따라가기 상태(동의 대기, 거절, 실패 이유, diverged)와 기다리는 변경 수를 모르고 답하지 못한다. diverged를 풀려면 agent가 합쳐야 하는데 agent가 그것을 알 길이 App details를 본 사람의 말뿐이다.
fix: |
  작음(추천): machine.environment의 machines[]에 `exchange`, apps[]에 `follow`·held·기계마다의 release를 apps/update_state와 같은 값으로 싣는다(folder wiring이 follow와 importer.exchange를 이미 든다). guidance(design-app folder-sync)에 그 칸을 읽는 법 한 줄.
  작음: `lophn app update-state <app>` CLI 명령을 더한다.
