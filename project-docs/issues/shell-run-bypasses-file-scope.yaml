id: shell-run-bypasses-file-scope
title: '`shell.run`이 file 범위와 rewind를 거치지 않는다'
kind: bug
status: kept
topic: workspace-session
modules: [packages/core/lophn-agent, packages/core/agent-workspaces]
now: 모든 workspace 종류(home·project·app)의 tool 목록에 `shell.run`이 있다(`packages/protocol/lophn-agent/tool-lists.ts`의 `COMMON_TOOLS`). `packages/core/lophn-agent/tools/shell/run.ts`의 `runShell`은 범위의 base 폴더(home은 OS home 폴더)에서 `/bin/sh`를 띄운다. 자식 process에는 아무 권한 제한이 없다. OS sandbox는 없다. 판정은 shell 규칙(제품 floor·ask, Settings의 전역·project 층, `architecture/approval.md`)이 하고 effect는 `external`이다. 규칙에 걸리지 않는 명령은 묻지 않고 돈다. rewind 기록은 `file.write`·`file.edit`만 남긴다(`packages/core/agent-workspaces/hooks.ts`의 `FILE_HOOKS`).
impact: agent가 shell로 file 범위 밖 파일을 읽고 쓰거나 지워도 막는 것이 없다. 그렇게 바꾼 사람의 파일은 session rewind로 되돌아오지 않는다. AGENTS.md "속도"가 막으라는 agent 실수(데이터 잃기, 폴더 밖 쓰기)다. workspace 종류의 file 범위(project는 project 폴더, 받은 domain 폴더, `workflows/`, app은 앱 source와 받은 domain 폴더)도 shell로는 지켜지지 않는다.
fix: |
  - project workspace 종류의 목록에서 `shell.run`을 뺀다. 작음. 계산이나 변환이 필요한 일은 내장 tool과 앱 command로 한다. app workspace는 앱 test와 type 검사(A6)에 shell이 필요해 남는다.
  - `shell.run`을 OS sandbox(bubblewrap 등)로 범위 폴더만 보이게 띄우고, 쓰기는 rewind 기록을 위해 막는다(읽기 전용). 중간~큼. 플랫폼마다 다르다.

  추천: 첫째. project workspace에서 shell이 필요한 경우를 아직 보지 못했다.
decided: '(사람, 2026-10-19): 일단 그대로 둔다.'
closed: |
  사람이 그대로 두기로 정했다(`decided`). shell 규칙은 경계가 아니고 `shell.run`은 file 범위와 rewind 밖이라는 것을 `architecture/approval.md`가 말한다. agent가 shell로 범위 밖 file을 망가뜨린 일이 생기면 `regressed`로 되살리고 project workspace에서 `shell.run`을 빼거나 OS sandbox를 둔다.
guard: 없음
