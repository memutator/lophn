  # ---- router: 받는 session 고르기와 call 정리 ----
  - id: calls-recover-on-start
    title: "core가 켜질 때 꺼지기 전 끝나지 못한 call과 turn을 닫는다"
    actor: system
    entries: [route:calls/recover]
    boundary: [router, run-loop]
    code:
      - packages/core/router/commands.ts
      - packages/core/router/router.ts
    steps:
      - "core 안 machine이 아니면 forbidden이다(requireMachine)."
      - "router나 environment가 아직 없으면 unavailable이다."
      - "잃어버린 call(받았으나 turn이 가져가지 않은 call, 기다리던 ask call)을 lophn_restarted로 닫는다. notify가 true면 살아 있는 보낸 session에 알림을 넣는다."
      - "도는 turn을 interrupted(restarted)로 닫는다. queue와 앱 줄은 메모리라 이 tx 밖이다."
      - "닫은 failed·interrupted 수를 돌려준다. 알림 글 준비, 실패 log, 기동을 잇는 일은 wiring이 맡는다(agents call-restart-recovery)."
    outcomes:
      - id: ok
        observe: [ledger:agent_calls, ledger:turns, response]
        when: "잃어버린 call과 도는 turn을 닫았다(failed, interrupted 수를 돌려준다)"
      - id: forbidden
        code: forbidden
        when: "core 안 machine이 아닌 호출자다(requireMachine)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "router나 environment가 아직 없다"
        observe: [response]
    crosses_process: false
    refs: [T9]
    docs: [architecture/agent-call.md, architecture/workspace-session.md]
    declared_only: [internal]
    unclear:
      - "route가 internal을 선언하지만 handler는 internal을 만들지 않는다. 못 읽는 call 행은 건너뛰고 router가 internal을 내는 경로가 없다(선언을 고칠 곳)"
      - "failLostOnStart의 store.move와 알림 쓰기(transport.deliver)가 돌려주는 오류는 route 선언 errors(forbidden·unavailable·internal) 밖이고, 목록에서 나온 call에는 거의 나지 않아 outcome으로 쓰지 않았다"

  - id: queue-restore-on-start
    title: "켜질 때 접수만 되고 turn이 가져가지 않은 사람 메시지를 queue에 되돌린다"
    actor: system
    entries: [system:queue-restore]
    uses: [route:messages/body]
    boundary: [router, run-loop]
    code:
      - packages/core/main/daemon/wiring/router.ts
      - packages/core/lophn-agent/session/message-commands.ts
    steps:
      - "기록에서 turn이 가져가지 않은 사람 메시지를 접수 순서대로 고른다. 열린 session만, fork 복사본, rewind가 숨긴 구간, 명령 기록, unattended(run 입력)는 뺀다."
      - "session이 없거나 archive됐거나 workspace가 보관됐거나 lophn runtime이 아니면(harness session은 harness wiring이 되돌린다) 말없이 건너뛴다."
      - "본문을 blob에서 읽어(io child) next_turn 입력으로 queue에 넣는다(접수 시각을 그대로 쓴다). 본문을 못 읽으면 log에 남기고 건너뛴다."
    outcomes:
      - id: ok
        observe: [event:MessageReceived]
        when: "queue에 다시 넣었다. 다음 turn이 열린다"
      - id: skipped
        observe: [ledger:messages]
        when: "보관된 session, harness session, session이 없는 메시지라 건너뛰었다(log는 남지 않는다)"
      - id: body-unreadable
        observe: [log:router]
        when: "본문을 못 읽어 건너뛰었다(requeue_message_failed)"
    crosses_process: true
    unclear:
      - "turns의 turn-restart(input-requeued)가 같은 start 되돌리기를 적는다. crosses_process는 여기서 true(본문을 blob에서 읽는다)이고 turns 쪽은 false다. 한쪽으로 모을지 정할 것"

  - id: custom-reply-auto
    title: "custom session이 result call을 받은 turn을 끝내면 마지막 답을 그 call의 답으로 보낸다"
    actor: system
    entries: [route:calls/auto-reply]
    boundary: [router]
    code:
      - packages/core/router/commands.ts
      - packages/core/router/router.ts
      - packages/core/main/daemon/wiring/custom-reply.ts
    steps:
      - "route를 부르기 전에 wiring이 마지막 답 글을 redaction하고 blob으로 준비한다. 끝내지 못하면 route를 부르지 않고 unavailable이다."
      - "route는 호출자가 core 안 machine인지 본다(forbidden). call을 찾는다(없으면 not_found). 그 call의 보낸 쪽도 받는 쪽도 아니면 forbidden이다."
      - "reply가 none인 call이면 conflict다. 이미 끝난 call이면 delivered false·closed true로 돌려준다."
      - "아니면 받는 session에 답을 next_turn 입력으로 넣고, result call이면 call을 done으로 닫는다. 받을 session이 없거나 닫혔으면 답은 call 기록에만 남는다(delivered false)."
    outcomes:
