id: issues-trimmed-plan-folders
version: 0.2.0
title: "열린 이슈를 문제만 남게 줄이고, 계획을 계획마다 폴더와 lead branch로 돌림"
modules: [tools]
checked: [skill-orchestrate, tool-plan-status, tool-lead, plan]
change: |
  전: 열린 이슈 70개. worker 보고의 "무겁게 짠 것"·"알려진 미완 동작"을 모두 이슈로 올려 닫는 만큼 다시 쌓임. 확인 못 한 메모, 사실 설명, 손해가 구체적이지 않은 무게가 섞임. 계획은 `plan/` 한 벌이라 하나만 돌 수 있고 lead가 main checkout에서 merge함.
  후: 열린 이슈 21개(진짜 bug 12, 줄이기로 정한 무게 2, 일부러 미룬 것 5, mistake 2), archived 76개. `issue` skill에 "올릴지" 절(누가 무엇을 잃나가 구체적일 때만, 확인 못 함·사실·작은 follow-up은 올리지 않음). 계획은 `plan/<계획>/` 폴더 하나씩이고 tool이 계획 이름을 받음. lead는 branch `plan/<계획>`의 worktree에서 task를 합치고 wave 끝에 `land.sh`로 main에 올림. `status.py ready`가 다른 계획의 running task와 소유 겹침을 거름.
  - 새로 찾은 bug: agent runtime의 Deno 권한에 place 폴더가 없어 data root 밖 project 폴더를 agent가 못 읽음(`place-session.md`). OpenCode가 idle마다 `session.status`와 `session.idle`을 둘 다 내 `TurnEnded`가 겹침(`coding-agent.md`).
  - mistake "core를 subshell로 띄워 `$!`가 deno를 가리키지 않음"은 worker-prompt의 기동 한 줄로 막아 닫음.
why: |
  이슈가 쌓이면 아무도 안 본다. 계획 둘(ui-kit, harness-domain)을 같이 돌리려면 lead가 서로의 작업 트리와 main을 건드리지 않아야 한다.
decisions:
  - text: |-
      무거운 내부 구현은 사람에게 묻지 않고 lead가 "줄인다" 또는 kept로 정한다. "다이어트 계획에서 정한다" 같은 미루기를 만들지 않는다.
    by: agent
  - text: |-
      확인 못 한 것은 이슈가 아니라 merge 전에 확인할 일이다.
    by: person
  - text: |-
      lead는 main checkout에서 일하지 않는다. main에는 land.sh(rebase, full check, core 기동)를 거친 것만 올라간다.
    by: person
