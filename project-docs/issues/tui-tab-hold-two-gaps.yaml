id: tui-tab-hold-two-gaps
title: 창이 없어 30초 넘게 기다린 TUI 탭 열기는 hold가 풀려 headless turn과 겹칠 수 있다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/core/host-queue, packages/shell/main, packages/shell/renderer]
now: |
  core는 `tabs/open --tui` 때 30초 예약 hold를 걸고 shell main이 `/host-link`의 `hello`·`visible`로 알린 TUI 탭 목록으로 이어 간다(`packages/core/host-queue/hold.ts`). 목록은 renderer가 탭을 만든 순간 `shell:surface-report {tui}`로 알린 것이다(`packages/shell/main/terminal/harness-tui.ts`). 그 workspace를 보이는 창이 없어 요청이 host queue에서 30초 넘게 기다리면(browser가 아닌 `openTab`은 기한이 없다) 예약이 끝나 headless turn이 시작할 수 있고, 뒤에 탭이 생기면 TUI가 그 turn과 겹친다(`tabs/open`은 연 때만 도는 turn을 거절한다). 앞서 같이 적었던 "창 reload나 앱 재시작으로 되살아난 TUI 탭"은 틈이 아니다. reload는 shell main의 탭 표가 남고, 재시작은 터미널 탭의 PTY를 되살리지 않아 TUI가 없다.
impact: 한 CLI session에 headless process와 TUI process가 같이 써 그 CLI의 대화 기록이 섞이거나 깨질 수 있다. 사람이 TUI에서 한 일이 headless turn과 엉킨다.
fix: |
  (작음, 추천) shell main이 탭을 만들 때 그 harness session이 돌고 있으면 탭을 열지 않고 retry로 둔다.
closed: |
  TUI 탭을 창에 내기 전에 session을 hold하고, 그 session이 돌거나 기다리는 중이면 hold를 놓고 retry로 답한다.
guard: 없음
