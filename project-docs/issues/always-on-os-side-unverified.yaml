id: always-on-os-side-unverified
title: "늘 켜 둠의 OS 쪽은 어느 실제 기계에서도 돌려 보지 않았다"
kind: bug
status: open
topic: platform
modules: [packages/core/always-on, packages/core/main, packages/shell/main]
now: |
  OS port(`packages/core/always-on/os/`)의 등록 글 만들기와 OS 답 읽기는 fake exec·fake spawn으로만 test했다(`os_test.ts`). 실제로 돌려 본 적이 없는 것:
  - Linux systemd user unit 쓰기·`daemon-reload`·`enable`·`is-enabled`·`disable`(개발 기계의 사람 user systemd를 바꾸므로 하지 않았다), 로그인 뒤 unit이 core를 띄우는지, `Restart=on-failure`와 `ConditionPathExists`.
  - macOS LaunchAgent plist와 `launchctl enable|disable|print-disabled`, `/bin/sh -c` guard, `KeepAlive`의 `SuccessfulExit=false`.
  - Windows `reg.exe add|query|delete`와 StartupApproved 값 읽기, `Run` 값이 `--core --home`으로 core를 띄우는지.
  - keep-awake child 셋(`systemd-inhibit`, `caffeinate -i -w`, PowerShell `SetThreadExecutionState`)이 실제로 잠들기를 막는지, core가 죽으면 풀리는지.
  - 놓을 때 child tree 끄기(`packages/core/main/daemon/main.ts`의 `spawnHolder`: POSIX group kill, Windows `taskkill /T`).
  - NSIS 제거 macro(`packages/shell/main/packaging/installer.nsh`)는 compile도 하지 않았다.
  개발 core는 설치 layout이 아니라 OS port가 없어(`entry-layout.ts`) 이 길을 타지 않는다.
impact: |
  설치본에서 스위치를 켠 사람이 처음으로 이 길을 탄다. OS 답의 꼴이 다르거나(언어, 판) 명령이 다르게 굴면 status가 거짓을 보이거나(등록됐는데 not_registered, 그 반대), 로그인 때 core가 뜨지 않거나, keep-awake가 아무것도 막지 않거나, NSIS build가 깨진다.
fix: |
  사람이 deb·dmg·NSIS 설치본에서 change-log `always-on`의 checklist를 돌린다(작음, 사람 시간). 틀린 것은 그때 bug로 고친다. NSIS는 `npm run package`를 Windows에서 한 번 돌려 macro가 compile되는지부터 본다. 추천.
