id: claude-usage-resets-on-reopen
title: Claude GUI를 다시 열면 토큰 합계와 비용이 0부터 다시 센다
kind: bug
status: fixed
topic: harness-gui
modules: [packages/shell/main]
now: |
  `claude.ts`의 `totals`·`cost`는 run 메모리에만 있고 `onResult`에서만 더한다. resume, TUI→GUI toggle, `open_session`은 새 run이거나 `resetStats`를 거쳐 0부터 시작하고, `replay`는 transcript의 사용량을 읽지 않는다. transcript에는 assistant entry마다 `message.usage`가 있다. CLI가 resume에 쓰는 `cost-state` entry(`totalCostUSD`, `modelUsage`)도 있다.
impact: |
  GUI의 사용량 칸(input·output·cache token, turn 수, 비용)이 다시 열 때마다 앞 대화를 잃는다. TUI는 같은 session의 비용을 이어 센다.
fix: |
  `replay`에서 transcript의 마지막 `cost-state`로 합계와 `cost.base`를 채운다. 없으면 assistant `message.usage`를 `message.id`와 `requestId`로 중복을 빼고 합한다(같은 message가 content block마다 반복된다). 작음. 추천.
closed: |
  `claude.ts`의 `restoreUsage`가 replay 끝에 transcript의 마지막 `cost-state`(없으면 assistant usage를 `message.id:requestId`로 중복을 빼고 합함)로 합계와 비용을 되살린다. 원본 줄은 SDK `importSessionToStore`로 메모리 store에 읽는다(@alpha). resume한 CLI의 `total_cost_usd`는 session 누적이라 되살린 비용은 `cost.last`에 둔다. 실패하면 조용히 넘어간다.
guard: '`packages/shell/main/extensions/bundled/harness-gui/claude_test.ts` resume usage test'
