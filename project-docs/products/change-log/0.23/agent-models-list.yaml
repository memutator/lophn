id: agent-models-list
version: 0.23.39
title: agent가 사람이 켠 model과 지원 옵션을 조회한다
modules: [packages/cli]
change: |
  lophn agent models 명령을 모든 workspace의 CLI와 lophn tool에 더한다.
  사람이 model picker에서 켠 model 가운데 지금 고를 수 있는 것의 provider ID·이름,
  model 이름, 옵션 축·지원 값·기본값, 한도, media, 가격을 함께 돌려준다.
  catalog 미확인 정보는 null이고 provider 계정·credential·접속 metadata와 option wire는 싣지 않는다.
why: |
  agent.create/update는 model과 option_values를 받지만 agent가 실제 켠 model과 지원 값을
  조회할 길이 없어 설정에 필요한 provider ID와 옵션을 추측해야 했다.
decisions:
  - text: 기존 agent 명령 아래에 둬 새 앱 slug 예약 없이 model 설정을 발견하게 한다. model 목록은 prompt에 고정 주입하지 않고 필요할 때 읽는다.
    by: agent
  - text: picker와 같은 선택 규칙과 기존 읽기 route를 쓰고 저장된 정보만 읽는다. provider 호출이나 enabled 목록 변경은 하지 않는다.
    by: agent
