schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # 보관

  - id: req-0400
    status: accepted
    subject: secrets
    statement: API key, OAuth token, password, 개인 키의 원값은 lophn data 폴더의 secret 파일 하나에만 두고, 그 파일은 소유자만 읽고 쓸 수 있는 권한(Unix 0600)으로 만들며, lophn의 다른 기록에는 이름만 둔다.
    acceptance:
      - 네 종류의 값을 저장한 뒤 secret 파일 밖의 저장 파일, 설정, process 환경 변수에서 원값이 나오지 않는다.
      - secret 파일은 소유자만 읽고 쓸 수 있다.
      - lophn을 다시 시작한 뒤에도 secret 파일에서 읽어 쓸 수 있다.

  - id: req-0401
    status: accepted
    subject: secrets
    statement: 사람이 직접 넣는 secret 값은 전용 보호 입력으로만 받는다.
    acceptance:
      - 네 종류의 값을 각각 보호 입력에 넣으면 저장된다.
      - agent가 보호 입력을 대신 제출하려 해도 값이 저장되지 않는다.

  # 조회

  - id: req-0402
    status: accepted
    subject: secrets
    statement: agent는 secret 값을 받지 못하고, 허용된 이름의 설정 여부만 조회한다.
    acceptance:
      - agent가 이름, 값, 값의 일부, 보호 참조를 조회하면 허용된 이름의 설정 여부만 돌아오고 값이나 참조는 돌아오지 않는다.

  - id: req-0403
    status: accepted
    subject: secrets
    statement: 허용되지 않은 이름과 없는 이름의 조회에는 같은 응답을 준다.
    acceptance:
      - 허용되지 않은 이름과 등록하지 않은 이름을 각각 조회하면 응답이 구별되지 않는다.

  # 사용

  - id: req-0404
    status: accepted
    subject: secrets
    statement: 허용된 목적지로 가는 인증 요청에서 secret 원값은 전송 직전에 lophn이 붙이고, 어느 호출자에게도 돌려주지 않는다.
    acceptance:
      - 허용된 목적지에 인증 요청을 보내면 성공한다.
      - 그때 agent의 문맥, tool 인자, 앱 코드, 환경 변수, 일반 응답에 원값이 나오지 않고 이름만 나온다.

  - id: req-0405
    status: accepted
    subject: secrets
    statement: 인증을 붙인 요청이 다른 목적지로 redirect되어도 인증은 따라가지 않는다.
    acceptance:
      - 허용된 목적지가 다른 host로 redirect하는 요청을 보내면, redirect 대상으로 가는 요청에 인증이 붙지 않는다.

  # 폐기: "어디에도 남지 않는다"는 판정할 수 없다. 게다가 MCP와 CLI는 그 token을 받아야 일한다.
  - id: req-0406
    status: rejected
    subject: secrets
    statement: lophn이 만든 token의 원문은 보호 저장소 밖에 남지 않는다.
    acceptance:
      - token을 발급해 쓴 뒤 argv, URL, 환경 변수, skill, 안내, 오류, event, model 문맥, 일반 조회 결과에서 token 원문이 나오지 않는다.

  # 교체와 제거

  - id: req-0407
    status: accepted
    subject: secrets
    statement: secret을 교체하다 실패하면 이전 값이 계속 쓰인다.
    acceptance:
      - secret 파일 쓰기 실패를 넣으면 교체 전 값으로 계속 인증된다.
      - 실패한 뒤 secret 파일에는 교체 전 값이 온전히 남는다.

  - id: req-0408
    status: accepted
    subject: secrets
    statement: secret을 교체하거나 지우라고 한 뒤 새로 시작하는 사용은 이전 값을 쓰지 않는다.
    acceptance:
      - 지우기를 요청한 직후 새 요청을 보내면 이전 값이 붙지 않고 사용 불가로 끝난다.

  # 폐기: req-0404(값은 lophn이 보낼 때 붙이고 아무에게도 주지 않는다)와 부딪히고 과하다. 지울 때의 보장은 req-0412가 맡는다.
  - id: req-0409
    status: rejected
    subject: secrets
    statement: 교체·제거가 끝났다는 표시는 keychain 값 삭제와 이전 값을 쓰던 process의 종료가 확인된 뒤에만 한다.
    acceptance:
      - keychain 삭제를 늦추면 완료 표시가 그만큼 늦어진다.
      - 이전 값을 쓰던 process의 종료를 늦추면 완료 표시가 그만큼 늦어진다.
      - 이미 나간 요청을 취소됐다고 표시하지 않는다.

  # secret 파일을 쓸 수 없을 때

  - id: req-0410
    status: accepted
    subject: secrets
    statement: secret 파일을 읽거나 쓸 수 없으면 secret이 필요한 기능만 쓸 수 없고, secret이 필요 없는 기능은 계속 쓴다.
    acceptance:
      - secret 파일을 읽을 수 없게 만들면 secret 기능은 사용 불가 이유와 함께 실패한다.
      - 같은 상태에서 문서와 로컬 앱은 정상으로 동작한다.

  # 폐기: secret을 keychain이 아니라 lophn data 폴더의 파일에 두기로 바꿨다. 다른 곳에 둘 대안이 없다.
  - id: req-0411
    status: rejected
    subject: secrets
    statement: keychain을 쓸 수 없을 때 secret 저장을 시도하면 거절하고, 값을 다른 곳에 두지 않는다.
    acceptance:
      - keychain을 쓸 수 없는 상태에서 secret 저장을 시도하면 거절된다.
      - 그때 평문 파일, 암호화 파일, 환경 변수에 값이 생기지 않는다.

  - id: req-0412
    status: accepted
    subject: secrets
    statement: secret을 지우면 lophn이 가진 사본(secret 파일의 값과 그 값을 가리키는 이름)을 한 번에 지운다.
    acceptance:
      - secret을 지운 뒤 secret 파일에서 그 값을 찾을 수 없다.
      - 지운 secret의 이름을 쓰는 요청은 값이 없다는 오류로 끝난다.
