id: command-and-guide-become-skills
version: 0.6.0
title: "command는 skill이고, guide는 skill이 되고, 지침은 한 번만 말한다"
modules: [packages/core/agent-workspaces, packages/core/apps, packages/core/lophn-agent, packages/core/main, packages/design, packages/protocol, packages/shell/renderer, tools]
checked: [tool-check, context-component-registry, architecture-approval, architecture-testing, architecture-activation, architecture-agent-call, architecture-app-call, architecture-browser-tab, architecture-workspace-layout, architecture-ui-kit, tool-worktree-prep, tool-e2e, tool-test-live, tool-dev, tests-support, tool-models-snapshot, skill-ui-design]
change: |
  전:
  - 필요할 때 읽는 글이 두 길이었다: skill(`skill.read`)과 guide(`guide.read`, `roles/lophn/guides/` 10편). `artifact` guide는 PM·App Engineer·Operator가 읽는 절차인데 guide로만 닿았다.
  - `/` 메뉴는 묶음 셋(built-in 아홉, role 명령, skill)이었다. role 명령(lophn `new-app`·`repair-app`, PM `check-kinds`)은 고정 prompt를, skill 명령은 `Use the "{skill}" skill for this request.`를 보냈고, 둘 다 `/이름` 뒤의 글을 버렸다. `/recap`은 core route가 없어 진짜 source에서 `unavailable`이었다. 메뉴 항목에 `action`(`builtin|prompt|tool|skill`), `skill_origin`, `while_running`이 있었고 `ListCommands`가 `notices`를 냈다. 읽는 화면도 만드는 곳도 없었다.
  - skill 찾기가 둘이었다: turn용 비동기(`extensions/skills.ts`)와 화면·`/` 메뉴용 동기(`skills-sync.ts`). turn prompt의 skill 목록과 Agents 탭의 skill 수는 role 없이 찾아, `kinds-yaml`이 lophn과 Operator의 prompt에 실렸지만 `skill.read`는 그 이름을 `not_found`로 냈다.
  - 같은 말이 role 지침 넷과 `PRODUCT_INSTRUCTIONS`에 되풀이됐다(Calls, 앱과 data 규칙, 결정 묻기, artifact, domain 폴더 설명, kind 위반 다루기). role 지침은 합쳐 395줄이었다.
  - agent 정의 기본 schema에 쓰이지 않는 `safe_tools`·`permissions`가 있었다. 지운 skill `lophn-build-app`이 맡던 화면 kit과 token 안내는 어디에도 없었다.
  후:
  - guide 10편이 내장 skill `guide-<이름>`이다(`roles-and-grants`는 `guide-roles-and-assignments`). lophn 사용법 여덟은 lophn에게만, `guide-domains`는 lophn·PM·App Engineer, `guide-artifact`는 PM·App Engineer·Operator에게 간다. `guide.read`가 없고 `settings.get`은 `agent-roles/tools/settings.ts`로 옮겼다.
  - role 명령 셋이 같은 이름의 내장 skill이다. `repair-app`에서 lophn은 고치지 않고 앱 상태, log, 실패한 호출을 읽어 사람에게 알린 뒤 그 앱의 App Engineer에게 call한다.
  - `BUILTIN_SKILLS`는 14줄이고 칸은 `name`, `roles`, `can_disable: false`, `menu`다. 설명 칸은 없다(SKILL.md frontmatter 하나). 내장 skill은 모두 끌 수 없고 같은 이름의 사람 skill에 덮이지 않는다.
  - `/` 메뉴는 Commands(new, rename, archive, compact, fork, mcp, skills, permissions)와 Skills 둘이다. 항목은 `{name, title, description, source: builtin | skill}`이고 `ListCommands`는 `{commands}`만 낸다. 내장 skill은 `menu: true`(`new-app`, `repair-app`, `check-kinds`)만 뜨고 `guide-*`와 `kinds-yaml`은 뜨지 않는다. 사람이 쓴 skill은 늘 뜬다.
  - `/이름 글`은 `Use the "<skill>" skill for this request.` 뒤에 빈 줄과 사람이 친 글을 이어 다음 turn의 사람 메시지로 접수한다.
  - skill 찾기는 동기 `discoverSkills` 하나다. 내장 skill은 선언한 role의 agent만 발견한다(prompt 목록, `skill.read`, `/` 메뉴, Agents 탭의 skill 수). 사람 화면(`ReadSkills`)만 role 없이 모두 본다. Agents 탭의 skill 수는 place가 있는 agent도 켜진 skill만 센다. `content_hash`와 딸린 `.md`의 실행 권한 검사는 없다(딸린 file은 읽기만 한다).
  - 모든 role에 같은 말은 `PRODUCT_INSTRUCTIONS`에 한 번씩 있다. tool이나 skill이 있는 role에만 맞는 말은 "If you have `operator.create`", "If you have the skill `guide-artifact`" 꼴이다. role 지침에 `## Calls`와 `## Rules for apps and data`가 없고 합쳐 246줄이다. domain 폴더 설명은 `guide-domains`로, kind 위반 다루기는 `kinds-yaml`의 "When documents break the kinds"로 옮겼다.
  - 앱 template의 `AGENTS.md`(lophn-managed 절)가 화면 component를 `@lophn/ui/<분류>`에서, 앱 bridge component를 `@lophn/app-ui`에서 쓰고 앱 CSS는 `tokens.css`의 변수만 쓰게 한다.
  - 없어진 것: `guide.read`, `roles/guides.ts`, `agent-roles/commands.ts`(`ROLE_COMMANDS`, 고정 prompt 셋), `LophnAgentPorts.roleCommands`, `/recap`과 `RecapCard`, gallery page `new-agent-recap`, wording key `conversation.title.recap`·`conversation.button.recap-dismiss`·`conversation.notice.recap-local`, `CommandNotice`, `skills-sync.ts`, 기본 schema의 `safe_tools`·`permissions`.
why: |
  필요할 때 읽는 길과 사람이 부르는 것이 각각 둘이었고, 같은 말을 여러 곳에 두면 한 곳만 고쳐지고 나머지가 낡는다(`project-docs/architecture/agent-definition.md`).
decisions:
  - by: agent
    text: |-
      command는 사람이 `/`로 부르는 skill이다. role 명령을 내장 skill로, guide를 내장 skill로 옮기고 `guide.read`와 `/recap`을 지운다. (사람이 맡김, 2026-10-21)
  - by: agent
    text: |-
      guide skill 이름은 `guide-<지금 이름>`이다. skill이 곧 `/` 명령이라 `/rewind`가 rewind를 하는 것처럼 읽히지 않게.
  - by: agent
    text: |-
      사용 안내 skill(`guide-*`, `kinds-yaml`)은 `/` 메뉴에 띄우지 않는다. model이 읽는 안내이고 사람은 말로 묻는다.
  - by: agent
    text: |-
      `/이름 글`의 글은 renderer가 skill 요청 뒤에 잇고 실행 직전에 목록을 다시 읽지 않는다. 그 사이 skill이 꺼졌으면 agent의 `skill.read`가 `not_found`를 낸다.
  - by: agent
    text: |-
      skill 찾기는 동기 하나로 합친다. core read handler가 동기라서다.
  - by: agent
    text: |-
      내장 skill 폴더 이름(`new-app`)은 check-deps의 판 이름 규칙에서 뺀다. 사람이 치는 이름이다.
  - by: agent
    text: |-
      `PRODUCT_INSTRUCTIONS`로 옮기는 말은 role 지침에 같은 뜻으로 두 번 이상 있는 문단이고, 한 role에만 있거나 받는 쪽이 role마다 다른 말은 role에 둔다.
follow_up: |
  - eval이 `guideText`·`guideTopics` import(`tests/eval/versions/components.ts`, `tests/eval/experiment/variant/texts.ts`), L6의 `guide.read` 기대(`tests/eval/scenarios/lophn/L6.scenario.ts`), `tests/eval/registry/tool/guide.read.json`, 옛 지침 글(`tests/eval/registry/instruction/*.json`) 때문에 깨진다. check 밖이고 사람이 고친다.
  - 줄어든 지침이 agent를 전처럼 이끄는지는 eval이 잰다(사람).
