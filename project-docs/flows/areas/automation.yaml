      - "깬 뒤에 표를 다시 읽는다. 끝났으면 그 기록을, 아니면 running인 채로 돌려준다"
      - "CLI(agent run, run wait, 앱 command)는 running인 동안 이 route를 60초씩 되풀이해 부른다. CLI가 끊겨도 run은 그대로 돈다(취소하지 않는다)"
