id: defer-hidden-tool-definitions
version: 0.8.0
title: 'tool 정의를 늦게 싣는다: 숨긴 tool은 이름만 알리고 `tool.load`로 펼친다'
modules: [packages/core/agent-workspaces, packages/core/apps, packages/core/jobs, packages/core/lophn-agent, packages/core/main, packages/core/workflows, packages/protocol, tests, tools]
checked: [agents-md, boundary-catalog, context-component-registry, architecture-layers, architecture-approval, architecture-testing, architecture-eval, architecture-activation, architecture-agent-call, architecture-run, architecture-workflow, architecture-job, architecture-artifact, architecture-ui-kit, tool-lead, tool-test-live, skill-write-test, tool-check-deps, tool-dev, tests-support, tool-models-snapshot]
change: |
  전:
  - 모든 tool 정의(내장 34~52개, 할당한 앱 tool, 외부 MCP tool)를 첫 요청부터 다 실었다. tool 정의가 role prompt, skill 목록, tool을 합친 고정 부분의 약 80%였다.
  - 앱 tool 이름은 `domain__<domain>__<tool>`이고 tool 이름에 `.`이 있으면(늘 있다) hash 8자가 붙었다. 예: `domain__calendar__event_list_68ef9d50`.
  후:
  - built-in `anthropic` provider 정의의 Claude 4.5 이상·5 세대·Fable·Mythos로 시작한 session은 숨긴 tool을 `tools[]`에 `defer_loading: true`로 싣는다. model은 이름만 알고, 새 tool `tool.load`로 부르면 결과의 `tool_reference`로 API가 정의를 펼친다.
  - 숨는 것: 정의에 `defer: true`가 있는 내장 tool 15개(`pdf.read`, `session.list`, `workflow.list`, `workflow.check`, `release.list`, `release.get`, `domain.list`, `domain.get`, `visual.show`, `job.*` 넷, `operator.update`, `package.publish`), 앱 tool 전부, 외부 MCP tool 전부. 모든 role에 같다.
  - `tool.load`는 wire 이름이나 묶음 이름(`job`, 앱 domain `calendar`, `mcp__<server>`)을 받아 그 session의 숨긴 tool만 펼친다. 불러온 tool은 session 동안 남는다(다음 turn 이력에 앞 turn의 `tool.load` 호출과 결과가 다시 실린다).
  - 앱 tool 이름은 `<domain>_<tool>`(`.`은 `_`)이다. 예: `calendar_event_list`. hash는 64자를 넘을 때만 붙는다. 내장 tool 자원 이름, `call`, `reply`, `cancel`, `ask`, `mcp`는 domain 이름으로 쓰지 못하고(이름이 이 낱말 하나인 앱은 만들 수 없다), 한 앱 안에서 이름이 같아지는 두 tool은 선언 검사가 거절한다.
  - 실행 쪽(`executeToolCall`, Gate)은 그대로다. 숨김은 model이 보는 것만 바꾼다.
  - 규칙은 `project-docs/architecture/agent-definition.md`, 앱 tool 이름은 `app-call.md`와 `domain.md`다.
why: |
  사람이 "tool이 너무 많고 평소에는 안 쓰일 툴들도 있다"고 했다(2026-10-23). Anthropic 문서는 30~50개를 넘으면 고르는 정확도가 떨어진다고 한다. `defer_loading`과 `tool_reference`는 prefix를 건드리지 않아 prompt cache가 그대로다.
decisions:
  - text: '숨김은 tool 정의를 늦게 싣는 장치이고 role 구분이 아니다. Claude Code의 `shouldDefer`처럼 정의에 한 번 적는다. 버린 길: role prompt에 이름이 나오는지로 role마다 숨김 목록을 두는 첫 판(이 계획의 wave 1). 숨김이 원래 있던 role 권한 목록과 섞였다.'
    by: person
  - text: '앱 tool도 MCP처럼 숨기고 domain 묶음으로 불러온다. `tool.load`는 묶음 이름을 받는다. 불러온 tool은 session 동안 남긴다.'
    by: person
  - text: '앱 tool 이름을 `<domain>_<tool>`로 바꿨다. `domain__` 접두사는 근거가 기록에 없었고 model이 보는 이름마다 글자를 더했으며, hash는 드문 충돌을 막으려고 모든 이름에 붙었다.'
    by: person
  - text: '숨기는 내장 tool은 첫 판의 role 목록 넷이 모두 숨기던 15개다. 어느 role prompt가 기대던 9개(`image.read`, `app.list`, `app.get`, `package.list`, `package.get`, `declaration.check`, `kind.list`, `kind.check`, `settings.get`)는 싣는다.'
    by: agent
  - text: '묶음 규칙은 wire 이름 앞부분 하나다(항목 `g`는 `g`이거나 `g_`로 시작하는 이름에 맞는다). keyword 검색은 두지 않는다.'
    by: agent
  - text: '앞 turn의 `tool.load`는 저장된 tool 호출 기록과 결과 본문에서 다시 만든다. 새 표를 두지 않는다. compaction 뒤에는 다시 불러온다.'
    by: agent
  - text: '예약 domain 이름 목록은 `packages/protocol/apps/declaration/types.ts`의 `RESERVED_DOMAIN_NAMES` 하나다. declaration graph가 다른 file을 import할 수 없어서다. 내장 자원을 더하면 `packages/core/main/tool-names_test.ts`가 잡는다.'
    by: agent
  - text: 'built-in `anthropic` 정의(key)와 model 이름 규칙으로만 켠다. custom provider는 `anthropic-messages`여도 끈다. OpenAI responses의 `tool_search`와 chat-completions 계열은 wire가 달라 켜지 않는다.'
    by: agent
  - text: '숨긴 정의도 매 요청 모두 싣는다. beta header `advanced-tool-use-2025-11-20`는 받는 model의 모든 요청에 붙인다(header를 요청 body에 따라 바꾸는 길이 없고 해가 없다).'
    by: agent
  - text: '빠른 check는 자기 `deno.json`이 있는 package의 md만 `deno fmt`에 넘긴다. root config는 md를 fmt하지 않는데 file로 주면 fmt되어, `tests/eval/scorecards`가 core를 바꾼 모든 branch의 빠른 check를 막았다.'
    by: agent
follow_up: |
  - 개발 data에 예약 이름(`file`, `job` …)의 domain이 있으면 schema 검사에서 막힌다. 지우고 새로 만든다.
  - eval(claude-sonnet-5-5, 시나리오마다 1 trial, `tests/eval/runs/`): wave 2 뒤 O4의 Operator가 `tool.load(["domain_get", "domain_list", "calendar_event_list"])`를 불렀고 실제 API가 `tool_reference`를 받아 앱 tool을 바로 불렀다. O4는 tool 호출 3 → 6, 입력 token 45.7k → 99.2k, $0.049 → $0.068. calendar-dev(63 → 65 호출, 3.86M → 3.57M token)와 calendar-maintain(14 → 21 호출)은 숨긴 tool이 필요 없어 `tool.load`를 부르지 않았고, 떨어진 check는 wave 1 run과 같다(calendar-maintain의 `ae-previewed`만 이번에 통과). 시나리오 판이 지난 run 뒤 바뀌어(calendar-maintain 3 → 7, calendar-dev 2 → 3, O4 5 → 8) 그 전 run과는 비교가 끊긴다.
