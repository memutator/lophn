  - id: detached-close-silent
    title: "project 창을 떠날 때 분리된 창을 조용히 닫는다"
    actor: shell
    entries: [system:detached-close-silent]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/detached.ts
      - packages/shell/main/desktop/detached/registry.ts
    steps:
      - "project 창이 닫히거나 같은 창에서 다른 공간으로 가면 그 창의 detached 창을 silent로 닫는다. 닫을 창이 없으면 아무 일도 없다"
      - "PTY 값은 kept에 넣어 두어 같은 key를 다시 열 때 한 번 쓰고, layout의 detached 항목은 그대로 둔다"
      - "앱을 끄는 중이면 dock으로 돌리지 않는다(다음 실행에 detached로 돌아온다)"
    outcomes:
      - id: closed-kept
        observe: ["process:detached-window"]
      - id: closed-on-quit
        when: "앱을 끄는 중이라 dock으로 돌리지 않고 닫았다. layout의 detached 항목을 그대로 둔다"
        observe: ["process:detached-window"]
      - id: nothing
        when: "그 project의 detached 창이 없다"
        observe: ["process:detached-window (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: detached-reopen
    title: "layout에 있는 detached 항목의 창을 transfer 없이 다시 연다"
    actor: shell
    entries: []
    uses: [ipc:shell:detached-open, ipc:shell:detached-take]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/main/desktop/detached/registry.ts
      - packages/shell/renderer/workspace/detached/detached-space.tsx
    when: "desk를 바꿨는데 가는 desk의 창이 없을 때(showOnly의 missing), layout을 읽어 보이는 desk의 detached 항목을 되살릴 때"
    steps:
      - "project 창이 transfer 없이 detached open을 보낸다. 같은 (project, key)의 창이 있으면 그 창을 앞으로 가져온다"
      - "창을 만든다. 화면 밖 자리면 작업 영역 안으로 당긴다"
      - "project를 떠나며 조용히 닫은 창의 resume 값(kept)이 있으면 한 번 꺼내서 새 창의 transfer로 든다. 없으면 저장된 탭 값만 쓴다"
      - "새 창이 mount되면 take로 탭과 transfer를 받는다. transfer가 있으면 kind의 receive가 받는다"
      - "layout은 바꾸지 않는다. 항목은 이미 있다"
    outcomes:
      - id: reopened
        observe: ["process:detached-window"]
      - id: reopened-kept
        when: "같은 (project, key)의 kept PTY 참조가 있다. 새 창의 take가 그 값을 받고 kept에서는 지운다(한 번만 쓴다)"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "같은 탭 key의 창이 이미 있다. 그 창을 앞으로 가져온다"
        observe: ["process:detached-window"]
      - id: invalid
        code: invalid_input
        when: "project 값, 탭 key·kind, bounds가 schema에 맞지 않다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "새 창을 만들지 못했다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: detached-window-lost
    title: "분리된 창이 예기치 않게 사라지면 탭을 layout에 돌려준다"
    actor: shell
    entries: [system:detached-window-lost]
