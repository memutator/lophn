    note: "흔적 정리(dropTombstones)와 horizon. 정리된 흔적보다 옛 insert·update·delete는 row를 되살리지 않고 DB를 바꾸지 않은 채 held로 돌아오고(두 번 받아도), 흔적이 있는 row의 옛 변경과 horizon보다 새 변경은 그대로 적용된다. 변경 하나는 통째로 held다. horizon은 내려가지 않고 폰이 받은 snapshot에는 없다. 묘비는 그 row의 kept 칸과 같이, 모두 경계보다 옛 것일 때만 지운다. 아직 폴더 route가 없어 outcome이 없다"

