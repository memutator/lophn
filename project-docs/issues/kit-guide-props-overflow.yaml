id: kit-guide-props-overflow
title: kit guide에 props가 붙어서 본문이 상한을 넘고, 넘을 때 버려지는 쪽이 본문 전체다
kind: defect
status: fixed
topic: ui-kit
modules: [packages/design, packages/core/apps]
now: |
  `@lophn/ui`의 guide는 `builtin.ts`의 `indexOfCategory`가 `components/<분류>/mod.ts`마다 export 이름, "언제 쓰나" 한 줄, 같은 export 문이 내보내는 type의 정의를 component source에서 주석째 옮겨 만든다. 지금 분류별 이름·"언제 쓰나" 줄만 세면 13,434 byte이고, props 정의(ts code 블록)를 더하면 42,356 byte다. 상한에 닿으면 `limited`/`cutBytes`가 앞에서부터 자르므로 남는 것은 `data`, `feedback`, `input`, `layout` 네 분류다.
impact: |
  컴포넌트가 늘 때마다 잘리는 분류가 늘어나고, 잘린다는 사실은 `guide_truncated: true` 하나로만 보인다. agent는 `primitives`(Button, IconButton)와 `overlay`(Dialog, Popover, Menu) 없이 화면을 설계한다. 앱 화면에서 가장 많이 쓰는 분류 둘이 항상 먼저 사라진다. `mod.ts`의 분류 알파벳 순서가 잘림 순서를 정하므로 `reading`·`primitives`는 구조적으로 마지막이다.
fix: |
  - 작음(추천): 위의 창 나누기를 먼저 넣고, guide 생성에서 props 정의를 `max_bytes` 예산 안에서만 붙인다(분류마다 균등 배분). 예산 밖 props는 그 분류의 이름 줄만 남기고 요청 시 받게 한다.
  - 작음: props 정의를 guide에서 빼고 `components/<분류>/mod.ts`의 export 문과 "언제 쓰나" 줄만 남긴다. 13 KiB로 돌아가지만 agent가 props를 모른다.
  - 추천: 앞의 것. 잘림이 알파벳 순서를 따르지 않게 예산을 분류 단위로 나눈다.
closed: |
  `builtin.ts`에서 `indexOfCategory`가 props 정의를 `blocks`로 따로 돌려주고 `assembleGuide`가 `GUIDE_BUDGET_BYTES`(20 KiB) 안에서 분류마다 하나씩 돌아가며 붙인다. 분류는 `## 분류`, 설명, `import from`, `- 이름: 언제 쓰나` 줄을 늘 남기고, props를 못 붙인 분류에는 뺐다는 한 줄을 남긴다. `@lophn/ui` 1.1.0 guide는 42,356 → 20,449 byte이고 여덟 분류가 모두 있다.
guard: packages/core/apps/packages/builtin_test.ts "props 예산이 모자라도 모든 분류의 이름 줄이 남고 뺀 props는 그 분류에 적힌다"
