id: window-size-and-position-restored
version: 0.9.0
title: '창 크기·자리·최대화를 기억했다가 다시 열 때 되살린다'
modules: [packages/shell/main]
checked: [architecture-workspace-layout]
change: |
  전: 창은 늘 960×600 기본 크기로 열렸다. project layout 파일에 창 bounds(`window_bounds`)를 저장했지만 읽는 곳이 없었다.
  후:
  - desktop 창의 마지막 자리·크기·최대화를 앱에 하나(`<data>/shell/window.json`) 저장하고, 앱을 켤 때와 새 창을 열 때 되살린다. 저장한 자리는 지금 화면 작업 영역 안으로 당기고(모니터를 뺀 경우), 다른 창이 떠 있으면 32px 비켜 연다.
  - 최대화한 창은 되돌렸을 때의 크기도 기억한다. 최소화·전체 화면은 저장하지 않는다.
  - layout 파일에서 `window_bounds`를 뺐다(판 5). 판 4 layout은 읽지 않고 새로 만든다.
  - detached 탭 창은 그대로 layout의 탭별 자리를 쓴다.
  환경: Wayland(KDE 등)에서는 창 자리를 compositor가 정해 크기와 최대화만 되살아난다. X11·macOS·Windows는 자리까지 되살아난다. Wayland에서 Electron이 만들 때 크기를 primary 모니터 안으로 자르므로 숨긴 채 만들고 크기를 다시 건 뒤 보인다.
why: |
  사람이 요청했다.
decisions:
  - text: |
      창 자리는 project가 아니라 앱에 하나다. 한 창이 런처·project·settings를 오간다.
    by: agent
  - text: |
      옛 `window_bounds`는 지운다. 그 판의 layout(탭 배치)은 한 번 사라진다.
    by: person
