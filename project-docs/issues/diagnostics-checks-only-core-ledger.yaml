id: diagnostics-checks-only-core-ledger
title: "Diagnostics 점검이 core·ledger 둘뿐이다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/diagnostics, packages/core/main]
now: |
  `diagnostics/components.ts` `createComponentChecks`가 core와 ledger만 짓는다. `ctx.componentChecks`(`wiring/context.ts`)에 더하는 곳은 `wiring/diagnostics.ts` 하나뿐이고, events·앱·sandbox·agent runtime의 wiring은 아무것도 더하지 않는다(`componentChecks.push`를 쓰는 다른 파일이 없다).
impact: |
  `diagnostics.status`가 나머지 component를 점검하지 않아 events, 앱 supervisor, agent runtime이 죽어도 status는 정상으로 보일 수 있다.
fix: |
  각 owner wiring(`events.ts`, `apps.ts`, `supervision.ts`, `lophn-agent-runtime.ts`)이 `ctx.componentChecks.push`로 자기 점검을 더한다. component마다 작음. 점검이 무엇을 보는지(살아 있음, 마지막 응답 시각) 정하는 쪽이 일이다. 추천.
decided: |
  events와 agent runtime 점검만 더한다.
closed: |
  `wiring/events.ts`가 `events` 점검(읽기 연결이 열려 있고 Reactor가 start된 뒤 `events` 표를 한 번 읽는다), `wiring/lophn-agent-runtime.ts`가 `agent-runtime` 점검(I/O observation의 `available`)을 `componentChecks`에 더했다. 둘 다 고정 이유 문장만 낸다. `diagnostics/status`에 core, ledger, events, agent-runtime이 나오는 것을 손으로 확인했다.
guard: 없음
