# electron-builder config. 세 OS 모두 먼저 `--dir`로 앱만 풀고, 설치 묶음(platform/, desktop/, extensions/, skills/)은
# tools/package/가 그 안에 넣은 뒤 묶는다(Linux .deb, macOS dmg, Windows nsis). 서명·notarize는 하지 않는다.
appId: dev.lophn.shell
productName: lophn
executableName: lophn-desktop
copyright: lophn
directories:
  output: release
  buildResources: packaging
files:
  - dist/**/*
  - package.json
asar: true
extraResources:
  - from: packaging/icon.png
    to: icon.png
linux:
  target:
    - dir
  category: Development
  synopsis: Client workspace for projects and apps with lophn
  maintainer: lophn developers <lophn@localhost>
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
