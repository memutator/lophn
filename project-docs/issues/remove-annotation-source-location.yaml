id: remove-annotation-source-location
title: source 위치 잇기를 지운다
kind: defect
status: fixed
topic: annotation
modules: [packages/core/apps, packages/shell/preload, packages/protocol]
now: |
  앱 build 때 `core/apps/releases/ui-build/app-build.ts`의 `atRuntime`이 앱 `src/`의 `react/jsx-runtime`을 바꿔치기해 jsx 호출마다 `new Error().stack`으로 bundle 위치를 읽고 component에 `data-lophn-at`을 싣는다(DOM 요소도 stack을 만들고 버린다, production build에도 들어간다). 앱 template의 `scripts/build-ui.ts`에 같은 코드가 복사돼 있다. 보낼 때 `core/apps/annotations/source.ts`의 `resolveAll`이 release의 `app.js.map`을 읽어 VLQ를 직접 풀어 파일:줄로 바꾼다. 화면이 둘 이상인 앱은 `ui-build/build.ts`가 합친 map에 `mappings`를 담지 않아 늘 null이다.
impact: |
  렌더마다 stack 비용, source map 파서, 복사된 template 코드, 화면 여럿 bug를 지고 있다. 그런데 화면 요소가 겹쳐 있어 이 줄 번호는 사람이 뜻한 component가 아니라 우연히 맨 안쪽에 있던 SDK component를 쓴 줄이다. 앱이 직접 만든 component는 위치가 안 남고 list 항목은 모두 같은 줄이다.
fix: |
  `atRuntime`과 template의 같은 코드, `data-lophn-at`, preload의 `bundlePositionOf`, `annotations/source.ts`와 `ReleaseSourceMaps`, annotation의 source 칸, 화면 여럿 map 처리를 지운다. App Engineer와 coding agent는 component 겹, 요소 글자, 화면 이름, screenshot으로 코드를 검색해 찾는다. 지운 뒤 `architecture/annotation.md`를 고친다.
decided: |
  지운다. ChatGPT 데스크톱 앱의 browser comment도 source 위치를 쓰지 않고 screenshot, selector, 요소 글자를 같이 보내 model이 다시 찾게 한다.
closed: |
  `atRuntime`(core `app-build.ts`와 앱 template `build-ui.ts`), `bundle_position`, `source.ts`(`resolveAll`), `ReleaseSourceMaps`, protocol의 `source`, 표의 `source_file`·`source_line`·`bundle_position`, 메시지의 `Source` 줄을 지웠다. `app.js.map`은 problems가 쓰므로 남겼다.
guard: 없음
