  - id: model-catalog-auto-update
    title: "기동할 때와 turn마다 주기(2시간)가 지난 model catalog를 models.dev에서 받는다"
    actor: system
    entries: [system:model-catalog-auto-update]
    boundary: [models]
    code: [packages/core/lophn-agent/models/work.ts, packages/core/lophn-agent/models/catalog-refresh.ts, packages/core/lophn-agent/models/adapters/models-dev.ts, packages/core/main/agent-runtime/main.ts, packages/core/main/agent-runtime/product-driver.ts]
    steps:
      - "agent runtime이 뜰 때 설정 lophn-agent.model.catalog_auto_update를 한 번 읽는다. 못 읽으면 켜진 것으로 본다. 다음 기동부터 적용된다"
      - "agent runtime이 뜰 때와 turn이 model을 해석할 때(기다리지 않음) 확인한다. 켜져 있고 마지막 확인 뒤 2시간(CATALOG_REFRESH_INTERVAL_MS)이 지났거나 기록이 없으면 models.dev를 ETag와 함께 받는다. 같은 갱신이 진행 중이면 그것을 기다린다. 꺼져 있거나 시각이 안 됐으면 요청 없이 끝난다(skipped)"
      - "200이면 본문 크기와 JSON·항목 schema를 검사한 뒤에만 models_dev 층을 통째로 바꾸고 catalog.json과 catalog-state.json을 쓴다(received)"
      - "304면 확인 시각만 바꾼다(unchanged). 네트워크 실패나 200·304가 아니면 마지막 정상본을 두고 state에 unavailable을 남긴다. 본문이 상한을 넘거나 검증에 걸리면 invalid_input을 남긴다(failed-unavailable, rejected)"
      - "파일 쓰기가 실패하면 파일과 메모리 사본은 앞 것 그대로다(write-failed)"
    outcomes:
      - id: received
        observe: ["disk:<root>/derived/lophn-agent/catalog.json", "disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: unchanged
        when: "304 응답이다. 항목은 그대로이고 확인 시각만 바뀐다"
        observe: ["disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: rejected
        when: "본문이 상한을 넘거나 JSON 또는 항목 검증에 하나라도 걸렸다. 마지막 정상본을 유지하고 last_failure를 invalid_input으로 남긴다"
        observe: ["disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: failed-unavailable
        when: "네트워크 실패이거나 200·304가 아니다. 마지막 정상본을 유지하고 last_failure를 unavailable로 남긴다"
        observe: ["disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: write-failed
        code: unavailable
        when: "발급받은 목록을 catalog.json이나 catalog-state.json에 쓰지 못했다. 파일과 메모리 사본은 앞 것 그대로다"
        observe: []
      - id: skipped
        when: "설정이 꺼져 있거나 마지막 확인 뒤 2시간이 지나지 않았다. 요청이 나가지 않는다"
        observe: ["request:models-dev"]
    crosses_process: true
    risk: [sandbox]
    refs: []
    docs: []
    unclear:
      - "사람이 지금 받기를 누르는 refreshNow를 부르는 곳이 저장소에 없다"
      - "설정을 바꾸면 다음 기동에 적용된다. 실행 중에 끄면 이번 기동의 갱신은 멈추지 않는다"
      - "catalog.json과 catalog-state.json은 따로 쓴다. 둘째 쓰기만 실패하면 두 파일이 어긋난 채 남고, 다음 load는 그대로 읽는다"

