  - {entry: "sdk:cap-fs/REQUIRED_PERMISSIONS", reason: "상수다. 같은 요구를 core가 옮겨 release 준비(release-prepare)가 검사한다"}
  - {entry: "sdk:cap-fs/checkDeclaration", reason: "SDK 쪽 선언 검사 사본이다. 실제 판정은 release 준비(release-prepare의 failed-release)이고, 이 export는 앱 code가 직접 부를 때만 쓴다"}
