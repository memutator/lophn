id: phone-coding-session-opens-empty
title: 폰에서 연 coding session 하나가 아무 내용 없이 열린다(원인 확인 못 함)
kind: bug
status: open
topic: remote
modules: [packages/core/terminal-agents, packages/mobile]
now: |
  사람이 본 것: 긴 Claude Code session 하나를 폰에서 열면 대화가 하나도 그려지지 않는다. 답이 frame 한도(16 MiB)를 넘어 버려진 것으로 짐작했지만, 큰 transcript 다섯을 replay해 잰 snapshot은 0.3~1.2 MB라 그 원인이 아닐 가능성이 높다(이슈 `remote-reply-over-frame-limit-is-dropped`). 원인은 확인하지 못했다. code에서 본 후보 하나: core가 알려진 secret을 다 알기 전에는 대화 사본을 내주지 않고 `unavailable`로 답한다(`packages/core/terminal-agents/coding-sessions.ts`의 `snapshot`, 가릴 수 없어서다). 그때 폰은 빈 대화를 볼 수 있다. 그 session이 그때 GUI 탭으로 열려 있었는지, 터미널로 돌고 있었는지도 모른다.
impact: |
  사람이 폰으로 그 coding session을 이어 볼 수 없다. 어느 session이 이렇게 되는지 미리 알 수 없다.
fix: |
  - 작음(추천): 설치한 앱에서 그 session을 폰으로 다시 열면서 컴퓨터의 log(core가 사본을 내주지 않았는지, 답이 `unavailable`이었는지)와 폰의 상태를 본다. 원인을 정한 뒤에 고친다. 원인을 모른 채 먼저 고치지 않는다.
  - 보류가 원인이면: 사본을 보류하는 동안 폰이 빈 대화 대신 이유를 보이고, 풀리면 스스로 다시 읽는다.
