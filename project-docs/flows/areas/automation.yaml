  # ---- run ----
  - id: run-agent-start
    title: "사람이 agent에게 run 하나를 시키고 run 기록을 받는다"
    actor: person
    entries: [route:runs/start]
    uses: [route:runs/create, route:runs/settle]
    when: "kind가 agent일 때. tool은 run-tool-start"
    boundary: [core-api, runs, agent-sessions, router]
    code: [packages/core/runs/service.ts, packages/core/runs/text.ts, packages/core/main/daemon/wiring/runs.ts]
    steps:
      - "agent 주소(또는 이어 쓸 session)의 이름을 다 푼다. 못 풀면 session도 run도 남기지 않는다"
      - "입력 글(prompt, input JSON, 출력 schema 안내)의 크기와 schema를 검사한다. 넘거나 못 읽으면 invalid_input"
      - "CreateRun으로 run 행(running)을 만들고, 새 session이면 연다. 이어 쓰기면 session은 열지 않는다"
      - "새 session이면 열린 직후 그 workspace의 Agent 탭을 host queue에 요청한다(주인 person, source 없음, relation 없음. renderer가 Main desk 끝에 붙인다). 이어 쓰기는 요청하지 않는다. job의 agent_run도 같다"
      - "입력을 unattended 사람 메시지로 넣는다. 열기나 넣기가 실패하면 run을 start_failed로 닫는다"
      - "끝은 run-agent-end가 본다. 응답은 running인 run 기록이다"
    outcomes:
      - id: running
        when: "run이 running으로 열림. 새 session이면 SessionStarted도 난다"
        observe: [ledger:runs, event:SessionStarted, response]
      - id: start-failed
        when: "session을 열거나 메시지를 넣지 못함. 응답은 start_failed로 failed가 된 run 기록이다"
        observe: [ledger:runs, response]
      - id: not_found
        code: not_found
        when: "agent 주소나 session의 agent를 풀지 못함(run은 남지 않음)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "session을 이어 쓰는데 열린 session이 아님"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "agent와 session 가운데 하나만 줌(둘 다 없거나 둘 다 있음), schema를 못 읽음, prompt가 메시지 한도를 넘음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "주소 풀기나 session 읽기에서 ledger를 못 읽음(run은 남지 않음)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 credential이 아님(route actors는 user만, dispatch가 거른다)"
        observe: [response]
    crosses_process: false
    refs: [R7, R8]
    docs: [architecture/run.md]

  - id: run-tool-start
    title: "사람이 앱 tool 호출 run을 시작하고 결과는 나중에 run 기록으로 닫힌다"
    actor: person
    uses: [route:runs/start, route:runs/create, route:runs/wait]
    when: "kind가 tool일 때. agent는 run-agent-start"
    boundary: [core-api, runs, app-runtime, approvals]
    code: [packages/core/runs/service.ts, packages/core/main/daemon/wiring/runs.ts, packages/cli/commands/app-command.ts, packages/cli/commands/run.ts]
    steps:
      - "앱을 id, slug, 이름으로 푼다. 없으면 not_found"
      - "CreateRun으로 run 행(running, session 없음)을 만들고 기다리지 않고 돌려준다"
      - "사람이 부르면 앱 화면과 같은 길로 person caller를 달아 Gate 없이 앱 호출 경로를 부른다. job이 부르면 program caller, flow가 부르면 flow caller(creator 할당과 비공개 거르기)로 부른다"
      - "호출이 끝나면 run-tool-end가 run을 닫는다. tool 이름이 앱에 없으면 run이 tool_denied로 실패한다"
      - "CLI `lophn <slug> <command>`는 active 앱 목록을 20쪽까지 읽어 slug가 같은 앱의 선언 tool을 명령으로 세운다. 명령이 없거나 입력이 선언 schema에 맞지 않으면 run을 만들지 않고 invalid_input으로 끝난다"
      - "`lophn <slug> <command> --on <컴퓨터>`는 이 flow를 거치지 않는다. 앱 목록과 선언을 읽는 것도 부르는 것도 그 컴퓨터의 것이고 run을 만들지 않고 apps/remote_call 하나로 부른다(cli의 앱 command flow). `--on`이 없으면 이 컴퓨터다"
      - "CLI는 이 route를 kind tool로 불러 run을 받은 뒤 run이 끝날 때까지 run-wait를 되풀이한다. done이면 결과 글을, failed면 failed: reason: message를, cancelled면 cancelled를 내고 실패로 끝난다"
    outcomes:
      - id: running
        observe: [ledger:runs, response]
      - id: not_found
        code: not_found
        when: "app을 풀지 못함"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "app을 풀거나 run 행을 쓰는 데서 ledger를 못 읽음(run은 남지 않음). CLI가 앱 목록(20쪽 넘음)이나 선언을 읽는 데서도 같다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "CLI에서 명령을 못 찾거나(slug의 active 앱이 없음, 선언에 그 명령이 없음) 입력이 선언 schema에 맞지 않음. route를 부르지 않아 run이 남지 않는다"
        observe: [response]
      - id: done
        when: "CLI가 기다려 run이 done. 출력은 결과 글"
        observe: [ledger:runs, response]
      - id: run-failed
        when: "CLI가 기다려 run이 failed(tool_failed, tool_denied, tool_unknown). 출력은 failed: reason: message"
        observe: [ledger:runs, response]
      - id: cancelled
        when: "CLI가 기다려 run이 cancelled로 끝남"
        observe: [ledger:runs, response]
      - id: internal
        code: internal
        when: "CLI가 기다리는 중 저장된 run 행이 깨져 읽지 못함(run-wait의 internal)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [J4, E10, E11]
    docs: [architecture/run.md, architecture/app-call.md]
    unclear:
      - "사람이 부른 tool run은 Gate를 거치지 않아 permission으로 달았다. 사람의 호출 자체가 승인이라는 판정이 이 flow에 있는지, app-call 쪽에만 있는지 확인할 것"
      - "호출은 기다리지 않아 core만으로 응답이 끝난다. 그래서 crosses_process를 false로 두었다. 앱 child의 결과는 run-tool-end가 맡는다. CLI의 기다림(done, run-failed, cancelled)은 run-wait가 맡고 그 flow는 crosses_process가 true다"

  - id: run-record
    title: "run 기록 행을 만든다"
