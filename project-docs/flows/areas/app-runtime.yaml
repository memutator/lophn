        when: "본문 모양이 맞지 않음(모르는 capability 포함), 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(apps/tools, app_grants/list), 또는 activation 중인 후보 release"
        observe: [response]
      - id: core-refused
        when: "app_phone.request가 낸 오류 그대로(unavailable: 폰 없음·닿지 않음·credential 없음·core에 닿지 않음, forbidden: 폰의 OS 권한 거절, invalid_input, not_found, conflict)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [permission]

  - id: app-broker-problem
    title: "앱이 잡은 예외를 앱 log에 쓴다"
    actor: app
    entries: [system:app-broker-problem]
    uses: [sdk:cap-problem/createExceptionObserver]
    boundary: [problems, app-runtime]
    code: [packages/core/apps/permissions/broker/problems.ts, packages/core/main/app-supervisor/log-redact.ts]
    steps:
      - "앱 SDK의 exception observer가 잡히지 않은 예외를 broker의 observe-exception에 보낸다. 이 길은 reportProblem을 쓰지 않는다(reportProblem은 stderr 줄을 내고 app-log-write가 받는다)."
      - "본문 모양을 검사한다. grant 판정은 없다(mode나 live 검사도 없어 preview 자식도 쓸 수 있다). 앱은 자기 log에만 쓴다."
      - "stack을 봉인 bundle의 source map으로 원래 source 줄로 푼 뒤 쓴다. 풀 수 없으면 frame 없이 머리 줄만 쓴다."
      - "exception <name>: <message> 한 줄과 frame마다 '  at <path>:<line>:<column>' 줄을 같은 invocation으로 붙인다. 각 줄은 redaction을 먼저 하고 300자로 자른다. 앱 log가 8 MiB를 넘으면 app.log.1로 옮긴다."
      - "log 파일이 없는 조립(dataRoot 없음)이거나 파일 쓰기가 실패하면 응답은 그래도 written이다. 줄은 남지 않는다(조용히 버림)."
    outcomes:
      - id: written
        observe: ["log:app"]
      - id: log-lost
        when: "dataRoot가 없어 쓸 곳이 없음, 또는 파일 쓰기 실패가 삼켜짐. 응답은 written과 같다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "exception 입력 schema가 맞지 않음, 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "frame 풀기나 쓰기 처리기가 예외를 던짐"
        observe: [response]
    crosses_process: false
    refs: [A15]

  # ---------- 앱 event ----------

  - id: app-event-publish
    title: "앱이 선언한 event를 내고 구독한 켜진 앱의 handler를 부른다"
    actor: app
    entries: [route:app_events/publish]
    uses: [route:apps/call_tool]
    pre: [route:releases/activate]
    boundary: [app-runtime, app-capability, core-api]
    code: [packages/core/apps/events/publish.ts, packages/core/apps/events/store.ts, packages/core/apps/calls/caller.ts, packages/core/apps/calls/gate.ts, packages/core/apps/routes.ts, packages/protocol/apps/events.ts, packages/core/remote/subscriptions.ts]
    steps:
      - "core가 자격이 app인지 본다. 앱은 입력에 없고 자식 credential이 정한다. 발행이 앱 handler 안에서 일어났으면 parent_invocation이 그 앱의 지금 도는 호출일 때만 사슬로 쓰고, 아니면 사슬 없이 낸다(부모가 돌고 있지 않아도 발행은 된다)."
      - "앱이 없으면 not_found, 보관했거나 active release가 없으면 conflict다. active release의 events 선언에 그 event가 없거나 payload가 payloadSchema와 맞지 않거나 16 KiB를 넘으면 invalid_input이다. 이때 아무에게도 가지 않고 기록도 없다."
      - "active release의 subscriptions에 이 앱의 slug와 event를 선언한 active 앱을 모은다. 그 가운데 지금 그 release로 떠서 호출을 받는 앱에만 간다. 닿지 못한 수는 unreachable로 센다(저장도 재시도도 없다)."
      - "발행 기록(누가, 어느 event, 언제, trace id, 켜져 있던 구독자 reachable, 닿지 못한 수 unreachable, 고리·깊이로 넘기지 않은 수 refused, payload 없음)을 앱마다 최근 200개만 남기고 AppEventPublished(payload 포함, 저장하지 않음)를 Bus로 낸다. 그 뒤 구독 앱마다 handler를 앱 호출 경로로 부르고 기다리지 않는다."
      - "호출은 caller kind event(발행자, event, publication, trace_id, chain, parent)로 operation 자리의 `on.<source>.<event>`를 effect write로 부른다. Gate는 묻지 않는다. chain은 이 event를 부른 인과의 앱들(발행자 포함)이고, 발행이 구독 handler 안에서 일어났으면 그 handler가 불린 event의 chain(호출 기록에서 읽는다)에 이어진다. 구독자가 chain에 이미 있거나 chain이 깊이 한도 8에 닿았으면 호출을 넘기지 않고 refused로 센다(앞선 호출이 이미 끝났어도 고리가 끊긴다). 구독 앱이 그 사이 꺼졌거나 handler가 실패하면 그 호출의 기록이 말하고 발행에는 영향이 없다."
      - "발행이 받은 call(caller remote)이나 다른 컴퓨터에서 온 event가 부른 handler 안에서 일어났으면 그 event에 remote 표시가 붙는다. 이 컴퓨터의 구독자에게는 그대로 가지만 다른 컴퓨터에 내주지 않고(sharesAppEvent) across_machines여도 event file을 쓰지 않는다. 다른 컴퓨터가 낸 event를 구독자에게 낼 때는 그 구독자의 workspace가 이 컴퓨터의 call 정책에서 private이면 받지 않는다(remote-app-events)"
    outcomes:
      - id: published
        when: "선언한 event를 냈다. 구독자가 없어도 기록하고 reachable 0으로 돌려준다"
        observe: [response, "ledger:app_event_publications", "event:AppEventPublished"]
      - id: delivered
        when: "켜진 구독 앱마다 invocation 하나가 caller kind event로 남는다(write라 changeset이 붙는다)"
        observe: ["ledger:invocations", "event:AppEventPublished"]
      - id: loop-refused
        when: "켜진 구독자가 event의 chain에 이미 있거나 chain이 깊이 한도에 닿아 호출을 넘기지 않았다(발행 기록의 refused에 센다. 호출 기록은 없다)"
        observe: [response, "ledger:app_event_publications"]
      - id: undeclared-or-mismatched
        code: invalid_input
        when: "선언하지 않은 event, payload가 payloadSchema와 맞지 않음, payload가 16 KiB를 넘음(기록 없음, 아무에게도 가지 않음)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "자격이 app이 아님"
        observe: [response]
      - id: not-found
        code: not_found
        when: "자격의 앱이 등록부에 없다"
        observe: [response]
      - id: unavailable-app
        code: conflict
        when: "앱이 보관됐거나 active release가 없다"
        observe: [response]
      - id: core-failed
        when: "선언을 읽거나 발행 기록을 쓰지 못함(그 오류 그대로)"
        observe: [response]
    crosses_process: true
    docs: [architecture/event.md, architecture/app-call.md]

  - id: app-broker-events-publish
    title: "앱이 broker로 event를 낸다"
    actor: app
    entries: [system:app-broker-events-publish]
    uses: [route:app_events/publish]
    pre: [app-record-started:started]
    boundary: [app-runtime, app-capability]
    code: [packages/core/apps/permissions/broker/events.ts, packages/core/apps/permissions/broker/server.ts]
    steps:
      - "앱 자식이 SDK의 publish로 broker의 events/publish에 event, payload, 현재 호출의 invocation(없으면 null)을 보낸다. broker endpoint가 credential, 본문, process_nonce·mode가 연결과 같은지 먼저 본다."
      - "요청 모양을 검사한다. 자식이 운영 앱(live)이면서 release가 있고 그 release가 지금 active release여야 한다. 사람 허락(grant)은 보지 않는다: event는 발행 앱이 선언해 내놓는 것이다."
      - "core app_events.publish를 이 자식의 app credential로 부르고 결과를 그대로 돌려준다(app-event-publish)."
    outcomes:
      - id: forwarded
        when: "core의 결과(published와 reachable·unreachable·refused 수)를 그대로 전달"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "본문이 JSON 객체가 아니거나 1 MiB를 넘음, events/publish 모양이 맞지 않음, 또는 core가 거절함(선언하지 않은 event, payload 불일치)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "운영 자식이 아님(preview 자식, release 없음), 또는 자식의 release가 지금 active release가 아님"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: core-failed
        when: "core가 낸 그 밖의 오류 그대로(not_found, conflict 포함)"
        observe: [response]
    crosses_process: true

  - id: app-event-publications-read
    title: "앱이 낸 event의 발행 기록을 읽는다"
    actor: agent
    entries: [route:apps/event_publications]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/events/reads.ts, packages/core/apps/events/store.ts]
    steps:
      - "app, 선택 event, cursor(pub id), limit(최대 200)로 그 앱의 발행 기록을 새 것부터 읽는다. 앱마다 최근 200개만 있다."
      - "범위 밖 앱은 없는 앱과 같은 not_found다(app.invocations와 같은 판정). payload 본문은 기록에 없다."
      - "사람이 쓰는 화면은 없다. agent가 CLI `lophn app event-publications`로 읽는다. 같은 trace_id의 호출은 `lophn app invocations`의 event caller 행이다."
    outcomes:
      - id: listed
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 pub id 꼴이 아님"
        observe: [response]
      - id: not-found
        code: not_found
        when: "범위 밖이거나 없는 앱"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, agent, machine)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    docs: [architecture/event.md, architecture/observability.md]

  - id: app-broker-sessions
    title: "앱이 broker로 session 목록·상태를 읽고 멈춘다"
    actor: app
    entries: [system:app-broker-sessions]
    uses: [route:app_sessions/list, route:app_sessions/status, route:app_sessions/stop]
    pre: [app-record-started:started]
    boundary: [app-runtime, app-capability]
    code: [packages/core/apps/permissions/broker/sessions.ts, packages/core/apps/permissions/broker/server.ts, packages/sdk/agent/process.ts]
    steps:
      - "앱 자식이 SDK(`@lophn/agent/process`의 sessions)로 broker의 sessions/list·status·stop에 입력을 보낸다. broker endpoint가 credential, 본문, process_nonce·mode가 연결과 같은지 먼저 본다"
      - "route 입력 모양을 검사한다. 자식이 운영 앱(live)이면서 release가 있고 그 release가 지금 active release여야 한다. 사람 허락(grant)은 보지 않는다: 보이는 범위는 call 정책이고 멈춘 것은 기록된다"
      - "core app_sessions.*를 이 자식의 app credential로 부르고 결과를 그대로 돌려준다(app-sessions-list, -status, -stop). 부모 invocation이 돌고 있지 않아도 된다"
    outcomes:
      - id: forwarded
        when: "core의 결과를 그대로 전달"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "본문이 JSON 객체가 아니거나 1 MiB를 넘음, 입력 모양이 맞지 않음, 또는 core가 거절함"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "운영 자식이 아님(preview 자식, release 없음), 자식의 release가 지금 active release가 아님, 또는 core가 거절함(다른 앱을 입력에 적음)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: core-failed
        when: "core가 낸 그 밖의 오류 그대로(not_found, unavailable 포함)"
        observe: [response]
    crosses_process: true

  - id: folder-export-run
    title: "선언의 sync가 보내는 표의 data, 앱 기록, release, source와 기계 기록을 destination의 자기 하위 폴더에 쓴다"
    actor: system
    entries: [system:folder-export]
    boundary: [folder, app-sync]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/folder/export/, packages/core/folder/apps/]
    steps:
      - "계기: 앱마다 AppSyncChanged 뒤 5초 debounce, 5분 timer, folder.destinations 설정이 바뀜, core 시작. core 시작과 destination 바뀜 뒤의 첫 내보내기는 scan이 다른 기계의 기록 사본(horizon)을 읽은 뒤에 돈다(scan이 실패하면 다음 scan 뒤로 미룬다). (앱, destination)마다 한 번에 하나이고 그 사이 온 계기는 끝난 뒤 한 번 더 돈다. 기계 기록은 시작 listener가 제품 판을 알려 준 뒤부터 쓴다"
      - "export가 sync log를 따라 changes·snapshot file을 쓰고(64 MiB를 넘으면 more로 바로 이어 돈다), 그 뒤 앱 기록·release·source를 쓴다. 실패한 일은 1분부터 두 배씩 1시간까지 그 일만 물러난다"
      - "changes file에는 줄의 changeset에서 선언의 sync가 보내는 표의 구간만 담고(폰 앱의 줄에는 폰만 받는 표도 있다) 남는 것이 없는 줄은 건너뛴다. snapshot은 앱 process가 apps.snapshot(for folder)으로 새 DB file에 보내는 표와 그 clock 줄, sync 상태만 복사한 것이고 1 GiB 한도는 그 file을 잰다. 옛 release(sync_to)는 모든 표이고 VACUUM INTO로 DB 통째다"
      - "다른 기계에서 온 일(snapshot 합치기, 결과 모르는 받은 변경)의 '다시 snapshot' 줄(origin machine)은 건너뛴다: 그 data는 출처가 이미 냈다. 그래서 서로의 snapshot을 합친 두 기계도 뒤의 write는 changes file로 나간다"
      - "horizon 밖이면 아직 내보내지 않은 자기 change 줄 가운데 clock이 horizon 이하인 것을 그 자리에서 held로 바꾼다(snapshot 앞에는 그 seq까지 먼저). held인 자기 변경이 풀리지 않았으면 snapshot을 쓰지 않는다: 30일 compaction snapshot은 미루고, snapshot 없이 이을 수 없으면 away_too_long으로 멈춘다"
      - "앱이 다른 기계의 horizon 밖(away_since)이면 core 알림 app_sync_away 하나(앱마다 key 하나)를 쓴다. held 수가 늘면 다시 쓴다. 이번 run이 held로 둔 변경이 있으면 그 run에서 따라잡아 떨어져 있음이 이미 끝났어도 쓴다. 새 held 없이 떨어져 있음이 끝나거나(run 앞뒤의 away_since) 사람이 held를 풀어 줄면 같은 줄을 '따라잡았다'와 남은 held 수로 바꾼다. 마지막으로 알린 held 수는 folder_streams.away_notified(ledger)에 두어 core를 다시 켜도 같은 수로 다시 쓰지 않는다"
      - "앱 release마다 core가 뜬 뒤 처음과 하루에 한 번 흔적 정리: before = max(min(알려진 기계와 자기의 settled), now − 90일)(settled 없는 기계가 있으면 90일 쪽만)로 앱 process의 sync_cleanup을 부르고 돌아온 horizon을 folder_streams에 둔다. 앱이 떠 있지 않으면 다음 run에 다시 본다"
    outcomes:
      - id: written
        observe: ["disk:<destination>/machines/<mch>/", "ledger:folder_streams", "ledger:folder_written"]
      - id: stream-error
        when: "destination이 없거나 쓸 수 없음, 앱이 떠 있지 않음, 남의 writer(foreign_writer, 사람이 app.sync_resume할 때까지 다시 쓰지 않음), 너무 큼. 오류는 folder_streams의 error에 남아 machine.environment에 보이고 그 일은 물러난다"
        observe: ["ledger:folder_streams", "log:core"]
      - id: away-noticed
        when: "이 기계가 그 앱에서 다른 기계의 horizon 밖이다. 옛 변경은 held 줄로 남는다"
        observe: ["ledger:notices", "ledger:app_sync_log"]
      - id: held-blocks-snapshot
        when: "이 기계가 낸 held 변경이 풀리지 않았는데 snapshot이 꼭 필요하다(첫 file, release가 바뀜, bytes로 남지 못한 자기 변경). 아무것도 쓰지 않고 away_too_long이 folder_streams에 남는다"
        observe: ["ledger:folder_streams", "ledger:app_sync_log"]
      - id: back-noticed
        when: "떨어져 있음이 끝났다. 같은 알림 줄이 '따라잡았다'로 바뀐다"
        observe: ["ledger:notices"]
      - id: cleaned
        when: "흔적 정리가 돌았다"
        observe: ["ledger:folder_streams"]
    crosses_process: true
    risk: [data-loss]

  - id: folder-import-run
    title: "destination의 다른 기계 하위 폴더를 읽어 기록 사본을 고치고 data stream과 source를 따라잡는다"
    actor: system
    entries: [system:folder-import]
    boundary: [folder, app-sync]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/folder/import/, packages/core/folder/apps/source.ts]
    steps:
      - "계기: destination마다 machines/와 다른 기계의 하위 폴더·apps·앱 폴더·data·source의 fs.watch(폴더마다, 이 기계 자신의 하위 폴더는 빼고 2초 debounce), 2분 timer, 설정 바뀜, 활성 release가 바뀜, 시작. 새 폴더는 scan 뒤와 timer에 더한다"
      - "scan이 기계·앱 기록 사본을 고친다. 기계 기록의 lophn.folder가 이 기계의 꼴 판 범위 밖이면(또는 기록 자체가 더 새 꼴이면) 기계 기록만 두고 앱 기록은 읽지 않으며 newer_format으로 남긴다. 그 기계의 앱 기록은 records()에서 빠져 release·source도 읽지 않는다. 그 뒤 sync 앱마다 import를 돈다(먼저 sync log의 held 줄이 건드리는 row를 읽어 둔다). 출처 stream의 물러남은 import가 stream마다 한다. 받은 file이 있으면 그 앱의 내보내기를 잡는다(앱 기록의 read·settled)"
      - "출처마다 stream 앞에 지금 활성 release의 held(folder_held)를 번호 순서로 FolderApply로 적용하고 하나가 성공할 때마다 그 행과 사본을 지운다(drain). 활성 release가 바뀌면 release 상태 바뀜이 scan과 import를 다시 돌려 drain이 돈다. 지금 release의 held가 남으면 그 출처의 stream은 읽지 않는다"
      - "출처의 snapshot m이 합쳐지거나(stream·drain) held가 되면 같은 transaction에서 그 출처의 m보다 작은 번호의 held를 release와 상관없이 지우고 commit 뒤 사본을 지운다"
      - "다른 release의 changes를 held로 둘 때 그 출처에서 가장 새 held snapshot 뒤 held changes가 128 MiB를 넘게 되면 복사하지 않고 cursor를 두고 멈춘다(full). 폴더에 더 뒤 snapshot이 있으면 그리로 건너뛴다. 이 기계의 release나 출처 앱 기록의 snapshot 번호가 바뀔 때까지 폴더를 다시 읽지 않는다(core 메모리)"
      - "source 받기는 앱마다 따로 돌고 실패하면 그 일만 물러난다"
    outcomes:
      - id: followed
        observe: ["ledger:folder_reads", "ledger:folder_records", "ledger:app_sync_log"]
      - id: waiting
        when: "다음 번호가 아직 오지 않음, 미래 clock(clock_ahead. changes file의 변경이나 풀어 둔 snapshot의 sync 상태 clock이 이 기계 시각 + 5분보다 앞섬), 다른 release(held로 복사), 맞지 않는 file(invalid_file). 상태는 folder_reads에 남아 machine.environment에 보인다"
        observe: ["ledger:folder_reads", "ledger:folder_held", "disk:folder-held/"]
      - id: held-applied
        when: "이 기계의 앱이 held의 release가 되어 출처마다 번호 순서로 적용했다. 적용이 실패하거나(app_not_running, apply_failed) 사본이 없거나 맞지 않으면(invalid_file) 그 행부터 남고 그 출처의 stream은 멈춘다"
        observe: ["ledger:folder_held", "disk:folder-held/", "ledger:folder_reads", "ledger:app_sync_log"]
      - id: held-covered
        when: "출처의 snapshot m이 합쳐지거나 held가 되어 그 출처의 m보다 옛 held를 지웠다"
        observe: ["ledger:folder_held", "disk:folder-held/"]
      - id: held-full
        when: "그 출처의 held changes가 한도에 닿아 더 복사하지 않고 폴더에 두었다"
        observe: ["ledger:folder_reads", "ledger:folder_held"]
      - id: out-of-range
        when: "그 기계의 폴더 꼴 판이 범위 밖이다(누가 올려야 하는지 update_this·update_peer). data·source·release file을 열지도 복사하지도 지우지도 않고 cursor가 그대로이며 newer_format이다. 범위 안으로 돌아오면 그 cursor부터 잇는다"
        observe: ["ledger:folder_reads", "ledger:folder_records"]
    crosses_process: true
    risk: [data-loss]

  - id: folder-app-forget
    title: "앱을 지우면 그 앱의 폴더 교환 local 상태와 held 사본을 지운다"
    actor: system
    entries: [system:folder-app-forget]
    boundary: [folder]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/folder/export/mod.ts, packages/core/folder/import/mod.ts]
    steps:
      - "AppRemoved event를 받아 export와 import의 forget을 부른다. 폴더의 file은 그대로 둔다"
    outcomes:
      - id: forgotten
        observe: ["ledger:folder_streams", "ledger:folder_reads", "ledger:folder_held", "disk:folder-held/<app>"]
    crosses_process: false

  - id: machine-environment-read
    title: "사람과 agent가 이 기계의 폴더 교환 환경(기계, destination, 앱 상태, 들일 수 있는 앱)을 읽는다"
    actor: agent
    entries: [route:machine/environment]
    boundary: [folder, core-api]
    code: [packages/core/folder/environment.ts, packages/core/main/daemon/wiring/folder.ts, packages/protocol/folder/environment.ts, packages/protocol/folder/status.ts]
    steps:
      - "메인 스레드 read handler가 this_machine, 기계 목록(자기와 지우지 않은 기록 사본. 이름이 겹치면 display_name에 id 끝 6자. 기계마다 폴더 꼴 판 범위 exchange), 이 기계의 always_on(ctx.alwaysOn), destination 상태, 활성 release가 있는 앱마다 export·imports(owes_absent_pass 포함)·apps/update_state와 같은 follow·held·machines·away, 들일 수 있는 앱을 모은다. away는 horizon 밖이거나 풀리지 않은 held 줄이 남은 동안 서고 떨어져 있지 않으면 since가 null이다. 경로 말고는 local file 내용을 싣지 않는다"
      - "뒤 계획이 ctx.folderEnvironment.register로 꽂은 section(top, 기계마다, 앱마다)을 부른다. 하나가 던지거나 2초를 넘으면 그 section만 { error }다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 route의 actors(user, agent)가 아니다(core dispatch가 먼저 막는다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "body가 빈 객체가 아니다"
        observe: [response]
    crosses_process: false

  - id: machine-forget
    title: "사람이 다른 기계를 이 기계의 목록에서 지운다"
    actor: person
    entries: [route:machine/forget]
    boundary: [folder, core-api]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/folder/import/mod.ts, packages/protocol/folder/forget.ts]
    steps:
      - "dispatch가 actors(user)를 본다. 자기 id면 거절한다"
      - "folder_records의 그 기계 행에 forgotten_at을 적는다. 그 기계는 읽지 않고 흔적 정리를 붙잡지 않는다. 행과 받은 data는 남고, 그 기계가 더 큰 revision의 기록을 쓰면 돌아온다"
      - "내보내기를 잡는다(앱 기록과 흔적 정리)"
    outcomes:
      - id: forgotten
        observe: [response, "ledger:folder_records"]
      - id: self
        code: invalid_input
        when: "이 기계 자신의 id다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "그 기계의 기록이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 user가 아니다(core dispatch가 먼저 막는다)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "ledger에 쓰지 못했다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]

  - id: app-sync-held
    title: "사람이나 그 앱의 agent가 horizon 밖이라 held로 남은 변경을 보고, 다시 적용하거나 버린다"
    actor: agent
    entries: [route:apps/sync_held]
    boundary: [folder, app-sync]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/apps/calls/service.ts, packages/protocol/folder/held.ts]
    steps:
      - "앱 workspace의 agent 자격은 자기 앱만 본다(다른 앱은 not_found)"
      - "list: 풀리지 않은 held 줄과 줄마다 made_here(이 기계가 낸 변경이라 이미 이 기계의 data에 있다), changeset이 건드리는 표·종류·때"
      - "apply(받은 변경): 그 changeset을 지금 clock의 이 기계 write로 다시 적용한다(invocation 하나, caller는 사람이나 agent의 tool call). 보통 write처럼 sync log에 남아 내보내지고 held 줄은 풀린다. agent는 tool_call이 있어야 한다"
      - "apply(made_here): 다시 적용하지 않는다. 앱 process가 그 변경이 건드린 row·칸의 지금 값을 새 clock으로 찍어 돌려주고 그것이 change 줄로 내보내진다(invocation은 data를 바꾸지 않아 changeset이 없다)"
      - "discard: 적용하지도 내보내지도 않고 resolved_at을 적는다. bytes는 기록에 남는다. note가 뜻을 말한다(made_here면 이 기계의 data에 남는다)"
      - "apply·discard 뒤 그 앱 내보내기의 물러남을 지우고 바로 내보낸다(held가 snapshot을 막았을 수 있다)"
    outcomes:
      - id: listed
        observe: [response]
      - id: applied
        observe: [response, "ledger:invocations", "ledger:app_sync_log"]
      - id: discarded
        observe: [response, "ledger:app_sync_log"]
      - id: invalid_input
        code: invalid_input
        when: "apply·discard에 seq가 없다, agent가 tool_call 없이 apply한다, changeset이 깨졌다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "그 seq의 held 줄이 없다, 앱이 없다, 앱 workspace agent가 다른 앱을 적었다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "다시 적용한 받은 변경이 지금 data와 부딪거나 made_here 변경의 표가 지금 표와 맞지 않는다(아무것도 바뀌지 않는다), 또는 사이에 활성 release가 바뀌었다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "sync log가 붙지 않았거나 앱 process가 떠 있지 않다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 user·agent가 아니다(core dispatch가 먼저 막는다)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]

  - id: app-sync-resume
    title: "사람이 남의 writer 때문에 멈춘 앱 내보내기를 다시 켠다"
    actor: person
    entries: [route:apps/sync_resume]
    boundary: [folder]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/protocol/folder/held.ts]
    steps:
      - "그 앱 data stream의 오류와 내보내기의 물러남을 지우고 바로 내보낸다. 자기 하위 폴더에 남의 file이 아직 있으면 다음 내보내기가 다시 foreign_writer로 멈춘다"
    outcomes:
      - id: resumed
        observe: [response, "ledger:folder_streams"]
      - id: not-stopped
        when: "그 앱이 이 기계에서 내보내지 않거나 오류가 없다(resumed false)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 user가 아니다(core dispatch가 먼저 막는다)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "ledger에 쓰지 못했다"
        observe: [response]
    crosses_process: false

  - id: app-update-state
    title: "사람이나 그 앱의 agent가 폴더로 맞추는 앱의 기계 사이 판 차이(release, lophn 판, 따라가기, 기다리는 변경)를 본다"
    actor: person
    entries: [route:apps/update_state]
    boundary: [folder, app-releases]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/apps/update-state/, packages/protocol/apps/update-state.ts, packages/shell/renderer/app-frame/app-detail/machines-section.tsx]
    steps:
      - "앱 workspace의 agent 자격은 자기 앱만 본다(다른 앱은 not_found)"
      - "이 기계에서 선언의 sync가 표를 보내고 활성 release가 있는 앱만 답한다. 메모리 값(follow 상태, held, 기계별 꼴 판 범위)과 기록 사본, 이 기계의 release 행을 읽기만 한다"
      - "machines: 이 기계(첫 줄)와 그 앱 기록이 있는 기계의 활성 release(이 기계에 있으면 r<n> 번호), 그리고 꼴 판이 범위 밖이라 앱 기록을 읽지 않은 기계(release null)와 각 기계의 lophn 판·exchange. 범위 밖 기계는 범위 밖이 되기 전에 읽은 그 기계의 앱 기록 사본이 있는 앱에만 선다(사본이 하나도 없으면 모든 앱에 선다)"
      - "held: 출처와 release마다 변경 수·bytes·한도. 이 기계의 따라가기가 갈라졌고 그 release의 held면 diverged(합친 release가 나와야 온다), 이 기계가 지금 release보다 먼저 들인 release(번호가 낮다)이거나 data schema가 지금보다 낮으면 older_release, 아니면 newer_release(사람이 돌아가 내려놓은 release도 newer_release다). 지금 release의 held(적용 중)는 뺀다"
      - "follow 상태·held·기계 범위가 바뀌거나 scan이 새 기록을 읽으면 folder wiring이 StateChanged(app_runtime)를 내고, 활성 release가 바뀌면 releases 변경으로 화면이 다시 읽는다"
      - "App details의 Machines 절이 기계마다 한 줄, 이 기계 줄 아래 따라가기 상태, 다른 기계 줄 아래 기다리는 변경과 범위 밖 안내, 기다리는 동안 앱이 이 기계의 data로 돈다는 한 줄을 보인다. 동의를 기다리면 Open waiting list가 대기 panel을 연다. 올리는 단추는 없다. 폴더로 맞추지 않는 앱(not_found)이나 첫 읽기가 실패하면 절이 서지 않는다"
    outcomes:
      - id: read
        observe: [response, "screen:app-machines-waiting"]
      - id: not_found
        code: not_found
        when: "이 기계에서 폴더로 맞추지 않는 앱이다(sync가 보내는 표 없음, 활성 release 없음, 보관, 없는 앱), 또는 앱 workspace agent가 다른 앱을 적었다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "app이 앱 id가 아니다(core dispatch가 입력 schema로 막는다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 user·agent가 아니다(core dispatch가 먼저 막는다)"
        observe: [response]
    crosses_process: false

  - id: app-take-in
    title: "다른 기계가 폴더에 낸 앱을 같은 id로 이 기계에 들인다(release는 prepared)"
    actor: agent
    entries: [route:apps/take_in]
    uses: [route:apps/create, route:apps/connect_source, route:releases/record]
    boundary: [folder, app-releases]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/folder/apps/take-in.ts, packages/core/apps/folder-host.ts, packages/protocol/folder/take-in.ts]
    docs: [architecture/activation.md]
    steps:
      - "ledger handler가 없다. folder wiring이 writer 앞에서 받아 입력을 검사한다"
      - "앱 기록 사본에서 출처(from 없으면 기록이 가장 최근인 기계)와 목표 code_commit(release 생략 시 그 기계의 active_release.code_commit)을 고른다. 같은 code_commit의 release가 이미 있으면 그것을 돌려준다"
      - "출처들의 증분 source bundle(source/<n>.bundle)을 받아 목표 commit이 있는지 확인하고, commit의 package.json이 고정한 @lophn/* SDK와 @me/* package 의존, slug를 검사한다"
      - "앱이 없으면 source 저장소를 만들고 폴더 take-in 자격(machine:folder-apps)으로 같은 id의 app.create와 connect_source를 부른 뒤, 이 기계에서 release를 직접 준비(appsControl.prepareCommit: npm install·build·봉인·검사·release.record)해 prepared로 넣는다. 활성화와 동의는 이 기계에서 release.activate가 사람에게 묻는다. 앱 등록과 release 준비는 따로 commit되므로 release 준비가 실패해 앱만 남으면 오류 글이 앱이 release 없이 더해졌으니 다시 take-in하라고 말하고, 그 앱은 들일 수 있는 앱 목록에 계속 선다(다시 take-in은 release만 준비한다)"
      - "끝나면 그 앱의 source 받기를 잡는다"
    outcomes:
      - id: installed
        observe: [response, "ledger:apps", "ledger:releases", "disk:apps/<app>/"]
      - id: existing
        when: "같은 code_commit의 release가 이미 있다(installed existing)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "그 앱이 폴더 기록에 없다, 그 release가 기록에 없다, 기록을 읽은 destination이 이 기계에 없다"
        observe: [response]
      - id: source-incomplete
        code: invalid_input
        when: "목표 commit의 source bundle이 아직 다 오지 않았다(details.reason source_incomplete), release 준비의 build·선언·검사 실패, 입력 꼴이 틀리다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "이 기계 lophn에 없는 SDK 판(sdk_missing), 다른 앱이 slug를 씀(slug_in_use), 의존 package가 없음(dependency_missing), 같은 앱의 release 준비가 이미 돌고 있음(preparing)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "git 실패, 일시적 의존 설치·staging 실패, 안쪽 command의 실패"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 user·agent가 아니다(core dispatch가 먼저 막는다)"
        observe: [response]
    crosses_process: false
    risk: [permission]

  - id: carry-manifest-write
    title: "computers 폴더의 자기 하위 폴더에 명단 file과 앱 목록을 쓰고 이 컴퓨터의 서명 key로 manifest에 서명한다"
    actor: system
    entries: [system:carry-manifest]
    boundary: [folder, remote-protocol]
    code: [packages/core/main/daemon/wiring/folder.ts, packages/core/folder/export/manifest.ts, packages/core/folder/export/roster.ts, packages/core/folder/export/events.ts]
    docs: [architecture/folder-sync.md]
    steps:
      - "계기: 내보내기, 앱 기록·release·source 쓰기, 기계 기록 쓰기가 끝난 뒤. 한 번에 하나이고 그 사이 온 계기는 끝난 뒤 한 번 더 돈다"
      - "7일보다 옛 자기 event file(과 folder_written 행)을 지운다. remote가 켜져 있고 자기 항목이 있으면 명단 file roster.json(statement만, 주소 없음)을 쓴다"
      - "앱마다 apps/<app>/files.json(그 앱의 app.json, 가장 새 snapshot과 그 뒤 data file, source json, events)과 그 위 manifest.json(record.json, roster.json, 앱 목록)을 이번 내보내기가 쓴 file의 기록(folder_written)으로 만든다. 폴더를 훑지 않는다. 목록이 같으면 다시 쓰지 않는다"
      - "snapshot 뒤 data file이 2,000을 넘으면 내보내기가 computers에 새 snapshot을 쓴다. 앱 목록이나 manifest가 8 MiB를 넘게 되면 그 file을 쓰지 않고 지난 것을 두고 그 앱 stream에 too_large를 남긴다"
      - "revision은 max(지난 revision + 1, 지금 ms)이고 지난 revision은 자기 manifest file과 다른 기계가 되돌려 준 자기 manifest의 표시 가운데 큰 것이다. 이 컴퓨터의 명단 서명 key로 서명하고 temp에 쓴 뒤 rename한다. 바뀌었으면 StateChanged(carry_files)를 낸다"
      - "같이 보는 폴더가 있으면 이어서 거울에 복사한다(carry-mirror-copy)"
    outcomes:
      - id: written
        observe: ["disk:computers/machines/<mch>/manifest.json", "disk:computers/machines/<mch>/apps/<app>/files.json", "ledger:folder_written", "event:StateChanged"]
      - id: unchanged
        when: "목록이 지난번과 같다. 아무것도 쓰지 않는다"
        observe: ["disk:computers/machines/<mch>/manifest.json"]
      - id: no-signing-key
        when: "이 컴퓨터에 서명 key가 없다(remote를 켠 적이 없다). manifest를 쓰지 않아 다른 컴퓨터가 이 컴퓨터의 file을 받지 못한다. 이 컴퓨터는 다른 컴퓨터의 것은 받는다"
        observe: ["log:core"]
      - id: too-large
        when: "앱 목록이나 manifest가 8 MiB를 넘게 된다. 지난 것을 두고 그 앱 stream에 too_large 오류가 남아 machine.environment에 보인다. 받는 쪽은 지난 목록으로 계속 받는다"
        observe: ["ledger:folder_streams", "log:core"]
    crosses_process: false
    risk: [data-loss, sandbox]
    refs: []
    unclear:
      - "명단이 바뀌어 자기 항목의 서명 key가 바뀌어도 manifest는 다음 내보내기 계기에야 새 key로 다시 서명된다"

  - id: carry-mirror-copy
    title: "사람의 같이 보는 폴더에 이 컴퓨터의 하위 폴더를 manifest 사슬대로 복사한다"
    actor: system
    entries: [system:carry-mirror-copy]
    uses: [system:carry-manifest]
    boundary: [folder]
    code: [packages/core/folder/mirror.ts, packages/core/main/daemon/wiring/folder.ts]
    docs: [architecture/folder-sync.md]
    steps:
      - "folder.shared가 쓸 수 있는 폴더일 때만 돈다. 이 컴퓨터의 manifest 사슬이 싣는 file을 그 폴더의 같은 path로 복사한다. 이미 같은 크기·sha256이면 건너뛰고, 아직 computers 폴더에 없는 file(쓰는 중인 내보내기)은 다음 번으로 미룬다"
      - "manifest는 마지막에 쓴다. 그 뒤 이 컴퓨터의 하위 폴더에서 사슬에 없는 file(compaction, 지운 release, 옛 event)을 지운다. 다른 기계의 하위 폴더에는 쓰지도 지우지도 않는다(writer가 자기 하위 폴더 밖을 막는다)"
    outcomes:
      - id: copied
        observe: ["disk:<folder.shared>/machines/<mch>/"]
      - id: not-written
        when: "같이 보는 폴더에 쓰지 못한다(없거나 쓸 수 없음). 이 컴퓨터의 computers 폴더와 다른 길은 그대로이고 로그만 남는다"
        observe: ["log:core"]
    crosses_process: false
    risk: [data-loss, sandbox]

  - id: carry-mirror-take-in
    title: "사람의 같이 보는 폴더에 있는 다른 컴퓨터의 manifest와 file을 받는 자리에 넘긴다"
    actor: system
    entries: [system:carry-mirror-take-in]
    boundary: [folder]
    code: [packages/core/folder/mirror.ts, packages/core/main/daemon/wiring/folder.ts]
    docs: [architecture/folder-sync.md]
    steps:
      - "계기: 읽기 scan(감시 2초 debounce, 2분 timer, 설정 바뀜). folder.shared가 있을 때만"
      - "명단 view에 하나뿐인 컴퓨터 항목이 없는 기계(서명 key가 없다)의 하위 폴더는 열기 전에 건너뛴다. 그 폴더는 누구나 쓸 수 있어 지어낸 기계마다 읽게 되기 때문이다"
      - "그 밖의 기계마다 manifest 글을 받는 자리에 넘기고, 받는 자리가 지금 목록 사슬이 싣는데 없다고 하는 file 가운데 폴더에 같은 크기로 있는 것을 넘긴다. 새로 받은 목록 file이 그 아래 file을 바라게 하므로 더 받을 것이 없을 때까지 돌되 scan마다 8번까지이고 이번에 이미 받은 path를 또 받으면 멈춘다. 검사(서명, revision 표시, 사슬, 크기·sha256)는 받는 자리가 길과 상관없이 한다"
      - "명단 file은 별도다(carry-roster-file-read)"
    outcomes:
      - id: taken-in
        observe: ["disk:computers/machines/<mch>/", "ledger:folder_carry_marks"]
      - id: skipped
        when: "받는 자리가 믿지 않거나 사슬에 없는 것, 서명 key가 없는 기계, 폴더를 읽지 못함. 아무것도 받지 않고 다음 scan에 다시 본다"
        observe: ["log:core"]
    crosses_process: false
    risk: [data-loss, sandbox]

  - id: carry-roster-file-read
    title: "폴더로 온 다른 컴퓨터의 명단 file에서 statement만 명단에 넘긴다"
    actor: system
    entries: [system:carry-roster-file]
    boundary: [folder, remote]
    code: [packages/core/folder/import/roster.ts, packages/core/main/daemon/wiring/folder.ts, packages/core/main/daemon/wiring/remote.ts]
    docs: [architecture/folder-sync.md, architecture/remote.md]
    steps:
      - "계기: 읽기 scan. 명단에 든 컴퓨터의 roster.json은 computers 폴더에서만 읽는다(그 기계가 서명한 목록이 싣는 file이다). 사람의 폴더에서 바로 읽는 것은 명단에 없는 기계의 것뿐이다"
      - "명단에 없는 기계(아직 믿지 못하는 컴퓨터, dual boot의 다른 OS)의 roster.json은 scan마다 4개만 돌아가며 읽고, 그 기계 이름의 컴퓨터 항목이 다루는 key의 statement만 들어오기에 드는 수까지 넘긴다"
      - "statement만 명단에 넘긴다. 주소(reach)는 읽지 않는다. 믿는 서명이 없는 statement는 명단 규칙이 거르고 모르는 서명자 상한 안에서만 남아 기기가 되지 않는다. 지난번과 같은 bytes는 다시 넘기지 않는다"
    outcomes:
      - id: statements-offered
        observe: ["ledger:roster_statements", "event:StateChanged"]
      - id: ignored
        when: "file이 크거나 모양이 틀림, 같은 bytes, 믿는 서명이 없음. 명단은 그대로다"
        observe: ["ledger:roster_statements"]
    crosses_process: false
    risk: [permission, sandbox]

  - id: carry-event-write
    title: "across_machines로 선언한 event를 이 컴퓨터에서 전달한 뒤 다른 컴퓨터로 갈 event file로 쓴다"
    actor: app
    entries: [system:carry-event-write]
    uses: [route:app_events/publish]
    boundary: [app-runtime, folder]
    code: [packages/core/apps/events/publish.ts, packages/core/folder/export/events.ts, packages/core/main/daemon/wiring/folder.ts]
    docs: [architecture/event.md, architecture/folder-sync.md]
    steps:
      - "발행은 이 컴퓨터의 구독자에게 먼저 간다(app-event-publish). 선언에 across_machines가 있고(sync가 표를 보내는 앱만 선언할 수 있다) 그 앱 workspace가 이 컴퓨터의 call 정책에서 private이 아닐 때만 event file을 쓴다"
      - "machines/<이 컴퓨터>/apps/<app>/events/<ULID>.json(format 2, machine, app, id, code_commit, name, payload, at, 64 KiB까지)을 그 앱 data의 destination 폴더에 쓰고 folder_written에 적는다. 앱 목록이 싣고 manifest가 서명하면 다른 컴퓨터로 간다"
      - "쓰지 못해도(너무 큼, 폴더를 쓸 수 없음) 이 컴퓨터의 발행은 이미 끝났다. log 한 줄만 남는다"
    outcomes:
      - id: written
        observe: ["disk:<destination>/machines/<mch>/apps/<app>/events/<id>.json", "ledger:folder_written"]
      - id: not-carried
        when: "workspace가 private이거나 event를 file로 쓰지 못한다(64 KiB 초과, 폴더 오류). 이 컴퓨터의 구독자는 그대로 받는다"
        observe: ["log:app"]
    crosses_process: false
    risk: [permission]

  - id: carry-event-arrive
    title: "다른 컴퓨터가 낸 event file을 이 컴퓨터에서 한 번 낸다"
    actor: system
    entries: [system:carry-event-arrive]
    boundary: [folder, app-runtime]
    code: [packages/core/folder/import/events.ts, packages/core/apps/events/publish.ts, packages/core/main/daemon/wiring/folder.ts]
    docs: [architecture/event.md, architecture/folder-sync.md]
    steps:
      - "계기: 읽기 scan 끝. 이 컴퓨터에 든 sync 앱마다 그 destination 폴더의 다른 기계 apps/<app>/events/를 읽는다. 난 기계, 앱, id는 path에서 얻고 내용의 값이 path와 다르거나 모양이 틀리면 거절한다. at이 7일보다 옛 것이나 5분 넘게 앞선 것, code_commit이 이 컴퓨터 활성 release와 다른 것은 내지 않는다(다른 release의 것은 센 것으로 적지 않아 이 컴퓨터가 그 release가 되고 나이 안이면 그때 난다)"
      - "folder_events_seen에 없는 것만 한 transaction에서 그 표에 적은 뒤 내는 쪽(apps)에 넘긴다. 같은 file이 연결, 폰, 같이 보는 폴더로 여러 번 와도 한 번이다. 그 행은 14일 뒤에 지운다"
      - "내는 쪽이 앱이 이 컴퓨터에 있고 보관하지 않았는지, 그 workspace가 이 컴퓨터에서 private이 아닌지, 활성 release 선언이 그 event를 across_machines로 두고 payload가 schema에 맞는지 다시 본다. 맞으면 그 앱의 구독자에게 난 기계를 싣고 낸다(chain은 그 앱 하나)"
    outcomes:
      - id: arrived
        observe: ["ledger:folder_events_seen", "ledger:app_event_publications", "ledger:invocations"]
      - id: skipped
        when: "앱이 없음·보관함, 이 컴퓨터에서 private, 나이 범위 밖, 다른 release, 선언이 맞지 않음, payload가 schema에 맞지 않음. 낸 것으로 센다(다시 보지 않는다). log 한 줄"
        observe: ["ledger:folder_events_seen", "log:app"]
      - id: refused
        when: "path와 내용이 다르거나 모양이 틀림, 나이 범위 밖, 다른 release의 file. 센 것으로 적지 않는다"
        observe: ["log:core"]
    crosses_process: false
    risk: [permission]

  - id: carry-removed-computer
    title: "정해진 빼기로 명단에서 빠진 컴퓨터의 하위 폴더를 7일 동안 치워 두었다가 지운다"
    actor: system
    entries: [system:carry-removed]
    boundary: [folder, remote]
    code: [packages/core/folder/replica.ts, packages/core/main/daemon/wiring/remote.ts]
    docs: [architecture/folder-sync.md]
    steps:
      - "계기: 명단 view가 바뀜. 그 기계 이름의 컴퓨터가 지금 없고 정해진 빼기로 빠졌고 그 이름의 정해지지 않은 빼기도 없을 때만 빠진 것으로 본다(새 key로 돌아온 기계가 다툼에 걸려 있으면 아니다)"
      - "그 하위 폴더를 computers 폴더 밖 data root로 옮겨 두고(받지도 내주지도 읽지도 않는다) 처음 본 때를 적는다. 7일이 지나면 지운다. 그 사이 빼기가 풀리면 되돌린다. 이미 적용한 data는 남고 revision 표시는 지우지 않는다"
      - "빼기가 정해지지 않았거나 충돌이거나 key가 맞지 않게 된 컴퓨터는 이 flow가 아니다: 새 manifest와 file을 받지 않고 든 file은 누구에게도 내주지 않으며 지우지 않는다"
    outcomes:
      - id: parked
        observe: ["disk:carry-removed/<mch>/"]
      - id: deleted
        when: "치워 둔 지 7일이 지났다"
        observe: ["disk:carry-removed/"]
      - id: restored
        when: "7일 안에 빼기가 풀렸다. 하위 폴더를 computers 폴더로 되돌린다"
        observe: ["disk:computers/machines/<mch>/"]
    crosses_process: false
    risk: [data-loss]

  - id: app-data-changed
    title: "폰이나 다른 기계에서 온 변경이 앱 DB에 적용되면 그 앱에 data.changed를 낸다"
    actor: system
    entries: [system:app-data-changed]
    boundary: [app-runtime, events]
    code: [packages/core/apps/calls/service.ts, packages/core/main/daemon/wiring/apps.ts]
    docs: [architecture/event.md]
    steps:
      - "폰의 push 하나, 폴더 file 하나(연결, 폰, 같이 보는 폴더, 이름 붙인 폴더 어느 길이든), snapshot 합치기 하나가 앱 DB에 적용된 뒤(실제로 바뀐 것이 있을 때만) 한 번 낸다"
      - "lophn이 발행자인 event data.changed(payload 없음)를 그 앱 하나에만 보낸다. 그 앱의 구독 handler와 열린 앱 화면이 받고 무엇이 바뀌었는지는 싣지 않는다(앱이 다시 읽는다). 뒤 기록이 실패해도 적용이 끝났으면 낸다"
    outcomes:
      - id: published
        observe: ["event:AppEventPublished", "ledger:invocations"]
      - id: not-published
        when: "적용된 것이 없다(전부 건너뜀, held, 이미 받은 변경). 낼 구독자가 없으면 기록도 남기지 않는다"
        observe: []
    crosses_process: false
