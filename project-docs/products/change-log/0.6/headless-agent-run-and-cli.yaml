id: headless-agent-run-and-cli
version: 0.6.0
title: "lophn agent와 앱 tool을 화면 없이 부르는 run과 CLI를 더한다"
modules: [packages/protocol, packages/core/runs, packages/core/lophn-agent, packages/core/router, packages/core/main, packages/core/install-and-update, packages/coding-agent, packages/shell/renderer, packages/design, tools]
checked: [architecture-event, architecture-app-call, architecture-agent-definition, architecture-eval, architecture-workspace-layout, tool-dev, tool-check-deps, skill-ui-design, tool-wireframes]
change: |
  전:
  - lophn agent를 화면 밖에서 부르고 결과를 받는 길이 없었다. "일이 끝났다"는 신호도 없어 eval은 1초 조용하면 끝으로 짐작했다.
  - unattended 표시는 agent의 `SendCall`·`ReplyCall`에만 있었다. 사람 메시지에는 그 turn을 unattended로 여는 입구가 없었다.
  - CLI는 coding token만 받았고 lophn agent에게 보내는 명령은 `message send` 하나였다. user token은 parent pipe의 hello frame에만 있었다.
  후:
  - run은 agent 호출 하나나 앱 tool 호출 하나이고 core에서는 늘 비동기다. 새 module `packages/core/runs`와 route `StartRun`, `ReadRun`, `ListRuns`(`agent`·`place`·`session`·`state`로 거름), `WaitRun`(최대 60초), `CancelRun`이 있고 기록은 `runs` 표(상태 `running|done|failed|cancelled`, 실패 이유 아홉)다. `CreateRun`, `SettleRun`은 core 안 machine 자격만 쓴다.
  - 끝은 run의 입력 메시지를 가져간 turn과 그 `TurnEnded`로 안다. 답은 그 turn에서 그 session의 agent가 남긴 마지막 메시지다. schema가 있으면 글 전체를 감싼 code fence 하나를 벗기고 JSON으로 읽어 검사하고, 틀리면 `invalid_output`이다. `StartRun`은 이름을 다 푼 뒤에 session을 연다.
  - `SendMessage`에 `unattended: true`가 생겼다. 그 사람 메시지는 unattended turn을 열고 `messages.unattended` 열에 남지만 tag 글과 받은 봉투에는 싣지 않는다. 켤 때 입력함에 되돌리는 사람 메시지(`unstartedHumanMessages`)에서 뺀다. `messages` 표에 `unattended` 열이 제자리에서 더해졌다.
  - 취소는 run을 먼저 닫고, 입력함에서 뺄 수 있으면 빼고 도는 turn은 `StopTurn`(`state_seq` 충돌이면 최대 3번)으로 멈춘다. 켤 때 running인 tool run과 turn이 가져가지 않은 agent run은 `lophn_restarted`로 닫는다. session이 archive되거나 지워지면 그 session의 running run은 `turn_interrupted`로 닫는다. tool run은 사람이 부르는 길(Gate 없음)이고 취소해도 이미 보낸 앱 호출은 멈추지 않는다.
  - CLI: `lophn agent run`(`--agent`, `--session`, `--schema`, `--input`, `--async`), `lophn tool call`, `lophn run wait|show|cancel`. 자격은 coding token이 먼저고 없으면 `<data root>/run/user-token`(core가 hello 때 0600으로 쓰고 켤 때와 종료 때 지운다. 쓰지 못하면 core가 시작을 멈춘다)이다. coding session 안에서는 run route가 `forbidden`이고, `not_found` 글을 "범위 밖"으로 바꾸는 것은 coding token일 때만이다. lophn이 꺼져 있으면 `unavailable`(exit 5)이다. 실패하거나 취소된 run은 exit 4다.
  - 화면: project sidebar와 앱 공간의 agent 목록에 Background 칸이 생겼다. run이 연 session은 session 목록에서 빠지고 그 run 아래로 묶인다. run event가 없어 session 상태가 바뀔 때마다 `ListRuns`를 다시 읽는다.
why: |
  정해진 때 저절로 도는 일(job)과 program이 agent를 부르는 flow의 바닥이다. 끝을 짐작하지 않고 turn으로 알아야 같은 session의 다른 입력의 답을 돌려주지 않는다. 자세한 흐름은 `project-docs/architecture/run.md`.
decisions:
  - by: person
    text: |-
      run의 turn은 unattended다. CLI에 `--dangerously-skip-permissions`는 없다. (2026-10-20)
  - by: person
    text: |-
      호출마다 새 session이고 이어 쓰려면 `--session`을 준다. 자동 재시도는 없다. (2026-10-20)
  - by: person
    text: |-
      CLI 자격은 data root의 user token file(0600)이다. 같은 OS 사용자의 위험은 신경 쓰지 않는다. (2026-10-20)
  - by: agent
    text: |-
      부를 agent는 `--agent`로 고른다(없으면 lophn). 짧은 꼴(`lophn`, `pm:<project>`, `ae:<app>`, `operator:<이름>`, `operator:<project 또는 app>/<이름>`)과 NamedAgent JSON을 받는다. `operator:<x>/<이름>`은 project로 먼저 풀고 `not_found`면 앱으로 한 번 더 푼다.
  - by: agent
    text: |-
      `invalid_output`은 run의 실패 이유이고 경계의 오류 코드 일곱은 그대로다.
  - by: agent
    text: |-
      run 입력은 켤 때 다시 줄 세우지 않는다. 다시 돌면 이미 `lophn_restarted`로 닫힌 run 뒤에 attended turn이 생긴다.
  - by: agent
    text: |-
      이름이 없는 tool은 `StartRun`에서 막지 않고 run이 `tool_denied`로 실패한다. 선언을 미리 볼 port를 두지 않았다.
  - by: person
    text: |-
      run 화면은 wireframe 모양에서 두 가지만 고쳐 쓴다: 시각을 이름 아래 줄로 내리고, running 점은 run이 연 session 줄에만 둔다. (2026-10-22)
  - by: agent
    text: |-
      run이 연 session은 열린 채 남고 화면은 그 run 아래로 묶는다. `--session`으로 이어 쓴 session은 원래 자리다. run이 연 session도 Agent 탭의 session 목록에는 보인다.
  - by: agent
    text: |-
      CLI 표의 run 명령 다섯은 `route`가 없고 `output`이 `z.unknown()`이다. protocol에서 coding-agent → runs → lophn-agent → coding-agent가 import 순환이 되어 명령이 `protocol/runs`의 route를 직접 부른다. 이름이 안 풀린 첫 시도는 session도 run도 남기지 않아 CLI의 두 번째 시도가 안전하다.
follow_up: |
  개발 data는 `messages`의 새 열 때문에 지우고 새로 만든다(schema를 제자리에서 바꿨다). job과 scheduler(`schedule-job`).
