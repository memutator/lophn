# lophn — Boundary Catalog
#
# lophn이 어떤 경계로 나뉘고 그 사이에 어떤 공개 계약이 있는지의 ID 목록이다. 설명은 한 문장만 쓴다.
# 이 ID가 저장소의 메타데이터 축이다: module-catalog(코드 path → ID), context-component-registry(context가
# 어느 ID와 같이 바뀌나), 계획의 범위가 이 ID를 가리킨다. changelog는 module을 적고 module-catalog로 이 ID에 닿는다.
#
# - elements는 children으로 실제 포함 관계를 짓는 tree다. interfaces는 kind: interface인 공개 계약의 flat 목록이고
#   defined_by(정의), provided_by(구현), used_by(직접 쓰는 쪽)로 요소를 잇는다.
# - kind: subsystem(큰 경계), application(실행 입구), component(안쪽 책임 단위), library(재사용 정의),
#   extension(공개 계약을 따르는 바깥 구현), actor(바깥 사용자), interface(공개 계약).
# - depends_on은 밝힐 필요가 있는 공개 library·interface 의존만 적는다. 내부 import를 다 적지 않는다.
# - ID는 영어 kebab-case이고 파일 전체에서 하나다. 계층을 이름에 넣지 않고, 옮겨도 바꾸지 않고, 다른 뜻에 다시 쓰지 않는다.
# - 부모 ID를 가리킨다고 자식까지 가리키는 것은 아니다. 기능·화면·event마다 ID를 만들지 않는다.
# - 경계나 계약을 바꾸는 변경은 같은 변경에서 이 파일을 고친다. ID·참조·칸은 tools/check-modules.ts가 본다.

schema_version: 1
system: lophn
description: 여러 문서가 같이 가리키는 lophn의 추상화 경계와 공개 계약.
elements:

  - id: protocol
    kind: library
    description: process와 화면 사이에서 주고받는 것의 정의와 그 client.
    depends_on:
      - base

  - id: base
    kind: library
    description: 여러 package가 같이 쓰는 공용 구현.

  - id: core
    kind: subsystem
    description: lophn의 업무 로직(feature module)과 그 바닥.
    depends_on:
      - protocol
      - base
      - remote-client
    children:

      - id: projects
        kind: subsystem
        description: project workspace와 그 폴더의 파일(문서). 기계를 넘는 project id(git project는 저장소 안 `.lophn-project.json`의 `pri_`가 원본이고 ledger는 cache, git이 아닌 project와 폴더 없는 project는 ledger에서 난 `pri_`가 원본. 다시 읽기, file 상태, `project.identity`·`create_identity`·`renew_identity`·`match`), 앱이 받는 project와 `place.workspace`의 `identity`, 이 기계에 없는 project를 git URL에서 받아 등록하는 `project.clone`과 설정 `projects.folder`, 다른 기계를 보는 desktop 창에서 그 기계의 project를 같은 id로 이 컴퓨터의 것과 묶어 보이기([Clone here] 포함)를 포함한다.

      - id: apps
        kind: subsystem
        description: 사람이 만들고 쓰는 앱. project에 묶이지 않는 그릇이다.
        children:

          - id: app-releases
            kind: component
            description: 앱의 정의와 판. 폰 화면(`phone` 자리)의 build(`phone.js`, manifest, desktop preview 진입)와 선언과의 양쪽 대조, 선언의 위젯(`widgets`)과 `phone.use` 권한 요구의 검사, 폰에서 도는 앱(`runs_on`에 phone)의 backend build(`phone/backend.js`, manifest)와 release 검사(Node 내장 import, handler 집합, 폰 schema 규칙, SDK 하한), 폴더로 맞추는 앱에서 다른 기계가 낸 새 release를 git 조상 순서로 따라가기와 기계 사이 판 차이 읽기(`apps/update_state`)를 포함한다.

          - id: app-runtime
            kind: component
            description: 앱의 실행과 capability(사람에게 알리는 cap-notify 포함), 앱 event의 발행과 구독 전달(선언 `across_machines`로 다른 기계에서 온 event를 도착한 기계에서 한 번 내기, 폰이나 다른 기계에서 온 변경이 적용된 앱에 내는 core event `data.changed` 포함). 앱마다 file로 남는 앱 log(쓰기는 app supervisor 하나, 읽기 route `apps.logs`)와 예외 stack 풀이, 앱 화면(view)을 어느 앱·release에 묶는 core의 view 표(`app_views/*`, 기기 owner 거르기 포함)와 기준 폰·폰 화면 목록 읽기, 앱의 위젯 값(core memory, `app_widget.set`과 폰이 읽는 `app_widgets.list`), 앱 backend가 폰에 묻는 길(broker `phone/request`와 core의 `app_phone.request`, grant `phone.use`)을 포함한다.

          - id: app-data
            kind: component
            description: 앱의 업무 data.

          - id: app-sync
            kind: component
            description: 폰에서도 도는 앱(`runs_on`에 phone)과 기계 사이로 보내는 앱(`sync_to`)의 사본을 맞추는 길로, ledger의 순서 있는 sync log(origin `machine`과 held 줄 포함), 폰의 push·pull·snapshot, 앱 process의 변경 적용(칸 단위 last-write-wins), 기계 사이 snapshot 합치기, 흔적 정리와 horizon, held 변경 풀기, 두 쪽이 같이 쓰는 sync core를 포함한다.

          - id: package-registry
            kind: component
            description: lophn이 가진 package와 버전의 목록, 읽기 전용 설치 사본, 사용자 package 받기.

      - id: runs
        kind: subsystem
        description: 화면 없이 부르는 lophn agent 호출 하나나 앱 tool 호출 하나(run)와 그 기록. 끝은 그 입력이 연 turn이나 tool 호출의 끝이다.

      - id: workflows
        kind: subsystem
        description: project에 PM이 정의한 workflow를 instance로 돌리고, 참가자의 report와 고친 기록을 남기고, 말한 step의 담당에게 step 메시지를 넣는다. flow면 그 code를 띄우는 port를 부르고 code의 report와 process의 끝을 줄로 남긴다. 판정과 넘기기 정책을 두지 않는다.

      - id: jobs
        kind: subsystem
        description: agent가 만든 job(주기, 할 일 하나, 놓친 차례 정책)을 lophn이 켜져 있을 때 정해진 때 만든 기계(주인 기계)에서만 돌린다. 다른 기계의 job은 사람이 가져올 때까지 멈춘다. 할 일은 agent 호출 run, 앱 tool 호출 run, workflow instance 시작이다. 놓친 차례를 hold로 사람에게 묻는다. instance의 끝을 판정하지 않고 상태만 읽는다.

      - id: problems
        kind: subsystem
        description: 앱 SDK가 앱 log에 쓰는 실패 보고(`reportProblem`)와 잡히지 않은 예외 관찰의 protocol 값(`packages/protocol/problems/`).

      - id: agent-workspaces
        kind: component
        description: lophn workspace 층(home, project, app). workspace 종류마다의 tool 목록, prompt, workspace 정보, workspace마다 하나인 lophn의 내장 정의, workspace 폴더 규칙, data root 아래 자리(Home은 `<data>/home/`), workspace memory와 agent memory의 파일 자리, 내장 skill.

      - id: lophn-agent
        kind: subsystem
        description: lophn 안의 agent를 정의하고 돌리는 harness. workspace 종류와 feature module의 route를 모르고 등록받은 tool로 돈다.
        children:

          - id: agents
            kind: component
            description: handle로 부르는 agent(전역이거나 workspace 하나에 범위가 있다. lophn은 workspace마다 하나다)와 그 설정, 층(지침, MCP, skills_off, model).

          - id: agent-sessions
            kind: component
            description: agent session과 그 연산.

          - id: run-loop
            kind: component
            description: agent run의 실행.

          - id: agent-tools
            kind: component
            description: agent tool(`agent.memory` 포함)과 그 허락 판정.

          - id: models
            kind: component
            description: model catalog, 사람이 적은 custom model 정보, provider 연결, provider가 알려 주는 model 목록.

          - id: host-queue-core
            kind: component
            description: core가 shell에 시킬 일의 메모리 queue와 agent가 연 탭의 표. shell main이 `/host-link`로 받는다. 요청은 창이 있어야 하는 것(탭 열기·닫기·보이기, browser 호출)뿐이고 터미널과 coding session은 core가 갖는다. phone 탭(사람의 폰에 뜬 preview 화면)은 shell에 가지 않고 core가 폰 link의 `drive.*`로 다룬다(ref 번호, snapshot 글, 오류 문장, redaction은 core).

          - id: harness-host-core
            kind: component
            description: runtime이 harness(claude-code, codex, opencode)인 agent의 session을 core가 받는 쪽. queue, turn·메시지 기록, harness의 session id. 실행은 core 안 extension host가 한다.

      - id: events
        kind: component
        description: commit 뒤 agent event와 남지 않는 event(`StateChanged`의 `carry_files` 같은 바뀜 신호 포함)를 화면과 연결된 컴퓨터에 내는 Bus와 Gateway.

      - id: router
        kind: component
        description: 사람 메시지, agent call, program의 반응(reaction)을 받는 session에 넣는 단 하나의 입구.

      - id: storage
        kind: component
        description: lophn 기록의 로컬 저장.

      - id: server
        kind: component
        description: core daemon의 입구.

      - id: remote
        kind: component
        description: 내 기기 명단(서명 key, 서명한 항목과 빼기, 초대장 내기, 받아들여 합치고 붙은 연결에 퍼뜨리기)과 명단의 기기(폰, 다른 컴퓨터)가 붙는 암호화된 바깥 listener, 이 컴퓨터에 붙은 폰의 기기 행(화면, 기준, push), 복사된 data root나 명단에서 빠진 이 컴퓨터의 명단과 key 버리기, 기기 자격과 route 목록, 명단의 다른 컴퓨터마다 거는 link와 그 위로 다른 기계를 부르는 `machines/*`, 같은 link로 다른 컴퓨터가 든 file을 받는 나르기(`carry/*`를 부른다), core가 폰에 일을 묻고 답을 받는 `PhoneLink`(기기의 연결 찾기, deadline, 답 거르기).

      - id: attention
        kind: component
        description: host(desktop, 폰)가 보고한 presence로 못 본 turn 끝(`unseen`)을 들고, 사람을 기다리는 일이 새로 생기거나 오래 돈 turn이 끝나면 보고 있지 않은 기기에 push가 필요한지 정하고 글(제목과 상태 문장)을 만들어 Expo Push로 보낸다(죽은 token 거두기 포함). 기기 목록은 port이고 remote가 꽂는다.

      - id: supervision
        kind: component
        description: core가 띄우는 child process의 감독.

      - id: approvals
        kind: component
        description: tool 호출의 판정과 사람에게 묻는 길. 할당(agent 정의 파일의 앱과 뺀 tool), shell 규칙, turn mode로 판정하고, 물을 것은 기다리는 turn의 request 하나로 묻는다. 팀 자식(`spawned_by`)의 물음은 사람이 아니라 부모에게 간다. 앱이 청한 공유 요청(share_requests)도 사람이 한 번 승인한다.

      - id: config
        kind: component
        description: 층이 있는 설정 장치.

      - id: secrets
        kind: component
        description: secret 보관(`<data root>/secrets.json`)과 이름 공간별 전송 부착, site login metadata(`<data root>/logins.json`)와 shell main에만 값을 내주는 route.

      - id: machine
        kind: component
        description: 설치마다의 기계 신분(`<data root>/machine.json`의 id, 사람이 지은 이름, OS 기계 값과 묶은 binding)과 기동 때의 복제 판정(복사된 data root는 새 id), 컴퓨터 자기 이름(기본 hostname)과 route `machine/status`·`machine/rename`. 기계에 묶인 상태(remote key, sync node)는 각 module이 이 id를 표지로 찍어 스스로 맞춘다.

      - id: always-on
        kind: component
        description: 사람이 표시한 기계에서 lophn이 로그인 때 뜨고 창 없이 계속 돌게 하는 표시와, 그 표시에 맞춘 OS의 per-user 로그인 시작 등록과 keep-awake.

      - id: folder
        kind: component
        description: 폴더(destination, 기계마다의 설정 `folder.destinations`)로 sync 앱(선언 `sync_to`)의 data stream(changes·snapshot file), release, source(증분 git bundle), 앱·기계 기록을 내보내고 읽어 들이기. 이름 붙인 폴더는 바깥 도구가 옮기고, 미리 있는 갈 곳 `computers`("내 컴퓨터들", data root 안)의 file은 lophn이 고른 길(컴퓨터 사이 연결, 폰, 사람이 정한 같이 보는 폴더 `folder.shared`의 거울)로 옮긴다. 기계마다 자기 하위 폴더에만 쓰고(`computers`에서 다른 기계의 하위 폴더는 받는 자리가 그 기계가 서명한 목록에 맞는 file만 쓴다), 낸 기계가 서명하는 file 목록(manifest)과 앱 목록, 명단 file, 기계를 건너는 event file을 쓰고 받는다. 읽은 file은 전부 검사한 뒤 한 transaction으로 적용하거나 다른 release면 held로 복사했다가 이 기계가 그 release가 되면 출처마다 번호 순서로 적용한다(held 한도 포함). 흔적 정리의 settled·horizon, 다른 기계의 앱을 들이는 take-in, 기계 사이 폴더 꼴 판 범위, 읽기 명령 `machine.environment`와 뒤 계획이 칸을 꽂는 section 자리, Settings › Sync가 읽는 지금 길 `carry/status`를 포함한다.

      - id: extension-host
        kind: component
        description: core 안에서 extension 폴더의 manifest를 읽고, 설정 `extensions.<id>.enabled`가 켜진 것만 load해 activate하는 registry와 extension이 쓰는 CLI spawner(사람의 login env), ACP handle, tool 호출. 설치 표시 file로 extension이 쓴 file만 지운다.

      - id: diagnostics
        kind: component
        description: lophn 자체의 운영 log, crash 기록, 상태 점검. core process의 구조화 log·trace·metric(telemetry), `/healthz`·`/readyz`, 자원 snapshot도 여기다.

  - id: shell
    kind: application
    description: 사람이 쓰는 desktop app. display가 없는 Linux에서는 같은 binary가 core가 띄운 창 없는 page host(`--page-host`)로 서서 agent의 browser page를 든다.
    depends_on:
      - protocol
      - base
      - design

  - id: shell-extension
    kind: extension
    description: 본체와 따로 설치하는 기능 묶음 하나(폴더, manifest, 따로 빌드한 진입점). ctx로만 lophn에 닿는다.
    depends_on:
      - protocol
      - base

  - id: coding-agent
    kind: subsystem
    description: 사람이 쓰던 coding agent를 lophn에 잇는 쪽.
    depends_on:
      - protocol
      - base
    children:

      - id: coding-agent-cli
        kind: application
        description: lophn이 내놓는 명령 표(`packages/cli`)와 그 binary. lophn agent는 native tool `lophn`으로, coding agent와 사람은 binary로 같은 명령을 부른다. 사람이 부르면 binary는 공용 ensure로 core에 붙거나 띄우고 control `connect`(client cli)의 user token을 쓴다. `core stop`은 binary만 아는 명령이다. harness hook·감지·공유 skill 사본 명령(local)은 coding-agent가 갖고 binary가 끼운다.

  - id: design
    kind: library
    description: lophn 화면과 사용자 앱이 같이 쓰는 UI kit.

  - id: sdk
    kind: library
    description: 사용자 앱이 import하는 입구. 폰 화면의 hook part(`@lophn/app-ui-native`), 폰의 위치를 읽는 part(`@lophn/cap-phone`), 폰에서도 도는 앱이 쓰는 폰 entry(`lophn-phone` 조건)를 포함한다.
    depends_on:
      - protocol
      - design
      - design-native

  - id: relay
    kind: application
    description: 폰과 core가 다른 network에 있어도 만나게 하는 lophn relay. core의 control socket이 key를 증명하면 폰 연결마다 data socket을 이어 binary message를 그대로 넘긴다. 내용은 보지 못한다.
    depends_on:
      - protocol

  - id: remote-client
    kind: component
    description: remote 연결의 client 쪽(주소 경주, 재연결, WebSocket dial, 자격 전 기계 id 확인, 연결의 첫 frame `join`과 명단 주고받기, 한 연결의 call 수 한도, 명단으로 짓는 컴퓨터 목록, 초대장 읽기와 초대장으로 들기, `roster/leave`). 폰 앱과 core(명단의 다른 컴퓨터로 거는 link)가 같이 쓴다.
    depends_on:
      - protocol
      - base

  - id: design-native
    kind: library
    description: 폰 앱의 React Native UI kit(`@lophn/ui-native`). desktop kit과 같은 token과 문구 catalog를 쓴다. SDK part이기도 해서 사용자 앱의 폰 화면이 import하고 폰 앱의 base bundle이 같은 kit을 든다.
    depends_on:
      - design

  - id: mobile
    kind: application
    description: 사람이 폰에 까는 lophn 앱. pairing, 기기 key 보관, core 연결, 폰 kit으로 짠 native 화면(sidebar 뼈대, Home, Inbox, 대화, Jobs, Agents, workspace, Settings)과 그 data 층, 알림(허락 묻기, Settings › Notifications, push token과 설정 보내기, 앞에 있는지 알리기, 알림을 누르면 여는 곳), 사용자 앱의 폰 화면을 받아 격리된 guest runtime에서 돌리는 길(호환 검사, bundle cache, host bridge, 앱 화면), 폰에서 도는 앱의 설치·sync·release 바뀜을 하는 폰 host와 guest 안의 backend와 앱 DB native module, 컴퓨터 사이 file 나르기(한 컴퓨터에서 받아 둔 file을 읽지 않고 다른 컴퓨터에 넘기고, 상한과 모바일 데이터의 크기 선택을 지킨다), 홈 화면의 위젯(binding과 cache file, 새로 하기, "Choose a widget", Android native module)과 앱 아이콘(pinned shortcut), 밖에서 온 누름과 URL을 한 곳으로 해석하는 open target, 컴퓨터에서 도는 preview를 여는 preview 화면, 컴퓨터의 `request`에 답하는 폰의 handler(위치, 그리고 이 폰이 연 preview view의 guest만 읽고 누르고 치는 native module `lophn-drive`와 take control을 쓰는 `drive.*`). lophn 자신의 화면은 컴퓨터가 내려주지 않는다.
    depends_on:
      - protocol
      - design-native
      - remote-client

  - id: app
    kind: extension
    description: 사용자가 만든 앱 하나.
    depends_on:
      - sdk

  - id: user-package
    kind: extension
    description: 앱 workspace의 session이 올린 사용자 package.
    depends_on:
      - sdk

  - id: person
    kind: actor
    description: lophn을 쓰는 사람.

  - id: external-coding-agent
    kind: actor
    description: 사람이 쓰던 coding agent.

interfaces:

  - id: core-api
    kind: interface
    description: "core daemon의 로컬 API. 다른 컴퓨터의 앱을 쓰는 길도 이 API다. 앱 호출 `apps/call_tool`의 target `remote {machine, app}`(agent와 앱이 부른다. 앱의 broker 본문 `machine?`), 받는 컴퓨터의 앱 command 입구 `apps/remote_call`(기기 route 목록, 허락받은 컴퓨터만), agent runtime이 할당된 다른 컴퓨터 앱의 command 목록을 읽는 `machines/app_tools`(core 안 machine 자격), 사람이 다른 컴퓨터의 route를 부르는 `machines/call`(요청한 쪽은 core가 자격으로 정한다: 살아 있는 shell capability는 `screen`, capability 없는 CLI token은 `terminal`, 입력의 어떤 칸도 정하지 못한다. 컴퓨터는 이름, `mch_`, `dev_`로 고른다). 호출 기록의 caller `remote {machine, device, requester}`."
    interface_type: api
    defined_by: protocol
    provided_by:
      - server
    used_by:
      - shell
      - coding-agent
      - run-loop
      - agent-tools
      - app-runtime

  - id: event-stream
    kind: interface
    description: core가 확정한 event의 stream. 다른 컴퓨터에 내주는 `AppEventPublished`(앱이 선언해 밖에 낸 event, private이 아닌 workspace의 것, 이 컴퓨터가 낸 것만. 명단의 컴퓨터가 core 구독자로 받고 폰과 화면에는 가지 않는다. `REMOTE_COMPUTER_EVENTS`)를 포함한다.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - events
      - server
    used_by:
      - shell

  - id: remote-protocol
    kind: interface
    description: "기기(폰, 다른 컴퓨터의 core)와 core 사이의 연결과 내 기기 명단. Noise IK handshake, 암호화한 record, JSON frame(판 범위와 기계 id·이름을 싣는 hello, 명단에 들거나 붙는 첫 frame `join`, 명단을 주고받는 `roster`, call, result, watch와 Gateway frame), 명단의 모양과 검증(서명한 항목과 빼기, 초대장, 합치기와 view), 사람이 명단을 보고 고치는 `roster/*`와 이 컴퓨터의 link로 다른 기계를 부르는 `machines/*`, 기기가 부를 수 있는 route 목록(자기를 명단에서 빼는 `roster/leave`, 자기 push 설정 `devices/set_push`, 앞에 있는지 알리는 `presence/report`, project의 `project_files/list|read`, 컴퓨터의 coding agent `coding_sessions/list|switch_plan|switch|open|cli_sessions|rewind_preview`, core가 여는 터미널 `terminals/list|open|input`(입력과 명령을 실은 열기는 사람이 켠 기기만. 닫기와 다시 띄우기 `terminals/close|restart`는 `REMOTE_PERSON_ROUTES`)과 터미널 화면 `terminal_view/snapshot|watch|resize`와 그 event `TerminalScreenChanged`·`TerminalRuntimeChanged`·`TerminalAgentSignaled`, 컴퓨터의 browser page `page_view/list|snapshot|watch|input|control|open`(input·control·open은 터미널 입력을 켠 기기만)과 그 event `PageViewChanged`, 사용자 앱의 화면 `apps/phone_screens`·`apps/screen_file`·`app_views/*`(폰과 다른 컴퓨터의 desktop이 같은 길로 받는다)와 그 화면의 agent 길 `app_grants/list`·`app_sessions/*`·`app_calls/*`·`app_agents/list`(기기는 자기가 연 view의 앱으로만)와 그 event `AppViewEvent`·`AppRemoved`, 위젯 값 `app_widgets/list`, 폰에서 도는 앱의 backend file `apps/phone_file`과 sync route `app_sync/*`와 그 event `AppSyncChanged`, 컴퓨터 사이로 file을 나르는 `carry/manifests|wants|file|put` 포함. `carry/status`는 사람의 화면만 부른다)와 서명한 manifest·목록 사슬·명단 file·event file의 계약, 사람이 터미널 입력을 허락한 기기에만 더 여는 목록 `REMOTE_PERSON_ROUTES`(secret, provider·model, 설정 쓰기, agent·project 만들고 고치기. 허락이 있어도 기기·명단 관리, `remote.*` 설정, site login vault 이름은 열지 않는다), remote protocol 판 5(하한 5. call frame의 요청한 쪽 `by`: `screen`·`terminal`·`agent`·`app`, 폰은 싣지 않고 컴퓨터의 core 자신의 일은 `by` 없이 `carry/*`만. 요청한 쪽마다 거르는 목록 `REMOTE_AGENT_ROUTES`·`REMOTE_CORE_ROUTES`·`REMOTE_TERMINAL_DENIED`, 컴퓨터에만 내주는 event `REMOTE_COMPUTER_EVENTS`, 다른 컴퓨터의 앱 command 입구 `apps/remote_call`. 터미널 입력 허락은 명단이 아니라 받는 컴퓨터의 표다), core가 폰에 묻는 frame `request`·`response`와 폰이 답하는 kind를 적는 `hello.capabilities`(kind 표 `PHONE_KINDS`(`location.get`, `drive.snapshot|act|screenshot|wait`)와 `unavailable`의 이유는 protocol의 `phone`이 정한다), call에 base64로 싣는 file·upload bytes. 폰은 연결에 좁은 입구 `@lophn/protocol/remote/client`를 쓰고 route 정의와 schema는 protocol source를 그대로 읽는다."
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - remote
      - relay
    used_by:
      - person
      - shell
      - mobile

  - id: acp
    kind: interface
    description: lophn의 App Context Protocol. agent 쪽이 내는 대화 상태·갱신(항목, tool 종류, 묻기·승인, 흘러나오는 글)과 화면이 보내는 대화 조작 입력의 규격이고 순수 reducer와 event projection을 함께 둔다. 표준 Agent Client Protocol이 아니다.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - agent-sessions
      - events
    used_by:
      - shell

  - id: child-supervision-protocol
    kind: interface
    description: core daemon과 그 child process(writer·reader Worker, platform/io, 앱 supervisor child, agent runtime, flow host, job child) 사이의 감독 계약. control frame은 json 하나가 256KiB 안이고, 넘는 본문은 같은 request의 channel에 bytes frame과 end·abort로 보낸다(blob 준비, 앱 rewind 적용). child의 crash는 진단 한 줄로 core에 오고 core가 component·location을 정해 log에 쓴다. shell main과 CLI는 core의 부모가 아니고 `core-control-protocol`로 붙는다.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - supervision
    used_by:
      - run-loop
      - app-runtime
      - app-releases
      - diagnostics

  - id: core-control-protocol
    kind: interface
    description: data root마다 하나인 core control socket(공통 socket 자리의 `core`, POSIX 0700 폴더의 unix socket, win32 named pipe)의 계약. 한 연결에 JSON 한 줄 요청 하나와 Result 답 하나다. `identify`(판, `core_epoch`, `api_url`, starting·ready·stopping, credential 없음), `connect`(client cli 또는 shell. user token, shell이면 shell capability도), `stop`, `diagnostic`, shell capability로만 받는 사람 결정 handle 등록·창 닫기. shell과 CLI는 같은 `ensureCore`로 붙거나 detached core를 띄우고, 띄운 core는 stdout 첫 줄로 `ready`나 `start_failed`만 알린다. 경계는 socket 자리이고 OS peer 신원은 보지 않는다.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - server
    used_by:
      - shell
      - coding-agent-cli

  - id: agent-tool-spi
    kind: interface
    description: feature module이 agent tool을 등록하는 계약.
    interface_type: spi
    defined_by: agent-tools
    provided_by:
      - apps
      - agent-workspaces
      - workflows
      - jobs
    used_by:
      - run-loop

  - id: app-spi
    kind: interface
    description: 앱이 구현하는 확장 계약.
    interface_type: spi
    defined_by: protocol
    provided_by:
      - app
    used_by:
      - app-releases
      - app-runtime

  - id: app-capability
    kind: interface
    description: 앱이 lophn에게 받아 쓰는 능력(파일, network, secret 등)을 청하는 계약.
    interface_type: api
    defined_by: protocol
    provided_by:
      - app-runtime
    used_by:
      - sdk

  - id: package-spi
    kind: interface
    description: package 한 버전의 계약.
    interface_type: spi
    defined_by: package-registry
    provided_by:
      - sdk
      - user-package
    used_by:
      - package-registry
      - app-releases

  - id: sdk-api
    kind: interface
    description: "사용자 앱과 package가 import하는 API. 다른 컴퓨터를 쓰는 칸 둘을 포함한다: `@lophn/cap-tool`의 `connectCommands(app, commands, {on})`(`on`은 컴퓨터 이름. 그 컴퓨터의 앱 command를 부른다)와 `@lophn/declaration`의 구독 선언 `subscriptions[].machine`(그 컴퓨터의 앱 event를 받는다. 앱의 caller `remote`와 event caller의 `machine`을 받는다)."
    interface_type: api
    defined_by: sdk
    provided_by:
      - sdk
    used_by:
      - app
      - user-package

  - id: design-api
    kind: interface
    description: UI kit의 공개 API. desktop kit(`@lophn/ui`)과 폰 kit(`@lophn/ui-native`).
    interface_type: api
    defined_by: design
    provided_by:
      - design
      - design-native
    used_by:
      - shell
      - sdk
      - mobile

  - id: coding-agent-harness-api
    kind: interface
    description: coding agent를 찾고 띄우는 API.
    interface_type: api
    defined_by: coding-agent
    provided_by:
      - coding-agent
    used_by:
      - coding-agent-cli

  - id: harness-host-interface
    kind: interface
    description: core 안 extension host의 harness host(bundled extension `harness`)가 `ctx.core`의 자격(`machine:extensions`, actor user)으로 부르는 core의 memory route(`harness/take`, `start_turn`, `record`, `finish_turn`, `set_external_id`). TUI 탭이 hold한 session은 take가 건너뛰고 start_turn이 `conflict`다. renderer의 호출 통로에는 없다.
    interface_type: protocol
    defined_by: lophn-agent
    provided_by:
      - harness-host-core
    used_by:
      - core

  - id: host-queue-interface
    kind: interface
    description: host(desktop 앱의 shell main, display 없는 Linux에서 core가 `--page-host`로 띄운 page host)가 사람 token으로 여는 양방향 연결 `/host-link`(WebSocket, subprotocol `lophn.host-link.1`)의 frame(host가 올리는 `hello`·`visible`(보이는 workspace), `response`, `report`, `page_frame`(보는 쪽이 있는 page의 JPEG frame)·`page_state`(painting, agent, held)와 core가 미는 `request`(`tab_open`·`tab_close`·`tab_show`, `browser_call`, 연결이 있을 때만 가는 연결 요청 `page_stream`·`page_read`·`page_input`·`page_control`). page를 드는 쪽이 있어야 하는 일만 다루고 터미널과 coding session은 core가 갖는다)와 agent 자격 또는 사람 token의 `tabs/open`(phone 탭을 여는 target `phone` 포함), `tabs/close`, `tabs/show`, `browser/read|snapshot|act|navigate|screenshot|evaluate|logs|wait`, 사람 자격만의 `page_view/list|snapshot|watch|input|control|open`(멀리서 page 보기, event `PageViewChanged`·`StateChanged{browser_pages}`. 기기 route 목록에 있고 다른 기계의 창은 이 컴퓨터 core의 `machines/call`로 부른다. input·control·open은 그 기기의 터미널 입력 허락이 있어야 한다). 이 컴퓨터 renderer의 호출 통로에는 없다.
    interface_type: protocol
    defined_by: lophn-agent
    provided_by:
      - host-queue-core
    used_by:
      - shell
      - coding-agent

  - id: coding-agent-cli-interface
    kind: interface
    description: lophn 명령의 계약(`lophn <group> <verb>`, 앱 command는 `lophn <app> <command>`). 어느 core 명령에나 `--on <컴퓨터>`(이름, `mch_`, `dev_`)가 붙어 그 컴퓨터로 간다(요청한 쪽은 `terminal`이고 받는 컴퓨터가 허락한 만큼만 된다. 앱 command는 최상위 입력 `on`을 선언하지 못한다). lophn agent는 `lophn` tool로, 사람과 coding agent는 control connect로 받은 user token으로 binary를 쓰고(core가 없으면 binary가 띄운다), harness agent는 turn 자격(`LOPHN_AGENT_CREDENTIAL`)만 쓰며, harness hook은 hook 명령만 부른다.
    interface_type: protocol
    defined_by: coding-agent
    provided_by:
      - coding-agent-cli
    used_by:
      - external-coding-agent
      - person

  - id: extension-api
    kind: interface
    description: extension 하나의 계약. manifest(id, 이름, 설명, 판, 진입점, 들어 있는 것, contributes)와 activate(ctx)·deactivate, ctx(core, settings, spawn, acp, clock, ids, files, dataFolder, commands, tools). 판은 제품 판과 같아야 켠다.
    interface_type: spi
    defined_by: protocol
    provided_by:
      - extension-host
    used_by:
      - shell-extension
