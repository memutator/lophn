  - id: turn-finish
    title: loop가 정한 completed 또는 failed 결과로 turn을 끝낸다
    actor: system
    entries: [route:turns/finish]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/run-loop/commands.ts, packages/core/lophn-agent/run-loop/turn.ts, packages/core/lophn-agent/run-loop/limits.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). loop가 답으로 끝나면 completed, 한도나 model 실패로 끝나면 failed(reason)로 finish를 보낸다"
      - "turn이 없으면 not_found, 이미 finished면 conflict다(늦은 결과는 결과를 덮지 못한다). state_seq가 다르면 conflict다"
      - "outcome이 interrupted면 invalid_input이다. 멈춤은 StopTurn이나 InterruptTurns로만 닫는다"
      - "turn 행을 finished로 바꾸고 TurnEnded를 commit 뒤 낸다(failed면 reason을 싣는다). 결과 blob을 영구 참조로 등록하고, 거절되면 tx 전체를 rollback한다"
    outcomes:
      - id: completed
        observe: [ledger:turns, event:TurnEnded]
        when: outcome completed(answer_completed)로 끝났다
      - id: failed
        observe: [ledger:turns, event:TurnEnded]
        when: outcome failed(reason)로 끝났다. reason은 turn-loop의 갈래와 같다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: already-final
        code: conflict
        observe: [response]
        when: turn이 이미 finished다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: interrupt-rejected
        code: invalid_input
        observe: [response]
        when: outcome이 interrupted다
      - id: not-found
        code: not_found
        observe: [response]
        when: turn이 없다
      - id: blob-invalid
        code: invalid_input
        observe: [response]
        when: 결과 준비 참조가 살아 있지 않거나(TTL이 지남) schema와 다르다
      - id: blob-forbidden
        code: forbidden
        observe: [response]
        when: 결과 준비 참조의 주체가 이 자격과 다르다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/run.md, architecture/agent-chat.md]
    unclear:
      - "core-ports.ts의 finish는 conflict 문구에 steering이 있으면 pending_input으로 돌려주는 갈래를 두지만, commands.ts의 finish는 그 문구를 내지 않는다. 닿지 않는 갈래로 보인다. 확인 후 지울지 정한다"

  - id: turn-stop
    title: 사람이 도는 turn을 멈추고 사람이 본 글을 남긴다
    actor: person
    entries: [route:turns/stop]
    boundary: [run-loop, acp, core-api]
    code: [packages/core/lophn-agent/run-loop/live-turns.ts, packages/core/lophn-agent/run-loop/commands.ts, packages/core/main/daemon/wiring/lophn-agent-runtime.ts, packages/core/main/daemon/wiring/acp-send.ts]
    steps:
      - "화면의 멈춤 단추가 AcpSend의 stop으로 가고, 그 입구가 turn의 state_seq를 읽은 뒤 사람 자격으로 StopTurn(reason user_stopped)을 부른다. run과 workflow의 멈춤도 machine 자격으로 같은 길을 쓴다"
      - "사람이나 machine 자격이 아니면 forbidden이다. turn이 없으면 not_found다. 이미 끝난 turn이면 기존 결과를 replayed로 돌려주고 turn을 바꾸지 않는다"
      - "state_seq가 다르면 conflict다. 그 밖이면 writer 앞 처리기 withLiveTurns가 StopTurn 전에 사람이 본 글(writing)을 RecordMessage로 저장하고 MessageRecorded를 낸다. 저장이 실패해도 멈춤은 간다"
      - "active 시간을 CheckpointTurn으로 마감한 뒤 StopTurn이 turn을 interrupted(user_stopped)로 닫고 TurnEnded를 낸다"
      - "commit 뒤 TurnEnded를 받은 lophn-agent-runtime이 child에 turn_stop을 보내 진행 중인 model 요청과 tool을 끊는다"
    outcomes:
      - id: stopped
        observe: [ledger:turns, ledger:messages, event:MessageRecorded, event:TurnEnded, process:agent-runtime]
        when: "도는 turn을 user_stopped로 닫았다. 쓰는 중 글이 없으면 MessageRecorded는 나지 않는다. 글 저장이나 active 마감이 실패해도 멈춤은 간다(글만 빠진다)"
      - id: replayed
        observe: [response]
        when: turn이 이미 끝나 있어 기존 결과를 돌려줬다
      - id: state-changed
        code: conflict
        observe: [response]
        when: "state_seq가 달라졌다. 이때 writer 앞 처리기가 이미 쓰는 글을 저장했을 수 있다"
      - id: not-allowed
        code: forbidden
        observe: [response]
        when: 사람이나 machine이 아닌 자격이다(dispatch의 actors가 먼저 막아 닿지 않을 수 있다)
      - id: not-found
        code: not_found
        observe: [response]
        when: turn이 없다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear:
      - "사람 멈춤 때 저장되는 글은 StopTurn route가 아니라 writer 앞 처리기(live-turns.ts withLiveTurns)가 만든다. route 테스트만으로는 저장된 message가 보이지 않는다"

  - id: turn-interrupt
    title: child가 사라지면 그 child의 도는 turn을 interrupted(restarted)로 닫는다
    actor: system
    entries: [route:turns/interrupt]
    boundary: [run-loop, child-supervision-protocol]
    code: [packages/core/lophn-agent/run-loop/interrupt.ts, packages/core/lophn-agent/run-loop/live-turns.ts, packages/core/main/daemon/wiring/lophn-agent-runtime.ts, packages/core/lophn-agent/run-loop/runtime.ts]
    steps:
      - "agent runtime child가 종료되면(onEnd) core가 machine 자격으로 InterruptTurns를 부른다. machine이 아니면 forbidden이다(requireMachine)"
      - "writer 앞 처리기가 core 메모리에서 센 active를 turn마다 CheckpointTurn으로 마감한다. 실패해도 다음 단계로 간다"
      - "같은 tx에서 running인 turn 전부를 interrupted(restarted)로 닫고 TurnEnded를 낸다. 도는 turn이 없으면 0으로 끝난다"
      - "InterruptTurns가 실패했어도 queue의 도는 표시는 푼다(finally). 새 입력이 running 행과 겹치지 않게 하려는 순서다"
    outcomes:
      - id: interrupted
        observe: [ledger:turns, event:TurnEnded]
        when: child가 돌리던 turn이 하나 이상 있었다
      - id: nothing-running
        observe: [response]
        when: child가 사라졌지만 도는 turn이 없었다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: command-failed
        code: internal
        observe: [ledger:turns]
        when: "InterruptTurns 호출이 실패했다. running 행은 남고 queue의 도는 표시만 풀린다(onEnd가 실패를 삼킨다)"
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/workspace-session.md]
    unclear:
      - "끝나지 않은 model call과 tool call 행(started, requested)을 닫는 곳이 없다. lophn-agent.harness-tools.close-stuck schema step은 migration 때 한 번만 돈다. 죽은 child의 호출 행이 started로 남는지 확인이 필요하다"

  - id: turn-restart
    title: lophn이 켜질 때 돌던 turn을 interrupted로 닫고 아직 가져가지 않은 입력을 다시 줄 세운다
    actor: system
    entries: [system:turn-restart]
    uses: [route:calls/recover]
    boundary: [run-loop, router]
    code: [packages/core/main/daemon/wiring/router.ts, packages/core/router/commands.ts, packages/core/lophn-agent/run-loop/interrupt.ts, packages/core/lophn-agent/session/message-commands.ts, packages/core/lophn-agent/run-loop/startup.ts]
    steps:
      - "lophn이 켜질 때 router wiring의 start가 RecoverCalls(machine)를 한 번 부른다. 잃은 call을 닫고 state가 running인 turn 전부를 interrupted(restarted)로 닫는다. 이 호출이 실패하면 log:router에 남기고 turn 닫기는 건너뛰며 입력 되돌리기는 계속한다"
      - "agent runtime이 turn을 읽기 전에(afterReady 앞) 끝난다. 켜진 뒤 turn은 이어 받지 않고 child는 빈 상태로 뜬다"
      - "사람 메시지 중 from_kind = 'human', turn is null, sessions.lifecycle = 'open', unattended = 0, shell = 0인 것을 접수 순서로 고른다. 포크 session은 자기 turn이 가져간 마지막 메시지(created_seq) 뒤만 세고, rewind가 숨긴 구간(hiddenRanges)은 뺀다"
      - "입력의 session이 accepting이고 transport가 lophn이어야 한다(harness는 harness wiring이 되돌린다). 본문을 읽어 queue에 넣고 MessageReceived를 낸다. 본문을 못 읽으면 그 입력만 건너뛰고 log:router에 남긴다"
    outcomes:
      - id: turns-interrupted
        observe: [ledger:turns, event:TurnEnded]
        when: 켤 때 running인 turn이 있었다
      - id: recover-failed
        observe: [log:router]
        when: "RecoverCalls가 실패해 running turn을 닫지 못했다. 같은 tx라 turn 행은 그대로 running이고 입력 되돌리기는 계속한다"
      - id: input-requeued
        observe: [event:MessageReceived]
        when: turn이 가져가지 않은 사람 메시지를 queue에 다시 넣었다
      - id: not-requeued
        observe: []
        when: "보관된 workspace의 session이라 accepting이 false이거나 transport가 harness다. 줄 세우지 않는다"
      - id: body-unreadable
        observe: [log:router]
        when: 메시지 본문을 읽지 못해 그 입력만 건너뛰었다(requeue_message_failed)
    crosses_process: false
    risk: []
    refs: [W5]
    docs: [architecture/workspace-session.md, architecture/run.md]
    unclear:
      - "TurnEnded를 낸 interrupted turn은 다시 돌지 않는다. 사용자가 말한 turn fate의 '복구'는 코드에 없고 interrupted로 닫히는 것뿐이다"
      - "checkRestart의 owners에는 apps만 있고(apps.ts restartOwners) turn 관측은 없다. 끝나지 않은 model·tool 호출 행도 이 flow가 닫지 않는다"

