id: agent-browser-window-lifetime
version: 0.23.20
title: agent가 연 browser page는 창이 사는 동안 산다. 창이 없으면 창을 열고 앱이 없으면 앱을 띄운다
modules: [packages/protocol, packages/cli, packages/core/host-queue, packages/core/main, packages/core/lophn-agent, packages/shell/main, packages/shell/renderer, packages/shell/ipc]
change: |
  전: `lophn tab open --url`로 연 browser 탭의 page는 사람이 그 workspace를 화면에 띄운 동안만 있었다. 그 workspace를 띄운 창이 없으면 열기가 queue에서 기다렸고(`accepted`를 바로 답함), 사람이 다른 workspace로 가면 page가 사라졌다. shell이 없으면 `browser.*`가 바로 `unavailable`이었다.
  후:
  - page 수명. agent가 연 탭(key `host:<tab>`)의 page는 그 탭을 든 창이 사는 동안, 창이 어느 workspace를 보이든 산다. workspace를 떠날 때 놓지 않고 숨겨 두며 숨은 동안에도 그린다(그릇 오른쪽 아래 1px). 6개 상한(Keep alive)에 세지 않고 창마다 12개 상한을 따로 둔다. guest가 붙은 page만 세고, 가장 오래 쓰지 않은 것(agent의 browser 호출과 bind가 쓴 때)부터 놓는다.
  - 열기. browser 탭의 `tab_open`·`tab_close`는 take하는 아무 shell main이 가져간다. shell main은 그 workspace를 보이는 창, 없으면 가장 최근 일반 창에 보내고, 창은 그 workspace를 mount하지 않았으면 page를 pool에 숨은 항목으로 만들고 자리는 다음 mount로 미룬다(다시 load하지 않는다). `tabs/open --url`은 page가 붙은 뒤(dom-ready)에 답한다. 기한은 10초, 앱을 띄웠으면 30초 하나다. 실패는 `unavailable`과 고정 문장이고 탭이 남지 않는다.
  - 창 열기. 일반 창이 하나도 없으면 shell main이 데스크톱 창을 focus 없이 연다(`showInactive`, 저장한 크기, 최대화하지 않고 저장된 최대화 상태를 덮지 않는다. 최소화하거나 숨기지 않는다).
  - 앱 띄우기. shell이 없으면 core가 앱을 detached로 띄운다. 새 launch intent `--agent-window`는 앱의 첫 창을 focus 없이 열고, 이미 떠 있는 앱은 창이 없을 때만 같은 창을 연다. browser 탭 열기에만, 그 core를 띄운 쪽(shell main, CLI)이 환경 `LOPHN_LAUNCH_SHELL=1`을 준 core만(test·boot·E2E가 띄운 core는 아님), 한 번에 하나, 실패(spawn 오류, 30초 안에 shell이 붙지 않음) 뒤 5분은 다시 띄우지 않는다. 앱을 Quit한 뒤에도 띄운다.
  - 사라진 page. 탭 닫기 말고 상한, 창 닫힘으로 page가 없어지면 그 탭은 core 표에서 빠진다(`host/report closed`). 앱이 끝나 알릴 길이 없으면 shell 없이 온 browser 탭 호출이 그 탭을 빼고 답한다. 없는 탭, 닫힌 탭, 남의 탭에 오는 `browser.*`는 같은 고정 `not_found` 한 문장이고 model에 그대로 간다(`unavailable`·`conflict`는 전부터). 마지막 url을 다시 load하지 않는다.
  - layout. 상한으로 놓은 탭은 그 workspace가 mount될 때 layout에서 뺀다. mount할 때 지금 desk의 접힌 float 가운데 page가 없는 agent browser 탭은 사람의 탭이 아니므로 뺀다.
  - state(url, title, loading)와 bind 보고는 창 단위라 workspace가 mount되지 않아도 간다.
  protocol: `LAUNCH_SHELL_ENV`, `AGENT_WINDOW_INTENT`와 `shell:surface-request`의 release 요청 id(다른 창이 page를 이어받았다는 알림)가 늘었다. CLI `tab open`·`browser read`의 설명을 고쳤다.
why: |
  agent가 사람이 지켜볼 때만 일하지 않는다. job과 workflow는 사람이 다른 workspace에 있거나 창을 모두 닫았거나 앱을 Quit한 사이에도 돌고, 그때 browser가 안 되면 agent는 사람의 Chrome 쿠키를 복사해 바깥 browser를 띄운 일이 있었다(grant·rewind·관측이 닿지 않는다). page 수명이 사람의 화면(workspace의 mount)에 묶여 있던 것이 뿌리였다. `project-docs/products/roadmap/agent-browser-lifetime.md`의 단계 2·3이다.
decisions:
  - text: "`<webview>`를 유지하고(roadmap A2) 창이 하나도 없을 때는 lophn이 실제 창을 연다. 버린 길(A1): main이 소유한 native view를 숨은 창에 두기. shell DOM 위에 그려져 menu·패널이 page 밑에 깔리고 browser 탭의 그릇이 둘이 된다. 써 보고 창이 뜨는 것이 거슬리면 그때 A1로 간다(그릇만 바뀌고 core가 shell을 띄우는 길은 그대로다)."
    by: person
  - text: "job을 등록할 때의 승인이 그 job의 browser 사용을 포함한다. 무인 실행에 따로 묻거나 설정이나 표시를 두지 않는다(`PRODUCT.md`의 결정 피로를 줄인다). 창이 화면에 뜨는 것이 표시다. 앱을 Quit한 뒤에도 core가 앱을 띄운다. 이 방향(core가 shell을 띄움)은 새로 생겼다."
    by: person
  - text: "artifact 탭은 이번에 뺀다. 이슈 `agent-artifact-tab-needs-mounted-workspace`에 남는다."
    by: person
  - text: "idle 타이머와 \"다음 호출에서 마지막 url을 다시 load\"는 두지 않는다. page가 없어지면 탭도 없어지고 agent가 다시 연다. 이유: 자원은 상한이 막고, 사라진 page를 말없이 되살리면 agent가 옛 form과 scroll이 있다고 믿는다. 간단하게 먼저 쓰고 틀리면 더한다."
    by: agent
  - text: "core가 띄운 창은 자동으로 닫지 않는다. 사람이 쓰거나 닫는다."
    by: agent
  - text: "model에 가는 것은 lophn이 쓴 고정 문장뿐이다. `browser.*`의 `not_found`도 같은 고정 문장(없는 탭, 닫힌 탭, 남의 탭이 같아 존재가 새지 않는다)이라 model에 싣는다."
    by: agent
  - text: "core가 앱을 띄우는 조건: browser 탭 열기만, 그 core를 띄운 쪽이 `LOPHN_LAUNCH_SHELL=1`을 준 core만, 한 번에 하나, 실패 뒤 5분 쉼. test와 개발 환경이 사람 장치에 앱을 띄우지 않게 하려는 제한이다."
    by: agent
follow_up: |
  - 숨은 page의 1px 띠가 창 오른쪽 아래에 점으로 보일 수 있다(설치한 앱에서 눈으로 확인한다).
  - 두 창이 같은 workspace를 mount하면 agent page가 창마다 생긴다(이슈 `agent-browser-page-duplicated-across-windows`).
  - `tabs/open`은 dom-ready까지 기다려 첫 응답이 기한(10초, 앱을 띄웠으면 30초)보다 늦는 site는 실패한다.
  - 창 닫힘·앱 종료 뒤 layout에 남은 agent 탭은 지금 desk의 접힌 float만 mount 때 정리한다. 다른 desk의 것이나 펴진 float, 탭 줄의 것은 사람의 탭으로 남는다.
  - 최소화하거나 숨긴 창은 그리지 않아 screenshot이 실패한다(x11에서 쟀다). Wayland에서는 `showInactive`가 focus를 가져갈 수 있다. macOS와 Windows는 돌려 보지 않았다. 화면 없는 Linux는 browser를 쓸 수 없다.
  - core가 다시 떠서 표가 사라지면 주인 없는 page가 창이 닫히거나 상한에 밀릴 때까지 남는다(roadmap 8번의 `core_epoch` 정리는 하지 않았다).
  - artifact 탭은 아직 그 workspace를 띄운 창이 있어야 한다(이슈 `agent-artifact-tab-needs-mounted-workspace`).
checklist:
  - agent가 browser 탭을 열게 한 뒤(`lophn tab open --url`) 다른 workspace로 갔다가 돌아와 같은 page(scroll, 입력)가 reload 없이 있는지 본다
  - 창을 모두 닫고 agent가 browser 탭을 열게 한다. lophn 창이 focus를 가져가지 않고 뜨는지, 작업 표시줄이 깜박이는지, 저장한 크기와 최대화 상태가 그대로인지 본다
  - 앱을 Quit한 뒤 job이 browser 탭을 열게 한다. 앱이 저절로 뜨고 창이 focus 없이 나타나는지 본다. 같은 일을 되풀이했을 때 앱이 여러 개 뜨지 않는지도 본다
  - agent browser page가 사는 동안 창 오른쪽 아래에 1px 점이 보이는지 본다
  - 창을 최소화한 채 agent가 screenshot을 찍게 하면 실패하는지 본다(`unavailable`)
