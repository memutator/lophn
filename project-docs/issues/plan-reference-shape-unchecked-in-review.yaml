id: plan-reference-shape-unchecked-in-review
title: "계획이 본보기와 다른 모양을 정했는데 lead review가 README 대조만 함"
kind: mistake
status: open
topic: mistakes
modules: [tools]
now: |
  deferred-tools 계획은 "Claude Code의 ToolSearch와 같은 꼴"을 목표로 했지만, "정한 것"에서 숨김을 role마다 손으로 적은 이름 목록 넷(role prompt에 이름이 나오는지로 고름)으로 정했다. Claude Code는 tool 정의의 `shouldDefer` 하나로 정하고, role 구분은 이미 권한 목록(`builtinToolNames`)이 하고 있었다. worker는 README대로 만들었고 lead는 diff가 README와 같은지만 보고 merge했다. eval까지 돈 뒤 사람이 물어서 드러났고 wave 2로 다시 만들었다.
impact: |
  worker 한 판, eval 한 판($1.52), 사람의 시간. 같은 개념(어느 role이 무엇을 보나)을 두 목록이 갖게 될 뻔했다.
fix: |
  추천은 둘이다. planner-persona skill에 "본보기를 따른다고 쓴 계획은 정한 것마다 본보기의 해당 장치와 다른 점을 한 줄로 적는다"를 더한다. orchestrate skill review 표에 "계획 목표 문장(사람의 말)과 본보기에 비춰 모양이 맞나"를 더한다.
cause: |
  계획이 본보기를 이름으로만 가리키고(조사 문서 README), 본보기의 판단 장치(`source/deferral-policy.js`)를 "정한 것"과 대조하지 않았다. orchestrate review 표에는 "계획의 목표·본보기와 맞나" 칸이 없다.
prevent: |
  추천은 둘이다. planner-persona skill에 "본보기를 따른다고 쓴 계획은 정한 것마다 본보기의 해당 장치와 다른 점을 한 줄로 적는다"를 더한다. orchestrate skill review 표에 "계획 목표 문장(사람의 말)과 본보기에 비춰 모양이 맞나"를 더한다.
