  - {entry: "sdk:cap-secret/CAP_HOST", reason: "host port의 symbol 상수다. 값을 세우는 쪽은 앱 child의 runtime이다"}
  - {entry: "sdk:cap-secret/CapabilityError", reason: "오류 class다. 동작이 없다"}
  - {entry: "sdk:cap-secret/REQUIRED_PERMISSIONS", reason: "상수다. release 준비가 검사한다"}
  - {entry: "sdk:cap-secret/checkDeclaration", reason: "SDK 쪽 선언 검사 사본이다. 실제 판정은 release 준비(release-prepare의 failed-release)다"}
  - {entry: "sdk:cap-store/CAP_HOST", reason: "host port의 symbol 상수다. 같은 port를 cap-net, cap-notify, cap-secret도 읽는다"}
  - {entry: "sdk:cap-store/CapabilityError", reason: "오류 class다. 동작이 없다"}
  - {entry: "sdk:cap-store/DEFAULT_DATABASE_FILE", reason: "기본 DB 파일 이름 상수다. data worker도 같은 파일을 연다(sdk-store-open)"}
  - {entry: "sdk:cap-store/SCHEMA_TABLE", reason: "schema 번호 표 이름 상수다. data worker도 같은 표를 쓴다"}
