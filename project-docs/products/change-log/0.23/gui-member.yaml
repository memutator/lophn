id: gui-member
version: 0.23.118
title: "project의 coding agent GUI 탭이 lophn 팀원이 되어 call을 받고 자기 이름으로 부른다"
modules: [packages/protocol, packages/cli, packages/coding-agent, packages/core/terminal-agents, packages/core/harness-gui, packages/core/lophn-agent, packages/core/router, packages/core/events, packages/core/main]
checked: []
change: |
  전: 터미널 GUI 탭(`claude --gui` 등)은 lophn session이 아니어서 다른 agent가 부를 수 없고 그 탭의 CLI는 사람 token으로만 `lophn`을 불렀다. 다른 harness를 팀원으로 쓰는 길은 headless 셋(`claude -p`, `codex exec`, `opencode run`)뿐이었다.
  후:
  - 팀원: project 터미널의 GUI 탭 하나가 ledger session 하나다(`coding_<harness>`, `harness` 다섯 가운데 하나, 새 칸 `harness_gui`). CLI session id로 묶고 resume한 탭은 같은 session을 잇는다. 묶음은 core 메모리다.
  - 받기: call·reply·알림은 harness queue에 서고 탭이 쉴 때 하나씩 ACP send로 들어가 그 탭의 turn이 된다(받은 메시지로 그린다). result call의 답은 그 입력을 가져간 turn의 마지막 agent 글이다. 답 글 없이 끝나거나 turn이 열리지 않으면 call은 보낸 쪽에 `receiver_ended`로 돌아간다(machine command `harness/fail_call`).
  - 열기: 탭이 없는 팀원에게 입력이 오면 설정 `extensions.harness.enabled`가 켜졌을 때만 core가 그 project에 터미널을 열어 `<cli> --gui --resume <id>`(없으면 새로)를 친다. project에서 부른 내장 coding agent(call, team spawn)도 그때만 headless 대신 팀원으로 열린다(꺼져 있으면 전처럼 `unavailable`). core가 연 터미널은 project마다 8개까지이고, 받은 call의 turn이 끝나고 queue가 비면 닫힌다(team spawn 팀원과 사람이 쓴 탭은 둔다). machine command `harness/open_member`.
  - 끝내기: 화면 route `coding_sessions/forget`(사람만)이 그 project·harness·CLI session의 팀원을 보관한다. 사이드바 Recent의 x가 부르게 잇는 일은 남았다.
  - 자격: 탭 CLI의 env에 `LOPHN_AGENT_CREDENTIAL_FILE`(경로)을 두고 core가 turn마다(사람이 친 turn도) 그 turn의 자격을 쓰고 끝나면 지운다. CLI는 file이 비면 사람 token으로 바꾸지 않고 `unauthorized`이며 turn 시작에 2초까지 기다린다. 사람이 GUI에서 `!`로 친 명령은 file 없이 돌아 사람 자격이다.
  - 띄우기: 팀원 탭의 Claude는 `Bash(lophn *)` 허락과 정의의 deny, Codex는 sandbox network 허락으로 뜬다.
  - 보이기: 팀원 session은 화면의 session 목록·snapshot·event, 앱의 session 목록, attention, Agent 탭에 나오지 않는다(터미널 탭이 자리다). agent의 `session list`·`team read`에는 탭의 상태로 선다.
  - 저장: ledger step `lophn-agent.sessions.gui-member`가 `sessions`를 다시 짜 `harness` check에 omp·antigravity를 더하고 `harness_gui`를 더한다(기존 행은 0). 사람이 만든 agent 정의는 runtime omp·antigravity를 쓰지 못한다. 내장 coding agent 목록은 headless 명령이 있는 것만이고 handle `omp`·`antigravity`가 예약된다.
  - 문서: `harness-gui.md` 팀원, `coding-agent.md`, `agent-call.md` 28, roadmap `a2a-access.md` 진행, skill `lophn-agent`.
why: 사람이 평소 쓰는 coding agent 탭을 lophn 팀원으로 부르고 그 탭이 다른 agent를 부르게 해서, 다른 harness를 쓰는 오케스트레이션을 headless 뒤가 아니라 사람이 지켜보는 화면에서 하려는 것이다(roadmap a2a-access 정한 것 10).
decisions:
  - text: "평소 쓰는 coding agent의 GUI 탭이 팀원이 된다. headless 길은 그 뒤 걷어낸다."
    by: person
  - text: "transport는 `harness`를 그대로 쓰고 팀원은 `harness_gui` 표시가 붙은 ledger session이다. 표시는 재시작 뒤에도 headless host가 팀원 queue를 가져가지 않게 행에 둔다. 버린 길: 새 transport."
    by: agent
  - text: "turn 자격은 env가 가리키는 file로 준다. 자격 규칙(그 session·그 turn)은 그대로다. 버린 길: session 수명 token, MCP."
    by: agent
  - text: "ledger에는 turn 경계, 받은 입력, call에 답한 글만 둔다. 사람이 친 turn은 ledger turn 없이 자격만 낸다(StartTurn에 입력 메시지가 필요한데 쓰면 사람 글을 옮기거나 지어낸다)."
    by: agent
  - text: "넣은 입력의 ledger turn은 그 message id를 가져간 ACP turn에만 묶는다. 먼저 열린 사람 turn의 글이 답으로 가지 않는다."
    by: agent
  - text: "답 못 한 call은 그 call만 `receiver_ended`로 닫는다. 이유를 나누려면 `agent_calls`를 다시 짜야 한다."
    by: agent
  - text: "팀원은 화면에 터미널 탭으로만 보인다. 화면을 구독하는 Bus가 팀원 session event를 거른다. 버린 길: renderer가 표시로 거르기."
    by: agent
  - text: "project에서 부른 내장 coding agent는 GUI 탭 팀원으로 연다. Home·앱과 사람이 연 session은 headless 그대로다."
    by: agent
  - text: "core가 coding agent CLI를 스스로 띄우는 것(탭이 없는 팀원, 새 coding agent session)은 사람이 `extensions.harness.enabled`를 켰을 때뿐이다. 사람이 연 GUI 탭은 설정과 상관없이 팀원이다."
    by: agent
  - text: "core가 연 탭은 project마다 8개까지이고 call의 turn이 끝나고 queue가 비면 닫는다. team spawn 팀원과 사람이 쓴 탭은 닫지 않는다. 사람이 연 탭은 세지도 닫지도 않는다."
    by: agent
  - text: "turn 자격은 누가 했는지를 남기는 것이지 가두는 것이 아니다. coding agent는 사람의 shell을 가져 변수를 지우면 사람 자격을 얻는다(headless와 같다). 막지 않는다."
    by: agent
  - text: "call의 turn 중 사람이 보낸 steer는 그 turn을 call의 것으로 둔다. 마지막 agent 글이 답이다. 사람 메시지가 연 turn이 call을 가져가면(adapter가 줄을 묶음) 그 turn의 글은 답이 아니고 call은 실패로 돌아간다."
    by: agent
follow_up: |
  - 사이드바 Recent의 x(터미널 coding session 줄)가 `coding_sessions/forget {project, harness, cli_session}`을 부르게 잇고 shell main의 route 허용 목록에 더한다.
  - headless 걷어내기(roadmap a2a-access 4)는 사람이 실제 CLI로 해 본 뒤다.
  - 공유 skill `lophn-agent`는 지금 설정 `extensions.harness.enabled`가 켜졌을 때만 harness skill 폴더에 둔다. 팀원 탭에도 두려면 그 조건을 바꾼다.
checklist:
  - "해야: 앱을 다시 build한다"
  - "lophn이 coding agent를 스스로 띄우게 하려면(탭이 닫힌 팀원 다시 열기, project에서 coding agent 부르기) Settings › System › Extensions에서 coding agent 설정(harness)을 켠다. 꺼져 있어도 내가 연 GUI 탭은 부를 수 있다"
  - "해야: 내가 만든 agent 가운데 handle이 `omp`나 `antigravity`인 것이 있으면 이름을 바꾼다(내장 coding agent의 handle로 예약됐다)"
  - "GUI 탭에서 `!lophn tab open --url https://example.com`을 치면 전처럼 내 이름으로 탭이 열리는지 본다"
  - "project에 Claude Code GUI 탭(`claude --gui`)을 열고 그 project의 lophn에게 'claude 탭에게 hello라고 답하라고 call 보내' 같은 일을 시킨다. 탭에 받은 메시지(사람 말풍선이 아닌)가 들어오고, 그 답이 lophn에게 돌아오는지 본다"
  - "같은 일을 Codex GUI 탭(`codex --gui`)으로 해 본다"
  - "coding agent 설정을 켠 채 그 탭을 닫고 다시 call을 보내게 한다. core가 그 project에 탭을 다시 열어(같은 대화를 resume) 받고 답한 뒤 그 탭을 닫는지 본다. 설정을 끄면 열지 않고 lophn에게 실패가 돌아가는지 본다"
  - "탭에서 turn이 도는 중에 call이 오면 끝난 뒤에 따로 들어가는지, 탭에서 멈춘 call은 lophn에게 실패로 돌아오는지 본다"
