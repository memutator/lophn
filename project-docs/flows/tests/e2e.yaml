  - path: tests/e2e/sdk-decide_test.ts
    covers: [app-sdk-status-read:listed, app-sdk-decide:recorded, app-sdk-decide:handoff-refused, app-sdk-review-record:recorded, app-sdk-feature:reported, app-sdk-feature:not-found]
