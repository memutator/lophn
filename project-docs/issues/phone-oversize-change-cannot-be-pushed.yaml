id: phone-oversize-change-cannot-be-pushed
title: 폰에서 변경 하나가 8 MiB를 넘으면 폰에는 commit되지만 컴퓨터에 영영 가지 못해 그 앱의 sync가 멈춘다
kind: bug
status: open
topic: app-sync
modules: [packages/mobile, packages/core/apps]
now: |
  폰의 guest 호출은 `endCall`이 changeset을 outbox에 쓰고 commit하는데 changeset 크기를 막는 곳이 없다(`packages/mobile/src/apps/guest/local-call.ts`, 모듈의 길이 한도는 값 하나가 64 MiB다). push는 outbox 줄을 commit 순서로 보내다가 줄 하나가 `APP_SYNC_CHANGE_MAX_BYTES`(8 MiB)를 넘으면 `invalid_input`으로 push 전체를 멈춘다(`packages/mobile/src/apps/local/sync.ts`의 `batches`). 컴퓨터의 push 입력 schema도 같은 크기를 거절한다(`packages/protocol/apps/app-sync.ts`). 그 줄은 outbox에 남아 있어 다음 계기마다 같은 실패를 되풀이하고 그 뒤의 줄도 못 간다. 앱 상태는 `failed`에 머문다.
impact: |
  사람이 폰에서 큰 일괄 변경(많은 row 가져오기 등)을 한 번 하면 그 앱의 폰 변경이 모두 컴퓨터에 가지 않고, 컴퓨터의 변경은 계속 폰에 오니 두 사본이 갈라진 채 간다. 폰 data는 지워지지 않지만 컴퓨터의 Activity와 rewind에 들지 않고, 사람은 화면 아래 줄에서 "not synced"만 본다. 풀 길이 앱 쪽에는 없다(지침은 "큰 일괄 변경은 나눠서 한다"만 말한다).
fix: |
  - 작음(추천): 호출을 끝낼 때(`endCall`의 결과 bytes) 8 MiB를 넘으면 그 호출을 rollback하고 `invalid_input`으로 거절한다. 사람과 앱 agent가 변경을 나누게 되고 outbox가 막히지 않는다. 한도는 push schema와 같은 상수 하나를 쓴다.
  - 중간: 넘는 줄을 폰이 outbox에서 빼고 새 snapshot으로 맞춘다(컴퓨터의 "너무 큰 변경"과 같은 길). 그 변경은 사라진다.
