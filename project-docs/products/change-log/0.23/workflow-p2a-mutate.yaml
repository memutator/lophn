id: workflow-p2a-mutate
version: 0.23.136
title: Workflow 2a 로컬 step stall 감지, RetryWorkflowStep, report refs/data 저장과 CLI를 더한다
modules:
  - packages/protocol
  - packages/core/workflows
  - packages/core/main
  - packages/cli
change: |
  - `ReportWorkflow` `refs`·`data` 저장과 CLI 노출:
    - `WorkflowService.report`가 선택적 `refs`(산출물 파일 경로 목록)와 `data`(구조화 JSON)를 `ApplyWorkflowChange`로 넘겨 `report` 줄에 저장한다.
    - `withStepText`가 `report`의 `text`뿐 아니라 `refs`와 `data` 안의 모든 문자열, `step_stalled` 오류 메시지, `retried` 본문도 redaction하고 `retried` 본문을 blob으로 준비한다.
    - CLI `lophn workflow report`에 `--refs`와 `--data` flag를 더한다.
  - 로컬 non-human step stall 감지:
    - `workflowsWiring`이 `TurnEnded` event를 구독해 `WorkflowService.turnEnded`를 부른다(`closeIntake`에서 구독 해제).
    - `running` instance의 현재 step 담당 session이 turn을 마쳤을 때 `human_turn === true`, 이미 완료 report(`next !== null`)·`step_stalled`·`lophn_restarted`가 남았거나 열린 outgoing `agent_calls`가 있는 경우를 건너뛰고, 넘김·retry 시도당 최대 1회 `step_stalled` 줄(실패·중단 시 redaction된 `reason`·`message` 포함)을 남긴다.
  - `RetryWorkflowStep`과 CLI `lophn workflow retry`:
    - `workflowRetry`를 `core/workflows/register.ts`, `protocol/remote/allowlist.ts`, `wiring/workflows.ts`에 등록하고 `ApplyWorkflowChange`에 `step_stalled`·`retried` change variant를 더한다.
    - `running`이면서 대상 step(기본은 현재 막힌 step)이 blocked(`step_stalled`, `not_handed`, `lophn_restarted`, 실패한 turn)일 때만 허용하고 `stopped`나 정상 `working` 중이면 `conflict`를 돌려준다.
    - 기록된 session이 있으면 `retried` 줄을 남기고 그 같은 session에만 이어서 하라는 입력을 넣는다(`fallback: "new"` 없음, 닫힌 session이면 `conflict`). 아직 session이 열리기 전(`not_handed`)이면 넘기기를 다시 시도한다(`cause: "retry"`).
    - CLI `lophn workflow retry <instance> [step]`(user 전용)을 더하고 `flows/areas/automation.yaml`, `flows/areas/cli.yaml`을 맞춘다.
why: |
  로컬 non-human step이 명시적 report 없이 멈추거나 실패해도 `blocked`로 드러내고, 사람이 새 session으로 처음부터 돌리지 않고 같은 session에서 안전하게 이어 갈 수 있게 한다.
decisions:
  - text: "same-session retry는 `ApplyWorkflowChange`의 `retried` change 안에서 `Router.route`에 `{ session }`만 넘겨(`fallback: \"new\"` 없음) 닫힌 session이면 tx 전체를 `conflict`로 되돌린다. 버린 길: `handoffPlanSchema`에 `fallback: \"new\"`를 재사용해 조용히 새 session을 열기."
    by: agent
  - text: "stall 감지의 `step_stalled` 줄에 선택적 `reason`·`message`를 추가하고, `TurnEnded` 구독은 `custom-reply` wiring과 같은 commit 뒤 Bus 패턴으로 붙인다. 버린 길: `step_stalled`에서 실패 사유를 버리거나 turn 종료 tx 안에서 workflow 표를 직접 수정하기."
    by: agent
