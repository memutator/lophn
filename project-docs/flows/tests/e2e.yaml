  - path: tests/e2e/stop_test.ts
    covers: [turn-stop:stopped, model-call-run:cancelled, turn-read:ok, tool-call-read:ok, tool-shell-run:stopped, session-snapshot-read:ok, turn-request-cancel:cancelled-turn-ended, tool-gate-check:cancelled, session-archive:ok, session-delete:ok, session-read:ok, session-read:not_found, turn-finish:completed]
    note: "사람이 멈추면 model 요청이 끊기고 응답의 tool은 돌지 않는다. 도는 shell process group이 죽는다. 허락 대기 중 멈추면 늦은 once는 거절되고 명령이 돌지 않는다(거절 code는 test가 단정하지 않아 turn-request-decide는 뺐다). archive와 delete는 도는 model 요청을 끊고 새 session은 정상으로 답한다."
