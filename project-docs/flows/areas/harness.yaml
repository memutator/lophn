    steps:
      - "사람 자격이어야 하고 기기 device:<id>의 터미널 입력 허락이 켜져 있어야 한다. lease는 없어도 된다. core 표의 browser 탭이 아니면 not_found다"
      - "core가 host에 page_control {tab, held}를 연결 요청으로 보낸다. 그 기계의 [Take control]·[Hand back]과 같은 상태라 가져온 동안 agent의 쓰기 동작(act, navigate, evaluate)이 conflict이고 그 기계의 화면에도 잡혀 있음이 보인다. host가 page_state로 바뀐 held를 알려 보는 중이면 PageViewChanged가 난다. host의 not_found·invalid_input·conflict·unavailable은 그대로, 그 밖은 unavailable이다"
    outcomes:
      - id: held
        observe: [event:PageViewChanged, request:shell, response]
      - id: not_found
        code: not_found
        when: "core 표의 browser 탭이 아니다, 또는 host가 그 page를 모른다"
        observe: [response]
      - id: host-rejected
        code: conflict
        when: "host가 conflict로 거절했다(그대로 준다)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "page를 든 host가 연결되어 있지 않거나, 답하기 전에 끊겼거나, 기한(5초) 안에 답하지 않았다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch와 page view 둘 다: agent 자격), 또는 터미널 입력 허락이 없는 기기다(기기가 아닌 사람 token 포함)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: page-view-open
    title: 사람의 기기가 이 기계에 browser 탭을 연다(화면 없는 기계의 로그인)
    actor: person
    entries: [route:page_view/open]
    boundary: [core, host-queue-interface]
    code:
      - packages/core/host-queue/page-view.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/page-view.ts
      - packages/protocol/lophn-agent/host-queue.ts
    steps:
      - "사람 자격이어야 하고 기기 device:<id>의 터미널 입력 허락이 켜져 있어야 한다"
      - "같은 key는 한 번만 연다(200개를 기억한다. 보내는 중이거나 성공한 것은 처음 연 탭을 돌려주고, 실패한 key는 잊는다)"
      - "사람 token이 tabs/open --url로 연 것과 같다: url은 http·https만 받고, 주인 person(by null)과 home workspace로 표에 올리고 host에 tab_open을 보내 page가 생길 때까지 기다린다. shell이나 page host가 없으면 띄운다. 실패하면 표에서 거둔다. 표가 바뀌어 StateChanged browser_pages가 난다"
