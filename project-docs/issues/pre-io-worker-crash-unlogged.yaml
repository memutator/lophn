id: pre-io-worker-crash-unlogged
title: "I/O worker가 뜨기 전 daemon crash는 log에 안 남고, agent runtime crash는 재기동마다 쌓인다"
kind: bug
status: kept
topic: platform
modules: [packages/core/main, packages/core/diagnostics]
now: |
  daemon의 crash handler는 diagnostics wiring의 `prepare`에서 걸리지만, log 파일은 I/O worker가 쓰고 I/O worker는 `wiring/supervision.ts`의 `start`에서 뜬다. 그 앞의 crash는 `ctx.diagnosticsWrite`가 `false`로 끝나 stderr와 exit 1뿐이다. agent runtime(`main/agent-runtime/main.ts`)이 계속 죽으면 core가 다시 띄울 때마다 crash 한 줄이 쌓인다(재기동 제한 없음, `lophn-agent/run-loop/runtime.ts`). crash stderr 원문은 기존 redaction 규칙(20자 미만 `sk-` 값 등)에 안 걸리는 값을 가리지 못한다.
impact: |
  기동 초반 실패는 사람이 terminal을 보지 않으면 원인을 모른다. agent runtime이 crash loop에 빠지면 같은 줄이 log를 채운다.
fix: |
  - 기동 초반 crash: log 파일에 직접 덧붙이는 길을 만든다(작음. log 파일을 I/O worker만 쓴다는 규칙이 깨진다). 실제로 원인을 못 찾는 기동 실패가 나올 때 한다. 추천.
  - agent runtime: 재기동에 횟수·간격 제한을 둔다(작음, agent runtime 쪽).
closed: |
  남긴다. 기동 초반 crash도 stderr와 exit 1은 남고(`main/daemon/wiring/diagnostics.ts` 주석), log 파일에 직접 쓰면 log를 I/O worker만 쓴다는 규칙이 깨진다. agent runtime 줄은 틀렸다: 재기동은 `packages/core/supervision/responsiveness/supervisor.ts`가 하고 `slot.ts`의 `RESTART_LIMIT`(3번)에서 멈추므로 log가 계속 쌓이지 않는다. redaction에 안 걸리는 값은 이 변경이 아니라 redaction 규칙 쪽 한계다.
guard: 없음
