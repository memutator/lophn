id: skill-deployment-replaces-assignment
version: 0.23.191
title: 앱 할당과 공유 요청을 지우고 skill 배포 하나로 바꾼다
modules: [packages/protocol, packages/cli, packages/coding-agent, packages/design, packages/sdk, packages/core/approvals, packages/core/apps, packages/core/agent-workspaces, packages/core/lophn-agent, packages/core/main, packages/core/terminal-agents, packages/core/harness-gui, packages/core/router, packages/core/folder, packages/core/remote, packages/shell/renderer, packages/mobile]
platform_note: skill-deployment
change: |
  전: agent가 다른 앱의 command를 부르려면 사람이 agent 정의의 `apps`에 그 앱을 할당해야 했다(`assignments/*`, Agents 탭 › Sees의 Assign app,
  command별 `permissions`의 deny·ask). 앱의 agent는 `lophn app share`로 공유를 청하고 사람이 승인했고, coding agent로 가는 skill은
  설정 `coding-agent.shared_apps`가 정했다.

  후: 앱을 쓰게 하는 길은 skill 배포 하나다.
  - 배포 기록 `deployed_skills`(`{app: 앱 id, skill}` 목록)가 MCP 설정과 같은 세 층에 선다: 전역 설정 `lophn-agent.extensions.deployed_skills`,
    workspace `extensions.json`, agent 정의. coding agent harness는 네 번째 자리다(설정 `coding-agent.deployed_skills`). 사본 file은 harness에만 쓰고
    lophn agent는 앱의 active release bundle에서 읽는다.
  - 닿는지 판정은 한 규칙이다: 세 층 어디에든 배포됨 ∩ active release에서 public ∩ 그 session에서 꺼지지 않음(`skills_off`). 층 하나라도 읽지
    못하면 닿지 않은 것으로 본다. 닿은 앱의 public command는 묻지 않고 부르고 workspace 정보와 `lophn help`에 실린다.
  - 닿지 않은 앱의 command를 agent가 부르면 Gate가 사람에게 묻는다(`once | session | always | reject`). `always`는 부른 session의 workspace 층에
    그 앱의 public skill을 배포한다(public skill이 없으면 `always`가 없다). 이 묻기는 사람만 답한다(팀 자식의 것을 부모 agent가 답하지 못한다).
    사람이 없는 실행은 거절이다.
  - 명령 `lophn skill deploy|undeploy <app> <skill> --to global | workspace[:<ref>] | agent:<handle>[@<workspace>] | harness`,
    `lophn skill deployments [--app]`(route `skills/deploy|undeploy|deployments`). 묻지 않고 배포하는 쪽은 사람, 그 앱 workspace의 agent(자기 앱),
    Home의 lophn이다. 그 밖의 agent와 `harness`로 가는 모든 agent 배포는 사람에게 묻는다. agent가 보는 배포 목록은 자기에게 닿는 줄뿐이다.
  - 의존: 받는 자리를 읽는 곳이 하나다. public skill·command를 지우는 release는 `release prepare`가 받는 자리 수를, activation 동의 카드가 잃는
    자리를 보인다. 앱 archive·삭제의 영향 목록이 모든 층을 본다(종류 이름 `skill_deployment`). 앱이 더는 내놓지 않는 skill의 배포는 목록에
    `provided: false`로 보인다. 읽지 못한 자리 수(`unreadable`)를 같이 보인다.
  - 내장 skill `deploy-skill`을 더했고 `write-skill`, workspace 종류 prompt, `design-app`, 앱 template, SDK guide를 고쳤다.
    `@lophn/declaration` 6.2.0, `@lophn/flow` 2.3.0, `@lophn/app-ui` 2.27.1, `@lophn/app-ui-native` 1.12.2.
  - 지운 것: agent 정의의 `apps`·`permissions`, 공유 요청 전체(`lophn app share`, `share_request.*`, 대기 목록 카드, ledger 표 `share_requests`),
    `coding-agent.shared_apps`, harness의 deny 사슬. 다른 컴퓨터 앱의 할당(`remote_apps`)과 call 정책은 그대로다.
  - 저장: data step이 `agents/*.md`의 `apps`·`permissions`와 `settings.json`의 `coding-agent.shared_apps`를 지운다(옮기지 않는다).
    schema step `approvals.share_requests.drop`이 표를 지운다.
  - 같이 고친 것: workspace 층 MCP 설정이 runtime에서 읽히지 않던 것(route가 runtime 허용 목록에 없었다), `extensions.json`을 agent의 file tool이
    쓸 수 있던 것, agent가 자기 `skills_off`·`mcp_off` 항목을 뺄 수 있던 것, 설정 받기가 묶음에 실린 `locked_fields`를 믿던 것, 폰 Inbox
    history가 `reveal_received_files` notice에서 typecheck에 실패하던 것, 앱 template이 설치되지 않는 `@lophn/agent` 판을 pin하던 것.
why: |
  할당은 "허락"과 "알기"를 한 칸에 묶어 사람만 쓰게 했고, private·쌍 규칙·command `public`·기계 둘과 곱해져 경우가 많았다. agent를 움직이는
  것은 알기다: command가 있어도 지침에 없으면 쓰지 않는다. 그래서 알기(skill)만 관리하고 허락을 거기에 붙였다. 사람의 data에서 할당은
  한 줄뿐이었다(`project-docs/products/roadmap/access-simplify.md`).
decisions:
  - text: 할당을 지우고 skill 배포로만 한다. 배포되지 않은 앱을 agent가 쓰면 permission을 띄운다. 원본은 앱이 관리하고 배포한 것을 lophn이 관리한다.
    by: person
  - text: 배포 층은 전역, workspace, agent 셋이고 MCP·memory의 층과 같이 쓴다. skill을 배포하는 내장 skill을 두고 `write-skill`을 고친다.
    by: person
  - text: agent가 사람 승인 없이 배포한다(주는 쪽인 앱 workspace의 agent와 Home lophn). 끌어오는 쪽과 `harness`는 묻는다. 버린 길 - harness도
      묻지 않기(agent가 쓴 글이 Gate 없는 coding agent의 전역 skill 폴더에 들어간다).
    by: agent
  - text: 이 컴퓨터의 앱은 사본 file을 층 폴더에 쓰지 않고 active release bundle을 읽는다. 버린 길 - 층 폴더에 사본 쓰기(표시 file이 skill 목록과
      섞이고 사본을 고치지 못하게 따로 막아야 한다).
    by: agent
  - text: 배포 기록은 층의 설정에 두고 표를 두지 않는다. 앱은 id로 적는다. 버린 길 - slug(지운 앱의 slug로 새 앱을 만들면 남은 기록이 닿는다).
    by: agent
  - text: 묻지 않는 범위는 앱 단위다(그 앱의 skill이 하나라도 닿으면 public command 전부). 끈 skill은 닿지 않은 것으로 본다.
    by: agent
  - text: 사본은 판을 고정하지 않고 active release를 따른다. 배포는 층 설정처럼 기계마다다. 옛 `apps`는 배포로 옮기지 않는다(사람의 data의 한 줄은
      public skill이 없는 앱이었다).
    by: agent
  - text: skill을 지우는 release는 막지 않고 알린다. 그것만으로 동의 카드를 띄우지 않는다. 앱의 agent에게는 받는 자리의 이름이 아니라 수만 보인다.
    by: agent
follow_up: |
  call 정책(private, 쌍 규칙) 지우기와 다른 컴퓨터 앱의 skill 배포(`remote_apps` 대체, 터미널 입력 허락에서 떼기)가 남았다(roadmap `access-simplify`).
checklist:
  - "해야: Home lophn에 할당돼 있던 앱은 public skill이 없어 옮겨지지 않았다. 그 앱의 lophn에게 밖에 내놓는 command의 skill을 쓰게 하고 배포한다(그 전에는 Home lophn이 그 앱을 부를 때 묻는다)"
  - "해야: 할당으로 앱을 부르던 workflow가 있으면 그 project에 앱의 skill을 배포한다"
  - Settings › Tools and skills, workspace Agents 탭의 Skills 절, agent editor의 Sees 탭에 "Deployed app skills"가 보이는지 본다
  - 기존 workflow에 flow SDK 2.3.0 update 표시가 뜬다
