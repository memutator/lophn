id: desk-layout-per-project
version: 0.6.0
title: "project 창 layout을 desk(Main과 workflow마다 하나)로 나누고, 상단 bar 왼쪽에 `project ▾ / desk ▾`를 둔다"
modules: [packages/shell/renderer, packages/shell/main, packages/shell/ipc, packages/shell/preload, packages/design, tools]
checked: [architecture-artifact, architecture-appearance, skill-ui-design, tool-wireframes, tool-dev]
change: |
  전:
  - project 창 하나가 layout(`WorkspaceView`) 하나였다. 앱 전체가 `<data>/shell/layout.json` 하나를 썼고, 다른 project를 열어 저장하면 앞 project의 layout을 덮어썼다.
  - 상단 bar 왼쪽은 파일 경로 breadcrumb(`project / notes.md`)과 minimized span이었다.
  - project 창에서 palette 등으로 다른 project로 가면 `Workspace`가 그대로 남았다. 새 project에 저장된 layout이 없으면 앞 project의 탭이 남아 새 project의 layout으로 저장됐다.
  후:
  - layout이 desk로 나뉜다. desk는 기본 desk(`_default`, 화면 이름 "Main")와 그 project의 workflow마다 하나다. desk key는 workflow 이름이다. desk마다 pane, tab, floated, minimized, detached를 따로 갖는다.
  - 저장은 project id마다 file 하나(`<data>/shell/layouts/<prj_id>.json`, schema 판 4: `active_desk`, `desks`)다. 옛 `layout.json`은 읽지도 지우지도 않아 layout이 처음부터 시작한다.
  - 상단 bar 왼쪽은 `project ▾ / desk ▾`다. 파일 경로 breadcrumb은 project 창에서 없다.
    - project menu는 active project 목록이고, 고르면 그 project를 이 창에서 연다.
    - desk menu는 Main과 workflow 목록이다. workflow가 없으면 `project ▾`만 보인다. 틀린 선언의 workflow는 ⚠ 표시가 붙고 고를 수 있다.
    - workflow desk를 처음 열면 그 workflow 탭이 열린 채 시작한다. sidebar의 workflow 줄도 그 desk로 간다. 보이는 desk의 workflow 줄은 sidebar에서 강조된다.
  - desk를 바꾸면 그 desk의 layout으로 통째로 바뀐다. 떠난 desk의 detached 창은 닫지 않고 숨긴다(새 IPC `shell:detached-show`, `lophnDetached.showOnly`). 다른 desk에 있는 탭을 열면 그 desk로 간다. 목록에서 사라진 workflow의 desk는 Main으로 합친다(탭은 잃지 않는다).
  - project마다 `Workspace`를 새로 mount한다.
why: |
  workflow가 layout의 최상위 객체다(roadmap `workflow.md`). desk가 project마다 쌓이므로 저장을 project마다 나눠야 project를 오갈 때 desk를 잃지 않는다. 자세한 흐름은 `project-docs/architecture/workspace-layout.md`.
decisions:
  - by: person
    text: |-
      selector는 가운데가 아니라 상단 bar 왼쪽에 두고, 파일 경로 breadcrumb을 뺀다. minimized span 단추가 자리를 써야 한다. (2026-10-22)
  - by: person
    text: |-
      project 쪽도 menu다(이 창에서 연다). workflow가 없는 project는 `project ▾`만 보인다. project menu는 목록만이다. (2026-10-22)
  - by: person
    text: |-
      기본 desk 이름은 "Main", 틀린 선언은 ⚠ 표시를 붙이고 고를 수 있음, 즉시 전환, 목록 읽기 실패는 따로 알리지 않음. (2026-10-22)
  - by: person
    text: |-
      sidebar 머리의 project 이름과 상단 bar의 `project ▾`가 겹쳐 보이는 것은 그대로 둔다. (2026-10-22)
  - by: agent
    text: |-
      desk key는 workflow 이름이고 project 이름을 넣지 않는다. 기본 desk key `_default`는 slug가 될 수 없는 값이다. 저장 file 이름은 project 이름이 아니라 id다.
  - by: agent
    text: |-
      desk를 건너 탭 key가 겹치는지 schema는 거절하지 않는다. model과 위험 test가 막는다.
  - by: agent
    text: |-
      떠난 desk의 탭은 unmount하고 app panel의 native view만 살린다. 일반 browser 탭은 돌아오면 다시 load한다.
  - by: agent
    text: |-
      사라진 workflow는 workflow 목록 읽기에 성공했을 때만 합친다. 합치며 floats·detached 20개를 넘는 탭은 docked로 옮기고 그 창을 닫는다.
  - by: agent
    text: |-
      단축키는 두지 않는다.
follow_up: |
  개발 data의 옛 `shell/layout.json`은 남아도 해가 없다. desk를 건너는 남은 동작(browser page 다시 load, 다른 desk terminal의 URL 열기, workflow 이름 바꾸기)은 `project-docs/issues/workspace-layout.md`다.
