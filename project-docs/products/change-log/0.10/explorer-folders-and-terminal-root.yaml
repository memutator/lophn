id: explorer-folders-and-terminal-root
version: 0.10.2
title: "하위 폴더를 없애고, Explorer에서 연결 폴더를 더하고 빼며, 터미널은 Explorer의 루트에서 열린다"
modules: [packages/protocol, packages/core/projects, packages/core/agent-workspaces, packages/shell/renderer, packages/shell/main, packages/shell/ipc, packages/core/terminals]
checked: []
change: |
  전:
  - project의 연결 폴더마다 하위 폴더(상대 경로와 설명)를 달 수 있었다. 효과는 agent place 정보에 한 줄씩 실리는 것과 Explorer 루트 menu에 항목이 느는 것뿐이었다. 어느 폴더의 것인지는 prompt에서 사라졌다.
  - 연결 폴더가 둘 이상이면 터미널을 열 때마다 어디서 시작할지 물었다(choose_folder).
  - Explorer에서 연결 폴더를 바꾸려면 launcher의 project Details로 가야 했다.
  후:
  - 하위 폴더가 없다. project.create·project.update의 folders는 {path, description}이고, 읽기에도 subfolders가 없다. 새 schema step projects.registry.drop-subfolders가 project_subfolders를 지운다(쓰던 data root는 이 step이 이어받고 하위 폴더 행만 사라진다). agent place 정보의 하위 폴더 줄, launcher Details의 하위 폴더 구역과 고르기 dialog, FolderResolver.resolveInside가 없다.
  - Explorer 루트 menu는 연결 폴더만 보인다. 행 오른쪽 끝의 x는 확인 뒤 그 폴더를 project에서 빼고(디스크는 그대로), 맨 아래 Add folder는 OS 선택기로 폴더를 더한다. 둘 다 project.update로 폴더 목록을 통째로 바꾼다.
  - 고른 루트는 작업대가 들고(저장하지 않는다), 터미널은 그 폴더에서 연다. 질문 화면(choose_folder, FolderChoice)이 없어졌다.
  - Explorer의 폴더 행을 오른쪽 클릭하면 Open in Terminal이 있고 그 폴더에서 터미널을 연다. terminal.open이 cwd(등록 폴더 안의 절대 경로)를 받고 main이 realpath로 등록 폴더 안인지 다시 본다. 밖이면 unreadable이다.
  계약:
  - 바뀐 것: project.create·project.update의 folders[].subfolders와 읽기 출력의 subfolders가 없다. terminal.open 입력에 cwd가 생겼고 실패 이유 choose_folder가 없다.
why: |
  하위 폴더는 범위도 권한도 바꾸지 않아 agent가 읽는 힌트 한 줄뿐이었고, 소속 폴더가 빠져 쓸모가 작았다. 여러 연결 폴더에서 터미널마다 묻는 것은 번거로웠다.
decisions:
  - text: "하위 폴더는 옮기지 않고 지운다. 쓰는 곳이 prompt 한 줄뿐이라 되살릴 값이 없다."
    by: person
  - text: "터미널 시작 폴더는 renderer가 보낸 cwd를 main이 다시 검사한다. renderer가 믿을 수 있는 입력이 아니기 때문이다."
    by: agent
