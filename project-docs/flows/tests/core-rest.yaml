group: core-rest
files:
  - path: packages/core/agent-workspaces/hooks_test.ts
    covers:
      - tool-agent-memory:appended
      - tool-agent-memory:over-limit
    note: "agent.memory는 부른 agent의 파일만 쓴다: 사람이 만든 agent는 agent memory, lophn은 자기 workspace memory만. 자리를 고르는 입력은 받지 않고 8 KiB를 넘는 쓰기는 거절하며 파일은 그대로다"

  - path: packages/core/diagnostics/record_test.ts
    covers: [log-line-write:written, log-line-write:filtered]
    note: "agent runtime child가 stderr로 낸 줄(JSON record와 crash 글)은 secret 패턴을 가린 뒤에만 core log file에 가고 시각·service·trace id는 그대로다. debug는 trace가 켜진 동안만 file에 간다"

  - path: packages/core/agent-workspaces/memory-names_test.ts
    covers: [turn-loop:memory-names]
    note: "memory의 id는 not_found만 deleted로 풀고 읽지 못한 id는 줄을 내지 않음(core는 fake)"

  - path: packages/core/agent-workspaces/tool-lists_test.ts
    covers: [tool-list-assembly:fixed]
    note: workspace 종류별 model tool 목록의 wire 이름 충돌과 종류별 포함 규칙

  - path: packages/core/agent-workspaces/workspace/data-folder_test.ts
    covers: []
    note: data root 아래 workspace 폴더 자리 계산(순수 path helper)

  - path: packages/core/agent-workspaces/workspace/project-layer_test.ts
    covers: []
    note: "extensions.json 자리 규칙(Home은 data root의 home 폴더)과 앱 층 MCP server가 그 앱 session에만 실리는 것. 두 갈래의 workspace 층 조회라 flow outcome을 덮지 않는다"

  - path: packages/core/agent-workspaces/workspace/workspace-folders_test.ts
    covers:
      - workspace-file-scope:project
      - workspace-file-scope:app
      - workspace-file-scope:home
      - workspace-file-scope:home-called
    note: workspaceScope의 read·write 목록과 base

  - path: packages/core/agent-workspaces/workspace/workspace-info_test.ts
    covers: [workspace-file-scope:app, workspace-info:full]
    note: "앱 workspace의 쓰기 범위(workspace-file-scope:app)와 workspace 정보 text(workspace-info:full)"

  - path: packages/core/attention/decide_test.ts
    covers: [push-send:not-needed]
    note: "push를 어느 기기에 보낼지 정하는 표(앞에 있는 desktop, 90초가 지난 보고, idle 한도, 앞에 있는 폰은 자기에게만, kind computer 기기(다른 컴퓨터)의 보고는 desktop 규칙, 꺼진 설정 칸)와 to_parent·app이 연 session의 turn 끝이 계기가 되지 않는 규칙(판정 함수를 직접 부른다)"

  - path: packages/core/attention/message_test.ts
    covers: [push-send:sent]
    note: "push 글과 data 어디에도 마지막 답, shell 명령, 질문 글, 앱 notice body가 없다(글 만드는 함수를 직접 부른다)"

  - path: packages/core/attention/unseen_test.ts
    covers: [presence-report:recorded, unseen-dismiss:dismissed, unseen-dismiss:nothing-to-dismiss]
    note: "unseen은 앞에 있는 host가 보고 있지 않을 때만 서고, 다른 host가 새로 보면 꺼지고, 승인·질문 대기와 app이 연 session의 끝으로는 서지 않는다(core 판정 함수를 직접 부른다)"

  - path: packages/core/approvals/approvals_test.ts
    covers:
      - turn-request-decide:forbidden
      - turn-request-decide:not-found
      - turn-request-decide:once
      - team-child-approval-to-parent:parent-allowed
      - team-child-approval-to-parent:parent-ended

  - path: packages/core/approvals/assignment/commands_test.ts
    covers: [assignment-set:forbidden]

  - path: packages/core/approvals/gate/judge_test.ts
    covers:
      - tool-gate-check:run
      - tool-gate-check:denied-shell-rule
      - tool-gate-check:denied-not-assigned
      - tool-gate-check:denied-removed
      - tool-gate-check:denied-no-person
      - app-call-assignment-judge:gate-blocked
      - extension-tool-judge:not-assigned
      - extension-tool-judge:removed
    note: judge 순수 함수의 판정표. ask 판정은 outcome이 없어 covers에 없다

  - path: packages/core/approvals/share-requests/commands_test.ts
    covers:
      - share-request-open:opened
      - share-request-open:forbidden
      - share-request-decide:forbidden
      - share-request-decide:conflict
      - share-request-decide:approved
      - share-request-decide:approve-write-failed

  - path: packages/core/config/store_test.ts
    covers:
      - settings-update:changed
      - settings-update:rejected
      - settings-update:locked
      - settings-update:unchanged
      - settings-update:unavailable
      - settings-file-watch:changed
      - settings-file-watch:rejected-key
    note: "settings store의 update와 기동 때 읽기. 항목 file은 그 항목만 쓰고 지운다(사람이 둔 file과 읽지 못한 file은 그대로), 거절이면 아무 file도 안 바뀐다, agent는 locked 설정을 못 바꾼다"

  - path: packages/core/config/routes_test.ts
    covers:
      - settings-update:needs-approval
      - settings-update:changed
      - settings-update:rejected
      - settings-update:device-remote-refused
    note: "agent의 folder.destinations 두기·바꾸기·지우기는 사람이 허락한 그 값만 그 한 번 쓰이고, 묻는 자리가 없거나 거절·막힘·취소·묻기 실패·결정 사이 바뀜이면 needs_approval이고 설정 file이 bytes 그대로다. 카드 줄은 이름과 전체 경로다. 사람 자격은 묻지 않고 쓰고, 틀린 값은 묻기 전에 거절된다. 기기 자격의 remote.* 쓰기는 forbidden이고 같이 보낸 다른 바꿈도 쓰이지 않는다"

  - path: packages/core/config/shell-settings_test.ts
    covers:
      - settings-update:rejected
      - settings-update:changed
    note: "shell 설정의 뜻 검사: 없는 theme id, 모드가 다른 theme, 쓸 수 없는 theme, 모르는 단축키 id와 chord, CSS로 새는 글꼴 이름은 거절하고 theme의 버린 색과 모자란 대비는 notes로 알린다"

  - path: packages/core/events/gateway_test.ts
    covers:
      - gateway-stream:ok
      - gateway-stream:slow-consumer
      - gateway-stream:bad-frame
      - view-table-events:other-owner
    note: "잘못된 watch 조건의 1008 close는 gateway-stream:bad-frame. AppViewEvent는 같은 owner의 session에만 가는 것은 view-table-events:other-owner"

  - path: packages/core/folder/folder_test.ts
    covers:
      - settings-update:rejected
      - carry-put:accepted
      - carry-put:have
      - carry-put:rejected
      - carry-file:not_found
      - carry-mirror-take-in:taken-in
      - carry-mirror-take-in:skipped
      - carry-roster-file-read:statements-offered
      - carry-roster-file-read:ignored
      - carry-event-arrive:arrived
      - carry-removed-computer:parked
      - carry-removed-computer:restored
      - carry-removed-computer:deleted
      - folder-release-follow:waiting-consent
    note: "폴더 writer는 `..`, 절대 path, 다른 기계 폴더, 자기 폴더 안 symlink로 쓰기·지우기·rename을 하지 못하고 destination과 밖의 file이 bytes 그대로다. reader는 layout 꼴과 맞는 이름만 돌려준다. data root 안·data root를 품은·상대·서로 겹친 destination은 거절되고(손으로 둔 값은 쓰이지 않는다). schema step folder.tables는 다른 표의 행을 그대로 둔다"

  - path: packages/core/folder/environment_test.ts
    covers:
      - folder-export-run:cleaned
    note: "흔적 정리의 경계 표 test: before는 알려진 기계 가운데 가장 늦지 않은 settled를 넘지 않거나 90일 쪽이고, settled 없는 기계가 있으면 90일 쪽만, 사람이 지운 기계(실제 import의 기록 사본)는 붙잡지 않는다"

  - path: packages/core/folder/export/export_test.ts
    covers:
      - folder-export-run:written
      - folder-export-run:stream-error
    note: "폴더 내보내기(route 없음, folder wiring이 부른다). 내보내기·snapshot·compaction·기계 기록을 여러 번 돌려도 다른 기계의 하위 폴더와 사람의 file이 bytes 그대로다. data root의 machine.json binding·secrets.json·host key 비밀 key가 폴더 file에 없다. 다른 기계 horizon 이하의 내보내지 않은 변경은 file에 없고 같은 bytes의 held 줄이 된다. rename 뒤 기록 전에 죽어도 번호를 다시 쓰지 않고, 자기 하위 폴더에 남이 쓴 번호·바뀐 file이 있으면 쓰지 않고 foreign_writer다"

  - path: packages/core/folder/import/held_test.ts
    covers:
      - folder-import-run:held-applied
      - folder-import-run:held-covered
      - folder-import-run:held-full
      - folder-import-run:out-of-range
    note: "다른 release·다른 꼴 판의 기계(FolderApply는 node:sqlite 위의 실제 sync core 적용). 다른 release의 held는 이 기계가 그 release가 될 때까지 적용되지 않고, 된 뒤 출처마다 번호 순서로 빠짐없이 적용되며 그 동안 그 출처의 뒤 file은 읽지 않고, 적용이 실패하면 그 행부터 남아 물러남 뒤 같은 행부터 잇는다. 출처의 snapshot m이 held가 되거나 합쳐지면 그 출처의 m보다 옛 held만 지워지고 다른 출처와 더 큰 번호의 held는 남는다. 꼴 판이 범위 밖(version이 크거나 min_version이 큼)인 기계는 깨뜨린 file을 열지 않아 newer_format 그대로이고 복사·삭제·cursor 이동이 없으며 앱 기록이 records()에서 빠지고, 범위 안으로 돌아오면 그 cursor부터 잇는다. held가 한도(test는 작게 넣는다)에 닿으면 넘을 file은 복사되지 않고 cursor가 그 앞에 남으며, 뒤에 출처의 snapshot이 오면 그리로 건너뛰고, 이 기계가 그 release가 되면 멈춘 cursor부터 폴더에서 읽는다. 꼴 판 판정 표(exchangeWith)가 ok·update_this·update_peer를 가른다"

  - path: packages/core/folder/import/import_test.ts
    covers:
      - folder-import-run:followed
      - folder-import-run:waiting
    note: "다른 기계의 하위 폴더 읽기. 잘린·bytes가 바뀐·번호가 다른 file은 FolderApply를 부르지 않고 cursor가 그대로이며 invalid_file이 보이고, 맞는 file로 바뀌면 적용된다. 다른 release의 file(snapshot 포함)은 같은 bytes로 data root에 held로 남고 폴더에서 지워져도 남는다. 충돌 사본·temp는 읽지 않고 늦게 온 번호를 기다려 순서대로 한 번만 적용한다. 깨진 기록·빈 폴더는 기록 사본과 local data를 지우지 않는다. horizon 밖에서 지우기 없이 합친 stream은 빚(owes_absent_pass)을 남기고 재시작을 넘기며, 출처가 이 기계의 것을 다 받은 뒤에 만든 snapshot이 오면 그것으로 다시 합쳐(실제 sync core) 다른 곳에서 지워지고 흔적이 정리된 row만 지우고 떨어져 있는 동안 고친 row는 남긴다. 그런 snapshot이 없으면 오류 없이 기다린다. 지운 기계는 목록에서 빠지되 행과 data가 남고 새 revision이면 돌아온다. compaction 뒤에는 가장 큰 맞는 snapshot으로 따라오고, 5분 넘게 앞선 clock의 changes file과 snapshot은 clock_ahead로 미룬다"

  - path: packages/core/folder/apps/apps_test.ts
    covers:
      - release-activate:waiting-consent
      - app-take-in:installed
      - app-take-in:existing
      - app-take-in:release-incomplete
    note: "실제 git과 임시 폴더 두 기계. take-in한 release는 prepared이고 grant·동의 행이 없으며 activation 판정이 동의를 기다린다. 두 번 부르거나 이미 있는 앱에 부르면 앱 행은 그대로이고 release는 하나다. release.json이 없거나 file이 빠지거나 1 byte 다르거나 manifest hash가 폴더 이름과 다르면 앱·release 행과 봉인 사본이 생기지 않는다(release_incomplete). 다른 기계의 증분 source bundle은 refs/remotes/<mch>/*에만 오고 HEAD, branch, 작업 tree는 그대로다"

  - path: packages/core/host-queue/hold_test.ts
    covers:
      - harness-tui-hold:extended
      - harness-tui-hold:expired
      - harness-tui-hold:released

  - path: packages/core/host-queue/page-view_test.ts
    covers:
      - page-view-input:forbidden
      - page-view-control:forbidden
      - page-view-open:forbidden
      - page-view-list:forbidden
      - page-view-snapshot:forbidden
      - page-view-watch:forbidden
      - page-view-watch:stopped
      - page-view-watch:hold-released
      - page-view-frame:dropped
      - page-view-frame:hold-released
      - page-view-control:host-rejected
      - page-view-list:ok
    note: "createPageView 직접 호출(가짜 연결 요청, 수동 clock). agent 자격(입력 허락이 있는 principal이라도)과 허락 없는 기기의 input·control·open은 forbidden이고 host에 요청이 가지 않는다. agent 자격은 자기 session의 탭과 다른 session의 탭 모두 list·snapshot·watch가 forbidden이다. 마지막 lease를 끄거나 기한이 지나면 page_stream {on:false}가 가고 lease 없는 frame은 남지 않는다. 보지 않는 기기는 잡지 못하고(conflict), 멀리서 잡은 기기의 lease가 기한으로 끝나거나 보기를 끄거나 허락을 잃으면 page_control {held:false}가 가며 목록의 held_by가 지워진다(agent 쓰기가 다시 되는 host 쪽은 stream_test)"

  - path: packages/core/host-queue/phone_test.ts
    covers:
      - host-phone-drive:stale-ref
    note: "createPhoneDriver 직접 호출. snapshot 전의 ref, 앞 snapshot의 ref, view나 기기가 바뀐 뒤의 ref(ref 없는 scroll도)는 폰에 묻지 않고 conflict다"

  - path: packages/core/host-queue/queue_test.ts
    covers:
      - host-browser-read:state
      - host-browser-read:not_found
      - host-tab-close:accepted
      - host-tab-close:forbidden
      - host-tab-close:not_found
      - host-tab-show:accepted
      - host-tab-show:forbidden
      - host-tab-show:not_found
      - host-link:done
      - host-link:retry
      - host-link:tab-state
      - host-preview-tab-open:reused
      - host-browser-inspect:unavailable
      - host-link:closed
    note: "host queue 표의 함수(openTab, connect, done, report, abandon, expire, callLink). 탭 요청은 route 입구 없이 queue를 직접 부르고 연결은 메모리 send로 대신한다. 이미 열린 preview 탭에 기기나 화면을 주면 같은 tab id로 tab_open이 다시 나가는 것(reused), retry한 요청이 다음 pump에 다시 나가는 것, 빌려 간 browser_call이 다시 나가지 않고 기한을 넘으면 unavailable로 끝나며 늦은 done이 무시되는 것, 연결 요청(page_input)이 연결이 없으면 대기하지 않고 바로 unavailable이고 연결이 닫히면 거두어 다음 연결로 가지 않는 것(closed)"

  - path: packages/core/install-and-update/data-root_test.ts
    covers: [core-boot:start-failed-other]
    note: POSIX data root의 group·other 권한 거절(기동 거절 other)

  - path: packages/core/jobs/commands_test.ts
    covers:
      - job-create:created
      - job-update:updated
      - job-update:not_found
      - job-delete:deleted
      - job-delete:not_found

  - path: packages/core/jobs/events_test.ts
    covers:
      - job-event-fire:fired
      - job-event-fire:skipped-busy
      - job-event-fire:skipped-too-soon
      - job-event-fire:ignored
      - job-create:invalid_input
    note: "승인 전·꺼진 event job은 안 돈다. 폭풍(busy, too_soon)은 건너뛰고 센다. 자기 run이 연 session과 닿을 수 없는 workspace의 session event는 보지 않는다. 때는 선언한 event와 lophn의 session event만"

  - path: packages/core/jobs/due_test.ts
    covers:
      - job-claim-due:queued
      - job-claim-due:held
      - job-claim-due:held-again
      - job-claim-due:skipped-overlap
      - job-startup:interrupted
      - job-startup:missed-counted
      - job-hold-decide:conflict
      - job-claim-due:not-due
    note: "승인 전 job이 claim에서 빠지는 것은 job-claim-due:not-due"

  - path: packages/core/jobs/machine_test.ts
    covers:
      - job-take-over:taken
      - job-take-over:forbidden
      - job-take-over:not_found
      - job-take-over:conflict
      - job-hold-decide:conflict
      - job-claim-due:not-due
      - job-event-fire:ignored
      - job-activity:idle
    note: "jobs.machine step을 지나고 첫 기동 claim을 해도 job과 줄이 그대로이고 모두 이 기계로 찍힌다. 주인이 다른 job은 차례·event·Start now·idle-exit의 일에서 빠지고 take over 뒤에 돈다"

  - path: packages/core/jobs/schedule_test.ts
    covers: []
    note: 서머타임 날의 job 차례 계산(순수 함수)

  - path: packages/core/jobs/scheduler_test.ts
    covers:
      - job-run-end:done
      - job-run-end:cancelled
    note: workflow_start 줄이 instance 끝 상태에 맞춰 닫히는 것

  - path: packages/core/always-on/always-on_test.ts
    covers:
      - always-on-set:unavailable
      - always-on-set:turned-on
      - always-on-reconcile:skipped
      - always-on-reconcile:kept
      - always-on-reconcile:reregistered
      - always-on-reconcile:unregistered
    note: "fake OS port로 센다. 개발 core(port 없음)는 켜기를 unavailable로 거절하고 file을 쓰지 않는다. 다른 기계의 always-on.json은 꺼짐으로 읽혀 register·hold 없이 항목이 있을 때만 unregister하고 file을 덮지 않는다. file 없는 root는 OS를 부르지 않는다. start_at_login registered는 port가 registered를 답했을 때뿐이고 등록 실패에도 표시는 남는다. 맞추기는 off_in_system을 다시 켜지 않고 빠진 등록은 다시 쓴다"
  - path: packages/core/main/daemon/entry-layout_test.ts
    covers: []
    note: "packages/shell이 있는 저장소 layout(개발, test, boot의 core)은 설치 layout이 아니라 core 입구가 OS port를 만들지 않는다. 개발 core가 사람의 OS에 시작 항목을 등록하지 않는 경계다"
  - path: packages/core/always-on/os/os_test.ts
    covers: []
