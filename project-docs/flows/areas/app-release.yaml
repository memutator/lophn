area: app-release

flows:
  # ---------- release 준비 ----------
  - id: release-prepare
    title: 앱 source의 지금 commit으로 release를 준비한다
    actor: agent
    entries: [route:releases/prepare]
    uses: [route:releases/record]
    pre: [route:apps/connect_source]
    boundary: [app-releases, app-data, child-supervision-protocol]
    code:
      - packages/core/apps/control.ts
      - packages/core/apps/releases/prepare/
      - packages/core/apps/releases/worker/
      - packages/core/main/app-supervisor/release-runner.ts
    steps:
      - "core가 부른 쪽이 앱 workspace의 session인지와 범위를 본 뒤, 범위 밖·보관 앱은 not_found, source 없음은 failed-build로 답한다. 이어서 git HEAD commit을 읽는다"
      - "core가 준비 자식을 띄우고 완료를 기다린다(상한 준비 시간 + 60초, 넘으면 취소하고 failed-build)"
      - "준비 자식이 commit의 파일을 뽑아 화면 build와 선언 추출을 하고, 봉인 사본을 만든다. 실패 단계는 build·dependencies·migration이다"
      - "core가 봉인 사본을 preview 자리에 띄워 선언과 등록된 handler가 맞는지 본다(실패면 failed-handlers)"
      - "core가 선언과 manifest를 모아 release.record를 machine 자격으로 부른다(invalid_input이면 failed-release, 그 밖의 오류는 그대로 낸다)"
      - "준비가 끝나면 release 요약과 함께 이번 release가 지우는 공개 command·skill을 돌려준다. 검사 실패는 오류 code가 아니라 status failed로 돌아간다"
    outcomes:
      - id: prepared
        when: "release 행이 prepared로 생김. 같은 bundle이 이미 prepared면 그 release를 돌려준다"
        observe: [response, "ledger:releases", "disk:봉인된 bundle 사본"]
      - id: failed-build
        when: "source 폴더 없음, git으로 HEAD를 못 읽음(git 실패 포함)이나 HEAD가 commit이 아님, 준비 기한 초과, supervisor 재시작으로 준비를 잃음, build 단계 실패"
        observe: [response]
      - id: failed-dependencies
        when: "준비 자식의 의존성 단계 실패"
        observe: [response]
      - id: failed-migration
        when: "준비 자식의 migration 검사 실패(버리는 DB에 backup 뒤 단계 적용)"
        observe: [response]
      - id: failed-handlers
        when: "봉인 사본을 띄운 probe(preview check)가 ready가 아니라고 답함. 선언과 handler가 어긋남(reason에 빠진 tool과 더해진 tool), probe 자식이 죽음, 45초 안에 ready가 안 됨, bundle을 열지 못하거나 없음. 모두 오류가 아니라 이 status다"
        observe: [response, "process:preview 검사 자식(띄웠다가 ready 확인 뒤 끈다)"]
      - id: failed-release
        when: "release.record가 invalid_input으로 거절. 선언 검증·hash·manifest 불일치, manifest 의존 목록 불일치, 필요한 SDK·@me permission 누락, 미발행 @me 판, migration 단계 연결 끊김, facts나 release 행 모양 오류"
        observe: [response]
      - id: conflict
        code: conflict
        when: "같은 앱의 준비가 이미 돌고 있다. release.record가 준비 중에 보관된 앱을 conflict로 거절한 것도 여기로 낸다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "credential의 operation이나 앱 조건이 이 앱과 맞지 않음(createTargetAuthorizer가 낸 forbidden 그대로). release.record가 machine 범위 밖이라 forbidden으로 거절한 것도 여기로 낸다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "없는 앱, 범위 밖 앱(app 조건이 어긋나 authorizer가 낸 not_found 포함), 보관한 앱"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "준비 조립이 붙지 않음(activation·data root·preview service 없음), machine credential 없음, 앱 사실을 ledger에서 못 읽음, supervisor 통로 실패(준비 시작·상태 읽기·취소가 err), probe 자식을 띄우지 못함(check가 err), 봉인 실패, bundle 사본·선언 파일·migration 파일을 못 읽음, release.record 호출을 낼 수 없거나 unavailable로 답함"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    refs: [A5, A7, A21]
    docs: [architecture/activation.md, architecture/package.md]
    unclear:
      - "failed-release의 invalid_input 사유가 여러 가지라 한 outcome에 묶었다. 사유별 test가 필요하면 나눈다"
      - "probe가 ready가 아닌 이유(선언 어긋남, 자식이 죽음, 시간 초과, bundle 없음)를 failed-handlers 한 outcome에 묶었다. reason 문구로 구별한다"

  - id: release-record
    title: 검사를 마친 봉인 사본을 prepared release로 확정한다
    actor: system
    entries: [route:releases/record]
    boundary: [app-releases]
    code:
      - packages/core/apps/releases/commands.ts
      - packages/core/apps/releases/store.ts
      - packages/core/apps/releases/sdk-permissions.ts
      - packages/core/apps/packages/store.ts
    steps:
      - "machine 자격이 아니면 forbidden이다. 없는 앱과 범위 밖 앱도 forbidden이다"
      - "보관한 앱이면 conflict다"
      - "선언을 검증기로 다시 검사하고 canonical hash, manifest hash, bundle 안 declaration.json이 선언과 맞는지 본다"
      - "선언의 sdk_dependencies가 bundle manifest의 의존 목록과 같은지 본다. 다르면 invalid_input이다"
      - "@me 의존마다 publish된 판의 permission을 찾아 선언이 덮는지 보고, 빠지면 invalid_input이다"
      - "migration 단계가 끊김 없이 release의 data_schema까지 이어지는지 본다"
      - "같은 bundle의 prepared release가 있으면 새로 만들지 않고 그것을 돌려주고(제거될 공개 command·skill 목록도 같이 준다), 없으면 release 행과 선언 사실(facts)을 한 tx에 넣는다"
    outcomes:
      - id: recorded
        when: "새 prepared release 행을 넣었다"
        observe: ["ledger:releases", response]
      - id: existing
        when: "같은 bundle의 prepared release가 이미 있어서 그 행을 돌려줬다. 새 행은 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니거나, 없는 앱이거나 앱이 범위 밖이다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "보관한 앱이다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "선언 검증·hash·manifest 불일치, manifest 의존 목록 불일치, permission 누락, 미발행 @me 판, migration 단계 연결 끊김, facts나 release 행 모양 오류 중 하나"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "앱 사용처를 읽지 못함(removed public tool·skill 계산이 낸 unavailable 그대로)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 앱·판·release 행을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [A5, A7]
    docs: [architecture/activation.md, architecture/package.md]

  # ---------- activation 판정과 시도 ----------
  - id: release-activate
    title: 준비한 release를 운영 앱으로 올린다
    actor: agent
    entries: [route:releases/activate]
    uses:
      - route:activations/ask_consent
      - route:activations/start
      - route:activations/record_backup
      - route:activations/record_data_change
      - route:activations/record_data_restore
      - route:activations/complete
      - route:activations/fail
      - route:activations/report
      - route:apps/record_unavailable
    pre: [release-prepare:prepared]
    boundary: [app-releases, app-runtime, app-data]
    code:
      - packages/core/apps/control.ts
      - packages/core/apps/releases/activation/
    steps:
      - "범위와 release 상태를 본다. 없으면 not_found, 범위 밖 credential이면 forbidden 또는 not_found, prepared가 아니면 conflict, 이 앱에 시도가 돌면 conflict다"
      - "선언 비교로 첫 activation, 늘어난 바깥 자원, 늘어난 다른 앱 tool, data 손실 migration이 있는지 본다"
      - "있으면 activation.ask_consent로 동의 줄을 쓰고 waiting-consent를 바로 돌려준다. 시작은 허락 뒤 activation-sweep이 한다"
      - "없으면 activation.start로 시도를 열고 앱마다 하나인 driver에 넣는다. 시도는 호출 접수 닫기·비우기, 이전 자식 종료 확인, 실제 DB 읽기, 필요하면 backup과 migration, 준비 모드 시작, complete, 접수 재개 순서다"
      - "실패하면 종료를 확인하고 backup을 복원한 뒤 activation.fail로 닫고 이전 release를 다시 띄운다. 복원이나 종료를 확인하지 못하면 닫지 않고 앱을 붙든 채 둔다"
      - "시도의 끝을 120초까지 기다려 active·failed를 돌려주고, 넘으면 running을 돌려준다"
      - "기다리지 않은 시도가 끝나면 driver가 activation.report로 release를 만든 session에 알린다"
    outcomes:
      - id: active
        when: "complete가 commit됐다. 응답에 previous_release를 싣는다"
        observe: [response, "ledger:releases", "ledger:apps", "ledger:notices", "process:앱 자식(준비 모드에서 업무 모드로)"]
      - id: failed
        when: "시도가 실패로 닫혔다(status failed). failure의 code는 drain_failed(호출 접수를 비우지 못함), schema_changed(앱 DB를 못 읽음, 무결성 없음, 출발 schema에서 가는 길 없음), backup_failed(복구본을 못 만듦), migration_failed(migration 단계가 되돌아감), start_failed(새 앱이 준비 모드에서 ready가 안 됨, 끊긴 시도를 이어받아 닫은 경우 포함), commit_rejected(activation.complete가 거절) 가운데 하나. restore_failed는 failure code가 아니다(복원 실패는 running이다)"
        observe: [response, "ledger:releases", "ledger:notices"]
      - id: waiting-consent
        when: "첫 activation, 선언이 넓어짐, data 손실 migration 가운데 하나"
        observe: [response, "ledger:activation_consents", "event:ActivationConsentRequested"]
      - id: running
        when: "120초 안에 끝나지 않음. 시도는 core 안에서 이어지고 release는 activating이다. 종료·복원·실패 기록을 확인하지 못해 앱을 붙든 채 멈춘 경우도 여기로 간다(termination_unconfirmed, restore_failed, restore_not_recorded, schema_unconfirmed, fail_not_recorded, core_unreachable)"
        observe: [response, "ledger:releases"]
      - id: conflict
        code: conflict
        when: "release가 prepared가 아님(superseded 포함), 이 앱에 시도가 돌고 있음(큐 확인과 등록 사이 포함), 시작이 안 됨(activation.start가 거절해 release가 prepared로 남음, 보관한 앱 포함)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "release가 없거나 범위 밖(app 조건이 어긋나 authorizer가 낸 not_found 포함)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "credential의 operation이 release.activate를 허락하지 않음(createTargetAuthorizer가 낸 forbidden 그대로)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "activation 조립이 없음, supervisor 통로가 안 열림, 시도 뒤 release를 못 읽음, ledger 연결 실패로 비교·동의 줄 쓰기가 unavailable로 답함(machine credential 없음, commands 없음 포함)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 release·선언 행을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: true
    risk: [data-loss, permission]
    refs: [A9, A10, A11, H2, E3, E6]
    docs: [architecture/activation.md]
    unclear:
      - "waiting-consent와 시도 실행을 한 flow에 묶었다(rule 4 검토). 입구가 같은 일을 하는 것으로 봤다. 나누면 ask 쪽은 activation-ask-consent가 맡는다"
      - "running의 복원·종료 실패 code(restore_failed 등)는 release.failure에 남지 않는다. 사람이 보는 실패 이유가 어디서 나오는지 확인할 것"

  - id: activation-ask-consent
    title: 선언이 넓어진 release의 동의 줄을 쓴다
    actor: system
    entries: [route:activations/ask_consent]
    pre: [release-prepare:prepared]
    boundary: [app-releases]
    code:
      - packages/core/apps/releases/commands.ts
      - packages/core/apps/releases/activation/consents.ts
      - packages/core/apps/releases/activation/handler.ts
    steps:
      - "driver가 machine 자격으로 부른다. 사람이 부르는 길은 없다. machine이 아니면 forbidden이다"
      - "prepared release만 받는다. 아니면 conflict다"
      - "같은 release에 같은 비교의 줄이 이미 있으면 아무것도 바꾸지 않는다"
      - "줄이 없거나 비교가 달라졌으면 줄을 쓰거나 덮어쓰고(허락 표시는 지운다) 같은 tx에서 ActivationConsentRequested를 낸다"
    outcomes:
      - id: requested
        when: "줄을 새로 쓰거나 비교가 달라 덮었다"
        observe: ["ledger:activation_consents", "event:ActivationConsentRequested"]
      - id: unchanged
        when: "같은 비교의 줄이 이미 있다. created가 false다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "release가 prepared가 아니다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니거나(사람이 부른 경우 포함) 범위 밖 release다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "권한 판정 port가 답하지 않음(조립 누락)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 release·앱 행을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [A11, E6]
    docs: [architecture/activation.md]

  - id: activation-consent
    title: 사람이 activation 동의를 허락하거나 거절한다
    actor: person
    entries: [route:activations/consent]
    pre: [release-activate:waiting-consent]
    boundary: [app-releases, approvals]
    code:
      - packages/core/apps/releases/commands.ts
      - packages/core/apps/releases/activation/consents.ts
      - packages/core/approvals/share-requests/
      - packages/core/main/daemon/wiring/share-requests.ts
    steps:
      - "사람 자격이 아니면 forbidden이다. release가 없거나 범위 밖이어도 forbidden이다"
      - "대기 줄의 requested_at이 compare 값과 같을 때만 본다. 줄이 없거나 다르면 conflict다. 사람이 본 것이 아니다"
      - "허락이면서 share_requested_at이 있으면 같은 tx에서 앱 공유 요청을 먼저 승인한다. 승인이 conflict(요청이 지금 열린 것과 다름)나 다른 오류로 실패하면 tx째 되돌아가 동의는 대기로 남는다"
      - "허락은 allowed_at으로 표에 남기고(시작은 activation-sweep이 한다), 거절은 줄을 지운다. release는 prepared로 남는다"
      - "두 경우 모두 commit 뒤 ActivationConsentClosed를 낸다"
    outcomes:
      - id: allow
        when: "허락. 같이 본 공유 요청이 있으면 그것도 승인된다"
        observe: ["ledger:activation_consents", "ledger:share_requests", "event:ActivationConsentClosed"]
      - id: reject
        when: "거절. 줄을 지운다"
        observe: ["ledger:activation_consents", "event:ActivationConsentClosed"]
      - id: conflict
        code: conflict
        when: "줄이 이미 결정됐거나 닫힘, requested_at이 다름(사람이 본 것이 아님), 공유 요청이 지금 열린 것과 다름(승인의 conflict)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격이 아니거나 release가 없거나 범위 밖"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "권한 판정 port가 답하지 않음(조립 누락), 공유 승인 적용이 conflict 밖의 오류로 실패함(tx째 되돌아가 동의는 대기로 남는다)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 release·앱 행을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [A11, E6, H2]
    docs: [architecture/activation.md, architecture/approval.md]
    unclear:
      - "공유 승인 적용(applyApproval)이 conflict 밖에 낼 수 있는 code가 무엇인지 확인하지 못했다. 지금은 unavailable로 적었다"

  - id: activation-start
    title: activation 시도 하나를 연다
    actor: system
    entries: [route:activations/start]
    pre: [release-prepare:prepared]
    boundary: [app-releases, app-data]
    code:
      - packages/core/apps/releases/commands.ts
      - packages/core/apps/releases/activation/state.ts
    steps:
      - "machine 자격을 본다. machine이 아니면 forbidden이다. release가 없거나 범위 밖이어도 forbidden이다"
      - "보관한 앱, prepared·superseded가 아닌 release, 이 앱의 진행 중 시도는 conflict다"
      - "superseded release(이전으로 돌아가기)는 지금 활성 release와 data schema가 같을 때만 연다. 다르면 invalid_input이다"
      - "release를 activating으로 바꾸고 시도 id와 이전 release를 기록한다. 같은 앱의 동의 줄은 모두 cancelled로 닫고 지운다"
      - "activation_requests 행을 지운다(이전으로 돌아가기 요청이 여기서 소비된다)"
    outcomes:
      - id: started
        when: "시도가 열렸다. attempt id와 previous_release를 돌려준다"
        observe: ["ledger:releases", "ledger:activation_consents", "event:ActivationConsentClosed"]
      - id: conflict
        code: conflict
        when: "보관한 앱, release 상태가 안 맞음, 이 앱에 시도가 이미 있음"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "이전 release의 data schema가 지금 활성 release와 다르다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니거나, release가 없거나 범위 밖(모두 forbidden)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "권한 판정 port가 답하지 않음(조립 누락)"
        observe: [response]
      - id: internal
        code: internal
