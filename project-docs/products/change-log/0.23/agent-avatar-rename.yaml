id: agent-avatar-rename
version: 0.23.127
title: agent 정의의 `profile` 칸을 `avatar`로 바꾼다
modules: [packages/protocol, packages/core/lophn-agent, packages/core/main, packages/shell/main, packages/shell/renderer, packages/shell/ipc, packages/cli, packages/design, packages/mobile, tools]
change: |
  - agent 정의의 그림 칸(character shape·color나 올린 이미지)의 이름이 `profile`에서 `avatar`가 됐다. 정의 file(`agents/<id>.md`)의 frontmatter 키, `agents/*` route의 정의·명함·effective 값, `agent create|update` CLI 입력, event가 같은 이름을 쓴다. 옛 이름 읽기는 없다.
  - 이미지 byte route의 resource가 `profile-images`에서 `avatar-images`로 바뀌었고 upload 답은 `{avatar: {kind: "image", image}}`다. 이미지 file은 처음부터 `agents/<id>/avatar.<ext>`라 옮긴 것이 없다.
  - 저장된 정의는 data step `agents.avatar`가 기동 때 frontmatter 최상위의 `profile:` 키 한 줄을 `avatar:`로 옮긴다(`agent-handle` wiring의 `dataSteps` 끝, 정의를 schema로 읽는 다른 step보다 앞). 값(들여쓴 줄)과 나머지 bytes는 그대로이고 다시 돌려도 같다. ledger 표와 `settings.json`에는 이 칸이 없어 옮길 것이 없다.
  - 코드 이름도 따라 바꿨다: protocol `agent-avatar.ts`(`AgentAvatar`, `avatarSchema`, `CharacterAvatar`), core `avatar-asset.ts`, renderer의 `Avatar` component prop은 `look`(`AvatarLook`)이다. 편집기 heading과 안내의 i18n 키는 `agent-editor-avatar`, `agents.notice.avatar-help`다. flow id `agent-profile-image-*`와 `lophn-profile`은 `agent-avatar-image-*`, `lophn-avatar`가 됐다.
  - 폰 앱(`packages/mobile`)이 core 행에서 읽는 칸과 자기 `Face`·`Who` 이름도 `avatar`·`look`으로 바꿨다. 폰 앱은 root check 밖이라 typecheck·test는 돌리지 못했다.
  - 바꾸지 않은 것: browser profile(`browser_profile`, `bpf_`, `shell.browser_profiles`, `logins.json`의 `profile`), provider의 구독 client profile, 정의 전체를 가리키는 "agent profile" 화면·roadmap 이름.
why: |
  "profile"이 세 가지를 뜻했다: 정의 전체(agent profile 화면), browser profile(로그인 정체성), 그림 칸. 그림 칸이 `avatar`가 되어 말이 하나씩 맞는다. roadmap agent-profile의 첫 단계다.
decisions:
  - text: >-
      칸 이름은 `avatar`로 하고 옛 `profile` 읽기를 두지 않는다. 저장된 정의는 data step 하나로 옮긴다. 버린 길: 두 이름을 모두 받기(호환 장치를 만들지 않는 규칙, 옛 이름이 저장 file에 남는다). roadmap agent-profile이 정한 이름이다.
    by: agent
  - text: >-
      renderer의 `Avatar` component 이름은 그대로 두고 그림 값을 받는 prop을 `look`으로, 그 값의 type을 `AvatarLook`으로 했다. `<Avatar avatar={...}>`는 읽기 어렵고 component 이름을 바꾸면 영향이 더 크다. protocol의 type은 component와 부딪히지 않게 `AgentAvatar`다.
    by: agent
  - text: >-
      data step은 YAML을 다시 쓰지 않고 frontmatter 안 `profile:`로 시작하는 줄만 고친다. 기존 `agents.runtime-custom`과 같은 방식이라 주석·순서·본문이 한 byte도 바뀌지 않는다. 값이 들여쓴 줄이라 키 줄만 바꾸면 충분하다.
    by: agent
checklist:
  - Agents 탭에서 기존 agent의 그림(character나 올린 이미지)이 그대로 보이는지 본다
  - Agents 탭에서 agent의 Avatar(Who 탭)를 바꿔 저장하고 다시 열어도 남는지 본다
