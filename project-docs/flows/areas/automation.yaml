        observe: [disk:workflow-folder, event:WorkflowRenamed, response]
      - id: conflict
        code: conflict
        when: 대상 이름이 이미 존재한다
        observe: [response]
      - id: not-found
        code: not_found
        when: 원래 workflow가 없다
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/workflow.md]

  - id: workflow-delete
    title: project 안의 workflow를 삭제하고 실행 중 instance·job·참조 정리를 처리한다
    actor: person
    entries: [route:workflows/delete]
    boundary: [workflows, core-api]
    code: [packages/core/workflows/service.ts, packages/core/main/daemon/wiring/workflows.ts]
