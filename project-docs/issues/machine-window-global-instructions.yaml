id: machine-window-global-instructions
title: "Settings에서 다른 컴퓨터를 고르면 Agents의 그 컴퓨터 global instructions를 읽고 쓰지 못한다"
kind: bug
status: fixed
topic: remote
modules: [packages/shell/renderer]
now: |
  Settings 왼쪽 위의 기계 고르기에서 다른 컴퓨터를 고르면 Agents 항목이 선다(`MACHINE_PANES`). 그 안의 global instructions는 이 컴퓨터 shell main의 통로(`lophnInstructions`, `lophnFiles`, `packages/shell/renderer/workspace/agents/core-extensions.ts`)로 file을 읽고 쓴다. 다른 컴퓨터의 묶음(`packages/shell/renderer/desktop/machines/data.ts`의 `otherMachineData`)은 `local = { instructions: undefined, files: undefined }`로 이 통로를 비워 두므로 그 컴퓨터의 global instructions는 읽기·쓰기가 되지 않는다.
impact: |
  화면 없는 기계를 다른 컴퓨터의 Settings에서 처음 설정할 때 agent의 global instructions를 고칠 수 없다(그 기계의 터미널에서 file을 고쳐야 한다).
fix: |
  그 기계의 global instructions를 읽고 쓰는 core route를 두고 화면이 shell 통로 대신 그것을 부른다. 사람 route 목록(`packages/protocol/remote/allowlist.ts`의 `REMOTE_PERSON_ROUTES`)에 더한다.
closed: |
  instructions/read_global·write_global(base_hash 낙관적 잠금)을 core route와 REMOTE_PERSON_ROUTES에 추가하고 Settings › Agents 지침 편집기가 이를 쓰게 했다.
guard: packages/core/lophn-agent/instructions/global_test.ts, packages/core/remote/forwarded_test.ts
