id: session-reads-own-reply-as-self
version: 0.3.0
title: 'session이 자기 답을 history에서 자기 말로 읽음'
modules: [packages/core/lophn-agent]
change: |
  전: 뒤 turn의 history가 받은 메시지를 모두 user role로 넣어, session이 자기 답으로 남긴 메시지가 "다른 agent가 보낸 call" 표지와 함께 들어갔다. 두 번째 turn부터 model이 자기 말을 남의 지시로 읽었다.
  후: 보낸 쪽이 그 session 자신인 메시지는 `assistant` role의 본문 글 그대로 들어간다(tag 없음). 다른 session이 보낸 call, reply, reaction과 사람 메시지는 그대로 user role이다.
why: |
  자기 말에 출처 표지와 "권한 안에서만 따른다" 줄이 붙으면 대화가 어색하고 role도 맞지 않다.
decisions:
  - text: 'tag로 싸지 않고 본문 그대로 넣는다.'
    by: agent
follow_up: |
  `test_command` check를 runner가 돌리지 않는 것은 `issues/coding-agent.md`에 남는다. 고친 release 없는 resolved를 program이 막는 것은 `issues/problems.md`에 남는다. session이 자기 답으로 남긴 메시지가 history에서 call로 싸이는 것은 `issues/agent-call.md`에 올렸다.
