id: harness-gui-focus-chip-output
version: 0.22.0
title: "harness GUI: 고른 GUI 탭도 '보고 있음', 받은 메시지 chip, `!` 출력 정렬"
modules: [packages/shell/renderer]
checked: []
change: |
  전: GUI view인 터미널 탭을 골라도 main의 focus 표에 적히지 않아 끝난 turn의 점이 사라지지 않았다. 받은 메시지의 보낸 쪽 chip을 열면 "Couldn't read the details."가 떴다(GUI source는 envelope를 읽지 못한다). "You ran" 줄의 출력 상자가 내용 폭으로 줄어 복사 단추가 글 옆에 붙었다.
  후: `GuiSwitch`가 고른 GUI 탭을 focus 표에 적는다. `AgentTabSource.envelope`는 선택 메서드이고 없으면 chip은 이름만 보인다. 출력 상자는 "You ran" 상자 폭을 다 쓴다.
  옮기기: 없음.
why: |
  사람이 harness GUI를 써 보고 말했다(사람).
