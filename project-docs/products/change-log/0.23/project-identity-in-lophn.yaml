id: project-identity-in-lophn
version: 0.23.115
title: project의 기계를 넘는 id를 사람의 저장소에서 lophn으로 옮기고 같은 저장소를 내 컴퓨터들 사이에서 자동으로 맞춘다
modules: [packages/core/projects, packages/core/main, packages/core/folder, packages/protocol, packages/protocol/folder, packages/cli, packages/shell/renderer, packages/shell/main, packages/shell/preload, packages/sdk, packages/design, packages/core/agent-workspaces, packages/core/apps]
change: |
  - 전: git project가 다른 컴퓨터에서 같은 project가 되는 길은 저장소에 commit한 `.lophn-project.json`(`pri_`)뿐이었다. 등록 dialog의 "Same project on my other computers" 줄, 상세의 [Set up]·[Restore]·[Resolve], `lophn project share`, file 상태 일곱이 그것을 만들고 보였다. file이 없는 git project는 `identity`가 null이었다.
  - 후: 모든 project는 등록할 때(`project.create`) ledger에서 `pri_`를 받는다. clone은 다른 컴퓨터의 id를 들고 와 그 id로 등록한다(입력 `identity`는 clone 자격만, 이 기계의 다른 project가 지금이나 옛 identity로 가지면 `conflict` `identity_in_use`). lophn은 사람의 저장소를 읽거나 쓰지 않는다. 이미 commit된 file은 그대로 둔다.
  - 컴퓨터마다 기계 기록 `record.json`에 칸 `projects: [{identity, remote_key, separated}]`(active git project, 512개, key 256자까지)를 싣는다. link·폰·같이 보는 폴더로 간다. core가 명단의 다른 컴퓨터의 목록을 보고, 같은 remote key의 project가 양쪽에 하나씩이면 작은 id로 바꾼다(machine command `project.match_identity`, 계산한 뒤 바뀌었으면 `conflict`). 계기: 다른 기계의 기록이 들어옴, 이 기계의 project 목록이 바뀜, 기동 뒤.
  - [Separate project](`project.renew_identity`)는 ledger만 쓰는 command가 되었고 새 id와 함께 `separated`를 켠다. 나눈 project는 어느 컴퓨터에서도 자동 match에 들지 않고, 나눈 project의 id를 가진 project(clone한 것)도 나눈 것이 된다.
  - 지운 것: route `project.create_identity`, CLI `lophn project share`, file 상태(`none`·`committed`·`uncommitted`·`ignored`·`conflict`·`missing`·`unreadable`), `duplicate_of`, clone의 `different_project`와 `note`, `matchProjects`. 바뀐 것: `project.identity` 출력 `{project, identity, repo, folder, found, remote, separated, same_repository}`, `project.match` 출력 `{found, repo, remote, same_repository}`, `project.record_identity` 입력에서 `file_identity`를 뺐다(identity를 바꾸지 않는다). `ProjectRecord`에 `separated`, `identity`는 null이 없다.
  - 저장: data step `projects.identity-for-all`(id 없는 모든 project에 id), schema step `projects.registry.separated`.
  - 화면: 등록 dialog는 같은 저장소의 project가 이 컴퓨터에 있으면 한 줄로 알린다. 상세와 project 설정 page의 "Other computers" 줄은 저장소로 맞춰짐(⋯ menu의 [Separate project]), 같은 저장소가 이 컴퓨터에 둘([Separate project]), 나눔, remote 없음, git이 아님을 보인다. ⋯ menu가 Tooltip에 싸여 열리지 않던 것을 고쳤다.
  - SDK `@lophn/app-ui` 2.24.0: `Project.identity`와 `PlaceWorkspace.identity`가 `string`이다. guide와 앱 template의 key 규칙이 `identity ?? id`에서 `identity`로 바뀌고, identity가 자동 match로도 바뀐다고 말한다(`migrate-sdk` 메모 `app-ui-2.24.0.md`). 창이 아직 project를 읽지 못한 동안 열린 앱 화면은 workspace 없이 열린다.
why: |
  사람의 말(2026-11-21): "프로젝트 id 확보하는 거를 git을 통해서 하던데, 난 이게 좀 반대인게 만약에 public하고 여러 명이서 쓰는 프로젝트면 지 혼자 쓰는 lophn 때문에 파일을 커밋하고 그러는 게 말이 되나?", "자동". 옛 설계 때는 git만 기계를 건넜고 지금은 컴퓨터 사이 link와 `computers` 폴더가 있다. file이 없는 git project는 앱 data와 mail이 가리킬 id가 없었다. roadmap `project-identity-in-lophn`.
decisions:
  - text: 기계를 넘는 id를 사람의 저장소에 두지 않고, lophn은 누구에게도 file을 commit하라고 하지 않는다.
    by: person
  - text: git project는 내 컴퓨터들 사이에서 묻지 않고 자동으로 맞춘다.
    by: person
  - text: >-
      같은 remote key의 project가 양쪽에 하나씩이면 같은 project이고 작은 id(먼저 만든 것)로 모인다. match는 core가 한다. 모든 project는 등록할 때 ledger에서 id를 받고, clone은 id를 들고 간다. 옛 file 길과 그 route·CLI·화면·flow·test는 호환 장치 없이 지운다. file에서 온 ledger id는 그대로 원본이다.
    by: agent
  - text: >-
      목록은 기계 기록 `record.json`의 칸 `projects`로 보낸다. 기록은 이미 모든 destination에 쓰이고 `computers`의 것은 link·폰·같이 보는 폴더로 가서 같은 때 켜지지 않는 컴퓨터도 받는다. 버린 길: link에 따로 route(같은 목록에 길과 cache가 둘이 된다). 이름 붙인 destination에도 같은 내용을 쓴다: 받는 쪽은 destination을 건너 기계마다 가장 큰 revision 하나를 둔다.
    by: agent
  - text: >-
      나눈 표시를 ledger 칸 `separated`로 두고 기록에 싣는다. "자기 옛 id로 돌아가지 않는다"만으로는 나눈 것이 남지 않는다: 아직 맞춰지지 않은 셋째 컴퓨터가 더 오래된 id를 들고 오면 나눈 project도 그 id로 가고, 나눈 쪽의 시계가 늦으면 다른 컴퓨터가 새 id로 온다. 나눈 project는 어느 컴퓨터에서도 맞추지 않는다. 나눈 것을 다시 잇는 길은 두지 않는다(clone이 id를 들고 간다).
    by: agent
  - text: 한쪽에 같은 저장소의 project가 둘이면 맞추지 않는다(어느 쪽인지 모른다). 사람이 하나를 보관하거나 나누면 풀린다. 등록 dialog와 상세가 알린다.
    by: agent
  - text: >-
      자동 match는 이 기계의 다른 project가 지금이나 옛 identity로 가진 id로 바꾸지 않는다(`project.link_identity`의 `identity_in_use`와 같다). 명단의 컴퓨터가 보낸 목록만 쓴다.
    by: agent
  - text: >-
      앱이 받는 `identity`도 null이 없다(`@lophn/app-ui` 2.24.0, minor: 받는 type이 좁아질 뿐 옛 앱의 `identity ?? id`는 그대로 돈다). 지원 하한은 그대로다. 창이 project를 읽기 전에 열린 앱 화면은 틀린 key로 쓰지 않게 workspace 없이 연다.
    by: agent
follow_up: |
  계획 `machine-a2a`: `remoteWorkspaceOf`와 `handoff/write`의 "identity가 null이면 run lophn project share" 갈래, `identityOfProject`의 `Result<string | null>`, `mail-lists`의 nullable identity를 두 줄이 main에서 만날 때 지운다(lead).
checklist:
  - "해야: 앱을 다시 build한다"
  - project 상세(Workspaces panel의 project 상세나 project 설정 page)의 "Other computers" 줄이 git project면 "Matched by its repository on your other computers", 같은 저장소의 다른 project가 이 컴퓨터에 있으면 "<title> on this computer uses the same repository, so lophn matches neither", git이 아니면 "Not in git, so this project stays on this computer."를 보이는지 본다
  - 같은 저장소를 등록한 두 컴퓨터가 명단에 있으면 잠시 뒤 왼쪽 sidebar에서 두 줄이 같은 project로 묶이는지(also on) 본다
  - ⋯ menu의 [Separate project]를 누르면 확인 dialog가 서고, 확인하면 줄이 "Kept separate from your other computers"가 되는지 본다
  - 저장소에 남아 있는 `.lophn-project.json`은 lophn이 더 읽지 않는다. 필요 없으면 손으로 지워도 된다
