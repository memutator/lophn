  - id: instruction-read
    title: agent runtime이 session의 지침 file을 읽는다
    actor: system
    entries: [route:instructions/get]
    boundary: [agent-workspaces, core-api]
    code: [packages/core/lophn-agent/instructions/files.ts, packages/core/lophn-agent/instructions/read.ts]
    steps:
      - agent runtime child가 turn을 준비하며 층(global, home, project, app, agent)마다 instructions/get을 부른다(actor가 system인 것은 호출자가 core와 child process뿐이라서다)
      - core가 session을 찾고 층의 file을 연다. global은 data root의 LOPHN.md, home은 data root의 home 폴더, project는 project의 첫 폴더(없으면 데이터 자리) 아래에서 LOPHN.md를 먼저 열고 없으면 CLAUDE.md다. app은 앱 source 폴더의 AGENTS.md 하나다(source가 없으면 file null)
      - session의 workspace 종류가 아닌 층(home에서 project, app 등)은 file null이다. agent 층은 정의 file의 본문(frontmatter 뺀 것)이다
      - agent 자격은 자기 session만 읽는다
      - 32 KiB를 넘으면 처음 32 KiB와 실제 크기(size_bytes)를 준다. 상한을 넘는 것은 읽는 쪽이 turn을 멈춘다
    outcomes:
      - id: ok
        observe: [response]
        when: 파일을 줬거나 파일이 없어 file null이다
      - id: forbidden
        code: forbidden
        when: agent가 다른 session의 지침을 읽으려 했다
        observe: [response]
      - id: session-not-found
        code: not_found
        observe: [response]
      - id: unavailable
        code: unavailable
        when: 지침 file을 열지 못했다(폴더, 권한, 일반 file이 아님), 또는 agent 정의의 frontmatter가 닫히지 않았다, 또는 data root나 agent 정의 자리를 정하지 못했다
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    refs: [P8, P10]
    docs: [architecture/agent-definition.md]
    unclear:
      - 이 route는 내부 read라 부모 flow(turn 준비, prompt-assembly)가 uses로 가리켜야 한다. 그 flow는 turns area가 쓴다

  - id: instruction-global-edit
    title: 사람이 Settings › Agents에서 이 컴퓨터나 다른 컴퓨터의 전역 지침(LOPHN.md)을 읽고 쓴다
    actor: person
    entries: [route:instructions/read_global, route:instructions/write_global]
    boundary: [agent-workspaces, core-api]
    code:
      - packages/core/lophn-agent/instructions/global.ts
      - packages/core/main/daemon/wiring/lophn-agent.ts
      - packages/shell/renderer/desktop/settings/agents/core-source.ts
    steps:
      - Settings › Agents가 instructions/read_global로 data root의 LOPHN.md 글과 sha256 hash를 읽는다(파일이 없으면 빈 글과 null hash)
      - 사람이 저장하면 instructions/write_global에 새 글과 읽을 때 받은 base_hash를 보낸다. 다른 컴퓨터의 설정은 REMOTE_PERSON_ROUTES를 지나 그 컴퓨터 core로 간다
      - core가 쓰기를 직렬화해 지금 디스크의 hash와 base_hash가 같을 때만 임시 파일+rename으로 교체한다
    outcomes:
      - id: ok
        observe: [response]
        when: 전역 지침을 읽었거나 새 내용으로 저장했다
      - id: forbidden
        code: forbidden
        when: 터미널 입력 허락이 없는 기기나 screen 밖의 요청으로 불렀다
        observe: [response]
      - id: conflict
        code: conflict
        when: 읽은 뒤 디스크의 LOPHN.md가 바뀌어 base_hash가 맞지 않는다
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: 글 크기가 상한(256 KiB)을 넘는다
        observe: [response]
      - id: unavailable
        code: unavailable
        when: 전역 지침 파일을 읽거나 쓰지 못했다
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/agent-definition.md]

  - id: skill-new-app
    title: 사람이 /new-app으로 새 앱 시작 안내 skill을 부른다
    actor: person
    entries: [skill:new-app]
    uses: [route:messages/send, tool:skill.read]
    boundary: [agent-workspaces, agent-tools]
    code: [packages/core/agent-workspaces/skills/new-app/, packages/core/lophn-agent/extensions/skill-read.ts, packages/core/lophn-agent/tools/bundles/skill.ts]
    steps:
      - 사람이 composer에 /new-app과 글을 치면 core가 Use the "new-app" skill for this request.와 글을 한 사람 메시지로 접수한다(route:messages/send, next_turn)
      - 그 turn의 agent가 skill.read로 new-app 본문을 읽는다
      - reader가 이 session의 발견 목록에서 이름을 찾는다. home이 아니면 선언에 없어 그 turn의 skill 목록에 없어 forbidden으로 막힌다
      - 본문(frontmatter 뺀 것)을 tool 결과로 준다. 절차(질문, 견주기, 앱 등록, call)는 본문이 정한다
    outcomes:
      - id: loaded
        observe: [response]
      - id: not-available
        code: forbidden
        when: 이 workspace 종류에서 선언되지 않아 turn의 skill 목록에 없다. 전역이나 workspace 설정에서 끈 skill이면 판에서 꺼져 is turned off로도 막힌다
        observe: [response]
      - id: not-found
        code: not_found
        when: turn 목록에는 있었지만 판에 그 이름이 없다(첫 읽기 전에 사라졌다), 또는 path가 가리는 딸린 file이 없다
        observe: [response]
      - id: unavailable
        code: unavailable
        when: 본문을 온전히 읽지 못했다(frontmatter가 닫히지 않았거나 본문을 다 읽지 못했다)
        observe: [response]
    crosses_process: true
    docs: [architecture/agent-definition.md]

