id: toast-view-opens-other-project
version: 0.10.2
title: "알림 toast의 [View]가 다른 project의 터미널 탭으로 간다"
modules: [packages/shell/main, packages/shell/preload, packages/shell/renderer, packages/shell/ipc]
checked: []
change: |
  전: 터미널 coding agent 알림의 [View]는 지금 보이는 project 창에서 그 터미널 탭만 찾았다. 다른 project나 런처에 있으면 아무 일도 없었다. lophn Agent session 알림은 이미 그 session의 project로 갔다.
  후: main이 터미널이 속한 project를 함께 보내고(TerminalReveal.project), Desktop이 다른 공간이면 그 project로 이동해 탭을 고른다. 같은 project면 전처럼 store가 탭을 고른다.
  계약:
  - 바뀐 것: TerminalReveal에 project. Route.terminal, Workspace의 revealTerminal.
why: |
  터미널 알림의 [View]도 session 알림처럼 그 탭이 속한 project까지 가야 두 알림의 동작이 같다.
decisions:
  - text: "session 알림과 같은 길(Route 시작값)을 쓴다."
    by: agent
