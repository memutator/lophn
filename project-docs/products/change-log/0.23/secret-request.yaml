id: secret-request
version: 0.23.32
title: agent가 provider key와 앱 secret이 필요한 자리를 가리켜 사람에게 넣어 달라고 요청한다
modules: [packages/protocol, packages/core/lophn-agent, packages/core/main, packages/core/host-queue, packages/core/agent-workspaces, packages/cli, packages/coding-agent, packages/shell/main, packages/shell/renderer, packages/design]
change: |
  - 요청 모델 하나: `login_request/*` route가 `input_request/ask|read|cancel|hold|done`이 됐고 요청과 view에 `kind`(`login`, `secret`)가 붙었다. site login 요청(`lophn login request`)은 kind `login`으로 그대로 돈다. 결과에 `{stored: true}`가 더해졌다.
  - secret 자리 요청: `lophn ask secret --provider <정의 key>` 또는 `--name <secret> [--app <app id>]`. agent는 이름이 아니라 자리를 넘기고 core가 이름(`provider.<id>`, 앱이 선언한 이름), 대상 이름, 목적지(provider endpoint, 앱의 `net.fetch` grant), 이미 값이 있는지를 읽어 card에 보인다. provider 자리는 home session만, 앱 자리는 그 앱 session과 home session만 청한다. 모르는 정의·허락받지 않은 이름은 `not_found`, sign-in으로 연결하는 정의와 OAuth secret은 `invalid_input`.
  - 끝내기: 사람이 card의 [Enter]를 눌러 여는 보호 창은 설정 화면과 같은 한 칸이다. shell main이 `secrets/put` 뒤, 아직 연결되지 않은 provider면 `providers/connect`까지 보낸다. 연결이 실패하면 넣은 값을 지우고 agent에게 오류 code를 준다.
  - 대화 card가 login과 secret 두 종류를 그린다(`input-request-card`).
  - agent 지침: 공통 prompt의 "secret을 묻지 마라"가 "대화로 받지 말고 `lophn ask secret`·`lophn login request`로 요청하라"가 됐다. 앱 prompt는 API key를 Access 탭 안내 대신 요청으로, home prompt는 provider key와 앱 secret 요청을 말한다. coding agent의 `lophn-agent` skill에 같은 명령이 올랐다.
why: |
  설정은 agent가 바꾸게 되지만(`roadmap/config-surface.md`) secret이 걸린 일은 "Settings에 가서 넣으세요"라는 글로 끝났다. 앱을 짓는 agent는 `secret.use`를 선언한 뒤 값이 없어 막히고, 사람은 대화를 떠나 Access 탭을 찾아가야 했다. browser-vault가 만든 길(card → 사람이 누름 → 보호 창 → agent는 결과만)을 secret이 들어가는 자리로 넓혔다.
decisions:
  - text: "agent에게 여는 것은 요청뿐이다. 값은 보호 창으로만 들어오고 창은 사람이 card를 눌러야 열린다. `secrets/put`과 `providers/connect`는 계속 사람 자격만 받는다."
    by: agent
  - text: "agent는 secret 이름을 정하지 못하고 자리만 넘긴다. 버린 길: 이름을 받기(다른 자리의 값을 덮어쓰게 하거나 agent가 고른 목적지로 나가는 이름에 값을 넣게 한다)."
    by: agent
  - text: "home lophn은 모든 자리, 앱 agent는 자기 앱의 secret만, provider 연결은 home에서만 청한다. 사람에게 추천안으로 알리고 진행했다. 버린 길: home에서만 열기(앱을 짓다 key가 필요한 흐름이 그대로 끊긴다)."
    by: agent
  - text: "명령은 `lophn ask secret`이다. 버린 길: `lophn secret request`(새 명령 묶음 이름은 앱 slug 예약이 필요하고 예약 목록은 `@lophn/declaration`에 들어 있어 SDK 판을 올린다. `ask`는 이미 예약돼 있다)."
    by: agent
  - text: "대화의 대기 항목에 요청 전용 칸을 두지 않았다. 질문 내용이 없는 항목을 card가 `input_request/read`로 읽어 가른다. 버린 길: ACP pending에 종류 칸 더하기(ACP 상태는 `@lophn/agent`가 내놓는 type이라 SDK 판을 올리고 harness GUI adapter 넷을 같이 고친다)."
    by: agent
  - text: "이번에는 provider key와 앱 secret만 한다. MCP server 자리와 custom provider는 다음 단계다. MCP는 server가 전역·workspace·agent 정의 층에 걸쳐 있고 한 server가 secret 이름을 여럿 가져 자리 해석이 따로 든다."
    by: agent
follow_up: |
  - `roadmap/secret-request.md` 순서 2: MCP server 자리, custom provider, OAuth sign-in card, 값이 없어 실패한 호출이 빈 자리를 알리기, provider 오류 줄의 button.
checklist:
  - Home 대화에서 lophn에게 API key로 연결하는 provider(예 OpenRouter)를 연결해 달라고 하면 card에 endpoint가 보이고, [Enter]로 연 창에 key를 넣으면 Settings › Providers에 그 provider가 뜨는지 본다
  - 앱 대화에서 그 앱이 허락받은 secret을 요청하게 하면 card에 앱 이름과 목적지가 보이고, 값을 넣은 뒤 앱 상세 › Access에 "set"으로 보이는지 본다
