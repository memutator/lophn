  - id: app-grant-revoke
    title: "사람이 앱 grant를 거둔다"
    actor: person
    entries: [route:app_grants/revoke]
    boundary: [app-runtime]
    code: [packages/core/apps/permissions/commands.ts]
    steps:
      - "사람만 부른다. 없거나 범위 밖이거나 이미 거둔 grant는 같은 conflict로 답한다."
      - "앱의 마지막 process 사실이 AppStarted이면(AppStopped가 뒤에 없으면) unavailable로 막는다. 종료가 확인돼야 거둘 수 있다."
      - "확인되면 grant 행을 revoked로 바꾼다. event는 남기지 않는다. secret 값은 지우지 않는다."
    outcomes:
      - id: revoked
        observe: ["ledger:grants"]
      - id: not-active
        code: conflict
        observe: [response]
      - id: process-running
        code: unavailable
        when: "마지막 process 사실이 AppStarted임(자식 종료가 확인되지 않음)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [H2]
    unclear:
      - "process-running일 때 자식을 멈추는 주체가 코드에 없다. commands.ts 주석이 말하는 GrantApplier는 현재 코드에 없다. 실행을 끄면(app-execution-disable) reconcile이 멈추고 AppStopped가 남는다."
      - "예상 밖 종료, crash loop 멈춤, core 재시작 뒤에는 AppStopped가 남지 않는다. stopTracked는 자식이 없으면 record_stopped를 건너뛰므로 실행을 꺼도 마지막 사실이 AppStarted로 남아 revoke가 계속 unavailable일 수 있다(코드 읽기로 본 것이고 실행으로 확인하지 않았다). 화면의 revoking 상태가 이 경우를 어떻게 보이는지 확인이 필요하다."

  # ---------- secret과 OAuth ----------

  - id: app-secret-value
    title: "supervisor가 앱 외부 요청에 붙일 secret 값을 한 번 받는다"
    actor: system
    entries: [route:apps/secret_value]
    pre: [app-record-started:started]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/permissions/secret-value.ts, packages/core/apps/permissions/secret-allowance.ts, packages/core/apps/oauth/service.ts, packages/core/main/app-supervisor/secret-delivery.ts]
    steps:
      - "supervisor가 machine 자격으로 부른다. 부른 자식이 지금 보는 live 자식과 release, process nonce가 같아야 한다."
      - "목적지(scheme, host, port)를 확인한다. http는 loopback host만이다."
      - "OAuth secret이면 access token을 쓸 수 있게 한다. 만료 5분 전부터 발급자에게 refresh를 대기열로 부른다. 거절되면 token을 지우고 sign-in이 필요하다. 닿지 못했는데 token이 만료됐으면 unavailable이다."
      - "현재 선언 ∩ active grant로 secret.use와 목적지의 net.fetch 허락을 다시 판정한다. 아니면 forbidden이다."
      - "알려진 값 registry가 그 값을 알 때만 값을 응답 본문으로 준다. 값은 ledger, event, log, 오류에 남지 않는다."
    outcomes:
      - id: delivered
        observe: [response]
      - id: delivered-after-refresh
        observe: [response, "disk:secrets.json"]
      - id: refresh-rejected
        when: "발급자가 400, 401, invalid_grant로 refresh를 거절해 token을 지움"
        observe: ["disk:secrets.json"]
      - id: forbidden
        code: forbidden
        when: "부른 자식이 지금 live 자식이 아님, 목적지 잘못, grant 없음"
        observe: [response]
      - id: sign-in-required
        code: conflict
        when: "client id가 없음, 또는 OAuth 재인증이 필요함(oauth sign-in required)"
        observe: [response]
      - id: not-deliverable
        code: unavailable
        when: "값이 비었거나 registry가 모르는 값, 또는 발급자에 닿지 못하고 token이 만료됨"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
    crosses_process: true
    risk: [secret, permission]
    refs: [H10]
    docs: [architecture/app-call.md]
    unclear:
      - "OAuth 실패 이유(callback_timeout, refresh_rejected 등)는 메모리 map에만 있어 core가 다시 켜지면 사라진다(issues/app-call.md 첫 항목). sign-in-required의 이유 글도 같다."

  - id: app-broker-secret-use
    title: "앱 SDK가 secret을 외부 요청에 붙이려고 broker에 알린다"
    actor: app
    entries: [system:app-broker-secret-use]
    uses: [app-secret-value:delivered, app-secret-value:sign-in-required, sdk:cap-secret/useSecret]
    pre: [app-record-started:started]
    boundary: [app-capability, secrets]
    code: [packages/core/apps/permissions/broker/secrets.ts, packages/core/apps/permissions/broker/access.ts, packages/core/main/app-supervisor/secret-delivery.ts]
    steps:
      - "앱의 useSecret이 이름, 목적지(scheme, host, port), command, 입력 hash를 broker의 secrets/use에 보낸다. 값은 앱에 오지 않는다."
      - "운영 자식(live)이고 release가 지금 release와 같아야 한다. http는 loopback host만이다."
      - "현재 실행 범위(선언 ∩ active grant)에서 command가 release의 tool 목록에 있고 secret.use 허락이 있어야 한다. 없으면 forbidden(secret.use)이다."
      - "목적지가 net.fetch 허락(플랫폼 port 제외)에 들어야 한다. 없으면 forbidden(net.fetch)이다."
      - "알려진 값 등록을 확인하고 supervisor가 app-secret-value로 값을 받아 같은 invocation의 같은 (host, port) 요청에만 Bearer로 붙인다(60초). 앱에는 used만 돌려준다."
    outcomes:
      - id: used
        observe: [response]
      - id: refused-secret
        code: forbidden
        when: "secret.use 허락이 없거나 command가 tool 목록에 없음, 운영 자식이 아님"
        observe: [response]
      - id: refused-destination
        code: forbidden
        when: "목적지가 net.fetch 허락에 없음, http인데 loopback이 아님"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: sign-in-required
        code: conflict
        when: "OAuth secret의 sign-in이 필요함"
        observe: [response]
      - id: undeliverable
        code: unavailable
        when: "값을 알려진 값으로 등록하지 못함, 또는 전달 실패"
        observe: [response]
    crosses_process: true
    risk: [secret, sandbox, permission]
    refs: [H10]
    docs: [architecture/app-call.md]

