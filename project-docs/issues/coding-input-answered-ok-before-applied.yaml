id: coding-input-answered-ok-before-applied
title: coding session의 입력은 adapter가 받기 전에 성공으로 답해서, 겹친 입력이 두 번 되거나 말없이 버려진다
kind: bug
status: open
topic: harness-gui
modules: [packages/shell/main, packages/core/coding-relay, packages/protocol]
now: |
  기기가 보낸 coding session의 입력은 host(shell main)가 adapter에 넘기고 바로 성공으로 답한다(`packages/shell/main/terminal/coding-relay.ts`). adapter가 그 입력을 어떻게 했는지는 돌아오지 않는다. 그래서 세 가지가 생긴다.
  - 같은 승인이나 질문에 두 기기가 답하면, 늦은 쪽의 답은 adapter에서 대상이 이미 없어 버려지는데(`claude.ts`의 `closeApproval`, `closeQuestion`) 그 기기는 성공을 받는다.
  - `stop`이 turn id를 보지 않아(`claude.ts`) 늦게 도착한 멈추기가 그 뒤에 시작한 turn을 끊는다.
  - `retry`에는 key가 없고(`packages/protocol/acp/input.ts`), host의 답을 잃고 다시 보낸 `send`는 adapter가 message id로 거르지 않아 같은 말이 두 번 간다. relay의 중복 막기는 실패한 key를 지운다.
  lophn agent session은 같은 경우를 command의 `conflict`·`not_found`와 turn id, `retryIds`로 막는다.
impact: |
  두 기기가 같은 승인에 Allow와 Deny로 엇갈려 답하면 진 쪽은 자기 답이 된 줄 안다. 연결이 불안한 폰에서 다시 보내기를 누르면 coding agent에게 같은 지시가 두 번 가고, 늦은 멈추기가 새로 시킨 일을 끊는다.
fix: |
  - 중간(추천): host가 adapter의 결과를 기다려 답한다. adapter는 대상이 없는 답과 다른 turn의 멈추기에 `conflict`를 돌려주고, `send`와 `retry`는 message id와 key로 한 번만 받는다. adapter 다섯에 같은 규칙이 든다.
  - 작음: `retry`에 key를 주고 `stop`이 turn id를 보는 것만 먼저 한다.
