id: browser-control-release
version: 0.23.87
title: 멀리서 잡은 page는 잡은 기기가 떠나면 풀리고, 틀린 page frame 한 장이 host 연결을 닫지 않으며, host가 끊기면 browser 탭이 목록에서 빠진다
modules: [packages/protocol, packages/core/host-queue, packages/core/server, packages/core/main, packages/shell/main]
change: |
  - 멀리서 잡기(`page_view/control {held: true}`): 전에는 lease가 없어도 잡혔고 core가 누가 잡았는지 몰라, 보는 쪽이 떠나도(앱을 내림, 연결이 끊김, 기기를 뺌) agent의 act·navigate·evaluate가 누군가 그 page를 다시 열어 돌려줄 때까지 `conflict`였다. 이제 잡기는 그 탭을 보고 있어야 하고(없으면 `conflict`), core가 잡은 principal을 메모리에 든다. 그 기기가 보기를 끄거나(`watch {on:false}`), lease 기한이 지나거나, 더는 다룰 수 없게 되면(명단에서 빠짐, 터미널 입력 허락을 거둠. 5초마다 본다) core가 host에 `page_control {held:false}`를 보낸다. 그 기계의 화면에서 놓으면(`page_state` held false) 잡은 기록만 지운다. 돌려주기는 다룰 수 있는 기기 누구나 lease 없이 한다. 보는 쪽(폰, desktop Pages 탭)은 그대로다: 닫을 때 보내던 `watch {on:false}`가 이제 놓기도 한다.
  - `page_view/list`의 page마다 `held_by`(`"you" | "phone" | "computer" | null`): 멀리서 잡은 기기가 부른 기기 자신인가, 아니면 그 종류다. 화면은 아직 그리지 않는다(아래 follow_up).
  - `/host-link`: hello 뒤에 온 `page_frame`이 schema에 맞지 않으면(그림 상한을 넘음, 크기 0) 그 frame만 버리고 warn log(`host-link page_frame_invalid`)를 남긴다. 전에는 1008로 연결을 닫아 진행 중인 agent의 browser 호출이 모두 `unavailable`로 끝났다. host(desktop 앱, page host)는 상한(`PAGE_FRAME_MAX_BYTES`의 base64)을 넘거나 크기가 0인 screencast frame을 보내지 않고 ack만 한다.
  - host queue: `/host-link`가 닫히면 browser 탭을 모두 core 표에서 뺀다(`browser_pages`가 바뀐다). 전에는 shell이 없을 때 그 탭에 온 browser 호출만 탭을 뺐고, 그래서 host가 죽은 뒤 멀리서 보는 목록에 없는 page가 남았다.
  - 문서: page host는 core가 죽으면 desktop 앱처럼 다시 띄우고(`lophn core stop`이면 아니다) 60초 넘게 연결이 없을 때 끝난다는 것, desktop 앱에 물려줄 때 인자와 env를 page host가 만든다는 것과 그때 page가 닫힌다는 것을 `platform.md`·`browser-tab.md`에 바로잡았다. 이슈 `page-host-keeps-core-up`에 core를 다시 띄우는 것을 더했고, `worker-env-points-at-real-root`를 닫았고, `wayland-page-no-repaint-after-restore`를 올렸다.
why: |
  core-browser review: 멀리서 잡은 것이 보는 쪽의 lease와 무관해 화면 없는 기계의 browse job이 끝없이 멈출 수 있었고, 그림 한 장이 host 연결을 끊어 agent의 browser 호출을 모두 끝낼 수 있었고, desktop 앱이 죽으면 목록에 없는 page가 남았다.
decisions:
  - text: >-
      멀리서 잡은 것을 core가 풀고 보는 쪽은 따로 돌려주지 않는다. 보는 쪽이 닫을 때 이미 `watch {on:false}`를 보내고 core가 그때 놓으므로 같은 일을 두 번 하지 않는다. 앱이 죽거나 연결이 끊긴 때는 보는 쪽이 보낼 길이 없어 lease 기한이 푼다. 버린 길: 보는 쪽만 닫을 때 `control {held:false}`를 보내기(앱이 죽으면 가지 않는다).
    by: agent
  - text: >-
      잡기는 lease가 있어야 한다. 잡은 것이 묶일 lease가 없으면 풀 때를 정할 수 없다. 두 보는 쪽 모두 보는 동안에만 잡기 단추를 보이므로 사람이 잃는 것은 없다. 버린 길: lease 없는 잡기를 다음 주기에 풀기(잡자마자 풀린다).
    by: agent
  - text: >-
      허락을 거두거나 명단에서 뺀 기기의 잡기도 다음 주기(5초)에 푼다. 그 기기는 스스로 돌려줄 수 없다.
    by: agent
  - text: >-
      `held_by`는 기기 이름이 아니라 "you"와 기기 종류다. host-queue wiring이 읽을 수 있는 것은 `deviceKind`뿐이고 이름은 remote wiring의 명단에 있다. 이름이 필요해지면 그 늦은 칸을 더한다.
    by: agent
  - text: >-
      host 연결이 닫히면 browser 탭을 뺀다(shell 없는 호출에서 빼던 길은 지웠다). 같은 core에 host가 다시 붙어도 그 page는 core가 모르는 고아가 된다(core가 다시 뜰 때와 같다).
    by: agent
follow_up: |
  - 폰 Pages와 desktop Pages 목록이 `held_by`를 그리지 않는다. 문구(`packages/design/i18n/catalog/mobile-page.ts`, `remote-desk.ts`)가 이 일의 범위 밖이었다.
  - 다른 기기가 잡은 page를 열면 snapshot의 `held`만 보고 "You have control"이라 쓴다(누가 잡았는지 모른다).
