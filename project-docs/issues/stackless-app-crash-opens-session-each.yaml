id: stackless-app-crash-opens-session-each
title: "stack 없는 앱 crash가 crash마다 새 문제와 새 App Engineer session을 연다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/apps]
now: |
  `packages/core/problems/snapshots/work.ts`의 `observedErrorGroupKey`는 앱 frame 위치를 못 풀면 그 발생의 report id를 묶는 key로 쓴다. 앱 process 종료 관측(`packages/core/apps/runtime/observations/crash.ts`, `process_exit`)은 error·stack이 없어 늘 이 경우라, 같은 앱이 같은 release에서 같은 이유로 거듭 죽어도 묶이지 않는다. `ProblemOpened`마다 reaction이 App Engineer에게 `new_session`으로 가므로(`packages/core/events/reactor/session-opening.ts`) crash마다 session도 하나씩 열린다. view 오류(`observeViewErrorPayload`)도 같은 길이다. `tests/e2e/reaction-app_test.ts`를 만들며 찾았다.
impact: |
  crash loop 앱 하나가 10분 창에서 재시작이 멈출 때까지(`restart-policy.ts`의 `CRASH_LIMIT` 5) 문제 여섯과 App Engineer session 여섯을 열고, `AppRestartHalted`로 하나 더 연다. session마다 model 호출 비용이 든다. 사람의 문제 목록도 같은 crash로 찬다.
fix: |
  - (추천) stack 없는 관측은 관측 종류와 앱·release(`process_exit`이면 exit code나 signal까지)로 key를 만든다. `observedErrorGroupKey` 한 곳이다. 같은 문제의 다음 발생은 새 문제를 열지 않아 reaction도 없다.
  - 지금대로 두고 재시작 한도에 기댄다. 비용이 crash 수만큼 든다.
decide: |
  stack 없는 앱 crash를 무엇으로 묶을지(앱+release / 앱+release+exit code·signal).
closed: |
  앱 frame 위치를 못 푼 관측은 관측 종류·오류 이름·메시지·bundle hash의 hash로 묶는다(`observedErrorGroupKey`). 같은 release에서 같은 exit code나 signal로 거듭 죽으면 문제 하나다. 메시지에 시각이나 id가 섞인 view 오류는 여전히 따로 열린다.
guard: "packages/core/problems/snapshots/work_test.ts"
