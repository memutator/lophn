        observe: [ledger:agent_calls, ledger:messages, response]
        when: "답을 받는 session에 넣었다(delivered true), 받을 session이 없어 기록에만 남았다(delivered false), 또는 call이 이미 끝나 있었다(closed true)"
      - id: not_found
        code: not_found
        when: "call이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "core 안 machine이 아니거나 그 call의 보낸 쪽도 받는 쪽도 아니다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 call은 답을 받지 않는다(reply none)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "답 글 redaction이 끝나지 않았거나 blob 준비 경로가 없거나 준비가 실패했다(route 앞에서 막는다), 또는 router가 아직 없다"
        observe: [response]
    crosses_process: true
    refs: [R2]
    docs: [architecture/agent-call.md]
    declared_only: [internal]
    unclear:
      - "route가 internal을 선언하지만 handler는 internal을 만들지 않는다. 못 읽는 call 행은 not_found로 끝난다(선언을 고칠 곳)"

  - id: team-ask-open
    title: "팀 자식의 질문이나 shell 승인을 부모에게 result call로 연다"
    actor: system
    entries: [route:calls/ask-open]
    boundary: [router, approvals]
    code:
      - packages/core/router/commands.ts
      - packages/core/router/router.ts
      - packages/core/main/daemon/wiring/approvals.ts
    steps:
      - "approvals wiring이 자식의 turn request나 질문을 부모에게 물을 때 부른다(core 안 machine). machine이 아니면 forbidden이다."
      - "앞 단계가 질문 글을 redaction하고 blob으로 준비한다(끝내지 못하면 여기서 unavailable이다)."
      - "보낸 쪽 session의 call 정책과 팀 규칙(형제, 부모, 자기 밑)을 거른다. 받는 agent 명함이 입력 종류와 답 방식을 받지 않으면 거절한다."
      - "받는 session이 없거나 닫혔으면 call을 failed로 기록하고 돌려준다. 열리면 부모 queue에 call을 넣는다. 답은 main thread의 짝으로 간다."
    outcomes:
      - id: ok
        observe: [ledger:agent_calls, ledger:messages, response]
        when: "call을 열었다(state accepted)"
      - id: failed
        observe: [ledger:agent_calls, response]
        when: "받는 session이 없거나 닫혀 call이 failed로 기록됐다(fail_reason not_found 또는 closed). ok로 돌려주고 상태로 알린다"
      - id: forbidden
        code: forbidden
        when: "core 안 machine이 아니다, 또는 call 정책이나 팀 규칙이 막았다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "받는 agent 명함이 입력 종류나 답 방식을 받지 않는다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "보낸 session이 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "router가 아직 없다, 또는 질문 글을 blob으로 준비하지 못했다(준비 경로가 없거나 준비가 실패했다)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    refs: [R4, T1, T9]
    docs: [architecture/approval.md, architecture/agent-call.md]
    declared_only: [conflict, internal]
    unclear:
      - "route가 conflict와 internal을 선언하지만 handler는 둘 다 만들지 않는다. 받는 곳이 session 지정이라 call 상태를 옮기거나 팀 상한을 세지 않고, router의 internal(call id가 없다)은 from이 agent인 한 도달하지 않는다(선언을 고칠 곳)"

  - id: team-ask-withdraw
    title: "기다리던 팀 질문이나 승인 call을 보낸 쪽이 취소한다"
