  # ---- ACP 갱신과 Gateway (남지 않는 event) ----
  - id: acp-projection
    title: "Bus의 agent event를 ACP 갱신(AcpUpdated)으로 바꿔 화면에 낸다"
    actor: system
    entries: [system:acp-projection]
    uses: [route:acp/allocate]
    boundary: [acp, events]
    code:
      - packages/core/main/daemon/wiring/acp.ts
      - packages/protocol/events/acp-project.ts
      - packages/core/main/daemon/wiring/acp-build.ts
    steps:
      - "acp wiring이 Bus에서 agent event 종류들을 구독한다. 팀 자식이 부모에게 가는 요청과 질문(부모가 푸는 것)과 그 닫힘 event는 갱신으로 내지 않고 건너뛴다(skipped)."
      - "event를 하나씩 차례로 처리한다. 항목이 대화에 드는 것은 allocate로 순번을 받은 뒤다. 메시지 본문은 blob 읽기로 가져온다. 못 읽으면 그 갱신은 본문 없이 낸다(오류로 돌려주지 않는다). 승인 결과와 글은 지금 redaction을 거친다."
      - "acpUpdatesOf로 바꾼 갱신을 AcpUpdated(transient, session 포함)로 Bus에 낸다. TurnEnded와 CompactEnded 뒤에는 session의 사용량 갱신도 낸다."
      - "계산이 던지면 log만 남기고 그 갱신을 버린다. 화면은 다음 snapshot으로 맞춘다."
    outcomes:
      - id: ok
        observe: [event:AcpUpdated]
        when: "갱신을 Bus에 냈다"
      - id: failed
        observe: [log:acp]
        when: "갱신 계산이 실패해 log만 남기고 버렸다"
      - id: skipped
        observe: []
        when: "팀 자식이 부모에게 가는 요청이나 질문, 또는 그 닫힘 event라 갱신을 내지 않았다(silent)"
    crosses_process: true
    risk: [secret]
    docs: [architecture/acp.md, architecture/event.md]
    unclear: []

  # ---- Gateway ----
  - id: gateway-stream
    title: "화면이 건 조건으로 Bus event를 Gateway 연결에 흘려 보낸다"
    actor: shell
    entries: [system:gateway-stream]
    boundary: [event-stream, events, server]
    code:
      - packages/core/server/server.ts
      - packages/core/supervision/responsiveness/admission.ts
      - packages/core/events/gateway.ts
      - packages/core/events/bus.ts
      - packages/protocol/events/gateway.ts
    steps:
      - "화면이 upgrade를 건다. 헤더가 한도를 넘거나 host가 허용되지 않으면 invalid_input, 인증 자격이 없으면 unauthorized, Origin이 허용되지 않으면 forbidden으로 거절한다."
      - "path가 구독 경로가 아니면 not_found, Bus가 없으면 unavailable이다. gateway 자격이 허용되지 않거나 shell capability가 유효하지 않으면 forbidden이다."
      - "event 연결 한도(전체 32, principal당 4)를 넘으면 upgrade 전에 unavailable로 거절한다."
      - "watch frame으로 조건을 받으면 Bus에 구독하고 ready를 보낸다. 화면은 ready 뒤에 snapshot을 읽는다. client frame이 JSON이 아니거나 watch 조건이 틀리면 closed 없이 1008로 끊는다(bad-frame)."
      - "맞는 event를 event frame으로 보낸다. 보내는 버퍼가 1 MiB를 넘으면 closed(slow_consumer)를 보내고 1013으로 닫는다. replay는 없다."
      - "server가 내려갈 때 closed(shutdown)를 보내고 1001로 닫는다. upgrade 처리 중 경계 밖 throw는 internal로 거절한다."
    outcomes:
      - id: ok
        observe: [response]
        when: "연결이 붙어 ready를 보냈고 event를 흘린다"
      - id: invalid_input
        code: invalid_input
        when: "헤더가 한도를 넘었다, 또는 host가 허용되지 않았다"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "인증 자격(bearer)이 없거나 맞지 않아 gate에서 거절했다"
        observe: [response, log:api]
      - id: forbidden
        code: forbidden
        when: "Origin이 허용되지 않았다, gateway 자격이 허용되지 않았다, 또는 shell capability가 유효하지 않아 upgrade를 거절했다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "구독 경로가 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "event 연결 한도(전체 32, principal당 4)를 넘었다, 또는 Bus가 없다"
        observe: [response]
      - id: internal
        code: internal
        when: "upgrade 처리 중 경계 밖에서 throw가 났다"
        observe: [response]
      - id: bad-frame
        observe: [response]
        when: "잘못된 client frame(JSON이 아니거나 schema가 틀림, 틀린 watch 조건 포함)이라 closed 없이 1008로 연결을 끊었다"
      - id: slow-consumer
        observe: [response]
        when: "버퍼가 1 MiB를 넘어 closed(slow_consumer)를 보내고 연결을 끊었다"
      - id: shutdown
        observe: [response]
        when: "server가 내려가며 closed(shutdown)를 보내고 연결을 끊었다"
    crosses_process: false
    docs: [architecture/event.md]
    unclear:
      - "actor를 shell로 골랐다(화면 renderer가 ready 때 연다). 사람도 agent도 부르지 않는 연결이라 system으로 볼 수도 있다. 정할 것"
      - "origin 거절은 log:api(origin_rejected)도 남기지만 forbidden outcome은 log를 관측에 넣지 않았다. 나눌지 정할 것"

