    covers: [tool-lophn-help:invalid-command, tool-lophn-help:help, tool-list-assembly:fixed, assignment-read:ok, assignment-set:saved, app-invocation-read:listed, app-invocation-read:found, app-command-call:succeeded, app-command-call:invalid-input, app-call-assignment-judge:passed, tool-call-execute:ok, app-rewind-plan:planned, app-operation-call:succeeded, app-operation-call:denied-not-declared, app-broker-net-fetch:fetched, app-broker-secret-use:used, app-secret-value:delivered, app-command-call:succeeded-changeset-dropped]
    note: "할당에서 뺀 command나 할당 없는 agent에는 앱 command가 안 보이고 불리지 않는다. 할당 뒤 새 command가 바로 불린다. 사람과 agent의 command·operation 호출은 기록되고, 선언에 없는 operation은 denied, 큰 입력은 invalid_input, loopback net fetch는 secret이 붙어 나간다. 큰 changeset이 버려지고도 succeeded로 닫히는 것은 app-command-call:succeeded-changeset-dropped."
  - path: tests/e2e/app-data-rewind_test.ts
