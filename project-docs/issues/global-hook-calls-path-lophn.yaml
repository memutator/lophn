id: global-hook-calls-path-lophn
title: 전역 hook command가 PATH의 `lophn`을 부른다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/coding-agent]
now: 전역 hook은 `lophn hook <harness> <event>`이고 `lophn`이 PATH에 있다고 본다. 개발 실행(`LOPHN_CLI`)에서는 PATH의 `lophn`이 없거나 다른 판이라 전역 hook이 맞지 않는다.
impact: 개발 중에는 coding session의 turn 끝 신호가 안 오거나 설치된 판의 core로 간다.
fix: 개발 실행에서는 hook command에 `LOPHN_CLI` 경로를 쓴다(작음). 다만 전역 설정에 개발 경로가 남는다.
closed: "`harness install`이 `command`(공백·따옴표·`..` 없는 절대 경로)를 받는다. shell main은 개발 실행에서 `LOPHN_CLI` 경로를 `hookCommand`로 넘기고(packaged는 없다), `installGlobal`이 그 경로로 JSON hook과 pi·OpenCode plugin의 spawn을 쓴다. `lophn hook …`과 `<절대 경로> hook …`을 모두 우리 항목으로 보아 오가도 event마다 하나다. `command`를 준 dry_run만 내용이 다르면 `missing`이다. 남는 것: 개발 경로를 놓은 뒤 packaged로 돌아가면 `command` 없는 dry_run이 `unchanged`라 개발 경로가 전역 설정에 남는다(개발 머신만. 항목을 지우거나 packaged에서 다시 놓는다)."
guard: packages/coding-agent/harnesses/install_test.ts "개발 command로 놓아도 사람이 쓴 hook은 남고 우리 항목은 event마다 하나다"
