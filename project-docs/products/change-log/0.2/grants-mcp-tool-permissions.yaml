id: grants-mcp-tool-permissions
version: 0.2.0
title: "Grants에서 MCP tool별 권한을 정한다"
modules: [packages/protocol, packages/core/lophn-agent, packages/core/main, packages/shell/renderer, packages/shell/main]
checked: [architecture-approval, architecture-agent-definition, tool-worktree-prep, skill-ui-design, tool-wireframes]
change: |
  전: 서버별 MCP tool 이름을 읽는 route가 없어 Grants의 "Tools from MCP servers"가 늘 비었다. 사람은 서버 단위 on/off만 할 수 있었다.
  후:
  - memory route `agent-mcp-tools/list`(`ListMcpTools`, 사람)가 place의 서버별 `{ name, tools: { tool, description, effect }[], reason }`을 돌려준다. `reason`은 `null`(읽음), `disabled`, `sign_in`, `unreachable`이다. 응답에는 서버 설정이나 credential이 없다.
  - core에는 외부 연결이 없어 요청을 작업 메모리 대기열에 놓고(기한 15초), agent runtime이 machine 입구 `request-take`·`request-done`으로 가져가 서버마다 따로 연결해(나란히, 서버마다 10초) 읽는다. effect는 tool 정의와 같은 규칙(`readOnlyHint`가 참이면 read, 아니면 external)이다.
  - Grants는 읽은 서버의 tool만 보인다. 꺼진 서버, 로그인이 필요한 서버, 못 읽은 서버는 나오지 않는다.
why: |
  사람이 MCP tool별로 ask/allow를 정할 수 없었다.
decisions:
  - text: |-
      못 읽은 서버는 Grants에서 뺀다. 이유를 보이려면 화면 칸과 문구가 더 필요한데 요구가 없다.
    by: agent
  - text: |-
      MCP OAuth 발급자 호출과 같은 대기열 길을 쓴다. core module graph에 외부 연결을 들이지 않는다.
    by: agent
follow_up: |-
  agent 정의 층의 MCP 서버는 turn에도 이 목록에도 없다(`project-docs/issues/agent-definition.md`).
