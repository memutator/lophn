group: shell
files:
  - path: packages/shell/ipc/app-tab-head_test.ts
    covers:
      - app-tab-head:head-set
      - app-tab-head:head-cleared
    note: "readTabHead가 그릴 값과 그릴 것 없는 값을 가르는 판정(그릴 것 없으면 head-cleared, 글 길이와 항목 수 상한에서 자르면 head-set)"

  - path: packages/shell/ipc/shortcuts_test.ts
    covers: [key-press:command-run]
    note: "main이 창으로 넘기는 shortcut id 판정(isWindowShortcut): 표의 binding id·동적 id·app.panel id만 받는다"

  - path: packages/shell/main/app-frame/annotate_test.ts
    covers:
      - annotate-pick:picked
      - annotate-pick:ignored
      - annotate-send:sent
      - annotate-send:invalid-input
    note: "앱 view가 아닌 sender의 고르기는 무시, 페이지가 보낸 app·release는 버리고 view에서 정한 값만 core에 간다. capture·upload가 실패해도 screenshot 없이 보낸다. 빈 목록 보내기는 거절. preview view의 annotation은 release 없이 bundle hash(preview_bundle)를 싣고 간다"

  - path: packages/shell/main/app-frame/app-projects_test.ts
    covers:
      - app-projects-list:listed
  - path: packages/shell/main/app-frame/app-agent_test.ts
    covers:
      - app-agent-open:opened
      - app-agent-open:not-found
      - app-agent-snapshot:snapshot
      - app-agent-snapshot:forbidden
      - app-agent-send:sent
      - app-agent-send:forbidden
    note: "앱 view는 core가 보인다고 한 session(터미널 탭 제외)만 읽고 보낸다. send·stop·answer·rename만 넘기고 decide·run_shell·rewind는 core 전에 forbidden"

  - path: packages/shell/main/app-frame/app-call_test.ts
    covers:
      - app-operation-call:succeeded
      - app-operation-call:invalid-input
      - app-operation-call:denied-not-declared
    note: "app-runtime 영역의 app-operation-call이다. 모르는 field는 invalid_input, 선언에 없는 operation은 core 호출 없이 forbidden(denied-not-declared)"

  - path: packages/shell/main/app-frame/overlay-security_test.ts
    covers: [shell-session-policy:granted, shell-session-policy:denied]
    note: "shell 기본 session 권한 판정(clipboard write만 main frame shell 페이지에 허용). shell-session-policy:granted·denied"

  - path: packages/shell/main/app-frame/registry_test.ts
    covers:
      - app-view-open:opened
      - app-view-open:invalid-input
      - app-view-crash:crashed
      - app-view-reopen:reopened
      - app-view-reopen:conflict
      - app-view-reopen:invalid-input
    note: "view 열기의 src와 guest 신원 묶기, params schema 거절, crash 뒤 reopen 세대 교체, 건강한 view의 reopen 거절, 다른 창의 reopen 거절"

  - path: packages/shell/main/artifact/delete_test.ts
    covers:
      - artifact-delete:deleted
      - artifact-delete:forbidden
      - artifact-delete:invalid-input
      - artifact-delete:not-found
    note: "지우기가 그 artifact 폴더만 지우고, symlink 폴더는 거절하며 가리키는 곳은 그대로이고, 폴더 안 symlink는 link만 지우는 것을 temp dir에서 본다"

  - path: packages/shell/main/artifact/navigation_test.ts
    covers:
      - artifact-navigation:same-host
      - artifact-navigation:external-link-opened
      - artifact-navigation:blocked
    note: "artifact page의 main frame·subframe navigation 판정표"

  - path: packages/shell/main/artifact/paths_test.ts
    covers:
      - artifact-serve:served
      - artifact-serve:not-found
    note: "봉한 scheme이 root 밖 path, symlink, 일반 file이 아닌 것, 상한을 넘는 file을 404로 거절한다. _entries.json이 밖으로 가는 symlink와 하위 폴더를 싣지 않는다는 목록 규칙은 served 안에 든다"

  - path: packages/shell/main/artifact/source_test.ts
    covers:
      - artifact-open:opened
      - artifact-open:invalid-source
      - artifact-open:not-found
    note: "artifact 이름 slug, .html 일반 file, workflow view·instance 짝, artifacts 밖 symlink 거절을 resolveSource로 본다"

  - path: packages/shell/main/browser-bridge/bridge_test.ts
    covers:
      - browser-bridge-request:declined
      - browser-bridge-request:pane
    note: "모르는 key·bind 안 된 key·버전 틀림·system_browser 설정은 declined, browser_tab은 창에 밀어 ack를 받으면 pane, ack가 없으면 declined"

  - path: packages/shell/main/browser-bridge/policy_test.ts
    covers:
      - browser-bridge-request:declined
      - browser-bridge-request:os-opener-direct
      - browser-terminal-link:browser-tab
      - browser-terminal-link:system-browser
      - browser-terminal-link:dropped
    note: "parseBridgeRequest의 형식과 상한 거절(declined), isRelayableUrl이 아니면 main을 거치지 않고 OS로 넘김, linkTarget의 browser 탭·OS browser·버림 판정. link 설정 읽기와 BROWSER env는 판정 outcome을 정하지 않는 helper라 covers에 넣지 않았다"

  - path: packages/shell/main/browser-bridge/run-dir_test.ts
    covers:
      - browser-bridge-start:path-too-long
      - browser-bridge-start:listening
    note: "socket 경로가 OS byte 한도를 넘으면 폴더를 만지기 전에 거절. Windows pipe 이름 길이, 죽은 shell의 run 폴더 정리와 POSIX 권한"

  - path: packages/shell/main/browser/agent/driver_test.ts
    covers:
      - browser-call-run:done
      - browser-call-run:stale-ref
      - browser-call-run:person-holds
      - browser-call-run:tab-not-open
      - browser-call-run:login-frame-moved
    note: "browser driver를 가짜 page로 돌린다. typeOnce(한 번 넣기)는 칠 때 frame origin이 card에 보인 origin과 다르면 치지 않고 conflict(오류에도 값 없음)이고 같으면 친다. frame_origin은 ref가 든 frame의 origin을 잰다. fill_login은 ref가 든 iframe의 origin(최상위가 아니다)으로 값을 받아 치고 결과에 값이 없으며, 치는 동안 그 frame이 이동하면 멈추고 conflict(오류에도 값 없음). snapshot은 type=password 칸의 value를 찍지 않는다. snapshot마다 ref가 새로 나고 옛 ref(새 snapshot, main frame 이동 뒤)는 conflict이며 새 node를 가리키지 않는다. 사람이 가져간 탭에서 act, navigate, evaluate는 conflict이고 snapshot, screenshot, logs는 된다. bind가 앱 live view를 가리켜도 page를 고르지 않고 unavailable이며 debugger를 붙이지 않는다"

  - path: packages/shell/main/browser/bookmarks_test.ts
    covers:
      - browser-bookmark-save:corrupt-refused
      - browser-bookmark-save:saved
    note: "깨진 bookmarks.json은 add·update·remove가 모두 거절되고 파일 byte가 그대로다(data-loss). 정상 파일에 동시에 add해도 둘 다 남는다"

  - path: packages/shell/main/browser/navigation_test.ts
    covers:
      - browser-navigation:allowed
      - browser-navigation:blocked
      - browser-navigation:os-handoff
    note: "browser page의 main frame·subframe 목적지 판정표(http·https 허용, credential·scheme 차단, mailto·tel는 OS로)"

  - path: packages/shell/main/browser/permission_test.ts
    covers:
      - browser-session-policy:permission-granted
      - browser-session-policy:permission-denied
    note: "browser partition은 main frame http(s)의 clipboard write만 허락한다"

  - path: packages/shell/main/browser/popup_test.ts
    covers:
      - browser-popup:popup-blocked
      - browser-popup:floated
      - browser-popup:docked
      - browser-popup:denied-scheme
    note: "사용자 입력 뒤 5초 안에서만 popup을 열고, width와 height가 모두 있을 때만 floated, 아니면 docked. navigation 검사에 걸린 url은 입력이 있어도 거절"

  - path: packages/shell/main/browser/user-agent_test.ts
    covers: [browser-session-policy:user-agent-stripped]
    note: "UA 문자열에서 Electron token만 빼는 순수 함수. Google 로그인 때문에 두 번 고친 자리다. browser-session-policy:user-agent-stripped"

  - path: packages/shell/main/browser/webview-guest_test.ts
    covers:
      - browser-guest-attach:attached-browser
      - browser-guest-attach:attached-registered-view
      - browser-guest-attach:rejected
      - browser-guest-attach:first-src-blocked
    note: "webview 붙이기 때 shell이 준 browser partition만 받고 설정을 덮는다. app·artifact는 registry가 받은 src만. 맞지 않는 src는 붙지 않고 scheme이 위험하면 about:blank"

  - path: packages/shell/main/decision-handle/ipc_test.ts
    covers:
      - decision-handle-issue:issued
      - decision-handle-issue:forbidden
    note: "일반 shell 창 본문이 아닌 sender와 고정되지 않은 결정은 forbidden, shell 창의 고정 결정은 handle을 받는다"

  - path: packages/shell/main/desktop/coding-connection_test.ts
    covers:
      - harness-detect:ok
      - harness-detect:cli-failed
    note: "shell main이 lophn CLI를 child로 부르는 runner 단위. --json 성공 출력은 data, {error} 출력은 실패로 돌아온다. harness detect 호출의 결과 판정이다"

  - path: packages/shell/main/desktop/detached/ipc_test.ts
    covers:
      - detached-close-silent:closed-kept
      - desk-switch:switched
      - detached-reopen:reopened-kept
      - detached-reopen:reopened
      - detached-tab-changed:sent
      - desk-switch:forbidden
    note: "project 창을 떠날 때 detached 창을 조용히 닫고 PTY 참조는 남긴다(closed-kept). showOnly는 보낸 project 창의 detached 창만 숨기고 보이며 없는 key는 missing으로 답한다. detached 되받기 한 번만 주는 규칙은 detached-reopen:reopened·reopened-kept"

  - path: packages/shell/main/desktop/navigation-guard_test.ts
    covers: [shell-navigation:allowed, shell-navigation:external-link, shell-navigation:blocked]
    note: "shell 창 main frame의 탐색 판정(lophn-shell://desktop 밖 차단, http·https는 OS browser). shell-navigation:allowed·external-link·blocked"

  - path: packages/shell/main/editor/file-adapter_test.ts
    covers:
      - editor-save:saved
      - editor-save:conflict
      - editor-save:unknown-result
      - file-create:created
      - file-create:name-exists
      - file-rename:moved
      - file-rename:name-exists
      - file-rename:into-self
      - file-delete:trashed
      - file-delete:unavailable
    note: "write는 hash가 다르면 conflict로 원본을 안 바꾸고, 쓰기가 끊겨도 원본이 남고 임시 파일을 치운다(unknown-result 갈래로 묶음). 파일 트리의 만들기·옮기기·지우기는 file-create·file-rename·file-delete"

  - path: packages/shell/main/extensions/bundled/harness-gui/received_test.ts
    covers:
      - harness-gui-user-message:received
    note: "tag의 from=app:<slug>는 앱 sender이고 agent 이름이 아니다"

  - path: packages/shell/main/extensions/bundled/harness-gui/claude_test.ts
    covers:
      - harness-gui-toggle:to-tui
      - harness-gui-toggle:to-gui
      - harness-gui-open:start-failed
      - harness-gui-input:sent
      - session-send:ok
      - queued-edit:ok
      - queued-move:ok
      - session-open:ok
      - session-message-read:ok
      - session-status-read:ok
      - shell-run:ok
      - harness-gui-approval:rejected
      - harness-gui-approval:allowed-session
      - harness-gui-approval:mode-picked
      - harness-gui-question:submitted
      - harness-gui-background-tool:backgrounded
      - harness-gui-subagent-lane:background-task
      - harness-gui-subagent-lane:lane-opened
      - harness-gui-bang-shell:ran
      - harness-gui-bang-shell:stopped
      - harness-gui-usage-warning:warned
      - harness-gui-usage-warning:silent
      - harness-gui-command-output:output-shown
      - harness-gui-command-output:compact-summarized
      - harness-gui-user-message:received
    note: "claude GUI adapter. 토글 두 방향과 한 session에 process 둘 금지, GUI 입력의 줄 서기와 순서, steer 메시지 고치기·옮기기, resume·open_session(session-open 판정으로 묶음), 받은 메시지 목록, resume 뒤 비용, `!` 명령. 승인·질문·subagent·background·사용 한도·명령 출력 등 harness GUI 고유 동작은 harness-gui-* outcome"

  - path: packages/shell/main/extensions/bundled/harness-gui/codex_test.ts
    covers:
      - session-open:ok
      - shell-run:ok
      - harness-gui-input:sent
      - harness-gui-approval:rejected
      - harness-gui-approval:answered-elsewhere
      - harness-gui-approval:allowed-session
      - harness-gui-approval:allowed-always
      - harness-gui-approval:allowed-once
      - harness-gui-question:submitted
      - harness-gui-start-policy:replaced
      - harness-gui-start-policy:kept
      - harness-gui-user-message:shown-as-human
      - harness-gui-bang-shell:ran
      - harness-gui-subagent-lane:lane-opened
    note: "codex GUI adapter. resume·open_session·rollout 없는 thread resume을 session-open으로, `!`는 thread/shellCommand로 가는 shell-run으로 묶음. 승인, 질문, 시작 정책, TUI 메시지 보이기, 자식 thread lane은 harness-gui-* outcome"

  - path: packages/shell/main/extensions/bundled/harness-gui/omp_test.ts
    covers:
      - harness-gui-open:start-failed
      - harness-gui-toggle:to-tui
      - harness-gui-toggle:to-gui
      - harness-gui-toggle:no-session
      - harness-gui-input:sent
      - session-send:ok
      - shell-run:ok
      - session-open:ok
      - harness-gui-approval:rejected
      - harness-gui-approval:allowed-session
      - harness-gui-approval:allowed-once
      - harness-gui-bang-shell:ran
      - harness-gui-command-output:output-shown
      - harness-gui-roles:switched
      - harness-gui-roles:slow-kept
      - harness-gui-subagent-lane:lane-opened
      - harness-gui-subagent-lane:background-task
      - harness-gui-permission-mode:restarted
    note: "omp GUI adapter. ready 전에 죽은 omp는 start 실패, 토글 두 방향 순서, 모델 turn 없는 session은 토글에서 CLI session id가 없다. 도는 중 메시지는 turn 뒤로 간다. `!ls`는 bash로만 간다. 승인·roles·mode·task는 harness-gui-* outcome"

  - path: packages/shell/main/extensions/bundled/harness-gui/opencode_test.ts
    covers:
      - session-open:ok
      - shell-run:ok
      - harness-gui-approval:allowed-once
      - harness-gui-approval:rejected
      - harness-gui-approval:answered-elsewhere
      - harness-gui-approval:allowed-session
      - harness-gui-approval:allowed-always
      - harness-gui-approval:auto-accepted
      - harness-gui-opencode-secret:kept-in-file
      - harness-gui-opencode-undo:reverted
      - harness-gui-opencode-undo:restored
      - harness-gui-opencode-undo:new-session
      - harness-gui-subagent-lane:lane-opened
      - harness-gui-subagent-lane:background-task
      - harness-gui-lane-control:stopped
      - harness-gui-background-tool:backgrounded
      - harness-gui-plan-todo:shown
      - harness-gui-command-output:output-shown
      - harness-gui-bang-shell:ran
    note: "opencode GUI adapter. 저장 안 된 session(404) resume은 새 session으로 열고, `!ls`는 shell API로만 간다. permission 응답, auto-accept, subagent, background, todo plan, undo·redo, 명령 출력, TUI server 비밀번호는 harness-gui-* outcome"

  - path: packages/shell/main/extensions/extension-tools_test.ts
    covers:
      - extension-sync:loaded
      - extension-tool-call:ran
    note: "켜진 fixture extension이 tool 이름 ext__<id>__<name>으로 catalog에 서고, shell main handler가 결과를 돌려준다"

  - path: packages/shell/main/extensions/registry_test.ts
    covers:
      - extension-sync:loaded
      - extension-sync:off
      - extension-sync:incompatible
      - extension-sync:no-setting
      - extension-remove:removed
      - extension-remove:conflict
      - extension-tool-call:ran
    note: "켰다 끄고 지우면 data root가 처음과 같고 사람 file은 남는다. 판이 다르거나 설정 선언이 없으면 load하지 않는다. 꺼진 tool handler는 버리고 목록은 켜진 것과 꺼진 것을 가리지 않는다(꺼진 호출의 not_found 답은 flow의 갈래와 맞지 않아 뺐다)"

  - path: packages/shell/main/notice/rule_test.ts
    covers:
      - session-notice:looking
      - session-notice:notified
      - session-notice:app-session
      - notice-alert:toast
      - notice-alert:os-notification
      - notice-unseen:seen
      - session-notice:turn-other
      - session-notice:unknown-session
    note: "보고 있으면 알리지 않고, 창이 있으면 toast, 없으면 OS 알림. 끊은 turn은 session-notice:turn-other, 모르는 session은 unknown-session"

  - path: packages/shell/main/secret-input/request_test.ts
    covers:
      - input-request-finish:held
      - input-request-finish:done
      - input-request-finish:connect-failed
    note: "한 번 넣기의 값은 hold(알려진 값 등록)와 치기에만 가고 secrets 저장이나 done 결과에는 없다. 치기가 conflict로 거절돼도 오류에 값이 없다. 새 provider 자리는 secrets/put 뒤 providers/connect를 보내고, 연결이 실패하면 secrets/delete로 값을 지우며 결과에 값이 없다"

  - path: packages/shell/main/secret-input/submit_test.ts
    covers:
      - secret-input:stored
      - secret-input:invalid-input
      - secret-input:unavailable
    note: "secret 제출 실패는 고정 code만 나가고 값은 결과에 남지 않는다. 성공은 이름과 byte 수만 올린다"

  - path: packages/shell/main/terminal/agent/agent_test.ts
    covers:
      - terminal-agent-track:running
      - terminal-agent-track:waiting
      - terminal-agent-track:idle
      - terminal-agent-track:unknown
      - terminal-agent-track:ignored
      - terminal-agent-notice:toast
      - terminal-agent-notice:cancelled
    note: "hook 줄 ingress(모르는 key, 틀린 줄, 크기 초과는 버림)와 coding agent 상태 tracker. Esc·Ctrl-C로 unknown, 다른 harness hook은 탭을 안 바꿈, 1.5초 안의 TurnStarted는 완료 알림을 취소, subagent가 끝나야 알림"

  - path: packages/shell/main/terminal/agent/hook-ask_test.ts
    covers:
      - terminal-hook-install:declined
    note: "보던 창이 없거나 답하기 전에 닫히면 허락이 아니다. 허락이 아닌 경우는 terminal-hook-install:declined"

  - path: packages/shell/main/terminal/agent/session-store_test.ts
    covers:
      - terminal-agent-identity:saved
      - terminal-agent-session-rename:renamed
    note: "coding agent session 목록을 project 파일에 저장한다. 같은 session은 started_at과 첫 title을 지키고, 50개를 넘으면 오래된 것부터 버리고, 손상 파일은 빈 목록이다. 사람이 붙인 이름은 hook 이름에 덮이지 않는다(terminal-agent-session-rename:renamed, terminal-agent-identity:saved)"

  - path: packages/shell/main/terminal/cwd_test.ts
    covers: [terminal-open:outside-folder, terminal-open:opened]
    note: "터미널 시작 폴더가 등록 폴더 안인지 보는 순수 함수. `..`와 밖으로 나가는 symlink는 거절. terminal-open:outside-folder, opened"

  - path: packages/shell/main/terminal/gui_test.ts
    covers:
      - harness-gui-open:opened
      - harness-gui-open:ignored
      - harness-gui-cli-env:spawned
    note: "lophn-gui 요청은 그 key의 터미널에만 handle을 연다. 모르는 key, 상대 경로 cwd, id에 쓸 수 없는 글자는 무시. CLI env에서 상위 session 표지는 빼고 provider key와 hook env는 남긴다(env 규칙은 harness-gui-cli-env:spawned)"

  - path: packages/shell/main/terminal/output_test.ts
    covers: [terminal-output:pushed, terminal-output:not-watched]
    note: "터미널 출력은 그 terminal을 구독한 창에만 가고 창이 놓으면 더 보내지 않는다. terminal-output:pushed·not-watched"

  - path: packages/shell/main/terminal/supervisor_test.ts
    covers: []
    note: "pipe에서 읽은 줄 나누기 순수 함수. 조각 사이에 갈린 UTF-8과 큰 JSON 한 줄을 보존한다"

  - path: packages/shell/main/thread-bookmarks/store_test.ts
