id: terminal-keeps-history-on-reattach
version: 0.18.0
title: "terminal: 다시 붙은 터미널이 history를 잃지 않는다"
modules: [packages/core/terminals, packages/shell/ipc]
checked: [architecture-workspace-layout]
change: |
  project를 떠났다 돌아오거나 창을 reload해 터미널 화면을 새로 만들 때 받는 것이 바뀌었다.
  - 전: terminal-host가 raw 출력을 5MiB·LF 10,000개·chunk 10,000개 상한까지 쌓았다가 그대로 다시 재생했다. history를 한 번 쓰고 그 뒤로 아래 viewport만 고쳐 그리는 TUI(omp는 일하는 동안 초당 30여 chunk)는 4분쯤 만에 chunk 상한을 채워 처음 그린 history를 밀어냈고, 다시 붙은 화면은 아래 몇 줄 말고 비었다. Claude Code는 같은 상한에 27분쯤 걸렸다.
  - 후: terminal-host가 PTY마다 출력을 headless xterm으로 파싱해 두고, snapshot은 그 화면(scrollback 10,000줄, alternate screen, mode, cursor)을 직렬화한 chunk 하나를 마지막으로 파싱한 seq로 준다. renderer는 바뀌지 않았다. 다시 붙을 때 보내는 양도 raw 수 MB에서 화면 하나(omp 7분 뒤 54KB)로 줄었다.
why: |
  사람이 omp 탭의 내용이 사라진다고 했다. 실제 omp와 Claude Code 출력을 녹화해 옛 ring buffer와 xterm에 다시 재생해 원인을 확인했다(resize 경로는 원인이 아니었다).
decisions:
  - text: |
      상한을 키우거나 chunk를 합치지 않고 화면 상태를 둔다. 버린 길: 상한 키우기와 chunk 합치기는 omp가 초당 20KB쯤 내므로 5MiB 상한까지 몇 분 늦출 뿐이다. renderer가 project를 떠나도 xterm을 살려 두는 길은 창 reload와 다른 창에서 여전히 raw를 재생한다.
    by: agent
  - text: |
      `@xterm/headless 6.0.0`과 `@xterm/addon-serialize 0.14.0`을 root에 더했다. addon의 typing은 DOM lib을 켜서 node project의 전역 type을 바꾸므로 JS를 직접 import하고 쓰는 만큼만 type을 적는다.
    by: agent
follow_up: |
  열린 터미널마다 headless 화면 하나만큼 terminal-host 메모리를 더 쓴다(scrollback이 차면 renderer xterm과 비슷하다). 앱을 다시 build해야 설치본에 들어간다.
