schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  - id: req-0029
    status: accepted
    subject: app-data
    statement: 앱이 남기는 기록은 앱 data이고, 그 앱 화면에서 보인다.
    acceptance:
      - 앱이 남긴 기록은 그 앱의 data에 저장되고 그 앱 화면에서 보인다.
    related:
      - projects

  # 앱 DB

  - id: req-0950
    status: accepted
    subject: app-data
    statement: "앱 DB는 앱마다 SQLite 파일 하나이고, 그 앱의 process만 연다."
    acceptance:
      - "앱마다 쓰는 DB 파일이 다르다."
      - "한 앱이 다른 앱의 DB 파일을 열려 하면 거절된다."

  # 폐기: schema 번호의 시작값과 DB를 쓰지 않는 앱의 처리는 구현 세부다.
  - id: req-0951
    status: rejected
    subject: app-data
    statement: "앱 DB는 지금 schema 번호와 마지막 migration의 결과를 담고, schema 번호는 0부터 시작할 수 있으며 DB를 쓰지 않는 앱에는 처음 migration이 필요하지 않다."
    acceptance:
      - "DB를 쓰지 않는 앱이 schema 0으로 시작한다."
      - "DB를 쓰는 앱의 실제 schema 번호와 마지막 변경 결과를 data 작업에서 확인할 수 있다."

  # migration 시작과 복구본

  - id: req-0952
    status: accepted
    subject: app-data
    statement: "migration은 기존 운영 process의 종료와 업무 쓰기 중지를 확인하고 변경 전 복구본을 확보한 뒤에만 시작한다."
    acceptance:
      - "종료 확인을 지연시키면 migration이 시작되지 않는다."
      - "복구본 확정을 지연시키면 migration이 시작되지 않는다."
      - "복구본으로 되돌리면 WAL에만 있던 내용까지 migration 직전 data가 모두 돌아온다."

  # 폐기: 복구본이 직전 data를 다 담는지는 req-0952의 확인이 맡는다.
  - id: req-0953
    status: rejected
    subject: app-data
    statement: "변경 전 복구본은 WAL에 있는 내용까지 일관되게 담고, 실제 schema와 무결성을 확인한 것만 쓴다."
    acceptance:
      - "WAL에 새 항목이 있는 DB의 복구본으로 되돌려도 그 항목이 남는다."
      - "DB 본체 파일만 복사한 것은 유효한 복구본으로 받지 않는다."

  - id: req-0954
    status: accepted
    subject: app-data
    statement: "앱 복구본은 앱마다 가장 최근 것 하나만 두고, activation이 정상으로 끝나면 자동으로 지운다."
    acceptance:
      - "migration을 두 번 한 앱의 복구본은 하나다."
      - "activation이 정상으로 끝나면 그 복구본이 지워진다."

  # migration 실행

  # 폐기: migration도 앱 코드라 앱 격리(app-runtime)가 맡는다.
  - id: req-0955
    status: rejected
    subject: app-data
    statement: "migration은 앱 DB에만 쓸 수 있는 격리 process에서 돈다."
    acceptance:
      - "migration code가 앱 DB 밖 파일이나 network에 접근하면 거절된다."

  # 폐기: 중간에 실패하면 migration 전으로 돌아가는 것은 req-0957이 맡는다.
  - id: req-0956
    status: rejected
    subject: app-data
    statement: "migration의 각 단계는 데이터 변경과 schema 번호 갱신을 한 transaction으로 확정한다."
    acceptance:
      - "단계 중간에 실패시키면 데이터 변경과 schema 번호가 함께 되돌아간다."

  - id: req-0957
    status: accepted
    subject: app-data
    statement: "여러 schema 단계를 건너뛰는 migration은 지금 번호부터 목표까지 이어진 단계를 순서대로 적용하고, 중간에 실패하면 변경 전 복구본으로 되돌린다."
    acceptance:
      - "0에서 3으로 가는 migration의 두 번째 단계를 실패시키면 DB가 0의 데이터와 schema로 돌아온다."

  - id: req-0958
    status: accepted
    subject: app-data
    statement: "이미 공개한 migration의 내용은 고칠 수 없고, 새 변경은 새 migration으로만 추가한다."
    acceptance:
      - "공개한 migration의 내용을 바꾸려 하면 거절된다."
      - "새 변경은 새 migration으로 다음 release에 담긴다."

  - id: req-0959
    status: accepted
    subject: app-data
    statement: "migration마다 결과(성공, 실패), 출발·도착 schema, 시각이 남는다."
    acceptance:
      - "성공한 migration과 실패한 migration을 각각 돌린 뒤, 둘의 결과와 출발·도착 schema와 시각을 찾을 수 있다."

  # activation 실패와 그 뒤

  - id: req-0960
    status: accepted
    subject: app-data
    statement: "새 업무 통로를 열기 전에 activation이 실패하면 변경 전 복구본으로 되돌리고, 무결성과 schema 확인을 마친 뒤에만 이전 release를 다시 시작한다."
    acceptance:
      - "migration을 실패시키면 이전 데이터로 돌아오고 이전 release가 쓰인다."
      - "되돌리기에 실패했거나 결과를 확인하지 못하면 앱이 사용할 수 없는 상태로 보인다."
    related:
      - app-releases

  - id: req-0961
    status: accepted
    subject: app-data
    statement: "새 release가 업무를 받기 시작한 뒤에 이전 release를 고르면 앱 code만 바뀌고 DB는 그대로다."
    acceptance:
      - "activation 뒤 새 항목을 추가하고 이전 release를 골라도 그 항목이 그대로 있다."
    related:
      - app-releases

  - id: req-1497
    status: accepted
    subject: app-data
    statement: "앱 data는 앱 DB 하나에 둔다."
    acceptance:
      - "앱 process는 자기 data 위치에서 앱 DB 밖의 파일을 쓸 수 없다."
    related:
      - app-runtime

  - id: req-1520
    status: accepted
    subject: app-data
    statement: "migration은 data를 잃을 수 있는 단계(지우는 표나 칸, 좁히는 type)를 선언하고, lophn은 그 선언으로 activation 때 사람에게 물을지 정한다."
    acceptance:
      - "손실 단계를 선언한 migration이 든 release는 activation 전에 그 단계를 보이고 사람의 허락을 받는다."
      - "손실 단계를 선언하지 않은 migration만 든 release는 선언이 넓어지지 않으면 묻지 않고 activate된다."
      - "lophn은 DB 사본에서 migration을 돌려 손실을 재지 않는다."
    related:
      - app-releases
