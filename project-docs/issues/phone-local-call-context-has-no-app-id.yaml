id: phone-local-call-context-has-no-app-id
title: 폰의 local 호출 문맥에는 앱 id가 빈 글자라 같은 handler가 컴퓨터와 폰에서 다른 문맥을 본다
kind: defect
status: open
topic: app-sync
modules: [packages/mobile, packages/protocol]
now: |
  guest의 local 호출은 SDK 호출 문맥을 `{app: "", release: null, ...}`로 만든다(`packages/mobile/src/apps/guest/local-call.ts`의 `run`). host가 guest에 주는 `init` 메시지가 앱 id를 싣지 않기 때문이다(`packages/protocol/apps/phone-screen.ts`의 `init`에는 `local`의 operation 표와 data schema 판뿐이다). 컴퓨터에서는 같은 문맥에 앱 id와 release가 있다.
impact: |
  handler가 문맥의 앱 id를 읽는 code(예: log 글에 앱 id를 싣거나 다른 앱 호출의 대상을 정하는 것)는 폰에서 빈 글자를 받는다. 지금 SDK의 폰 entry에서 이 값을 쓰는 곳은 없어 실제로 틀리는 것은 확인하지 못했다. 다른 값을 쓰는 handler가 생기면 폰에서만 다르게 동작한다.
fix: |
  - 작음(추천): `init`의 `local`에 앱 id와 release를 더하고(host의 설치 기록이 안다) 문맥에 싣는다. 폰 base가 올라가므로 `PHONE_BASE_FORMAT`을 같이 올린다.
  - 없음: SDK가 폰에서 문맥의 앱 id를 읽지 않는다고 지침에 적는다.
