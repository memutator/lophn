  - id: app-oauth-sign-in
    title: "사람이 앱 OAuth sign-in을 시작하거나 취소한다"
    actor: person
    entries: [route:apps/oauth_begin, route:apps/oauth_cancel]
    pre: [app-oauth-client-set:stored]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "begin: 사람만 부른다(route actors가 dispatch에서 거른다). 순서는 선언에 oauth 블록이 있는지, 이 secret의 grant가 허락됐는지, client id가 있는지, 이미 기다리는 시도가 없는지, loopback callback 자리를 열 수 있는지 순이다. 기다리는 시도가 있으면 제한 시간이 지난 것은 먼저 정리해 막지 않는다."
      - "PKCE authorize URL을 만든다. authorize endpoint가 URL이 아니거나 허용되지 않으면 invalid_input이다. 이 URL을 돌려주면 시도가 백그라운드로 돌고 결과는 app-oauth-callback이 받는다. 실패하면 열어 둔 listener를 닫는다."
      - "URL을 돌려준다. shell이 OS browser로 연다. 결과는 callback(app-oauth-callback)이 받고 화면은 oauth_state로 읽는다."
      - "cancel: 이름으로 진행 중인 시도를 버린다. app은 보지 않으며 선언과 grant 판정도 하지 않는다. 진행 중인 시도가 없었으면 cancelled가 false다."
    outcomes:
      - id: url-returned
        observe: [response]
      - id: cancelled
        observe: [response]
      - id: nothing-to-cancel
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine), 또는 이 secret의 grant가 허락되지 않음"
        observe: [response]
      - id: no-client-id
        code: invalid_input
        when: "client id가 없음"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 모양이 맞지 않음, 또는 authorize endpoint가 URL이 아니거나 허용되지 않음"
        observe: [response]
      - id: not-declared
        code: not_found
        when: "선언에 oauth 블록이 없음, 또는 앱에 활성 release가 없음"
        observe: [response]
      - id: already-in-progress
        code: conflict
        when: "이 secret으로 기다리는 시도가 이미 있음(begin만)"
        observe: [response]
      - id: listener-unavailable
        code: unavailable
        when: "loopback callback 자리를 열지 못함"
        observe: [response]
      - id: declared-read-failed
        when: "선언이나 grant 읽기가 실패함"
        observe: [response]
    crosses_process: false
    risk: [secret, permission]
    refs: [H10]
    unclear:
      - "sign-in 시도와 실패·token 이름이 secret 이름으로만 나뉜다. 두 앱이 같은 secret 이름을 쓰면 시도가 섞인다(service.ts). 의도인지 확인이 필요하다."
      - "listener는 port 0으로 열려 callback 포트 충돌(conflict)은 거의 없다고 보지만, 확인이 필요하다."

  - id: app-oauth-callback
    title: "브라우저의 sign-in 응답을 받아 token으로 바꿔 보관한다"
    actor: system
    entries: [system:app-oauth-callback]
    boundary: [secrets, app-runtime]
    code: [packages/core/lophn-agent/extensions/mcp-auth.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/apps/oauth/service.ts]
    steps:
      - "sign-in을 시작하면 core가 loopback callback을 background로 기다린다. 사람이 browser에서 허락한다. 기다리는 시간은 5분이고 타이머와 지연 검사로 본다."
      - "callback이 두 번째로 오면 409로 답하고 계속 기다린다. code나 state가 없으면 400으로 답하고 계속 기다린다."
      - "callback의 state가 시작할 때 것과 다르면 state_mismatch로 끝낸다. 발급자가 error 파라미터로 돌려보내면 exchange_failed로 끝낸다."
      - "authorization code를 token으로 바꾼다(PKCE). token endpoint가 오류를 주거나, JSON이 아니거나, access_token이 없으면 exchange_failed다. 기다리는 시간을 넘기면 callback_timeout이다. 시도가 사라지면 cancel이나 sign-out이 막은 것이므로 cancelled다."
      - "access token은 선언한 이름에, refresh와 meta는 app-oauth.<이름>.refresh|meta에 둔다. 보관이 실패하면 store_failed다."
      - "성공하면 signed_in이다. 상태는 메모리에 있고 화면은 oauth_state로 읽는다. 실패 상태도 메모리 report다(화면 read로 보인다)."
    outcomes:
      - id: signed-in
        observe: ["disk:secrets.json", "response:apps/oauth_state"]
      - id: failed-callback-timeout
        when: "5분 안에 callback이 없음. 그 뒤에 도착한 callback은 거절된다(state는 callback_timeout으로 남는다)"
        observe: ["response:apps/oauth_state"]
      - id: failed-state-mismatch
        when: "callback의 state가 시작할 때 것과 다름"
        observe: ["response:apps/oauth_state"]
      - id: failed-exchange
        when: "발급자가 redirect에 error 파라미터를 붙여 돌려보냄, token endpoint가 오류·JSON 아님·access_token 없음 중 하나로 답함, 또는 code 교환이 실패함"
        observe: ["response:apps/oauth_state"]
      - id: failed-store
        when: "token 보관이 실패함(store_failed). 실패 상태가 메모리에 남는다"
        observe: ["disk:secrets.json", "response:apps/oauth_state"]
      - id: cancelled
        when: "기다리는 중 cancel이나 sign-out이 와서 로그인이 취소됨. 상태는 none으로 돌아간다"
        observe: ["response:apps/oauth_state"]
      - id: callback-ignored
        when: "두 번째 callback(409), code나 state가 빈 요청(400). 계속 기다린다"
        observe: [response]
    crosses_process: false
    risk: [secret]
    refs: [H10]
    docs: [architecture/app-call.md]
    unclear:
      - "실패 이유는 메모리 failures map에만 있어 core가 다시 켜지면 사라진다(이슈 oauth-failure-reason-lost-on-restart)."
      - "실패와 취소의 결과는 push 화면이 없고 oauth_state read로 보인다. observe를 response:apps/oauth_state로 적었다. 화면 frame을 쓸지는 정하지 않았다."

  - id: app-oauth-sign-out
    title: "사람이 앱 OAuth sign-in을 지운다"
    actor: person
    entries: [route:apps/oauth_sign_out]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 선언과 grant는 보지 않는다. 진행 중인 sign-in 시도를 버린다. 실패 이유도 지운다."
      - "access token, refresh, meta를 지운다. client id와 client secret은 남긴다. 셋 가운데 하나라도 지우지 못하면 일부만 지워질 수 있다."
      - "다음 secret 전송은 sign-in-required가 된다(app-secret-value)."
    outcomes:
      - id: signed-out
        observe: ["disk:secrets.json"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "secret 저장소를 쓰지 못함(셋 중 일부만 지워질 수 있다)"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [H10]

  - id: app-oauth-state
    title: "앱 OAuth 상태를 읽는다"
    actor: person
    entries: [route:apps/oauth_state]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "지금 release 선언에서 oauth 블록이 있는 secret마다 한 줄을 만든다."
      - "상태는 none, in_progress, signed_in, failed 가운데 하나다. failed면 이유가 있다. 값은 없다. expired는 읽을 때 계산한다."
      - "report는 실패하지 않는다. 저장소 읽기가 실패하면 그 secret은 none으로 보인다. 상태는 메모리 report라 core가 다시 켜지면 failed 이유가 사라진다(이슈 oauth-failure-reason-lost-on-restart)."
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: read-failed
        when: "선언이나 grant 읽기가 internal로 실패함"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "선언 읽기의 ledger 연결을 열 수 없음(declared). 선언이나 grant 읽기가 internal로 실패한 것은 read-failed"
        observe: [response]
    crosses_process: false
    declared_only: [not_found]
    unclear:
      - "route가 not_found를 선언하지만 handler는 내지 않는다. release가 없으면 빈 목록을 ok로 준다. 선언을 고칠 곳이다."

  # ---------- broker: net, notify, problem ----------

  - id: app-broker-net-fetch
    title: "앱 SDK의 외부 HTTP 요청을 supervisor broker가 보낸다"
    actor: app
    entries: [system:app-broker-net-fetch]
    uses: [route:apps/tools, route:app_grants/list, sdk:cap-net/netFetch]
    pre: [app-record-started:started]
    boundary: [app-capability, app-runtime]
    code: [packages/core/apps/permissions/broker/net-fetch.ts, packages/core/apps/permissions/broker/access.ts, packages/core/apps/permissions/effective.ts]
    steps:
      - "앱의 netFetch가 host, port, method, path, header, 본문을 broker의 net/fetch에 보낸다."
      - "입력 모양을 검사한다. Authorization, Cookie, Host 같은 header와 GET, HEAD의 본문은 schema가 거절한다. host는 정확한 host여야 한다. 이 검사는 grant 판정보다 먼저다. method, path, host의 세부 검사는 grant 판정 뒤다. 그래서 허락 밖이면 forbidden이 먼저다."
      - "운영 자식이고 지금 release의 command 목록에 있으며 (host, port)가 선언 ∩ grant(플랫폼 port 제외)에 있어야 한다. 아니면 forbidden(net.fetch)이다. 현재 범위를 core에서 읽지 못하면 access-unavailable이다."
      - "요청을 보낸다. redirect는 한 단계마다 같은 검사를 다시 받는다. https에서 http로 내려가거나 grant 밖이면 거절한다. 응답이 non-2xx여도 fetched다(상태 코드는 앱에 그대로 준다)."
      - "같은 invocation에서 app-broker-secret-use가 받아 둔 값이 있고 그 목적지(host·port)가 이 요청과 같을 때만 Bearer로 붙인다. redirect의 다음 hop은 목적지가 바뀌면 값을 다시 찾으므로 다른 목적지에는 붙지 않는다. 응답은 1 MiB 이하의 글이나 JSON만 앱에 준다."
    outcomes:
      - id: fetched
        when: "요청이 나감(non-2xx 포함). 같은 invocation의 secret이 이 (host, port)에 있으면 Authorization을 붙이고, 없거나 목적지가 다른 redirect hop에는 붙이지 않는다"
        observe: ["request:external-host", response]
      - id: refused
        code: forbidden
        when: "선언 ∩ grant 밖, command 아님, 운영 자식 아님(preview나 release 없음), 자식 release가 현재 release와 다름, 현재 범위를 모름, redirect가 grant 밖, https에서 http로 내려감(details.permission은 net.fetch)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "schema가 거절함(금지 header, GET·HEAD 본문, 본문 base64 아님, 본문 10 MiB 초과, header 수 초과), method 지원 안 함, path가 절대 경로가 아니거나 목적지를 벗어남, host가 정확한 host가 아님, 본문이 net/fetch 상한(base64 10 MiB와 여유 64 KiB)을 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: request-failed
        code: unavailable
        when: "연결 실패, 30초 timeout, redirect 대상이 없거나 URL이 아니거나 Location이 없음, redirect가 너무 많음, 응답이 1 MiB를 넘음"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(apps/tools, app_grants/list)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [sandbox, permission, secret]

  - id: app-broker-notify
    title: "앱이 사람에게 알림이나 tray 값을 보낸다"
    actor: app
    entries: [system:app-broker-notify]
    uses: [route:notices/post, route:app_tray/set, route:apps/tools, route:app_grants/list]
    pre: [app-record-started:started]
    boundary: [app-capability, app-runtime]
    code: [packages/core/apps/permissions/broker/notify.ts, packages/core/apps/permissions/broker/access.ts]
    steps:
      - "앱의 notify나 setTray가 broker의 notify/send나 notify/tray에 보낸다. 입력 모양을 먼저 검사한다(schema)."
      - "운영 자식이고 release가 지금 release와 같아야 한다. 현재 선언 ∩ grant에 notify.send가 있어야 한다. 아니면 forbidden이다. 현재 범위를 읽지 못하면 access-unavailable이다."
      - "알림은 core notices.post를, tray는 app_tray.set을 그 자식의 app credential로 부른다. 앱은 내용만 정하고 앱 이름은 자식 연결이 정한다. tray는 notify.send 허락을 같이 쓴다."
      - "같은 key의 알림은 기존 것을 바꾸고 안 읽음으로 되돌린다. 앱마다 상한을 넘으면 가장 오래된 알림을 지우고 NoticeClosed를 보낸다. tray 값이 null이면 tray를 비운다. AppTrayChanged는 둘 다 보낸다(tray 값은 메모리에만 있다)."
      - "받는 쪽은 사람뿐이다. agent나 core 로직에 사실을 보내는 길이 아니다."
    outcomes:
      - id: notified
        observe: ["event:NoticePosted", "ledger:notices"]
      - id: tray-set
        when: "tray 값을 정하거나 지움(null)"
        observe: ["event:AppTrayChanged"]
      - id: refused
        code: forbidden
        when: "notify.send 허락이 없음, 운영 자식이 아님(preview나 release 없음), 자식 release가 현재 release와 다름, active release가 없음, 현재 범위를 모름"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "notify나 tray 입력 모양이 맞지 않음, 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(apps/tools, app_grants/list)"
        observe: [response]
      - id: core-refused
        when: "notices.post나 app_tray.set이 낸 오류 그대로(not_found: 앱 없음, conflict: 보관한 앱, invalid_input, forbidden, unauthorized, unavailable: credential 없음·core에 닿지 않음)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [permission]

  - id: app-broker-problem
    title: "앱이 잡은 예외를 앱 log에 쓴다"
    actor: app
    entries: [system:app-broker-problem]
    uses: [sdk:cap-problem/createExceptionObserver]
    boundary: [problems, app-runtime]
    code: [packages/core/apps/permissions/broker/problems.ts, packages/core/main/app-supervisor/log-redact.ts]
    steps:
      - "앱 SDK의 exception observer가 잡히지 않은 예외를 broker의 observe-exception에 보낸다. 이 길은 reportProblem을 쓰지 않는다(reportProblem은 stderr 줄을 내고 app-log-write가 받는다)."
      - "본문 모양을 검사한다. grant 판정은 없다(mode나 live 검사도 없어 preview 자식도 쓸 수 있다). 앱은 자기 log에만 쓴다."
      - "stack을 봉인 bundle의 source map으로 원래 source 줄로 푼 뒤 쓴다. 풀 수 없으면 frame 없이 머리 줄만 쓴다."
      - "exception <name>: <message> 한 줄과 frame마다 '  at <path>:<line>:<column>' 줄을 같은 invocation으로 붙인다. 각 줄은 redaction을 먼저 하고 300자로 자른다. 앱 log가 8 MiB를 넘으면 app.log.1로 옮긴다."
      - "log 파일이 없는 조립(dataRoot 없음)이거나 파일 쓰기가 실패하면 응답은 그래도 written이다. 줄은 남지 않는다(조용히 버림)."
    outcomes:
      - id: written
        observe: ["log:app"]
      - id: log-lost
        when: "dataRoot가 없어 쓸 곳이 없음, 또는 파일 쓰기 실패가 삼켜짐. 응답은 written과 같다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "exception 입력 schema가 맞지 않음, 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "frame 풀기나 쓰기 처리기가 예외를 던짐"
        observe: [response]
    crosses_process: false
    refs: [A15]
