area: turns
flows:
  # ---- turn 시작과 끝 ----
  - id: turn-pump-start
    title: queue의 입력 하나를 골라 turn을 시작하거나 시작하지 못한 것을 닫는다
    actor: system
    entries: [system:turn-pump]
    uses: [turn-start:running, turn-finish:failed, extension-tool-catalog:listed]
    boundary: [run-loop, child-supervision-protocol]
    code: [packages/core/main/agent-runtime/product-driver.ts, packages/core/lophn-agent/run-loop/driver.ts, packages/core/lophn-agent/run-loop/work.ts, packages/core/lophn-agent/run-loop/prepare.ts]
    steps:
      - "500ms 주기 pump가 provider 해지 알림을 훑고(poll) queue에서 맨 앞 session의 입력을 고른다. 도는 session은 건너뛴다"
      - "그 session이 이전 대화가 커져 Compact가 정해졌으면(compactBefore) 기다리지 않고 compact-summary를 연 뒤 다음 주기로 간다"
      - "prepare가 session 열림, agent 정의, 설정 한도, 지침 층, workspace 정보, model 해석(resolveModel), 쓸 tool 목록(extension 포함)을 읽고 resolved agent를 turn 기준에 고정한다. 읽기나 쓰기가 실패하면 Err로 돌아가 입력은 queue에 남는다"
      - "정의 오류, model 없음, harness runtime, 지침 층 차단이면 StartTurn과 FinishTurn(failed)을 보내 그 turn만 닫는다. 입력은 소비된다"
      - "ready면 StartTurn을 보낸다. 거절되면 입력은 queue에 남는다. 확정되면 agent credential을 받고, 못 받으면 closeStarted(credential)로 failed(configuration_unavailable)로 닫는다"
      - "StartTurn 뒤 queue에서 입력을 꺼낸다. 이미 없으면(사람이 지움) input_gone으로 닫는다. 있으면 session을 도는 중으로 두고 turn-loop에 넘긴다"
      - "pump 예외는 log:diagnostics에 남기고 다음 주기에 다시 본다"
    outcomes:
      - id: started
        observe: [ledger:turns, ledger:messages, event:TurnStarted]
        when: turn이 running으로 시작되고 loop가 돈다
      - id: closed-model-required
        observe: [ledger:turns, event:TurnStarted, event:TurnEnded]
        when: session, agent, workspace 층(Home, project, 앱), 전역 어디에도 model이 없다(resolveAgent의 model 실패, failed model_required)
      - id: closed-target-unavailable
        observe: [ledger:turns, event:TurnStarted, event:TurnEnded]
        when: agent 정의가 없다(agent_missing)거나 harness runtime의 session이라 lophn이 돌리지 않는다(failed target_unavailable)
      - id: closed-configuration-unavailable
        observe: [ledger:turns, event:TurnStarted, event:TurnEnded]
        when: "agent 정의가 틀렸다(agent_invalid), 지침 층이 막혔다(읽기 실패, 형식 틀림, 너무 큼, redaction 미완), 쓸 model을 못 골랐다(model_unusable: resolveModel이 unavailable(연결 없음, credential을 쓸 수 없음, 값 있는 credential을 보낼 수 없음, 계정에 project 없음), not_found(구독 OAuth 계정의 허락 목록 밖 이름), invalid_input(option 값이나 한계를 정할 수 없음) 가운데 하나를 돌려줬다. 직접 적은 이름은 구독 허락 목록 안이면 catalog 밖이어도 기본 한계로 받아 여기로 오지 않는다), credential을 받지 못했다(credential), StartTurn 뒤 입력이 queue에서 사라졌다(input_gone). 모두 failed configuration_unavailable이다"
      - id: start-rejected
        observe: [response]
        when: "StartTurn이 거절됐다(입력 taken, session busy, 한도 불일치 등). turn은 열리지 않고 입력은 queue에 남아 다음 주기에 다시 고른다"
      - id: waiting
        observe: []
        when: "prepare가 Err를 돌려줬다(session이 열려 있지 않다, 설정·정의·session 읽기 실패, workspace 정보와 범위 재료 읽기 실패(projects/get, apps/get, projects/list, apps/list, agents/list), model 해석이 unavailable·not_found·invalid_input 밖의 code를 돌려줌, closeUnstarted의 StartTurn·FinishTurn 실패 등). 로그 없이 입력은 queue에 남아 다음 주기에 다시 고른다"
      - id: pump-threw
        observe: [log:diagnostics]
        when: 준비나 시작이 예외를 던졌다. 같은 오류가 이어지면 처음 한 번만 남긴다
      - id: compacting
        observe: [event:CompactStarted]
        when: 다음 turn 전에 이전 대화를 Compact하도록 session을 잡았다. turn은 아직 열리지 않는다
    crosses_process: true
    risk: []
    refs: [T4, W4]
    docs: [architecture/agent-chat.md, architecture/workspace-session.md]
    unclear:
      - "waiting은 로그도 응답도 없어 observe가 비었다. prepare Err를 log:diagnostics에 남길지 정한다(지금은 driver가 unavailable로만 돌려준다)"
      - "prepare가 Err를 돌려주면 driver는 unavailable로만 보고 입력을 queue에 둔다. session 닫기(archive·delete)는 endSession의 clearQueue로 queue를 비우므로 닫힌 session의 입력은 남지 않을 것으로 보인다. 확인이 필요하다"
      - "closeStarted(why)는 readOf, storeValue, FinishTurn의 실패를 기록 없이 삼킨다. 그 경우 turn 행이 running으로 남을 수 있다. 확인이 필요하다"
      - "closed-* outcome은 StartTurn 뒤 FinishTurn 두 번이라 TurnStarted와 TurnEnded가 모두 난다. 화면과 테스트가 이것을 전제하는지 확인이 필요하다"

  - id: workspace-info
    title: turn 시작에 workspace 정보 글을 만들어 prompt에 싣는다. home의 앱 목록은 예산 안에 맞춘다
    actor: system
    entries: [system:workspace-info]
    uses: [route:apps/tool_index, route:apps/usage, route:packages/list, route:apps/list, route:projects/list]
    boundary: [agent-workspaces, core]
    code: [packages/core/agent-workspaces/workspace/workspace-info.ts, packages/core/agent-workspaces/workspace/workspace-data.ts]
    steps:
      - "workspace-data가 core 읽기로 모은 재료를 workspaceInfo에 넘긴다. 종류마다 머리 줄, agent 목록, artifacts 목록을 쓴다. 앱 목적과 command 설명은 한 줄로 접고 100자에서 자른다"
      - "home만 프로젝트 목록과 앱 목록을 쓴다. 앱 목록에는 공개 command만 싣고, 앱마다 주인인 package와 다른 앱·project가 쓰는 곳을 붙인다"
      - "앱 목록은 글자 수 예산(12000자) 안이면 command 설명까지(full), 넘으면 command 키만(short), 그래도 넘으면 앱 이름과 목적만(bare)으로 쓴다"
      - "앱 도움말 재료(tool_index, usage, packages/list) 가운데 읽지 못한 것은 빈 값으로 두고 turn은 그대로 간다"
      - "artifacts 목록은 50개까지 싣고 나머지는 개수만 적는다"
    outcomes:
      - id: full
        observe: ["request:model"]
        when: "home의 앱 목록이 예산 안에 command 설명까지 실렸다"
      - id: short
        observe: ["request:model"]
        when: "full이 예산을 넘어 command 키만 실렸다"
      - id: bare
        observe: ["request:model"]
        when: "short도 예산을 넘어 앱 이름과 목적, package만 실렸다"
      - id: help-missing
        observe: ["request:model"]
        when: "앱 도움말 재료 가운데 하나 이상을 읽지 못해 그 덩어리가 빈 채로 실렸다. 오류로 막지 않는다"
      - id: artifacts-capped
        observe: ["request:model"]
        when: "artifacts가 50개를 넘어 앞 50개와 남은 수만 실렸다"
    crosses_process: false
    docs: [architecture/workspace-session.md]
    unclear: []

  - id: turn-loop
    title: turn 하나의 agent loop를 돌려 completed, stopped 또는 failed로 끝낸다
    actor: system
    entries: [system:turn-loop]
    uses: [turn-checkpoint:running, turn-finish:completed, turn-finish:failed, model-call-run:complete, tool-call-batch:success]
    pre: [turn-pump-start:started]
    boundary: [run-loop, models]
    code: [packages/core/lophn-agent/run-loop/loop.ts, packages/core/lophn-agent/run-loop/turn.ts, packages/core/lophn-agent/run-loop/limits.ts, packages/core/lophn-agent/run-loop/core-ports.ts, packages/core/lophn-agent/prompt-assembly/turn-prompt.ts]
    steps:
      - "걸음마다 먼저 멈춤을 본다. core가 turn 행을 이미 닫았으면 FinishTurn 없이 stopped로 끝난다"
      - "접수 입력(첫 입력과 steer)을 고르고 model 시도 수와 무진행 시간 한도, provider 연결을 본다"
      - "prompt를 조립한다. system은 workspace 종류 지침, 지침 층(global, home | project | app, agent), memory(workspace memory, agent memory), skill 목록, workspace 정보 순이다. memory는 session 첫 turn에 읽어 고정해 그 session 안에서는 같은 bytes로 가고(Compact 뒤나 daemon 재기동 뒤에는 다시 읽는다) 세션 중에 쓴 memory는 다음 session부터 보인다. 읽지 못한 memory 파일은 빈 글로 보고 turn을 막지 않는다. 지난 model 요청 뒤 지침 층 글이 달라졌으면 instructions_changed notice를 대화 끝에 붙인다. 예산의 85%를 넘으면 turn 안 Compact나 오래된 tool 결과 줄이기로 낮추고, 그래도 input_over_budget이면 context_limit으로 끝낸다"
      - "model-call-run으로 model 호출 하나를 하고 완전한 응답이면 그 응답을 agent message로 남긴다"
      - "tool 응답이면 tool-call-batch로 묶음을 실행하고 결과를 이력에 붙인 뒤 checkpoint한다"
      - "tool 없는 완전한 답이면 미반영 steer를 확인하고 completed(answer_completed)로 FinishTurn한다. steer가 남았으면 끝내지 않고 다음 판단으로 간다"
      - "한도에 닿으면 machine이 확정한 사실만으로 failed로 끝낸다. 끝내는 길은 모두 finish를 거친다"
    outcomes:
      - id: instructions-notice
        observe: ["request:model"]
        when: "지난 model 요청 때 본 지침 층 글과 지금 글이 달라 instructions_changed notice가 붙었다. 바뀐 층의 새 글 전체가 실리고, 비운 층은 (empty now)로 적힌다. 지난 판이 없는 첫 요청에는 붙지 않는다"
      - id: memory-fixed
        observe: ["request:model"]
        when: "workspace memory나 agent memory가 비어 있지 않아 system에 Memory block(자료 경계 안, 출처별)이 실렸다. session 첫 turn에 읽은 글이 그 session의 뒤 turn에도 같은 bytes로 간다. Compact로 경계가 바뀌면 다시 읽는다. bare는 workspace memory를 받지 않고 자기 agent memory만 받는다"
      - id: completed
        observe: [ledger:turns, ledger:messages, event:MessageRecorded, event:TurnEnded]
        when: 완전한 답으로 끝났다(answer_completed)
      - id: stopped
        observe: [process:agent-runtime]
        when: "사람 멈춤, session 끝남 또는 restart로 core가 turn을 이미 닫았다(stop 확인). loop는 새 호출을 막고 FinishTurn 없이 끝난다. FinishTurn이 실패했어도 그 사이 멈춤이 왔으면 여기로 간다"
      - id: failed-model-error
        observe: [ledger:turns, ledger:model_calls, event:TurnEnded]
        when: "일시 실패가 아닌 model 실패(400 invalid_request 같은 요청 오류, unknown), 재시도 소진, partial 응답 3회 연속, 중단 요청 없이 호출이 취소로 돌아왔다, 알 수 없는 실패 code"
      - id: failed-context-limit
        observe: [ledger:turns, event:TurnEnded]
        when: "입력이 예산을 넘고 turn 안에서 더 줄일 것이 없다, provider가 context_exceeded를 거절했고 줄일 것이 없거나 세 번째 거절이다"
      - id: failed-model-attempt-limit
        observe: [ledger:turns, event:TurnEnded]
        when: model_attempts 설정 상한에 닿았다. 기본은 상한 없음이라 설정할 때만 난다
      - id: failed-stall-limit
        observe: [ledger:turns, event:TurnEnded]
        when: 진행 없는 시간이 stall_ms(기본 300초)를 넘었다. 사람 기다림 중에는 세지 않는다
      - id: failed-configuration-unavailable
        observe: [ledger:turns, event:TurnEnded]
        when: "provider 연결이 없거나 회수됐다, 재시도 대기 중 연결이 사라졌다, 접수 입력이나 steer를 못 읽었다, turn 문맥(지침, workspace, session 대화)을 못 읽었다, workspace 종류 지침이 없다(workspace_kind_missing), prompt 설정(invalid_budget)이 잘못됐다, 요청 안전화를 끝내지 못했다, 호출 기록을 시작하지 못했다, 답 글을 저장하지 못했다, 모델 실패 code가 credential_unavailable이거나 model_unavailable(404 model, provider가 그 model을 못 찾음)이다, 호출 결과가 없었다(invoke 실패)"
      - id: failed-internal
        observe: [ledger:turns, event:TurnEnded, log:diagnostics]
        when: loop가 예외를 던졌다. driver가 loop_threw로 닫는다
      - id: finish-failed
        observe: [ledger:turns]
        when: "끝낼 이유는 정했지만 FinishTurn을 확정하지 못했다(결과 저장 실패, FinishTurn 거절, turn 읽기 실패). LoopEnd finish_failed로 driver에 가고 turn 행은 running으로 남는다"
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/run.md, architecture/agent-chat.md]
    unclear:
      - "TURN_OUTCOME_REASONS에는 있으나 loop가 내지 않는 reason이 있다: tool_error, repeated_tool_failure, effect_unknown(LoopFailureReason 타입에만 있다), clock_uncertain, active_limit(지워진 한도), no_answer(run 쪽이 낸다). 죽은 값인지 정하고 schema에서 뺄지 본다"
      - "driver.ts는 finish_failed를 받아도 turn 행을 닫지 않는다. 행이 running으로 남으면 session의 다음 StartTurn이 conflict로 막힌다. pump도 resolved finish_failed를 기록하지 않는다. 확인이 필요하다"
      - "retry.ts 주석의 시도 한도(30)는 기본값 null과 맞지 않고 PARTIAL_RUN_MAX(3)과도 다르다. 주석을 고칠지 본다"

  - id: turn-start
    title: queue 입력을 turn으로 확정하는 StartTurn을 받는다
    actor: system
    entries: [route:turns/start]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/run-loop/commands.ts, packages/protocol/lophn-agent/turns.ts, packages/core/lophn-agent/run-loop/model.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 같은 id의 재전달이면 이전 결과를 돌려준다. 같은 id가 다른 session이나 입력에 쓰였으면 conflict다"
      - "입력 message를 찾는다(없으면 not_found). 다른 session의 것이면 invalid_input, 이미 turn이 붙은 것이면 conflict다"
      - "한도를 현재 설정 파일에서 읽는다(data root를 모르거나 못 읽으면 unavailable). 입력 한도가 지금 설정과 다르면 invalid_input이다. machine이 보낸 값을 그대로 받지 않는다"
      - "같은 session에 running turn이 있으면 conflict다(session마다 하나)"
      - "basis와 resolved blob 참조를 영구 참조로 등록한다(준비 참조가 살아 있지 않으면 invalid_input, 주체가 다르면 forbidden)"
      - "turn 행을 running으로 넣고, 입력 message와 그 session의 ! shell 기록(shell = 1, turn null)에 turn을 붙인다. call 입력이면 Router에 가져갔다고 알린다"
      - "TurnStarted를 commit 뒤 Bus로 낸다"
    outcomes:
      - id: running
        observe: [ledger:turns, ledger:messages, event:TurnStarted, response]
        when: turn이 running으로 열렸다. 같은 id 재전달도 같은 응답이다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다(requireMachine)
      - id: input-not-found
        code: not_found
        observe: [response]
        when: 입력 message가 없다
      - id: input-other-session
        code: invalid_input
        observe: [response]
        when: 입력 message가 다른 session의 것이다
      - id: limits-mismatch
        code: invalid_input
        observe: [response]
        when: 준비할 때와 지금 설정의 한도가 달라졌다. 다음 주기에 다시 준비한다
      - id: input-taken
        code: conflict
        observe: [response]
        when: 입력 message가 이미 다른 turn을 열었다, 또는 같은 turn id가 다른 session이나 입력에 쓰였다
      - id: session-busy
        code: conflict
        observe: [response]
        when: 같은 session에 running turn이 이미 있다
      - id: limits-unresolved
        code: unavailable
        observe: [response]
        when: data root를 알 수 없거나 한도 설정을 읽지 못했다. turn을 시작하지 않는 쪽으로 닫힌다
      - id: blob-invalid
        code: invalid_input
        observe: [response]
        when: basis나 resolved 준비 참조가 살아 있지 않거나(TTL이 지남) schema와 다르다. 같은 tx 전체가 rollback된다
      - id: blob-forbidden
        code: forbidden
        observe: [response]
        when: 준비 참조의 주체가 이 자격과 다르다. 같은 tx 전체가 rollback된다
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear:
      - "같은 id 재전달 분기(commands.ts start)는 기존 turn이 이미 finished여도 state를 running으로 돌려주는 것으로 보인다. 맞는지 확인이 필요하다"

  - id: turn-checkpoint
    title: turn의 active·stall 시간과 이력을 저장한다
    actor: system
    entries: [route:turns/checkpoint]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/run-loop/commands.ts, packages/core/lophn-agent/run-loop/core-ports.ts]
    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). loop가 model 호출과 tool 묶음 뒤, 끝내기 전에 시간 값과 이 turn의 이력 blob을 보낸다"
      - "turn이 없으면 not_found, running이 아니면 conflict다. state_seq가 호출자의 compare와 다르면 conflict다"
      - "active가 줄었거나 checkpoint 시각이 앞 값보다 이르면 invalid_input으로 거절한다"
      - "시간 칸을 갱신한다. 이력 hash가 바뀌었으면 옛 이력 참조를 지우고 새 참조 하나만 등록한다(준비 참조가 거절되면 전체 rollback)"
    outcomes:
      - id: running
        observe: [ledger:turns, ledger:blob_refs, response]
        when: 시간과 이력이 저장됐다
      - id: not-machine
        code: forbidden
        observe: [response]
