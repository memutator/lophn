  # ---- agent가 연 탭 (renderer 쪽) ----
  - id: agent-tab-request
    title: "agent가 요청한 탭을 이 창에서 열거나 닫거나 편다"
    actor: shell
    entries: [system:agent-tab-request]
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/use-surface-requests.ts
      - packages/shell/renderer/workspace/open-policy.ts
      - packages/shell/main/desktop/wiring/surface.ts
    steps:
      - "shell main이 host queue에서 가져온 요청을 이 창이 보이는 workspace와 맞으면 shell:surface-request로 받는다(queue는 harness 쪽). 다른 workspace의 요청이면 이 창은 아무것도 하지 않고 main이 다른 창에 준다"
      - "layout을 다 읽은 뒤에만 받고, openAt이 요청의 relation(peer, stage, aside, work, glance, 말하지 않으면 browser는 work, 나머지는 aside)과 source 탭의 자리로 자리를 정해 select 없이 session, TUI, browser, preview 탭을 연다. work는 접힌 float, glance는 펴진 float이다"
      - "coding 요청이면 사람의 즐겨찾기 명령 뒤에 고정 handoff 글과 file 경로만 첫 prompt로 붙여 새 터미널 탭을 연다. 명령이나 터미널 통로가 없거나 경로에 shell이 다르게 읽을 글자가 있으면 ack하지 않는다"
      - "preview 탭은 앱마다 하나다. 이 창에 이미 열려 있으면 새로 열지 않고 요청의 기기만 바꾼다. 사람이 [Preview]로 연 같은 앱의 탭이 있으면 그 자리에 agent 탭을 열고 그것을 닫는다"
      - "열었으면 ack하고, 못 열었으면(agent 목록을 모름, resume 없음, 터미널 통로 없음) ack하지 않아 main이 되돌린다"
      - "work나 glance(float)인데 desk float이 20개 상한이면 openFloatTab이 조용히 아무것도 안 하지만 browser·session 경로는 그래도 ack한다"
      - "tab_show면 어느 desk에 있든 그 key의 접힌 float을 그 자리에서 펴고(desk, 선택, focus는 그대로) ack한다. float이 아니거나 없으면 할 일 없이 ack한다"
      - "tab_close면 그 탭을 빼고(터미널은 PTY까지 닫고) ack한다. 터미널 종료를 확인받지 못하면 탭은 남고 ack는 간다. 사람이 닫은 탭은 shell:surface-report로 closed를 알린다"
    uses: [ipc:shell:surface-request, ipc:shell:surface-ack, ipc:shell:surface-workspace, ipc:shell:surface-report]
    outcomes:
      - id: opened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "response"]
      - id: device-switched
        when: "preview 요청인데 그 앱의 preview 탭이 이 창에 이미 열려 있다. 탭을 새로 열지 않고 기기만 바꿔(요청에 기기가 없으면 그대로) ack한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "response"]
      - id: opened-no-tab
        when: "relation이 work나 glance(float)이고 desk float이 20개 상한이다. 탭이 생기지 않았는데 ack는 열렸다고 간다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "response"]
      - id: shown
        when: "tab_show 요청이고 그 탭이 접힌 float이다. 펴지고 맨 위로 올라온다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "response"]
      - id: show-noop
        when: "tab_show 요청인데 그 탭이 float이 아니거나 이미 펴져 있거나 없다. 할 일 없이 ack한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "response"]
      - id: closed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "response"]
      - id: closed-absent
        when: "닫을 탭이 없다(이미 닫았거나 이미 열려 있던 session 탭을 가리켰다). 끝난 일로 ack한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "response"]
      - id: closed-kept
        when: "터미널 종료를 확인받지 못했다. 탭은 남고 ack는 간다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "response"]
      - id: retried
        when: "탭을 열지 못해 ack하지 않았다(session이나 agent 목록을 모름, TUI의 resume 없음이나 터미널 통로 없음, 터미널 열기 실패). main이 queue 끝으로 되돌린다"
        observe: ["response"]
      - id: other-workspace
        when: "요청의 workspace가 이 창이 보이는 workspace가 아니다. 이 창은 아무것도 하지 않는다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "열린 탭의 layout을 main이 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시해 ack는 이미 갔다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    refs: [G4]
    docs: [architecture/workspace-layout.md, architecture/workspace-session.md]
    unclear:
      - "tab_close에서 터미널 store가 없는데 found가 터미널이면 PTY를 닫지 않고 탭만 뺀다. 의도인지 확인이 필요하다"
      - "host queue와 poll, 요청을 보내는 CLI 쪽은 harness area 소관이다. 여기는 renderer에서 자리 정하기와 ack까지다"

  # ---- agent가 다루는 browser·preview 탭: take control과 기기 emulation ----
  - id: browser-tab-control
    title: "agent가 다루는 browser·preview 탭을 사람이 가져오거나 돌려준다(take control)"
    actor: person
    entries: []
    uses: [ipc:shell:surface-take, ipc:shell:surface-control, ipc:shell:surface-report, system:browser-call-run]
    boundary: [shell, host-queue-interface]
    code:
      - packages/shell/ipc/surface.ts
      - packages/shell/main/browser/agent/control.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/renderer/workspace/use-surface-requests.ts
    steps:
      - "host 탭(browser·preview)이 mount하면 창이 view session을 surface-report의 bind로 main에 알리고, main이 지금 take control 상태를 shell:surface-control로 다시 push한다"
      - "agent의 첫 browser 호출이 오면 main이 그 탭을 agent가 다루는 중으로 적고 그 탭을 가진 창에 {agent, held} 상태를 push한다. 창이 상태 표시와 Take control 단추를 그린다"
      - "사람이 Take control을 누르면 창이 surface-take(held: true)를 보낸다. bind한 창이 보냈고 agent가 다루는 중인 탭이면 held가 되어 push된다. 이후 agent의 act, navigate, evaluate는 conflict다(읽기는 된다)"
      - "돌려주면(held: false) held가 풀리고 다시 push된다. 탭이 닫히면 상태를 잊는다"
    outcomes:
      - id: held
        when: "agent가 다루는 중인 탭을 사람이 가져왔다. 이후 agent의 쓰기가 conflict다"
        observe: ["screen:browser-agent-held"]
      - id: released
        when: "가져온 탭을 사람이 돌려줬다"
        observe: ["screen:browser-agent-control"]
      - id: ignored
        when: "등록된 본문 창이 아니거나, 입력이 schema에 맞지 않거나, 그 탭을 bind한 창이 보낸 것이 아니거나, agent가 아직 다루지 않는 탭의 가져오기이거나, 가져온 적 없는 탭의 돌려주기다(응답 없이 버린다)"
        observe: []
    crosses_process: false
    docs: [architecture/browser-tab.md]

  - id: preview-tab-emulate
    title: "preview 탭이 고른 기기(크기, DPR, touch, user agent)를 그 탭의 view에 건다"
    actor: person
    entries: []
    uses: [ipc:shell:surface-emulate]
    boundary: [shell]
    code:
      - packages/shell/ipc/surface.ts
      - packages/shell/main/browser/agent/emulation.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/renderer/workspace/app-preview-tab.tsx
    steps:
      - "사람이 preview 탭에서 설정 shell.devices의 기기를 고르거나 agent의 tab open --device 요청이 오면 창이 surface-emulate로 view session과 기기(없으면 null)를 보낸다"
      - "main이 그 view session이 mode preview인 앱 view인지 찾는다. 앱 live view와 다른 종류에는 걸지 않는다"
      - "기기가 있으면 DevTools가 열려 있지 않은지 보고 driver와 같이 쓰는 debugger를 붙여 크기와 DPR, touch, user agent를 건 뒤 page를 다시 load한다"
      - "null이면 건 적 있을 때만 풀고 page를 다시 load한다"
    outcomes:
      - id: applied
        when: "기기를 걸었다"
        observe: [response, "screen:app-preview-device"]
      - id: cleared
        when: "null을 받았다. 건 적이 있으면 풀었고 없으면 아무 일도 없다"
        observe: [response, "screen:app-preview-tab"]
      - id: devtools
        when: "DevTools가 열려 있거나 우리 것이 아닌 debugger가 붙어 있어 걸 수 없다(응답의 reason)"
        observe: [response]
      - id: unavailable
        when: "등록된 본문 창이 아니거나 입력이 schema에 맞지 않거나, view session이 preview 앱 view가 아니거나 page가 닫혔거나, 거는 도중 CDP가 실패했다(응답의 reason)"
        observe: [response]
    crosses_process: false
    docs: [architecture/browser-tab.md]

  # ---- 새 탭 열기 (+ menu, 빠른 실행, key) ----
  - id: terminal-tab-new
    title: "새 터미널 탭을 연다"
    actor: person
    entries: [ui:terminal-tab-new]
    when: "탭 줄 끝 + menu의 Terminal, 빠른 실행 Terminal 단추와 hover 목록(coding agent, project 명령), new.terminal 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/kinds/terminal.tsx
      - packages/shell/renderer/workspace/open-policy.ts
      - packages/shell/renderer/shell/quick-launch.tsx
    steps:
      - "openTerminal이 Home(project 없음)이나 터미널 통로가 없으면 아무것도 하지 않는다"
      - "명령이 있으면 terminal store에 그 명령을 맡기고(PTY는 harness 쪽), docked면 탭으로 붙인다. source가 없으니 desk 끝이다"
      - "명령이 없으면 빈 터미널 탭을 desk 끝에 붙인다. commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: opened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: command-opened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "screen:new-organize-folder"]
      - id: unavailable
        when: "Home이거나 터미널 통로가 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: float-full
        when: "명령 실행(docked 아님)이라 openAt이 float을 골랐는데 float이 20개 상한이다. store에 요청은 이미 맡겼지만 탭이 열리지 않는다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
