      - "release를 만든 쪽이 agent session이 아니면 알리지 않고 delivered가 false다"
      - "agent session이면 activation_finished notice를 그 session의 다음 turn 입력으로 route한다. 결과, 실패 code와 summary, 이전 release가 돌아왔는지를 담는다"
