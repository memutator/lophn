  - id: tab-copy-path
    title: "파일 탭의 경로를 클립보드에 복사한다"
    actor: person
    entries: [ui:tab-copy-path]
    when: "파일 탭의 메뉴 Copy path, Copy relative path, tab.copy-path, tab.copy-relative-path 키(파일 탭일 때만 키가 받는다)"
