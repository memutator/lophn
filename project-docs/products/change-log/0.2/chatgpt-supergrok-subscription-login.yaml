id: chatgpt-supergrok-subscription-login
version: 0.2.0
title: "ChatGPT와 SuperGrok 구독 계정으로 provider를 연결하고, token을 runtime에 건네기 직전에 갱신함"
modules: [packages/core/lophn-agent, packages/core/main, packages/protocol, packages/shell/renderer, packages/design]
checked: [architecture-layers, tool-dev]
change: |
  전: 로그인 흐름(`providers/oauth.ts`, `login.ts`)과 화면의 sign in 단추는 있었지만 gate 셋(daemon wiring에 http 없음, `LOPHN_LIVE_PROVIDER=1`, 정의의 `verified_for_lophn: false`)으로 닫혀 있었다. 끝나도 token을 버렸고, `models/resolve.ts`가 `api_key` 밖을 거절했고, 갱신 코드가 없었다. 붙여넣기 창(`windowSecretOpener`)은 preload에 없는 `openConfirmation`을 찾아 열리지 않았다. ChatGPT 등록은 OpenAI 문서에 없는 `POST /oauth/register`였다.
  후:
  - ChatGPT는 OpenAI 공식 Sign in with ChatGPT다: PKCE + `127.0.0.1` loopback `/auth/callback`(port는 OS가 고른다), 첫 로그인은 `client_id=dynamic_agent_client`·`agent_name_hint=lophn`·`ext_agent_host_id`(설치마다 하나, `secrets.json`의 `provider-oauth.host-id`), callback의 발급 client_id로 교환, id_token의 JWKS 서명·issuer·audience·exp·nonce 검증, granted scope에 `chatgpt.tokens.use.direct`가 없으면 거절. model 호출은 API key와 같은 `https://api.openai.com/v1/responses`에 Bearer다. SuperGrok은 device code다(Grok CLI의 공개 client). 둘 다 API key와 같은 endpoint다.
  - `OAuthDefinition`은 product별 꼴이다. chatgpt `{issuer, authorization_endpoint, token_endpoint, jwks_uri, resource, scopes}`, supergrok `{client_id, device_authorization_endpoint, token_endpoint, scopes}`. 주소는 https이거나 loopback http다. `flow`, `verified_for_lophn`, `allowed_call_origins`, 상수 주소(`SIWC_*`, `XAI_DISCOVERY`), discovery를 지웠다.
  - `BeginProviderLogin` 입력은 `{provider, name, definition, endpoint, protocol}`(정의 객체, Connect와 같은 검사), 출력의 `sign_in`은 필수다. `CompleteProviderLogin` 입력은 `{provider, login}`이고 기다리지 않는다: `{state: "pending", interval_ms}` 또는 `{state: "connected", provider}`. `submission`과 `confirmation`을 지웠다. 끝나면 core가 token을 `provider.<id>`·`.refresh`·`.meta`에 쓰고 사람의 context로 ConnectProvider를 부른다. ConnectProvider는 OAuth일 때 `expires_at`을 받는다.
  - runtime이 `provider.<id>`를 청하면 core(`providers/oauth-refresh.ts`, `runtime-secret.ts`의 `providerOAuth` hook)가 만료까지 5분 미만일 때 provider마다 한 번에 하나 refresh grant를 보낸다. 회전한 refresh를 먼저 쓰고 access를 쓴 뒤 `RefreshProviderCredential`(core 안 machine 자격 `machine:provider-refresh`). 발급자가 거절하면 `revoked`이고 token을 건네지 않는다. `OAUTH_REFRESH_LEAD_MS`는 5분이다.
  - `models/resolve.ts`는 `oauth`를 받고 header는 protocol과 상관없이 `authorization: Bearer`, `billing_route`는 `subscription`이다. `providers/failures.ts`가 ChatGPT 구독 거절 code(`subscription_sharing_*`, `chatpass_v2_*`)를 retry 없는 `credential_unavailable`로 분류한다(429보다 앞선다).
  - 발급자 요청 대기열은 MCP와 provider가 같이 쓰는 하나다: protocol `issuer-requests.ts`(`TakeIssuerRequest`·`FinishIssuerRequest`, route `issuer-requests/take`·`done`), core `lophn-agent/issuer-requests.ts`, runtime `issuer-pump.ts`. GET(JWKS)과 loopback http를 받는다. 옛 `mcpAuthRequest*`, `mcp-auth-requests.ts`, `mcp-auth-pump.ts`를 지웠다. callback listener도 하나다(`openCallbackListener`, 발급 client_id와 `error`를 받는다). `providers/adapters/oauth-transport.ts`를 지웠다.
  - 화면: 단추는 ChatGPT "Continue with ChatGPT", SuperGrok "Sign in with SuperGrok"이다. 누르면 browser를 열고 기다림을 보이며(device code면 code를 크게) interval마다 complete를 부른다. 거절·기한 지남은 따로 알린다. 끊기는 이름 셋을 지운다. `windowSecretOpener`·`SecretIntent`·`openProtected`와 문구 `settings.notice.method-unverified`를 지웠다.
why: |
  사람이 ChatGPT·SuperGrok 구독으로 model을 쓰려 했다. 반쯤 만든 로그인 길이 화면에 단추만 보였다.
decisions:
  - text: |-
      구독 OAuth를 제품에 둔다.
    by: person
  - text: |-
      Claude 구독 로그인은 두지 않는다. Anthropic의 legal-and-compliance 문서가 제3자 앱의 Claude.ai 로그인과 구독 credential 사용을 금지하고, 참고 구현은 모두 Claude Code의 client와 Claude Code인 척(system 머리말, user-agent, tool 이름)으로만 model을 불렀다. opencode는 Anthropic 법무 요청으로 지웠다. 버린 길: 같은 위장.
    by: agent
  - text: |-
      ChatGPT는 OpenAI 공식 길, SuperGrok은 남의 공개 client(Grok CLI)다. 제3자가 등록하는 xAI 길이 없고 xAI가 Hermes·OpenCode 연동을 발표했다. 버린 길: Codex CLI client와 `chatgpt.com/backend-api`(OpenAI 문서가 쓰지 말라고 한다).
    by: agent
  - text: |-
      발급자 HTTP는 runtime이 대신 보낸다(core module graph에 외부 fetch 없음). MCP 대기열을 이름을 바꿔 같이 쓴다. 버린 길: core에 fetch를 주기.
    by: agent
  - text: |-
      Complete는 기다리지 않고 화면이 되부른다. 오래 잡힌 요청과 붙여넣기 창이 없어진다.
    by: agent
  - text: |-
      발급자 주소는 정의 data이고 `BeginProviderLogin`이 정의 객체를 받는다. 제품에 test flag를 두지 않고 fake 발급자를 쓰려고.
    by: agent
  - text: |-
      갱신이 발급자에 닿지 못하면 지금 token이 살아 있는 동안은 그대로 건넨다.
    by: agent
follow_up: |-
  ChatGPT plan usage는 open-source client에 self-serve이고 상업 앱은 OpenAI에 신청해야 한다. 실제 계정 로그인과 호출은 사람이 앱에서 확인한다. core E2E(fake 발급자 `tests/support/fake-oauth/`)는 다음 계획 `e2e-coverage`가 만든다. 남은 bug: `issues/platform.md`의 "ChatGPT로 로그인한 provider가 그 계정이 못 쓰는 model도 고르게 둔다".
