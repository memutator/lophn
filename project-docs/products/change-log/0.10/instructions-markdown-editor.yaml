id: instructions-markdown-editor
version: 0.10.0
title: "지침 편집을 markdown 편집기로, DOMAIN.md도 그 자리에서. instructions 공간을 지운다"
modules: [packages/shell/renderer, packages/design, tools]
checked: []
change: |
  전:
  - 앞 항목의 인라인 지침 편집은 맨 글칸(Textarea)이었다.
  - 앱 공간 App details의 Domains 줄 menu에서 Open DOMAIN.md를 누르면 창 전체가 지침 파일 편집기(instructions 공간)로 바뀌었다.
  후:
  - 지침 상자의 [Edit]은 파일 탭과 같은 markdown 편집기(editor/markdown-editor.tsx, live preview)를 글칸 테두리 안에 연다. 저장·conflict·[Reload]는 앞 항목과 같다.
  - App details에서 Open DOMAIN.md를 누르면 그 domain 줄 바로 아래가 같은 편집기가 된다. [Cancel]이나 저장하면 닫힌다. project 창 sidebar의 Open DOMAIN.md는 지금처럼 파일 탭으로 연다.
  계약:
  - 지운 것: instructions 공간(Route.space "instructions", Route.instructions, openInstructions), InstructionsEntry·InstructionsButton·windowInstructionsSource(editor/instructions-entry.tsx), Desktop의 instructions prop, AppSpace의 onInstructions·onDomainDoc, AppDetail의 onInstructions·onOpenDomainDoc, DomainsSection의 onOpenDoc, dev-mock mockInstructions·SEED_INSTRUCTIONS_DOCUMENT, wording document.button.instructions·document.label.these-instructions.
  - 생긴 것: AppDetailSource.readDomainDoc·writeDomainDoc, InstructionsEditor의 onClose(보기 없이 편집으로 연다), wording domain.label.doc·domain.error.doc-failed.
why: |
  사람이 지침을 별도 편집기가 아니라 우리 markdown 편집기로 고치자고 했다.
decisions:
  - text: "지침 편집은 파일 탭과 같은 markdown 편집기다. 버린 길: 맨 글칸(markdown이 그대로 보인다)."
    by: person
  - text: "앱 공간의 DOMAIN.md도 화면을 바꾸지 않고 그 줄 아래에서 연다. instructions 공간은 쓰는 곳이 없어 지운다."
    by: agent
