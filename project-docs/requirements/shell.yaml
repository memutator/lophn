schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # 공간과 창

  - id: req-0058
    status: accepted
    subject: shell
    statement: project 밖의 최상위 공간 이름은 Lophn Workspace다.
    acceptance:
      - project 밖 최상위 공간을 가리키는 화면 말이 모두 Lophn Workspace다.

  - id: req-0059
    status: accepted
    subject: shell
    statement: Lophn Workspace는 project 화면의 칸·탭 구조가 아닌 따로인 page다. 문서와 context는 project 화면에서 연다.
    acceptance:
      - Lophn Workspace는 project 화면과 다른 page로 열린다.
      - 문서와 context는 project 화면의 탭으로 열린다.
    related:
      - projects
      - contexts

  - id: req-0060
    status: accepted
    subject: shell
    statement: 전역 설정, 앱 목록, project 목록은 Lophn Workspace에서 다룬다.
    acceptance:
      - agent 전역 설정을 포함한 전역 설정 화면은 Lophn Workspace의 Settings에 있다.
      - Lophn Workspace의 Apps와 Projects 화면에서 앱과 project를 보고, 등록하고, 보관하고, 다시 꺼낸다.
    related:
      - agents

  - id: req-0061
    status: accepted
    subject: shell
    statement: 메인 화면(launcher)에는 Projects section이 있고 그 아래에 Apps section이 있다.
    acceptance:
      - launcher에서 Projects section 바로 아래에 Apps section이 보인다.

  - id: req-0062
    status: accepted
    subject: shell
    statement: 창에는 최소화, 최대화, 닫기 control이 있다.
    acceptance:
      - 모든 lophn 창에서 최소화, 최대화, 닫기를 누를 수 있다.

  - id: req-0063
    status: accepted
    subject: shell
    statement: notice는 layout 자리를 차지하지 않고 toast처럼 뜬다.
    acceptance:
      - notice가 떠도 탭 줄과 본문의 위치가 밀리지 않는다.
      - 터미널 탭에서도 notice가 탭 줄 위에 자리를 잡지 않는다.

  - id: req-0064
    status: accepted
    subject: shell
    statement: 앱 화면의 틀(chrome) 글자는 긁히지 않는다. 콘텐츠 글자만 긁힌다.
    acceptance:
      - sidebar, 탭 줄, 단추, 메뉴의 글자를 끌어서 고를 수 없다.
      - 문서 본문 같은 콘텐츠의 글자는 끌어서 고를 수 있다.

  - id: req-0065
    status: accepted
    subject: shell
    statement: lophn 화면의 scrollbar는 native scrollbar가 아니라 lophn의 component다.
    acceptance:
      - Settings 탭 줄을 포함해 스크롤되는 영역은 모두 lophn scrollbar component로 그려진다.
    related:
      - design

  - id: req-0066
    status: accepted
    subject: shell
    statement: Settings는 왼쪽 세로 탭으로 이루어지고, 탭은 group으로 묶이며, 탭 안은 section으로 나뉜다.
    acceptance:
      - Settings를 열면 왼쪽에 group으로 묶인 세로 탭 목록이 있다.
      - 탭 하나를 열면 그 안이 이름 붙은 section으로 나뉘어 있다.

  - id: req-0067
    status: accepted
    subject: shell
    statement: 콘텐츠 column은 최대 폭을 두고 창 가운데에 놓인다.
    acceptance:
      - Settings의 콘텐츠 column이 넓은 창에서 왼쪽에 붙지 않고 가운데에 있다.
      - 빈 상태의 icon, 문구, 단추가 가운데에 놓인다.

  - id: req-0068
    status: accepted
    subject: shell
    statement: context의 화면 말은 Context다.
    acceptance:
      - sidebar, 탭, 메뉴에서 context를 가리키는 말이 Context(여럿이면 Contexts)다.
    related:
      - contexts

  # project 화면과 탭

  - id: req-0069
    status: accepted
    subject: shell
    statement: project 화면에서 여는 화면은 탭이다. agent 대화, context, 검색도 탭 kind다.
    acceptance:
      - project 화면에서 문서, 터미널, 앱 패널, agent 대화, context, 검색이 각각 탭으로 열린다.

  - id: req-0070
    status: accepted
    subject: shell
    statement: 탭의 정보 패널(Info)은 그 탭 안에 연다.
    acceptance:
      - 문서 탭에서 Info를 열면 그 탭 안 오른쪽에 열리고, 다른 탭에는 보이지 않는다.

  - id: req-0071
    status: accepted
    subject: shell
    statement: 문서의 제목은 탭에 보이고, 편집·Info 같은 문서 조작은 탭 안의 얇은 view bar에 둔다.
    acceptance:
      - 문서 탭을 열면 탭 안 맨 위에 얇은 view bar가 있고 그 바로 아래에 본문이 온다.
      - 편집, Info 같은 문서 조작 단추는 탭 안 view bar에 있다.

  - id: req-0072
    status: accepted
    subject: shell
    statement: 문서 목차(Outline)는 칸 폭과 상관없이 목록으로 보인다.
    acceptance:
      - 좁은 칸에서도 Outline이 목록으로 보인다.
    related:
      - projects

  - id: req-0073
    status: accepted
    subject: shell
    statement: sidebar를 접으면 바로 가기 막대가 되고, 그 단추는 누르면 바로 탭을 연다.
    details:
      contains:
        - Terminal
        - Contexts
        - Saved views
        - Agent
        - Search
    acceptance:
      - 접힌 sidebar에 Terminal, Contexts, Saved views, Agent, Search 단추가 있다.
      - Search는 project 파일 검색을 연다.
      - 단추를 누르면 그 탭이 바로 열린다.

  - id: req-0074
    status: accepted
    subject: shell
    statement: agent 대화 탭 kind와 그 바로 가기 단추의 이름은 Agent다.
    acceptance:
      - agent 대화 탭과 그 바로 가기 단추에 Conversation이 아니라 Agent라고 쓰여 있다.

  # context 화면

  - id: req-0075
    status: accepted
    subject: shell
    statement: context 하나를 여는 Context 탭은 먼저 그 context의 도메인 모델을 사람 말로 보이고, 계약 세부는 따로 둔 Contract 탭에 둔다.
    details:
      contains:
        - 어떤 개체가 있는지
        - 개체마다 무엇인지
        - 개체끼리 어떻게 잇는지
    acceptance:
      - Context 탭을 열면 처음 보이는 하위 탭이 Overview이고, 거기에 개체와 개체 사이 관계가 보인다.
      - 계약 세부는 Contract 탭에서 본다.
    related:
      - contexts

  - id: req-0076
    status: accepted
    subject: shell
    statement: Overview는 그림과 함께 context 구성을 목록이나 tree로 보인다.
    details:
      contains:
        - 개체마다 어느 자료로 이루어지는지
        - 개체마다 무엇을 가지는지
        - 개체마다 무엇과 잇는지
    acceptance:
      - Overview에 개체 그림과 함께 개체별 자료·가진 것·이어진 것의 목록이나 tree가 있다.
    related:
      - contexts

  - id: req-0077
    status: accepted
    subject: shell
    statement: Context 탭은 그 context의 위반 목록, saved view, 용어집을 보인다.
    acceptance:
      - Context 탭에서 위반 목록, saved view, 용어집을 각각 볼 수 있다.
    related:
      - contexts

  - id: req-0078
    status: accepted
    subject: shell
    statement: 검색 화면은 계약의 검색 선언으로 그린다. 검색어가 맞는지만 보는 칸 하나가 검색 화면의 중심이 아니다.
    acceptance:
      - 검색을 고르면 그 선언에 있는 입력들과 결과 모양으로 화면이 그려진다.
    related:
      - contexts

  - id: req-0079
    status: accepted
    subject: shell
    statement: 검색에서 개체나 값을 고르는 입력은 타이핑으로 거를 수 있는 combobox다.
    acceptance:
      - 고르기 입력에 글자를 치면 선택지가 그 글자로 걸러진다.

  - id: req-0080
    status: accepted
    subject: shell
    statement: 검색 결과에는 page 이동이 있다.
    acceptance:
      - 결과가 한 page를 넘으면 다음 page와 이전 page로 옮길 수 있다.

  - id: req-0081
    status: accepted
    subject: shell
    statement: 검색 결과의 도메인 개체는 링크이고, 누르면 그 개체의 문서 탭을 바로 연다.
    acceptance:
      - 결과의 개체(예 F-009)를 누르면 그 개체의 문서(예 loop/findings/F-009.md)가 새 문서 탭으로 열린다.

  - id: req-0082
    status: accepted
    subject: shell
    statement: saved view는 project 화면에서 이름을 눌러 연다.
    acceptance:
      - project 화면에서 saved view 이름을 누르면 그 결과가 열린다.
    related:
      - contexts

  - id: req-0083
    status: accepted
    subject: shell
    statement: 계약 위반은 사람이 설명을 쓰지 않고, 위반 근거가 붙은 채로 Project Manager에게 넘길 수 있다.
    acceptance:
      - 위반 toast에서 시작해 글을 쓰지 않고 Project Manager session을 열 수 있다.
      - 그 session에는 어느 파일이 어느 규칙을 어겼는지가 붙어 있다.
    related:
      - contexts
      - agent-sessions

  # agent 부르기

  - id: req-0084
    status: accepted
    subject: shell
    statement: project 화면에서는 sidebar에서 agent를 부른다.
    acceptance:
      - sidebar에서 agent를 고르면 그 agent의 Agent 탭이 열린다.

  - id: req-0085
    status: accepted
    subject: shell
    statement: toast에서 agent를 부르면 그 toast의 사건을 context로 붙여 연다.
    acceptance:
      - toast에서 agent를 부르면 열린 session에 그 사건의 대상이 붙어 있다.
    related:
      - agent-sessions

  - id: req-0086
    status: accepted
    subject: shell
    statement: agent를 부르는 toast는 lophn이 결정적으로 판정할 수 있는 사건에서만 뜬다.
    details:
      forbids:
        - project 문서의 내용을 해석해서 toast를 띄우는 것
    acceptance:
      - project 문서의 내용(예 문서에 적힌 실험 결과)만 바뀌어서는 agent를 부르는 toast가 뜨지 않는다.
    related:
      - events

  - id: req-0087
    status: accepted
    subject: shell
    statement: 앱 공간에서는 title bar의 window control 옆 agent select에서 agent를 부른다.
    acceptance:
      - title bar의 agent select에서 agent를 고르면 그 agent가 열린다.
    related:
      - agents

  - id: req-0088
    status: accepted
    subject: shell
    statement: 앱 공간의 agent 화면은 project와 같은 Agent component를 쓴다.
    acceptance:
      - 앱 공간에서 연 agent의 대화, composer, 카드가 project의 Agent 탭과 같은 component로 그려진다.

  # Agent 탭

  - id: req-0089
    status: accepted
    subject: shell
    statement: session 목록은 Agent 탭 머리에서 연다. 그 목록 맨 위에는 session 검색 입력이 있다.
    acceptance:
      - Agent 탭 머리에서 session 목록을 열고 다른 session으로 바꿀 수 있다.
      - session 목록 맨 위 입력에 글자를 치면 session이 걸러진다.
    related:
      - agent-sessions

  - id: req-0090
    status: accepted
    subject: shell
    statement: session 목록 항목에 마우스를 올리면 이름 바꾸기, archive, 지우기가 보인다. 지우기는 휴지통 icon이다.
    acceptance:
      - session 항목에 마우스를 올리면 이름 바꾸기, archive, 지우기 조작이 나타난다.
      - 지우기 조작은 휴지통 icon으로 보인다.
    related:
      - agent-sessions

  - id: req-0091
    status: accepted
    subject: shell
    statement: 대화에서 내 메시지는 오른쪽, agent 메시지는 왼쪽에 놓고, agent 메시지에는 agent 이름과 프로필을 보인다.
    acceptance:
      - 내가 보낸 메시지는 오른쪽에 붙는다.
      - agent 메시지는 왼쪽에 붙고 agent 이름과 프로필 icon이나 이미지가 함께 보인다.
    related:
      - agents

  - id: req-0092
    status: accepted
    subject: shell
    statement: model picker에서는 별표한 model이 맨 위에 온다.
    acceptance:
      - model에 별표를 하면 picker 목록 맨 위로 올라온다.
    related:
      - models

  - id: req-0093
    status: accepted
    subject: shell
    statement: "`/` 메뉴는 전역 built-in 명령, 그 role의 built-in 명령, skill 세 종류를 보이고, skill은 전역 것과 그 agent 전용 것을 나누지 않는다."
    acceptance:
      - "`/`를 치면 전역 built-in 명령, 그 role의 built-in 명령, skill이 뜬다."
      - 전역 skill과 그 agent 전용 skill이 한 묶음에 구분 없이 보인다.
    related:
      - agent-roles

  # agent 설정

  - id: req-0094
    status: accepted
    subject: shell
    statement: project 화면에는 agent 관리 탭이 있고, 거기서 Operator를 만들고 skill, MCP, 지침, model을 정한다.
    acceptance:
      - project 화면에서 agent 관리 탭을 연다.
      - 그 탭에서 Operator를 새로 만들 수 있다.
      - 그 탭에서 project의 skill, MCP, 지침, model을 정할 수 있다.
    related:
      - agents

  - id: req-0095
    status: accepted
    subject: shell
    statement: agent 설정 화면은 project 지침과 그 agent의 지침을 같이 보인다.
    acceptance:
      - Operator 설정을 열면 그 Operator의 지침과 project 지침이 함께 보인다.
    related:
      - agents

  # 앱 화면 annotation

  - id: req-1486
    status: accepted
    subject: shell
    statement: 앱 화면에는 annotate mode가 있어, 사람이 요소를 클릭하거나 영역을 끌어 고르고 그 자리에 메모를 단다. 여러 annotation을 모아 한 번에 보낼 수 있다.
    acceptance:
      - 요소를 클릭하면 그 요소에 메모 칸이 붙는다.
      - 영역을 끌어 고르면 그 영역에 메모 칸이 붙는다.
      - 여러 annotation을 모아 둔 뒤 한 번에 보낸다.
    related:
      - apps
      - agent-roles

  - id: req-1498
    status: accepted
    subject: shell
    statement: "사람은 모든 session의 대기 권한 요청, agent의 질문, 보류 허락 요청(activation 허락 등)을 한 목록에서 보고 답한다. coding agent의 권한 요청은 목록에서 누르면 그 터미널 탭으로 가서 답한다."
    acceptance:
      - "여러 session에 물음이 걸려 있고 activation 허락 요청이 있으면 한 목록에 모두 나온다."
      - "목록에서 session의 물음에 답하면 그 session의 turn이 이어 간다."
      - "권한 요청과 agent의 질문은 같은 목록에서 종류가 구별되어 보인다."
      - "coding agent의 권한 요청을 목록에서 누르면 그 session의 터미널 탭으로 focus가 옮겨 간다."
      - "목록에서 activation 허락에 답하면 그 activation이 이어 간다."
    related:
      - approvals

  - id: req-1506
    status: accepted
    subject: shell
    statement: "call로 들어온 입력은 대화에 보낸 쪽과 함께 보이고, 누르면 맡긴 글, 근거, 보낸 session을 본다. 보낸 session에는 보낸 call이 대화에 남고, 답은 그 call에 이어진 메시지로 들어오며, 누르면 그때의 상태를 본다."
    acceptance:
      - "받은 session에서 call로 들어온 메시지에 보낸 agent(또는 lophn과 그 사건)가 보이고, 누르면 맡긴 글, 근거 링크, 보낸 session 링크가 보인다."
      - "보낸 session에서 답과 실패가 그 call에 이어진 새 메시지로 들어온다."
      - "보낸 call을 누르면 그때의 상태가 보인다."
    related:
      - agent-sessions

  - id: req-1515
    status: accepted
    subject: shell
    statement: "앱 화면은 project를 정해 열 수 있고, 그 화면에서 부르는 project 범위 app-api는 그 project로 돈다."
    acceptance:
      - "project 안에서 앱을 열면 그 project로 열린다."
      - "앱 place에서 열면 앱 화면 안에서 project를 고른다."
      - "project로 연 화면에서 부른 project 범위 app-api는 그 project의 data만 다룬다."
    related:
      - apps
      - sdk
