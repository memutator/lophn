  - path: tests/e2e/app-release_test.ts
    covers: [release-prepare:prepared, release-prepare:failed-handlers, preview-start:started, preview-observe:none, preview-stop:stopped, tool-call-execute:ok, app-invocation-read:listed, release-activate:waiting-consent, activation-consent:reject, activation-consent:allow, activation-complete:active, release-state-read:ok, app-read:ok, app-supervisor-reconcile:started, builtin-sdk-install:installed, app-command-call:succeeded, app-preview-command-call:succeeded]
