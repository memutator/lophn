id: hidden-desk-terminal-url-opens-os-browser
title: 다른 desk에 있는 terminal이 연 URL은 browser 탭이 아니라 OS browser로 열린다
kind: bug
status: fixed
topic: workspace-layout
modules: [packages/shell/renderer]
now: |
  `packages/shell/renderer/terminal/use-bridge-open-requests.ts`의 `openBridgeUrl`이 그 terminal을 `allTabs(host.view)`(보이는 desk)에서만 찾는다. 다른 desk에 있으면 false를 돌려 ack하지 않고, main(`packages/shell/main/browser-bridge/bridge.ts`)이 1.5초 뒤 `declined`로 답해 shim이 OS browser로 연다.
impact: |
  링크를 browser 탭으로 열게 설정한 사람이 숨은 desk의 terminal에서 연 URL(예: CLI login)이 OS browser에 열린다. URL은 잃지 않는다.
fix: |
  (작음) terminal을 `host.windowTabs()`에서 찾고, 그 terminal의 desk에 browser 탭을 연다. 지금 `openAcrossDesks`는 어디에도 없는 새 탭을 보이는 desk에 붙이므로 desk를 정하는 인자가 필요하다. 추천: 작음 안.
closed: |
  `packages/shell/renderer/terminal/use-bridge-open-requests.ts`의 `openBridgeUrl`이 terminal을 `host.windowTabs()`(모든 desk)에서 찾고, 보이지 않는 desk의 terminal이면 `after: terminal.key`로 연다. `packages/shell/renderer/workspace/model.ts`의 `openAcrossDesks`는 새 탭의 `after`가 다른 desk에 있으면 그 desk로 건너가 그 탭 바로 뒤에 연다. 사람이 로그인 page를 보게 그 desk로 넘어간다.
guard: packages/shell/renderer/workspace/model_test.ts의 openAcrossDesks 줄 "새 탭이 after로 다른 자리의 탭을 가리키면 그 자리에서 그 뒤에 열기"
