id: archive-stops-turn-started-elsewhere
title: 한 기기가 대화를 보관하면 다른 기기가 방금 시작한 turn이 말없이 멈춘다
kind: bug
status: open
topic: agent-chat
modules: [packages/core/lophn-agent, packages/shell/renderer]
now: |
  보관은 session을 끝내면서 도는 turn을 멈춘다(`packages/core/lophn-agent/session/commands.ts`의 `endSession`). 화면은 `state_seq`를 읽어 그 값으로 바로 보관을 부르는데(`packages/shell/renderer/conversation/agent-tab-core-source-sessions.ts`), `state_seq`는 메시지나 turn으로는 오르지 않아 그 사이 다른 기기가 turn을 시작했어도 비교가 통과한다. 다른 기기는 `SessionEnded`를 받고 읽기 전용이 된다.
impact: |
  한 사람이 폰에서 일을 시킨 직후 컴퓨터에서(또는 반대로) 그 대화를 보관하면 시킨 일이 안내 없이 멈춘다.
fix: |
  - 작음(추천): turn이 도는 동안의 보관은 `conflict`로 답하고 화면이 "도는 turn을 멈추고 보관할까요"를 물은 뒤 멈추라는 표시와 함께 다시 부른다.
  - 그대로: 보관은 늘 멈춘다고 두고 화면이 보관 전에 도는 중임을 보인다.
decide: |
  turn이 도는 대화를 보관할 때 한 번 물을지. 추천은 묻는 것이다.
