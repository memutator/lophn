  - {entry: "sdk:cap-net/CapabilityError", reason: "오류 class다. 동작이 없다"}
  - {entry: "sdk:cap-net/DEFAULT_READ_RETRIES", reason: "재시도 횟수 기본값 상수다. 쓰는 동작은 sdk-net-fetch가 맡는다"}
  - {entry: "sdk:cap-net/DEFAULT_RETRY_DELAYS_MS", reason: "재시도 간격 기본값 상수다. 쓰는 동작은 sdk-net-fetch가 맡는다"}
  - {entry: "sdk:cap-net/DEFAULT_TIMEOUT_MS", reason: "시도 하나의 시간 제한 기본값 상수다. 쓰는 동작은 sdk-net-fetch가 맡는다"}
  - {entry: "sdk:cap-net/REQUIRED_PERMISSIONS", reason: "상수다. release 준비가 검사한다"}
  - {entry: "sdk:cap-net/checkDeclaration", reason: "SDK 쪽 선언 검사 사본이다. 실제 판정은 release 준비(release-prepare의 failed-release)다"}
  - {entry: "sdk:cap-notify/CAP_HOST", reason: "host port의 symbol 상수다. 값을 세우는 쪽은 앱 child의 runtime이다"}
  - {entry: "sdk:cap-notify/CapabilityError", reason: "오류 class다. 동작이 없다"}
  - {entry: "sdk:cap-notify/REQUIRED_PERMISSIONS", reason: "상수다. release 준비가 검사한다"}
