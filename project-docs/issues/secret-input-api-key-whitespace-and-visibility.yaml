id: secret-input-api-key-whitespace-and-visibility
title: API key 입력 창이 공백이 섞인 값을 그대로 저장하고 내용을 눈으로 확인할 수 없다
kind: bug
status: fixed
topic: settings
modules: [packages/core/lophn-agent, packages/shell/renderer, packages/shell/main]
now: |
  `packages/shell/renderer/secret-input/secret-input.tsx`는 보기 전환 없는 `type="password"` 입력만 두고 공백을 검사하지 않으며, `packages/core/lophn-agent/providers/connect-key.ts`와 `input_request/answer_secret`도 앞뒤 공백을 자르거나 중간 공백·줄바꿈이 섞인 API key를 거절하지 않는다. 클립보드에 API key 뒤로 공백과 다른 단어가 딸려 붙여넣어져도 저장은 성공하고 매 turn 401(`credential_unavailable`)만 되풀이된다.
impact: |
  잘못 복사된 API key를 여러 번 다시 붙여넣어도 무엇이 들어갔는지 볼 수 없고 저장 단계에서 걸러지지 않아 계속 401 오류가 난다.
fix: |
  provider API key는 앞뒤 공백을 자르고 중간에 공백·줄바꿈이 있으면 `invalid_input`으로 바로 알리며, `secret-input.tsx`에 표시·숨김 전환 단추를 둔다.
closed: |
  core와 shell main·renderer에서 provider API key의 앞뒤 공백을 다듬고 내부 공백·줄바꿈을 invalid_input으로 거절하며, secret 입력창에 내용 보기 토글을 더했다.
guard: packages/core/lophn-agent/providers/connect-key_test.ts, packages/shell/main/secret-input/submit_test.ts
