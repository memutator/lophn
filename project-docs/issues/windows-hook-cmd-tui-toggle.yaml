id: windows-hook-cmd-tui-toggle
title: "Windows에서 GUI↔TUI toggle이 없다(TUI 끄기 signal 없음)"
kind: bug
status: open
topic: platform
modules: [packages/core/terminals, packages/core/terminal-agents]
now: |
  hook socket(named pipe), PowerShell 시작 층(`claude --gui` 등), Windows hook 실행·설치(설치본 `bin/lophn` sh launcher와 `bin/lophn.cmd` fast-exit, plugin `cmd.exe` spawn, Windows 경로 `ownedCommand`/`placedCommand`, Codex/Muse 구분자, Copilot `powershell`, Cline `.ps1`), Windows foreground 감지(shell pid 아래 process tree)는 모두 동작한다. 남은 것은 아래 하나다.

  - TUI 끄기: `packages/core/terminals/host/main.ts`의 `signal` 요청은 Linux만이고 다른 OS는 거절한다. harness-gui(`packages/core/harness-gui/`)가 TUI를 끄려고 부르는 `terminal.signal`은 Windows에서 거절되고 `coding-sessions.ts`가 Windows toggle을 `unsupported_os`로 막고 있다.
impact: |
  Windows에서 GUI↔TUI toggle을 쓸 수 없다.
fix: |
  - TUI 끄기는 signal 대신 ConPTY에 Ctrl+C를 쓰거나 그 process tree를 끄는 방식으로 구현한다. 그 전까지는 `architecture/platform.md` 지키는 것 4("반쯤 도는 채로 두지 않는다")대로 Windows에서 toggle이 없음을 보인다.
