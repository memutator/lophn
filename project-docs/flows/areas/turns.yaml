area: turns
flows:
  # ---- turn 시작과 끝 ----
  - id: turn-pump-start
    title: queue의 입력 하나를 골라 turn을 시작하거나 시작하지 못한 것을 닫는다
    actor: system
    entries: [system:turn-pump]
    uses: [turn-start:running, turn-finish:failed, extension-tool-catalog:listed]
    boundary: [run-loop, child-supervision-protocol]
    code: [packages/core/main/agent-runtime/product-driver.ts, packages/core/lophn-agent/run-loop/driver.ts, packages/core/lophn-agent/run-loop/work.ts, packages/core/lophn-agent/run-loop/prepare.ts]
    steps:
      - "500ms 주기 pump가 provider 해지 알림을 훑고 queue에서 맨 앞 session의 입력을 고른다. 도는 session은 건너뛴다"
      - "그 session이 이전 대화가 커져 Compact가 정해졌으면 기다리지 않고 compact-summarize를 연 뒤 다음 session을 본다"
      - "prepare가 session 열림, agent 정의, 설정 한도, 지침 층, 쓸 tool 목록(extension 포함)을 읽고 resolved agent를 turn 기준에 고정한다"
      - "정의·model을 쓸 수 없으면 StartTurn과 FinishTurn(failed)을 한 번씩 보내 그 turn만 닫는다. 입력은 소비된다"
      - "harness runtime의 session이면 target_unavailable로 닫는다"
      - "ready면 turn-start를 보내고 agent credential을 받는다. 받지 못하면 failed(configuration_unavailable)로 닫는다"
      - "시작한 입력을 queue에서 꺼내 session을 도는 중으로 두고 turn-loop에 넘긴다. 시작 못 한 입력은 queue에 남아 다음 주기에 다시 고른다"
    outcomes:
      - id: started
        observe: [ledger:turns, ledger:messages, event:TurnStarted]
        when: turn이 running으로 시작되고 loop가 돈다
      - id: closed-model-required
        observe: [ledger:turns, event:TurnStarted, event:TurnEnded]
        when: session, agent, project, 전역 어디에도 model이 없다(failed model_required)
      - id: closed-target-unavailable
        observe: [ledger:turns, event:TurnStarted, event:TurnEnded]
        when: agent 정의가 없거나 harness runtime의 session이라 lophn이 돌리지 않는다(failed target_unavailable)
      - id: closed-configuration-unavailable
        observe: [ledger:turns, event:TurnStarted, event:TurnEnded]
        when: agent 정의가 잘못됐거나 지침 층을 못 읽었거나 workspace 지침이 없거나 model을 못 쓰거나 credential을 받지 못했다(failed configuration_unavailable)
      - id: waiting
        observe: [log:diagnostics]
        when: prepare가 실패했다(session이 닫힘 등). turn은 열리지 않고 입력은 queue에 남아 같은 입력을 다음 주기에 다시 고른다
      - id: compacting
        observe: [event:CompactStarted]
        when: 다음 turn 전에 이전 대화를 Compact하도록 session을 잡았다. turn은 아직 열리지 않는다
    crosses_process: true
    risk: []
    refs: [T4, W4]
    docs: [architecture/agent-chat.md, architecture/workspace-session.md]
    unclear:
      - "prepare가 Err를 돌려주면 driver는 unavailable로만 보고 입력을 queue에 둔다. 닫힌 session의 입력이 실제로 남는지 확인이 필요하다(session 닫기 때 queue를 비운다)"
      - "closed-* outcome은 StartTurn 뒤 FinishTurn 두 번이라 TurnStarted와 TurnEnded가 모두 난다. 화면과 테스트가 이것을 전제하는지 확인이 필요하다"

  - id: turn-loop
    title: turn 하나의 agent loop를 돌려 completed, stopped 또는 failed로 끝낸다
    actor: system
    entries: [system:turn-loop]
    uses: [turn-checkpoint:running, turn-finish:completed, turn-finish:failed, model-call-run:complete, tool-call-batch:success]
    pre: [turn-pump-start:started]
    boundary: [run-loop, models]
    code: [packages/core/lophn-agent/run-loop/loop.ts, packages/core/lophn-agent/run-loop/turn.ts, packages/core/lophn-agent/run-loop/limits.ts, packages/core/lophn-agent/run-loop/core-ports.ts, packages/core/lophn-agent/prompt-assembly/turn-prompt.ts]
    steps:
      - "걸음마다 먼저 멈춤을 본다. core가 turn 행을 이미 닫았으면 FinishTurn 없이 stopped로 끝난다"
      - "접수 입력(첫 입력과 steer)을 고르고 model 시도 수와 무진행 시간 한도, provider 연결을 본다"
      - "prompt를 조립한다. 예산의 85%를 넘으면 turn 안 Compact나 오래된 tool 결과 줄이기로 낮추고, 그래도 input_over_budget이면 context_limit으로 끝낸다"
      - "model-call-run으로 model 호출 하나를 하고 완전한 응답이면 그 응답을 agent message로 남긴다"
      - "tool 응답이면 tool-call-batch로 묶음을 실행하고 결과를 이력에 붙인 뒤 checkpoint한다"
      - "tool 없는 완전한 답이면 미반영 steer를 확인하고 completed(answer_completed)로 FinishTurn한다. steer가 남았으면 끝내지 않고 다음 판단으로 간다"
      - "한도에 닿으면 machine이 확정한 사실만으로 failed로 끝낸다. 끝내는 길은 모두 finish를 거친다"
    outcomes:
      - id: completed
        observe: [ledger:turns, ledger:messages, event:MessageRecorded, event:TurnEnded]
        when: 완전한 답으로 끝났다(answer_completed)
      - id: stopped
        observe: [process:agent-runtime]
        when: 사람 멈춤, session 끝남 또는 restart로 core가 turn을 이미 닫았다. loop는 새 호출을 막고 FinishTurn 없이 끝난다
      - id: failed-model-error
        observe: [ledger:turns, ledger:model_calls, event:TurnEnded]
        when: 일시 실패가 아닌 model 실패, 재시도 소진, partial 응답 3회 연속, 알 수 없는 실패 code
      - id: failed-context-limit
        observe: [ledger:turns, event:TurnEnded]
        when: 입력이 예산을 넘고 turn 안에서 더 줄일 것이 없다, provider가 context_exceeded를 세 번째로 거절했다
      - id: failed-model-attempt-limit
        observe: [ledger:turns, event:TurnEnded]
        when: model_attempts 설정 상한에 닿았다. 기본은 상한 없음이라 설정할 때만 난다
      - id: failed-stall-limit
        observe: [ledger:turns, event:TurnEnded]
        when: 진행 없는 시간이 stall_ms(기본 300초)를 넘었다. 사람 기다림 중에는 세지 않는다
      - id: failed-configuration-unavailable
        observe: [ledger:turns, event:TurnEnded]
        when: provider 연결이 없거나 회수됐다, 재시도 대기 중 연결이 사라졌다, 요청 안전화를 끝내지 못했다, prompt 설정(invalid_budget)이 잘못됐다
      - id: failed-internal
        observe: [ledger:turns, event:TurnEnded, log:diagnostics]
        when: loop가 예외를 던졌다. driver가 loop_threw로 닫는다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/run.md, architecture/agent-chat.md]
    unclear:
      - "TURN_OUTCOME_REASONS에는 있으나 loop가 내지 않는 reason이 있다: tool_error, repeated_tool_failure, effect_unknown(LoopFailureReason 타입에만 있다), clock_uncertain, active_limit(지워진 한도), no_answer(run 쪽이 낸다). 죽은 값인지 정하고 schema에서 뺄지 본다"
      - "driver.ts는 LoopEnd가 finish_failed(FinishTurn을 확정하지 못함)이면 turn 행을 닫지 않는다. 행이 running으로 남으면 session의 다음 StartTurn이 conflict로 막힌다고 보인다. 확인이 필요하다"
      - "retry.ts 주석의 시도 한도(30)는 기본값 null과 맞지 않는다. 주석을 고칠지 본다"

  - id: turn-start
    title: queue 입력을 turn으로 확정하는 StartTurn을 받는다
    actor: system
    entries: [route:turns/start]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/run-loop/commands.ts, packages/protocol/lophn-agent/turns.ts, packages/core/lophn-agent/run-loop/model.ts]
    steps:
      - "같은 id의 재전달이면 이전 결과를 돌려준다. 같은 id가 다른 입력에 쓰였으면 거절한다"
      - "입력 message가 있고 이 session의 것이며 아직 turn을 열지 않았는지 본다"
      - "한도 입력이 지금 설정 파일의 한도와 같은지 본다. machine이 보낸 값을 그대로 받지 않는다"
      - "같은 session에 running turn이 없는지 본다(session마다 하나)"
      - "기준과 resolved agent blob을 영구 참조로 등록하고 turn 행을 running으로 넣는다"
      - "입력 message와 그 session의 ! shell 기록에 turn을 붙이고, call 입력이면 Router에 가져갔다고 알린다"
      - "TurnStarted를 commit 뒤 Bus로 낸다"
    outcomes:
      - id: running
        observe: [ledger:turns, ledger:messages, event:TurnStarted, response]
        when: turn이 running으로 열렸다. 같은 id 재전달도 같은 응답이다
      - id: input-not-found
        code: not_found
        observe: [response]
        when: 입력 message가 없다
      - id: input-other-session
        code: invalid_input
        observe: [response]
        when: 입력 message가 다른 session의 것이다
      - id: limits-mismatch
        code: invalid_input
        observe: [response]
        when: 준비할 때와 지금 설정의 한도가 달라졌다. 다음 주기에 다시 준비한다
      - id: input-taken
        code: conflict
        observe: [response]
        when: 입력 message가 이미 다른 turn을 열었다, 또는 같은 turn id가 다른 입력에 쓰였다
      - id: session-busy
        code: conflict
        observe: [response]
        when: 같은 session에 running turn이 이미 있다
      - id: limits-unresolved
        code: unavailable
        observe: [response]
        when: data root를 알 수 없거나 한도 설정을 읽지 못했다. turn을 시작하지 않는 쪽으로 닫힌다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear:
      - "같은 id 재전달 분기(commands.ts start)는 기존 turn이 이미 finished여도 state를 running으로 돌려주는 것으로 보인다. 맞는지 확인이 필요하다"

  - id: turn-checkpoint
    title: turn의 active·stall 시간과 이력을 저장한다
    actor: system
    entries: [route:turns/checkpoint]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/run-loop/commands.ts, packages/core/lophn-agent/run-loop/core-ports.ts]
    steps:
      - "loop가 model 호출과 tool 묶음 뒤, 끝내기 전에 시간 값과 이 turn의 이력 blob을 보낸다"
      - "turn이 running이고 state_seq가 같은지 본다"
      - "active가 줄었거나 checkpoint 시각이 앞 값보다 이르면 거절한다"
      - "이력 hash가 바뀌었으면 옛 이력 참조를 지우고 새 참조 하나만 둔다"
    outcomes:
      - id: running
        observe: [ledger:turns, ledger:blob_refs, response]
        when: 시간과 이력이 저장됐다
      - id: not-running
        code: conflict
        observe: [response]
        when: turn이 이미 끝나 있다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: time-back
        code: invalid_input
        observe: [response]
        when: active_ms가 줄었거나 checkpoint_at이 앞 값보다 이르다
      - id: not-found
        code: not_found
        observe: [response]
        when: turn이 없다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear: []

  - id: turn-finish
    title: loop가 정한 completed 또는 failed 결과로 turn을 끝낸다
    actor: system
    entries: [route:turns/finish]
    boundary: [run-loop, core-api]
    code: [packages/core/lophn-agent/run-loop/commands.ts, packages/core/lophn-agent/run-loop/turn.ts, packages/core/lophn-agent/run-loop/limits.ts]
    steps:
      - "loop가 답으로 끝나면 completed, 한도나 model 실패로 끝나면 failed(reason)로 finish를 보낸다"
      - "turn이 finished면 거절한다. 멈춤이 먼저 끝냈으면 loop는 stopped로 받는다"
      - "state_seq가 달라졌으면 거절한다. interrupted는 이 길로 못 보낸다(StopTurn이나 InterruptTurns 전용)"
      - "결과 blob을 영구 참조로 등록하고 TurnEnded를 commit 뒤 낸다(error는 reason을 싣는다)"
    outcomes:
      - id: completed
        observe: [ledger:turns, event:TurnEnded]
        when: outcome completed(answer_completed)로 끝났다
      - id: failed
        observe: [ledger:turns, event:TurnEnded]
        when: outcome failed(reason)로 끝났다. reason은 turn-loop의 갈래와 같다
      - id: already-final
        code: conflict
        observe: [response]
        when: turn이 이미 finished다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: interrupt-rejected
        code: invalid_input
        observe: [response]
        when: outcome이 interrupted다
      - id: not-found
        code: not_found
        observe: [response]
        when: turn이 없다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/run.md, architecture/agent-chat.md]
    unclear:
      - "core-ports.ts의 finish는 conflict 문구에 steering이 있으면 pending_input으로 돌려주는 갈래를 두지만, commands.ts의 finish는 그 문구를 내지 않는다. 닿지 않는 갈래로 보인다. 확인 후 지울지 정한다"

  - id: turn-stop
    title: 사람이 도는 turn을 멈추고 사람이 본 글을 남긴다
    actor: person
    entries: [route:turns/stop]
    boundary: [run-loop, acp, core-api]
    code: [packages/core/lophn-agent/run-loop/live-turns.ts, packages/core/lophn-agent/run-loop/commands.ts, packages/core/main/daemon/wiring/lophn-agent-runtime.ts]
    steps:
      - "화면의 멈춤 단추가 AcpSend로 가고 core가 사람의 자격으로 StopTurn을 부른다. run과 workflow의 멈춤도 machine 자격으로 같은 길을 쓴다"
      - "writer 앞 처리기 withLiveTurns가 StopTurn 전에 사람이 본 글(writing)을 RecordMessage로 저장하고 MessageRecorded를 낸다"
      - "active 시간을 CheckpointTurn으로 마감한 뒤 StopTurn이 turn을 interrupted(user_stopped)로 닫고 TurnEnded를 낸다"
      - "이미 끝난 turn이면 기존 결과를 replayed로 돌려주고 turn을 바꾸지 않는다"
      - "commit 뒤 TurnEnded를 받은 lophn-agent-runtime이 child에 turn_stop을 보내 진행 중인 model 요청과 tool을 끊는다"
    outcomes:
      - id: stopped
        observe: [ledger:turns, ledger:messages, event:MessageRecorded, event:TurnEnded, process:agent-runtime]
        when: 도는 turn을 user_stopped로 닫았다
      - id: replayed
        observe: [response]
        when: turn이 이미 끝나 있어 기존 결과를 돌려줬다
      - id: state-changed
        code: conflict
        observe: [response]
        when: state_seq가 달라졌다
      - id: not-allowed
        code: forbidden
        observe: [response]
        when: 사람이나 machine이 아닌 자격이다
      - id: not-found
        code: not_found
        observe: [response]
        when: turn이 없다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/agent-chat.md]
    unclear:
      - "사람 멈춤 때 저장되는 글은 StopTurn route가 아니라 writer 앞 처리기(live-turns.ts withLiveTurns)가 만든다. route 테스트만으로는 저장된 message가 보이지 않는다"

  - id: turn-interrupt
    title: child가 사라지면 그 child의 도는 turn을 interrupted(restarted)로 닫는다
    actor: system
    entries: [route:turns/interrupt]
    boundary: [run-loop, child-supervision-protocol]
    code: [packages/core/lophn-agent/run-loop/interrupt.ts, packages/core/lophn-agent/run-loop/live-turns.ts, packages/core/main/daemon/wiring/lophn-agent-runtime.ts, packages/core/lophn-agent/run-loop/runtime.ts]
    steps:
      - "agent runtime child가 종료되면(onEnd) core가 machine 자격으로 InterruptTurns를 부른다"
      - "writer 앞 처리기가 core 메모리에서 센 active를 turn마다 CheckpointTurn으로 마감한다"
      - "같은 tx에서 running인 turn 전부를 interrupted(restarted)로 닫고 TurnEnded를 낸다"
      - "ledger가 닫힌 뒤 queue의 도는 표시를 푼다. 새 입력이 running 행과 겹치지 않게 하려는 순서다"
    outcomes:
      - id: interrupted
        observe: [ledger:turns, event:TurnEnded]
        when: child가 돌리던 turn이 하나 이상 있었다
      - id: nothing-running
        observe: [response]
        when: child가 사라졌지만 도는 turn이 없었다
      - id: not-machine
        code: forbidden
        observe: [response]
        when: machine 자격이 아니다
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/workspace-session.md]
    unclear:
      - "끝나지 않은 model call과 tool call 행(started, requested)을 닫는 곳이 없다. lophn-agent.harness-tools.close-stuck schema step은 migration 때 한 번만 돈다. 죽은 child의 호출 행이 started로 남는지 확인이 필요하다"

  - id: turn-restart
    title: lophn이 켜질 때 돌던 turn을 interrupted로 닫고 아직 가져가지 않은 입력을 다시 줄 세운다
    actor: system
    entries: [system:turn-restart]
    uses: [route:calls/recover]
    boundary: [run-loop, router]
    code: [packages/core/main/daemon/wiring/router.ts, packages/core/router/commands.ts, packages/core/lophn-agent/run-loop/interrupt.ts, packages/core/lophn-agent/session/message-commands.ts, packages/core/lophn-agent/run-loop/startup.ts]
    steps:
      - "lophn이 켜질 때 router wiring의 start가 RecoverCalls를 한 번 부른다. agent runtime이 turn을 읽기 전에 끝낸다"
      - "같은 tx에서 메모리에서 잃은 call을 닫고, state가 running인 turn 전부를 interrupted(restarted)로 닫는다"
      - "turn이 가져가지 않은 사람 메시지(열린 session, message.turn null)를 받은 순서대로 queue에 다시 넣어 새 turn이 열리게 한다"
      - "이미 turn이 붙은 입력은 다시 돌지 않는다. unattended 메시지, ! shell 기록, rewind가 숨긴 구간, 보관된 session, harness session의 입력도 다시 넣지 않는다. agent runtime child는 이어 받을 것 없이 뜬다"
    outcomes:
      - id: turns-interrupted
        observe: [ledger:turns, event:TurnEnded]
        when: 켤 때 running인 turn이 있었다
      - id: input-requeued
        observe: [event:MessageReceived]
        when: turn이 가져가지 않은 사람 메시지를 queue에 다시 넣었다
    crosses_process: false
    risk: []
    refs: [W5]
    docs: [architecture/workspace-session.md, architecture/run.md]
    unclear:
      - "TurnEnded를 낸 interrupted turn은 다시 돌지 않는다. 사용자가 말한 turn fate의 '복구'는 코드에 없고 interrupted로 닫히는 것뿐이다"
      - "checkRestart의 owners에는 apps만 있고 turn 관측은 없다. 끝나지 않은 model·tool 호출 행도 이 flow가 닫지 않는다"

  - id: turn-end-by-session
    title: session을 archive하거나 지울 때 그 session의 도는 turn을 interrupted(session_ended)로 닫는다
    actor: system
    entries: [system:turn-end-by-session]
    uses: [route:sessions/archive, route:sessions/delete]
    boundary: [run-loop, agent-sessions]
    code: [packages/core/lophn-agent/workspaces/lifecycle.ts, packages/core/lophn-agent/register.ts, packages/core/lophn-agent/run-loop/interrupt.ts, packages/core/lophn-agent/run-loop/driver.ts]
    steps:
      - "session archive와 delete가 같은 tx 안에서 endSession을 부르고 그 session의 running turn을 interrupted(session_ended)로 닫는다"
      - "commit 뒤 TurnEnded를 내고, 받은 lophn-agent-runtime이 child에 turn_stop을 보낸다"
      - "child의 driver가 endSession으로 그 session의 credential, 고정 tool 목록, Compact 표지를 버린다"
    outcomes:
      - id: closed-running
        observe: [ledger:turns, event:TurnEnded, process:agent-runtime]
        when: 도는 turn이 있어서 session_ended로 닫았다
      - id: closed-idle
        observe: [ledger:turns]
        when: 도는 turn이 없어서 닫을 것이 없었다
    crosses_process: true
    risk: []
    refs: [T17]
    docs: [architecture/workspace-session.md]
    unclear:
      - "입력이 queue에만 있고 turn이 열리지 않은 채 session이 끝나는 경우 run 쪽이 running으로 남는다는 run.md 83행이 있다. 이 flow의 closed-idle이 그 경우를 덮는지 확인이 필요하다(automation 몫)"

