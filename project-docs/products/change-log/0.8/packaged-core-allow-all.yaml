id: packaged-core-allow-all
version: 0.8.0
title: '설치본 core도 `--allow-all`로 띄운다'
modules: [packages/shell/main]
checked: [architecture-layers, architecture-browser-tab, architecture-artifact, architecture-workspace-layout, architecture-appearance, tool-worktree-prep, tool-dev, skill-ui-design, tool-wireframes]
change: |
  전:
  - 설치본 core는 `--allow-read`가 설치 코드, data root, Deno cache뿐이었다(`packagedPermissionFlags`). 개발과 test의 core는 `--allow-all`이었다.
  - 그래서 project 폴더가 그 밖에 있으면 등록 때 `projects/registry/record.ts`의 `existsSync`가 `NotCapable`을 던지고 transaction이 되돌려져, launcher가 "wasn't registered, so nothing was saved"를 보였다. 개발과 test로는 드러나지 않았다.
  후:
  - 설치본 core도 `--allow-all`이다(`--cached-only`, `--frozen`, `--no-prompt`는 그대로). writer·reader Worker도 따라간다. `CORE_PERMISSION_FLAGS`와 `packagedPermissionFlags`를 지웠다.
  - 권한을 좁혀 띄우는 것은 child process(I/O, agent runtime, 정비 자식)와 AI가 쓴 코드를 돌리는 process(앱, flow, release 준비 자식)다. `architecture/layers.md`를 고쳤다.
why: |
  core의 좁힘은 경계가 아니었다. core는 lophn 자신의 코드이고, 개발과 배포의 권한이 달라 test가 잡지 못하는 실패만 만들었다.
decisions:
  - text: 'core는 권한을 좁히지 않는다.'
    by: person
  - text: 'agent runtime child의 좁힘은 이번에 바꾸지 않고 이슈로 올린다.'
    by: person
follow_up: |
  - `issues/place-session.md` "agent runtime child의 Deno 권한 좁히기가 경계가 아닌데 깨지고 무겁다". 정한 것은 `--allow-all`이고 구현은 남았다.
  - 등록이 실패해도 Project Manager 정의 파일(`<data>/projects/<id>/agents/project-manager.md`)은 transaction 밖에서 먼저 써져 남는다.
