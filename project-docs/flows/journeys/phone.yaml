group: phone
journeys:
  - id: phone-pair
    title: "사람이 폰을 컴퓨터에 pairing한다"
    actor: person
    goal: "컴퓨터의 QR이나 글로 폰이 pairing해 Home에서 컴퓨터의 session 목록을 본다"
    steps:
      - {do: "desktop Settings › Remote에서 QR과 \"Show as text\"를 연다. 새 폰 초대장(30분, 한 번)이 만들어진다", screen: settings-remote-invite-phone, flow: roster-invite:ok}
      - {do: "폰의 Welcome에서 QR을 찍거나 글을 붙여 넣는다. 폰이 초대장의 비밀로 자기 항목에 서명해 join으로 내밀고 명단에 든다. 폰은 연결마다 hello로 자기 이름과 화면을, 컴퓨터는 자기 id와 이름을 알린다", screen: phone-start, flow: remote-join:joined}
      - {do: "폰이 컴퓨터가 알린 이름으로 Paired 화면을 보인다(Shown as를 채우면 그 별명). 사람이 확인한 뒤 Home으로 간다. 연결이 기기 자격으로 붙고 watch의 ready를 받는다", screen: phone-shell, flow: remote-connection:watch-ready}
      - {do: "desktop Settings › Remote의 My devices에 그 폰이 명단의 이름(폰이 알린 이름)으로 보인다", screen: settings-remote, flow: roster-list:ok}

  - id: phone-answer
    title: "사람이 폰에서 승인과 질문에 답하고 메시지를 보낸다"
    actor: person
    goal: "자리를 비운 사람이 폰의 Inbox에서 대기 중인 일에 답하고 대화에 그림 한 장과 함께 메시지를 보낸다"
    steps:
      - {do: "Inbox의 Now에서 대기 중인 shell 규칙 승인을 한 번만(once) 허락한다", screen: phone-inbox, flow: turn-request-decide:once}
      - {do: "질문 card에 답한다", screen: phone-inbox, flow: ask-answer:answered}
      - {do: "대화 화면에서 사진을 고르면 올라가 blob이 된다", screen: phone-session, flow: message-image-upload:ok}
      - {do: "메시지를 보낸다", screen: phone-session, flow: session-send:ok}

  - id: phone-notified
    title: "자리를 비운 사람이 폰 알림을 받고 눌러 답한다"
    actor: person
    goal: "알림을 켜 둔 사람이 컴퓨터를 떠난 사이 agent가 승인을 기다리면 폰 알림을 받고, 눌러서 그 대화로 가 답한다"
    steps:
      - {do: "pairing 직후 Paired에서 알림을 켠다(또는 Settings › Notifications). 폰이 token과 스위치 일곱을 컴퓨터에 둔다", screen: phone-settings, flow: devices-set-push:ok}
      - {do: "폰이 앱이 앞에 있는지와 열린 session을 컴퓨터에 알린다. 뒤로 가면 앞에 없는 것이 된다", screen: phone-shell, flow: presence-report:recorded}
      - {do: "agent가 승인을 기다린다. 컴퓨터 앞에 앉은 사람이 없으면 core가 폰에 제목과 상태 문장만 보낸다", flow: push-send:sent}
      - {do: "알림을 누르면 그 컴퓨터의 그 대화가 열린다. 승인 card에 한 번만 허락한다", screen: phone-session, flow: turn-request-decide:once}

  - id: phone-read-and-toggle
    title: "사람이 폰에서 project의 file을 읽고 job을 켜고 끈다"
    actor: person
    goal: "폰에서 project 폴더의 글 file을 읽고 job의 켜고 끄기만 바꾼다"
    steps:
      - {do: "project workspace의 Files에서 폴더 목록을 연다", screen: phone-workspace, flow: project-files-list:ok}
      - {do: "글 file을 연다. 앞 1 MiB만 온다", screen: phone-workspace, flow: project-files-read:ok}
      - {do: "Jobs 목록을 읽는다", screen: phone-ops, flow: job-list:ok}
      - {do: "job을 끈다. 폰의 jobs/update는 job과 enabled만 받는다", screen: phone-ops, flow: job-update:updated}

  - id: phone-leave-and-rejoin
    title: "사람이 폰을 내 기기에서 빼고 다시 pairing한다"
    actor: person
    goal: "폰을 명단에서 빼도 새 초대장으로 다시 들 수 있다"
    steps:
      - {do: "폰 Settings에서 \"Remove this phone from my devices\"를 누른다. 붙은 컴퓨터 하나가 명단에서 폰을 빼고(그 key는 다시 들지 못한다) 다른 컴퓨터는 명단으로 듣는다. 컴퓨터에 닿지 않아도 폰은 모든 컴퓨터, 명단, 기기 key를 잊고 Welcome으로 간다", screen: phone-settings, flow: roster-leave:ok}
      - {do: "새 초대장으로 다시 들면 새 key의 새 기기로 명단에 든다", screen: phone-start, flow: remote-join:joined}

  - id: desktop-view-other-computer
    title: "이 desktop에서 다른 컴퓨터의 lophn을 연다"
    actor: person
    goal: "집 컴퓨터에 앉은 사람이 회사 컴퓨터의 lophn을 그 컴퓨터의 창으로 열어 대화하고 승인에 답하며, 그 컴퓨터가 꺼져도 창이 막히지 않는다"
    steps:
      - {do: "다른 컴퓨터의 Settings › Remote에서 [Invite a computer]를 누르고 \"Show as text\"의 글을 복사한다", screen: settings-remote-invite-computer, flow: roster-invite:ok}
      - {do: "이 컴퓨터의 Settings › Remote에서 [Join with an invite]에 글을 붙여 넣고 [Join]을 누른다. 이 컴퓨터가 그 명단에 들고 core끼리 붙는다", screen: settings-remote-join-pending, flow: roster-join:joined}
      - {do: "title bar의 기계 고르기를 열고 그 컴퓨터를 고른다", screen: shell-machine-menu, flow: machine-switcher:opened}
      - {do: "그 컴퓨터의 창이 \"<이름> — lophn\"으로 열리고 Home에 그 컴퓨터의 session 목록이 보인다. 터미널, 편집기, 앱 화면, 설정 단추는 없다", screen: shell-machine-window, flow: machine-window:shown}
      - {do: "그 창에서 대화를 열고 메시지를 보낸다", screen: shell-machine-window, flow: session-send:ok}
      - {do: "Inbox의 shell 규칙 승인을 한 번만 허락한다", screen: shell-machine-window, flow: turn-request-decide:once}
      - {do: "그 컴퓨터가 꺼지면 창은 마지막 화면 위에 끊김 한 줄을 보인다", screen: shell-machine-window, flow: machine-window-gate:disconnected}
      - {do: "desktop을 다시 켜면 그 컴퓨터의 창이 offline gate로 바로 열리고 [This computer]로 이 컴퓨터의 창을 연다", screen: shell-machine-gate-offline, flow: machine-window-gate:offline}
      - {do: "그 컴퓨터가 다시 켜지면 창이 저절로 붙는다", screen: shell-machine-window, flow: machine-window-gate:reconnected}
