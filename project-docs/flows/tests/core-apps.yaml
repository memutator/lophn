group: core-apps
files:
  - path: packages/core/apps/annotations/annotations_test.ts
    covers: [annotation-persist:saved, annotation-persist:archived, annotation-send:delivered, annotation-send:archived, annotation-add-refs:referenced, annotation-get:ok, annotation-get:not-found, annotation-get:forbidden]
    note: "보관한 앱 거절과 아무것도 안 씀, 묶음 저장과 읽기(screenshot 경로), lophn- tag escape, annotations.get의 project·앱·home 범위. artifact domain 칸 옮기기는 schema step이라 covers 밖"

  - path: packages/core/apps/calls/calls_test.ts
    covers: [app-command-call:succeeded, app-command-call:forbidden, app-command-call:denied-gate-blocked, app-command-call:denied-call-loop, app-command-call:denied-call-too-deep, app-command-call:denied-not-declared, app-operation-call:succeeded, app-operation-call:denied-gate-blocked, app-command-call:held-then-run, app-preview-command-call:succeeded, app-preview-command-call:denied-not-declared, app-preview-command-call:forbidden]
    note: "credential·caller 불일치와 모르는 부모는 forbidden, write 줄, 호출 루프와 깊이 8, 앱 간 grant, agent 할당과 비공개 규칙, flow의 할당. preview 호출은 app-preview-command-call, 붙잡힌 호출 재개는 held-then-run. parseProcessCall은 내부 parser라 covers 밖"

  - path: packages/core/apps/data/worker/restore_test.ts
    covers: [data-job-start:reverted, release-activate:failed]
    note: "data worker가 job 전에 끊긴 restore(restore.previous)를 원래 DB로 되돌리고, migrate 사후 검사가 실패하면 migrate 전 DB로 되돌린다. data-job-start:reverted는 끊긴 restore 정리, release-activate:failed는 사후 검사 실패 되돌림"

  - path: packages/core/apps/declaration/reads_test.ts
    covers: [app-declaration-read:ok, app-log-read:not-found]
    note: "app.tool_index의 agent 범위와 비공개 command 가림(사람은 전부), 다른 앱 log의 not_found는 createTargetAuthorizer 직접 호출. app.invocations 범위 밖은 app-invocation-read가 missing(null)으로 적어 not_found와 맞는지 확인 필요"

  - path: packages/core/apps/invocations/ledger_test.ts
    covers: [release-activate:active]
    note: "ledger 저장 규칙: 끝난 invocation은 표 trigger로 못 바꾸고 못 지움, 되돌림 표시 한 번, 큰 changeset은 결과를 살리고 changeset_dropped로 닫음, activation 뒤 이전 release의 changeset 지우기. activation 뒤 changeset 지우기는 release-activate:active"

  - path: packages/core/apps/invocations/schema_test.ts
    covers: []
    note: "invocations schema step 2: 옛 tool 기록을 command로 옮기고 끝난 행의 잠금 trigger를 되살림. migration step 검사라 covers 밖"

  - path: packages/core/apps/lookups_test.ts
    covers: []
    note: "publicCommandsOf 순수 함수: 명함의 command 목록에서 비공개 command와 deny로 뺀 command를 싣지 않음"

  - path: packages/core/apps/notices/commands_test.ts
    covers: [notice-post:posted, notice-record:recorded, notice-record:forbidden, notice-dismiss:removed, notice-dismiss:marked-read, notice-dismiss:forbidden, notice-mark-read:forbidden, notice-version-observe:changed, notice-version-observe:unchanged]
    note: "앱은 자기 앱 app 줄만 쓰고 program 줄·다른 앱 줄·지우기·읽음을 못 함, 영구 줄 지우기는 읽음으로만 남고 program 줄은 DB에서 못 지움, 보존 상한, 판이 바뀐 기동의 lophn_updated 한 번, SDK 판만 바뀐 경우. app_notices 옮기기는 schema step이라 covers 밖. clearAppNotices는 app-archive 단계를 직접 불러 app-archive:archived를 covers하지 않음"

  - path: packages/core/apps/oauth/service_test.ts
    covers: [app-oauth-sign-out:signed-out, app-oauth-state:listed, app-secret-value:delivered, app-secret-value:refresh-rejected, app-secret-value:sign-in-required, app-secret-value:not-deliverable]
    note: "sign-out은 token을 지우고 client는 남김. refresh 거절(400·401·403)은 token을 지우고 sign-in 필요로 돌림, 닿지 못함은 만료 전 token을 지키고 만료 뒤에는 unavailable. refresh 성공 경로(delivered-after-refresh)는 이 test에 없음"

  - path: packages/core/apps/packages/builtin_test.ts
    covers: [package-guide-read:ok]
    note: "SDK 안내 원문의 분류 구조와 예산(한 창 안, 뺀 props는 그 분류에 적힘)과 같은 입력이면 같은 글. 본문 조립 결과 모양만 본다"

  - path: packages/core/apps/packages/commands_test.ts
    covers: [package-register-version:registered, package-register-version:same-version, package-register-version:forbidden, package-register-version:invalid_input]
    note: "처음 publish한 앱이 주인이고 다른 앱의 새 판은 forbidden, 주인 없는 package는 다음 publish 앱이 주인, 같은 판 재시도는 되돌리지 않고 blob 참조만 붙임, hash가 다른 blob은 invalid_input. version 목록 정렬은 응답 모양이라 따로 적지 않음"

  - path: packages/core/apps/packages/install_test.ts
    covers: [builtin-sdk-install:installed, builtin-sdk-install:build-failed]
    note: "SDK 사본 설치: 읽기 전용, 같은 입력 재설치는 같음, 소스 변경은 새 byte로 반영, SDK 사본 의존을 file: 상대 경로로 바꿈, 범위 의존은 거절해 build를 멈춤, repo 없이 import됨. prepareCopyFiles(폴더 package.json의 name·판 검사)는 순수 함수라 covers 밖"

  - path: packages/core/apps/packages/restore_test.ts
    covers: [builtin-sdk-install:restored, builtin-sdk-install:attached, builtin-sdk-install:skipped]
    note: "잃어버린 @me 설치 사본을 bundle blob에서 같은 byte로 되살림, hash가 다른 blob은 쓰지 않고 건너뜀, blob 없는 옛 판은 사본 byte가 bundle_hash와 맞을 때만 blob을 붙임"

  - path: packages/core/apps/packages/template/scaffold_test.ts
    covers: []
    note: "writeTemplateFiles: 이미 있는 파일은 덮지 않고 빠진 파일만 채움. app-create의 source 깔기 내부 함수라 covers 밖(보존 규칙은 flow outcome이 없다)"

  - path: packages/core/apps/permissions/app-grants_test.ts
    covers: []
    note: "syncAppGrants: 넓어진 선언은 허락 전에 grant가 되지 않고, 허락하면 만들며, 선언에서 빠진 grant는 거두고 거둔 grant는 다시 active로 못 함. activation-complete의 grant 단계를 맡는 내부 함수라 covers 밖"

  - path: packages/core/apps/permissions/broker/net-fetch_test.ts
    covers: [app-broker-net-fetch:fetched, app-broker-net-fetch:refused, app-broker-net-fetch:invalid-input]
    note: "loopback host는 http, 그 밖은 https, 플랫폼 port는 막음, https에서 loopback http로 내려가는 redirect는 거절, secret은 같은 invocation의 정확한 목적지 요청에만 붙음(redirect hop에는 안 붙음은 app-broker-net-fetch:fetched), credential header는 invalid_input"

  - path: packages/core/apps/permissions/broker/notify_test.ts
    covers: [app-broker-notify:notified, app-broker-notify:tray-set, app-broker-notify:refused]
    note: "notify.send 허락이 없거나 preview이거나 옛 release인 자식은 core에 닿지 않고 forbidden으로 거절, 허락된 알림과 tray 값은 core로 감"

  - path: packages/core/apps/permissions/secret-value_test.ts
    covers: [app-secret-value:delivered, app-secret-value:forbidden]
    note: "supervisor 자격과 허락된 이름·목적지·live 자식만 값을 받음, 거절 오류에는 값이 없음"

  - path: packages/core/apps/registration/archived_test.ts
    covers: [app-read:ok, app-read:not-found]
    note: "보관한 앱은 agent의 조회에서 not_found이고 목록에서 빠지며 사람은 계속 봄. package 사용처(loadUsages) 검사는 store 직접 호출이라 covers 밖"

  - path: packages/core/apps/registration/commands_test.ts
    covers: [app-create:conflict, app-create:invalid-input, app-set-icon:uploaded, app-set-icon:cleared, app-set-icon:invalid-icon, app-set-icon:not-found]
    note: "이미 있는 slug와 예약어 slug 거절(앱이 안 늘어남), icon의 크기·형식·선언 type과 바이트 불일치 거절, icon 설정과 지우기, 없는 앱"

  - path: packages/core/apps/registration/delete_test.ts
    covers: [app-delete:not-archived, app-delete:forbidden, app-delete:deleted]
    note: "활성 앱 삭제 거절(아무것도 안 지움), agent 거절, 마지막 ledger 사실이 AppStarted여도 process가 없으면 지움, 지울 때 그 앱 기록만 지우고 program 줄과 다른 앱은 남김, erase 창 밖에서는 평소 DELETE가 막힘"

  - path: packages/core/apps/releases/activation/consents_test.ts
    covers: [release-activate:waiting-consent, activation-ask-consent:requested, activation-ask-consent:unchanged, activation-consent:allow, activation-consent:forbidden, activation-sweep:reasked, activation-sweep:started]
    note: "넓어진 선언은 동의 줄 하나만 만들고 시작하지 않음(다시 불러도 하나), 사람만 허락, 허락 뒤 비교가 바뀌면 시작하지 않고 다시 묻고, 지금 비교를 허락하면 시작 큐에 넣음"

  - path: packages/core/apps/releases/activation/orchestrator_test.ts
    covers: [release-activate:failed, release-activate:held]
    note: "migration 실패는 복구본으로 되돌리고 이전 release를 다시 띄우며 complete하지 않음(migration_failed). 복원 schema를 확인 못 하면 앱을 사용 불가로 두고 이전 code를 띄우지 않는 경로(restore_failed)는 release-activate:held. port는 fake"

  - path: packages/core/apps/releases/bundle/dependencies_test.ts
    covers: [release-prepare:failed-dependencies]
    note: "bundle 의존 해석 순수 함수: 정확한 판과 .lophn/sdk 사본만 허용, 범위·tag·원격·사본 밖·모르는 SDK 이름은 거절, devDependencies도 같은 규칙이고 dependencies가 이김. release-prepare:failed-dependencies 판정을 단정"

  - path: packages/core/apps/releases/bundle/modules_test.ts
    covers: []
    note: "node_modules의 정규 file과 연결을 bundle 사본에 옮겨 읽기 전용으로 봉인하고 도구 file은 뺌, 사본 밖을 가리키는 연결은 invalid_input으로 거절되어 사본에 안 만들어짐. release-prepare 내부 함수라 covers 밖"

  - path: packages/core/apps/releases/bundle/seal_test.ts
    covers: []
    note: "봉인 표지가 있는 사본은 준비가 지우지 않고, 표지 없는 끊긴 사본은 지움(읽기 전용 사본 포함). release-prepare 내부 함수라 covers 밖"

  - path: packages/core/apps/releases/commands_test.ts
    covers: [activation-start:started, activation-fail:failed]
    note: "activation 시작 뒤 실패 보고를 두 번 보내도 release_failed 줄은 하나만 남음(응답을 잃은 재전송)"

  - path: packages/core/apps/releases/compare_test.ts
    covers: [release-activate:waiting-consent]
    note: "compareForActivation·asksFor 순수 함수: 손실 선언 단계, 넓어진 바깥 자원, 첫 activation, 이미 지난 단계의 손실은 묻지 않음(release-activate의 waiting-consent 조건). dataChangesOf는 migration 파일 머리의 loss 줄을 읽고 틀리면 invalid_input. waiting-consent 판정을 단정"

  - path: packages/core/apps/releases/prepare/checks_test.ts
    covers: [release-prepare:failed-migration]
    note: "checkMigration: migration 단계 실패, PRIMARY KEY 없는 표, 빈 DB에서 닿지 못함, active release schema가 길 위에 없음을 떨어뜨림(release-prepare failed-migration의 조건). release-prepare:failed-migration 판정을 단정"

  - path: packages/core/apps/releases/public-tools_test.ts
    covers: []
    note: "removedPublicOf 순수 함수: 공개였다가 비공개가 되거나 빠진 tool 목록"

  - path: packages/core/apps/releases/schema_test.ts
    covers: []
    note: "releases declaration step들: 옛 선언의 tools를 commands로, sizes를 places로 옮겨 새 선언 검사를 통과시키고 hash와 prepared 불변 잠금을 유지. migration step 검사라 covers 밖"

  - path: packages/core/apps/releases/sdk-permissions_test.ts
    covers: [release-prepare:failed-release, package-publish:invalid_input]
    note: "cap-net을 쓰는 @me package의 net.fetch 누락과 @me 의존의 permission 누락을 찾는 순수 함수(package-publish:invalid_input과 release-prepare:failed-release의 조건)"

  - path: packages/core/apps/rewind/rewind_test.ts
    covers: [app-rewind-plan:planned, app-rewind-plan:planned-blocked, app-rewind-plan:not-pickable, app-rewind-apply:applied, app-rewind-apply:conflict, app-rewind-apply:cancelled-conflict, app-rewind-apply:cancelled-running, app-rewind-apply:forbidden]
    note: "결과를 모르는 write가 범위에 있으면 계획은 blocked이고 apply는 conflict로 시작하지 않음(app_rewinds 행 없음), 고를 수 없는 시작점은 invalid_input, 더 오래된 호출은 범위 밖, 충돌과 유예 초과는 접수를 다시 열고 되돌림 표시를 안 함, 사람만 부름, 충돌 없는 적용은 최신부터 뒤집어 보내고 external도 표시. 첫 test는 invertAll과 sqlite applyChangeset 검증이라 covers 밖"

  - path: packages/core/apps/runtime/entrypoint/control_test.ts
    covers: [release-prepare:failed-handlers]
    note: "앱 child의 probe가 선언과 handler가 어긋나면 409로 거절하고 빠진·더해진 tool 이름을 말함. release-prepare failed-handlers의 reason을 만드는 child 내부 handler라 probe 판정은 release-prepare:failed-handlers"

  - path: packages/core/apps/runtime/entrypoint/fit_test.ts
    covers: [app-command-call:succeeded-changeset-dropped]
    note: "fitChangeset: frame 한도를 넘는 changeset은 빼고 changeset_dropped too_large로 알리며, 들어가는 응답은 그대로 둠. changeset을 빼는 판정은 app-command-call:succeeded-changeset-dropped"

  - path: packages/core/apps/runtime/entrypoint/invoke_test.ts
    covers: [app-command-call:result-too-large]
    note: "앱 child의 handleCall: operation 결과는 256 KiB를 넘어도 나가고 같은 크기의 command 결과는 error 응답. child 응답만 단정하고 core 쪽 outcome은 단정하지 않음. command 결과 상한 초과는 app-command-call:result-too-large"

  - path: packages/core/apps/runtime/observations/log-file_test.ts
    covers: [app-log-write:written, app-log-write:rotated]
    note: "stdout 줄은 redaction 뒤에 300자로 잘려 JSON Lines로 붙고 알려진 secret은 파일에 안 남음, 8 MiB를 넘으면 app.log를 app.log.1로 옮기고 오래된 줄부터 버리며 크기 상한을 지킴"

  - path: packages/core/apps/runtime/supervisor-link_test.ts
    covers: []
    note: "core와 supervisor 사이 link adapter. 한도를 넘는 rewind 적용이 changeset 전부를 한 요청으로 가서 applied로 돌아오는 입력(app-rewind-apply:applied의 입력)과, 큰 응답을 받다 끊긴 호출이 sent true와 response null로 돌아오는 입력(app-command-call:unknown의 입력)을 단정. adapter 결과라 outcome 자체는 단정하지 않아 covers 밖"

  - path: packages/core/apps/screens/icon_test.ts
    covers: [app-icon-read:uploaded, app-icon-read:declared, app-icon-read:none]
    note: "bundle 안 이미지만 선언 icon으로 줌(밖을 가리키는 symlink, .., 64 KiB 넘는 파일, 없는 파일, 이미지가 아닌 확장자는 none). 사람이 올린 icon이 있으면 선언 icon보다 우선. Windows에서 symlink 권한이 없으면 건너뜀"

  - path: packages/core/apps/screens/serve_test.ts
    covers: [app-screen-file-read:served, app-screen-file-read:invalid-path, app-screen-file-read:not-found]
    note: "화면 파일은 그 screen 폴더 안 파일만. .., 절대 경로, 역슬래시, 드라이브 문자, 잘못된 screen 이름은 invalid_input(invalid-path), 밖을 가리키는 symlink·다른 screen·폴더·큰 파일·없는 파일은 not_found"

  - path: packages/core/apps/screens/skills_test.ts
    covers: [app-skills-read:ok]
    note: "선언에서 public인 skill만 주고 그 안의 .md 파일만 싣음, bundle 밖을 가리키는 skill 폴더는 읽지 않고 오류 없이 뺌"

  - path: packages/core/apps/sdk-status/status_test.ts
    covers: [app-sdk-status-read:listed]
    note: "sdkEntry 판정: 지원 하한보다 낮은 고정은 required, 그 위지만 옛 판이면 available, notes는 고정 판 다음부터 지금 판까지. recordSdkUpdates는 필수·가능 앱 수를 세서 sdk_update_needed 알림 입력을 만들고 필요한 앱이 없으면 기록하지 않음. sdkEntry 판정은 app-sdk-status-read:listed. 알림 입력은 notice-record 쪽"

  - path: packages/core/apps/usage/users_test.ts
    covers: [app-usage-read:listed, app-command-call:denied-gate-blocked]
    note: "사용 관계는 project session의 호출만 세고 home과 앱 자신의 workspace 호출은 안 셈. 두 번째 test는 callAllowed gate를 직접 불러 앱 workspace agent가 자기 앱 command를 할당 없이 부르고 다른 앱은 할당이 있어야 함을 단정. gate 판정을 단정하므로 app-command-call:denied-gate-blocked"
