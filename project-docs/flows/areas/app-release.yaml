      - id: conflict
        code: conflict
        when: "진행 중인 시도가 아님, release가 없거나 범위 밖(absent는 conflict), 복구본을 복원 기록 전에 닫으려 함"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "권한 판정 port가 답하지 않음(조립 누락)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장 행을 읽지 못함이나 release_failed 알림 기록이 실패함(store·notice가 낸 오류 그대로)"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [A10, E3]
    docs: [architecture/activation.md]

  - id: activation-report
