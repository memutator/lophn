id: roster-computer-self-grants-terminal-input
title: 명단의 컴퓨터가 자기 터미널 입력 허락을 스스로 켜고 다른 컴퓨터가 그것을 받아들인다
kind: bug
status: fixed
topic: remote
modules: [packages/protocol, packages/core/remote, packages/core/main, packages/shell/renderer, packages/mobile]
now: |
  터미널 입력 허락은 명단 항목의 칸 `terminal_input`이다(`packages/protocol/remote/roster.ts`의 device body). 명단은 믿는 컴퓨터 누구의 서명이든 받고 같은 기기의 항목은 `rev`가 높은 것이 이긴다. 그래서 명단의 컴퓨터 B는 자기 항목을 더 높은 `rev`에 `terminal_input: true`로 서명할 수 있고, 다른 컴퓨터 A의 view는 엇갈림 없이 그 값을 보인다. A는 받은 device body마다 자기 서명을 덧붙이므로(`packages/core/remote/roster.ts`의 `settle`: `if (!d.signed_by.includes(id)) added.push(signed(d.body, id))`) "A에서 사람이 켠 것"과 "B가 스스로 켠 것"이 명단에서 구별되지 않는다. A의 core는 그 칸을 그대로 읽는다(`packages/core/main/daemon/wiring/remote.ts`의 `terminalInputGrant`: `deviceOf(principal)?.terminal_input === true`).
  그 값이 여는 것: `terminals/input|restart|close`, browser page 다루기(`page_view/input|control|open`), 사람 route 목록(`REMOTE_PERSON_ROUTES`: secret, provider·model, 설정 쓰기, agent·project 만들고 고치기).
  폰은 명단에 서명하지 못하므로 폰의 허락은 스스로 켤 수 없다. 다만 명단의 컴퓨터 하나가 어느 폰의 허락이든 모든 컴퓨터에 대해 켤 수 있다.
impact: |
  사람이 A에서 B의 터미널 입력을 꺼 두어도, B에 앉은 사람(훔친 사람 포함, 명단에서 빼기 전)이 그 허락을 스스로 켜 A의 터미널에 치고 A의 secret과 설정을 다룬다. 꺼 둔 스위치가 꺼져 있지 않다.
fix: |
  - (중간, 추천) 허락을 받는 컴퓨터의 것으로 옮긴다. 각 컴퓨터가 자기 ledger에 "여기서 허락한 기기"를 두고 그것만 읽는다. 명단으로 퍼지지 않고 서명과 상관없다. `roster/set_terminal_input`은 이 컴퓨터의 표를 고치고, 초대장의 허락은 초대장을 낸 컴퓨터에만 선다. 기존 data root는 옮기는 때의 view에서 켜져 있던 기기를 그 컴퓨터의 표로 옮긴다. 잃는 것: 한 번 켜면 모든 컴퓨터에 서던 것이 없어져 컴퓨터마다 한 번씩 켠다.
  - (작음) 지금대로 두고 "명단의 컴퓨터끼리는 서로를 온전히 믿는다"고 문서에 적는다. 잃는 것: 컴퓨터 사이에서 허락 스위치가 경계가 아니다.
decided: |
  사람(2026-11-19): 컴퓨터마다 따로 허락한다(첫째 안). 받는 컴퓨터에서 직접 켠 허락만 그 컴퓨터가 인정한다. 계획 `remote-use`의 `use-grant`가 한다. 그 뒤에는 "내 컴퓨터들"로 온 새 release도 여기서 허락한 컴퓨터의 것은 묻지 않고 따라가게 한다(지금은 모두 묻는다).
closed: |
  터미널 입력 허락은 명단 항목의 칸이 아니라 받는 컴퓨터의 ledger 표(`remote_grants`, 기기의 key로 찾는다)다. 새 statement는 칸을 싣지 않고 `ctx.terminalInputGrant`와 `ctx.computerGranted`는 그 표만 읽는다. 켜는 길은 사람이 그 컴퓨터에서 켜기(`roster/set_terminal_input`은 이 컴퓨터의 표만 고치고 명단에 서명하지 않는다), 그 컴퓨터가 낸 초대장으로 든 기기, 그 컴퓨터가 합류하며 켠 스위치뿐이다. 명단의 컴퓨터가 자기나 다른 기기의 항목을 어떻게 서명해도 다른 컴퓨터의 허락은 켜지지 않는다. 첫 기동은 옛 항목에 켜져 있던 허락을 한 번 표로 옮기므로 업데이트 전에 스스로 켠 허락도 옮겨졌다. 사람이 My devices에서 끈다(change-log 체크리스트).
guard: packages/core/main/daemon/wiring/remote_test.ts의 "명단의 컴퓨터가 자기 항목이나 다른 기기의 항목을 어떻게 서명해도 이 컴퓨터의 터미널 입력 허락은 켜지지 않고, 사람이 켠 것만 서며 뺀 기기의 것은 거둔다"
