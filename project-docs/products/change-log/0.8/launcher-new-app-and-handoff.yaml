id: launcher-new-app-and-handoff
version: 0.8.0
title: '런처에서 앱을 시작하고 lophn과 말한다, 맡긴 session을 연다'
modules: [packages/protocol, packages/core/apps, packages/core/agent-workspaces, packages/design, packages/shell/renderer, tools]
checked: [architecture-agent-call, architecture-ui-kit, skill-ui-design]
change: |
  전:
  - 앱을 만드는 길은 lophn의 `app.create` tool 하나였고, lophn과 말하는 곳은 project 창 sidebar와 앱 공간의 agent select뿐이었다. 런처에는 "Register project"만 있었다. 그래서 앱을 시작하려면 상관없는 project 창이라도 열어야 했다.
  - lophn이 `/new-app`으로 App Engineer에게 맡기면 Router가 연 session에 사람이 닿을 길이 없었다. "Handed to App Engineer" 블록은 받은 session을 모르고(`receiver_session`을 화면이 버렸다), 앱 공간의 agent select는 늘 빈 새 session을 열었다. lophn의 안내대로 앱 공간에서 App Engineer를 고르면 맡긴 내용을 모르는 session이었다.
  - place가 없는 lophn session을 여는 요청(대기 목록, toast)은 마지막에 연 project 창으로 갔고, 연 적이 없으면 런처에서 아무 일도 하지 않았다.
  - 런처 앱 카드의 "In {project}"는 core가 앱의 project를 주지 않아 보인 적이 없었다.
  후:
  - 런처 Apps section 머리의 + 단추와 앱이 없을 때의 비었음 안내가 "New app" dialog를 연다. 이름과 한 줄 목적을 받아 `app.create`를 user로 부르고, 이름이 겹치면(`conflict`) dialog에 보인다. 만들면 그 앱 공간이 App Engineer의 새 session으로 열린다(route `appEngineer`, `openNewApp`). lophn을 거치지 않으니 설계 인터뷰는 처음부터 App Engineer와 한다.
  - 프로젝트도 앱도 없는 런처의 특별한 비었음 상태를 없앴다. 두 section이 각자 비었음 안내와 행동 하나(Register project, New app)를 보인다.
  - 런처 오른쪽 아래의 Ask lophn 단추가 같은 구석에 떠 있는 패널을 연다. 패널이 열린 동안 단추는 숨는다. 안은 탭과 같은 `AgentView`이고 틀만 design `FloatPanel`이다(끌어 옮기기, 가장자리 resize, 닫기). 처음 열면 가장 최근 열린 lophn session, 없으면 새 session이다. 위치·크기는 그 창의 메모리에만 있다.
  - place가 없는 lophn session을 여는 요청은 지금 project 창이면 거기서, 아니면 런처의 lophn 패널에서 연다. "마지막에 연 project" 기억은 없앴다.
  - call 블록에 [Open conversation]이 생겼다. 받은 session을 연다. `AgentViewHost.openSession`이 생겨 모든 host(agent 탭, 앱 공간 패널, 런처 패널)가 toast의 session 열기(`runToastAction`)로 잇는다. 그 창에서 열 수 있으면 열고 아니면 그 session의 창으로 간다. 받은 메시지의 보낸 쪽 session 링크도 같은 길로 열린다(전에는 host가 넘기지 않아 누를 수 없었다).
  - 앱 공간의 agent select는 그 agent의 가장 최근 열린 session을 연다. 새 session은 header의 session 목록 "+ New session"이다.
  - lophn의 내장 skill `new-app`의 마지막 단계가 맡긴 session으로 가는 길([Open conversation], 앱 공간의 App Engineer)을 안내한다.
  - 죽은 코드: `AppRow.project`, 앱 카드의 "In {project}" 줄과 그 wording key.
why: |
  앱은 project에 묶이지 않는데 시작하는 자리가 project 창 안에만 있었다. lophn이 인터뷰하고 body로 요약해 맡기면 App Engineer는 원문을 모르고(`architecture/agent-call.md`), 진짜 설계 질문은 사람이 보지 못하는 session으로 갔다.
decisions:
  - text: '런처에 New app과 lophn 패널을 둘 다 둔다. lophn chat은 런처의 카드 화면에 맞지 않아 떠 있는 틀로 띄우고 안의 화면은 탭과 같게 한다.'
    by: person
  - text: '계획을 열지 않고 바로 고친다.'
    by: person
  - text: 'agent select가 빈 새 session 대신 가장 최근 열린 session을 연다. 앱 공간에는 session sidebar가 없어 맡긴 session이 header 목록 안에만 있었다.'
    by: agent
  - text: 'slug 만들기는 `packages/protocol/apps/app-slug.ts`의 `appSlugOf` 하나다. agent tool과 런처가 같이 쓴다.'
    by: agent
  - text: '런처의 lophn 입구는 위쪽 바 아이콘이 아니라 오른쪽 아래 떠 있는 단추다. 위쪽 바 말풍선은 lophn인지 알아보기 어려웠다. 버린 안: 런처 맨 위 입력 줄, 최근 대화 section.'
    by: person
  - text: '런처 패널의 위치·크기는 저장하지 않는다. Settings에 다녀오면 패널이 닫힌다.'
    by: agent
