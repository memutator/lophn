id: app-delete-live-process-check
version: 0.22.0
title: "app.delete의 \"process가 아직 있나\" 판정을 살아 있는 supervisor로 바로잡는다"
modules: [packages/core/apps, packages/core/main]
checked: []
change: |
  전: 바로 위 항목은 ledger의 마지막 process 사실이 `AppStarted`이면 `unavailable`로 거절했다. core가 꺼질 때는 `AppStopped`를 남기지 않아, 켜져 있다 꺼진 뒤 보관한 앱은 영영 못 지웠다.
  후: ledger 사실을 보지 않는다. 보관한 앱이면 쓰기 앞 처리기가 supervisor에 지금 process(멈추는 중 포함)가 있는지 묻고, 있을 때만 `unavailable`이다.
why: |
  옛 판정은 ledger의 마지막 `AppStarted`만 보았다. core가 꺼질 때 `AppStopped`가 남지 않아, 꺼진 뒤 보관한 앱을 지울 수 없었다.
decisions:
  - text: |
      판정은 ledger 사실이 아니라 살아 있는 supervisor 관측이다. 버린 길: 옛 `AppStarted`를 지우는 보정 기록(append-only를 건드린다).
    by: agent
