schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # blueprint

  # 폐기: 당연하다.
  - id: req-0800
    status: rejected
    subject: app-releases
    statement: "blueprint의 구조 검사 통과와 실제 test 통과는 서로 다른 근거로 기록되고, 한쪽이 다른 쪽을 대신하지 않는다."
    acceptance:
      - "구조 검사만 마친 앱에는 test 통과 기록이 붙지 않는다."
      - "test 통과는 test result로만 남는다."

  - id: req-0801
    status: accepted
    subject: app-releases
    statement: "blueprint가 선언한 app-api의 목록과 실제 등록된 구현의 목록은 정확히 같다."
    acceptance:
      - "구현이 빠지거나 선언에 없는 구현이 있는 앱은 app test에서 실패한다."
      - "구현이 빠지거나 선언에 없는 구현이 있는 앱은 시작도 실패한다."

  - id: req-0802
    status: accepted
    subject: app-releases
    statement: "앱은 다른 앱의 app-api를 쓰려면 쓸 대상 앱, app-api 목록, 목적을 blueprint에 선언한다."
    acceptance:
      - "선언하지 않은 대상 앱이나 app-api는 호출할 수 없다."

  # 폐기: 당연하다.
  - id: req-0803
    status: rejected
    subject: app-releases
    statement: "blueprint의 검사와 조회는 model 호출과 외부 network 없이 결정적으로 같은 결과를 낸다."
    acceptance:
      - "model과 network를 끈 상태에서 작성, 검사, 조회 결과가 켠 상태와 같다."

  # 폐기: release에 blueprint를 고정하는 것은 req-0806이 맡고, 값을 뽑는 방법은 구현 세부다.
  - id: req-0804
    status: rejected
    subject: app-releases
    statement: "TypeScript로 쓴 blueprint는 권한 없는 별도 Deno process에서 최대 10초 동안 값을 뽑고, release에는 정규 JSON을 고정한다."
    acceptance:
      - "파일·network 접근이나 무한 반복을 하는 정의는 거절되거나 10초 안에 중단된다."
      - "release에 고정된 정의는 JSON이다."

  # 폐기: 구현 세부다.
  - id: req-0805
    status: rejected
    subject: app-releases
    statement: "정규 JSON에서 목록과 object 이름의 순서는 고정이다."
    acceptance:
      - "순서만 다른 두 정의는 같은 정규 JSON이 된다."

  # release 고정

  - id: req-0806
    status: accepted
    subject: app-releases
    statement: "release는 고정된 git commit의 code, 화면, blueprint, 정확한 SDK, permission 요청, data 변경 계약을 바꿀 수 없는 bundle로 고정하고, test 뒤 bundle byte를 바꾸지 않는다."
    acceptance:
      - "source와 SDK 최신판을 고친 뒤에도 기존 bundle의 hash와 선언이 그대로다."

  - id: req-0807
    status: accepted
    subject: app-releases
    statement: "release는 준비 근거(test result 참조, 준비한 주체, 시각)를 담고 그 근거는 바뀌지 않는다."
    acceptance:
      - "release 하나에서 test result 참조, 준비한 주체, 시각을 읽을 수 있다."
      - "이후에도 읽은 값이 같다."

  - id: req-0808
    status: accepted
    subject: app-releases
    statement: "화면 build 결과와 external source map은 bundle에 들어가고, 운영 process는 build나 의존 다운로드 없이 그 결과만 쓴다."
    acceptance:
      - "설치 뒤 network 없이 화면이 열린다."
      - "화면 오류 위치를 bundle의 source map으로 원래 source 위치에 잇는다."

  - id: req-0809
    status: accepted
    subject: app-releases
    statement: "과거 호출 기록과 test result는 현재 blueprint가 아니라 당시 release로 해석한다."
    acceptance:
      - "app-api를 지운 새 release 뒤에도 이전 호출은 당시 app-api의 설명과 대상으로 조회된다."

  # 폐기: req-0806(정확한 SDK를 bundle에 고정)과 req-0808(실행 때 다운로드 없음)이 맡는다.
  - id: req-0810
    status: rejected
    subject: app-releases
    statement: "운영 release는 고정한 package 의존을 담고 그 묶음만 읽으며, 실행 때 새 package를 받거나 다른 버전으로 바꾸지 않는다."
    acceptance:
      - "운영 중인 앱이 release에 고정된 package 버전을 그대로 쓴다."
      - "새 package 버전이 공개돼도 실행 중인 release의 의존은 바뀌지 않고 실행 때 다운로드가 일어나지 않는다."

  - id: req-0811
    status: accepted
    subject: app-releases
    statement: "앱 code는 blueprint에 선언한 의존(lophn SDK, 사용자 package, npm과 jsr package, 모두 정확한 version)과 상대 import만 쓰고, release 준비는 그 의존을 bundle에 넣는다."
    acceptance:
      - "blueprint에 없는 package나 정확한 version이 아닌 의존을 import하는 앱은 release 준비에서 거절된다."
      - "정확한 version의 npm package를 선언하고 쓰는 앱은 통과하고, 실행할 때 그 package를 내려받지 않는다."
    related:
      - package-registry

  # release 준비

  - id: req-0812
    status: accepted
    subject: app-releases
    statement: "release 준비는 연결된 source의 지정한 commit 파일로 bundle을 만들고, commit에 없는 변경과 `.git`은 넣지 않는다."
    acceptance:
      - "commit하지 않은 변경은 bundle에 없다."
      - "만든 bundle에 `.git`이 없다."

  # 폐기: bundle에 무엇이 들어가는지는 req-0806이 정한다. 뺄 목록을 늘어놓지 않는다.
  - id: req-0813
    status: rejected
    subject: app-releases
    statement: "release bundle에는 개발용 credential, agent 도구, 임시 설정, coding agent 배포 안내, skill, hook, CLI wrapper, MCP 설정이 들지 않는다."
    acceptance:
      - "source에 개발용 credential, agent 도구, 임시 설정, coding agent용 안내·skill·hook·CLI wrapper·MCP 설정이 있어도 만든 bundle에는 그것이 없다."

  # 폐기: commit에서 읽으므로 생기지 않는 일이다.
  - id: req-0814
    status: rejected
    subject: app-releases
    statement: "release 준비는 준비 도중 원본이 바뀐 것을 감지하면 release를 확정하지 않는다."
    acceptance:
      - "준비 중 source를 바꾸면 release가 만들어지지 않고 실패 이유가 남는다."

  # 폐기: 당연한 구현 품질이다.
  - id: req-0815
    status: rejected
    subject: app-releases
    statement: "release 준비(copy, hash, 정의 검사, 화면 build)는 core process 밖에서 돌고, 준비 중에도 core는 다른 요청에 응답한다."
    acceptance:
      - "준비를 돌리는 동안 core API가 평소처럼 응답한다."

  # 폐기: 세부 수치다.
  - id: req-0816
    status: rejected
    subject: app-releases
    statement: "release 준비의 기본 상한은 입력 source 64MiB, 완성 bundle 256MiB, 파일 10000개, 전체 300000ms이고, 상한 초과, 취소, worker 종료 때 부분 bundle을 release로 확정하지 않는다."
    details:
      limits:
        - "입력 source 64MiB"
        - "완성 bundle 256MiB"
        - "파일 10000개"
        - "준비 전체 300000ms"
    acceptance:
      - "상한을 하나씩 넘기는 입력에서 release가 만들어지지 않고 실패 이유가 남는다."
      - "준비 중 취소나 worker 종료에서도 release가 만들어지지 않고 실패 이유가 남는다."

  # 준비 조건과 test

  - id: req-0817
    status: accepted
    subject: app-releases
    statement: "release를 준비하려면 blueprint가 부적합하지 않고, test runner가 같은 bundle hash로 실제 돌려 통과한 app test result가 있어야 한다."
    acceptance:
      - "release 없이 bundle을 test한 뒤 같은 hash로만 release가 준비된다."
      - "byte 하나를 바꾸거나 결과를 직접 제출하면 거절된다."
      - "부적합한 blueprint나 같은 묶음의 실패한 test result가 있으면 release 준비가 거절된다."

  - id: req-0818
    status: accepted
    subject: app-releases
    statement: "release 준비의 app test에는 lophn이 정한 필수 검사(선언한 app-api와 구현의 일치, 의존, migration, 되돌림)가 들고, coding agent는 그것을 빼거나 바꾸지 못한다."
    acceptance:
      - "필수 검사를 지운 test 묶음은 실패한다."
      - "coding agent가 필수 검사를 바꾸려 하면 거절된다."

  # 폐기: problem code 선언을 없앴다(problems를 일반 관측성 수준으로 줄였다).
  - id: req-0819
    status: rejected
    subject: app-releases
    statement: "app test는 선언한 problem code마다 실제 실패 경로 하나 이상과 보고, 예외, feedback, redaction, 권한 거절, 고정 SDK를 검사해야 release로 인정된다."
    acceptance:
      - "경로 하나를 뺀 fixture는 통과하지 못한다."
      - "선언한 problem code에 실제 실패 경로를 거쳐 보고가 접수됨을 확인하는 test가 없으면 release로 인정되지 않는다."
    related:
      - problems

  # 폐기: 처리되지 않은 오류의 자동 수집은 SDK와 runtime이 하고(req-0110), redaction 요구는 뺐다. 앱마다 갖출 것을 검사하지 않는다.
  - id: req-0833
    status: rejected
    subject: app-releases
    statement: "앱은 process 예외 수집과 저장 전 redaction 경로를 갖추고, 화면이 있으면 view 예외 수집과 제보 경로도 갖춰야 release로 인정된다."
    acceptance:
      - "process 예외 수집과 저장 전 redaction 경로가 없는 앱은 release로 인정되지 않는다."
      - "화면이 있는 앱에 view 예외 수집이나 제보 경로가 없으면 release로 인정되지 않는다."
    related:
      - problems

  - id: req-0820
    status: accepted
    subject: app-releases
    statement: "앱 DB migration은 빈 DB에 전체를 적용한 경우와 이전 release schema에서 새 schema로 적용한 경우를 모두 test로 검사한다."
    acceptance:
      - "두 fixture를 각각 돌려 한쪽이 실패하면 통과하지 못한다."
    related:
      - app-data

  - id: req-0821
    status: accepted
    subject: app-releases
    statement: "write app-api는 app test에서 쓰고 core가 되돌린 뒤 DB 상태가 원래와 같은지 검사한다."
    acceptance:
      - "write app-api를 부른 뒤 되돌린 DB 상태가 부르기 전과 다르면 test가 실패한다."
    related:
      - app-data

  # 폐기: problem code 선언을 없앴다.
  - id: req-0822
    status: rejected
    subject: app-releases
    statement: "열린 problem의 code를 지우거나 선언을 약하게 한 release는 준비할 때 경고를 남기고, 그 삭제를 고친 근거나 문제 닫힘으로 처리하지 않는다."
    acceptance:
      - "열린 problem의 code를 지운 release를 준비하면 경고를 읽을 수 있다."
      - "그 problem은 열린 채로 남는다."
    related:
      - problems

  # coding 작업의 release 준비

  # 폐기: 기한이 지난 claim의 쓰기 거절(req-0740)과 claim을 출처로 남기기(req-0742)가 맡는다.
  - id: req-0823
    status: rejected
    subject: app-releases
    statement: "coding 작업의 release 준비는 ticket의 현재 연결, claim 순번, 기한을 요청 때와 확정 때 다시 확인하고, ticket과 당시 claim을 바꿀 수 없는 출처로 남긴다."
    acceptance:
      - "누락, 만료, 반납, 연결 회수, claim 변경은 거절된다."
      - "claim을 풀거나 ticket을 취소한 뒤에도 과거 release의 출처는 그대로다."
    related:
      - coding-agent
      - app-tickets

  # 폐기: claim 아래에서만 release를 준비하는 것은 req-1353이 맡는다.
  - id: req-0824
    status: rejected
    subject: app-releases
    statement: "App Engineer가 맡긴 코드 수리도 ticket과 현재 claim을 거쳐 새 release를 준비한다."
    acceptance:
      - "claim 없는 release 준비는 거절된다."
      - "사람 approval에 따른 이전 release 선택에는 새 ticket이 필요하지 않다."
    related:
      - coding-agent
      - app-tickets

  # activation

  - id: req-0825
    status: accepted
    subject: app-releases
    statement: "선언이 넓어지지 않고 data 손실 migration이 없는 release는 묻지 않고 activate된다. 넓어지거나 손실이 생길 수 있으면 늘어난 선언과 손실을 보이고 사람이 허락해야 activate된다."
    acceptance:
      - "선언이 같고 data 손실이 없는 release는 activation이 시작되면 묻지 않고 activate된다."
      - "새 host, secret, 다른 앱 app-api 쓰기를 선언한 release는 사람이 허락하기 전에는 activate되지 않는다."
      - "migration이 data 손실 단계를 선언했으면 그 단계를 보이고, 사람이 허락하기 전에는 activate되지 않는다(req-1520)."
      - "app-api가 더해지기만 한 release는 activation에서 묻지 않는다."
      - "이전 활성 release가 없는 첫 activation은 선언 전부를 늘어난 것으로 보고 묻는다."
    related:
      - approvals

  - id: req-1507
    status: accepted
    subject: app-releases
    statement: "새 release는 그 release를 이은 ticket이 확인됨이 되면 activate되고, release 준비만으로는 activate되지 않는다."
    acceptance:
      - "release 준비가 끝나도 activation이 시작되지 않는다."
      - "그 release를 이은 ticket이 확인됨이 되면 activation이 시작되고, 선언이 넓어지지 않은 release는 묻지 않고 activate된다."
    related:
      - app-tickets

  - id: req-1508
    status: accepted
    subject: app-releases
    statement: "activation은 그 앱의 새 호출 접수를 닫고 진행 중인 호출이 끝나기를 기다린 뒤 process를 바꾸며, 그 사이에 온 호출은 붙잡아 두었다가 새 release에 넘기고, activation이 실패하면 다시 시작한 이전 release에 넘긴다."
    acceptance:
      - "쓰기 호출이 도는 중에 activation을 시작하면 그 쓰기가 끝난 뒤에 process가 바뀌고, 그 쓰기는 rewind할 수 있다."
      - "교체 중에 온 호출은 실패하지 않고 새 release에서 처리된다."
      - "끝나지 않는 호출은 종료를 요청한 뒤 강제로 멈추고, 부른 쪽은 결과 모름을 받는다."
    related:
      - app-runtime

  # 폐기: req-0825에 합쳤다.
  - id: req-0826
    status: rejected
    subject: app-releases
    statement: "activation 전에 사람은 이전 release와 비교한 화면과 app-api의 입력, 효과, 확인 필요 여부, permission 추가와 축소, data 변경과 손실 가능성을 확인할 수 있다."
    acceptance:
      - "새 필수 입력이 있는 release의 비교 내용에 그 입력이 나타난다."
      - "external 효과가 생긴 release의 비교 내용에 그 효과가 나타난다."
      - "permission을 더한 release의 비교 내용에 그 추가가 나타난다."
      - "데이터를 잃을 수 있는 migration이 든 release의 비교 내용에 그 손실 가능성이 나타난다."

  # 폐기: req-0825의 선언 비교가 맡는다.
  - id: req-0827
    status: rejected
    subject: app-releases
    statement: "이전 release와의 비교는 입력 schema가 같다는 이유로 호환이라고 표시하지 않고, 선언한 효과나 확인 필요 여부가 바뀐 release는 검토가 필요한 변경으로 구별한다."
    acceptance:
      - "schema는 같고 효과 선언만 바뀐 release가 호환으로 표시되지 않는다."
      - "설명만 바뀐 release는 동작 변경과 구별된다."

  # 폐기: approvals req-0310(실행 직전 다시 검사)에 합쳤다.
  - id: req-0828
    status: rejected
    subject: app-releases
    statement: "activation은 시작할 때와 확정할 때 현재 release, bundle, grant, 사람의 결정, 실제 data schema가 비교 기준과 같은지 다시 확인한다."
    acceptance:
      - "approval 뒤에 grant나 채택된 release가 바뀌면 낡은 activation이 거절된다."

  # 폐기: 당연한 구현 품질이다.
  - id: req-0829
    status: rejected
    subject: app-releases
    statement: "앱 하나에는 activation이 하나만 진행되고, 그동안 다른 activation과 grant 변경은 거절된다."
    acceptance:
      - "activation 두 개와 grant 변경을 동시에 요청하면 하나만 진행되고 나머지는 거절된다."

  - id: req-0830
    status: accepted
    subject: app-releases
    statement: "activation은 migration과 시작 확인이 모두 성공해야 새 release로 바꾸고, 실패하면 이전 release를 그대로 두고 실패 이유를 남긴다."
    acceptance:
      - "migration이나 시작 확인이 실패한 뒤에도 이전 release가 활성이다."
      - "실패 이유를 읽을 수 있다."
      - "성공이 확정된 뒤에만 새 release로 업무 호출이 간다."

  # 폐기: req-0830에 합쳤다.
  - id: req-0831
    status: rejected
    subject: app-releases
