  - id: secret-store-open
    title: "기동할 때 secrets.json을 열고 알려진 값을 맞춘다"
    actor: system
    entries: [system:secret-store-open]
    boundary: [secrets]
    code: [packages/core/secrets/file-store.ts, packages/core/secrets/secret-store.ts, packages/core/main/daemon/wiring/secrets.ts]
    steps:
      - "파일 mode가 0600보다 넓으면 0600으로 고치고 log를 남긴다. 고치지 못하면 unreadable이다. Windows는 mode를 보지 않는다"
      - "파일을 파싱해 이름과 값을 메모리 사본에 올린다. 파일이 없으면 빈 저장소다. 읽지 못하거나 모양이 맞지 않으면 unreadable이다"
      - "파일의 모든 값을 reader pool의 알려진 값 통로에 올린다. 못 올리면 known-not-ready다. 그 전까지 redaction은 막혀 있다(fail-closed)"
      - "못 읽거나 못 올리면 secret 기능만 unavailable로 두고 2초부터 30초까지 backoff로 다시 맞춘다. reader가 다시 뜨면 현재 값을 다시 올린다"
    outcomes:
      - id: opened
        observe: ["disk:<root>/secrets.json"]
      - id: mode-fixed
        observe: ["disk:<root>/secrets.json", "log:secrets"]
      - id: unreadable
        when: "파일을 읽지 못했거나 모양이 맞지 않거나 mode를 고치지 못했다. 기동은 계속되고 secret 기능은 막힌다"
        observe: ["log:secrets"]
      - id: known-not-ready
        when: "파일은 읽었지만 알려진 값 통로(reader pool)에 값을 올리지 못했다. redaction은 막힌 채 backoff로 다시 맞춘다"
        observe: ["log:secrets"]
