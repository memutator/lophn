id: grants-agent-call-core-rule
version: 0.2.0
title: "Grants 화면의 agent 부르기를 core 규칙에 맞추고, crash를 이유별로 묶고, 받은 입력의 출처 표지를 history에도 남김"
modules: [packages/shell/renderer, packages/core/lophn-agent, packages/design]
checked: [architecture-approval, architecture-agent-definition, tool-e2e]
change: |
  전:
  - Grants 화면은 agent grant에 줄이 있는 agent만 부를 수 있다고 보였고, 끄면 줄을 지웠다. core는 줄이 없으면 허락한다(AGENT-ROLE T4). 그래서 화면에서 뺀 agent를 묻지 않고 부를 수 있었다.
  - 앱 frame 위치를 못 푼 오류 관측(stack 없는 앱 process 종료, view 오류)은 report id로 묶여 발생마다 새 문제와 새 App Engineer session을 열었다. crash loop 한 번에 session이 일곱까지 열렸다.
  - 다른 agent·program이 보낸 call·reply·reaction·알림은 받은 turn에서만 태그에 싸이고 다음 turn의 history에서는 사람 글과 같은 원문이었다.
  - 목록에서 빠진 tool의 이유 구별(`removed_from_grant`·`removed_from_release`·`denied`)은 run-loop에서 부를 길이 없었다.
  후:
  - Grants 화면은 catalog의 모든 agent를 보인다. 줄 없음은 켜진 기본, 끄기는 `excluded` 줄이다. "Add agent" menu는 없다.
  - 위치를 못 푼 관측은 관측 종류·오류 이름·메시지·bundle hash로 묶는다. 같은 release에서 같은 이유(같은 exit code나 signal)로 거듭 죽으면 문제 하나다.
  - history도 받은 입력과 같은 함수(`input-text.ts`의 `receivedText`)로 싼다. 사람 메시지는 싸지 않는다. history의 call 태그에는 답 방식이, reaction 태그에는 event type이 없다(session 기록에 없는 칸).
  - 목록에 없는 tool은 `not_found` 하나다. 이유 구별 코드와 문구를 지웠다.
  - 다른 session의 merge가 어긋나게 합친 `lophn-build-app` guide의 줄 바꿈을 fmt로 고쳤다.
why: |
  e2e-coverage와 그 마무리가 남긴 열린 이슈다. Grants 화면은 사람이 보는 권한과 실제 권한이 반대였다.
decisions:
  - text: |-
      묶는 key는 관측 종류·오류 이름·메시지·bundle hash다. 앱은 문제를 이미 `(app, group_key)`로 찾아 넣지 않는다. 메시지에 시각이나 id가 섞인 view 오류는 여전히 따로 열린다.
    by: agent
  - text: |-
      이유 구별은 고쳐 잇지 않고 지웠다. agent가 이유를 들어야 할 근거가 문서에 없다.
    by: agent
  - text: |-
      history도 싼다. 막는 것이 AI가 만든 글이다.
    by: agent
  - text: |-
      Grants 화면에서 다시 켜면 기본으로 돌아가고, 꺼지기 전에 고른 묻기 설정은 버린다.
    by: agent
follow_up: |-
  남은 이슈 `issues/agent-call.md`의 "받은 turn의 입력과 뒤 turn의 history가 bytes로 다르다".
