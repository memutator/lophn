id: phone-coding-ask-duplicates-env-read
title: 폰의 coding data가 오류 문장을 남기려고 desktop의 `env.read`를 거들지 않고 호출 helper를 따로 쓴다
kind: defect
status: fixed
topic: remote
modules: [packages/mobile, packages/shell/renderer]
now: |
  desktop의 대화 source가 쓰는 `env.read`(`packages/shell/renderer/conversation/agent-tab-core-source-env.ts`)는 실패에서 오류 code만 남기고(`errorCodeOf`) 문장을 버린다. 폰의 열기와 깨우기는 컴퓨터가 준 문장("Open the project on the computer")을 그대로 보여야 해서 `packages/mobile/src/data/coding.ts`의 `codingOf` 안 `ask`가 `client.core.call`을 직접 부르고 결과를 `CodingResult`로 옮긴다. `data/terminal.ts`의 `call`과 `data/places.ts`의 `ask`도 같은 모양이다. 같은 일(`core.call`의 답을 Result로 옮기기)이 폰 안에 셋이고 `env.read`까지 넷이다.
impact: |
  호출 오류 처리(예외 → `unavailable`, 오류 code 옮기기)를 고칠 곳이 넷이 된다. 사람이 보는 동작과 데이터에는 닿지 않는 개발 비용이다.
fix: |
  - 작음(추천): 폰의 세 helper를 한 함수로 합친다(`data/places.ts`의 `ask`를 꺼내 셋이 쓴다). desktop file은 건드리지 않는다.
  - 작음: `env.read`의 실패에 optional `message`를 싣고(desktop 소비자는 무시한다) 폰의 helper를 지워 `env.read`로 모은다.
closed: |
  폰의 coding session 공용 route 호출 helper를 단일 data/ask.ts로 합쳐 중복을 없앴다.
guard: 없음
