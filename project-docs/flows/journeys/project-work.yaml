    actor: agent
    goal: "job이나 workflow의 agent가 사람 없이 browser page를 열어 일하고, 사람이 돌아오면 같은 page가 그 workspace의 접힌 탭으로 있다"
    refs: [G4]
    steps:
      - {do: "앱이 꺼져 있고 core만 떠 있는 때 agent가 lophn tab open <url>을 부른다", flow: host-browser-tab-open:opened-app-started}
      - {do: "core가 앱을 --agent-window로 띄운다(shell이 없을 때만, 켠 core만)", flow: host-shell-launch:launched}
      - {do: "앱이 일반 창이 없으면 focus 없이 창을 연다", flow: desktop-window-open-inactive:opened}
      - {do: "창이 그 workspace를 mount하지 않았으니 page만 만들어 두고 bind를 알린다", flow: agent-browser-page-host:page-parked}
      - {do: "agent가 snapshot으로 page를 읽고 act로 다룬다", flow: host-browser-inspect:ok}
      - {do: "사람이 그 workspace로 돌아오면 접힌 float으로 같은 page가 놓인다(다시 load하지 않는다)", flow: agent-browser-page-host:placed-from-pending}
    gaps:
      - "최소화한 창에서는 page가 그리지 않아 screenshot이 실패한다"

