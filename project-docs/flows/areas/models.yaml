      - "교환이 발급자에 닿는 일은 agent runtime을 거친다(issuer 요청 대기열). 그 대기열의 기한과 실패 code는 이 flow에서 다시 보지 않았다"

  - id: mcp-auth-state
    title: "MCP 서버마다 로그인 상태를 읽는다"
    actor: person
