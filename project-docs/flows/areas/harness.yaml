  # ---- team 자식 탭 ----
  - id: harness-team-child-tab
    title: "agent가 연 새 session(team spawn, call)의 탭을 host queue에 넣는다"
    actor: system
    entries: [system:team-child-tab]
    pre: [team-spawn:spawned]
    boundary: [core, host-queue-interface]
    code:
      - packages/core/main/daemon/wiring/router.ts
      - packages/core/router/commands.ts
    steps:
      - "team spawn의 commit이 router.team-spawned를, call이 새 session을 연 commit이 router.call-session-opened를 낸 뒤 core main thread가 받는다(commit 뒤에만). team spawn은 앞의 것 하나만 내 탭이 둘 열리지 않는다. 열린 session으로 보낸 call과 앱이 보낸 call은 내지 않는다"
      - "연 session과 새 session의 행을 다시 읽는다. 없으면 아무 일도 하지 않는다"
      - "둘의 workspace 종류와 id가 같으면 host queue에 tab_open(relation은 team spawn의 --as인 peer나 stage이고 없으면 peer, 그냥 call은 stage, source는 연 session)을 넣는다. 탭은 shell host poll이 연다(host-queue-poll)"
      - "다른 workspace의 새 session은 source와 relation 없이 그 session의 workspace에 tab_open을 넣는다. renderer가 Main desk 끝에 붙인다"
    outcomes:
      - id: opened
        observe: [request:shell-host]
      - id: other-workspace
        when: "연 session과 새 session의 workspace가 다르다. source 없이 새 session의 workspace에 연다"
        observe: [request:shell-host]
      - id: missing-row
        when: "연 session이나 새 session 행을 읽지 못했다. 아무 일도 하지 않는다"
        observe: []
    crosses_process: false
    docs: [architecture/coding-agent.md]

  # ---- 터미널 탭의 GUI 화면: core의 acp/*·coding_sessions/* route로 붙기, 갱신, 되찾기, 지난 session, 이미지, rewind 미리보기 ----
  - id: harness-gui-tab-attach
    title: 창이 GUI 탭의 대화에 붙거나 떼어진다
    actor: person
    uses: [route:acp/snapshot]
    boundary: [shell-extension, shell]
    code:
      - packages/shell/renderer/terminal/terminal-gui.tsx
      - packages/core/terminal-agents/coding-sessions.ts
      - packages/protocol/coding-agent/relay.ts
    steps:
      - "탭의 coding session이 gui view면 화면이 그 session의 AcpUpdated를 구독하고, 구독이 서면(ready) `acp/snapshot`을 읽는다. 읽는 사이 온 갱신은 snapshot 뒤에 접는다"
      - "다시 붙거나 core가 그 session의 상태를 갈아 끼우면(StateChanged{coding_sessions}) snapshot을 다시 읽는다"
      - "session이 없으면 not_found라 화면을 그리지 않는다. 탭을 떠나면 구독을 놓는다"
    outcomes:
      - id: attached
        when: "session의 GUI handle이 있다. snapshot을 그리고 이어서 갱신을 접는다"
        observe: [response, screen:harness-gui-terminal-tab]
      - id: no-handle
        when: "handle이 없다(닫혔거나 한 번도 없었다)"
        observe: [response]
      - id: detached
        when: "탭을 떠났다. 구독을 놓는다"
        observe: []
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: harness-gui-publish
    title: "adapter가 낸 ACP update를 core가 모아 AcpUpdated로 낸다"
    actor: system
    entries: [system:harness-gui-publish]
    boundary: [shell-extension, acp]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/terminal-agents/coding-sessions.ts
      - packages/shell/renderer/terminal/terminal-gui.tsx
    steps:
      - "adapter가 handle에 update를 publish하면 core가 상태를 접어 두고 20ms 안에 온 것을 모아 AcpUpdated로 낸다. handle이 열리거나 닫히면 StateChanged{coding_sessions}로 화면이 snapshot을 다시 읽게 한다"
      - "snapshot과 갱신에서 tool 본문(입력·출력)을 빼고 제품 redactor를 지난다. 본문은 줄을 펼칠 때 `acp/tool_body`로 읽는다"
      - "화면은 붙을 때 `acp/snapshot`을 읽고 그 뒤 갱신을 접는다(harness-gui-tab-attach)"
    outcomes:
      - id: snapshot
        when: "화면이 붙을 때 읽는 지금 상태다"
        observe: [screen:harness-gui-terminal-tab]
      - id: batched
        when: "20ms 안에 모인 갱신 묶음 하나다"
        observe: [screen:harness-gui-terminal-tab]
      - id: dropped
        when: "알려진 secret을 아직 다 모른다. 내지 않는다"
        observe: []
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-tab-current
    title: 저장본에서 다시 만들어진 탭이 그 터미널의 살아 있는 GUI를 되찾는다
    actor: person
    uses: [route:coding_sessions/list]
    boundary: [shell-extension, shell]
    code:
      - packages/shell/renderer/terminal/store.ts
      - packages/core/terminal-agents/coding-sessions.ts
    steps:
      - "탭은 view를 저장하지 않는다. 창의 터미널 store가 `coding_sessions/list`를 붙을 때와 StateChanged{coding_sessions}마다 읽어 터미널마다 view를 둔다"
      - "다른 workspace에 갔다 오거나 창을 다시 load하거나 다른 화면(폰)이 바꾼 탭도 그 목록의 view(gui 또는 tui)로 그린다"
    outcomes:
      - id: found
        when: "그 터미널의 coding session이 목록에 있다"
        observe: [response]
      - id: none
        when: "그 터미널에 coding session이 없다. xterm을 그린다"
        observe: [response]
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: harness-gui-tab-sessions
    title: "그 탭의 CLI가 이 폴더에서 가진 지난 session 목록을 최근 순으로 준다"
    actor: person
    uses: [route:coding_sessions/cli_sessions]
    boundary: [shell-extension, shell]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/extensions/bundled/harness-gui/claude.ts
    steps:
      - "화면이 그 coding session으로 `coding_sessions/cli_sessions`를 읽는다. core가 그 탭의 run을 찾아 adapter의 sessions()를 부른다"
      - "claude는 SDK로 이 폴더의 session을 최대 30개 받아 최근 순으로 정렬한다(다른 worktree는 뺀다). 제목은 custom title 또는 summary다"
      - "run이 없거나 adapter가 목록을 주지 못하면 빈 목록이다"
      - "이 목록은 CLI의 session이다. lophn session 목록이 아니다(capability sessions false)"
    outcomes:
      - id: listed
        when: "run이 목록을 돌려줬다"
        observe: [response, screen:harness-gui-resume]
      - id: empty
        when: "session이나 handle이 없다(not_found), run이 없다, 또는 adapter가 목록을 주지 못했다"
        observe: [response]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-tab-image
    title: "사람이 붙인 이미지를 탭의 임시 폴더에 쓰고 그 절대 경로를 받는다"
    actor: person
    uses: [route:acp/image_upload]
    boundary: [shell-extension, shell]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
    steps:
      - "화면이 붙인 그림을 그 coding session으로 `acp/image_upload`에 올린다. 형식(png·jpeg·gif·webp)과 크기를 route schema가 본다"
      - "bytes가 선언한 형식의 그림이 아니면 invalid_input이다. core는 tmpdir 아래 lophn-gui/<터미널 ref>/ 폴더(0700)에 uuid를 붙이고 이름의 경로 밖 글자를 _로 바꾼 파일(0600)로 쓴다. 이름이 그림 확장자로 끝나지 않으면 bytes의 형식 확장자를 붙인다"
      - "쓴 절대 경로를 돌려준다. 그 경로를 CLI 입력에 넣는 것은 renderer가 한다"
    outcomes:
      - id: saved
        observe: ["disk:<os tmp>/lophn-gui/<terminal ref>/", response]
      - id: refused
        when: "형식이나 크기가 맞지 않거나 bytes가 그림이 아니다(invalid_input), handle이 없다(not_found)"
        observe: [response]
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: harness-gui-tab-tool-body
    title: "tool 줄을 펼칠 때 그 tool 하나의 입력이나 출력을 handle에서 읽는다"
    actor: person
    uses: [route:acp/tool_body]
    boundary: [shell-extension, acp]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/protocol/acp/bodies.ts
      - packages/shell/renderer/conversation/agent-tab-gui-source.ts
    steps:
      - "창의 상태에는 tool 본문이 없다. 화면이 줄을 펼치거나 사람이 친 명령이 끝나면 GUI source가 그 tool id와 쪽(input·output)으로 `acp/tool_body`를 읽는다"
      - "core는 handle이 접어 둔 상태에서 그 tool을 찾는다(자식 대화와 숨긴 구간 안까지). 그 쪽 본문과 truncated를 돌려준다"
    outcomes:
      - id: read
        observe: [screen:harness-gui-terminal-tab, response]
      - id: missing
        when: "handle이 없거나, 그 tool이나 그 쪽 본문이 없다(도는 tool의 출력). not_found다"
        observe: [response]
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: harness-gui-tab-image-read
    title: "대화에 실린 그림 file 링크를 탭의 임시 폴더에서 읽어 그림으로 보이고, 누르면 크게 본다"
    actor: person
    uses: [route:acp/image_read]
    boundary: [shell-extension, shell]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/shell/renderer/conversation/agent-tab-gui-source.ts
      - packages/shell/renderer/conversation/message-list/message-attachments.tsx
    steps:
      - "메시지의 `file://` resource_link가 그림 확장자(png·jpg·jpeg·gif·webp)면 화면이 GUI source에 그림 주소를 묻는다. 읽는 동안은 chip이다"
      - "core(`acp/image_read`)는 그 탭의 tmpdir 아래 lophn-gui/<터미널 ref>/ 바로 아래 file만 읽고, bytes가 png·jpeg·gif·webp일 때만 돌려준다. 화면은 경로의 확장자로 MIME을 붙인다"
      - "화면은 blob URL로 그림을 그리고, 누르면 ImagePreview modal로 크게 보인다. Esc·바깥·[x]로 닫는다"
    outcomes:
      - id: shown
        observe: [screen:harness-gui-terminal-tab, response]
      - id: chip
        when: "handle이 없거나, 그 폴더 밖 경로거나, file이 없거나 그림이 아니다. 링크는 chip으로 남고 누르면 file을 연다"
        observe: [screen:harness-gui-terminal-tab, response]
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: harness-gui-tab-rewind-preview
    title: "사람 메시지로 되돌리기 전에 되돌아갈 file 목록을 adapter가 dry-run으로 보인다"
    actor: person
    uses: [route:coding_sessions/rewind_preview]
    boundary: [shell-extension, shell]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/extensions/bundled/harness-gui/index.ts
      - packages/core/extensions/bundled/harness-gui/claude.ts
    steps:
      - "rewind 전에 화면이 사람 메시지 id로 `coding_sessions/rewind_preview`를 읽는다. lophn의 rewind preview route가 아니라 adapter의 dry-run이다"
      - "core가 handle의 run에 rewindPreview를 부른다. run이 없거나 adapter가 구현하지 않으면 null이다"
      - "claude는 그 메시지의 uuid로 SDK rewindFiles dry-run을 돌려 되돌아갈 file(상대 경로)을 준다. 메시지를 찾지 못하면 빈 목록이다"
    outcomes:
      - id: files
        when: "claude에서 dry-run이 되돌릴 수 있다고 답했다. file 목록을 준다"
        observe: [response, screen:harness-gui-rewind]
      - id: not-found
        when: "claude에서 메시지를 transcript 대응에서 못 찾았거나 dry-run이 되돌릴 수 없다고 답했다. 빈 목록이고 실패 안내 글을 낸다"
        observe: [response, screen:harness-gui-terminal-tab]
      - id: none
        when: "handle이나 run이 없다. codex, omp, opencode는 rewindPreview를 구현하지 않아 null이다"
        observe: [response]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  # ---- harness GUI adapter의 mechanism. adapter마다 다른 것은 when에 쓴다(claude, codex, omp, opencode) ----
  - id: harness-gui-approval
    title: "CLI가 허락을 물으면 승인 카드를 열고 창의 결정을 CLI의 답으로 옮긴다"
    actor: system
    entries: [system:harness-gui-approval]
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/antigravity.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "CLI가 도구 실행의 허락을 물으면 adapter가 approval_opened로 카드를 낸다. 선택지는 어댑터마다 다르다(아래 when)"
      - "창이 답하기 전까지 CLI에 답을 보내지 않는다. 도구는 기다린다"
      - "창의 decide(once, session, always, reject와 이유, mode)를 그 CLI의 답으로 옮긴다. 모르는 request id는 버린다"
      - "카드가 열린 채 turn이 끝나거나 abort되면 답 없이 cancelled로 닫는다"
    outcomes:
      - id: allowed-once
        when: "창이 once를 골랐다. 모든 adapter가 한 번 허락을 보낸다(claude allow, codex accept, opencode reply once, omp Approve, antigravity allow_once 선택지). codex의 추가 권한 요청(extra permissions)도 이 카드를 쓴다. once는 scope turn의 허락이다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: allowed-session
        when: "창이 session을 골랐다. 범위는 그 CLI session이다. claude는 규칙을 기억해 다음 query의 allowedTools로 되살리고 설정 file에 쓰지 않는다. codex는 서버가 acceptForSession을 낸 때만 그 범위이고 아니면 once다. opencode는 session permissions를 PATCH하고 once를 보낸다(session을 서버에 보내지 않는다). omp는 session 선택지를 서버가 준 때만 그 범위이고 아니면 once다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: allowed-always
        when: "창이 always를 골랐다. claude는 SDK 제안이 session 밖을 가리킬 때만 카드에 있고 CLI가 저장한다. codex는 서버가 execpolicy나 network 규칙을 낸 때만 영구(~/.codex/rules)이고 아니면 accept다. opencode는 영구로 표시된 선택에서만 always를 보낸다. omp는 always를 규칙으로 보내지 않아 이 갈래가 없다. antigravity는 agy가 allow_always 선택지를 준 때만 영구로 표시해 보낸다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: rejected
        when: "창이 reject를 골랐다. 거절이 CLI에 가고 그 도구는 거절로 끝난다. codex 추가 권한 거절은 빈 권한을 turn 범위로 보낸다. 이유는 claude와 opencode는 거절 글로, omp는 Deny 글로 보내고, antigravity는 reject 선택지만 보내고, codex는 decline만 보내며 이유는 서버에 가지 않고 카드 기록에만 남는다. turn은 stopped로 그려지지 않는다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: answered-elsewhere
        when: "다른 client가 먼저 답했다. codex는 serverRequest/resolved로 답 없이 cancelled로 닫는다. opencode는 permission.replied를 읽어 카드를 닫되 답을 보내지 않고, 그 답(reject면 denied, always면 always, 그 밖이면 once)을 기록한다. omp는 extension_ui_request cancel로 cancelled로 닫는다. claude에는 이 갈래가 없다"
        observe: [screen:harness-gui-terminal-tab]
      - id: cancelled
        when: "turn이 끝나거나 abort되어 답 없이 닫혔다. claude는 DENIED 답을 보내고 cancelled로 기록한다. codex는 창의 stop 입력에 cancel 답을 보낸다. omp는 대기 중인 카드를 버린다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: mode-picked
        when: "claude의 plan 카드(ExitPlanMode)에서 mode를 골랐다. 허락은 그 mode로 session에만 걸어 setMode를 보낸다. codex는 plan turn이 끝나고 adapter가 만든 plan 카드의 Implement를 골랐다. omp와 opencode에는 plan 카드가 없어 mode 선택을 무시한다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab, screen:harness-gui-plan-card]
      - id: auto-accepted
        when: "opencode에서 auto_accept 토글이 켜져 있다. 카드를 열지 않고 once 답만 보낸다(always와 PATCH는 보내지 않는다). 켜는 순간 열린 카드도 once로 닫는다"
        observe: [process:cli-gui]
      - id: ignored
        when: "request id가 열린 카드가 아니다(이미 닫혔거나 모른다). 또는 omp에서 mode 결정을 받았다. 아무 일도 없다"
        observe: []
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]

  - id: harness-gui-question
    title: "CLI가 질문을 물으면 질문 카드를 열고 창의 답을 CLI에 준다"
    actor: system
    entries: [system:harness-gui-question]
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/antigravity.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "CLI가 질문을 물으면 adapter가 question_asked를 낸다(claude AskUserQuestion, codex requestUserInput 최대 4문항, omp의 ask·select·confirm·input, opencode question form)"
      - "omp는 ask 대화가 도구 시작보다 먼저 와도 그 도구 줄에 붙인다"
      - "창이 answer를 보내면 질문 순서대로 답을 CLI에 준다(claude는 updatedInput.answers, codex는 질문 id별 answers, omp는 extension_ui_response, opencode는 form reply)"
      - "답 없이 닫히면 cancelled다"
    outcomes:
      - id: submitted
        when: "창이 answer를 보냈다. claude는 여러 답을 쉼표로 이어 보낸다. omp에서 답이 없는 질문은 추천이나 첫 선택지로 채운다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: cancelled
        when: "turn이 끝나거나 abort되었다. 또는 서버가 질문을 풀었다(codex serverRequest/resolved, opencode의 form.replied나 form.cancelled, omp의 cancel 프레임). opencode는 빈 답이면 form을 지운다. claude는 The user dismissed the question 거절을 보낸다. 창에서 답 없이 닫는 길은 어댑터에 없다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
    crosses_process: true
    docs: [architecture/harness-gui.md]
    unclear:
      - "창 쪽에서 답 없이 닫는 경우(dismissal)는 어댑터 어디에도 없다. 질문 취소 테스트는 claude와 omp 모두 없다"

  - id: harness-gui-permission-mode
    title: "사람이 고른 권한 mode를 CLI에 바꾼다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/antigravity.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "창이 set_mode(mode id)를 보낸다. adapter가 자기 mode 표에서 찾는다. 모르는 id는 무시한다"
      - "claude는 같은 query에서 SDK setPermissionMode를 바꾸고 mode 변화를 보인다. process는 다시 띄우지 않는다"
      - "opencode는 session의 agent를 POST로 바꾸고 meta의 mode를 보인다. codex는 thread/settings/update로 approval policy와 sandbox를 바꾼다"
      - "omp는 턴이 돌면 거절하고, 아니면 process를 끝낸 뒤 같은 session을 --approval-mode로 다시 띄운다. 한 session에 process가 둘 있지 않다"
    outcomes:
      - id: changed
        when: "claude의 setPermissionMode, opencode의 agent POST, codex의 settings/update가 되었다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: restarted
        when: "omp에서 턴이 없어 process를 끝내고 같은 session으로 새 process를 띄웠다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: restart-failed
        when: "omp의 새 process가 준비되지 않았다(omp did not restart, 또는 handshake 실패). turn이 unavailable로 failed된다"
        observe: [screen:harness-gui-terminal-tab]
      - id: ignored
        when: "모르는 mode id다. 현재 mode와 같다(claude는 바꾸지 않는다). 또는 omp에서 턴이 도는 중이다(Stop the running turn 경고)"
        observe: [screen:harness-gui-terminal-tab]
      - id: failed
        when: "opencode의 agent POST가 실패했다(Mode change failed 알림)"
        observe: [screen:harness-gui-terminal-tab]
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]
    unclear:
      - "codex set_mode에는 never나 danger-full-access를 가리는 규칙이 없다. 그 규칙은 thread 시작 policy다(harness-gui-start-policy)"

  - id: harness-gui-start-policy
    title: "codex GUI가 thread를 여는 때 사람의 approval 설정에 맞춰 policy를 붙인다"
    actor: shell
    uses: [harness-gui-open:opened, harness-gui-toggle:to-gui]
    boundary: [shell-extension]
    code:
      - packages/core/extensions/bundled/harness-gui/codex.ts
    when: "codex adapter만 있다. claude, omp, opencode에는 이 규칙이 없다"
    steps:
      - "codex adapter가 thread/start, thread/resume(열기와 session 바꾸기), thread/fork, /new 때 config/read로 사람의 approval 설정을 읽는다"
      - "사람 설정이 approval never이거나 sandbox danger-full-access이면 on-request와 workspace-write를 붙인다. 아니면 정책을 붙이지 않는다"
      - "set_mode 입력은 이 규칙을 거치지 않는다(mode 변경은 harness-gui-permission-mode)"
    outcomes:
      - id: replaced
        when: "사람 설정이 never나 danger-full-access다. 열기 요청에 on-request와 workspace-write를 실어 보낸다"
        observe: [request:codex-app-server]
      - id: kept
        when: "사람 설정이 read-only, untrusted, on-request 등이다. 정책을 붙이지 않는다"
        observe: [request:codex-app-server]
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]

  - id: harness-gui-background-tool
    title: "사람이 지금 도는 도구를 background로 보낸다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "background_tool 입력을 adapter가 받는다. 창은 tool id를 싣지 않고 adapter가 도는 도구를 고른다"
      - "claude는 도는 Bash, PowerShell, Agent, Task를 SDK backgroundTasks로 넘긴다. 지금 보내기와 background_tool은 3초를 기다리지 않는다. 보내기를 steer로 할 때는 3초 넘게 돈 Bash만 최대 2번, 15초 안에 넘긴다. 실패는 버린다"
      - "opencode는 session의 도는 tool을 server의 background API로 보낸다"
      - "codex와 omp는 background_tool을 처리하지 않는다(capability background false)"
    outcomes:
      - id: backgrounded
        when: "claude는 도는 root 도구를 하나 이상 넘겼다. opencode는 background 요청이 성공했다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: nothing-running
        when: "넘길 도는 도구가 없다. claude는 목록이 비어 아무 일도 없다"
        observe: []
      - id: failed
        when: "opencode의 background 요청이 실패했다(Background failed 알림)"
        observe: [screen:harness-gui-terminal-tab]
      - id: ignored
        when: "codex와 omp다. 입력을 처리하지 않는다"
        observe: []
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-lane-control
    title: "사람이 하위 agent나 task를 멈추거나 그 agent에 말을 더한다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "stop_child, stop_task, steer_child 입력을 adapter가 받는다"
      - "claude는 stop_child를 그 child의 task id로 SDK stopTask로 옮긴다. stop_task도 stopTask다. steer_child는 아무 일도 하지 않는다(capability steer_child false)"
      - "codex는 stop_child에서 child의 도는 turn을 interrupt한다. steer_child는 도는 turn에 turn/steer를 보내고, 없으면 새 turn을 연다. stop_task는 subagent면 stop_child로, shell 프로세스면 background terminal을 terminate한다"
      - "omp는 stop_child와 stop_task를 cancel_subagent RPC로, steer_child를 steer_subagent RPC로 보낸다"
      - "opencode는 stop_child와 stop_task를 자식 session의 interrupt POST로 보낸다. steer_child 입력은 없다. 대상 task가 있는지 확인하지 않는다"
    outcomes:
      - id: stopped
        when: "멈춤 요청이 CLI의 멈춤으로 옮겨졌다. 자식은 cancelled로, task 줄은 stopped로 그려진다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab, screen:harness-gui-dock-running]
      - id: steered
        when: "codex와 omp가 자식에게 말을 더했다(codex는 도는 turn이면 steer, 아니면 새 turn)"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: ignored
        when: "claude의 steer_child는 아무 일도 없다. opencode의 steer_child는 입력 case가 없다. codex의 stop_child는 자식의 turn이 돌지 않으면 아무 일도 없다"
        observe: []
      - id: failed
        when: "omp의 cancel이나 steer RPC가 실패 답을 받았다(Could not stop it, Could not steer it 경고)"
        observe: [screen:harness-gui-terminal-tab]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-subagent-lane
    title: "CLI가 띄운 하위 agent를 도구 줄 아래 lane으로 짝짓고 background task로 올린다"
    actor: system
    entries: [system:harness-gui-subagent]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "claude는 Agent나 Task 호출이 child lane을 만든다. task_started에 줄을 세우고 prompt를 자식의 첫 사용자 글로 넣는다. subagent 안에서 띄운 task는 root에 알림을 내지 않는다"
      - "codex는 spawn item의 receiverThreadIds로 lane을 열고, 그보다 먼저 온 자식 thread 이벤트는 임시로 쌓아 lane이 열릴 때 넣는다(thread마다 50, 전체 200)"
      - "omp는 task 도구 줄에 lifecycle 이벤트의 parentToolCallId로 붙인다. 같은 task에 더 온 subagent는 subagent 줄을 따로 만든다"
      - "opencode는 tool 결과의 session id(metadata.sessionID)로 자식과 짝짓고, 자식의 대화를 children에 든다"
    outcomes:
      - id: lane-opened
        when: "자식이 도구 줄 아래에 연결됐다. 자식의 대화와 상태(running, done, failed, cancelled)가 그 lane에 쌓인다"
        observe: [screen:harness-gui-terminal-tab, screen:harness-gui-subagent, screen:harness-gui-subagent-forward]
      - id: background-task
        when: "백그라운드 자식이다. claude는 async_launched 결과 뒤에도 task 알림이 끝낼 때까지 running이다. opencode는 background true 인자일 때만 task 줄이 된다. omp는 detached true 자식이 task가 된다. codex에는 이 갈래가 없다"
        observe: [screen:harness-gui-terminal-tab]
      - id: child-ended
        when: "자식이 끝났다. claude는 task 알림이나 turn 끝(백그라운드 아닌 것)에서 닫는다. opencode는 자식의 execution.interrupted로 cancelled가 된다. omp는 lifecycle 상태를 따른다"
        observe: [screen:harness-gui-terminal-tab]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-plan-todo
    title: "CLI의 todo나 계획 항목을 plan 목록으로 그린다"
    actor: system
    entries: [system:harness-gui-plan]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "claude는 TodoWrite와 TaskCreate, TaskUpdate의 결과로 목록을 만든다. 빈 항목도 지우지 않고, 알 수 없는 상태는 pending이다"
      - "codex는 turn/plan/updated를 그대로 옮긴다. 빈 목록도 그대로 낸다. switchThread 때도 빈 목록을 낸다"
      - "omp는 todo 도구가 끝날 때마다 상태를 읽고, JSON이 바뀐 때만 낸다"
      - "opencode는 todowrite가 성공할 때 input.todos를 옮긴다. 빈 내용 항목은 빼고 상태를 정규화한다(알 수 없는 상태는 pending). 다시 열면 마지막 todowrite를 다시 낸다"
    outcomes:
      - id: shown
        when: "plan_changed가 목록을 실었다. 항목을 거르는 정도는 어댑터마다 다르다(claude와 codex는 거르지 않고, opencode는 빈 내용을 뺀다)"
        observe: [screen:harness-gui-terminal-tab, screen:harness-gui-dock]
      - id: unchanged
        when: "omp에서 todo 상태 JSON이 바뀌지 않았다. 아무것도 내지 않는다"
        observe: []
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-roles
    title: "omp의 model role을 설정 file에서 읽어 고르고, 전역 slow 설정은 건드리지 않는다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/omp.ts
    when: "omp adapter만 있다. claude, codex, opencode에는 role 기능이 없어 use_role을 처리하지 않는다"
    steps:
      - "omp adapter는 전역 config와 프로젝트 config의 modelRoles를 읽는다. 프로젝트 설정이 전역을 이긴다. file이 없거나 읽지 못하면 role이 없다"
      - "role은 model 종류로 나뉜다. image, web, speech, dictation, judge는 model 종류이고 나머지는 chat이다"
      - "use_role 입력은 이 session에만 /switch @id를 보낸다. 설정 file은 쓰지 않는다. model 종류 role은 아무 일도 없다"
      - "slow 모드는 session 범위일 때만 보인다. 전역 범위면 slow를 보내지 않는다"
    outcomes:
      - id: switched
        when: "chat role을 골랐고 턴이 돌지 않는다. /switch 명령을 보내고 상태를 다시 읽는다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab, screen:harness-gui-roles, screen:harness-gui-picker, screen:harness-gui-picker-search]
      - id: refused
        when: "턴이 도는 중이다(Stop the running turn before switching roles 경고)"
        observe: [screen:harness-gui-terminal-tab]
      - id: ignored
        when: "모르는 role이거나 model 종류 role이다. 아무 일도 없다"
        observe: []
      - id: slow-kept
        when: "slow 설정이 전역 범위에 닿았다. 어떤 명령도 보내지 않는다(설정 file도 쓰지 않는다)"
        observe: []
    crosses_process: true
    docs: [architecture/harness-gui.md]
    unclear:
      - "slow 설정을 보내는 입력이 어느 것인지(set_model options인지) 이 보고에서 확인하지 못했다"

  - id: harness-gui-usage-warning
    title: "사용 한도가 70%를 넘으면 창마다 단계가 바뀔 때 한 번 알린다"
    actor: system
    entries: [system:harness-gui-usage]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
    steps:
      - "claude CLI가 rate limit 상태를 알리면 adapter가 단계를 정한다. 거부됨이면 rejected, 경고이면서 사용률이 70% 이상이거나 모르면 warning, 아니면 none이다"
      - "같은 창에서 같은 단계는 한 번만 알린다. 단계가 바뀌면 다시 알린다"
      - "알림은 info 글이다. 사용률을 알면 N%를 쓰고, 모르면 close 글을, 거부됨이면 hit 글과 reset 시각을 쓴다"
    outcomes:
      - id: warned
        when: "claude에서 단계가 바뀌어 알림이 나갔다. codex, omp, opencode는 사용량을 meta로만 주고 경고를 만들지 않는다"
        observe: [screen:harness-gui-terminal-tab]
      - id: silent
        when: "단계가 none이거나 이 창에 같은 단계를 이미 알렸다"
        observe: []
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-command-output
    title: "사람이 친 슬래시 명령을 CLI에 보내고 그 출력을 명령 출력 줄로 그린다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/antigravity.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "run_command나 '/이름 인자' 글을 adapter가 받는다. 이름이 adapter의 명령 표에 있으면 그 처리를 하고, 없으면 CLI에 prompt로 보낸다"
      - "출력이 있으면 command_output 줄로 그린다. 출력은 색 code를 뗀다(claude, omp). 빈 출력은 그리지 않는다"
      - "출력이 오지 않는 명령(compact, review, plan 등)은 CLI가 다른 일(압축, 리뷰)을 시작한다"
    outcomes:
      - id: output-shown
        when: "명령 출력 줄이 나왔다. claude는 색 code를 떼고 64,000자에서 자른다. omp는 turn 밖 줄로 낸다(도는 turn 중에도 버리지 않는다). opencode는 status, stats, mcps, skills, export를 markdown으로 낸다. codex는 /goal(인자 없음), /mcp, /diff, /ps, /stop만 줄을 만들며 색 code를 떼지 않는다"
        observe: [screen:harness-gui-terminal-tab, screen:harness-gui-command-output]
      - id: compact-summarized
        when: "claude에서 /compact 출력은 그리지 않는다. 대신 압축 전후 토큰을 info 글로 낸다"
        observe: [screen:harness-gui-terminal-tab]
      - id: started
        when: "codex에서 compact, review, plan, goal(인자 있음), new, init, skill 이름은 출력 줄 없이 다른 일을 시작한다"
        observe: [process:cli-gui]
      - id: sent
        when: "adapter의 명령 표에 없는 이름이다. CLI에 prompt로 보낸다(claude는 /이름 인자를 사용자 글로, omp는 /이름 인자를 보낸 뒤 상태를 다시 읽는다)"
        observe: [process:cli-gui]
      - id: refused
        when: "omp에서 TUI에서만 되는 명령이다(works only in the omp TUI 경고, 보내지 않음). codex에서 모르는 명령이다(Unknown command 정보 글)"
        observe: [screen:harness-gui-terminal-tab]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-opencode-undo
    title: "opencode의 undo, redo, new를 server의 revert와 session 생성으로 옮긴다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    when: "opencode adapter만 있다. claude, codex, omp에는 undo와 redo 입력이 없다"
    steps:
      - "undo는 화면의 마지막 사람 메시지를 찾아 POST revert/stage로 되돌린다. files를 true로 보내 server가 file도 되돌리게 한다. 실행 중이면 먼저 interrupt하고 기다린다. 대기 중인 메시지는 inbox에서 지운다"
      - "그 메시지부터 화면에서 숨기고, 그 글을 입력창에 되돌려 준다"
      - "redo는 DELETE revert로 stage를 지운다. server가 session.revert.cleared를 내면 숨긴 메시지가 같은 자리로 돌아온다. adapter는 file이 되살아났는지 확인하지 않는다"
      - "stage된 되돌리기는 다음 보내기가 POST revert/commit으로 굳힌다. 굳은 뒤에는 redo로 되살릴 수 없다"
      - "new는 POST /api/session으로 새 session을 만든다. 옛 session은 그대로 두고, 화면의 옛 메시지는 숨기며, 턴은 stopped로 닫는다"
    outcomes:
      - id: reverted
        when: "undo가 stage를 만들었다. file 되돌리기는 다음 보내기에서 굳는다"
        observe: [request:opencode-server, screen:harness-gui-terminal-tab]
      - id: nothing-to-undo
        when: "되돌릴 사람 메시지가 화면에 없다(Nothing to undo 알림)"
        observe: [screen:harness-gui-terminal-tab]
      - id: queued-cancelled
        when: "undo 대상이 아직 대기 중인 사람 메시지다. revert 대신 inbox에서 지운다"
        observe: [request:opencode-server]
      - id: restored
        when: "redo가 stage를 지웠다(session.revert.cleared). 숨긴 메시지가 같은 자리로 돌아온다"
        observe: [request:opencode-server, screen:harness-gui-terminal-tab, screen:harness-gui-hidden-restored]
      - id: committed
        when: "stage된 되돌리기 뒤 보내기가 POST revert/commit을 불렀다. file 되돌리기가 굳어 redo로 되살릴 수 없다"
        observe: [request:opencode-server]
      - id: new-session
        when: "new가 새 session을 만들었다. 옛 session은 그대로 있다"
        observe: [request:opencode-server, screen:harness-gui-terminal-tab]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/harness-gui.md]

  - id: harness-gui-bang-shell
    title: "사람이 친 ! 글을 모델에 보내지 않고 사람 쪽 shell 줄 하나로 돌린다"
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    steps:
      - "send 입력의 글이 !로 시작하면(또는 run_shell 입력이면) adapter가 그 뒤 글을 명령으로 돈다. 모델에는 가지 않는다"
      - "claude는 /bin/sh -c를 바로 띄운다(도는 turn이 있어도). 결과를 transcript에 붙이는 일만 turn이 끝난 뒤로 미룬다. 명령은 앞 명령이 끝난 cwd에서 돈다"
      - "codex는 thread/shellCommand로만 보내 사람 쪽 tool 줄 하나를 만든다(사람 메시지도 turn 꼬리도 없다). omp는 bash RPC로, opencode는 POST …/shell로 보낸다"
      - "줄 상태는 exit 0이면 ok, 0이 아니면 error다. stop_shell은 그 줄의 명령만 멈추고 줄을 cancelled로 닫는다"
    outcomes:
      - id: ran
        when: "명령이 exit 0으로 끝났다. 줄은 ok다"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: failed
        when: "명령이 0이 아닌 code로 끝났거나 RPC 오류다. 줄은 error다"
        observe: [screen:harness-gui-terminal-tab]
      - id: stopped
        when: "stop_shell로 멈췄다. 그 줄만 cancelled다(codex는 그 명령이 도는 agent turn에 붙어 있으면 turn도 멈춘다)"
        observe: [process:cli-gui, screen:harness-gui-terminal-tab]
      - id: ignored
        when: "! 뒤 글이 비었다. claude와 opencode는 아무 일도 하지 않는다"
        observe: []
      - id: sent-to-model
        when: "! 뒤 글이 비었는데 codex와 omp는 그 글을 모델에 보낸다"
        observe: [process:cli-gui]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  - id: harness-gui-user-message
    title: "다른 client(TUI 등)가 보낸 사람 글을 창에 사람 메시지로 그린다"
    actor: system
    entries: [system:harness-gui-user-message]
    boundary: [shell-extension, acp]
    code:
      - packages/core/extensions/bundled/harness-gui/codex.ts
      - packages/core/extensions/bundled/harness-gui/omp.ts
      - packages/core/extensions/bundled/harness-gui/opencode.ts
      - packages/core/extensions/bundled/harness-gui/claude.ts
      - packages/core/extensions/bundled/harness-gui/received.ts
    steps:
      - "CLI가 사용자 글 항목을 알린다. adapter는 lophn 호출과 답, task 알림 글을 received(사람 아님)로 가른다"
      - "우리 창이 보낸 글의 echo는 이미 그렸으므로 다시 그리지 않는다(codex는 clientId로, omp는 대기 중인 echo 글과 맞춰 본다)"
      - "그 밖의 사람 글은 사람 메시지로 그린다. claude는 살아 있는 경로에서 사람 글을 그리지 않고, resume 때만 사람 메시지로 다시 그린다"
    outcomes:
      - id: shown-as-human
        when: "다른 client가 보낸 사람 글이다. codex는 turn이 돌면 steer, 아니면 next_turn으로 쌓는다. omp는 message_end의 글을 사람 메시지로 넣는다. opencode는 inbox 항목을 queue를 거쳐 보인다"
        observe: [screen:harness-gui-terminal-tab]
      - id: received
        when: "lophn 호출이나 답, task 알림 같은 글이다. 사람 메시지가 아니라 received로 그린다. 보낸 쪽이 from=app:<slug>면 앱 sender(앱 id는 tag에 없어 null)로, agent면 agent로 그린다"
        observe: [screen:harness-gui-terminal-tab]
      - id: echo-skipped
        when: "우리 창이 보낸 글의 echo다. 다시 그리지 않는다. omp는 attribution agent나 합성 메시지도 그리지 않는다"
        observe: []
      - id: not-drawn
        when: "claude의 살아 있는 경로에서 TUI로 친 사람 글이다. 그리지 않는다(resume 때만 사람 메시지로 나온다)"
        observe: []
    crosses_process: true
    docs: [architecture/harness-gui.md]
    unclear:
      - "opencode의 inbox 경로와 omp의 사람 글 경로는 테스트가 없다"

  - id: harness-gui-opencode-secret
    title: "opencode GUI의 탭 전용 server 비밀번호를 spawn env와 0600 file에만 둔다"
    actor: shell
    uses: [harness-gui-open:opened]
    boundary: [shell-extension]
    code:
      - packages/core/extensions/bundled/harness-gui/opencode.ts
    when: "opencode adapter만 있다. 탭 전용 server를 띄울 때다"
    steps:
      - "opencode adapter가 탭 전용 server를 띄울 때 비밀번호를 id 생성기로 만든다"
      - "비밀번호는 spawn env의 OPENCODE_PASSWORD에만 넣는다. 같은 값을 mkdtemp로 만든 폴더 안의 password file에 쓴다"
      - "TUI 명령 글에는 비밀번호가 없다. 파일을 읽는 명령 치환만 든다"
      - "GUI를 멈추거나 시작이 실패하면 그 file을 지운다"
    outcomes:
      - id: kept-in-file
        when: "server를 띄우고 비밀번호 file을 썼다"
        observe: ["disk:<os tmp>/lophn-opencode-*/password", process:cli-gui]
      - id: removed
        when: "GUI handle이 닫히거나 시작이 실패해 password file을 지웠다"
        observe: ["disk:<os tmp>/lophn-opencode-*/password"]
    crosses_process: true
    risk: [secret]
    docs: [architecture/harness-gui.md]
    unclear:
      - "0600 mode는 테스트가 단정하지 않는다(테스트의 fake writeSecret이 가린다). 실제 mode는 코드 읽기로만 확인했다"

  - id: harness-gui-cli-env
    title: "GUI가 띄우는 CLI의 env에서 상위 session 표지는 빼고 provider key와 탭의 hook env는 남긴다"
    actor: shell
    uses: [harness-gui-open:opened, harness-gui-toggle:to-gui]
    boundary: [shell-extension, shell]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
    steps:
      - "extension이 adapter.start로 CLI를 띄울 때 env를 만든다. login shell env < 탭의 hook env < adapter가 바꾸는 칸 순서다"
      - "LOPHN_HOME을 data root로 늘 넣는다"
      - "lophn이 Claude Code 등 상위 session 안에서 떴을 때 물려받은 session 표지(CLAUDECODE, CODEX_THREAD_ID 등)는 지운다. API key 같은 사용자 설정은 지우지 않는다"
    outcomes:
      - id: spawned
        when: "CLI를 그 env로 띄웠다"
        observe: [process:cli-gui]
    crosses_process: true
    docs: [architecture/harness-gui.md]
