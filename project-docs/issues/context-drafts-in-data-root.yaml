id: context-drafts-in-data-root
title: context 초안을 ledger가 아니라 data root 아래 폴더에 두고 제출 때 확정한다
kind: defect
status: kept
topic: contexts
modules: [packages/core/projects]
now: |
  `contexts/folders.ts`가 초안을 `<data root>/projects/<project>/contexts/<context>/drafts/<bundle>/bundle.json`에 둔다. `bundle.submit`이 이 파일을 읽어 검사하고 판으로 확정한다. 초안 삭제는 `removed`에 쌓았다가 command 성공 뒤 `flush`한다. 이유(PM이 file tool로 직접 고친다)는 코드 어디에도 없다.
impact: |
  초안은 ledger 밖이라 ledger rollback·backup에 안 따라온다. 대신 PM이 별도 command 없이 파일로 고친다.
fix: |
  추천: 남긴다. 초안을 ledger로 옮기면 PM용 편집 tool을 새로 만든다(큼).
closed: |
  초안을 ledger로 옮기면 PM이 file tool로 직접 고치는 길 대신 편집 tool을 새로 만들어야 한다(큼). 초안이 ledger rollback·backup에 안 따라오는 것은 받아들인다.
guard: 없음
