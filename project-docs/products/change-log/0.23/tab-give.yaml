id: tab-give
version: 0.23.128
title: session이 든 browser 탭을 자기 밑 session에 주고 되찾으며, 받은 session이 끝나면 탭이 돌아간다
modules: [packages/protocol, packages/cli, packages/coding-agent, packages/core/host-queue, packages/core/lophn-agent, packages/core/main, packages/shell/ipc, packages/shell/main, packages/shell/renderer]
change: |
  주기. 전: 탭을 넘기는 것은 사람뿐이었다(사람의 browser 탭 → 이 컴퓨터의 열린 lophn session). 후: route `tabs/give {tab, session?}`(actor agent)와 CLI `lophn tab give <tab> --to <session> | --back`. session은 지금 든 browser 탭(자기가 연 탭, 사람이 넘겨준 탭, 받은 탭)을 `team spawn`으로 연 자기 엄격한 자손 가운데 이 컴퓨터의 열린 lophn session에 준다. 받을 session이 없거나 열려 있지 않으면 `not_found`, 자기 밑이 아니면 `forbidden`, coding agent 채팅 탭 팀원(`harness_gui`)이면 `conflict`. 탭이 없거나 볼 수 없으면(부모·형제·사람의 탭) 없는 탭과 같은 `not_found`, 보이지만 들지 않은 탭이면 `forbidden`, browser 탭이 아니면 `invalid_input`. 거절 문장은 lophn agent의 tool 결과에 그대로 간다.
  core 표. 탭마다 준 session의 사슬(메모리)이 생겼다. 주면 같은 탭 id로 주인만 바뀌고 사슬 끝에 준 session이 붙는다. 되찾기(`--back`, route의 `session`이 없거나 자기)는 사슬에 있는 session만 하고 사슬을 그 앞까지 자른다. 받은 탭은 `tabs/close`가 `forbidden`(고정 문장)이고, 준 session은 되찾기 전까지 그 탭에 browser 호출을 하지 못한다(`not_found`).
  돌아가기. core가 `SessionEnded`(보관, 지움, `team end`)를 듣고 그 session이 주인인 탭을 돌려준다: 준 사슬을 끝에서부터 거슬러 가장 가까운 열린 session에게(끝난 session은 사슬에서 빠진다). 열린 session이 없으면 사람이 넘긴 탭은 사람에게 돌아가 core 표에서 빠지고 창이 되찾기처럼 `owner`·`handed_tab`을 지우며, agent가 연 탭은 끝난 연 session의 탭으로 돌아간다(아무 agent도 다루지 못한다). 사람이 넘긴 탭을 받은 session이 끝날 때도 이제 core가 같은 길로 돌려준다(창의 다시 알리기도 그대로 같은 끝에 닿는다). 자기가 연 탭은 그대로다. turn 끝은 돌려주지 않는다.
  창. 새 host 요청 `tab_owner {tab, owner?, given}`(workspace 있음)을 그 workspace를 보이는 창이 받아 layout이나 전역 float에서 그 core 탭 id의 탭 `owner`를 고친다(owner가 없으면 사람에게 돌아간 것). shell main은 `tab_show`처럼 그 workspace를 보이는 창에 보내고, 없으면 기다린다. page host는 받지 않는다. 화면에 새로 그리는 것은 없다(주인 avatar가 바뀐다). `given`이면 창의 page 그릇이 그 탭을 메모리에 표시해 page의 `window.close()`에 넘긴 탭처럼 page를 새로 연다(받은 자식이 `evaluate`로 준 session의 탭을 지우지 못하게). 같은 탭의 아직 가지 않은 `tab_owner`는 새것이 대신한다.
  닫기. `tabs/close`가 볼 수 없는 탭(부모·형제·남의 탭, 사람 token에게 agent 탭)에 없는 탭과 같은 `not_found`와 문장으로 답한다(전에는 `forbidden`이라 탭이 있는지 샜다). 볼 수 있지만 닫지 못하는 탭은 `forbidden` 그대로다.
  다시 알리기. `tabs/hand {tab}`이 core 표에 이미 있는 넘긴 탭이면 주인과 사슬을 바꾸지 않고 workspace·profile만 맞춘다(전에는 창이 알린 주인으로 바꿨다). 표에 없는 id만 session이 열려 있는지 본다. core가 다시 뜨면 창이 지금 `owner`로 다시 알리고 사슬은 없다.
  지침. 내장 skill `lophn-agent`의 browser 절에 `tab give`를 더했다. `tab list` help가 받은 탭을 말한다.
why: |
  coordinator가 로그인한 browser 탭을 자식 agent에게 맡길 길이 없어 자식이 같은 page를 다시 열거나 부모가 대신 다뤄야 했다(roadmap `tab-owner.md` 남은 것 첫째).
decisions:
  - text: '주는 상대는 자기 엄격한 자손이고 이 컴퓨터의 열린 lophn session이다. 받은 session이 끝나면 준 session에게, 그도 끝났으면 사람에게 돌아간다. 사람의 Take back은 사슬 전체를 끝낸다. 사슬은 core가 다시 뜨면 버린다.'
    by: agent
  - text: '되찾기는 `--back` 하나로 한다(route는 `session`이 없거나 자기면 되찾기). 이유: agent는 자기 session id를 늘 알지 못한다. 사슬에 있는 조상은 누구나 자기에게 되찾을 수 있고, 다른 자손에게 바로 옮기지는 못한다(먼저 되찾는다).'
    by: agent
  - text: '창에 주인을 고치라고 알리는 것은 새 host 요청 `tab_owner`다. 버린 길: 같은 id로 `tab_open`을 다시 보내기(browser 탭의 `tab_open`은 기다리는 열기라 page host와 mount되지 않은 창이 page를 하나 더 만든다). 그 workspace를 보이는 창이 받고 없으면 기다린다. 권한은 core 표가 정하고 화면은 보일 때 맞으면 된다. 버린 길: 아무 창이 저장된 layout 고치기(다른 창이 연 같은 workspace가 덮는다).'
    by: agent
  - text: '다시 알린 넘긴 탭이 core 표에 이미 있으면 core의 주인이 이긴다. 이유: 받은 session이 끝나 core가 준 session에게 돌려준 뒤, 창이 session 끝에 낡은 주인으로 다시 알리면 탭이 사람에게 잘못 돌아갔다.'
    by: agent
  - text: '사람의 표시는 바꾸지 않는다. 주인 avatar가 지금 다루는 session을 보이고 준 session은 그리지 않는다.'
    by: agent
  - text: 'coding agent 채팅 탭 팀원에게 주면 `conflict`다(그 turn은 터미널의 coding agent가 돌려 lophn browser를 쓰지 않는다). 다른 기계의 팀원은 그 branch가 더한다.'
    by: agent
  - text: '받은 session이 끝나면 사슬의 가장 가까운 열린 session에게 돌아간다. 아무도 없으면 넘긴 탭만 사람에게 가고, agent가 연 탭은 끝난 연 session에게 돌아간다. 버린 길: 바로 준 session만 보기(`team end`가 중간 session을 먼저 닫아 탭이 건너뛰었다), agent 탭을 사람 token의 탭으로(사람 token 호출이 그 agent의 profile login을 쓰고 `tabs/hand`로 다시 넘긴다).'
    by: agent
  - text: '준 agent 탭의 page 새로 열기 표시는 창 메모리에만 둔다(`tab_owner`의 `given`). layout 판을 올리거나 저장하지 않는다. 한계: 전역 float으로 옮긴 탭, 다른 창이 page를 든 탭, 창을 다시 연 뒤에는 표시가 없어 `window.close()`에 닫힌다.'
    by: agent
  - text: '받는 session의 agent가 다른 browser profile을 쓰거나 profile이 없어도 탭을 받을 수 있고 그 탭의 profile login을 `fill-login`으로 칠 수 있다. 사람이 탭을 넘길 때와 같다. 값은 agent를 지나지 않는다.'
    by: agent
follow_up: |
  - 다른 기계에서 도는 팀원(session의 `runs_on`)을 받는 상대에서 빼는 것은 그 branch가 한다.
checklist:
  - "해야: 앱을 다시 build한다"
  - coordinator가 연 browser 탭을 `lophn tab give <tab> --to <자식>`으로 준 뒤 탭 머리의 avatar가 자식으로 바뀌는지, 자식을 `team end`로 끝내면 coordinator로 돌아오는지 본다
