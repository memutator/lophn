id: roster-same-machine-two-keys-stalls-carry
title: 명단이 같은 기계 id를 단 두 key를 충돌로 보지 않아 받는 컴퓨터가 그 이름을 믿지 않고 사람에게는 그 컴퓨터의 file이 멈춘 것만 보인다
kind: bug
status: fixed
topic: remote
modules: [packages/protocol, packages/core/remote]
now: |
  명단의 충돌 규칙(`packages/protocol/remote/roster.ts`)은 key마다 kind·machine이 일관한지만 본다(key 하나가 다른 모양의 항목에 쓰이면 충돌). 서로 다른 key가 같은 `machine`을 다는 것은 충돌이 아니다. 믿는 컴퓨터가 서명하면(복제된 data root에서 새 key로 다시 선 컴퓨터, 믿는 컴퓨터가 서명한 도둑의 key) 그 `machine`인 컴퓨터 항목이 둘이 된다. 폴더 교환의 받는 쪽(`machineSigningKey`, `packages/protocol/remote/carry.ts`)은 그때 그 이름의 manifest를 어느 key로도 믿지 않는다. 명단과 My devices는 두 항목을 정상으로 보인다.
  같은 기계 id의 항목이 둘이면 다른 길도 같은 문제를 겪는다: 받는 컴퓨터의 `computerGranted`가 그 기계를 허락한 컴퓨터로 세지 않아(허락해도 따라가기가 묻는다), 다른 컴퓨터의 앱 event 구독의 감시(`packages/core/remote/subscriptions.ts`의 `deviceOf`)와 이름 풀기는 그 기계를 든 첫 항목으로만 가서 다른 항목 쪽의 event는 오지 않고 아무 말도 없다(dual boot).
impact: |
  그 이름의 컴퓨터가 낸 data, release, event는 모든 컴퓨터에서 받아지지 않고 이미 받은 file은 두되 내주지 않는다. 사람에게는 My devices가 정상이고 Settings › Sync의 그 컴퓨터가 새 file을 받지 못하는 것만 보여 이유를 찾을 수 없다. 데이터를 잃지는 않는다.
fix: |
  - 작음(추천): 명단의 충돌 규칙에 "같은 `machine`을 단 컴퓨터 항목 둘"을 더해 둘 다 엇갈린 줄(`disputed`)로 보이게 하고 사람이 My devices에서 믿지 않는 쪽을 뺀다. 판 4 명단 규칙의 합치기가 바뀌므로 판과 하한을 올릴지 정해야 한다(옛 판과 다른 view가 생긴다).
  - 작음: 명단은 그대로 두고 Settings › Sync와 `machine.environment`가 "같은 이름의 컴퓨터가 둘이라 받지 않는다"를 보인다. 사람이 My devices에서 직접 뺀다.
decided: |
  명단 규칙은 그대로 두고 Sync Settings에서 같은 machine id를 단 둘 이상의 컴퓨터 key가 있을 때 경고와 Remote 설정 링크를 보인다.
closed: |
  Sync Settings가 roster/list와 연결 목록에서 같은 machine id를 가진 복수 key를 감지해 경고 문구와 Remote 설정 이동 단추를 보인다.
guard: 없음
