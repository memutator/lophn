id: keyboard-shortcuts-vscode-style
version: 0.2.0
title: "작업대에 VS Code식 keyboard shortcut(탭·칸·sidebar·터미널)을 더하고 Cmd+W가 창을 닫는 길을 막음"
modules: [packages/shell/renderer, packages/shell/main, packages/shell/ipc, packages/shell/preload]
checked: []
change: |
  전: Ctrl/Cmd+W·Ctrl+Tab·Ctrl+PageUp/PageDown만 workspace.tsx의 capture keydown에 흩어져 있었다. macOS의 Cmd+W는 Electron 기본 menu의 Close Window가 page보다 먼저 가져가 renderer에서 막지 못했다.
  후:
  - 키 표와 판정이 `packages/shell/ipc/keybindings.ts` 한 곳에 있다(main·renderer가 같이 부른다). renderer는 `workspace/use-keybindings.ts`의 document capture 하나로 받고, main의 `before-input-event`는 표에서 `main`이 적힌 것만 받는다.
  - 받는 곳이 `main`인 것은 macOS의 Cmd+W 하나다. main이 menu 단축키까지 막고 `shell:shortcut` channel로 `tab.close`를 보낸다. 나머지는 모두 renderer다.
  - 터미널(xterm)에 focus가 있으면 Linux·Windows의 Ctrl+글자 하나(Ctrl+W·B·P)는 shell로 간다. 나머지는 앱이 받는다. macOS의 Cmd 조합은 모두 앱이 받는다.
  - 판정은 `code`(KeyW, Digit1)와 글자 키의 `key`를 같이 봐서 한글 입력 상태에서도 된다. 한글 조합 중(`isComposing`)은 건너뛴다. modifier는 정확히 같아야 맞는다(Ctrl+Alt+1은 Alt+1이 아니다). 입력칸과 편집기 안에서도 앱이 먼저 받는다.
  - 눌러 둔 반복은 command를 다시 부르지 않지만 키는 삼킨다(반복에서 삼키지 않으면 menu의 Close Window가 탄다).
  - 닫은 탭은 창 전체에서 최근 10개를 기억한다. 파일·Context·Search·Agent 탭은 그 칸 그 자리로 다시 열고 터미널 탭은 건너뛴다(`TabKindDef.noReopen`). 이름 바꾸기·휴지통으로 사라진 탭은 기억하지 않는다. 다시 열기 목록은 저장하지 않는다.
  - 키 표(하는 일 / Linux·Windows / macOS / 받는 곳 / 터미널 안):
    - 다음·이전 탭: Ctrl+Tab·Ctrl+PageDown, Ctrl+Shift+Tab·Ctrl+PageUp / 같음 / renderer / 앱
    - n번째 탭(0은 마지막): Alt+1…9, Alt+0 / Ctrl+1…9, Ctrl+0 / renderer / 앱
    - 탭 닫기: Ctrl+W, Ctrl+F4 / Cmd+W / Linux·Windows renderer, macOS main / Ctrl+W는 shell, Ctrl+F4와 Cmd+W는 앱
    - 닫은 탭 다시 열기: Ctrl+Shift+T / Cmd+Shift+T / renderer / 앱
    - 탭을 줄 안에서 왼쪽·오른쪽으로: Ctrl+Shift+PageUp·PageDown / 같음 / renderer / 앱
    - n번째 칸으로 focus(1·2): Ctrl+1·2 / Cmd+1·2 / renderer / 앱
    - 탭을 이전·다음 칸으로(한 칸이면 나눔): Ctrl+Alt+←·→ / Cmd+Ctrl+←·→ / renderer / 앱
    - 칸 나누기(고른 탭을 오른쪽 칸으로): Ctrl+\ / Cmd+\ / renderer / 앱
    - sidebar 접기·펼치기: Ctrl+B / Cmd+B / renderer / Ctrl+B는 shell
    - Explorer로 focus: Ctrl+Shift+E / Cmd+Shift+E / renderer / 앱
    - 파일 검색 탭: Ctrl+Shift+F / Cmd+Shift+F / renderer / 앱
    - 터미널로 focus(없으면 열기): Ctrl+backtick / Ctrl+backtick / renderer / 앱
    - 파일 빠른 열기(팔레트): Ctrl+P / Cmd+P / renderer / Ctrl+P는 shell
why: |
  탭·칸·sidebar·터미널을 마우스 없이 VS Code에서 익힌 손으로 다루게 하고, 앱이 창을 닫아 버리는 길을 확실히 막으려고.
decisions:
  - text: |-
      앞 항목의 "Ctrl/Cmd+W는 renderer capture에서만"을 바로잡는다. macOS는 menu key equivalent가 page keydown보다 앞서서 renderer의 `preventDefault`로 막히지 않는다. Electron 문서는 `before-input-event`의 `preventDefault`가 page keydown과 menu 단축키를 함께 막는다고 한다. 그래서 macOS의 Cmd+W만 main에서 받는다. application menu를 직접 정하는 길은 버렸다: macOS에서 menu를 없애면 Cmd+C/V/Z가 죽고, Edit role을 지키며 menu를 새로 짜면 mac에서 눈으로 확인하지 못한 채 menu 전체를 바꾸게 된다. Linux·Windows는 page가 `preventDefault`하면 menu로 가지 않고, 터미널의 Ctrl+W를 shell로 보내야 해서 renderer에서 받는다.
    by: agent
  - text: |-
      칸이 최대 둘이라 Ctrl/Cmd+3은 두지 않는다. 칸이 없는 번호는 무시한다(칸을 만들지 않는다).
    by: agent
  - text: |-
      Ctrl/Cmd+B는 편집기 밖 우선(VS Code처럼)이다. markdown 편집기의 굵게는 Mod-Shift-b로 옮겼다.
    by: agent
  - text: |-
      Ctrl/Cmd+P는 창 팔레트(Ctrl/Cmd+K와 같은 팔레트, 파일 행이 이미 있다)를 연다. 파일 먼저 보기 모드는 두지 않았다.
    by: agent
  - text: |-
      Keep Open(preview 고정)은 VS Code에서 Ctrl+K Enter chord라 맞는 단일 키가 없고 Ctrl+K는 팔레트라서 하지 않았다. 탭 menu의 Keep Open과 탭 더블클릭은 그대로다.
    by: person
  - text: |-
      menu 항목과 tooltip의 단축키 표시는 design `Menu`가 받쳐 주지 않아 하지 않았다. 팔레트의 Terminal 행에만 키를 보인다.
    by: person
  - text: |-
      macOS Cmd+W는 launcher·Settings 화면에서도 삼켜져 창을 닫지 않는다. Linux·Windows는 작업대 밖에서 Ctrl+W가 기본 menu의 Close Window로 간다.
    by: agent
follow_up: |-
  실제 앱에서 Cmd+W(macOS)와 Ctrl+W(Linux·Windows)가 창을 닫지 않는지, GNOME의 Ctrl+Alt+←·→처럼 OS가 가져가는 키가 있는지 확인한다.
