id: core-observability-and-doctor
version: 0.10.1
title: "core에 구조화 log·trace·metric, /healthz·/readyz, 오류 hint·trace_id, npm run doctor"
modules: [packages/base, packages/protocol, packages/core/diagnostics, packages/core/server, packages/core/main, packages/core/jobs, packages/core/workflows, packages/core/storage, packages/core/apps, tools]
checked: [architecture-observability, tool-doctor]
change: |
  전: core daemon의 운영 출력은 console.error 평문이었다. 요청을 잇는 id가 없었고 metric이 없었다. 상태는 diagnostics/status(구성 요소 available)뿐이었다. 오류 body는 code, message(, details)였다. 개발 환경을 점검하는 명령이 없었고 .env.example은 git에 없었다.
  후:
  - core의 log는 stderr 한 줄 JSON(LOPHN_LOG_FORMAT=pretty면 사람이 읽는 줄)이다. 칸: timestamp, level, service_name, trace_id, span_id, component, event, message, fields. credential pattern, 알려진 secret, secret 모양의 key 이름(password, token, api_key …)의 값은 *로 나간다.
  - API 요청마다 server span이 생기고, ledger writer command와 reader read가 그 아래 span이다. 받은 traceparent를 잇고, 모든 응답에 traceparent와 x-trace-id가 붙는다. RED metric: http.server.requests, http.server.errors(5xx), http.server.request.duration(ms).
  - LOPHN_TELEMETRY=console이면 span을 debug log로, otlp면 span·metric·log를 OTEL_EXPORTER_OTLP_ENDPOINT(loopback http만)로 10초마다와 종료 때 보낸다. 기본 off.
  - GET /healthz(uptime, pid, memory)와 GET /readyz(구성 요소 점검과 점검별 지연, reader 상태, event loop 지연, memory. ready·degraded 200, not_ready 503). 둘 다 Bearer가 있어야 한다.
  - 오류 body에 hint(code마다 고정 문장)와 trace_id가 더해진다. handler가 던진 것은 api handler_threw error log에 종류와 저장소 안 첫 frame만 남는다.
  - kill -USR2 <core pid>가 <data root>/diagnostics/에 자원 요약 JSON과 5초 CPU profile을 남긴다(LOPHN_HEAP_SNAPSHOT=1이면 heap snapshot도).
  - npm run doctor(tools/doctor/)가 runtime·도구 판, Electron과 sandbox, .env 대 .env.example, telemetry env, lock 파일과 설치본, 필수 binary, dev data root, port 7431·7499, 떠 있는 core, 바깥 TCP 연결을 보고 fix: 명령을 보인다. --fix는 .env 복사, chmod, .cache 만들기를 한다. .env.example을 git에 넣는다.
  계약:
  - 생긴 것: errorBodySchema.error.hint, errorBodySchema.error.trace_id, HTTP GET /healthz·GET /readyz, 응답 header traceparent·x-trace-id, env LOPHN_TELEMETRY·LOPHN_LOG_LEVEL·LOPHN_LOG_FORMAT·OTEL_EXPORTER_OTLP_ENDPOINT·LOPHN_HEAP_SNAPSHOT, CoreOptions.telemetry, WiringContext.telemetry, packages/base/telemetry/.
  - 바뀐 것: JobSchedulerDeps.logger, createWorkflowService의 logger, withAfterCommit(writer, apply, logger), confirmStartup(root, logger), ReaderPoolOptions.logger, openRuntime의 logger.
why: |
  장애 때 log, 요청, ledger 호출을 한 id로 묶어 원인을 좁히고, 새 개발자가 명령 하나로 환경 문제를 찾게 한다.
decisions:
  - text: "OpenTelemetry SDK를 들이지 않고 W3C Trace Context·OTLP JSON 모양을 직접 만든다. core는 node:http loopback API와 SQLite Worker라 auto-instrumentation이 거의 걸리지 않고, base는 바깥 import를 못 한다. 버린 길: @opentelemetry/* 6~8개 의존."
    by: agent
  - text: "/healthz·/readyz도 Bearer를 요구한다. 같은 컴퓨터의 사용자 앱이나 agent가 띄운 명령이 token 없이 core 내부 상태를 읽지 않게 한다. 버린 길: /healthz 무인증."
    by: agent
  - text: "OTLP는 loopback 수집기에만 보낸다. core의 network는 loopback뿐이라는 규칙을 telemetry가 깨지 않는다. 바깥 backend는 수집기가 내보낸다."
    by: agent
  - text: "바깥 provider·MCP로 가는 요청에는 traceparent를 붙이지 않는다(tracedFetch는 loopback에만)."
    by: agent
