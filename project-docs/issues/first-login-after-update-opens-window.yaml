id: first-login-after-update-opens-window
title: "업데이트 뒤 첫 로그인 실행은 창을 한 번 연다"
kind: bug
status: open
topic: platform
modules: [packages/shell/main]
now: |
  켜 둔 autostart의 옛 `--tray` 등록은 일반 실행에서 한 번 `--core`로 다시 쓴다(`packages/shell/main/desktop/autostart.ts`). 업데이트 뒤 첫 실행이 그 로그인 등록이면 `--tray`를 모르는 새 판이 일반 실행으로 창을 연다. 같은 실행에서 등록은 고쳐진다. macOS `wasOpenedAtLogin`과 core-only 실행의 userData 폴더는 실기로 확인하지 않았다.
impact: |
  한 번 창이 뜬다. 그 뒤로는 core만 뜬다.
fix: |
  그대로 둔다(`--tray` 호환 장치를 두지 않는 것이 결정이다). macOS·Windows 실기 확인은 사람이 한다.
