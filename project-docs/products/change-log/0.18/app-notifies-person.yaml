id: app-notifies-person
version: 0.18.0
title: "앱이 사람에게 알린다(`@lophn/cap-notify`)"
modules: [packages/sdk, packages/protocol, packages/core/apps, packages/core/main, packages/core/agent-workspaces, packages/shell/ipc, packages/shell/main, packages/shell/preload, packages/shell/renderer, packages/design]
checked: [architecture-event, architecture-app-call, architecture-app-notice]
change: |
  - 전: 앱이 사람에게 닿는 길이 없었다. `cap-notify`는 보류였고, 캘린더의 "일정 전에 알려 줘"나 사용량 앱의 한도 경고는 사람에게 갈 곳이 없었다. Inbox(대기 목록)에는 사람이 답할 것과 Finished 줄만 있었다.
  - 후:
    - SDK `@lophn/cap-notify` 1.0.0: `notify({ title, body?, key? })`. 앱 process(command·operation·flow·시작 코드)에서 부른다. 같은 앱의 같은 `key` 알림이 열려 있으면 새 알림이 대신한다(내용 갱신, 맨 뒤로, toast 다시).
    - grant `notify.send`(scope `{}`). 앱이 선언하고 activation 때 사람이 허락한다. broker가 요청마다 지금 release의 선언 ∩ grant를 보고, 없으면 `forbidden`이다. Access 탭에 "notifications" 줄로 보이고 거둘 수 있다.
    - route `app_notices.post`(actor app, app credential이 닿는 두 번째 operation), `app_notices.dismiss`(사람), `app_notices.list`. 남지 않는 event `AppNoticePosted`·`AppNoticeClosed`.
    - 알림은 `app_notices` 표에 남는다. 사람이 지우거나 앱이 보관될 때까지 재시작을 넘어 남는다. 앱마다 열린 알림은 50개까지이고 넘으면 오래된 것부터 지운다.
    - Inbox에 지우기만 하는 "From apps" 묶음이 생겼고 알림 단추의 수에 더한다. 받으면 shell main이 toast(lophn 창에 focus)나 OS 알림을 띄우고, 누르면 그 앱이 열린다.
    - 앱 agent 지침이 사람에게 알릴 일에 `notify.send`와 cap-notify를 쓰게 한다.

  옮기기: ledger step `apps.permissions.notify_kind`가 `grants` 표의 kind CHECK에 `notify.send`를 더한다(표를 다시 만들고 행을 그대로 옮긴다). ledger step `apps.notices.tables`가 `app_notices` 표를 만든다.
why: |
  사람이 앱 event를 열어 job과 앱이 서로 반응하는 길을 이야기하다가, 가장 실용적인 첫 단계로 앱 → 사람 알림을 골랐다(사람, 2026-11-05). 앱 event의 발행·구독과 event로 시작하는 job은 반응을 믿게 할 장치(저장, cursor, 재시도)가 다시 필요해 열지 않았다(`architecture/event.md`).
decisions:
  - text: |
      받는 쪽은 사람뿐이다. agent나 core 로직이 알림에 반응하지 않는다. agent 추천을 사람이 받았다.
    by: person
  - text: |
      Inbox에서 답할 것과 따로 두고 지우기만 한다. 표에 남기고, 같은 key는 대신한다. agent 추천을 사람이 받았다.
    by: person
follow_up: |
  - 앱이 열린 알림을 스스로 거두는 길이 없다(같은 key로 덮기만 한다).
  - 앱 event 발행·구독과 event로 시작하는 job은 roadmap에 없다.
