      - {do: "사람이 Take control로 탭을 가져온다", screen: browser-agent-held, flow: browser-tab-control:held}
      - {do: "agent의 act는 conflict가 되고 snapshot은 된다", flow: host-browser-act:conflict}
      - {do: "사람이 탭을 돌려준다", screen: browser-agent-control, flow: browser-tab-control:released}
      - {do: "끝나면 agent가 자기가 연 preview 탭을 닫는다", flow: host-tab-close:accepted}

