      - id: not_found
        code: not_found
        when: "run이 없음"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 run 행이 깨져 읽지 못함"
        observe: [response]
    crosses_process: true
    docs: [architecture/run.md]

  - id: run-cancel
    title: "사람이 실행 중 run을 취소한다"
    actor: person
    entries: [route:runs/cancel]
    uses: [route:runs/settle, route:turns/stop]
    boundary: [core-api, runs, run-loop]
    code: [packages/core/runs/service.ts, packages/core/main/daemon/wiring/runs.ts]
    steps:
      - "run을 먼저 cancelled로 닫는다(running에서만). 이미 끝났으면 conflict"
      - "입력이 아직 queue에 있으면 queue와 접수 기록에서 뺀다. 이미 가져갔으면 도는 turn을 StopTurn으로 멈춘다"
      - "뒷일의 오류는 기록하지 않는다. tool run은 이미 나간 앱 호출을 멈추지 않는다"
    outcomes:
      - id: cancelled
        observe: [ledger:runs, response]
