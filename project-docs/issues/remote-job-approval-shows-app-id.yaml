id: remote-job-approval-shows-app-id
title: 다른 컴퓨터의 앱 event로 도는 job의 승인 card가 그 앱을 이름이 아니라 id로 보인다
kind: bug
status: open
topic: job
modules: [packages/shell/renderer, packages/mobile]
now: |
  다른 컴퓨터의 앱 event를 trigger로 적을 때 `source`는 그 컴퓨터의 앱 id(`app_…`)여야 한다(`packages/protocol/jobs/values.ts`: slug는 컴퓨터마다 달라 풀지 못한다). 승인 card는 그 값을 그대로 글에 넣는다: desktop은 `packages/shell/renderer/desktop/connection/waiting/cards/job-approval-card.tsx`의 `source: entry.job.trigger.source`, 폰은 `packages/mobile/src/screens/inbox/now.tsx`의 `source: job.trigger.source`. 문구 key는 `waiting.notice.job-approval-event-on`이다. 개발 core 둘로 띄운 창에서 card가 "Wants to run when app app_01m7r9x… on the computer machine-b publishes item.added"로 보였다. 컴퓨터는 이름으로 보인다(`machineNameOf`).
impact: |
  사람이 unattended로 돌 job을 승인하는데 어느 앱의 event인지 id로는 알 수 없다. 그 컴퓨터의 앱 목록과 견줘 보지 않으면 다른 앱의 event에 거는 job을 그대로 승인할 수 있다.
fix: |
  - (작음, 추천) card가 그 컴퓨터의 앱 목록에서 이름을 찾아 보이고 못 찾으면(꺼져 있음, 앱이 지워짐) id를 보인다. desktop 창은 다른 컴퓨터의 앱 목록을 이미 읽는다(sidebar의 앱 줄). 폰은 그 컴퓨터의 앱 이름을 읽는 길이 있는지부터 본다. 잃는 것: 없음.
  - (작음) job을 만들 때 core가 그 컴퓨터에 앱 이름을 물어 trigger에 함께 저장한다. 잃는 것: 저장한 이름이 그 컴퓨터에서 바뀐 이름과 달라질 수 있고 저장 꼴이 바뀐다.
