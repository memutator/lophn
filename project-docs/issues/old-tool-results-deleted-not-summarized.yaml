id: old-tool-results-deleted-not-summarized
title: 'turn 안에서는 오래된 tool 결과를 요약하지 않고 지운다'
kind: defect
status: fixed
topic: agent-definition
modules: [packages/core/lophn-agent]
now: |
  자동 Compact(요약)는 turn 사이에만 돈다(`packages/core/lophn-agent/run-loop/driver.ts`). turn 안에서는 조립한 prompt 추정이 예산의 85%(`SHRINK_AT`)를 넘거나 provider가 입력이 크다고 거절하면, 가장 오래된 tool 결과부터 본문을 고정 문장으로 바꿔 60%(`SHRINK_TO`) 아래로 줄인다(`run-loop/turn.ts`의 `shrinkHistory`, `run-loop/history.ts`의 `omitOldToolResults`). 바꿀 tool 결과가 더 없을 때만 turn이 `context_limit`으로 끝난다. Codex(`codex-rs/core/src/session/turn.rs`의 mid-turn `run_auto_compact`), opencode(`runner/llm.ts`의 매 step 앞 `compact({reason: "auto"})`), Claude Code, omp(`maintainContextMidRun`)는 turn 안 model 요청 사이에 요약하고 같은 turn을 이어 간다.
impact: |
  긴 tool loop에서 agent가 앞서 읽은 파일 내용을 잃는다. 요약도 남지 않아 같은 파일을 다시 읽거나, 앞서 본 것을 모르고 판단할 수 있다(token과 시간 비용). `context_limit` 실패는 지울 tool 결과가 바닥난 드문 경우뿐이다.
fix: |
  - 줄이기가 한 번 이상 일어난 뒤 다시 85%를 넘으면, 지우는 대신 turn 안 진행(앞선 tool 결과 포함)을 요약하는 mid-turn Compact를 하고 같은 turn을 이어 간다. 요약에 turn 안 진행을 담는 규칙과 rewind·event와의 관계를 정해야 한다. 중간~큼.
  - 그대로 둔다. 지우기는 model call이 없고 prefix cache를 덜 깬다. 실제 긴 작업에서 다시 읽기가 문제로 보일 때 고친다.

  추천: 둘째. 지금 지우기로 turn이 끝나지는 않는다.
closed: |
  사람이 대세 coding agent처럼 들이기로 정했다. turn 안 조립 추정이 예산의 85%를 넘거나 provider가 입력이 크다고 거절하면 turn이 자기 session을 먼저 Compact(이 turn의 진행 포함, turn당 2번까지)하고 같은 turn을 이어 간다. core는 도는 그 turn 자신(machine, 입력의 `turn`)의 Compact만 받는다. 요약이 실패하거나 할 것이 없으면 오래된 tool 결과 지우기로 물러난다(`run-loop/turn.ts`의 `relieve`, `session/compactor.ts`의 `compactInTurn`).
guard: tests/harness/loop/loop_test.ts의 turn 안 Compact 줄, packages/core/lophn-agent/session/compact_test.ts
