id: agent-chat-small-wheel-and-restore
version: 0.9.0
title: 'Agent 대화 맨 아래에서 작은 wheel이 먹히지 않고, 탭을 다시 열면 읽던 위치가 돌아온다'
modules: [packages/shell/renderer]
checked: []
change: |
  전:
  - 맨 아래에서 위로 1px 이하로 움직인 scroll은 남은 거리가 1이라 "맨 아래"로 읽혔다(앞 판의 `> 1` 조건). 따라가기가 켜진 채 `onScroll(null)` → `DraftStore.save` → 화면 전체 render → render마다 도는 고정이 맨 아래로 되돌렸다. 부드러운 wheel은 첫 frame이 0~1px이라 한 칸이 통째로 먹혔다. headless 앱(CDP)에서 -1px×10, -0.6px×20 wheel이 0px 움직이고 매번 `scrollTop`이 맨 아래로 다시 설정됐다. 앞 판은 -10과 -5×8로만 확인했다.
  - 글이 자라는 동안에는 고정이 `scrollTop`을 올려, scrollTop 차이로 읽은 방향이 어긋나 위로 올린 처음 몇 frame이 다시 고정됐다.
  - scroll event마다 읽던 위치를 저장해 창의 AgentView 전체가 다시 그려졌다.
  - 탭을 다시 열면 대화가 빈 채로 그려지고 줄이 뒤에 와서, 읽던 위치 대신 맨 위(0)에 서고 jump 단추가 그 줄 수("24")를 새 말로 셌다.
  후:
  - 따라가기는 위로 올리려는 입력(wheel deltaY<0, ↑·PageUp·Home·Shift+Space, scrollbar 누르기)으로만 끈다. scroll 위치는 다시 켜기만 한다: 아래로 움직여 맨 아래 24px 안에 들어오거나, 대화가 다 들어와 올릴 것이 없을 때(`message-list/follow.ts`).
  - 코드가 옮긴 위치는 `lastTop`에 바로 기록한다.
  - 읽던 위치는 `scrollend`에서 바뀌었을 때만 저장한다.
  - 빈 대화에 처음 온 줄은 새 말이 아니라 처음 모습으로 보고 그때 읽던 위치를 돌려놓는다.
why: |
  사람이 "스크롤해도 약간 튕기는 느낌, 막혀 있는 듯하다"고 했다. 같은 headless 앱에서 고친 뒤 -1px×10·-0.6px×20·-1.5px×10·-5×8이 모두 다 움직였고 고정이 끼어들지 않았다. 맨 아래에서 보낸 말은 따라가고, 올려 읽는 중 온 말은 jump 단추로 세고, 다시 내려오면 따라가고, 탭을 바꿨다 오면 1014px 자리로 돌아왔다.
decisions:
  - text: |
      끄는 판단을 scroll 위치에서 입력으로 옮긴다. 위치로 끄면 고정과 사람 scroll이 같은 값을 다퉈 문턱을 어떻게 잡아도 작은 움직임이 먹힌다.
    by: agent
  - text: |
      글을 고르며 위로 끄는 drag scroll과 터치는 따라가기를 끄지 않는다. 쓰이면 그때 더한다.
    by: agent
