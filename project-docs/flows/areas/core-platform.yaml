  - id: shell-core-recover
    title: "shell main이 core에 다시 붙거나, 없으면 띄우고, 판이 다르면 갈아 띄운다"
    actor: shell
    entries: [system:shell-core-recover]
    uses: [control:identify, system:core-ensure]
    boundary: [shell, core-control-protocol]
    code: [packages/shell/main/desktop/core/connection.ts, packages/shell/main/desktop/core/supervise.ts]
    steps:
      - "main 시작 때 한 번, 그리고 Gateway가 stale을 알리고 1초 뒤에 부른다. 동시에 부른 것은 하나로 합친다. Stop lophn이나 detach로 멈춘 shell은 아무것도 하지 않는다"
      - "control identify로 core가 stopping인지 본다. stopping이면 연결을 stale로 두고 다시 띄우지 않는다. 다른 client가 끈 core를 되살리지 않는다"
      - "그 밖이면 연결을 starting으로 밀고 system:core-ensure로 붙거나 띄운다. ensure가 ok면 openCore가 Gateway를 열고 ready로 세운다. shell capability는 main 메모리에만 둔다"
      - "ensure가 실패하면 reason이 newer_schema, history_mismatch, damaged_original이면 failed-schema로, 그 밖이면 failed-start로 세운다"
    outcomes:
      - id: ready
        observe: ["process:shell main 연결 state가 ready가 되고 창에 shell:core-state가 간다"]
        when: "ensure가 붙거나 띄워 ready 연결을 열었다"
      - id: failed-start
        observe: ["screen:home-start-failed"]
        when: "ensure가 reason 없이 또는 other로 실패했다"
      - id: failed-schema
        observe: ["screen:home-schema-failed"]
        when: "ensure가 newer_schema, history_mismatch, damaged_original로 실패했다. schemaFailure에 이유를 싣는다"
      - id: stopping-seen
        observe: ["process:core를 띄우지 않는다"]
        when: "identify가 stopping이라 답했다. 연결은 stale로 남고 이후 자동 복구도 멈춘다"
      - id: skipped
        observe: ["process:core를 띄우지 않는다"]
        when: "Stop lophn이나 detach로 멈췄거나(돌던 ensure는 signal로 끊겨 core를 새로 띄우지 않는다) shutdown을 본 뒤다. control이 처음부터 없었으면(판을 읽지 못함) 연결은 failed-start이고 여기서는 아무것도 하지 않는다"
    crosses_process: true
    unclear:
      - "identify가 ok가 아니면 stopping 검사를 건너뛰고 바로 ensure로 간다. 의도인지 확인할 것"

  - id: shell-core-stale
    title: "Gateway가 끊기거나 core가 shutdown을 알리면 연결을 stale로 바꾸고 재연결을 건다"
    actor: shell
    entries: [system:shell-core-stale]
    uses: [system:shell-core-recover]
    boundary: [shell, event-stream]
    code: [packages/shell/main/desktop/core/connection.ts, packages/shell/main/desktop/core/events.ts]
    steps:
      - "Gateway sink가 stale을 알리면 shutdown을 본 적이 없을 때만 연결 state를 stale로 밀고 recover를 건다. ready 뒤 60초를 못 산 core의 끝을 crash로 세고(60초 넘게 산 뒤의 끝은 센 수를 0으로 돌린다) 대기는 1, 2, 4, 8초다. 다섯 번째에서 멈춘다"
      - "core가 closed(shutdown) frame을 보내면 창에 closed를 넘기고 shutdownSeen을 세운 뒤 state를 stale로 둔다. 이 뒤로는 recover가 다시 띄우지 않는다"
      - "shutdownSeen이 선 뒤의 stale 알림은 무시한다"
    outcomes:
      - id: retry-scheduled
        observe: ["process:연결 state가 stale이 되고 1초(crash가 이어지면 2, 4, 8초) 뒤 shell-core-recover가 돈다"]
        when: "socket이 끊겼고 shutdown을 보지 않았다. 연속 crash가 네 번 이하다"
      - id: restart-capped
        observe: ["screen:home-start-failed", "process:core를 다시 띄우지 않는다"]
        when: "ready 뒤 60초를 못 산 core가 연달아 다섯 번째로 끝났다. 시작 실패 화면에 멈춘다. Retry(attachIfAlive)는 센 수를 비우지 않고 이미 서 있는 core에만 붙는다"
      - id: shutdown-stale
        observe: ["process:재연결이 없다", "process:창에 closed가 간다"]
        when: "closed(shutdown) frame을 받았다. core가 내려가는 중이라 다시 띄우지 않는다"
      - id: ignored
        observe: ["process:state 변화 없음"]
        when: "shutdown을 이미 본 뒤의 stale 알림이다"
    crosses_process: false
    unclear:
      - "stale 상태에 맞는 화면 frame이 없다. main.tsx가 연결 state가 stale이면 notice를 띄울 뿐이다"

