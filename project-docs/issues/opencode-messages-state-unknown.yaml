id: opencode-messages-state-unknown
title: OpenCode 맡기기에서 메시지가 늘 `state_unknown`으로 거절된다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/protocol, packages/coding-agent]
now: '`HARNESS_ADAPTERS.opencode.hook`이 `null`이라 `harness install`이 hook을 놓지 않는다(결과 `not_supported`). 그런데 `TURN_END_SIGNALS.opencode`는 `"session.status idle"`이라 `canDeliverMessages("opencode")`가 true다(`protocol/coding-agent/harness-adapter.ts`). 그래서 `core/apps/tickets/coding/transport.ts`의 `send`가 `no_turn_end_signal` 검사는 통과하고, hook이 한 번도 안 와 `row.heard`가 false인 채라 늘 `state_unknown`으로 거절한다. Settings에도 메시지를 받을 수 있는 제품으로 보인다.'
impact: OpenCode로 맡기면 session은 뜨지만 App Engineer가 보내는 메시지는 전부 실패한다. 사람은 Settings 표시를 믿고 골랐다가 뒤에 안다.
fix: |
  - 신호 표에서 `opencode`를 `null`로 바꾼다(한 줄). 거절 이유가 `no_turn_end_signal`로 정직해지고 Settings도 맞게 보인다. `architecture/coding-agent.md`의 turn 끝 신호 목록에서 OpenCode를 같이 뺀다.
  - project plugin 위치를 조사로 확인해 hook을 설치한다(조사 + install 코드, 중간).
  - 추천: 앞쪽. hook 위치가 확인되면 그때 되살린다.
decided: 고친다. 전역 설치로 바꿀 때 OpenCode의 전역 plugin 위치를 확인해 hook을 놓는다.
closed: "`HARNESS_ADAPTERS.opencode.hook`을 전역 plugin `~/.config/opencode/plugins/lophn-status.ts`(opencode.ai/docs/plugins로 확인)로 채우고, `install.ts`의 `opencodePlugin`이 `HOOK_EVENT_TABLE.opencode`의 event 가운데 root session 것만 `lophn hook opencode <event>`로 넘긴다. token이 없으면 hook을 등록하지 않는다. 가짜 client와 가짜 `lophn`으로 plugin만 돌려 봤고 실제 OpenCode로는 확인하지 못했다(아래 열린 bug)."
guard: 없음
