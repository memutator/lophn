    docs: [architecture/workflow.md, architecture/remote.md]

  - id: workflow-set-defaults
    title: workflow.yaml의 기본값(default_step, open, steps.*.open, inputs.*.default)을 주석을 유지하며 갱신한다
    actor: person
    entries: [route:workflows/set-defaults]
    boundary: [workflows, core-api]
    code: [packages/core/workflows/declaration.ts, packages/core/workflows/service.ts, packages/core/main/daemon/wiring/workflows-files.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - 변경 대상 필드를 검증하고 YAML AST로 주석·anchor를 보존해 workflow.yaml에 원자적으로 쓴 뒤 갱신된 WorkflowEntry를 돌려준다
    outcomes:
      - id: saved
        observe: [disk:workflow.yaml, response]
      - id: not-found
        code: not_found
        when: project, workflow, 대상 step 또는 대상 input key가 없다
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: 변경할 항목이 없거나 flow에 step 기본값을 넣었거나 갱신된 선언 검증에 실패한다
        observe: [response]
      - id: conflict
        code: conflict
        when: 기존 workflow.yaml이 없거나 파싱에 실패한다
        observe: [response]
      - id: forbidden
        code: forbidden
        when: workflow 폴더나 workflow.yaml이 symlink이거나 원격 쓰기 허락이 없다
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/workflow.md]

  - id: workflow-instance-rename
    title: 사람이 workflow instance의 제목을 바꾼다
    actor: person
    entries: [route:workflow_instances/rename]
    boundary: [workflows, core-api]
    code: [packages/core/workflows/commands.ts, packages/core/workflows/title-schema.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - 제목을 redaction하고 1~120자 검증 뒤 workflow_instances.title을 갱신하고 StateChanged(workflow_instances)를 발행한다
    outcomes:
      - id: renamed
        observe: [ledger:workflow_instances, event:StateChanged, response]
      - id: not-found
        code: not_found
        when: instance가 없다
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: 제목이 비었거나 120자를 넘는다
        observe: [response]
      - id: forbidden
        code: forbidden
        when: user 자격이 아니다
        observe: [response]
      - id: unavailable
        code: unavailable
        when: redaction이 끝나지 않았다
        observe: [response]
    crosses_process: false
    docs: [architecture/workflow.md]

  - id: workflow-instance-ai-title
    title: agent runtime이 전역 기본 model로 새 workflow instance의 AI 제목을 짓는다
    actor: system
    entries: [route:workflow_instances/title-request-take, route:workflow_instances/set-ai-title]
    boundary: [workflows, lophn-agent]
    code: [packages/core/main/agent-runtime/workflow-title-pump.ts, packages/core/lophn-agent/prompt-assembly/title.ts, packages/core/workflows/commands.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - workflow instance 시작 시 대기열에 쌓인 요청을 agent-runtime이 가져가 model-default로 2~6단어 제목을 만들고 expected가 아직 일치할 때만 저장한다
    outcomes:
      - id: applied
        observe: [ledger:workflow_instances, event:StateChanged, response]
      - id: skipped
        when: 그 사이 사람이 제목을 바꿨거나 기본 model이 없다
        observe: [response]
      - id: not-found
        code: not_found
        when: instance가 없다
        observe: [response]
      - id: forbidden
        code: forbidden
        when: machine 자격이 아니다
        observe: [response]
      - id: unavailable
        code: unavailable
        when: redaction이 끝나지 않았다
        observe: [response]
    crosses_process: true
    declared_only: [invalid_input]
    docs: [architecture/workflow.md]
