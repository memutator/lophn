schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # 문서

  - id: req-0001
    status: accepted
    subject: projects
    statement: lophn에서 문서는 디스크의 파일 그 자체다.
    acceptance:
      - 문서 탭에서 고친 내용은 그 파일에 저장된다.
      - 다른 편집기에서 고친 파일을 문서 탭에서 다시 열면 고친 내용이 보인다.
    related:
      - shell

  - id: req-1474
    status: accepted
    subject: projects
    statement: 문서 탭은 VS Code처럼 흔한 확장자의 파일을 거의 다 연다. text 파일은 열고 고치고, 이미지와 pdf는 열어 본다.
    acceptance:
      - Markdown, JSON, YAML, 코드 파일 같은 text 파일을 문서 탭에서 열고 고칠 수 있다.
      - png, jpg 같은 이미지와 pdf 파일을 문서 탭에서 열어 볼 수 있다.
    related:
      - shell
      - contexts

  # 폐기: VS Code처럼 project 밖 파일도 열 수 있다. 거절할 이유가 없다.
  - id: req-1475
    status: rejected
    subject: projects
    statement: project 파일을 읽는 기능은 project 폴더 밖을 가리키는 경로와 폴더 밖으로 나가는 symlink를 거절한다.
    acceptance:
      - "`../`로 폴더 밖을 가리키는 경로로 읽거나 찾으면 거절된다."
      - 폴더 밖 파일을 가리키는 symlink로 읽거나 찾으면 거절된다.

  # 등록과 보관

  # 폐기: project를 바꾸는 client는 desktop app뿐이고 agent나 앱에 project를 바꾸는 길이 없다. "사람만"을 검증할 것이 없다. 등록과 변경은 req-1473이 맡는다.
  - id: req-1470
    status: rejected
    subject: projects
    statement: project의 이름, 목적, 폴더, 폴더 설명을 등록하거나 바꾸는 일은 사람만 한다.
    acceptance:
      - 사람은 project를 등록하고 이름, 목적, 폴더, 폴더 설명을 바꿀 수 있다.
      - agent나 앱이 같은 변경을 요청하면 거절된다.

  - id: req-1471
    status: accepted
    subject: projects
    statement: project에는 폴더를 하나 이상 연결하고, 여러 개를 연결할 수 있다.
    acceptance:
      - 두 폴더를 연결한 project에서 두 폴더의 파일이 모두 그 project의 문서다.
      - 폴더 없이 project를 등록하려 하면 거절된다.

  - id: req-1472
    status: accepted
    subject: projects
    statement: 등록한 폴더를 디스크에서 찾을 수 없으면, 사람이 새 위치를 고를 때까지 다른 폴더로 짐작해 잇지 않는다.
    acceptance:
      - 등록한 폴더를 디스크에서 옮기면 그 폴더는 찾을 수 없음으로 보인다.
      - 사람이 새 위치를 고른 뒤에야 그 폴더가 다시 이어진다.

  - id: req-1473
    status: accepted
    subject: projects
    statement: 사람은 project를 등록하고 이름, 목적, 폴더, 폴더 설명을 바꾸고, project를 보관하거나 다시 꺼낼 수 있다. 보관해도 project 폴더의 파일은 그대로다.
    acceptance:
      - 사람이 폴더를 골라 project를 등록하고, 이름, 목적, 폴더, 폴더 설명을 바꿀 수 있다.
      - project를 보관한 뒤에도 그 폴더의 파일이 그대로 있다.
      - 보관한 project를 다시 꺼내면 보관 전과 같이 쓰인다.

  - id: req-1524
    status: accepted
    subject: projects
    statement: 사람은 연결한 폴더 안의 하위 폴더를 따로 지정해 설명을 달 수 있고, 지정한 하위 폴더는 그 폴더 아래에 중첩되어 보인다.
    acceptance:
      - 연결한 폴더 안의 하위 폴더를 지정하고 설명을 달거나 고치거나 지정을 뺄 수 있다.
      - 연결한 폴더 밖의 경로는 하위 폴더로 지정할 수 없다.
      - project 화면에서 지정한 하위 폴더와 설명이 그 폴더 아래에 들여 쓰여 보인다.
      - 그 project에 놓인 agent는 폴더 설명과 함께 하위 폴더의 경로와 설명을 받는다.
      - 하위 폴더를 지정해도 project에 든 파일의 범위는 바뀌지 않는다.

  # 검색

  - id: req-1476
    status: accepted
    subject: projects
    statement: 검색어 검색은 index 없이, 검색할 때 project의 text 파일을 훑어 찾는다.
    acceptance:
      - 검색 직전에 만든 파일의 단어가 바로 찾아진다.
      - 파일을 지우면 바로 결과에서 사라진다.
    related:
      - shell

  - id: req-1477
    status: accepted
    subject: projects
    statement: 훑을 때 `.gitignore`가 뺀 경로와 `.git` 폴더는 건너뛴다.
    acceptance:
      - "`.gitignore`에 적은 폴더와 `.git` 안의 파일에만 있는 단어는 찾아지지 않는다."
      - "`.github` 같은 다른 숨은 폴더의 파일은 찾아진다."

  - id: req-1478
    status: accepted
    subject: projects
    statement: 일치는 대소문자를 가리지 않는 부분 문자열 일치이고, Unicode NFC로 맞춘 뒤 비교한다.
    acceptance:
      - 긴 한국어 단어의 가운데 두 글자로 그 단어가 찾아진다.
      - 영어 단어의 대문자 변형으로 같은 단어가 찾아진다.
      - 자모가 나뉜 입력으로 같은 한국어 단어가 찾아진다.

  - id: req-1479
    status: accepted
    subject: projects
    statement: 결과는 파일 경로, 줄 위치, 일치한 부분이 든 snippet을 주고, 경로 순서 다음 줄 순서로 늘어놓는다.
    acceptance:
      - 결과의 경로와 줄로 파일을 열면 snippet의 일치 부분이 거기 있다.
      - 결과가 경로 순서로, 같은 파일 안에서는 줄 순서로 나온다.

  - id: req-1480
    status: accepted
    subject: projects
    statement: 검색은 한 project를 대상으로 하고 폴더 하나로 좁힐 수 있다.
    acceptance:
      - 폴더 하나로 좁히면 그 폴더 안의 결과만 나온다.

  # 폐기: 입력 중 검색이 화면을 막지 않는 것은 당연한 구현 품질이고, 응답성은 eval 몫이다.
  - id: req-1481
    status: rejected
    subject: projects
    statement: 검색은 다른 일과 화면을 막지 않고, 검색어가 바뀌거나 검색을 닫으면 하던 훑기를 멈춘다.
    acceptance:
      - 큰 project에서 검색어를 연달아 바꿔도 화면이 응답하고, 마지막 검색어의 결과만 남는다.
    related:
      - shell

  # 폐기: VS Code처럼 못 읽은 파일을 따로 알리지 않는다.
  - id: req-1482
    status: rejected
    subject: projects
    statement: 읽지 못해 건너뛴 파일이 있으면 결과와 함께 그 수와 이유를 알린다.
    acceptance:
      - 읽기 권한을 막은 파일에만 있는 단어를 찾으면, 결과는 비고 건너뛴 파일의 수와 이유가 나온다.

  # 폐기: 사람이 자기 파일을 찾는 검색이고, 문서 탭은 같은 파일의 원문을 그대로 보인다.
  - id: req-1483
    status: rejected
    subject: projects
    statement: 검색 결과의 snippet은 내보내기 전에 redaction을 거친다.
    acceptance:
      - secret으로 등록한 값이 든 줄을 찾으면 snippet에서 그 값이 가려진다.
    related:
      - base

  - id: req-1523
    status: accepted
    subject: projects
    statement: "열린 파일이 밖(다른 편집기, git)에서 바뀌면 문서 탭은 다시 읽고, 고치는 중이었으면 충돌을 알리고 사람이 고르게 한다."
    acceptance:
      - "고치지 않은 열린 파일이 밖에서 바뀌면 새 내용이 보인다."
      - "고치는 중인 파일이 밖에서 바뀌면 충돌이 알려지고 사람이 어느 쪽을 남길지 고른다."
    related:
      - shell
