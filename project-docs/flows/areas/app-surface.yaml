area: app-surface
flows:
  # ---- notice: core route (ledger notices 표) ----
  - id: notice-post
    title: 앱이 사람에게 알림 줄을 남긴다
    actor: app
    entries: [route:notices/post]
    boundary: [apps, app-capability, core-api, events]
    code: [packages/core/apps/notices/commands.ts, packages/protocol/apps/notice.ts]
    steps:
      - "앱 process의 notify()는 broker가 live 자식인지, 지금 release의 선언 ∩ grant에 notify.send가 있는지 먼저 본다(broker는 이 entry 밖)"
      - "core는 자격의 app을 등록부에서 찾는다. 없으면 not_found, 보관됐으면 conflict"
      - "같은 (app, key) 줄이 있으면 내용·시각을 바꾸고 안 읽음으로 되돌린다(id 유지). 없으면 새 줄을 쓴다"
      - "휘발 50개, 영구 200개를 넘으면 오래된 것부터 지우고 NoticeClosed를 낸다"
      - "commit 뒤 NoticePosted를 Bus로 낸다(shell main이 toast나 OS 알림으로 띄운다)"
    outcomes:
      - id: posted
        when: "새 줄이거나 같은 key 줄을 바꾼 것(영구 여부와 무관)"
        observe: [ledger:notices, event:NoticePosted, event:NoticeClosed, response]
      - id: not-found
        code: not_found
        when: "자격의 앱이 등록부에 없다"
        observe: [response]
      - id: archived
        code: conflict
        when: "앱이 보관됐다(status가 active가 아니다)"
        observe: [response]
      - id: app-read-failed
        code: internal
        when: "저장된 앱 기록이 깨져 읽지 못했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app 자격이 아니다(route actors가 먼저 막는 것과 별도로 handler가 한 번 더 본다)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "writer나 ledger를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    refs: [A3]
    docs: [architecture/app-notice.md]
    unclear:
      - "broker의 notify.send grant 판정은 app-runtime 소관이라 이 flow의 steps에 한 줄로만 적었다"

  - id: notice-record
    title: core 안 wiring이 program 기록 줄을 notices.record로 남긴다
    actor: system
    entries: [route:notices/record]
    boundary: [apps, core-api, events]
    code: [packages/core/apps/notices/commands.ts, packages/core/apps/notices/program-text.ts, packages/core/main/daemon/wiring/notices.ts]
    steps:
      - "core 안 wiring이 ctx.noticeRecorder로 부른다(machine:notice-recorder 자격, 쓰기 층을 지난다). release·data·runtime command는 자기 tx 안에서 recordProgramNotice를 부르며 이 entry 밖이다"
      - "kind와 app의 짝을 본다. lophn_updated와 sdk_update_needed와 phone_changed는 app이 없어야 하고 나머지는 app이 있어야 한다"
      - "app이 있으면 등록부에서 찾는다. 없으면 not_found"
      - "program-text.ts의 template과 매개변수로 글을 만들어 영구 줄로 쓴다(같은 key면 대신한다)"
      - "commit 뒤 NoticePosted를 낸다. program 줄은 지우지 못한다(trigger)"
    outcomes:
      - id: recorded
        observe: [ledger:notices, event:NoticePosted, response]
      - id: app-mismatch
        code: invalid_input
        when: "kind와 app의 짝이 맞지 않는다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "매개변수의 app이 등록부에 없다"
        observe: [response]
      - id: app-read-failed
        code: internal
        when: "매개변수의 app 기록이 깨져 읽지 못했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "writer나 ledger를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]
    unclear:
      - "release_activated·app_data_migrated·app_unavailable 같은 program 줄을 실제로 쓰는 호출은 app-release·app-runtime의 flow가 맡는다. 그 호출은 자기 tx 안의 recordProgramNotice라 이 route를 거치지 않는다"

  - id: notice-version-observe
    title: 부팅 때 제품 판과 SDK 판을 견줘 판이 바뀌었으면 알린다
    actor: system
    entries: [route:notices/observe_version]
    boundary: [apps, core-api, events]
    code: [packages/core/apps/notices/commands.ts, packages/core/main/daemon/wiring/notices.ts]
    steps:
      - "core가 ready가 된 뒤 notices wiring의 afterReady가 root package.json의 version과 설치 SDK 판을 낸다"
      - "core_meta의 product_version과 sdk_versions 한 줄과 견준다"
      - "판이 다르면 같은 tx에서 marker를 새 판으로 적고 lophn_updated 줄을 쓴다. 새 data root(fresh)면 줄 없이 marker만 적는다"
      - "SDK 목록이 다르면 sdk_versions를 새로 적고 sdks_changed를 돌려준다(줄은 남기지 않는다. SDK 감지는 다른 area)"
      - "productStartListeners를 부른다. listener가 던져도 기동은 이어진다"
    outcomes:
      - id: changed
        when: "판이 바뀌었다. marker가 있고 옛 판과 다르거나, marker가 없는 옛 data root이고 fresh가 아니다(from은 옛 판, 모르면 unknown)"
        observe: [ledger:core_meta, ledger:notices, event:NoticePosted, response]
      - id: unchanged
        when: "같은 판이거나 새 data root다. sdks_changed가 true일 수 있다"
        observe: [ledger:core_meta, response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니다"
        observe: [response]
      - id: version-check-failed
        when: "root package.json의 판을 읽지 못했거나(internal) observe_version이 실패했다(unavailable 등). 판은 견주지 않고 기동은 이어진다"
        observe: [log:notices]
      - id: listener-failed
        when: "productStartListener가 던졌다. 다음 listener를 부르고 기동은 이어진다"
        observe: [log:notices]
      - id: unavailable
        code: unavailable
        when: "writer나 ledger를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]
    unclear:
      - "옛 data root(판 marker 없음)의 from은 unknown 문자열이다. 이 값을 sdk 감지가 읽는지는 다른 area 소관"
      - "lophn_updated를 쓰는 recordProgramNotice의 거절(invalid_input·not_found)은 앱 없는 kind라 여기서 나지 않아 outcome으로 세지 않았다"

  - id: notice-read
    title: 사람이 History에서 알림 기록을 거르고 찾는다
    actor: person
    entries: [route:notices/list]
    boundary: [apps, core-api]
    code: [packages/core/apps/notices/reads.ts, packages/core/apps/notices/store.ts]
    steps:
      - "History 탭을 열거나 필터·검색·더 보기를 누르면 renderer가 notices.list를 부른다. 필터는 source·app·project·kind·persistent·unread·query·since·until이다"
      - "필터를 where로 붙여 최근 것부터 limit+1개를 읽는다. next_cursor는 (created_at, id)를 base64 JSON으로 준다"
      - "cursor를 해석하지 못하면 invalid_input이다"
      - "app_name은 읽을 때 apps 표에서 푼다"
    outcomes:
      - id: ok
        when: "필터된 한 page와 next_cursor"
        observe: [response, screen:inbox-history, screen:inbox-history-search, screen:inbox-history-period]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor를 해석하지 못한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "reader를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]

  - id: inbox-open
    title: Inbox가 지금 보이는 안 읽은 줄 전부를 읽는다
    actor: shell
    entries: [route:notices/open]
    boundary: [apps, core-api]
    code: [packages/core/apps/notices/reads.ts, packages/core/apps/notices/store.ts, packages/shell/renderer/desktop/connection/waiting/]
    steps:
      - "renderer가 ready 뒤에 Inbox를 맞추려고 notices.open을 부른다. 사람이 누른 것이 아니라 renderer가 스스로 부른다"
      - "안 읽은 줄 전부를 오래된 것부터 돌려준다. 보관한 앱(status가 active가 아닌)의 줄은 뺀다"
      - "app_name은 읽을 때 apps 표에서 푼다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "reader를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]
    unclear:
      - "Inbox의 Now 탭 목록을 다시 읽는 자리가 여기 말고 renderer에 더 있는지는 확인하지 못했다"

  - id: notice-dismiss
    title: 사람이 알림 줄을 지운다(휘발) 또는 읽음으로 바꾼다(영구)
    actor: person
    entries: [route:notices/dismiss]
    boundary: [apps, core-api, events]
    code: [packages/core/apps/notices/commands.ts]
    steps:
      - "사람 자격만 받는다. handler가 한 번 더 본다"
      - "줄을 찾는다. 없으면 not_found"
      - "휘발 줄이면 행을 지우고 NoticeClosed를 낸다"
      - "영구 줄이면 안 읽은 것만 read_at을 채우고 NoticeRead를 낸다. program 줄도 영구라 지우지 않고 읽음만 된다"
    outcomes:
      - id: removed
        when: "휘발 줄"
        observe: [ledger:notices, event:NoticeClosed, response]
      - id: marked-read
        when: "영구 줄이 안 읽음이었다"
        observe: [ledger:notices, event:NoticeRead, response]
      - id: already-read
        when: "영구 줄이 이미 읽음이다. 아무것도 바뀌지 않는다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "줄 id가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "user 자격이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "writer나 ledger를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]

  - id: notice-mark-read
    title: 영구 알림 줄을 한꺼번에 읽음으로 바꾼다
    actor: person
    entries: [route:notices/mark_read]
    boundary: [apps, core-api, events]
    code: [packages/core/apps/notices/commands.ts]
    steps:
      - "사람 자격만 받는다"
      - "같은 id는 한 번만 본다. 휘발 줄, 이미 읽은 줄, 없는 id는 건너뛴다(오류가 아니다)"
      - "남은 줄의 read_at을 같은 시각으로 채우고 줄마다 NoticeRead를 낸다"
      - "바뀐 줄 수를 marked로 돌려준다"
    outcomes:
      - id: marked
        when: "바뀐 줄이 0개여도 ok다"
        observe: [ledger:notices, event:NoticeRead, response]
      - id: forbidden
        code: forbidden
        when: "user 자격이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "writer나 ledger를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]

  # ---- tray: core route (메모리 값, 저장하지 않는다) ----
  - id: tray-set
    title: 앱이 자기 tray 값(짧은 글과 tone)을 바꾸거나 지운다
    actor: app
    entries: [route:app_tray/set]
    boundary: [apps, app-capability, core-api, events]
    code: [packages/core/apps/tray/handlers.ts, packages/protocol/apps/tray.ts]
    steps:
      - "앱 process의 setTray·clearTray는 broker가 notify.send grant와 live 자식을 먼저 본다(broker는 이 entry 밖)"
      - "core가 자격의 app을 본다. 없으면 not_found, 보관됐으면 conflict"
      - "text가 null이면 그 앱의 값을 지우고, 아니면 text·tone(기본 neutral)·시각으로 바꾼다. 메모리에만 둔다"
      - "값이 바뀌었으니 route의 changes대로 StateChanged(tray)가 난다(지우기도 난다)"
    outcomes:
      - id: set
        observe: [event:StateChanged, response]
      - id: cleared
        when: "text가 null이라 그 앱의 값을 지웠다"
        observe: [event:StateChanged, response]
      - id: not-found
        code: not_found
        when: "자격의 앱이 등록부에 없다"
        observe: [response]
      - id: archived
        code: conflict
        when: "앱이 보관됐다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app 자격이 아니다"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]
    unclear:
      - "tray 값을 core 재기동 때 비우는 것은 의도다(저장하지 않는다). 앱 process가 다시 낸다"

  - id: tray-read
    title: 설치된 앱들의 tray 값 목록을 읽는다
    actor: shell
    entries: [route:app_tray/list]
    boundary: [apps, core-api]
    code: [packages/core/apps/tray/handlers.ts, packages/shell/renderer/shell/tray/use-tray-values.ts]
    steps:
      - "메모리의 앱별 마지막 값을 모아 돌려준다"
      - "보관됐거나 없는 앱의 값은 이 읽기가 메모리에서 지운다(읽기의 부수효과)"
      - "renderer TrayHost가 설치된 앱의 tray 화면 항목에 글과 tone을 붙인다. 설정 shell.tray_off로 뺀 것은 빼고 shell.tray_order로 정렬한다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    docs: [architecture/app-notice.md]
    unclear:
      - "app_tray/list가 선언한 unavailable은 handler가 내지 않는다. 메모리 Map을 읽을 뿐 ledger·reader를 거치지 않는다(선언을 고칠 곳)"
      - "shell.tray_off와 shell.tray_order를 쓰는 설정 route는 models(config) area의 entry다. 이 flow는 읽기만 본다"
      - "renderer가 StateChanged(tray)와 ready에서 스스로 읽으므로 사람 click이 아니라 actor를 shell로 두었다. pre는 AND라 값이 있어야 하는 게 아니어서 뺐다"

  # ---- widgets: core route (메모리 값, 저장하지 않는다) ----
  - id: widget-set
    title: 앱이 자기 위젯 하나의 값(정해진 node 넷으로 된 data)을 바꾸거나 지운다
    actor: app
    entries: [route:app_widget/set]
    boundary: [apps, app-capability, core-api, events]
    code: [packages/core/apps/widgets/handlers.ts, packages/protocol/apps/widget.ts]
    steps:
      - "앱 process의 setWidget·clearWidget은 broker가 notify.send grant와 live 자식을 먼저 본다(broker는 이 entry 밖)"
      - "입력은 위젯 key와 값(또는 null)이다. 값은 widgetValueSchema가 4 KiB, node kind, 글 길이, progress 범위, rows·items 수를 먼저 검사한다"
      - "core가 자격의 app을 본다. 없으면 not_found, 보관됐으면 conflict. key가 그 앱의 active release 선언 widgets에 없으면 invalid_input"
      - "값이 null이면 그 앱의 그 위젯 값을 지우고, 아니면 값과 시각으로 (앱, key)의 마지막 값을 바꾼다. 메모리에만 둔다"
      - "값이 바뀌었으니 route의 changes대로 StateChanged(widgets)가 난다(지우기도 난다)"
    outcomes:
      - id: set
        observe: [event:StateChanged, response]
      - id: cleared
        when: "value가 null이라 그 앱의 그 위젯 값을 지웠다"
        observe: [event:StateChanged, response]
      - id: not-found
        code: not_found
        when: "자격의 앱이 등록부에 없다"
        observe: [response]
      - id: archived
        code: conflict
        when: "앱이 보관됐다"
        observe: [response]
      - id: undeclared
        code: invalid_input
        when: "key가 active release 선언의 widgets에 없다, 또는 active release가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app 자격이 아니다"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-notice.md]
    unclear:
      - "값을 core 재기동 때 비우는 것은 의도다(저장하지 않는다). 앱 process가 다시 낸다"

  - id: widget-read
    title: 설치된 앱들이 선언한 위젯과 값의 목록을 읽는다
    actor: person
    entries: [route:app_widgets/list]
    boundary: [apps, core-api]
    code: [packages/core/apps/widgets/handlers.ts, packages/protocol/apps/widget.ts]
    steps:
      - "active 앱의 active release가 선언한 위젯마다 한 줄이다(app, app_name, key, label, screen, value, at). 값이 아직 없으면 value와 at이 null이다"
      - "보관됐거나 없는 앱의 값과 선언에서 빠진 key의 값은 이 읽기가 메모리에서 지운다(읽기의 부수효과)"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: false
    declared_only: [unauthorized, unavailable]
    docs: [architecture/app-notice.md]
    unclear:
      - "app_widgets/list가 선언한 unavailable은 handler가 내지 않는다. 메모리 Map과 등록부·선언 읽기뿐이라 ledger reader를 거치지 않는다(선언을 고칠 곳)"

  - id: phone-request
    title: 앱 backend가 core를 거쳐 사람의 기준 폰에 기능 하나를 묻는다
    actor: app
    entries: [route:app_phone/request]
    boundary: [apps, core-api]
    code: [packages/core/apps/phone-request/handler.ts, packages/protocol/apps/phone-request.ts, packages/core/remote/phone-link.ts]
    steps:
      - "broker가 선언과 grant(phone.use, 범위 capability)를 본 뒤 앱 자식 credential로 부른다(broker는 이 entry 밖)"
      - "core가 자격의 app을 본다. app 자격이 아니면 forbidden, 앱이 없으면 not_found, 보관됐으면 conflict"
      - "input이 capability의 PHONE_KINDS 입력 schema에 맞지 않으면 invalid_input"
      - "기준 폰(devices.is_primary)을 찾는다. 없으면 unavailable(no_phone)"
      - "PhoneLink.call로 그 기기에 kind와 입력, kind의 deadline을 보낸다. 폰의 오류(unavailable의 이유, forbidden의 os_permission_denied)는 그대로 돌려준다"
      - "답이 kind의 출력 schema에 맞으면 {value}, 아니면 unavailable이다. banner와 기록은 없다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app 자격이 아니다, 이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch), 또는 폰이 OS 권한을 거절했다(reason os_permission_denied)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "자격의 앱이 등록부에 없다"
        observe: [response]
      - id: archived
        code: conflict
        when: "앱이 보관됐다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "input이 그 capability의 입력 schema에 맞지 않는다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "기준 폰이 없다(no_phone), 폰에 닿지 못했거나 답하지 않았다(phone_unreachable, unsupported, phone_in_background, location_off, timeout), 기기 목록을 읽지 못했다, 또는 폰의 답이 출력 schema에 맞지 않는다"
        observe: [response]
    crosses_process: true
    docs: [architecture/remote.md]

  # ---- annotation: core route ----
  - id: annotation-persist
    title: 사람이 보낸 annotation 묶음을 저장한다(send 파이프라인이 core 안에서 부른다)
    actor: system
    entries: [route:annotations/persist]
    boundary: [apps, core-api, storage]
    code: [packages/core/apps/annotations/commands.ts, packages/core/apps/annotations/schema.ts]
    steps:
      - "사람 자격만 받는다(agent·app이면 forbidden)"
      - "app target이면 앱을 찾는다. 없으면 not_found, 보관됐으면 conflict로 거절하고 아무것도 쓰지 않는다"
      - "artifact의 그릇과 file의 project는 여기서 검사하지 않는다(전달 단계가 본다)"
      - "annotation_batches에 묶음 한 줄, annotations에 annotation마다 한 줄을 쓴다(preview view에서 온 것은 release 대신 preview_bundle 칸을 채운다). screenshot이 있으면 blob 영구 참조를 등록한다"
      - "묶음 id와 annotation id 목록을 돌려준다. 앱 기록 읽기나 blob 참조 등록이 실패하면 쓴 것을 되돌리고 그 code를 돌려준다"
    outcomes:
      - id: saved
        observe: [ledger:annotation_batches, ledger:annotations, ledger:blob_refs, response]
      - id: not-found
        code: not_found
        when: "app target의 앱이 없다"
        observe: [response]
      - id: archived
        code: conflict
        when: "보관한 앱이다(아무것도 쓰지 않는다)"
        observe: [response]
      - id: failed
        when: "앱 기록 읽기나 blob 영구 참조 등록이 실패했다(그 code를 그대로 돌려주고 쓴 것은 되돌린다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격이 아니다"
        observe: [response]
    crosses_process: false
    docs: [architecture/annotation.md]

  - id: annotation-discard
    title: 저장한 annotation 묶음을 지운다(send가 전달 실패 때 부르고 사람 자격 호출도 받는다)
    actor: system
    entries: [route:annotations/discard]
    boundary: [apps, core-api, storage]
    code: [packages/core/apps/annotations/commands.ts, packages/core/apps/annotations/retention.ts]
    steps:
      - "사람 자격만 받는다"
      - "묶음의 annotation들을 찾아 screenshot blob 영구 참조와 ref, annotation 행을 지운다"
      - "비게 된 묶음 행도 지운다"
    outcomes:
      - id: discarded
        when: "없는 묶음이어도 ok다"
        observe: [ledger:annotations, ledger:annotation_batches, ledger:annotation_refs, response]
      - id: erase-failed
        when: "blob 영구 참조 지우기가 실패했다(그 code를 그대로 돌려주고 되돌린다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격이 아니다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/annotation.md]
    unclear:
      - "blob 객체 파일을 실제로 지우는지(eraseBlobRefs의 뒤)는 storage 소관이라 observe에 넣지 않았다"

  - id: annotation-add-refs
    title: annotation이 session 메시지에 전달됐다는 ref를 붙인다(send가 core 안에서 부른다)
    actor: system
    entries: [route:annotations/add_refs]
    boundary: [apps, core-api]
    code: [packages/core/apps/annotations/commands.ts, packages/core/apps/annotations/retention.ts]
    steps:
      - "사람 자격만 받는다"
      - "annotation id마다 있는지 본다. 하나라도 없으면 not_found(앞에서 넣은 ref도 함께 되돌린다)"
      - "(annotation, session_message, 메시지 id) ref를 넣는다. 이미 있으면 무시한다"
    outcomes:
      - id: referenced
        observe: [ledger:annotation_refs, response]
      - id: not-found
        code: not_found
        when: "annotation id가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격이 아니다"
        observe: [response]
    crosses_process: false
    docs: [architecture/annotation.md]

  - id: annotation-screenshot-upload
    title: annotation의 screenshot 이미지를 core의 blob 준비로 올린다
    actor: person
    entries: [route:annotations/upload_screenshot]
    boundary: [apps, core-api, storage]
    code: [packages/core/apps/annotations/upload.ts, packages/protocol/apps/annotation.ts]
    steps:
      - "shell main이 screenshot PNG 바이트와 sha256 hash, 바이트 수를 올린다"
      - "입력 schema가 맞고 입력과 본문 크기가 맞고 2MB 이하인지 본다. 아니면 본문을 버리고 invalid_input"
      - "blob 준비 중계로 흘려 보낸다. purpose는 annotation_screenshot으로 core가 정한다"
      - "준비된 blob 참조를 돌려준다. 이어지는 annotations.send가 영구 참조로 바꾼다"
    outcomes:
      - id: prepared
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema에 맞지 않거나, 입력이 본문과 맞지 않거나 크기 상한을 넘었다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "blob 준비 중계가 아직 붙지 않았다"
        observe: [response]
      - id: relay-rejected
        when: "준비 중계가 거절했다(hash가 맞지 않는 것 등. 그 code를 그대로 돌려준다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/annotation.md]
    unclear:
      - "준비 중인 blob의 disk 위치는 storage 소관이라 observe에 넣지 않았다"

  - id: annotation-send
    title: 사람이 고른 annotation 묶음을 저장하고 받는 agent session에 메시지로 보낸다
    actor: person
    entries: [route:annotations/send]
    uses: [route:annotations/persist, route:annotations/add_refs, route:annotations/discard]
    boundary: [apps, core-api, router, storage]
    code: [packages/core/apps/annotations/send.ts, packages/core/apps/annotations/message.ts, packages/core/main/daemon/wiring/router.ts, packages/core/main/daemon/wiring/annotations.ts]
    steps:
      - "입력을 본다. n은 1..N 순서, agent는 app target만, app target이면 annotation마다 screen과, release나 preview_bundle(preview view의 bundle hash) 가운데 하나가 있고 아니면 셋 다 null이다. 아니면 invalid_input"
      - "전달 포트(Router)가 아직 없으면 unavailable로 끝난다(아무것도 쓰지 않는다)"
      - "묶음을 저장한다(annotation-persist). 보관한 앱이면 conflict로 여기서 끝난다"
      - "받는 쪽을 고른다. app은 고른 agent(없으면 lophn)의 그 앱 workspace, artifact는 마지막으로 쓴 session 또는 그 그릇의 lophn, file은 그 project의 lophn이다"
      - "session이 지정됐으면 받는 쪽의 열린 session인지 본다(아니면 conflict). null이면 새 session을 연다. 사람 메시지 하나를 next_turn으로 넣고 annotation을 refs로 가리킨다"
      - "넣기가 실패하면 방금 저장한 묶음을 지우고(annotation-discard) 그 code를 돌려준다. 성공하면 메시지에 ref를 붙인다(annotation-add-refs). ref 붙이기가 실패하면 묶음은 남기고 그 code를 돌려준다"
      - "본문은 번호 순서로 이어 붙이고 screenshot 줄은 image.read path를 적는다. preview view에서 보낸 annotation은 Preview 줄(bundle hash, fixture data)과 tag의 preview 칸이 선다. 본문의 lophn- tag는 escape한다"
    outcomes:
      - id: delivered
        observe: [ledger:annotation_batches, ledger:annotations, ledger:annotation_refs, event:MessageReceived, response]
      - id: invalid-input
        code: invalid_input
        when: "입력 검사에 걸렸다(n 순서, agent를 app이 아닌 target에 줌, release 또는 preview_bundle과 screen의 짝, schema 밖 값)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격이 아니다(route actors가 먼저 막고, persist가 한 번 더 본다)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "app target의 앱이 없다(저장 전에 거절), 또는 artifact 그릇·file project를 찾지 못했거나 보관됐다(묶음은 지운다)"
        observe: [ledger:annotation_batches, ledger:annotations, response]
      - id: archived
        code: conflict
        when: "보관한 앱이라 저장 전에 거절한다(아무것도 쓰지 않는다)"
        observe: [response]
      - id: session-not-open
        code: conflict
        when: "지정한 session이 받는 쪽의 열린 session이 아니다(묶음은 지운다)"
        observe: [ledger:annotation_batches, ledger:annotations, response]
      - id: persist-failed
        when: "묶음 저장이 그 밖의 이유로 실패했다(앱 기록 읽기, blob 영구 참조 등록. 그 code를 그대로 돌려주고 아무것도 남기지 않는다)"
        observe: [response]
      - id: delivery-failed
        when: "전달 중 실패(session 열기, 메시지 넣기, ledger 읽기)가 났다(묶음은 지우고 그 code를 그대로 돌려준다)"
        observe: [ledger:annotation_batches, ledger:annotations, response]
      - id: refs-failed
        when: "메시지는 넣었는데 ref를 붙이지 못했다(묶음은 남고 그 code를 그대로 돌려준다)"
        observe: [ledger:annotation_batches, ledger:annotations, event:MessageReceived, response]
      - id: unavailable
        code: unavailable
        when: "annotation delivery 포트가 붙지 않았다(저장 전에 거절)"
        observe: [response]
    crosses_process: false
    risk: [data-loss, sandbox]
    refs: [A3]
    docs: [architecture/annotation.md]
    unclear:
      - "사람 메시지가 Bus에 나가는 event는 sessions 소관이다. MessageReceived는 추정이라 확인이 필요하다"
      - "보내기는 Gate를 거치지 않는다(설계). 권한 판정이 없다는 뜻이라 permission risk는 붙이지 않았다"
      - "사람이 누른 보내기를 shell main이 이 route로 옮긴다. 사람 click의 결과라 actor를 person으로 두었다(README: 사람이 눌러 부르는 route)"
      - "전달이 core 안(Router, session 명령)에서 끝나 crosses_process를 false로 두었다. agent runtime이 turn을 나중에 가져가는 것은 이 flow의 끝이 아니다"

  - id: annotation-get
    title: 받은 agent가 annotation과 screenshot 경로를 읽는다
    actor: agent
    entries: [route:annotations/get]
    pre: [annotation-send:delivered]
    boundary: [apps, agent-tools]
    code: [packages/core/apps/annotations/reads.ts, packages/core/apps/annotations/store.ts, packages/core/lophn-agent/tools/file/image.ts]
    steps:
      - "image.read가 path \"annotation:<id>\"를 받으면 이 입구로 annotation과 묶음을 읽는다"
      - "자격의 범위를 본다. 앱 조건(앱 workspace session)이면 앱 target과 앱 그릇 artifact만, project 조건이면 file target과 project 그릇 artifact만 본다. 조건이 둘 다 없으면 forbidden이다(home session). 사람과 machine은 범위 검사가 없다"
      - "범위 밖이거나 없으면 not_found다(없는 것과 같다)"
      - "맞으면 screenshot_path(blob 객체 파일 경로)를 붙여 돌려준다. image.read가 그 파일을 tool_result_image로 싣는다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not-found
        code: not_found
        when: "annotation이나 묶음이 없거나 자격의 범위 밖이다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격에 앱도 project도 없다(home session)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "reader를 쓸 수 없다(dispatch)"
        observe: [response]
    crosses_process: false
    refs: [A3]
    docs: [architecture/annotation.md]

  - id: annotation-sweep
    title: 보낸 지 1시간이 지나도 메시지가 가리키지 않는 annotation을 지운다
    actor: system
    entries: [route:annotations/sweep]
    boundary: [apps, storage]
    code: [packages/core/apps/annotations/retention.ts, packages/core/main/daemon/wiring/annotations.ts]
    steps:
      - "annotations wiring의 start가 기동 때 한 번, 그 뒤 하루에 한 번 machine 자격으로 부른다"
      - "보낸 지 1시간이 지난 묶음의 annotation 가운데 annotation_refs가 하나도 없는 것을 고른다"
      - "그 annotation의 screenshot 영구 참조와 행을 지우고, 비게 된 묶음을 지운다"
      - "지운 개수를 돌려준다. 지우기가 실패하면 그 code를 돌려주고, wiring이 telemetry에 sweep_failed를 남긴다"
    outcomes:
      - id: swept
        when: "지운 개수를 돌려준다(지울 것이 없어도 ok, 0개)"
        observe: [ledger:annotations, ledger:annotation_batches, ledger:annotation_refs, response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니다"
        observe: [response]
      - id: erase-failed
        when: "blob 영구 참조 지우기가 실패했다(되돌리고 sweep_failed를 남긴다)"
        observe: [response, log:annotations sweep_failed]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/annotation.md]
    unclear:
      - "기동 때의 sweep은 start 안에서 바로 부른다. 1시간 유예는 방금 보낸 묶음이 ref 붙기 전에 지워지지 않게 하려는 것이다"

  # ---- system: event와 기동이 시작하는 것 ----
  - id: notice-alert
    title: 새 알림 줄을 toast나 OS 알림으로 띄운다
    actor: system
    entries: [system:notice-alert]
    boundary: [shell, events]
    code: [packages/shell/main/desktop/wiring/notice.ts, packages/shell/main/notice/rule.ts]
    steps:
      - "relay가 NoticePosted를 Gateway로 받는다"
      - "읽음 표시(read_at)가 있는 줄은 버린다"
      - "program 줄은 protocol의 ALERT_PROGRAM_KINDS(release_failed·release_rolled_back·app_unavailable·app_data_restored·sdk_update_needed·session_stopped_by_app·phone_changed·app_sync_away. 폰 push와 같은 목록)만 띄운다. 나머지(켜짐, migration 적용, lophn 업데이트)는 Inbox에만 남는다"
      - "core 기동 중에 쓰여 Gateway가 붙기 전에 지나간 줄은 event로 오지 않는다. 그래서 relay가 ready가 될 때마다 notices.open을 읽어 안 읽은 sdk_update_needed·app_unavailable 줄을 같은 길로 띄운다. 한 shell 실행 안에서 같은 행(id와 시각)은 한 번만 띄운다(안 읽은 채 두면 shell을 다시 켤 때 다시 뜬다)"
      - "routeNotice: 보고 있으면 없음, focus를 가진 lophn 창이 있으면 toast, 없으면 OS 알림이다. 앱 줄과 Inbox 목표는 보고 있다고 보지 않는다"
      - "누르면 앱 공간(app)이나 Inbox(inbox)를 연다(notice-reveal)"
    outcomes:
      - id: toast
        observe: [screen:new-waiting-toasts, event:NoticePosted]
      - id: os-notification
        when: "focus를 가진 lophn 창이 없다(detached 창만 있는 경우 포함). headless이거나 OS 알림을 지원하지 않으면 실제로는 띄우지 않는다"
        observe: [event:NoticePosted]
      - id: skipped
        when: "읽음 표시가 있거나 띄우는 목록에 없는 program 줄이다"
        observe: [screen:new-waiting-toasts]
    crosses_process: true
    docs: [architecture/app-notice.md]
    unclear:
      - "OS 알림의 observe를 어느 frame으로 둘지 정하지 못했다(OS 밖이라 event만 둔다)"

  - id: phone-changed-notice
    title: 기준 폰이 바뀌면 폰 화면이 있는 앱 수를 한 줄로 알린다
    actor: system
    entries: [system:phone-changed-notice]
    uses: [route:notices/record]
    boundary: [apps, events]
    code: [packages/core/apps/phone/changed.ts, packages/core/main/daemon/wiring/apps.ts]
    steps:
      - "core가 켜질 때 기준 기기(devices의 is_primary) id를 메모리에 적고 Bus의 StateChanged를 구독한다"
      - "remote_devices가 든 StateChanged마다 기준 id를 다시 읽어 마지막으로 본 id와 견준다. 이름 바꾸기와 연결 시각 갱신은 id가 같아 알리지 않는다"
      - "id가 바뀌었고 새 기준이 있으면(없던 기기에서 처음 생김, 지운 뒤 다른 기기가 기준이 됨 포함) 폰 화면(places에 phone)을 가진 활성 앱 수를 센다"
      - "수가 1 이상이면 ctx.noticeRecorder로 phone_changed 줄(앱 없음, key phone_changed)을 남긴다. 다시 그리지는 않는다"
    outcomes:
      - id: noticed
        when: "기준 폰이 바뀌었고 폰 화면이 있는 앱이 하나 이상이다"
        observe: [ledger:notices, event:NoticePosted]
      - id: not-noticed
        when: "기준 id가 그대로이거나 기준이 없어졌거나 폰 화면이 있는 앱이 없다"
        observe: [ledger:notices]
      - id: record-failed
        when: "notices.record가 실패했다. core는 멈추지 않고 log만 남긴다"
        observe: [log:apps/phone phone_changed_notice_failed]
    crosses_process: false
    docs: [architecture/app-notice.md]
    unclear:
      - "마지막으로 본 id는 메모리에만 둔다. core가 꺼진 사이의 기준 변경은 알리지 못하지만 pairing은 core가 켜져 있어야 한다"

  - id: session-notice
    title: lophn session의 끝과 사람의 물음을 알린다
    actor: system
    entries: [system:session-notice]
    boundary: [shell, agent-sessions]
    code: [packages/shell/main/notice/rule.ts, packages/shell/main/desktop/wiring/notice.ts]
    steps:
      - "relay가 TurnStarted·TurnEnded·TurnRequestOpened·QuestionAsked·SessionEnded를 session마다 순서대로 건넨다"
      - "TurnEnded는 outcome이 completed면 finished, failed면 failed다. 그 밖은 알리지 않는다. 앱 화면이 연 session의 turn 끝도 알리지 않는다"
      - "TurnRequestOpened와 QuestionAsked는 permission이다. 팀 자식의 것은 부모가 풀므로 알리지 않는다"
      - "사람이 그 session을 보고 있으면 알리지 않는다. 아니면 toast나 OS 알림을 띄운다. 못 본 표시(unseen)는 core가 든다. 읽기나 알림이 던지면 그 event는 버린다"
    outcomes:
      - id: notified
        when: "focus 창에 toast를 보냈다"
        observe: [screen:new-waiting-toasts]
      - id: os-notified
        when: "focus를 가진 toast 가능한 창이 없어 OS 알림을 띄웠다(headless이거나 OS 알림을 지원하지 않으면 실제로는 안 뜬다)"
        observe: []
      - id: looking
        when: "사람이 그 session을 focus 창에서 보고 있다(알리지 않는다)"
        observe: [screen:new-waiting-toasts]
      - id: app-session
        when: "앱 화면이 연 session의 turn 끝이다(완료·실패만 거른다. 승인·질문은 알린다)"
        observe: [screen:new-waiting-toasts]
      - id: to-parent
        when: "팀 자식의 요청이나 물음이다"
        observe: [screen:new-waiting-toasts]
      - id: unknown-session
        when: "session의 agent를 읽지 못했다(알림 없이 끝난다)"
        observe: [screen:new-waiting-toasts]
      - id: turn-other
        when: "TurnEnded인데 outcome이 completed도 failed도 아니다(사람이 끊은 turn 등)"
        observe: [screen:new-waiting-toasts]
      - id: dropped-error
        when: "session 이름·본문 읽기나 알림이 던졌다. 그 event는 버리고 다음 event를 처리한다"
        observe: []
    crosses_process: true
    docs: [architecture/event.md]
    unclear:
      - "OS 알림은 frame도 event도 없어 os-notified의 observe를 비웠다"

  - id: app-view-crash
    title: 깨진 앱 화면(render process가 사라지거나 멈춤)을 표시한다
    actor: system
    entries: [system:app-view-crash]
    boundary: [shell, app-runtime]
    code: [packages/shell/main/app-frame/electron-app-frame.ts, packages/shell/main/app-frame/crash.ts, packages/shell/main/app-frame/registry.ts]
    steps:
      - "webContents의 render-process-gone이면 view 상태를 crashed로, unresponsive면 unresponsive로 바꾼다"
      - "responsive 신호는 unresponsive를 ok로 되돌린다. crashed는 새 view를 열 때까지 그대로다(늦은 신호로 되살리지 않는다)"
      - "상태를 그 창의 shell 크롬에 알린다. main은 깨진 view를 스스로 다시 load하지 않는다. 사람이 [새 view 열기]를 누른다(app-view-reopen)"
    outcomes:
      - id: crashed
        observe: [screen:app-space]
      - id: unresponsive
        observe: [screen:app-space]
      - id: recovered
        when: "unresponsive였던 view가 responsive 신호를 보냈다"
        observe: [screen:app-space]
      - id: unchanged
        when: "이미 같은 상태이거나, crashed인 view에 늦은 responsive·unresponsive 신호가 왔다. 알리지 않는다"
        observe: []
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-view-refresh
    title: 앱 release가 바뀌면 열린 앱 화면을 다시 붙인다
    actor: system
    entries: [system:app-view-refresh]
    boundary: [shell, apps]
    uses: [route:app_views/open, system:view-table-events]
    code: [packages/shell/main/app-frame/registry.ts, packages/shell/main/app-frame/binding.ts, packages/shell/main/desktop/wiring/app-views.ts, packages/core/apps/views/table.ts]
    steps:
      - "core의 view 표가 release 채택이나 되돌리기(AppViewChanged) 뒤 그 앱의 view를 다시 묶고 view마다 AppViewEvent rebound나 lost를 낸다(view-table-events)"
      - "shell main이 그 view를 처음 연 요청으로 app_views/open을 다시 보내(resume) 지금 binding을 받고 grant host를 다시 읽는다. card가 아닌 live view는 release를 비워 보내 core가 view를 잃었어도 지금 도는 release로 열리고, card와 preview는 처음 release 그대로다(card는 만든 때 release에 고정)"
      - "core에 다시 붙었을 때(core가 다시 떴으면 표가 비어 있다)와 core가 그 view를 모른다고 답한 operation 호출 뒤에도 같은 resume을 한다"
      - "다른 기계의 view는 shell main의 구독자 app-views가 기계마다 건 AppViewEvent로 같은 일을 하고, 그 기계에 다시 붙으면(watcher 없는 ready. link가 끊기면 그 기계가 이 컴퓨터의 view를 닫았다) 그 기계의 view를 같은 요청으로 다시 연다"
      - "연결이 같으면 running으로 둔다. 바뀌었으면 새 process에 다시 붙이고(remount) 상태를 창에 민다"
      - "다시 묶지 못하면(card의 release가 바뀌어 conflict가 나는 것도 포함) unavailable로 둔다"
    outcomes:
      - id: same-connection
        observe: [screen:app-space]
      - id: remounted
        observe: [screen:app-space]
      - id: unavailable
        code: unavailable
        when: "다시 묶지 못했다(앱 process가 없거나 기록을 읽지 못함, card의 release가 바뀌어 맞지 않음, grant host를 읽지 못함)"
        observe: [screen:app-space]
    crosses_process: true
    docs: [architecture/activation.md, architecture/app-call.md]

  # ---- ui: 사람의 화면 조작 가운데 main·core로 건너가는 것 ----
  - id: annotate-pick
    title: annotate mode에서 사람이 앱 화면의 요소나 영역을 고른다
    actor: person
    entries: [ui:annotate-pick]
    boundary: [shell]
    code: [packages/shell/main/app-frame/annotate.ts, packages/shell/preload/annotate-api.ts, packages/shell/renderer/app-frame/annotate/]
    steps:
      - "preload가 클릭과 끌기를 가로채 요소나 영역을 고르고, closed shadow 층에 윤곽과 번호와 메모를 그린다"
      - "고른 목록 전체를 annotate:items로 main에 보낸다. 페이지는 자기 앱을 모르므로 신원은 main이 sender view로 정한다"
      - "main은 새 번호에만 그 view의 release를 적어 두고 목록을 renderer에 push한다(shell:annotate-state)"
      - "보내는 중이거나 main frame이 아니거나 살아 있는 view가 아니거나 목록 모양이 맞지 않으면 버린다"
    outcomes:
      - id: picked
        observe: [screen:new-app-annotate-list]
      - id: ignored
        when: "보내는 중이거나 main frame이 아니거나 살아 있는 view가 아니거나 목록 모양이 맞지 않는다(목록은 그대로다)"
        observe: [screen:new-app-annotate-list]
    crosses_process: true
    docs: [architecture/annotation.md]

  - id: notice-action
    title: 알림 줄의 action 단추로 home lophn에게 일을 시킨다
    actor: person
    entries: [ui:notice-action]
    uses: [route:sessions/open, route:acp/send, route:notices/mark_read]
    boundary: [shell, apps, agent-sessions]
    code: [packages/shell/renderer/desktop/connection/waiting/notice-action.ts]
    steps:
      - "Inbox 줄의 action 단추(open_home_skill)를 누른다. 단추는 action의 kind로만 그린다"
      - "home lophn의 새 대화를 sessions.open으로 연다. 실패하면 거기서 끝난다"
      - "첫 사람 말로 /<skill> <args>를 acp.send로 보낸다(Agent 탭의 첫 말과 같은 source). 실패하면 대화는 열린 채 남고 끝난다"
      - "그 대화를 열고 줄을 notices.mark_read로 읽음으로 바꾼다(줄이 안 읽음일 때만)"
    outcomes:
      - id: sent
        when: "대화를 열고 첫 말을 보냈다. 줄이 안 읽음이었으면 읽음으로 바꾼다"
        observe: [event:SessionStarted, event:NoticeRead]
      - id: open-failed
        when: "새 대화 열기(sessions.open)가 실패했다. 아무것도 보내지 않고 줄은 그대로다"
        observe: []
      - id: send-failed
        when: "대화는 열렸지만 첫 말 보내기(acp.send)가 실패했다. 빈 대화가 남고 대화를 열지 않으며 줄은 그대로다"
        observe: [event:SessionStarted]
    crosses_process: true
    docs: [architecture/app-notice.md]
    unclear:
      - "open-failed와 send-failed는 renderer가 false를 돌려줄 뿐 화면에 남는 표시가 정해져 있지 않아 observe를 비웠다(send-failed는 대화가 열린 event만 적었다)"
      - "사람 단추가 route 여럿을 묶으므로 ui: entry로 두었다(route 하나의 flow가 아니다)"

  # ---- ipc: 아래 flow들은 packages/shell/ipc의 channel entry가 links로 잇는다 ----
  - id: annotate-mode
    title: annotate mode를 켜거나 끈다(Esc로 끄기 포함)
    actor: person
    entries: [ui:annotate-exit]
    uses: [ipc:shell:annotate-mode, ipc:shell:annotate-state]
    boundary: [shell]
    code: [packages/shell/main/app-frame/annotate.ts, packages/shell/main/desktop/wiring/annotate.ts]
    steps:
      - "renderer가 shell:annotate-mode로 켜기·끄기를 보낸다. main guard는 살아 있는 등록 webContents의 main frame이 desktop 창 본문이고, view가 그 창의 view여야 한다. 입력 schema도 맞아야 한다"
      - "보내는 중이면 conflict다. 아니면 view마다 on 상태를 바꾸고 page에 SET_MODE를 보낸다"
      - "끄면 고른 목록은 남긴다. 상태를 shell:annotate-state로 renderer에 민다"
      - "Esc는 page가 annotate:exit로 알려 main이 mode만 끈다(ui:annotate-exit). page가 살아 있는 앱·artifact view의 main frame이 아니면 버린다"
    outcomes:
      - id: "on"
        observe: [response, screen:new-app-annotate, screen:artifact-annotate]
      - id: "off"
        observe: [response, screen:new-app-annotate]
      - id: exited
        when: "Esc로 page가 annotate:exit를 보냈다. main이 mode만 끈다(목록은 남긴다)"
        observe: [screen:new-app-annotate]
      - id: conflict
        code: conflict
        when: "보내는 중이다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema에 맞지 않다(view_session 값이나 on이 맞지 않다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "보낸 쪽이 살아 있는 등록 webContents의 main frame이 아니다, 또는 desktop 창 본문이 아니다, 또는 view가 그 창의 view가 아니다"
        observe: [response]
      - id: page-ignored
        when: "Esc를 보낸 쪽이 살아 있는 앱·artifact view의 main frame이 아니다(응답이 없어 조용히 버린다)"
        observe: []
    crosses_process: true
    docs: [architecture/annotation.md]

  - id: annotate-remove
    title: annotate 목록에서 표지 하나나 전부를 지운다
    actor: person
    entries: []
    uses: [ipc:shell:annotate-remove]
    pre: [ui:annotate-pick]
    boundary: [shell]
    code: [packages/shell/main/app-frame/annotate.ts]
    steps:
      - "renderer가 shell:annotate-remove로 번호 하나나 all을 보낸다. guard는 annotate-mode와 같다"
      - "보내는 중이면 conflict다"
      - "page에 REMOVE를 보내고 main의 목록과 번호별 release를 맞춘다"
      - "상태를 renderer에 민다"
    outcomes:
      - id: removed
        observe: [response, screen:new-app-annotate-list]
      - id: conflict
        code: conflict
        when: "보내는 중이다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema에 맞지 않다(번호가 1 이상의 정수나 all이 아니다, view_session 값이 맞지 않다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "보낸 쪽이 살아 있는 등록 webContents의 main frame이 아니다, 또는 desktop 창 본문이 아니다, 또는 view가 그 창의 view가 아니다"
        observe: [response]
    crosses_process: true
    docs: [architecture/annotation.md]

  - id: annotate-send
    title: 고른 annotation을 화면 capture와 함께 core에 보내고 session에 넣는다
    actor: person
    entries: []
    uses: [ipc:shell:annotate-send, route:annotations/upload_screenshot, route:annotations/send]
    pre: [ui:annotate-pick]
    boundary: [shell, apps, core-api]
    code: [packages/shell/main/app-frame/annotate.ts, packages/shell/main/app-frame/capture.ts, packages/core/apps/annotations/send.ts]
    steps:
      - "보내는 중이면 conflict다. 목록이 비었거나 app 화면의 release도 preview bundle도 없는 항목이 있으면 invalid_input이다"
      - "목록을 번호 순으로 1..N에 맞춘다. 각 annotation마다 page에 capture 준비를 알려(annotate:capture-ready를 기다린다) 윤곽과 번호가 이미지에 찍히게 한다"
      - "guest를 capturePage로 찍어 고른 곳에 표지와 여백을 더해 자르고 줄인다. 찍기나 자르기가 안 되면 그 annotation만 screenshot 없이 보낸다(보내기는 계속된다)"
      - "annotation마다 번호가 처음 생길 때의 판을 싣는다: live view는 release, preview view는 bundle hash(preview_bundle)다"
      - "PNG를 annotation-screenshot-upload로 올리고(실패하면 null), 묶음을 annotation-send로 core에 보낸다. core가 던지면 unavailable"
      - "성공하면 mode를 끄고 목록과 표지를 비운다. 실패하면 목록은 남기고 core의 code를 그대로 renderer에 돌려준다(미지의 code는 unavailable)"
    outcomes:
      - id: sent
        when: "묶음을 보냈다. preview view에서 보낸 annotation은 release 없이 bundle hash를 싣고 간다. screenshot을 찍거나 올리지 못한 annotation은 screenshot 없이 섞여 간다"
        observe: [response, screen:new-app-annotate]
      - id: conflict
        code: conflict
        when: "이미 보내는 중이다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema에 맞지 않다(session 값이나 agent 모양), 또는 목록이 비었거나 release도 preview bundle도 없는 항목이 있다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "보낸 쪽이 살아 있는 등록 webContents의 main frame이 아니다, 또는 desktop 창 본문이 아니다, 또는 view가 그 창의 view가 아니다"
        observe: [response]
      - id: core-rejected
        when: "core가 묶음을 거절했거나 호출이 실패했다(core의 invalid_input·forbidden·conflict·unavailable은 그대로, 그 밖의 code와 throw는 unavailable)"
        observe: [response, screen:new-app-annotate-list]
    crosses_process: true
    docs: [architecture/annotation.md]

  - id: notice-reveal
    title: 알림을 눌러 그 탭(앱 공간이나 Inbox)이 있는 창을 앞으로 가져온다
    actor: person
    entries: [ui:notice-os-click]
    uses: [ipc:shell:notice-open]
    boundary: [shell]
    code: [packages/shell/main/desktop/wiring/notice.ts]
    steps:
      - "toast를 누르면 renderer가 shell:notice-open으로 target을 보낸다. OS 알림을 누르면 main이 바로 reveal을 부른다"
      - "target의 탭을 가진 창을 고른다(없으면 마지막 focus 창, detached 창은 건너뜀)"
      - "창을 복원하고 앞으로 가져온 뒤 renderer에 NOTICE_REVEAL(session·app·inbox)을 보낸다. terminal이면 TERMINAL_REVEAL을 보낸다"
      - "창이 하나도 없으면 desktop 창을 새로 띄우고 그 page가 load를 마친 뒤 같은 reveal을 보낸다. notice preload는 화면이 구독할 때까지 그 reveal을 들고 있다"
    outcomes:
      - id: revealed
        when: "target이 inbox면 Inbox, app이면 앱 공간, session이면 그 대화를 연다. terminal 목표면 terminal 탭을 고른다. 창이 없었으면 새로 띄운 창에서 연다"
        observe: [screen:inbox-tab]
      - id: ignored
        when: "caller가 살아 있는 등록 webContents의 main frame이 아니거나 입력 schema에 맞지 않는다(응답 없이 버린다)"
        observe: []
    crosses_process: true
    docs: [architecture/app-notice.md]
    unclear:
      - "app target의 observe는 screen:app-space가 맞지만 한 outcome에 target별 frame을 다 적지 못해 inbox 하나만 적었다"
      - "terminal 목표인데 project를 찾지 못하면 아무것도 보내지 않는다(terminal area 소관)"
      - "새로 띄운 창에 보내는 terminal reveal은 terminal preload가 들고 있지 않아 화면이 구독하기 전에 오면 잃을 수 있다(코드 읽기로 본 것이다)"

  - id: notice-presence
    title: desktop이 보고 있는 것(창 focus, idle, 보이는 session·터미널)을 core에 알린다
    actor: system
    entries: []
    uses: [ipc:shell:notice-visible, ipc:shell:terminal-focus, route:presence/report]
    boundary: [shell, attention]
    code: [packages/shell/main/notice/presence.ts, packages/shell/main/desktop/wiring/notice.ts]
    steps:
      - "renderer가 보이는 session이나 앱 view를 shell:notice-visible로 알린다(창마다 개수를 센다). 고른 터미널 탭은 terminal-focus가 focus 표에 적는다"
      - "창 focus·blur·닫힘, notice-visible, 터미널 focus·blur 때 focus를 가진 lophn 창, OS idle 시간, 그 창에 보이는 session과 고른 터미널(term:<탭>)을 모은다. 앱 view는 싣지 않는다"
      - "focus와 보이는 것이 지난 보고와 같으면 보내지 않는다(idle은 바뀜 판단에서 뺀다). 30초마다, core가 다시 붙었을 때는 늘 보낸다"
      - "presence/report로 보낸다. 실패는 다음 주기가 메운다. headless면 보내지 않는다"
    outcomes:
      - id: reported
        when: "보고를 보냈다. core가 새로 보는 session의 못 본 끝(unseen)을 끄면 창의 점과 Finished 줄이 빠진다"
        observe: []
      - id: unchanged
        when: "바뀐 것이 없어 보내지 않았다"
        observe: []
      - id: headless
        when: "headless라 보내지 않았다"
        observe: []
      - id: ignored
        when: "notice-visible caller가 등록된 창이 아니거나 입력이 맞지 않는다(응답 없이 버린다)"
        observe: []
    crosses_process: true
    docs: [architecture/app-notice.md]

  - id: notice-unseen
    title: 창이 core의 못 본 turn 끝을 읽어 탭 점과 Finished 줄을 그리고 알림 panel의 지우기를 core에 보낸다
    actor: person
    entries: []
    uses: [route:unseen/list, route:unseen/dismiss]
    boundary: [shell, attention]
    code:
      - packages/shell/renderer/desktop/connection/events/unseen-store.ts
      - packages/shell/renderer/desktop/connection/waiting/finished.ts
    steps:
      - "창이 연결될 때와 StateChanged unseen마다 unseen/list를 읽는다. lophn session은 session store의 점, 터미널(term:<탭>)은 탭 store의 점이 된다"
      - "Finished 줄의 이름·얼굴·제목은 창이 아는 값이다: 터미널은 runtime의 harness와 탭 이름(쉬는 agent만), lophn session은 agent 정의와 session 이름을 읽는다(읽기 전에는 lophn·Agent와 이름 없음)"
      - "알림 panel의 [x]는 unseen/dismiss를 부른다. core가 끄면 StateChanged unseen으로 줄이 빠진다"
    outcomes:
      - id: listed
        observe: [screen:new-waiting-finished]
      - id: dismissed
        when: "Finished 줄을 지웠다(app·inbox 목표는 아무것도 하지 않는다)"
        observe: [screen:new-waiting-finished]
      - id: read-failed
        when: "unseen/list를 읽지 못했다. 지금 값을 둔다"
        observe: []
    crosses_process: true
    docs: [architecture/app-notice.md]

  - id: app-view-open
    title: 앱 화면(tab·panel·card·sidebar·tray 자리)을 열어 webview를 붙인다
    actor: person
    entries: []
    uses: [ipc:shell:view-open-app, ipc:shell:view-state, route:app_views/open, route:app_views/close]
    boundary: [shell, app-runtime]
    code: [packages/shell/main/app-frame/view-ipc.ts, packages/shell/main/app-frame/registry.ts, packages/shell/main/app-frame/binding.ts, packages/shell/main/app-frame/session-policy.ts, packages/shell/main/app-frame/app-protocol.ts, packages/shell/main/app-frame/electron-app-frame.ts, packages/shell/main/app-frame/network-policy.ts, packages/shell/main/desktop/wiring/app-views.ts, packages/shell/renderer/app-frame/webview-host.tsx, packages/shell/renderer/app-frame/machine-deps.ts, packages/shell/renderer/app-frame/app-machine.tsx]
    steps:
      - "renderer가 shell:view-open-app을 보낸다. 탭의 기계 범위가 다른 기계면 그 기계를 실어 보낸다(machine-deps). 이 컴퓨터에 같은 앱이 있으면 탭의 기계가 달라도 이 컴퓨터의 것을 연다(app-machine). view-ipc가 sender가 살아 있는 desktop 창 본문인지, 입력이 schema에 맞는지 본다(sender를 먼저 본다)"
      - "registry가 요청 모양을 한 번 보고 창이 열려 있는지 본다. 기계가 있으면 live만 받고, 이 컴퓨터의 id를 아직 모르면 unavailable이고, 이 컴퓨터의 id면 이 컴퓨터의 것으로 연다"
      - "view id를 정해 그 기계의 core app_views/open으로 묶는다(view-table-open). 다른 기계는 machines/call로 가고 그 기계가 이 컴퓨터를 기기(device:<이 컴퓨터>)로 보고 기기 route 목록으로 거른다. 화면·자리·params 검사와 release·process는 core가 정하고, 정규화한 params만 화면 주소로 간다. core의 invalid_input·forbidden·conflict는 그대로 돌려주고 나머지(not_found 포함)는 unavailable이다"
      - "registry가 그 기계의 grant host(app_grants/list, apps/tools)를 읽는다. 그 기계가 grant 읽기를 거절하면 forbidden, 그 밖에 읽지 못했거나 그 사이 창이 닫혔으면 unavailable이고 방금 연 core view를 닫는다"
      - "view entry를 만들고 renderer가 <webview>를 붙인다. guest가 붙을 때 acceptGuest가 1회용으로 받아 partition을 붙인다. 이 컴퓨터의 앱은 persist:app-<app>:live, 다른 기계의 앱은 persist:app-<app>:machine-<기계>이고 host label도 기계마다 다르다(app-<app>-<기계>). 화면 byte는 그 기계의 apps/screen_file이 준다(다른 기계는 machines/call의 base64, 한 file 8 MiB)"
      - "session 정책: 새 window 열기 거부, 권한 요청 거부, lophn-app scheme과 자기 host 밖의 network 요청 차단(network-policy)"
      - "상태(view_session·연결·health)를 shell:view-state로 창에 보낸다"
    outcomes:
      - id: opened
        observe: [response, screen:app-space]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema나 view 요청 모양이 맞지 않다, 창이 열려 있지 않다, 다른 기계에 preview를 열려 했다, 또는 core가 invalid_input을 돌려줬다(params가 화면 선언과 맞지 않다, 화면이 선언에 없다, 자리가 화면의 places에 없다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 살아 있는 desktop 창 본문이 아니다(view-ipc guard), core가 forbidden을 돌려줬다, 또는 다른 기계가 기기 route 목록에 없는 route(grant 읽기 등)를 거절했다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "preview가 다른 release를 돌리고 있다, 또는 live 앱이 열 때 고른 release와 다른 release를 채택했다(core의 conflict 그대로)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "core가 unavailable·not_found를 돌려줬다(release 없는 preview에 params를 줬다, preview나 앱 process가 돌지 않는다, 앱이 없거나 보관했다), grant host를 읽지 못했다, 기계를 적었는데 이 컴퓨터의 id를 아직 모른다, 다른 기계에 닿지 못한다, 그 밖의 core 실패(core가 준비되지 않은 것 포함)"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/app-call.md]

  - id: app-view-close
    title: 앱 화면을 닫는다(webview를 내리고 registry에서 뺀다)
    actor: person
    entries: []
    uses: [ipc:shell:view-close, route:app_views/close]
    boundary: [shell, app-runtime]
    code: [packages/shell/main/desktop/wiring/app-views.ts, packages/shell/main/app-frame/registry.ts]
    steps:
      - "renderer가 shell:view-close로 view_session을 보낸다. view-ipc guard가 sender와 입력 schema를 먼저 본다"
      - "그 창의 앱 view인지 본다. artifact view면 artifact 쪽에서 닫는다"
      - "앱 view면 registry에서 빼고 webview를 unmount한다. partition의 앱 저장은 남는다"
      - "core app_views/close로 view 표에서도 지운다. 기다리지 않고 실패는 무시한다(창을 닫을 때와 shell이 멈출 때도 같다)"
    outcomes:
      - id: closed
        observe: [response, screen:app-space]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema에 맞지 않거나, 그 창의 view가 아니다(이미 닫혔거나 다른 창의 view다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "부른 쪽이 살아 있는 desktop 창 본문이 아니다(등록되지 않은 sender, subframe, 주소 불일치, 창 찾기 실패)"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-call.md]

  - id: app-view-reopen
    title: 깨진 앱 화면을 같은 연결로 새로 연다
    actor: person
    entries: []
    uses: [ipc:shell:view-reopen]
    boundary: [shell, app-runtime]
    code: [packages/shell/main/app-frame/registry.ts, packages/shell/main/app-frame/crash.ts]
    steps:
      - "사람이 [새 view 열기]를 누르면 renderer가 shell:view-reopen을 보낸다. view-ipc guard가 sender와 입력 schema를 먼저 본다"
      - "registry가 같은 binding과 partition으로 새 contents를 만든다. 앱을 다시 읽거나 다시 부르지 않는다"
      - "건강한 view는 연결하지 않는다(conflict)"
    outcomes:
      - id: reopened
        observe: [response, screen:app-space]
      - id: conflict
        code: conflict
        when: "view가 깨진 상태가 아니다(health가 ok)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 schema에 맞지 않거나, 그 창에 열린 view가 아니다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 살아 있는 desktop 창 본문이 아니다(view-ipc guard)"
        observe: [response]
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-window-open
    title: 앱 하나의 전용 창을 연다([Open in new window])
    actor: person
    entries: []
    uses: [ipc:shell:app-window-open, route:apps/get, route:apps/tools]
    boundary: [shell]
    code: [packages/shell/main/desktop/app-window-ipc.ts, packages/shell/main/desktop/app-window.ts]
    steps:
      - "앱 공간의 [Open in new window]가 app id 하나를 보낸다. sender가 살아 있는 desktop 창 본문이 아니면 forbidden, 입력이 app id 하나가 아니면 invalid_input"
      - "main이 core의 apps/get으로 활성 앱인지 보고, apps/tools로 entry 화면(full 크기를 선언한 첫 screen)을 고른다. 이 중 어느 것이 실패해도 unavailable이다"
      - "그 앱 전용 창을 연다(shell 문서 하나, renderer가 앱 view를 붙인다). 이미 창이 있으면 그 창을 앞으로 가져온다"
    outcomes:
      - id: opened
        observe: [screen:app-space]
      - id: forbidden
        code: forbidden
        when: "sender가 살아 있는 등록 desktop 창 본문의 main frame이 아니다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 app id 하나가 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "앱 기록을 못 읽었거나 보관됐거나 활성 release가 없다, entry 화면이 없다, 또는 창을 못 열었다(이 모든 실패가 unavailable로 묶인다)"
        observe: [response]
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-shortcut
    title: 앱을 OS 앱 바로가기에 넣거나 뺀다
    actor: person
    entries: []
    uses: [ipc:shell:app-shortcut-add, ipc:shell:app-shortcut-remove, route:apps/get]
    boundary: [shell]
    code: [packages/shell/main/desktop/app-window-ipc.ts, packages/shell/main/desktop/os-entry/entry.ts, packages/shell/main/desktop/os-entry/linux.ts, packages/shell/main/desktop/os-entry/macos.ts, packages/shell/main/desktop/os-entry/windows.ts]
    steps:
      - "sender가 살아 있는 desktop 창 본문이 아니면 forbidden, 입력이 app id 하나가 아니면 invalid_input이다(둘 다 add·remove 공통)"
      - "add는 core 기록에서 활성 앱 이름을 읽는다. 보관됐거나 기록이 없거나 읽지 못하면 unavailable이다"
      - "os-entry가 OS별 바로가기 파일을 쓴다. 고정 앱 ID를 --open-app으로 넘길 뿐 source path나 token은 담지 않는다"
      - "패키지된 실행 파일만 등록한다. 개발·headless·지원하지 않는 OS는 not_installed, 실행 파일을 믿을 수 없거나 OS 쓰기가 실패하면 os_failed다"
      - "remove는 같은 OS 경로에서 그 앱의 바로가기를 지운다. 없어도 오류가 아니다. 지우기가 실패하면 os_failed다"
    outcomes:
      - id: added
        observe: [disk:os-entry 바로가기 파일, response]
      - id: removed
        observe: [disk:os-entry 바로가기 파일, response]
      - id: forbidden
        code: forbidden
        when: "sender가 살아 있는 등록 desktop 창 본문의 main frame이 아니다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 app id 하나가 아니다, 또는 install이 invalid_app이라 한다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "add만: 보관된 앱이거나 기록이 없다(기록 읽기 실패 포함)"
        observe: [response]
      - id: not-installed
        when: "개발·headless 실행이거나 지원하지 않는 OS다(add·remove 모두. AppWindowErrorCode의 not_installed)"
        observe: [response]
      - id: os-failed
        when: "add: 실행 파일 확인이 안 되었거나 OS 쓰기가 실패했다. remove: OS 지우기가 실패했다(AppWindowErrorCode의 os_failed)"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/app-call.md]
    unclear:
      - "AppWindowErrorCode의 not_installed와 os_failed는 AGENTS.md의 공통 오류 일곱 밖의 code다. 바꿀지 정하지 못했다"
      - "바로가기 파일의 정확한 OS 경로는 os-entry 세 file이 정한다. observe는 그 파일로만 적었다"

  - id: app-external-link
    title: 앱 화면의 외부 링크를 OS 기본 browser로 연다
    actor: app
    entries: []
    uses: [ipc:app:open-external]
    boundary: [shell, app-runtime]
    code: [packages/shell/main/app-frame/external-link.ts, packages/shell/main/app-frame/app-ipc.ts, packages/shell/main/desktop/wiring/app-views.ts]
    steps:
      - "앱 page가 app:open-external로 URL을 보낸다. sender가 살아 있는 앱 view의 main frame이 아니면 forbidden"
      - "입력은 {url}만이고 URL은 http·https, userinfo 없음, 8,192자 이하여야 한다. 아니면 invalid_input"
      - "main log에는 app, mode, origin, path만 남긴다(query와 fragment는 쓰지 않는다)"
      - "OS 기본 browser로 연다. headless면 열지 않고 ok다. 열지 못하면 unavailable이다"
    outcomes:
      - id: opened
        when: "OS 기본 browser로 열었다(headless면 열지 않고 ok다)"
        observe: [response, log:shell]
      - id: invalid-input
        code: invalid_input
        when: "입력이 {url}만이 아니거나 URL이 조건에 맞지 않는다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "browser를 열지 못했다"
        observe: [response, log:shell]
      - id: forbidden
        code: forbidden
        when: "sender가 살아 있는 앱 view의 main frame이 아니다"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/app-call.md]

  - id: app-view-error-capture
    title: 앱 화면의 처리되지 않은 오류를 shell main이 거르고 core에 넘긴다
    actor: app
    entries: []
    uses: [ipc:app:view-error, route:apps/log_view_error]
    boundary: [shell, app-runtime]
    code: [packages/shell/main/app-frame/view-error.ts, packages/shell/main/app-frame/app-ipc.ts, packages/shell/main/desktop/wiring/app-views.ts]
    steps:
      - "설치된 preload가 처리되지 않은 오류를 {observation, name, message}로 app:view-error에 보낸다. 응답은 없다. sender가 살아 있는 앱 view의 main frame이 아니면 조용히 버린다"
      - "view마다 60초에 20개까지만 받는다. 넘친 것은 센 뒤 log도 남기지 않고 버린다"
      - "field가 정확히 셋이 아니거나 observation이 셋(error, unhandledrejection, render_error) 밖이거나 글자 상한을 넘으면 main log에 dropped로 한 줄 남기고 버린다"
      - "main이 sender view에서 앱·release·mode를 붙여 apps.log_view_error(memory)를 부른다(core 쪽 판정은 그 route의 flow). 보냈는지는 main log에 한 줄(실패면 unsent)로 남긴다"
    outcomes:
      - id: forwarded
        when: "core에 보냈다"
        observe: [log:shell main view-error]
      - id: unsent
        when: "core가 받지 못했다(연결이 없거나 route가 오류를 돌려줌). main log에만 남는다"
        observe: [log:shell main view-error unsent]
      - id: dropped-invalid
        when: "모양이 틀린 메시지다(창당 상한 안에서 센 뒤 버린다)"
        observe: [log:shell main view-error dropped]
      - id: dropped-over-limit
        when: "그 view가 창당 상한(20개/60초)을 넘었다. 이 경우 log를 남기지 않는다"
        observe: []
      - id: not-app-view
        when: "sender가 살아 있는 앱 view의 main frame이 아니다(응답이 없어 조용히 버린다)"
        observe: []
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-agent-open
    title: 앱 화면이 자기 앱 workspace에 새 agent session을 연다
    actor: app
    entries: []
    uses: [ipc:app:agent-open, route:app_sessions/open]
    boundary: [shell, agent-sessions]
    code: [packages/shell/main/app-frame/app-agent.ts, packages/shell/main/app-frame/app-ipc.ts]
    steps:
      - "sender가 살아 있는 앱 view의 main frame이 아니면 forbidden이다(app-ipc)"
      - "앱 화면이 agent handle과 선택한 title, 선택한 workspace를 보낸다. 다른 key가 있으면 invalid_input"
      - "사람 자격으로 core의 app_sessions.open을 부른다(앱은 main이 sender view에서 정해 싣는다). core가 handle을 그 앱 workspace에서 풀고 새 session을 열어 opened_by_app을 단다(app-sessions-open). workspace를 빼면 그 앱 workspace이고 주면 call 정책이 허락한 workspace여야 한다. 실패하면 그 실패를 돌려준다"
      - "그 view가 연 session으로 기억해 갱신을 받는다. 알림 규칙은 core의 opened_by_app을 보고 turn 끝 알림을 거른다"
    outcomes:
      - id: opened
        when: "새 session을 열었다. title 붙이기가 실패해도 여기다(session은 열린 채다)"
        observe: [event:SessionStarted, response]
      - id: invalid-input
        code: invalid_input
        when: "입력 모양이 맞지 않는다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "core가 그 handle을 앱 workspace에서 풀지 못했다(app_sessions.open의 not_found)"
        observe: [response]
      - id: core-failed
        when: "app_sessions.open이 실패했다(core의 code를 그대로 돌려준다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 살아 있는 앱 view의 main frame이 아니다(app-ipc)"
        observe: [response]
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-agent-snapshot
    title: 앱 화면이 보이는 session의 ACP 상태를 읽고 갱신을 받는다
    actor: app
    entries: []
    uses: [ipc:app:agent-snapshot, ipc:app:agent-update, route:app_sessions/list, route:acp/snapshot]
    boundary: [shell, agent-sessions]
    code: [packages/shell/main/app-frame/app-agent.ts, packages/shell/main/app-frame/app-ipc.ts]
    steps:
      - "sender가 살아 있는 앱 view의 main frame이 아니면 forbidden이다(app-ipc)"
      - "session 값이 문자열인지 본다. 아니면 invalid_input"
      - "그 session이 이 앱에 보이는지 core에 묻는다(app_sessions.list의 session 한 건). 읽을 때마다 다시 묻는다. 보이는 session은 workspace와 상관없이(call 정책이 닿는 workspace의 lophn·harness session) 붙는다. 터미널 탭(term:)은 ACP session이 아니라 forbidden이다"
      - "보이면 acp snapshot을 돌려준다. 없거나 안 보이는 session은 forbidden이다"
      - "이후 core의 AcpUpdated는 그 session을 읽은 view에만 app:agent-update로 보낸다. 다른 기계에 묶인 view가 붙은 session은 구독자 app-views가 그 기계에 그 session의 AcpUpdated를 걸고(view를 닫으면 뺀다), 그 기계의 갱신은 그 기계에 묶인 view에만 간다"
    outcomes:
      - id: snapshot
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 앱 view의 main frame이 아니다(app-ipc), 또는 session이 이 앱에 보이지 않는다(없음, private, 터미널 탭), 또는 시야 확인이 not_found·forbidden·unauthorized다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "session 값이 문자열이 아니다, 또는 시야 확인이 invalid_input을 돌려줬다(session id 꼴이 아님)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "core를 쓸 수 없다, 또는 시야 확인이 그 밖의 실패다(internal 등)"
        observe: [response]
      - id: core-failed
        when: "acp snapshot 읽기가 실패했다(core의 code를 그대로 돌려준다)"
        observe: [response]
      - id: updated
        when: "core의 AcpUpdated를 받아 그 session을 읽은 view의 page에 app:agent-update로 보낸다(page가 이미 없는 view는 목록에서 뺀다)"
        observe: [event:AcpUpdated, screen:app-space]
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-projects-list
    title: 앱 화면이 lophn project 목록을 읽는다
    actor: app
    entries: []
    uses: [ipc:app:projects-list, route:projects/list]
    boundary: [shell, projects]
    code: [packages/shell/main/app-frame/app-projects.ts, packages/shell/main/app-frame/app-ipc.ts]
    steps:
      - "sender가 살아 있는 앱 view의 main frame이 아니면 forbidden이다(app-ipc)"
      - "사람 자격으로 projects.list를 next_cursor가 없을 때까지 읽는다(보관 포함)"
      - "project마다 id·identity(기계를 넘는 id, 없으면 null)·formerIdentities(former_identities, 잇기·나누기 전의 옛 id)·name·title·purpose·status만 남긴다. 폴더 path는 주지 않는다. project workspace에서 열린 화면의 place.workspace도 identity와 formerIdentities를 싣는다"
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 앱 view의 main frame이 아니다(app-ipc)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "page를 읽는 사이 project 목록이나 ledger가 바뀌어 cursor가 conflict다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "core를 쓸 수 없다, 또는 projects.list가 conflict 밖의 실패다"
        observe: [response]
    crosses_process: true
    docs: [architecture/app-call.md]

  # ---- 앱 view binding: core의 view 표(메모리) ----
  - id: view-table-open
    title: host가 앱 화면(view) 하나를 core의 view 표에 묶거나 다시 묶는다
    actor: shell
    entries: [route:app_views/open]
    boundary: [apps, app-runtime, core-api]
    code: [packages/core/apps/views/table.ts, packages/core/apps/views/mod.ts, packages/protocol/apps/views.ts, packages/core/main/daemon/wiring/apps.ts]
    steps:
      - "owner는 요청 credential의 principal이다(shell main과 CLI는 user, 기기는 device:<id>). 표의 key는 (owner, view)이고 view id는 host가 만든다"
      - "앱이 없으면 not_found, 보관했으면 unavailable이다. live는 지금 ready인 live process에, preview는 지금 ready인 preview process에 묶는다. 없으면 unavailable이다"
      - "release를 주면 그 process의 release와 같아야 한다(아니면 conflict). live에서 null이면 지금 도는 release를 따른다"
      - "선언을 읽을 수 있으면(live, release 있는 preview) 화면이 선언에 있고 자리가 그 화면의 places에 들어야 한다. params는 그 화면의 params schema로 검사해 정규화한다. release 없는 preview는 화면 검사를 건너뛰고 params를 받지 않는다"
      - "같은 (owner, view)를 같은 인자로 다시 보내면 새로 열지 않고 지금 process로 다시 묶어 돌려준다(card는 묶인 release가 지금과 다르면 conflict). 인자가 다르면 conflict다. card가 아닌 live view의 release는 열 때의 전제라 다시 열기에서 견주지 않는다(다른 release나 null도 지금 binding)"
      - "owner마다 64개까지다. 새 view가 넘치면 가장 오래 쓰지 않은 view를 표에서 내보내고 AppViewEvent(lost, evicted)를 낸다"
    outcomes:
      - id: opened
        when: "새 view를 묶었다. release, bundle hash, process nonce, 정규화한 params를 돌려준다"
        observe: [response]
      - id: resumed
        when: "같은 인자의 다시 열기. 지금 binding을 다시 읽어 돌려준다(묶음을 잃었던 view도 되살아난다)"
        observe: [response]
      - id: evicted
        when: "owner의 view가 64개라 가장 오래 쓰지 않은 view를 내보내고 새 view를 묶었다"
        observe: [event:AppViewEvent, response]
      - id: not-found
        code: not_found
        when: "앱이 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "앱을 보관했다, ready인 live·preview process가 없다, 도는 release의 선언을 읽지 못했다, 또는 release 없는 preview에 params를 줬다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "새 view에 준 release가 지금 process의 release와 다르다, card view를 다시 열 때 도는 release가 묶인 release와 다르다, 또는 같은 view id를 다른 인자로 열었다(card가 아닌 live view의 release는 빼고 본다)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "화면이 선언에 없다, 자리가 그 화면의 places에 없다, params가 화면의 schema에 맞지 않거나 schema 없는 화면에 값을 줬다, 또는 입력 모양이 틀렸다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor(user)가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/app-call.md]

  - id: view-table-call
    title: host가 view의 binding으로 operation 하나를 부른다
    actor: shell
    entries: [route:app_views/call]
    uses: [app-operation-call:succeeded, app-operation-call:failed, app-operation-call:unknown]
    boundary: [apps, app-runtime, core-api]
    code: [packages/core/apps/views/call.ts, packages/core/apps/views/mod.ts, packages/protocol/apps/views.ts]
    steps:
      - "(owner, view)가 표에 없으면 not_found다. 다른 owner의 view도 같다"
      - "operation(비지 않음, 앞뒤 공백·제어 문자·* 없음)과 input(JSON 왕복이 같고 64 KiB 이하)을 검사한다. 틀리면 invalid_input이다"
      - "묶인 release(preview는 preview bundle)의 선언에서 operation을 찾는다. 없으면(command 이름, 구독 handler, 다른 앱의 이름) core 호출 없이 outcome forbidden이다"
      - "apps/call_tool 경로를 kind operation, caller {person, view_session: view id}로 부른다. 대상(앱, release 또는 preview nonce)은 표의 binding에서만 온다"
      - "결과를 outcome으로 옮긴다. 앱이 낸 오류는 앱의 code와 message 그대로, denied는 그 이유대로, 결과 모름과 큰 결과는 unavailable이다"
    outcomes:
      - id: succeeded
        when: "앱이 값을 돌려줬다. outcome ok"
        observe: [response]
      - id: app-failed
        when: "outcome이 실패다: 앱 handler의 오류, 호출 경로의 denied, 결과 모름, 8 MiB를 넘는 결과, 또는 묶음을 잃은 view"
        observe: [response]
      - id: not-declared
        when: "묶인 선언에 없는 operation이다. outcome forbidden(operation is not available)이고 호출 경로까지 가지 않는다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "그 owner의 view가 표에 없다(닫았거나 내보냈거나 다른 owner의 view)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "operation 이름이나 input이 규칙에 맞지 않는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor(user)가 아니거나 credential scope에 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    declared_only: [unavailable]
    docs: [architecture/app-call.md]
    unclear:
      - "선언한 unavailable은 route 오류로 나지 않는다. 앱을 쓸 수 없으면 outcome 안의 unavailable이다(선언을 고칠 곳)"

  - id: view-table-close
    title: host가 view 하나를 표에서 지운다
    actor: shell
    entries: [route:app_views/close]
    boundary: [apps, core-api]
    code: [packages/core/apps/views/mod.ts, packages/core/apps/views/table.ts]
    steps:
      - "(owner, view)를 표에서 지운다. 없는 view와 다른 owner의 view는 closed false다(있는지 새지 않는다)"
    outcomes:
      - id: closed
        observe: [response]
      - id: not-open
        when: "그 owner의 view가 없다. closed false"
        observe: [response]
    crosses_process: false
    docs: [architecture/app-call.md]

  - id: view-table-events
    title: core가 앱 event와 다시 묶음을 view마다 AppViewEvent로 그 owner의 Gateway에 보낸다
    actor: system
    entries: [system:view-table-events]
    uses: [system:gateway-stream]
    boundary: [apps, event-stream, events]
    code: [packages/core/apps/views/events.ts, packages/core/apps/views/table.ts, packages/core/events/gateway.ts, packages/core/server/socket.ts, packages/core/main/daemon/wiring/apps.ts]
    steps:
      - "apps wiring이 Bus의 AppEventPublished와 AppViewChanged를 듣는다"
      - "AppEventPublished: audience에 앱이 들고 묶인 release가 (source, event) 구독을 선언한 live view마다 AppViewEvent(event)를 낸다. preview view와 묶음을 잃은 view는 받지 않는다"
      - "AppViewChanged: 그 앱의 모든 view를 다시 묶는다. card가 아닌 view는 도는 release를 따르고 card는 묶인 release 그대로다. 묶이면 rebound(binding이 그대로여도), 못 묶으면 lost(app_stopped, app_archived, conflict)를 내고 view는 표에 남는다"
      - "Gateway session은 payload의 owner가 그 연결의 owner(사람 token은 principal)일 때만 AppViewEvent를 보낸다. owner 없는 session에는 보내지 않는다"
    outcomes:
      - id: event-delivered
        when: "구독을 선언한 live view에 앱 event를 보냈다"
        observe: [event:AppViewEvent]
      - id: not-subscribed
        when: "audience 밖, 구독을 선언하지 않은 release, preview view, 묶음을 잃은 view. 보내지 않는다"
        observe: []
      - id: rebound
        when: "AppViewChanged 뒤 다시 묶었다"
        observe: [event:AppViewEvent]
      - id: lost
        when: "다시 묶지 못했다(앱이 안 돈다, 보관했다, card의 release가 더는 돌지 않는다)"
        observe: [event:AppViewEvent]
      - id: other-owner
        when: "Gateway session의 owner가 payload의 owner와 다르거나 session에 owner가 없다. 그 연결에는 가지 않는다"
        observe: []
    crosses_process: false
    risk: [permission]
    docs: [architecture/app-call.md, architecture/event.md]

  - id: app-event-view-deliver
    title: 열려 있는 앱 화면이 구독을 선언한 앱 event를 받는다
    actor: app
    entries: []
    uses: [ipc:app:event, sdk:app-ui/useEvent, system:view-table-events]
    boundary: [shell, app-runtime]
    code: [packages/core/apps/views/events.ts, packages/shell/main/app-frame/registry.ts, packages/shell/main/desktop/wiring/app-views.ts, packages/shell/preload/app-tool.ts, packages/sdk/app-ui/use-event.ts]
    steps:
      - "core의 view 표가 AppEventPublished를 받아 audience에 들고 묶인 release가 (source, event) 구독을 선언한 live view마다 AppViewEvent(event)를 그 view를 연 owner의 Gateway에만 낸다(view-table-events). 이 event는 저장하지 않고 놓친 것은 다시 오지 않는다."
      - "shell main이 AppViewEvent를 듣고(조건 types AppViewEvent) 그 view의 page에 app:event로 {source, event, payload}를 보낸다. 모르는 view이거나 page가 아직 안 붙었으면 버린다. 선언하지 않은 화면에는 listener를 달아도 오지 않는다."
      - "preload가 (source, event)별 listener(useEvent)에 나눠 준다. 한 listener의 오류가 다른 listener를 막지 않는다."
    outcomes:
      - id: delivered
        when: "구독을 선언한 열린 화면의 page에 보냈다"
        observe: [screen:app-space]
      - id: not-declared
        when: "화면의 release가 그 (source, event)를 구독으로 선언하지 않았다. 보내지 않는다"
        observe: []
      - id: no-view
        when: "열린 live 화면이 없거나 page가 이미 없다(shell이 모르는 view, page가 안 붙은 view). 아무 일도 없다"
        observe: []
    crosses_process: false
    docs: [architecture/app-call.md, architecture/event.md]

  - id: app-sessions-view
    title: 앱 화면이 lophn의 session 목록을 읽고 멈춘다(useSessions)
    actor: app
    entries: []
    uses: [ipc:app:sessions-list, ipc:app:sessions-status, ipc:app:sessions-stop, sdk:agent/useSessions, route:app_sessions/list, route:app_sessions/status, route:app_sessions/stop]
    boundary: [shell, agent-sessions]
    code: [packages/shell/main/app-frame/app-sessions.ts, packages/shell/main/app-frame/app-ipc.ts, packages/shell/preload/app-tool.ts, packages/sdk/agent/use-sessions.ts]
    steps:
      - "sender가 살아 있는 앱 view의 main frame이 아니면 forbidden이다(app-ipc)"
      - "입력(거르기, session)을 확인하고 사람 자격으로 core의 app_sessions.*를 부른다. 어느 앱인지는 sender view에서 main이 정해 싣는다(page가 고르지 못한다). 보이는 범위와 not_found는 core가 판정한다"
      - "useSessions는 화면이 열릴 때 읽고, 앱이 선언에 subscriptions {source lophn, session.*}를 적었으면 session event가 올 때(app-event-view-deliver) 다시 읽는다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 앱 view의 main frame이 아니다(app-ipc)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 맞지 않는다(session이 문자열이 아님 등)"
        observe: [response]
      - id: core-failed
        when: "core가 낸 오류 그대로(not_found: 안 보이는 session, unavailable)"
        observe: [response]
    crosses_process: true
    docs: [architecture/app-call.md, architecture/workspace-session.md]

  - id: app-agents-view
    title: 앱 화면이 agent에게 call을 보내고 읽고, agent 명함을 읽고, 자기가 연 session을 끝낸다
    actor: app
    entries: []
    uses: [ipc:app:agents, sdk:agent/calls, sdk:agent/useAgentCalls, sdk:agent/useAgents, sdk:agent/onCallSettled, sdk:agent/CALL_SETTLED_EVENT, route:app_calls/send, route:app_calls/read, route:app_calls/cancel, route:app_calls/list, route:app_agents/list, route:app_sessions/end]
    boundary: [shell, router]
    code: [packages/shell/main/app-frame/app-agents.ts, packages/shell/main/app-frame/app-ipc.ts, packages/shell/preload/app-tool.ts, packages/sdk/agent/use-calls.ts]
    steps:
      - "sender가 살아 있는 앱 view의 main frame이 아니면 forbidden이다(app-ipc)"
      - "한 channel의 { op, input }에서 op가 목록(sessions.end, calls.send|read|cancel|list, agents.list)에 없으면 invalid_input이다. 있으면 사람 자격으로 해당 core route를 부르고 앱은 main이 sender view에서 정해 덮어쓴다(page가 고르지 못한다). 시야와 입력 검사는 core가 판정한다"
      - "화면에서 보낸 call은 사람이 지켜보는 turn이다. 끝남은 앱이 선언에 subscriptions {source lophn, call.settled}를 적었으면 event로 온다(app-event-view-deliver). useAgentCalls는 그때 다시 읽는다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 앱 view의 main frame이 아니다(app-ipc)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "op가 목록에 없거나 입력이 객체가 아니다"
        observe: [response]
      - id: core-failed
        when: "core가 낸 오류 그대로(forbidden: 정책이 막음, not_found, invalid_input 등)"
        observe: [response]
    crosses_process: true
    docs: [architecture/agent-call.md, architecture/app-call.md]

  - id: app-agent-send
    title: 앱 화면이 보이는 session에 입력을 보낸다(send·stop·answer·rename만)
    actor: app
    entries: []
    uses: [ipc:app:agent-send, route:acp/send, route:sessions/read]
    boundary: [shell, agent-sessions]
    code: [packages/shell/main/app-frame/app-agent.ts, packages/shell/main/app-frame/app-ipc.ts]
    steps:
      - "sender가 살아 있는 앱 view의 main frame이 아니면 forbidden이다(app-ipc)"
      - "입력 type이 send·stop·answer·rename이 아니면 forbidden이다. 승인(decide)과 사람의 composer 조작(run_shell, rewind, fork)은 앱이 못 한다"
      - "session이 이 앱에 보이는지 본다(snapshot과 같은 확인)"
      - "보이면 acp.send를 memory로 보낸다. send 입력에는 sender view의 앱을 via_app으로 덮어 싣는다(page가 준 값은 버린다. 사람 메시지에 붙는 이름표일 뿐이다). 크기 상한과 입력 검사는 AcpSend가 한다. 거절하면 그 code를 그대로 돌려준다"
    outcomes:
      - id: sent
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "sender가 앱 view의 main frame이 아니다(app-ipc), 또는 입력 type이 허용 목록 밖이거나 session이 이 앱에 보이지 않는다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "session 값이 문자열이 아니거나, sessions.read가 그 값을 invalid_input으로 거절했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "core를 쓸 수 없다, 또는 session 읽기가 그 밖의 실패다(internal 등)"
        observe: [response]
      - id: core-failed
        when: "acp.send가 거절했다(AcpSend의 크기·입력 검사, session 상태 등. core의 code를 그대로 돌려준다)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/app-call.md]
    unclear:
      - "입력 검사가 AcpSend 쪽에 있어 invalid-input은 session 값 모양만 본다. 나머지는 sessions 소관이다"

  - id: app-tab-head
    title: 앱 화면이 자기 탭 머리(이름·상태)를 정한다
    actor: app
    entries: []
    uses: [ipc:app:tab-head, ipc:app:tab-head-event]
    boundary: [shell, app-runtime]
    code: [packages/shell/renderer/app-frame/webview-host.tsx, packages/shell/preload/app-tool.ts]
    steps:
      - "page의 preload가 붙자마자 hello를 보내 탭 머리를 보일지 묻는다. renderer는 shown으로 답해 첫 render 전에 깜박이지 않게 한다"
      - "앱이 탭 머리를 보내면 renderer가 그 탭의 head를 바꾼다. null이거나 그릴 것이 없는 값이면 지운다"
      - "새 page의 dom-ready에서 다시 답하고(놓친 답 보충), did-navigate에서 keep-alive 신호를 끈다"
      - "사람이 머리 줄의 탭·action·menu·뒤로·앞으로를 누르면 renderer가 그 element에 tab-head-event를 보내 앱 page가 받는다. shell이 머리 줄을 그리는지(shown)가 바뀔 때도 같은 길로 보낸다. page가 아직 붙기 전이면 보내지 못하고 dom-ready에서 다시 답한다"
    outcomes:
      - id: shown
        when: "page의 hello에 답했다(shown을 보냈다). page가 아직 안 붙었으면 dom-ready에서 다시 보낸다"
        observe: [screen:app-space]
      - id: head-set
        when: "앱이 그릴 것이 있는 탭 머리를 보냈다"
        observe: [screen:app-space]
      - id: head-cleared
        when: "앱이 null이나 그릴 것 없는 값을 보냈다, 또는 main이 같은 자리에 새 element를 만들었다(다시 열기·replace에서 앞 page의 머리를 비운다)"
        observe: [screen:app-space]
      - id: event-forwarded
        when: "사람이 누른 탭·action·menu·back·forward가 앱 page에 닿는다(page가 안 붙었으면 버린다)"
        observe: [screen:app-space]
      - id: ignored
        when: "보낸 element가 지금 page가 아니다(늦은 page의 머리 신호는 버린다)"
        observe: []
    crosses_process: false
    docs: [architecture/app-call.md]

  - id: app-keys
    title: 앱 화면이 선언한 key를 앱 handler가 맞춰 돌리고 삼킨다
    actor: app
    entries: []
    uses: [sdk:app-ui/useCommand, ipc:app:keys, ipc:app:keys-forward]
    boundary: [shell, app-runtime]
    code: [packages/shell/preload/app-tool.ts, packages/sdk/app-ui/use-command.ts]
    steps:
      - "앱 page의 window keydown(capture)을 preload가 page의 listener보다 먼저 받는다. 한글 조합 중이거나 modifier만 누른 key는 맞추지 않고 지나간다"
      - "host가 준 앱 key 글(ipc:app:keys)에 맞고 그 이름의 handler가 있고 when이 참이면 key를 삼킨다. 처음 누른 것이면 handler를 한 번 부른다"
      - "눌러 둔 반복이면 삼키기만 하고 handler는 부르지 않는다"
      - "앱 key가 맞지 않거나 when이 거짓이면 삼키지 않고 shell 글 검사로 넘긴다. shell 글에 맞으면 host로 넘기는 것은 app-keys-forward다"
    outcomes:
      - id: ran
        when: "처음 누른 앱 key가 맞고 handler가 있고 when이 참이다. 삼키고 handler를 부른다"
        observe: [screen:app-space]
      - id: repeat-swallowed
        when: "앱 key가 맞고 when이 참인 눌러 둔 반복이다. 삼키기만 하고 handler를 부르지 않는다"
        observe: []
      - id: when-false
        when: "앱 key가 맞지만 handler의 when이 거짓이다. 삼키지 않고 shell 글 검사로 넘긴다"
        observe: []
      - id: not-mine
        when: "앱 key가 맞지 않거나 맞은 이름의 handler가 없다. 삼키지 않고 shell 글 검사로 넘긴다"
        observe: []
      - id: skipped
        when: "한글 조합 중이거나 modifier만 누른 key다. 맞추지 않고 그대로 둔다"
        observe: []
    crosses_process: false
    docs: [architecture/keybindings.md]

  - id: app-keys-forward
    title: 앱 화면에서 누른 키를 shell 단축키로 넘긴다
    actor: app
    entries: []
    uses: [ipc:app:keys-forward, ipc:app:keys]
    boundary: [shell, app-runtime]
    code: [packages/shell/renderer/app-frame/webview-host.tsx, packages/shell/preload/app-tool.ts]
    steps:
      - "앱 화면에 focus가 가거나 page가 새로 붙으면 renderer가 앱이 선언한 key 목록을 guest에 app:keys로 보낸다"
      - "앱 page가 chord를 app:keys-forward로 보내면 renderer가 그 chord를 shell 단축키 처리기에 넘긴다. chord 판정은 keys area 소관이다"
      - "처리한 뒤 key 목록을 다시 보낸다"
    outcomes:
      - id: ran
        observe: [screen:app-space]
      - id: ignored
        when: "앱 key 목록이 없거나 chord가 문자열이 아니거나 entry가 바뀌었다(응답 없이 버린다)"
        observe: []
    crosses_process: false
    docs: [architecture/keybindings.md]

  - id: app-page-hints
    title: 앱 화면이 자기를 살려 두라고 하거나 자기 크기를 알린다
    actor: app
    entries: []
    uses: [ipc:app:keep-alive, ipc:app:content-size]
    boundary: [shell, app-runtime]
    code: [packages/shell/renderer/app-frame/webview-host.tsx, packages/shell/renderer/app-frame/view-keeps.ts]
    steps:
