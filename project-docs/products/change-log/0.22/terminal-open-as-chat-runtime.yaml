id: terminal-open-as-chat-runtime
version: 0.22.0
title: "터미널 탭: 새 CLI에서 \"Open as chat\"이 첫 메시지 전까지 막힘"
modules: [packages/shell/renderer]
checked: []
change: |
  전: CLI를 켜고 메시지를 보내기 전에는 "Open as chat"이 "The CLI is not the foreground process of this terminal"로 막혔다. SessionStart hook이 1초 foreground poll보다 먼저 오면, 뒤에 `foreground: true`만 더한 agent 알림을 renderer store가 같은 값으로 보고 버렸다(고른 칸만 비교했다). session 이름만 바뀐 알림도 같이 버려졌다.
  후: `TerminalStore.noteRuntime`은 agent 값 전체를 비교한다.
why: |
  renderer store가 알림의 일부 칸만 보고 같은 값으로 판단해 바뀐 상태를 버렸다.
