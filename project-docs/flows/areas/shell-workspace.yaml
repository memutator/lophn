      - packages/shell/main/desktop/core/layout-ipc.ts
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "main은 창의 move와 resize마다 500ms 타이머를 다시 건다. 끝나면 project 창에 moved를 보낸다(움직이는 동안은 한 번으로 모은다). 창이 닫히면 타이머를 지워 보내지 않는다"
      - "project 창이 layout을 저장한다. 저장할 때 main이 살아 있는 detached 창의 bounds를 항목마다 채운다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: saved
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: detached-popup-open
    title: "분리된 창의 page가 크기 준 popup을 연다"
    actor: person
    entries: [ui:detached-popup-open]
    when: "분리된 창 안 page가 browser popup을 연다(window.open)"
    boundary: [shell]
    code:
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/main/desktop/wiring/detached.ts
    steps:
