group: shell
files:
  - path: packages/shell/ipc/app-tab-head_test.ts
    covers:
      - app-tab-head:head-set
      - app-tab-head:head-cleared
    note: "readTabHead가 그릴 값과 그릴 것 없는 값을 가르는 판정(그릴 것 없으면 head-cleared, 글 길이와 항목 수 상한에서 자르면 head-set)"

  - path: packages/shell/ipc/shortcuts_test.ts
    covers: [key-press:command-run]
    note: "main이 창으로 넘기는 shortcut id 판정(isWindowShortcut): 표의 binding id·동적 id·app.panel id만 받는다"

  - path: packages/shell/main/app-frame/annotate_test.ts
    covers:
      - annotate-pick:picked
      - annotate-pick:ignored
      - annotate-send:sent
      - annotate-send:invalid-input
    note: "앱 view가 아닌 sender의 고르기는 무시, 페이지가 보낸 app·release는 버리고 view에서 정한 값만 core에 간다. capture·upload가 실패해도 screenshot 없이 보낸다. 빈 목록 보내기는 거절. preview view의 annotation은 release 없이 bundle hash(preview_bundle)를 싣고 간다"

  - path: packages/shell/main/app-frame/app-call_test.ts
    covers: [app-operation-call:succeeded]
    note: "페이지 입력의 값이 undefined인 칸은 빠지고 core 통로(app_views.call)의 입력 schema를 통과한다. 입력이 없으면 null로 간다"

  - path: packages/shell/main/app-frame/app-projects_test.ts
    covers:
      - app-projects-list:listed
  - path: packages/shell/main/app-frame/app-agent_test.ts
    covers:
      - app-agent-open:opened
      - app-agent-open:not-found
      - app-agent-snapshot:snapshot
      - app-agent-snapshot:forbidden
      - app-agent-send:sent
      - app-agent-send:forbidden
    note: "앱 view는 core가 보인다고 한 session(터미널 탭 제외)만 읽고 보낸다. send·stop·answer·rename만 넘기고 decide·run_shell·rewind는 core 전에 forbidden"

  - path: packages/shell/main/app-frame/overlay-security_test.ts
    covers: [shell-session-policy:granted, shell-session-policy:denied]
    note: "shell 기본 session 권한 판정(clipboard write만 main frame shell 페이지에 허용). shell-session-policy:granted·denied"

  - path: packages/shell/main/app-frame/registry_test.ts
    covers:
      - app-view-open:opened
      - app-view-crash:crashed
      - app-view-reopen:reopened
      - app-view-reopen:conflict
      - app-view-reopen:invalid-input
      - app-view-refresh:remounted
      - app-view-refresh:unavailable
    note: "view 열기의 src와 guest 신원 묶기, core가 정규화한 params만 화면 주소로 감, crash 뒤 reopen 세대 교체, 건강한 view의 reopen 거절, 다른 창의 reopen 거절, 창을 닫으면 core view도 닫음, core가 view를 잃은 뒤 새 release면 card가 아닌 view는 따라가고 card는 unavailable"

  - path: packages/shell/main/artifact/delete_test.ts
    covers:
      - artifact-delete:deleted
      - artifact-delete:forbidden
      - artifact-delete:invalid-input
      - artifact-delete:not-found
    note: "지우기가 그 artifact 폴더만 지우고, symlink 폴더는 거절하며 가리키는 곳은 그대로이고, 폴더 안 symlink는 link만 지우는 것을 temp dir에서 본다"

  - path: packages/shell/main/artifact/navigation_test.ts
    covers:
      - artifact-navigation:same-host
      - artifact-navigation:external-link-opened
      - artifact-navigation:blocked
    note: "artifact page의 main frame·subframe navigation 판정표"

  - path: packages/shell/main/artifact/paths_test.ts
    covers:
      - artifact-serve:served
      - artifact-serve:not-found
      - artifact-serve:method-refused
    note: "봉한 scheme이 이 컴퓨터 root와 다른 컴퓨터 remote 대상 모두에서 밖을 가리키는 path, symlink, 일반 file이 아닌 것, 상한을 넘는 file을 404로 거절하고 GET·HEAD 외를 405로 거절한다. 다른 컴퓨터 view는 local watch와 annotate를 열지 않는다"

  - path: packages/shell/main/artifact/source_test.ts
    covers:
      - artifact-open:opened
      - artifact-open:invalid-source
      - artifact-open:not-found
    note: "artifact 이름 slug, .html 일반 file, workflow view·instance 짝, artifacts 밖 symlink 거절을 resolveSource로 본다"

  - path: packages/shell/main/browser/agent/driver_test.ts
    covers:
      - browser-call-run:done
      - browser-call-run:stale-ref
      - browser-call-run:person-holds
      - browser-call-run:tab-not-open
      - browser-call-run:login-frame-moved
      - browser-call-run:key-not-taken
      - browser-call-run:login-field-lost
      - tab-hand:agent-keys-page-only
    note: "browser driver를 가짜 page로 돌린다. press·type·fill의 key는 모두 page.sendKey로 그 page에만 가고 CDP key 길(Input.dispatchKeyEvent·insertText·ime)은 쓰지 않으며, 보내는 동안 그 page(webContents)가 표시되고(창 단축키로 넘기지 않음) act마다 표시가 켜지고 꺼지며, 마지막 key 뒤 page를 한 번 다녀오고 150ms가 지난 뒤에 풀린다. page가 key를 받지 않으면 남은 글자를 보내지 않고 unavailable이다. 표시된 page에 sendKey 밖에서 온 키는 창이 사람의 focus가 그 page에 있었다고 답하기 전에는 버릴 키다. fill_login은 focus가 칸의 문서 입력칸을 떠나면 멈추고(conflict, 값 없음) 다 친 뒤 글 길이가 다르면 conflict이며, 칸이 새 요소로 바뀌어도 끝까지 친다. fill_login은 core에서 값을 받는 동안 표시하지 않고 치는 동안만 표시한다. agent의 click은 lophn의 mouse로 표시된다. 창이 표시를 받기를 기다리는 사이 온 다음 input(stream의 표시 없는 up 포함)은 먼저 온 input 뒤에 들어간다. typeOnce(한 번 넣기)는 칠 때 frame origin이 card에 보인 origin과 다르면 치지 않고 conflict(오류에도 값 없음)이고 같으면 친다. frame_origin은 ref가 든 frame의 origin을 잰다. fill_login은 ref가 든 iframe의 origin(최상위가 아니다)과 page의 browser profile로 값을 받아 치고 결과에 값이 없으며, 치는 동안 그 frame이 이동하면 멈추고 conflict(오류에도 값 없음). snapshot은 type=password 칸의 value를 찍지 않는다. snapshot마다 ref가 새로 나고 옛 ref(새 snapshot, main frame 이동 뒤)는 conflict이며 새 node를 가리키지 않는다. 사람이 가져간 탭에서 act, navigate, evaluate는 conflict이고 snapshot, screenshot, logs는 된다. bind가 앱 live view를 가리켜도 page를 고르지 않고 unavailable이며 debugger를 붙이지 않는다"

  - path: packages/shell/main/desktop/wiring/driver-input_test.ts
    covers:
      - browser-call-run:person-focus-kept
    note: "driver-input을 가짜 webContents로 돌린다. start를 page를 가진 창에 보내고 그 창의 답만 받으며(다른 창의 답은 버린다), lophn의 mouse로 표시한 누르기는 사람의 것이 아니고 사람의 누르기는 창에 person으로 알리고 그 page의 키를 버리지 않게 하며, page가 사라져도 end를 켤 때의 창에 보낸다"

  - path: packages/shell/renderer/desktop/person-focus_test.ts
    covers:
      - browser-call-run:person-focus-kept
    note: "focus keeper의 판정을 가짜 clock·요소로 본다. 표시가 없으면 아무것도 하지 않는다. 표시 중 focus가 그 page의 webview로 들어가거나 창 문서가 focus를 잃으면 event를 삼키고 되돌리며, timer가 연 dialog와 사람이 누른 다른 page(main의 person)는 그대로 둔다. page에 Tab을 넣은 뒤의 이동은 되돌린다. 사람의 focus가 그 page에 있었으면 start가 알린다. webview가 사라지면 end 없이 표시가 풀린다. 입력칸에 글자를 치는 것은 사람이 focus를 옮긴 것이 아니다"

  - path: packages/shell/main/browser/agent/stream_test.ts
    covers:
      - page-stream:held
      - browser-call-run:person-holds
    note: "실제 take control과 driver를 가짜 page로 잇는다. 멀리서 잡은(page_control held true) 동안 agent의 act, navigate, evaluate는 conflict이고 snapshot은 되며 page_state가 held를 싣는다. 놓으면 다시 된다"

  - path: packages/shell/main/browser/bookmarks_test.ts
    covers:
      - browser-bookmark-save:corrupt-refused
      - browser-bookmark-save:saved
    note: "깨진 bookmarks.json은 add·update·remove가 모두 거절되고 파일 byte가 그대로다(data-loss). 정상 파일에 동시에 add해도 둘 다 남는다"

  - path: packages/shell/main/browser/favicon_test.ts
    covers: []
    note: "favicon byte를 data URL로 바꾸는 판정: 작은 이미지와 대소문자 섞인 content-type은 그대로, 48KB 초과나 content-type 없는 이미지는 resize를 거쳐 32px PNG(실패하면 버림), html 챌린지·쓰레기 바이트·2MiB 초과는 거절, 후보 목록은 중복을 건너뛰고 처음 성공한 것을 쓴다. browser-page-open의 push 상태 중 favicon 칸이지만 outcome은 나뉘지 않는다"

  - path: packages/shell/main/browser/navigation_test.ts
    covers:
      - browser-navigation:allowed
      - browser-navigation:blocked
      - browser-navigation:os-handoff
      - browser-page-open:loaded
      - browser-page-open:invalid-address
    note: "browser page의 main frame·subframe 목적지 판정표(http·https 허용, credential·scheme 차단, mailto·tel는 OS로)와 주소 칸 입력 정리(주소·검색어 판별, 위험 scheme 유지, custom 검색 URL template 검사)"

  - path: packages/shell/main/browser/permission_test.ts
    covers:
      - browser-session-policy:permission-granted
      - browser-session-policy:permission-denied
    note: "browser partition은 main frame http(s)의 clipboard write만 허락한다"

  - path: packages/shell/main/browser/popup_test.ts
    covers:
      - browser-popup:popup-blocked
      - browser-popup:floated
      - browser-popup:docked
      - browser-popup:denied-scheme
      - browser-popup:os-handoff
      - browser-navigation:os-handoff
    note: "사용자 입력 뒤 5초 안에서만 popup을 열고, width와 height가 모두 있을 때만 floated, 아니면 docked. navigation 검사에 걸린 url은 입력이 있어도 거절. lophn이 넣은 input은 popup에는 활동이지만 window.open의 mailto를 OS로 넘기지는 않는다(popup host의 freshPerson)"

  - path: packages/shell/main/browser/user-agent_test.ts
    covers: [browser-session-policy:user-agent-stripped]
    note: "UA 문자열에서 Electron token만 빼는 순수 함수. Google 로그인 때문에 두 번 고친 자리다. browser-session-policy:user-agent-stripped"

  - path: packages/shell/main/browser/webview-guest_test.ts
    covers:
      - browser-guest-attach:attached-browser
      - browser-guest-attach:attached-registered-view
      - browser-guest-attach:rejected
      - browser-guest-attach:first-src-blocked
    note: "webview 붙이기 때 shell이 준 browser partition만 받고 설정을 덮는다. app·artifact는 registry가 받은 src만. 맞지 않는 src는 붙지 않고 scheme이 위험하면 about:blank"

  - path: packages/shell/main/decision-handle/ipc_test.ts
    covers:
      - decision-handle-issue:issued
      - decision-handle-issue:forbidden
    note: "일반 shell 창 본문이 아닌 sender와 고정되지 않은 결정은 forbidden, shell 창의 고정 결정은 handle을 받는다"

  - path: packages/shell/main/desktop/core/host-link_test.ts
    covers: [host-queue-poll:browser-call, host-queue-poll:unhandled, host-queue-poll:reconnect]
    note: "가짜 socket으로 연결이 열리면 hello부터 보내고, 끊기면 1초·2초로 늘려 다시 붙어 hello를 다시 보내며, request가 처리기를 거쳐 response로 가고 처리기가 없는 종류는 unavailable, 끊긴 연결로 받은 요청의 답은 보내지 않는다"

  - path: packages/shell/main/desktop/core/initial-appearance_test.ts
    covers: []
    note: "core 연결 전 settings.json·themes/*.json 동기 읽기로 초기 appearance와 BrowserWindow backgroundColor를 채우는 규칙(누락·오류 칸은 기본값 fallback)"

  - path: packages/shell/main/page-host/idle_test.ts
    covers: [page-host-serve:idle]
    note: "열린 page가 없는 채로 5분 지나면 page host idle watch가 끝나고, page가 열리면 timer가 취소되어 모두 닫힌 뒤 다시 5분을 재며, 중복 0 알림이나 stop 뒤에는 잘못 끝나지 않는다"

  - path: packages/shell/main/page-host/relaunch_test.ts
    covers: [page-host-serve:yielded]
    note: "page host가 물러나며 다시 띄우는 desktop 앱은 늘 page host 자신의 data root(--home, LOPHN_HOME)를 싣고 누른 시작의 LOPHN_HOME은 싣지 않으며, 누른 시작에 display가 없으면 다시 띄우지 않는다"

  - path: packages/shell/main/desktop/detached/ipc_test.ts
    covers:
      - detached-close-silent:closed-kept
      - desk-switch:switched
      - detached-reopen:reopened-kept
      - detached-reopen:reopened
      - detached-tab-changed:sent
      - desk-switch:forbidden
    note: "project 창을 떠날 때 detached 창을 조용히 닫고 PTY 참조는 남긴다(closed-kept). showOnly는 보낸 project 창의 detached 창만 숨기고 보이며 없는 key는 missing으로 답한다. detached 되받기 한 번만 주는 규칙은 detached-reopen:reopened·reopened-kept"

  - path: packages/shell/main/desktop/terminal-clipboard_test.ts
    covers: []
    note: "Electron 44+의 비동기 clipboard.readText·writeText를 await·catch해 IPC 응답이 structured clone 가능한 plain 값으로 나가는지, headless에서는 clipboard를 건드리지 않는지 본다"

  - path: packages/shell/main/desktop/terminal-focus_test.ts
    covers:
      - terminal-input:not-focused
      - terminal-restart:not-focused
      - terminal-respond:not-shown
    note: "shell main이 capability를 싣기 전의 판정(mayCall): focus가 없는 창의 입력·다시 시작과 그 터미널을 보이지 않는 창의 응답은 core에 가지 않는다. renderer allowlist에 terminals/input·restart가 없다"

  - path: packages/shell/main/desktop/navigation-guard_test.ts
    covers: [shell-navigation:allowed, shell-navigation:external-link, shell-navigation:blocked]
    note: "shell 창 main frame의 탐색 판정(lophn-shell://desktop 밖 차단, http·https는 OS browser). shell-navigation:allowed·external-link·blocked"

  - path: packages/shell/main/desktop/oauth-handoff_test.ts
    covers: [shell-oauth-handoff:captured, shell-oauth-handoff:conflict, shell-oauth-handoff:cancelled, shell-oauth-handoff:invalid_input]
    note: "원격 loopback OAuth 임시 listener의 loopback 주소 제한, 맞는 state callback 전달, port 충돌 conflict와 취소 정리"

  - path: packages/shell/renderer/workspace/sidebar/explorer-paste_test.ts
    covers: []
    note: "OS clipboard의 text에서 절대 경로만 고르고, 붙여넣는 그림의 이름이 MIME 확장자를 따른다"

  - path: packages/shell/renderer/desktop/machines/remote-files_test.ts
    covers: []
    note: "원격 project_files adapter의 폴더 목록 cache·in-flight 중복 제거·stale-while-revalidate·동시 갱신 상한, 파일 읽기 cache·mtime 변경·충돌 무효화, 변이 시 영향 폴더만 무효화, truncated 미리 보기와 forbidden 전파"

  - path: packages/shell/main/editor/file-adapter_test.ts
    covers:
      - editor-save:saved
      - editor-save:conflict
      - editor-save:unknown-result
      - file-create:created
      - file-create:name-exists
      - file-copy:copied
      - file-copy:name-exists
      - file-copy:into-self
      - file-copy:forbidden
      - file-write-bytes:created
      - file-write-bytes:name-exists
      - file-write-bytes:too-large
      - file-write-bytes:forbidden
      - file-rename:moved
      - file-rename:name-exists
      - file-rename:into-self
      - file-delete:trashed
      - file-delete:unavailable
    note: "write는 hash가 다르면 conflict로 원본을 안 바꾸고, 쓰기가 끊겨도 원본이 남고 임시 파일을 치운다(unknown-result 갈래로 묶음). 파일 트리의 만들기·옮기기·지우기는 file-create·file-rename·file-delete, 복사와 클립보드 이미지 저장은 file-copy·file-write-bytes"

  - path: packages/shell/main/notice/rule_test.ts
    covers:
      - session-notice:looking
      - notice-alert:toast
      - notice-alert:os-notification
    note: "보고 있으면 알리지 않고, 창이 있으면 toast, 없으면 OS 알림"

  - path: packages/shell/main/secret-input/request_test.ts
    covers:
      - input-request-finish:held
      - input-request-finish:done
    note: "한 번 넣기의 값은 hold(알려진 값 등록)와 치기에만 가고 secrets 저장이나 done 결과에는 없다. 치기가 conflict로 거절돼도 오류에 값이 없다"

  - path: packages/shell/main/secret-input/submit_test.ts
    covers:
      - secret-input:stored
      - secret-input:invalid-input
      - secret-input:unavailable
    note: "secret 제출 실패는 고정 code만 나가고 값은 결과에 남지 않는다. 성공은 이름과 byte 수만 올린다"

  - path: packages/shell/main/thread-bookmarks/store_test.ts
    covers: [thread-bookmark-list:ok, thread-bookmark-list:unavailable, thread-bookmark-set:ok, thread-bookmark-set:unavailable]
    note: "thread bookmark 저장소. 깨진 파일은 set이 덮어쓰지 못하고(data-loss), session별로 켜고 끈다, 같이 부른 set 둘 다 남는다. thread-bookmark-list·thread-bookmark-set"

  - path: packages/shell/main/workspace/global-floats_test.ts
    covers:
      - global-floats-save:saved
      - global-floats-save:rejected
      - global-floats-read:loaded
      - global-floats-read:empty
    note: "전역 float 목록을 쓰고 읽는다. 모양이 틀린 값은 거절하고 파일을 그대로 두며, 틀린 파일이나 다른 schema_version은 빈 목록으로 읽는다"

  - path: packages/shell/main/desktop/viewer/machine-route_test.ts
    covers: [core-machine-route:to-machine, core-machine-route:this-computer]
    note: "권한 경계. machine을 실은 shell:core-call은 그 기계의 길(machines/call)로만 가고, 없거나 이 컴퓨터의 id면 이 컴퓨터의 core로만 간다. 다른 기계나 이 컴퓨터로 새지 않는다"

  - path: packages/shell/main/workspace/window-state_test.ts
    covers:
      - window-state-save:saved
      - window-state-restore:restored
      - window-state-restore:default
    note: "창 자리를 쓰고 다시 읽는다(POSIX 600 권한). 없거나 망가진 파일은 null이라 기본 창으로 연다"

  - path: packages/shell/main/workspace/workspace-layout_test.ts
    covers:
      - layout-restore:fresh-absent
      - layout-restore:restored
      - layout-restore:fresh-corrupt
      - layout-restore:fresh-blocked
