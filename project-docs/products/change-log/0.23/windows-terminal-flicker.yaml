id: windows-terminal-flicker
version: 0.23.179
title: Windows 터미널 문장이 깜빡이며 사라졌다 다시 나타나는 ConPTY·WebGL·catch-up 문제를 고친다
modules: [packages/core/terminals, packages/shell/renderer]
change: |
  - `packages/core/terminals/host/conpty-sync.ts`·`main.ts`·`cli.ts`: Windows ConPTY가 커서 숨김(`?25l`)·줄 지움(`2K/2J`)·다시 쓰기·커서 보임(`?25h`)을 여러 pipe 읽기로 쪼개 내는 조각을 최대 24ms 상한 안에서 묶어 DEC 2026(`\x1b[?2026h`…`\x1b[?2026l`)로 감싸 xterm이 빈 frame 없이 원자적으로 그리게 했다. 같은 치수의 `resize`는 PTY에 다시 보내지 않아 ConPTY 전체 다시 그리기를 막는다.
  - `packages/core/terminals/host/screen.ts`·`packages/shell/renderer/terminal/xterm-view.ts`·`machine-deps.ts`: Windows 로컬 터미널의 `@xterm/headless`와 `@xterm/xterm`에 `windowsPty: { backend: "conpty", buildNumber }`를 전달해 ConPTY 줄 증가·scrollback 호환을 켰다(원격 사본 제외).
  - `packages/shell/renderer/terminal/xterm-view.ts`·`terminal-tab.tsx`: `WebglAddon`을 숨은 `0x0` 컨테이너에 먼저 붙이지 않고 보이는 크기일 때만 붙이며, `dispose()` 시 명시적으로 해제하고 반복 context loss(2회 초과) 시 DOM renderer에 머물러 깜빡임 loop를 막는다. 탭 DOM 재부착 시 `refresh()`로 stale frame을 방지한다.
  - `packages/shell/renderer/terminal/displays.ts`·`screen-copy.ts`: `diffText`를 DEC 2026으로 감싸고, `#catchUp`이 동기 `view.reset()` 뒤 비동기 `replay()`로 빈 화면을 비추지 않도록 `view.replace()`로 한 frame에 갈아 끼우게 했다.
why: Windows 터미널에서 출력·입력 중 문장이 깜빡이며 사라졌다가 다시 나타나는 현상이 ConPTY 조각 분리, 중복 resize, WebGL 숨은 초기화/context loss, 비원자적 catch-up reset이 겹쳐 발생했다.
decisions:
  - text: "ConPTY 동기 출력 보정은 Windows(`win32`) PTY host 경계에서만 적용해 Linux·macOS 출력 스트림을 바꾸지 않는다."
    by: agent
