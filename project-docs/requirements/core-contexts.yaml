schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # place

  - id: req-0004
    status: accepted
    subject: contexts
    statement: context는 project 하나에 속하고, project 하나에는 context가 여러 개 있을 수 있다.
    acceptance:
      - 한 project에 context를 둘 이상 둘 수 있다.
      - 모든 context는 정확히 한 project에 속한다.
    related:
      - projects

  - id: req-0005
    status: accepted
    subject: contexts
    statement: context는 자기 project의 파일과 앱 read app-api(app-data)만 자료로 가리킨다.
    acceptance:
      - 다른 project의 파일을 자료 위치로 적은 계약은 계약 검사에서 거절된다.

  - id: req-0006
    status: accepted
    subject: contexts
    statement: context는 늘 지금의 project 파일을 읽고, 근거는 파일 경로와 section으로만 가리킨다.
    acceptance:
      - 파일을 고친 뒤 context로 찾으면 고친 내용이 결과에 나온다.
      - context가 남긴 근거는 파일 경로와 section으로만 이루어진다.

  # 계약

  - id: req-0007
    status: accepted
    subject: contexts
    statement: context는 project 파일 위의 도메인 계약과, 그 계약을 따르는 검색 script로 이루어진다.
    details:
      contains:
        - 도메인 개체의 type
        - type마다 자료 위치(kind)
        - type의 field
        - type 사이의 관계
        - 검사 규칙
    acceptance:
      - 계약에서 type 하나를 고르면 program이 그 type의 개체 목록과 개체마다 field 값을 계산한다.
      - 계약에 적은 관계로 한 개체에서 이어진 다른 type의 개체를 찾는다.

  - id: req-0008
    status: accepted
    subject: contexts
    statement: 계약에 따른 개체 계산과 검색은 결정적이다.
    details:
      forbids:
        - model 호출로 개체나 검색 결과를 정하는 것
    acceptance:
      - 같은 파일 내용과 같은 계약 판으로 같은 검색을 두 번 돌리면 결과가 같다.
      - 개체 계산과 검색이 model provider를 부르지 않는다.

  - id: req-0009
    status: accepted
    subject: contexts
    statement: 자료 위치 kind는 folder, docs, series, index, section, outline, app-data 일곱이다.
    acceptance:
      - 일곱 kind 각각으로 type의 자료 위치를 선언할 수 있다.
      - 이 밖의 kind를 쓴 계약은 계약 검사에서 거절된다.

  - id: req-0010
    status: accepted
    subject: contexts
    statement: index kind는 README처럼 다른 문서로의 링크를 모은 문서이고, program이 그 링크를 결정적으로 따라간다.
    acceptance:
      - index 문서에 링크된 문서들이 그 type의 개체가 된다.
      - index 문서에 링크를 더하거나 빼면 개체 목록도 그만큼 바뀐다.

  - id: req-0011
    status: accepted
    subject: contexts
    statement: section kind는 section을 개체로 삼는 type과, section을 다른 type의 field로 쓰는 것 둘 다 된다.
    acceptance:
      - "문서 하나의 같은 수준 제목 section 하나하나를 개체로 선언할 수 있다(예: decisions.md의 H2 하나하나가 Decision)."
      - "다른 type의 field 값을 문서의 한 section 본문으로 선언할 수 있다(예: Experiment.question = \"## 질문\" 본문)."

  - id: req-0012
    status: accepted
    subject: contexts
    statement: "outline kind는 파일 하나의 목차 전체를 개체 하나로 삼는다. Markdown 목차는 program이 파싱해 얻고, program이 결정적으로 만들지 못하는 형식(pdf, docs 등)의 목차는 Project Manager가 만들고 고치고 지우며 lophn data의 그 context 아래에 둔다."
    acceptance:
      - "Markdown 파일을 outline kind로 가리키면 program이 파싱한 그 파일의 제목 tree 전체가 개체 하나로 쓰인다."
      - "Project Manager가 pdf 파일의 목차를 만들면 그 context에서 그 파일의 목차로 쓰인다."
      - "Project Manager가 목차를 고치거나 지우면 그 뒤로는 고친 결과가 쓰인다."
    related:
      - agent-roles

  - id: req-0002
    status: accepted
    subject: contexts
    statement: Markdown 파일의 목차(제목 tree)는 저장하지 않고, 쓸 때마다 그 파일을 결정적으로 파싱해 얻는다.
    acceptance:
      - 같은 파일 내용을 두 번 파싱하면 같은 목차가 나온다.
      - 파일을 고친 뒤 목차를 다시 얻으면 고친 내용이 바로 반영되어 있다.

  - id: req-0003
    status: accepted
    subject: contexts
    statement: 문서 탭의 목차와 context 계약의 outline kind는 같은 파싱 결과를 쓴다.
    acceptance:
      - 같은 Markdown 파일에 대해 문서 탭의 Outline 목록과 outline kind가 얻은 목차가 같다.
    related:
      - shell

  - id: req-1484
    status: accepted
    subject: contexts
    statement: Markdown 목차는 ATX(`#`)와 setext(밑줄) 제목만 제목으로 보고, YAML front matter와 fenced code 안의 제목 모양은 제목으로 보지 않는다.
    acceptance:
      - "`#` 제목, 밑줄 제목, front matter와 code block 안의 `#` 줄을 함께 둔 파일의 목차에 실제 제목 둘만 나온다."

  - id: req-1485
    status: accepted
    subject: contexts
    statement: 제목 tree는 제목 level을 따르고, level을 건너뛰면 가짜 제목을 만들지 않고 가장 가까운 위 level 아래에 둔다. section 하나는 자기 제목부터 `#` 수가 같거나 적은 다음 제목 직전까지다.
    acceptance:
      - "`#` 다음에 `###`, 그 뒤 `##`를 둔 파일에서 `###`와 `##`가 모두 `#` 아래에 놓인다."
      - "`##` section의 본문은 다음 `##`나 `#` 제목 직전에서 끝난다."

  - id: req-0013
    status: accepted
    subject: contexts
    statement: app-data kind는 앱의 read app-api 자체를 자료로 가리킨다.
    acceptance:
      - app-data 자료는 앱과 그 앱의 read app-api로 가리킨다.
      - 쓰기 app-api를 app-data로 가리킨 계약은 계약 검사에서 거절된다.
    related:
      - apps

  - id: req-0014
    status: accepted
    subject: contexts
    statement: 반복 문서는 계약의 series kind 이름 pattern(예 reports/weekly-{n}.md)으로 정의한다.
    acceptance:
      - pattern에 맞는 파일들이 그 series의 문서가 된다.
      - pattern에 맞는 파일을 새로 만들면 바로 그 series의 문서가 된다.

  - id: req-0015
    status: accepted
    subject: contexts
    statement: series의 다음 문서 이름은 pattern과 지금 있는 파일에서 결정적으로 계산한다.
    details:
      contains:
        - 정수 번호의 증가와 감소
        - major·minor·patch 판 번호
        - 0으로 채운 자릿수
    acceptance:
      - weekly-1부터 weekly-3까지 있으면 다음 이름은 weekly-4다.
      - 0으로 채운 번호는 다음 이름에서도 같은 자릿수로 채운다.
      - 같은 파일 목록에서 두 번 계산하면 같은 이름이 나온다.

  - id: req-0016
    status: accepted
    subject: contexts
    statement: 계약은 type과 field에 public을 표시하고, 다른 context는 public인 것만 가리킨다.
    acceptance:
      - 다른 context의 public type·field를 가리키는 계약은 검사를 통과한다.
      - 다른 context의 public이 아닌 type·field를 가리키는 계약은 계약 검사에서 거절된다.

  - id: req-0017
    status: accepted
    subject: contexts
    statement: 검색 script는 화면이 그릴 수 있게 검색마다 입력과 결과 모양을 선언한다.
    acceptance:
      - 선언만으로 화면이 그 검색의 입력과 결과를 그린다.
    related:
      - shell

  # 계약 위반

  - id: req-0018
    status: accepted
    subject: contexts
    statement: 문서가 계약을 어기면 program이 결정적으로 감지한다.
    acceptance:
      - 계약을 어기는 파일을 두면 그 context의 위반 목록에 그 파일과 어긴 규칙이 나온다.
      - 어긴 곳을 고치면 그 위반이 목록에서 사라진다.
      - 같은 파일과 같은 계약이면 위반 목록이 같다.

  # 폐기: 언제 감지를 돌릴지는 구현 품질이다. 감지가 결정적이고 고치면 사라지는 것은 req-0018이 맡는다.
  - id: req-0019
    status: rejected
    subject: contexts
    statement: 위반 감지는 계약이 가리키는 경로의 파일이 바뀔 때만 돈다.
    acceptance:
      - 계약이 가리키지 않는 파일이 바뀌면 위반 감지가 돌지 않는다.
      - 계약이 가리키는 파일이 바뀌면 그 context의 위반 감지가 돈다.

  - id: req-0020
    status: accepted
    subject: contexts
    statement: 계약 위반이 생기면 사람에게 알린다.
    acceptance:
      - 새 위반이 감지되면 toast가 뜬다.
      - 그 toast를 누르면 그 context의 위반 목록이 열린다.
    related:
      - shell

  # 계약의 판

  - id: req-0021
    status: accepted
    subject: contexts
    statement: 계약과 검색 script는 판으로 묶고, 판마다 격리 test를 거쳐 통과하면 사람 승인 없이 자동 적용한다.
    details:
      ordering:
        - test가 통과한 판만 적용한다.
    acceptance:
      - test가 통과한 새 판은 사람이 승인하지 않아도 적용된다.
      - test가 실패한 판은 적용되지 않고, 지금 판이 그대로 쓰인다.

  - id: req-0022
    status: accepted
    subject: contexts
    statement: 적용된 계약의 이전 판은 남고, 그 판으로 되돌릴 수 있다.
    acceptance:
      - 새 판을 적용한 뒤 이전 판으로 되돌리면 이전 판의 계약과 검색 script가 다시 쓰인다.

  - id: req-0023
    status: accepted
    subject: contexts
    statement: 계약 test는 그 시점의 문서 snapshot에 대해 돌아, 계약을 망가뜨린 것과 사람이 문서를 계약 밖으로 고친 것을 구별한다.
    details:
      performs:
        - 새 판이 snapshot에서 실패하면 그 판의 적용을 막는다.
        - 사람이 고친 문서가 지금 판의 계약을 어기면 계약 위반으로 감지한다.
      preserves:
        - snapshot은 test가 도는 동안만 쓴다.
    acceptance:
      - 새 판이 원래 통과하던 문서에서 실패하면 그 판은 적용되지 않는다.
      - 사람이 문서를 계약에 어긋나게 고치면 판 적용 실패가 아니라 계약 위반으로 나타난다.
      - test가 끝나면 snapshot이 남지 않는다.

  - id: req-0024
    status: accepted
    subject: contexts
    statement: Project Manager가 계약을 고치는 동안 그 context를 쓰는 agent는 지금 적용된 판을 쓴다.
    acceptance:
      - 초안이 있는 동안 Operator가 그 context로 찾으면 적용된 판의 결과가 나온다.
    related:
      - agents

  # saved view

  - id: req-0025
    status: accepted
    subject: contexts
    statement: saved view는 검색 script 호출에 고정 입력과 이름을 붙여 저장한 것이고, 열 때마다 script로 다시 계산한다.
    details:
      preserves:
        - saved view는 한 context에 딸린다.
    acceptance:
      - saved view를 열면 저장한 입력으로 그 검색을 지금 파일에 대해 다시 돌린 결과가 나온다.
      - 결과에 들 파일이 바뀐 뒤 다시 열면 바뀐 결과가 나온다.

  - id: req-0026
    status: accepted
    subject: contexts
    statement: saved view는 사람이 검색 결과에서 저장하거나 Project Manager가 미리 둔다.
    acceptance:
      - 사람은 검색 결과 화면에서 지금 입력을 saved view로 저장한다.
      - Project Manager가 둔 saved view가 그 context의 saved view 목록에 나온다.

  # 용어집

  - id: req-0027
    status: accepted
    subject: contexts
    statement: 용어집은 계약과 따로 두는, agent가 사람 말을 알아듣기 위한 자료다.
    acceptance:
      - 용어집을 바꿔도 계약 검사와 검색 결과는 바뀌지 않는다.
      - 그 context를 쓰는 agent는 용어집을 읽을 수 있다.

  - id: req-0028
    status: accepted
    subject: contexts
    statement: 용어의 뜻은 Project Manager와 사람 둘 다 정하고 고친다.
    acceptance:
      - 사람이 화면에서 용어의 뜻을 정하고 고칠 수 있다.
      - Project Manager가 사람의 확인 없이 용어의 뜻을 정하고 고칠 수 있다.
    related:
      - agent-roles
