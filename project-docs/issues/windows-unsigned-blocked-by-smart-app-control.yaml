id: windows-unsigned-blocked-by-smart-app-control
title: "Smart App Control이 켜진 Windows 11에서 서명 안 한 `lophn-desktop.exe`가 실행되지 않는다"
kind: bug
status: open
topic: platform
modules: [tools]
now: |
  `tools/package/main.ts --dir`가 만든 `build\win\builder\win-unpacked\lophn-desktop.exe`는 서명이 없다(`Get-AuthenticodeSignature` NotSigned, build log `no signing info identified, signing is skipped`). Smart App Control이 켜진 Windows 11(`HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy` `VerifiedAndReputablePolicyState`=1)에서 어느 폴더에서 띄워도 "An Application Control policy has blocked this file"로 막힌다. 같은 PC에서 `node_modules\electron\dist\electron.exe`(서명됨)를 쓰는 `npm run dev`는 돈다. `architecture/platform.md`는 서명한 설치 묶음을 비목표로 둔다.
impact: |
  Smart App Control이 켜진 PC의 사람은 lophn 설치본을 아예 띄우지 못한다. Smart App Control은 끄면 Windows를 초기화하기 전에는 다시 켤 수 없어 사람에게 끄라고 하기 어렵다. Windows 실기의 설치본 확인(한글 경로의 CLI launcher 등)도 이런 PC에서는 못 한다.
fix: |
  - Windows 묶음을 code signing 인증서로 서명한다(electron-builder `win.signtoolOptions`·Azure Trusted Signing 등). 중간. 인증서 비용과 secret 관리가 든다. 추천.
  - 서명 전까지 설치 안내에 Smart App Control이 켜진 PC에서는 돌지 않는다고 적는다. 작음.
decide: |
  `platform.md`의 비목표(서명한 설치 묶음)를 Windows만이라도 풀지.
