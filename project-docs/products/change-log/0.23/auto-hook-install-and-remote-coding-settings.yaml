id: auto-hook-install-and-remote-coding-settings
version: 0.23.100
title: coding agent 전역 hook을 처음 감지·열기 때 자동으로 설치하고(Settings 제거 시 영구 opt-out), 원격 Settings › Coding agents를 연다
modules:
  - packages/protocol
  - packages/core/terminal-agents
  - packages/core/main
  - packages/shell/main
  - packages/shell/renderer
change: |
  - 전역 hook 자동 설치 + 영구 opt-out: 터미널에서 harness를 처음 감지하거나 `coding_sessions/open`으로 세션을 열 때 로컬 창 dialog(`HookInstallAsked` / `coding_agents/hook_answer`)로 묻지 않고 `dry_run`이 `missing`이면 즉시 전역 hook을 자동 설치하고 `HookInstallFinished`를 낸다. 화면 없는 VM이나 폰·원격에서 연 터미널에서도 첫 실행부터 상태·알림·Push·GUI 전환이 동작한다.
  - 사용자가 Settings › Coding agents에서 `[Uninstall hooks]`를 누르면 `<data root>/terminal-agents/hooks-opt-out.json`에 영구 opt-out으로 기록해 재기동 후에도 자동 재설치하지 않는다. 다시 `[Install hooks]`를 누르면 opt-out이 해제된다.
  - 원격 Settings › Coding agents 열기: `coding_agents/list`, `coding_agents/refresh`, `coding_agents/hook_status`, `coding_agents/install_hooks`, `coding_agents/uninstall_hooks`를 `REMOTE_PERSON_ROUTES`에 추가하고, `MACHINE_PANES`와 `otherMachineData`에 `coding` 항목을 연결해 허락받은 다른 컴퓨터에서도 원격 기계의 coding agent 감지와 hook 설치·제거를 다룰 수 있게 했다.
  - 사용하지 않는 `HookInstallAsked`, `hookAskSchema`, `coding_agents/hook_answer`, `packages/core/terminal-agents/hook-ask.ts`를 제거했다.
why: |
  기존 hook 설치는 로컬 Electron 창 dialog에 기대어 있어, 화면 없는 VM이나 폰·원격 컴퓨터에서 연 터미널에서는 항상 자동 거절되어 hook이 깔리지 않고 완료·승인 대기 알림도 오지 않았다. lophn의 hook은 `LPN_TERMINAL_HOOK` 환경 변수가 없으면 no-op이고 소유 항목만 원자적으로 패치·제거하므로, 자동 설치 + 명시적 제거 시 영구 opt-out과 원격 Settings 제어로 전환한다.
decisions:
  - text: coding agent 전역 hook은 묻지 않고 자동 설치하되, Settings에서 명시적으로 제거한 harness만 영구 opt-out으로 기억해 다시 설치하지 않는다.
    by: person
  - text: "`coding_agents/*` 다섯 route를 `REMOTE_PERSON_ROUTES`(터미널 입력 허락 기기 전용)에 열어 원격 `Settings › Coding agents`에서 감지와 hook 관리를 할 수 있게 한다."
    by: agent
checklist:
  - 화면 없는 VM이나 다른 컴퓨터에서 처음 coding agent를 띄울 때 dialog 없이 hook이 자동 설치되고 완료·대기 알림이 오는지 확인한다
  - Settings › Coding agents에서 `[Uninstall hooks]` 후 core를 재기동해도 자동 재설치되지 않는지, `[Install hooks]`로 다시 켜지는지 확인한다
  - 다른 컴퓨터의 `Settings of <기계>`에서 Coding agents 항목이 열리고 원격 기계의 감지·hook 설치·제거가 동작하는지 확인한다
