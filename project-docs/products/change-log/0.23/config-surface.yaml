id: config-surface
version: 0.23.33
title: 설정을 명령과 home의 lophn agent가 바꾸고, 켜진 창이 바로 따라 바뀐다
modules: [packages/protocol, packages/core/config, packages/core/main, packages/core/agent-workspaces, packages/core/lophn-agent, packages/core/approvals, packages/cli, packages/shell/main, packages/shell/renderer, packages/shell/preload, packages/shell/ipc, tools]
change: |
  - 명령 `lophn settings set <key> <value>`와 `lophn settings unset <key>`를 더했다. 값은 글자 설정이면 글 그대로, 아니면 JSON이다. 답에 바꾸기 전 값(`previous`)이 실린다. lophn agent에게는 home workspace에서만 있다.
  - `lophn settings get`은 key 없이 부르면 설정마다 값과 한 줄 설명을, key를 주면 설명 전체·값·기본값·JSON Schema를 보인다. key 앞부분(`shell`)을 주면 그 아래 설정을 보인다.
  - 설정 선언에 설명(영어, 필수), 뜻 검사, locked가 생겼다. route `settings/list`의 항목에 `description`과 `locked`가 실린다.
  - core가 설정을 바꿀 때 뜻까지 검사하고 이유를 돌려준다: 없는 theme id와 모드가 다른 theme, 쓸 수 없는 theme, 모르는 단축키 id와 읽을 수 없는 chord, 글꼴 이름으로 쓸 수 없는 글자. 전에는 모양만 보고 받아서 shell이 조용히 기본값으로 그렸다.
  - route `settings/update`를 agent도 부른다(전에는 user만). locked인 설정은 agent가 바꾸지 못하고(`rejected`의 reason `locked`), 명령은 누가 부르든 거절한다(forbidden). locked인 것: shell 승인 규칙, call 정책, 팀 한도, turn 한도, MCP server, skill folder, 끈 skill, coding agent에게 준 앱, extension 켜기, coding agent 즐겨찾기와 실행 명령어(`shell.coding_agents`). 답에 `notes`(쓰되 알릴 것)와 rejected의 `message`가 생겼다.
  - 색 theme file(`<data root>/themes/<id>.json`)이 core의 설정이 되었다. key는 `shell.themes.<id>`이고 `settings set`으로 쓰고 `settings unset`으로 지운다. core가 folder를 만들고 읽고 지켜본다. `settings/list`의 `folders`에 항목과 읽지 못한 file이 실린다. theme을 쓰면 버린 색과 모자란 대비가 `notes`로 돌아온다. 사람이 folder에 file을 두는 길은 그대로다. 같은 이름의 file이 이미 있는데 읽지 못한 것이면(JSON이 깨졌다 등) 덮지 않고 거절한다. file의 자리와 모양은 그대로라 옮길 data가 없다.
  - 켜진 shell이 설정 변경을 따른다. shell main이 core 설정의 사본을 두고 `SettingsChanged`마다 다시 읽어 모양 CSS와 main이 먼저 받는 단축키를 맞춘다. 창은 같은 event로 모드, 단축키, 빠른 실행·작업 표시줄·tray, 읽기 폭, 열려 있는 Settings 화면을 다시 읽는다. 전에는 core에 다시 붙거나 그 Settings 화면을 열어야 반영됐다.
  - IPC `shell:appearance`, `shell:themes`, `shell:themes-changed`, `shell:keybindings`와 preload의 `lophnKeybindings`, `lophnAppearance.set`·`themes`·`onThemesChanged`를 지웠다. `shell:themes-folder`(폴더 열기)만 남았다.
  - 단축키 표와 문법을 `packages/shell/ipc`에서 `packages/protocol/shell`로 옮겼다. core가 design의 설정 규칙(`appearance.ts`, `themes.ts`)을 import한다(`tools/check-deps.ts`의 `DESIGN_FOR_CORE`).
  - home prompt에 설정을 바꾸는 법과 theme을 만드는 법을 적었다.
why: |
  사람이 lophn 설정을 home의 lophn agent에게 말로 시키고 싶어 했다("theme 만들어서 적용시켜줘"). 설정을 바꿀 길이 Settings 화면뿐이었고, 값이 맞는지 아는 규칙과 화면에 적용하는 길이 shell에만 있어 밖에서 바꾸면 틀려도 모르고 켜진 창도 따라 바뀌지 않았다. theme 하나를 위한 명령이 아니라, 설정을 한 번 선언하면 화면·명령·agent가 같이 쓰는 기반으로 만들었다(roadmap `config-surface`, 설계는 `architecture/settings.md`).
decisions:
  - text: >-
      기반으로 만든다. 설정이나 설정 묶음마다 명령을 두지 않는다("하나 추가할 때마다 하나 추가하고 그런 게 아니라").
    by: person
  - text: >-
      화면 동작(탭, desk 배치)은 넣지 않는다. 필요한 것은 이미 명령으로 있다.
    by: person
  - text: >-
      agent는 설정을 묻지 않고 바로 바꾼다. 사람의 요청에서 시작하고 되돌리기 쉽고 위험이 낮다.
    by: person
  - text: >-
      agent가 할 수 있는 일의 범위를 정하는 설정은 선언의 locked로 막는다. CLI binary는 user token을 써서 actor로는 터미널의 coding agent를 가릴 수 없다. roadmap에 적은 목록에 extension 켜기, 팀 한도, turn 한도, coding agent 실행 명령어를 더했다(extension은 agent에게 tool을 주고, 실행 명령어는 사람의 터미널에서 도는 글이다).
    by: agent
  - text: >-
      theme file을 설정의 한 종류(항목마다 file 하나인 묶음)로 두었다. 버린 길: theme 전용 명령과 route, home agent에게 themes folder 쓰기 권한 주기(검사 결과가 돌아오지 않는다).
    by: agent
  - text: >-
      선언은 core에 두고 뜻 검사의 규칙만 design과 protocol에 두어 core가 import한다. roadmap에는 "선언을 core와 shell이 같이 import하는 곳에 둔다"고 적었으나, theme 검사에 design의 token 목록이 필요하고(protocol은 design을 쓸 수 없다) shell은 값을 설정 사본으로 읽어 선언을 import할 일이 없었다.
    by: agent
  - text: >-
      내장 skill은 만들지 않고 home prompt 몇 줄로 두었다. 무엇을 바꿀 수 있는지는 `settings get`의 설명이 말한다.
    by: agent
  - text: >-
      appearance의 0.2.0 결정 "시작 때 값은 renderer가 core에서 읽어 main에 보낸다"를 뒤집었다. main이 core 설정의 사본을 따른다.
    by: agent
follow_up: |
  단축키의 겹침과 coding agent 즐겨찾기의 harness id는 core가 검사하지 않는다(`architecture/settings.md` "열린 것"). 로그인 때 자동 시작, OS 전역 단축키, 언어는 아직 설정이 아니다(roadmap 순서 2).
checklist:
  - "home의 lophn에게 \"dark theme을 Tokyo Night로 바꿔 줘\"라고 하면 열린 창이 바로 바뀌는지 본다"
  - "home의 lophn에게 새 색 theme을 만들어 적용해 달라고 하면 Settings › Appearance의 theme 목록에 나오고 적용되는지 본다"
  - "터미널에서 `lophn settings set shell.text_size large`를 치면 열린 창의 글자가 바로 커지는지, `lophn settings unset shell.text_size`로 돌아오는지 본다"
  - "Settings › Appearance와 Keyboard에서 값을 바꾸면 전처럼 바로 적용되는지 본다"
