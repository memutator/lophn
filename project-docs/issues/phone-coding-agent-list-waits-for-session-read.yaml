id: phone-coding-agent-list-waits-for-session-read
title: 폰의 새 session에서 coding agent 목록이 호출 하나가 끝날 때까지 아예 그려지지 않는다
kind: bug
status: open
topic: remote
modules: [packages/mobile]
now: |
  coding agent 목록은 상수다(`packages/protocol/extensions/acp-session.ts`의 `GUI_HARNESSES`: claude, codex, opencode, omp, antigravity). 컴퓨터가 설치된 CLI를 찾아보는 일은 없다. 그런데 폰의 묶음(`packages/mobile/src/screens/coding/pick.tsx`)은 `useCodingSessions(project)`의 답(`coding_sessions/list`)이 오기 전에는 null을 그린다. 그 읽기는 화면이 뜰 때마다 loading에서 새로 시작하고 앞 값을 두지 않는다. 묶음은 새 session의 `Sheet` 안에 있고 kit의 `Sheet`는 닫혀 있으면 안을 mount하지 않아, 읽기가 sheet를 연 순간에야 시작하고 열 때마다 다시 기다린다. 컴퓨터는 이 route에 memory에서 바로 답하므로 늦는 것은 remote 왕복과 그 앞에 줄 선 호출(한 번에 8개)이다. 그 답이 필요한 것은 "lophn 앱이 꺼져 있다" 같은 상태 줄뿐이다.
impact: |
  사람이 새 session에서 coding agent를 고르려고 열면 목록 자리가 한동안 비어 있어 없는 것처럼 보인다. 연결이 느리거나 다른 호출이 많을 때 더 길다.
fix: |
  - 작음(추천): 목록을 상수에서 바로 그리고, 읽기가 오면 상태(앱이 꺼짐, 붙지 않음)를 얹는다. 답이 오기 전에는 고르기를 누를 수 없게 둔다.
  - 작음: 위에 더해 sidebar가 이미 읽고 있는 `coding_sessions/list` 값을 같이 써 sheet가 기다리지 않게 한다.
  - 필요 없음: 기계마다 목록을 폰에 저장하기. 목록이 상수라 저장할 것이 없다. 기계마다 설치된 agent만 보이게 하려면 컴퓨터가 CLI를 찾아보는 새 기능이 든다.
