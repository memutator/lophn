id: steer-ux-hidden-in-composer
title: turn이 도는 동안 composer에서 바로 steer로 보낼 단추가 없고 단축키도 대부분 비어 있다
kind: bug
status: open
topic: agent-chat
modules: [packages/shell/renderer, packages/protocol, packages/core/extensions]
now: |
  lophn agent와 다섯 harness GUI 모두 `steer`를 지원하지만, turn이 도는 동안 `packages/shell/renderer/conversation/composer/agent-composer.tsx`의 보내기와 Enter는 늘 `next_turn`(줄 서기)으로만 가고 접힌 Queue 막대를 열어 `[Send now]`를 한 번 더 눌러야 steer가 된다. 글을 치기 시작하면 멈춤 단추가 사라지고, `agent.send-now`(`packages/protocol/shell/keybindings.ts`)는 기본값이 비어 있으며(`claude`만 `Ctrl+Enter`), 줄에 이미 메시지가 있으면 지금 치던 글 대신 첫 줄을 보낸다.
impact: |
  일하는 중인 agent에게 방향을 바로 고쳐 주려면 세 단계를 거쳐야 하고 도는 turn을 멈추려면 치던 글을 비워야 한다.
fix: |
  - 중간(추천): 도는 중 `caps.steer`이면 composer에 Queue와 Steer 동작을 함께 두고 멈춤 단추를 유지하며, 전역 `agent.send-now` 단축키를 두고 입력칸에 글이 있으면 그 글을 steer하게 한다.
decide: |
  도는 중 기본 Enter를 지금처럼 줄 서기(Queue)로 두고 보조 단추·단축키로 Steer할지, 기본을 바꿀지 사람이 정한다.
