schema_version: 1
catalog: ../boundary-catalog.yaml
interfaces:
  - package-spi
requirements:

  # package의 종류와 목록

  # 폐기: 종류는 이름표일 뿐이고 이것으로 달라지는 동작이 없다. 프로그램이 package마다 다르게 다루는 것은 요구 permission이고 req-1001, req-0881이 맡는다.
  - id: req-1000
    status: rejected
    subject: package-registry
    statement: "package는 component, capability, domain 세 종류 중 하나이고 한 package는 한 종류만 담는다."
    acceptance:
      - "세 종류 밖의 종류로 선언한 package나 두 종류를 함께 담은 package는 거절된다."
      - "세 종류 중 하나만 담은 package는 통과한다."

  - id: req-1001
    status: accepted
    subject: package-registry
    statement: "coding agent와 App Engineer는 package마다 이름, 목적, 쓸 수 있는 정확한 버전, 공개 API와 type, 요구 permission, 예제를 읽을 수 있다."
    acceptance:
      - "목록의 package 하나에서 이름, 목적, 쓸 수 있는 정확한 버전, 공개 API와 type, 요구 permission, 예제를 읽을 수 있다."
    related:
      - coding-agent
      - agent-roles

  - id: req-1002
    status: accepted
    subject: package-registry
    statement: "package 목록에는 lophn이 설치와 함께 주는 SDK package와 사용자 package가 함께 나오고, package 버전의 사용처는 그 버전을 고정 의존으로 쓰는 release에서 찾는다."
    acceptance:
      - "어떤 버전을 고정 의존으로 쓰는 release를 만들면 그 package 버전의 사용처로 그 release가 나온다."
      - "그 버전을 쓰지 않는 release는 사용처에 나오지 않는다."

  # 버전

  - id: req-1003
    status: accepted
    subject: package-registry
    statement: "package 버전은 완전한 SemVer 하나로 고정하고, 범위나 latest 같은 암묵적 선택은 거절한다."
    acceptance:
      - "버전 범위나 latest로 package를 고르면 거절된다."
      - "완전한 SemVer 버전으로 고르면 통과한다."

  # 폐기: lophn이 읽기 전용 설치 사본에서 직접 bundle에 복사하므로 사본이 달라질 틈이 없다(req-1007).
  - id: req-1004
    status: rejected
    subject: package-registry
    statement: "release bundle에 담긴 package 의존의 내용 hash는 공개한 package의 내용 hash와 일치한다."
    acceptance:
      - "bundle의 의존 내용이 공개 내용과 다르면 hash 불일치로 거절된다."
      - "공개 내용과 같으면 통과한다."

  - id: req-1005
    status: accepted
    subject: package-spi
    statement: "공개한 같은 이름과 버전의 code, 안내, 내용 hash는 바뀌지 않고 변경은 새 버전으로 추가된다."
    acceptance:
      - "공개한 이름과 버전의 내용을 바꾸려 하면 거절된다."
      - "변경을 새 버전으로 내면 받아들여지고 이전 버전의 code, 안내, 내용 hash는 그대로다."

  - id: req-1006
    status: accepted
    subject: package-spi
    statement: "patch는 API와 동작을 유지한 수정, minor는 기존 API를 유지한 추가, major는 API나 동작의 제거·변경 또는 요구 permission 증가이며, 공개 안내에서 세 변경을 구별한다."
    acceptance:
      - "API와 동작을 유지한 수정은 patch로 안내에 나온다."
      - "기존 API를 유지한 추가는 minor로 안내에 나온다."
      - "API나 동작의 제거·변경이나 요구 permission 증가는 major로 안내에 나온다."

  # 설치된 사본과 의존 고정

  - id: req-1007
    status: accepted
    subject: package-registry
    statement: "설치된 공개 package 사본은 읽기 전용이라 실행 중인 앱이 고칠 수 없다."
    acceptance:
      - "실행 중인 앱이 설치된 package 사본을 고치려 하면 거절되고 사본의 내용은 그대로다."

  - id: req-1008
    status: accepted
    subject: package-registry
    statement: "lophn 설치와 update는 새 package 버전만 추가하고, 기존 앱의 의존은 새 release를 만들기 전에는 바뀌지 않는다."
    acceptance:
      - "update로 새 package 버전이 들어온 뒤에도 기존 앱 release의 고정 의존은 그대로다."
      - "새 release를 만들 때에야 앱의 의존을 새 버전으로 고를 수 있다."

  # 사용자 package

  - id: req-1009
    status: accepted
    subject: package-registry
    statement: "App Engineer는 앱 코드의 일부를 사용자 package로 낸다. 낼 때 이름(`@me/…`), 정확한 버전, code, 안내(목적, 공개 API와 type, 예제), 요구 permission, test를 함께 내고, lophn은 test가 통과한 것만 SDK package와 같은 읽기 전용 사본으로 두어 목록에 올린다."
    acceptance:
      - "안내나 버전이 빠진 package를 내면 거절된다."
      - "test가 실패한 package는 목록에 올라가지 않는다."
      - "낸 package가 목록에 나오고, 다른 앱의 release가 그 정확한 버전을 의존으로 써서 준비된다."
      - "낸 package의 사본을 고치려 하면 거절된다."
    related:
      - agent-roles
      - app-releases
