id: app-screen-talks-to-agent
version: 0.18.0
title: "앱 화면이 ACP로 agent와 이야기한다(`@lophn/agent`)"
modules: [packages/protocol, packages/shell/ipc, packages/shell/preload, packages/shell/main, packages/sdk, packages/core/apps, packages/core/agent-workspaces, tools]
checked: [architecture-annotation, architecture-ui-kit, architecture-approval, architecture-activation, architecture-testing, architecture-layers, architecture-workflow, architecture-agent-definition, architecture-eval, architecture-artifact, context-component-registry, tool-check, tool-check-deps, tool-doctor, tool-e2e, skill-ui-design]
change: |
  전: 앱 화면이 lophn에 닿는 길은 `lophnApp`의 넷(operation 호출, 외부 link, 탭 머리 줄 둘)뿐이었다. 앱 화면에서 agent에게 보내는 길도, agent 답을 앱이 받는 길도 없었다.
  후:
  - `lophnApp.agent`(`open({agent})`, `snapshot(session)`, `onUpdate(listener)`, `send(input)`)가 생겼다. shell main이 sender view에서 앱을 정해 사람 자격으로 `OpenSession`, `AcpSnapshot`, `AcpSend`에 넘기고, `AcpUpdated`를 그 view로 보낸다. 열기는 늘 그 앱 place이고, 그 앱 place의 session이 아니면(home, project, 다른 앱, 없는 session) `forbidden`이다. 앱이 연 session은 보통 session이라 sidebar와 채팅 탭에도 보인다.
  - SDK `@lophn/agent` 1.0.0: `useAgentSession({agent})`(첫 send에서 session을 열고 ACP 상태를 React state로), `contextBlock({name, mimeType, text})`(앱 context를 `resource` block으로), `send(blocks, {reply: schema})`(그 turn 마지막 agent 메시지의 JSON을 꼴에 맞춰 값으로, 안 맞으면 오류로). 앱 template의 `package.json`과 `lophn.ts`가 이 package를 의존으로 싣고, 화면 build의 고정 의존 목록에 들었다.
  - 앱을 짓는 agent는 template `AGENTS.md`와 `design-app` skill에서 "앱 화면에서 agent와 이야기할 때는 `@lophn/agent`"를 읽는다(`products/AGENT.md` A22).
  - wireframe 앱 place에 코딩 코치 앱 화면 넷(보내기 전, 도는 중, 줄 주석, 꼴 오류)이 늘었다.

  검증: 실제 model이나 harness를 부르지 않았다. bridge는 가짜 core 호출로 경계 test를, SDK는 가짜 bridge와 type으로 만든 fixture로 확인했다. 설치 사본은 `installSdkCopies`로 깔아 template의 tsconfig로 `tsc --noEmit`와 esbuild bundle을 돌려 확인했다(npm install은 하지 않았다). 앱 화면에 갱신이 실제로 닿는지는 Electron에서 돌려 보지 않았다.
why: |
  roadmap agent-platform 단계 5. 사람이 앱 화면도 ACP의 화면이고 앱이 context의 prompt 조립을 정하게 하자고 했다(2026-11-02). agent가 앱 화면을 읽거나 조작하는 길은 뺐다(2026-11-04).
decisions:
  - text: |
      앱 화면에서 보낸 것은 그 앱을 쓰는 사람의 메시지이고 따로 허락 단계를 두지 않는다. 사람이 정했다(2026-11-04).
    by: person
  - text: |
      앱과 session 사이는 ACP 그대로이고 bridge는 route 셋과 event 하나만 그 앱 place로 묶는다. prompt 조립과 답 꼴은 앱과 SDK의 몫이고 core는 꼴을 모른다.
    by: agent
  - text: |
      session은 화면을 열 때가 아니라 첫 send에서 연다. 열 때마다 sidebar에 session이 하나 생겨서다. 화면이 열릴 때마다 새 session이고 앞 session에 다시 붙는 길은 아직 없다.
    by: agent
  - text: |
      답 꼴 검사는 JSON schema의 `type`, `properties`, `required`, `items`, `enum`만 본다. 검사 library를 들이지 않았다.
    by: agent
  - text: |
      설치 사본은 앱 bundle 안에서 zod와 저장소 없이 읽히므로 ACP type의 zod 없는 사본(`packages/sdk/agent/acp-types.ts`)을 두고, 정본과 서로 대입되는지 type 검사로 맞춘다. 버린 길: `reduceAcp`의 import 범위(protocol·base file 51개와 zod)를 vendor하기는 앱에 zod를 더해야 하고 base의 한 file이 앱 tsconfig에서 깨진다. protocol의 ACP type을 zod 없는 정본으로 옮기기는 이 계획보다 크다.
    by: agent
  - text: |
      bridge type은 `LophnAppAgent<State, Update, Input>`이고 SDK가 ACP type을 채운다. 이 portable entry가 `protocol/acp`를 import하면 shell main tsc가 base까지 읽어 깨져서다.
    by: agent
  - text: |
      SDK가 보내는 입력은 `send`, `stop`, `answer`뿐이다. 승인 결정은 lophn 채팅 탭에서 한다.
    by: agent
follow_up: |
  기존 앱이 SDK를 쓰려면 `package.json`과 `lophn.ts`에 `@lophn/agent` 1.0.0을 더한다. 새 판 core를 띄우면 data root에 SDK 사본이 깔린다.
