  - id: model-catalog-auto-update
    title: "기동할 때 model catalog를 24시간마다 models.dev에서 받는다"
    actor: system
    entries: [system:model-catalog-auto-update]
    boundary: [models]
    code: [packages/core/lophn-agent/models/work.ts, packages/core/lophn-agent/models/catalog-refresh.ts, packages/core/lophn-agent/models/adapters/models-dev.ts, packages/core/main/agent-runtime/main.ts]
    steps:
      - "agent runtime이 뜰 때 설정 lophn-agent.model.catalog_auto_update를 한 번 읽는다. 기본은 켜짐이고 다음 기동부터 적용된다"
      - "켜져 있고 마지막 확인 뒤 24시간이 지났거나 기록이 없으면 models.dev를 ETag와 함께 받는다. 같은 갱신이 진행 중이면 그것을 기다린다"
      - "200이면 본문 크기와 항목 schema를 모두 검사한 뒤에만 models_dev 층을 통째로 바꾸고 catalog.json과 catalog-state.json을 쓴다"
      - "304면 확인 시각만 바꾼다. 실패하면 마지막 정상본을 두고 state에 실패 사유만 남긴다"
    outcomes:
      - id: received
        observe: ["disk:<root>/derived/lophn-agent/catalog.json", "disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: unchanged
        when: "304 응답이다. 항목은 그대로이고 확인 시각만 바뀐다"
        observe: ["disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: rejected
        when: "본문이 상한을 넘거나 JSON 또는 항목 검증에 하나라도 걸렸다. 마지막 정상본을 유지하고 last_failure를 invalid_input으로 남긴다"
        observe: ["disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: failed-unavailable
        when: "네트워크 실패이거나 200·304가 아니다. 마지막 정상본을 유지하고 last_failure를 unavailable로 남긴다"
        observe: ["disk:<root>/derived/lophn-agent/catalog-state.json", "request:models-dev"]
      - id: skipped
        when: "설정이 꺼져 있거나 마지막 확인 뒤 24시간이 지나지 않았다. 요청이 나가지 않는다"
        observe: ["request:models-dev"]
    crosses_process: true
    risk: [sandbox]
    refs: []
    docs: []
    unclear:
      - "사람이 지금 받기를 누르는 refreshNow를 부르는 곳이 저장소에 없다"
