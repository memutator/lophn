    steps:
      - "Settings의 [Uninstall hooks]를 누르면 shell main이 exec한다. 누른 것이 허락이라 묻지 않는다"
      - "lophn 항목만 알아본다(command가 lophn hook으로 시작, 표시 block, lophn 이름의 file). 사람이 더한 항목은 남긴다"
      - "글 형식은 놓기 전 byte로 돌아가고, 우리 것만 남은 event key와 file은 지운다. Codex는 우리 trust 기록을 지운다"
      - "그 harness의 skill 폴더에서 lophn이 쓴 공유 사본도 지운다"
      - "설정을 파싱할 수 없거나 사람 항목이 섞여 안전하게 못 고치면 아무것도 쓰지 않고 failed다. 읽은 뒤 쓰기 전에 file이 바뀌었으면 한 번 다시 읽고, 또 바뀌었으면 쓰지 않고 failed다. 설정은 임시 file에 쓴 뒤 rename한다"
    outcomes:
      - id: removed
        observe: ["disk:<harness 전역 설정 file>", response]
      - id: unchanged
        observe: [response]
      - id: not-supported
        observe: [response]
      - id: failed
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "harness 전역 설정을 고치지 못했다(쓰기 자체가 던졌다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "harness 입력이 틀렸다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-sync-skills
    title: 공유 앱 skill과 lophn-agent skill의 사본을 harness skill 폴더에 맞춘다
    actor: shell
    entries: [cli:harness.sync_skills]
    boundary: [coding-agent-cli, coding-agent]
    code:
      - packages/coding-agent/local/harness.ts
      - packages/coding-agent/local/harness-run.ts
      - packages/coding-agent/harnesses/skill-copies.ts
      - packages/coding-agent/skills/lophn-agent.ts
    steps:
      - "shell main이 core 준비 때 한 번, 앱 activation 때, coding-agent.shared_apps와 extensions.harness.enabled가 바뀔 때, hook을 놓거나 지운 뒤 exec한다"
      - "core에 user token으로 붙어 두 설정 값과 공유 앱의 public skill을 읽는다(app.skills)"
      - "hook이 놓인 harness의 skill 폴더에 공유 사본을 맞춘다. harness가 켜져 있으면 lophn-agent skill을 hook과 상관없이 둔다. 꺼지면 lophn 사본만 지운다"
      - "폴더 이름과 file 이름은 폴더 밖으로 못 나가는 것만 받는다. 표시 file(.lophn-shared)이 있는 폴더만 덮고 지우고, 사람 폴더는 건너뛴다(skipped)"
      - "core에 못 붙거나 core 읽기가 실패하거나 skill 폴더를 못 쓰면 unavailable이다"
    outcomes:
      - id: synced
        observe: ["disk:<harness skill 폴더>", response]
      - id: unavailable
        code: unavailable
        when: "core에 붙지 못했다. settings.list나 app.skills 읽기가 실패했다(core가 준 code를 그대로 넘긴다). skill 폴더를 쓸 수 없다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "core 읽기 실패의 code는 core가 정한 그대로 넘긴다. 보통 unavailable이지만 다른 code가 올 수 있다고 보고 unavailable 하나로 묶었다"

  # ---- 터미널 탭(desktop 화면): core의 terminals/* route에 붙고 입력·focus·clipboard만 shell main을 거친다 ----
  - id: terminal-open
    title: "터미널 탭이 core에 새 터미널을 연다"
    actor: person
    uses: [route:terminals/open]
    boundary: [shell]
    code:
      - packages/shell/renderer/terminal/terminal-tab.tsx
      - packages/shell/renderer/terminal/core.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/cwd.ts
      - packages/core/terminals/host/main.ts
    steps:
      - "탭이 처음 그려질 때 layout에 남은 터미널 참조가 없으면 renderer가 `terminals/open`에 project와 folder_ref나 cwd, 한 번 칠 resume·command를 보낸다(terminals-open)"
      - "core가 등록 폴더 안인지 보고 host에 PTY를 띄운다. 거절은 `details.reason`(no_folder, not_directory, unreadable, spawn_failed, host_lost)으로 오고 탭은 그 이유의 문구를 보인다"
      - "열리면 탭이 답의 터미널 참조를 store와 탭 layout(`terminal_ref`)에 남긴다. 앱을 다시 켜면 그 터미널이 `terminals/list`에 살아 있을 때 새로 열지 않고 붙는다"
    outcomes:
      - id: opened
        observe: [process:pty-shell, response, screen:project-terminal]
      - id: outside-folder
        when: "cwd가 등록 폴더 안이 아니다. reason은 unreadable이다"
        observe: [response]
      - id: refused
        when: "project에 등록 폴더가 없다(no_folder), 폴더를 쓸 수 없다(not_directory, unreadable)"
        observe: [response]
      - id: spawn-failed
        when: "login shell을 찾지 못했거나 PTY spawn이 던졌다"
        observe: [response]
      - id: host-lost
        when: "PTY host가 답하지 않았다(reason host_lost). core가 끝났거나 붙지 않았으면 탭은 쓸 수 없음 문구다"
        observe: [response]
      - id: reattached
        when: "다시 켠 앱의 탭이 layout의 터미널 참조로 `terminals/list`에서 살아 있는 터미널을 찾았다. 새 PTY를 열지 않고 snapshot으로 붙는다"
        observe: [screen:project-terminal]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/terminal-agent.md, architecture/workspace-layout.md]

  - id: terminal-shell-env
    title: "터미널 shell이 받는 env를 정한다(플랫폼 credential과 상위 session 표지를 빼고 COLORTERM을 truecolor로 고정한다)"
    actor: person
    uses: [route:terminals/open]
    when: "터미널 탭을 열 때마다, host가 shell을 띄우기 직전"
    boundary: [shell]
    code:
      - packages/core/terminals/host/env.ts
      - packages/core/terminals/host/main.ts
      - packages/core/terminals/host/shell-integration.ts
    steps:
      - "lophn을 띄운 process의 env에서 내부 이름(LOPHN_, ELECTRON_), secret류 이름(TOKEN, PASSWORD, API_KEY 등), local port 값, 상위 session 표지를 뺀다. 단 SSH_AUTH_SOCK, XAUTHORITY, GIT_AUTHOR_·GIT_COMMITTER_의 NAME·EMAIL·DATE, proxy 변수(HTTP_PROXY 등 대소문자 둘)는 정확한 이름만 남긴다"
      - "COLORTERM을 truecolor로 덮는다. TERM만 보면 Claude Code와 Codex가 256색으로 내려 자기 색을 근사한다"
      - "shell 시작 층과 탭의 env는 그 뒤에 덮는다"
      - "bash·zsh 시작 층 file이 run 폴더에 없으면 시작 층 없이 원래 login shell 인자로 띄운다. 없는 --init-file이나 빈 ZDOTDIR이면 사용자 rc를 하나도 읽지 않는다"
    outcomes:
      - id: env-built
        observe: [process:pty-shell]
      - id: user-rc-kept
        observe: [process:pty-shell]
    crosses_process: true
    risk: [secret, twice-fixed]
    docs: [architecture/terminal-agent.md, products/change-log/0.9/terminal-env-colorterm-truecolor.yaml]
    unclear:
      - "env_test는 허용 목록이 남는 것과 token·endpoint가 지워지는 것을 단정한다. COLORTERM 덮기는 단정하지 않는다"

  - id: terminal-input
    title: "사람이 친 글을 focus가 있는 창에서만 core의 터미널에 넣는다"
    actor: person
    uses: [ipc:shell:terminal-input, route:terminals/input]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/terminal.ts
      - packages/shell/main/desktop/terminal-focus.ts
      - packages/shell/renderer/terminal/displays.ts
    steps:
      - "xterm이 사람이 친 글을 터미널 참조와 generation과 함께 terminal-input으로 shell main에 보낸다. 창이 등록된 본문 창이 아니면 forbidden이다"
      - "main이 focus 표에서 이 창이 그 터미널과 generation에 focus를 가졌는지 본다. 없으면 not-focused다"
      - "있으면 main이 자기 shell capability를 실어 `terminals/input`을 부른다(terminals-input). renderer는 이 route를 부를 수 없다"
      - "core가 거절하면(지난 generation, 끝난 터미널) 그 code로 돌아오고 renderer는 그 paste의 나머지를 보내지 않는다"
    outcomes:
      - id: sent
        observe: [process:pty-shell, response]
      - id: not-focused
        code: forbidden
        when: "이 창이 그 터미널에 focus를 갖지 않았다(terminal is not focused)"
        observe: [response]
      - id: not-running
        when: "core가 거절했다(generation이 맞지 않음은 conflict, 없는 터미널은 not_found, core가 붙지 않음은 unavailable)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/terminal-agent.md]

  - id: terminal-respond
    title: "숨은 xterm이 새 출력의 terminal 질의에 답을 core의 터미널에 준다"
    actor: shell
    uses: [ipc:shell:terminal-response, route:terminals/input]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/terminal.ts
      - packages/shell/renderer/terminal/displays.ts
    steps:
      - "출력이 숨은 xterm에 들어가 terminal이 답을 요구하면 xterm이 답을 terminal-response로 보낸다. 사람 입력이 아니다"
      - "main은 focus를 보지 않고 shell capability와 `respond: true`를 실어 `terminals/input`을 부른다. core는 이것을 사람 입력으로 세지 않는다"
    outcomes:
      - id: answered
        observe: [process:pty-shell, response]
      - id: not-running
        when: "core가 거절했다(지난 generation, 끝난 터미널)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true

  - id: terminal-resize
    title: "터미널 칸의 크기를 core의 PTY에 알린다"
    actor: person
    uses: [route:terminals/resize]
    boundary: [shell]
    code:
      - packages/shell/renderer/terminal/terminal-tab.tsx
      - packages/core/terminals/routes.ts
    steps:
      - "보이는 칸 크기가 바뀌면 renderer가 `terminals/resize`를 부른다(terminals-resize). focus를 보지 않는다(split의 다른 pane도 보이는 채로 크기가 바뀐다)"
      - "폰이 크기를 잡았으면(runtime의 remote_size) 칸에 맞추지 않고, 사람이 그 탭을 고르거나 누르면 칸 크기로 다시 잡는다"
    outcomes:
      - id: resized
        observe: [process:pty-shell, response]
      - id: not-running
        when: "generation이 맞지 않거나(conflict) 터미널이 없다(not_found)"
        observe: [response]
    crosses_process: true

  - id: terminal-close
    title: "사람이 닫은 터미널 탭의 터미널을 core에서 끝낸다"
    actor: person
    uses: [route:terminals/close, route:terminals/snapshot]
    boundary: [shell]
    code:
      - packages/shell/renderer/terminal/deps.ts
      - packages/core/terminals/routes.ts
    steps:
      - "탭을 닫으면 renderer가 `terminals/snapshot`으로 그 터미널이 아직 살아 있는지 본다. 끝났으면 탭만 뺀다"
      - "살아 있으면 사람에게 닫아도 되는지 묻는다(agent가 닫는 탭은 묻지 않는다). 아니오면 cancelled이고 터미널은 그대로 돈다"
      - "예면 `terminals/close`를 부른다(terminals-close). 종료를 확인하지 못하면(kill_unconfirmed) 탭을 남겨 결과 불명을 보인다"
    outcomes:
      - id: closed
        observe: [process:pty-shell, response]
      - id: unconfirmed
        when: "종료를 확인하지 못했다. 탭이 남고 결과 불명 문구다"
        observe: [screen:project-terminal]
      - id: cancelled
        when: "사람이 닫기 확인에서 아니오를 골랐다"
        observe: [screen:project-terminal]
      - id: refused
        when: "core가 닫기에 답하지 못했다. 탭이 남고 결과 불명 문구다"
        observe: [screen:project-terminal]
    crosses_process: true
    risk: [data-loss]

  - id: terminal-restart
    title: "끝난 터미널을 focus가 있는 창에서 같은 탭에 다시 띄운다"
    actor: person
    uses: [ipc:shell:terminal-restart, route:terminals/restart]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/terminal.ts
      - packages/shell/renderer/terminal/terminal-tab.tsx
    steps:
      - "끝난 탭의 다시 시작을 누르면 renderer가 terminal-restart로 shell main에 보낸다"
      - "main이 focus 표에서 이 창이 그 터미널에 focus를 가졌는지 본다. 없으면 not-focused다"
      - "있으면 shell capability를 실어 `terminals/restart`를 부른다(terminals-restart). 새 generation의 runtime은 `TerminalRuntimeChanged`로 오고 탭이 snapshot을 다시 읽는다"
    outcomes:
      - id: restarted
        observe: [process:pty-shell, screen:project-terminal]
      - id: not-focused
        code: forbidden
        when: "이 창이 그 터미널에 focus를 갖지 않았다"
        observe: [response]
      - id: unconfirmed
        when: "core가 옛 shell의 종료를 확인하지 못해 새로 띄우지 않았다"
        observe: [response]
      - id: refused
        when: "core가 거절했다(없는 터미널, 지난 generation, 붙지 않음)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true

  - id: terminal-snapshot
    title: "다시 붙은 터미널 칸에 지금 화면을 그리고 놓친 출력을 맞춘다"
    actor: person
    uses: [route:terminals/watch, route:terminals/snapshot]
    boundary: [shell]
    code:
      - packages/shell/renderer/terminal/displays.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/host/screen.ts
    steps:
      - "칸을 그릴 때 renderer가 먼저 그 창의 lease(`terminals/watch`)를 잡고 `terminals/snapshot{after_seq: 0}`을 읽는다. 그 사이 온 출력 event는 모아 두었다가 seq가 snapshot보다 큰 것만 쓴다"
      - "core는 host의 headless 화면을 직렬화한 chunk 하나를 준다(history, 커서, mouse 인코딩). view를 PTY 치수로 맞춰 쓴 뒤 탭이 칸에 다시 맞춘다"
      - "받은 seq 다음이 아닌 출력이 오거나 Gateway가 다시 붙으면(ready) 마지막 seq로 snapshot을 다시 읽어, 뒤에 출력이 있으면 view를 비우고 그 화면을 쓴다"
      - "터미널이 없으면 탭은 결과 불명으로 끝난다"
    outcomes:
      - id: screen
        when: "after_seq 뒤에 출력이 있다. 지금 화면 chunk 하나를 쓴다"
        observe: [response, screen:project-terminal]
      - id: up-to-date
        when: "after_seq 뒤에 출력이 없다. output은 빈 목록이다"
        observe: [response]
      - id: gone
        when: "core에 그 터미널이 없다(not_found)"
        observe: [screen:project-terminal]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/terminal-agent.md]

  - id: terminal-output
    title: "터미널 출력을 lease를 잡은 창에 event로 보낸다"
    actor: system
    entries: [system:terminal-output]
    uses: [route:terminals/watch]
    boundary: [shell]
    code:
      - packages/shell/renderer/terminal/displays.ts
      - packages/core/terminals/routes.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "그려진 터미널 칸마다 창이 `terminals/watch` lease를 창의 watcher로 잡고 10초마다 다시 잡는다. 칸을 놓으면 lease를 놓는다"
      - "core는 lease가 하나라도 있는 동안만 host의 출력 chunk를 `TerminalOutputAppended`로 낸다. 창은 그 터미널의 칸이 있을 때만 쓴다"
    outcomes:
      - id: pushed
        observe: [screen:project-terminal]
      - id: not-watched
        when: "그 터미널에 lease가 없다. event가 나지 않는다"
        observe: []
    crosses_process: true
    risk: [secret]
    docs: [architecture/terminal-agent.md]

  - id: terminal-focus
    title: "사람이 고른 터미널 탭을 focus 표에 적는다"
