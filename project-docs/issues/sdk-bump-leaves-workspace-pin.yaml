id: sdk-bump-leaves-workspace-pin
title: "SDK 판을 올리면서 workspace pin 하나를 빠뜨려 새 `npm ci`가 깨짐"
kind: mistake
status: open
topic: mistakes
modules: [packages/sdk, tools]
now: |
  skill-share 계획의 app-skill-decl task가 `@lophn/declaration`과 `@lophn/app-ui`를 2.1.0으로 올리며 `tools/wireframes/package.json`의 `"@lophn/app-ui": "2.0.0"`을 남겼다. workspace에 2.0.0이 없어 npm이 registry에서 찾다 404로 `npm ci`가 실패했다. merge.sh의 check:full과 core 기동은 이미 깔린 `node_modules`로 돌아 통과했고, 다음 worktree를 만드는 launch.sh(`worktree-prep.ts`의 `npm ci`)에서 드러났다. lead가 pin을 고쳤다.
impact: |
  plan branch가 새 clone, 새 worktree, 패키징(`tools/package/main.ts`도 `npm ci`)에서 깨진 채 merge됐다. main에는 가지 않았다.
fix: |
  check의 deps 단계에 "workspace package의 `@lophn/*` 의존은 그 workspace의 지금 판과 같다"를 더한다(`package.json` 파일만 읽는다). 판을 올리는 brief의 끝남에는 `grep -rn '"@lophn/<이름>": "<옛 판>"' --include=package.json .`가 0줄을 넣는다.
cause: |
  brief가 판이 박힌 곳을 조사 목록으로 줬는데 그 목록이 `tools/` 아래를 빠뜨렸다. 판 올림을 확인하는 check가 없다.
prevent: |
  check의 deps 단계에 "workspace package의 `@lophn/*` 의존은 그 workspace의 지금 판과 같다"를 더한다(`package.json` 파일만 읽는다). 판을 올리는 brief의 끝남에는 `grep -rn '"@lophn/<이름>": "<옛 판>"' --include=package.json .`가 0줄을 넣는다.
