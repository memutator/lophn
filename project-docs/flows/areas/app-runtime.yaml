    declared_only: [not_found]
    refs: [A15]
    unclear:
      - "route가 not_found를 선언하지만 handler는 내지 않는다. 앱이 없으면 supervisor의 appendLog가 written:false를 ok로 돌려준다. 선언을 고칠 곳이다."
      - "supervisor에 dataRoot가 없으면 written:false가 ok로 돌아오고 log 줄이 없다(assembly.ts). 실제 production 상태인지 확인이 필요하다."

  # ---------- 호출 ----------

  - id: app-command-call
    title: "앱 command를 부른다(agent, 다른 앱, job, flow)"
    actor: agent
    entries: [route:apps/call_tool]
    uses: [sdk:cap-tool/HandlerRejection]
    when: "kind가 command이고 대상이 운영 앱(live)일 때. preview 대상은 app-preview-command-call, 화면의 operation 호출은 app-operation-call이다"
    pre: [route:releases/activate]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/caller.ts, packages/core/apps/calls/gate.ts, packages/core/apps/calls/intake.ts, packages/core/apps/calls/record.ts, packages/core/apps/calls/loop.ts, packages/core/apps/routes.ts]
    steps:
      - "core가 부른 쪽을 확인한다(verifyCaller). credential 종류와 caller 종류가 맞아야 하고, agent는 지금 도는 turn의 tool call이어야 하며, app은 활성 release와 지금 도는 부모 호출이어야 한다. program과 flow는 core 안 run 연산이 만든 자격과 맞아야 한다. preview 전용 credential은 live를 부르지 못한다(본문 검사보다 앞)."
      - "보관한 앱은 agent에게 not_found, 사람과 app에게 denied(app_archived)다. 활성 release의 command 선언에서 찾고 없으면 denied(not_declared)다(기록 없음)."
      - "같은 앱이 호출 사슬에 다시 나오거나 깊이 8을 넘으면 handler에 가지 않고 denied(call_loop, call_too_deep)로 기록한다. 본문이 CALL_BODY_MAX_BYTES를 넘으면 invalid_input이고 기록은 남기지 않는다."
      - "막기(Gate): agent는 지금 할당(judge)으로 본다. 앱 workspace의 agent는 자기 앱이 할당에 자동으로 들어 있어(agentAssignment) 그 앱의 command는 할당 없이 통과하고, 다른 앱은 할당에 있어야 하며 deny로 뺀 command는 막힌다. app은 부른 앱의 active grant app.call이 그 tool을 덮는지로 본다. program은 판정 없이 통과하고, flow는 PM의 할당과 비공개 규칙을 본다. 묻지 않는다. 막히면 denied(gate_blocked)다. 사람은 Gate를 거치지 않는다."
      - "write와 external이면 앱별 줄을 얻고 invocation 시작을 남긴다. read는 줄 없이 바로 간다. 성공한 read는 기록을 남기지 않는다."
      - "접수가 닫힌 동안(활성화나 rewind) 온 호출은 접수가 열릴 때까지 붙잡혔다가 그때의 활성 release로 정해 보낸다. 앱 process에 보낸다. 보내기 전에 막히면 denied(app_unavailable), 보냈는데 답이 없으면 unknown이다. 활성화 drain이 기다리던 호출을 끊으면 같은 답이 된다."
      - "응답의 결과와 changeset으로 invocation을 끝내고 부른 쪽에 succeeded, failed, denied, unknown 가운데 하나를 준다. changeset은 write 구간의 DB 변경이다(cap-store가 잡고 lophn_data_schema 표는 뺀다). frame 한도, release 상한, blob 준비 중 하나에 걸리면 changeset만 빼고 changeset_dropped로 알린다."
    outcomes:
      - id: succeeded
        when: "write나 external이 성공함(invocation을 남기고 write 구간의 changeset을 붙인다)"
        observe: [response, "ledger:invocations"]
      - id: succeeded-read
        when: "read가 성공함. 줄도 기록도 없고 응답의 invocation은 null이다"
        observe: [response]
      - id: succeeded-changeset-dropped
        when: "write나 external이 성공했는데 changeset을 못 붙임(summary.changeset_dropped: too_large는 앱 응답이 frame을 넘거나 changeset이 상한을 넘음, release_full은 release 안 changeset 상한, unavailable은 blob 준비 실패). 호출은 succeeded로 닫히고 changeset이 없어 rewind 계획은 reverts_db를 false로 본다"
        observe: [response, "ledger:invocations"]
      - id: failed
        when: "앱 child가 failed로 답함: 입력이 inputSchema와 맞지 않음(invalid_input), 선언이나 handler가 없음(not_found), 이 둘은 handler 전이다. handler가 일반 예외를 던짐(internal 'handler failed', 원문은 주지 않는다). 결과가 JSON이 아님(internal). 읽기 실패도 기록한다"
        observe: [response, "ledger:invocations"]
      - id: rejected
        when: "handler가 HandlerRejection(sdk:cap-tool)을 효과 전에 던짐. 그 코드(invalid_input·forbidden·conflict·unavailable 가운데 하나)와 200자 이하 문장을 그대로 준다. 기록은 failed다"
        observe: [response, "ledger:invocations"]
      - id: result-too-large
        when: "command 결과가 RESULT_MAX_BYTES(254 KiB)를 넘음. 앱 child가 internal 'result exceeds the size limit'로 바꾸고 changeset은 붙인다. operation은 OPERATION_RESULT_MAX_BYTES까지 받는다(app-operation-call)"
        observe: [response, "ledger:invocations"]
      - id: held-then-run
        when: "접수가 닫힌 동안 온 호출이 접수가 열린 뒤 그때의 활성 release로 실행됨. write면 기록의 release가 새 release다(read는 기록이 없다)"
        observe: [response, "ledger:invocations"]
      - id: denied-gate-blocked
        when: "할당이나 app.call grant가 그 tool을 덮지 않음(사람은 Gate를 거치지 않는다)"
        observe: ["ledger:invocations", response]
      - id: denied-call-loop
        when: "대상 앱이 이미 호출 사슬에 있음"
        observe: ["ledger:invocations", response]
      - id: denied-call-too-deep
        when: "호출 사슬 깊이가 8 이상"
        observe: ["ledger:invocations", response]
      - id: denied-app-unavailable
        when: "앱 process에 보내기 전에 막힘(read는 denied 기록, write는 failed 기록), 또는 대기 중이던 호출을 활성화 drain이 끊음"
        observe: [response, "ledger:invocations"]
      - id: denied-app-archived
        when: "보관한 앱을 사람이나 app이 부름(agent에게는 not_found). 기록은 남기지 않는다"
        observe: [response]
      - id: denied-not-declared
        when: "활성 release의 command 선언에 없음(기록 없음)"
        observe: [response]
      - id: unknown
        when: "보냈는데 응답을 받지 못함(응답이 없음), 또는 활성화 drain이 보낸 뒤 호출을 끊음"
        observe: ["ledger:invocations", response]
      - id: forbidden
        code: forbidden
        when: "caller 종류가 credential과 다름, agent의 tool call을 모름, preview 전용 credential이 live를 부름, program의 job run이 credential과 다름, flow의 instance가 credential과 다름, app 호출에서 credential의 app이 caller app과 다름, app 호출의 release가 활성 release가 아님, parent_invocation이 그 앱·release의 도는 호출이 아님(preview 쪽 거절은 app-preview-command-call)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "agent가 live 활성 release가 아닌 대상(release를 적은 것)을 부름, program·flow·app이 live가 아닌 대상을 부름, 본문이 CALL_BODY_MAX_BYTES 상한을 넘음(기록 없음)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "agent가 보관한 앱을 부름"
        observe: [response]
      - id: dependency-failed
        when: "호출자 확인의 port(agentToolCall, activeRelease), 보관 여부나 선언 읽기, Gate의 할당·grant 읽기, 기록 쓰기(begin·finish)가 낸 오류 그대로"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "ledger writer를 쓸 수 없어 기록 begin·finish가 실패함(dispatch 뒤 service), 또는 호출자 확인·보관 여부·선언 읽기가 unavailable로 실패함"
        observe: [response]
    crosses_process: true
    risk: [permission, data-loss]
    refs: [P12, H3, J4]
    docs: [architecture/app-call.md]
    unclear:
      - "AGENT.md J4와 E10은 job의 앱 tool 차례를 만든 agent의 할당 안으로 제한하지만, architecture/app-call.md의 결정과 gate.ts의 callAllowed는 program을 판정 없이 통과시킨다. 어느 쪽이 맞는지 사람이 정한다."
      - "agent 호출의 gate(callAllowed의 agent 분기)는 할당(judge)만 보고 target의 public 여부를 보지 않는다(flow 분기는 본다). 비공개 규칙은 agent tool의 lophn 명령 해석 쪽에만 있는 것으로 보인다. 직접 app.call_tool로 부르는 길에서도 막히는지 확인이 필요하다."
      - "write가 앱 미기동으로 막히면 invocation의 ledger status는 failed인데 응답과 summary는 denied(app_unavailable)다(calls/service.ts execute). 의도인지 확인이 필요하다."

  - id: app-preview-command-call
    title: "앱 preview의 command를 기록과 Gate 없이 부른다"
    actor: agent
    uses: [route:apps/call_tool]
    when: "kind가 command이고 대상이 preview일 때. 부른 쪽은 그 앱 workspace의 agent나 사람이다"
