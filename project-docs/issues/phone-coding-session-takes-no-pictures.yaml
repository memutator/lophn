id: phone-coding-session-takes-no-pictures
title: 폰에서 coding session의 대화에 이미지를 붙일 수 없다
kind: bug
status: fixed
topic: remote
modules: [packages/mobile, packages/core/coding-relay, packages/shell/main]
now: |
  폰의 대화 화면(`packages/mobile/src/screens/session/conversation.tsx`)은 컴퓨터의 coding session(`relayed`)이면 그림 붙이기를 내놓지 않는다(`pictures = caps.images && relayed === null`). lophn agent session은 폰이 그림을 `uploadImage`로 core에 올리고 그 image block을 실어 보낸다(`data/attach.ts`의 `uploadAttached`). coding session의 입력은 core의 relay(`packages/core/coding-relay/relay.ts`의 `send`)가 shell main의 harness GUI adapter에 그대로 넘기는데, 폰이 올린 그림을 adapter가 읽을 수 있는 꼴(탭 임시 폴더의 file)로 놓는 길이 없다. `architecture/remote.md`는 coding session에서 폰의 이미지 붙이기를 비목표로 적었다.
impact: |
  사람이 폰에서 coding agent에게 화면 사진이나 screenshot을 보여 주며 일을 시킬 수 없다. lophn agent에게는 되는데 coding agent에게는 + 단추에 그림이 없다.
fix: |
  - 중간(추천): 폰이 그림 bytes를 coding 입력과 함께 보내고 shell main이 그 탭의 임시 폴더에 써서(desktop의 live 붙이기가 쓰는 자리와 이름 규칙) `file://` resource_link로 adapter에 넘긴다. adapter는 고치지 않는다. 그림 하나가 remote와 host 연결의 frame 한도 안이어야 한다(폰이 이미 JPEG로 다시 줄인다). `remote.md`의 비목표에서 이 줄을 뺀다.
decided: |
  사람이 정했다: coding agent의 폰 입력칸에서도 이미지를 붙일 수 있어야 한다. 비목표로 둔 앞선 결정을 뒤집는다.
closed: |
  폰이 coding session에 그림을 붙여 보낸다(`acp/image_upload`). shell main이 그 탭의 임시 폴더에 쓰고 `file://` resource_link로 adapter에 넘긴다. 보낸 그림은 `acp/image_read`로 읽어 작은 그림으로 보인다.
guard: packages/shell/main/terminal/gui_test.ts의 "폰이 보낸 그림이 그 탭의 임시 폴더 밖에 쓰이지 않는다"
