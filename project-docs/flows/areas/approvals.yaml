      - id: app-not-found
        code: not_found
        when: "credential이 묶은 앱이 없음"
        observe: ["response"]
      - id: unknown-agent
        code: invalid_input
        when: "받을 agent id 가운데 없는 것이 있음"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: ["C25"]
    docs: [architecture/approval.md, architecture/app-call.md]

  - id: share-request-list
    title: 대기 목록이 열린 앱 공유 요청을 읽는다
    actor: person
