id: operator-definition-scans-place-folders
title: 'Operator 정의 파일을 place 폴더를 훑어 찾는다'
kind: defect
status: kept
topic: agent-definition
modules: [packages/core/lophn-agent, packages/protocol]
now: |
  Operator의 `AgentRef`에 place가 없어 `agents/inspect.ts`의 `findOperator`가 `context.lookups.places()` 전부를 돌며 슬롯 파일을 읽는다. `loadAgent`, 그리고 `agents/commands.ts`의 생성·고치기·지우기가 이를 쓴다.
impact: |
  Operator 하나를 읽을 때마다 place 수만큼 파일을 연다. place가 많아지면 느려진다. 같은 id가 두 place에 있으면 먼저 찾은 것이 쓰인다.
fix: |
  ref에 place를 싣는다(계약 변경이라 쓰는 쪽도 같이 고친다). 비용은 protocol, shell, runtime 호출부까지다. 추천: place가 수십 개를 넘으면 한다. 그전에는 두어도 된다.
closed: |
  Operator를 읽을 때 place 수만큼 파일을 열 뿐이고 place가 수십 개를 넘기 전에는 느려지지 않는다. 같은 id는 만들 때 `findOperator`가 막아 두 place에 생기지 않는다. ref에 place를 싣는 계약 변경은 protocol, shell, runtime 호출부까지 걸려 비용이 크다.
guard: 없음
