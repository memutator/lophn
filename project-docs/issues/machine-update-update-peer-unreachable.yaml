id: machine-update-update-peer-unreachable
title: 폴더 꼴 판 범위 판정(`exchangeWith`)의 표 test가 없고 update_peer 갈래는 지금 판에서 한 번도 돌지 않는다
kind: defect
status: open
topic: folder-sync
modules: [packages/core/folder, packages/shell/renderer]
now: |
  `packages/core/folder/import/compat.ts`의 `exchangeWith`가 기계 기록의 `lophn.folder`로 ok·update_this·update_peer를 가르고, 범위 밖이면 import가 그 기계의 data·source·release file을 열지도 지우지도 않는다. "범위 밖이면 file을 건드리지 않는다"는 `import/held_test.ts`가 본다(상대의 판을 올려 `newer_format`·`update_this`, cursor와 file 그대로, held 없음, 범위 안으로 돌아오면 그 cursor부터 이음). 없는 것은 `exchangeWith`의 표 test와 update_peer 갈래다. 모든 build가 `FOLDER_FORMAT` {version 1, min_version 1}이라 update_peer와 그 문구("<이름> runs an older lophn. Update it on that machine.")는 꼴 판을 처음 올리는 판이 나올 때 처음 돈다.
impact: |
  꼴 판을 처음 올리는 판에서 update_peer 갈래가 틀리면 옛 판 기계의 file을 잘못 읽거나 아무 안내 없이 멈추고, 그때는 이미 두 판이 사람의 기계에 깔려 있다.
fix: |
  작음(추천): `exchangeWith`의 표 test(같은 판, 상대가 새 판, 상대의 하한이 높음, 상대가 옛 판)를 더한다. update_peer의 import 길은 자기 꼴 판을 인자로 넣을 수 있어야 test할 수 있으므로, 꼴 판을 올리는 변경에서 같이 본다.
