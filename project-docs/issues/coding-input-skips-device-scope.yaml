id: coding-input-skips-device-scope
title: coding session에서는 폰이 lophn session에서 못 하는 입력(권한 mode 바꾸기, shell 실행)이 그대로 통한다
kind: bug
status: fixed
topic: remote
modules: [packages/core/main, packages/core/terminal-agents]
now: |
  기기가 보내는 대화 입력은 `acp/send` 하나다. lophn agent session이면 부른 쪽의 자격 범위 안에서 command로 갈려서(`packages/core/main/daemon/wiring/acp-send.ts`) 폰은 권한 mode(skip)를 바꾸지 못하고 shell 메시지를 남기지 못한다. coding session이면 `ctx.terminalAgents.coding.has(session)`에 걸려 자격을 보지 않고 `coding.send`로 그 터미널의 GUI handle에 그대로 넘어간다(`packages/core/main/daemon/wiring/acp.ts`, `packages/core/terminal-agents/coding-sessions.ts`). 그래서 `set_mode`(Claude의 `setPermissionMode`), `run_shell`, `!`로 시작하는 글이 기기에서 와도 adapter가 그대로 한다. 폰 화면은 이런 입력을 내놓지 않지만 route는 받는다.
impact: |
  명단의 기기가 coding session을 거쳐 그 컴퓨터에서 명령을 돌리거나 승인 없이 도는 mode로 바꿀 수 있다. 터미널 입력을 꺼 둔 기기에도 같은 일이 된다. 폰만이 아니라 명단에 든 다른 컴퓨터도 그 컴퓨터의 기기 자격으로 부르므로 같은 길을 받는다. `terminals/open`의 `command`·`resume`이 같은 허락을 보게 된 뒤로는 이 길이 남은 입구다. 폰의 화면이 아니라 폰의 자격을 쓰는 다른 code가 있어야 하므로 지금 사람이 겪는 일은 아니다.
fix: |
  - 작음(추천): relay로 넘기기 전에 기기가 보낸 입력의 종류를 본다. `set_mode`는 lophn session과 같이 기기에서 받지 않고, `run_shell`과 `!` 글은 그 기기에 터미널 입력이 허락돼 있을 때만 받는다. 아니면 `forbidden`이다.
decided: |
  기기가 coding session에 보내는 acp/send는 권한 mode 변경(set_mode)을 forbidden으로 막고, shell 실행(run_shell)은 터미널 입력 허락이 켜진 기기만 허용한다.
closed: |
  acp-send wiring이 기기 자격의 coding session 입력에서 set_mode를 forbidden으로 거절하고 run_shell은 terminalInputGrant가 켜져 있을 때만 통과시킨다.
guard: packages/core/main/daemon/wiring/acp-send_test.ts
