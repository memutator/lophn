id: coding-input-skips-device-scope
title: coding session에서는 폰이 lophn session에서 못 하는 입력(권한 mode 바꾸기, shell 실행)이 그대로 통한다
kind: bug
status: open
topic: remote
modules: [packages/core/main, packages/core/coding-relay]
now: |
  기기가 보내는 대화 입력은 `acp/send` 하나다. lophn agent session이면 부른 쪽의 자격 범위 안에서 command로 갈려서(`packages/core/main/daemon/wiring/acp-send.ts`) 폰은 권한 mode(skip)를 바꾸지 못하고 shell 메시지를 남기지 못한다. coding session이면 `ctx.codingRelay.has(session)`에 걸려 자격을 보지 않고 `relay.send`로 host에 그대로 넘어간다(`packages/core/main/daemon/wiring/acp.ts`). 그래서 `set_mode`(Claude의 `setPermissionMode`), `run_shell`, `!`로 시작하는 글이 기기에서 와도 adapter가 그대로 한다. 폰 화면은 이런 입력을 내놓지 않지만 route는 받는다.
impact: |
  pairing한 기기가 coding session을 거쳐 그 컴퓨터에서 명령을 돌리거나 승인 없이 도는 mode로 바꿀 수 있다. 터미널 입력을 꺼 둔 기기에도 같은 일이 된다. 폰의 화면이 아니라 폰의 자격을 쓰는 다른 code가 있어야 하므로 지금 사람이 겪는 일은 아니다.
fix: |
  - 작음(추천): relay로 넘기기 전에 기기가 보낸 입력의 종류를 본다. `set_mode`는 lophn session과 같이 기기에서 받지 않고, `run_shell`과 `!` 글은 그 기기에 터미널 입력이 허락돼 있을 때만 받는다. 아니면 `forbidden`이다.
decide: |
  coding session에서 기기가 할 수 있는 입력의 범위. 추천은 lophn session과 같은 규칙(권한 mode는 못 바꾼다)에 shell은 터미널 입력 허락을 따르는 것이다.
