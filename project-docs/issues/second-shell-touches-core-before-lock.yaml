id: second-shell-touches-core-before-lock
title: 두 번째 shell process가 single-instance lock보다 먼저 core를 확인하고 띄운다
kind: bug
status: open
topic: shell
modules: [packages/shell/main]
now: |
  `main.ts`의 `startDesktop`은 `createShellContext`에서 `connectCore`(`wiring/context.ts` → `core/connection.ts`의 `startCoreConnection`)를 만들고, 이 함수는 끝에서 곧바로 `void recover()`를 부른다. `recover`는 `control.identify()`, 이어서 `ensure()`(core가 없으면 띄우고 `productVersion`이 다르면 갈아 띄운다)를 한다. single-instance lock은 그 뒤 `desktop.register`의 `startSingleInstance`에서 잡으므로, lock을 못 얻어 곧 끝날 두 번째 process도 그 전에 core를 건드린다.
impact: |
  이미 떠 있는 shell 위에서 `--quit`나 `--open-app`, 아이콘 두 번째 클릭이 core를 띄울 수 있다. `Stop lophn`으로 core를 멈춰 둔 shell 옆에서 두 번째 process가 core를 되살리고, 판이 다른 빌드(dev 실행과 설치본)를 두 번째로 켜면 돌고 있는 core를 갈아 띄워 첫 shell의 연결이 끊긴다.
fix: |
  lock을 `startDesktop` 맨 앞(context 만들기 전)에서 잡거나, `connectCore`의 `recover`를 lock을 얻은 뒤에 시작한다(작음). 추천: 앞의 것.
