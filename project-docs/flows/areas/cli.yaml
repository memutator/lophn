area: cli
flows:
  - id: cli-core-connect
    title: "binary가 명령 하나를 돌리려고 core에 붙는다. 없으면 띄우고, 쓰기 응답을 잃으면 같은 key로 결과를 다시 본다"
    actor: person
    entries: []
    uses: [system:core-ensure, control:identify, control:connect, route:commands/result]
    boundary: [core-control-protocol, coding-agent-cli, core-api]
    code:
      - packages/cli/connection/core.ts
      - packages/cli/connection/client/core.ts
      - packages/cli/connection/client/daemon.ts
      - packages/cli/connection/client/node.ts
      - packages/cli/connection/client/token.ts
    steps:
      - "LOPHN_AGENT_SHELL=1이고 LOPHN_AGENT_CREDENTIAL이 없으면(lophn agent의 shell.run·ACP terminal 안) 붙지도 띄우지도 않고 forbidden으로 끝낸다. 오류 글은 lophn tool을 쓰라고 알린다"
      - "LOPHN_AGENT_CREDENTIAL env가 있으면 그 자격으로만 부른다. connect도 띄우기도 하지 않고 identify로 core가 ready인지만 본다"
      - "LOPHN_DAEMON_URL이 있으면 loopback http 주소인지 보고, identify가 알린 api_url과 같은 core일 때만 control connect로 user 자격을 받는다. 띄우지 않는다"
      - "그 밖에는 system:core-ensure로 붙거나 띄운다. 판이 다른 core는 ensure가 한 번 갈아 띄운다. 받은 자격으로 core route를 HTTP로 부른다"
      - "data root(LOPHN_HOME, 없으면 $HOME/.lophn)를 못 구하면 control socket 자리도 못 구해 unavailable이다"
      - "쓰기 호출의 전송이 끊기면 같은 key로 route:commands/result를 읽는다. 결과가 있으면 그 결과를 성공으로 쓰고, 없으면 effect_unknown 진단과 key를 싣고 exit 6으로 끝난다"
      - "읽기 호출의 전송이 끊기면 unavailable을 그대로 돌려준다(exit 5). 다시 부르는 것은 호출자 몫이다"
    outcomes:
      - id: attached
        observe: [response]
        when: "ensure가 붙거나 띄워 붙었다(system:core-ensure의 attached, spawned, replaced 가운데 하나)"
      - id: joined-agent
        observe: [response]
        when: "agent 자격 env가 있고 그 core가 ready다. 띄우지 않고 그 자격으로 부른다"
      - id: joined-address
        observe: [response]
        when: "LOPHN_DAEMON_URL이 identify가 알린 core와 같다. 띄우지 않고 user 자격을 받는다"
      - id: agent-shell
        code: forbidden
        observe: [response]
        when: "자격 없는 lophn agent shell 안이다(LOPHN_AGENT_SHELL). control socket에 닿지도 core를 띄우지도 않는다"
      - id: invalid-address
        code: invalid_input
        observe: [response]
        when: "LOPHN_DAEMON_URL이 비었거나 http가 아니거나 loopback이 아니다"
      - id: address-mismatch
        code: unavailable
        observe: [response]
        when: "명시 주소가 identify의 api_url과 다르다. 자격을 받기 전에 끝낸다"
      - id: no-data-root
        code: unavailable
        observe: [response]
        when: "LOPHN_HOME도 HOME도 없어 data root를 못 구한다"
      - id: core-unavailable
        code: unavailable
        observe: [response]
        when: "agent 자격의 core가 떠 있지 않거나 api_url이 아직 null이다, 또는 system:core-ensure가 unavailable로 끝났다(start-failed, not-ready, stop-timeout, version-mismatch)"
      - id: contract-mismatch
        code: internal
        observe: [response]
        when: "system:core-ensure의 contract-mismatch다"
      - id: replayed
        observe: [response]
        when: "쓰기 응답을 잃었고 같은 key의 결과가 core에 남아 있다. 그 결과를 성공으로 쓴다"
      - id: effect-unknown
        code: unavailable
        observe: [response]
        when: "쓰기 응답을 잃었고 같은 key의 결과도 없다. details에 diagnosis effect_unknown과 key를 싣고 exit 6이다"
      - id: read-lost
        code: unavailable
        observe: [response]
        when: "읽기 호출이 전송에서 끊겼다(exit 5)"
    crosses_process: true
    risk: [secret]
    docs: [architecture/platform.md]
    unclear:
      - "명시 주소(LOPHN_DAEMON_URL) 경로는 identify 뒤 api_url 비교만 하고 product_version을 보지 않는다. 다른 판의 core에도 자격을 준다. core-ensure처럼 판을 맞출지 사람이 정한다"
      - "agent 자격 경로는 core가 떠 있지 않으면 띄우지 않고 unavailable이다. harness shell에서 core가 꺼진 뒤의 기대 동작을 확인할 것"

  - id: core-stop
    title: "lophn core stop: 떠 있는 core에 control stop을 보낸다. 띄우지는 않는다"
    actor: person
    entries: [cli:core.stop]
    uses: [control:stop]
    boundary: [core-control-protocol, coding-agent-cli]
    code:
      - packages/cli/commands/core.ts
      - packages/cli/connection/core.ts
      - packages/cli/connection/client/node.ts
    steps:
      - "LOPHN_AGENT_CREDENTIAL env가 있거나 자격 없는 lophn agent shell(LOPHN_AGENT_SHELL=1) 안이면 core를 멈출 수 없어 forbidden으로 끝난다. 연결하지 않는다"
      - "data root와 control socket 자리를 구한다. 못 구하면 unavailable이다"
      - "control stop 한 줄을 보낸다. 띄우지 않는다. core가 없어 socket이 답하지 않으면 unavailable이다"
      - "core가 ready이면 control-stop이 ok를 먼저 쓰고 barrier를 돌린 뒤 나간다. tray의 Stop lophn과 같은 control stop이다(architecture/platform.md)"
      - "출력은 stopped true다(--json이면 JSON 한 줄). 출력 꼴은 cli-argv가 맡는다"
    outcomes:
      - id: stopped
        observe: [response, "process:core 종료"]
        when: "control stop이 ok로 왔다"
      - id: forbidden
        code: forbidden
        observe: [response]
        when: "LOPHN_AGENT_CREDENTIAL env가 있다(harness shell), 또는 LOPHN_AGENT_SHELL=1이다(lophn agent의 shell). core를 멈추지 않고 연결도 하지 않는다"
      - id: unavailable
        code: unavailable
        observe: [response]
        when: "data root를 못 구했거나, core가 없어 socket이 답하지 않거나, core가 starting이나 stopping이다"
      - id: internal
        code: internal
        observe: [response]
        when: "core가 root package.json의 판을 읽지 못해 control-stop이 internal로 답했다. 종료는 시작하지 않는다"
    crosses_process: true
    docs: [architecture/platform.md]

  - id: cli-argv
    title: "lophn 명령줄 한 줄을 명령 하나로 읽는다. 틀리면 invalid_input으로 끝내고, 결과는 줄이나 --json으로 쓴다"
    actor: person
    entries: []
    uses: [system:core-ensure, route:apps/list, route:apps/tools]
    boundary: [coding-agent-cli-interface, core-api]
    code:
      - packages/cli/main.ts
      - packages/cli/parser.ts
      - packages/cli/output.ts
      - packages/cli/help.ts
      - packages/cli/commands/app-command.ts
      - packages/cli/commands/types.ts
    steps:
      - "첫 낱말이 help면 명령 표로 help 글을 낸다. 인자가 없으면 같은 글을 exit 2로 낸다. version은 core 없이 제품 판을 낸다"
      - "명령 표의 점 이름을 argv 낱말로 맞춘다(app.link_source는 app link-source). 맞는 명령이 없고 첫 낱말이 표에 없으면 system:core-ensure로 core에 붙어 그 slug의 앱 command를 표에 더해 다시 맞춘다. 그래도 없으면 unknown command다. 현재 command의 점·underscore 표기를 그대로 쓴 경우 정확한 CLI 문법과 help 경로를 안내하며 실행하지 않는다"
      - "flag와 위치 인자를 칸에 맞춘다. 모르는 flag, 값 없는 flag, 중복, 위치 인자 초과, 숫자·boolean·JSON 변환 실패는 usage 한 줄과 함께 invalid_input이다"
      - "--input은 JSON object여야 하고 칸과 겹치면 안 된다. 칸 schema가 막으면 빠진 칸과 틀린 칸을 항목별로 적은 invalid_input이다. 명령의 run은 실행 전에 인자 조합을 한 번 더 거른다"
      - "run이 돌려준 오류는 code 그대로 쓴다. 갈래는 그 명령의 flow가 정한다. 결과는 --json이면 JSON 한 줄, 아니면 text나 줄로 푼 글을 stdout에 쓴다"
      - "끝난 일이 failed면 결과를 쓴 뒤 사유를 stderr에 쓰고 exit 4다. note는 stderr에 한 줄 쓰고 exit 0이다. 오류는 stderr에 code와 message를 쓰고 code를 exit으로 바꾼다(invalid_input 2, forbidden·unauthorized 3, unavailable 5, effect_unknown 6, internal 1, 그 밖 4)"
      - "받은 user token과 agent 자격은 stdout·stderr 어디에도 남기지 않는다"
    outcomes:
      - id: result
        observe: [response]
        when: "명령이 ok로 끝났다. exit 0"
      - id: note
        observe: [response]
        when: "명령은 ok이고 알릴 것이 있다(workflow.start가 첫 step을 넘기지 못함). stderr에 한 줄, exit 0"
      - id: failed
        observe: [response]
        when: "명령은 끝났지만 일의 결과가 실패다(끝난 run이 failed나 cancelled, preview가 ready가 아님, release prepare·activate의 failed). stderr에 사유, exit 4다"
      - id: help
        observe: [response]
        when: "lophn help, lophn <묶음> --help, lophn <명령> --help. stdout에 글, exit 0"
      - id: help-no-args
        observe: [response]
        when: "인자가 없다. help 글을 stdout에 쓰고 exit 2다"
      - id: version
        observe: [response]
        when: "lophn version. core를 부르지 않고 제품 판을 쓴다"
      - id: unknown-command
        code: invalid_input
        observe: [response]
        when: "명령 표와 앱 command 어디에도 없는 CLI 낱말이다(앱 slug가 없는 경우 포함). 현재 command의 점·underscore 표기를 쓴 경우 정확한 호출법과 command help를 안내하고, 그 밖에 알려진 group이면 group help, 아니면 lophn help로 안내한다"
      - id: help-unknown-topic
        code: invalid_input
        observe: [response]
        when: "help 뒤의 낱말이 명령도 묶음도 아니다"
      - id: invalid-argument
        code: invalid_input
        observe: [response]
        when: "모르는 flag, 값 없는 flag, 중복 flag, 위치 인자 초과나 중복, 숫자·boolean·JSON 변환 실패"
      - id: invalid-input
        code: invalid_input
        observe: [response]
        when: "칸 schema가 막았다, --input이 JSON object가 아니다, --input과 --input-file을 같이 줬다, --input-file을 못 읽었다, 같은 칸을 --input과 flag로 둘 다 줬다"
      - id: run-args-invalid
        code: invalid_input
        observe: [response]
        when: "명령 run이 실행 전에 인자 조합을 거른다. agent run의 --session과 --agent·--project·--app, --project와 --app, --schema가 JSON object가 아님. tab open의 --session·--url·--preview·--artifact·--coding 가운데 정확히 하나가 아님, --device나 --screen에 --preview가 없음, --tui에 --session이 없음, --coding과 --handoff가 짝이 아님. call reply의 --allow와 --reject 동시, 결정 없이 body도 없음. package read에서 name 없이 version이나 offset_bytes"
      - id: app-lookup-unavailable
        code: unavailable
        observe: [response]
        when: "표에 없는 첫 낱말이라 core에 붙었는데 붙지 못했다(cli-core-connect의 unavailable)"
    crosses_process: false
    risk: [secret]
    unclear:
      - "표에 없는 첫 낱말이면 core를 띄운다(system:core-ensure). lophn 뒤의 틀린 명령 이름만으로 core가 뜨는 것이 의도인지 확인할 것"

  - id: settings-change-command
    title: "명령으로 설정 하나를 바꾸거나 기본값으로 되돌린다"
    actor: agent
    entries: [cli:settings.set, cli:settings.unset]
    uses: [route:settings/list, route:settings/update]
    boundary: [coding-agent-cli-interface, config]
    code:
      - packages/cli/commands/settings.ts
    steps:
      - "settings/list로 key를 찾는다. 선언된 설정이거나 folder 설정의 항목(`shell.themes.<id>`)이어야 한다. 없는 key는 not_found, folder key 자체는 invalid_input이다"
      - "locked인 설정은 forbidden으로 끝낸다. 사람의 터미널(user token)도 같다. 사람은 Settings 화면에서 바꾼다"
      - "set은 값이 글자인 설정이면 명령줄의 글을 그대로, 아니면 JSON으로 읽는다. JSON이 아니면 invalid_input이다"
      - "settings/update를 부른다. lophn agent의 tool call이면 그 tool call id를 싣는다(사람의 허락이 드는 설정이면 core가 그 자리에 승인 카드를 열고 답을 기다린다). 거절(rejected)이면 이유를 실어 invalid_input으로 돌려준다. needs_approval이면 core의 이유(사람이 쓴 거절 이유 포함)를 그대로 forbidden으로 돌려준다"
      - "답에 바꾸기 전 값(previous)과 notes를 싣는다. unset은 고른 값을 지워 기본값으로 돌리고, 항목이면 그 file을 지운다"
      - "agent에게는 home workspace에서만 있는 명령이다. 다른 workspace의 agent는 credential 상한에 settings/update가 없다"
    outcomes:
      - id: changed
        when: "값이 바뀌었다. 켜진 shell이 StateChanged(settings)를 받아 따라 적용한다"
        observe: ["response", "event:StateChanged"]
      - id: unchanged
        when: "같은 값을 set했거나 고른 값이 없는 설정을 unset했다"
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "그런 설정이 없다"
        observe: ["response"]
      - id: locked
        code: forbidden
        when: "사람만 바꾸는 설정이다(명령이 list의 locked로 막거나 route가 agent를 locked로 거절했다)"
        observe: ["response"]
      - id: needs-approval
        code: forbidden
        when: "사람의 허락이 드는 설정(folder.destinations)을 agent가 바꾸려 했는데 사람이 거절했거나, unattended turn·팀 자식이라 막혔거나, 묻는 자리가 없거나(lophn agent turn 밖의 agent credential), 기다림이 끝났다. 아무것도 바뀌지 않는다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "folder key 자체를 주었다, 항목 id가 규칙(소문자·숫자·-)에 안 맞는다, 값이 JSON이 아니다, core가 값을 거절했다(타입, 범위, 뜻 검사, 읽지 못한 같은 이름 file)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "settings/list나 settings/update가 unavailable이다(core가 없다, settings.json을 읽거나 쓰지 못했다)"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/settings.md]

  - id: project-identity-commands
    title: "agent가 명령으로 project의 기계를 넘는 id를 읽거나 id file을 만든다"
    actor: agent
    entries: [cli:project.share, cli:project.identity]
    uses: [route:projects/create_identity, route:projects/identity]
    boundary: [coding-agent-cli-interface, projects]
    code:
      - packages/cli/commands/project.ts
    steps:
      - "project 칸이 없으면 session의 project workspace를 쓴다. Home이거나 session이 없으면(binary) invalid_input이다"
      - "share는 projects/create_identity를, identity는 projects/identity를 부르고 summary 한 줄에 id와 file 상태(예: pri_... · not committed)를 싣는다. 실패는 route의 오류를 그대로 돌려준다"
    outcomes:
      - id: shared
        when: "share가 file을 만들었거나 이미 읽을 수 있는 file이 있다"
        observe: ["response"]
      - id: read
        when: "identity가 상태를 돌려줬다"
        observe: ["response"]
      - id: no-project
        code: invalid_input
        when: "project를 주지 않았고 project workspace의 session도 아니다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/project-identity.md]

