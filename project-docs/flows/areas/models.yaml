        observe: ["response"]
      - id: in-progress
        when: "사람이 browser에서 돌아오기를 기다린다. 서버마다의 output 상태다"
        observe: ["response"]
      - id: signed-in
        when: "쓸 수 있는 token이 있다. 서버마다의 output 상태다"
        observe: ["response"]
      - id: failed
        when: "마지막 시도나 갱신이 실패했다. reason(callback_timeout, state_mismatch, exchange_failed, refresh_rejected, expired, store_failed)을 같이 낸다. 서버마다의 output 상태다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다(서버 목록이나 이름이 틀리다, 64개 초과). 한 서버에 소유자 둘을 함께 적었다(목록 전체 거절)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "등록 서버 목록을 읽지 못했다(ledger 읽기 실패)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
