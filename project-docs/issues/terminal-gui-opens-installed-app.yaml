id: terminal-gui-opens-installed-app
title: "터미널 탭에서 부르는 `lophn gui`가 개발 앱이 아니라 `~/.lophn`의 앱으로 감"
kind: mistake
status: fixed
topic: mistakes
modules: [packages/core/terminals, tools]
now: |
  harness-gui의 gui-window task가 shell 시작 층에 `claude gui` 함수를 넣으며 `lophn`을 이름으로 불렀다. lead review가 "개발 앱 터미널에는 `lophn`이 PATH에 없다"를 찾아 CLI 경로만 넣게 고쳤고, 같은 원인(터미널 env가 `LOPHN_*`를 지운다)으로 data root도 빠진다는 것은 놓쳤다. dev CLI launcher가 `~/.lophn`을 기본값으로 잡아, 사람이 개발 앱 터미널에서 `claude gui`를 치자 설치본의 Home 창이 떴다. 설치본이 꺼져 있었으면 저장소의 개발 code가 실제 `~/.lophn`으로 떴다.
impact: |
  사람의 시험 한 판. 사람의 data root에 개발 판 schema가 적용될 뻔했다.
fix: |
  `terminal-agent.md` "지키는 것"에 "터미널 탭 안에서 lophn을 부르는 code는 CLI 경로와 data root를 shell main에서 받는다(터미널 env에는 `LOPHN_*`가 없다)"를 둔다. 저장소 실행의 `lophn gui`는 data root가 `~/.lophn`이거나 없으면 앱을 띄우지 않는다(fix task, 위험 test).
cause: |
  터미널 탭에서 lophn을 부르는 code가 무엇을 shell main에서 받아야 하는지 적힌 곳이 없었다(`terminal-agent.md`에는 env를 지운다는 사실만 있다). brief도 그것을 말하지 않았다.
prevent: |
  `terminal-agent.md` "지키는 것"에 "터미널 탭 안에서 lophn을 부르는 code는 CLI 경로와 data root를 shell main에서 받는다(터미널 env에는 `LOPHN_*`가 없다)"를 둔다. 저장소 실행의 `lophn gui`는 data root가 `~/.lophn`이거나 없으면 앱을 띄우지 않는다(fix task, 위험 test).
closed: |
  `lophn gui` 명령이 없어졌다. `claude gui`는 shell 함수가 `lophn hook <harness> lophn-gui`로 그 탭의 hook socket에 한 줄을 쓰는 것이고(`packages/shell/terminal-host/shell-integration.ts`, `packages/coding-agent/local/hook.ts`) core도 앱도 띄우지 않으며 data root에 닿지 않는다. 막는 문장은 `terminal-agent.md` "지키는 것"에 있다.
guard: 없음
