  - id: tab-drag
    title: "탭을 끌어 순서를 바꾸거나 group을 만든다"
    actor: person
    entries: [ui:tab-drag]
    when: "탭 줄의 칸이나 group 칸의 머리를 4px 넘게 끈다"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/tab-drag.tsx
      - packages/shell/renderer/shell/desk-model.ts
      - packages/shell/renderer/workspace/drag.ts
    steps:
      - "TabDragProvider가 pointer로 끈다(HTML5 drag가 아니다). 놓을 자리는 사각형으로 찾는다: tab 줄, group 칸 안, 칸 가장자리, 칸 가운데"
      - "tabDropState가 ok, full, none을 정하고 applyTabDrop이 reorderTab, ungroupTab, splitTab, stackTab, swapTabs 가운데 하나를 부른다"
      - "Esc나 pointercancel이면 취소한다"
      - "commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: reordered
        when: "tab 줄 안에 놓았다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "screen:shell-drag-strip"]
      - id: split
        when: "칸 가장자리에 놓아 새 group이 생겼다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: stacked
        when: "group 칸 가운데나 group 칸 stack 자리에 놓았다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: swapped
        when: "group이 아닌 칸의 가운데에 놓아 두 탭을 맞바꿨다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "screen:shell-drag-swap"]
      - id: refused
        when: "full: group이 가득 찬(4칸) 칸의 가장자리에 놓았다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "screen:shell-drag-full"]
      - id: unchanged
        when: "none: 자기 자신이나 group 칸 통째로 칸 가운데에 놓았다, 바뀌는 것이 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: cancelled
        when: "Esc 또는 pointercancel"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

