  # ---- 승인 (shell 규칙 ask, 사람이 결정) ----

  - id: shell-ask-allow-once
    title: "shell 명령의 승인 카드에서 한 번 허락한다"
    actor: person
    goal: "agent가 규칙 ask인 shell 명령을 돌리려 하면, 사람이 Allow once로 허락하고 명령이 실행되어 결과가 돌아온다"
    refs: [H4]
    steps:
      - {do: "agent에게 명령이 필요한 일을 메시지로 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "turn의 mode를 attended로 정한다", flow: turn-mode-decide:attended}
      - {do: "입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "카드에서 Allow once를 누른다", screen: new-agent-approval, flow: turn-request-decide:once}
      - {do: "gate가 허락을 받아 명령을 실행한다", flow: tool-gate-check:run-after-allow}
      - {do: "명령이 끝나 결과를 돌려준다", flow: tool-shell-run:finished}
      - {do: "agent가 tool 결과를 받는다", flow: tool-call-execute:ok}
      - {do: "model 응답의 tool 호출 묶음이 모두 성공으로 모인다", flow: tool-call-batch:success}

