id: browser-favicon-fast-and-bookmark-sync
version: 0.23.156
title: browser favicon을 dom-ready에서 조기 탐색·메모리 cache하고 bookmark favicon을 자동 채운다
modules:
  - packages/shell/main
change: |
  - `packages/shell/main/browser/electron-view.ts`: `dom-ready`에서 main frame DOM의 `<link rel="...icon...">`(없으면 `<origin>/favicon.ico`)을 먼저 읽어 `did-finish-load`를 기다리지 않고 favicon을 받는다. `origin`·icon URL 단위 LRU 메모리 cache(256개, 시작 시 bookmark favicon으로 seed, browsing data 삭제 시 비움)를 두어 재방문 시 `did-navigate`에서 바로 보이고 중복 fetch를 막는다.
  - `packages/shell/main/browser/bookmarks.ts`: `syncFavicon(pageUrl, favicon)`을 더해 어떤 탭에서든 favicon을 받으면 비어 있는 같은 origin bookmark와 값이 달라진 같은 주소 bookmark를 갱신하고, 바뀐 항목이 있을 때만 파일을 쓰고 `shell:bookmarks-changed`를 보낸다.
  - `packages/shell/main/desktop/wiring/bookmarks.ts`, `browser.ts`, `main.ts`: bookmark store를 browser wiring에 연결해 시작 시 cache seed와 favicon 수신 시 자동 보강을 잇는다.
why: |
  Chromium의 `page-favicon-updated`는 모든 subresource가 끝나는 `did-finish-load`에야 발생해 페이지 진입 후 1~2초 이상 기본 아이콘이 보였고, 메모리 cache가 없어 재방문마다 같은 지연을 반복했다. 또한 bookmark favicon은 최초 추가 시점에만 저장되어 이전에 누락되었거나 로딩 중 추가한 bookmark는 영구히 아이콘이 비어 있었다.
decisions:
  - text: "`dom-ready` 조기 탐색(`mainFrame.executeJavaScript`)과 `page-favicon-updated`를 함께 쓰고, 같은 후보 목록이 이미 진행 중이거나 URL cache에 있으면 중복 요청을 건너뛴다. 버린 길: `page-favicon-updated`만 의존(1~2초 지연), `webContents.executeJavaScriptInIsolatedWorld`(Electron에서 `did-finish-load`까지 대기해 지연이 그대로임)."
    by: agent
  - text: "bookmark favicon은 page 방문으로 실제로 받았을 때만 채우고, 앱 시작 시 미방문 bookmark URL을 백그라운드 fetch하지 않는다(page session 없이 임의 site에 요청을 보내지 않기 위해서)."
    by: agent
checklist:
  - "해야: 앱 다시 build"
  - "favicon이 비어 있던 bookmark(예: Gemini, 디시인사이드) 페이지를 열면 북마크 메뉴·새 탭 화면에도 아이콘이 채워지는지 본다"
  - "페이지 진입 후 favicon이 1~2초 지연 없이 뜨고, 같은 origin 재방문·새 탭에서는 즉시 뜨는지 본다"
