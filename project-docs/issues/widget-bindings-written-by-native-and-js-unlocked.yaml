id: widget-bindings-written-by-native-and-js-unlocked
title: 위젯 binding file을 놓기 callback(native)과 JS store가 서로 막지 않고 고쳐서 놓은 위젯의 binding이 사라질 수 있다
kind: bug
status: open
topic: phone-home-screen
modules: [packages/mobile]
now: |
  위젯 binding은 `widgets/bindings.json` 한 file이다. 고치는 곳이 둘이다. `requestPin`의 callback receiver(`PinResultReceiver`, `modules/lophn-widgets/android`의 `Providers.kt`)는 읽고 새 위젯 id를 더해 쓰는 일을 `synchronized(Files)` 안에서 한다. JS store(`packages/mobile/src/widgets/store.ts`)의 `bind`("Choose a widget"에서 고를 때)와 새로 하기의 정리(`pass`가 launcher에 없는 위젯 id를 binding에서 뺀다)는 file을 읽고 바꾸고 다시 쓰는 세 걸음이고 JS 안에서만 `exclusive`로 순서를 세운다. JS의 쓰기(`LophnWidgetsModule.kt`의 `writeText` → `Files.write`)는 쓰는 순간만 그 잠금을 잡아 세 걸음 전체가 잠금 밖이다. JS가 읽은 뒤 receiver가 새 id를 쓰고 JS가 자기 사본을 쓰면 receiver의 binding이 덮여 사라진다.
impact: |
  앱 menu의 "Add widget"으로 놓은 위젯이 binding 없이 남아 "Tap to choose"로 선다(사람이 눌러 다시 골라야 한다). 읽고 쓰는 창이 몇 ms이고 같은 때에 다른 위젯을 고르거나 launcher에서 위젯이 지워지는 일이 겹쳐야 해서 드물다. data를 잃는 것은 아니고 위젯 하나를 다시 고르는 일이다.
fix: |
  - 작음(추천): binding을 바꾸는 일을 native module의 함수 하나(예 `updateBindings(add, removeMissing)`)로 옮겨 native 안에서 한 번에(`synchronized`) 읽고 쓴다. JS는 binding file을 직접 쓰지 않고 읽기만 한다. receiver와 같은 잠금이라 겹치지 않는다.
  - 대안: JS가 쓴 뒤 receiver가 쓴 id가 남았는지 다시 읽어 맞춘다(창이 남는다).
