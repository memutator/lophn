schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # 앱 blueprint

  - id: req-0500
    status: accepted
    subject: sdk
    statement: SDK는 앱 blueprint 선언을 작성하고 검사하는 도우미를 제공하고, 도우미의 검사는 lophn이 blueprint를 받을 때의 검사와 같은 기준을 쓴다.
    acceptance:
      - 같은 blueprint 선언을 도우미로 검사한 결과가 lophn이 blueprint를 받을 때의 검사 결과와 같다.
      - 도우미로 쓴 앱과 직접 쓴 앱에서 같은 선언은 같은 검사 결과를 낸다.
    related:
      - app-releases

  # client

  - id: req-0501
    status: accepted
    subject: sdk
    statement: SDK는 앱이 허락받은 경로의 파일을 읽고, 쓰고, 변경을 지켜보는 typed client를 제공한다.
    acceptance:
      - 앱이 client로 허락받은 경로의 파일을 읽고 쓴다.
      - 같은 경로의 변경을 client로 지켜본다.

  - id: req-0502
    status: accepted
    subject: sdk
    statement: SDK는 timeout과 재시도를 지정할 수 있는 network 요청 client를 제공한다.
    acceptance:
      - timeout을 넘긴 요청이 오류로 끝난다.
      - 지정한 횟수만큼 요청이 다시 간다.

  - id: req-0503
    status: accepted
    subject: sdk
    statement: SDK는 앱이 자기 DB를 쓰는 client와 DB 구조를 바꾸는 도우미를 제공한다.
    acceptance:
      - 앱이 client로 자기 DB를 열고 읽고 쓴다.
      - 도우미로 DB 구조를 바꾼 뒤 앱이 새 구조로 동작한다.
    related:
      - app-data

  - id: req-0504
    status: accepted
    subject: sdk
    statement: SDK의 secret client는 앱이 grant받은 secret을 붙인 network 요청을 lophn에게 맡기고, 앱은 secret 원값을 받지 않는다.
    acceptance:
      - grant받은 secret을 붙인 요청이 목적지에 인증된 채로 간다.
      - 앱 코드는 client로 secret 원값을 읽을 수 없다.
      - grant 범위 밖 secret을 client로 청하면 거절 결과가 돌아온다.
    related:
      - secrets

  # problem 보고

  - id: req-0505
    status: accepted
    subject: sdk
    statement: SDK에는 앱이 이름과 message를 붙여 문제를 보고하는 client가 들어 있고, 앱은 별도 permission 없이 이것을 쓴다.
    acceptance:
      - permission을 따로 선언하지 않은 앱이 이름과 message를 붙여 보고하면 problems가 받는다.
    related:
      - problems

  - id: req-0506
    status: accepted
    subject: sdk
    statement: SDK에는 앱 화면 root에서 잡힌 오류를 problem 보고 통로로 넘기는 오류 경계 부품이 들어 있다.
    acceptance:
      - 앱 화면 root 아래에서 오류를 일으키면 problem 보고 통로에 전달된다.
    related:
      - problems

  # 폐기: req-0510에 합쳤다.
  - id: req-0507
    status: rejected
    subject: sdk
    statement: SDK의 문제 보고 client는 보고를 메모리 대기, 전송 실패, 영구 접수 성공으로 구별해 앱에 알린다.
    acceptance:
      - 접수에 실패한 뒤 대기 중인 보고가 저장 완료로 표시되지 않는다.
    related:
      - problems

  - id: req-0508
    status: accepted
    subject: sdk
    statement: SDK의 문제 보고 client는 보고를 다시 보낼 때 원래 app-api를 다시 부르지 않는다.
    acceptance:
      - 접수에 실패한 뒤 보고만 재시도되고 원래 호출은 한 번만 실행된다.
    related:
      - problems

  # 폐기: req-0510에 합쳤다.
  - id: req-0509
    status: rejected
    subject: sdk
    statement: SDK의 문제 보고 client가 앱 안에 쌓아 두는 대기 보고는 앱당 32개, 4,194,304 bytes까지다.
    details:
      limits:
        - 앱당 대기 보고 32개
        - 앱당 대기 보고 합계 4,194,304 bytes
    acceptance:
      - 한도를 넘는 보고는 실패하고 손실 이유가 읽힌다.
    related:
      - problems

  - id: req-0510
    status: accepted
    subject: sdk
    statement: SDK의 문제 보고 client는 network 오류, timeout, 사용 불가 응답으로 접수되지 않은 보고를 같은 내용으로 정해진 횟수만큼 다시 보내고, 끝내 실패하거나 쌓아 둔 보고가 한도를 넘으면 앱에 실패와 이유를 알린다.
    details:
      limits:
        - 재시도는 첫 시도 뒤 3번, 250, 1,000, 3,000ms 간격
        - 앱당 쌓아 두는 보고 32개, 합계 4,194,304 bytes
    acceptance:
      - 접수를 계속 막으면 3번 다시 보낸 뒤 멈추고, 앱에 실패와 이유가 알려진다.
      - 다시 보낸 보고는 처음과 같은 내용이다.
      - 한도를 넘는 보고는 실패하고 그 이유가 앱에 알려진다.
      - 접수에 실패한 보고가 접수 성공으로 알려지지 않는다.
    related:
      - problems

  # 폐기: 어떤 package가 있는지는 코드가 정하고, 버전 규칙은 req-1006이 맡는다.
  - id: req-0511
    status: rejected
    subject: sdk
    statement: SDK는 처음 내놓는 package를 모두 정확한 version 1.0.0으로 제공한다.
    details:
      contains:
        - "@lophn/blueprint"
        - "@lophn/tokens"
        - "@lophn/ui-control, @lophn/ui-overlay, @lophn/ui-layout, @lophn/ui-reading, @lophn/ui-table, @lophn/ui-chart, @lophn/ui-filter, @lophn/ui-stat, @lophn/ui-state, @lophn/ui-action"
        - "@lophn/cap-fs, @lophn/cap-net, @lophn/cap-store, @lophn/cap-problem, @lophn/cap-secret"
    acceptance:
      - 처음 내놓는 package마다 정확한 1.0.0의 코드와 안내를 package 목록에서 읽을 수 있다.
      - 처음 내놓는 package를 import map에 정확한 1.0.0으로 고정해 앱을 만들면 그 version으로 풀린다.
    related:
      - package-registry

  # 폐기: req-0514에 합쳤다. 보장해야 하는 것은 비동기 뒤의 예외도 호출 문맥과 함께 넘어가는 것이다.
  - id: req-0512
    status: rejected
    subject: sdk
    statement: SDK의 호출 문맥 부품은 앱 app-api 호출의 문맥(앱, release, preview 여부, 알려진 invocation)을 timer, await, SQLite, fetch 뒤의 비동기 callback까지 이어 준다.
    details:
      preserves:
        - 알려진 invocation이 없으면 새 invocation을 만들지 않는다.
    acceptance:
      - 앱 app-api 안에서 timer, await, SQLite 호출, fetch 뒤에 실행된 코드가 같은 앱, release, preview 여부와 invocation 문맥을 읽는다.
      - invocation이 알려지지 않은 호출에서는 invocation 문맥이 비어 있다.
    related:
      - app-runtime

  - id: req-0514
    status: accepted
    subject: sdk
    statement: SDK의 예외 처리 부품은 앱 app-api 호출 중 처리되지 않은 예외를 호출 문맥과 함께 잡아 오류 상세로 넘긴다.
    acceptance:
      - 앱 app-api 안에서 처리되지 않은 예외를 일으키면 앱, release, invocation 문맥과 오류 상세가 전달된다.
      - timer, await, SQLite 호출, fetch 뒤에 난 예외도 그 호출의 문맥과 함께 전달된다.
    related:
      - app-runtime

  # project

  - id: req-1511
    status: accepted
    subject: sdk
    statement: "앱은 SDK로 lophn project의 목록(ID, 이름, 목적)을 읽고, data와 화면을 project마다 나눌 수 있으며, 앱이 가진 project ID로 lophn은 그 project를 찾는다."
    acceptance:
      - "앱이 SDK로 project 목록을 읽으면 lophn에 등록된 project의 ID, 이름, 목적이 나온다."
      - "앱이 data에 남긴 project ID로 lophn에서 같은 project를 찾을 수 있다."
      - "project를 보관해도 앱에 있는 그 project의 data는 그대로 남는다."
    related:
      - apps
      - projects

  - id: req-1521
    status: accepted
    subject: sdk
    statement: "SDK의 migration으로 만드는 앱 DB 표는 PRIMARY KEY를 가져야 하고, 없으면 그 migration은 실패한다. 앱 rewind의 changeset이 그 표의 변경을 놓치지 않게 하기 위해서다."
    acceptance:
      - "PRIMARY KEY 없는 표를 만드는 migration은 app test에서 실패한다."
    related:
      - app-runtime
      - app-data
