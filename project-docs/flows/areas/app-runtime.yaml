      - "core app_phone.request를 그 자식의 app credential로 부르고 답({value})이나 오류를 그대로 돌려준다."
    outcomes:
      - id: answered
        observe: [response]
      - id: refused
        code: forbidden
        when: "phone.use를 선언하지 않음, grant가 없거나 거둬짐, 다른 capability의 grant뿐, 운영 자식이 아님(preview나 release 없음), 자식 release가 현재 release와 다름, active release가 없음(보관된 앱 포함)"
