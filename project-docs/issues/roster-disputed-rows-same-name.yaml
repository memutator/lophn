id: roster-disputed-rows-same-name
title: 도둑이 빠지기 전에 이름을 바꿨으면 엇갈린 두 줄이 같은 이름으로 서서 desktop에서 가를 수 없다
kind: bug
status: open
topic: remote
modules: [packages/protocol, packages/shell/renderer]
now: |
  엇갈린 줄(`roster/list`의 `disputed`)의 이름은 그 key의 항목 가운데 지금 믿는 서명자가 서명한 이긴 항목에서 온다(`packages/protocol/remote/roster.ts`의 `entryOfKey`). 도둑의 컴퓨터 R이 아직 믿는 동안 자기 이름을 X의 이름으로 바꾸고(`roster/rename`은 어느 컴퓨터에서나 새 rev에 서명한다) 다른 컴퓨터들이 그 rev에 같이 서명했으면, 뒤에 X와 R이 엇갈렸을 때 구경꾼의 두 줄이 같은 이름이다. desktop My devices(`packages/shell/renderer/desktop/settings/remote/my-devices.tsx`)의 엇갈린 줄은 이름, kind와 OS, "Disputed"와 설명, [Remove]뿐이라 key나 기계 id 같은 가를 것이 없다. CLI `lophn remote devices`는 key를 보인다. `architecture/remote.md`의 "엇갈림 풀기"가 이 경우를 적는다.
impact: |
  사람이 구경꾼 컴퓨터에서 엇갈림을 풀려고 [Remove]를 누를 때 어느 줄이 도둑인지 화면으로 알 수 없어, 정직한 컴퓨터를 빼고 도둑을 돌려놓을 수 있다. 그 빼기는 그 컴퓨터의 서명이라 바로 정해져 퍼진다.
fix: |
  - (작음, 추천) 엇갈린 줄에 그 컴퓨터를 가를 것을 더 보인다: 기계 id 앞 몇 글자나 key의 지문과 "마지막으로 본 때". 사람이 다른 컴퓨터의 Settings › Remote에서 같은 지문을 보고 고른다. 잃는 것: 줄이 조금 길어진다.
  - (중간) 엇갈린 줄의 이름을 그 기기가 스스로 서명한 항목과 남이 서명한 항목에서 따로 보여 이름이 바뀐 것을 드러낸다. 이름 바꾸기가 정당한 경우도 같이 걸린다.
