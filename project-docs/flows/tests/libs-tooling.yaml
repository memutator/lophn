  - path: packages/remote-client/connection_test.ts
    covers: [remote-connection:other-machine, remote-connection:addresses-learned]
    note: "메모리 전송 위의 createConnection(폰과 core가 다른 컴퓨터에 거는 link가 같이 쓴다). 저장한 machine id와 다른 기계가 답하면 hello 뒤로 watch도 call도 보내지 않고 stale로 남고, 같은 기계가 답하면 watch를 보내고 ready다. id가 없는 항목은 처음 만난 id를 알리고 그 뒤로 다른 기계를 거절한다. 다음에 거는 주소는 저장한 id를 대조한 연결의 hello addresses로만 바뀌고 id를 모르는 연결의 addresses는 쓰지 않는다. 끊기거나 죽은 채 resume하면 다시 붙어 마지막 watch를 다시 보내고, core가 거절할 session id는 watch에서 뺀다. join을 주면 channel마다 join이 첫 frame이고 그 답(명단, 컴퓨터의 서명 key) 뒤에 watch가 가며, unauthorized로 거절되면 다시 붙지 않고 거절의 details.removal을 넘긴다. call은 요청한 쪽(by)을 frame에 싣고(폰은 싣지 않는다), link가 끊기거나 시한이 지났을 때 unavailable의 details.sent가 그 call이 나갔는지(대기열에서 기다렸거나 channel이 거절했으면 false, 나간 뒤 끊기거나 120초가 지났으면 true) 말한다"

  - path: packages/remote-client/computers_test.ts
