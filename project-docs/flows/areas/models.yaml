    steps:
      - "입력 모양(workspace, agent)을 본다"
      - "core가 요청을 작업 메모리 대기열에 놓고 15초를 기다린다. 대기열은 ledger에 쓰지 않는다. agent runtime이 mcp-tools-take로 가져간다"
      - "runtime이 workspace와 agent가 정하는 서버 집합을 읽는다(전역, Home·project·앱 workspace 층, agent 정의 층). 층을 읽지 못하면 그 층은 없는 것과 같다"
      - "서버마다 끈 것은 연결하지 않는다(disabled). 나머지는 연결해 tools/list를 읽는다. 연결이나 목록 읽기가 실패하면 unreachable이다. 연결이 OAuth 토큰 거절이면 sign-in-required다. 서버마다 10초 상한을 넘어도 unreachable이다"
      - "결과는 mcp-tools-answer(request-done)로 돌아와 list가 깨어난다. 15초 안에 답이 없으면 대기열에서 빠지고 unavailable이다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: disabled
        when: "서버가 설정에서 꺼져 있다. 서버마다의 output reason이다"
        observe: ["response"]
      - id: sign-in-required
        when: "OAuth 로그인이 필요한 서버다(토큰이 없거나 발급자가 거절했다). 서버마다의 output reason이다"
        observe: ["response"]
      - id: unreachable
        when: "연결이나 목록 읽기가 실패했거나 서버별 10초 상한을 넘었다. 서버마다의 output reason이다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "15초 안에 runtime이 답하지 않았다(runtime이 없거나, 서버가 느리거나, runtime이 설정을 못 읽어 답하지 않았다)"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: [H3]
    docs: [architecture/agent-definition.md]
    unclear:
      - "설정 검사(mcp-config)에서 틀린 서버는 목록에 reason 없이 빠진다. 화면이 그 서버가 왜 안 보이는지 알 길이 없다"

