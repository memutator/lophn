group: project-work
scenarios:
  - id: dev-project-handoff
    who: 평소 Claude Code를 쓰는 개발자
    situation: 실험 기록과 메모가 쌓인 폴더를 project로 올려 agent에게 정리와 수정을 맡기고, 열어 둔 문서를 같이 고친다
    says: ["F-009 finding 정리해줘", "이 실험 문서 결론 칸 채워줘"]
