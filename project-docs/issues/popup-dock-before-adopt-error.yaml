id: popup-dock-before-adopt-error
title: 크기 준 popup이 뜬 직후 adopt 전에 Dock·Float하면 그 탭이 오류 화면이 된다
kind: bug
status: fixed
topic: browser-tab
modules: [packages/shell/renderer]
now: |
  `packages/shell/renderer/browser/browser-tab.tsx`는 popup 탭이 다시 mount되면 `ViewKeeps`에서 view를 꺼내고, 없으면 `adopt`를 다시 부른다. popup이 뜬 뒤 첫 `adopt` 답이 오기 전에 사람이 Dock·Float해서 다시 mount되면, 옛 mount의 늦은 답이 view를 보관하기 전에 새 mount가 `adopt`를 다시 불러 main(`packages/shell/main/browser/registry.ts`의 `adopt`)이 `forbidden`(이미 adopt됨)으로 거절한다. 거절된 탭은 빈 `<webview>` 탭으로 바뀐다.
impact: |
  로그인 popup을 뜨자마자 옮기면 로그인 화면을 잃고 빈 탭이 남는다. 몇 ms 안에 옮겨야 생긴다.
fix: |
  (추천, 작음) 진행 중인 adopt를 탭 key로 `ViewKeeps` 옆에 들고, 다시 mount된 쪽이 그 promise를 기다리게 한다.
closed: |
  진행 중인 adopt를 `ViewKeeps.opening`에 탭 key로 들고(`renderer/browser/browser-tab.tsx`), 답 전에 다시 mount한 탭은 `adopt`를 또 부르지 않고 그 promise를 기다린다. 옛 mount의 늦은 답은 보관소에 넣고 새 mount의 답이 곧바로 track해 덮으므로 view는 한 번만 보관되고 닫히지 않는다.
guard: 없음
