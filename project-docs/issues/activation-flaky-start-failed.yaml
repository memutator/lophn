id: activation-flaky-start-failed
title: activation이 가끔 새 앱의 ready를 못 보고 start_failed로 끝난다
kind: bug
status: fixed
topic: activation
modules: [packages/core/apps, packages/core/main]
now: |
  activation 허락 뒤 release가 `failed`, failure `{code: "start_failed", summary: "the new app did not become ready"}`로 끝나고 runtime은 `preparing`에 머문다. `tests/e2e/app-sandbox_test.ts`를 약 200번 돌린 중 5번 났고 부하(load average 6~10)가 높을 때 잦았다. core.log는 비고 앱 stderr를 볼 길이 없어 원인은 모른다. 의심: `packages/core/main/app-supervisor/assembly.ts`의 `probeChild`(ready 기한, "exited before ready"), `packages/core/apps/releases/activation/orchestrator.ts`의 `startCandidate`.
impact: |
  사람이 허락한 release가 이유 없이 실패로 남고 App Engineer에게 `ReleaseActivationFailed` reaction이 간다. 앱 E2E가 모두 이 길을 지나 가끔 실패한다.
fix: |
  반복 실행으로 재현해 ready 관측과 기한 중 어디서 놓치는지 찾는다. 앱 stderr를 실패 진단에 남기면 다음 원인 찾기가 싸진다.
closed: |
  원인은 앱 socket 폴더였다. `${XDG_RUNTIME_DIR}/lophn`의 고정 slot 경로를 같은 사용자의 core가 모두 써서, 한 core의 supervisor가 다른 core 앱의 socket 파일을 지우거나 덮었다(ready 확인과 운영 link 연결이 거절됨). socket 폴더를 data root마다 나눈 뒤(`apps/runtime/processes/socket-dir.ts`의 `socketRootKey`) `tests/e2e/app-sandbox_test.ts` 90번, `tests/e2e/app-restart_test.ts` 4개 동시 16번이 모두 통과했다(고치기 전 각각 약 200번 중 8번, 16번 중 6번 실패).
guard: 없음
