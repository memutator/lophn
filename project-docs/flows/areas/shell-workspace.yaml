    actor: person
    entries: [ui:float-to-all-workspaces]
    when: "float bar의 Show in all workspaces 단추(kind가 noDetach·noGlobal이 아니고 layout에 저장할 수 있는 탭에만 있다)"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/global-floats/global-floats.tsx
      - packages/shell/renderer/shell/global-floats/store.ts
      - packages/shell/main/workspace/global-floats.ts
    steps:
      - "floatToGlobal이 desk float을 찾는다. 없거나 canGoGlobal이 거절하면(noDetach, noGlobal, 저장할 수 없는 탭) 아무 일도 없다"
      - "kind의 transfer를 부른다. null이면 옮기지 않는다. 그 사이 float이 닫혔으면 아무 일도 없다"
      - "global-floats.tsx의 add가 탭, 탭이 나온 workspace, rect, 접힘, 고정을 전역 목록에 더한다(앱 panel은 같은 화면이 있으면, 다른 kind는 같은 key가 있으면 먼저 뺀다). transfer는 본문이 처음 그리기 전에 kind의 receive로 받는다. 전역 목록을 아직 읽기 전이면 바뀌지 않고 false다"
      - "더하기에 성공하면 desk float을 닫는다. 전역 목록이 20개 상한이면 옮기지 않아 desk float은 그대로 남는다"
      - "전역 목록은 store가 저장을 예약해 global-floats-save로 보낸다(탭은 kind의 toStored 값)"
    uses: [ipc:shell:global-floats-save, ipc:shell:workspace-layout-save]
    outcomes:
      - id: moved
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "disk:<data>/shell/global-floats.json"]
      - id: refused
        when: "전역 목록이 상한(20)이라 더 넣을 수 없다, 전역 목록을 아직 읽기 전이라 add가 false를 돌려준다, 또는 kind의 transfer가 null을 돌려줬다(저장이 남은 파일)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
