    covers: [turn-interrupt:interrupted, child-crash-restart:restarted, turn-start:running, turn-finish:completed, session-send:ok, core-boot:ready]
    note: "agent runtime child가 SIGKILL로 죽으면 돌던 turn은 interrupted(restarted)로 닫히고 session은 새 입력으로 turn을 연다. 연속으로 세 번 죽어도 child는 다시 뜬다. platformHealth의 관측은 outcome 이름과 맞지 않아 뺐다."
  - path: tests/harness/loop/loop_test.ts
    covers: [turn-loop:completed, turn-loop:stopped, turn-loop:failed-model-error, turn-loop:failed-stall-limit, turn-loop:failed-context-limit, turn-loop:failed-configuration-unavailable, model-call-run:complete, model-call-run:partial-continue, model-call-run:transient-retry, model-call-run:context-relieved, model-call-run:cancelled, tool-call-batch:success, tool-call-batch:failure, tool-call-batch:retried, tool-call-batch:not-executed, model-call-run:image-rejected, turn-loop:failed-repeated-tool-failure, turn-loop:failed-no-answer, compact-summarize:compacted]
    note: "scripted model로 run loop를 돌리는 안전 규칙 표(행 15개). 잘린 응답의 tool은 실행하지 않고, 일시 실패는 같은 입력으로 두 번까지(연결 끊김은 5·15·30초로 세 번) 다시 보내며, 쓰기 tool은 다시 실행하지 않고, 입력이 너무 크면 오래된 tool 결과를 줄이고, 멈추면 요청을 끊는다. 같은 호출이 같게 세 번 실패하면 네 번째부터 돌지 않고 여섯 번째에 turn이 끝나며(행 13), 빈 응답은 한 번 되묻고 또 비면 no_answer로 끝난다(행 14). 도는 tool round 중에 멈춘 turn은 멈춘 뒤 그 round의 이력을 한 번 남기고(행 6b), image_rejected면 image를 뺀 같은 요청을 한 번 다시 보내며 image가 없거나 또 거절하면 model_error로 끝난다(행 6c)."
  - path: tests/harness/wire/http_test.ts
    covers: [model-call-run:transient-retry, model-call-run:context-relieved, model-call-run:image-rejected, turn-loop:failed-configuration-unavailable, turn-loop:failed-model-error, secret-attach:sent]
    note: "provider HTTP 오류와 stream 오류 frame을 retry할 것과 안 할 것으로 가르는 분류 표를 본다. 분류 결과가 일시 실패 재시도, 문맥 줄이기, 설정 실패, model 오류 종료를 정한다. 설정 실패와 model 오류 종료는 turn-loop:failed-configuration-unavailable·failed-model-error. 설정 실패와 model 오류 종료는 turn-loop:failed-configuration-unavailable·failed-model-error. invalid_request와 model_unavailable 분류에 맞는 turn 결과 outcome은 없다. reset 정보가 없는 429와 OpenAI reset header·\"try again in\"은 일시 실패, max_tokens 오류는 context 초과가 아니라 요청 오류로, image 크기 거절 문구는 image_rejected로 가른다. 요청 중 401은 token을 새로 받아 한 번만 다시 보내고(secret-attach는 가짜) 갱신할 수 없으면 처음 401을 그대로 돌려준다."
  - path: tests/harness/wire/idle_test.ts
    covers: [model-call-run:complete, model-call-run:cancelled, model-call-run:transient-retry]
    note: "호출 하나의 무응답(header 전이나 stream 중간)은 temporary가 되고, ping이 오는 동안은 기한을 새로 걸어 끊지 않으며, 사람이 멈추면 cancelled다. 기본 idle 기한은 MODEL_IDLE_MS다."
  - path: tests/harness/wire/judge_test.ts
    covers: [model-call-run:complete, model-call-run:partial-continue, model-call-run:transient-retry, turn-loop:failed-model-error, turn-loop:failed-configuration-unavailable]
    note: "provider 응답이 complete, partial, failed 가운데 무엇인지 가르는 판정을 본다. 잘린 응답과 틀린 tool 인자는 실행 대상이 아니고, 오류는 retry할 것과 안 할 것으로 갈린다."
  - path: tests/live/anthropic_test.ts
    covers: [model-call-run:complete]
    note: "실제 Anthropic에 text, tool, image 요청을 보내 HTTP 2xx, complete 판정, token 수가 있는지 본다. key가 있을 때만 돈다(npm run test:live)."
  - path: tests/live/openai_test.ts
    covers: [model-call-run:complete]
    note: "실제 OpenAI에 text, tool, image, 잘림(reasoning 한도) 요청을 보내 complete 판정과 token 수를 본다. 잘림 행은 reasoning model의 출력 한도가 실제 요청을 자르지 않는지 본다. key가 있을 때만 돈다."
  - path: tests/live/chatgpt_test.ts
    covers: [turn-finish:completed, model-call-read:ok, provider-read:ok, provider-models-record:recorded, model-catalog-read:ok, provider-token-refresh:refreshed]
    note: "사람이 로그인해 둔 live root의 구독 token으로 turn 하나를 돌려 completed이고 billing_route가 subscription인지, 계정 model 목록이 catalog와 겹치는지 본다. 만료 5분 전 안에서만 갱신을 단정하고, 갱신이 있으면 refresh token이 회전했는지 본다(token-refresh는 그 경우에만 나온다)."
