id: eval-layer-and-17-judgment-cases
version: 0.3.0
title: 'eval 층과 판단 case 17개'
modules: [tests]
checked: [architecture-testing, agents-md, tool-check, tool-context-review]
change: |
  전: 지침과 model이 맡은 일을 맞게 하는지 재는 장치가 없었다. test는 fake model로 계약만 본다.
  후:
  - `deno task eval (--scenario <id> | --all) [--model m] [--trials N] [--budget usd]`가 판단 case를 진짜 model로 돌린다. trial마다 새 data root를 띄우고 재료(`tests/eval/materials/`)를 제품 route로 되살린 뒤, `real` 참가자에게만 agent 층 model을 붙인다. 사람 말 한 줄을 넣고 쉴 때까지 기다려 기록을 모은다. 채점은 program check가 먼저고, 그 premise가 통과하면 Haiku judge(verdict enum, 글자 그대로의 인용)가 이어진다.
  - run 요약은 `tests/eval/runs/<run id>.json`(버전, verdict, judge item, 공통 수치)이고 commit한다. 전체 기록은 `.dev-data/eval/<run id>/`다. 버전은 `tests/eval/registry/`가 hash로 고정한다.
  - `deno task eval:scorecard`가 날짜가 붙은 scorecard를 쓰고, `diff <runA> <runB>`가 두 run을 비교한다.
  - 판단 case 17개: lophn 8, App Engineer 3, Project Manager 2, Operator 4. 첫 scorecard는 `tests/eval/scorecards/2026-10-18.md`다. Sonnet 5.5, trial 1, $1.34, 11/17 통과. 떨어진 것은 A12, A14-other, C9-other, O4(call을 보내지 않고 직접 처리했다), L7(`app.get`을 부르지 않았다), T19-op(막힌 call이 없었다)이다.
  - `tests/eval`의 `*_test.ts`는 순수 unit이라 `deno task check`가 돈다.
why: |
  role 지침, tool 설명, skill을 고칠 때 그 판단이 나아졌는지 숫자로 보려고 한다. AGENT-ROLE의 L1~L7, T19처럼 program이 강제하지 않는 규칙을 잰다.
decisions:
  - text: 'run 요약은 commit하고 전체 기록은 `.dev-data`에 둔다. 요청 body는 product route가 없어 eval이 만든 data root의 blob file에서 읽는다. 제품에 route를 더하지 않는다.'
    by: agent
  - text: 'judge는 runner가 Messages API를 직접 부른다. `claude-haiku-5-5`, forced tool_choice, `thinking: disabled`, `strict`. 진짜 호출로 이 조합이 되는 것을 확인했다.'
    by: agent
  - text: '계획 중 진짜 provider 호출을 허락했다. smoke는 Haiku로 하고, 첫 scorecard는 Sonnet 5.5, 상한 $50로 돌린다.'
    by: person
  - text: 'trial은 `--trials N`이고 기본은 1이다.'
    by: person
follow_up: |
  첫 scorecard의 run은 모두 `source.dirty: true`다(`project-docs/issues/eval.md`). smoke에서 Haiku judge가 사람 요청을 다 옮긴 call 본문을 `some_missing`으로 판정했다. 인용도 사람 말이 아니라 call 본문에서 가져왔다. judge를 얼마나 믿을지는 `eval-experiment`에서 본다.
