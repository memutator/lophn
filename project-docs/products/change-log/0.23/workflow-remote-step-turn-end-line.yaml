id: workflow-remote-step-turn-end-line
version: 0.23.126
title: 다른 컴퓨터가 가져간 workflow step의 turn이 report 없이 끝나면 시작한 컴퓨터의 run에 그 컴퓨터의 lophn이 쓴 줄이 남는다
modules: [packages/protocol, packages/core/lophn-agent, packages/core/router, packages/core/workflows, packages/shell/renderer, packages/design]
change: |
  전: workflow step을 다른 컴퓨터(`on`)에 넘긴 뒤 그 컴퓨터의 turn이 step을 가져가 실패하거나, 사람이 멈추거나, 재시작으로 끊기면 시작한 컴퓨터로 아무것도 가지 않았다. run은 그 step이 그 컴퓨터에서 도는 중("<agent> is working on <step>")으로 줄 없이 서 있었다.
  후:
  - 받은 컴퓨터: step을 가져간 turn이 report 없이 끝나면(실패, 멈춤, 재시작으로 끊김. 켤 때 정산과 agent runtime이 사라졌을 때도 같다) Router가 step call을 닫지 않고 보낸 기계로 reply mail 하나를 낸다. `report: {next: null, session: "new", ended: failed | stopped | restarted}`, 본문과 outcome은 없다. turn은 한 번만 끝나 turn 하나에 mail 하나다. `next`로 report해 닫힌 step은 내지 않는다.
  - 시작한 컴퓨터: 그 mail을 `ApplyWorkflowChange`의 report로 적용해 report 줄(`next` null, by `remote_lophn {machine, computer}`)을 남기고 글은 자기 명단의 컴퓨터 이름으로 쓴다. call 행은 열린 채이고 배달 상태는 running이라 그 session이 뒤에 낸 report가 그대로 닿는다.
  - run 화면: 그 줄은 "lophn on <computer>"가 낸 그 step의 마지막 글로 보이고, 그 step의 가장 나중 줄이 이 줄이면 "지금" 한 장이 넘기지 못한 step과 같은 무게로 그 컴퓨터의 session에서 이으라고 말한다(message key `workflow.note.now-remote-turn-ended`). gallery `workflow-tab-remote-turn-ended`.
  - 계약: mail `reply.report.ended`(선택), workflow 줄 `by`의 `remote_lophn`. 저장 모양 바뀜 없음(줄의 by는 JSON 칸).
why: |
  사람이 다른 컴퓨터에 넘긴 step이 거기서 끊긴 것을 시작한 컴퓨터에서 알 수 없었다. 자리를 비운 사이 그 컴퓨터가 update로 재시작하면 workflow가 사람이 알아챌 때까지 말없이 섰다. 이슈 `workflow-remote-step-turn-end-no-line`.
decisions:
  - text: step은 닫지 않고 진행 줄만 보낸다. 사람이 그 컴퓨터의 session을 다시 밀어 agent가 낸 report가 거절되지 않게 하고, 이 컴퓨터의 step이 실패한 turn으로 닫히지 않는 것과 맞춘다. 버린 길은 그 turn에서 step 닫기다.
    by: agent
  - text: 새 mail 종류나 새 줄 종류 대신 reply mail의 `report`에 `ended`를, report 줄의 `by`에 `remote_lophn` 갈래를 더했다. 글은 시작한 컴퓨터가 쓴다(줄의 다른 컴퓨터 이름과 같은 명단에서 온다). 버린 길은 받은 컴퓨터가 글을 본문에 실어 보내기(이름이 두 명단에서 온다)다.
    by: agent
  - text: 진행 글만 낸 turn이 그 뒤 끊겨도 줄을 보낸다. step이 열려 있고 그 turn이 끝났다는 것을 사람이 알아야 한다. 보내지 않는 것은 next로 report해 닫힌 step뿐이다.
    by: agent
  - text: run 화면의 "지금" 한 장은 그 줄이 그 step의 가장 나중 줄일 때 serious 색으로 그 컴퓨터의 session에서 이으라고 말한다. 상태(Running)와 step 줄의 칸은 바꾸지 않는다(step은 열려 있다).
    by: agent
