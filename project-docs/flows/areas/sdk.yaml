  - {entry: "sdk:agent/contextBlock", reason: "앱 context를 resource block으로 싸는 순수 값 helper다. 보내는 일은 sdk-agent-session의 send가 한다"}
  - {entry: "sdk:agent/parseReply", reason: "agent 답 글에서 JSON을 꺼내 schema 꼴만 보는 순수 함수다. 상태를 바꾸지 않는다. 답을 받는 갈래는 sdk-agent-session이 쓴다"}
  - {entry: "sdk:app-ui/RENDER_ERROR_EVENT", reason: "event 이름 상수다. 보내는 쪽은 sdk-render-error, 받는 쪽은 preload다"}
  - {entry: "sdk:app-ui/appBridge", reason: "window의 lophnApp을 꺼내는 접근자다. 호출은 sdk-operation-call이 한다"}
