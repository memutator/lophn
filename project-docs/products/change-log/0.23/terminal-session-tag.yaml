id: terminal-session-tag
version: 0.23.39
title: "터미널 탭의 process에도 session 표지를 붙이고, GUI 탭을 목록에 채우고, 시작 중 앱의 첫 호출을 받는다"
modules: [packages/protocol, packages/core/apps, packages/core/lophn-agent, packages/shell/main, packages/shell/terminal-host, packages/sdk, packages/core/agent-workspaces]
checked: []
change: |
  전: `LOPHN_SESSION_ID`는 core session(lophn agent의 `shell.run`, headless harness CLI)에만 붙었다. 터미널 탭은 PTY shell pid 아래 process tree로만 이을 수 있었는데, `claude gui`·`codex gui`가 띄운 CLI는 탭의 shell이 아니라 shell main의 자식이라 닿지 않았다(앱이 headless로 분류하고 제목이 없었다). 앱 process가 시작 code에서 부른 `sessions.list`는 release가 active로 잇기 66ms 전이라 `forbidden: the process is not the active release`였다.
  후:
  - 표지: 터미널 host가 PTY를 띄울 때 shell env에 `LOPHN_SESSION_ID=term:<terminal_ref>`(session 목록의 id와 같다)를 직접 넣는다(물려받은 `LOPHN_*`는 그대로 지운다). TUI CLI와 그 아래 process는 물려받는다. harness-gui가 띄우는 모든 CLI(Claude, Codex app-server, OpenCode serve, omp, 다시 띄움, shared server)는 탭 env(`AcpTerminal.env`)로 같은 값을 받고, shell main이 물려받은 값은 `cliEnv`가 지운다. 이 변수를 읽어 "agent session 안이다"로 보는 code는 없다(그 뜻은 `LOPHN_AGENT_SHELL`).
  - GUI 탭: tracker(foreground TUI와 hook)만으로는 GUI view의 탭이 목록에 안 들거나 제목·상태가 없을 수 있었다. 이제 GUI 탭이 있는 터미널은 handle이 접은 ACP 상태(제목, CLI session id, turn 단계 working→running, waiting→waiting, 그 밖 idle, 모르면 unknown)로 채운다. TUI view는 그대로 tracker가 정한다. turn 시작·끝, 승인·질문, 제목이 바뀌면 바로 다시 알린다. `shell_pid`는 행에 그대로 있다.
  - 시작 중 호출: broker는 core의 activation이 `prepare`로 띄웠고 아직 열리지 않은 후보 자식에게만 예외를 둔다. `sessions`는 그 release의 선언으로 답하고, 발행·net·secret·notify는 `unavailable`(다시 시도)이다. 교체된 옛 release의 자식은 전과 같이 `forbidden`이다. `app.tools`가 받던 `release` 인자로 후보의 선언을 읽는다.
  - SDK `@lophn/agent` 1.13.0(지침만): guide에 환경 표지 먼저·`shell_pid` 대안, 켤 때 한 번 읽고 `session.*` event로 고치는 예, 시작 중 `unavailable` 다시 시도. `design-app` skill도 같다. 메모 `agent-1.13.0`.
  - 문서: `terminal-agent.md`, `workspace-session.md`, `harness-gui.md`, `coding-agent.md`, `activation.md`, roadmap 결정 7.
why: 앱(process 감시)이 TUI뿐 아니라 GUI 모드 탭의 process도 session에 이어야 하고, 시작 code가 첫 호출에서 영구 거절로 굳지 않아야 한다.
decisions:
  - text: "표지는 `term:<탭>` 하나로 TUI와 GUI를 덮는다. 버린 길: GUI가 띄운 CLI를 shell main의 자식으로 따로 찾는 API(앱이 알 수 없는 내부 구조에 기대게 된다)."
    by: agent
  - text: "시작 중 호출은 읽기만 후보 선언으로 받고 쓰기는 `unavailable`이다. 버린 길: 후보의 발행을 받기(core가 active release를 보고 구독자를 정하므로 commit 전 발행이 옛 release로 전달된다)."
    by: agent
