      - {do: "설정 file을 파싱할 수 없어 아무것도 쓰지 않고 실패를 보인다", screen: settings-coding, flow: harness-hook-install:failed}

  - id: harness-hook-remove
    title: "lophn이 넣은 hook 항목만 지운다"
    actor: person
    goal: "Uninstall hooks로 lophn의 항목만 지운다. 사람이 더한 항목은 남는다"
    refs: [P6]
    steps:
      - {do: "Uninstall hooks를 누른다. 사람이 더한 항목은 남는다", screen: settings-coding, flow: harness-hook-uninstall:removed}
      - {do: "다시 열어 hook 상태가 missing으로 바뀐 것을 본다", screen: settings-coding, flow: harness-hook-check:ok}

  - id: project-agent-session-first-message
    title: "project의 lophn agent 탭을 열고 첫 메시지로 session을 연다"
    actor: person
    goal: "project 작업대에서 agent 탭을 열고 첫 메시지를 보내 session을 만들고 답을 받는다"
    refs: [P3, P7, P8]
    steps:
      - {do: "왼쪽 sidebar의 + 또는 탭 줄 끝 menu의 Agent로 project agent 탭을 연다", screen: new-agent-conversation, flow: agent-tab-new:opened}
      - {do: "입력칸에 /를 쳐 내장 명령과 skill 목록을 본다", screen: new-agent-commands, flow: command-list-read:ok}
      - {do: "첫 메시지를 보내며 session이 열린다", flow: session-open:ok}
      - {do: "화면이 session의 대화 상태를 읽어 그린다", flow: acp-read:ok}
      - {do: "메시지를 보낸다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "queue의 입력으로 turn이 시작된다", flow: turn-pump-start:started}
      - {do: "답이 대화에 남는다", screen: new-agent-conversation, flow: turn-loop:completed}

  - id: session-steer-while-running
    title: "도는 turn 안에 말을 steer로 넣는다"
    actor: person
    goal: "agent가 일하는 중에 보낸 말을 다음 model 요청 앞에서 turn 안으로 넣는다"
    steps:
      - {do: "긴 작업을 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "turn이 시작된다", flow: turn-pump-start:started}
      - {do: "도는 중에 보낸 말은 steer로 들어가 표시가 붙는다", screen: new-agent-conversation, flow: session-steer:ok}
      - {do: "steer를 반영한 뒤 답으로 끝난다", flow: turn-loop:completed}

  - id: session-queue-edit-move-steer
    title: "turn이 가져가기 전 queue의 말을 고치고 순서를 바꾸고 steer로 올린다"
    actor: person
    goal: "도는 turn이 아직 가져가지 않은 말을 고치고, 순서를 바꾸고, 지금 steer로 올린다"
    steps:
      - {do: "도는 중에 보낸 말이 Next turn 줄에 쌓인다", screen: new-agent-queued-message, flow: session-send:ok}
      - {do: "줄을 눌러 글을 고친다", screen: new-agent-queued-message-edit, flow: queued-edit:ok}
      - {do: "↑ ↓로 순서를 바꾼다", screen: new-agent-queued-message, flow: queued-move:ok}
      - {do: "Send now로 도는 turn의 steer로 올린다", screen: new-agent-queued-message, flow: queued-steer-now:ok}

  - id: session-queue-remove
    title: "queue에 쌓인 말을 기록과 함께 뺀다"
    actor: person
    goal: "turn이 가져가기 전 보낸 말을 queue와 기록에서 지운다"
    steps:
      - {do: "도는 중에 말을 보낸다", screen: new-agent-queued-message, flow: session-send:ok}
      - {do: "줄의 x로 뺀다. queue와 기록에서 지워진다", flow: queued-remove:ok}

  - id: session-stop-turn
    title: "도는 turn을 멈추고 사람이 본 글을 남긴다"
    actor: person
    goal: "길어지는 turn을 Stop으로 멈추고 loop가 model 요청과 tool을 끊게 한다"
    steps:
      - {do: "긴 작업을 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "turn이 시작된다", flow: turn-pump-start:started}
      - {do: "멈춤 단추로 Stop을 누른다", screen: new-agent-conversation, flow: turn-stop:stopped}
      - {do: "loop가 멈춤을 알고 model 요청과 tool을 끊는다", flow: turn-loop:stopped}

  - id: session-ask-answer
    title: "agent의 질문 카드에 순서대로 답한다"
    actor: person
    goal: "agent가 사람에게 물을 것이 있으면 질문 카드로 받고 답을 기다리던 tool에 넘긴다"
    refs: [R4]
    steps:
      - {do: "확인이 필요한 일을 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "agent가 ask tool로 질문 묶음을 올리고 기다린다", flow: ask-wait:submitted}
      - {do: "질문 카드가 열린다", screen: new-agent-question, flow: ask-read:open}
      - {do: "질문 순서대로 답하면 기다리던 tool에 전달된다", screen: new-agent-question-answered, flow: ask-answer:answered}

  - id: session-rename-archive-read
    title: "session 이름을 바꾸고 archive한 뒤 기록만 읽는다"
    actor: person
    goal: "session 제목을 고치고 archive해 새 입력을 막은 뒤, 기록은 그대로 읽는다"
    steps:
      - {do: "헤더의 session 제목을 바꾼다", screen: new-agent-sessions-edit, flow: session-rename:ok}
      - {do: "archive하면 새 입력을 받지 않는다", screen: new-agent-sessions, flow: session-archive:ok}
      - {do: "archive한 session을 열면 기록만 보이고 입력칸이 없다", screen: new-agent-session-archived, flow: session-read:ok}

  - id: session-delete
    title: "session과 대화 기록을 지운다"
    actor: person
    goal: "archive한 session을 지운다. 대화 기록은 되돌릴 수 없다"
    steps:
      - {do: "먼저 session을 archive한다", screen: new-agent-sessions, flow: session-archive:ok}
      - {do: "도는 turn이 있었다면 session_ended로 닫힌다", flow: turn-end-by-session:closed-running}
      - {do: "지우기를 확인한다. 대화 기록은 되돌릴 수 없다", screen: new-agent-sessions-edit, flow: session-delete:ok}

  - id: session-fork
    title: "고른 메시지까지의 확정 메시지를 복사해 새 session을 만든다"
    actor: person
    goal: "대화의 한 지점에서 나눠 새 session으로 이어 간다. skip과 대기 요청은 가져가지 않는다"
    steps:
      - {do: "메시지에서 여기서 나누기를 고르면 새 session이 열린다", screen: new-agent-conversation, flow: session-fork:ok}
      - {do: "새 session의 복사된 기록을 본다", flow: session-read:ok}

  - id: session-model-skip-status
    title: "session의 model과 권한 표시를 바꾸고 /status로 확인한다"
    actor: person
    goal: "model을 고르고 skip을 켠 뒤 /status로 창 점유와 사용량을 확인한다"
    steps:
      - {do: "composer의 model을 고르면 ACP 입력이 그 route로 넘어간다", flow: acp-send:ok}
      - {do: "composer의 model을 고른다", screen: new-agent-model-picker, flow: session-change-model:ok}
      - {do: "권한 단추를 Skip permissions로 바꾼다. 다음 turn부터 닿는다", screen: new-agent-skip, flow: session-change-skip:ok}
      - {do: "/status로 model, 창 점유, 사용량을 본다", screen: new-agent-status, flow: session-status-read:ok}

  - id: session-compact
    title: "긴 대화를 요약해 줄이고 요약 본문을 본다"
    actor: person
    goal: "대화가 길어져 창이 찰 때 이전 대화를 요약해 session에 이어 붙인다"
    steps:
      - {do: "/compact로 이전 대화를 요약해 달라고 청한다", screen: new-agent-context-warning, flow: session-compact-request:ok}
      - {do: "앞 구간을 요약 call로 줄인다", flow: compact-summarize:compacted}
      - {do: "요약을 session에 이어 붙이고 요청을 닫는다", flow: session-compact-commit:ok}
      - {do: "요약 본문을 펼쳐 본다", flow: session-summary-read:ok}

  - id: session-compact-failed
    title: "요약 model이 없으면 compact 요청이 이유와 함께 닫힌다"
    actor: person
    goal: "compact가 실패하면 요청을 이유와 함께 닫고 대화는 그대로 둔다"
    steps:
      - {do: "/compact로 요약을 청한다", screen: new-agent-context-warning, flow: session-compact-request:ok}
      - {do: "요약 model을 쓸 수 없어 실패한다", flow: compact-summarize:failed-model-unavailable}
      - {do: "이유와 함께 요청을 닫는다", flow: session-compact-fail:ok}

  - id: session-shell-bang
    title: "! 명령을 돌려 출력을 session 기록에 남기고 agent에게 잇는다"
    actor: person
    goal: "composer의 ! 명령 결과를 기록으로 남기고, 다음 agent 답에서 그 출력을 보게 한다"
    steps:
      - {do: "composer에 !명령을 쳐 돌린다. turn은 열리지 않는다", screen: new-agent-shell-run, flow: shell-run:ok}
      - {do: "결과를 보고 agent에게 이어 말한다", screen: new-agent-conversation, flow: session-send:ok}

  - id: session-shell-bang-home-refused
    title: "Home에서는 ! 명령이 기본 폴더가 없어 막힌다"
    actor: person
    goal: "Home의 lophn agent에서 ! 명령을 치면 돌리기 전에 막힌다"
    steps:
      - {do: "Home의 lophn agent에 첫 메시지를 보내 session을 연다", flow: session-open:ok}
      - {do: "! 명령을 치면 기본 폴더가 없다고 막힌다", screen: new-agent-shell-mode, flow: shell-run:invalid_input}

  - id: session-message-image
    title: "사진을 붙여 보내고 대화에서 다시 본다"
    actor: person
    goal: "메시지에 사진을 붙여 보내고, 대화에 붙은 사진을 다시 본다"
    steps:
      - {do: "메시지에 붙일 사진을 올린다. 5 MiB 이하다", flow: message-image-upload:ok}
      - {do: "사진과 함께 메시지를 보낸다", flow: session-send:ok}
      - {do: "대화의 메시지에 붙은 사진을 본다", flow: message-image-read:ok}
      - {do: "agent가 그 메시지의 사진 파일 경로를 푼다", flow: message-image-path:ok}

  - id: harness-agent-session
    title: "harness로 켠 agent session에 말을 걸면 CLI가 headless turn을 돈다"
    actor: person
    goal: "Settings에서 harness를 켜고 harness agent session을 열어 말하면 CLI가 입력을 받아 turn을 끝까지 돈다"
    refs: [P6]
    steps:
      - {do: "harness 설정이 꺼져 있으면 harness agent를 열 수 없다", flow: session-open:unavailable}
      - {do: "Settings › System › Extensions에서 harness를 켜고 다시 연다", screen: new-agent-harness, flow: session-open:ok}
      - {do: "메시지를 보낸다", screen: new-agent-harness, flow: session-send:ok}
      - {do: "headless CLI가 입력을 가져가 turn을 연다", flow: harness-turn-start:started}
      - {do: "CLI가 알려 준 session id를 session에 둔다", flow: harness-session-bind:bound}
      - {do: "headless CLI가 turn을 끝까지 돌린다", flow: harness-turn-run:completed}

  - id: usage-and-trace-read
    title: "turn, tool, model 호출의 기록과 사용량을 펼쳐 본다"
    actor: person
    goal: "답의 근거가 된 turn과 tool, model 호출을 거슬러 보고, 기간별 사용량을 합산해 본다"
    steps:
      - {do: "답의 근거가 된 turn 한 건을 연다", flow: turn-read:ok}
      - {do: "tool 입력과 결과 본문을 펼쳐 본다", screen: new-agent-tool-running, flow: turn-body-view-read:ok}
      - {do: "잘린 메시지 본문을 펼친다", flow: message-body-read:ok}
      - {do: "tool 호출 한 건과 turn별 목록을 본다", flow: tool-call-read:ok}
      - {do: "model 호출 한 건을 본다", flow: model-call-read:ok}
      - {do: "원본 참조 trace를 읽는다", flow: agent-trace-read:ok}
      - {do: "사용량과 비용을 기간별로 합산해 본다", flow: agent-usage-read:ok}

  - id: agent-reads-project-files
    title: "agent가 project 폴더에서 자료를 찾고 읽어 답한다"
    actor: person
    goal: "사람이 맡긴 자료 찾기를 agent가 파일 이름과 내용으로 찾고, 읽고, 답에 쓴다"
    steps:
      - {do: "폴더 안의 자료를 찾아 읽어 달라고 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "agent가 파일 이름과 내용으로 찾는다", flow: tool-file-search:matched}
      - {do: "agent가 찾은 파일을 줄 단위로 읽는다", flow: tool-file-read:read}
      - {do: "pdf는 쪽 범위의 text로 읽는다", flow: tool-pdf-read:read}
      - {do: "tool 호출 묶음을 순서와 병렬 규칙으로 실행하고 결과를 모은다", flow: tool-call-batch:success}
      - {do: "그림 파일을 model에 보인다", screen: new-agent-tool-running, flow: tool-image-read:image}
      - {do: "답이 대화에 남는다", flow: turn-loop:completed}

  - id: agent-edits-open-document
    title: "agent가 사람이 열어 둔 문서를 고치면 탭이 그 글을 받는다"
    actor: person
    goal: "편집 중이 아닌 열린 문서는 agent가 바꾼 글을 자동으로 다시 읽는다"
    steps:
      - {do: "문서를 열어 둔다", screen: new-document-tab, flow: editor-open:ready}
      - {do: "문서의 한 자리를 고쳐 달라고 맡긴다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "queue의 입력으로 turn이 시작된다", flow: turn-pump-start:started}
      - {do: "agent가 문서의 한 자리를 바꾼다", screen: new-agent-tool-running, flow: tool-file-edit:edited}
      - {do: "고치지 않은 열린 문서는 바뀐 글을 다시 읽는다", screen: new-file-reloaded, flow: editor-disk-watch:adopted}
      - {do: "답이 대화에 남는다", flow: turn-loop:completed}
