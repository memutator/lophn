      - "main은 보낸 창과 입력을 본다. from이 디스크에 없으면 not_found다. from이나 to가 secrets.json이면 거절한다"
      - "from과 to가 같으면 아무것도 바꾸지 않고 ok다(거절이 아니다). 폴더를 자기 안으로 옮기면 invalid_input이다(실제 경로로 본다)"
      - "to가 이미 있으면 conflict이고 아무것도 바꾸지 않는다. 대소문자만 다른 이름 바꾸기는 같은 파일로 보고 허락한다"
