      - id: not_found
        code: not_found
        when: "call이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "core 안 machine이 아니다, 또는 그 call을 보낸 session이 아니다(not your call)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "router가 아직 없다, 또는 취소 알림 글을 blob으로 준비하지 못했다"
        observe: [response]
    crosses_process: true
    refs: [T18]
    docs: [architecture/agent-call.md]
    declared_only: [internal]
    unclear:
