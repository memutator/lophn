# lophn — Boundary Catalog
#
# lophn이 어떤 경계로 나뉘고 그 사이에 어떤 공개 계약이 있는지의 ID 목록이다. 설명은 한 문장만 쓴다.
# 이 ID가 저장소의 메타데이터 축이다: module-catalog(코드 path → ID), context-component-registry(context가
# 어느 ID와 같이 바뀌나), 계획의 범위가 이 ID를 가리킨다. changelog는 module을 적고 module-catalog로 이 ID에 닿는다.
#
# - elements는 children으로 실제 포함 관계를 짓는 tree다. interfaces는 kind: interface인 공개 계약의 flat 목록이고
#   defined_by(정의), provided_by(구현), used_by(직접 쓰는 쪽)로 요소를 잇는다.
# - kind: subsystem(큰 경계), application(실행 입구), component(안쪽 책임 단위), library(재사용 정의),
#   extension(공개 계약을 따르는 바깥 구현), actor(바깥 사용자), interface(공개 계약).
# - depends_on은 밝힐 필요가 있는 공개 library·interface 의존만 적는다. 내부 import를 다 적지 않는다.
# - ID는 영어 kebab-case이고 파일 전체에서 하나다. 계층을 이름에 넣지 않고, 옮겨도 바꾸지 않고, 다른 뜻에 다시 쓰지 않는다.
# - 부모 ID를 가리킨다고 자식까지 가리키는 것은 아니다. 기능·화면·event마다 ID를 만들지 않는다.
# - 경계나 계약을 바꾸는 변경은 같은 변경에서 이 파일을 고친다. ID·참조·칸은 tools/check-modules.ts가 본다.

schema_version: 1
system: lophn
description: 여러 문서가 같이 가리키는 lophn의 추상화 경계와 공개 계약.
elements:

  - id: protocol
    kind: library
    description: process와 화면 사이에서 주고받는 것의 정의와 그 client.
    depends_on:
      - base

  - id: base
    kind: library
    description: 여러 package가 같이 쓰는 공용 구현.

  - id: core
    kind: subsystem
    description: lophn의 업무 로직(feature module)과 그 바닥.
    depends_on:
      - protocol
      - base
    children:

      - id: projects
        kind: subsystem
        description: project place와 그 폴더의 파일(문서).
        children:

          - id: kinds
            kind: component
            description: domain의 kind 파일(kinds.yaml)과 그것으로 문서를 읽고 검사하고 조회하는 pipeline.

      - id: apps
        kind: subsystem
        description: 사람이 만들고 쓰는 앱. project에 묶이지 않는 그릇이고 앱마다 App Engineer가 있다.
        children:

          - id: app-releases
            kind: component
            description: 앱의 정의와 판.

          - id: app-runtime
            kind: component
            description: 앱의 실행과 capability. 앱마다 file로 남는 앱 log(쓰기는 app supervisor 하나, 읽기 route `apps.logs`)와 예외 stack 풀이를 포함한다.

          - id: app-data
            kind: component
            description: 앱의 업무 data.

          - id: package-registry
            kind: component
            description: lophn이 가진 package와 버전의 목록, 읽기 전용 설치 사본, 사용자 package 받기.

      - id: domains
        kind: subsystem
        description: domain entity(project나 app 안의 책임 경계)와 그 owner·이름 규칙. kind 파일, DOMAIN.md, skill, artifact, 앱 tool이 이 단위로 모인다.

      - id: problems
        kind: subsystem
        description: 앱 SDK가 앱 log에 쓰는 실패 보고(`reportProblem`)와 잡히지 않은 예외 관찰의 protocol 값(`packages/protocol/problems/`). test runner는 지웠다. release의 data 검사는 app-releases의 준비가 한다.

      - id: agent-roles
        kind: component
        description: lophn role 층(lophn, Project Manager, App Engineer, Operator). role마다의 tool 목록, prompt, place 정보, role 표(built-in 이름·기본 profile·정의 file 자리), place 폴더 규칙, data root 아래 자리, 내장 skill.

      - id: lophn-agent
        kind: subsystem
        description: lophn 안의 agent를 정의하고 돌리는 harness. role 이름과 feature module의 route를 모르고 등록받은 tool로 돈다.
        children:

          - id: agents
            kind: component
            description: place에 놓인 agent와 그 설정.

          - id: agent-sessions
            kind: component
            description: agent session과 그 연산.

          - id: run-loop
            kind: component
            description: agent run의 실행.

          - id: agent-tools
            kind: component
            description: agent tool과 그 허락 판정.

          - id: models
            kind: component
            description: model catalog, 사람이 적은 custom model 정보, provider 연결, provider가 알려 주는 model 목록.

      - id: events
        kind: component
        description: commit 뒤 agent event와 남지 않는 event를 화면에 내는 Bus와 Gateway.

      - id: router
        kind: component
        description: 사람 메시지, agent call, program의 반응(reaction)을 받는 session에 넣는 단 하나의 입구.

      - id: storage
        kind: component
        description: lophn 기록의 로컬 저장.

      - id: server
        kind: component
        description: core daemon의 입구.

      - id: supervision
        kind: component
        description: core가 띄우는 child process의 감독.

      - id: approvals
        kind: component
        description: tool 호출의 판정과 사람에게 묻는 길. 할당(앱과 뺀 tool), shell 규칙, turn mode로 판정하고, 물을 것은 기다리는 turn의 request 하나로 묻는다.

      - id: config
        kind: component
        description: 층이 있는 설정 장치.

      - id: secrets
        kind: component
        description: secret 보관(`<data root>/secrets.json`)과 이름 공간별 전송 부착.

      - id: diagnostics
        kind: component
        description: lophn 자체의 운영 log, crash 기록, 상태 점검.

  - id: shell
    kind: application
    description: 사람이 쓰는 desktop app.
    depends_on:
      - protocol
      - base
      - design
      - coding-agent-harness-api

  - id: coding-agent
    kind: subsystem
    description: 사람이 쓰던 coding agent를 lophn에 잇는 쪽.
    depends_on:
      - protocol
      - base
    children:

      - id: coding-agent-cli
        kind: application
        description: coding agent가 쓰는 lophn 명령행.

  - id: design
    kind: library
    description: lophn 화면과 사용자 앱이 같이 쓰는 UI kit.

  - id: sdk
    kind: library
    description: 사용자 앱이 import하는 입구.
    depends_on:
      - protocol
      - design

  - id: app
    kind: extension
    description: 사용자가 만든 앱 하나.
    depends_on:
      - sdk

  - id: user-package
    kind: extension
    description: 앱의 App Engineer가 올린 사용자 package.
    depends_on:
      - sdk

  - id: person
    kind: actor
    description: lophn을 쓰는 사람.

  - id: external-coding-agent
    kind: actor
    description: 사람이 쓰던 coding agent.

interfaces:

  - id: core-api
    kind: interface
    description: core daemon의 로컬 API.
    interface_type: api
    defined_by: protocol
    provided_by:
      - server
    used_by:
      - shell
      - coding-agent
      - run-loop
      - agent-tools
      - app-runtime

  - id: event-stream
    kind: interface
    description: core가 확정한 event의 stream.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - events
      - server
    used_by:
      - shell

  - id: child-supervision-protocol
    kind: interface
    description: core daemon과 child process(shell main과 core 사이 포함) 사이의 감독 계약. control frame은 json 하나가 256KiB 안이고, 넘는 본문은 같은 request의 channel에 bytes frame과 end·abort로 보낸다(blob 준비, 앱 rewind 적용). child의 crash는 진단 한 줄로 core에 오고 core가 component·location을 정해 log에 쓴다.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - supervision
    used_by:
      - run-loop
      - app-runtime
      - app-releases
      - diagnostics
      - shell

  - id: agent-tool-spi
    kind: interface
    description: feature module이 agent tool을 등록하는 계약.
    interface_type: spi
    defined_by: agent-tools
    provided_by:
      - apps
      - domains
      - agent-roles
    used_by:
      - run-loop

  - id: app-spi
    kind: interface
    description: 앱이 구현하는 확장 계약.
    interface_type: spi
    defined_by: protocol
    provided_by:
      - app
    used_by:
      - app-releases
      - app-runtime

  - id: app-capability
    kind: interface
    description: 앱이 lophn에게 받아 쓰는 능력(파일, network, secret 등)을 청하는 계약.
    interface_type: api
    defined_by: protocol
    provided_by:
      - app-runtime
    used_by:
      - sdk

  - id: package-spi
    kind: interface
    description: package 한 버전의 계약.
    interface_type: spi
    defined_by: package-registry
    provided_by:
      - sdk
      - user-package
    used_by:
      - package-registry
      - app-releases

  - id: sdk-api
    kind: interface
    description: 사용자 앱과 package가 import하는 API.
    interface_type: api
    defined_by: sdk
    provided_by:
      - sdk
    used_by:
      - app
      - user-package

  - id: design-api
    kind: interface
    description: UI kit의 공개 API.
    interface_type: api
    defined_by: design
    provided_by:
      - design
    used_by:
      - shell
      - sdk

  - id: coding-agent-harness-api
    kind: interface
    description: coding agent를 찾고 띄우는 API.
    interface_type: api
    defined_by: coding-agent
    provided_by:
      - coding-agent
    used_by:
      - shell

  - id: coding-agent-cli-interface
    kind: interface
    description: lophn 명령행의 계약.
    interface_type: protocol
    defined_by: coding-agent
    provided_by:
      - coding-agent-cli
    used_by:
      - external-coding-agent

  - id: coding-agent-mcp
    kind: interface
    description: coding agent가 맡은 앱의 tool을 그 앱의 preview에서 부르는 MCP endpoint.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - server
      - apps
    used_by:
      - external-coding-agent
