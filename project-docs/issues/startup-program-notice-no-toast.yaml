id: startup-program-notice-no-toast
title: 기동 때 쓴 program 기록의 toast가 뜨지 않는다
kind: bug
status: open
topic: shell
modules: [packages/shell/main, packages/core/main]
now: |
  `noticesWiring.afterReady`가 쓰는 program 기록(`sdk_update_needed`)의 `NoticePosted`는 shell main이 받지 못한다. `afterReady`는 core가 부모(shell main)에게 hello를 보내기 전에 돌고(`packages/core/main/daemon/core.ts`), shell의 Gateway 구독은 hello 뒤에 열려서 그 event는 구독이 없을 때 나간다. 놓친 알림은 다시 띄우지 않는다. 확인했다(코드 순서). sdk-forest 변경으로 배지가 안 읽은 기록을 세어 사람이 몰라서 못 보는 일은 줄었다.
impact: |
  기동 중에 쓴 필수 알림(SDK 업데이트 필요)은 toast·OS 알림이 없다. 배지와 History로만 보인다.
fix: |
  - 기동 뒤 Gateway가 붙으면 안 읽은 급한 program 줄(`sdk_update_needed`, `app_unavailable`)을 `notices.open`으로 읽어 toast로 한 번 보인다(작음).
  - 추천: 이것. 배지가 있으니 급하지는 않다.
