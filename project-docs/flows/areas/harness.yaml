      - "남이 연 탭이거나 탭이 없으면 not_found. 같은 고정 문장이라 남의 탭이 있는지 새지 않는다. 닫혔거나 page가 없어져 표에서 빠진 탭도 같다. shell이 붙어 있지 않은 browser 탭은 page가 사라진 것이라 표에서 빼고 같은 not_found다"
      - "browser 탭이고 상태가 있으면 url, title, loading을 돌려준다. 상태가 아직 없거나 agent·preview·artifact 탭이면 not_found"
      - "url과 title은 caller에 가기 전에 core의 known-value redaction을 거친다. 알려진 값을 아직 다 모르면 unavailable이다"
    outcomes:
      - id: state
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "알려진 secret 값을 아직 다 모르는 동안이라 redaction을 끝내지 못했다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 없거나(닫혔거나 page가 없어져 표에서 빠진 것, shell이 없을 때의 browser 탭 포함), browser 상태가 아직 없거나, agent·preview·artifact 탭이다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: false
    docs: [architecture/browser-tab.md]

  # ---- agent가 연 browser·preview·artifact 탭을 CDP로 다루는 호출 ----
  - id: host-browser-inspect
    title: agent나 사람 token이 자기가 연 browser·preview·artifact 탭의 접근성 tree, screenshot, console 줄을 읽는다
    actor: agent
    entries: [route:browser/snapshot, route:browser/screenshot, route:browser/logs]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/protocol/lophn-agent/host-queue.ts
      - packages/shell/main/browser/agent/driver.ts
    steps:
      - "agent 자격의 session이나 사람 token이 부른다. 남이 연 탭이거나 없는 탭이거나 session·agent 탭이면 not_found다(주인 대조가 shell 판정보다 앞선다)"
      - "shell이 붙어 있지 않으면(/host-link 연결이 없으면) unavailable이다"
      - "browser_call 요청을 queue에 넣고 shell main의 결과를 기다린다. 1초마다 shell이 떨어졌는지와 30초 기한을 본다"
      - "shell이 done에 실은 결과의 글 조각은 caller에 가기 전에 core의 known-value redaction을 거친다(act, navigate, evaluate, wait도 같다). 알려진 값을 아직 다 모르면 unavailable이다. 그 뒤 모양으로 펴 돌려준다: snapshot과 logs는 글, screenshot은 PNG 하나. 모양이 맞지 않으면 internal"
      - "shell 쪽 실패(탭이 창에 없음, DevTools 열림, page 무응답)는 browser-call-run의 code 그대로다"
    outcomes:
      - id: ok
        when: "snapshot은 접근성 tree 글, screenshot은 PNG, logs는 최근 200줄이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 사람이 손으로 연 탭이거나 없는 탭(닫혔거나 page가 없어져 표에서 빠진 탭, shell이 없을 때의 browser 탭 포함)이거나 session·agent 탭이다. 같은 고정 문장이고 model이 그대로 받아 탭을 다시 열게 한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나(preview·artifact 탭), 호출 도중 떨어졌거나, 30초 기한이 지났거나, 탭이 창에 열려 있지 않거나(preview·artifact 탭, browser 탭은 page가 막 사라진 틈), page가 답하지 않거나, 가려진 탭이라 screenshot이 그려지지 않았다(최소화하거나 숨긴 창 포함), 알려진 secret 값을 아직 다 모르는 동안이라 redaction을 끝내지 못했다. queue가 가득 차도 같다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 탭에 DevTools가 열려 있거나 다른 debugger가 붙어 있다"
        observe: [response]
      - id: internal
        code: internal
        when: "shell 결과에 글이나 이미지가 없다(core가 모양을 펴지 못한다). shell의 예상 밖 예외도 같다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]

  - id: host-browser-wait
    title: agent나 사람 token이 자기가 연 탭에서 text나 url이 맞기를 기다린다
    actor: agent
    entries: [route:browser/wait]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/shell/main/browser/agent/driver.ts
    steps:
      - "host-browser-inspect와 같이 주인을 대조한다. text와 url 가운데 정확히 하나가 아니면 invalid_input이다"
      - "shell이 붙어 있으면 timeout_ms(기본 10초, 최대 25초) 안에 맞기를 기다리는 browser_call을 넣는다"
      - "shell이 200ms마다 page를 보고, 맞으면 그때의 url과 title(열린 dialog를 닫았으면 그 내용)을 돌려준다"
      - "시간 안에 맞지 않으면 unavailable이다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 사람이 손으로 연 탭이거나 없는 탭(닫혔거나 page가 없어져 표에서 빠진 탭, shell이 없을 때의 browser 탭 포함)이거나 session·agent 탭이다. 같은 고정 문장이고 model이 그대로 받아 탭을 다시 열게 한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "text와 url을 둘 다 주었거나 둘 다 주지 않았다"
        observe: [response]
      - id: timeout
        code: unavailable
        when: "timeout_ms 안에 조건이 맞지 않았다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나(preview·artifact 탭), 호출 도중 떨어졌거나, 30초 기한이 지났거나, 탭이 창에 열려 있지 않거나(preview·artifact 탭, browser 탭은 page가 막 사라진 틈), page가 답하지 않는다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 탭에 DevTools가 열려 있거나 다른 debugger가 붙어 있다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md]

  - id: host-browser-act
    title: agent나 사람 token이 자기가 연 탭에서 조작하거나 이동하거나 script를 돌린다
    actor: agent
    entries: [route:browser/act, route:browser/navigate, route:browser/evaluate]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/host-queue.ts
      - packages/shell/main/browser/agent/driver.ts
      - packages/shell/main/browser/agent/keys.ts
    steps:
      - "host-browser-inspect와 같이 주인을 대조한다. act는 type별 칸을 다시 검사하고, navigate는 preview·artifact 탭이면 거절하고 url이 http·https·about:blank인지 본다"
      - "shell이 붙어 있으면 browser_call을 넣고 결과를 기다린다. 사람이 그 탭을 가져가(take control) 있으면 shell이 conflict로 거절한다"
      - "act는 ref가 가리키는 node에 click, type, fill, press, hover, select, scroll을 하고 page가 가라앉기를 기다린 뒤 url, title을 돌려준다. 낡은 ref는 conflict다"
      - "act fill_login은 login id가 있는지 core가 먼저 본다(없으면 not_found). queue 항목에는 login id만 싣는다. field가 username이면 core가 metadata의 글을 fill로 바꿔 넣고, password·totp는 shell main이 값을 받아 친다(browser-call-run). 결과는 url, title과 filled: true이고 값은 없다"
      - "navigate는 이동하고 가라앉기를 기다린다. evaluate는 page에서 식을 돌려 JSON 값을 돌려준다. page 안의 예외는 오류가 아니라 exception 글이다"
    outcomes:
      - id: ok
        when: "act와 navigate는 url과 title(닫은 dialog가 있으면 그 내용), evaluate는 value다"
        observe: [response]
      - id: exception
        when: "evaluate한 식이 page 안에서 예외를 냈거나 값이 너무 크다. 오류가 아니라 응답의 exception 글이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 사람이 손으로 연 탭이거나 없는 탭(닫혔거나 page가 없어져 표에서 빠진 탭, shell이 없을 때의 browser 탭 포함)이거나 session·agent 탭이거나, fill_login의 login id가 없다. 같은 고정 문장이고 model이 그대로 받아 탭을 다시 열게 한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사). fill_login의 값을 받을 때 frame의 origin이 저장된 origin과 다르거나 origin이 없는 frame이어도 같다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "act의 type에 맞지 않는 칸, preview·artifact 탭의 navigate, http·https·about:blank 밖의 url, 모르는 key 이름, ref의 node가 그 조작을 받지 못한다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "낡은 ref(새 snapshot이나 main frame 이동 뒤), 사람이 그 탭을 가져가 있음, DevTools가 열려 있거나 다른 debugger가 붙어 있다, fill_login이 치는 동안 그 frame이 이동했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나(preview·artifact 탭), 호출 도중 떨어졌거나, 30초 기한이 지났거나, 탭이 창에 열려 있지 않거나(preview·artifact 탭, browser 탭은 page가 막 사라진 틈), page가 답하지 않거나, 이동이 실패했다"
        observe: [response]
      - id: internal
        code: internal
        when: "shell 결과를 JSON으로 펴지 못한다. shell의 예상 밖 예외도 같다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]

  - id: input-request-ask
    title: agent가 탭의 입력 칸(login)이나 secret 자리(provider key, custom provider, 앱 secret, MCP server)나 로그인 자리를 가리켜 사람에게 값을 넣거나 로그인해 달라고 요청하고 끝날 때까지 기다린다
    actor: agent
    entries: [route:input_request/ask]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell, secrets]
    code:
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/core/main/daemon/wiring/secret-slot.ts
      - packages/core/lophn-agent/tools/questions/wait.ts
      - packages/protocol/lophn-agent/input-request.ts
      - packages/protocol/lophn-agent/custom-provider.ts
      - packages/cli/commands/login.ts
      - packages/cli/commands/ask.ts
    steps:
      - "agent 자격(session 조건 있음)만 부른다. 사람이 없는 turn(unattended)이면 탭이나 자리를 보기 전에 {unattended: true}를 돌려준다"
      - "kind secret: agent는 secret 이름이 아니라 자리를 넘기고 core가 자리를 풀어 요청을 secret(값 넣기)이나 sign_in(로그인)으로 만든다. provider 자리(내장 정의 key)는 home session만 청한다. 정의가 API key를 가졌으면 기본이 API key이고(같은 정의의 provider가 이미 있으면 그 `provider.<id>`의 값 바꾸기, 없으면 새 id를 만들어 값 저장 뒤 보낼 연결 입력을 요청에 싣는다), sign_in을 주었거나 구독 로그인뿐인 정의면 로그인이다(이미 연결된 provider면 conflict). custom provider 자리(display_name, base_url, protocol)도 home만이고 Settings의 Custom 연결과 같은 규칙으로 주소를 검사한다: https 주소만(이 컴퓨터의 http 주소는 key가 없어 요청으로 만들 수 없다). 정의 key는 display_name에서 core가 만들고 내장 정의 key와 겹치면 안 된다. 앱 자리(app id와 이름)는 그 앱 workspace의 session이나 home session만 청하고, 그 앱의 active grant에 그 이름의 secret.use가 있어야 한다(OAuth를 선언했으면 로그인이고 client id가 아직 없으면 conflict). MCP server 자리(이름, 고를 때 part)는 등록된 server 중 이 session이 닿는 층만 본다: home은 전역·Home 층·자기 agent 정의 층, project·앱 session은 자기 agent 정의 층과 자기 workspace 층. 같은 이름이면 agent 층 > workspace 층 > 전역이 이긴다. http server가 가리키는 `mcp.` secret(header, bearer·api_key credential, oauth2 client credential)과 oauth2 로그인이 청할 것이고 stdio·청할 것 없는 server는 not_found, 청할 것이 여럿인데 part가 없거나 틀리면 invalid_input이 고를 목록을 준다. card에 보일 목적지(provider endpoint, 앱의 net.fetch grant, MCP server 주소나 발급자 origin)와 로그인 target은 core가 정의·선언·설정에서 읽는다. 요청을 같은 대기열에 세운다"
      - "kind login: 탭의 주인을 대조한다(host-browser-inspect와 같다). 남의 탭이면 not_found다"
      - "shell main에 browser_call frame_origin을 넣어 ref 요소가 든 frame의 origin을 CDP로 잰다(browser-call-run). agent가 적은 글이 아니고 최상위 URL도 아니다. 그 frame이 origin을 못 내면 forbidden이다"
      - "요청(mode, label, 잰 origin, 탭 제목)을 `ask`와 같은 session별 대기열에 세운다. 앞 질문이나 요청이 풀리면 열리고 QuestionAsked가 나간다. 대화는 질문 내용이 없는 대기 항목으로 보고 card를 그린다(input-request-card)"
      - "사람이 보호 창에서 끝내면(input-request-finish) 결과를 돌려준다: save는 {login: id}, once는 {filled: true}, secret은 {stored: true}, sign_in은 {signed_in: true}(card의 로그인이 끝난 뒤). Cancel, turn 끝, session 닫힘, 사람의 메시지는 {cancelled: true}다"
    outcomes:
      - id: saved
        when: "mode save를 사람이 보호 창에서 저장했다"
        observe: [response, "event:QuestionResolved"]
      - id: filled
        when: "mode once의 값을 shell main이 ref 칸에 쳤다(값은 응답에 없다)"
        observe: [response, "event:QuestionResolved"]
      - id: stored
        when: "secret 자리의 값을 사람이 보호 창에서 넣었다(새 provider 자리면 연결까지 됐다). 값은 응답에 없다"
        observe: [response, "event:QuestionResolved"]
      - id: signed-in
        when: "sign_in 요청의 로그인(구독 provider, 앱 OAuth, MCP OAuth)을 사람이 끝냈다. token은 응답에 없다"
        observe: [response, "event:QuestionResolved"]
      - id: cancelled
        when: "사람이 Cancel했거나 turn이 끝났거나 session이 닫혔거나 사람이 메시지를 보냈다"
        observe: [response, "event:QuestionResolved"]
      - id: unattended
        when: "사람이 없는 turn이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 없는 탭이거나 session·agent 탭이다. secret 자리가 없다(모르는 provider 정의, 없는 앱, 그 앱이 허락받지 않은 secret 이름, 설정에 없거나 이 session이 닿지 않는 층의 MCP server, 청할 것이 없는 MCP server)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격이 아니거나 session이 없다. ref의 frame이 origin을 내지 못한다. home이 아닌 session이 provider·custom provider 자리를, 그 앱이나 home이 아닌 session이 앱 자리를 청했다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "낡은 ref, 사람이 그 탭을 가져가 있음, once를 칠 때 frame origin이 card에 보인 것과 달라졌거나 치는 동안 frame이 이동했다. 이미 다른 방식으로 연결된 provider에 요청했다(key로 연결된 provider에 로그인, 로그인으로 연결된 provider에 key). 앱 OAuth의 client id가 아직 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나 탭이 창에 열려 있지 않거나 origin 재기가 기한을 넘겼다. once 값을 알려진 값으로 올리지 못했다. 값은 저장했지만 provider 연결이 실패했다(값은 지운다. core가 낸 code를 그대로 돌려줘 다른 code일 수 있다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "ref나 mode 모양이 틀리다. 로그인이 없는 정의에 sign_in을 청했거나 연결할 수 없는 정의다. custom provider의 주소가 https가 아니거나 이름이 내장 정의와 겹친다. MCP server가 청할 것이 여럿인데 part를 안 줬거나 목록에 없다"
        observe: [response]
    crosses_process: true
    risk: [secret, permission]
    docs: [architecture/browser-tab.md]
    unclear:
      - "한 번 넣은 값은 그 session이 끝날 때까지 알려진 값(redaction 입력)으로 붙든다. core가 재시작하면 기다림과 함께 사라진다"

  - id: input-request-card
    title: 사람이 대화의 입력 요청 card(login, secret, sign_in)를 읽거나 Cancel하거나 로그인한다
    actor: person
    entries: [route:input_request/read, route:input_request/cancel]
    boundary: [shell, host-queue-core]
    code:
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/shell/renderer/conversation/input-request-card/input-request-card.tsx
      - packages/shell/renderer/conversation/agent-tab-core-source-request.ts
      - packages/shell/renderer/desktop/settings/sign-in.ts
    steps:
      - "열린 요청이 있으면 대화가 질문 내용이 없는 대기 항목을 읽어 card를 그린다. login은 agent 이름, 탭 제목, shell main이 잰 origin(크게), mode다. secret은 agent 이름, 대상(provider, 앱, MCP server 이름), core가 읽은 목적지(크게), secret 이름, 이미 값이 있으면 바꾼다는 안내다. sign_in은 agent 이름, 대상, 로그인하는 곳(발급자 origin이나 endpoint)이다. 사람이 아닌 actor는 forbidden이다"
      - "card의 [Enter]는 session과 tool call만 shell main에 보내 보호 창을 연다(secret-input). 창은 이 클릭으로만 열린다. agent는 열 수 없다"
      - "sign_in의 [Sign in]은 card가 view의 target(core가 읽은 값)으로 지금 화면의 로그인 흐름을 돌린다: 구독 provider는 providers/login-begin → OS browser → login-complete 반복(device code면 card에 code), 앱 OAuth는 apps/oauth_begin → browser → oauth_state를 본다, MCP는 agent-mcp-auth/begin → browser → complete. 끝나면 card가 input_request/done {signed_in}을 부르고 실패하면 {error}를 부른다(input-request-finish). 로그인 중 [Cancel]은 시작한 로그인을 닫고 요청을 접는다"
      - "[Cancel]은 요청을 {cancelled: true}로 푼다. 이미 풀렸으면 not_found다"
    outcomes:
      - id: read
        observe: [response]
      - id: cancelled
        observe: [response, "event:QuestionResolved"]
      - id: not_found
        code: not_found
        when: "요청이 열려 있지 않다(풀렸거나 줄에 서 있고 아직 열리지 않았다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token이 아니다"
        observe: [response]
    crosses_process: true
    risk: [secret]
    docs: [architecture/browser-tab.md]

  - id: input-request-finish
    title: shell main이 보호 창의 입력으로, 대화 card가 로그인 결과로 입력 요청을 끝낸다(login 저장, once 값 붙들기, secret 저장과 provider 연결, 결과 알리기)
    actor: shell
    entries: [route:input_request/hold, route:input_request/done]
    uses: [route:logins/save, route:secrets/put, route:providers/connect]
    boundary: [shell, secrets]
    code:
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/core/secrets/secret-store.ts
      - packages/shell/main/secret-input/request.ts
    steps:
      - "save: 창이 label, username, password, 선택 TOTP를 받는다. main이 logins/save(origin은 요청 때 잰 값)와 secrets/put으로 login.<id>.password·totp를 넣고 done {login}을 보낸다. 값을 넣지 못하면 방금 만든 login을 지우고 창에 오류를 보인다"
      - "once: main이 값을 hold로 core에 올려 그 session이 끝날 때까지 알려진 값으로 붙든다(파일·ledger에는 쓰지 않는다). 그 뒤 browser driver가 ref 칸이 든 frame의 origin을 다시 재서 card에 보인 것과 같을 때만 값을 친다. 다르거나 치는 동안 frame이 이동하면 치지 않고(또는 멈추고) done {error: conflict}를 보낸다. 성공이면 done {filled: true}다"
      - "secret: 창은 설정 화면과 같은 한 칸이다. main이 core가 정한 이름으로 secrets/put을 하고, 새 provider 자리면 요청에 실린 입력에 그 이름을 credential로 붙여 providers/connect를 보낸다. 연결이 conflict 밖의 오류로 실패하면 방금 넣은 값을 secrets/delete로 지우고 done {error}를 보낸다. 성공이면 done {stored: true}다. 저장부터 실패하면 창에 오류를 보이고 요청은 열려 있다"
      - "sign_in: 보호 창이 아니라 대화 card의 로그인 흐름(input-request-card)이 끝나면 renderer가 done {signed_in}이나 {error}를 부른다. signed_in은 sign_in 요청에만, sign_in 요청은 signed_in이나 error만 받는다(아니면 invalid_input)"
      - "hold는 사람 token의 shell main만 부른다(renderer 통로에 없다). done은 사람 token(shell main, sign_in은 renderer)이 부른다. 열린 요청이 아니면 not_found다. hold는 once 요청에만 된다"
      - "붙든 값은 session이 끝나면 놓는다(SessionEnded)"
    outcomes:
      - id: held
        when: "once 값이 알려진 값으로 올랐다"
        observe: [response]
      - id: done
        when: "결과(login, filled, stored, signed_in, error)를 기다리던 agent에게 돌려줬다"
        observe: [response, "event:QuestionResolved"]
      - id: connect-failed
        when: "secret 값은 저장됐지만 provider 연결이 실패해 값을 지우고 error를 돌려줬다"
        observe: [response, "event:QuestionResolved"]
      - id: not_found
        code: not_found
        when: "요청이 열려 있지 않다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "once가 아닌 요청에 hold를 불렀다. 요청 종류에 맞지 않는 결과로 done을 불렀다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "값을 알려진 값으로 올리지 못했다(reader에 닿지 않음)"
        observe: [response]
    crosses_process: true
    risk: [secret]
    docs: [architecture/browser-tab.md]

  - id: browser-call-run
    title: shell main이 browser_call을 그 탭의 page에 CDP로 돌려 결과를 done에 싣는다
    actor: shell
    entries: [system:browser-call-run]
    uses: [host-link:open, host-link:done]
    boundary: [shell, host-queue-interface]
    code:
      - packages/shell/main/browser/agent/driver.ts
      - packages/shell/main/browser/agent/control.ts
      - packages/shell/main/browser/agent/page.ts
      - packages/shell/main/browser/agent/electron-page.ts
      - packages/shell/main/browser/agent/snapshot.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/main/desktop/core/connection.ts
    steps:
      - "/host-link가 browser_call을 주면 창에 보내지 않고 shell main이 따로 돌린다. 끝나면 결과나 오류를 response에 싣는다. 호출마다 그 page를 가진 창에 알려 쓴 때를 센다(창마다 12개 상한에서 오래 쓰지 않은 것부터 놓는다)"
      - "창이 bind로 알린 view session에서 page를 찾는다. host browser 탭은 그 workspace가 mount되지 않아도 창 단위로 bind한다. browser 탭은 browser partition의 webview guest, preview 탭은 mode가 preview인 앱 view, artifact 탭은 artifact view registry에 붙은 guest다. 앱 live view는 어떤 경우에도 고르지 않는다. 없으면 unavailable"
      - "그 탭을 agent가 다루는 중으로 적는다. 사람이 take control 중이면 act, navigate, evaluate는 conflict이고 읽기(snapshot, screenshot, logs, wait)는 된다"
      - "DevTools가 열려 있거나 다른 debugger가 붙어 있으면 붙지 않고 conflict다. 붙으면 DOM, Accessibility 등 domain을 켠다"
      - "snapshot마다 ref를 새로 매긴다. 새 snapshot이나 main frame 이동 뒤 옛 ref는 conflict다. `type=password` 칸의 value는 찍지 않는다(값이 있으면 ••••, 비었으면 생략)"
      - "act fill_login(password·totp)은 ref node가 든 frame을 DOM tree에서 찾아 그 frame의 origin을 CDP로 잰다(최상위 URL이 아니다). 그 origin으로 core logins/release를 shell capability로 불러 값을 받고, 지금 fill과 같이 다 지우고 한 글자씩 친다. 치는 동안 그 frame이나 최상위가 이동하거나 frame이 떨어지면 멈추고 conflict다. 값은 log·오류·결과에 싣지 않는다. frame_origin(login 요청의 origin 재기)은 같은 재기로 origin과 page 제목만 돌려주고, 보호 창의 한 번 넣기(typeOnce, core queue를 지나지 않는다)는 값을 치기 전에 다시 재서 card에 보인 origin과 다르면 치지 않고 conflict다"
      - "page가 CALL 기한 안에 답하지 않으면 unavailable이다. page 안의 예외(evaluate)는 오류가 아니라 exception 결과다"
    outcomes:
      - id: done
        when: "snapshot, act, navigate, screenshot, evaluate, logs, wait의 결과(content)를 done에 실었다. evaluate가 page 예외로 끝난 것도 여기다"
        observe: [response]
      - id: tab-not-open
        code: unavailable
        when: "bind된 view session이 없거나 page가 닫혔거나 browser·preview 종류가 맞지 않는다(앱 live view 포함). browser 탭이면 \"page가 사라졌다, tab open --url로 다시 열라\"는 고정 문장이고, preview·artifact 탭이면 그 workspace를 띄운 창이 없다는 문장이다"
        observe: [response]
      - id: person-holds
        code: conflict
        when: "사람이 그 탭을 가져가 있는데 act, navigate, evaluate가 왔다"
        observe: [response]
      - id: debugger-busy
        code: conflict
        when: "DevTools가 열려 있거나 우리 것이 아닌 debugger가 붙어 있다"
        observe: [response]
      - id: stale-ref
        code: conflict
        when: "act가 가리킨 ref가 현재 snapshot에 없다"
        observe: [response]
      - id: login-frame-moved
        code: conflict
        when: "fill_login이 치는 동안 그 frame이나 최상위가 이동했거나 frame이 떨어졌다. 그 뒤 글자는 치지 않는다"
        observe: [response]
      - id: login-refused
        code: forbidden
        when: "frame의 origin이 저장된 login의 origin과 글자 그대로 같지 않거나, origin이 없는 frame이다(core logins/release의 거절). login이 없으면 not_found, core가 닿지 않으면 unavailable로 그 code 그대로다"
        observe: [response]
      - id: rejected
        code: invalid_input
        when: "preview·artifact 탭의 navigate, 허용하지 않는 url, 모르는 key, ref의 node가 그 조작을 받지 못해 page 함수가 던짐, wait에 text와 url이 둘 다/둘 다 없음"
        observe: [response]
      - id: timeout
        code: unavailable
        when: "page가 기한 안에 답하지 않았거나, wait 조건이 시간 안에 맞지 않았거나, 이동이 실패했거나, 가려진 탭이라 screenshot이 그려지지 않았다"
        observe: [response]
      - id: internal
        code: internal
        when: "CallError가 아닌 예외가 났다"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]

  # ---- shell 쪽 timer와 core 쪽 lease ----
  - id: harness-turn-run
    title: harness 입력을 headless CLI로 실행해 turn을 끝까지 돌린다
    actor: shell
    entries: [system:harness-turn-run]
    uses:
      - harness-take:input
      - harness-turn-start:started
      - harness-turn-record:recorded
      - harness-session-bind:bound
      - harness-turn-finish:finished
      - route:turns/read
      - route:agents/read
      - route:projects/get
      - route:apps/get
    boundary: [shell-extension, harness-host-interface]
    code:
      - packages/shell/main/extensions/bundled/harness/host.ts
      - packages/protocol/coding-agent/headless/
      - packages/protocol/coding-agent/harness-adapter.ts
    steps:
      - "extension harness가 1초마다 tick한다. take로 입력을 보고(없으면 끝), start_turn으로 turn을 연다. 둘 중 하나가 거절하면 이번 tick을 끝낸다"
      - "cwd를 고른다. home은 harness-home의 빈 폴더, project와 app은 첫 폴더다. 없으면 configuration-unavailable"
      - "agent 정의의 deny를 그 CLI의 권한 표현으로 옮긴다. 옮길 수 없으면 configuration-unavailable. git 저장소 안의 하위 폴더면 띄우지 않는다"
      - "headless CLI(claude -p, codex exec, opencode run)를 cwd와 turn 자격 env로 띄우고 stdin을 닫는다"
      - "줄마다 parser로 읽어 글과 harness_tool은 record로, CLI session id는 set_external_id로 보낸다"
      - "1초마다 turns/read로 core가 turn을 닫았는지 본다. 닫혔으면(멈춤) process를 죽이고 더 기록하지 않는다"
      - "process가 끝나면 글이 있으면 completed, 없으면 no-answer, 실패는 실패 글을 record한 뒤 model-error나 target-unavailable로 finish한다"
    outcomes:
      - id: idle
        when: "take가 입력을 주지 않았다. 이번 tick에 할 일이 없다"
        observe: [response]
      - id: not-started
        when: "take가 실패했거나 start_turn이 거절했다(설정이 꺼짐, queue 머리가 아님, 다른 turn이 돎 등). turn이 열리지 않았다"
        observe: [response]
      - id: completed
        observe: [ledger:turns, event:TurnEnded]
      - id: model-error
        when: "CLI가 end event로 실패를 알리거나 0이 아닌 exit code로 끝났다"
        observe: [ledger:messages, ledger:turns, event:TurnEnded]
      - id: target-unavailable
        when: "CLI를 띄우지 못했거나(headless를 지원하지 않는 CLI 포함) 신호로 끝났다. agent 정의를 읽지 못했다. extension이 꺼지며 process를 끊었다. 실행 중 예외가 났다"
        observe: [ledger:messages, ledger:turns, event:TurnEnded]
      - id: configuration-unavailable
        when: "cwd가 없거나 deny를 옮길 수 없거나 빈 입력이거나 git 최상위가 아니다"
        observe: [ledger:messages, ledger:turns, event:TurnEnded]
      - id: no-answer
        when: "글 없이 끝났다"
        observe: [ledger:turns, event:TurnEnded]
      - id: stopped-by-core
        when: "사람의 멈춤이나 재시작으로 core가 turn을 이미 닫았다(turns/read가 finished). 또는 record가 conflict를 받았다. finish를 부르지 않는다"
        observe: [ledger:turns]
    crosses_process: true
    risk: [sandbox, secret]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "extension 종료(stop) 때 실행 중 turn은 target-unavailable로 finish한다. 설정이 꺼진 뒤의 finish는 core가 conflict로 거절할 수 있다"

  - id: host-queue-poll
    title: shell main이 /host-link로 받은 host 요청을 창에 열거나 extension tool·browser 호출을 돌린다
    actor: shell
    entries: [system:host-queue-poll]
    uses: [host-link:open, host-link:closed]
    boundary: [host-queue-interface, shell]
    code:
      - packages/shell/main/desktop/core/host-link.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/ipc/surface.ts
    steps:
      - "Gateway가 처음 ready가 되면 사람 token으로 /host-link를 열고 hello에 보이는 workspace와 TUI 목록을 싣는다. 끊기면 1초에서 30초까지 두 배씩 늘려 다시 붙고 hello부터 다시 보낸다. core가 다시 떠 주소나 token이 바뀌면 Gateway ready 때 새 값으로 바로 붙는다"
      - "보이는 workspace와 TUI 목록을 창이 알릴 때와 1초마다 보고, 바뀌었으면 visible을 보낸다"
      - "request가 오면 종류마다 단 처리기로 돌린다. tool_call이면 extension tool을, browser_call이면 browser driver를, terminal_interrupt이면 터미널의 끊기 key를 따로 돌리고 끝나면 결과를 response에 싣는다. 처리기가 없는 종류는 unavailable로 답한다"
      - "탭 요청은 받은 차례로 하나씩 그 workspace를 보이는 창 가운데 focus를 가장 최근에 받은 하나에만 push하고 창의 ack를 1.5초 기다린다(두 창이 같은 탭을 열지 않는다). browser 탭 열기는 보이는 창이 없으면 가장 최근 일반 창에 보내고, 일반 창이 하나도 없으면 focus 없이 하나 연다(desktop-window-open-inactive). browser 탭 닫기는 page를 가진 창에 보낸다"
      - "ack가 오면 response done. browser 탭 열기는 ack 뒤 page가 붙는(bind) 때 done으로 core에 답한다(page를 둘 창이 닫히면 오류로 답한다). 창이 없거나 ack가 없으면 1초 쉰 뒤 retry로 답한다(core가 바로 다시 밀지 않게). 창을 끝내 만들지 못한 browser 탭 열기는 retry가 아니라 unavailable로 답한다"
      - "창이 알린 host 탭의 browser 상태와 닫힘은 report frame으로 올린다. 연결이 끊긴 동안의 답과 보고는 버린다(core가 결과 요청을 이미 unavailable로 끝냈고 탭 요청은 다시 민다)"
    outcomes:
      - id: offered
        observe: [screen:project-terminal]
      - id: retry
        when: "창이 없거나, 창이 1.5초 안에 ack하지 않았거나, 창이 열지 못했다고 답했다(browser 탭 열기는 창을 열어 보고도 없을 때만 오류로 끝난다)"
        observe: [response]
      - id: browser-open-answered
        when: "browser 탭 열기를 창이 ack했고 page가 bind되어 done으로 답했다. 일반 창이 없었으면 focus 없이 창을 열고 거기 보냈다"
        observe: [response, "process:창의 pool에 page가 있다"]
      - id: browser-open-failed
        when: "browser 탭 열기에 받을 창을 만들지 못했거나 page를 둘 창이 답하기 전에 닫혔다. unavailable과 고정 문장으로 done한다"
        observe: [response]
      - id: tool-call
        when: "tool_call 요청이다. extension tool을 따로 돌리고 끝나면 response에 결과를 싣는다"
        observe: [response]
      - id: browser-call
        when: "browser_call 요청이다. browser driver(browser-call-run)를 따로 돌리고 끝나면 response에 결과를 싣는다"
        observe: [response]
      - id: unhandled
        when: "이 shell에 처리기가 없는 종류의 요청이다(coding_open). unavailable로 답한다"
        observe: [response]
      - id: reconnect
        when: "연결이 열리지 않았거나 끊겼다. 1초에서 30초까지 두 배씩 늘려 다시 붙는다. 끊긴 연결로 받은 요청의 답은 보내지 않는다"
        observe: [response]
    crosses_process: true
    docs: [architecture/coding-agent.md, architecture/workspace-layout.md]
    unclear:
      - "offered 결과 화면은 프레임 project-terminal로 근사했다. agent가 연 탭의 정확한 프레임은 확인하지 않았다"

  - id: harness-tui-hold
    title: TUI 탭이 열린 harness session의 hold를 연장하거나 푼다
    actor: system
    entries: [system:harness-tui-hold]
    uses: [harness-tui-open:accepted, host-link:open]
    boundary: [harness-host-core, host-queue-core]
    code:
      - packages/core/host-queue/hold.ts
      - packages/core/main/daemon/wiring/harness.ts
      - packages/shell/main/terminal/harness-tui.ts
    steps:
      - "tabs/open의 tui 판정을 통과하면 그 자리에서 30초 예약한다(첫 heartbeat까지의 틈)"
      - "shell main이 /host-link의 hello·visible에 실은 TUI 탭 session 목록을 core가 연결이 열린 동안 1초마다 heartbeat로 넣는다. 목록에 실린 session은 10초로 연장한다. 연결이 닫히면 갱신이 멈춰 10초 뒤 풀린다"
      - "한 번 목록에 실렸던 session이 빠지면 바로 푼다. 탭 닫힘, 창 닫힘, CLI가 foreground를 떠남이 여기서 드러난다"
      - "폰이 resume으로 되살린 coding session(coding-session-open)도 같은 목록에 든다. 그 터미널이 끝날 때(process가 끝났거나 terminal host가 사라졌다) 빠진다. 사람이 그 채팅을 터미널로 바꿔 GUI handle이 닫혀도 같은 CLI session을 TUI가 이어 쓰므로 빠지지 않는다"
      - "한 번도 실리지 않은 session은 30초 뒤 만료된다"
      - "hold된 동안 harness/take는 그 session을 건너뛰고 harness/start_turn은 conflict다"
    outcomes:
      - id: extended
        when: "heartbeat 목록에 실렸다. 10초로 연장한다"
        observe: [response]
      - id: released
        when: "한 번 실렸던 session이 목록에서 빠졌다"
        observe: [response]
      - id: expired
        when: "예약 30초 안에 한 번도 실리지 않았다. 또는 heartbeat가 끊겨 연장된 시각을 넘었다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-queue-restore
    title: core가 다시 떠서 접수만 된 harness 입력을 queue에 되돌린다
    actor: system
    entries: [system:harness-queue-restore]
    boundary: [harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/lophn-agent/session/message-commands.ts
    steps:
      - "core 기동 때 harness wiring의 start가 ledger에서 아직 시작하지 않은 사람 메시지를 찾는다"
      - "session이 입력을 받고 harness이면 harness queue에 다시 넣는다. 본문은 take가 기록에서 읽는다"
      - "닫혔거나 보관되었거나 harness가 아니면 건너뛴다"
      - "돌던 turn은 router가 interrupted(restarted)로 먼저 닫는다. 그 뒤의 harness-turn-finish는 conflict다"
    outcomes:
      - id: queued
        observe: [response]
      - id: skipped
        when: "session이 닫혔거나 보관되었거나 harness가 아니다"
        observe: [response]
      - id: unopened
        when: "ledger를 열지 못했다. 아무것도 다시 넣지 않고 기동을 이어 간다"
        observe: []
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "start()는 core 기동 때 한 번 돈다. 설정을 껐다 켰을 때 queue가 비고 start()가 다시 도는지는 확인하지 못했다"

  # ---- 터미널 탭의 coding agent: hook과 상태 ----
  - id: terminal-hook-forward
    title: harness hook이 부른 lophn hook을 터미널 hook socket으로 보낸다
    actor: coding-agent
    entries: [cli:hook]
    boundary: [coding-agent, coding-agent-cli]
    code:
      - packages/coding-agent/local/hook.ts
      - packages/protocol/coding-agent/terminal-hook.ts
      - packages/protocol/coding-agent/hook-signal.ts
    steps:
      - "harness의 전역 hook이 lophn hook <harness> <event>를 부르고 JSON을 stdin으로 준다"
      - "LPN_TERMINAL_HOOK이 없으면 stdin을 읽지 않고 harness가 요구하는 stdout만 내고 끝낸다"
      - "stdin은 1 MiB까지 1초 안에 읽고(닫히지 않는 stdin이면 포기하고 성공으로 끝낸다) 최상위 글 field를 4096자로 자른다. event가 lophn-gui면 호출한 cwd를 더한다"
      - "payload가 64 KiB를 넘거나 JSON이 깨졌으면 버린다"
      - "터미널 socket에 {v, key, harness, event, payload} 한 줄을 쓰고 답 없이 닫는다. 1초 안에 못 쓰면 버린다. 실패해도 성공으로 끝낸다"
    outcomes:
      - id: sent
        when: "줄을 터미널 socket에 썼다"
        observe: [response]
      - id: skipped
        when: "LPN_TERMINAL_HOOK이 없거나 맞지 않다. stdin을 읽지 않는다"
        observe: [response]
      - id: dropped
        when: "stdin이 1 MiB를 넘었거나 1초 안에 끝나지 않았다, JSON이 깨졌다, payload가 64 KiB를 넘었다, 줄이 계약에 맞지 않다, socket에 1초 안에 못 썼다(stdin 읽기와 쓰기가 1초를 나눠 쓴다. 실패도 성공으로 끝난다)"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/terminal-agent.md, architecture/coding-agent.md]

  - id: harness-gui-open
    title: 터미널 탭에서 claude gui 등을 치면 탭을 GUI 채팅 화면으로 바꾼다
    actor: person
    uses: [cli:hook]
    when: "hook event가 lophn-gui일 때"
    boundary: [shell-extension, shell]
    code:
      - packages/shell/main/terminal/gui.ts
      - packages/shell/main/extensions/bundled/harness-gui/index.ts
      - packages/shell/main/extensions/bundled/harness-gui/adapter.ts
      - packages/shell/renderer/terminal/terminal-gui.tsx
    steps:
      - "사람이 터미널에서 claude gui, codex gui, opencode gui, omp gui(gui --resume id 포함)를 친다. 셸 함수가 lophn hook으로 resume 값을 보낸다"
      - "shell main이 key로 탭을 찾는다. harness가 GUI를 지원하고 터미널이 살아 있을 때만 extension의 onTab.gui를 부른다. 아니면 무시한다"
      - "extension이 꺼져 있으면 Settings › System › Extensions를 열고 끝낸다"
      - "이미 그 터미널에 GUI를 여는 중이면 이 요청은 아무 일도 하지 않는다"
      - "TUI가 떠 있으면 adapter.exitTui로 끄고 5초 안에 foreground가 shell이 되기를 기다린다. 못 기다리면 실패"
      - "extension spawner가 사람의 login env를 읽기를 기다린 뒤(최대 5초) adapter.start로 CLI를 그 env와 탭 폴더에서 띄우고 ACP handle을 만든다. 시작하는 사이 탭이나 터미널이 닫혔으면 CLI를 세운다. adapter나 TUI 끄기가 던지면 internal 실패로 turn 오류를 보인다"
      - "탭을 가진 창에 GUI 열림을 push하고 1.5초 안에 ack가 와야 탭이 GUI view가 된다. 없으면 handle을 닫는다"
    outcomes:
      - id: opened
        observe: [screen:harness-gui-terminal-tab]
      - id: already-open
        when: "그 터미널에 handle이 이미 있다. view만 gui로 바꾼다"
        observe: [screen:harness-gui-terminal-tab]
      - id: already-opening
        when: "같은 터미널의 GUI 열기가 아직 도는 중이다. 이 요청은 아무 일도 하지 않는다"
        observe: [response]
      - id: ack-timeout
        when: "탭을 가진 창이 1.5초 안에 ack하지 않았다. handle을 닫는다"
        observe: [screen:project-terminal]
      - id: extension-off
        when: "harness-gui extension이 꺼져 있다. Settings를 연다"
        observe: [process:settings-window]
      - id: start-failed
        when: "adapter.start나 exitTui가 실패했다(던진 것은 internal로 보인다), 또는 exitTui 뒤 5초 안에 shell이 foreground가 되지 않았다. GUI view에는 실패한 turn으로 보인다"
        observe: [screen:harness-gui-terminal-tab]
      - id: terminal-gone
        when: "adapter가 시작하는 사이 터미널이 끝났다. handle을 닫아 CLI를 세운다"
        observe: [process:cli-gui]
      - id: ignored
        when: "탭 runtime이 없거나, GUI를 지원하지 않는 harness거나, payload가 틀렸다"
        observe: [response]
    crosses_process: true
    refs: [P6]
    docs: [architecture/harness-gui.md]
    unclear:
      - "Settings › System › Extensions 화면에는 wireframe frame이 없다. extension-off의 observe는 process:settings-window로 적었다"

  - id: terminal-agent-track
    title: 터미널 탭의 coding agent 상태(running, waiting, idle, unknown)를 정하고 탭 점을 바꾼다
    actor: shell
    entries: [system:terminal-agent-track]
    uses: [cli:hook, ipc:shell:terminal-state, ipc:shell:terminal-agents]
    boundary: [shell, coding-agent]
    code:
      - packages/shell/main/terminal/agent/tracker.ts
      - packages/shell/main/terminal/agent/osc-title.ts
      - packages/shell/main/terminal/agent/ingress.ts
      - packages/shell/main/desktop/wiring/agent.ts
      - packages/protocol/coding-agent/hook-signal.ts
    steps:
      - "hook 줄을 socket에서 받아 key로 터미널을 찾는다. 모르는 key, 상한을 넘는 줄, 깨진 줄은 버린다. lophn-gui는 harness-gui-open으로 넘긴다"
      - "terminal-host가 1초마다 보내는 foreground argv로 harnessOfProcess가 harness를 고른다. 다른 harness의 hook은 버린다"
      - "TurnStarted는 running, PermissionRequested는 waiting(수를 센다), TurnEnded는 main turn을 끝내고 권한 수를 0으로 둔다. ChildStarted·ChildEnded는 child 집합을 바꾼다. SessionEnded는 unknown이다"
      - "보이는 상태는 권한 물음이 있으면 waiting, main turn이나 child가 있으면 running, 아니면 idle이다. hook을 한 번도 못 들었으면 unknown이다"
      - "Esc나 Ctrl-C를 사람이 치면 끊김 hook이 없는 harness에 한해 unknown으로 짐작(guessed)한다. 뒤따르는 PermissionResolved가 오면 running으로 되돌린다"
      - "child는 10분 동안 신호가 없으면 뺀다. foreground를 떠나면 집합을 비운다. PTY 출력의 OSC 0·2 터미널 제목은 main이 읽어(상태 글리프를 뗀다) agent의 screen_title로 싣는다"
      - "상태나 제목이 바뀌면 runtime(agent와 탭 이름 포함)을 모든 창에 push하고 탭 점을 갱신한다. 새로 뜨거나 다시 읽은 창은 ipc:shell:terminal-agents로 지금 agent가 도는 터미널의 runtime을 한 번 읽는다"
    outcomes:
      - id: running
        observe: [screen:project-terminal]
      - id: waiting
        observe: [screen:project-terminal]
      - id: idle
        observe: [screen:project-terminal]
      - id: unknown
        when: "hook을 한 번도 못 들었다. 또는 사람이 Esc·Ctrl-C로 끊어 짐작(guessed)했다"
        observe: [screen:project-terminal]
      - id: left
        when: "foreground가 harness가 아닌 process로 바뀌었다. agent가 탭에서 빠진다"
        observe: [screen:project-terminal]
      - id: terminal-ended
        when: "터미널이 끝났다. 그 탭의 agent가 빠진다"
        observe: [screen:project-terminal]
      - id: gui-routed
        when: "lophn-gui 줄이라 harness-gui-open이 이어 받는다. hook에는 답이 없다"
        observe: [response]
      - id: ignored
        when: "key나 harness가 맞지 않거나, 줄이 상한을 넘거나 깨졌거나, 터미널이 이미 끝났거나, 상태를 바꾸지 않는 신호다"
        observe: [screen:project-terminal]
    crosses_process: true
    refs: [P6]
    docs: [architecture/terminal-agent.md]

  - id: terminal-agent-notice
    title: 터미널 탭의 turn 끝과 권한 물음을 core에 알리고 toast나 OS 알림을 낸다
    actor: shell
    entries: [system:terminal-agent-notice]
    uses: [ipc:shell:terminal-reveal, route:terminal_sessions/signal, route:unseen/dismiss]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/agent.ts
      - packages/shell/main/notice/rule.ts
      - packages/shell/main/terminal/agent/tracker.ts
    steps:
      - "tracker가 turn 끝(완료나 실패)이나 권한 물음을 알리면 판정한다. 사람이 끊은 turn, /clear, compact는 알리지 않는다"
      - "turn 끝은 idle이 되고 1.5초 기다린다. child가 남았으면 보내지 않는다. 그사이 running이나 waiting이 되면 취소한다"
      - "core에 terminal_sessions/signal(권한 물음은 waiting, 끝은 finished·failed와 active_ms: running부터 끝까지에서 물음을 기다린 시간을 뺀 것)을 보낸다. 제목은 terminal_sessions/report와 같다. 못 본 끝과 push는 core가 정한다"
      - "그 탭이 focus를 가진 창에서 보이는 탭이면 띄우지 않는다"
      - "lophn 창에 focus가 있는데 그 탭이 안 보이면 그 창의 toast, 어느 창에도 focus가 없으면 OS 알림이다. 누르면 탭이 있는 창을 앞으로 가져와 탭을 고른다"
      - "알림 본문은 hook payload가 준 마지막 답이나 오류 글, 권한 물음의 요약만 쓴다. transcript는 읽지 않는다"
      - "보지 않던 탭의 끝은 core가 못 본 것(unseen)으로 두어 Finished 줄이 생긴다. 탭을 고르거나 창이 focus를 받으면 presence 보고로 core가 지운다. core는 터미널의 turn 시작과 끝남을 모르므로 새 turn이 시작하거나(끝 알림을 기다리던 중 이어진 turn은 아니다) 터미널이 끝나면 shell이 unseen/dismiss로 지운다(실패는 버린다)"
    outcomes:
      - id: signaled
        when: "core에 계기를 알렸다(보고 있어도 알린다)"
        observe: []
      - id: mark-dismissed
        when: "새 turn이 시작했거나 터미널이 끝나 core에 그 터미널의 못 본 끝을 지우라고 보냈다"
        observe: []
      - id: toast
        observe: [screen:new-waiting-toasts, screen:new-waiting-finished]
      - id: os-notification
        observe: [process:os-notification, screen:new-waiting-finished]
      - id: silent-watched
        when: "그 탭을 사람이 보고 있다"
        observe: [screen:new-waiting-finished]
      - id: silent-stopped
        when: "사람이 끊은 turn이거나 /clear, compact다"
        observe: [screen:new-waiting-finished]
      - id: cancelled
        when: "1.5초 안에 다시 running이나 waiting이 되었다. 또는 turn 끝 뒤 child가 남아 있다"
        observe: [screen:new-waiting-finished]
    crosses_process: true
    docs: [architecture/terminal-agent.md]
    unclear:
      - "toast 화면은 프레임 new-waiting-toasts로 근사했다. 정확한 프레임 정합성은 확인하지 않았다"

  - id: terminal-hook-install
    title: 사람 터미널에서 harness를 처음 알아보면 hook 설치를 묻고 허락하면 놓는다
    actor: shell
    entries: [system:terminal-hook-install]
    uses: [cli:harness.install, cli:harness.sync_skills, ipc:shell:coding-hook-ask, ipc:shell:coding-hook-result, ipc:shell:coding]
    boundary: [shell, coding-agent]
    code:
      - packages/shell/main/terminal/agent/hook-install.ts
      - packages/shell/main/terminal/agent/hook-ask.ts
      - packages/shell/ipc/coding.ts
    steps:
      - "사람 터미널에서 harness를 foreground로 처음 알아본 때 harness마다 앱 실행당 한 번 돈다"
      - "lophn harness install을 dry_run으로 불러 hook과 옛 skill 상태를 본다. 둘 다 missing이 아니면 끝난다"
      - "missing이면 그 터미널을 가진 lophn 창(모르면 마지막 focus 창)에 dialog로 harness 이름, 하는 일 한 문장, 쓸 file 목록을 보내고 답을 기다린다(답은 물은 창이 보낸 것만 센다. 다른 창의 답과 끝난 request의 답은 버린다). 창이 없거나 답 전에 창이 닫히거나 reload되면 거절이다"
      - "거절이면 기억하지 않는다. 이 앱 실행에서는 다시 묻지 않고 다음 실행에서 묻는다"
      - "허락하면 lophn harness install을 실행한다. 성공은 toast 하나, 실패는 까닭과 file을 담은 dialog다"
      - "놓은 뒤 공유 skill 사본을 맞춘다(harness sync-skills). 묻기나 놓기가 실패해도 터미널은 그대로 돈다"
    outcomes:
      - id: skipped
        when: "hook 자리가 없는 harness이거나, CLI 경로를 모르거나, 이 앱 실행에서 이미 물었다, 같은 harness를 묻는 중이다"
        observe: [response]
      - id: dry-run-failed
        when: "dry_run 결과를 읽지 못했다(CLI 실패, 형식이 맞지 않음, 예외). 아무것도 묻지 않는다"
        observe: [response]
      - id: not-needed
        observe: [response]
      - id: declined
        when: "창이 없거나, 답 전에 창이 닫히거나 reload되었거나, 사람이 거절했다. 이 앱 실행에서는 다시 묻지 않는다"
        observe: [response]
      - id: installed
        observe: [disk:"<harness 전역 설정 file>", screen:new-waiting-toasts]
      - id: failed
        when: "허락했는데 install이 실패했다(CLI 오류, 실패한 hook이나 skill, 예외). 까닭을 담은 dialog를 보인다"
        observe: [screen:settings-coding]
    risk: [data-loss, permission]
    crosses_process: true
    refs: [P6]
    docs: [architecture/terminal-agent.md, architecture/coding-agent.md]
    unclear:
      - "실패 dialog는 wireframe 프레임이 없다. observe의 screen:settings-coding은 근사다"

  - id: terminal-agent-identity
    title: hook이 session id를 알려 준 coding agent session의 identity를 project 파일에 남긴다
    actor: shell
    entries: [system:terminal-agent-identity]
    uses: [ipc:shell:terminal-agent-sessions]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/agent/session-store.ts
    steps:
      - "hook이 session id를 알린 session의 identity를 만든다(harness, session id, folder, cwd, 첫 prompt, harness가 붙인 이름, 시각)"
      - "project별 파일 <data root>/shell/agent-sessions/<project>.json에 원자 교체로 쓴다. 상태(running 등)는 저장하지 않는다"
      - "같은 session은 갱신하고, 50개를 넘으면 가장 오래된 것부터 뺀다"
      - "저장본 목록은 ipc:shell:terminal-agent-sessions로 읽는다. 저장본을 여는 길은 이 flow 밖이다"
    outcomes:
      - id: saved
        observe: ["disk:<data root>/shell/agent-sessions/<project>.json"]
      - id: failed
        when: "파일을 쓰지 못했다. wiring이 log를 남기고 넘어가 목록은 그대로다"
        observe: [log:shell]
    crosses_process: false
    docs: [architecture/terminal-agent.md]

  # ---- harness GUI: 사람이 채팅 화면에서 하는 일 ----
  - id: harness-gui-toggle
    title: 터미널 탭 머리의 toggle로 GUI와 TUI를 오간다
    actor: person
    uses: [ipc:harness-gui:tab-toggle, ipc:harness-gui:tab-running]
    boundary: [shell-extension, shell]
    code:
      - packages/shell/renderer/terminal/terminal-gui.tsx
      - packages/shell/ipc/harness-gui.ts
      - packages/shell/main/terminal/gui.ts
      - packages/shell/main/extensions/bundled/harness-gui/index.ts
    steps:
      - "GUI에서 TUI로 갈 때 handoff가 restart(Claude, omp)이면 돌던 turn이나 task, 대기 입력을 modal(harness-gui-restart-modal)로 보여 주고 확인받는다. shared(Codex, OpenCode)는 묻지 않는다"
      - "renderer가 harness-gui:tab-toggle을 {terminal_ref, to}로 main에 보낸다. 화면의 Open as chat도 같은 길이다"
      - "to tui: restart면 run.stop()으로 CLI를 끝낸 뒤 handle을 닫고 PTY에 tuiCommand를 친다. shared면 TUI client가 foreground에 없을 때만 친다"
      - "to tui인데 handle이 없으면 view만 tui로 바꾸고 끝낸다"
      - "to gui: handle이 있으면 view만 바꾼다. 없으면 TUI의 session id를 읽는다. id가 없으면 no-session, TUI가 떠 있지 않으면 not-running"
      - "handle이 없을 때 gui로 가는 길은 harness-gui-open과 같은 open이다. harness-gui가 꺼져 있으면 Settings를 연다"
      - "to tui에서 CLI의 stop()이 8초 안에 끝나지 않거나 던지면 TUI 명령을 치지 않고 handle을 닫은 뒤 failed다(앞 process가 끝났는지 모르면 TUI를 띄우지 않는다). extension handler가 던져도 failed다"
    outcomes:
      - id: to-tui
        observe: [process:cli-tui, screen:project-terminal]
      - id: tui-without-handle
        when: "그 터미널에 handle이 없다. view만 tui로 바꾼다"
        observe: [screen:project-terminal]
      - id: to-gui
        observe: [screen:harness-gui-terminal-tab]
      - id: no-session
        when: "TUI의 CLI session id를 아직 모른다(hook이 안 왔다)"
        observe: [screen:terminal-open-chat-disabled]
      - id: not-running
        when: "그 터미널에 지원하는 coding agent가 떠 있지 않다"
        observe: [screen:terminal-open-chat-disabled]
      - id: extension-off
        when: "to gui에서 harness-gui extension이 꺼져 있다. Settings를 연다"
        observe: [process:settings-window]
      - id: failed
        when: "to tui에서 extension handler가 던졌거나 CLI의 stop()이 8초 안에 끝나지 않았거나 던졌다(TUI 명령은 치지 않는다). 또는 to gui의 adapter 시작이 던졌다"
        observe: [log:shell]
      - id: refused
        when: "desktop 창이 아니거나 입력 schema가 맞지 않다(IPC가 null을 돌려준다)"
        observe: [response]
    crosses_process: true
    refs: [P6]
    docs: [architecture/harness-gui.md]

  - id: harness-gui-input
    title: GUI 채팅 화면에서 보낸 입력을 CLI에 넘긴다
    actor: person
    uses: [ipc:harness-gui:tab-input]
    boundary: [shell-extension, shell, acp]
    code:
      - packages/shell/main/terminal/gui.ts
      - packages/shell/main/extensions/bundled/harness-gui/adapter.ts
      - packages/shell/renderer/conversation/agent-tab-gui-source.ts
    steps:
      - "GUI 화면에서 사람이 보낸 입력(ACP input)을 renderer가 harness-gui:tab-input으로 main에 준다"
      - "main이 handle을 찾는다. 없으면 false로 거절한다"
      - "있으면 handle의 input으로 넘긴다. adapter가 입력을 CLI 호출로 옮기고 ACP update를 돌려 화면이 그린다"
      - "GUI의 CLI session은 lophn ledger에 기록하지 않는다. 지난 대화는 CLI session 목록에서 읽는다"
    outcomes:
      - id: sent
        observe: [process:cli-run, screen:harness-gui-terminal-tab]
      - id: refused
        when: "handle이 없다. 또는 desktop 창이 아니거나 입력 schema가 맞지 않다(IPC가 null을 돌려준다)"
        observe: [response]
    crosses_process: true
    docs: [architecture/harness-gui.md]
    unclear:
      - "adapter별 입력 전달(claude.ts, codex.ts 등)은 읽지 않았다. ACP 입력 종류(interrupt, rewind 등)는 sessions 쪽 ACP flow가 맡는다"

  # ---- 폰의 coding session: host가 올린 GUI 대화를 core가 사본으로 낸다 ----
  - id: coding-relay-sync
    title: core가 host가 올린 GUI 대화 상태를 사본으로 접고 갱신을 낸다
    actor: shell
    entries: [system:coding-relay-sync]
    uses: [system:host-link]
    boundary: [host-queue-interface, acp]
    code:
      - packages/core/coding-relay/relay.ts
      - packages/core/main/daemon/wiring/coding-relay.ts
      - packages/core/main/daemon/wiring/session-lifecycle.ts
      - packages/shell/main/terminal/coding-relay.ts
      - packages/shell/main/desktop/wiring/agent.ts
    steps:
      - "shell main은 GUI handle이 열리면 coding_sync snapshot을 먼저, 이어서 창과 같은 20ms 묶음의 updates를 보내고 handle이 닫히면 coding_closed를 보낸다. coding_report는 tracker·GUI 탭이 바뀔 때 보낸다. 연결이 없을 때는 쌓지 않고, 연결이 열릴 때마다 coding_report와 모든 handle의 snapshot을 다시 보낸다"
      - "host가 coding_report로 터미널 coding agent 집합(view, handoff, foreground 포함)을 보내면 session lifecycle 표와 coding relay가 같은 집합으로 바뀐다"
      - "coding_sync의 snapshot은 그 session(ses_<터미널 ULID>)의 사본을 갈아 끼우고 updates는 reduceAcp로 접는다. 둘 다 먼저 제품 redactor로 모든 글을 거른다. 알려진 secret을 아직 다 모르면 그 session의 사본을 버리고 아무것도 내지 않는다"
      - "updates는 하나씩 AcpUpdated {session, update}로 Bus에 낸다. snapshot이 사본을 갈아 끼우면 StateChanged {coding_sessions, id: session}을, 목록이 바뀌면 StateChanged {coding_sessions}를 낸다"
      - "사본은 64 session까지다. 넘으면 가장 오래 쓰지 않은 것부터 버린다. snapshot 없이 온 updates는 접을 바탕이 없어 버린다"
      - "coding_closed는 그 사본을 지운다. 연결이 닫히면 3초 유예 뒤(그 사이 다시 붙지 않았으면) 보고와 사본을 모두 비운다"
    outcomes:
      - id: folded
        observe: [event:AcpUpdated, event:StateChanged]
      - id: withheld
        when: "알려진 secret을 아직 다 모른다(사본을 버리고 내지 않는다)"
        observe: [event:StateChanged]
      - id: cleared
        when: "handle이 닫혔다(coding_closed), 또는 연결이 닫히고 유예가 지났다"
        observe: [event:StateChanged]
    crosses_process: false
    risk: [secret]
    docs: [architecture/harness-gui.md, architecture/acp.md]

  - id: coding-sessions-read
    title: 폰이 컴퓨터의 coding session 목록과 view 바꾸기 계획을 읽는다
    actor: person
    entries: [route:coding_sessions/list, route:coding_sessions/switch_plan]
    boundary: [host-queue-interface, acp]
    code:
      - packages/core/coding-relay/relay.ts
      - packages/core/main/daemon/wiring/coding-relay.ts
      - packages/protocol/coding-agent/relay.ts
    steps:
      - "list는 host가 보고한 터미널마다 한 줄이다(project로 거를 수 있다). 사본이 있으면 상태는 사본의 승인·질문·turn으로 덮는다. shell은 /host-link가 열려 있으면 attached다. 연결이 닫히고 유예가 지나면 목록이 빈다"
      - "switch는 GUI면 null이다. TUI면 Windows는 unsupported_os, GUI handle(사본)이 있으면 null, foreground TUI나 handoff가 없으면 not_running, CLI session id가 없으면 no_session이다"
      - "switch_plan은 TUI면 to gui(도는 turn은 보고의 running), GUI면 to tui(사본의 도는 turn, 도는 task 수, 줄 선 메시지 수)다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "switch_plan의 session이 보고에 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: coding-session-switch
    title: 폰에서 사람이 확인한 뒤 coding session의 탭을 chat과 터미널 사이에서 바꾼다
    actor: person
    entries: [route:coding_sessions/switch]
    uses: [system:host-link, ipc:harness-gui:tab-toggle]
    boundary: [host-queue-interface, host-queue-core]
    code:
      - packages/core/coding-relay/relay.ts
      - packages/core/main/daemon/wiring/coding-relay.ts
      - packages/core/host-queue/queue.ts
      - packages/shell/main/terminal/coding-relay.ts
      - packages/shell/main/terminal/gui.ts
    steps:
      - "입력에 confirmed: true가 없으면 schema에서 invalid_input이고 host 요청은 나가지 않는다. 사람 자격만 부른다"
      - "같은 key는 한 번만 보낸다(보내는 중이거나 성공한 것의 답을 준다. 실패한 key는 잊어 다시 보낼 수 있다)"
      - "session이 보고에 없으면 not_found, 이미 그 view면 conflict다. 아니면 연결로 coding_switch {terminal_ref, to}를 보내고 host의 답을 기다린다(60초)"
      - "shell main은 Windows면 unavailable(unsupported_os), 터미널이 없으면 not_found, 이미 그 view면 conflict로 답한다. 아니면 탭 toggle을 폰 출처로 부른다: 창의 ack를 기다리지 않고 바로 GUI view다(창이 탭을 다시 그리면 tab-current로 되찾는다). harness-gui가 꺼져 있으면 Settings를 열지 않고 unavailable(extension_off), TUI가 없거나 session id를 모르면 invalid_input(not_running, no_session)이다. extension은 TUI를 먼저 끈 뒤 adapter를 시작하고, 어느 쪽이든 실패하면 handle을 닫아 unavailable(failed)이며 TUI는 그대로 남는다"
      - "host의 오류는 code와 details.reason(no_session, not_running, extension_off, unsupported_os, failed) 그대로 준다. 연결이 없거나 답 전에 닫히면 unavailable이다. 성공하면 StateChanged {coding_sessions, id}가 나가고 host가 바뀐 보고와 snapshot을 다시 올린다"
    outcomes:
      - id: switched
        observe: [request:shell, event:StateChanged, response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다(host에 다시 가지 않는다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "confirmed: true가 없다, 입력 schema가 틀렸다, 또는 host가 no_session·not_running으로 거절했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 보고에 없다, 또는 host가 그 터미널을 못 찾았다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "이미 그 view다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "연결이 없다, 답 전에 닫혔다, 기한이 지났다, 또는 host가 extension_off·unsupported_os·failed로 거절했다"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]

  - id: coding-session-open
    title: 폰이 컴퓨터의 project에 coding session을 새 터미널 탭의 chat으로 연다
    actor: person
    entries: [route:coding_sessions/open]
    uses: [system:host-link]
    boundary: [host-queue-interface, host-queue-core]
    code:
      - packages/core/coding-relay/open.ts
      - packages/core/main/daemon/wiring/coding-relay.ts
      - packages/shell/main/terminal/coding-open.ts
      - packages/shell/main/desktop/wiring/coding-relay.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/main/terminal/harness-tui.ts
      - packages/shell/renderer/workspace/use-surface-requests.ts
    steps:
      - "같은 key는 한 번만 연다(보내는 중이거나 성공한 것의 답을 준다. 실패한 key는 잊는다). 사람 자격만 부른다"
      - "harness가 GUI가 되는 coding agent(claude, codex, opencode, omp)가 아니면 invalid_input이다"
      - "resume이면 ledger session이 없거나 그 project의 것이 아니면 not_found, harness agent session이 아니거나 harness가 다르거나 CLI session id가 없으면 invalid_input, host 목록에 같은 CLI session이 있으면 conflict다. 그 뒤 TUI hold를 건다: TUI로 열려 있거나 headless turn이 돌면 conflict다"
      - "연결로 coding_open {project, harness, resume?: {session, cli_session}}을 보내고 답(60초)의 terminal_ref를 ses_<터미널 ULID>로 옮긴다. 성공하면 StateChanged {coding_sessions}가 나간다"
      - "shell main은 Windows면 unavailable, 그 CLI session이 이미 GUI 탭에서 돌면 conflict다. resume이면 그 ledger session을 TUI 탭과 같은 hold 목록(/host-link visible의 tui)에 넣는다. 그 project를 보이는 창에 coding 탭 열기(펴진 float, handoff 없음)를 넣으면 창이 새 터미널에 <harness> gui(resume이면 --resume <cli_session>)를 친다. 그 workspace를 보이는 창이 없고 일반 창도 없으면 focus 없이 하나 열고 그 창이 workspace를 알릴 때까지(15초) 기다린다"
      - "창이 탭을 열지 못하면 unavailable이다. 열면 그 project 터미널에 그 harness의 새 GUI handle이 생길 때까지(55초) 기다려 그 터미널로 답하고, 기한이 지나면 unavailable이다. resume의 hold는 실패하면 바로, 성공하면 그 터미널이 끝날 때 풀린다(채팅을 터미널로 바꿔 handle이 닫혀도 잡혀 있다)"
    outcomes:
      - id: opened
        observe: [request:shell, event:StateChanged, response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다(host에 다시 가지 않는다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "입력 schema가 틀렸다, GUI가 되지 않는 harness다, 또는 resume session이 harness agent session이 아니거나 harness가 다르거나 CLI session id가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "resume session이 ledger에 없거나 그 project의 것이 아니다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 CLI session이 이미 컴퓨터의 터미널에서 돈다(core 목록이나 shell의 GUI 탭), TUI로 열려 있다, 또는 headless turn이 돈다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "연결이 없다, 답 전에 닫혔다, 기한이 지났다, Windows다, 그 project를 보이는 창이 없다, 또는 GUI가 기한 안에 시작하지 않았다"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]
    unclear:
      - "새 창은 마지막 workspace로 뜬다. 그것이 그 project가 아니거나 다른 workspace를 보이는 창만 있으면 탭을 열지 못한다"

  - id: coding-session-wake
    title: 폰이 컴퓨터의 lophn 앱을 띄운다
    actor: person
    entries: [route:coding_sessions/wake]
    boundary: [host-queue-core]
    code:
      - packages/core/coding-relay/open.ts
      - packages/core/main/daemon/wiring/coding-relay.ts
      - packages/core/host-queue/queue.ts
      - packages/core/main/daemon/shell-launcher.ts
    steps:
      - "shell이 붙어 있으면 attached다. 아니면 queue.startShell로 앱을 focus 없는 창으로 띄우고 starting이다. 폰은 coding_sessions/list의 shell이 attached가 되길 기다린다"
      - "띄울 길이 없거나(앱이 띄운 core가 아니다), 앞선 실패 뒤 5분 안이거나, 띄우자마자 실패하면 unavailable이다"
      - "새로 뜬 앱에는 PTY가 없어(앱과 함께 죽었다) 목록이 비어 있다. 열기와 함께일 때만 쓸모 있다"
    outcomes:
      - id: attached
        observe: [response]
      - id: starting
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "띄울 길이 없다, 앞선 실패 뒤 쉬는 중이다, 또는 띄우자마자 실패했다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "입력 schema가 틀렸다(빈 객체가 아니다)"
        observe: [response]
    crosses_process: true
    docs: [architecture/platform.md]

  - id: coding-session-input
    title: 폰이 coding session의 대화를 읽고 입력을 컴퓨터의 CLI에 넘긴다
    actor: person
    uses: [route:acp/snapshot, route:acp/send, system:host-link]
    when: "session이 coding relay 사본에 있다(ledger session이 아니다)"
    boundary: [acp, host-queue-interface]
    code:
      - packages/core/main/daemon/wiring/acp.ts
      - packages/core/coding-relay/relay.ts
      - packages/shell/main/terminal/coding-relay.ts
    steps:
      - "acp/snapshot은 사본(redaction을 거친 것)을 그대로 준다"
      - "acp/send는 입력 전체를 coding_input {session, input}으로 host에 보내고 답을 그대로 올린다. core는 입력을 사본에 적용하지 않는다(결과는 host가 coding_sync로 올린다). 승인 card의 decide도 host로 가고 core의 turn_requests는 건드리지 않는다"
      - "key가 있는 입력(send의 id와 key, stop·set_model 등의 key)은 session마다 200개를 기억해 같은 것은 host에 다시 보내지 않고 처음 답을 준다. 실패한 시도는 잊는다"
      - "사본이 없으면 ledger 길(acp-read, acp-send)로 가고 그 session은 ledger에 없어 not_found다"
    outcomes:
      - id: sent
        observe: [request:shell, response]
      - id: deduplicated
        when: "같은 key의 입력을 다시 보냈다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "host에 그 handle이 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "연결이 없거나 답 전에 닫혔거나 기한(10초)이 지났다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "host가 입력을 거절했다(shell main이 ACP 입력 schema로 읽지 못했다)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/harness-gui.md, architecture/acp.md]

  # ---- 폰의 raw 터미널 화면: host가 밀어 올린 최신 화면을 core가 들고 폰이 읽는다 ----
  - id: terminal-view-screen
    title: core가 보는 중인 터미널의 최신 화면을 메모리에 두고 바뀌었다고 알린다
    actor: shell
    entries: [system:terminal-view-screen]
    uses: [system:host-link]
    boundary: [host-queue-interface]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
    steps:
      - "host가 terminal_screen frame을 올리면 그 터미널에 lease가 있고 coding session 목록에 있을 때만 최신 화면으로 바꾼다(옛 것을 대신한다). 그렇지 않으면 버린다"
      - "화면을 두면 TerminalScreenChanged {terminal, seq}를 subject terminal:<ref>로 Bus에 낸다. 화면 내용은 싣지 않고 폰이 terminal_view/snapshot을 다시 읽는다"
      - "터미널이 coding session 목록에서 빠지면(연결이 닫히고 유예가 지나 목록이 비는 것 포함) 그 터미널의 화면과 lease와 입력 key를 지운다"
      - "마지막 lease가 끝나면 화면을 지운다. lease는 5초마다 기한(30초)을 본다"
    outcomes:
      - id: changed
        observe: [event:TerminalScreenChanged]
      - id: dropped
        when: "lease가 없거나 목록에 없는 터미널의 화면이다"
    crosses_process: false
    risk: [secret]
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  - id: terminal-view-watch
    title: 폰이 coding session 터미널을 보겠다고 lease를 켜고 갱신하고 끈다
    actor: person
    entries: [route:terminal_view/watch]
    uses: [system:host-link]
    boundary: [host-queue-interface]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/protocol/coding-agent/terminal-view.ts
    steps:
      - "on이면 이 principal과 터미널의 lease를 30초로 만들거나 갱신한다(폰이 10초마다 같은 호출을 한다). tail은 viewport 위 scrollback 줄 수로 0~500이고 없으면 100이다. 터미널이 coding session 목록에 없으면 not_found다"
      - "터미널마다 lease가 하나라도 있으면 host에 terminal_stream {on: true, tail: lease들의 tail 최대}를 보낸다. host가 아는 값이 같으면 다시 보내지 않는다. 진행 중이면 끝난 뒤 다시 맞춘다"
      - "host에 닿지 않아도 lease는 남고 호출은 unavailable이다. 연결이 다시 열리면 살아 있는 lease마다 terminal_stream을 다시 보낸다"
      - "off이거나 기한이 지나 마지막 lease가 끝나면 terminal_stream {on: false}를 보낸다. host의 not_found·invalid_input·conflict는 그대로, 그 밖의 code는 unavailable로 준다"
    outcomes:
      - id: watching
        observe: [request:shell, response]
      - id: stopped
        when: "on이 false이거나 lease 기한이 지났다"
        observe: [request:shell, response]
      - id: not_found
        code: not_found
        when: "터미널이 coding session 목록에 없다, 또는 host가 그 터미널을 못 찾았다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "연결이 없거나 답 전에 닫혔거나 기한(5초)이 지났다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  - id: terminal-view-snapshot
    title: 폰이 보는 중인 터미널의 지금 화면과 입력 가능 여부를 읽는다
    actor: person
    entries: [route:terminal_view/snapshot]
    boundary: [host-queue-interface]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/protocol/coding-agent/terminal-view.ts
    steps:
      - "화면은 host가 올린 최신 것 그대로다(generation, seq, columns, rows, cursor, scrollback, lines). input은 부른 principal이 이 터미널에 칠 수 있는가(terminalInputGrant)이고 그 칸이 채워지지 않았으면 false다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "터미널이 coding session 목록에 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "아직 화면이 오지 않았다(watch 직후)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    risk: [secret]
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  - id: terminal-view-input
    title: 입력을 허락받은 기기만 폰에서 coding session 터미널에 글을 친다
    actor: person
    entries: [route:terminal_view/input]
    uses: [system:host-link]
    boundary: [host-queue-interface]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/protocol/coding-agent/terminal-view.ts
    steps:
      - "terminalInputGrant(principal)이 true를 돌려준 principal만 부를 수 있다. 칸이 채워지지 않았거나 false면 forbidden이고 host에 아무것도 가지 않는다"
      - "터미널이 coding session 목록에 없으면 not_found다. 같은 key는 터미널마다 200개를 기억해 다시 보내면 host에 가지 않고 처음 답을 준다. 실패한 시도는 잊는다"
      - "연결로 terminal_input {terminal_ref, text}를 보내고 host의 답이 성공이면 성공이다. host의 not_found·invalid_input·conflict는 그대로, 그 밖의 code는 unavailable로 준다"
    outcomes:
      - id: sent
        observe: [request:shell, response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다(host에 다시 가지 않는다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "입력을 허락받지 않은 principal이다, 또는 사람 자격(actor user)이 아니다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "터미널이 coding session 목록에 없다, 또는 host가 그 터미널을 못 찾았다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "연결이 없거나 답 전에 닫혔거나 기한(5초)이 지났다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "host가 입력을 거절했다"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  # ---- lophn CLI의 local 명령: 감지, hook 설치, skill 사본 ----
  - id: harness-detect
    title: 이 컴퓨터의 harness 실행 파일을 찾는다(refresh면 version도 읽는다)
    actor: shell
    entries: [cli:harness.detect, cli:harness.refresh]
    uses: [ipc:shell:coding]
    boundary: [coding-agent-cli, coding-agent-harness-api]
    code:
      - packages/coding-agent/local/harness.ts
      - packages/coding-agent/local/harness-run.ts
      - packages/coding-agent/harnesses/detect.ts
    steps:
      - "Settings › Coding agents를 열거나 [Detect again]을 누르면 shell main이 lophn harness detect(또는 refresh)를 exec한다. core에는 붙지 않는다"
      - "detect는 PATH에서 제품 실행 파일을 찾기만 한다. refresh는 찾은 제품을 한 번 실행해 version을 읽는다. 사람이 누른 때만이다"
      - "결과를 출력하고 CLI는 저장하지 않는다. shell main은 성공한 마지막 결과만 메모리에 쥔다(Settings를 다시 열면 그것을 보인다)"
      - "CLI가 실패하거나 출력이 배열이 아니면 shell main은 모든 harness를 unknown으로 채우고 쥐지 않는다"
    outcomes:
      - id: ok
        observe: [response, screen:new-settings-coding]
      - id: invalid_input
        code: invalid_input
        when: "시각 값(ctx.now)이 날짜로 읽히지 않는다. 실제로는 나지 않는다"
        observe: [response]
      - id: cli-failed
        when: "shell main의 exec가 실패했다. 출력이 배열이 아니다. CLI 경로를 모른다. 모든 harness가 unknown으로 보인다"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-hook-check
    title: 모든 harness의 전역 hook과 옛 skill 상태를 한 번에 읽는다
    actor: shell
    entries: [cli:harness.status]
    uses: [cli:harness.install, ipc:shell:coding]
    boundary: [coding-agent-cli, coding-agent]
    code:
      - packages/coding-agent/local/harness.ts
      - packages/coding-agent/local/harness-run.ts
      - packages/coding-agent/harnesses/install.ts
    steps:
      - "Settings를 열거나 창이 focus를 다시 받으면 shell main이 lophn harness status를 한 번 exec한다. process 하나로 모든 harness를 본다"
      - "harness마다 install --dry_run을 돌려 행을 낸다(installed, unchanged, missing, failed, not_supported)"
      - "한 harness가 실패해도 나머지 행을 보이고 그 행만 failed다"
      - "아무것도 쓰지 않는다"
      - "command 입력이 맞지 않으면 invalid_input이다"
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "command 입력이 맞지 않다"
        observe: [response]
      - id: missing
        when: "행 하나가 dry_run이다. 설치하면 바뀔 것이 있다(우리 event가 빠졌다, OpenCode plugin 본문이 다르다). 응답은 ok다"
        observe: [response]
      - id: unchanged
        when: "행 하나가 dry_run이다. 우리 항목이 이미 다 있다. 응답은 ok다"
        observe: [response]
      - id: not-supported
        when: "행 하나가 dry_run이다. 그 harness에 hook 자리가 없다. 응답은 ok다"
        observe: [response]
      - id: failed
        when: "행 하나가 dry_run이다. 그 harness의 설정을 읽지 못했다. 나머지 행은 그대로 보인다. 응답은 ok다"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-hook-install
    title: harness의 전역 설정에 lophn hook을 놓는다(dry_run이 아닐 때)
    actor: shell
    entries: [cli:harness.install]
    when: "dry_run이 아닐 때. dry_run은 harness-hook-check와 terminal-hook-install이 쓴다"
    boundary: [coding-agent-cli, coding-agent]
    code:
      - packages/coding-agent/local/harness.ts
      - packages/coding-agent/local/harness-run.ts
      - packages/coding-agent/harnesses/install.ts
      - packages/coding-agent/harnesses/install-common.ts
      - packages/protocol/coding-agent/harness-install.ts
    steps:
      - "Settings의 [Install hooks]나 terminal-hook-install의 허락 뒤 shell main이 lophn harness install을 exec한다. 허락은 호출한 쪽이 받는다"
      - "command 입력(harness, command)을 검사한다. 틀리면 invalid_input"
      - "옛 skill 사본은 lophn이 쓰던 byte 그대로일 때만 지운다(RETIRED_SKILL_NAMES)"
      - "harness의 전역 설정에 lophn 항목만 넣는다. JSON, JSONC, TOML, YAML, plugin file 꼴에 따라 다르다. 사람의 나머지 byte는 그대로 둔다"
      - "Codex는 config.toml에 우리 hook의 trust hash를 hooks.json보다 먼저 쓴다. 설정 file은 임시 file에 쓴 뒤 rename하고(symlink는 가리키는 file을 고치고 mode를 지킨다), 읽은 뒤 쓰기 전에 file이 바뀌었으면 한 번 다시 읽는다"
      - "파싱되지 않거나 고칠 수 없으면, 또는 다시 읽고도 또 바뀌었으면 아무것도 쓰지 않고 failed다. muse에 다른 managed_hooks_path가 있으면 conflict다. 쓰기 자체가 던지면 unavailable이다"
    outcomes:
      - id: installed
        observe: ["disk:<harness 전역 설정 file>", response]
      - id: unchanged
        observe: [response]
      - id: failed
        observe: [response]
      - id: not-supported
        observe: [response]
      - id: conflict
        code: conflict
        when: "muse 설정에 다른 managed_hooks_path가 있다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "harness 전역 설정에 쓰지 못했다(쓰기 자체가 던졌다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "harness나 command 입력이 틀렸다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "installed 결과에 옛 skill 사본을 지운 것도 함께 담긴다. 그 지우기를 따로 outcome으로 적지 않았다"

  - id: harness-hook-uninstall
    title: harness의 전역 설정에서 lophn 항목만 지운다
    actor: shell
    entries: [cli:harness.uninstall]
    uses: [ipc:shell:coding]
    boundary: [coding-agent-cli, coding-agent]
    code:
      - packages/coding-agent/local/harness.ts
      - packages/coding-agent/local/harness-run.ts
      - packages/coding-agent/harnesses/uninstall.ts
    steps:
      - "Settings의 [Uninstall hooks]를 누르면 shell main이 exec한다. 누른 것이 허락이라 묻지 않는다"
      - "lophn 항목만 알아본다(command가 lophn hook으로 시작, 표시 block, lophn 이름의 file). 사람이 더한 항목은 남긴다"
      - "글 형식은 놓기 전 byte로 돌아가고, 우리 것만 남은 event key와 file은 지운다. Codex는 우리 trust 기록을 지운다"
      - "그 harness의 skill 폴더에서 lophn이 쓴 공유 사본도 지운다"
      - "설정을 파싱할 수 없거나 사람 항목이 섞여 안전하게 못 고치면 아무것도 쓰지 않고 failed다. 읽은 뒤 쓰기 전에 file이 바뀌었으면 한 번 다시 읽고, 또 바뀌었으면 쓰지 않고 failed다. 설정은 임시 file에 쓴 뒤 rename한다"
    outcomes:
      - id: removed
        observe: ["disk:<harness 전역 설정 file>", response]
      - id: unchanged
        observe: [response]
      - id: not-supported
        observe: [response]
      - id: failed
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "harness 전역 설정을 고치지 못했다(쓰기 자체가 던졌다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "harness 입력이 틀렸다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-sync-skills
    title: 공유 앱 skill과 lophn-agent skill의 사본을 harness skill 폴더에 맞춘다
    actor: shell
    entries: [cli:harness.sync_skills]
    boundary: [coding-agent-cli, coding-agent]
    code:
      - packages/coding-agent/local/harness.ts
      - packages/coding-agent/local/harness-run.ts
      - packages/coding-agent/harnesses/skill-copies.ts
      - packages/coding-agent/skills/lophn-agent.ts
    steps:
      - "shell main이 core 준비 때 한 번, 앱 activation 때, coding-agent.shared_apps와 extensions.harness.enabled가 바뀔 때, hook을 놓거나 지운 뒤 exec한다"
      - "core에 user token으로 붙어 두 설정 값과 공유 앱의 public skill을 읽는다(app.skills)"
      - "hook이 놓인 harness의 skill 폴더에 공유 사본을 맞춘다. harness가 켜져 있으면 lophn-agent skill을 hook과 상관없이 둔다. 꺼지면 lophn 사본만 지운다"
      - "폴더 이름과 file 이름은 폴더 밖으로 못 나가는 것만 받는다. 표시 file(.lophn-shared)이 있는 폴더만 덮고 지우고, 사람 폴더는 건너뛴다(skipped)"
      - "core에 못 붙거나 core 읽기가 실패하거나 skill 폴더를 못 쓰면 unavailable이다"
    outcomes:
      - id: synced
        observe: ["disk:<harness skill 폴더>", response]
      - id: unavailable
        code: unavailable
        when: "core에 붙지 못했다. settings.list나 app.skills 읽기가 실패했다(core가 준 code를 그대로 넘긴다). skill 폴더를 쓸 수 없다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "core 읽기 실패의 code는 core가 정한 그대로 넘긴다. 보통 unavailable이지만 다른 code가 올 수 있다고 보고 unavailable 하나로 묶었다"

  # ---- 터미널 PTY 탭(shell main + terminal host). renderer는 PTY를 직접 갖지 않는다 ----
  - id: terminal-open
    title: "터미널 탭의 PTY shell 하나를 연다"
    actor: person
    uses: [ipc:shell:terminal-open]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/main/terminal/cwd.ts
      - packages/shell/terminal-host/main.ts
    steps:
      - "renderer가 project와 folder_ref나 cwd를 보낸다. 창이 등록된 본문 창이 아니면 forbidden이다"
      - "cwd가 있으면 등록 폴더 안인지 realpath로 본다. 밖이거나 없는 경로면 outside-folder로 끝낸다"
      - "bridge와 hook의 env, CLI PATH, shell 시작 층을 모아 host에 open을 보낸다. host가 등록 폴더를 고르고 login shell을 찾아 PTY를 띄운다"
      - "host가 폴더를 고르지 못하거나 쓰지 못하면 refused다. shell을 띄우지 못하면 spawn-failed다. 원인(SHELL 실행 불가, cwd 권한 등)은 host가 stderr에 남기고 화면에는 spawn_failed만 보인다. supervisor 요청은 10초 안에 host가 답하지 않으면 host_lost로 끝난다"
      - "띄우면 bridge와 hook을 이 터미널에 묶는다. resume 값이나 command가 있으면 shell 시작 층이 가라앉은 뒤 그 줄을 친다(한 줄은 Enter까지, 여러 줄은 bracketed paste). 친 줄이 거절돼도 탭은 이미 열렸으므로 열기는 실패가 아니고 다시 치지 않는다"
    outcomes:
      - id: opened
        observe: [process:pty-shell, response]
      - id: outside-folder
        when: "cwd가 등록 폴더 안이 아니다. `..`, 밖으로 나가는 symlink, 없는 경로가 여기 든다. 응답의 reason은 unreadable이다"
        observe: [response]
      - id: refused
        when: "project에 등록 폴더가 없다(no_folder), folder_ref가 등록되지 않았다(unreadable), 폴더를 쓸 수 없다(not_directory, unreadable)"
        observe: [response]
      - id: spawn-failed
        when: "login shell을 찾지 못했다(응답 ok가 거짓). 또는 PTY spawn이 던졌다(응답은 ok이고 runtime이 exited, failure_reason spawn_failed). 두 번째 경우 원인은 host stderr에 한 줄로 남는다"
        observe: [response, "log:host stderr terminal spawn failed"]
      - id: host-lost
        when: "terminal host가 10초 안에 답하지 않았거나 요청을 처리하다 던졌다(응답 ok가 거짓, reason host_lost). host가 끝났으면 shell main log에 code, signal, stderr 마지막 4 KiB가 한 줄로 남는다"
        observe: [response, "log:shell terminal host exited"]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다(checkCaller)"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/terminal-agent.md]

  - id: terminal-shell-env
    title: "터미널 shell이 받는 env를 정한다(플랫폼 credential과 상위 session 표지를 빼고 COLORTERM을 truecolor로 고정한다)"
    actor: person
    uses: [ipc:shell:terminal-open]
    when: "터미널 탭을 열 때마다, host가 shell을 띄우기 직전"
    boundary: [shell]
    code:
      - packages/shell/terminal-host/env.ts
      - packages/shell/terminal-host/main.ts
      - packages/shell/terminal-host/shell-integration.ts
    steps:
      - "lophn을 띄운 process의 env에서 내부 이름(LOPHN_, ELECTRON_), secret류 이름(TOKEN, PASSWORD, API_KEY 등), local port 값, 상위 session 표지를 뺀다. 단 SSH_AUTH_SOCK, XAUTHORITY, GIT_AUTHOR_·GIT_COMMITTER_의 NAME·EMAIL·DATE, proxy 변수(HTTP_PROXY 등 대소문자 둘)는 정확한 이름만 남긴다"
      - "COLORTERM을 truecolor로 덮는다. TERM만 보면 Claude Code와 Codex가 256색으로 내려 자기 색을 근사한다"
      - "shell 시작 층과 탭의 env는 그 뒤에 덮는다"
      - "bash·zsh 시작 층 file이 run 폴더에 없으면 시작 층 없이 원래 login shell 인자로 띄운다. 없는 --init-file이나 빈 ZDOTDIR이면 사용자 rc를 하나도 읽지 않는다"
    outcomes:
      - id: env-built
        observe: [process:pty-shell]
      - id: user-rc-kept
        observe: [process:pty-shell]
    crosses_process: true
    risk: [secret, twice-fixed]
    docs: [architecture/terminal-agent.md, products/change-log/0.9/terminal-env-colorterm-truecolor.yaml]
    unclear:
      - "env_test는 허용 목록이 남는 것과 token·endpoint가 지워지는 것을 단정한다. COLORTERM 덮기는 단정하지 않는다"

  - id: terminal-input
    title: "사람이 친 글을 focus가 있는 터미널의 PTY에 넣는다"
    actor: person
    uses: [ipc:shell:terminal-input]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/renderer/terminal/xterm-view.ts
      - packages/shell/terminal-host/main.ts
    steps:
      - "xterm이 사람이 친 글을 generation과 함께 terminal-input으로 보낸다"
      - "main이 focus 표에서 이 창이 그 터미널과 generation에 focus를 가졌는지 본다. 없으면 not-focused다"
      - "host는 그 터미널이 running이고 generation이 맞을 때만 PTY에 쓴다. 아니면 host_lost 사유로 돌아온다"
      - "쓰면 agent tracker에 사람 입력을 알린다. 끊김 짐작과 권한 대기 같은 harness 상태가 여기서 바뀐다"
    outcomes:
      - id: sent
        observe: [process:pty-shell, response]
      - id: not-focused
        when: "이 창이 그 터미널에 focus를 갖지 않았다(terminal is not focused)"
        observe: [response]
      - id: not-running
        when: "generation이 맞지 않거나 터미널이 running이 아니다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminal-respond
    title: "숨은 xterm이 새 출력의 terminal 질의에 답을 PTY에 준다"
    actor: shell
    uses: [ipc:shell:terminal-response]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/renderer/terminal/xterm-view.ts
    steps:
      - "출력이 숨은 xterm에 들어가 terminal이 답을 요구하면 xterm이 답을 terminal-response로 보낸다. 사람 입력이 아니다"
      - "main은 이 창이 그 터미널의 출력을 구독하고 있을 때만 PTY에 쓴다"
      - "사람 입력처럼 focus 검사와 agent 입력 알림을 거치지 않는다"
    outcomes:
      - id: answered
        observe: [process:pty-shell, response]
      - id: not-subscribed
        when: "이 창이 그 터미널의 출력을 구독하지 않는다(terminal is not subscribed)"
        observe: [response]
      - id: not-running
        when: "host가 그 generation을 running으로 두지 않는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true

  - id: terminal-resize
    title: "터미널 칸의 크기를 PTY와 화면 buffer에 알린다"
    actor: person
    uses: [ipc:shell:terminal-resize]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/terminal-host/main.ts
    steps:
      - "칸 크기가 바뀌면 renderer가 terminal-resize를 보낸다. focus를 보지 않는다(split의 다른 pane도 보이는 채로 크기가 바뀐다)"
      - "host가 running이고 generation이 맞으면 PTY와 화면 buffer의 칸 수를 바꾼다. 글은 넣지 않는다"
    outcomes:
      - id: resized
        observe: [process:pty-shell, response]
      - id: not-running
        when: "generation이 맞지 않거나 터미널이 running이 아니다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true

  - id: terminal-close
    title: "사람이 닫은 터미널의 PTY를 끈다"
    actor: person
    uses: [ipc:shell:terminal-close]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/terminal-host/main.ts
      - packages/shell/terminal-host/child-group.ts
    steps:
      - "살아 있는 터미널이면 main이 사람에게 닫아도 되는지 묻는다. 아니오면 cancelled로 끝내고 PTY는 그대로 둔다"
      - "host가 shell group에 SIGHUP을 보내고 종료를 확인한다. 끝나지 않으면 SIGKILL 뒤 다시 확인한다"
      - "종료를 확인하면 exited와 exit code를 남기고, 그 터미널의 bridge와 hook 묶음을 지운다. 확인하지 못하면 unknown(kill_unconfirmed)으로 남긴다"
      - "이미 끝났으면 그 runtime을 그대로 돌려준다. generation이 맞지 않으면 refused다"
    outcomes:
      - id: closed
        observe: [process:pty-shell, response]
      - id: unconfirmed
        when: "SIGHUP과 SIGKILL 뒤에도 group 종료를 확인하지 못했다. runtime은 unknown이고 결과 불명이다"
        observe: [response]
      - id: cancelled
        when: "사람이 닫기 확인에서 아니오를 골랐다(close cancelled). PTY와 runtime은 그대로다"
        observe: [response]
      - id: refused
        when: "generation이 맞지 않는다(host가 host_lost로 거절)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true
    risk: [data-loss]

  - id: terminal-restart
    title: "끝난 터미널을 같은 폴더와 env로 새 shell로 다시 띄운다"
    actor: person
    uses: [ipc:shell:terminal-restart]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/terminal-host/main.ts
    steps:
      - "focus 표에서 이 창이 그 터미널에 focus를 갖지 않았다면 not-focused다"
      - "host가 옛 shell을 끝낸다. 확인하지 못하면 unknown을 그대로 돌려주고 새로 띄우지 않는다. 확인하면 같은 폴더로 새 generation을 띄운다"
      - "새 shell에는 옛 입력을 다시 치지 않는다. 옛 입력이 남아 있으면 host가 실패로 막는다"
    outcomes:
      - id: restarted
        observe: [process:pty-shell, response]
      - id: not-focused
        when: "이 창이 그 터미널에 focus를 갖지 않았다(terminal is not focused)"
        observe: [response]
      - id: unconfirmed
        when: "옛 shell의 종료를 확인하지 못해 새로 띄우지 않았다"
        observe: [response]
      - id: refused
        when: "host가 그 터미널을 모른다(host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true

  - id: terminal-snapshot
    title: "다시 붙은 터미널 칸에 지금 화면을 준다"
    actor: person
    uses: [ipc:shell:terminal-snapshot]
    boundary: [shell]
    code:
      - packages/shell/main/terminal/ipc.ts
      - packages/shell/terminal-host/screen.ts
      - packages/shell/renderer/terminal/displays.ts
    steps:
      - "renderer가 칸을 그릴 때 snapshot을 부른다. watch가 true면 이 창이 이후 출력을 받고(terminal-output), false면 구독을 놓는다"
      - "host는 PTY 출력을 headless 화면에 접어 두었다가 그 화면을 직렬화해 chunk 하나로 준다. raw 출력을 다시 재생하지 않으며 history, 커서, mouse 인코딩을 되살린다"
      - "after_seq 뒤에 출력이 없으면 output을 빈 목록으로 준다. 응답의 runtime으로 종료와 exit code를 본다"
      - "host에 그 터미널이 없으면 gone이다"
    outcomes:
      - id: screen
        when: "after_seq 뒤에 출력이 있다. 지금 화면 chunk 하나를 마지막 seq와 함께 준다"
        observe: [response, screen:project-terminal]
      - id: up-to-date
        when: "after_seq 뒤에 출력이 없다. output은 빈 목록이다"
        observe: [response]
      - id: gone
        when: "host에 그 터미널이 없다(terminal is gone)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "창이 등록된 본문 창이 아니다"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminal-view-host
    title: "shell main이 폰이 보는 터미널의 화면을 /host-link로 올리고 폰의 입력을 그 터미널에 친다"
    actor: system
    entries: [system:terminal-view-host]
    uses: [system:host-link]
    boundary: [host-queue-interface, shell]
    code:
      - packages/shell/main/desktop/wiring/terminal-view.ts
      - packages/shell/main/terminal/terminal-view.ts
      - packages/shell/terminal-host/screen.ts
    steps:
      - "core가 terminal_stream {on: true, tail}을 보내면 그 터미널을 보는 중으로 두고 terminal-host의 screen 요청으로 지금 화면(viewport 전체와 그 위 scrollback의 마지막 tail줄, 서식이 같은 칸을 이은 run)을 읽어 terminal_screen frame 하나로 보낸다"
      - "그 터미널에 출력이 오면 첫 출력은 바로, 250ms 안에 더 온 출력은 250ms 끝에 하나로 묶어 화면 전체를 다시 보낸다. 마지막 출력 뒤 한 번은 꼭 보낸다. 연결이 없으면 보내지도 쌓지도 않는다"
      - "on: false가 오거나 터미널이 끝나거나(exited, unknown) terminal host가 사라지면 멈춘다. 연결이 (다시) 열리면 모두 멈추고 core가 살아 있는 lease마다 terminal_stream을 다시 보낼 때 다시 켠다"
      - "terminal_input {terminal_ref, text}는 core가 허락을 본 것이다. 도는 터미널이면 main의 입력 길(focus 검사 없음)로 치고 사람이 친 것처럼 coding agent 상태에 알린다. PTY 크기는 바꾸지 않는다"
    outcomes:
      - id: streamed
        when: "terminal_stream on이고 그 터미널이 있다. 지금 화면을 보내고 ok로 답한다"
        observe: [response, "request:core"]
      - id: stopped
        when: "terminal_stream off다. 보내기를 멈추고 ok로 답한다"
        observe: [response]
      - id: typed
        when: "terminal_input이 도는 터미널에 왔다. 친 뒤 ok로 답한다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "terminal_stream on의 터미널이 없거나, terminal_input의 터미널이 없거나 돌지 않는다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "terminal host가 입력을 거절했다(그 사이 끝남, host가 사라짐)"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminal-output
    title: "터미널 출력을 그 터미널을 구독한 창에만 push한다"
