group: multi-machine
scenarios:
  - id: home-desk-views-office
    who: 회사 컴퓨터에서 agent를 돌려 두고 저녁에는 집 컴퓨터에 앉는 개발자
    situation: 회사 컴퓨터에서 도는 agent의 대화를 집에서 이어 보고, 기다리는 승인에 답하고 싶다
    says: ["어제 하던 리팩터링 이어서 해 줘"]
    has: 회사 컴퓨터 "Office"(lophn이 켜져 있고 session 3개, 승인 하나가 기다림), 집 컴퓨터 "Studio"(lophn 설치, 명단에 다른 기계 없음), 둘 다 같은 사람의 것
    expects: 집 컴퓨터의 한 창에서 왼쪽 목록의 Office session을 열어 대화와 승인을 한다. Office의 터미널, 파일, 앱 화면, 설정은 Office에서만 연다
    journeys: [desktop-view-other-computer]
    edges: [Office가 꺼져 있음, Office에서 이 컴퓨터를 명단에서 뺌, 자기 자신의 초대장을 붙여 넣음, 수명이 지난 초대장]
