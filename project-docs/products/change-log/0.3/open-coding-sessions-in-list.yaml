id: open-coding-sessions-in-list
version: 0.3.0
title: '열린 coding session이 목록과 모든 창에 보임'
modules: [packages/core/router, packages/core/main, packages/core/agent-workspaces, packages/protocol, packages/shell/renderer]
checked: [architecture-eval, architecture-approval, architecture-agent-definition, boundary-catalog]
change: |
  전:
  - App Engineer의 `session.list`에 열린 coding session이 없었다. 봉투가 없는 turn(같은 앱의 새 App Engineer session, 사람이 "그 coding agent에게 전해"라고 할 때)에서는 도는 coding agent에게 말을 걸 id를 몰랐다.
  - "Check the terminal"(`coding_start`)은 터미널이 열릴 때 runtime을 받은 창에만 떴다. 뒤에 연 창에는 없었고, event stream이 다시 붙은 뒤에는 이미 시작한 session에 잠깐 잘못 뜰 수 있었다.
  후:
  - `session.list`가 끝나지 않은 coding session을 `role: "coding_agent"`, `place: {kind:"app", id}`, 이름은 harness label로 싣는다. `find`와 같은 `transport: "harness"` 대상이라 그 id로 `to:{session}`을 보내면 PTY에 닿는다. 목록 상태에 `waiting`이 생겼고 coding session만 낸다. grant가 deny인 상대와 자기 자신은 지금처럼 뺀다. `queued_coding`은 그대로다.
  - App Engineer 지침에 한 줄: 도는 coding agent는 `session.list`에도 보이고, 봉투가 없으면 그 id로 `call`을 `to:{session}`, `reply:"conversation"`으로 보낸다. 목록에 없으면 새 ticket으로 맡긴다.
  - session snapshot이 coding session의 `harness`를 싣는다(선택 칸, lophn session은 싣지 않는다).
  - 대기 목록이 snapshot에서 `unknown`이고 첫 신호가 `SessionStarted`인 harness의 coding session도 runtime 길과 같은 5초로 센다. snapshot에서 첫 신호를 들은 session은 다시 세지 않는다.
why: |
  계획 `coding-handoff`가 남긴 두 빈틈이다. 도는 coding agent를 App Engineer와 사람이 놓치지 않게 한다.
decisions:
  - text: '`session.list`가 열린 coding session을 싣는다. Router `describe`가 coding session의 place와 state를 내고, `waiting`은 coding session만 낸다. 고르는 규칙과 `queued_coding`은 그대로다.'
    by: agent
  - text: 'App Engineer 지침에 한 줄을 더한다. 줄이 없으면 봉투 밖에서 이 길을 쓸 근거가 없다.'
    by: agent
  - text: 'coding session snapshot이 harness를 싣는다. 뒤에 연 창은 터미널 runtime을 받지 않아 SessionStart hook이 있는 harness인지 달리 알 길이 없다.'
    by: agent
  - text: '대기 항목은 snapshot으로도 센다. 첫 신호를 들은 session은 `done`에 넣어 다시 붙은 뒤 온 runtime event가 항목을 띄우지 않는다. snapshot 길은 창을 연 때부터 5초를 센다.'
    by: agent
follow_up: |
  `packages/core`, `packages/protocol`, App Engineer 지침이 바뀌어 eval의 `core`와 `instruction:app-engineer`가 올랐다. commit된 eval run은 낡음으로 보인다. 그대로 두고 계획 `eval-experiment`의 baseline이 새로 잰다. `project-docs/issues/coding-agent.md`의 두 이슈를 닫았다.
