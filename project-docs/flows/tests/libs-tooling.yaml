    note: "기계 사이 snapshot 합치기(mergeSnapshot). 세 사본에서 다른 사본의 snapshot을 합친 결과가 그 변경을 하나씩 적용한 결과와 data·clock dump가 같고, 받는 쪽만 더 새로 고친 칸이 남고, 두 번 합쳐도 그대로이며(지운 row의 kept 칸도 같다), 모양이 다른 표가 있으면 아무것도 쓰지 않는다. 받는 쪽이 지우고 흔적을 정리했을 수 있는 row는 되살리지도 버리지도 않고 heldRows로 돌려준다. horizon 밖에서 돌아온 사본의 absentDeletes는 keep row와 below보다 새 clock이 있는 row를 지우지 않는다. 아직 폴더 route가 없어 outcome이 없다"
  - path: packages/protocol/apps/sync/horizon_test.ts
