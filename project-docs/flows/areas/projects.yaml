      - "입력 schema를 보고 현재 자격의 authorize를 통과하는지 본다(scope 밖이면 forbidden)"
      - "owner_kind·field가 등록된 field인지(없으면 invalid_input), 일반 읽기를 허락하는 field인지(아니면 forbidden) 본다"
      - "blob_refs에서 owner_kind·owner_key·field의 hash와 크기를 ledger snapshot으로 찾는다. 없으면 not_found다"
      - "구간을 256 KiB 창으로 자르고 I/O worker가 blobs/sha256 파일을 읽어 channel의 byte frame으로 돌려준다"
      - "읽은 크기나 hash가 등록과 다르면 corrupt, 파일이 없으면 missing으로 status를 답한다"
      - "바이트를 돌려주기 직전에 authorize를 한 번 더 한다(그 사이 scope가 바뀌었으면 거절)"
    outcomes:
      - id: available
        observe: ["response"]
      - id: missing
        observe: ["response"]
      - id: corrupt
        observe: ["response"]
      - id: invalid-window
        code: invalid_input
        when: "입력 schema가 맞지 않거나 등록되지 않은 owner_kind·field이거나 offset이 크기를 넘는다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "owner_kind·owner_key·field에 등록된 blob 참조가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "현재 자격의 operation·target scope 밖이다, 또는 field가 일반 읽기를 허락하지 않는다(바이트를 읽은 뒤 다시 검사해 거절하는 것 포함)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "blob 읽기 통로가 붙지 않았거나 ledger를 열지 못했거나 blob_refs 행을 읽지 못했다"
        observe: ["response"]
    crosses_process: true
    declared_only: [internal]
    unclear:
      - "protocol이 internal을 선언하지만 handler(blobReadHandler, planBlobRead, finishBlobRead)는 internal을 돌려주지 않는다. 읽기 실패는 status(missing, corrupt)나 unavailable로 답한다. 던진 예외를 dispatch가 internal로 바꾸는 것은 모든 route에 같다"
      - "호출자는 app 자격의 HTTP route와 core 안의 apps 능력 broker다. 이 저장소에서 route를 부르는 SDK 경로는 확인하지 않았다"
      - "protocol의 unavailable status reason에 pruned가 있으나 이 read 경로는 missing·corrupt만 만든다(pruned를 만드는 곳을 찾지 못했다)"
      - "app 범위가 다른 앱의 target이면 not_found로 답한다는 경로는 찾지 못했다. blobs/read 기본 authorizer는 target.app을 넘기지 않아 forbidden으로 답한다"

  - id: blob-upload
    title: "파일 바이트를 준비해 blob으로 저장하고 owner의 참조로 등록한다"
    actor: system
    entries: [system:blob-upload]
    boundary: [storage, child-supervision-protocol]
    code:
      - packages/core/storage/blobs/prepare-relay.ts
      - packages/core/storage/blobs/child-prepare.ts
      - packages/core/storage/blobs/register.ts
      - packages/core/storage/blobs/work.ts
    steps:
      - "core 안의 호출자(annotation 올리기, release 준비, package 설치, model call body)가 principal·purpose·선택 expected_hash로 준비를 청한다. child 자식의 blob_prepare_request도 같은 purpose 정책으로 받는다"
      - "core는 blob.prepare 요청을 I/O worker에 보내고, worker가 purpose의 허용과 용량 상한을 본다. 동시 stream은 4개까지다(child 입구)"
      - "core는 바이트를 worker가 준 credit 안에서 chunk로 흘려보낸다. 전체를 메모리에 모으지 않는다"
      - "worker가 hash를 계산해 expected_hash와 맞는지 보고 blobs/sha256에 설치한다. 임시 파일은 실패하면 지운다"
      - "core는 준비 참조를 10분 수명으로 메모리에 등록한다. owner command는 같은 ledger transaction에서 blob_refs에 참조를 넣는다"
    outcomes:
      - id: prepared
        observe: ["disk:blobs/sha256/<hash>", "response"]
      - id: referenced
        observe: ["ledger:blob_refs"]
      - id: purpose-refused
        code: forbidden
        when: "purpose가 자식 정책에 없다(존재 여부를 알리지 않는 같은 forbidden), 또는 자식 kind의 정책이 없다, 또는 I/O worker가 purpose를 허락하지 않았다"
        observe: ["response"]
      - id: too-large
        code: invalid_input
        when: "size_bytes가 purpose의 상한을 넘는다"
        observe: ["response"]
      - id: empty
        code: invalid_input
        when: "내용이 0 byte다"
        observe: ["response"]
      - id: hash-mismatch
        code: invalid_input
        when: "expected_hash와 실제 hash가 다르다"
        observe: ["response"]
      - id: stream-invalid
        code: invalid_input
        when: "같은 channel이 이미 열려 있다, 또는 자식이 credit을 넘기거나 선언 크기와 다른 바이트를 보냈다, 또는 end 뒤에 바이트를 보냈다"
        observe: ["response"]
      - id: busy
        code: unavailable
        when: "동시 stream 4개가 차 있다(자식 입구)"
        observe: ["response"]
      - id: timeout
        code: unavailable
        when: "worker가 credit을 30초 동안 주지 않았거나 end 뒤 120초 안에 답하지 않았다. 자식이 30초 동안 말이 없으면 답 없이 끊는다"
        observe: ["response"]
      - id: io-failed
        code: unavailable
        when: "I/O worker가 디스크 여유 부족, 임시 쓰기·rename·sync 실패로 설치하지 못했다"
        observe: ["response"]
      - id: relay-failed
        code: unavailable
        when: "원천 바이트를 읽지 못했거나 I/O worker로 넘기지 못했다(연결이 끊긴 것 포함)"
        observe: ["response"]
      - id: internal
        code: internal
        when: "worker가 바이트가 끝나기 전에 성공으로 답했다, 준비 결과 크기가 선언 크기와 다르다, prepare가 예외를 던졌다"
        observe: ["response"]
      - id: ref-invalid
        code: invalid_input
        when: "참조 등록 입력이 schema와 다르다, 또는 field가 등록되지 않았다, 또는 등록한 참조가 schema와 다르다"
        observe: ["response"]
      - id: ref-no-preparation
        code: invalid_input
        when: "참조 등록 때 살아 있는 준비 참조가 없다(10분이 지나 만료한 것 포함)"
        observe: ["response"]
      - id: ref-forbidden
        code: forbidden
        when: "현재 자격이 없다, 또는 준비 참조의 주체가 현재 자격과 다르다, 또는 기존 참조를 재사용하는데 허용된 참조가 없다"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    unclear:
      - "호출자(apps의 release 준비·package 설치와 publish, annotation 올리기, agent-runtime의 model call body)는 route로 들어오지 않아 이 flow가 system entry다. apps 쪽 flow가 uses로 잇는지 확인이 필요하다"
      - "준비 참조를 writer에 알리는 note가 실패했을 때의 code는 wiring이 정한다. 이 flow는 그 실패를 따로 적지 않았다"

  # ---- editor (shell main·renderer) ----

  - id: editor-open
    title: "파일 하나를 편집기 탭으로 연다"
    actor: person
    entries: [ui:editor-open]
    uses:
      - ipc:shell:file-read
      - ipc:shell:file-read-bytes
      - ipc:shell:file-watch
      - ipc:shell:instructions-open
      - ipc:shell:memory-open
    boundary: [shell]
    code:
      - packages/shell/renderer/editor/use-file.ts
      - packages/shell/renderer/editor/sessions.ts
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/editor/instructions.ts
      - packages/shell/main/editor/memory.ts
    steps:
      - "renderer가 path를 editor session으로 붙인다. 지침 파일과 memory 파일은 main이 path를 먼저 정한다. instructions-open은 전역(data root의 LOPHN.md), Home(data root의 home 폴더, 없으면 만든다), project(첫 등록 폴더, 없으면 data root의 project 자리)의 LOPHN.md와 앱 source의 AGENTS.md를 정한다. memory-open은 workspace의 memory.md(Home `home`, `projects/<prj>`, `apps/<app>`)나 agent의 `agent-memory/<agt>.md`를 정하고 부모 폴더를 만든다. 파일이 없으면 빈 buffer로 열려 첫 저장이 만든다"
      - "main은 secrets.json만 forbidden으로 막고 나머지는 디스크에서 직접 읽는다. 상대 path는 invalid_input이다"
      - "8 MiB 이하이고 NUL과 깨진 UTF-8이 없는 글이면 text·hash·modified_at을 돌려준다"
      - "8 MiB를 넘으면 편집 session 없이 bytes를 읽기 전용으로 보여 준다"
      - "창이 이 path를 watch 목록에 넣어 밖의 변화를 알린다. watch가 거절해도 renderer는 그 답을 버리고 편집기는 연다"
    outcomes:
      - id: ready
        observe: ["response", "screen:new-editor-tabs", "screen:new-document-tab-info", "screen:new-file-outside", "screen:new-instructions-file", "screen:new-viewer-text", "screen:new-viewer-media", "screen:project-document"]
      - id: too-large
        observe: ["response"]
      - id: unsupported
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "path가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 본문 main frame이 아니다(file IPC guard), 또는 secrets.json이다, 또는 디스크 권한이 없다(EACCES·EPERM)"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다(지침·memory target의 층·workspace·agent id 모양 포함)"
        observe: ["response"]
      - id: watch-refused
        observe: ["response"]
        when: "file-watch가 secrets.json 등을 거절했다. 편집기는 열리고 밖의 변화 알림만 빠진다(renderer가 답을 버린다)"
      - id: unavailable
        code: unavailable
        when: "그 밖의 디스크 오류이거나 지침·memory 파일 자리를 정하지 못했다(project 폴더를 읽지 못함, data root의 project·Home·memory 폴더를 못 만듦, 앱에 source 폴더가 없음)"
        observe: ["response"]
    crosses_process: true
    risk: [secret]
    refs: [P8, P10]
    unclear:
      - "FileFailure의 unsupported·too_large는 공통 일곱 code 밖이라 code를 비웠다. AGENTS.md의 경계 규칙과 어긋나는지 확인이 필요하다"

  - id: editor-save
    title: "편집 중인 글을 디스크에 저장한다"
    actor: person
    entries: [ui:editor-save]
    pre: [editor-open:ready]
    uses: [ipc:shell:file-write]
    boundary: [shell]
    code:
      - packages/shell/renderer/editor/save-state.ts
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/editor/ipc.ts
    steps:
      - "입력이 800ms 멈추면 renderer SaveSession이 마지막으로 읽거나 쓴 hash를 base_hash로 보낸다"
      - "main은 보낸 창이 desktop 본문인지 보고, schema가 글의 바이트 상한(8 MiB)을 본다"
      - "같은 path의 쓰기는 한 줄로 세워, 디스크 hash가 base_hash와 같을 때만 쓴다(없는 파일은 null)"
      - "같은 폴더의 임시 파일에 쓴 뒤 rename으로 바꿔 끼우고 원래 mode를 이어 받는다"
      - "결과를 모르면(unavailable) renderer가 다시 쓰지 않고 먼저 읽어 같은 글인지 확인한다"
    outcomes:
      - id: saved
        observe: ["disk:<path>", "response"]
      - id: conflict
        code: conflict
        when: "쓰기 전에 디스크가 밖에서 바뀌었다. 편집 글은 그대로 두고 쓰지 않는다"
        observe: ["response"]
      - id: denied
        code: forbidden
        when: "보낸 창이 등록된 desktop 본문 main frame이 아니다(file IPC guard), 또는 디스크 권한이 없다(EACCES·EPERM)이거나 secrets.json이다. 편집기는 failed가 된다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "부모 폴더가 없다(ENOENT). 편집기는 failed가 된다"
        observe: ["response"]
      - id: unsupported
        observe: ["response"]
        when: "경로가 폴더다(EISDIR·ENOTDIR). 편집기는 failed가 된다"
      - id: unknown-result
        code: unavailable
        when: "디스크 오류로 썼는지 모른다. renderer가 읽어서 같은 글이면 saved, 쓰기 전 글이면 다시 쓰고, 아니면 conflict가 된다"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다(글이 8 MiB를 넘는 것 포함). 편집기는 failed가 된다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    refs: [P10]
    unclear:
      - "쓰기 실패 중 conflict 밖의 것은 failed로 두고 사람의 다시 시도를 기다린다(자동 재시도 없음). 이때 편집 글은 메모리에만 남고, 창을 닫을 때 editor-window-close가 묻는다"
      - "too-large는 schema가 먼저 invalid_input으로 거절해 adapter의 too_large 답에 닿지 않는다. 그래서 invalid-path에 넣었다"

  - id: editor-conflict-resolve
    title: "디스크가 밖에서 바뀐 충돌을 사람이 고른다"
    actor: person
    entries: [ui:editor-conflict-resolve]
    pre: [editor-save:conflict]
    uses:
      - ipc:shell:file-read
      - ipc:shell:file-write
    boundary: [shell]
    code:
      - packages/shell/renderer/editor/save-state.ts
      - packages/shell/renderer/editor/conflict/conflict-compare.tsx
    steps:
      - "충돌 화면이 편집 글과 디스크 글을 나란히 보여 준다(readDisk)"
      - "내 글 유지를 고르면 디스크를 다시 읽어 base를 맞추고 그 위에 편집 글을 쓴다"
      - "디스크 글 받기를 고르면 편집 글을 디스크 글로 바꾼다. 편집 중이던 글은 버려진다"
      - "디스크를 읽지 못하면 편집 글과 디스크 글을 바꾸지 않는다"
    outcomes:
      - id: kept-mine
        observe: ["disk:<path>", "screen:new-editor-tabs"]
      - id: write-failed
        observe: ["screen:new-file-conflict"]
        when: "내 글 유지에서 디스크를 다시 읽었지만 쓰기가 conflict·failed·불명으로 끝났다. 충돌 상태로 돌아간다"
      - id: took-theirs
        observe: ["screen:new-editor-tabs"]
      - id: disk-unreadable
        observe: ["screen:new-file-conflict-compare"]
        when: "디스크를 읽지 못했다(내 글 유지·디스크 글 받기 모두). 편집 글과 디스크 글을 바꾸지 않는다"
    crosses_process: false
    risk: [data-loss]

  - id: editor-window-close
    title: "저장이 끝나지 않은 편집이 있는 창을 닫는다"
    actor: person
    entries: [ui:editor-window-close]
    uses:
      - ipc:shell:file-counts
      - ipc:shell:file-close-request
      - ipc:shell:file-close-answer
    boundary: [shell]
    code:
      - packages/shell/main/editor/close-guard.ts
    steps:
      - "창 닫기 event를 main이 막고, 창의 저장 중 수와 열린 편집 수를 보아 물을 것이 있는지 본다"
      - "물을 것이 있으면 renderer에 질문 번호를 보내고(file-close-request) 기다린다. 질문이 나가 있는 동안 온 닫기는 다시 묻지 않고 삼킨다"
      - "renderer가 저장을 끝낸 뒤 allow로 답하면(file-close-answer) 창을 닫는다. stay면 닫지 않는다"
      - "renderer가 asking으로 답하면(사람이 고르는 중) 기한을 멈춘다"
      - "15초 안에 답이 없으면 창을 닫고 log에 한 줄을 남긴다"
    outcomes:
      - id: closed
        observe: ["process:shell-window"]
        when: "물을 것이 없거나 tray Quit처럼 끄는 중이다, 또는 renderer가 allow로 답했다"
      - id: kept-open
        observe: ["process:shell-window"]
        when: "renderer가 stay로 답했다. 끄기도 멈춘다"
      - id: swallowed
        observe: ["process:shell-window"]
        when: "질문이 나가 있는 동안 온 닫기다. 다시 묻지 않고 삼킨다"
      - id: timeout-closed
        observe: ["log:close guard"]
        when: "15초 안에 renderer가 답하지 않았다"
    crosses_process: true
    risk: [data-loss]
    unclear:
      - "창 닫기 event 자체(OS 닫기, desk 닫기)의 flow는 shell-desktop 소유일 수 있다. 이 flow는 편집 guard의 판정만 소유한다고 적었다"
      - "timeout-closed는 renderer가 멈춘 채 저장 안 된 편집이 있으면 그 글을 잃을 수 있다. 설계상 창이 영원히 안 닫히지 않게 한 선택이다"
      - "asking(사람이 고르는 중)은 끝 상태가 아니라 기한을 멈추는 중간 상태라 outcome으로 두지 않았다"

  - id: editor-disk-watch
    title: "편집 중인 파일이 밖에서 바뀌면 편집기에 알린다"
    actor: system
    entries: [system:editor-disk-watch]
    uses: [ipc:shell:file-changed]
    pre: [editor-open:ready]
    boundary: [shell]
    code:
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/renderer/editor/save-state.ts
    steps:
      - "main이 창마다 감시 path의 stat과 hash를 기억하고 1초마다 stat이 바뀐 것만 다시 읽는다(폴링)"
      - "hash가 기억과 다르면 file-changed를 그 창에 보낸다. 내 쓰기 뒤에는 main이 그 창의 기억을 새 hash로 고쳐 메아리를 보내지 않는다"
      - "편집 글이 디스크와 같으면 renderer가 디스크 글을 다시 읽어 받는다(external)"
      - "편집 글이 남아 있으면 conflict 상태로 두고 쓰지 않는다"
      - "지워진 파일(hash null)은 다음 쓰기에서 충돌로 드러난다"
    outcomes:
      - id: adopted
        observe: ["screen:new-editor-tabs"]
      - id: conflict
        observe: ["screen:new-file-conflict"]
      - id: ignored
        observe: ["screen:new-editor-tabs"]
        when: "디스크 hash가 renderer의 기준 hash와 같다(내 쓰기의 메아리), 또는 지워진 파일(hash null)이다, 또는 디스크를 다시 읽지 못했다. 화면은 그대로다"
    crosses_process: false
    unclear:
      - "지워진 파일을 다음 쓰기 전까지 알리지 않는 것이 의도인지 확인이 필요하다(편집 글이 깨끗할 때도 같다)"

  # ---- file tree (Files panel, shell main) ----

  - id: file-tree-list
    title: "Files panel이 폴더 한 단계를 디스크에서 읽는다"
    actor: person
    uses: [ipc:shell:file-list]
    boundary: [shell]
    code:
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/desktop/wiring/editor.ts
      - packages/shell/renderer/workspace/sidebar/use-file-tree.ts
    steps:
      - "Files panel이 루트와 펼친 폴더마다 list를 보낸다(펼칠 때, 3초마다, 창 focus 때, 만들기·옮기기·지우기 뒤)"
      - "main은 보낸 창이 desktop 본문 main frame인지, path가 절대 경로인지 본다"
      - "활성 project들의 폴더 목록을 core에서 읽는다. 못 읽으면 path가 무엇이든 unavailable이다"
      - "path를 실제 경로로 풀어 연결 폴더 안인지 본다. 밖이면 forbidden이다(밖으로 나가는 symlink 포함). secrets.json도 거절한다"
      - "폴더를 읽어 폴더 먼저, 이름순으로 돌려준다. 끊긴 symlink는 뺀다. 펼쳐 둔 폴더가 사라졌으면 Files panel이 그 줄을 닫는다"
    outcomes:
      - id: ok
        observe: ["response", "screen:new-explorer-root", "screen:new-explorer-head"]
      - id: not-found
        code: not_found
        when: "연결 폴더 안의 path가 디스크에 없다"
        observe: ["response"]
      - id: unsupported
        when: "path가 폴더가 아니다(ENOTDIR)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 본문 main frame이 아니다(file IPC guard), 또는 path가 연결 폴더 밖이다, 또는 secrets.json이다, 또는 디스크 권한이 없다(EACCES·EPERM)"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "활성 project 폴더 목록을 core에서 읽지 못했다, 또는 그 밖의 디스크 오류다"
        observe: ["response"]
    crosses_process: true
    unclear:
      - "FileFailure의 unsupported는 공통 일곱 code 밖이라 code를 비웠다(editor-open의 unclear와 같은 문제)"

  - id: file-create
    title: "Files panel에서 새 파일이나 폴더를 만든다"
    actor: person
    uses: [ipc:shell:file-create]
    boundary: [shell]
    code:
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/editor/ipc.ts
      - packages/shell/renderer/workspace/sidebar/explorer.tsx
    steps:
      - "Explorer의 New File·New Folder가 이름 칸을 열고, 이름을 checkNewName으로 본 뒤 경로를 만들어 보낸다"
      - "main은 보낸 창과 입력을 본다. secrets.json이면 거절한다"
      - "없는 위쪽 폴더는 recursive로 만든다. 파일은 wx로 열고 폴더는 mkdir로 만든다. 이미 있으면 conflict이고 아무것도 덮지 않는다"
      - "성공하면 tree를 다시 읽는다. 새 파일은 편집기 탭으로 열고, 폴더는 tree에서 이어 간다"
    outcomes:
      - id: created
        observe: ["disk:<path>", "response", "screen:new-explorer-root"]
      - id: name-exists
        code: conflict
        when: "같은 이름의 파일이나 폴더가 이미 있다(파일은 wx, 폴더는 mkdir이 EEXIST)"
        observe: ["disk:<path> (변화 없음)", "response", "screen:new-explorer-name-exists"]
      - id: unsupported
        when: "위쪽 경로 조각이 파일이라 만들 수 없다(ENOTDIR)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 본문 main frame이 아니다(file IPC guard), 또는 secrets.json이다, 또는 디스크 권한이 없다(EACCES·EPERM)"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다(kind가 file·folder가 아니다)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "그 밖의 디스크 오류다(공간 부족 등)"
        observe: ["response"]
    crosses_process: false
    unclear:
      - "연결 폴더 밖 path도 만든다. file-adapter 머리말에 따르면 밖 판정은 없고 secrets.json만 거절한다. 설계 의도인지 확인이 필요하다"

