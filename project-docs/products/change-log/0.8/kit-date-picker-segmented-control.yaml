id: kit-date-picker-segmented-control
version: 0.8.0
title: 'kit에 날짜 고르기와 SegmentedControl을 더했다'
modules: [packages/design, tools]
checked: [architecture-ui-kit, architecture-appearance, skill-ui-design, tool-wireframes]
change: |
  전:
  - `@lophn/ui`에 날짜를 고르는 component가 없었다. 날짜 하나는 `Input type="date"`, 기간은 목록 필터용 `DateRangeFilter`뿐이었다.
  - 두세 개 가운데 하나를 늘 펼쳐 고르는 control이 없어 eval의 캘린더 앱이 Month/Week/List 전환에 Tabs를 써 본문 위에 줄을 하나 더 쌓았다.
  후:
  - `@lophn/ui/input`에 넷이 생겼다. 날짜는 `"YYYY-MM-DD"`, 기간은 `DaySpan {from, to}`이고, 오늘 표시와 처음 보이는 달은 앱 clock에서 받은 `now`로 정한다. 고른 칸과 고른 날은 ink token이라 사람이 고른 accent를 따른다.
    - `SegmentedControl`: 칸 폭이 같고 높이는 같은 size의 Button과 같다. native radio라 방향키로 옮긴다. Field 밖(목록 위 보기 전환)에서도 쓴다.
    - `Calendar`: 달력 한 장. 날 하나나 기간을 보이고 `min`·`max` 밖은 누를 수 없다. 방향키, PageUp·PageDown, Home·End로 옮긴다. 일정을 칸에 그리는 월 보기는 아니다.
    - `DatePicker`, `DateRangePicker`: Select와 같은 칸이고 누르면 Calendar가 뜬다. 열면 고른 날(없으면 오늘)에 focus가 간다. 기간은 두 번 눌러 양 끝을 고르고 거꾸로 누르면 바로 놓는다.
  - wording key 넷: `common.button.previous-month`, `common.button.next-month`, `common.label.pick-date`, `common.label.pick-dates`.
  - Input, Select, DateRangeFilter, Tabs의 "언제 쓰나" 줄이 새 component와 갈리는 지점을 말한다. gallery Kit › input에 상태별 견본이 있다.
why: |
  eval 캘린더 앱의 화면이 kit에 없는 control을 다른 component로 메우며 줄을 겹쳐 쌓았다.
decisions:
  - text: '새 npm 의존 없이 native radio와 button으로 만든다. 버린 길: Radix ToggleGroup. 앱 template의 import map에도 같은 의존을 더해야 한다.'
    by: agent
  - text: '시간 고르기와 DatePicker의 [Clear]는 두지 않는다. 쓰는 곳이 생기면 더한다.'
    by: agent
follow_up: |
  core를 다시 켜면 설치 사본(`sdk/ui/1.0.0`)이 바뀐다. 이미 켜진 앱은 다음 release부터 쓴다.
