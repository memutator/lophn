id: phone-session-header-leads-with-agent-name
title: 폰의 대화 머리 줄이 agent 이름을 크게, session 이름을 작게 보이고 project는 보이지 않는다
kind: bug
status: fixed
topic: remote
modules: [packages/mobile, tools]
now: |
  폰의 대화 화면(`packages/mobile/src/screens/session/conversation.tsx`)은 `TopBar`의 `title`에 agent 이름을, `sub`에 session 제목을 넣는다. coding session도 같고(`title`이 harness 이름, `sub`가 session 제목) 터미널 화면(`screens/terminal/index.tsx`)도 같다. project나 앱 이름은 머리 줄에 없고 ⋯ sheet의 "Agent · Workspace · desk" 줄에만 있다. 승인된 wireframe(`tools/wireframes/drafts/phone/session.tsx`)이 이 순서라 코드는 wireframe대로다. 폰의 목록 줄(검색, Home, Agents의 recent)은 이미 session 이름이 큰 글이고 "agent · workspace · 시각"이 작은 글이다.
impact: |
  같은 agent의 session이 여럿이면 머리 줄이 모두 "lophn · …"로 시작해 지금 어느 대화인지 큰 글로 알 수 없고, 어느 project의 대화인지는 ⋯를 눌러야 안다.
fix: |
  - 작음(추천): 세 머리 줄에서 `title`을 session 제목(없으면 agent 이름)으로, kit `TopBar`의 `under`(제목 아래 작은 회색 줄)를 "Agent · Project"로 바꾼다. 얼굴은 `lead` 그대로다. wireframe을 먼저 고친다(`ui-design` skill). 긴 제목은 잘린다.
decided: |
  사람이 정했다: session 이름이 큰 글이고 project 같은 것은 작은 회색 글이다. 머리 줄에 적용한다. desktop의 대화 머리(agent 이름이 먼저)는 이 이슈에서 바꾸지 않는다.
closed: |
  폰의 대화와 터미널 화면 머리 줄은 session 이름이 큰 글이고 "Agent · Project"가 아래 작은 줄이다.
guard: 없음
