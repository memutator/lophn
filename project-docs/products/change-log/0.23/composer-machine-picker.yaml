id: composer-machine-picker
version: 0.23.93
title: composer의 project chip에서 새 session을 돌릴 기계를 고른다
modules: [packages/shell/renderer, packages/design]
change: |
  - Agent composer 아래 줄의 project chip에 기계 꼬리표(MachineTag)가 붙는다: project가 여러 기계에 있거나 탭이 다른 기계의 것일 때다. Home과 앱은 그대로다.
  - 아직 session이 없는 새 탭에서는 chip이 menu를 연다. 같은 `pri_` identity의 project가 있는 기계가 이 컴퓨터부터 나오고 지금 기계에 체크가 있다. 꺼진 기계는 흐리고 줄 끝에 이유(Offline)가 보인다.
  - 기계를 고르면 탭의 `fields.workspace`가 그 기계의 사본 project id로, 탭의 `machine`이 그 기계로 바뀐다(workspace의 기계와 같으면 지운다). 첫 메시지가 그 기계에서 session을 만든다. 쓰던 글은 새 draft key로 따라간다.
  - agent는 그 기계의 것으로 맞춘다. lophn은 사본 project의 `lophn_<project>`, 그 밖은 그 기계가 알면 그대로, 모르면 그 기계의 lophn이다. 그 기계가 읽히지 않으면 탭은 그대로다.
  - session이 생긴 뒤에는 chip이 기계를 보이기만 하고 menu가 없다. 다른 기계 workspace의 탭에서는 이 컴퓨터 항목을 고를 수 없다(탭의 `machine`이 비면 workspace의 기계라 이 컴퓨터를 적을 수 없다).
  - 사본 계산은 `workspace/agent/machine-copies.ts`(`matchProjects`)이고 기계 목록(`useMachineLists`)을 읽는 workspace 창만 slice로 준다. detached 창과 전역 float은 목록이 없어 chip이 이전 그대로다. wireframe `new-agent-machine-chip`, `new-agent-machine-menu`를 더했다.
why: |
  같은 project가 여러 기계에 있어도 새 session이 어느 기계에서 돌지 사람이 고를 길이 없었다. sidebar가 기계별 workspace로 갈라지면 사람은 project chip 한 곳에서 기계를 정하는 것이 가장 가깝다.
decisions:
  - text: >-
      고른 agent가 그 기계에 없으면 항목을 막지 않고 그 기계의 lophn으로 떨어진다. 버린 길: 항목을 disabled로 두기(사람이 이유를 알 수 없고 lophn으로 시작하면 되는 경우가 대부분이다).
    by: agent
  - text: >-
      다른 기계 workspace 탭에서 이 컴퓨터는 고를 수 없게 두었다. 버린 길: 탭의 `machine`에 "이 컴퓨터" 값을 새로 두기(layout schema와 모든 `tab.machine ?? workspace.machine` 읽는 곳을 고쳐야 한다. 필요해지면 따로 한다).
    by: agent
