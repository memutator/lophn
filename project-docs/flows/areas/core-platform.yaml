  - id: roster-join
    title: "사람이 이 컴퓨터를 다른 컴퓨터의 초대장으로 명단에 들인다. 초대한 컴퓨터가 꺼져 있어도 된다"
    actor: person
    entries: [route:roster/join]
    uses: [system:roster-commit, system:remote-join, system:machine-links]
    boundary: [core-api, remote]
    code: [packages/core/main/daemon/wiring/remote.ts, packages/core/remote/roster.ts, packages/remote-client/join.ts, packages/protocol/remote/roster.ts, packages/shell/renderer/desktop/settings/remote/add-device.tsx, packages/shell/renderer/desktop/settings/remote/core-source.ts]
    docs: [architecture/remote.md]
    steps:
      - "글을 초대장 JSON으로 읽는다. remote가 켜져 있고 이 컴퓨터의 key가 있어야 한다"
      - "컴퓨터 초대장이어야 한다. issuer가 이 컴퓨터(같은 host key나 기계 id)면 거절한다"
      - "이 컴퓨터의 자기 항목을 rev+1, 초대장의 terminal_input과 초대 key로 지어 초대장의 비밀로 서명한다(초대 서명 statement). issuer의 서명 key를 root로 더한 view에서 checkInvited(지금 시각)로 issuer 자기 서명, 초대장 서명, 수명, 쓰인 초대, 빠진 key를 본다"
      - "아직 저장하지 않고 remote-client join으로 issuer에 붙어 초대 서명 statement를 join으로 낸다(20초 기한)"
      - "issuer가 거절하거나 remote protocol 판이 어긋나면 아무것도 저장하지 않는다. 그 밖(받아들임, 못 닿음, 답 전에 닫힘, 기한 지남)이면 issuer 항목, 이 컴퓨터가 issuer 항목에 한 서명, 초대 서명 statement, issuer의 주소를 저장하고(roster-commit) 닿았으면 받은 명단을 합친다. 사람이 글을 넣은 것이 issuer를 믿는 근거다. 명단에 issuer가 들어 link가 열린다(machine-links)"
      - "pending은 이 컴퓨터를 다른 컴퓨터가 아직 받아들이지 않았는지다. 못 닿았으면 초대 서명 statement를 수명까지 든 채 true로 끝나고, 그 statement는 issuer link가 다시 붙을 때의 join이나 폰이 issuer를 믿는 컴퓨터에 나를 때 받아들여진다. 수명은 그때 그 컴퓨터의 시계로 본다"
    outcomes:
      - id: joined
        when: "issuer에 닿아 받아들여졌다. pending false"
        observe: ["response", "ledger:roster_statements", "event:StateChanged"]
      - id: pending
        when: "issuer에 닿지 못했다(꺼짐, 주소 없음, 답 전에 닫힘, 20초 기한). pending true"
        observe: ["response", "ledger:roster_statements"]
      - id: not-invite
        code: invalid_input
        when: "글이 초대장이 아니거나 폰 초대장이다"
        observe: ["response"]
      - id: remote-off
        code: unavailable
        when: "remote가 꺼졌거나 key나 자기 항목이 없다, 또는 명단을 저장하지 못했다"
        observe: ["response"]
      - id: refused
        code: unauthorized
        when: "issuer 자기 서명이나 초대장 서명이 틀림(untrusted), 수명이 지남(expired), 이 컴퓨터의 key가 빠짐(removed). issuer가 같은 이유로 거절해도 그 code와 reason이고 명단에 아무것도 남지 않는다. 빠진 key라는 issuer의 답은 이 컴퓨터가 이미 믿는 컴퓨터가 서명한 빼기만 이 컴퓨터의 root로 확인해 맞으면 명단과 key를 버린다(roster-forget)"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "이 컴퓨터가 낸 초대장(this_computer), 같은 초대로 다른 key가 이미 들었음(used), id나 서명 key가 다른 key로 있음(id_taken, key_taken). issuer의 거절도 같고 명단에 아무것도 남지 않는다"
        observe: ["response"]
      - id: update
        code: conflict
        when: "issuer가 답했지만 remote protocol 판 범위가 겹치지 않는다. details.update가 client(이 컴퓨터의 lophn을 올려라) 또는 host(초대한 컴퓨터의 lophn을 올려라)이고 명단에 아무것도 남지 않는다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user 아닌 actor다. 기기 자격도 route 목록 밖이다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: machine-links
    title: "remote가 켜진 동안 core가 명단의 다른 컴퓨터마다 link 하나를 들고 명단을 주고받는다"
    actor: system
    entries: [system:machine-links]
    uses: [system:roster-commit, system:remote-join, system:remote-connection]
    boundary: [core, remote]
    code: [packages/core/remote/links.ts, packages/core/main/daemon/wiring/remote.ts, packages/remote-client/connection.ts]
    docs: [architecture/remote.md]
    steps:
      - "remote를 켠 뒤와 명단이 바뀔 때마다 view의 kind computer 기기 가운데 이 컴퓨터가 아닌 것마다 remote-client 연결 하나를 맞춘다. endpoint는 항목의 host key·machine과 명단 주소(addresses, port, relay)다. 직접 주소와 relay를 같이 걸어 먼저 handshake를 마친 쪽을 쓰고, 못 붙으면 backoff로 다시 건다. static key는 이 컴퓨터의 host key, hello 이름은 기계 이름이다. socket은 20초마다 ping하고 60초 동안 아무것도 오지 않으면 끊는다"
      - "view에서 빠진 컴퓨터의 link는 닫는다. 붙지 않은 link는 주소가 바뀌면 새로 연다. remote를 끄거나 명단과 key를 버리면 모두 닫는다"
      - "붙을 때 첫 frame join에 이 컴퓨터 key의 statement(초대 서명 statement 먼저, 그다음 컴퓨터들이 서명한 항목을 새 rev부터 8개까지)를 싣는다. 상대 host는 이 컴퓨터를 device:<이 컴퓨터 id>인 기기로 붙인다(remote-join, remote-connection)"
      - "join 답의 computer.signing_key가 명단 항목의 서명 key와 다르면 그 link를 닫고 log를 남긴다. 같으면 답의 명단을 합치고(roster-commit) 이 컴퓨터가 든 것 전부를 roster frame으로 보낸다. 상대가 민 roster와 그 답도 합친다. 이 컴퓨터의 명단이 바뀌면 붙은 link마다 든 것 전부를 보낸다. hello가 주소를 실으면 그 컴퓨터의 명단 주소로 둔다(port와 relay는 그대로)"
      - "상대가 join을 거절했거나 closed(credential_revoked)를 보내면 link를 멈추고 명단이 다음에 바뀔 때 다시 연다. 거절이 빼기 statement를 실었으면 이 컴퓨터의 root로 확인해 합친다(맞으면 roster-forget)"
      - "link 상태(connecting, connected, offline, update)·판 어긋남의 쪽·길이 바뀌면 StateChanged{remote_devices, 그 기기 id}를 낸다. 붙거나 끊길 때 마지막으로 본 때를 core가 사는 동안 든다"
      - "machines/watch로 건 조건은 기계마다 하나이고 link가 새로 열려도 다시 건다. 그 기계의 ready·event·closed frame은 이 컴퓨터의 bus에 MachineFrameReceived {machine, frame}(subject machine:<mch_>)로 낸다. 기기 event 목록에 없어 폰에 가지 않는다"
    outcomes:
      - id: linked
        when: "상대가 이 컴퓨터를 들였다. 명단이 오가고 machines/call·watch가 이 link로 간다"
        observe: ["event:StateChanged", "ledger:roster_statements"]
      - id: offline
        when: "어느 주소와 relay로도 handshake하지 못했다. backoff로 다시 건다"
        observe: ["event:StateChanged"]
      - id: update
        when: "닿았지만 protocol 판 범위가 겹치지 않는다. 어느 쪽을 올릴지 싣는다"
        observe: ["event:StateChanged"]
      - id: refused
        when: "상대가 이 컴퓨터를 들이지 않았다(아직 이 컴퓨터를 믿는 컴퓨터의 서명이 닿지 않음, 빠짐). 명단이 바뀌면 다시 붙어 본다"
        observe: ["event:StateChanged"]
      - id: signing-key-mismatch
        when: "join 답의 서명 key가 명단과 다르다. link를 닫는다"
        observe: ["log:remote link_signing_key_mismatch"]
      - id: frame-received
        when: "watch를 건 기계의 Gateway frame이 왔다"
        observe: ["event:MachineFrameReceived"]
      - id: roster-not-saved
        when: "받은 명단을 저장하지 못했다"
        observe: ["log:remote link_roster_not_saved"]
    crosses_process: false
    risk: [permission]

  - id: core-machines-list
    title: "이 기계의 화면이 명단의 다른 컴퓨터와 그 link 상태를 본다"
    actor: person
    entries: [route:machines/list]
    uses: [system:machine-links]
    boundary: [core-api, remote]
    code: [packages/core/remote/links.ts, packages/core/main/daemon/wiring/remote.ts, packages/shell/main/desktop/wiring/machines.ts]
    docs: [architecture/remote.md]
    steps:
      - "view의 kind computer 기기 가운데 이 컴퓨터가 아닌 것마다 machine, device, 명단의 이름, link 상태(link가 없거나 멈췄으면 offline), 판이 어긋났을 때 올릴 쪽, 길(direct, relay), 마지막으로 본 때를 준다. remote가 꺼져 있으면 모두 offline이다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user 아닌 actor다. 기기 자격도 route 목록 밖이다"
        observe: ["response"]
    declared_only: [unavailable]
    crosses_process: false
    unclear:
      - "선언한 unavailable은 내지 않는다. remote가 꺼져 있어도 명단의 컴퓨터를 offline으로 준다"

  - id: core-machines-call
    title: "이 기계의 화면이 다른 기계의 route 하나를 이 core의 link로 부른다"
    actor: person
    entries: [route:machines/call]
    uses: [system:machine-links, system:remote-connection]
    boundary: [core-api, remote]
    code: [packages/core/remote/links.ts, packages/core/main/daemon/wiring/remote.ts, packages/core/remote/host.ts, packages/core/remote/call.ts, packages/shell/main/desktop/wiring/machines.ts]
    docs: [architecture/remote.md, architecture/approval.md]
    steps:
      - "machine으로 명단의 다른 컴퓨터를 찾는다(이 컴퓨터는 없다)"
      - "그 컴퓨터의 link로 call frame {resource, method, body}를 보낸다. body는 그 route의 HTTP body 그대로다(command는 envelope). 한 link에 동시에 8개까지 가고 나머지는 기다린다"
      - "받는 host에서 이 call은 이 컴퓨터의 기기 항목으로 붙은 연결의 보통 call이다: actor user, principal device:<이 컴퓨터 id>, scope REMOTE_ALLOWED_ROUTES의 자격으로 같은 createRemoteCall과 authorize를 지난다(remote-connection). 넘긴 call만의 자격이나 거르기는 없고, machines/*가 목록 밖이라 넘긴 call을 다시 넘기지 못한다"
      - "답의 value를 그대로 낸다. 오류는 그 기계의 code, message, details 그대로다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "명단에 그 machine의 다른 컴퓨터가 없다, 또는 그 기계에 그 route가 없다"
        observe: ["response"]
      - id: this-computer
        code: invalid_input
        when: "machine이 이 컴퓨터다. 이 core의 route를 바로 부른다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "그 기계와의 link가 없거나 멈췄거나 붙지 않았다(remote가 꺼짐 포함), 120초 안에 답이 없다, 답 전에 link가 닫혔다, 또는 그 기계가 unavailable로 답했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user 아닌 actor다. 또는 그 기계가 기기 route 목록 밖이라 거절했다(설정·secret·명단 고치기, machines/*)"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "그 기계의 route가 conflict로 답했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "그 기계의 handler가 던졌다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: core-machines-watch
    title: "이 기계의 화면이 다른 기계의 event를 받을 조건을 건다"
    actor: person
    entries: [route:machines/watch]
    uses: [system:machine-links]
    boundary: [core-api, remote, event-stream]
    code: [packages/core/remote/links.ts, packages/core/main/daemon/wiring/remote.ts, packages/shell/main/desktop/wiring/machines.ts, packages/shell/main/desktop/wiring/machine-windows.ts]
    docs: [architecture/remote.md]
    steps:
      - "machine으로 명단의 다른 컴퓨터를 찾아 그 기계의 조건을 통째로 바꾼다(빈 배열은 끔). link가 붙어 있으면 watch frame을 보내고, 아니면 붙을 때 건다. 그 기계의 frame은 MachineFrameReceived로 이 컴퓨터의 bus에 온다(machine-links:frame-received)"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "명단에 그 machine의 다른 컴퓨터가 없다"
        observe: ["response"]
      - id: this-computer
        code: invalid_input
        when: "machine이 이 컴퓨터다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user 아닌 actor다. 기기 자격도 route 목록 밖이다"
        observe: ["response"]
    declared_only: [unavailable]
    crosses_process: false
    unclear:
      - "선언한 unavailable은 내지 않는다. link가 없으면 조건을 들고 있다가 link가 열릴 때 건다"

links: []
ignore: []
