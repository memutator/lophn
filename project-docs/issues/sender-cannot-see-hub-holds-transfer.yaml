id: sender-cannot-see-hub-holds-transfer
title: 보내는 컴퓨터는 Hub가 transfer를 다 받았는지 알 수 없어 언제 꺼도 되는지 모른다
kind: bug
status: open
topic: multi-computer
modules: [packages/core/folder, packages/core/remote, packages/cli, packages/shell/renderer]
now: |
  보내는 쪽 transfer 기록의 상태는 `packages/core/folder/transfers.ts`의 `hubInfo`가 정한다. 보낼 때(`send`)와 `processAcksAndGc`마다 "대상이 연결돼 있지 않고 연결된 Hub가 있다"면 `held_at_hub`로 둔다. 연결 상태만 보고 Hub가 file을 실제로 받았는지는 보지 않는다. 그 뒤 상태가 바뀌는 것은 대상의 `transfers/acks.json`이 돌아와 `delivered`가 될 때와 7일이 지나 `expired`가 될 때뿐이다.
  Hub는 다른 컴퓨터의 file을 얼마나 들었는지 보내는 쪽에 알리지 않는다. 그래서 `lophn send status`, `lophn send list`, Settings › My computers의 받은·보낸 file(`sync-panel.tsx`)은 Hub가 하나도 못 받았어도 다 받았어도 똑같이 `held_at_hub`다.
  받는 쪽의 `send status`는 믿는 manifest로 "k of n files have reached this computer"를 보이지만, 그것은 대상이 켜져 있을 때만 볼 수 있다.
impact: |
  보낸 컴퓨터가 곧 꺼지는 사람(한 PC의 듀얼부트 Windows·Linux, 들고 나가는 노트북)은 언제 꺼도 되는지 모른다. 듀얼부트에서는 보낸 OS와 받는 OS가 같이 켜질 수 없어 Hub만이 다리인데, Hub가 다 받기 전에 다른 OS로 재부팅하면 전송이 멈추고 그 사실이 어디에도 보이지 않는다. 실제로 같은 설치 파일(175 MB)을 Window에서 세 번 보냈고 몇 시간 동안 도착하지 않았다. agent도 `held_at_hub`를 "Hub가 보관 중"으로 사람에게 전했다.
fix: |
  - 보내는 쪽이 연결된 Hub에 그 transfer의 file을 들었는지 묻는다. 이미 있는 `carry/wants`(Hub가 아직 바라는 file)를 link로 불러 그 transfer path가 빠졌으면 Hub가 다 들었다고 본다. 단 `carry/manifests`로 Hub가 든 이 컴퓨터 manifest의 revision이 그 transfer를 실은 revision 이상인지 같이 본다(옛 manifest만 든 Hub도 바라는 것이 없다). 새 상태 `at_hub`(또는 `held_at_hub`에 Hub가 든 수 k/n)를 기록에 두고 CLI와 Settings에 "Hub에 다 올라감, 이 컴퓨터를 꺼도 됨"을 보인다(중간. 새 route가 없고 Hub 쪽 변경이 없다).
  - Hub가 다른 컴퓨터 file을 다 받으면 그 컴퓨터에 event로 알린다(중간~큼. 새 event 계약).
  - 글만 고친다: `held_at_hub`의 뜻을 도움말에 적는다(이미 함. 꺼도 되는지는 여전히 모른다).
  추천: 첫째. 보내는 쪽 UI에 "Hub에 다 올라감" 한 줄이 생기면 듀얼부트와 노트북이 바로 쓸 수 있다.
