id: flow-catalog-outcomes
version: 0.22.0
title: "flow catalog: lophn의 모든 동작과 test가 덮는 outcome"
modules: [tools, packages/protocol, packages/shell/renderer, tests]
checked: [boundary-catalog, module-catalog]
change: |
  전: 동작 목록이 없었다. 어떤 route·명령·tool·단축키·IPC·SDK export가 있는지, 그 끝 갈래가 무엇인지, test가 무엇을 덮는지 셀 길이 없었다. route `projects/list`·`projects/get`이 옛 `project-routes.ts`와 `projectApi` 두 곳에 다른 schema로 정의돼 있었다.
  후:
    - `project-docs/flows/`가 entry(code에서 뽑는 입구 699개: route 304, IPC 145, key 86, SDK 77, CLI 57, tool 16, skill 8, control 6) → flow 648개 → outcome 3,098개, journey 258개, test file 328개가 덮는 outcome을 적는다. 꼴과 쪼개는 규칙은 `project-docs/flows/README.md`, area 지도는 `areas.yaml`이다.
    - `tools/flows.ts`가 entry를 뽑고(`entries`) 참조와 빠짐을 보고(`check`) coverage를 잰다(`report`). `npm run check`의 flows 단계가 조건 없이 돈다. 소유되지 않은 entry, 두 번 소유된 entry, 없는 ID 참조, 어느 tests file에도 없는 test file이 있으면 실패한다.
    - 옛 `packages/protocol/projects/project-routes.ts`·`projects.ts`를 지웠다. renderer와 eval collect는 `projectApi`를 쓴다.
    - 처음 잰 coverage: outcome 768/3,098(25%, core E2E 191), risk outcome 384/1,244(31%), journey step 605/973(62%). core E2E 후보(process를 건너고 risk가 있는데 core E2E가 없는 flow) 73개.
    - 조사에서 확인한 bug·defect 16건을 이슈로 올렸다(`issues/app-call.md`, `approval.md`, `workspace-session.md`, `agent-definition.md`, `agent-call.md`, `code-health.md`, `shell.md`, `workspace-layout.md`).
why: |
  동작을 빠짐없이 알아야 coverage를 재고, 빠진 위험 test와 E2E를 고를 수 있다. 분모를 사람이나 model이 세면 다시 셀 수 없어서 code에서 뽑는다.
decisions:
  - text: |
      catalog는 YAML이고 entry는 code에서 뽑아 commit하지 않는다. `system:`·`ui:`만 손으로 쓴다.
    by: agent
  - text: |
      coverage는 outcome 단위로 재고 목표치는 risk outcome뿐이다. 나머지 숫자는 test를 늘리라는 뜻이 아니다(AGENTS.md "속도").
    by: agent
  - text: |
      test 연결은 test code가 아니라 `flows/tests/<group>.yaml`에 file 단위로 둔다. outcome을 가르는 판정 함수를 단정하는 unit test는 route를 부르지 않아도 그 outcome을 덮는다.
    by: agent
  - text: |
      새 entry나 test file이 flow 없이 들어오면 check가 실패한다. 기능 변경마다 YAML 한 줄을 고치는 비용을 받아들이고 catalog가 낡지 않게 한다.
    by: agent
  - text: |
      `crosses_process`는 받은 process가 다른 lophn process를 하나 더 거쳐야 끝나는지다. core의 ledger writer·reader Worker thread는 core와 같은 process이고 platform/io child는 다르다.
    by: agent
  - text: |
      조사는 haiku-xhigh가 area마다 병렬로, review와 fix pass는 sonnet-high가 맡았다. review는 area마다 표본 flow 5개의 정확도와 실패 갈래 3개의 recall을 쟀다. 첫 review에서 15개 가운데 7개가 기준(4/5, 2/3)에 못 미쳐 모든 area에 fix pass와 gap fill을 돌렸다. 다시 잰 6개 가운데 5개가 통과했다(sessions 3/5).
    by: person
follow_up: |
  route, CLI 명령, agent tool, 단축키 command, IPC channel, SDK export, 내장 skill, control 요청이나 test file을 더하거나 지우면 같은 변경에서 `project-docs/flows/`를 고친다. 진행 중인 계획 branch는 main을 받으면 flows check가 그 branch의 새 entry를 잡는다.
