id: phone-coding-open-refused-without-project-window
title: 폰에서 새 coding session을 열어도 컴퓨터의 lophn 창이 그 project를 보이고 있지 않으면 열리지 않는다
kind: bug
status: fixed
topic: harness-gui
modules: [packages/shell/main, packages/mobile]
now: |
  폰이 `coding_sessions/open`으로 여는 coding session은 컴퓨터의 터미널 탭이다. shell main(`packages/shell/main/terminal/coding-open.ts`)이 창 요청 길(`desktop/wiring/surface.ts`의 `bindTabOpen`)로 그 project를 보이는 창에 탭을 열게 한다. 그 project를 보이는 창이 없으면, 일반 창이 하나도 없을 때만 창을 focus 없이 하나 열어 기다리고, 다른 workspace를 보이는 창이 하나라도 있으면 열지 않고 `unavailable`("No lophn window on the computer shows this project … Open the project on the computer")로 답한다. PTY는 terminal-host process가 들지만 터미널을 여는 것(`shell:terminal-open`)과 크기를 정하는 것은 창의 탭이고 탭은 창의 layout에 속해서, 창 없이 열 길이 없다. agent가 연 artifact 탭이 mount된 workspace가 있어야 열리는 것(이슈 `agent-artifact-tab-needs-mounted-workspace`)과 같은 뿌리다.
impact: |
  사람이 밖에서 폰으로 coding session을 새로 시작하려 해도 컴퓨터의 lophn이 Home이나 다른 project를 보이고 있으면 시작할 수 없다. 컴퓨터 앞에 가서 그 project를 열어야 한다. 폰으로 일을 시키는 쓰임의 대부분이 이 경우다.
fix: |
  - 작음(추천): 그 project를 보이는 창이 없으면 그 project의 창을 focus 없이 하나 열고 거기에 탭을 연다(창이 하나도 없을 때 이미 하는 일을 다른 창이 있을 때도 한다). 사람이 폰에서 누른 일이라 컴퓨터에 창이 하나 생기는 것은 받아들일 만하다. 잃는 것: 컴퓨터를 쓰던 다른 사람이나 자신에게 창이 하나 늘어난다.
  - 큼: 터미널과 coding session이 창 없이 살 수 있게 한다(shell main이 PTY와 GUI adapter를 쥐고 창은 붙었다 떨어진다). artifact 탭 이슈도 같이 풀리지만 탭과 layout의 소유를 다시 짜야 한다.
decided: |
  사람이 정했다: 그 project를 보이는 창이 없으면 그 project의 창을 focus 없이 하나 열고 거기에 탭을 연다. 터미널이 창 없이 도는 구조는 이 이슈에서 하지 않는다.
closed: |
  그 project를 보이는 창이 없으면 shell main이 그 project의 창을 focus 없이 열고 15초까지 기다려 거기에 탭을 연다.
guard: 없음
