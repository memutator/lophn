  # ---------- session lifecycle(앱이 보는 session) ----------

  - id: session-lifecycle-publish
    title: "core가 session 상태가 바뀔 때 session.* event를 앱에 낸다(발행자 lophn)"
    actor: system
    entries: [system:session-lifecycle-event]
    uses: [route:app_events/publish]
    boundary: [agent-sessions, events]
    code: [packages/core/lophn-agent/session/lifecycle.ts, packages/core/lophn-agent/session/state.ts, packages/core/main/daemon/wiring/session-lifecycle.ts, packages/core/apps/events/publish.ts]
    steps:
      - "Bus의 agent event(SessionStarted·SessionEnded, TurnStarted·TurnEnded·TurnResumed, TurnRequestOpened·Closed, QuestionAsked·Resolved)를 받으면 다음 microtask에 그 session의 상태를 다시 파생한다(session 상태 한 곳: 도는 turn, 기다림은 메모리의 대기 요청·질문)"
      - "마지막으로 낸 상태와 다르면(처음 본 session의 앞 상태는 idle) session.running|waiting|idle을, SessionStarted면 session.started를, SessionEnded면 session.ended(마지막으로 안 한 줄)를 낸다. 같은 상태면 아무것도 내지 않는다"
      - "payload는 session 한 줄(id, kind, agent, harness, workspace, 제목, 상태, waiting_for, 마지막 활동, spawned_by, cwd, 폴더, terminal)이다. 발행자 lophn의 같은 전달 길(앱 event 전달)로 구독 앱의 handler를 부르고 AppEventPublished를 Bus로 낸다"
      - "구독자와 앱 화면은 그 앱 workspace에 사는 agent가 call로 닿을 수 있는 workspace의 session(call 정책, private은 안 보임)일 때만 받는다. 터미널 coding agent의 변화도 같은 event다(terminal-sessions-report가 알린 집합이 바뀔 때)"
    outcomes:
      - id: published
        when: "상태가 바뀌었다(또는 session이 시작·끝났다). 보이는 켜진 구독 앱마다 호출이 남는다"
        observe: ["ledger:invocations", "ledger:app_event_publications", "event:AppEventPublished"]
      - id: unchanged
        when: "다시 파생한 상태가 마지막으로 낸 것과 같다"
        observe: []
      - id: invisible
        when: "구독한 앱이 그 session의 workspace에 닿을 수 없다(private workspace). 그 앱에는 호출도 화면 event도 가지 않는다"
        observe: ["ledger:app_event_publications"]
    crosses_process: true
    docs: [architecture/workspace-session.md, architecture/event.md]

