id: e2e-app-restart-reader-unavailable-under-load
title: 기계가 바쁠 때 앱 crash-loop e2e가 read의 unavailable로 끝나 land를 막는다
kind: bug
status: open
topic: code-health
modules: [tests, packages/core/storage]
now: |
  `tests/e2e/app-restart_test.ts`의 "앱 process가 거듭 죽으면 자동 재시작이 멈추고 Gateway가 AppRestartHalted 하나를 받는다"가 "앱이 다시 running이 됨"을 `until`(`tests/support/core/human.ts`)로 기다리는 중에 `app.runtime` read가 `unavailable: reader가 현재 요청을 처리할 수 없다`로 돌아와 test가 바로 끝났다. 이 문구는 `createReaderPool`(`packages/core/storage/ledger/reader-pool.ts`)의 `unavailable()`이다. reader slot이 확인을 늦게 하면 격리되고, 다시 띄우는 동안 read가 실패한다. `until`은 read가 던지면 다시 묻지 않는다. 그때 load average가 18이었다(emulator 둘, gradle, e2e가 같이 돎). 그 file만 따로 돌리면 세 test가 모두 통과했다. reader가 실제로 격리됐는지, 격리가 맞는 동작인지는 확인하지 못했다.
impact: |
  기계가 바쁘면 land가 이 test에서 멈춰 e2e 전체(약 10분)를 다시 돌린다. 원인이 reader 격리라면, 바쁜 기계에서 사람의 화면 read도 잠깐 `unavailable`을 받는다.
fix: |
  - 작음(추천): 실패한 run의 core log에서 reader 격리 줄을 찾아 원인을 정한다. 격리가 맞는 동작이면 test의 `until`이 `unavailable` read를 "아직"으로 보게 한다. 아니면 reader 확인 시간(`KNOWN_ACK_MS`)을 고친다.
