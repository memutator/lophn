id: edit-call-question-lines-running
version: 0.18.0
title: "편집·call·질문 줄이 도는 중에도 있고, 실패한 편집·call도 줄로 남는다"
modules: [packages/protocol, packages/core/main, packages/shell/renderer, packages/design, tools]
checked: []
change: |
  전: 도는 tool은 끝나서 편집·call이 될 것이라도 끝날 때까지 일반 tool 줄이었다(끝나면 편집 카드나 call 블록으로 바뀌었다). 실패하거나 거절·취소된 편집과 call은 계속 일반 tool 줄이었다. ACP 전에는 둘 다 줄이 없었다.
  후: 종류(`detail.kind`)는 tool 이름이 정하고 core가 `ToolCallStarted`에서 낸다. `file.write`·`file.edit`는 `edit`, `call.send`는 `call`, `ask`는 `question`이다. 입력은 시작 event 전에 저장되므로 입력에서 뽑는 칸(편집의 path·줄 수, call의 to·task·reply)이 시작 때부터 차고, 결과에서 아는 칸(call id·state·fail_reason·session)은 call이 생긴 뒤 끝날 때 찬다. 그래서 `call` 칸의 `call`과 `state`가 null일 수 있다(보내지 못하고 실패한 `call.send`는 끝까지 null). 실패·거절·취소한 편집과 call도 종류를 지키고 항목 `state`가 `error`·`denied`·`cancelled`이다. 편집 카드는 도는 중 "Editing", 성공 "Edited", 그 밖에는 줄 수와 [Open] 없이 Failed·Denied·Cancelled 표시(`StatusMark`, 허락 결과 줄과 같은 색)가 붙는다. call 블록은 보내지 못한 call에 같은 표시를 붙이고 id가 없어 [Cancel]이 없다. 화면은 tool 이름이나 JSON을 읽지 않고 `detail.kind`만 본다. wireframe에 Agent 탭 장면 `tool-running`, `tool-failed`가 늘었다.
why: |
  사람이 ACP 이후 도는 편집·call이 일반 tool 줄로 보였다가 바뀌고, 실패한 편집·call이 일반 tool 줄로 보이는 것을 회귀로 짚었다.
decisions:
  - text: |
      종류를 결과를 보고 정하지 않고 tool 이름으로 정한다. 이름만으로 정해지는 종류는 시작 때부터 줄이 서야 하기 때문이다. `release.activate`의 `consent`는 결과(동의 대기)를 봐야 알아 성공해 끝난 뒤에만 생긴다.
    by: agent
  - text: |
      시작 때 입력을 못 읽는 `file.write`·`file.edit`는 path가 없어 generic으로 둔다. `ask`는 입력 없이도 빈 `question`이다.
    by: agent
  - text: |
      새 component를 만들지 않았다. 실패 표시는 call 블록이 이미 쓰는 `StatusMark`로, 편집 카드와 call 블록이 같은 작은 조각(`activity/tool-state-mark.tsx`)을 쓴다. 문구는 일반 tool 줄의 Failed·Denied·Cancelled 키를 그대로 쓴다.
    by: agent
  - text: |
      실패한 편집은 바뀌지 않았으므로 줄 수와 [Open]을 지운다. diff 펼침은 남겨 시도한 내용을 볼 수 있다.
    by: agent
