  - {entry: "sdk:cap-tool/traceName", reason: "trace 이름 검사 helper다. core와 flow가 읽지 않는다(SDK와 guide에만 있다). 죽은 코드인지 사람이 정한다"}
  - {entry: "sdk:cap-tool/continueRead", reason: "앱이 read 결과 이어 읽기 모양을 만드는 순수 helper다. continuation은 값으로만 실리고 core가 해석하지 않는다"}
