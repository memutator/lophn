id: core-browser
version: 0.23.85
title: 화면 없는 Linux에서 core가 창 없는 page host로 agent의 browser를 띄우고, agent의 page를 폰과 다른 기계의 창에서 보고 다룬다
modules: [packages/protocol, packages/core/host-queue, packages/core/server, packages/core/main, packages/shell/main, packages/shell/renderer, packages/mobile, packages/design, packages/cli]
checked: [agent-policy, architecture-layers, architecture-testing, architecture-activation, architecture-agent-call, architecture-app-call, architecture-package, architecture-app-notice, architecture-workspace-session, architecture-run, architecture-workflow, architecture-agent-definition, architecture-keybindings, architecture-observability, architecture-agent-chat, architecture-acp, architecture-artifact, architecture-ui-kit, architecture-appearance, architecture-phone-screen, context-component-registry, tool-check, tool-context-review, tool-worktree-prep, tool-e2e, tool-test-live, tool-check-deps, tool-dev, tests-support, tool-package, tool-models-snapshot, skill-flows, skill-ui-design]
change: |
  - 화면 없는 browser: display가 없는 Linux(env와 user manager에서 가져온 값에 `DISPLAY`·`WAYLAND_DISPLAY`가 없다)에서 core가 browser 탭을 열 일이 생기면 desktop 앱 대신 같은 Electron binary를 `--page-host --ozone-platform=headless --disable-gpu`로 띄운다. page host는 창 없이 `/host-link`에 host로 붙어 탭마다 offscreen page 하나(1280x800, 기계 전체 12개)를 들고 desktop과 같은 CDP driver, 같은 browser profile과 site login을 쓴다. popup과 download는 거절한다. 사람이 그 기계에서 desktop 앱을 켜면 page host가 그 앱을 자기 data root로 다시 띄우고 물러난다. 화면이 없어 browser를 못 쓴다던 오류 문장을 고쳤다.
  - 멀리서 보기: route `page_view/list|snapshot|watch|input|control|open`(사람 자격, 기기 route 목록에 든다), event `PageViewChanged`, change `browser_pages`. 보는 쪽이 lease를 잡은 동안 host가 그 page의 CDP screencast(JPEG, 10 fps 상한)를 밀고, core는 마지막 frame만 들고, 보는 쪽이 읽어 간 만큼만 다음 frame이 간다. 입력(pointer, scroll, 글, key, 주소, 뒤로, 다시 읽기), 멀리서 take control, 사람이 그 기계에 page 열기는 터미널 입력을 허락받은 기기만 한다. agent 자격은 이 길을 쓰지 못한다. 창이 최소화·숨김이거나 frame이 2초 없으면 그리지 않는다고 보인다.
  - 연결로만 가는 요청(`callLink`, host-link `onFrame`·`onOpen`)을 되살렸다: `page_stream|page_read|page_input|page_control`, frame `page_frame|page_state`. 연결이 없으면 대기하지 않고 실패한다.
  - 화면: 폰 sidebar의 Pages와 page 보기 화면(손가락, key 줄, 잡기, 보기만 하는 기기). desktop의 다른 기계 창에 Pages 탭 kind(mouse·wheel·keyboard, IME와 붙여넣기는 글로 보낸다).
why: |
  VM 같은 화면 없는 기계에서 browse job을 돌리고, 로그인이 필요하면 사람이 폰이나 다른 컴퓨터에서 그 page를 열어 직접 하게 하려고(로드맵 `shell-as-client.md`의 browser). `agent-browser-lifetime.md`가 "하지 않는다"로 둔 화면 없는 기계와 screencast 보기를 열었다.
decisions:
  - text: >-
      page를 주는 쪽은 같은 link의 host다. 화면 있는 기계는 desktop 앱, 화면 없는 기계는 core가 띄운 page host이고 core에 provider를 새로 두지 않는다. 버린 길: core 안의 headless provider(driver가 둘이 된다).
    by: agent
  - text: >-
      core에서 headless로 browser를 여는 길은 하나이고 어느 쪽인지는 lophn이 display로 고른다. 한 기계에서 둘이 같이 돌지 않는다.
    by: person
  - text: >-
      멀리서 보기는 터미널 보기와 같은 모양(lease, 마지막 frame, 내용 없는 event, 읽은 만큼만 다음 frame)이다.
    by: person
  - text: >-
      보는 것은 내 기기 모두, 다루는 것은 터미널 입력을 허락받은 기기다. 다른 컴퓨터의 창은 `machines/call`로 그 컴퓨터의 기기 자격이 되어 같은 허락을 따른다.
    by: agent
  - text: >-
      page host는 shell main의 launch mode다(따로 build하지 않는다). 빈 page(`about:blank`)를 먼저 읽고 크기를 준 뒤 주소로 가고, 주소가 바뀔 때마다 크기를 다시 준다(먼저 주면 Electron이 죽고, 다시 주지 않으면 screencast가 1x1을 찍었다).
    by: agent
  - text: >-
      다시 읽기는 page 안의 `location.reload()`다. CDP `Page.reload`는 webview guest를 든 shell 창을 다시 읽었다.
    by: agent
  - text: >-
      wave 1~2를 중간에 land하려 했으나 e2e가 core가 띄운 CLI가 남는 bug(이 계획과 무관, 개발 launcher가 있는 checkout에서만)로 멈춰 그 fix를 이 계획에 넣고 마지막 land 하나로 올렸다.
    by: agent
follow_up: |
  - 이슈 `page-host-keeps-core-up`: page host와 core가 서로를 살려 두어 browser를 다 쓴 뒤에도 끝나지 않는다(추천: page 없이 5분이면 page host가 끝난다).
  - 실제 화면 없는 VM(최소 server image, sandbox 없이)에서는 보지 못했다.
checklist:
  - 화면 있는 컴퓨터에서 agent가 연 browser 탭을 폰의 Pages에서 열어 그림이 오고 눌러지는지, 창을 최소화하면 "그리지 않는다"가 보이고 되살리면 다시 오는지(Wayland에서 되살린 창이 다시 그리는지) 본다
  - 다른 컴퓨터의 창에서 Pages 탭을 열어 그 컴퓨터의 page를 보고 한글 입력과 붙여넣기가 들어가는지 본다
  - 화면 없는 VM에 lophn을 깔아 agent가 `lophn tab open --url`로 page를 열고, 폰에서 그 page를 보며 로그인할 수 있는지 본다(Electron이 뜨는 데 필요한 library와 sandbox)
