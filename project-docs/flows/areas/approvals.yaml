      - "없는 앱 slug와 active 선언에 없는 command는 빠진다. 앱 workspace agent는 자기 앱을 사람의 할당 없이 포함한다(deny는 그대로 적용한다)."
      - "revision은 할당 내용의 hash에서 정한 값이다(없으면 0). 정의 파일의 다른 칸을 고쳐도 바뀌지 않는다."
      - "정의 파일이 없는 agent도 실패하지 않고 빈 할당과 revision 0을 돌려준다."
    outcomes:
