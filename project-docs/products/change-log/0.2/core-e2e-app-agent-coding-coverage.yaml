id: core-e2e-app-agent-coding-coverage
version: 0.2.0
title: "core E2E를 앱 길·agent call·coding·OAuth·Operator까지 넓히고, 그 E2E가 찾은 bug를 고침"
modules: [packages/core/lophn-agent, packages/core/main, packages/core/apps, packages/core/approvals, packages/core/agent-workspaces, packages/core/storage, packages/core/server, packages/core/supervision, packages/protocol, packages/coding-agent, packages/sdk, packages/shell/renderer, tests]
checked: [architecture-testing, architecture-agent-definition, architecture-agent-call, architecture-app-call, architecture-activation, architecture-coding-agent, architecture-approval, architecture-event, architecture-annotation, architecture-layers, tool-e2e, tests-support, skill-write-test, agents-md, tool-check, boundary-catalog, tool-check-deps, tool-dev, tool-test-live, tool-worktree-prep, tool-models-snapshot]
change: |
  전: core E2E는 7 file(boot, file-write, approval, rewind, stop, restart, secret)이었다. 앱 길(release·activation·앱 호출), agent 사이 call, coding agent, OAuth 로그인, Operator grant, annotation, reaction은 process를 건너는 test가 없었다. 앱 길은 새 data root에서 끝까지 가지 않았다.
  후(test 층): `tests/e2e`가 30 file이다(57 test, 직렬 8분 12초). support에 `gateway/`(shell의 Gateway 역할), `coding/`(CLI in-process, `deno task e2e:deps`), `app/`(template 앱을 제품 길로 띄우기와 flow별 patch), `fake-oauth/`, `annotation/`이 생겼고, fake server는 함수 대답과 줄(lane)을 받는다. run 폴더는 `/tmp/lophn-e2e-*`다. file 수 상한 대신 `deno task e2e` 전체 10분 예산이다. 흐름은 `architecture/testing.md`.
  후(동작, 고치기 전 그 행이 실패한 것을 확인했다):
  - S1. agent runtime child가 crash하거나 바뀌면 돌던 turn을 `interrupted`(`restarted`)로 닫고 inbox 표시와 기다리던 권한 요청을 푼다. 폴더·provider·MCP·skill 변화로 child를 바꿀 때는 도는 turn이 끝날 때까지 미룬다. 전에는 turn 행이 running으로 남아 session의 새 입력이 모두 `conflict`였다.
  - S3. supervisor의 재기동 횟수는 연속 실패만 센다. ready 뒤 60초를 버틴 child는 0으로 되돌린다.
  - S4. core가 시작하면 아직 turn이 가져가지 않은 사람 message를 받은 순서대로 inbox에 다시 넣는다(fork 사본, rewind로 숨긴 범위, 보관한 session·place는 뺀다). 전에는 접수 기록만 남고 turn이 열리지 않았다.
  - session archive·delete로 닫는 turn도 child에 `turn_stop`(`session_ended`)을 보내 진행 중인 model 요청을 끊는다. turn을 멈추면 `shell_run`이 process group을 끈다.
  - agent grant에 대상 줄이 없으면 agent call을 허락한다(AGENT-ROLE T4). 줄의 설정에 `excluded`(거절)를 더했다.
  - coding CLI에 `release status`, `app test status`, `app test result`를 열었다(token 범위가 따라온다). `release.preparation`은 준비가 끝나면 고정 test hash를 준다. route가 요구하는 `app` 칸은 CLI에서도 필수다.
  - session 도중 grant가 바뀐 `tools_changed` notice는 "더한 tool은 새 session부터"라고 말한다(빠진 tool은 Gate가 지금 막는다). 전에는 부를 수 없는 tool을 "Now available"이라 했다.
  - 앱 place의 Operator가 project 폴더에 쓰는 약속(AGENT-ROLE O2·O3, Operator prompt)을 지웠다. 코드는 앱 source 읽기만 준다.
  - 앱 호출 입력이 `CALL_BODY_MAX_BYTES`를 넘으면 기록·Gate 앞에서 `invalid_input`이다. 전에는 `app_unavailable` 거절로 기록됐다.
  후(E2E가 찾아 고친 bug):
  - core 안에서 부르는 command(reaction, annotation 전달, approvals 적용)가 맨 writer를 써 domain event가 Bus에 닿지 않고 call 본문 준비와 inbox 적용을 건너뛰었다. 이제 API server와 같은 접힌 writer(`ctx.writer`)를 쓴다. 그래서 `ContextViolationFound`가 Project Manager session을 열고, `annotation.send`가 turn을 연다.
  - tool 결과의 secret이 `tool_calls.result`에 redaction 없이 남았다.
  - steer로 도는 turn에 넣은 message를 rewind preview가 checkpoint로 받았다.
  - reader Worker가 등록 하나의 port를 그 등록의 read에만 붙여 `bundle.test_draft`가 `unregistered read port`였다. 이제 모든 등록의 port가 모든 read에 닿고, 같은 port를 두 등록이 내면 기동 때 멈춘다.
  - turn의 history를 받은 순서로 잘라, 아직 아무 turn도 가져가지 않은 call 본문이 앞 사람 turn의 prompt에 태그 없이 들어갔다. 이제 앞 turn들이 가져간 message를 turn 순서로 쓴다.
  - 앱 길: coding token credential을 ledger에 기록하지 않아 CLI의 쓰기 command가 모두 `unauthorized`였다. `ticket report`가 먼저 부르는 요약 upload route가 token에 없었다. call을 닫는 Reactor handler 셋이 등록되지 않았다. template 앱이 call마다 공유 store를 닫아 write changeset이 없었다. `release.prepare`가 blueprint가 선언할 수 없는 npm·jsr 의존을 견줬다. 빈 deno dir에서 release 준비가 esbuild를 못 받았고 build child가 loader의 deno dir 폴더에 못 썼다. job child가 symlink를 못 만들었다(core가 links file로 다시 만들고 `sealCopy`). preparation snapshot의 manifest가 control frame보다 컸다. runtime entrypoint의 `run` export가 빠졌다.
  - 앱 socket 폴더가 data root와 상관없는 고정 경로라 같은 사용자의 core끼리 socket을 지웠다. 이제 data root마다 나뉘고 supervisor가 정상 정지 때 지운다.
  - apps wiring의 `callerDirectory`를 채우는 곳이 없어 agent의 app-api 호출이 모두 `unavailable`이었다.
  - 처리되지 않은 오류로 죽는 앱이 오류 보고를 보내기 전에 끝나, 오류가 문제를 열지 못했다. 이제 최대 2초 보고를 기다린다.
  - 앱 process가 뜰 때 core가 그 앱 조건의 credential을 모두 끝내 같은 앱의 coding token도 죽었다. 그래서 activation 직후 연 coding session의 CLI가 `unauthorized`였다. 이제 app credential만 끝낸다. 또 complete 직후 reconcile이 방금 띄운 후보를 한 번 더 띄웠다. 이제 후보와 desired가 같으면 그대로 쓴다.
  - activation queue의 `held_calls`가 늘 0이었다(붙잡은 호출 수를 잇는 곳이 없음).
  - problem collector가 없는 route `invocations/get`으로 invocation 도착을 확인해 확인이 늘 false였다. 이제 `app.invocation`을 읽는다. 쓰이지 않던 protocol `invocations.get`·`invocations.list`와 그 record schema를 지웠다.
  - 앱 E2E가 가끔(앱 시작 약 4%) `start_failed`나 running 직후 `app_unavailable`로 실패하던 것은 위 socket 경로 충돌이었다. 고친 뒤 90번·동시 16번 실패가 없다.
why: |
  사람이 case가 부족하다고 했다. 앞 계획의 E2E 일곱 가운데 다섯이 process를 건너야만 드러나는 bug를 찾았고, 앱 길·call·coding은 그런 test가 없었다.
decisions:
  - text: |-
      새 계획으로 연다. E2E 후보는 lophn의 문서·bug·사용자 흐름에서만 뽑는다.
    by: person
  - text: |-
      E2E file 수 상한을 없애고 전체 10분 예산과 case 규칙으로 고른다.
    by: agent
  - text: |-
      S1·S4는 추천값(crash한 turn은 `restarted`로 닫고 미룸, 재시작 뒤 사람 message로 turn을 연다)으로 갔다.
    by: agent
  - text: |-
      S3은 ready에서 0이 아니라 ready 뒤 60초를 버틴 뒤 0이다. ready에서 되돌리면 뜨자마자 죽는 child가 끝없이 다시 뜬다.
    by: agent
  - text: |-
      앱 길의 CLI를 연다(명령 셋).
    by: person
  - text: |-
      Operator가 앱 data를 project 폴더에 쓰는 약속은 만들지 않고 지운다.
    by: person
  - text: |-
      agent grant는 문서대로 기본 허락이고, 끄는 길은 `excluded`다.
    by: person
  - text: |-
      앱 E2E의 core에 `XDG_RUNTIME_DIR`을 준다. app test가 `systemd-run --user`를 쓴다.
    by: agent
  - text: |-
      CLI는 in-process(`cliMain`)로 부른다.
    by: agent
  - text: |-
      test 앱은 core가 깐 template에서 출발한다. E2E 중 network는 loopback뿐이고 의존은 `e2e:deps`가 미리 받는다.
    by: agent
  - text: |-
      release build child의 쓰기를 staging과 deno dir의 loader 폴더(`npm`, `deno_esbuild`, `deno_esbuild_tmp`)로 넓혔다. esbuild deno loader가 npm 사본을 hardlink한다. 버린 길: build 전에 core가 npm을 미리 받기(loader가 쓰는 자리가 실행마다 다르다).
    by: agent
  - text: |-
      fake 대답 3개 상한은 행의 몫만 센다. 넘는 것은 session 둘이 서로 기다리는 행뿐이다.
    by: agent
  - text: |-
      E2E가 찾은 bug는 같은 계획에서 고친다.
    by: person
follow_up: |-
  - Electron E2E와 coding agent의 실제 PTY는 범위 밖이다.
  - Grants 화면은 아직 옛 규칙이다: agent 부르기를 끄면 줄을 지워 오히려 허락이 된다(`issues/approval.md`).
  - 남은 이슈: `issues/platform.md` stack 없는 앱 crash가 crash마다 새 문제를 연다(정할 것: 묶는 key), `issues/agent-definition.md` 목록에서 빠진 tool의 이유 구별이 닿지 않는다, `issues/agent-call.md` 가져간 call 글이 뒤 turn의 history에서 태그를 잃는다.
