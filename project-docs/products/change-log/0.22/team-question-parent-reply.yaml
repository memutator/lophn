id: team-question-parent-reply
version: 0.22.0
title: "팀 자식의 질문 카드가 부모가 답한 것으로 보인다"
modules: [packages/core/main, packages/protocol, packages/sdk, packages/shell/renderer, packages/design]
checked: []
change: |
  전: 팀 자식의 `ask`에 부모가 `lophn call reply`로 답해도 ACP 질문 항목의 outcome에는 `parent_reply`가 없어 `cancelled`로 나갔다. 자식 탭을 열면 부모가 답한 질문이 취소된 것으로 보였다.
  후: ACP 질문 outcome에 `parent_reply`가 생기고 질문 항목 detail에 부모의 답 글 `reply`가 실린다. 자식 탭의 접힌 요약은 "Answered by the parent"와 그 답 글을 보인다. SDK는 `@lophn/agent` 1.5.0(question `outcome`의 `parent_reply`, `reply`). 지원 하한은 그대로다.
  옮기기: 저장된 data는 바뀌지 않는다(답 글은 tool 결과에서 읽는다).
  검증: `npm run check`.
why: |
  부모가 답한 질문이 취소된 것으로 보여, 자식 탭에서 답이 갔는지 알 수 없었다.
decisions:
  - text: |
      답 글은 질문 줄(`lines`)이 아니라 항목의 `reply` 한 칸에 둔다. 부모의 답은 질문마다가 아니라 한 글이다.
    by: agent
