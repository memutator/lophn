id: harness-gui-tab-name-input-keep
version: 0.22.0
title: "harness GUI: 다른 workspace의 탭 이름, 입력 글 유지, `!` 명령 줄 접기, shell 단추"
modules: [packages/shell/renderer, packages/design]
checked: []
change: |
  전: 다른 workspace에서 본 GUI 탭 이름이 shell prompt의 경로 제목이었다. 탭을 오가면 GUI 입력칸에 쳐 둔 글이 사라졌다(화면이 붙을 때마다 session key를 새로 만들었다). 긴 `!` 명령 줄은 끝없이 길어졌다. shell mode로 들어가는 단추가 없었다.
  후: 다른 workspace의 탭 줄은 agent TUI가 foreground에 없으면 저장된 이름을 쓴다. GUI 화면의 session key는 `ses_<handle>`이다. "You ran" 줄의 명령은 `!`로 시작하고 3줄이 넘으면 접혀 펼칠 수 있다. composer에 shell 단추(capability `shell`일 때만, tooltip, 눌린 모양)와 Shell chip tooltip이 생겼다. i18n key `conversation.button.shell-on`·`shell-off`, `conversation.label.shell-chip-tooltip`.
  옮기기: 없음.
why: |
  사람이 harness GUI를 써 보고 말했다(사람).
