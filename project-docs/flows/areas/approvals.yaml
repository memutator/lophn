  - id: share-request-decide
    title: 사람이 앱 공유 요청을 승인하거나 거절한다
    actor: person
    entries: [route:share_requests/decide]
    pre: [route:share_requests/open]
    boundary: [approvals, app-runtime, agents]
    code: [packages/core/approvals/share-requests/commands.ts, packages/core/approvals/assignment/ports.ts, packages/core/main/daemon/wiring/share-requests.ts, packages/core/main/daemon/wiring/assignment-file.ts]
    steps:
      - "사람만 정한다. route의 actors와 handler가 같이 막는다."
      - "열린 요청의 `requested_at`이 카드가 본 값과 같은지 본다. 다르거나 요청이 없으면 conflict다(그 사이 새 요청이 대신했거나 이미 정해졌다)."
      - "approve면 받을 agent마다 할당 쓰기 길로 앱을 더한다. 이미 있는 줄과 그 줄의 뺀 command는 건드리지 않는다. 정의 파일은 transaction으로 되돌아가지 않으므로 중간에 실패하면 먼저 쓴 파일은 남는다."
      - "coding agent를 골랐으면 commit 뒤 설정 `coding-agent.shared_apps`에 slug를 더한다. 쓰기가 실패해도 승인은 확정이고 log(shared_apps_not_saved)만 남는다."
      - "표 줄을 지우고 ShareRequestClosed(approve나 reject)를 Bus로 낸다. reject는 agent 파일을 건드리지 않는다."
    outcomes:
      - id: approved
        observe: ["disk:agents/<agent>.md", "ledger:share_requests", "event:ShareRequestClosed", "response"]
      - id: approved-coding-not-saved
        when: "approve였고 coding agent 공유 설정 쓰기가 실패함(승인은 확정)"
        observe: ["log:share-requests", "ledger:share_requests", "event:ShareRequestClosed", "response"]
      - id: rejected
        observe: ["ledger:share_requests", "event:ShareRequestClosed", "response"]
      - id: conflict
        code: conflict
        when: "요청이 없거나 requested_at이 카드가 본 값과 다름"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "approve 중 받을 agent의 정의 파일이 없거나 앱이 없음. transaction이 되돌아가 요청은 그대로 열려 남는다"
        observe: ["ledger:share_requests", "response"]
      - id: approve-write-failed
        when: "approve 중 할당을 읽거나 쓰지 못함(파일 읽기·쓰기 실패는 unavailable, 정의 파일이 읽히지 않으면 invalid_input). 요청은 그대로 열려 남지만 먼저 쓴 agent 파일은 바뀐 채다"
        observe: ["disk:agents/<agent>.md", "ledger:share_requests", "response"]
    crosses_process: true
    risk: [permission]
    refs: ["C25", "H3", "G2"]
    docs: [architecture/approval.md, architecture/coding-agent.md]
    unclear:
      - "approve 중 두 번째 agent의 파일 쓰기가 실패하면 첫 agent 파일은 바뀐 채 남는다(commands.ts applyApproval 반복문, 재승인은 이미 든 앱을 건너뛰어 같은 결과가 된다)."

  - id: share-request-consent
    title: 앱 activation 동의 카드에 붙은 공유 요청을 동의와 같은 tx에서 승인한다
    actor: person
    uses: [route:activations/consent]
    pre: [route:share_requests/open]
    boundary: [approvals, app-releases]
    code: [packages/core/apps/releases/commands.ts, packages/core/approvals/share-requests/commands.ts, packages/core/main/daemon/wiring/share-requests.ts]
    when: "그 앱의 activation 동의가 대기 중이고 동의 카드가 공유 요청의 requested_at을 share_requested_at으로 실을 때"
    steps:
      - "동의 허락(allow)이 `share_requested_at`을 실으면 같은 transaction 안에서 `approveShareWithConsent`를 부른다."
      - "공유가 먼저 적용된다. 요청의 requested_at이 지금 것과 다르면 conflict이고 동의도 허락되지 않는다(사람이 보지 못한 내용)."
      - "승인 효과는 `share_request.decide`의 approve와 같다: 받을 agent의 할당 쓰기, commit 뒤 coding agent 설정, ShareRequestClosed(approve)."
      - "공유가 실패하면 동의도 transaction째 되돌아가 대기로 남는다."
      - "동의를 거절(reject)하면 공유 요청은 그대로 남아 대기 목록에 제 줄로 다시 보인다."
    outcomes:
      - id: approved-with-consent
        observe: ["ledger:share_requests", "ledger:activation_consents", "event:ShareRequestClosed", "event:ActivationConsentClosed", "response"]
      - id: share-replaced
        code: conflict
        when: "동의 카드가 본 requested_at과 지금 요청이 다름. 동의째 conflict"
        observe: ["ledger:activation_consents", "response"]
      - id: share-failed
        code: not_found
        when: "승인 중 받을 agent의 정의 파일이 없거나 앱이 없음(not_found), 할당 읽기·쓰기가 실패하면 그 code(unavailable, invalid_input)가 간다. 동의는 대기로 남고 먼저 쓴 agent 파일은 바뀐 채다"
        observe: ["ledger:activation_consents", "response"]
      - id: consent-rejected
        when: "동의를 거절함. 공유 요청은 그대로 남음"
        observe: ["ledger:activation_consents", "ledger:share_requests", "event:ActivationConsentClosed", "response"]
    crosses_process: true
    risk: [permission]
    refs: ["A11"]
    docs: [architecture/activation.md, architecture/approval.md]
    unclear:
      - "share-failed는 대표 code를 not_found로 적었다. 파일 쓰기 실패는 unavailable, 정의 파일 parse 실패는 invalid_input이다."

  - id: session-rewind-preview
    title: 사람이 고른 시점으로 되돌리기 전에 복원과 건너뜀, 남는 영향을 미리 본다
    actor: person
    entries: [route:rewind/preview]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/reads.ts, packages/core/lophn-agent/session/rewind/preview.ts, packages/core/lophn-agent/session/rewind/judge.ts, packages/core/lophn-agent/session/rewind/prepare.ts, packages/core/lophn-agent/session/rewind/reader.ts]
    steps:
      - "고른 checkpoint가 이미 숨긴 구간 안이면 invalid_input이다."
      - "ledger의 판정 기록(`rewind_files`)과 남는 사실(고른 시점 뒤 외부 효과 tool call, 앱 tool은 제외)을 읽는다."
      - "restore_all이면 기록에 든 경로의 지금 파일을 읽어 restore나 skip(이유)을 정하고 `preview_hash`를 만든다. messages_only와 summarize는 파일을 보지 않는다."
      - "restore_all인데 그 checkpoint의 파일이 복원 불가면 invalid_input이다."
      - "restore_all에만 `app_writes`(고른 시점 뒤 이 session이 앱에 한 write invocation)를 붙인다."
      - "파일 읽기는 reader Worker의 동기 file API로 한다. core는 이 모듈을 import하지 않는다."
    outcomes:
      - id: ok
        observe: ["response"]
      - id: hidden-checkpoint
        code: invalid_input
        when: "checkpoint가 이미 숨긴 구간 안에 있음"
        observe: ["response"]
      - id: not-restorable
        code: invalid_input
        when: "restore_all인데 files_restorable이 false"
        observe: ["response"]
      - id: checkpoint-not-found
        code: not_found
        when: "session에 없는 메시지이거나 checkpoint 행이 없는 메시지"
        observe: ["response"]
      - id: files-unavailable
        code: unavailable
        when: "기록에 든 경로의 지금 파일을 읽지 못함"
        observe: ["response"]
    crosses_process: true
    risk: []
    docs: [architecture/workspace-session.md, architecture/app-call.md]

  - id: session-rewind-apply
    title: 사람이 고른 시점으로 대화를 되돌리고 파일과 고른 앱의 data를 함께 되돌린다
    actor: person
    entries: [route:rewind/apply]
    pre: [route:rewind/preview]
    uses: [route:rewind/amend-install, route:rewind/record-apps]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/commands.ts, packages/core/lophn-agent/session/rewind/files.ts, packages/core/lophn-agent/session/rewind/restore.ts, packages/core/lophn-agent/session/rewind/settle.ts, packages/core/lophn-agent/session/rewind/schema.ts, packages/protocol/lophn-agent/session-rewinds.ts]
    steps:
      - "restore_all이면 writer 앞의 처리기(files.ts)가 파일을 관측하고 판정·준비한 뒤 command에 넘긴다. command는 파일을 쓰지 않는다."
      - "command가 준비와 같은 판정을 다시 해 preview_hash가 다르거나 건너뜀·남는 영향이 있는데 accept_remaining이 아니면 blocked로 기록한다(항목 없음, 아무것도 바꾸지 않는다)."
      - "아니면 같은 transaction에서 대화를 숨기고(restore_all·messages_only) 항목을 확정해 `reverts`·`revert_items`를 쓴다. 복원한 기록에는 `reverted_by`를 표시한다. summarize는 완료된 요약 call로 그 구간을 접는다."
      - "commit 뒤 installRestore가 파일을 쓴다. hash가 바뀌어 건너뛴 경로는 `AmendRevertInstall`(system)로 skipped(edited_outside)로 고친다."
      - "사람이 고른 앱은 앱 rewind를 요청하고 결과를 `RecordRewindApps`(system)로 남긴다. 기다리지 않는다. 앱이 거절돼도 대화와 파일은 이미 되돌아가 있다."
      - "같은 id를 다시 보내면 저장된 결과를 replayed true로 돌려주고 아무것도 다시 하지 않는다."
      - "도는 turn이 있거나 session이 닫혔으면 되돌리지 않는다."
    outcomes:
      - id: applied
        when: "건너뜀과 남는 영향이 없음(restore_all, messages_only, summarize 모두)"
        observe: ["ledger:reverts", "ledger:revert_items", "ledger:rewind_files", "event:RevertApplied", "disk:<restored files>", "response"]
      - id: applied-partial
        when: "건너뜀이나 남는 영향이 있었고 accept_remaining이 true였음"
        observe: ["ledger:reverts", "ledger:revert_items", "event:RevertApplied", "response"]
      - id: blocked
        when: "preview_hash가 다르거나 건너뜀·남는 영향이 있는데 accept_remaining이 false"
        observe: ["ledger:reverts", "event:RevertBlocked", "response"]
      - id: replayed
        when: "같은 id를 같은 session·checkpoint·choice로 다시 보냄"
        observe: ["response"]
      - id: id-reused
        code: conflict
        when: "같은 id를 다른 입력으로 보냄"
        observe: ["response"]
      - id: turn-running
        code: conflict
        when: "session에 도는 turn이 있음"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "session이 없음 또는 checkpoint 메시지가 없음"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님 또는 session이 닫힘(archived)"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "숨긴 구간의 checkpoint, apps가 restore_all이 아님, summarize의 접는 구간에 숨긴 메시지, 요약이 완전 성공이 아님, restore_all인데 파일 복원 불가"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    refs: []
    docs: [architecture/workspace-session.md, architecture/app-call.md, issues/workspace-session.md]
    unclear:
      - "rewind의 cancelWaiting은 production에서 UNWIRED_END_DEPS.effects.cancelPendingRequests(no-op)를 꽂는다(packages/core/lophn-agent/register.ts). 도는 turn이 없어야 하므로 대기 request가 남을 수 없어 실제 영향은 없어 보인다."
      - "outcome partial, uncertain, applying은 schema에 있으나 command는 applied와 blocked만 쓴다."
      - "HTTP 입력의 `files`가 비어 있지 않으면 files.ts가 준비 없이 그 값을 command에 보내 restored로 기록하고 설치하지 않는다(restore_all 분기). 정상 클라이언트가 빈 목록을 보내는지 renderer에서 확인하지 못했다."
      - "rename 단위의 설치 중 두 번째 동작이 실패하면 첫 동작은 되돌리지 않은 채 기록은 skipped로 고친다(restore.ts installUnit). 파일 상태를 되돌리는 길은 없다."
      - "shell.run으로 바뀐 파일은 기록에 없어 되돌리지 않는다(issues/workspace-session.md)."
      - "설치 뒤 AmendRevertInstall이 실패하면 apply 응답은 error인데 revert는 applied로 남는다(files.ts amendInstalled)."

  - id: rewind-reads
    title: 사람이 되돌리기 메뉴용 checkpoint 목록과 되돌리기 기록 목록을 읽는다
    actor: person
    entries: [route:rewind/checkpoints, route:rewind/list]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/reads.ts, packages/core/lophn-agent/session/rewind/hidden.ts, packages/core/lophn-agent/session/rewind/reader.ts]
    steps:
      - "checkpoint 목록은 turn을 시작한 입력 메시지마다 한 줄이다(files_restorable과 이유, 숨김 여부). 50개씩 커서로 넘긴다."
      - "되돌리기 기록 목록은 session의 되돌리기 시도(blocked 포함)를 항목과 앱 요청과 함께 읽는다. hidden_from_seq를 돌려준다."
      - "숨김 구간은 reverts 행에서 계산한다. messages는 바꾸지 않는다."
      - "파일을 읽지 않는다."
    outcomes:
      - id: ok
        observe: ["response"]
      - id: session-not-found
        code: not_found
        when: "session이 없음"
        observe: ["response"]
      - id: invalid-cursor
        code: invalid_input
        when: "커서를 풀 수 없음"
        observe: ["response"]
    crosses_process: true
    risk: []
    docs: [architecture/workspace-session.md]

  - id: rewind-summary-request
    title: 사람이 "여기서부터 요약"을 요청하면 요약 대기열에 넣는다
    actor: person
    entries: [route:rewind/summary-request]
    uses: [route:rewind/summary-take, route:rewind/summary-done]
    boundary: [agent-sessions]
    code: [packages/core/lophn-agent/session/rewind/summary.ts, packages/core/main/daemon/wiring/lophn-agent-session.ts]
    steps:
      - "고른 입력 메시지의 seq를 정한다. 닫힌 session은 forbidden, 없는 session이나 메시지는 not_found, checkpoint가 아니면(steer 메시지, Fork 복사본) invalid_input, 도는 turn이 있으면 conflict, 숨긴 구간 안이면 invalid_input이다."
      - "같은 곳의 기다리는 요청이 있으면 그 id를 돌려준다."
      - "아니면 메모리 대기열(최대 32개, 15분)에 넣는다. ledger에는 쓰지 않는다."
      - "runtime이 가져가 요약 call을 하고 끝낸다(`rewind-summary-take`, `rewind-summary-done`). 사람은 `summary-state`로 끝난 call을 보고 summarize 되돌리기로 확인한다."
      - "core가 재시작하면 대기열이 비고 사람이 다시 요청한다."
    outcomes:
      - id: requested
        observe: ["response"]
      - id: session-closed
        code: forbidden
        when: "session이 archived"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "session이나 메시지가 없음"
        observe: ["response"]
      - id: not-checkpoint
        code: invalid_input
        when: "checkpoint가 아니거나 숨긴 구간 안"
        observe: ["response"]
      - id: turn-running
        code: conflict
        when: "session에 도는 turn이 있음"
        observe: ["response"]
    crosses_process: true
    risk: []
    docs: [architecture/workspace-session.md]
    unclear:
      - "runtime이 가져간 요청을 끝내지 못하면 요청은 waiting으로 남고 15분 TTL이 지나야 사라진다. 그 사이 같은 곳의 요청은 같은 id를 돌려준다(summary.ts)."

  - id: rewind-summary-state
    title: 사람이 요약 요청의 진행 상태를 읽는다
    actor: person
    entries: [route:rewind/summary-state]
    pre: [route:rewind/summary-request]
    boundary: [agent-sessions]
    code: [packages/core/lophn-agent/session/rewind/summary.ts]
    steps:
      - "사람 화면이 요청 id로 대기열의 상태를 읽는다."
      - "기한(15분)이 지났거나, core가 재시작했거나, 대기열에서 밀려난 요청은 없다."
    outcomes:
      - id: waiting
        observe: ["response"]
      - id: summarized
        when: "summary_call을 돌려줌(summarize 되돌리기에 쓴다)"
        observe: ["response"]
      - id: failed
        when: "runtime이 실패로 끝냄"
        observe: ["response"]
      - id: gone
        code: not_found
        when: "요청이 기한이 지났거나 재시작으로 사라지거나 밀려남"
        observe: ["response"]
    crosses_process: true
    risk: []
    docs: [architecture/workspace-session.md]

  - id: rewind-summary-take
    title: runtime이 대기 중인 요약 요청을 하나 가져간다
    actor: system
    entries: [route:rewind/summary-take]
    boundary: [agent-sessions, run-loop]
    code: [packages/core/lophn-agent/session/rewind/summary.ts]
    steps:
      - "runtime이 대기 중이고 아직 가져가지 않은 가장 오래된 요청 하나를 받는다. 요청에는 from_seq가 붙는다."
      - "가져간 요청은 다시 나오지 않는다."
      - "요청이 없으면 null을 돌려준다."
    outcomes:
      - id: taken
        observe: ["response"]
      - id: none
        when: "가져갈 대기 요청이 없음"
        observe: ["response"]
    crosses_process: true
    risk: []
    docs: [architecture/workspace-session.md]

  - id: rewind-summary-done
    title: runtime이 요약 call의 결과를 요청에 돌려준다
    actor: system
    entries: [route:rewind/summary-done]
    boundary: [agent-sessions, run-loop]
    code: [packages/core/lophn-agent/session/rewind/summary.ts]
    steps:
      - "runtime이 요약 call을 끝내고 결과(완전 성공한 summary call id 또는 실패 이유)를 낸다."
      - "요청이 아직 waiting이면 상태를 summarized나 failed로 바꾼다."
      - "모르는 요청, 기한이 지난 요청, 이미 끝난 요청이면 accepted가 false이고 상태를 바꾸지 않는다."
    outcomes:
      - id: summarized
        observe: ["response"]
      - id: failed
        observe: ["response"]
      - id: not-accepted
        when: "요청을 모르거나 기한이 지났거나 이미 끝남"
        observe: ["response"]
    crosses_process: true
    risk: []
    docs: [architecture/workspace-session.md]

  - id: file-write-stage
    title: file tool이 파일을 쓰기 직전에 그 내용을 되돌리기 저장소에 둔다
    actor: agent
    entries: [route:rewind/stage-file]
    boundary: [agent-tools, storage]
    code: [packages/core/lophn-agent/session/rewind/write-routes.ts, packages/core/lophn-agent/session/rewind/restore.ts, packages/core/lophn-agent/session/rewind/store.ts, packages/core/agent-workspaces/hooks.ts]
    steps:
      - "file.write와 file.edit이 쓰기 직전에 `stage-file`을 부른다. agent 자격의 session·turn이 입력과 같아야 하고 root가 그 session의 file tool 폴더여야 한다."
      - "core가 허용 폴더 안에서 파일의 지금 내용을 직접 읽어 session 저장소(`<dataRoot>/rewind/<session>/`)에 sha256 주소로 둔다. agent가 보낸 내용은 받지 않는다."
      - "파일이 없었으면 exists false로 답한다."
      - "10 MB를 넘거나 저장에 실패하면 blob 없이 hash만 돌려준다. 저장 실패가 쓰기를 막지는 않는다."
      - "허용 폴더 밖을 가리키는 경로는 읽지 않고 unavailable이다."
    outcomes:
      - id: staged
        observe: ["disk:rewind/<session>/<sha256>", "response"]
      - id: absent
        when: "파일이 없었음"
        observe: ["response"]
      - id: no-blob
        when: "10 MB를 넘었거나 저장에 실패함(hash만 돌려줌)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "turn이 다르거나 root가 그 session의 열린 폴더가 아님"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "파일을 읽지 못함(허용 폴더 밖 경로 포함)"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss, sandbox]
    docs: [architecture/workspace-session.md, issues/workspace-session.md]

  - id: file-write-record
    title: file tool이 쓴 뒤 그 기록을 checkpoint에 남긴다
    actor: agent
    entries: [route:rewind/record-write]
    pre: [route:rewind/stage-file]
    uses: [route:rewind/record-file]
    boundary: [agent-tools, storage]
    code: [packages/core/lophn-agent/session/rewind/write-routes.ts, packages/core/lophn-agent/session/rewind/record.ts]
    steps:
      - "쓴 뒤 agent가 `record-write`를 부른다. core가 같은 확인(agent 자격의 session·turn, 열린 폴더)을 하고 blob이 이 session 저장소에 있는지 본다. 없으면 invalid_input이다."
      - "core가 쓴 뒤의 내용 hash를 읽어 machine 자격으로 `record-file`을 낸다(`rewind-file-record`)."
      - "기록은 turn을 시작한 입력 메시지(checkpoint)에 붙는다. 같은 tool call과 path가 이미 있으면 다시 쓰지 않는다."
      - "blob이 없거나 크기가 10 MB를 넘으면 그 checkpoint를 files_restorable false로 낮춘다(record_failed나 limit_file). 한 번 낮아지면 되돌아가지 않는다."
      - "checkpoint가 100개를 넘거나 session 저장물이 200 MB를 넘으면 가장 오래된 checkpoint의 기록을 지우고 낮춘다(limit_count, limit_total). 쓰기는 막지 않는다."
    outcomes:
      - id: recorded
        observe: ["ledger:rewind_files", "response"]
      - id: lowered
        when: "한도나 저장 실패로 checkpoint가 restorable이 아니게 됨(기록이 없거나 지워짐)"
        observe: ["ledger:checkpoints", "ledger:rewind_files", "response"]
      - id: replayed
        when: "같은 tool call과 path의 기록이 이미 있음"
        observe: ["response"]
      - id: turn-finished
        code: conflict
        when: "turn이 이미 끝남. 쓰기는 이미 일어났고 기록만 빠진다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "turn이 다르거나 root가 열린 폴더가 아님"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "pre-image blob이 session 저장소에 없음, tool call이나 turn이나 checkpoint가 없거나 다른 turn의 것"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/workspace-session.md]
    unclear:
      - "moved_from은 FILE_HOOKS가 늘 null로 준다(rename tool이 없다). 이름 변경 판정은 이 입구로 들어오지 않는다."

  - id: rewind-file-record
    title: core가 파일 쓰기 기록 행을 machine 자격으로 쓰고 한도를 정리한다
    actor: system
    entries: [route:rewind/record-file]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/record.ts]
    steps:
      - "file-write-record를 받은 core가 machine 자격으로 낸다. agent는 직접 부르지 못한다."
      - "turn이 running이어야 한다. 아니면 conflict다."
      - "같은 tool call과 path의 기록이 있으면 replayed로 돌려준다."
      - "기록 행(`rewind_files`)을 seq 순서로 넣는다. 행은 되돌려짐 표시(`reverted_by`) 말고는 바뀌지 않는다."
      - "한도 정리와 checkpoint 낮추기를 같은 transaction에서 한다."
    outcomes:
      - id: recorded
        observe: ["ledger:rewind_files", "response"]
      - id: lowered
        observe: ["ledger:checkpoints", "ledger:rewind_files", "response"]
      - id: replayed
        observe: ["response"]
      - id: turn-finished
        code: conflict
        when: "turn이 running이 아님"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "tool call이 없거나 다른 turn의 것, turn이 session에 없음, turn에 checkpoint가 없음"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/workspace-session.md]

  - id: revert-install-amend
    title: 설치가 덮지 않은 복원 항목을 skipped(edited_outside)로 한 번 고친다
    actor: system
    entries: [route:rewind/amend-install]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/files.ts, packages/core/lophn-agent/session/rewind/commands.ts, packages/core/lophn-agent/session/rewind/settle.ts]
    steps:
      - "설치 직후 hash가 바뀌어 덮지 않은 경로를 core가 machine 자격으로 넘긴다. 시작 때 맞추기(`rewind-startup-reconcile`)도 같은 길이다."
      - "command가 그 경로의 항목을 skipped(edited_outside)로 고치고, 그 기록의 `reverted_by`를 풀어 되돌려짐 표시를 없앤다."
      - "같은 항목은 한 번만 고친다. 두 번째는 항목이 더 restored가 아니라서 conflict다."
      - "고친 뒤 결과별 수를 RevertAmended로 Bus에 낸다."
    outcomes:
      - id: amended
        observe: ["ledger:revert_items", "ledger:rewind_files", "event:RevertAmended", "response"]
      - id: not-restored
        code: conflict
        when: "revert가 applied가 아니거나 그 경로가 이 revert로 복원된 적 없음"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "revert가 없음"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/workspace-session.md]

  - id: revert-apps-record
    title: 사람이 고른 앱마다 앱 rewind 요청의 결과를 되돌리기 기록에 남긴다
    actor: system
    entries: [route:rewind/record-apps]
    uses: [route:apps/rewind]
    boundary: [agent-sessions, app-runtime]
    code: [packages/core/lophn-agent/session/rewind/files.ts, packages/core/lophn-agent/session/rewind/commands.ts, packages/core/main/daemon/wiring/lophn-agent-session.ts]
    steps:
      - "session rewind이 applied된 뒤 사람이 고른 앱마다 고른 시점 뒤 첫 write invocation 직전으로 되돌리라고 앱 rewind를 청한다(사람 자격). 고른 시점 뒤 write가 없는 앱은 청하지 않는다."
      - "앱 rewind는 앱 쪽 순서(drain, 충돌 시 통째로 취소)를 따르므로 결과를 기다리되 session rewind를 되돌리지 않는다."
      - "결과(accepted, applied, rejected)를 RecordRewindApps로 남긴다. 거절 이유는 오류 code나 cancelled다. accepted는 끝나면 한 번 더 고친다."
      - "revert가 applied가 아니면 conflict다."
    outcomes:
      - id: recorded
        observe: ["ledger:rewind_apps", "response"]
      - id: not-applied
        code: conflict
        when: "revert가 applied가 아님"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "revert가 없음"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md, architecture/workspace-session.md]
    unclear:
      - "앱 rewind 청구가 route:apps/rewind를 거치는지는 wiring의 requestRewind(rewind.apply)를 읽어 추정했다. app-runtime 영역에서 확인할 일이다."

  - id: rewind-startup-reconcile
    title: 기동 때 설치 전에 죽은 되돌리기의 항목을 결과에 맞춘다
    actor: system
    entries: [system:rewind-startup-reconcile]
    uses: [route:rewind/amend-install]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/reconcile.ts, packages/core/lophn-agent/session/rewind/recover.ts, packages/core/main/daemon/wiring/lophn-agent-session.ts]
    steps:
      - "기동 때 한 번, 열린 session마다 blocked가 아닌 가장 나중의 revert가 applied이면 그것 하나만 본다. 앞선 revert는 hash로 설치 여부를 가를 수 없어 보지 않는다."
      - "그 revert에서 restored인 경로 가운데 파일이 아직 agent가 마지막으로 쓴 상태(설치되지 않음)인 것을 찾는다. 이름 변경이 낀 단위와 그 뒤에 다시 쓰인 경로는 건드리지 않는다."
      - "찾은 경로를 revert마다 모아 `AmendRevertInstall`로 skipped(edited_outside)로 고친다. 설치를 이어서 하지 않는다(사람이 고친 내용을 덮을 수 있다)."
      - "한 revert의 정정이 실패하거나 ledger snapshot을 읽지 못하면 아무것도 바꾸지 않고 넘어간다. 다른 revert를 막지 않고 다음 기동이 다시 본다."
    outcomes:
      - id: amended
        observe: ["ledger:revert_items", "ledger:rewind_files", "event:RevertAmended"]
      - id: nothing-to-amend
        when: "정정할 경로가 없음"
        observe: ["ledger:revert_items"]
      - id: amend-failed
        when: "정정 command가 실패하거나 snapshot을 읽지 못함. 그 항목은 restored로 남고 다음 기동이 다시 본다"
        observe: ["ledger:revert_items"]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/workspace-session.md]

  - id: rewind-store-sweep
    title: 기동과 한 시간마다 되돌리기 저장소의 고아 저장물과 끝난 session의 폴더를 지운다
    actor: system
    entries: [system:rewind-store-sweep]
    boundary: [storage, agent-sessions]
    code: [packages/core/lophn-agent/session/rewind/sweep.ts, packages/core/lophn-agent/session/rewind/sweep-core.ts, packages/core/lophn-agent/session/rewind/store.ts, packages/core/main/daemon/wiring/lophn-agent-session.ts]
    steps:
      - "기동 때 한 번, 그 뒤 1시간마다 `<dataRoot>/rewind/<session>/` 디렉터리를 본다."
      - "ledger를 짧게 읽지 못하면 아무것도 지우지 않는다."
      - "session이 archived이거나 ledger에 없으면 그 디렉터리 전체를 지운다. archived session은 되돌릴 수 없다."
      - "열린 session이면 `rewind_files.before_blob`이 가리키지 않는 고아 저장물만 지운다. 10분 안에 만든 것은 row 등록 전일 수 있어 건너뛴다."
      - "한 session의 실패가 다른 session을 막지 않는다."
    outcomes:
      - id: session-removed
        when: "session이 archived이거나 ledger에 없어 디렉터리를 지움"
        observe: ["disk:rewind/<session>/"]
      - id: orphans-removed
        when: "열린 session에서 고아 저장물을 지움"
        observe: ["disk:rewind/<session>/"]
      - id: kept
        when: "ledger를 읽지 못했거나 저장물이 모두 최근 것이라 아무것도 지우지 않음"
        observe: ["disk:rewind/<session>/"]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/workspace-session.md]

  - id: rewind-records-erase
    title: session을 지울 때 그 session의 되돌리기 기록과 저장물을 지운다
    actor: person
    uses: [route:sessions/delete]
    boundary: [agent-sessions, storage]
    code: [packages/core/lophn-agent/session/rewind/erase.ts, packages/core/lophn-agent/session/rewind/files.ts]
    steps:
      - "session 삭제의 transaction 안에서 되돌리기 표 다섯 개(rewind_apps, revert_items, reverts, rewind_files, checkpoints)의 그 session 행을 자식부터 지운다. transaction이 실패하면 함께 되돌아간다."
      - "이 지움은 메시지를 지우기 전에 일어난다. checkpoints가 messages를 가리키기 때문이다."
      - "commit 뒤 session 저장소 디렉터리와 tool-results 폴더를 지운다. 지우지 못해도 삭제 결과는 그대로이고 rewind-store-sweep이 다시 지운다."
      - "이미 복원된 파일과 앱 변경은 이 기록 밖이라 남는다."
    outcomes:
      - id: erased
        observe: ["ledger:reverts", "ledger:revert_items", "ledger:rewind_files", "ledger:checkpoints", "disk:rewind/<session>/"]
      - id: store-left
        when: "디렉터리 지우기가 실패해 쓸기가 나중에 지우게 됨"
        observe: ["disk:rewind/<session>/"]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/workspace-session.md, architecture/app-call.md]

  - id: decision-handle-issue
    title: 보호 입력 창이나 확인 창이 사람 결정의 1회용 참조를 발급받는다
    actor: person
    uses: [ipc:shell:decision-handle]
    boundary: [shell, server]
    code: [packages/shell/main/decision-handle/ipc.ts, packages/shell/main/decision-handle/issue.ts, packages/shell/main/decision-handle/handle.ts, packages/core/server/identity/confirmation.ts]
    steps:
      - "shell main은 일반 shell 창 본문에서 온 요청만 받는다. 보호 입력 창, overlay, 앱 view는 forbidden이다."
      - "요청은 결정 이름과 대상뿐이다. shell main이 내용 기준(canonical JSON의 sha256)을 만들고, 기한을 발급 뒤 120초와 대상 기한 중 이른 시각으로 정한다."
      - "core가 shell capability로만 등록을 받아 32바이트 무작위 참조를 메모리에 두고 대상, 내용, 허용 결정, 기한에 묶는다."
      - "결과에는 참조와 기한만 돌아간다. 원문은 renderer로 가지 않고 ledger, event, log에 쓰지 않는다."
      - "HTTP token, agent credential, CLI로는 등록할 수 없다."
    outcomes:
      - id: issued
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 일반 shell 창 본문이 아님"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "결정 요청 형식이 아니거나 대상 기한이 이미 지남"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "core가 준비되지 않음"
        observe: ["response"]
      - id: internal
        code: internal
        when: "core가 참조를 만들지 못함"
        observe: ["response"]
    crosses_process: true
    risk: [secret]
    docs: [architecture/approval.md]
    unclear:
      - "core 쪽 등록 메시지가 도는 control socket의 entry는 supervision 영역이라 여기서 확인하지 않았다."

  - id: decision-handle-consume
    title: 결정 확인이 필요한 route가 사람 결정 참조를 대상과 내용에 맞춰 예약하고 commit 뒤 소비한다
    actor: person
    uses: [route:providers/disconnect]
    pre: [decision-handle-issue:issued]
    boundary: [server, models]
    code: [packages/core/storage/ledger/executor.ts, packages/core/server/identity/confirmation.ts, packages/core/server/identity/confirmation-binding.ts, packages/core/server/identity/confirmation-route.ts]
    steps:
      - "`confirmation: required`인 route(지금은 command인 providers/disconnect뿐)는 executor가 binding 값으로 대상과 내용 기준을 만든다. 참조가 없거나 binding을 만들 수 없으면 forbidden이다. core의 확인 registry가 없으면 unavailable이다."
      - "ledger transaction 안에서 registry가 참조를 예약한다. 참조가 없거나 이미 소비됨, 기한이 지남, 허용되지 않은 결정, 대상이나 내용이 다름이면 forbidden이다. 다른 요청이 예약해 쓰는 중이면 conflict다."
      - "예약한 채 route의 나머지 검사(compare 불일치, 대상 없음 등)와 handler를 돈다. 실패해 rollback하면 예약만 풀고 참조는 살아 있어 사람이 다시 쓸 수 있다."
      - "commit이 끝나면 참조를 소비한다. 같은 key 재전달은 저장된 결과만 돌려주고 참조를 보지 않는다."
      - "file·worker route용 길(`consumeRouteConfirmation`)은 예약과 소비를 한 번에 하고 route가 실패해도 소비된 채다. 지금 이 길을 쓰는 route는 없다."
    outcomes:
      - id: consumed
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "참조가 없음이나 이미 소비됨, 허용되지 않은 결정, 대상이나 내용이 다름, 기한이 지남"
        observe: ["response"]
      - id: in-use
        code: conflict
        when: "같은 참조를 다른 요청이 예약해 쓰는 중"
        observe: ["response"]
      - id: registry-unavailable
        code: unavailable
        when: "확인 registry를 쓸 수 없음(다리가 없음)"
        observe: ["response"]
      - id: route-failed-handle-kept
        when: "예약은 됐지만 route가 실패해 rollback함. 참조는 소비되지 않고 예약만 풀림"
        observe: ["response"]
    crosses_process: true
    risk: [secret, permission]
    docs: [architecture/approval.md]

  - id: turn-mode-decide
    title: turn을 시작할 때 unattended, skip, attended 중 mode를 정하고 기록한다
    actor: person
    uses: [route:messages/send, route:runs/start]
    boundary: [agent-sessions, run-loop]
    code: [packages/core/lophn-agent/run-loop/turn-mode.ts, packages/core/lophn-agent/run-loop/prepare.ts]
    steps:
      - "입력이 unattended면 mode는 unattended다. run, workflow step, job의 입력이 이렇게 온다. unattended가 skip보다 먼저다."
      - "입력이 unattended가 아니면 session의 skip이 켜졌을 때 skip, 아니면 attended다."
      - "mode는 `turns.mode`에 남고 그 turn 동안 바뀌지 않는다. 도는 turn에 steer된 사람 메시지도 그 turn의 mode를 따른다."
      - "session이 open이 아니면 conflict다. mode를 정한 뒤 확인한다."
    outcomes:
      - id: unattended
        observe: ["ledger:turns", "response"]
      - id: skip
        when: "사람이 skip을 켠 session의 attended 입력"
        observe: ["ledger:turns"]
      - id: attended
        observe: ["ledger:turns"]
      - id: session-not-open
        code: conflict
        when: "session이 archived라 열려 있지 않음"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    refs: ["T4", "W4", "R7"]
    docs: [architecture/approval.md, architecture/run.md]
    unclear:
      - "turns_started_immutable 트리거는 approval.md의 주장이고 schema에서 확인하지 않았다."

