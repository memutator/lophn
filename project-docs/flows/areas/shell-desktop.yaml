  # ---------- 현재 보기 relay (protocol/shell의 route 4개) ----------
  - id: view-relay-publish
    title: "shell 창이 지금 보는 것(요약과 탭 page)을 core 메모리의 현재 보기 relay에 올린다"
    actor: shell
    entries: [route:workspace/publish]
    boundary: [shell, core-api]
    code:
      - packages/protocol/shell/workspace.ts
      - packages/core/server/workspace.ts
    steps:
      - "shell main이 user 자격으로 부른다. window_ref, generation, 관측 시각, 요약(UTF-8 2048 bytes 이하), 탭 page(한 page 20개, 탭 종류와 대상 참조만)를 받는다. 본문과 터미널 출력은 schema가 막는다"
      - "같은 window_ref가 이미 있으면 값을 대체한다. 그 창에 bind된 session 결합은 유지한다"
      - "새 window_ref인데 창 수가 64에 이르렀으면 conflict다"
      - "relay가 끊겨 있으면(main 연결이 끊긴 뒤) unavailable이다"
      - "값은 core 메모리에만 있고 ledger, blob, log에 가지 않는다"
    outcomes:
      - id: ok
        observe: ["response", "process:core 메모리의 창 값 하나가 대체된다"]
      - id: conflict
        code: conflict
        when: "창이 이미 64개 있고 새 window_ref다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "relay가 끊긴 상태다. disconnect 뒤에는 되돌아오지 않는다(unclear 참고)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 route의 actors(user)가 아니다(core dispatch의 actorAllowed가 먼저 막는다)"
        observe: ["response"]
    crosses_process: false
    unclear:
      - "shell main·renderer 어디에도 workspace/publish를 부르는 곳이 없다(grep 확인). publish 출처가 아직 붙지 않았다"
      - "현재 보기 relay는 화면 상태라서 shell-workspace 쪽일 수도 있다. entry 경로(protocol/shell)를 따라 여기 두었다"
      - "connected 값은 disconnect()에서 false가 되고 true로 돌아가는 곳이 없다(core/server/workspace.ts). disconnect는 shell의 Gateway가 닫힐 때(server.ts onClose → shell capability end)와 core 종료 때 불린다. 그러면 shell이 다시 붙은 뒤에도 publish·bind·unpublish가 core가 끝날 때까지 unavailable일 수 있다. 결함인지 확인이 필요하다"

  - id: view-relay-bind
    title: "session 하나를 publish된 창 하나에 잇는다"
    actor: shell
    entries: [route:workspace/bind]
    pre: [route:workspace/publish]
    boundary: [shell, core-api]
    code:
      - packages/protocol/shell/workspace.ts
      - packages/core/server/workspace.ts
    steps:
      - "shell main이 user 자격으로 session과 window_ref를 받는다"
      - "window_ref가 publish되어 있지 않으면 not_found다"
      - "session 하나에 창 하나다. 이미 다른 창에 잇던 session이면 옮긴다"
      - "relay가 끊겼으면 unavailable이다"
    outcomes:
      - id: ok
        observe: ["response", "process:그 창의 결합 session이 바뀐다"]
      - id: not-found
        code: not_found
        when: "window_ref가 publish되어 있지 않다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "relay가 끊긴 상태다(disconnect 뒤에는 되돌아오지 않는다. view-relay-publish 참고)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 route의 actors(user)가 아니다(core dispatch의 actorAllowed가 먼저 막는다)"
        observe: ["response"]
    crosses_process: false

  - id: view-relay-unpublish
    title: "publish된 창의 값과 그 창에 잇던 session 결합을 지운다"
    actor: shell
    entries: [route:workspace/unpublish]
    pre: [route:workspace/publish]
    boundary: [shell, core-api]
    code:
      - packages/protocol/shell/workspace.ts
      - packages/core/server/workspace.ts
    steps:
      - "shell main이 user 자격으로 window_ref를 받는다"
      - "publish된 값이 없으면 not_found다"
      - "창의 값을 지우고, 그 창에 잇던 session 결합도 모두 지운다"
      - "relay가 끊겼으면 unavailable이다"
    outcomes:
      - id: ok
        observe: ["response", "process:relay에 그 창 값이 없다"]
      - id: not-found
        code: not_found
        when: "window_ref가 publish되어 있지 않다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "relay가 끊긴 상태다(disconnect 뒤에는 되돌아오지 않는다. view-relay-publish 참고)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 route의 actors(user)가 아니다(core dispatch의 actorAllowed가 먼저 막는다)"
        observe: ["response"]
    crosses_process: false

  - id: view-relay-read
    title: "agent가 자기 session의 창이 지금 보여 주는 요약과 탭 page를 읽는다"
    actor: agent
    entries: [route:workspace/read]
    pre: [route:workspace/bind]
    boundary: [core-api]
    code:
      - packages/core/server/workspace.ts
      - packages/protocol/shell/workspace.ts
    steps:
      - "입력 session이 호출한 agent의 credential에 묶인 session과 다르면 unavailable 답이다. 자기 session의 창만 읽는다"
      - "session이 창에 bind되지 않았거나 창이 publish되어 있지 않으면 disconnected 답이다"
      - "page 번호가 범위 밖이면 unavailable 답이다. 다음 page가 있으면 next_page를 준다"
      - "돌려주기 전에 등록된 secret을 redaction으로 가린다. redaction이 막히면 unavailable 답이다"
      - "답의 모양이 출력 schema와 맞지 않으면 unavailable 답이다"
    outcomes:
      - id: current
        when: "창이 publish되어 있고 session이 묶였다. availability current로 요약과 page를 돌려준다"
        observe: ["response"]
      - id: disconnected
        when: "session이 창에 bind되지 않았거나 창이 publish되지 않았다. relay가 끊기면 값이 비워져 이 답이다"
        observe: ["response"]
      - id: unavailable
        when: "session이 맞지 않거나 page가 범위 밖이거나 redaction으로 막히거나 출력 모양이 맞지 않는다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "호출한 자격이 route의 actors(agent)가 아니다(core dispatch의 actorAllowed가 먼저 막는다)"
        observe: ["response"]
    crosses_process: false
    risk: [secret]
    unclear:
      - "protocol 주석은 요약만 주는 첫 read가 tab_page를 생략한다고 하지만 core 코드는 page 0을 항상 싣는다. 코드 확인이 필요하다"
