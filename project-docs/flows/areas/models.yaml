  - id: provider-login-start
    title: "구독 계정 로그인을 시작하고 사람이 열 주소를 받는다. 기다림은 core가 한다"
    actor: person
    entries: [route:providers/sign-in]
    uses: [route:issuer-requests/take, route:issuer-requests/done, route:providers/list]
    boundary: [models]
    code: [packages/core/lophn-agent/providers/login.ts, packages/core/lophn-agent/providers/connect-key.ts, packages/core/lophn-agent/providers/oauth.ts, packages/core/lophn-agent/providers/oauth-chatgpt.ts, packages/core/lophn-agent/providers/oauth-claude.ts, packages/core/lophn-agent/providers/oauth-antigravity.ts]
    steps:
      - "대상을 정한다: 정의 key면 그 정의와 주소(ChatGPT는 inference endpoint)다. 모르는 key는 not_found, OAuth가 없는 정의는 invalid_input이다. agent의 요청이면 열린 sign_in 요청의 target.login(core가 요청 때 정한 id와 대상)을 그대로 쓴다. 열려 있지 않으면 not_found, provider sign_in 요청이 아니면 invalid_input이다"
      - "부른 사람의 자격으로 providers/list를 읽어 그 정의가 이미 이어져 있으면 conflict다. 정의 key면 provider-connect-key와 같은 표로 id를 고른다"
      - "부른 쪽이 기기(principal `device:`)이고 정의의 flow가 loopback이면 port를 열지 않고 PKCE·state와 redirect_uri만 만들어 callback_mode를 remote_handoff로 돌려준다. 기기가 사람이 돌아온 주소를 providers/sign-in-callback으로 건네면 이 기계에서 교환·저장한다"
      - "같은 정의의 앞 로그인을 치운다: 끝난 상태는 지우고 기다리던 것은 cancelled로 닫는다"
      - "PKCE 제품(ChatGPT, Claude, Antigravity)은 정의된 고정 callback port에 loopback listener를 먼저 열고 S256 challenge와 state로 주소를 만든다. 다른 프로그램이 그 port를 쓰면 conflict다. 다른 이유로 열지 못하면 unavailable이다"
      - "device code 제품(SuperGrok)은 발급자의 device 주소를 발급자 요청 대기열로 불러 user code와 확인 주소를 받는다. 응답이 모자라거나 8초 안에 답이 없거나 device code가 없으면 unavailable이다"
      - "로그인 세션(state, verifier, device code)은 메모리에만 두고 상태를 waiting으로 둔 뒤 StateChanged{providers, <provider>}를 낸다. core가 뒤에서 기다리기 시작한다(provider-login-finish)"
    outcomes:
      - id: started
        observe: ["event:StateChanged", "response"]
      - id: not_found
        code: not_found
        when: "모르는 정의 key다. 그 요청이 열려 있지 않다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "그 정의가 이미 이어져 있다. PKCE 제품의 고정 callback port를 다른 프로그램이 쓰고 있다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다. 정의에 OAuth 로그인이나 주소가 없다. 요청이 provider sign_in이 아니다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "PKCE 고정 port를 열 수 없다(EADDRINUSE가 아닌 listen 실패). device 제품은 발급자가 device code를 주지 않았거나 응답 값이 모자라거나 8초 안에 답이 없다. providers/list를 읽지 못했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch). 터미널 입력 허락이 없는 기기나 terminal·agent 요청이다"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: []
    docs: [architecture/agent-definition.md, architecture/remote.md]
    unclear: []

  - id: provider-login-finish
    title: "core가 구독 로그인을 기다려 token을 저장하고 provider를 잇고, 화면은 그 상태를 읽는다"
    actor: person
    entries: [route:providers/sign-in-state, route:providers/sign-in-callback]
    uses: [route:providers/connect, route:provider-credentials/record-models, route:issuer-requests/take, route:issuer-requests/done]
    boundary: [models, secrets]
    code: [packages/core/lophn-agent/providers/login.ts, packages/core/lophn-agent/providers/oauth.ts, packages/core/lophn-agent/providers/oauth-secrets.ts, packages/core/lophn-agent/providers/oauth-chatgpt.ts, packages/core/lophn-agent/providers/oauth-claude.ts, packages/core/lophn-agent/providers/oauth-antigravity.ts, packages/shell/renderer/desktop/settings/sign-in.ts]
    steps:
      - "core가 정의의 간격마다 세션을 한 번 본다. 발급자에 닿지 못한(unavailable) 것은 연달아 3번까지 다시 보고, 한 번 놓친 뒤 세션이 없으면(not_found) unavailable로 끝낸다. 기한(expires_at)이 지나면 not_found로 끝낸다"
      - "PKCE는 callback이 없으면 다시 기다린다. 있으면 세션을 끝낸다. 발급자가 error로 거절했거나 state가 이 시도의 것이 아니면 forbidden이다. device는 authorization_pending이나 slow_down이면 다시 기다리고 expired_token이면 not_found, 그 밖의 거절이나 token이 모자라면 forbidden이다"
      - "token 교환(PKCE): 발급자가 200이 아니면 forbidden이다. Antigravity는 refresh가 없거나 control plane이 401이면 unauthorized, 403이면 forbidden, project를 정하지 못하면 unavailable이다. ChatGPT는 계정 id가 없으면 forbidden이다"
      - "기기(principal `device:`)가 시작한 로그인은 잇기 직전에 그 기기의 터미널 입력 허락을 다시 보고, 꺼졌으면 받은 token을 버리고 forbidden으로 끝낸다. ConnectProvider를 로그인을 시작한 사람의 context로 writer에 부른다. 같은 id가 있으면 conflict다(token은 저장하지 않았다). 연결된 뒤에 token 세 이름을 secrets.json에 쓴다. 못 쓰면 store-failed다. 연결되면 계정 model 목록을 뒤에서 읽어 record-models로 저장한다(실패는 삼킨다)"
      - "끝나면 상태를 connected나 failed(code)로 바꾸고 StateChanged{providers, <provider>}를 낸다. agent의 sign_in 요청으로 시작했으면 그 요청을 signed_in이나 그 오류로 core가 끝낸다"
      - "화면(desktop Settings, card, 폰)은 providers/sign-in-state를 StateChanged로 다시 읽어 따라간다. 모르는 login은 not_found다. 끝난 상태는 core가 사는 동안, 같은 정의로 새 로그인을 시작할 때까지 남는다"
    outcomes:
      - id: pending
        when: "state waiting(주소, device code, 기한)"
        observe: ["response"]
      - id: connected
        when: "state connected"
        observe: ["disk:<root>/secrets.json", "ledger:providers", "ledger:provider_credentials", "event:StateChanged", "response"]
      - id: forbidden
        when: "state failed, code forbidden: 발급자가 로그인이나 교환을 거절했다. state가 이 시도의 것이 아니다. token 응답이 모자라다. ChatGPT 계정 id가 없다. Antigravity 계정이 쓸 수 없다(403)"
        observe: ["event:StateChanged", "response"]
      - id: grant-lost
        when: "state failed, code forbidden: 기기가 시작한 로그인인데 기다리는 사이 그 기기의 터미널 입력 허락이 꺼졌다. provider를 잇지 않고 token을 쓰지 않는다. 이 기계의 사람이 시작한 로그인은 허락을 보지 않는다"
        observe: ["event:StateChanged", "response"]
      - id: unauthorized
        when: "state failed, code unauthorized: Antigravity가 refresh token을 주지 않았거나 계정 control plane이 401로 답했다"
        observe: ["event:StateChanged", "response"]
      - id: unavailable
        when: "state failed, code unavailable: 발급자에 연달아 3번 닿지 못했다. 한 번 놓친 뒤 세션이 없다. Antigravity project를 정하지 못했다"
        observe: ["event:StateChanged", "response"]
      - id: store-failed
        when: "state failed, code unavailable: 연결 뒤 token을 secrets.json에 쓰지 못했다(provider는 token 없이 남는다)"
        observe: ["event:StateChanged", "response"]
      - id: conflict
        when: "state failed, code conflict: 같은 id의 provider가 이미 있다. 새 token은 저장하지 않았다"
        observe: ["event:StateChanged", "response"]
      - id: expired
        when: "state failed, code not_found: 기한이 지났다(PKCE 5분, device 만료). device 발급자가 expired_token으로 끝냈다"
        observe: ["event:StateChanged", "response"]
      - id: cancelled
        when: "state cancelled: providers/login-cancel이 그만뒀거나 같은 정의로 새 로그인을 시작했다"
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "모르는 login이다(core가 다시 켜졌다)"
        observe: ["response"]
      - id: forbidden-caller
        code: forbidden
        when: "이 route의 actor가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: ["response"]
    crosses_process: true
    risk: [secret, data-loss]
    refs: []
