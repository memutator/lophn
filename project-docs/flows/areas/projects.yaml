      - "없는 위쪽 폴더는 recursive로 만들고 cp로 file과 폴더를 함께 복사한다(force 없이, errorOnExist)"
      - "성공하면 tree를 다시 읽고 복사한 경로를 고른다. 열린 탭은 복사본을 새로 열지 않는다"
    outcomes:
