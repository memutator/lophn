id: codex-subagent-events-dropped
title: Codex subagent 이벤트가 lane이 열리기 전이나 다시 연 뒤에 빠진다
kind: defect
status: fixed
topic: harness-gui
modules: [packages/shell/main]
now: |
  `codex.ts`는 `spawnAgent` item이 끝나 자식 thread id를 본 뒤에 자식 lane을 연다. 그 전에 온 자식 thread 이벤트는 모르는 thread라 버린다. 다시 열면(resume) 자식 대화를 `thread/turns/list`로 다시 그리지만 자식 thread를 구독하지 않는다.
impact: |
  녹화에서는 순서가 맞았지만 보장되지 않는다. 자식의 첫 메시지·tool 줄이 subagent 보기에서 빠질 수 있다. GUI를 다시 연 뒤 아직 도는 subagent는 흘러나오지 않고 끝날 때까지 멈춘 것처럼 보인다.
fix: |
  모르는 thread의 이벤트를 짧게 쌓아 두고 spawn item이 그 thread id를 알리면 lane에 붓는다. resume 때 도는 자식(`agentsStates`)마다 `thread/resume`으로 구독한다. 작음.
closed: |
  lane이 없는 thread의 이벤트는 thread마다 50개, 모두 200개까지 쌓았다가 spawn item이 그 thread를 알리면 순서대로 붓고, root turn이 끝나면 버린다. 다시 열면 `replayChildren` 뒤에 도는 자식마다 `thread/resume`(`excludeTurns: true`)을 보낸다. `thread/turns/list`와 자식 `thread/resume` 사이에 온 이벤트는 여전히 빠질 수 있다.
guard: '`packages/shell/main/extensions/bundled/harness-gui/codex_test.ts` "spawn item보다 먼저 온 자식 thread 이벤트는 lane이 열릴 때 그 안에 들어간다"'
