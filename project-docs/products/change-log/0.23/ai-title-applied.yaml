id: ai-title-applied
version: 0.23.26
title: AI가 지은 session 제목이 실제로 붙는다
modules: [packages/core/lophn-agent]
change: |
  - 새 session의 제목이 첫 말을 자른 글에서 model이 지은 짧은 제목으로 바뀐다. 전에는 제목 call만 돌고 제목은 그대로였다(runtime이 `sessions/ai-title`을 부를 수 없었다).
  - 이미지나 file이 붙은 첫 말, `/` 명령으로 시작한 session에도 AI 제목이 붙는다. 제목 call이 session의 지금 제목을 읽어 그 제목을 바꿀 대상으로 삼는다.
  - e2e 가짜 provider에 제목 call의 답을 정하는 `title` option을 더했다.
why: |
  0.23.22의 AI 제목이 loop test로만 확인돼 real core에서 적용되지 않는 것을 몰랐다. 이슈 `ai-title-never-applied`.
decisions:
  - text: >-
      바꿀 대상은 요청 글에서 다시 계산한 자동 제목이 아니라 제목 call을 시작할 때 읽은 session 제목이다. 버린 길: runtime과 core가 같은 계산을 하게 맞추기(자동 제목 규칙이 바뀔 때마다 두 곳이 어긋난다).
    by: agent
