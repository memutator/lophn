id: gui-window-hides-cli-session-id
title: 창에 CLI session id가 보이지 않아 다시 열 id를 모른다
kind: bug
status: fixed
topic: harness-gui
modules: [packages/shell/main, packages/shell/renderer]
now: |
  다시 열기는 `claude gui --resume <id>`다(그 CLI 자신의 session id, codex는 thread id, opencode는 session id). adapter 셋(`packages/shell/main/extensions/bundled/harness-gui/claude.ts`, `codex.ts`, `opencode.ts`)은 그 id를 어디에도 내지 않고, `AcpSessionHandle`(`packages/protocol/extensions/acp-session.ts`)에는 창 제목이나 머리에 값을 줄 길이 없다. 창 제목은 harness 이름과 cwd 끝 폴더뿐이다.
impact: |
  사람이 GUI 창에서 한 대화를 GUI로 다시 열려면 id를 다른 곳(TUI의 `claude --resume` 목록, `~/.claude/projects/` file 이름)에서 찾아야 한다.
fix: |
  - handle에 CLI session id를 알리는 칸(`describe({resume})` 같은 것)을 더하고 창 머리에 "claude gui --resume <id>"를 복사할 수 있게 보인다. 중간(계약 하나, adapter 셋, 창 머리). 추천.
  - adapter가 첫 turn 앞에 그 명령을 글로 쓴 agent message를 하나 낸다. 작음. 대화에 lophn이 만든 글이 섞인다.
closed: |
  별도 창이 없어졌다(계획 harness-gui-tab). GUI는 그 CLI를 친 터미널 탭 안에서 열리고, tracker가 탭의 CLI session id를 안다. 탭 머리 toggle이 같은 session으로 TUI와 오가고, 머리 session menu와 `/resume`이 그 CLI가 이 폴더에서 가진 지난 session을 보이고 같은 탭에서 바꾼다(`open_session`).
guard: 없음
