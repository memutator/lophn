id: hold-missed-turn-after-sleep-runs
title: 컴퓨터가 잠든 사이 놓친 hold job의 차례는 묻지 않고 돈다
kind: bug
status: fixed
topic: job
modules: [packages/core/jobs]
now: |
  `packages/core/jobs/due.ts`의 `turnFor`는 `startup && job.missed_policy === "hold"`일 때만 줄을 `held`로 만든다. lophn이 켜진 채 컴퓨터가 잠들었다 깨면 scheduler timer가 늦게 울려 여러 차례가 한꺼번에 오지만 startup claim이 아니라 `queued`로 바로 돈다(`missed_count`만 남는다).

  더해: scheduler는 다음 차례까지 길어야 1시간(`HOUR_MS`) timer를 걸고 잔다. Linux와 macOS의 timer는 잠든 시간을 세지 않는 시계로 잰다고 보므로(확인 전), 노트북을 연 뒤에도 남은 잠이 지나야 바퀴가 돈다. 13:00에 열면 13:00~14:00 사이에 처리된다.
impact: |
  `hold`를 고른 job(예: 매일 09:00, 놓치면 묻기)이 노트북을 덮어 둔 밤을 지나 낮에 열면 사람에게 묻지 않고 돈다. lophn을 껐다 켠 때와 동작이 다르다.
fix: |
  - 작음: 차례 시각보다 일정 시간 넘게 늦게 처리한 차례는 놓친 차례로 친다. 켤 때와 같이 `hold`면 card, `run`이면 한 번 돈다. 추천.
  - 작음: 지나간 차례가 둘 이상(`count > 1`)일 때만 놓친 차례로 친다. 위 예(매일 09:00, 13:00에 열기)는 count가 1이라 고치지 못한다. 하루 넘게 덮은 때만 잡는다.
  - 작음: 주기의 절반보다 늦으면 놓친 차례로 친다. 매일 job은 12시간 안에 열면 잡지 못한다.
decided: |
  (사람, 2026-10-23. planner 추천): 차례 시각보다 10분 넘게 늦게 처리한 차례는 켤 때와 같이 놓친 차례다. 잠에서 깬 뒤 늦지 않게 바퀴가 돌도록 scheduler의 최대 잠(`HOUR_MS`)을 1분으로 줄인다. 바퀴 한 번은 할 일이 없으면 읽기뿐이라 1분마다 돌아도 싸고, shell에서 깨어남을 알리는 길을 새로 두지 않아도 된다(agent).
closed: |
  `packages/core/jobs/due.ts`의 `turnFor`가 가장 오래된 온 차례(`next_due_at`)보다 10분(`LATE_MS`) 넘게 늦게 처리한 차례를 켤 때와 같이 놓친 차례로 친다. `hold`면 `held` 줄(card), `run`이면 한 번 돈다. scheduler의 최대 잠은 1분(`MAX_SLEEP_MS`)이라 깬 뒤 1분 안에 바퀴가 돈다.
guard: packages/core/jobs/due_test.ts의 test "a turn handled over 10 minutes late counts as missed and hold asks"
