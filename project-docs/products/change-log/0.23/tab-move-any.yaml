id: tab-move-any
version: 0.23.94
title: 어떤 탭이든 다른 workspace로 끌어 옮기고, sidebar의 줄을 화면에 끌어 놓는다
modules: [packages/shell/renderer]
change: |
  - 탭 줄의 탭을 sidebar의 workspace 줄에 놓으면 kind를 가리지 않고(터미널, 파일, browser, Agent 탭 …) 그 workspace로 옮겨 간다. 터미널의 cwd와 PTY, session의 workspace는 그대로다.
  - sidebar의 session·draft·터미널 줄을 화면(탭 줄, 칸, 빈 desk)에 놓으면 그 탭이 이 workspace의 놓은 자리에 선다. 다른 workspace 줄에 놓으면 그 workspace로 간다. 탭 줄과 같은 pointer 끌기라 webview 위에서도 놓인다.
  - 이 컴퓨터의 탭을 다른 기계의 workspace에 둘 수 있다. 탭은 이 컴퓨터의 id를 들고 이 컴퓨터로 그려지며 탭 줄 꼬리표는 This computer다.
why: |
  0.23.94는 Agent 탭만 옮기고 sidebar에서 화면으로 끌 수 없었다. 사람은 탭의 자리만 바꾸는 일에 kind 구분을 원하지 않았다.
decisions:
  - text: >-
      이 컴퓨터를 뜻하는 탭 `machine` 값은 새 표지 대신 이 컴퓨터의 `mch_` id다. 이유: layout schema(`mch_`만 받는다)와 hub(이 컴퓨터 id를 이 컴퓨터로 읽는다)를 바꾸지 않는다.
    by: agent
  - text: >-
      sidebar의 HTML drag를 버리고 탭 줄의 pointer 끌기 하나로 합쳤다. 이유: HTML drag는 webview 위에서 drop을 받지 못한다.
    by: agent
