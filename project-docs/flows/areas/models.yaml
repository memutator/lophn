      - "등록 서버 목록을 읽는다. 못 읽으면 unavailable이다"
      - "요청한 (이름, 소유자)를 등록된 서버에서 찾는다. 없거나 OAuth가 아니면 none이다"
      - "진행 중인 로그인, 마지막 실패, 보관한 token(secrets.json 읽기)이 지금 설정(발급자, URL, client)과 맞는지로 상태를 정한다. 보관을 못 읽거나 설정이 바뀌었으면 none이다"
