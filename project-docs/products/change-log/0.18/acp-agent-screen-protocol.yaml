id: acp-agent-screen-protocol
version: 0.18.0
title: "ACP: agent와 화면 사이의 lophn 규격, 채팅 화면이 그것만 보고 그린다"
modules: [packages/protocol, packages/core/main, packages/core/lophn-agent, packages/shell/main, packages/shell/renderer, packages/design, tools]
checked: [architecture-acp, architecture-agent-chat, architecture-event, architecture-approval, architecture-layers, architecture-run, architecture-artifact, architecture-testing, tool-check, tool-dev, tests-support, skill-ui-design]
change: |
  전: renderer가 session 기록(메시지, turn, tool call, rewind)을 제 나름대로 읽어 대화를 만들었다. tool 이름(`ask`, `call.send`, `file.write`, `file.edit`, `release.activate`)과 tool JSON으로 줄 종류를 가르고, snapshot과 event를 시각으로 합쳐 turn이 끝난 뒤 줄이 튀었다. 승인 결과는 event 길에만 있어 다시 읽으면 사라졌다. 화면의 대화 조작은 route 여럿을 따로 불렀다.
  후:
  - ACP는 `packages/protocol/acp/`다: 상태 `AcpState`(항목, turn, 대기, 묻기, 쓰는 중인 글), 갱신 `AcpUpdate`, 입력 `AcpInput`, 순수 reducer `reduceAcp`. 항목은 message, tool(`edit`, `call`, `question`, `consent`, `generic`), approval, notice, hidden이고 순서는 session 안의 순번 `seq`다. message 본문은 content block이다(`project-docs/architecture/acp.md`).
  - core가 만든다. route `AcpSnapshot`이 기록에서 상태를 만들고, acp wiring이 agent event를 `acpUpdatesOf`(`packages/protocol/events/acp-project.ts`)로 바꿔 남지 않는 event `AcpUpdated`로 낸다. 순번과 승인 결과는 새 schema step `acp.items.tables`의 `acp_items`에 남는다. 순번이 없는 옛 기록은 snapshot을 처음 읽을 때 시각 순서로 받는다. ACP로 나가는 글은 모두 지금의 redaction을 거친다. harness가 주체인 승인 물음은 대화에 오지 않는다.
  - 채팅 화면은 `AcpSnapshot`과 `AcpUpdated`만 읽고 `reduceAcp`로 접는다. 줄 모양(tool 묶기)만 renderer `thread-layout.ts`에 남았다. 옛 해석 code(`readThread`, `foldEvent`, `foldDelta`, 이름으로 tool 가르기, 시각 merge)와 session snapshot의 `writing`·`steering`·`elapsed` 칸을 지웠다.
  - 화면의 대화 조작(보내기, 멈추기, 다시 하기, 질문 답, 승인 결정, 대기 고치기)은 memory route `AcpSend` 하나로 가고 core가 지금 route로 나눈다. 권한은 부른 쪽 자격으로 그 route가 본다. 다시 하기의 메시지 만들기는 core로 옮겼다.
  - `MessageReceived.body`가 content block이 되었다.
why: |
  사람이 "지금은 renderer가 다 알아서 그리는 게 아니라 그런 lophn acp protocol이 정립되어 있으면 third-party-cli에다 gui를 덮어씌우기도 쉽다"고 했다(`project-docs/products/roadmap/agent-platform.md` 단계 4). 앱 화면(단계 5)과 third-party CLI GUI(단계 8)가 같은 규격을 쓴다.
decisions:
  - text: |
      ACP는 lophn 자체 규격이고 표준 Agent Client Protocol이 아니다.
    by: person
  - text: |
      항목 순서는 저장한 session 순번이다. 시각 merge를 지웠다. 순번이 빠지면 reducer가 `reread`를 세워 화면이 snapshot을 다시 읽는다.
    by: agent
  - text: |
      `acpUpdatesOf`는 순수 projection이고 event에 없는 것(순번, tool 종류, 질문, 보낸 agent, 승인 결정)은 core가 context로 준다. reducer와 projection을 protocol에 둔 것은 core, 화면, 뒤의 third-party GUI가 같은 접기를 쓰게 하려는 것이다.
    by: agent
  - text: |
      저장된 agent message의 본문을 갱신에 실어 turn이 끝날 때 다시 읽지 않는다.
    by: agent
  - text: |
      `app_card` part는 message 항목의 `cards`로 낸다. harness의 `harness_tool` part는 text block 하나다.
    by: agent
  - text: |
      `AcpSend`는 core 안 machine 자격으로 대신 부르지 않는다. 대신 부르면 그 route 권한이 없는 호출자도 보낼 수 있게 된다.
    by: agent
follow_up: |
  - 도는 tool은 끝나서 edit·call·질문 줄이 될 것이라도 끝날 때까지 일반 tool 줄로 보인다. 실패하거나 거절된 편집·call도 일반 tool 줄이다(전에는 줄이 없었다).
  - 대기 목록(waiting store)은 아직 `turn_requests/decide`, `ask/answer`를 바로 부른다. 대화 화면이 아니라 두었다.
  - 화면을 사람이 띄워 본 확인은 아직 없다(check, core 기동, renderer build, e2e만 지났다).
