    title: "되돌리기가 막혔다가 남는 영향을 알고 나머지를 되돌린다"
    actor: person
    goal: "미리 본 뒤 파일이 바뀌어 되돌리기가 막히면, 사람이 건너뛸 항목과 남는 영향을 알고 허락해 나머지를 되돌린다"
    steps:
      - {do: "고른 시점의 복원 목록을 미리 본다", screen: new-agent-rewind, flow: session-rewind-preview:ok}
      - {do: "되돌리기를 누르면 미리 본 것과 달라 막힌다", screen: new-agent-rewind, flow: session-rewind-apply:blocked}
      - {do: "건너뛸 항목과 남는 영향을 알고 나머지를 되돌리기로 허락한다", screen: new-agent-rewind, flow: session-rewind-apply:applied-partial}
      - {do: "사람이 그사이 고친 파일은 skipped로 고친다", flow: revert-install-amend:amended}

  - id: session-rewind-with-app
    title: "되돌리기에서 고른 앱의 data도 함께 되돌린다"
    actor: person
    goal: "사람이 되돌리기에서 앱을 고르면 대화와 파일을 되돌린 뒤 그 앱의 data 되돌리기를 청하고 결과를 남긴다"
    steps:
      - {do: "되돌리기 메뉴에서 앱을 고른다", screen: new-agent-rewind, flow: session-rewind-preview:ok}
      - {do: "Rewind를 확인한다", screen: new-agent-rewind, flow: session-rewind-apply:applied}
      - {do: "앱이 고른 시점 직전으로 돌아갔는지 결과를 남긴다", screen: new-app-rewind-done, flow: revert-apps-record:recorded}

  - id: session-rewind-turn-running
    title: "도는 turn이 있으면 되돌리기가 막혀 멈춘 뒤 다시 한다"
    actor: person
    goal: "session에 도는 turn이 있으면 되돌리기는 conflict로 막히고, 사람이 turn을 멈춘 뒤 다시 되돌린다"
    steps:
      - {do: "도는 turn이 있는 채 되돌리기를 확인한다", screen: new-agent-rewind, flow: session-rewind-apply:turn-running}
      - {do: "도는 turn을 Stop으로 멈춘다", screen: new-agent-conversation, flow: turn-stop:stopped}
      - {do: "되돌리기를 다시 확인한다", screen: new-agent-rewind, flow: session-rewind-apply:applied}

  - id: session-rewind-summarize
    title: "여기서부터 요약을 요청하고 요약으로 그 구간을 접는다"
    actor: person
    goal: "사람이 한 시점을 골라 요약을 요청하면 runtime이 요약 call을 하고, 완료된 요약으로 그 구간을 접는다"
    steps:
      - {do: "메시지에서 여기서부터 요약을 요청한다", screen: new-agent-rewind, flow: rewind-summary-request:requested}
      - {do: "runtime이 요약 요청을 가져간다", flow: rewind-summary-take:taken}
      - {do: "runtime이 요약 call을 끝내 결과를 돌려준다", flow: rewind-summary-done:summarized}
      - {do: "요약 요청의 상태를 읽어 완료를 확인한다", flow: rewind-summary-state:summarized}
      - {do: "요약 되돌리기로 그 구간을 접는다", screen: new-agent-rewind, flow: session-rewind-apply:applied}

  - id: session-delete-with-rewind
    title: "session을 지우면 되돌리기 기록과 저장물도 지워진다"
    actor: person
    goal: "사람이 session을 지우면 그 session의 되돌리기 기록과 저장물이 함께 지워진다"
    steps:
      - {do: "session을 지운다", screen: new-agent-sessions-edit, flow: session-delete:ok}
      - {do: "그 session의 되돌리기 기록과 저장물을 지운다", flow: rewind-records-erase:erased}

  # ---- workflow ----

  - id: workflow-define-flow
    title: "agent가 flow workflow의 flow.ts를 쓰고 type check를 통과시킨다"
    actor: agent
    goal: "project의 agent가 write-workflow 지침을 읽고 workflow 폴더에 flow.ts를 쓰고, 실행 없이 type check를 통과시킨다"
    refs: [C29]
    steps:
      - {do: "write-workflow skill을 읽는다", flow: skill-write-workflow:loaded}
      - {do: "flow.ts를 쓴다", flow: tool-file-write:created}
      - {do: "실행 없이 type check를 돌린다", flow: workflow-check:has-errors}
      - {do: "오류를 고쳐 flow.ts 전체를 다시 쓴다", flow: tool-file-write:overwritten}
      - {do: "type check를 다시 돌려 통과한다", flow: workflow-check:passed}
      - {do: "사람이 Workflows 목록에서 시작할 수 있는지 본다", screen: new-sidebar-workflows, flow: workflow-list:ok}
    gaps:
      - "agent kind workflow(workflow.yaml과 workflow.md)를 쓴 뒤 선언을 검사하는 flow는 없다. workflow.check는 flow.ts만 본다"

  - id: workflow-start-agent
    title: "사람이 agent workflow를 시작하고 참가자들이 step을 넘긴다"
    actor: person
    goal: "사람이 agent workflow를 시작하면 첫 step이 담당 agent에게 넘어가고, 참가자의 report가 다음 step으로 이어져 끝난다"
    refs: [H7, W1, E9]
    steps:
      - {do: "Workflows 목록에서 workflow를 고른다", screen: new-sidebar-workflows, flow: workflow-list:ok}
      - {do: "입력 글을 적고 Start를 누른다", screen: workflow-start-dialog, flow: workflow-start-agent:handed}
      - {do: "instance 탭에서 진행을 읽는다", screen: workflow-tab-running, flow: workflow-instance-read:ok}
      - {do: "참가자가 report하고 다음 step으로 넘긴다", screen: workflow-tab-running, flow: workflow-report:handed}
      - {do: "마지막 참가자가 next를 end로 report한다", screen: workflow-tab-ended, flow: workflow-report:ended}

  - id: workflow-step-to-human
    title: "사람 step에서 with agent와 논의하면 agent가 결과를 report한다"
    actor: agent
    goal: "참가자가 사람 step으로 넘기면 with agent의 session에 step 메시지가 가고, 사람이 그 agent와 논의한 뒤 agent가 결과를 report한다"
    refs: [H8, W1, E9]
    steps:
      - {do: "참가자가 report하며 사람 step으로 넘긴다", screen: workflow-tab-human-turn, flow: workflow-report:handed}
      - {do: "사람이 with agent의 session에 글을 보낸다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "with agent가 결과를 report하고 다음 step으로 넘긴다", flow: workflow-report:handed}

  - id: workflow-start-not-handed
    title: "첫 step 담당을 풀지 못하면 참가자가 같은 step을 다시 넘긴다"
    actor: person
    goal: "workflow 시작 때 step 담당을 풀지 못하면 instance는 running으로 남고, 줄의 이유를 보고 참가자가 hand_now로 다시 넘긴다"
    refs: [E9, W5]
    steps:
      - {do: "Start를 누른다", screen: workflow-start-dialog, flow: workflow-start-agent:not-handed}
      - {do: "참가자가 hand_now로 같은 step을 다시 넘긴다", screen: workflow-tab-not-handed, flow: workflow-edit:handed}

  - id: workflow-participant-edit
    title: "참가자가 instance의 step을 고쳐 지금 넘긴다"
    actor: agent
    goal: "예외가 생기면 참가자가 workflow.edit로 step을 고치고, 누가 고쳤는지 줄로 남으며, 지금 넘길 수 있다"
    refs: [W3]
    steps:
      - {do: "참가자가 instance의 step을 더하거나 고친다", flow: workflow-edit:edited}
      - {do: "고친 step을 담당에게 지금 넘긴다", flow: workflow-edit:handed}

  - id: workflow-restart-step-lost
    title: "lophn이 다시 켜져 넘긴 step이 끊기면 다시 넘긴다"
    actor: person
    goal: "lophn을 다시 켜면 도는 step은 lophn_restarted 줄로 남고 자동으로 다시 넣지 않으며, 사람이나 참가자가 확인해 hand_now로 다시 넘긴다"
    refs: [W5]
    steps:
      - {do: "lophn을 다시 켠다", flow: workflow-restart:step-lost}
      - {do: "끊긴 step을 확인하고 지금 넘긴다", screen: workflow-tab-restarted, flow: workflow-edit:handed}

  - id: workflow-stop-late-report
    title: "사람이 instance를 멈추면 뒤늦은 report는 줄만 남는다"
    actor: person
    goal: "사람이 Stop으로 instance를 멈추고, 멈춘 뒤 도착한 참가자의 report는 줄로만 남고 instance는 다시 running이 되지 않는다"
    refs: [H7]
    steps:
      - {do: "도는 instance의 Stop을 누른다", screen: workflow-tab-stopped, flow: workflow-stop:stopped}
      - {do: "멈춘 뒤 참가자의 report가 도착한다", flow: workflow-report:after-stop}

  - id: workflow-flow-kind-run
    title: "flow workflow를 시작하면 code가 agent와 앱 tool을 부르고 report로 끝낸다"
    actor: person
    goal: "사람이 flow workflow를 시작하면 flow.ts 프로그램이 agent run과 앱 tool 호출을 하고, report를 남긴 뒤 끝난다"
    refs: [E11, W6, R8]
    steps:
      - {do: "입력 글을 적고 flow workflow를 Start한다", screen: workflow-start-dialog-flow, flow: workflow-start-flow:running}
      - {do: "flow code가 agent(...)로 run을 열고 답을 받는다", flow: workflow-flow-agent-run:answered}
      - {do: "flow code가 앱 tool을 부르고 할당 판정을 통과한다", flow: app-call-assignment-judge:passed}
      - {do: "flow code가 tool(...) 결과를 받는다", flow: workflow-flow-tool-run:answered}
      - {do: "flow code가 report를 next end로 남겨 끝낸다", screen: workflow-tab-flow, flow: workflow-flow-report:ended}
      - {do: "끝난 뒤 program의 끝 code가 줄로 남는다", flow: workflow-flow-exit:after-stop}

  - id: workflow-flow-program-crash
    title: "flow program이 오류로 끝나면 instance가 ended로 닫힌다"
    actor: person
    goal: "flow program이 report를 남긴 뒤 오류로 끝나면 instance는 ended로 닫히고, 끝 code와 stderr 끝 줄이 화면에 남는다"
    refs: [E11]
    steps:
      - {do: "flow workflow를 Start한다", screen: workflow-start-dialog-flow, flow: workflow-start-flow:running}
      - {do: "flow code가 report를 next 없이 남긴다", flow: workflow-flow-report:recorded}
      - {do: "program이 오류로 끝나 instance가 ended로 닫힌다", screen: workflow-tab-flow-exited, flow: workflow-flow-exit:ended}

  - id: workflow-flow-missing-file
    title: "flow.ts가 없으면 시작이 막히고 agent가 쓴 뒤 시작한다"
    actor: person
    goal: "flow.ts가 없는 flow workflow는 시작이 conflict로 막히고, agent가 flow.ts를 쓰고 통과시킨 뒤 다시 시작한다"
    refs: [C29, E11]
    steps:
      - {do: "flow workflow를 Start한다", screen: workflow-tab-flow-missing, flow: workflow-start-flow:conflict}
      - {do: "agent가 flow.ts를 쓴다", flow: tool-file-write:created}
      - {do: "agent가 type check를 통과시킨다", flow: workflow-check:passed}
      - {do: "다시 Start한다", screen: workflow-start-dialog-flow, flow: workflow-start-flow:running}

  - id: workflow-flow-restart-closed
    title: "flow가 도는 중 lophn이 다시 켜지면 flow는 닫힌 채 다시 뜨지 않는다"
    actor: person
    goal: "flow가 도는 중에 lophn이 꺼졌다 켜지면 instance는 flow-closed로 닫히고 program은 다시 띄우지 않는다"
    refs: [W6]
    steps:
      - {do: "lophn을 다시 켠다", screen: workflow-tab-flow-restarted, flow: workflow-restart:flow-closed}

  - id: workflow-flow-tool-denied
    title: "flow code가 다른 workspace의 비공개 앱 command를 부르면 막힌다"
    actor: person
    goal: "flow code가 비공개 command를 다른 workspace에서 부르면 판정에서 막히고, tool run이 실패로 끝나 code가 그 실패를 받는다"
    refs: [E11, J4]
    steps:
      - {do: "flow workflow를 Start한다", screen: workflow-start-dialog-flow, flow: workflow-start-flow:running}
      - {do: "flow code가 다른 workspace의 비공개 command를 부른다", flow: app-call-assignment-judge:gate-blocked}
      - {do: "tool run이 failed로 끝나 code가 실패를 받는다", flow: workflow-flow-tool-run:run-failed}

  # ---- job ----

  - id: job-create-approve
    title: "agent가 만든 job을 사람이 승인하고 첫 차례가 돈다"
    actor: agent
    goal: "agent가 정해진 때 할 일을 job으로 만들고, 사람이 대기 목록에서 승인하면 첫 차례가 돌아 run이 끝나고 기록이 남는다"
    refs: [J1, J2, H9, E10]
    steps:
      - {do: "agent가 job.create로 할 일과 주기를 청한다", flow: job-create:created}
      - {do: "agent가 job.list로 자기가 만든 job을 확인한다", flow: job-list:ok}
      - {do: "사람이 job 등록 승인 card에서 Approve를 누른다", screen: waiting-job-approval, flow: job-approve:approved}
      - {do: "차례 시각이 되어 queued 줄이 생긴다", flow: job-claim-due:queued}
      - {do: "타이머가 run을 시작하고 job run 줄이 running이 된다", flow: job-timer:started}
      - {do: "run이 끝나 job run 줄이 done으로 닫힌다", flow: job-run-end:done}
      - {do: "사람이 Jobs 탭에서 job 기록을 읽는다", screen: jobs-tab-history, flow: job-run-list:ok}

  - id: job-approval-rejected
    title: "사람이 agent가 만든 job 등록을 거절하면 job이 지워진다"
    actor: agent
    goal: "agent가 청한 job을 사람이 등록 승인에서 거절하면 job이 지워지고 차례는 돌지 않는다"
    refs: [J1, H9]
    steps:
      - {do: "agent가 job.create로 job을 청한다", flow: job-create:created}
      - {do: "사람이 Reject를 누른다", screen: waiting-job-approval, flow: job-approve:rejected}

  - id: job-agent-edit-delete
    title: "agent가 자기가 만든 job을 고치고 지운다"
    actor: agent
    goal: "agent가 자기 job의 주기와 놓친 차례 정책을 고치고 지우며, 다른 agent가 만든 job은 찾지 못한다"
    refs: [J2]
    steps:
      - {do: "agent가 job.update로 주기와 놓친 차례 정책을 고친다", flow: job-update:updated}
      - {do: "다른 agent가 만든 job을 고치려 하면 찾지 못한다", flow: job-update:not_found}
      - {do: "agent가 job.delete로 자기 job을 지운다", flow: job-delete:deleted}

  - id: job-missed-hold-start-now
    title: "꺼진 사이 놓친 차례를 hold card에서 지금 돌린다"
    actor: person
    goal: "lophn이 꺼진 사이 놓친 job 차례는 hold card로 대기 목록에 남고, 사람이 Start now를 누르면 다음 바퀴에 run이 돈다"
    refs: [J3, E10, H9]
    steps:
      - {do: "lophn을 켠다. 꺼진 사이의 차례를 놓친 차례로 센다", flow: job-startup:missed-counted}
      - {do: "hold 정책의 놓친 차례가 대기 목록에 card로 뜬다", screen: waiting-job-hold-list, flow: job-claim-due:held}
      - {do: "대기 목록을 읽어 card와 hold 줄을 맞춘다", screen: waiting-job-hold-list, flow: job-waiting-read:ok}
      - {do: "사람이 Start now를 누른다", screen: waiting-job-hold-list, flow: job-hold-decide:run-now}
      - {do: "다음 바퀴에서 타이머가 run을 시작한다", flow: job-timer:started}
      - {do: "run이 끝나 job run 줄이 닫힌다", flow: job-run-end:done}

  - id: job-missed-hold-skip
    title: "놓친 차례를 hold card에서 건너뛴다"
    actor: person
    goal: "hold card에서 Skip을 고르면 놓친 차례는 사람이 건너뛴 것으로 닫히고 run은 돌지 않는다"
    refs: [H9, E10]
    steps:
      - {do: "놓친 차례가 hold card로 대기 목록에 뜬다", screen: waiting-job-hold-list, flow: job-claim-due:held}
      - {do: "Skip을 누른다", screen: waiting-job-hold-list, flow: job-hold-decide:skipped}

  - id: job-hold-start-blocked
    title: "앞 차례가 아직 돌면 Start now가 막히고 Skip으로 정한다"
    actor: person
    goal: "같은 job이 아직 도는 중이면 Start now는 conflict로 막히고 card는 남으며, 사람이 Skip으로 정한다"
    refs: [H9]
    steps:
      - {do: "놓친 차례가 hold card로 대기 목록에 뜬다", screen: waiting-job-hold-list, flow: job-claim-due:held}
      - {do: "앞 차례가 아직 도는 채 Start now를 누른다", screen: waiting-job-hold-conflict, flow: job-hold-decide:conflict}
      - {do: "Skip으로 정한다", screen: waiting-job-hold-conflict, flow: job-hold-decide:skipped}

  - id: job-timer-start-failed
    title: "job 차례를 시작하지 못하면 실패로 남고 자동으로 다시 하지 않는다"
    actor: person
    goal: "job 차례의 run을 시작하지 못하면 job run은 failed와 이유로 닫히고, 자동으로 다시 하지 않는다"
    refs: [J6, E10]
    steps:
      - {do: "job 차례가 queued 줄이 된다", flow: job-claim-due:queued}
      - {do: "타이머가 run을 시작하지 못한다", flow: job-timer:failed}
      - {do: "job run 줄이 failed와 이유로 닫힌다", screen: jobs-tab-history, flow: job-run-ended:failed}

  - id: job-restart-interrupted
    title: "job run이 도는 중에 lophn이 꺼졌다 켜지면 interrupted로 닫힌다"
    actor: person
    goal: "lophn이 꺼지며 돌던 job run은 켤 때 interrupted로 닫히고, 꺼진 사이의 차례는 run 정책이면 한 번 돈다"
    refs: [J6]
    steps:
      - {do: "lophn을 다시 켠다", flow: job-startup:interrupted}
      - {do: "놓친 차례가 run 정책이라 한 번 돌도록 줄이 생긴다", flow: job-claim-due:queued}
      - {do: "타이머가 run을 시작한다", flow: job-timer:started}

  - id: job-tool-run-done
    title: "job이 앱 tool을 부르는 차례가 돌아 기록이 닫힌다"
    actor: person
    goal: "정해진 때 job이 앱 tool을 run으로 부르면 호출이 끝나 tool run이 done이 되고, job run 줄이 done으로 닫힌다"
    refs: [E10, J4]
    steps:
      - {do: "job 차례가 queued 줄이 된다", flow: job-claim-due:queued}
      - {do: "타이머가 앱 tool run을 시작한다", flow: job-timer:started}
      - {do: "앱 호출이 끝나 tool run이 done으로 닫힌다", flow: run-tool-end:done}
      - {do: "job run 줄이 done으로 닫힌다", flow: job-run-end:done}
    gaps:
      - "J4는 job이 앱 tool을 부르는 차례가 만든 agent의 지금 할당 안에서만 된다고 적지만, approvals의 app-call-assignment-judge는 program(job)의 호출을 판정하지 않는다고 적는다. 어느 쪽이 맞는지 정해야 한다(job 차례가 할당 밖 tool을 막는 flow가 없다)"

  # ---- run (화면 없는 agent 호출, 앱 tool 호출) ----

  - id: run-agent-person
    title: "사람이 agent에게 run을 시키고 결과를 기다려 읽는다"
    actor: person
    goal: "사람이 입력 글과 출력 schema로 agent run을 시작하면, 입력은 사람 없는 turn으로 돌고 답은 run 기록에 남는다"
    refs: [R7]
    steps:
      - {do: "입력 글과 출력 schema를 적어 agent run을 시작한다", flow: run-agent-start:running}
      - {do: "입력을 사람 없는 turn(unattended)으로 정한다", flow: turn-mode-decide:unattended}
      - {do: "입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "agent가 일을 끝낸다", flow: turn-loop:completed}
      - {do: "run이 끝나 답이 run 기록에 남는다", flow: run-agent-end:done}
      - {do: "사람이 run을 기다려 결과를 읽는다", flow: run-wait:finished}
    gaps:
      - "사람이 agent run을 시작하는 화면 frame이 없다(new-app-runs의 Logs는 앱 쪽 run을 보여 줄 뿐이다). route와 CLI로만 보인다"

  - id: run-agent-invalid-output
    title: "run의 답이 출력 schema에 맞지 않으면 invalid_output으로 닫힌다"
    actor: person
    goal: "출력 schema가 있는 run의 답이 JSON이 아니거나 schema에 맞지 않으면 run은 failed(invalid_output)로 닫힌다"
    refs: [R7]
    steps:
      - {do: "schema를 적어 agent run을 시작한다", flow: run-agent-start:running}
      - {do: "agent가 일을 끝낸다", flow: turn-loop:completed}
      - {do: "답이 schema에 맞지 않아 run이 invalid_output으로 닫힌다", flow: run-agent-end:invalid-output}
      - {do: "사람이 run 기록을 읽는다", flow: run-read:ok}

  - id: run-tool-person
    title: "사람이 앱 tool을 run으로 시작하고 결과 기록을 읽는다"
    actor: person
    goal: "사람이 앱 tool 호출을 run으로 시작하면 기다리지 않고 run 기록을 돌려받고, 호출이 끝나면 run이 done으로 닫힌다"
    steps:
      - {do: "앱 tool을 run으로 시작한다", screen: new-app-runs, flow: run-tool-start:running}
      - {do: "앱 호출이 끝나 run이 done으로 닫힌다", flow: run-tool-end:done}
      - {do: "Logs에서 run 기록을 읽는다", screen: new-app-runs, flow: run-read:ok}

  - id: run-cancel-person
    title: "사람이 실행 중인 agent run을 취소한다"
    actor: person
    goal: "사람이 실행 중인 agent run을 취소하면 run이 cancelled로 닫히고, 이미 가져간 입력의 turn이 멈춘다"
    steps:
      - {do: "agent run을 시작한다", flow: run-agent-start:running}
      - {do: "Logs에서 run을 취소한다", screen: new-app-runs, flow: run-cancel:cancelled}
      - {do: "이미 가져간 입력의 turn이 멈춘다", flow: turn-stop:stopped}

  - id: run-tool-lost-on-restart
    title: "앱 tool run이 도는 중 lophn이 꺼지면 run은 lophn_restarted로 닫힌다"
    actor: person
    goal: "앱 tool 호출 run이 도는 중에 lophn이 꺼졌다 켜지면 호출 결과를 알 수 없어 run은 다시 넣지 않고 닫힌다"
    refs: [J6]
    steps:
      - {do: "앱 tool을 run으로 시작한다", screen: new-app-runs, flow: run-tool-start:running}
      - {do: "lophn을 다시 켠다", flow: run-restart:tool-lost}
      - {do: "Logs에서 닫힌 run을 읽는다", screen: new-app-runs, flow: run-read:ok}

  - id: run-agent-unattended-ask
    title: "사람이 없는 run 안의 ask는 기다리지 않고 unattended를 받는다"
    actor: person
    goal: "사람이 없는 run의 agent가 ask를 부르면 질문을 열지 않고 unattended를 받아 스스로 정하고, run이 done으로 닫힌다"
    refs: [W4, T4, R7]
    steps:
      - {do: "입력을 사람 없는 run으로 시작한다", flow: run-agent-start:running}
      - {do: "agent가 ask를 부르지만 묻지 않고 unattended를 받는다", flow: ask-unattended-returns:unattended}
      - {do: "agent가 unattended 결과를 tool 결과로 받는다", flow: tool-ask:unattended}
      - {do: "agent가 일을 끝내고 run이 done으로 닫힌다", flow: run-agent-end:done}

  - id: run-session-archived
    title: "run이 연 session을 archive하면 run이 session_ended로 닫힌다"
    actor: person
    goal: "run이 도는 중에 사람이 그 session을 archive하면 run은 session_ended로 닫힌다"
    steps:
      - {do: "agent run을 시작한다", flow: run-agent-start:running}
      - {do: "run이 연 session을 archive한다", flow: session-archive:ok}
      - {do: "run이 session_ended로 닫힌다", flow: run-session-end:session-ended}

  # ---- 사람 결정 참조 (provider 연결 끊기 확인) ----

  - id: provider-disconnect-confirmed
    title: "사람이 provider 연결 끊기를 확인 창에서 결정한다"
    actor: person
    goal: "사람이 연결 끊기를 누르고 확인 창에서 결정하면, 1회용 결정 참조가 발급되고 끊기 요청이 그것을 한 번 소비한다"
    steps:
      - {do: "Settings › Providers에서 끊기를 누르면 확인 창이 1회용 결정 참조를 발급받는다", screen: new-settings-providers, flow: decision-handle-issue:issued}
      - {do: "끊기 요청이 결정 참조를 한 번 소비하고 연결을 끊는다", screen: new-settings-providers, flow: decision-handle-consume:consumed}
