id: app-folder-sync
version: 0.23.72
title: 앱 data, release, source, 기계 기록이 바깥 도구가 옮기는 폴더를 거쳐 사람의 여러 컴퓨터 사이를 간다
modules: [packages/core/folder, packages/protocol/folder, packages/protocol/apps/sync, packages/protocol, packages/core/apps, packages/core/apps/sync, packages/core/main, packages/core/storage, packages/core/approvals, packages/core/config, packages/core/agent-workspaces, packages/cli, packages/sdk, packages/design, packages/shell/main, packages/shell/renderer, packages/mobile, tests]
change: |
  - 선언: 앱 선언 칸 `sync_to: "<destination 이름>"`(`@lophn/declaration` 4.9.0, 그 판을 고정하는 `@lophn/app-ui` 2.18.0·`@lophn/app-ui-native` 1.4.0). 있으면 그 앱은 `runs_on`이 `["computer"]`여도 컴퓨터에서 sync 앱이고(clock 표, sync log), release 준비가 폰 앱과 같은 schema 규칙과 `@lophn/cap-store` 2.0.0 하한을 본다. `runs_on: ["phone"]`은 `sync_to`를 쓰지 못한다. `supported_from`은 그대로다. template 앱과 시험 앱의 pin이 새 판이다. 화면 없는 `["computer"]` 앱(tool만)도 준비된다.
  - 설정 `folder.destinations`(기계마다, `{ "<이름>": { "path": "<절대 경로>" } }`, 16개까지): 상대 경로, data root와 겹치는 경로, 다른 이름과 겹치는 경로는 거절한다. 설정 선언에 `approval: "person"`과 `describe(before, after)`가 생겼다: agent가 그 key를 바꾸면 설정 route가 그 agent의 `lophn settings` tool call로 `tool_gate/check`에 `{kind: "setting", key, lines}`를 묻고, attended·skip turn은 승인 카드(대화, 대기 목록, 폰. 제목 "Change a lophn setting", 줄 예 `Add sync folder "personal": /home/me/Sync/lophn`, 선택은 once·reject)를 열고 unattended turn과 팀 자식은 `deny no_person`이다. 허락은 물은 그 값 한 번이고 그 밖은 `rejected` `needs_approval`(CLI는 `forbidden`)이다. 사람의 쓰기는 그대로다. ACP 승인 subject가 넓어져 `@lophn/agent` 1.14.0이다.
  - 폴더: destination 아래 `machines/<mch>/`에 기계 기록 `record.json`, 앱마다 `app.json`, data stream `data/<n>.changes|snapshot`(checksum 줄, header 줄, payload), 봉인 bundle `releases/<hash>/files/`와 `release.json`(8 MiB까지), 증분 git bundle `source/<n>.bundle`과 `<n>.json`. 기계는 자기 하위 폴더에만 쓰고(temp와 rename, 번호 file은 다시 쓰지 않음) 남의 것은 이름 꼴이 맞는 file만 읽는다.
  - 내보내기: sync log의 변경을 changes file로(1,000개·16 MiB까지), 첫 file·release가 바뀐 뒤·bytes로 못 남은 자기 write는 snapshot으로, 30일 compaction. 다른 기계에서 온 변경과 그런 일의 '다시 snapshot' 줄은 내보내지 않는다. 자기 하위 폴더의 남의 file을 보면 멈춘다(`foreign_writer`, `app.sync_resume`). 앱 기록이 `settled`와 `horizon`을 싣는다.
  - 읽기: 다른 기계 기록 사본(`folder_records`), (앱, 출처)마다 cursor(`folder_reads`), 전부 검사 뒤 file 하나를 앱 DB transaction 하나로 적용(변경마다 invocation, caller `person` + `machine`), 다른 release의 file은 `<data root>/folder-held/`에 복사하고 `folder_held`에 적음, 큰 번호의 snapshot으로 따라잡기(덮지 않고 row·칸 clock으로 합침, invocation `lophn.snapshot_merge`), 받는 쪽 시각 + 5분보다 앞선 clock의 changes file은 미룸(`clock_ahead`, 어느 기계가 몇 분 앞섰는지).
  - 흔적 정리와 horizon(90일): 앱 release마다 core가 뜬 뒤와 하루에 한 번 `max(min(알려진 기계와 자기의 settled), now − 90일)`보다 옛 흔적만 지운다. horizon 밖의 기계는 내보내지 않은 자기 변경 가운데 그 이하 clock을 sync log에서 `held`로 바꾸고, 풀리지 않은 자기 held가 있는 동안 snapshot을 쓰지 않는다(필요하면 `away_too_long`으로 멈춤). 받는 쪽도 정리된 흔적과 부딪을 수 있는 변경을 held로 둔다. 알림 kind `app_sync_away`(떨어져 있음, 따라잡으면 같은 줄을 "caught up"과 남은 수로). `apps/sync_held` list·apply(이 기계가 낸 변경은 지금 값을 새 clock으로 찍어 보냄, 받은 변경은 다시 적용)·discard.
  - sync engine: delete는 자기보다 옛 것만 지우고 delete보다 새 칸 값은 숨은 표 `lophn_sync_kept`에 남는다. snapshot 합치기, 흔적 정리, horizon과 그물이 sync core에 더해졌다. 앱 process control `sync_apply`, `snapshot_merge`, `sync_cleanup`, `sync_reapply`.
  - take-in: route `apps/take_in`(command `app.take_in`, CLI `lophn app take-in <app> [--from] [--release]`)이 같은 app id로 등록하고(id를 고를 수 있는 것은 폴더 take-in 자격 하나) 봉인 bundle을 검사·설치해 prepared release(`created_by` machine)로 둔다. 이미 들인 앱은 release만. 활성화는 그 기계의 `release.activate`이고 동의를 그 기계에서 묻는다. `conflict`의 `details.reason`은 `sdk_missing`·`slug_in_use`·`dependency_missing`, 덜 온 release는 `invalid_input` `release_incomplete`.
  - 읽기 명령 route `machine/environment`와 CLI `lophn machine environment`(home·app workspace): 이 기계, 알려진 기계(이름이 겹치면 `이름 (id 끝 6자)`, `always_on`, 주소, 판), destination 상태, 앱마다 export·imports(`owes_absent_pass` 포함)·away, 들일 수 있는 앱, 뒤 계획의 section(`ctx.folderEnvironment.register`, 2초). `machine/forget`(사람, `lophn machine forget`), `apps/sync_held`(`lophn app sync-held <app> list|apply|discard [seq]`), `apps/sync_resume`(`lophn app sync-resume`). `app_sync/pull`의 `origin`에 `machine`.
  - 계기: 내보내기는 sync log가 바뀐 뒤 5초 debounce와 5분 timer, 읽기는 폴더마다 감시(2초 debounce)와 2분 timer. (앱, destination)·(앱, 출처)마다 한 번에 하나, 64 MiB, 실패는 1분부터 두 배씩 1시간까지 물러남.
  - ledger schema step `apps.sync-log.machine`(sync log 다시 만들기, seq 유지: origin `machine`, 칸 `machine`, kind `held`, 칸 `resolved_at`)과 `folder.tables`(`folder_streams`, `folder_written`, `folder_reads`, `folder_held`, `folder_records`). data step은 없다.
  - 지침: 내장 skill `design-app`의 `folder-sync.md`(정책 고르기, 승인 전에 설명하기, destination, 바깥 도구와 암호화, 떨어져 있었을 때, 한계)와 SKILL.md 한 줄, template `AGENTS.md.tmpl`.
why: |
  사람이 한 앱을 집 PC, 회사 PC, 미니 PC에서 같이 쓰려면 data가 기계 사이를 가야 한다(roadmap `multi-machine` 줄 2). 컴퓨터끼리는 hub가 없고, 사람마다 쓰는 저장소가 다르며, 폴더를 옮기는 도구는 반쯤 옮기고 충돌 사본을 만든다. 그래서 lophn은 자기 하위 폴더에만 쓰고 읽은 것은 다 검사한 뒤 칸 단위로 합치며, 저장소 연결은 사람마다 agent가 지침대로 붙이는 바깥 도구에 맡긴다.
decisions:
  - text: |-
      앱 data의 길은 앱마다 선언하고 앱을 짓는 agent가 사람의 환경과 memory로 고른다.
    by: person
  - text: |-
      보관소 연결은 제품 기능이 아니다. lophn은 폴더에 쓰고 읽기만 하고 바깥 도구의 이름이 code·의존성·설정에 없다. 대가로 실시간이 아니다.
    by: person
  - text: |-
      lophn이 cloud API를 부르는 길은 보류하고, 변경 file은 폴더든 API든 같은 bytes다.
    by: person
  - text: |-
      선언 칸은 `sync_to` 하나다(값은 이름뿐이라 경로가 다른 기계에서도 같은 선언이 맞는다). `runs_on ["phone"]`은 쓰지 못한다. `sync_to` 앱은 컴퓨터에서 sync 앱이라 정수 PK를 쓰지 못한다(두 기계가 같은 정수 id를 만들면 row를 잃는다).
    by: agent
  - text: |-
      destination은 기계마다의 설정이고 바꾸기는 사람의 승인이다. agent는 요청만 하고 지금 있는 승인 카드에 이름과 전체 경로가 보이며 사람이 그 한 번을 허락한다. unattended turn과 팀 자식은 요청하지 못한다. 버린 길: locked(agent가 지침대로 바깥 도구를 붙이지 못한다). planner가 2026-11-16에 locked에서 뒤집었다.
    by: agent
  - text: |-
      승인은 route가 그 agent의 tool call로 묻고 기다리며 물은 값 한 번만 쓴다. 버린 길: settings update가 request id를 실어 나중에 맞추기(계획의 처음 안, 바꿔치기할 틈이 생긴다). skip turn도 묻는다.
    by: agent
  - text: |-
      data root를 공유 저장소에 두지 않는 검사는 destination과 data root가 서로 안에 있으면 거절하는 것뿐이다. 그 밖은 지침이 막는다.
    by: agent
  - text: |-
      기계마다 자기 하위 폴더에만 쓴다(lock 없음). 자기 하위 폴더에 자기가 쓰지 않은 번호가 보이면 내보내기를 멈추고 알린다.
    by: agent
  - text: |-
      변경 file은 checksum 줄, header 줄, payload의 한 file이다. 기록과 header는 모르는 칸을 버리고 읽고 꼴 판은 옛 판이 틀리게 읽게 되는 바꿈에만 올린다.
    by: agent
  - text: |-
      기계 사이 snapshot은 덮지 않고 row·칸 clock으로 합친다(hub가 없어 덮으면 받는 쪽의 안 간 변경이 사라진다).
    by: agent
  - text: |-
      맞추기 규칙은 "write는 자기 clock으로만 순서가 정해지고 delete는 자기보다 옛 것만 지운다"다. delete보다 새 칸 값은 `lophn_sync_kept`에 남는다. 버린 길: delete가 칸 clock을 모두 지우기(도착 순서에 따라 사본이 갈렸다).
    by: agent
  - text: |-
      같은 release(봉인 bundle hash)끼리만 적용하고 다른 release의 file은 data root에 복사해 held로 둔다. 적용은 `machine-update`의 일이다.
    by: agent
  - text: |-
      흔적은 알려진 모든 기계가 지난 것이거나 90일보다 옛 것만 지우고, horizon 밖에서 돌아온 기계의 그런 변경은 held로 남겨 사람이나 앱의 agent가 푼다(버리지 않는다). 2026-11-16에 버리는 안을 뒤집었다.
    by: person
  - text: |-
      미래 clock은 값을 깎지 않고 미루고, 상태가 어느 기계의 시계가 얼마나 앞섰는지 말한다.
    by: agent
  - text: |-
      compaction은 주인만 하고 30일 지난 자기 file만 지우며 마지막 snapshot은 남긴다.
    by: agent
  - text: |-
      앱 id는 기계 사이 같고 release의 기계 사이 신분은 봉인 bundle hash다. take-in은 이미 들인 앱이면 release만 설치한다. SDK 사본은 따로 싣지 않고 없는 SDK 판은 `sdk_missing`이다.
    by: agent
  - text: |-
      source는 기계마다 증분 git bundle이고 받는 쪽은 `refs/remotes/<mch>/*`로 fetch만 한다. 폴더 안에 bare 저장소를 두지 않는다.
    by: agent
  - text: |-
      기계 기록은 id, 이름, always_on, 주소(remote가 켜졌을 때), 판 범위만 싣고 공개 key·pairing code·binding·자격은 싣지 않는다. 이름이 겹치면 `이름 (id 끝 6자)`이다.
    by: agent
  - text: |-
      계기는 5초 debounce·5분 timer(내보내기)와 2초 debounce 감시·2분 timer(읽기), 실패는 1분부터 1시간까지 물러남이다.
    by: agent
  - text: |-
      cloud는 기본으로 암호화하는 도구로만 쓰고 평문으로 올리는 폴더는 사람이 그것을 듣고 받아들일 때만 쓴다. 지침이 묻기 전에 말하게 한다.
    by: agent
  - text: |-
      다른 기계에서 온 일의 '다시 snapshot' 줄은 origin `machine`이고 내보내기가 건너뛴다(두 기계 시험에서 모든 write가 snapshot으로 오가는 것을 찾았다). 자기 write의 큰·결과 모르는 변경은 여전히 snapshot을 부른다.
    by: agent
  - text: |-
      hold 규칙은 내보내지 않은 줄을 그 자리에서 held로 바꾸고, 풀리지 않은 자기 held가 있으면 snapshot을 쓰지 않는다(compaction은 기다리고 snapshot이 꼭 필요한 stream은 `away_too_long`으로 멈춘다). 버린 길: snapshot에서 그 row를 빼기(snapshot이 그 번호까지의 모든 것이 아니게 된다).
    by: agent
  - text: |-
      이 기계가 낸 held 변경의 apply는 다시 적용하지 않고 지금 값을 새 clock으로 찍어 보내고, discard는 data를 이 기계에 두고 보내지 않는다.
    by: agent
  - text: |-
      `release.json`은 따로 8 MiB 한도다(template 앱의 bundle 목록이 1.05 MB였다).
    by: agent
follow_up: |
  - 한계: 실시간이 아니다. 바깥 도구는 사람마다 agent가 지침대로 붙이고, 이 계획에서는 실제 바깥 도구(Syncthing, rclone)와 실제 두 기계로 돌려 보지 않았다(한 기계의 data root 둘과 local 폴더로만 보았다).
  - 한계: destination을 바꿀 Settings 화면이 없다. 사람은 자기 터미널의 `lophn settings set folder.destinations ...`를 쓴다. harness agent(lophn agent turn 밖)는 승인을 묻지 못해 늘 `needs_approval`이다.
  - 한계: 다른 release의 held file은 `machine-update`가 적용한다. 그때까지 한쪽만 올린 기계 사이에서 그 사이의 변경은 서로 가지 않는다.
  - 이슈 `folder-snapshot-future-clock-not-deferred`, `folder-first-export-before-peer-horizon`, `folder-environment-hides-held-after-away`, `folder-away-notice-count-in-memory`, `sync-apply-timeout-closes-as-failed`, `sync-rewind-reply-capped`, `take-in-leaves-app-without-release`, `folder-absent-pass-mark-in-error-column`, `folder-watch-per-directory`(kept).
  - `machine-update`: held 적용, 따라가기, `update` section. `always-on`의 `always_on`은 기계 기록과 환경에 실렸다.
checklist:
  - "해야: 실제 두 컴퓨터에서 한쪽 lophn agent에게 sync 폴더를 붙여 달라고 하고, agent가 지침대로 바깥 도구(같은 LAN의 Syncthing이나 rclone crypt 위 cloud)를 고르며 평문 업로드 여부를 묻기 전에 말하는지, 설치는 사람에게 묻는지 본다"
  - agent가 destination을 두려 할 때 승인 카드가 sync 폴더 이름과 전체 local 경로를 보이고, 거절하면 설정이 그대로인지 본다(desktop과 폰 카드)
  - sync_to가 있는 앱을 첫 기계에서 활성화한 뒤 둘째 기계의 `lophn machine environment`에 그 앱이 available로 보이고, `lophn app take-in` 뒤 활성화가 둘째 기계에서 동의를 묻는지 본다
  - 동의 뒤 첫 기계의 row가 둘째 기계에 오고, 둘째 기계에서 쓴 row가 첫 기계에 오는지 본다(바깥 도구의 지연만큼 늦다)
  - 둘째 기계의 Activity에서 다른 기계에서 온 변경이 알아볼 만하게 보이는지 본다
  - 한 기계를 오래 끄거나 폴더에서 떼었다 붙였을 때 "too long away" 알림과 `lophn app sync-held list`가 알아들을 만한지 본다
