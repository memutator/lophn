id: app-reads-lophn-projects
version: 0.23.1
title: "앱 화면이 lophn project 목록을 읽는다(useProjects)"
modules: [packages/protocol, packages/shell/main, packages/shell/preload, packages/shell/ipc, packages/sdk, packages/core/apps, packages/core/agent-workspaces]
checked: []
change: |
  전: 앱 화면은 `usePlace().workspace`로 자기가 열린 project의 id와 폴더만 알았다. project 목록과 제목을 읽을 길이 없어 project별 data를 다루는 앱(Gantt 등)은 project를 따로 만들어야 했다.
  후: preload bridge에 `lophnApp.projects.list()`(IPC `app:projects-list`)를 더했다. shell main이 사람 자격으로 core `projects/list`를 끝 page까지 읽고 project마다 `{id, name, title, purpose, status}`만 돌려준다(폴더 path는 주지 않는다). 실패는 `conflict`(읽는 사이 목록이 바뀜)와 `unavailable`이다. `@lophn/app-ui` 2.11.0이 이를 `useProjects()`(`{state, reload}`)로 감싼다. guide에 "project에 붙는 앱" 절(앱 안에 project를 따로 만들지 않고 project id를 key로 쓴다, project workspace면 그 project로 거르고 밖이면 모두 묶는다)을 더하고 앱 template `AGENTS.md`에 한 줄을 더했다.
why: 앱이 project 개념을 따로 만들지 않고 lophn project를 기준으로 쓰게 하려고. project workspace에서 열면 그 project로 자동으로 걸러지는 흐름을 만들려고.
decisions:
  - text: "project workspace에서 열면 그 project만, 그 밖에서는 모든 project를 묶어 보인다."
    by: person
  - text: "읽기만 연다. 앱이 project를 만들거나 고치지 않는다. 버린 길: 앱 SDK에 project 생성·수정(사람의 project를 AI가 만든 앱 code가 바꾸게 된다)."
    by: agent
  - text: "폴더 path를 앱에 주지 않는다. 지금 열린 project의 폴더는 이미 `place.workspace`로 간다. 버린 길: project record 그대로 넘기기(앱 code가 모든 project의 폴더 위치를 안다)."
    by: agent
  - text: "열 때 한 번 읽고 `reload()`로 다시 읽는다. 버린 길: project 변경 push(필요가 보이면 더한다)."
    by: agent
  - text: "선언에 permission을 따로 두지 않는다. project 제목 읽기는 agent 통로처럼 사람이 연 앱 화면의 일로 본다."
    by: agent
