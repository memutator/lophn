  # ---- job ----
  - id: job-create
    title: "agent가 정해진 때 돌 job을 만든다(사람 승인 전 대기)"
    actor: agent
    entries: [route:jobs/create]
    boundary: [core-api, jobs]
    code: [packages/core/jobs/commands.ts, packages/core/jobs/schedule.ts, packages/core/main/daemon/wiring/jobs-registration.ts, packages/core/main/daemon/wiring/jobs.ts]
    steps:
      - "호출한 session을 creator (agent, workspace)로 찾는다. agent가 아니거나 모르는 session이면 forbidden"
      - "때는 every(주기)와 trigger(event) 가운데 정확히 하나다. 아니면 invalid_input. 주기 job은 missed_policy가 필요하고 at은 every가 d 단위일 때만 받는다. event job은 at을 받지 않는다(invalid_input)"
      - "할 일의 이름(agent, app, project)을 지금 풀어 id로 저장한다. 못 풀면 not_found. schema를 못 읽으면 invalid_input"
      - "trigger는 source(앱이면 그 앱의 active release가 선언한 event, lophn이면 session.* event만. call.settled는 아님)를 풀어 앱 id와 slug, 최소 간격(기본 5m), pass_event(tool_run만, 입력이 객체이거나 없을 때)로 저장한다. 못 풀면 not_found, 선언이 없거나 못 쓰는 event, 같은 앱의 tool을 부르는 tool_run이면 invalid_input, job의 workspace가 call 정책으로 그 앱 workspace에 닿지 못하면 forbidden"
      - "trigger에 machine(컴퓨터 이름, mch_, dev_)이 있으면 다른 컴퓨터의 앱 event로 도는 job이다. 명단은 main thread에만 있어 jobs wiring이 writer 앞에서 mch_로 풀어 저장한다: 못 풀면 not_found, 같은 이름의 컴퓨터가 둘이면 후보와 invalid_input, 이 컴퓨터면 invalid_input(machine을 빼라). 이때 source는 그 컴퓨터의 앱 id(app_)여야 하고(아니면 invalid_input) 이 기계의 앱 선언·call 정책·같은 앱 tool 검사는 건너뛴다(그 앱은 이 기계에 없을 수 있다). private인 workspace의 job은 저장되지만 core가 그 컴퓨터에 구독을 걸지 않는다(remote-app-events)"
      - "job 행을 approved_at 없이 만든다. 다음 차례는 잡지 않는다(사람이 승인해야 돈다. event job은 승인해도 next_due_at이 늘 null이다)"
    outcomes:
      - id: created
        observe: [ledger:jobs, event:StateChanged, response]
      - id: invalid_input
        code: invalid_input
        when: "at이 d 단위 주기가 아님, schema를 읽을 수 없음, 때가 둘이거나 없음, event job에 at, 앱이 선언하지 않은 event나 쓸 수 없는 lophn event, trigger.machine이 이 컴퓨터이거나 같은 이름의 컴퓨터가 둘이거나 source가 app id가 아님"
        observe: [response]
      - id: not_found
        code: not_found
        when: "agent, app, project 이름을 풀지 못함(trigger의 앱과 machine 포함)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent가 아닌 호출자이거나 호출한 session을 모름, trigger의 앱 workspace에 job의 workspace가 call 정책으로 닿지 못함"
        observe: [response]
      - id: internal
        code: internal
        when: "방금 만든 job을 다시 읽지 못함(저장된 job이 깨짐)"
        observe: [response]
    crosses_process: false
    declared_only: [conflict]
    unclear:
      - "route가 conflict를 선언하지만 handler는 내지 않는다. job에는 revision이나 compare가 없고(마지막 쓰기가 이김) 충돌 갈래가 승인(approve)에만 있다. 선언을 고칠 곳이다."
    refs: [J1, J2]
    docs: [architecture/job.md]

  - id: job-update
    title: "job의 제목, 주기, 시각, 놓친 차례 정책, 켜고 끄기를 고친다"
    actor: agent
