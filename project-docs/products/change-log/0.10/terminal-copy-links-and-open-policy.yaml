id: terminal-copy-links-and-open-policy
version: 0.10.0
title: "터미널 복사·붙여 넣기와 파일 경로 link, 대화 코드 블록 실행, 탭 안에서 연 것의 자리 정책 하나"
modules: [packages/shell/renderer, packages/shell/main, packages/shell/ipc, packages/design]
checked: [architecture-browser-tab]
change: |
  전:
  - Linux·Windows 터미널에는 복사·붙여 넣기 키가 없었다(Ctrl+C는 SIGINT).
  - 터미널 출력의 링크는 http/https만 Ctrl/Cmd-click으로 열렸다. 파일 경로는 글 그대로였다.
  - 대화의 코드 블록에는 복사 단추만 있었다.
  - 새 탭의 자리를 여는 쪽마다 정했다. 터미널 URL은 bridgeAfter(반대쪽 pane), 검색 결과와 대화의 파일 link는 focus pane 끝이었다.
  후:
  - 터미널 Ctrl+Shift+C는 고른 글을 복사하고 Ctrl+Shift+V는 bracketed paste로 붙여 넣는다(Linux·Windows). macOS는 그대로 Cmd+C/V다.
  - 터미널 출력의 파일 경로(확장자가 있는 것, :line[:col])가 shell 시작 폴더 기준으로 디스크에 있으면 link가 되고 Ctrl/Cmd-click하면 그 줄로 문서 탭을 연다.
  - 대화의 bash·sh·zsh 코드 블록에 [Run in terminal] 단추가 생겼다. floated 새 터미널을 열고 한 줄이면 실행, 여러 줄이면 붙여 넣기만 한다(Enter는 사람). 줄바꿈·tab 밖의 제어 문자가 있으면 단추가 없다. detached 창에는 없다.
  - 탭 안에서 연 새 탭의 자리를 workspace/open-policy.ts의 openAt 하나가 정한다. source가 pane에 있고 pane이 둘이면 반대쪽 pane 끝, 하나면 source 바로 뒤, floated·minimized·detached면 focus pane 끝이다. 검색 결과와 대화의 파일 link도 이 규칙을 따른다.
  - 터미널 아래 여백이 4px에서 8px이 됐다.
  계약:
  - TerminalOpen·terminalOpenSchema에 command(8192자, 줄바꿈·tab 밖 제어 문자 거절)가 생겼다. main은 shell의 첫 prompt 뒤에 친다(resume 명령도 같다).
  - terminal IPC에 shell:terminal-copy {text}·shell:terminal-paste(TerminalApi.copy·paste)가 생겼다. shell 창 session이 web clipboard permission을 거절해 main의 Electron clipboard를 쓴다.
  - CodeBlock에 action, Markdown에 codeAction이 생겼다.
  - bridgeAfter를 지웠다.
why: |
  lophn은 floated·minimized·detached 자리가 있고 탭을 여는 source(터미널, coding agent, lophn agent)가 여럿이라, 여는 쪽마다 자리를 정하면 규칙이 갈라진다.
decisions:
  - text: "pane이 하나면 자동으로 나누지 않고 source 뒤에 연다. 버린 길: 자동 split(layout이 바뀐다)."
    by: person
  - text: "실행 단추는 bash·sh·zsh만, 한 줄만 바로 실행한다. 버린 길: 여러 줄도 바로 실행(줄마다 실행되어 중간 실패를 못 본다)."
    by: person
  - text: "파일 경로의 상대 기준은 shell 시작 폴더다. 버린 길: OSC 7로 지금 폴더 받기(shell 시작 층을 고쳐야 한다)."
    by: agent
