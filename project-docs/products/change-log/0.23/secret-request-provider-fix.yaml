id: secret-request-provider-fix
version: 0.23.36
title: "`lophn ask secret --provider`가 늘 not_found였던 것과 agent가 실패 이유를 못 받던 것을 고친다"
modules: [packages/core/main, packages/core/lophn-agent]
checked: []
change: |
  전: home lophn이 `lophn ask secret --provider <key>`를 부르면 정의가 있는 key(anthropic, openrouter 등)도 늘 `not_found`였다. 입력 요청 wiring이 `providers/definitions`를 reader pool로 읽었는데, 이 read는 pool 밖 api read라 pool에는 없다. 그리고 tool 실행기가 `ask.secret`의 실패 문장을 "tool target is not available"로 가려 agent는 아는 key 목록도, 거절 이유도 받지 못하고 이름을 바꿔 가며 다시 불렀다.
  후:
  - 입력 요청 wiring은 다른 wiring처럼 core의 read 표(`runtime.reads`)로 읽는다. pool read와 api read가 같은 길이다.
  - `ask.secret`은 실패 문장을 agent에게 그대로 싣는다(input-scoped). 모르는 provider면 내장 정의 key 목록, 청할 수 없는 자리면 어디서 청하는지가 간다.
why: |
  `secret-request` 단위 test는 read를 가짜로 끼워 wiring의 read 길을 보지 않았다. 사람이 home에서 provider key 창을 띄워 보려다 막혔다(session `ses_01m73cv8154nes62tp7s57qmhv`).
decisions:
  - text: "`ask.secret` 실패 문장을 가리지 않는다. 문장에 실리는 것은 공개 catalog인 내장 정의 key와 고정 안내문, 그 workspace가 이미 보는 앱 선언 이름뿐이라 범위 밖 대상의 존재가 새지 않는다."
    by: agent
checklist:
  - Home 대화에서 lophn에게 "OpenRouter key 넣는 창 띄워 줘"라고 하면 card가 뜨는지 본다
