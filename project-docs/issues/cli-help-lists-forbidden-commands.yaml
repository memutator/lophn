id: cli-help-lists-forbidden-commands
title: binary help에 사람 token으로는 거절되는 명령이 보인다
kind: bug
status: open
topic: coding-agent
modules: [packages/cli, packages/core/jobs, packages/core/router, packages/core/apps]
now: "binary `lophn`(`packages/cli/main.ts`)은 명령 표 `COMMANDS` 전부를 help에 보이고 user token으로 부른다. 그런데 route가 actor `agent`만 받는 명령은 core가 `forbidden`으로 거절한다: `job.create`(`jobCreate`), `call.send`·`call.reply`·`session.list`(`calls.*`), `package.publish`. 읽기 route(`app.tool_index`, `declaration.check`, `packages.builtin`)는 actor에 `user`를 더해 binary에서도 된다."
impact: 사람 터미널의 coding agent가 help를 보고 이 명령을 부르면 이유 없이 `forbidden`을 받는다. lophn이 띄운 harness agent turn은 env의 turn 자격(`LOPHN_AGENT_CREDENTIAL`)으로 `call.*`·`session.list`를 부른다(`architecture/coding-agent.md`의 "harness agent"). 사람 터미널의 coding agent에는 아직 신원이 없다.
fix: "쓰기(`job.create`, `package.publish`)와 session 사이 메시지(`call.*`)는 coding agent의 신원이 정해질 때 연다(`project-docs/products/roadmap/command-surface.md` 15, `project-docs/products/roadmap/workflow.md`). 그때까지 binary help에서 binary가 부를 수 없는 명령을 빼거나 표시한다. 추천: coding agent 신원과 같이 연다."
