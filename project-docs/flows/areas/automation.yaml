      - 도는 instance를 멈추고 workflow_start job과 폴더·layout 항목을 지운 뒤 WorkflowRemoved를 발행하고 clean_up 지정 시 follow-up을 인계한다
    outcomes:
      - id: deleted
        observe: [disk:workflow-folder, event:WorkflowRemoved, response]
      - id: not-found
        code: not_found
        when: workflow가 없다
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/workflow.md]
