area: projects

flows:

  # ---- project API (core) ----

  - id: project-register
    title: "project를 등록한다"
    actor: person
    entries: [route:projects/create]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/protocol/projects/project-api.ts
    steps:
      - "사람 UI가 core-call로 project.create를 부른다. user actor가 아니면 forbidden으로 거절한다"
      - "등록 폴더 목록이 같은 path이거나 서로 겹치면 거절한다(validateFolderRoots)"
      - "TargetAuthorization port로 생성 자격을 본다. port가 없거나 판정이 실패하면 fail-closed로 막는다"
      - "같은 id나 같은 name(slug)의 project가 있으면 conflict로 거절한다"
      - "projects와 project_folders에 revision 1로 넣고, 폴더마다 디스크 존재 여부(found)를 붙여 record를 돌려준다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: id-conflict
        code: conflict
        when: "같은 id의 project가 이미 있다"
        observe: ["response"]
      - id: name-conflict
        code: conflict
        when: "같은 name의 project가 이미 있다"
        observe: ["response"]
      - id: folders-overlap
        code: invalid_input
        when: "등록 폴더가 같거나 서로 겹친다, 또는 폴더 경로가 canonical root 모양이 아니다(validateFolderRoots)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: authorization-unavailable
        code: unavailable
        when: "TargetAuthorization port가 없거나 Promise·잘못된 값을 돌려줘 막았다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "같은 id의 project를 읽는 중 깨진 저장을 만났다, 또는 folder resolver port가 붙지 않았다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    refs: [P5, P10]

  - id: project-edit
    title: "project의 이름, 제목, 목적, 폴더 목록을 고친다"
    actor: person
    entries: [route:projects/update]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
    steps:
      - "project를 읽는다. 없으면 not_found로 거절한다"
      - "폴더 목록을 바꾸면 같은 path나 겹침을 본다(validateFolderRoots)"
      - "TargetAuthorization으로 바꾸기 전 project와 바뀐 뒤 후보를 함께 판정한다"
      - "base_revision이 현재 revision과 다르면 conflict, 실제로 바뀐 칸이 없으면 invalid_input이다"
      - "다른 project가 같은 name을 쓰면 conflict로 거절한다"
      - "projects의 metadata와 folder를 쓰고 revision을 올린다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: folders-overlap
        code: invalid_input
        when: "바꾼 폴더 목록이 같거나 서로 겹친다, 또는 폴더 경로가 canonical root 모양이 아니다"
        observe: ["response"]
      - id: no-change
        code: invalid_input
        when: "보낸 칸이 지금 값과 모두 같다"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: name-conflict
        code: conflict
        when: "다른 project가 같은 name을 쓰고 있다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 바꾸기 전이나 바뀐 뒤 상태를 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    refs: [P10]

  - id: project-relink-folder
    title: "찾을 수 없게 된 등록 폴더를 새 위치로 잇는다"
    actor: person
    entries: [route:projects/relink_folder]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
    steps:
      - "project와 folder_path가 등록돼 있는지 본다. 없으면 not_found로 거절한다"
      - "new_path가 folder_path와 같으면 거절하고, 바꾼 목록이 다른 폴더와 겹치면 conflict로 거절한다"
      - "TargetAuthorization으로 판정하고 base_revision을 맞춘다"
      - "new_path가 디스크에 있는지 folder resolver로 본다"
      - "folder 설명은 그대로 두고 path만 바꿔 projects와 project_folders에 쓰고 revision을 올린다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: not-found
        code: not_found
        when: "project가 없거나 folder_path가 그 project의 등록 폴더가 아니다"
        observe: ["response"]
      - id: same-path
        code: invalid_input
        when: "new_path가 folder_path와 같다"
        observe: ["response"]
      - id: overlaps
        code: conflict
        when: "new_path가 같은 project의 다른 등록 폴더와 같거나 겹친다, 또는 new_path가 canonical root 모양이 아니다(validateFolderRoots 실패는 모두 conflict다)"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: new-path-missing
        code: invalid_input
        when: "new_path가 디스크에 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-archive
    title: "project를 보관한다"
    actor: person
    entries: [route:projects/archive]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
    steps:
      - "project를 읽는다. 없으면 not_found로 거절한다"
      - "TargetAuthorization으로 status만 바뀐 후보를 판정한다"
      - "base_revision과 현재 status(active)를 맞춘다"
      - "projects의 status를 archived로 쓰고 revision을 올린다. 폴더의 파일은 건드리지 않는다"
    outcomes:
      - id: archived
        observe: ["ledger:projects", "response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: status-changed
        code: conflict
        when: "이미 보관돼 있다(status가 active가 아니다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-unarchive
    title: "보관한 project를 다시 연다"
    actor: person
    entries: [route:projects/unarchive]
    pre: [project-archive:archived]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
    steps:
      - "project를 읽는다. 없으면 not_found로 거절한다"
      - "TargetAuthorization으로 status만 바뀐 후보를 판정한다"
      - "base_revision과 현재 status(archived)를 맞춘다"
      - "projects의 status를 active로 쓰고 revision을 올린다"
    outcomes:
      - id: unarchived
        observe: ["ledger:projects", "response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: status-changed
        code: conflict
        when: "보관돼 있지 않다(status가 archived가 아니다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-icon-set
    title: "project 아이콘을 올리거나 지운다"
    actor: person
    entries: [route:projects/set_icon]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/protocol/base/icon.ts
    steps:
      - "icon이 null이면 지우고, 아니면 checkIconUpload로 base64와 64 KiB 상한, image 형식을 본다"
      - "project가 없으면 not_found로 거절한다"
      - "TargetAuthorization으로 판정한다. revision은 올리지 않는다"
      - "project_icons 행을 덮어쓰거나 지운다"
    outcomes:
      - id: uploaded
        observe: ["ledger:project_icons", "response"]
      - id: cleared
        observe: ["ledger:project_icons", "response"]
      - id: invalid-icon
        code: invalid_input
        when: "type이 svg·png·webp가 아니거나, base64가 아니거나 0 byte이거나, 64 KiB를 넘거나, 바이트가 선언한 type과 맞지 않는다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-read
    title: "project 목록, 단건, 아이콘, 경로로 찾은 project를 읽는다"
    actor: person
    entries:
      - route:projects/list
      - route:projects/get
      - route:projects/icon
      - route:projects/resolve
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/reads.ts
      - packages/core/projects/registry/cursor.ts
    steps:
      - "list·get은 readers(user·agent·app), icon·resolve는 user actor만 받는다"
      - "list는 status 조건으로 거르고 project마다 TargetAuthorization을 적용해 보이는 것만 모은다. cursor는 page basis와 맞춰 푼다"
      - "get·icon은 project가 없거나 권한이 없으면 같은 not_found로 답한다"
      - "resolve는 경로를 포함하는 가장 깊은 등록 폴더의 project를 고른다. 깊이가 같은 등록 폴더가 둘이면 conflict로 답한다"
      - "project record(폴더마다 found)와 as_of_seq를 돌려준다. 쓰기는 없다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: invalid-cursor
        code: invalid_input
        when: "list의 cursor를 해독할 수 없다, 또는 cursor의 조건(status·limit·호출자 principal·actor·credential)이 이 호출과 다르다, 또는 cursor의 위치가 목록 밖이다"
        observe: ["response"]
      - id: cursor-stale
        code: conflict
        when: "cursor를 만든 뒤 ledger seq(as_of_seq)나 보이는 project 목록(id·revision)이 바뀌었다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "get·icon은 project가 없거나 권한이 없다. resolve는 경로에 맞는 등록 폴더가 없거나 권한이 없다"
        observe: ["response"]
      - id: registered-roots-tie
        code: conflict
        when: "resolve에서 경로를 덮는 같은 깊이의 등록 폴더가 둘이다(project끼리 같은 폴더를 등록했다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "actor가 허락 목록에 없다(icon·resolve는 user만)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "TargetAuthorization 판정을 얻지 못했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "저장된 project를 읽는 중 깨진 저장을 만났다"
        observe: ["response"]
    crosses_process: false
    unclear:
      - "agent 자격의 list·get 호출은 core/agent-workspaces/workspace/workspace-data.ts가 turn 시작 때 workspace 정보를 만들면서 한다. 그 호출은 turns 또는 agent-workspaces 쪽 flow가 uses로 잇는다"
      - "list·get은 agent·app도 부르고 icon·resolve는 user만 부른다. 이 flow의 actor는 person으로 두었다"

  - id: project-search
    title: "project의 등록 폴더에서 글자를 찾는다"
    actor: person
    entries: [route:projects/search]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/search/mod.ts
      - packages/core/projects/search/work.ts
      - packages/core/projects/registry/model.ts
    steps:
      - "project를 ledger snapshot에서 읽는다. 없으면 not_found로 거절한다"
      - "folder가 있으면 등록 폴더이거나 그 아래인지 보고, 아니면 invalid_input으로 거절한다"
      - "등록 폴더를 realpath로 훑는다. symlink가 root 밖이면 따라가지 않고 .gitignore를 적용한다"
      - "limit보다 하나 더 찾으면 멈추고 next_cursor를 낸다. 쓰기는 없다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: folder-outside
        code: invalid_input
        when: "folder가 연결 폴더 밖이다"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "query·limit 형식이 맞지 않거나 cursor를 해독할 수 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "ledger snapshot을 열 수 없다(search가 붙지 않았다 포함)"
        observe: ["response"]
      - id: internal
        code: internal
        when: "저장된 project를 읽는 중 깨진 저장을 만났다"
        observe: ["response"]
    crosses_process: false
    risk: [sandbox]
    unclear:
      - "actors가 user뿐이라 agent·app 호출은 dispatch의 공통 gate가 거절한다. handler에는 검사가 없어 forbidden outcome을 두지 않았다"

  # ---- blob (storage) ----

  - id: blob-read
    title: "owner와 field로 정해진 blob 참조의 구간을 읽는다"
    actor: app
    entries: [route:blobs/read]
    uses: [system:blob-upload]
    pre: [blob-upload:referenced]
    boundary: [storage, core-api, child-supervision-protocol]
    code:
      - packages/core/storage/blobs/read.ts
      - packages/core/storage/blobs/refs.ts
      - packages/core/storage/blobs/worker/pipe.ts
    steps:
      - "입력 schema를 보고 현재 자격의 authorize를 통과하는지 본다(scope 밖이면 forbidden)"
      - "owner_kind·field가 등록된 field인지(없으면 invalid_input), 일반 읽기를 허락하는 field인지(아니면 forbidden) 본다"
      - "blob_refs에서 owner_kind·owner_key·field의 hash와 크기를 ledger snapshot으로 찾는다. 없으면 not_found다"
      - "구간을 256 KiB 창으로 자르고 I/O worker가 blobs/sha256 파일을 읽어 channel의 byte frame으로 돌려준다"
      - "읽은 크기나 hash가 등록과 다르면 corrupt, 파일이 없으면 missing으로 status를 답한다"
      - "바이트를 돌려주기 직전에 authorize를 한 번 더 한다(그 사이 scope가 바뀌었으면 거절)"
    outcomes:
      - id: available
        observe: ["response"]
      - id: missing
        observe: ["response"]
      - id: corrupt
        observe: ["response"]
      - id: invalid-window
        code: invalid_input
        when: "입력 schema가 맞지 않거나 등록되지 않은 owner_kind·field이거나 offset이 크기를 넘는다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "owner_kind·owner_key·field에 등록된 blob 참조가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "현재 자격의 operation·target scope 밖이다, 또는 field가 일반 읽기를 허락하지 않는다(바이트를 읽은 뒤 다시 검사해 거절하는 것 포함)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "blob 읽기 통로가 붙지 않았거나 ledger를 열지 못했거나 blob_refs 행을 읽지 못했다"
        observe: ["response"]
    crosses_process: true
    unclear:
      - "호출자는 app 자격의 HTTP route와 core 안의 apps 능력 broker다. 이 저장소에서 route를 부르는 SDK 경로는 확인하지 않았다"
      - "protocol의 unavailable status reason에 pruned가 있으나 이 read 경로는 missing·corrupt만 만든다(pruned를 만드는 곳을 찾지 못했다)"
      - "app 범위가 다른 앱의 target이면 not_found로 답한다는 경로는 찾지 못했다. blobs/read 기본 authorizer는 target.app을 넘기지 않아 forbidden으로 답한다"

  - id: blob-upload
    title: "파일 바이트를 준비해 blob으로 저장하고 owner의 참조로 등록한다"
    actor: system
    entries: [system:blob-upload]
    boundary: [storage, child-supervision-protocol]
    code:
      - packages/core/storage/blobs/prepare-relay.ts
      - packages/core/storage/blobs/child-prepare.ts
      - packages/core/storage/blobs/register.ts
      - packages/core/storage/blobs/work.ts
    steps:
      - "core 안의 호출자(annotation 올리기, release 준비, package 설치, model call body)가 principal·purpose·선택 expected_hash로 준비를 청한다. child 자식의 blob_prepare_request도 같은 purpose 정책으로 받는다"
      - "core는 blob.prepare 요청을 I/O worker에 보내고, worker가 purpose의 허용과 용량 상한을 본다. 동시 stream은 4개까지다(child 입구)"
      - "core는 바이트를 worker가 준 credit 안에서 chunk로 흘려보낸다. 전체를 메모리에 모으지 않는다"
      - "worker가 hash를 계산해 expected_hash와 맞는지 보고 blobs/sha256에 설치한다. 임시 파일은 실패하면 지운다"
      - "core는 준비 참조를 10분 수명으로 메모리에 등록한다. owner command는 같은 ledger transaction에서 blob_refs에 참조를 넣는다"
    outcomes:
      - id: prepared
        observe: ["disk:blobs/sha256/<hash>", "response"]
      - id: referenced
        observe: ["ledger:blob_refs"]
      - id: purpose-refused
        code: forbidden
        when: "purpose가 자식 정책에 없다(존재 여부를 알리지 않는 같은 forbidden), 또는 자식 kind의 정책이 없다, 또는 I/O worker가 purpose를 허락하지 않았다"
        observe: ["response"]
      - id: too-large
        code: invalid_input
        when: "size_bytes가 purpose의 상한을 넘는다"
        observe: ["response"]
      - id: empty
        code: invalid_input
        when: "내용이 0 byte다"
        observe: ["response"]
      - id: hash-mismatch
        code: invalid_input
        when: "expected_hash와 실제 hash가 다르다"
        observe: ["response"]
      - id: stream-invalid
        code: invalid_input
        when: "같은 channel이 이미 열려 있다, 또는 자식이 credit을 넘기거나 선언 크기와 다른 바이트를 보냈다, 또는 end 뒤에 바이트를 보냈다"
        observe: ["response"]
      - id: busy
        code: unavailable
        when: "동시 stream 4개가 차 있다(자식 입구)"
        observe: ["response"]
      - id: timeout
        code: unavailable
        when: "worker가 credit을 30초 동안 주지 않았거나 end 뒤 120초 안에 답하지 않았다. 자식이 30초 동안 말이 없으면 답 없이 끊는다"
        observe: ["response"]
      - id: io-failed
        code: unavailable
        when: "I/O worker가 디스크 여유 부족, 임시 쓰기·rename·sync 실패로 설치하지 못했다"
        observe: ["response"]
      - id: relay-failed
        code: unavailable
        when: "원천 바이트를 읽지 못했거나 I/O worker로 넘기지 못했다(연결이 끊긴 것 포함)"
        observe: ["response"]
      - id: internal
        code: internal
        when: "worker가 바이트가 끝나기 전에 성공으로 답했다, 준비 결과 크기가 선언 크기와 다르다, prepare가 예외를 던졌다"
        observe: ["response"]
      - id: ref-invalid
        code: invalid_input
        when: "참조 등록 입력이 schema와 다르다, 또는 field가 등록되지 않았다, 또는 등록한 참조가 schema와 다르다"
        observe: ["response"]
      - id: ref-no-preparation
        code: invalid_input
        when: "참조 등록 때 살아 있는 준비 참조가 없다(10분이 지나 만료한 것 포함)"
        observe: ["response"]
      - id: ref-forbidden
        code: forbidden
        when: "현재 자격이 없다, 또는 준비 참조의 주체가 현재 자격과 다르다, 또는 기존 참조를 재사용하는데 허용된 참조가 없다"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    unclear:
      - "호출자(apps의 release 준비·package 설치와 publish, annotation 올리기, agent-runtime의 model call body)는 route로 들어오지 않아 이 flow가 system entry다. apps 쪽 flow가 uses로 잇는지 확인이 필요하다"
      - "준비 참조를 writer에 알리는 note가 실패했을 때의 code는 wiring이 정한다. 이 flow는 그 실패를 따로 적지 않았다"

  # ---- editor (shell main·renderer) ----

  - id: editor-open
    title: "파일 하나를 편집기 탭으로 연다"
    actor: person
    entries: [ui:editor-open]
    uses:
      - ipc:shell:file-read
      - ipc:shell:file-read-bytes
      - ipc:shell:file-watch
      - ipc:shell:instructions-open
    boundary: [shell]
    code:
      - packages/shell/renderer/editor/use-file.ts
      - packages/shell/renderer/editor/sessions.ts
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/editor/instructions.ts
    steps:
      - "renderer가 path를 editor session으로 붙인다. LOPHN.md는 instructions-open이 path를 먼저 정한다(project 첫 등록 폴더, 없으면 data root의 project 자리)"
      - "main은 secrets.json만 forbidden으로 막고 나머지는 디스크에서 직접 읽는다. 상대 path는 invalid_input이다"
      - "8 MiB 이하이고 NUL과 깨진 UTF-8이 없는 글이면 text·hash·modified_at을 돌려준다"
      - "8 MiB를 넘으면 편집 session 없이 bytes를 읽기 전용으로 보여 준다"
      - "창이 이 path를 watch 목록에 넣어 밖의 변화를 알린다. watch가 거절해도 renderer는 그 답을 버리고 편집기는 연다"
    outcomes:
      - id: ready
        observe: ["response", "screen:new-editor-tabs"]
      - id: too-large
        observe: ["response"]
      - id: unsupported
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "path가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 본문 main frame이 아니다(file IPC guard), 또는 secrets.json이다, 또는 디스크 권한이 없다(EACCES·EPERM)"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다(지침 target의 층·workspace 모양 포함)"
        observe: ["response"]
      - id: watch-refused
        observe: ["response"]
        when: "file-watch가 secrets.json 등을 거절했다. 편집기는 열리고 밖의 변화 알림만 빠진다(renderer가 답을 버린다)"
      - id: unavailable
        code: unavailable
        when: "그 밖의 디스크 오류이거나 LOPHN.md 자리를 정하지 못했다(project 폴더를 읽지 못함, data root의 project 폴더를 못 만듦)"
        observe: ["response"]
    crosses_process: true
    risk: [secret]
    refs: [P8, P10]
    unclear:
      - "FileFailure의 unsupported·too_large는 공통 일곱 code 밖이라 code를 비웠다. AGENTS.md의 경계 규칙과 어긋나는지 확인이 필요하다"

  - id: editor-save
    title: "편집 중인 글을 디스크에 저장한다"
    actor: person
    entries: [ui:editor-save]
    pre: [editor-open:ready]
    uses: [ipc:shell:file-write]
    boundary: [shell]
    code:
      - packages/shell/renderer/editor/save-state.ts
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/editor/ipc.ts
    steps:
      - "입력이 800ms 멈추면 renderer SaveSession이 마지막으로 읽거나 쓴 hash를 base_hash로 보낸다"
      - "main은 보낸 창이 desktop 본문인지 보고, schema가 글의 바이트 상한(8 MiB)을 본다"
      - "같은 path의 쓰기는 한 줄로 세워, 디스크 hash가 base_hash와 같을 때만 쓴다(없는 파일은 null)"
      - "같은 폴더의 임시 파일에 쓴 뒤 rename으로 바꿔 끼우고 원래 mode를 이어 받는다"
      - "결과를 모르면(unavailable) renderer가 다시 쓰지 않고 먼저 읽어 같은 글인지 확인한다"
    outcomes:
      - id: saved
        observe: ["disk:<path>", "response"]
      - id: conflict
        code: conflict
        when: "쓰기 전에 디스크가 밖에서 바뀌었다. 편집 글은 그대로 두고 쓰지 않는다"
        observe: ["response"]
      - id: denied
        code: forbidden
        when: "보낸 창이 등록된 desktop 본문 main frame이 아니다(file IPC guard), 또는 디스크 권한이 없다(EACCES·EPERM)이거나 secrets.json이다. 편집기는 failed가 된다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "부모 폴더가 없다(ENOENT). 편집기는 failed가 된다"
        observe: ["response"]
      - id: unsupported
        observe: ["response"]
        when: "경로가 폴더다(EISDIR·ENOTDIR). 편집기는 failed가 된다"
      - id: unknown-result
        code: unavailable
        when: "디스크 오류로 썼는지 모른다. renderer가 읽어서 같은 글이면 saved, 쓰기 전 글이면 다시 쓰고, 아니면 conflict가 된다"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다(글이 8 MiB를 넘는 것 포함). 편집기는 failed가 된다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    refs: [P10]
    unclear:
      - "쓰기 실패 중 conflict 밖의 것은 failed로 두고 사람의 다시 시도를 기다린다(자동 재시도 없음). 이때 편집 글은 메모리에만 남고, 창을 닫을 때 editor-window-close가 묻는다"
      - "too-large는 schema가 먼저 invalid_input으로 거절해 adapter의 too_large 답에 닿지 않는다. 그래서 invalid-path에 넣었다"

  - id: editor-conflict-resolve
    title: "디스크가 밖에서 바뀐 충돌을 사람이 고른다"
    actor: person
    entries: [ui:editor-conflict-resolve]
    pre: [editor-save:conflict]
    uses:
      - ipc:shell:file-read
      - ipc:shell:file-write
    boundary: [shell]
    code:
      - packages/shell/renderer/editor/save-state.ts
      - packages/shell/renderer/editor/conflict/conflict-compare.tsx
    steps:
      - "충돌 화면이 편집 글과 디스크 글을 나란히 보여 준다(readDisk)"
      - "내 글 유지를 고르면 디스크를 다시 읽어 base를 맞추고 그 위에 편집 글을 쓴다"
      - "디스크 글 받기를 고르면 편집 글을 디스크 글로 바꾼다. 편집 중이던 글은 버려진다"
      - "디스크를 읽지 못하면 편집 글과 디스크 글을 바꾸지 않는다"
    outcomes:
      - id: kept-mine
        observe: ["disk:<path>", "screen:new-editor-tabs"]
      - id: write-failed
        observe: ["screen:new-file-conflict"]
        when: "내 글 유지에서 디스크를 다시 읽었지만 쓰기가 conflict·failed·불명으로 끝났다. 충돌 상태로 돌아간다"
      - id: took-theirs
        observe: ["screen:new-editor-tabs"]
      - id: disk-unreadable
        observe: ["screen:new-file-conflict-compare"]
        when: "디스크를 읽지 못했다(내 글 유지·디스크 글 받기 모두). 편집 글과 디스크 글을 바꾸지 않는다"
    crosses_process: false
    risk: [data-loss]

  - id: editor-window-close
    title: "저장이 끝나지 않은 편집이 있는 창을 닫는다"
    actor: person
    entries: [ui:editor-window-close]
    uses:
      - ipc:shell:file-counts
      - ipc:shell:file-close-request
      - ipc:shell:file-close-answer
    boundary: [shell]
    code:
      - packages/shell/main/editor/close-guard.ts
    steps:
      - "창 닫기 event를 main이 막고, 창의 저장 중 수와 열린 편집 수를 보아 물을 것이 있는지 본다"
      - "물을 것이 있으면 renderer에 질문 번호를 보내고(file-close-request) 기다린다. 질문이 나가 있는 동안 온 닫기는 다시 묻지 않고 삼킨다"
      - "renderer가 저장을 끝낸 뒤 allow로 답하면(file-close-answer) 창을 닫는다. stay면 닫지 않는다"
      - "renderer가 asking으로 답하면(사람이 고르는 중) 기한을 멈춘다"
      - "15초 안에 답이 없으면 창을 닫고 log에 한 줄을 남긴다"
    outcomes:
      - id: closed
        observe: ["process:shell-window"]
        when: "물을 것이 없거나 tray Quit처럼 끄는 중이다, 또는 renderer가 allow로 답했다"
      - id: kept-open
        observe: ["process:shell-window"]
        when: "renderer가 stay로 답했다. 끄기도 멈춘다"
      - id: swallowed
        observe: ["process:shell-window"]
        when: "질문이 나가 있는 동안 온 닫기다. 다시 묻지 않고 삼킨다"
      - id: timeout-closed
        observe: ["log:close guard"]
        when: "15초 안에 renderer가 답하지 않았다"
    crosses_process: true
    risk: [data-loss]
    unclear:
      - "창 닫기 event 자체(OS 닫기, desk 닫기)의 flow는 shell-desktop 소유일 수 있다. 이 flow는 편집 guard의 판정만 소유한다고 적었다"
      - "timeout-closed는 renderer가 멈춘 채 저장 안 된 편집이 있으면 그 글을 잃을 수 있다. 설계상 창이 영원히 안 닫히지 않게 한 선택이다"
      - "asking(사람이 고르는 중)은 끝 상태가 아니라 기한을 멈추는 중간 상태라 outcome으로 두지 않았다"

  - id: editor-disk-watch
    title: "편집 중인 파일이 밖에서 바뀌면 편집기에 알린다"
    actor: system
    entries: [system:editor-disk-watch]
    uses: [ipc:shell:file-changed]
    pre: [editor-open:ready]
    boundary: [shell]
    code:
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/renderer/editor/save-state.ts
    steps:
      - "main이 창마다 감시 path의 stat과 hash를 기억하고 1초마다 stat이 바뀐 것만 다시 읽는다(폴링)"
      - "hash가 기억과 다르면 file-changed를 그 창에 보낸다. 내 쓰기 뒤에는 main이 그 창의 기억을 새 hash로 고쳐 메아리를 보내지 않는다"
      - "편집 글이 디스크와 같으면 renderer가 디스크 글을 다시 읽어 받는다(external)"
      - "편집 글이 남아 있으면 conflict 상태로 두고 쓰지 않는다"
      - "지워진 파일(hash null)은 다음 쓰기에서 충돌로 드러난다"
    outcomes:
      - id: adopted
        observe: ["screen:new-editor-tabs"]
      - id: conflict
        observe: ["screen:new-file-conflict"]
      - id: ignored
        observe: ["screen:new-editor-tabs"]
        when: "디스크 hash가 renderer의 기준 hash와 같다(내 쓰기의 메아리), 또는 지워진 파일(hash null)이다, 또는 디스크를 다시 읽지 못했다. 화면은 그대로다"
    crosses_process: true
    unclear:
      - "지워진 파일을 다음 쓰기 전까지 알리지 않는 것이 의도인지 확인이 필요하다(편집 글이 깨끗할 때도 같다)"

  # ---- artifact (shell main·renderer) ----

  - id: artifact-open
    title: "artifact를 artifact 탭에서 연다"
    actor: person
    entries: [ui:artifact-open]
    uses:
      - ipc:shell:artifact-open
      - ipc:shell:artifact-state
    boundary: [shell]
    code:
      - packages/shell/main/artifact/registry.ts
      - packages/shell/main/artifact/source.ts
      - packages/shell/main/artifact/session.ts
      - packages/shell/renderer/artifact/artifact-tab.tsx
    docs: [architecture/artifact.md]
    steps:
      - "대화의 artifact link, sidebar Artifacts 목록이 openArtifact를 부른다. 파일 열기의 .html은 file source로 연다"
      - "main이 source를 root 폴더와 입구 index.html로 풀고 realpath가 artifacts 폴더 안인지 본다"
      - "처음 열 때 artifact partition을 봉한다(권한 거절, download 취소, 죽은 proxy, scheme handler)"
      - "root마다 host(sha256 앞 24자)를 정하고 lophn-artifact:// src로 guest를 붙일 준비를 한다"
      - "폴더를 watch 목록에 넣고, 같은 창의 같은 source는 기존 view 상태를 돌려준다"
      - "view 상태(view_session·source·title·health)를 artifact-state로 창에 민다"
      - "폴더가 없으면 view를 만들지 않고 탭이 안내와 [Try again]을 그린다. Try again은 artifact-reload로 새 화면 세대를 연다"
    outcomes:
      - id: opened
        observe: ["response", "screen:artifact-tab"]
        when: "view를 새로 세웠다, 또는 같은 창의 같은 source가 이미 열려 있어 기존 상태를 돌려줬다"
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(artifact IPC guard)"
        observe: ["response"]
      - id: invalid-source
        code: invalid_input
        when: "artifact 이름이 slug가 아니거나 file이 절대 .html 경로가 아니거나 workflow 이름이 맞지 않거나 view와 instance 짝이 맞지 않는다, 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "폴더가 없거나 index.html이 일반 file이 아니거나 realpath가 artifacts 밖이다"
        observe: ["response", "screen:artifact-missing"]
      - id: unavailable
        code: unavailable
        when: "partition 봉하기가 실패했다(probe가 닿는 loopback 서버를 봤다 포함)"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]
    refs: [C28]

  - id: artifact-serve
    title: "lophn-artifact:// 요청에 root 안의 일반 file만 답한다"
    actor: system
    entries: [system:artifact-serve]
    pre: [artifact-open:opened]
    boundary: [shell]
    code:
      - packages/shell/main/artifact/serve.ts
      - packages/shell/main/artifact/paths.ts
      - packages/shell/main/artifact/entries.ts
    docs: [architecture/artifact.md]
    steps:
      - "요청 host로 root를 찾는다. 없으면 404다"
      - "GET·HEAD만 받고 그 밖의 method는 405로 거절한다"
      - "data/_entries.json은 data/ 바로 아래 일반 file 목록을 가상으로 주고, _lophn/kit.js·kit.css는 고정 이름 둘만 dist에서 읽는다"
      - "workflow instance view의 data/_instance.json은 core instance read로 읽고(scope), 못 읽거나 4 MiB를 넘으면 503이다"
      - "그 밖의 path는 어휘 검사 뒤 realpath가 root 안이어야 하고, O_NOFOLLOW로 열어 일반 file이고 4 MiB 이하일 때만 CSP를 달아 준다"
    outcomes:
      - id: served
        observe: ["response"]
      - id: method-refused
        observe: ["response"]
        when: "GET·HEAD가 아닌 method다(405)"
      - id: not-found
        code: not_found
        when: "404: host가 없다, path가 root 밖이나 symlink다, 일반 file이 아니다, 4 MiB를 넘는다, kit이 없다"
        observe: ["response"]
      - id: instance-unavailable
        code: unavailable
        when: "503: instance 상태를 읽지 못했거나(core read 실패 포함) 4 MiB를 넘는다"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]

  - id: artifact-navigation
    title: "artifact page의 navigation을 자기 host 안으로 막는다"
    actor: system
    entries: [system:artifact-navigation]
    pre: [artifact-open:opened]
    uses: [ipc:shell:artifact-event]
    boundary: [shell]
    code:
      - packages/shell/main/artifact/navigation.ts
      - packages/shell/main/artifact/electron-view.ts
    docs: [architecture/artifact.md]
    steps:
      - "will-frame-navigate와 will-redirect에서 목적지를 decideArtifactNavigation으로 정한다(will-navigate는 듣지 않는다)"
      - "같은 host의 lophn-artifact:는 그대로 간다"
      - "main frame의 http·https는 막고, 사용자 입력이 5000ms 안이면 open-link event를 renderer에 보낸다"
      - "renderer는 그 link를 browser 탭으로 연다"
      - "그 밖의 scheme과 다른 host는 조용히 막는다"
    outcomes:
      - id: same-host
        observe: ["screen:artifact-tab"]
      - id: external-link-opened
        observe: ["screen:browser-tab"]
        when: "main frame의 http·https이고 사용자 입력이 5000ms 안이다(open-link를 renderer에 보내 browser 탭으로 연다)"
      - id: blocked
        observe: ["request:outside-server"]
        when: "같은 host가 아닌 lophn-artifact나 그 밖의 scheme이다, 다른 host다, subframe의 http·https다, main frame의 http·https인데 입력이 없다"
    crosses_process: true
    risk: [sandbox]

  - id: artifact-watch
    title: "artifact 폴더가 바뀌면 열린 탭을 다시 불러온다"
    actor: system
    entries: [system:artifact-watch]
    pre: [artifact-open:opened]
    boundary: [shell]
    code:
      - packages/shell/main/artifact/watch.ts
      - packages/shell/main/artifact/registry.ts
    docs: [architecture/artifact.md]
    steps:
      - "artifact는 폴더 전체를, 사람의 .html은 그 폴더 바로 아래만 감시한다"
      - "바뀐 것이 들어오면 150ms 동안 모아 한 번 reloadIgnoringCache 한다"
      - "health가 ok인 view만 다시 load한다. 깨진 view는 Try again으로만 살아난다"
      - "workflow instance view는 WorkflowInstanceChanged를 받은 뒤 그 instance를 여는 guest만 다시 load한다"
    outcomes:
      - id: reloaded
        observe: ["screen:artifact-tab"]
      - id: reloaded-instance
        observe: ["screen:workflow-tab-artifact"]
      - id: broken-skipped
        observe: ["screen:artifact-tab", "screen:workflow-tab-artifact"]
        when: "바뀐 것을 본 view가 깨졌다(health가 ok가 아니다). 다시 load하지 않고 Try again을 기다린다"
      - id: watch-stopped
        when: "감시 폴더가 사라지거나 watch가 깨져 조용히 멈춘다(이후 바뀌어도 다시 load하지 않는다). log는 남기지 않는다"
        observe: ["screen:artifact-tab"]
    crosses_process: true
    unclear:
      - "watch-stopped는 log 없이 멈춘다. 사람이 알 방법이 없어 log를 남길지는 정하지 못했다"

  - id: artifact-guest-health
    title: "artifact guest가 죽거나 멈추면 탭에 알린다"
    actor: system
    entries: [system:artifact-guest-health]
    pre: [artifact-open:opened]
    uses:
      - ipc:shell:artifact-state
      - ipc:shell:artifact-reload
    boundary: [shell]
    code:
      - packages/shell/main/artifact/registry.ts
      - packages/shell/main/app-frame/crash.ts
    docs: [architecture/artifact.md]
    steps:
      - "guest의 gone 신호는 health를 crashed로, unresponsive 신호는 unresponsive로 바꾼다. crashed는 되돌아가지 않는다"
      - "바뀐 상태를 창에 push해 탭이 안내와 [Try again]을 그린다"
      - "Try again(artifact-reload)은 깨진 view에 같은 view_session으로 새 화면 세대를 열어 health를 ok로 되돌린다"
    outcomes:
      - id: crashed
        observe: ["screen:artifact-tab"]
      - id: unresponsive
        observe: ["screen:artifact-tab"]
      - id: responsive-again
        when: "멈췄던 guest가 responsive 신호를 다시 보냈다(crashed는 되살리지 않는다)"
        observe: ["screen:artifact-tab"]
      - id: recovered
        when: "사람이 Try again을 눌러 깨진 view에 새 화면 세대가 열렸다"
        observe: ["screen:artifact-tab"]
      - id: not-own-view
        code: invalid_input
        when: "artifact-reload를 보낸 창이 그 view를 연 창이 아니다, 또는 view가 열려 있지 않다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(artifact IPC guard)"
        observe: ["response"]
    crosses_process: true

  # ---- browser tab (shell main·renderer) ----

  - id: browser-page-open
    title: "주소를 적어 browser 탭에 page를 연다"
    actor: person
    entries: [ui:browser-page-open]
    pre: [browser-guest-attach:attached-browser]
    uses:
      - ipc:shell:browser-navigate
      - ipc:shell:browser-state
      - key:new.browser
    boundary: [shell]
    code:
      - packages/shell/main/browser/registry.ts
      - packages/shell/main/browser/address.ts
      - packages/shell/main/browser/navigation.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "주소 칸 글을 normalizeAddress가 scheme을 채운다(localhost·127.0.0.1은 http, 그 밖은 https). 빈 글은 거절한다"
      - "decideNavigation이 main frame 목적지를 본다. http·https와 정확히 about:blank만 된다"
      - "userinfo가 있는 http·https와 file·lophn-*·javascript: 같은 scheme은 거절한다"
      - "mailto·tel은 사용자 입력이 5000ms 안이면 OS로 넘기고 page는 그대로 둔다"
      - "허락되면 그 guest를 load하고 url·title·loading·favicon 상태를 창에 push한다(browser-state)"
    outcomes:
      - id: loaded
        observe: ["request:outside-server", "response", "screen:browser-tab"]
      - id: invalid-address
        code: invalid_input
        when: "주소가 비었거나 decideNavigation이 막았다(scheme·userinfo·입력 없는 mailto), 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: os-handoff
        observe: ["process:os-opener"]
        when: "주소가 mailto·tel이고 사용자 입력이 5000ms 안이다"
      - id: view-not-open
        code: invalid_input
        when: "그 창이 연 view가 아니다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(browser IPC guard)"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]

  - id: browser-chrome-command
    title: "browser 탭의 뒤로, 앞으로, 새로 고침을 한다"
    actor: person
    entries: [ui:browser-chrome-command]
    uses: [ipc:shell:browser-command]
    boundary: [shell]
    code:
      - packages/shell/main/browser/registry.ts
      - packages/shell/main/browser/browser-ipc.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "머리 줄의 뒤로·앞으로·새로 고침이 IPC로 main에 command를 보낸다"
      - "main이 그 창이 가진 view인지 보고 history 이동이나 reload를 한다"
      - "죽었거나 멈춘 guest를 reload하면 page process를 다시 띄우고 health를 ok로 되돌린다"
    outcomes:
      - id: done
        observe: ["screen:browser-tab"]
      - id: view-not-open
        code: invalid_input
        when: "그 창이 연 view가 아니다"
        observe: ["response"]
      - id: devtools-command
        code: invalid_input
        when: "command가 back·forward·reload가 아니다(schema가 먼저 거절한다. DevTools는 devtools channel로만 연다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(browser IPC guard)"
        observe: ["response"]
    crosses_process: true

  - id: browser-devtools-open
    title: "browser 탭 page의 DevTools를 연다"
    actor: person
    entries: [ui:browser-devtools-open]
    uses:
      - ipc:shell:browser-devtools-open
      - ipc:shell:browser-devtools-close
      - ipc:shell:browser-devtools-window
    boundary: [shell]
    code:
      - packages/shell/main/browser/devtools.ts
      - packages/shell/renderer/browser/devtools-pane.tsx
    docs: [architecture/browser-tab.md]
    steps:
      - "DevTools는 page마다 새 native view 하나에 붙인다(<webview>는 DevTools를 담지 못한다)"
      - "자리는 탭 안 오른쪽·아래, floated 패널, 따로 뜬 OS 창 가운데 하나다. 자리를 바꿀 때는 다시 열지 않고 view를 옮긴다"
      - "이미 열려 있으면 conflict로 거절한다"
      - "닫을 때 view를 부순다. 열린 상태는 main이 든다"
    outcomes:
      - id: opened
        observe: ["response", "screen:browser-devtools-bottom", "screen:browser-devtools-right", "screen:browser-devtools-float"]
      - id: already-open
        code: conflict
        when: "DevTools가 이미 열려 있다"
        observe: ["response"]
      - id: view-not-open
        code: invalid_input
        when: "그 창이 연 view가 아니다, 또는 DevTools view를 만들 수 없다(host가 contents를 주지 않았다)"
        observe: ["response"]
      - id: moved
        observe: ["screen:browser-devtools-float"]
        when: "DevTools의 자리를 바꿨다(탭 안·floated·따로 뜬 OS 창). 이미 그 자리면 아무 일도 없다"
      - id: closed
        observe: ["response", "screen:browser-tab"]
        when: "그 창이 연 DevTools를 닫았다(view를 부순다)"
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(browser IPC guard)"
        observe: ["response"]
    crosses_process: true

  - id: browser-clear-data
    title: "browser 탭의 쿠키와 저장소를 지운다"
    actor: person
    entries: [ui:browser-clear-data]
    uses: [ipc:shell:browser-clear-data]
    boundary: [shell]
    code:
      - packages/shell/main/browser/browser-ipc.ts
      - packages/shell/main/browser/session.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "Settings › Browser의 Clear browsing data가 IPC로 main을 부른다"
      - "main이 persist:lophn-browser의 storage를 인자 없이 clearStorageData()로 지우고 cache를 비운다"
      - "열린 browser page를 다시 load한다"
      - "앱 저장소 partition은 건드리지 않는다"
    outcomes:
      - id: cleared
        observe: ["disk:persist:lophn-browser", "response", "screen:browser-tab"]
      - id: unavailable
        code: unavailable
        when: "지우기가 실패했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(browser IPC guard)"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]
    unclear:
      - "지우면 browser 탭의 로그인 쿠키도 사라진다. 사람에게 알리는 문구는 이 flow의 밖이다"

  - id: browser-bookmark-save
    title: "bookmark를 더하거나 고치거나 지운다"
    actor: person
    entries: [ui:browser-bookmark-save]
    uses:
      - ipc:shell:bookmarks-add
      - ipc:shell:bookmarks-update
      - ipc:shell:bookmarks-remove
      - ipc:shell:bookmarks-changed
      - key:browser.bookmark
    boundary: [shell]
    code:
      - packages/shell/main/browser/bookmarks.ts
      - packages/shell/main/browser/bookmark-ipc.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "main이 <dataRoot>/shell/bookmarks.json을 읽고, 깨졌으면 corrupt로 두어 어떤 쓰기도 덮지 않는다"
      - "title은 200자 이하, url은 http·https이고 userinfo가 없고 8192자 이하인지 본다. 목록은 1000개까지다"
      - "같은 href가 있으면 conflict로, 고치거나 지울 항목이 없으면 not_found로 거절한다"
      - "temp 파일에 쓰고 rename으로 바꾼다(폴더 0700, 파일 0600). 쓰기는 promise 줄로 세운다"
      - "바뀐 목록을 열린 모든 shell 창에 bookmarks-changed로 알린다"
    outcomes:
      - id: saved
        observe: ["disk:<dataRoot>/shell/bookmarks.json", "response", "screen:settings-browser-bookmarks"]
      - id: invalid-input
        code: invalid_input
        when: "title이나 url이 맞지 않거나 1000개를 넘는다, 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: duplicate
        code: conflict
        when: "같은 href의 bookmark가 있다"
        observe: ["response"]
      - id: missing
        code: not_found
        when: "고치거나 지울 bookmark가 없다"
        observe: ["response"]
      - id: corrupt-refused
        code: unavailable
        when: "bookmarks.json이 JSON이 아니거나 schema·version이 다르다. 쓰기를 거절하고 파일은 그대로 둔다"
        observe: ["disk:<dataRoot>/shell/bookmarks.json", "response"]
      - id: unreadable
        code: unavailable
        when: "bookmarks.json을 읽지 못했다(ENOENT 밖의 읽기 오류)"
        observe: ["response"]
      - id: unwritable
        code: unavailable
        when: "temp 쓰기나 rename이 실패했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(bookmark IPC guard)"
        observe: ["response"]
    crosses_process: true
    risk: [data-loss]

  - id: browser-guest-attach
    title: "shell 문서가 <webview>를 붙일 때 browser 쪽 설정을 덮는다"
    actor: system
    entries: [system:browser-guest-attach]
    boundary: [shell]
    code:
      - packages/shell/main/browser/webview-guest.ts
      - packages/shell/main/desktop/wiring/browser.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "will-attach-webview는 붙이는 문서가 lophn-shell://desktop인지 본다. 아니면 거절한다"
      - "src가 등록된 app·artifact guest와 같으면 그 target을 쓰고, 아니고 partition이 browser이면 browser target으로 본다"
      - "renderer가 넣은 preload·webpreferences·nodeintegration 같은 값은 지우고 hardened 값으로 덮은 뒤 partition과 preload를 다시 넣는다"
      - "browser의 첫 src는 decideNavigation을 지나야 하고, 못 지나면 about:blank로 바꾼다"
      - "did-attach-webview에서 받아 둔 붙이기를 FIFO로 guest 항목(wv-<id>)에 묶는다"
    outcomes:
      - id: attached-browser
        observe: ["screen:browser-tab"]
      - id: attached-registered-view
        observe: ["screen:artifact-tab"]
      - id: rejected
        observe: ["request:outside-server"]
        when: "shell 밖 문서에서 붙였다, 또는 browser partition도 아니고 등록된 app·artifact view의 src도 아니다, 또는 resolver가 받아 주지 않았다(다른 창의 view·이미 쓴 src)"
      - id: first-src-blocked
        observe: ["screen:browser-blank"]
    crosses_process: false
    risk: [sandbox]

  - id: browser-navigation
    title: "browser page가 가는 목적지를 decideNavigation으로 정한다"
    actor: system
    entries: [system:browser-navigation]
    pre: [browser-guest-attach:attached-browser]
    boundary: [shell]
    code:
      - packages/shell/main/browser/navigation.ts
      - packages/shell/main/browser/electron-view.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "will-frame-navigate와 will-redirect에서 main frame과 subframe의 목적지를 본다(will-navigate는 쓰지 않는다)"
      - "main frame의 http·https는 userinfo가 없을 때만 간다"
      - "subframe은 http·https와 data·blob·about을 받고 그 밖은 막는다"
      - "main frame의 mailto·tel은 막고, 사용자 입력이 fresh면 OS로 넘긴다"
    outcomes:
      - id: allowed
        observe: ["request:outside-server"]
      - id: blocked
        observe: ["request:outside-server"]
        when: "decideNavigation이 막았다: 허락되지 않은 scheme, main frame의 userinfo가 있는 http·https, 입력 없는 mailto·tel, 주소를 읽을 수 없음"
      - id: os-handoff
        observe: ["process:os-opener"]
        when: "main frame의 mailto·tel이고 사용자 입력이 fresh이다"
    crosses_process: false
    risk: [sandbox]

  - id: browser-popup
    title: "page의 window.open을 floated 탭, docked 탭, 막기 가운데 하나로 고른다"
    actor: system
    entries: [system:browser-popup]
    pre: [browser-page-open:loaded]
    uses:
      - ipc:shell:browser-adopt
      - ipc:shell:browser-event
    boundary: [shell]
    code:
      - packages/shell/main/browser/popup.ts
      - packages/shell/main/browser/popup-host.ts
      - packages/shell/main/browser/registry.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "popup 목적지를 decideNavigation으로 보고 사용자 입력이 5000ms 안인지 본다"
      - "입력이 없으면 deny하고 popup-blocked 이벤트를 창에 보낸다"
      - "width와 height가 둘 다 있으면 native popup view를 만들어 opener를 남기고 floated 탭을 열게 한다. adopt 전에는 state를 밀지 않는다"
      - "크기 없는 popup은 deny하고 open-tab 이벤트로 renderer가 연 탭 뒤에 webview 탭을 연다"
      - "adopt는 소유 창에서 한 번만 된다. 다른 창이 부르면 invalid_input, 두 번째면 forbidden이다"
    outcomes:
      - id: floated
        observe: ["screen:browser-oauth-popup"]
      - id: docked
        observe: ["screen:browser-popup-new-tab"]
      - id: popup-blocked
        observe: ["screen:browser-popup-blocked"]
        when: "목적지는 허락되지만 사용자 입력이 5000ms 안에 없다"
      - id: denied-scheme
        observe: ["request:outside-server"]
        when: "목적지가 scheme·credentials·읽을 수 없는 모양으로 막혔다(입력이 있어도 OS로 넘기지 않는다)"
      - id: os-handoff
        observe: ["process:os-opener"]
        when: "막힌 목적지가 mailto·tel이고 사용자 입력이 5000ms 안이다"
      - id: adopt-wrong-window
        code: invalid_input
        when: "popup을 연 창이 아닌 창이 adopt를 불렀다, 또는 adopt 입력이 schema와 다르다"
        observe: ["response"]
      - id: adopt-twice
        code: forbidden
        when: "이미 adopt된 view를 다시 adopt한다, 또는 보낸 창이 등록된 desktop 창 본문 main frame이 아니다(browser IPC guard)"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]

  - id: browser-session-policy
    title: "browser partition의 permission, device, download를 정한다"
    actor: system
    entries: [system:browser-session-policy]
    boundary: [shell]
    code:
      - packages/shell/main/browser/session.ts
      - packages/shell/main/browser/permission.ts
      - packages/shell/main/browser/electron-session.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "permission request·check는 clipboard-sanitized-write를 main frame의 http·https 요청에만 허락하고 나머지는 모두 거절한다"
      - "device permission은 전부 거절한다"
      - "will-download는 시작한 contents를 알고 사용자 입력이 fresh일 때만 받는다. 아니면 취소한다"
      - "받는 중인 download의 처음과 끝을 contents마다 세어 창에 알린다"
      - "요청 header와 UA에서 Electron/x만 빼고 lophn/x는 남긴다"
    outcomes:
      - id: permission-granted
        observe: ["response"]
        when: "clipboard-sanitized-write이고 main frame의 http·https 요청이다"
      - id: permission-denied
        observe: ["response"]
        when: "그 밖의 permission request·check다(device 포함하지 않는다)"
      - id: device-denied
        observe: ["response"]
        when: "device permission(카메라·마이크 등)을 요청했다. 전부 거절한다"
      - id: download-started
        observe: ["process:os-save-dialog", "screen:browser-tab"]
        when: "시작한 contents를 알고 사용자 입력이 fresh이다. 저장 dialog를 띄운다"
      - id: download-refused
        observe: ["request:outside-server"]
        when: "시작한 contents를 모르거나 사용자 입력이 fresh하지 않다(요청은 이미 나갔고 저장 dialog와 파일은 없다)"
    crosses_process: true
    risk: [sandbox]

  # ---- terminal bridge (shell main, coding agent의 $BROWSER) ----

  - id: browser-bridge-start
    title: "앱을 켤 때 terminal bridge의 run 폴더와 socket을 준비한다"
    actor: system
    entries: [system:browser-bridge-start]
    uses: [ipc:shell:terminal-bridge-open]
    boundary: [shell, coding-agent]
    code:
      - packages/shell/main/browser-bridge/run-dir.ts
      - packages/shell/main/browser-bridge/shim.ts
      - packages/shell/main/browser-bridge/socket.ts
      - packages/shell/main/browser-bridge/bridge.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "app ready 뒤 single-instance lock을 가진 process만 run 폴더(shell-<pid>)를 만든다. 자기 pid나 죽은 pid의 폴더만 지운다"
      - "shim을 per-run 폴더에 쓴다(POSIX sh 0700, 공통 browser.js 0600, Electron Node로 실행)"
      - "bridge socket을 0600 file로 listen한다(Windows는 named pipe)"
      - "두 endpoint 경로가 ipcPathLimit을 넘으면 hook과 bridge를 끄고 로그 한 줄만 남긴다. 앱과 shell 탭은 그대로 뜬다"
      - "앱을 끌 때 자기 폴더만 동기로 지운다"
    outcomes:
      - id: listening
        observe: ["disk:run/shell-<pid>/"]
        when: "lock을 가졌고 폴더, shim, socket이 모두 준비됐다(bridge가 켜졌다)"
      - id: no-lock
        observe: ["disk:run/shell-<pid>/"]
        when: "single-instance lock을 얻지 못했다(두 번째 instance). 폴더를 만들지 않고 bridge를 끈다. 로그는 없다"
      - id: path-too-long
        observe: ["log:bridge"]
        when: "두 endpoint 경로가 ipcPathLimit을 넘는다. 폴더를 건드리지 않고 hook과 bridge를 끈다"
      - id: run-dir-failed
        observe: ["log:bridge"]
        when: "socket 디렉터리 계산이나 옛 실행 폴더 정리·mkdir·chmod가 실패했다. hook과 bridge를 끈다"
      - id: shim-failed
        observe: ["log:bridge"]
        when: "shim 쓰기가 실패했다. 폴더와 hook은 남고 bridge만 꺼진다"
      - id: listen-failed
        observe: ["log:bridge"]
        when: "bridge socket listen이 실패했다, 또는 0600 chmod가 실패했다. 폴더와 hook은 남고 bridge만 꺼진다"
      - id: cleaned
        observe: ["disk:run/shell-<pid>/"]
        when: "앱을 끌 때 자기 폴더를 동기로 지운다(지우지 못하면 다음 실행이 정리한다)"
    crosses_process: false
    risk: [sandbox]

  - id: browser-bridge-request
    title: "터미널 child가 $BROWSER로 연 URL을 browser 탭으로 넘기거나 OS browser로 돌린다"
    actor: coding-agent
    entries: [system:browser-bridge-request]
    pre: [browser-bridge-start:listening]
    uses:
      - ipc:shell:terminal-bridge-open
      - ipc:shell:terminal-bridge-ack
    boundary: [shell, coding-agent]
    code:
      - packages/shell/main/browser-bridge/bridge.ts
      - packages/shell/main/browser-bridge/policy.ts
      - packages/shell/main/browser-bridge/shim.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "shim이 {v:1, key, url} 한 줄을 b.sock에 쓴다. main은 JSON, v 1, key 64 hex, 8 KiB 이하를 검사한다"
      - "key 표에서 그 key를 묶은 terminal을 찾는다. 없으면 declined다"
      - "설정 shell.browser.web_links·local_links를 main이 요청마다 core settings/list로 읽는다. browser_tab이 아니면 declined다"
      - "창이 있으면 모든 창에 terminal-bridge-open을 보내고, 1500ms 안에 그 창의 ack가 와야 pane이다"
      - "창은 browser 탭을 열었으면 terminal-bridge-ack로 그 request에 opened true를 답한다. 열지 못했으면 false를 답하거나 아무 답도 하지 않는다"
      - "shim은 pane이면 끝내고, declined·접속 실패·3초 초과면 BROWSER와 LPN env를 지운 env로 xdg-open·open·cmd start를 부른다"
    outcomes:
      - id: pane
        observe: ["screen:browser-bridge-pane", "response"]
        when: "key가 묶인 terminal이 있고 설정이 browser_tab이고 창의 ack가 1500ms 안에 opened true로 왔다"
      - id: declined
        observe: ["response", "process:os-opener"]
        when: "요청 줄이 검사에 못 맞다(JSON·v 1·key 64 hex·8 KiB), key가 묶인 terminal이 없다, 설정이 browser_tab이 아니다, 열린 창이 없다, 1500ms 안에 ack가 없다(ack가 거절된 것 포함). shim 쪽 접속 실패·3초 초과도 같은 OS opener로 간다"
      - id: os-opener-direct
        observe: ["process:os-opener"]
        when: "relayable 검사를 못 지난 target(http·https가 아니거나 userinfo가 있는 것)은 main에 묻지 않고 바로 OS opener에 넘긴다"
    crosses_process: true
    risk: [sandbox]
    unclear:
      - "shim은 relayable이 아닌 target도 openWithSystem으로 OS opener에 넘긴다(scheme 검사가 없다). 파일이나 javascript: 같은 target이 열릴 수 있는지 의도 확인이 필요하다"

  - id: browser-terminal-link
    title: "terminal에서 Ctrl·Cmd로 누른 link를 browser 탭이나 OS browser로 연다"
    actor: person
    entries: [ui:terminal-link-open]
    uses:
      - ipc:shell:terminal-link
      - ipc:shell:terminal-bridge-open
      - ipc:shell:terminal-bridge-ack
    boundary: [shell]
    code:
      - packages/shell/main/browser-bridge/bridge.ts
      - packages/shell/renderer/terminal/use-bridge-open-requests.ts
    docs: [architecture/browser-tab.md]
    steps:
      - "terminal의 link 클릭(Ctrl·Cmd-click)이 shell:terminal-link로 main에 온다. main은 창이 등록된 desktop 본문인지 보고 입력 schema(8192자 이하)를 본다"
      - "http·https 절대 URL이고 userinfo가 없는 것만 다음으로 간다. 그 밖은 아무 일도 하지 않는다"
      - "그 terminal이 key를 묶었고 설정 target이 browser_tab이면, 창이 ack하는 browser 탭을 연다"
      - "탭이 안 열리거나 key가 없거나 설정이 system_browser면 main이 OS browser로 연다"
    outcomes:
      - id: browser-tab
        observe: ["screen:browser-bridge-pane"]
        when: "key가 묶인 terminal이고 설정이 browser_tab이고 창이 ack로 탭을 열었다"
      - id: system-browser
        observe: ["process:os-browser"]
        when: "key가 없거나 설정이 system_browser이거나, 열린 창이 없거나 ack가 없었다"
      - id: dropped
        observe: ["response"]
        when: "http·https 절대 URL이 아니거나 userinfo가 있다. 아무 일도 하지 않는다"
      - id: invalid-input
        code: invalid_input
        when: "terminal link 입력이 schema와 다르다(url이 8192자를 넘는 것 포함)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 등록된 desktop 창 본문 main frame이 아니다(terminal IPC guard)"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]
    unclear:
      - "openLink은 http·https가 아닌 URL을 아무 흔적 없이 버린다. 문서는 조용히 사라지는 URL이 없다고 적었으므로 의도인지 확인이 필요하다"
