area: cli
flows:
  - id: cli-core-connect
    title: "binary가 명령 하나를 돌리려고 core에 붙는다. 없으면 띄우고, 쓰기 응답을 잃으면 같은 key로 결과를 다시 본다"
    actor: person
    entries: []
    uses: [system:core-ensure, control:identify, control:connect, route:commands/result]
    boundary: [core-control-protocol, coding-agent-cli, core-api]
    code:
      - packages/cli/connection/core.ts
      - packages/cli/connection/client/core.ts
      - packages/cli/connection/client/daemon.ts
      - packages/cli/connection/client/node.ts
      - packages/cli/connection/client/token.ts
    steps:
      - "LOPHN_AGENT_SHELL=1이고 LOPHN_AGENT_CREDENTIAL이 없으면(lophn agent의 shell.run·ACP terminal 안) 붙지도 띄우지도 않고 forbidden으로 끝낸다. 오류 글은 lophn tool을 쓰라고 알린다"
      - "agent 자격(LOPHN_AGENT_CREDENTIAL env, 없으면 LOPHN_AGENT_CREDENTIAL_FILE이 가리키는 GUI 탭의 turn 자격 file)이 있으면 그 자격으로만 부른다. connect도 띄우기도 하지 않고 identify로 core가 ready인지만 본다. file이 없으면 2초까지 다시 읽고(turn 첫 명령이 core의 file 쓰기보다 먼저 올 수 있다) 그래도 없거나 비었으면(turn 밖) 사람 자격으로 바꾸지 않고 unauthorized다"
      - "LOPHN_DAEMON_URL이 있으면 loopback http 주소인지 보고, identify가 알린 api_url과 같은 core일 때만 control connect로 user 자격을 받는다. 띄우지 않는다"
      - "그 밖에는 system:core-ensure로 붙거나 띄운다. 판이 다른 core는 ensure가 한 번 갈아 띄운다. 받은 자격으로 core route를 HTTP로 부른다"
      - "data root(LOPHN_HOME, 없으면 $HOME/.lophn)를 못 구하면 control socket 자리도 못 구해 unavailable이다"
      - "쓰기 호출의 전송이 끊기면 같은 key로 route:commands/result를 읽는다. 결과가 있으면 그 결과를 성공으로 쓰고, 없으면 effect_unknown 진단과 key를 싣고 exit 6으로 끝난다"
      - "읽기 호출의 전송이 끊기면 unavailable을 그대로 돌려준다(exit 5). 다시 부르는 것은 호출자 몫이다"
    outcomes:
      - id: attached
        observe: [response]
        when: "ensure가 붙거나 띄워 붙었다(system:core-ensure의 attached, spawned, replaced 가운데 하나)"
      - id: joined-agent
        observe: [response]
        when: "agent 자격 env가 있고 그 core가 ready다. 띄우지 않고 그 자격으로 부른다"
      - id: joined-address
        observe: [response]
        when: "LOPHN_DAEMON_URL이 identify가 알린 core와 같다. 띄우지 않고 user 자격을 받는다"
      - id: agent-outside-turn
        code: unauthorized
        observe: [response]
        when: "turn 자격 file env가 있는데 그 file이 없거나 비었다(GUI 탭의 turn 밖). control socket에 닿지도 core를 띄우지도 않는다"
      - id: agent-shell
        code: forbidden
        observe: [response]
        when: "자격 없는 lophn agent shell 안이다(LOPHN_AGENT_SHELL). control socket에 닿지도 core를 띄우지도 않는다"
      - id: invalid-address
        code: invalid_input
        observe: [response]
        when: "LOPHN_DAEMON_URL이 비었거나 http가 아니거나 loopback이 아니다"
      - id: address-mismatch
        code: unavailable
        observe: [response]
        when: "명시 주소가 identify의 api_url과 다르다. 자격을 받기 전에 끝낸다"
      - id: no-data-root
        code: unavailable
        observe: [response]
        when: "LOPHN_HOME도 HOME도 없어 data root를 못 구한다"
      - id: core-unavailable
        code: unavailable
        observe: [response]
        when: "agent 자격의 core가 떠 있지 않거나 api_url이 아직 null이다, 또는 system:core-ensure가 unavailable로 끝났다(start-failed, not-ready, stop-timeout, version-mismatch)"
      - id: contract-mismatch
        code: internal
        observe: [response]
        when: "system:core-ensure의 contract-mismatch다"
      - id: replayed
        observe: [response]
        when: "쓰기 응답을 잃었고 같은 key의 결과가 core에 남아 있다. 그 결과를 성공으로 쓴다"
      - id: effect-unknown
        code: unavailable
        observe: [response]
        when: "쓰기 응답을 잃었고 같은 key의 결과도 없다. details에 diagnosis effect_unknown과 key를 싣고 exit 6이다"
      - id: read-lost
        code: unavailable
        observe: [response]
        when: "읽기 호출이 전송에서 끊겼다(exit 5)"
    crosses_process: true
    risk: [secret]
    docs: [architecture/platform.md]
    unclear:
      - "명시 주소(LOPHN_DAEMON_URL) 경로는 identify 뒤 api_url 비교만 하고 product_version을 보지 않는다. 다른 판의 core에도 자격을 준다. core-ensure처럼 판을 맞출지 사람이 정한다"
      - "agent 자격 경로는 core가 떠 있지 않으면 띄우지 않고 unavailable이다. harness shell에서 core가 꺼진 뒤의 기대 동작을 확인할 것"

  - id: core-stop
    title: "lophn core stop: 떠 있는 core에 control stop을 보낸다. 띄우지는 않는다"
    actor: person
    entries: [cli:core.stop]
    uses: [control:stop]
    boundary: [core-control-protocol, coding-agent-cli]
    code:
      - packages/cli/commands/core.ts
      - packages/cli/connection/core.ts
      - packages/cli/connection/client/node.ts
    steps:
      - "LOPHN_AGENT_CREDENTIAL·LOPHN_AGENT_CREDENTIAL_FILE env가 있거나 자격 없는 lophn agent shell(LOPHN_AGENT_SHELL=1) 안이면 core를 멈출 수 없어 forbidden으로 끝난다. 연결하지 않는다"
      - "data root와 control socket 자리를 구한다. 못 구하면 unavailable이다"
      - "control stop 한 줄을 보낸다. 띄우지 않는다. core가 없어 socket이 답하지 않으면 unavailable이다"
      - "core가 ready이면 control-stop이 ok를 먼저 쓰고 barrier를 돌린 뒤 나간다. tray의 Stop lophn과 같은 control stop이다(architecture/platform.md)"
      - "출력은 stopped true다(--json이면 JSON 한 줄). 출력 꼴은 cli-argv가 맡는다"
    outcomes:
      - id: stopped
        observe: [response, "process:core 종료"]
        when: "control stop이 ok로 왔다"
      - id: forbidden
        code: forbidden
        observe: [response]
        when: "LOPHN_AGENT_CREDENTIAL env가 있다(harness shell), 또는 LOPHN_AGENT_SHELL=1이다(lophn agent의 shell). core를 멈추지 않고 연결도 하지 않는다"
      - id: unavailable
        code: unavailable
        observe: [response]
        when: "data root를 못 구했거나, core가 없어 socket이 답하지 않거나, core가 starting이나 stopping이다"
      - id: internal
        code: internal
        observe: [response]
        when: "core가 root package.json의 판을 읽지 못해 control-stop이 internal로 답했다. 종료는 시작하지 않는다"
    crosses_process: true
    docs: [architecture/platform.md]

  - id: cli-argv
    title: "lophn 명령줄 한 줄을 명령 하나로 읽는다. 틀리면 invalid_input으로 끝내고, 결과는 줄이나 --json으로 쓴다"
    actor: person
    entries: []
    uses: [system:core-ensure, route:apps/list, route:apps/tools, route:machines/call, route:apps/remote_call]
    boundary: [coding-agent-cli-interface, core-api]
    code:
      - packages/cli/main.ts
      - packages/cli/remote-core.ts
      - packages/cli/parser.ts
      - packages/cli/output.ts
      - packages/cli/help.ts
      - packages/cli/commands/app-command.ts
      - packages/cli/commands/types.ts
    steps:
      - "첫 낱말이 help면 명령 표로 help 글을 낸다. 인자가 없으면 같은 글을 exit 2로 낸다. version은 core 없이 제품 판을 낸다"
      - "명령 표의 점 이름을 argv 낱말로 맞춘다(app.link_source는 app link-source). 맞는 명령이 없고 첫 낱말이 표에 없으면 system:core-ensure로 core에 붙어 그 slug의 앱 command를 표에 더해 다시 맞춘다. 그래도 없으면 unknown command다. 현재 command의 점·underscore 표기를 그대로 쓴 경우 정확한 CLI 문법과 help 경로를 안내하며 실행하지 않는다"
      - "flag와 위치 인자를 칸에 맞춘다. 모르는 flag, 값 없는 flag, 중복, 위치 인자 초과, 숫자·boolean·JSON 변환 실패는 usage 한 줄과 함께 invalid_input이다. --input은 JSON object여야 하고 칸과 겹치면 안 된다. 칸 schema가 막으면 빠진 칸과 틀린 칸을 항목별로 적은 invalid_input이다. 명령의 run은 실행 전에 인자 조합을 한 번 더 거른다"
      - "run이 돌려준 오류는 code 그대로 쓴다. 갈래는 그 명령의 flow가 정한다. 결과는 --json이면 JSON 한 줄, 아니면 text나 줄로 푼 글을 stdout에 쓴다. 끝난 일이 failed면 결과를 쓴 뒤 사유를 stderr에 쓰고 exit 4다. note는 stderr에 한 줄 쓰고 exit 0이다. 오류는 stderr에 code와 message를 쓰고 code를 exit으로 바꾼다(invalid_input 2, forbidden·unauthorized 3, unavailable 5, effect_unknown 6, internal 1, 그 밖 4). 받은 user token과 agent 자격은 stdout·stderr 어디에도 남기지 않는다"
      - "`--on <기계>`는 어떤 parse보다 앞서 argv에서 뗀다(앱 command의 동적 parse도 그 뒤다). 값이 비었거나 `--on=x` 꼴이면 invalid_input이고 `--on=x`는 모르는 flag다. 없으면 위와 같다. 있으면 core 명령만 간다: version, binary 명령(harness, hook, core 등)과 같이 쓰면 core에 붙기 전에 invalid_input이다. 명단을 바꾸는 명령의 터미널 탭 거절은 이 앞에 선다. agent 자격(LOPHN_AGENT_CREDENTIAL, harness가 띄운 shell)은 machines/call을 쓰지 못하므로 `on` 칸을 가진 agent 명령(call send, team spawn, session list, agent list, agent card, handoff write, send)이면 `--on`을 그 칸으로 두고 그 명령의 route로 보낸다(agent의 lophn tool과 같다). agent 자격의 `--on`이 그 밖의 명령에 붙으면 core에 붙기 전에 forbidden이다. 사람 자격이라도 `send`·`settings export`처럼 `on`이 필수인 명령은 machines/call이 아니라 이 컴퓨터 core에서 실행해 대상으로 보낸다"
      - "`--on`이면 이 기계의 core에 user token으로 붙고 명령의 core 호출(read, memory, command)을 이 core의 machines/call {machine, resource, method, body}로 바꾼다. shell_capability 칸은 싣지 않는다(칸이 없는 호출을 core가 사람의 터미널로 정해 받는 기계에 알린다. CLI는 capability를 환경에서도 읽지 않는다). body는 그 route의 HTTP body 그대로다(command는 envelope). LOPHN_WORKSPACE는 이 기계의 것이라 넘기지 않는다. 받는 기계가 거절할 명령을 CLI가 미리 거르지 않는다: 기기 route 목록과 허락은 받는 기계의 것이다. 오류는 그 기계의 code로 그대로 쓴다(이 컴퓨터를 고르면 invalid_input, 이름을 못 풂 not_found, 같은 이름 여럿 invalid_input의 details.candidates, 기기 목록 밖·허락 없음 forbidden, 닿지 않음 unavailable)"
      - "표에 없는 첫 낱말이면 `--on`일 때 그 기계의 앱 목록과 선언을 읽어 그 기계의 앱 command를 표에 더한다(`lophn <slug> --help --on <기계>`가 그 기계의 command를 보인다). 부르기는 run이 아니라 apps/remote_call {app, command, input} 하나이고 입력은 받는 기계가 검사한다. 결과 outcome이 succeeded면 result를 쓰고 failed·denied·unknown이면 사유를 stderr에 쓰고 exit 4다. 이 기계에는 run 기록이 없다(그 기계의 호출 기록이 remote caller로 남는다)"
    outcomes:
      - id: result
        observe: [response]
        when: "명령이 ok로 끝났다. exit 0"
      - id: note
        observe: [response]
        when: "명령은 ok이고 알릴 것이 있다(workflow.start가 첫 step을 넘기지 못함). stderr에 한 줄, exit 0"
      - id: failed
        observe: [response]
        when: "명령은 끝났지만 일의 결과가 실패다(끝난 run이 failed나 cancelled, preview가 ready가 아님, release prepare·activate의 failed). stderr에 사유, exit 4다"
      - id: help
        observe: [response]
        when: "lophn help, lophn <묶음> --help, lophn <명령> --help. stdout에 글, exit 0"
      - id: help-no-args
        observe: [response]
        when: "인자가 없다. help 글을 stdout에 쓰고 exit 2다"
      - id: version
        observe: [response]
        when: "lophn version. core를 부르지 않고 제품 판을 쓴다"
      - id: unknown-command
        code: invalid_input
        observe: [response]
        when: "명령 표와 앱 command 어디에도 없는 CLI 낱말이다(앱 slug가 없는 경우 포함). 현재 command의 점·underscore 표기를 쓴 경우 정확한 호출법과 command help를 안내하고, 그 밖에 알려진 group이면 group help, 아니면 lophn help로 안내한다"
      - id: help-unknown-topic
        code: invalid_input
        observe: [response]
        when: "help 뒤의 낱말이 명령도 묶음도 아니다"
      - id: invalid-argument
        code: invalid_input
        observe: [response]
        when: "모르는 flag, 값 없는 flag, 중복 flag, 위치 인자 초과나 중복, 숫자·boolean·JSON 변환 실패"
      - id: invalid-input
        code: invalid_input
        observe: [response]
        when: "칸 schema가 막았다, --input이 JSON object가 아니다, --input과 --input-file을 같이 줬다, --input-file을 못 읽었다, 같은 칸을 --input과 flag로 둘 다 줬다"
      - id: run-args-invalid
        code: invalid_input
        observe: [response]
        when: "명령 run이 실행 전에 인자 조합을 거른다. agent run의 --session과 --agent·--project·--app, --project와 --app, --schema가 JSON object가 아님. tab open의 --session·--url·--preview·--artifact·--coding 가운데 정확히 하나가 아님, --device나 --screen에 --preview가 없음, --tui에 --session이 없음, --coding과 --handoff가 짝이 아님. call reply의 --allow와 --reject 동시, 결정 없이 body도 없음. package read에서 name 없이 version이나 offset_bytes"
      - id: app-lookup-unavailable
        code: unavailable
        observe: [response]
        when: "표에 없는 첫 낱말이라 core에 붙었는데 붙지 못했다(cli-core-connect의 unavailable)"
      - id: on-sent
        observe: [response]
        when: "`--on <기계>`의 명령이 machines/call로 그 기계에 가 ok로 돌아왔다. exit 0"
      - id: on-app-command
        observe: [response]
        when: "`lophn <slug> <command> --on <기계>`가 그 기계의 앱 command를 apps/remote_call로 불러 결과를 받았다. 실패·막힘·결과 모름은 failed(exit 4)와 같은 꼴이다"
      - id: on-binary-command
        code: invalid_input
        observe: [response]
        when: "`--on`을 version, binary 명령과 함께 썼다. core에 붙기 전에 거절한다"
      - id: on-empty
        code: invalid_input
        observe: [response]
        when: "`--on`의 값이 비었다. 값이 없거나 `--on`이 겹친 것은 invalid-argument다"
      - id: on-unresolved
        code: not_found
        observe: [response]
        when: "core가 그 기계를 명단에서 못 풀었다(machines/call의 답 그대로)"
      - id: on-ambiguous
        code: invalid_input
        observe: [response]
        when: "같은 이름의 컴퓨터가 여럿이거나 이 컴퓨터를 골랐다. 여럿이면 details.candidates의 기기 id로 다시 부른다(machines/call의 답 그대로)"
      - id: on-agent-field
        observe: [response]
        when: "agent 자격으로 `on` 칸을 가진 명령에 `--on`을 썼다(명령 낱말 앞이든 뒤든). machines/call이 아니라 그 명령의 route로 갔다"
      - id: on-agent-refused
        code: forbidden
        observe: [response]
        when: "agent 자격으로 `on` 칸이 없는 명령(앱 command 포함)에 `--on`을 썼다. message가 `--on`을 받는 명령을 적는다. core에 붙기 전이다"
      - id: on-refused
        code: forbidden
        observe: [response]
        when: "받는 기계가 거절했다(기기 route 목록 밖, 사람 route의 허락 없음). 그 기계가 정한 것이라 CLI는 미리 거르지 않는다"
      - id: on-unavailable
        code: unavailable
        observe: [response]
        when: "그 기계와의 link가 없거나 답이 없다(machines/call의 답 그대로)"
    crosses_process: false
    risk: [secret, permission]
    unclear:
      - "표에 없는 첫 낱말이면 core를 띄운다(system:core-ensure). lophn 뒤의 틀린 명령 이름만으로 core가 뜨는 것이 의도인지 확인할 것"

  - id: settings-change-command
    title: "명령으로 설정 하나를 바꾸거나 기본값으로 되돌린다"
    actor: agent
    entries: [cli:settings.set, cli:settings.unset]
    uses: [route:settings/list, route:settings/update]
    boundary: [coding-agent-cli-interface, config]
    code:
      - packages/cli/commands/settings.ts
    steps:
      - "settings/list로 key를 찾는다. 선언된 설정이거나 folder 설정의 항목(`shell.themes.<id>`)이어야 한다. 없는 key는 not_found, folder key 자체는 invalid_input이다"
      - "locked인 설정은 forbidden으로 끝낸다. 사람의 터미널(user token)도 같다. 사람은 Settings 화면에서 바꾼다"
      - "set은 값이 글자인 설정이면 명령줄의 글을 그대로, 아니면 JSON으로 읽는다. JSON이 아니면 invalid_input이다"
      - "settings/update를 부른다. lophn agent의 tool call이면 그 tool call id를 싣는다(사람의 허락이 드는 설정이면 core가 그 자리에 승인 카드를 열고 답을 기다린다). 거절(rejected)이면 이유를 실어 invalid_input으로 돌려준다. needs_approval이면 core의 이유(사람이 쓴 거절 이유 포함)를 그대로 forbidden으로 돌려준다"
      - "답에 바꾸기 전 값(previous)과 notes를 싣는다. unset은 고른 값을 지워 기본값으로 돌리고, 항목이면 그 file을 지운다"
      - "agent에게는 home workspace에서만 있는 명령이다. 다른 workspace의 agent는 credential 상한에 settings/update가 없다"
    outcomes:
      - id: changed
        when: "값이 바뀌었다. 켜진 shell이 StateChanged(settings)를 받아 따라 적용한다"
        observe: ["response", "event:StateChanged"]
      - id: unchanged
        when: "같은 값을 set했거나 고른 값이 없는 설정을 unset했다"
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "그런 설정이 없다"
        observe: ["response"]
      - id: locked
        code: forbidden
        when: "사람만 바꾸는 설정이다(명령이 list의 locked로 막거나 route가 agent를 locked로 거절했다)"
        observe: ["response"]
      - id: needs-approval
        code: forbidden
        when: "사람의 허락이 드는 설정(folder.destinations)을 agent가 바꾸려 했는데 사람이 거절했거나, unattended turn·팀 자식이라 막혔거나, 묻는 자리가 없거나(lophn agent turn 밖의 agent credential), 기다림이 끝났다. 아무것도 바뀌지 않는다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "folder key 자체를 주었다, 항목 id가 규칙(소문자·숫자·-)에 안 맞는다, 값이 JSON이 아니다, core가 값을 거절했다(타입, 범위, 뜻 검사, 읽지 못한 같은 이름 file)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "settings/list나 settings/update가 unavailable이다(core가 없다, settings.json을 읽거나 쓰지 못했다)"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/settings.md]

  - id: project-identity-commands
    title: "agent가 명령으로 project의 기계를 넘는 id와 다른 컴퓨터와 맞춰지는 상태를 읽는다"
    actor: agent
    entries: [cli:project.identity]
    uses: [route:projects/identity]
    boundary: [coding-agent-cli-interface, projects]
    code:
      - packages/cli/commands/project.ts
    steps:
      - "project 칸이 없으면 session의 project workspace를 쓴다. Home이거나 session이 없으면(binary) invalid_input이다"
      - "projects/identity를 부르고 summary 한 줄에 id와 맞춰지는 상태(예: pri_... · matched by its repository)를 싣는다. 실패는 route의 오류를 그대로 돌려준다"
    outcomes:
      - id: read
        when: "identity가 상태를 돌려줬다"
        observe: ["response"]
      - id: no-project
        code: invalid_input
        when: "project를 주지 않았고 project workspace의 session도 아니다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/project-identity.md]

  - id: remote-on-command
    title: "사람이 터미널에서 remote를 켠다(화면 없는 기계를 명단에 넣기 전)"
    actor: person
    entries: [cli:remote.on]
    uses: [route:settings/update]
    boundary: [coding-agent-cli, config]
    code: [packages/cli/commands/remote.ts]
    steps:
      - "settings/update로 remote.enabled를 true로 쓴다. relay 설정은 건드리지 않는다. user token이라 locked 설정도 쓴다"
      - "거절(rejected)이 있으면 그 이유를 오류로 낸다"
      - "binary만 부른다(lophn tool에 없다). agent shell은 cli-core-connect:agent-shell에서 막힌다"
    outcomes:
      - id: on
        when: "켰거나 이미 켜져 있었다(changed로 가른다). core가 listener와 relay를 연다"
        observe: ["response", "event:StateChanged"]
      - id: rejected
        code: invalid_input
        when: "settings/update가 값을 거절했다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "settings/update가 unavailable이다(settings.json을 쓰지 못했다)"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/remote.md, architecture/approval.md]

  - id: remote-join-command
    title: "사람이 터미널에서 다른 컴퓨터의 초대장으로 이 컴퓨터를 명단에 넣는다"
    actor: person
    entries: [cli:remote.join]
    uses: [route:roster/join]
    boundary: [coding-agent-cli, remote]
    code: [packages/cli/commands/remote.ts]
    steps:
      - "초대장 글 한 줄과 --no-terminal-input(껐으면 terminal_input false, 기본 켬)을 roster/join에 넘긴다. 켜 두면 초대한 컴퓨터가 이 컴퓨터의 터미널에 칠 수 있다(roster-join, roster-grants). 초대한 컴퓨터가 이 컴퓨터를 허락하는지는 그 컴퓨터가 낸 초대장의 값이다"
      - "pending이면 초대한 컴퓨터에 아직 닿지 못했다고 stderr에 알린다. 그 컴퓨터를 믿는 컴퓨터에 닿거나 폰이 소식을 나르면 끝난다"
      - "거절이면 details.reason(expired, used, untrusted, removed, this_computer, id_taken, key_taken)을 사람이 읽을 글로 바꿔 message에 싣는다. code와 details는 그대로다"
      - "binary만 부른다(lophn tool에 없다). agent shell은 cli-core-connect:agent-shell에서 막힌다. lophn의 터미널 탭 안이면 core에 붙기 전에 거절한다"
    outcomes:
      - id: terminal-tab
        code: forbidden
        when: "lophn의 터미널 탭 안이다(LOPHN_SESSION_ID가 term:으로 시작). 그 탭은 사람 token을 받아 거기서 도는 coding agent와 사람을 가릴 수 없다. core에 붙기 전에 끝나고 Settings › Remote나 lophn 밖의 터미널(SSH)을 말한다"
        observe: ["response"]
      - id: joined
        when: "초대한 컴퓨터에 닿아 서로의 항목에 서명했다"
        observe: ["response"]
      - id: pending
        when: "초대한 컴퓨터에 닿지 못했다. 초대 서명 statement를 들고 기다린다"
        observe: ["response"]
      - id: refused-unauthorized
        code: unauthorized
        when: "초대장이나 서명이 맞지 않거나 issuer를 믿지 못한다(untrusted), 수명이 지났다(expired), 이 컴퓨터가 명단에서 빠졌다(removed)"
        observe: ["response"]
      - id: refused-conflict
        code: conflict
        when: "초대장이 이미 쓰였다(used), 이 컴퓨터가 낸 초대장이다(this_computer), 이 컴퓨터의 id나 key가 다른 기기로 명단에 있다(id_taken, key_taken)"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "초대장 글을 읽지 못했거나 폰 초대장이다"
        observe: ["response"]
      - id: remote-off
        code: unavailable
        when: "remote가 꺼져 있다. lophn remote on을 먼저 한다"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/remote.md]

  - id: remote-invite-command
    title: "사람이 터미널에서 새 폰이나 컴퓨터의 초대장을 낸다"
    actor: person
    entries: [cli:remote.invite]
    uses: [route:roster/invite]
    boundary: [coding-agent-cli, remote]
    code: [packages/cli/commands/remote.ts, packages/cli/main.ts]
    steps:
      - "lophn의 터미널 탭 안이면 core에 붙기 전에 거절한다"
      - "kind, 터미널 입력(기본 켬. 그 초대로 든 기기를 이 컴퓨터가 허락하는가. 다른 컴퓨터는 따로 정한다), 수명(--long이면 7일)으로 roster/invite를 부르고 초대장 한 줄을 stdout에 찍는다(roster-invite)"
    outcomes:
      - id: terminal-tab
        code: forbidden
        when: "lophn의 터미널 탭 안이다(LOPHN_SESSION_ID가 term:으로 시작). 그 탭은 사람 token을 받아 거기서 도는 coding agent와 사람을 가릴 수 없다. core에 붙기 전에 끝나고 Settings › Remote나 lophn 밖의 터미널(SSH)을 말한다"
        observe: ["response"]
      - id: invited
        observe: ["response"]
      - id: refused
        when: "roster/invite가 거절했다(remote 꺼짐 등). 그 오류를 그대로 낸다"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/remote.md]

  - id: remote-remove-command
    title: "사람이 터미널에서 기기를 명단에서 뺀다"
    actor: person
    entries: [cli:remote.remove]
    uses: [route:roster/remove]
    boundary: [coding-agent-cli, remote]
    code: [packages/cli/commands/remote.ts, packages/cli/main.ts]
    steps:
      - "lophn의 터미널 탭 안이면 core에 붙기 전에 거절한다"
      - "dev_ id나 기기 key로 roster/remove를 부른다(roster-remove). 둘 다 아니면 invalid_input이다. 엇갈린 빼기로 빠진 기기는 key로 뺀다"
    outcomes:
      - id: terminal-tab
        code: forbidden
        when: "lophn의 터미널 탭 안이다(LOPHN_SESSION_ID가 term:으로 시작). 그 탭은 사람 token을 받아 거기서 도는 coding agent와 사람을 가릴 수 없다. core에 붙기 전에 끝나고 Settings › Remote나 lophn 밖의 터미널(SSH)을 말한다"
        observe: ["response"]
      - id: removed
        observe: ["response"]
      - id: not-a-device
        code: invalid_input
        when: "dev_ id도 기기 key도 아닌 글이다"
        observe: ["response"]
      - id: refused
        when: "roster/remove가 거절했다(이 컴퓨터 자신, 없는 기기, 두 줄에 맞는 id, remote를 켠 적 없음). 그 오류를 그대로 낸다"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/remote.md]

  - id: remote-terminal-input-command
    title: "사람이 터미널에서 이 컴퓨터가 기기에 터미널 입력을 허락하는지를 켜고 끈다(화면 없는 컴퓨터, 초대 없이 든 컴퓨터)"
    actor: person
    entries: [cli:remote.terminal_input]
    uses: [route:roster/set_terminal_input]
    boundary: [coding-agent-cli, remote]
    code: [packages/cli/commands/remote.ts, packages/cli/main.ts]
    steps:
      - "lophn의 터미널 탭 안이면 core에 붙기 전에 거절한다(그 안의 coding agent가 허락을 켜지 못하게)"
      - "dev_ id로 roster/set_terminal_input을 부른다(--off면 끈다). 이 컴퓨터의 표만 바뀌므로 다른 컴퓨터가 이 컴퓨터를 허락하게 하려면 그 컴퓨터에서 같은 명령을 한다(roster-set-terminal-input)"
    outcomes:
      - id: terminal-tab
        code: forbidden
        when: "lophn의 터미널 탭 안이다(LOPHN_SESSION_ID가 term:으로 시작). 그 탭은 사람 token을 받아 거기서 도는 coding agent와 사람을 가릴 수 없다. core에 붙기 전에 끝나고 Settings › Remote나 lophn 밖의 터미널(SSH)을 말한다"
        observe: ["response"]
      - id: changed
        observe: ["response"]
      - id: not-a-device
        code: invalid_input
        when: "dev_ id가 아닌 글이다"
        observe: ["response"]
      - id: refused
        when: "roster/set_terminal_input이 거절했다(명단에 없는 기기, 이 컴퓨터 자신, remote를 켠 적 없음). 그 오류를 그대로 낸다"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    docs: [architecture/remote.md]

  - id: remote-status-command
    title: "사람이 터미널에서 이 컴퓨터의 remote relay 상태, Hub listening 여부, 정렬된 relay 목록과 피어 컴퓨터 상태를 본다"
    actor: person
    entries: [cli:remote.status]
    uses: [route:remote_relay/status, route:machine/environment, route:machines/list]
    boundary: [coding-agent-cli, remote]
    code: [packages/cli/commands/remote.ts]
    steps:
      - "remote_relay/status, machine/environment, machines/list를 읽어 relay 연결 상태, hub_listening 여부, 정렬된 relay URL 목록(Hub 먼저, fallback 마지막)과 피어 컴퓨터 목록을 출력한다"
    outcomes:
      - id: read
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "세 route 가운데 하나가 unavailable이다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/remote.md]

  - id: remote-devices-command
    title: "사람이 터미널에서 내 기기 명단과 다른 컴퓨터와의 연결 상태를 본다"
    actor: person
    entries: [cli:remote.devices]
    uses: [route:roster/list, route:machines/list]
    boundary: [coding-agent-cli, remote]
    code: [packages/cli/commands/remote.ts]
    steps:
      - "roster/list와 machines/list를 읽는다. 기기마다 id, key, kind, 명단의 이름, os, 터미널 입력(이 컴퓨터가 허락한 기기인가), 이 컴퓨터인지, pending, disputed를 낸다. disputed 줄이 있으면 lophn remote remove <key>로 믿지 않는 쪽을 빼라고 note로 말한다(화면 없는 기계는 여기서만 엇갈림을 푼다)"
      - "이 컴퓨터가 아닌 컴퓨터는 machines/list의 status, update, path를 더한다. 그 목록에 없으면 offline이다"
    outcomes:
      - id: listed
        observe: ["response"]
      - id: disputed
        when: "엇갈린 빼기로 빠진 컴퓨터가 있다. 그 줄이 disputed true이고 stderr note가 lophn remote remove <key>를 말한다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "roster/list나 machines/list가 unavailable이다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/remote.md]

