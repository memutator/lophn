  - id: provider-models-refresh
    title: "provider가 알려 주는 model 목록을 다시 읽는다"
    actor: person
    entries: [route:providers/refresh-models]
    uses: [route:provider-credentials/record-models, route:issuer-requests/take, route:issuer-requests/done]
    boundary: [models]
    code: [packages/core/lophn-agent/providers/model-list.ts, packages/core/lophn-agent/providers/reported-models.ts]
    steps:
      - "입력 모양을 본다. 사람인지 본다(route actors). 목록을 읽는 provider인지 본다: 사용자 정의 provider, 내장 API key provider(anthropic, openai, xai, groq, deepseek, google-gemini, OpenCode Go), 구독 계정(Claude, ChatGPT, project 있는 Antigravity). openrouter와 SuperGrok이면 거절한다"
      - "key나 구독 access token을 읽는다. 사용자 정의 provider는 endpoint와 같은 origin으로만, 내장 provider는 정의의 models_endpoint로만 보낸다. 다른 주소나 key가 없으면 unavailable이다. key는 요청 header에만 두고 오류에는 싣지 않는다. Anthropic은 x-api-key(구독은 Bearer와 oauth beta)와 anthropic-version을 쓴다"
      - "목록 주소(사용자 정의는 endpoint/models, 내장은 정의의 models_endpoint, ChatGPT는 Codex 목록, Antigravity는 project roster, OpenCode Go는 gateway의 OpenAI base 목록)를 발급자 요청 대기열(agent runtime)로 보낸다. Anthropic은 날짜 붙은 id의 alias(날짜 뺀 이름)를 더한다. 내장 OpenAI 꼴 목록에서는 embedding·음성·그림 생성 같은 채팅 밖 model을 빼고 Gemini는 models/ 앞붙임을 뗀다. OpenCode Go는 model마다 `api` 객체가 가리키는 wire만 그 정의의 목록으로 남긴다(api가 없거나 Gemini wire면 버린다)이고 요청은 `User-Agent: lophn`과 Bearer key로 보낸다. 200이 아니거나 JSON·목록 모양이 아니거나 visibility가 list인 model이 하나도 없거나 8초 안에 답이 없으면 unavailable이다"
      - "읽은 뒤 provider를 다시 읽어 최신 revision으로 model 이름과 Codex의 기본·확장 context·output 한도를 record-models에 함께 보낸다. 실패하면 앞 목록·한도를 남기고 그 사이 revision이 바뀌었으면 conflict다"
    outcomes:
      - id: refreshed
        observe: ["request:provider-models", "ledger:provider_credentials", "ledger:providers", "response"]
      - id: not_found
        code: not_found
        when: "provider가 없다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다. model 목록을 읽지 않는 provider다(openrouter, SuperGrok, project 없는 Antigravity, 목록 주소가 없는 정의)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "key가 없다. 목록 주소가 endpoint와 다른 origin이다. 목록을 읽지 못했다(200 아님, 모양 아님, 보이는 model 없음, 발급자 기한 8초). provider를 읽지 못했다. 저장 기록이 conflict가 아닌 이유로 실패했다"
        observe: ["response", "screen:new-settings-providers-connected-empty"]
      - id: conflict
        code: conflict
        when: "목록을 읽는 사이 provider revision이 바뀌어 저장하지 못했다"
        observe: ["response"]
    crosses_process: true
    risk: [secret]
    refs: []
    docs: []
    unclear: []

