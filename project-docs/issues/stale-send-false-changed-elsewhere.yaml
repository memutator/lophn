id: stale-send-false-changed-elsewhere
title: 대화를 다 읽기 전에 보내면 다른 기기가 쓰지 않았어도 "changed on another device"로 거절된다
kind: bug
status: fixed
topic: acp
modules: [packages/shell/renderer, packages/mobile]
now: |
  보내기의 `seen`은 `packages/shell/renderer/conversation/delivery-state.ts`의 `seenOf`가 화면이 가진 대화(`messages`의 user 줄)와 다음 turn 줄, 접수됐지만 아직 대화에 오지 않은 마지막 자기 메시지(`sent`)에서 고른다. 대화 snapshot을 처음 받기 전(창이나 탭을 연 직후, 다른 session으로 바꾼 직후)에는 `thread`가 null이라(`agent-tab-data.ts`) `seen`이 null이 되고, composer는 그때도 보내기를 막지 않는다. 다시 붙거나 다시 읽는 동안에는 앞 snapshot이 남아 null이 되지 않는다. 폰은 `sent`를 늘 null로 넘긴다(`packages/mobile/src/data/hooks.tsx`). core(`packages/core/lophn-agent/session/message-commands.ts`의 `changedElsewhere`)는 `seen`이 null이면 session의 모든 사람 메시지를 다른 기기의 것으로 보아 `conflict`(`changed_elsewhere`)로 거절한다. 자기 메시지도 `sent` 하나만 기억해, 같은 화면이 보낸 둘째 이전 메시지가 아직 안 온 채 다른 화면(같은 창의 다른 탭)에서 보내면 같은 거절이 날 수 있다.
impact: |
  사람이 보는 동작: 다른 기기가 아무것도 쓰지 않았는데 "This conversation changed on another device"가 서고 다시 보내야 한다. 글은 입력칸에 남아 잃지는 않는다. 첫 snapshot이 늦게 오는 느린 연결(다른 기계의 창, 폰)에서 잦다.
fix: |
  - (작음, 추천) 화면이 대화 snapshot을 받기 전에는 보내기를 잠그거나 `seen`을 싣지 않는다(검사 없이 보내기). 잃는 것: 첫 snapshot 전의 보내기는 검사가 없다.
  - (중간) `seen`을 메시지 id 대신 snapshot의 `seq`로 싣고 core가 그 seq 뒤의 다른 기기 사람 메시지만 센다(자기 기기의 메시지는 자격으로 가른다). 잃는 것: route 입력 모양이 바뀐다.
closed: |
  첫 snapshot을 받기 전에는 `seen`을 싣지 않고 core는 `seen`이 없으면 검사하지 않는다. desktop과 폰 둘 다다.
guard: packages/shell/renderer/conversation/delivery-state_test.ts의 `seenOf` 검사
