id: mobile-app
version: 0.23.61
title: 폰 앱 화면을 폰 UI kit으로 지은 native React Native 화면으로 다시 짓고, 컴퓨터가 화면을 내려주던 길을 지운다
modules: [packages/protocol, packages/core/remote, packages/core/main, packages/core/projects, packages/mobile, packages/design, packages/design/native, packages/shell/renderer, tools]
checked: [boundary-catalog]
change: |
  - 폰 화면은 컴퓨터가 내려주는 web 화면(WebView)이 아니라 폰 앱(`packages/mobile`) 안의 native React Native 화면이다. 뼈대는 왼쪽 sidebar(drawer)와 place의 stack이고 아래 tab bar가 없다. 폭 600 이상에 높이 480 이상이면 sidebar가 늘 열려 있고(가로로 든 폰은 낮아서 drawer), 갈 곳은 하나의 `Place`로 말한다. 화면 이동은 React Navigation(native stack, drawer)이다.
  - 화면: Home(session 목록, offline 안내), Search(session, workflow, file, job, agent), Inbox(Now, 앱 새 판 살펴보기, History), 대화(승인·질문·여러 답 질문 card, model·mode·이름 sheet, 파일 diff, 첨부), 새 session, project workspace(session, workflow, file 목록과 글 file 읽기), 앱 workspace(실행 기록, 판), Jobs(켜고 끄기, 놓친 차례 Start now), Agents, Settings(Computers, Appearance의 theme와 글 크기, About의 제품 판), pairing 흐름(Welcome, Scan, 글로 code 넣기, Pairing, Paired의 "Shown as").
  - 폰 UI kit `@lophn/ui-native`(`packages/design/native`)를 더했다. desktop과 같은 token과 `@lophn/i18n` catalog를 쓰고(폰에만 있는 문장은 `mobile.`로 시작하는 key, task별 catalog file), 글 배율(small 0.92, default 1, large 1.12)을 `UiProvider`/`ThemeProvider`가 받는다. 질문 card가 여러 답을 고르는 질문을 받는다. 폰 앱 안의 gallery가 모든 조각을 지어낸 data로 그린다(dev build에서만).
  - data 층: 컴퓨터마다 연결 하나(`CoreSource` 모양) 위에 desktop과 같은 event client, Inbox store, 대화 source를 얹는다. desktop file에서 DOM에 묶인 순수 규칙(workflow 규칙, line diff)을 import가 깨끗한 file로 옮겨 둘이 쓴다. dev build에서 `EXPO_PUBLIC_LOPHN_SAMPLE=1`이면 지어낸 data의 sample 컴퓨터가 목록에 든다. Hermes에 없는 `Intl.Segmenter`, `PluralRules`, `RelativeTimeFormat`은 영어 대체를 한 곳에서 깐다.
  - 연결: 틀린 `watch` 조건(session id가 아닌 문자열)은 보내지 않는다. core가 그 조건에 연결을 닫고 새 연결이 마지막 `watch`를 다시 보내 폰이 offline에 머물렀다. core가 닫은 뒤에도 다시 붙는다.
  - 폰의 route 목록(`REMOTE_ALLOWED_ROUTES`)에 Agents(명함, 프로필 그림, skill), Jobs와 실행 기록, workflow 정의·instance·시작·멈춤, project의 file 내용 검색, 앱 실행 기록·release 기록, `agents/list`를 더했다. 새 route `project_files/list`(폴더 하나의 목록)와 `project_files/read`(글 file, 1 MiB까지)는 project에 등록한 폴더 안만 읽고 폴더 밖 path(`..`, 절대 path, symlink)는 `invalid_input`이다. 기기가 부르는 `jobs/update`는 `{job, enabled}`만 받는다(그 밖의 field는 `forbidden`). "폰은 목록 밖 route를 부르는 단추를 보이지 않는다"는 그대로다.
  - 새 route `devices/unpair`: 기기가 자기 등록만 지운다(input에 id가 없고 기기 자격이 아니면 `forbidden`). 이미 아는 기기 key가 첫 frame으로 `pair`와 유효한 code를 보내면 옛 등록이 새 등록으로 바뀌고(옛 id는 끊긴다) 틀린 code면 옛 등록이 그대로다. `devices/register`는 같은 key에 `conflict`를 내지 않는다. 폰에서 컴퓨터를 지우면 닿을 때 `devices/unpair`로 컴퓨터의 등록도 지우고, 닿지 않으면 폰만 잊고 다음 pairing이 바꾼다.
  - 첨부: 대화의 Add sheet가 Photos(시스템 사진 선택기)와 Camera를 준다. JPEG로 다시 인코딩하고 `message-images/upload`(PNG, JPEG, GIF, WebP, 한 장 5 MiB까지)로 올려 image block에 싣는다. 사진만 있는 message도 보낸다. 새 native module은 `expo-image-picker`다.
  - 지운 것: route `remote_ui/manifest`, `remote_ui/file`과 core의 bundle 계산·내주기, renderer의 `remote` entry(`packages/shell/renderer/remote`)와 `AgentView`의 `phone` host, 설치 묶음의 `platform/remote-ui`, `dev:core`의 renderer build, 폰의 bundle cache·WebView module·bridge, wireframe gallery의 remote 화면 page. `npm run dev:remote`는 개발 core의 remote를 켜고 pairing text(QR에 싣는 JSON)만 찍는다.
  - desktop에서 사람이 보는 것: Settings › Remote의 QR 아래에 "Show as text"가 생겼다(QR에 든 글과 복사 단추. 카메라가 없는 폰이 붙여 넣는다).
  - 폰 앱 폴더는 `mobile/`에서 `packages/mobile`로 옮겼다. root `package.json`의 workspace에서 `!packages/mobile`로 뺐고 check의 deps 단계와 설치 묶음이 이 폴더를 보지 않으며 kit 단계는 `packages/design/native`를 건너뛴다. 폰 앱의 검사는 `cd packages/mobile && npm run typecheck && npm test`다.
why: |
  mobile roadmap 단계 2를 다시 한 것이다. 처음 만든 remote web 화면(계획 `phone-remote-web`, `phone-shell`)은 desktop 대화 화면을 폰 WebView에 그대로 넣어 폰답지 않았다. 사람이 승인한 wireframe대로 폰 화면을 폰 앱 안의 native 화면으로 짓고, 화면을 내려주고 검증해 cache하는 길을 지운다. 화면 아래의 로직은 desktop과 같은 TypeScript를 써 대화 해석을 한 벌로 둔다.
decisions:
  - text: >-
      폰 화면은 web이 아니라 폰 UI kit으로 쓴 native React Native 화면이다. 버린 길: 컴퓨터가 내려주는 web 화면과 폰 WebView(폰답지 않고 bundle cache·hash 검사·WebView·bridge가 폰 껍데기를 무겁게 했다).
    by: person
  - text: >-
      wireframe이 화면의 기준이다. 뼈대는 sidebar이고 아래 tab bar를 두지 않으며 폭 600 이상에서 sidebar가 늘 열려 있다. 어느 폰에서나 맞게 폭 320~430에서 늘고 주는 layout으로 짓는다(등록한 기기에 맞추는 것은 사용자 앱의 규칙이다).
    by: person
  - text: >-
      폰의 권한은 보기, 말하기, 답하기(승인·질문·앱 update), 켜고 끄기, 지금 돌리기, 새 session이다. 만들기·고치기·지우기(agent, job), secret, provider, model 관리는 컴퓨터에서 한다.
    by: person
  - text: >-
      폰 화면 문구는 desktop과 같은 `@lophn/i18n` catalog에서 온다. 폰에만 있는 문장만 `mobile.`로 시작하는 새 key다.
    by: person
  - text: >-
      화면 이동은 React Navigation(native stack과 drawer)이다. 넓은 화면의 고정 sidebar가 들어 있고 비교한 폰 앱이 쓰는 표준이다.
    by: agent
  - text: >-
      화면 아래 로직은 desktop과 같은 TypeScript를 그대로 쓴다. 대화 해석이 한 벌이어야 한다. DOM에 묶여 못 가져오는 순수 규칙은 깨끗한 file로 옮겨 둘이 같이 쓰고, 옮기지 못한 몇 곳은 폰이 베낀다(이슈 `phone-copies-desktop-pure-helpers`).
    by: agent
  - text: >-
      sample 컴퓨터를 dev build에 둔다. 화면 worker와 사람이 core 없이 모양을 보고 동작은 개발 core로 본다.
    by: agent
  - text: >-
      폰이 컴퓨터를 지울 때 `devices/unpair`로 자기 등록을 지우고, 이미 아는 key의 유효한 `pair`는 옛 등록을 바꾼다. 닿지 않을 때 폰만 잊으면 컴퓨터가 그 key를 계속 알아 같은 컴퓨터와 다시 pairing이 "Cannot reach"가 되었다. 버린 길: 컴퓨터에서 먼저 끊게 하기(꺼져 있으면 못 끊는다).
    by: agent
  - text: >-
      첨부는 사진(Photos, Camera)만이고 5 MiB, 그림 네 종류다. desktop과 같은 route와 message 모양을 쓰고, 폰의 file에는 컴퓨터의 path가 없다. 버린 길: 아무 file 첨부(file 고르기 module이 하나 더 들고 route가 없다).
    by: agent
  - text: >-
      폰 UI kit을 SDK part로 올리는 일은 이 계획에서 하지 않는다. SDK 판, `lophn.supported_from`, `migrate-sdk` 메모는 사용자 앱이 kit을 쓰게 되는 단계 6의 계획 `mobile-user-apps`에서 쓴다. kit은 지금 폰 앱 안의 package이고 react-native-web이나 다른 runtime을 고려하지 않는다.
    by: agent
follow_up: |
  - 폰에 아직 없는 것(이슈): 대화의 수식과 mermaid가 code box로 보인다(`phone-conversation-math-mermaid-as-code`), Deny에 이유를 쓰지 못한다(`phone-deny-has-no-reason`), fork·rewind·subagent session 열기가 없다(`phone-conversation-lacks-fork-rewind-subagent`), Inbox의 History가 답한 기록이 아니라 notice 목록이다(`phone-inbox-history-lacks-answers`), folder가 여럿인 project는 첫 folder만 보이고 file 검색이 folder를 가리지 않는다(`phone-project-first-folder-only`).
  - agent 줄의 model은 raw `model_name`이다(desktop Agents 화면도 같다). 이슈로 올리지 않았다.
  - desktop 변경(Settings › Remote의 "Show as text", `AgentView`와 renderer의 폰 길 삭제, `dev:core`)은 type 검사와 test로만 확인했고 Electron 창을 띄워 보지 못했다.
  - 실제 폰에서의 확인(카메라로 QR, 화면 잠금, 알림, release build)은 아직 하지 않았다. emulator와 sample 컴퓨터, 개발 core로만 보았다. iOS build는 없다.
  - 폰 앱이 desktop DOM file에 있는 순수 helper를 몇 개 베껴 쓴다(이슈 `phone-copies-desktop-pure-helpers`).
  - appearance preset `touch`(폰 remote 화면의 밀도)는 이제 쓰는 곳이 gallery뿐이다. `architecture/appearance.md`의 설명과 preset의 쓸모를 정리할 곳이다.
checklist:
  - "Settings › Remote에서 QR 아래 Show as text를 눌러 글과 복사 단추가 나오는지 본다"
  - "폰에 새 dev build를 깔아(`packages/mobile/README.md`) pairing하고 Home, Inbox, 대화 보내기와 사진 붙이기, Jobs 켜고 끄기, project의 file 읽기가 되는지 본다"
  - "폰에서 컴퓨터를 지운 뒤 같은 컴퓨터와 다시 pairing이 되는지, desktop의 기기 목록에서 옛 폰이 사라지는지 본다"
