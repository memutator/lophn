id: nested-harness-session-enters-tab-recent
title: 탭 CLI 안에서 띄운 다른 harness session이 그 탭의 session과 recent에 들어간다
kind: bug
status: open
topic: harness-gui
modules: [packages/shell/main, packages/coding-agent, packages/protocol]
now: |
  탭의 CLI 아래에서 뜬 harness process(Bash tool이나 `!`로 돌린 `claude -p`, 녹화 script)는 `LPN_TERMINAL_HOOK`을 물려받아 hook을 같은 탭으로 보낸다. tracker(`packages/shell/main/terminal/agent/tracker.ts`)는 새 `session_id`를 `/clear`·resume처럼 그 탭의 session으로 받고, `sessionSeen`이 terminal agent session 목록(`<data root>/shell/agent-sessions/<project>.json`, `packages/shell/main/terminal/agent/session-store.ts`)에 적는다. Agent tool subagent는 부모 `session_id`로 hook을 내서 원인이 아니다. 사람이 본 "subagent session"은 `!`로 돌린 Claude 녹화의 session이었다(첫 prompt가 "Use the Agent tool …").
impact: |
  recent가 사람이 연 적 없는 session으로 찬다. 그 session이 도는 동안 탭의 session id가 바뀌어 GUI toggle이 엉뚱한 session을 열 수 있다.
fix: |
  - `lophn hook`이 가장 가까운 harness 조상 process의 pid를 싣고, main은 그 pid가 PTY foreground group(TUI)이나 GUI handle이 띄운 CLI일 때만 받는다. 중간. 추천.
  - Claude만: SessionStart에서 `$CLAUDE_ENV_FILE`에 `unset LPN_TERMINAL_HOOK`을 적어 Bash tool 자식이 물려받지 않게 한다. 작음. SDK mode에서 되는지 확인이 필요하고 다른 harness는 남는다.
  - 녹화 script들이 `LPN_TERMINAL_HOOK`을 지운다. 작음. 본 경우만 막는다.
