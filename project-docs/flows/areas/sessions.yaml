area: sessions
flows:
  # ---- session 수명 (person이 화면에서 부른다) ----
  - id: session-open
    title: "agent와 workspace를 정해 session 하나를 연다"
    actor: person
    entries: [route:sessions/open]
    boundary: [agent-sessions, agents]
    code:
      - packages/core/lophn-agent/session/commands.ts
      - packages/core/lophn-agent/workspaces/lifecycle.ts
      - packages/core/lophn-agent/workspaces/directory.ts
    steps:
      - "사람이 아니면 forbidden이다(requireUser). 같은 id의 session 행이 있는지 본다. 같은 agent와 workspace의 열린 session이면 그 결과를 돌려준다(replay)."
      - "agent 정의를 찾는다. 범위 agent나 lophn은 그 workspace에서만 열고, harness agent면 harness 설정이 켜졌는지 본다."
      - "workspace(project, app)가 있고 보관되지 않았는지 본다. home이면 workspace 없이 연다."
      - "session 행을 넣고 commit 뒤 SessionStarted를 Bus로 낸다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, event:SessionStarted, response]
        when: "새로 열었거나 같은 id를 같은 agent·workspace로 다시 불렀고 그 session이 아직 열려 있다(replay)"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "같은 id가 다른 agent나 workspace로 쓰였거나 archive된 session을 같은 id로 열 때, 또는 workspace가 없거나 보관됐을 때"
        observe: [response]
      - id: not_found
        code: not_found
        when: "agent 정의가 없거나 그 agent의 범위 밖 workspace다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "harness agent인데 harness 설정이 꺼져 있다"
        observe: [response]
    crosses_process: false
    refs: [P3, P7]
    docs: [architecture/workspace-session.md]
    unclear: []

  - id: session-rename
    title: "session 제목을 바꾼다"
    actor: person
    entries: [route:sessions/rename]
    boundary: [agent-sessions]
    code:
      - packages/core/lophn-agent/session/commands.ts
      - packages/core/lophn-agent/session/session-title.ts
    steps:
      - "사람이 아니면 forbidden이다(requireUser). session이 없으면 not_found다."
      - "제목 글을 정리한다(앞뒤 빈칸을 자르고 빈 제목이나 120자 넘는 제목은 invalid_input으로 거절한다)."
      - "같은 제목이면 아무것도 쓰지 않고 이전 결과를 돌려준다. archive된 session도 이름은 바꾼다."
      - "state_seq가 요청과 다르면 conflict다. 같으면 제목과 state_seq를 한 tx에서 고친다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, response]
        when: "제목을 바꿨거나 같은 제목이라 이전 결과다"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "state_seq가 낡았다(session이 그 사이 바뀌었다)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "제목이 비었다(앞뒤 빈칸을 뺀 뒤) 또는 120자를 넘는다"
        observe: [response]
    crosses_process: false
    docs: [architecture/workspace-session.md]
    unclear: []

  - id: session-ai-title
    title: "첫 요청에서 자른 자동 제목을 model이 지은 제목으로 바꾼다"
    actor: system
    entries: [route:sessions/ai-title]
    boundary: [agent-sessions, run-loop]
    code:
      - packages/core/lophn-agent/session/commands.ts
      - packages/core/lophn-agent/run-loop/core-ports.ts
      - packages/core/lophn-agent/prompt-assembly/title.ts
    steps:
      - "session의 첫 turn이 첫 model call과 나란히 그 session model로 제목 call 하나를 한다(organizing, title_summary로 그 turn에 기록). turn은 기다리지 않는다."
      - "답에서 제목 한 줄을 고르지 못하거나 call이 실패하면 아무것도 부르지 않고 자른 자동 제목이 남는다."
      - "runtime(machine)이 아니면 forbidden이다(requireMachine). session이 없으면 not_found다."
      - "제목이 아직 첫 요청에서 자른 자동 제목(expected)일 때만 제목과 state_seq를 고친다. 사람이 그 사이 rename했으면 changed false로 그대로 둔다."
      - "ACP writer가 바뀐 제목을 화면에 낸다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, response]
        when: "제목을 바꿨다(changed true)"
      - id: kept
        observe: [response]
        when: "제목이 이미 자동 제목이 아니거나(사람 rename) 같은 제목이다(changed false)"
      - id: forbidden
        code: forbidden
        when: "machine이 아닌 호출자다(requireMachine)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "expected나 title이 비었거나 120자를 넘는다(schema)"
        observe: [response]
    declared_only: [unauthorized]
    crosses_process: false
    docs: [architecture/workspace-session.md]
    unclear: []

  - id: session-archive
    title: "session을 archive해 더 이상 새 입력을 받지 않게 한다"
    actor: person
    entries: [route:sessions/archive]
    boundary: [agent-sessions, run-loop]
    code:
      - packages/core/lophn-agent/session/commands.ts
      - packages/core/lophn-agent/workspaces/lifecycle.ts
    steps:
      - "부르기 전 앞 단계가 알림 글(receiver_ended)을 blob으로 준비한다. 준비하지 못하면 여기서 unavailable이다."
      - "사람이 아니면 forbidden이다(requireUser). session이 없으면 not_found다. 이미 archive됐으면 이전 결과를 돌려준다."
      - "state_seq가 낡았으면 conflict다. 아니면 lifecycle을 archived로 바꾼다."
      - "같은 tx에서 도는 turn을 interrupted(session_ended)로 닫고, 받은 열린 call은 receiver_ended로 닫는다. 닫은 call의 보낸 쪽이 살아 있는 agent session이면 그 queue에 reply_to가 그 call인 program 알림 하나를 같은 tx로 넣는다(ask call이면 알림 대신 main thread에 알린다)."
      - "commit 뒤 queue를 비우고 SessionEnded(reason archived)를 낸다. 기다리던 turn request와 질문은 같은 tx가 아니라 이 event를 듣는 approvals wiring이 cancelled(session_closed)로 푼다(끝내기 effect의 cancelPendingRequests는 no-op이다). 도던 turn의 agent runtime child에는 Bus의 TurnEnded를 보고 turn_stop이 가서 model 요청을 끊는다."
      - "archive한 session은 기록을 그대로 두고 읽기는 된다. 되살리는 길은 없다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, ledger:turns, ledger:agent_calls, event:SessionEnded, response]
        when: "archive했거나 이미 archive돼 있었다(replay). 받은 열린 call의 보낸 쪽에 알림이 간 경우는 ok-sender-notified다"
      - id: ok-sender-notified
        observe: [ledger:agent_calls, ledger:messages, response]
        when: "archive하며 받은 열린 call을 receiver_ended로 닫았고, 그 보낸 쪽이 살아 있는 agent session이라 알림 하나를 넣었다"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "state_seq가 낡았다, 또는 끝내기 effect가 받은 call을 닫다가 상태 충돌을 돌려줬다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다, 또는 끝내기 effect가 받은 call을 찾지 못했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "알림 글을 blob으로 준비하지 못했다(준비 경로가 없거나 준비가 실패했다)"
        observe: [response]
    crosses_process: true
    refs: [T13, T17]
    docs: [architecture/workspace-session.md]
    unclear: []

  - id: session-delete
    title: "session과 그 대화 기록을 지운다"
    actor: person
    entries: [route:sessions/delete]
    boundary: [agent-sessions, storage]
    code:
      - packages/core/lophn-agent/session/commands.ts
      - packages/core/lophn-agent/session/rewind/mod.ts
    steps:
      - "부르기 전 앞 단계가 알림 글(receiver_ended)을 blob으로 준비한다. 준비하지 못하면 여기서 unavailable이다."
      - "사람이 아니면 forbidden이다(requireUser). session이 없으면 not_found다. state_seq가 낡았으면 conflict다."
      - "archive와 같은 묶음으로 도는 turn을 interrupted로 닫고 받은 call을 receiver_ended로 닫는다. 기다리던 request와 질문은 commit 뒤 SessionEnded를 듣는 approvals wiring이 푼다. 닫은 call의 보낸 쪽이 살아 있는 agent session이면 알림 하나를 넣는다(archive와 같다). 끝내기 effect가 충돌을 돌려주면 그대로 돌려주고 기록을 지우지 않는다."
      - "메시지 본문의 blob 영구 참조를 지우고, 되돌리기 기록과 checkpoint를 지운 뒤 메시지와 turn·model call 기록과 session 행을 지운다. 앱이 보낸 call이 이 session에 남긴 답 글 행(agent_calls)도 같이 지운다. queue 비우기와 SessionEnded(reason deleted)는 commit 뒤에 한다."
      - "되돌릴 수 없다. 지운 내용은 응답에 싣지 않고 지운 시각만 돌려준다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, ledger:messages, ledger:blob_refs, ledger:checkpoints, ledger:turns, event:SessionEnded, response]
        when: "session과 기록을 지웠다. 받은 열린 call의 알림이 간 경우는 ok-sender-notified다"
      - id: ok-sender-notified
        observe: [ledger:agent_calls, ledger:messages, response]
        when: "지우며 받은 열린 call을 receiver_ended로 닫았고, 그 보낸 쪽이 살아 있는 agent session이라 알림 하나를 넣었다"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "state_seq가 낡았다, 또는 끝내기 effect가 받은 call을 닫다가 상태 충돌을 돌려줬다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다, 또는 끝내기 effect가 받은 call을 찾지 못했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "알림 글을 blob으로 준비하지 못했다(준비 경로가 없거나 준비가 실패했다)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    refs: [T13, T17]
    docs: [architecture/workspace-session.md]
    unclear:
      - "지운 session의 이미지 blob과 옛 이미지 파일은 지우지 않는다(workspace-session.md의 알려진 빈틈). 이 flow의 test가 이를 기대하는지 정할 것"

  - id: session-fork
    title: "고른 지점까지의 확정 메시지를 복사해 새 session을 만든다"
    actor: person
    entries: [route:sessions/fork]
    boundary: [agent-sessions]
    code:
      - packages/core/lophn-agent/session/fork.ts
      - packages/core/lophn-agent/workspaces/lifecycle.ts
    steps:
      - "사람이 아니면 forbidden이다(requireUser). 같은 id가 이미 있으면 같은 출처와 지점이면 replay, 아니면 conflict다."
      - "출처 session이 없으면 not_found다. through_seq가 출처의 확정 메시지가 아니면 invalid_input이다."
      - "같은 agent와 workspace로 새 session을 열되 제목과 model 선택은 잇고, skip과 compaction과 대기 request·열린 call·rewind 기록은 가져가지 않는다. 열 수 없으면(agent 정의 없음, workspace 없음·보관, harness 꺼짐) 그 오류를 돌려준다."
      - "rewind가 숨긴 구간을 뺀 메시지를 복사하고 본문과 이미지 blob 참조를 복사본마다 새로 건다. 참조가 원본과 맞지 않으면 거절한다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, ledger:messages, ledger:blob_refs, response]
        when: "새 session과 복사본을 만들었다(response의 copied_messages 수), 또는 같은 id·같은 출처·같은 지점의 재전송이라 처음 결과다"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser), 또는 복사할 본문 참조가 원본과 맞지 않아 blob 등록이 거절됐다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "출처 session이 없거나 새 session의 agent 정의가 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "through_seq가 출처의 확정 메시지가 아니다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "같은 id가 다른 출처나 지점으로 쓰였거나 workspace가 보관됐거나 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "새 session의 agent가 harness인데 harness 설정이 꺼져 있다"
        observe: [response]
    crosses_process: false
    refs: [P3]
    docs: [architecture/workspace-session.md]
    unclear: []

  - id: session-change-model
    title: "session이 쓸 model을 고른다"
    actor: person
    entries: [route:sessions/change-model]
    boundary: [agent-sessions, models]
    code:
      - packages/core/lophn-agent/session/commands.ts
      - packages/core/lophn-agent/session/session-model.ts
    steps:
      - "사람이 아니면 forbidden이다(requireUser). session이 없으면 not_found다. archive된 session이면 conflict다. 같은 선택이면 이전 결과다."
      - "model을 고르면 provider 기록을 확인하고, option 값이 그 model이 선언한 축과 값 안인지 본다. 직접 적은 이름은 catalog에 없어도 저장한다. null이면 agent 기본값으로 돌아간다(검사 없음)."
      - "state_seq가 낡았으면 conflict다. 아니면 model_selection을 바꾸고 고른 model을 picker에 보이게 하고 전역 기본이 비었으면 기본으로 정한다."
      - "바뀐 값은 다음 turn부터 쓴다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, ledger:model_shown, ledger:model_choices, response]
        when: "model 선택을 바꿨거나 같은 선택이라 이전 결과다(같은 선택이면 아무것도 안 쓴다)"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "session이 archive됐거나 state_seq가 낡았다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없거나 provider가 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "고른 option 값이 그 model이 선언한 축과 값 밖이거나, catalog에 없어 축을 모르는 model에 option 값을 골랐다"
        observe: [response]
    crosses_process: false
    docs: [architecture/agent-chat.md]
    unclear: []

  - id: session-change-skip
    title: "session의 skip(허락을 묻지 않는 표시)을 켜거나 끈다"
    actor: person
    entries: [route:sessions/change-skip]
    boundary: [agent-sessions]
    code:
      - packages/core/lophn-agent/session/commands.ts
    steps:
      - "사람이 아니면 forbidden이다(requireUser). session이 없으면 not_found다. archive된 session이면 conflict다. 같은 값이면 이전 결과다."
      - "state_seq가 낡았으면 conflict다. 아니면 sessions.skip과 state_seq를 한 tx에서 고친다."
      - "판정은 approvals 쪽이 한다. 이 flow는 표시만 바꾸고, 도는 turn은 시작할 때 정한 mode를 쓰므로 바뀐 값은 다음 turn부터 닿는다."
    outcomes:
      - id: ok
        observe: [ledger:sessions, response]
        when: "skip 값을 바꿨거나 같은 값이라 이전 결과다"
      - id: forbidden
        code: forbidden
        when: "사람이 아닌 호출자다(requireUser)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "session이 archive됐거나 state_seq가 낡았다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다"
        observe: [response]
    crosses_process: false
    docs: [architecture/approval.md, architecture/workspace-session.md]
    unclear: []

  # ---- compact (요청은 사람, 끝내기는 runtime) ----
  - id: session-compact-request
    title: "session의 이전 대화를 요약해 줄이라고 요청한다"
    actor: person
    entries:
      - route:sessions/request-compact
      - route:sessions/compact-requests
    uses:
      - route:sessions/compact
      - route:sessions/fail-compact
    boundary: [agent-sessions, run-loop]
    code:
      - packages/core/lophn-agent/session/compact.ts
      - packages/core/lophn-agent/session/reads.ts
    steps:
      - "사람이나 runtime(machine)이 요청하면 그 밖의 호출자(agent와 app 포함)는 forbidden이다(requireUserOrMachine). session이 없으면 not_found다. 닫힌 session이면 conflict다."
      - "같은 요청이 열려 있으면 그 request_seq를 돌려준다. 아니면 도는 turn이 자기 session을 Compact하는 경우가 아니면 도는 turn이 끝나기를 요구한다. 요약할 메시지가 없으면 conflict다."
      - "state_seq가 낡았으면 conflict다. 아니면 request를 requested로 넣고 CompactStarted를 낸다."
      - "runtime은 compact-requests를 읽어 요청을 집는다(도는 turn이 있는 session은 빼고 오래된 것부터). 요약 call을 한 뒤 compact나 fail-compact로 끝낸다."
    outcomes:
      - id: ok
        observe: [ledger:session_compact_requests, event:CompactStarted, response]
        when: "요청을 열었다(이미 열린 요청이면 같은 request_seq)"
      - id: listed
        observe: [response]
        when: "runtime이 compact-requests를 읽었다(요청 목록)"
      - id: forbidden
        code: forbidden
        when: "호출자가 사람도 runtime(machine)도 아니다. agent는 자기 session도, app도 요청하지 못한다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "session이 닫혔거나, 도는 turn이 끝나지 않았거나, state_seq가 낡았거나, 요약할 메시지가 없다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 없다"
        observe: [response]
    crosses_process: false
    docs: [architecture/workspace-session.md]
    unclear:
