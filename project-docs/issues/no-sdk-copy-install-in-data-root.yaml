id: no-sdk-copy-install-in-data-root
title: "data root에 sdk 설치 사본과 앱 template을 까는 코드가 없다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/apps]
now: |
  앱 release 준비(`apps/releases/prepare/from-source.ts`)는 `readSdkCopies`(`releases/bundle/lock.ts`)로 `<dataRoot>/sdk/<part>/<version>`의 설치 사본을 읽고, 개발용 import map(`packages/core/apps/packages/template/import-map.ts`의 `devImportMap`)과 blueprint 검사(`apps/blueprint/check.ts`)도 같은 자리를 가리킨다. 그런데 그 자리에 사본을 쓰는 코드가 없다. `apps/packages/install.ts`에는 "지원 소스의 설치 사본", "설치 템플릿을 `<dataRoot>/templates/app/`에 둔다" 같은 주석만 남았고, `installPackage`·`installSupportPackage`·`installTemplate`는 쓰지 않는 export를 지운 cleanup에서 함께 지워졌다(그 전에도 부르는 곳은 test뿐이었다). `scaffoldApp`(`packages/core/apps/packages/template/scaffold.ts`)도 부르는 곳이 없다.
impact: |
  새 data root에서 `lophn-sdk:` 의존을 선언한 앱은 release 준비가 `sdk_not_installed`로 멈춘다. 사람이 앱을 만들어 release할 수 없다. 설치 사본에서 `@lophn/ui/<분류>`가 풀리는지도 core를 띄워서는 확인할 수 없고, 사본을 손으로 깔아 확인해야 한다.

  손으로 깔아 보니 더 필요한 것: `packages/sdk/blueprint`와 `cap-store`가 `../../protocol/…`을 상대 경로로 import해서, 사본만으로는 풀리지 않는다(지워진 `vendor.ts` 설치 쪽이 이것을 `vendor/`로 담았다). `packages/design/deno.json`(`@lophn/ui`)에는 `version`이 없어서 설치 판 `1.0.0`을 어디서 읽을지도 정해야 한다.
fix: |
  - core 기동 때 `packages/sdk/*`와 지원 소스(`packages/design`, wording)를 `packageInstallPath` 자리에 읽기 전용으로 풀고, 앱 template을 `templates/app/`에 둔다(중간). 지워진 `install.ts` 함수를 git 기록에서 되살려 기동 조립에 잇는 것이 가장 짧다. 판(version)은 각 `deno.json`의 `version`을 쓴다. 추천.
  - release 준비가 data root 대신 repo의 `packages/` 소스를 직접 읽는다(작음). read-only 사본과 "release bundle에 굳힌 사본" 격리가 약해진다.
closed: |
  core 기동의 `sdkInstallWiring`(`main/daemon/wiring/sdk-install.ts`, `build`)이 `installSdkCopies`로 `packages/sdk/*` 중 `deno.json`이 있는 것과 `@lophn/ui`·`@lophn/wording`을 `<dataRoot>/sdk/<이름 뒤쪽>/<판>`에 읽기 전용으로 풀고, `installBuiltinTemplate`으로 template을 `templates/app/`에 둔다. 같은 byte면 건드리지 않고 다르면 지우고 다시 쓴다. blueprint·cap-store·cap-problem이 사본 밖을 가리키던 import는 사본 안 `vendor/`로 담고 specifier를 바꾼다. 판은 각 `deno.json`의 `version`이다(`packages/design`·`design/wording`에 `1.0.0`을 더하고 `packages/sdk/cap-store/deno.json`을 만들었다). catalog 등록은 하지 않는다(열린 절 "sdk package가 catalog에 없어…"). 배포판은 `tools/package-linux.ts`가 `packages/`를 `platform/packages`로 복사해 같은 상대 계산이 풀린다.
guard: "packages/core/apps/packages/install_test.ts"
