id: app-project-rename-archive-missing
title: 앱·project 설정에 이름 바꾸기와 보관이 없다
kind: bug
status: fixed
topic: shell
modules: [packages/shell/renderer]
now: |
  보관과 되살리기는 Home 오른쪽 sidebar의 Workspaces panel(`packages/shell/renderer/shell/workspaces-panel.tsx`)에서만 된다. 줄 위 ⋯ menu의 Archive, "Archived N"의 Unarchive다. project 이름은 project 설정 탭 General(`packages/shell/renderer/workspace/project-settings/project-settings-page.tsx`)과 panel의 Details에서 바꾸지만 보관은 없다. 앱 상세(`packages/shell/renderer/app-frame/app-detail/app-detail.tsx`)는 아이콘·폴더·Version·Access·Activity뿐이라 이름도 보관도 없다. core에는 `app.rename`(`packages/protocol/apps/apps.ts`)이 있는데 부르는 화면이 없다.
impact: |
  사람은 그 앱·project 안에서 이름을 바꾸거나 보관하지 못하고, Home으로 가서 숨은 ⋯ menu를 찾아야 한다. 앱 이름은 아예 바꾸지 못한다.
fix: |
  - project 설정 General 맨 아래에 Archive(secondary), 앱 상세 맨 위에 General 칸(이름 바꾸기 `app.rename`, Archive)을 둔다. 지금 들어와 있는 workspace를 보관하면 Home으로 옮긴다. Workspaces panel의 ⋯ menu는 빠른 길로 둔다(작음, renderer와 gallery만).
  - 추천: 이것.
closed: |
  App details에 이름 바꾸기와 보관이, project 설정 General에 보관이 있다.
guard: 없음
