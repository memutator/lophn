area: agents
flows:
  - id: agent-definition-read
    title: 사람이 Agents 목록과 agent 하나의 정의를 읽는다
    actor: person
    entries: [route:agents/list, route:agents/read]
    boundary: [agents, core-api]
    code: [packages/core/lophn-agent/agents/reads.ts, packages/core/lophn-agent/agents/inspect.ts, packages/protocol/lophn-agent/agent-definitions.ts]
    steps:
      - Agents 화면이 agents/list(workspace를 주면 그 범위)나 agents/read(agent 하나)를 부른다
      - core가 정의 file을 읽고 틀린 칸을 항목별 issues로 싣는다. 틀린 file도 목록에 남고 오류로 끊지 않는다
      - 목록은 전역 agent와 그 workspace의 범위 agent를 보이고, lophn은 자기 workspace의 것만 보인다
      - Home의 Agents 탭은 workspace 없이 불러 전역과 모든 workspace의 범위 agent를 한 목록으로 보이고(다른 workspace의 lophn은 화면이 뺀다), 범위 agent는 그 agent 자신의 workspace로 read한다
      - 내장 coding agent(`coding_<harness>`, handle은 harness id)는 `extensions.harness.enabled`가 켜지고 `shell.coding_agents.favorites`에 있을 때만 목록에 선다. file이 없으면 기본 정의다. id로 읽기는 늘 된다
      - file이 없는 lophn의 read는 기본 정의(definition null, hash null)를 준다
    outcomes:
      - id: ok
        observe: [response, "screen:agents-tab-home"]
      - id: agent-not-found
        code: not_found
        when: read에서 agent나 workspace가 없다. agent 자격에게는 보관된 앱 workspace의 agent도 없다
        observe: [response]
      - id: store-unavailable
        code: unavailable
        when: ledger 위치를 모르거나 agent 정의 folder를 읽지 못했다
        observe: [response]
    crosses_process: false
    refs: [H11, P1]
    docs: [architecture/agent-definition.md]

  - id: agent-create
    title: 사람이 agent 정의를 만든다
    actor: person
    entries: [route:agents/create]
    boundary: [agents, core-api]
    code: [packages/core/lophn-agent/agents/commands.ts, packages/core/lophn-agent/agents/validate.ts, packages/core/lophn-agent/agents/definition-file.ts]
    steps:
      - Agents 화면이 정의 전체(handle, name, workspace, profile, runtime 등과 본문)를 agents/create로 보낸다
      - agent 자격이 부르면 mcp_servers, skip, apps, remote_apps, extensions, permissions를 거절하고, 범위는 부른 session의 workspace로 정한다(home이면 전역)
      - 사람이 낸 id가 이미 있으면 거절하고, id가 없으면 core가 새로 정한다
      - checkAgent가 파일 모양, 도구 이름, handle 중복과 예약 이름, 새 handle 모양, 범위 workspace의 존재를 검사한다
      - 통과하면 agents/<id>.md를 쓰고 저장하지 않은 옛 avatar 이미지를 지운다
    outcomes:
      - id: created
        observe: [disk:agents/<id>.md, disk:agents/<id>/avatar.<ext>]
      - id: human-only-field
        code: forbidden
        when: agent 자격이 mcp_servers, skip, apps, remote_apps, extensions, permissions 가운데 하나를 냈다
        observe: [response]
      - id: agent-exists
        code: conflict
        when: 낸 id의 정의가 이미 있다
        observe: [response, "screen:agent-settings-save-conflict"]
      - id: invalid-definition
        code: invalid_input
        when: 파일 모양(malformed, unknown_field, invalid_value, required, not_allowed, reserved_name, duplicate, too_large, unknown)이 틀리다, 도구 이름이 모르는 것이다(lophn 명령·앱 command 이름과 `lophn`도 여기다. custom은 `lophn` tool을 늘 받아 이름으로 고르지 않는다), handle이 다른 agent와 겹치거나 예약 이름이다, 새 handle 모양이 아니다, 없는 workspace다. details.issues에 항목이 든다
        observe: [response, "screen:agent-settings-save-issues"]
      - id: store-unavailable
        code: unavailable
        when: 정의 file이나 ledger 위치를 읽거나 쓰지 못했다
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [G1, P2]
    docs: [architecture/agent-definition.md]
    unclear:
      - agent 자격이 만들 때 부르는 workspace 입력은 무시된다. 옛 정의의 handle 모양(NEW_AGENT_HANDLE)은 만들 때만 본다

  - id: agent-change
    title: 사람이 agent 정의를 고친다
    actor: person
    entries: [route:agents/change]
    boundary: [agents, core-api]
    code: [packages/core/lophn-agent/agents/commands.ts, packages/core/lophn-agent/agents/validate.ts, packages/core/lophn-agent/agents/definition-file.ts]
    steps:
      - 정의 전체와 읽을 때의 hash(compare)를 agents/change로 보낸다
      - hash가 file과 다르면 conflict로 거절한다
      - agent 자격이 mcp_servers, skip, apps, remote_apps, extensions, permissions 가운데 하나를 바꾸면 거절한다
      - lophn의 profile이 고정 값과 다르면 거절한다
      - 정의가 있는 agent의 handle과(lophn 포함) 범위 workspace는 만들 때 정한 값과 같아야 한다
      - checkAgent 뒤 파일 전체를 새 내용으로 쓴다. 쓰지 않은 칸은 지워진다
      - CLI `agent.update`는 agents/list로 handle을 찾고(없으면 not_found), agents/read로 현재 정의와 hash를 받아 보낸 칸만 덮어 합친 뒤 그 hash로 agents/change를 부른다. 틀린 file은 부르지 않고 거절한다
    outcomes:
      - id: saved
        observe: [disk:agents/<id>.md]
      - id: agent-not-found
        code: not_found
        when: agent가 없거나 사람이 만든 agent의 file이 없다. lophn은 그 workspace가 없으면 없다. CLI agent.update는 agents/list에 handle이 없어도 여기다
        observe: [response]
      - id: broken-file
        code: invalid_input
        when: "CLI agent.update만: agents/read가 틀린 칸(issues)을 싣거나 정의가 없는 lophn 밖 agent다. agents/change를 부르지 않고 거절한다(the agent file is broken)"
        observe: [response, "screen:agents-tab-broken", "screen:agent-settings-broken"]
      - id: hash-changed
        code: conflict
        when: 낸 hash가 지금 file의 hash와 다르다
        observe: [response, "screen:agent-settings-save-conflict"]
      - id: human-only-field
        code: forbidden
        when: agent 자격이 사람만 정하는 칸을 바꿨다
        observe: [response]
      - id: lophn-profile
        code: forbidden
        when: lophn의 profile을 고정 값과 다르게 낸다
        observe: [response, "screen:new-agent-editor-lophn"]
      - id: handle-changed
        code: invalid_input
        when: 정의가 있는 agent의 handle을 바꿨다(lophn 포함). 내장 coding agent의 handle·runtime·범위를 바꿔도 여기다
        observe: [response, "screen:agent-settings-agent"]
      - id: workspace-changed
        code: invalid_input
        when: lophn이 아닌 agent의 범위 workspace를 바꿨다
        observe: [response, "screen:agent-settings-agent"]
      - id: invalid-definition
        code: invalid_input
        when: 파일 모양이 틀리다(tools나 skills를 custom이 아닌 정의에 적은 것 포함), 도구 이름이 모르는 것이다, handle이 다른 agent와 겹친다
        observe: [response, "screen:agent-settings-save-issues"]
      - id: store-unavailable
        code: unavailable
        when: 정의 file이나 ledger 위치를 읽거나 쓰지 못했다
        observe: [response]
    crosses_process: false
    risk: [data-loss, permission]
    refs: [G1, P1, P2]
    docs: [architecture/agent-definition.md]
    unclear:
      - protocol/agent-definitions.ts 주석은 lophn의 handle 변경을 forbidden이라 적지만 handler는 invalid_input(not_allowed)이다. 여기서는 코드대로 적었다
      - 옛 정의 file이 틀려 handle을 모르면 handle과 범위 검사를 건너뛴다(고쳐 쓸 수 있게 둔다)

  - id: agent-delete
    title: 사람이 사람이 만든 agent 정의를 지운다
    actor: person
    entries: [route:agents/delete]
    boundary: [agents, core-api]
    code: [packages/core/lophn-agent/agents/commands.ts]
    steps:
      - Agents 화면이 agents/delete를 hash와 함께 보낸다
      - lophn이면 거절한다. lophn은 지울 수 없고 workspace를 지울 때만 정의 file이 지워진다
      - hash가 file과 다르면 conflict로 거절한다
      - 정의 file을 지우고 옛 avatar 이미지를 지운다. app.delete가 같은 tx에서 그 앱 범위 agent를 부를 수 있다(dispatchable)
    outcomes:
      - id: deleted
        observe: [disk:agents/<id>.md, disk:agents/<id>/avatar.<ext>]
      - id: lophn-cannot-delete
        code: forbidden
        when: agent가 lophn이나 내장 coding agent다
        observe: [response, "screen:new-agent-editor-lophn", "screen:agent-settings-home-lophn"]
      - id: agent-not-found
        code: not_found
        when: agent가 없거나 file이 없다
        observe: [response]
      - id: hash-changed
        code: conflict
        when: 낸 hash가 지금 file의 hash와 다르다
        observe: [response, "screen:agent-settings-delete-failed"]
      - id: store-unavailable
        code: unavailable
        when: ledger 위치나 정의 file을 읽거나 지우지 못했다
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [H11, P1]
    docs: [architecture/agent-definition.md]

  - id: agent-card-read
    title: agent가 부를 상대의 명함을 읽는다
    actor: person
    entries: [route:agents/card]
    boundary: [agents, router, core-api]
    code: [packages/core/lophn-agent/agents/card.ts, packages/core/lophn-agent/agents/reads.ts]
    steps:
      - 사람의 agent 편집 화면(workspace/agents)이나 agent(CLI `agent.card`)가 handle(과 필요하면 workspace)로 명함을 읽는다. agent는 workspace를 빼면 자기 session의 workspace다
      - core가 그 workspace에서 보이는 agent를 handle로 찾는다(lophn은 workspace마다 하나, 즐겨찾기 내장 coding agent 포함)
      - 명함에는 쓰는 model(provider 이름, model 이름, 가격. harness runtime은 없다), 답 방식(replies), 기본 lophn과의 차이, 입력 modality와 자기 session에서 부를 수 있는지(callable)를 싣는다. prompt 원문은 싣지 않는다
    outcomes:
      - id: ok
        observe: [response]
      - id: agent-not-found
        code: not_found
        when: 그 workspace에서 보이는 agent가 없다(범위 agent가 밖에서 보이면 없는 것이다). 보관된 앱 workspace의 agent도 없다. message에 모르는 handle과 그 자리에서 부를 수 있는 handle을 싣고, agent의 tool 결과에도 그 message가 간다
        observe: [response]
      - id: file-broken
        code: invalid_input
        when: agent 정의 file이 틀려 명함을 만들 수 없다
        observe: [response, "screen:agents-tab-broken"]
      - id: store-unavailable
        code: unavailable
        when: ledger 위치를 모르거나 agent 정의 folder를 읽지 못했다
        observe: [response]
    crosses_process: false
    refs: [R2]
    docs: [architecture/agent-definition.md]

  - id: agent-profile-image-upload
    title: 사람이 agent의 profile 이미지를 올린다
    actor: person
    entries: [route:profile-images/upload]
    boundary: [agents, core-api]
    code: [packages/core/lophn-agent/agents/profile-asset.ts]
    steps:
      - 편집 화면이 형식(png, jpg, webp), 크기와 바이트를 보낸다
      - core가 선언한 형식, 크기, 길이와 첫 byte의 형식이 모두 맞는지 본다
      - agent를 읽어 lophn이 아닌지 본다
      - 맞으면 agents/<id>/avatar.<ext>를 원자적으로 쓴다. 정의는 바꾸지 않는다. 정의를 저장할 때 profile로 연결된다
    outcomes:
      - id: stored
        observe: [disk:agents/<id>/avatar.<ext>, "screen:agent-settings-image-uploaded"]
      - id: invalid-image
        code: invalid_input
        when: 입력이 틀렸거나, 형식이 png·jpg·webp가 아니거나, 크기가 범위 밖이거나, 선언 길이와 다르거나, 첫 byte가 형식과 다르거나, body를 읽지 못했다
        observe: [response, "screen:agent-settings-image-upload-failed"]
      - id: lophn-profile
        code: forbidden
        when: lophn의 profile은 고정이라 올릴 수 없다
        observe: [response, "screen:new-agent-editor-lophn"]
      - id: agent-not-found
        code: not_found
        when: agent가 없다(정의 읽기의 not_found를 그대로 돌려준다)
        observe: [response]
      - id: store-unavailable
        code: unavailable
        when: 정의를 읽지 못했다(ledger 위치나 정의 folder, 정의 읽기의 unavailable을 그대로 돌려준다)
        observe: [response]
      - id: write-failed
        code: unavailable
        when: 이미지 file을 쓰지 못했다
        observe: [response]
      - id: internal
        code: internal
        when: 정의 읽기 결과의 모양이 틀렸다(우리 코드의 결함)
        observe: [response]
    crosses_process: false
    refs: [P1]
    docs: [architecture/agent-definition.md]

  - id: agent-profile-image-read
    title: 사람이 화면에서 agent의 profile 이미지를 받는다
    actor: person
    entries: [route:profile-images/read]
    boundary: [agents, core-api]
    code: [packages/core/lophn-agent/agents/profile-asset.ts]
    steps:
      - 화면이 agent의 이미지를 file route로 요청한다
      - core가 정의의 profile이 image인지 본다
      - 파일을 읽고 실제 형식(png, jpeg, webp)을 sniff해서 Content-Type으로 준다
    outcomes:
      - id: ok
        observe: [response]
      - id: image-not-found
        code: not_found
        when: agent가 없거나, 정의의 profile이 image가 아니거나, 파일이 없다
        observe: [response]
      - id: lophn-profile
        code: forbidden
        when: lophn의 profile은 고정이라 이미지가 없다
        observe: [response]
      - id: image-unreadable
        code: unavailable
        when: 파일을 읽지 못했거나 저장된 파일이 지원하는 형식이 아니다
        observe: [response]
      - id: store-unavailable
        code: unavailable
        when: 정의를 읽지 못했다(ledger 위치나 정의 folder, 정의 읽기의 unavailable을 그대로 돌려준다)
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: 입력이 schema에 맞지 않다(agent id 꼴이 아니다)
        observe: [response]
      - id: internal
        code: internal
        when: 정의 읽기 결과의 모양이 틀렸다(우리 코드의 결함)
        observe: [response]
    crosses_process: false
    docs: [architecture/agent-definition.md]

  - id: call-send
    title: agent가 다른 session에 일을 맡긴다(call)
    actor: agent
    entries: [route:calls/send]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/router.ts, packages/core/router/commands.ts, packages/core/agent-workspaces/workspace/session-directory.ts, packages/protocol/lophn-agent/calls.ts]
    steps:
      - agent가 lophn call send로 받는 곳(session, 또는 agent handle과 workspace 이름, fallback new), reply(none, result, conversation), body, refs와 dedup(tool call ID)을 보낸다
      - Router가 받는 곳을 푼다. workspace를 뺀 lophn은 부른 쪽 workspace의 lophn이고 다른 agent는 home이다
      - 주소가 안 풀리거나 session이 닫혔거나 workspace가 보관됐으면 주소가 풀린 경우에만 call 행을 failed로 남기고 보낸 쪽에는 state로 돌려준다. 열린 session 주소는 닫혔으면 fallback이 없는 한 새로 열지 않는다
      - call 정책, 팀 규칙, 받는 agent 명함(modality, reply 방식) 순으로 거른다. 거르면 err로 돌려 tx가 되돌아가 행도 새 session도 없다
      - 통과하면 agent_calls에 accepted 행을 쓰고 받는 session의 queue에 봉투를 넣는다. unattended 표시는 call을 따라간다
      - 새 session을 열었으면(agent가 보낸 call) commit 뒤 그 session의 Agent 탭을 host queue에 요청한다(topic router.call-session-opened, harness-team-child-tab)
      - 보낸 쪽은 기다리지 않고 답은 나중에 새 입력으로 온다
    outcomes:
      - id: accepted
        observe: [ledger:agent_calls, event:MessageReceived, response]
        when: 열린 session에 넣었거나 fallback으로 새 session을 열었다
      - id: deduplicated
        observe: [ledger:agent_calls, response]
        when: 같은 보낸 session과 tool call ID의 call이 이미 있다. 새 행과 session을 만들지 않고 그 상태를 돌려준다
      - id: failed-not-found
        observe: [ledger:agent_calls, response]
        when: 받는 이름이나 session을 풀지 못했다(archived 앱 workspace 포함). ok 응답의 state가 failed이고 fail_reason이 not_found다. 주소로 못 푼 것이면 행 없이 ID만 돌려준다
      - id: failed-closed
        observe: [ledger:agent_calls, response]
        when: 주소의 session이 닫혔거나 workspace가 보관됐다. ok 응답의 state가 failed이고 fail_reason이 closed다
      - id: ambiguous-app
        code: invalid_input
        when: 받는 workspace의 앱을 표시 이름으로 적었는데 그 이름의 앱이 여럿이다. 앱은 id, slug, 표시 이름 순으로 풀고 오류에 후보 slug가 실린다. 행도 새 session도 없다
        observe: [response]
      - id: call-policy-refused
        code: forbidden
        when: call 정책(private workspace, workspace 쌍, agent 쌍)이 막는다
        observe: [response]
      - id: team-refused
        code: forbidden
        when: spawned_by가 있는 팀원이 부모, 형제, 자기 자손 밖으로 보냈다
        observe: [response]
      - id: card-refused
        code: invalid_input
        when: 받는 agent 명함의 입력 modality나 답 방식에 없다
        observe: [response]
      - id: harness-off
        code: unavailable
        when: 받는 session이 harness runtime인데 extensions.harness.enabled가 꺼졌다(새 session을 열 때나 입력을 넣을 때)
        observe: [response]
      - id: caller-not-bound
        code: forbidden
        when: agent 자격이 session에 묶이지 않았다(agent:ses_ 꼴이 아님), 또는 agent 호출에 turn 표시가 없다
        observe: [response]
      - id: sender-not-found
        code: not_found
        when: 보낸 session을 Router가 찾지 못했다
        observe: [response]
      - id: router-unwired
        code: unavailable
        when: Router가 아직 연결되지 않았다(기동 중)
        observe: [response]
    crosses_process: false
    refs: [R1, T1, T7, T9, T12, T15]
    docs: [architecture/agent-call.md, architecture/workspace-session.md]
    unclear:
      - 문서는 받는 이름이 여럿이면 invalid_input이라 하나 코드는 이름 조회가 첫 행을 고르거나 not_found로 떨어진다(session-directory.ts, lophn-agent-registration.ts)
      - 받는 session이 archived 앱 workspace일 때 open 결과 not_found는 agent 보낸 쪽에만 적용된다(directory.ts)

  - id: call-reply
    title: agent가 받은 call에 답한다
    actor: agent
    entries: [route:calls/reply]
    pre: [call-send:accepted]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/router.ts, packages/core/router/commands.ts]
    steps:
      - agent가 lophn call reply로 call ID, body, refs와 승인 call이면 allow나 reject를 보낸다
      - Router가 call을 찾고 받은 쪽이거나 conversation의 보낸 쪽인지 본다
      - reply none인 call에는 답하지 못한다. 끝난 call이면 아무것도 쓰지 않고 closed로 돌려준다
      - 팀 자식의 질문이나 승인이면 자식 queue가 아니라 main thread의 짝으로 보낸다(topic router.ask-answered)
      - 보낸 session이 열려 있으면 답을 그 session의 queue에 넣고, result 답이면 call을 done으로 닫는다
    outcomes:
      - id: delivered
        observe: [ledger:agent_calls, event:MessageReceived, response]
        when: 답이 보낸 session의 queue에 들어갔다
      - id: not-delivered
        observe: [ledger:agent_calls, response]
        when: 답을 받을 session이 이미 끝났다. 답은 기록에만 남고 result call은 done이 된다
      - id: closed
        observe: [response]
        when: call이 이미 done, failed, cancelled로 끝났다. 아무것도 쓰지 않는다
      - id: ask-answered
        observe: [ledger:agent_calls, response]
        when: 팀 자식의 질문이나 승인 call에 부모가 답했다. 짝인 request나 질문은 approvals가 푼다
      - id: not-found
        code: not_found
        observe: [response]
      - id: not-a-party
        code: forbidden
        observe: [response]
      - id: caller-not-bound
        code: forbidden
        when: agent 자격이 session에 묶이지 않았다(agent:ses_ 꼴이 아님), 또는 agent 호출에 turn 표시가 없다
        observe: [response]
      - id: takes-no-reply
        code: conflict
        when: call의 reply가 none이다
        observe: [response]
      - id: decision-mismatch
        code: invalid_input
        when: 승인 call에 allow나 reject가 없거나, 질문이나 일반 call에 결정을 실었다
        observe: [response]
      - id: router-unwired
        code: unavailable
        when: Router가 아직 연결되지 않았다(기동 중)
        observe: [response]
    crosses_process: false
    refs: [R2, T4, T11, T18]
    docs: [architecture/agent-call.md]

  - id: call-cancel
    title: 사람이 보낸 call을 취소한다
    actor: person
    entries: [route:calls/cancel]
    pre: [call-send:accepted]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/router.ts, packages/core/router/commands.ts]
    steps:
      - 화면이 call을 취소한다. agent가 lophn call cancel로 같은 route를 부르면 자기가 보낸 call만 된다
      - 끝나지 않은 call을 cancelled로 바꾼다
      - 받은 session(lophn이든 harness든)이 있으면 call_cancelled 알림을 queue에 넣는다(다음 turn 입력)
    outcomes:
      - id: cancelled
        observe: [ledger:agent_calls, event:MessageReceived, response]
      - id: already-ended
        observe: [response]
        when: call이 이미 done, failed, cancelled다. 상태를 그대로 돌려준다
      - id: not-found
        code: not_found
        observe: [response]
      - id: not-your-call
        code: forbidden
        when: agent가 자기가 보내지 않은 call을 취소하려 했다
        observe: [response]
      - id: caller-not-bound
        code: forbidden
        when: agent 자격이 session에 묶이지 않았다(agent:ses_ 꼴이 아님)
        observe: [response]
      - id: notice-failed
        code: conflict
        when: 받은 session의 queue에 call_cancelled 알림을 넣지 못했다(보관된 session 등)
        observe: [response]
      - id: router-unwired
        code: unavailable
        when: Router가 아직 연결되지 않았다(기동 중)
        observe: [response]
    crosses_process: false
    refs: [T18]
    docs: [architecture/agent-call.md]

  - id: call-state-read
    title: 사람이 call 하나의 현재 상태를 읽는다
    actor: person
    entries: [route:calls/read]
    boundary: [router, core-api]
    code: [packages/core/router/reads.ts]
    steps:
      - 화면이 call을 누르면 calls/read로 그때의 상태를 읽는다. 상태 구독은 없다
      - agent 자격은 자기가 보냈거나 받은 call만 읽는다
    outcomes:
      - id: ok
        observe: [response]
      - id: not-found
        code: not_found
        when: call이 없거나 agent가 관계없는 call을 읽었다
        observe: [response]
      - id: internal
        code: internal
        when: call 행을 읽지 못했다(행의 모양이 깨졌다)
        observe: [response]
    crosses_process: false
    refs: [T14]
    docs: [architecture/agent-call.md]

  - id: call-sendable-list
    title: agent가 부를 수 있는 열린 session 목록을 읽는다
    actor: agent
    entries: [route:calls/sendable]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/reads.ts, packages/core/main/daemon/wiring/terminal-agents.ts]
    steps:
      - agent가 session 목록을 tool로 읽는다. 목록은 prompt에 넣지 않는다
      - 팀 member에게는 부모, 형제, 자기 자손만 보인다
      - 자기 자신과 닫힌 session은 빼고, 상태는 running, waiting, idle, unknown으로 준다
      - GUI 탭의 팀원 session은 core(terminal-agents wiring)가 그 탭의 ACP 상태(승인을 기다리면 waiting)와 제목으로 바꿔 내고, 묶인 탭이 없으면 뺀다
    outcomes:
      - id: ok
        observe: [response]
      - id: not-agent
        code: forbidden
        when: agent 자격이 아니다(route가 agent만 받아 dispatch가 먼저 막는다. 여기는 방어 갈래다)
        observe: [response]
      - id: router-unwired
        code: unavailable
        when: Router가 아직 연결되지 않았다(기동 중)
        observe: [response]
    crosses_process: false
    refs: [T7]
    docs: [architecture/agent-call.md]

  - id: team-spawn
    title: agent가 팀원 session을 열고 첫 call을 보낸다
    actor: agent
    entries: [route:team/spawn]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/commands.ts, packages/core/lophn-agent/workspaces/lifecycle.ts, packages/core/lophn-agent/workspaces/directory.ts, packages/protocol/lophn-agent/team.ts]
    steps:
      - agent가 lophn team spawn으로 agent handle, workspace 이름(빼면 자기 workspace), reply(none, result, conversation), --as(peer나 stage, 없으면 peer)와 본문을 보낸다. 본문 앞에는 고정 글(TEAM_MEMBER_PREAMBLE)이 붙는다
      - 팀 상한을 본다. root 아래 열린 자손이 max_members(기본 8) 이상이면 거절한다. 새 자식의 깊이가 max_depth(기본 2)를 넘으면 거절한다
      - 새 session을 spawned_by가 부모인 것으로 열고, 받는 곳 풀기, call 정책, 명함 검사를 call.send와 같게 거친다
      - 거절되면 tx가 되돌아가 session도 call 행도 남지 않는다
      - 성공하면 첫 call을 accepted로 남기고, 같은 workspace의 자식 탭은 commit 뒤 main thread가 --as의 relation으로 연다(topic router.team-spawned)
    outcomes:
      - id: spawned
        observe: [ledger:sessions, ledger:agent_calls, event:SessionStarted, event:MessageReceived, response]
      - id: deduplicated
        observe: [response]
        when: 같은 보낸 session과 dedup의 call이 이미 있다. 새 session을 열지 않고 그 session과 call을 돌려준다
      - id: team-full
        code: conflict
        when: root 아래 열린 자손이 max_members에 찼다
        observe: [response]
      - id: team-too-deep
        code: conflict
        when: 새 자식의 깊이가 max_depth를 넘는다
        observe: [response]
      - id: workspace-closed
        code: conflict
        when: 받을 project나 앱 workspace가 보관됐거나 id가 없다. 보관된 앱 workspace를 agent가 열려 하면 agent-not-found다
        observe: [response]
      - id: agent-not-found
        code: not_found
        when: agent handle이나 workspace 이름을 풀지 못했거나 범위 agent가 그 workspace 밖이다(보관된 앱 workspace 포함)
        observe: [response]
      - id: call-policy-refused
        code: forbidden
        observe: [response]
      - id: card-refused
        code: invalid_input
        observe: [response]
      - id: harness-off
        code: unavailable
        when: 받을 session이 harness runtime인데 extensions.harness.enabled가 꺼졌다
        observe: [response]
      - id: caller-not-bound
        code: forbidden
        when: agent 자격이 session에 묶이지 않았다(agent:ses_ 꼴이 아님), 또는 agent 호출에 turn 표시가 없다
        observe: [response]
      - id: parent-not-found
        code: not_found
        when: 부모(보낸) session을 찾지 못했다
        observe: [response]
      - id: router-unwired
        code: unavailable
        when: Router가 아직 연결되지 않았다(기동 중)
        observe: [response]
    crosses_process: false
    refs: [G4, T15]
    docs: [architecture/agent-call.md, architecture/workspace-session.md]
    unclear:
      - 자식 탭을 여는 쪽(host queue, workspace layout)은 다른 area의 flow다. 여기서는 commit 뒤 일이라고만 적었다

  - id: team-end
    title: agent가 자기 밑의 팀원 session을 끝낸다
    actor: agent
    entries: [route:team/end]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/lophn-agent/session/team-commands.ts, packages/core/lophn-agent/workspaces/lifecycle.ts]
    steps:
      - agent가 lophn team end로 session 하나를 준다
      - core가 대상이 부른 agent의 엄격한 자손인지 본다. 자기, 형제, 부모, 남의 session이면 거절한다
      - 대상과 그 밑의 열린 session을 잎부터 archive처럼 닫는다(도는 turn interrupted, 받은 call receiver_ended, 대기 request cancelled, queue 비움, SessionEnded)
      - 사람의 archive와 달리 자식을 따라 닫는다
    outcomes:
      - id: ended
        observe: [ledger:sessions, event:SessionEnded, ledger:agent_calls, response]
        when: 열린 session이 하나 이상 닫혔다. 응답의 ended에 닫힌 session ID가 잎부터 든다
      - id: already-ended
        observe: [response]
        when: 대상 밑에 열린 session이 없다. ended가 빈 목록이다
      - id: not-descendant
        code: forbidden
        when: 대상이 부른 agent의 엄격한 자손이 아니다(자기, 형제, 부모, 남의 session)
        observe: [response]
      - id: session-not-found
        code: not_found
        observe: [response]
      - id: not-agent
        code: forbidden
        when: agent 자격이 아니다(route가 agent만 받아 dispatch가 먼저 막는다. 여기는 방어 갈래다)
        observe: [response]
      - id: end-failed
        code: unavailable
        when: 닫는 일(turn 멈춤, 받은 call 닫기, 대기 request 취소) 가운데 하나가 오류를 돌려줘 tx가 되돌아갔다. port가 준 code를 그대로 낸다
        observe: [response]
    crosses_process: true
    risk: [permission]
    refs: [G4]
    docs: [architecture/workspace-session.md]

  - id: team-read
    title: agent가 자기 팀(부모, 형제, 자식)을 읽는다
    actor: agent
    entries: [route:team/read]
    boundary: [router, agent-sessions, core-api]
    code: [packages/core/router/reads.ts]
    steps:
      - agent가 lophn team read로 팀을 읽는다
      - 부모, 형제(같은 부모), 자식(열린 것)의 handle, 이름, 설명, runtime, 상태를 주고, 내가 그 팀원에게 보내 답을 받지 못한 call(open_calls)을 싣는다
      - 팀 밖 session은 빈 목록이다
    outcomes:
      - id: ok
        observe: [response]
      - id: session-not-found
        code: not_found
        when: agent 자격의 session을 찾지 못했다
        observe: [response]
      - id: not-agent
        code: forbidden
        when: agent 자격이 아니다(route가 agent만 받아 dispatch가 먼저 막는다. 여기는 방어 갈래다)
        observe: [response]
      - id: router-unwired
        code: unavailable
        when: Router가 아직 연결되지 않았다(기동 중)
        observe: [response]
    crosses_process: false
    refs: [G4]
    docs: [architecture/agent-call.md]

  - id: skills-list-read
    title: 사람이 agent 설정 화면에서 skill 목록을 읽는다
    actor: person
    entries: [route:skills/read]
    boundary: [agent-workspaces, lophn-agent, core-api]
    code: [packages/core/lophn-agent/extensions/skills-handler.ts, packages/protocol/lophn-agent/skill-settings.ts]
    steps:
      - 설정 화면이 전역 목록(workspace 열쇠 home, project id, 앱 id를 주면 그 workspace 층을 더한 목록)을 읽는다
      - 같은 이름은 마지막 층이 덮고, 끈 skill도 enabled false로 남는다
      - 끈 이름은 지금 발견되지 않는 것까지 그대로 돌려준다
    outcomes:
      - id: ok
        observe: [response]
      - id: workspace-not-found
        code: not_found
        when: 열쇠가 project나 앱 id인데 그 workspace가 없다(Home은 늘 있다)
        observe: [response]
      - id: unavailable
        code: unavailable
        when: workspace 설정 file(extensions.json)을 읽지 못했거나 skill 목록을 만들지 못했거나 data root(ledger 위치)를 정하지 못했다
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor 종류가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: false
