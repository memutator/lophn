# lophn — Context Component Registry
#
# 이 저장소에서 일하는 agent에게 주는 context 조각의 목록이다. 조각마다 무엇이고 어디 있고, 누가 쓰고,
# 무엇이 바뀌면 이 조각도 바뀌어야 하는지를 적는다. 조각은 그것을 읽는(tool이면 돌리는) role의 절에 둔다.
#
# 흐름: plan(범위를 catalog ID로) → implement(commit이 path를 바꿈) → changelog(바뀐 module을 판마다)
#       → 이 목록에서 change_reasons가 걸린 조각을 다시 본다.
#
# - roles: 이 저장소의 agent role(planner, lead, worker 등). lophn 제품 안의 agent가 아니다.
# - components: 조각. 첫 role의 절에 둔다.
#   - id: 영어 kebab-case. 파일 전체에서 하나.
#   - kind: 꼴과 실리는 방식. instruction(늘 실리는 지침), skill(작업 종류에 따라 실림), doc(필요할 때 읽는 설명),
#     catalog(ID 목록), record(쌓이고 닫히는 기록), plan(진행 중인 계획), tool(agent가 돌리는 script·CLI·npm script).
#   - roles: 이 조각을 읽는(돌리는) role. 첫 것이 주로 읽는 role이고 그 절에 둔다. 쓰는 쪽이 아니라 읽는 쪽이다.
#     worker는 lead가 넘긴 것(worker-prompt, task-brief)과 거기서 가리키는 것을 읽는다.
#   - path: 저장소 root 기준. 폴더면 끝에 /.
#   - run: tool만. agent가 치는 명령 한 줄.
#   - change_reasons: 이 조각을 바꾸게 만드는 변경. 이 조각이 무엇에 기대어 쓰였는지다.
#     - boundaries: boundary-catalog ID. 이 ID의 코드(module-catalog의 path)나 계약이 바뀌면 이 조각도 바뀌어야 한다.
#     - paths: catalog 밖의 path. 바뀌면 이 조각도 바뀌어야 한다.
#     - note: 위 둘로 못 적는 변경 한 줄(사람의 결정 등).
#     부모 ID는 자식을 포함하지 않는다. 넓게 걸면 늘 걸려서 아무도 보지 않는다.

schema_version: 2

roles:

  - id: all
    description: 이 저장소에서 일하는 모든 agent.

  - id: planner
    description: 사람과 무엇을 할지 정한다. 제품 범위, 이슈의 결정, 로드맵, changelog의 결정, context 유지보수.

  - id: lead
    description: 계획 하나를 task로 나눠 worker에게 맡기고, review해 main에 합치고, 이슈와 상태를 고친다.

  - id: worker
    description: task brief 하나를 받아 코드를 고치고 check를 통과시킨다.

  - id: designer
    description: wireframe gallery와 화면 모양, 화면 문구를 고친다.

  - id: runner
    description: eval experiment나 npm run eval을 돌리고, judge 채점을 item마다 새 subagent에게 시키고, run.md에 사실을 적는다.

  - id: experimenter
    description: eval experiment의 판정을 해석하고 원인을 가르고, 의심스러운 judge 판단을 짚고, 다음 spec 초안을 쓴다.

components:

  # ── all ──

  - id: agents-md
    kind: instruction
    roles: [all]
    description: 모든 작업에 실리는 저장소 지침. 속도, 위협 원칙, 문서 표, 코드 규칙, 사람에게 묻는 것.
    path: AGENTS.md
    change_reasons:
      paths: [package.json, tools/check.ts]
      note: 사람에게 묻는 것, worker model, 끝남 기준이 바뀔 때.

  - id: tool-check
    kind: tool
    roles: [all]
    description: 바뀐 package만 골라 fmt, lint, deps, source, modules, type check, style, kit, shell(fmt, lint, main, main test), test, token 생성물 비교를 돈다. docs(문서 속 path)는 늘 돈다. 끝내기 전에 돌린다. 전체는 check:full.
    path: tools/check.ts
    run: npm run check
    change_reasons:
      paths: [package.json, tools/]
      note: check 단계를 더하거나 뺄 때.

  - id: tool-doctor
    kind: tool
    roles: [all]
    description: 개발 환경을 스스로 진단한다. Node·npm·git·Electron·sandbox, .env, telemetry env, dependency·binary, dev data root·port, core /readyz, 바깥 연결을 보고, --fix로 안전한 것만 고친다.
    path: tools/doctor/
    run: npm run doctor
    change_reasons:
      paths: [package.json, package-lock.json, tools/dev.ts, .env.example]
      note: check 목록이나 fix가 바뀔 때.

  # ── planner ──

  - id: product
    kind: doc
    roles: [planner]
    description: lophn이 무엇이고 무엇이 아닌가.
    path: project-docs/PRODUCT.md
    change_reasons:
      note: 제품 범위나 하지 않는 것이 바뀔 때. 코드 변경으로는 걸지 않는다.

  - id: agent-policy
    kind: doc
    roles: [planner]
    description: lophn 제품 안의 agent와 place, place마다의 책임, session 사이 call과 사람에게 올림의 정책.
    path: project-docs/products/AGENT.md
    change_reasons:
      boundaries: [agents, agent-places, router, workflows, jobs]

  - id: roadmap
    kind: doc
    roles: [planner, lead]
    description: 아직 계획으로 열지 않은 큰 일. 주제 하나에 md 하나.
    path: project-docs/products/roadmap/
    change_reasons:
      note: 큰 일을 계획으로 열거나 버릴 때.

  - id: issues
    kind: record
    roles: [planner, lead]
    description: 열린 bug, defect, mistake. 주제 하나에 파일 하나, 닫은 것은 archived/. 절마다 정할 것·정한 것.
    path: project-docs/issues/
    change_reasons:
      note: 이슈를 찾거나 고치거나 정할 때. 이슈의 modules가 바뀐 module을 가리키면 다시 본다.

  - id: changelog
    kind: record
    roles: [planner, lead]
    description: 판마다 동작이나 계약이 바뀐 것과 결정을 바뀐 module과 함께 남긴 기록.
    path: project-docs/products/change-log/
    change_reasons:
      note: 동작이나 계약이 바뀌는 일, 결정이 있는 일이 끝날 때. append-only라 열린 판에 덧붙이기만 한다.

  - id: boundary-catalog
    kind: catalog
    roles: [planner, lead]
    description: 경계와 공개 계약의 ID. 저장소의 메타데이터 축.
    path: project-docs/boundary-catalog.yaml
    change_reasons:
      paths: [packages/protocol/]
      note: 경계가 생기거나 없어지거나 계약의 정의·제공·사용 쪽이 바뀔 때.

  - id: module-catalog
    kind: catalog
    roles: [planner, lead]
    description: 코드 module path ↔ boundary ID.
    path: project-docs/module-catalog.yaml
    change_reasons:
      note: module 폴더가 생기거나 옮겨질 때. tools/check-modules.ts가 잡는다.

  - id: context-component-registry
    kind: catalog
    roles: [planner]
    description: 이 목록.
    path: project-docs/context-component-registry.yaml
    change_reasons:
      paths: [AGENTS.md, .claude/skills/, project-docs/, tools/]

  - id: tool-check-modules
    kind: tool
    roles: [planner]
    description: boundary-catalog의 ID·참조·칸과 module-catalog의 path·boundary·빠진 폴더를 본다. check의 modules 단계.
    path: tools/check-modules.ts
    run: node tools/check-modules.ts
    change_reasons:
      note: 두 catalog의 꼴이 바뀔 때.

  - id: tool-check-docs
    kind: tool
    roles: [planner]
    description: AGENTS.md, .claude/skills/, project-docs/(change-log, issues/archived, plan/, products/roadmap/ 제외)의 backtick 저장소 path와 이 registry의 path·boundary·role이 있는지 본다. check의 docs 단계.
    path: tools/check-docs.ts
    run: node tools/check-docs.ts
    change_reasons:
      note: 문서나 registry의 꼴이 바뀔 때.

  - id: architecture-layers
    kind: doc
    roles: [planner, lead]
    description: core 층과 import 방향, 그 이유. harness와 feature module의 구분.
    path: project-docs/architecture/layers.md
    change_reasons:
      boundaries: [core, lophn-agent, agent-places, agent-tool-spi]
      paths: [tools/check-deps.ts]
      note: core module이 생기거나 층을 옮길 때.

  - id: architecture-event
    kind: doc
    roles: [planner, lead]
    description: command가 이어서 움직일 일을 같은 tx에서 하고, 기록 event를 events 표에 남기고, agent event와 남지 않는 event를 Bus로 화면에 내는 길.
    path: project-docs/architecture/event.md
    change_reasons:
      boundaries: [events, storage, router, event-stream]

  - id: architecture-approval
    kind: doc
    roles: [planner, lead]
    description: Gate 판정, 사람에게 묻는 request(turn 안, 앱 공유 요청), 할당 저장(agent 정의 파일)과 옮김, 결정의 적용.
    path: project-docs/architecture/approval.md
    change_reasons:
      boundaries: [approvals, agent-tools, agent-places, jobs]
      paths: [packages/core/approvals/share-requests/, packages/core/main/daemon/wiring/assignment-file.ts, packages/core/main/daemon/wiring/share-requests.ts]

  - id: architecture-testing
    kind: doc
    roles: [planner, lead, worker]
    description: test 층 다섯(unit, harness loop·wire, core E2E, provider live), 가짜 셋, tests/support, 앱 길(template 앱, Gateway·coding 역할, e2e:deps), E2E 실행 폴더, 돌리는 때, 시간 예산과 case 고르는 규칙.
    path: project-docs/architecture/testing.md
    change_reasons:
      paths: [tests/support/, tools/check.ts, project-docs/plan/tools/lead/land.sh, package.json]
      boundaries: [app-releases, external-coding-agent, app-runtime]

  - id: architecture-eval
    kind: doc
    roles: [planner, lead, worker]
    description: eval 층. 흐름(runner → 되살리기 → model 붙이기 → t0 → 단계 → 수집 → check·judge → 요약), tests/eval 자리, 지키는 것(real만 model, key, t0 자르기, 요청 body blob, token·tool 수치 규칙, 버전 hash와 registry, 채점 대기와 순서, 비용 상한, 요약과 전체 기록), experiment(commit된 spec, 판정 default@1, trial 정책, variant와 grader, gate, 경고와 진단).
    path: project-docs/architecture/eval.md
    change_reasons:
      paths: [tests/eval/, tests/support/core/]
      boundaries: [agent-tools, agent-places, models]

  - id: architecture-activation
    kind: doc
    roles: [planner, lead]
    description: 앱 release를 켜고 실패하면 되돌리는 길.
    path: project-docs/architecture/activation.md
    change_reasons:
      boundaries: [app-releases, app-runtime, app-data]

  - id: architecture-agent-call
    kind: doc
    roles: [planner, lead]
    description: agent 사이의 부름. 봉투, 받는 곳, 답 방식, 실패.
    path: project-docs/architecture/agent-call.md
    change_reasons:
      boundaries: [router, agent-sessions]

  - id: architecture-app-call
    kind: doc
    roles: [planner, lead]
    description: 사람, agent, 앱, job(program)이 앱의 tool을 부르는 길. command 선언의 public 칸과 skills 칸, 부른 쪽 확인, 줄, 기록, rewind, 앱 log, 공유 skill 읽기(`app.skills`).
    path: project-docs/architecture/app-call.md
    change_reasons:
      boundaries: [app-runtime, app-data, app-capability]
      paths: [packages/protocol/apps/calls/, packages/core/apps/calls/, packages/core/apps/screens/skills.ts, packages/core/apps/releases/public-tools.ts]

  - id: architecture-place-session
    kind: doc
    roles: [planner, lead]
    description: agent가 놓이는 place와 session의 수명, fork, rewind.
    path: project-docs/architecture/place-session.md
    change_reasons:
      boundaries: [agents, agent-places, agent-sessions]

  - id: architecture-run
    kind: doc
    roles: [planner, lead]
    description: 화면 없이 부르는 agent 호출·앱 tool 호출(run)의 기록, 끝을 아는 법, 취소, 켤 때 복구, CLI와 자격.
    path: project-docs/architecture/run.md
    change_reasons:
      boundaries: [runs, agent-sessions, router, coding-agent-cli, coding-agent-cli-interface]

  - id: architecture-workflow
    kind: doc
    roles: [planner, lead]
    description: project에 정의한 workflow의 instance와 줄, 넘기기와 step 입력, 켤 때와 멈춤, PM의 쓰기 범위, workflow artifact와 kit, flow code의 process와 SDK, `workflow.check`.
    path: project-docs/architecture/workflow.md
    change_reasons:
      boundaries: [workflows, router, agent-places, coding-agent-cli]
      paths: [packages/shell/renderer/workflow/, packages/shell/renderer/workspace/kinds/workflow.tsx, packages/shell/renderer/workspace/sidebar/workflow-panel.tsx, packages/shell/renderer/artifact-kit/, packages/core/main/daemon/wiring/workflows.ts, packages/core/main/daemon/wiring/workflows-files.ts, packages/core/main/daemon/wiring/flows.ts, packages/core/main/flow-host/, packages/sdk/flow/]

  - id: architecture-job
    kind: doc
    roles: [planner, lead]
    description: 정해진 때 agent run, tool run, workflow 시작을 돌리는 job과 scheduler. 놓친 차례, 겹침, hold, 서머타임, 만든 agent만 고치기, program caller, 켤 때 복구, job 화면.
    path: project-docs/architecture/job.md
    change_reasons:
      boundaries: [jobs]
      paths: [packages/core/main/daemon/wiring/jobs.ts, packages/core/main/daemon/wiring/jobs-registration.ts, packages/shell/renderer/desktop/jobs/, packages/shell/renderer/workspace/sidebar/job-panel.tsx, packages/shell/renderer/desktop/connection/waiting/cards/job-hold-card.tsx]

  - id: architecture-agent-definition
    kind: doc
    roles: [planner, lead]
    description: agent 정의(할당 칸 포함), prompt 조립, 지침 파일, skill 층과 공유 skill, tool, model.
    path: project-docs/architecture/agent-definition.md
    change_reasons:
      boundaries: [agent-places, agent-tools, run-loop, models, agent-tool-spi]

  - id: architecture-coding-agent
    kind: doc
    roles: [planner, lead]
    description: 사람이 쓰는 coding agent와 lophn을 잇는 CLI, 제품 감지, hook 설치, 공유 skill 사본.
    path: project-docs/architecture/coding-agent.md
    change_reasons:
      boundaries: [coding-agent, coding-agent-cli, coding-agent-harness-api, coding-agent-cli-interface]

  - id: architecture-extension
    kind: doc
    roles: [planner, lead]
    description: 본체와 따로 켜는 기능 묶음. manifest, shell main registry, 설정 extensions.<id>.enabled, ctx, 표시 file로 지우기.
    path: project-docs/architecture/extension.md
    change_reasons:
      boundaries: [extension-host, shell-extension, extension-api]

  - id: architecture-terminal-agent
    kind: doc
    roles: [planner, lead]
    description: 사람이 연 터미널 탭 안에서 도는 coding agent(harness)와 상태를 알아 탭 icon, 점, OS 알림을 내는 층.
    path: project-docs/architecture/terminal-agent.md
    change_reasons:
      boundaries: [coding-agent, coding-agent-cli, coding-agent-cli-interface, shell]

  - id: architecture-annotation
    kind: doc
    roles: [planner, lead]
    description: 앱 화면과 artifact에 남긴 annotation이 그 place의 session에게 가는 길.
    path: project-docs/architecture/annotation.md
    change_reasons:
      boundaries: [sdk]

  - id: architecture-browser-tab
    kind: doc
    roles: [planner, lead]
    description: workspace의 browser 탭이 인터넷 page를 여는 길. navigation·popup·permission·download 규칙, persistent session, bookmark 저장, terminal의 `$BROWSER`·Ctrl/Cmd-click link를 browser 탭으로 넘기는 bridge.
    path: project-docs/architecture/browser-tab.md
    change_reasons:
      boundaries: [shell]

  - id: architecture-keybindings
    kind: doc
    roles: [planner, lead]
    description: desktop 창의 단축키가 OS 전역·main before-input-event·renderer keydown 중 어디서 받혀 command registry의 id로 가는가. 키 삼키기·충돌·해제 규칙, Settings › Keyboard에서 사람이 바꾼 키가 창과 main에 덮이는 길.
    path: project-docs/architecture/keybindings.md
    change_reasons:
      boundaries: [shell]
      paths: [packages/shell/ipc/keybindings.ts, packages/shell/ipc/shortcuts.ts, packages/shell/renderer/commands/, packages/shell/main/desktop/shortcuts.ts, packages/shell/renderer/desktop/settings/keyboard/]

  - id: architecture-observability
    kind: doc
    roles: [planner, lead]
    description: core의 구조화 log·trace·metric이 어디서 생겨 stderr와 OTLP(loopback 수집기)로 가는가, 설정 env, `/healthz`·`/readyz`의 판정, 오류 봉투의 hint·trace_id, SIGUSR2 자원 snapshot, `npm run doctor`의 점검과 `--fix`.
    path: project-docs/architecture/observability.md
    change_reasons:
      boundaries: [diagnostics, server]
      paths: [packages/base/telemetry/, packages/protocol/base/errors.ts, tools/doctor/]

  - id: architecture-agent-chat
    kind: doc
    roles: [planner, lead]
    description: agent chat 화면 셋이 함께 쓰는 길. provider delta가 감독 pipe를 지나 core가 redaction한 live 글로 흐르는 것, model 응답마다 agent message, 멈춘 글 저장, reasoning part, tool 제목, active 시간, markdown·link·highlight 규칙.
    path: project-docs/architecture/agent-chat.md
    change_reasons:
      boundaries: [run-loop, agent-sessions, agent-tools, events, event-stream, child-supervision-protocol, shell, design]

  - id: architecture-acp
    kind: doc
    roles: [planner, lead]
    description: lophn ACP(App Context Protocol)의 모양인 항목, 순번, tool 종류, 갱신, 입력과 순수 reducer, AgentEvent projection, core가 채울 context, reread 조건, redaction이 지나는 길.
    path: project-docs/architecture/acp.md
    change_reasons:
      boundaries: [acp, agent-sessions, run-loop, events, shell]
      paths: [packages/protocol/acp/]

  - id: architecture-artifact
    kind: doc
    roles: [planner, lead]
    description: agent가 그릇(project, 앱)의 `artifacts/<name>/`에 쓴 정적 HTML을 봉한 view의 탭으로 그리는 길. 봉한 scheme의 path 해석, file 범위, 목록과 prompt, 대화 link, artifact annotation의 받는 쪽.
    path: project-docs/architecture/artifact.md
    change_reasons:
      boundaries: [shell, agent-places, agent-sessions, router]

  - id: architecture-workspace-layout
    kind: doc
    roles: [planner, lead]
    description: place 창(Home, project, 앱) 하나의 shell, desk와 split group 모델, 탭 자리(tabs, group, floated, detached), floats 층, `<webview>` 그릇과 native view 층, view 보관, 탭을 OS 창으로 떼고 붙이는 main 중계, place layout 파일(판 8)과 옛 layout 올리기, Settings 틀.
    path: project-docs/architecture/workspace-layout.md
    change_reasons:
      boundaries: [shell]
      paths: [packages/shell/renderer/workspace/model.ts, packages/shell/renderer/shell/desk-model.ts, packages/shell/renderer/shell/layout-source.ts, packages/shell/main/workspace/place-layout.ts, packages/shell/main/workspace/schema.ts, packages/shell/main/browser/view-order.ts, packages/shell/renderer/app-frame/webview-host.tsx, packages/shell/renderer/app-frame/view-keeps.ts, packages/shell/ipc/detached.ts, packages/shell/main/desktop/detached/, packages/shell/renderer/workspace/detached/]

  - id: architecture-ui-kit
    kind: doc
    roles: [planner, lead, designer]
    description: 범용 kit(@lophn/ui)·lophn 전용 부품·app bridge UI(@lophn/app-ui)를 어디 두나, 사용자 앱에 닿는 길, gallery 승인과 kit check.
    path: project-docs/architecture/ui-kit.md
    change_reasons:
      boundaries: [design, design-api, sdk-api, app-releases]
      paths: [tools/wireframes/pages/index.ts, tools/check-kit.ts, packages/core/apps/packages/template/app/package.json.tmpl, packages/core/apps/releases/ui-build/build.ts]
      note: 분류를 더하거나 바꿀 때, 범용·전용을 가르는 기준이 바뀔 때.

  - id: architecture-appearance
    kind: doc
    roles: [planner, lead, designer]
    description: 사람이 고른 accent·배경·글꼴·글자 크기·밀도가 token을 덮어쓰는 CSS로 모든 문서(desktop 창, overlay, 보호 입력 창, 앱 view)에 닿는 길과 Custom 글꼴 이름의 경계.
    path: project-docs/architecture/appearance.md
    change_reasons:
      boundaries: [design, design-api, shell]
      paths: [packages/design/presets.ts, packages/design/appearance.ts, packages/shell/ipc/appearance.ts, packages/core/config/shell-settings.ts]
      note: preset을 더하거나 바꿀 때, 적용 통로(channel, insertCSS 시점)가 바뀔 때.



  - id: skill-planner-persona
    kind: skill
    roles: [planner]
    description: planner의 지침. 사람과 말하기(설명 먼저), 정하기(정할 수 있는 것은 근거로 정함), 계획 열기(roadmap, README, brief, lead 프롬프트), 이슈와 문서에서 지킬 것.
    path: .claude/skills/planner-persona/
    change_reasons:
      paths: [AGENTS.md, project-docs/plan/README.md, .claude/skills/orchestrate/brief-template.md]
      note: 사람과 일하는 방식이나 계획 절차가 바뀔 때.

  - id: skill-wrap-plan
    kind: skill
    roles: [planner]
    description: 계획이 land된 뒤 planner가 끝났는지 확인하고, 다시 볼 context 조각을 찾아 고치고, 이슈와 배운 것을 정리하고, 다음 계획으로 넘기는 절차.
    path: .claude/skills/wrap-plan/
    change_reasons:
      paths: [project-docs/plan/README.md, tools/context-review.ts, project-docs/products/change-log/_template.md]

  - id: tool-context-review
    kind: tool
    roles: [planner]
    description: 바뀐 file에서 module-catalog, boundary, registry의 change_reasons를 따라 다시 볼 context 조각을 이유와 함께 뽑는다. 자기 module이 없는 자식 boundary로 넓힌다. 같은 범위에서 이미 고친 조각은 따로 보인다.
    path: tools/context-review.ts
    run: node tools/context-review.ts --range <git range>
    change_reasons:
      paths: [project-docs/module-catalog.yaml, project-docs/boundary-catalog.yaml]
      note: registry나 catalog의 꼴이 바뀔 때.

  # ── lead ──

  - id: skill-issue
    kind: skill
    roles: [lead, planner]
    description: 이슈를 올리고(코드와 대조, 중복 찾기, 주제와 kind), 정하고(이미 정해진 원칙으로 답이 나오나), 닫고(archived, guard), 회귀를 되살리는 절차.
    path: .claude/skills/issue/
    change_reasons:
      paths: [project-docs/issues/_template.md, AGENTS.md]
      note: 이슈의 꼴이나 정하는 원칙이 바뀔 때.

  - id: skill-orchestrate
    kind: skill
    roles: [lead]
    description: 계획을 worker 여럿에게 나눠 돌리는 lead 절차와 task brief 꼴.
    path: .claude/skills/orchestrate/
    change_reasons:
      paths: [project-docs/plan/tools/]
      note: worker model이나 merge 절차가 바뀔 때.

  - id: plan
    kind: plan
    roles: [lead]
    description: 계획 폴더의 꼴. 계획 하나가 project-docs/plan/<계획>/ 하나이고 그 README(목표, 단위, wave, lead가 할 일)와 status.md를 lead가 읽는다.
    path: project-docs/plan/
    change_reasons:
      note: 계획을 열거나 닫을 때.

  - id: tool-plan-status
    kind: tool
    roles: [lead]
    description: 계획 하나의 task brief를 읽어 상태 표를 만들고, 띄울 수 있는 task(앞 wave merged, 선행 merged, 이 계획과 다른 계획의 running과 소유 안 겹침)를 고른다. N개를 한 번에 고르는 것은 lead/pick.py.
    path: project-docs/plan/tools/status.py
    run: python3 -I project-docs/plan/tools/status.py <계획> build | ready | set <id> <상태>
    change_reasons:
      paths: [.claude/skills/orchestrate/brief-template.md]
      note: brief의 단위·선행·소유 줄 꼴이 바뀔 때.

  - id: tool-lead
    kind: tool
    roles: [lead]
    description: lead worktree 열기(lead.sh, branch plan/<계획>), task worktree 만들기(launch.sh), worker prompt(prompt.py), plan branch로 rebase·check·ff-merge(merge.sh, merge-fix.sh), plan branch를 main에 올리기(land.sh. check:full과 e2e:deps, npm run e2e 뒤), route 중복 검사와 core 두 번 기동(boot.sh).
    path: project-docs/plan/tools/lead/
    run: project-docs/plan/tools/lead/lead.sh <계획> / launch.sh <계획> <id>... / prompt.py <계획> <id> <branch> "<알아 둘 것>" / merge.sh <계획> <id> / land.sh <계획>
    change_reasons:
      paths: [tools/worktree-prep.ts, tools/check.ts]
      note: worker 지침이나 merge 절차가 바뀔 때. skill-orchestrate와 같이 고친다.

  - id: tool-worktree-prep
    kind: tool
    roles: [lead]
    description: 새 worktree가 npm ci 없이 check를 돌게 shell main의 node_modules를 main checkout에서 잇는다.
    path: tools/worktree-prep.ts
    run: node tools/worktree-prep.ts <worktree 경로>
    change_reasons:
      boundaries: [shell]

  - id: tool-e2e
    kind: tool
    roles: [lead, worker]
    description: core E2E. flow마다 core daemon과 child를 띄우고 fake server를 provider로 붙인다. 앱 flow는 template 앱을 제품 길로 띄운다. lead가 새 flow를 10번 연속 돌리고, land.sh가 main에 올리기 전에 돈다. 전체 10분 예산.
    path: tests/e2e/
    run: npm run e2e:deps 한 번 뒤 npm run e2e
    change_reasons:
      boundaries: [server, supervision, models, app-releases, external-coding-agent, app-runtime]
      paths: [tests/support/]

  - id: tool-test-live
    kind: tool
    roles: [lead]
    description: 진짜 Anthropic·OpenAI를 부르는 provider live 시험과, live 전용 root(.dev-data/live/home)에 사람이 저장한 ChatGPT 구독 로그인으로 도는 구독 OAuth 시험. 사람이 key를 주거나 login했을 때만 돈다. 둘 다 없으면 이유를 찍고 0으로 끝난다. LOPHN_LIVE_RECORD=1이면 응답만 tests/fixtures/provider/에 쓰고 사람이 diff를 보고 commit한다.
    path: tests/live/
    run: npm run test:live / npm run test:live:login
    change_reasons:
      boundaries: [models]
      paths: [packages/core/lophn-agent/models/snapshot.json, packages/core/lophn-agent/providers/reported-models.ts]

  - id: tool-eval
    kind: tool
    roles: [planner, lead]
    description: 진짜 model로 판단 case를 돌리는 eval runner와 scorecard. 시나리오마다 재료로 world를 되살리고 real 참가자에게만 model을 붙여 돌린 뒤 program check로 채점하고 judge item은 대기 file로 남겨 eval을 돌리는 agent가 채운다. experiment는 commit된 spec으로 판정을 tests/eval/experiments/<id>/result.json에 쓴다. run 요약은 tests/eval/runs/, scorecard는 tests/eval/scorecards/에 쓰고 commit한다. key가 없으면 재료 hash와 fixture만 확인하고 0으로 끝난다. 사람이 진짜 provider 호출을 허락했을 때만 key로 돈다.
    path: tests/eval/
    run: npm run eval -- (--scenario <id> | --all) [--model m] [--trials N] [--budget usd] / npm run eval:experiment -- <id> [--checkout path] / npm run eval:gate -- <id> / npm run eval:judge -- <run> / npm run eval:scorecard [-- diff <runA> <runB>]
    change_reasons:
      paths: [tests/support/core/, packages/protocol/lophn-agent/]
      note: 읽는 route, call 모양, tool 정의 file, 요청 body blob 배치가 바뀔 때.

  # ── worker ──

  - id: worker-prompt
    kind: instruction
    roles: [worker]
    description: worker를 띄울 때 넘기는 지시문. 작업 위치, 먼저 읽을 것(AGENTS.md, brief), 소유만 고치기, 계약 고치지 않기, test 기준, core 확인과 PID 다루기, commit 규칙, 보고 꼴. lead가 prompt.py로 찍어 그대로 넘긴다.
    path: project-docs/plan/tools/lead/prompt.py
    change_reasons:
      paths: [.claude/skills/orchestrate/SKILL.md, AGENTS.md]
      note: worker에게 지킬 것을 더하거나 뺄 때. orchestrate skill의 "worker에게 꼭 넣을 것" 목록과 같이 고친다.

  - id: task-brief
    kind: plan
    roles: [worker, lead]
    description: worker 하나가 받는 task 하나의 brief. 할 일, 소유, 읽을 것, 계약, 끝남, 보고 꼴. lead가 brief-template대로 쓴다.
    path: project-docs/plan/
    change_reasons:
      paths: [.claude/skills/orchestrate/brief-template.md]
      note: 계획을 열거나 닫을 때.

  - id: skill-write-test
    kind: skill
    roles: [worker]
    description: test를 쓸지 정하는 기준, 모양, check 파이프라인.
    path: .claude/skills/write-test/
    change_reasons:
      paths: [tools/check.ts, package.json]

  - id: tool-check-deps
    kind: tool
    roles: [worker]
    description: package 사이 import, core 층 규칙(module → core/main 금지, 바닥 → 위층 금지, harness → role 층·feature module 금지, role 층 ↔ feature module 금지, feature module 방향과 이름 있는 예외), harness 폴더의 feature module protocol import와 role 이름(남은 file 목록), tool 정의 file의 import 범위, 의존성 판 고정을 본다. check의 deps 단계.
    path: tools/check-deps.ts
    run: npm run check
    change_reasons:
      boundaries: [core, lophn-agent, agent-places, agent-tool-spi]
      note: architecture/layers.md의 규칙이나 예외가 바뀔 때.

  - id: tool-check-source
    kind: tool
    roles: [worker]
    description: 주석과 test 이름의 요구 ID, task 번호, TODO·FIXME, 옛 말, core main graph의 bare fetch(`EXTERNAL_FETCH`), shell이 문자열로 부르는 route 가운데 `SHELL_ROUTES`에 없는 것(`SHELL_ROUTE`)을 잡는다. check의 source 단계.
    path: tools/check-source.ts
    run: npm run check
    change_reasons:
      paths: [packages/shell/main/desktop/core/routes.ts]
      note: 쓰지 않기로 한 말이나 꼴이 늘 때. shell이 core route를 부르는 꼴이 바뀔 때.

  - id: tool-dev
    kind: tool
    roles: [worker, designer]
    description: 개발용 실행. core와 shell을 같이, core만, 또는 mock source로 shell만 띄운다. data root는 .dev-data/.
    path: tools/dev.ts
    run: npm run dev / npm run dev:core / npm run dev:mock
    change_reasons:
      boundaries: [core, shell]

  - id: tests-support
    kind: tool
    roles: [worker]
    description: test의 띄우기와 연결. loop(scripted model), wire(녹화 재생 fetch), fake-server(core E2E와 dev의 provider, 함수 대답과 줄), core(daemon을 pipe로 띄우기, session helper, 묻게 하는 shell 명령), gateway(shell의 Gateway 역할), app(template 앱을 App Engineer의 release 길로 띄우기, patch, e2e:deps), fake-oauth(발급자), annotation. flow의 단계는 test file에 쓴다.
    path: tests/support/
    run: test file이 import한다(직접 돌리지 않는다)
    change_reasons:
      boundaries: [run-loop, models, server, supervision, app-releases, external-coding-agent, app-runtime]

  - id: tool-move-files
    kind: tool
    roles: [worker]
    description: mapping대로 파일과 폴더를 옮기고 옮긴 자리를 가리키는 import와 설정 경로를 고친다. 리팩터링에서 module을 옮길 때.
    path: tools/move-files.ts
    run: node tools/move-files.ts <mapping.json> [--dry-run]
    change_reasons:
      note: import나 설정 경로의 꼴이 바뀔 때.

  - id: tool-package-linux
    kind: tool
    roles: [worker]
    description: Linux .deb 설치 묶음을 만들고(package-linux.ts), 설치된 묶음을 실제로 확인한다(verify-linux-install.ts).
    path: tools/package-linux.ts
    run: node tools/package-linux.ts / node tools/verify-linux-install.ts
    change_reasons:
      boundaries: [shell, core, coding-agent-cli]

  - id: tool-models-snapshot
    kind: tool
    roles: [worker]
    description: 판을 낼 때 models.dev api.json을 실행 때 갱신과 같은 변환(modelsDevEntries)으로 바꿔 동봉 model catalog snapshot을 새로 쓴다. models.dev에 없는 정의의 항목은 옮긴다.
    path: tools/models-snapshot.ts
    run: node tools/models-snapshot.ts [--from <api.json>]
    change_reasons:
      boundaries: [models]

  # ── runner ──

  - id: skill-eval-run
    kind: skill
    roles: [runner]
    description: eval CLI를 돌리고 진행을 보고, judge 채점을 새 subagent(haiku-xhigh)에게 시켜 넣고, 멈춘 run을 알아채고, run.md를 쓰는 절차.
    path: .claude/skills/eval-run/
    change_reasons:
      paths: [tests/eval/run.ts, package.json, tests/eval/experiment/spec/types.ts]
      note: eval CLI의 인자, stdout 줄, 채점 절차가 바뀔 때.

  # ── experimenter ──

  - id: skill-eval-experiment
    kind: skill
    roles: [experimenter]
    description: experiment 판정을 해석하고 떨어진 trial의 원인(model, 제품, judge)을 가르고, 의심스러운 judge 판단을 적고, 다음 spec 초안을 쓰는 절차와 report.md 꼴.
    path: .claude/skills/eval-experiment/
    change_reasons:
      paths: [tests/eval/run.ts, package.json, tests/eval/experiment/spec/types.ts]
      note: 판정 규칙이나 result.json의 칸이 바뀔 때.

  # ── designer ──

  - id: skill-ui-design
    kind: skill
    roles: [designer]
    description: wireframe gallery(Kit·Screens·Drafts)와 화면 모양을 고치는 절차, component를 어디 두나, 모든 화면의 규칙.
    path: .claude/skills/ui-design/
    change_reasons:
      boundaries: [shell, design, design-api]
      paths: [tools/wireframes/, tools/check-kit.ts]

  - id: tool-wireframes
    kind: tool
    roles: [designer]
    description: wireframe gallery를 build한다. Kit 묶음은 design component를 분류별로, Screens는 renderer 화면을, Drafts는 승인 전 실험을 그린다. 화면 task의 본보기가 여기서 나온다.
    path: tools/wireframes/
    run: npm run wireframes
    change_reasons:
      boundaries: [design, shell]
      paths: [tools/check-kit.ts]

