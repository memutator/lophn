  - id: quick-launch-edit
    title: "빠른 실행의 순서, 끈 단추, 고정 앱 panel을 고친다"
    actor: person
    entries: [ui:quick-launch-edit]
    when: "Project settings의 Quick launch 편집(위아래 순서, Switch로 끄기, App panels 고정), Settings의 Quick launch 줄"
    boundary: [shell, core-api]
    code:
      - packages/shell/renderer/workspace/project-settings/quick-launch-editor.tsx
      - packages/shell/renderer/workspace/project-settings/quick-launch.ts
      - packages/shell/renderer/desktop/settings/quick-launch/core-source.ts
    steps:
      - "project 창은 그 project의 layout quick에 순서, 고정, 끈 단추를 쓴다. 전역 값을 따르면 quick을 지운다"
      - "앱 panel 고정은 20개 상한(PINS_MAX)이면 바꾸지 않는다. 명령 추가는 20개(COMMANDS_MAX)이거나 입력이 비었으면 아무 일도 없다"
      - "Settings에서 바꾸면 settings/update로 전역 shell.quick_launch 같은 선언 설정을 쓴다(project 빠른 실행은 layout quick에 쓰므로 이 route를 안 탄다). 쓰기는 먼저 화면에 반영하고 거절되면 다시 읽는다"
      - "Coding agents 즐겨찾기와 명령어는 Settings 표로 같은 설정 쓰기를 탄다"
    uses: [route:settings/update, ipc:shell:workspace-layout-save]
    outcomes:
      - id: saved-project
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: saved-global
        observe: ["disk:<data>/settings.json"]
      - id: unchanged
        when: "앱 panel 고정 20개 상한, 명령 20개 상한, 명령 입력이 비었다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: rejected
        when: "settings/update가 값을 거절했다(route는 ok로 돌려주고 reason unknown_key, wrong_type, out_of_range, invalid_value 가운데 하나다). 아무것도 쓰지 않고 화면은 다시 읽는다"
        observe: ["disk:<data>/settings.json (변화 없음)"]
      - id: settings-unavailable
        code: unavailable
        when: "settings/update가 설정 파일을 읽거나 쓰지 못했다. 화면은 다시 읽는다"
        observe: ["disk:<data>/settings.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "project layout을 main이 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  # ---- sidebar ----
  - id: sidebar-toggle-left
    title: "왼쪽 sidebar를 접거나 편다"
    actor: person
    entries: [ui:sidebar-toggle-left]
    when: "왼쪽 sidebar 접기 단추, sidebar.toggle 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/shell-frame.tsx
      - packages/shell/renderer/shell/left-sidebar.tsx
    steps:
      - "useSidebarOpen이 열림을 바꾸고 localStorage lophn.shell.sidebar-open.left 하나에 쓴다. workspace와 Settings가 같이 쓴다"
    outcomes:
      - id: opened
        observe: ["screen:shell-left-sidebar"]
      - id: collapsed
        observe: ["screen:shell-collapsed"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: sidebar-toggle-right
    title: "오른쪽 sidebar를 접거나 편다"
    actor: person
    entries: [ui:sidebar-toggle-right]
    when: "오른쪽 sidebar 단추, sidebar.toggle-right 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/shell-frame.tsx
      - packages/shell/renderer/shell/right-sidebar.tsx
    steps:
      - "setRightOpen이 열림을 바꾸고 workspace마다 lophn.shell.sidebar-open.right.<workspace key>에 쓴다"
    outcomes:
      - id: opened
        observe: ["screen:shell-project"]
      - id: collapsed
        observe: ["screen:shell-collapsed"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: explorer-focus
    title: "Files panel을 고르고 Explorer에 focus를 준다"
    actor: person
    entries: [ui:explorer-focus]
    when: "explorer.focus 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/workspace/sidebar/explorer.tsx
    steps:
      - "project 창이면 panel을 explorer로 고르고 오른쪽 sidebar를 열고, 폴더가 있으면 Explorer에 focus를 요청한다"
      - "Home에는 project가 없어 아무것도 하지 않는다"
    outcomes:
      - id: focused
        observe: ["screen:shell-project"]
      - id: none
        when: "Home 창이다(project 없음)"
        observe: ["screen:shell-workspaces-panel"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: workspace-switch
    title: "왼쪽 sidebar에서 다른 workspace로 간다"
    actor: person
    entries: [ui:workspace-switch, ui:home-open]
    when: "왼쪽 sidebar의 Workspaces 줄(project, 앱, Home)을 누르거나 home.open 키(Home)"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/left-sidebar.tsx
      - packages/shell/renderer/workspace/sidebar/workspace-left-sidebar.tsx
      - packages/shell/renderer/desktop/main.tsx
    steps:
      - "openWorkspace가 setRoute(openProject, openApp, Home)로 바꾸면 WorkspaceWindow가 그 key로 다시 mount된다"
      - "새 창은 그 workspace의 layout을 layout-restore로 읽는다. 지금 창의 layout은 commit마다 이미 저장돼 있다"
      - "떠나는 workspace의 detached 창은 조용히 닫힌다(detached-close-silent)"
    uses: [ipc:shell:workspace-layout-read]
    outcomes:
      - id: to-project
        observe: ["screen:shell-project"]
      - id: to-app
        observe: ["screen:app-space"]
      - id: to-home
        observe: ["screen:shell-workspaces-panel"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: sidebar-session-open
    title: "왼쪽 sidebar의 session, 터미널, workflow 줄을 연다"
    actor: person
    entries: [ui:sidebar-session-open]
    when: "왼쪽 sidebar의 session 줄, 터미널 줄, draft 줄, workflow 줄을 누른다"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/sidebar/workspace-left-sidebar.tsx
      - packages/shell/renderer/shell/left-sidebar-model.ts
    steps:
      - "이 workspace의 session이면 openSessionTab이 agent 탭을 연다. 이미 있으면 고른다. session이나 agent 목록을 모르면 열지 않는다"
      - "draft 줄이면 그 탭을 고르고, 터미널 줄이면 터미널 탭을 연다(terminal-tab-focus와 같은 길)"
      - "다른 workspace의 session이나 터미널이면 showTerminalAt이 그 workspace의 저장된 layout에서 탭을 골라 두고 그 workspace로 간다. layout을 못 읽었거나 탭이 없으면 저장 없이 그 workspace로만 간다"
    uses: [ipc:shell:workspace-layout-save, ipc:shell:workspace-layout-read]
    outcomes:
      - id: tab-opened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: tab-selected
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: workspace-moved
        observe: ["disk:<data>/shell/workspaces/<other workspace>.json"]
      - id: workspace-moved-only
        when: "다른 workspace의 layout을 못 읽었거나 그 탭이 없다. 저장 없이 그 workspace로만 간다"
        observe: ["disk:<data>/shell/workspaces/<other workspace>.json (변화 없음)"]
      - id: unavailable
        when: "session이나 agent 목록을 아직 몰라 openSessionTab이 열지 않았다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "탭을 연 layout을 main이 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md, architecture/workspace-session.md]

  - id: sidebar-session-stop
    title: "current 줄의 session을 Stop으로 내린다"
    actor: person
    entries: [ui:sidebar-session-stop]
    when: "왼쪽 sidebar current 줄 오른쪽 x(hover나 focus 때 보임)"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/sidebar/workspace-left-sidebar.tsx
      - packages/shell/renderer/shell/left-sidebar.tsx
    steps:
      - "lophn session이면 source.stopSession으로 도는 turn을 멈춘다(sessions 쪽 flow). source가 없거나 멈추지 못하면 탭을 남긴다"
      - "이 workspace의 탭이면 onCloseTab으로 닫고, 다른 workspace면 그 workspace의 저장된 layout에서 agent 탭을 뺀다(editTabAt). layout을 못 읽으면 그대로 둔다"
      - "터미널은 이 workspace면 탭 닫기처럼 확인을 묻고, 다른 workspace면 PTY store로 닫은 뒤 저장된 layout에서 뺀다. PTY를 못 닫으면 탭을 남긴다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: closed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: closed-elsewhere
        observe: ["disk:<data>/shell/workspaces/<other workspace>.json"]
      - id: kept
        when: "stopSession이 source 없이 실패했거나 멈추지 못했다, 터미널 종료를 확인받지 못했다, 다른 workspace의 layout을 못 읽었다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "이 workspace의 layout을 main이 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "stopSession이 실패할 때 돌아오는 code는 sessions 쪽 route를 보고 맞춘다. 여기서는 code를 비웠다"

  - id: sidebar-recent-hide
    title: "Recent 줄을 목록에서 뺀다"
    actor: person
    entries: [ui:sidebar-recent-hide]
    when: "왼쪽 sidebar Recent 줄의 x"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/sidebar/hidden-recent.ts
    steps:
      - "그 session을 7일 동안 Recent에서 뺀다. project별 localStorage에 쓴다"
      - "그 session이 움직이면 다시 나온다"
    outcomes:
      - id: hidden
        observe: ["screen:shell-left-sidebar"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  # ---- 탭 메뉴의 pane 밖 동작은 위의 flow에 있다. 여기는 이동 기록 ----
  - id: nav-trail
    title: "이동 기록을 따라 앞이나 뒤의 자리로 간다"
    actor: person
    entries: [ui:nav-back, ui:nav-forward]
    when: "card 머리의 ← → 단추, nav.back, nav.forward 키(갈 자리가 있을 때만 키가 받는다)"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/content-card.tsx
    steps:
      - "이동 기록(창 메모리, 최대 50개)에서 앞이나 뒤의 자리(desk, 고른 칸, focus)를 고른다"
      - "지운 탭이나 desk의 자리는 건너뛴다. 걷는 동안에는 기록에 새로 쌓지 않는다"
      - "walk가 desk를 바꾸고 탭을 고른 뒤 commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: walked
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: unchanged
        when: "건너갈 수 있는 자리가 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]
    unclear:
      - "이동 기록은 owns 목록에 없는 mechanism이다. keys area가 nav.back, nav.forward를 붙일 곳이 없어 여기 두었다. lead가 owner를 정한다"

  # ---- 단축키가 여는 화면 (keys area가 쓴다) ----
  - id: palette-open
    title: "창 팔레트를 연다(명령, 탭, 파일, bookmark 검색)"
    actor: person
    entries: [ui:palette-open]
    when: "palette.open 키(Ctrl/Cmd+K). 상단 바의 팔레트 단추도 같은 열기다"
    boundary: [shell]
    code:
      - packages/shell/renderer/desktop/palette/host.tsx
      - packages/shell/renderer/desktop/palette/session.ts
      - packages/shell/ipc/keybindings.ts
      - packages/shell/main/desktop/wiring/desktop.ts
    steps:
      - "main이 palette.open을 모든 OS에서 먼저 받아 shell renderer로 보낸다(terminal 안에서도 열리게)"
      - "host의 palette.open 처리기가 hub.toggle을 부른다. 팔레트가 열려 있으면 닫고, 닫혀 있으면 창의 scope(작업대 scope)가 있을 때만 연다"
      - "paletteOpener가 scope의 탭, 파일, bookmark, 동작 목록으로 model을 만들고 overlay(별도 view)를 연다. 검색어는 debounce 뒤 scope.search로 찾는다"
      - "고른 항목은 scope.choose로 간다(그 흐름은 각 대상 flow가 맡는다)"
    outcomes:
      - id: opened
        observe: ["process:overlay-view", "screen:browser-palette-bookmark"]
      - id: closed
        when: "이미 열려 있어 다시 누르면 닫는다"
        observe: ["process:overlay-view (닫힘)"]
      - id: no-scope
        when: "팔레트는 있지만 이 창에 scope가 없다(열린 것도 없다). 아무 일도 없다"
        observe: ["process:overlay-view (변화 없음)"]
      - id: unavailable
        when: "이 창에 팔레트 통로가 없다(hub 없음). 명령이 올라가지 않아 키가 아무 일도 하지 않는다"
        observe: ["process:overlay-view (변화 없음)"]
      - id: open-failed
        when: "overlay 열기가 실패해 세션을 버린다"
        observe: ["process:overlay-view (변화 없음)"]
    crosses_process: true
    docs: [architecture/keybindings.md]
    unclear:
      - "팔레트 전용 wireframe frame이 없어 browser-palette-bookmark 화면을 빌렸다. keys area가 frame을 정하면 바꾼다"
      - "keys area가 소유하는 key 판정과 main이 먼저 받는 경로는 keys 쪽 flow가 맡는다. 여기는 열기와 닫기까지다"

  - id: files-quick-open
    title: "파일 빠른 열기(팔레트를 파일 검색으로 연다)"
    actor: person
    entries: [ui:files-quick-open]
    when: "files.quick-open 키(Ctrl/Cmd+P). workspace 창이 있을 때 키가 받는다"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/desktop/palette/host.tsx
      - packages/shell/renderer/desktop/palette/workspace-scope.ts
    steps:
      - "workspace 창의 files.quick-open 처리기가 useOpenPalette를 부른다. palette.open과 같은 hub.toggle이라 같은 팔레트를 연다"
      - "작업대 scope의 파일 목록(loaded.files)과 project 검색(scope.search)이 뜬다. 입력한 파일 이름을 고르면 document 대상으로 간다"
      - "팔레트를 열 scope가 없거나 통로가 없으면 아무 일도 없다"
    outcomes:
      - id: opened
        observe: ["process:overlay-view", "screen:browser-palette-bookmark", "screen:new-file-open-path"]
      - id: closed
        when: "이미 팔레트가 열려 있어 다시 누르면 닫는다"
        observe: ["process:overlay-view (닫힘)"]
      - id: no-scope
        when: "팔레트는 있지만 열 scope가 없다. 아무 일도 없다"
        observe: ["process:overlay-view (변화 없음)"]
      - id: unavailable
        when: "이 창에 팔레트 통로가 없다(hub 없음)"
        observe: ["process:overlay-view (변화 없음)"]
    crosses_process: true
    docs: [architecture/keybindings.md]
    unclear:
      - "files.quick-open과 palette.open은 같은 팔레트를 연다. 파일 전용 모드가 없어 둘의 차이는 키와 설명 문구뿐이다. keys area가 정한다"
      - "파일을 고른 뒤 여는 흐름은 document-tab-new나 tab 열기 flow의 openFile이 맡는다"

  - id: settings-open
    title: "Settings 화면을 연다"
    actor: person
    entries: [ui:settings-open]
    when: "settings.open 키(Ctrl/Cmd+,). workspace 창이 있을 때 키가 받는다. 팔레트의 Settings 동작도 같은 길이다"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/desktop/main.tsx
      - packages/shell/renderer/desktop/router.ts
    steps:
      - "workspace 창의 settings.open 처리기가 onSettings()를 부른다(pane 없음)"
      - "main의 settingsSpace가 지금 route가 Settings가 아니면 돌아갈 자리(beforeSettings)를 기억하고, Settings route(기본 pane)로 바꾼다"
      - "이미 Settings면 같은 route를 다시 세운다(pane은 기본 값으로 돌아갈 수 있다)"
    outcomes:
      - id: opened
        observe: ["screen:new-settings-general", "screen:new-settings-back"]
      - id: reopened
        when: "이미 Settings 화면이다. 같은 route를 다시 세운다"
        observe: ["screen:new-settings-general"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]
    unclear:
      - "기본 pane을 new-settings-general frame으로 적었다. Settings의 기본 pane 값을 코드로 확인이 필요하다"
      - "돌아가는 길(Settings를 닫아 beforeSettings로 가기)은 shell-desktop 또는 settings 쪽 flow가 맡는다"

