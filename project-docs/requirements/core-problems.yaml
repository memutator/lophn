schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # 예상 실패 선언

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0100
    status: rejected
    subject: problems
    statement: "앱은 예상 실패마다 고유한 problem code를 선언하고, code는 2~48자이며 소문자로 시작하고 소문자·숫자·underscore만 쓴다."
    acceptance:
      - "1자 이름, 49자 이름, hyphen이 든 이름, 대문자가 든 이름, 이미 선언한 이름과 같은 이름은 거절된다."
      - "올바른 2자 이름과 48자 이름은 통과한다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0101
    status: rejected
    subject: problems
    statement: "예상 실패의 선언은 사람이 겪는 영향을 설명하는 공백 아닌 고정 한 줄을 함께 낸다."
    acceptance:
      - "설명이 비었거나 줄바꿈이나 치환 자리표시자가 들어 있는 선언은 거절된다."
      - "정상 선언은 통과한다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0102
    status: rejected
    subject: problems
    statement: "예상 실패의 선언은 코드를 고쳐야 하는 일인지 사람이 설정·입력을 조정할 일인지를 함께 낸다."
    acceptance:
      - "고칠 쪽이 없는 선언은 거절된다."
      - "프로필 기록 누락은 코드 수리로, 외부 서비스 인증 실패는 사람 조치로 선언할 수 있다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0103
    status: rejected
    subject: problems
    statement: "underscore로 시작하는 problem code는 lophn만 쓴다."
    acceptance:
      - "앱이 underscore로 시작하는 code를 선언하거나 제출하면 거절된다."
      - "underscore로 시작하지 않는 정상 이름은 접수된다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0104
    status: rejected
    subject: problems
    statement: "앱이 예상 실패를 하나도 선언하지 않아도 처리되지 않은 process·view 예외, 사람이 낸 제보, 잘못된 앱 보고의 세 분류로 보고할 수 있고, 분류마다 사람이 이해할 고정 문구가 있다."
    acceptance:
      - "선언이 없는 앱에서 세 분류를 각각 일으키면 앱 이름과 해당 고정 문구가 따로 보인다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0105
    status: rejected
    subject: problems
    statement: "보고에는 보고 당시 release의 선언 문구가 남고, 이후 선언을 바꾸거나 지워도 그 문구가 유지된다."
    acceptance:
      - "새 release에서 선언을 바꾸거나 지운 뒤 이전 보고를 읽어도 당시 문구가 보인다."
      - "당시 선언을 읽을 수 없으면 앱 이름과 확인할 문제가 있다는 안내가 보인다."

  # 감지와 보고

  - id: req-0106
    status: accepted
    subject: problems
    statement: "앱은 SDK로 이름과 message를 붙여 문제를 직접 보고할 수 있다."
    acceptance:
      - "앱이 이름과 message를 붙여 보고하면 그 앱의 문제로 접수된다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0107
    status: rejected
    subject: problems
    statement: "앱은 자기 앱의 보고만 낼 수 있다."
    acceptance:
      - "다른 앱 이름으로 낸 보고는 거절된다."
      - "자기 앱 이름으로 낸 보고는 접수된다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0108
    status: rejected
    subject: problems
    statement: "보고는 출처(앱의 보고, lophn이 수집한 예외, 사람의 제보)를 구별해 담는다."
    acceptance:
      - "출처를 위조한 보고는 거절된다."
      - "접수된 보고에는 실제 출처가 읽힌다."

  - id: req-0109
    status: accepted
    subject: problems
    statement: "발생마다 release, 운영·preview·test 구분, stack(원래 source 파일과 줄), 그 무렵의 앱 log를 남긴다."
    acceptance:
      - "release를 바꾼 뒤에도 옛 발생의 release와 원래 source 위치가 읽힌다."
      - "화면 오류의 stack이 source map으로 원래 TSX 파일과 줄을 가리킨다."

  - id: req-0110
    status: accepted
    subject: problems
    statement: "lophn은 앱의 처리되지 않은 오류(process의 exception과 Promise rejection, 화면 render 오류)를 앱이 보고하지 않아도 모은다."
    acceptance:
      - "세 경우를 각각 일으키면 그 앱의 문제로 접수된다."
      - "모아도 원래 실패는 성공으로 바뀌지 않는다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0111
    status: rejected
    subject: problems
    statement: "view에서 온 오류의 앱, release, 환경은 인증된 view 연결로 정한다."
    acceptance:
      - "다른 앱 이름을 넣은 view 오류도 실제로 부른 view의 앱 진단으로만 접수된다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0112
    status: rejected
    subject: problems
    statement: "오류 상세(stack, raw code)는 허용된 수리 조회에서만 읽히고, 일반 호출 응답에는 실패 설명과 다음 행동만 담긴다."
    acceptance:
      - "실패를 일으킨 호출의 응답에 stack과 raw code가 없다."
      - "허용된 수리 조회에서는 redaction한 상세를 읽는다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0113
    status: rejected
    subject: problems
    statement: "선언하지 않은 problem code나 잘못된 입력의 보고는 접수 오류로 거절하고, 원래 제출마다 잘못된 보고 진단을 최대 하나 남긴다."
    acceptance:
      - "선언하지 않은 code로 낸 보고는 접수 오류로 거절되고 잘못된 보고 진단이 하나 남는다."
      - "같은 잘못된 제출을 다시 보내면 거절되고 진단은 여전히 하나다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0114
    status: rejected
    subject: problems
    statement: "잘못된 보고 진단을 남기지 못하면 그 실패는 diagnostics로 가고 다시 보고를 만들지 않는다."
    details:
      on_failure:
        - "잘못된 보고 진단을 남기지 못하면 diagnostics에 기록하고 새 보고는 만들지 않는다."
    acceptance:
      - "진단 생성 실패를 주입하면 diagnostics에 남고 새 보고는 생기지 않는다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0115
    status: rejected
    subject: problems
    statement: "같은 발생의 재전송은 처음 낸 인증 주체와 내용이 같으면 같은 접수 결과를 돌려주고, 주체나 내용이 다르면 충돌로 거절한다."
    acceptance:
      - "응답을 잃은 뒤 다시 보내도 보고, snapshot, 문제가 하나씩이다."
      - "글이나 선택 자료를 바꾼 재전송은 충돌로 거절된다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0116
    status: rejected
    subject: problems
    statement: "보고, snapshot, 문제 변경은 함께 확정하고, 일부만 저장했거나 보고와 snapshot을 저장하지 못한 상태를 접수 성공으로 돌려주지 않는다."
    acceptance:
      - "저장 중 실패를 주입하면 접수가 실패하고 새 문제나 증거만 따로 읽히지 않는다."
      - "보고 저장 실패는 성공으로 답하지 않는다."

  # 폐기: 묶는 기준은 req-0146이 정하고, 그 안의 발생은 그대로 쌓인다.
  - id: req-0117
    status: rejected
    subject: problems
    statement: "접수한 보고는 합치거나 고치거나 지우지 않고, 서로 다른 발생은 지문이나 시간이 가깝다는 이유만으로 하나로 합치지 않는다."
    acceptance:
      - "접수 뒤 같은 문제의 다른 보고가 늘어도 이미 접수한 보고의 내용이 그대로 읽힌다."
      - "같은 시각, 같은 지문의 서로 다른 발생이 각각 남는다."

  - id: req-0118
    status: accepted
    subject: problems
    statement: "앱 하나당 60,000ms 동안 새 보고를 최대 20개 접수하고, 같은 발생의 재전송은 그 수에 넣지 않는다."
    details:
      limits:
        - "앱 하나당 60,000ms 동안 새 보고 20개"
    acceptance:
      - "21번째 새 보고는 접수되지 않고 손실 이유가 읽힌다."
      - "이미 접수한 보고의 재전송은 건수를 늘리지 않는다."

  # 폐기: 일반 관측성 수준으로 줄였다. 계약을 강제하는 메타 장치를 두지 않는다.
  - id: req-0119
    status: rejected
    subject: problems
    statement: "보고를 받는 쪽의 대기는 전체 128개, 16,777,216 bytes, 동시 조립 4개로 제한하고, 자동 보고 본문은 262,144 bytes 이하만 받는다."
    details:
      limits:
        - "대기 전체 128개"
        - "대기 전체 16,777,216 bytes"
        - "동시 조립 4개"
        - "자동 보고 본문 262,144 bytes"
    acceptance:
      - "각 한도를 넘는 보고는 실패하고 손실 이유가 읽힌다."

  # 증거 snapshot

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0120
    status: rejected
    subject: problems
    statement: "snapshot은 보고 당시의 자료 또는 없는 이유를 보고와 함께 고정하고, 나중 자료나 현재 release로 바뀌지 않는다."
    acceptance:
      - "보고 뒤 release, 화면, 로그가 바뀌어도 snapshot은 당시 자료를 보인다."
      - "추가 자료는 새 보고로 남는다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0121
    status: rejected
    subject: problems
    statement: "snapshot의 자료는 출처(사람 진술, 앱의 보고, lophn의 관측)를 구별해 담고, 하나가 다른 사실을 입증한다고 표시하지 않는다."
    acceptance:
      - "같은 자료에서 출처와 수집 시각이 읽힌다."
      - "앱이 화면에 표시했다는 보고만으로 화면 확인됨이나 검증 통과가 표시되지 않는다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0122
    status: rejected
    subject: problems
    statement: "snapshot은 한 시각의 전체 상태가 아니며, 자료마다 수집 시각과 관측 범위를 담는다."
    acceptance:
      - "늦게 얻은 자료는 늦은 수집 시각과 함께 읽힌다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0123
    status: rejected
    subject: problems
    statement: "invocation, 오류, 로그, 화면의 각 항목은 실제 값 또는 공백이 아닌 누락 이유를 담고, 정상적인 빈 목록, 일부 잘림, redaction, source 장애를 구별한다."
    acceptance:
      - "로그 0줄과 로그 수집 실패가 다르게 읽힌다."
      - "수집이 꺼졌거나, 발생 기회가 없거나, 기한 내 받지 못한 경우도 각각 이유가 읽힌다."
      - "화면 자료를 고르지 않았거나, 화면이 없거나, 숨겨졌거나, 수집에 실패한 경우도 각각 이유가 읽힌다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0124
    status: rejected
    subject: problems
    statement: "일부 자료 수집이나 큰 자료 저장이 실패해도 그 항목의 이유를 고정하고 남은 자료와 글은 접수한다."
    acceptance:
      - "이미지 저장이 실패해도 글과 실패 이유가 접수된다."
      - "첨부 미선택, 화면 없음, 수집 실패, redaction으로 제외됨, 저장 실패를 각각 일으켜도 글이 접수된다."
      - "저장되지 않은 screenshot은 첨부됨으로 기록되지 않고 빠진 이유가 남는다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0125
    status: rejected
    subject: problems
    statement: "수집은 허용된 앱과 source 범위만 읽고, 업무 DB, app-api 원입력, secret, 사람 파일 전체는 수집하지 않는다."
    acceptance:
      - "다른 앱 source나 DB 전체를 넣으려 하면 제외되고 안전한 타입과 길이 형태만 남는다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0126
    status: rejected
    subject: problems
    statement: "진단 상세 수집을 끄는 설정을 두며, 끄면 새 상세 수집만 멈추고 기존 snapshot과 invocation 기록은 그대로다."
    acceptance:
      - "수집을 끈 뒤 낸 보고의 snapshot에는 수집 꺼짐 이유가 보인다."
      - "끄기 전에 만든 snapshot은 그대로 읽힌다."
      - "수집을 끈 뒤에도 invocation 기록은 계속 남는다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0127
    status: rejected
    subject: problems
    statement: "snapshot은 SDK나 view가 실제로 연결한 invocation만 가리키고, 시각이 비슷한 invocation으로 대신하지 않는다."
    acceptance:
      - "같은 시각의 여러 호출 뒤 연결 정보 없는 오류를 보고하면 임의 연결이 생기지 않는다."

  # 폐기: 증거 snapshot을 두지 않고 발생 근거(req-0109)만 남긴다. 일반 관측성 수준으로 줄였다.
  - id: req-0128
    status: rejected
    subject: problems
    statement: "연결된 invocation의 참조를 알지만 기록이 아직 도착하지 않았으면 참조와 미도착 이유를 보존하고, 다른 호출로 바꾸거나 무기한 기다리지 않는다."
    acceptance:
      - "invocation 기록 도착을 늦춰도 접수는 진행되고 알려진 참조와 미도착 이유가 읽힌다."

