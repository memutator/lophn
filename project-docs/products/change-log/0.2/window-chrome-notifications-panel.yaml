id: window-chrome-notifications-panel
version: 0.2.0
title: "창 chrome·알림·앱 공간 오른쪽 패널을 손보고 터미널 바탕을 탭 본문과 맞춤"
modules: [packages/shell/renderer, packages/shell/main, packages/design, tools]
checked: [tool-worktree-prep, architecture-ui-kit]
change: |
  전: modal이 열려도 창 위쪽 바는 어둡게 덮이지 않았고, light mode에서 팔레트·dialog(overlay)가 dark로 떴다. menu·model picker가 창 가장자리에 붙어 열렸다. 앱에서 Explorer의 파일·폴더 아이콘이 보이지 않았다. 대기 목록은 위쪽 바의 "N waiting" pill이었고 바깥을 눌러도 닫히지 않았으며 panel이 scroll되지 않았다. Context·Search 탭 본문은 여백 없이 왼쪽에 붙었다. 앱 공간 오른쪽은 App details 운영 패널과 Agent 칸이 따로였다. 터미널 바탕은 탭과 다른 검정이었다.
  후:
  - 위쪽 바: sidebar 탭 줄과 칸 탭 줄 높이를 맞추고 겹쳐 두꺼웠던 아래 테두리를 하나로 했다. overlay modal(팔레트, dialog)이나 page modal(앱 공간 project picker)이 열리면 root의 `data-overlay-modal`·`data-page-modal`로 위쪽 띠 전체를 scrim으로 덮고 그동안 창 끌기를 끈다(`chrome.css`).
  - overlay는 `nativeTheme`으로 light/dark를 따른다. 팔레트는 창 위에서 12%(`palette.top`)에 뜬다. design의 menu·popover·select는 창 가장자리에서 `space[2]`를 띄운다(`collisionPadding`).
  - design `FileIcon`은 색을 `data-fill`·`data-stroke` 속성과 module CSS로 칠한다. shell CSP가 SVG 글 속 `style`을 막아 앱에서만 아이콘이 비던 것을 고쳤다.
  - 대기 목록의 단추는 종 아이콘(Notifications)이고 개수는 작은 badge(`badge.size` 12px)다. panel 제목은 Notifications, 비면 "No notifications."다. 바깥 클릭과 Esc로 닫히고 panel이 scroll된다. Settings 단추는 테두리 없는 ghost다.
  - Context 목록·Context·Search 탭 본문에 pane 여백을 주고, 검색 결과와 design `DataTable`의 page 이동을 가운데에 둔다.
  - 앱 공간 오른쪽은 패널 하나(`app-frame/side-panel.tsx`)이고 머리가 `TabStrip`이다. App details, Agent(또는 Manage가 연 관리 화면), lophn이 연 coding 터미널이 탭이다. `ops-panel-frame`과 `agent-pane`은 없어졌다.
  - 터미널 바탕은 탭 본문과 같은 `--color-surface-base`이고 글자·선택도 화면 token이다. ANSI 16색은 새 token `terminal.*`(VS Code Light+/Dark+ 값)이다. theme과 Appearance가 바뀌면 열린 터미널 색도 바뀐다(`architecture/appearance.md`). xterm viewport의 기본 `#000` 바탕이 가장자리에 회색 띠로 비치던 것도 surface로 덮었다.
  - `deno task dev:mock`의 터미널 탭은 core가 mock project 폴더를 모르므로 shell main이 데이터 root의 `mock-terminal` 폴더에서 연다(`LOPHN_DEV_MOCK=1`일 때만).
  - gallery의 문서 탭·터미널 탭 page가 빈 칸이던 것을 고쳤다(예시 탭을 저장 layout 모양으로 넣는다).
why: |
  사람이 dev:mock으로 써 보며 짚은 모양 문제를 고치고, 앱 공간 오른쪽도 작업대처럼 탭으로 다루게 하려고.
decisions:
  - text: |-
      scrim은 overlay가 아니라 desktop 창 renderer가 위쪽 띠를 덮는다. overlay view는 위쪽 바 아래에서 시작해 거기까지 닿지 않는다.
    by: agent
  - text: |-
      대기 목록의 안쪽 이름(`waiting`)과 문서의 "대기 목록"은 그대로 두고 화면 이름만 Notifications로 바꿨다.
    by: agent
  - text: |-
      작업대의 "알림 보기" 단추도 같은 종 아이콘을 쓴다. 둘이 헷갈리면 바꾼다.
    by: agent
