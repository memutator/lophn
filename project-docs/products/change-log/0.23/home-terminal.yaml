id: home-terminal
version: 0.23.93
title: Home에서도 터미널과 coding agent 터미널을 연다. home lophn이 `lophn tab open --coding`으로 handoff를 넘긴다
modules: [packages/protocol, packages/core/terminals, packages/core/terminal-agents, packages/core/main, packages/core/agent-workspaces, packages/cli, packages/shell/renderer]
change: |
  - Home 창도 터미널 탭을 연다(탭 줄 + menu, 빠른 실행 Terminal과 hover의 coding agent, `new.terminal`·`terminal.focus` 키, 팔레트, sidebar의 coding agent 줄). 앱 workspace에는 여전히 터미널이 없다.
  - core의 터미널은 `project`로 묶이는데 Home은 고정 값 `home`을 쓴다(`terminalProjectSchema`는 `prj_…` 또는 `home`). `terminals/open`·`terminals/list`·`terminals/saved_sessions`·`terminals/rename_saved`의 project와 `TerminalAgentSignaled`의 project가 이 꼴을 받는다.
  - Home 터미널은 그 기계에 로그인한 사람의 home 폴더에서 시작한다. core가 `home`의 등록 폴더 하나(`home_0`)를 그 폴더로 답해, cwd 검사와 host의 폴더 고르기는 그대로다. 터미널 env에 `LOPHN_WORKSPACE`는 넣지 않는다(없으면 home이 기본이다).
  - `terminals/open {project: "home", tab}`과 `lophn tab open --coding`이 연 터미널은 Home workspace의 탭이 되고, 터미널 알림을 눌러 가는 길과 다른 기계의 터미널 열기도 `home`이면 Home 창으로 간다. browser bridge가 연 browser 탭도 Home에 선다.
  - home lophn의 도구: `lophn tab open --coding <harness> --handoff <글>`이 home session에서도 통해 사람의 home 폴더에 즐겨찾기 coding agent의 TUI 터미널을 연다(앱 session은 `invalid_input`). 내장 prompt(home·app)와 CLI help를 고쳤다. `--tui`와 `shell.run`은 그대로다.
  - Home의 coding agent session도 저장된다(`<data>/terminal-agents/sessions/home.json`). Home sidebar의 Recent가 쓴다.
why: |
  Home에 터미널이 없던 것은 폴더가 없어서였다. 폴더가 필요 없는 일(여러 project에 걸친 점검, 전역 설정, home lophn이 사람과 이어서 만질 일)에도 사람의 터미널과 coding agent가 필요하다.
decisions:
  - text: Home 터미널의 시작 폴더는 `<data>/home/`이 아니라 사람의 home 폴더다. `<data>/home/`은 lophn의 지침·memory 그릇이라 사람의 shell과 coding agent를 그 안에 두기에 맞지 않고, 사람의 shell이 어디서나 시작하는 자리가 home이다. 버린 길 ① `<data>/home/`에서 연다, ② Home 전용 터미널 종류를 만든다(열기·치기·hook·tracker·layout·sidebar가 두 벌이 된다).
    by: agent
  - text: home lophn에는 새 tool을 더하지 않았다. project lophn이 터미널에 닿는 길은 `lophn` tool의 `tab open --coding`이고, `shell.run`은 터미널이 아니라 project 폴더의 명령 실행이라 폴더 없는 Home에 더하지 않았다.
    by: agent
follow_up: |
  - `coding_sessions/list`(폰과 다른 기계의 sidebar)와 `coding_sessions/open`(폰의 GUI 열기)은 Home 터미널을 싣지 않는다. 폰이 `project`를 project id로 가정한다.
  - harness GUI(`claude gui` 등)를 Home 터미널에서 쓰는 것은 확인하지 않았다(harness-gui.md는 Home을 다루지 않는다고 적는다).
checklist:
  - Home 탭 줄의 + menu에서 Terminal을 열어 시작 폴더가 사람의 home 폴더인지 본다
