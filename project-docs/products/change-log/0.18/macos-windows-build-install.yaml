id: macos-windows-build-install
version: 0.18.0
title: "macOS·Windows에서 build·기동·설치 묶음"
modules: [packages/base, packages/cli, packages/coding-agent, packages/core/apps, packages/core/diagnostics, packages/core/install-and-update, packages/core/lophn-agent, packages/core/main, packages/core/secrets, packages/core/supervision, packages/protocol, packages/sdk, packages/shell/main, packages/shell/terminal-host, tools]
checked: [architecture-terminal-agent, architecture-testing, architecture-browser-tab, architecture-ui-kit, architecture-layers, architecture-observability]
change: |
  - 전: Linux에서만 짜고 돌렸다. core는 process group 강제 종료를 Linux에서만 보장한다며 다른 OS에서 child를 하나도 띄우지 않았다(`/usr/bin/kill` adapter, fail-closed). data root 검사는 uid·0700이라 Windows에서 기동을 거절했다. 봉인 판정이 폴더 mode의 쓰기 bit였다. 앱 IPC는 unix socket만, agent shell tool은 `/bin/sh`와 `setsid`, 설치 묶음은 `tools/package-linux.ts`의 `.deb` 하나였다. CI가 없었다.
  - 후:
    - OS마다 다른 순수 규칙(home, IPC 경로, process tree 신호)이 `packages/base/os/`에 있고 OS로 가르는 함수는 platform을 인자로 받는다(`project-docs/architecture/platform.md`).
    - child tree 끄기: POSIX는 `detached` spawn과 `process.kill(-pid)`, Windows는 `taskkill /T /F`. supervisor는 세 OS에서 child를 띄우고, group이 없어졌음을 확인한 뒤 자원을 푸는 것은 같다.
    - Windows: data root `%USERPROFILE%\.lophn`(mode·uid 검사 없음), 앱 IPC는 named pipe, agent shell tool은 Git for Windows의 bash(`LOPHN_GIT_BASH`로 고른다. 없으면 `unavailable`), node shim은 `.cmd`와 sh 둘, bundle 폴더 연결은 junction. terminal hook·browser bridge·foreground 판정·터미널 signal·앱 RSS 감시는 꺼져 있다.
    - macOS: shell main이 시작할 때 login shell PATH를 읽고, Dock을 누르면 창을 다시 연다. harness 찾기에 Homebrew 폴더가 있다. 앱 RSS는 `ps`로 본다.
    - 봉인 판정은 사본 옆 표지 `<사본>.sealed`다. 표지 없는 사본은 쓰기 권한을 돌려준 뒤 지우고, 못 지우면 준비가 실패한다.
    - 설치 묶음: `npm run package`(`tools/package/main.ts --target linux|mac|win [--dir]`)가 `.deb`, dmg, NSIS를 만든다. 서명하지 않는다. macOS는 묶음이 `Contents/Resources/`에 있고 CLI는 앱 안 `bin/lophn`·`bin\lophn.cmd`다. packaged macOS·Windows의 harness agent와 lophn 터미널은 그 폴더를 PATH 앞에 둔다. `tools/package-linux.ts`는 없다.
    - Linux POSIX 동작: agent shell tool은 `setsid` 없이 `detached` `/bin/sh -c`다. release·data job, 선언 extract, MCP stdio, npm install child가 `detached`로 떠 터미널 Ctrl-C를 직접 받지 않고 core가 tree째 끈다. 앱 socket 경로 한도가 103에서 107 byte(sun_path)로 넓어졌다. data root 검사는 그대로다.
    - 개발: `.gitattributes`가 줄 끝을 LF로 고정한다. node-pty rebuild는 Linux만 한다(`node build.ts rebuild`). check는 biome·tsc·npm을 JS 입구로 띄운다. `tools/check-source.ts`가 `packages/`의 `import.meta.url).pathname`을 막는다. `.github/workflows/os.yml`(ubuntu·macos·windows: `npm ci`, `check:full`, `tools/ci/boot-core.ts`, `tools/package/main.ts --dir`)이 `workflow_dispatch`와 `ci/**` push로만 돈다.

  옮기기: data step `apps.sealed-marker`가 옛 core가 봉인한 사본(맨 위 폴더에 쓰기 bit가 없다)마다 표지를 쓴다. 두 번 돌아도 같다. 새 data root는 처음부터 적용한 것으로 친다.

  검증: Linux에서 `check:full`, core 두 번 기동(`boot.sh`, `tools/ci/boot-core.ts`), renderer build, `.deb` 배치 비교(0.17.0 `.deb`과 같은 배치에 `extensions/`가 더해졌다), `--target mac --dir`(Linux에서 `.app`까지). 위험 test: `packages/base/os/tree_test.ts`(POSIX `-pid`·ESRCH, win32 taskkill 128), `bundle/seal_test.ts`(표지 있는 사본은 남고 표지 없는·읽기 전용 사본은 지운다), `wiring/sealed-marker_test.ts`, `install-and-update/data-root_test.ts`(POSIX는 group·other 권한을 거절, win32는 안 본다), shell tool `run_test.ts`(Git Bash가 없으면 아무것도 띄우지 않는다). lead가 옛 꼴 data root(표지 없는 0555 사본)에 새 core를 두 번 띄워 표지가 생기고 사본이 그대로인 것을 봤다. macOS·Windows에서는 아무것도 돌려 보지 않았다.
why: |
  사람이 Linux에서만 개발해 다른 OS 지원이 없었고, 다른 OS에서 build하고 기동하는 체계를 원했다.
decisions:
  - text: |
      대상은 Linux x64, macOS arm64, Windows x64. 서명하지 않는다.
    by: agent
  - text: |
      다른 OS 확인은 GitHub Actions matrix 하나이고 손으로 실행하거나 `ci/**`에 push할 때만 돈다. private repo에서 macOS minute이 10배라서다.
    by: agent
  - text: |
      process group은 POSIX `process.kill(-pid)`, Windows `taskkill /T`. Job Object는 native addon이라 쓰지 않는다.
    by: agent
  - text: |
      Windows data root는 profile ACL을 믿는다. keychain·DPAPI는 하지 않는다. Claude Code·Codex가 같은 식이다.
    by: agent
  - text: |
      봉인은 mode bit 대신 표지 file로 판정한다. Windows 폴더에는 쓰기 bit가 없다.
    by: agent
  - text: |
      Windows agent shell tool은 Git Bash다. shell 규칙은 POSIX 그대로다. Claude Code가 Windows에서 Git Bash를 요구한다.
    by: agent
  - text: |
      `npm run dev`·`npm run e2e`·`npm run doctor`·lead script는 Linux 전용으로 둔다. 사람이 Linux에서만 개발한다.
    by: agent
  - text: |
      CI를 돌리지 않고 land한다(2026-11-06).
    by: person
follow_up: |
  처음 CI를 돌리면 macOS·Windows job이 깨질 것으로 본다(처음 도는 OS다). 돌리기는 `git push origin <branch>:ci/<이름>`이고 사람에게 묻는다. Mac·Windows에서 처음 볼 것: Dock 다시 열기, login PATH, Git Bash shell tool, NSIS 설치 뒤 `lophn.cmd`, 터미널을 닫을 때 Windows에서 shell 아래 process가 남지 않는지. 새 이슈는 없다(돌려 보지 못한 것뿐이다).
