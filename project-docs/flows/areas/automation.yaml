  - id: job-claim-due
    title: "바퀴가 온 차례를 job run 줄로 만든다(겹침, 놓친 차례, hold를 판정한다)"
    actor: system
    entries: [route:jobs/claim_due]
    boundary: [jobs]
    code: [packages/core/jobs/due.ts, packages/core/jobs/schedule.ts, packages/core/jobs/scheduler.ts]
    steps:
      - "machine 자격만 받는다. startup이면 맨 먼저 주인이 아직 null인 job을 이 기계로 찍는다(machine 칸이 생기기 전의 job)"
      - "이 기계의 job 가운데 승인하고 켜진 것의 next_due_at이 온 차례를 본다. 주인이 다른 job은 차례도 놓친 차례도 만들지 않고(켤 때 닫은 줄이 있어도), 남은 queued 줄도 넘기지 않고, 다음 차례 시각에도 세지 않는다"
      - "앞 차례가 queued나 running이면 skipped(overlap). 여럿이 쌓였으면 마지막 차례를 due_at으로, 접은 수를 missed_count로 적는다"
      - "놓친 차례(startup이거나 10분 넘게 늦은 차례)가 run 정책이면 queued로 한 번만 돌리고, hold 정책이면 held 줄(card)을 남긴다. held에 또 온 차례는 같은 줄에 접는다"
      - "제때 온 차례가 돌게 되면 기다리던 held 줄은 skipped(superseded)로 닫는다"
      - "시작할 queued 줄을 claimed_at과 함께 한 번만 넘기고, 다음 차례 시각을 돌려준다"
    outcomes:
      - id: queued
        when: "차례가 queued 줄이 됨. 놓친 차례면 missed_count가 찬다"
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: skipped-overlap
        when: "앞 차례가 아직 돎"
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: held
        when: "놓친 차례 + hold 정책. 대기 목록에 card가 뜸"
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: held-again
        when: "이미 held 줄이 있어 같은 줄에 접음"
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: superseded
        when: "queued 줄이 생기면서 기다리던 held 줄을 닫음"
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: not-due
        when: "차례가 아직 안 왔거나, job이 꺼져 있거나, 승인 전이거나, `mode_escalated`로 일시정지됐거나, 주인이 이 기계가 아니라 줄을 만들지 않음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "이 기계의 id(machine.json)를 읽지 못함. 남의 job으로 보고 돌리지 않는다"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 job이나 job run이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    refs: [J3, J6, E10]
    docs: [architecture/job.md]

  - id: job-event-fire
    title: "event가 오면 그 event를 때로 가진 job이 차례를 열거나 건너뛴다"
    actor: system
    entries: [route:jobs/fire_event, route:jobs/event_triggers, system:job-event]
    uses: [route:app_events/publish]
    boundary: [jobs, events]
    code: [packages/core/jobs/events.ts, packages/core/apps/events/publish.ts, packages/core/main/daemon/wiring/jobs.ts]
    steps:
      - "jobs wiring이 앱 event 전달의 안 구독자(앱이 아니고 호출 기록이 없다)로 들어간다. 앱이 낸 event와 core가 낸 `lophn`의 session.* event가 모두 온다. 승인하고 켜진 event job이 하나도 없는 (앱, event)는 바로 버리고, lophn event는 구독자가 없으면 session 한 줄도 만들지 않는다. 저장하지 않으므로 core가 꺼진 사이의 event는 job을 열지 않는다"
      - "다른 컴퓨터의 앱 event도 같은 안 구독자로 온다(remote-app-events). 이 기계의 event는 기계를 적지 않은 trigger만, 다른 컴퓨터에서 온 event는 그 기계를 source_machine으로 적은 trigger만 연다(앱 id는 기계 사이 같아 기계로 가른다). 열린 차례의 event에는 난 기계(machine)가 실린다. 다른 컴퓨터의 event일 때 jobs wiring이 이 기계의 call 정책에서 private인 workspace를 알리고(skip_workspaces) 그 workspace에서 만든 job은 열지 않는다. job.list는 다른 컴퓨터의 앱 event로 도는 job을 source_gone으로 표시하지 않는다(이 컴퓨터의 선언으로 알 수 없다)"
      - "machine 자격의 job.fire_event가 한 tx에서 이 기계의 job 가운데 그 event를 때로 가진 승인한 켜진 job마다 판정한다(주인이 다른 job은 보지 않는다). lophn session event는 job의 workspace(home이면 home)가 call 정책(mayReachWorkspace)으로 닿을 수 있고 사람이 연 session만 본다: 어느 job의 run이 연 session, run·workflow step 입력을 받은 session, 팀·call로 열린 session은 보지 않는다(고리). 앱 event는 job의 workspace가 그 앱 workspace에 닿을 때만 보고, 이 job이 부르는 앱(tool_run)이 이 event의 사슬(chain)에 있으면 보지 않는다"
      - "보는 event에 앞 차례가 queued·running이면 건너뛰고(busy), 마지막으로 연 때부터 최소 간격(기본 5분) 안이면 건너뛴다(too_soon). 건너뜀은 job run 줄로 쌓지 않고 job의 skipped_count와 마지막 시각·이유로 센다(event는 흔하다)"
      - "그 밖에는 event를 싣은 queued 줄을 만들고 fired_count와 마지막 시각을 고쳐 scheduler를 깨운다. 시작은 평소 차례와 같다(job-run-started). agent_run은 고정 prompt 뒤에 event를 data 블록으로 붙이고, workflow_start는 시작 글을 JSON {text, event}로 주고, tool_run은 pass_event일 때만 입력의 event 칸에 합친다"
    outcomes:
      - id: fired
        when: "차례를 열었다(queued 줄)"
        observe: [ledger:job_runs, ledger:jobs, event:StateChanged, response]
      - id: skipped-busy
        when: "앞 차례가 아직 돎. 건너뛰고 센다"
        observe: [ledger:jobs, response]
      - id: skipped-too-soon
        when: "마지막으로 연 때에서 최소 간격 안이다. 건너뛰고 센다"
        observe: [ledger:jobs, response]
      - id: ignored
        when: "이 job이 볼 event가 아니다: 승인 전이거나 꺼짐이거나 주인이 이 기계가 아님, 닿을 수 없는 workspace의 session이나 앱, 사람이 연 것이 아닌 session(어느 job의 run, run·workflow step·팀·call로 열림), 이 job이 부르는 앱의 사슬. 아무것도 세지 않는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "이 기계의 id(machine.json)를 읽지 못함"
        observe: [response]
    crosses_process: false
    declared_only: [unauthorized, invalid_input]
    unclear:
      - "route가 invalid_input과 unauthorized를 선언하지만 handler는 schema 검사 밖에 내지 않는다(선언을 고칠 곳)"
    docs: [architecture/job.md, architecture/event.md]

  - id: job-startup
    title: "켤 때 첫 바퀴가 도는 줄을 닫고 꺼진 사이의 차례를 센다"
    actor: system
    entries: [system:job-startup]
    uses: [route:jobs/claim_due]
    boundary: [jobs]
    code: [packages/core/jobs/due.ts, packages/core/jobs/scheduler.ts, packages/core/main/daemon/wiring/jobs.ts]
    steps:
      - "wiring 순서상 runs와 workflows를 맞춘 뒤 첫 바퀴가 claim_due(startup)를 부른다. 이 판 이전의 job(주인 칸이 null)은 이 호출이 이 기계 것으로 찍는다"
      - "running 줄과 시작을 넘긴 queued 줄(claimed_at 있음)을 interrupted로 닫고 놓친 차례로 한 번 더 센다. workflow_start의 running 줄은 둔다(다음 바퀴가 instance 상태로 닫는다)"
      - "첫 바퀴는 run 줄의 run 상태를 읽지 않는다. runs가 끊긴 run을 이미 닫았기 때문이다"
      - "꺼진 사이 온 차례는 모두 놓친 차례다. run 정책이면 한 번 돌리고(missed_count), hold 정책이면 held card를 올린다"
    outcomes:
      - id: interrupted
        observe: [ledger:job_runs, event:StateChanged]
      - id: missed-counted
        observe: [ledger:job_runs, event:StateChanged]
      - id: claim-failed
        when: "claim_due가 실패함. scheduler가 log:jobs에 남기고 60초 뒤 다시 한다. 성공할 때까지 다시 startup 바퀴다"
        observe: ["log:jobs"]
    crosses_process: false
    refs: [J6, H9, E10]
    docs: [architecture/job.md]

  - id: job-timer
    title: "정해진 때 승인한 job의 차례를 시작한다(타이머, wake, 최대 잠)"
    actor: system
    entries: [system:job-timer]
    uses: [route:jobs/claim_due, route:job_runs/started, route:job_runs/ended, route:runs/start, route:runs/create, route:workflows/start]
    pre: [job-approve:approved]
    boundary: [jobs, runs, workflows, run-loop, app-runtime]
    code: [packages/core/jobs/scheduler.ts, packages/core/main/daemon/wiring/jobs.ts]
    steps:
      - "타이머(다음 차례 시각, wake, 최대 1분) 가운데 하나가 깨우면 바퀴를 한 번 돈다. 한 번에 한 바퀴만 돈다"
      - "claim_due로 queued 줄을 받아 agent_run과 tool_run은 runService.start(origin job), workflow_start는 workflowService.start({kind job})로 시작한다"
      - "시작하면 job_run.started로 running과 run·instance·session id를 적는다. 시작하지 못하면 job_run.ended로 failed(<code>: <message>)를 적는다"
      - "claim_due가 실패하면 60초 뒤 다시 한다. 끝은 job-run-end가 본다"
      - "다음 차례 시각에 timer를 건다(최소 1초, 최대 1분)"
    outcomes:
      - id: started
        observe: [ledger:job_runs, ledger:runs, ledger:workflow_instances, ledger:workflow_lines, event:StateChanged]
      - id: failed
        when: "시작하지 못함(이름이 안 풀림, run 시작 실패, workflow 시작 conflict 등). job_run.ended로 failed를 적는다"
        observe: [ledger:job_runs, event:StateChanged]
      - id: claim-failed
        when: "claim_due가 실패해 60초 뒤 다시 한다"
        observe: ["log:jobs"]
    crosses_process: true
    refs: [E10, J3, J6]
    docs: [architecture/job.md]
    unclear:
      - "job_run.started나 job_run.ended 쓰기가 실패하면 log:jobs에만 남고 줄은 그대로다(conflict와 not_found는 조용히 넘긴다). 갈래로 쓰지 않았다"
      - "crosses_process는 workflow_start 중 flow kind가 시작될 때(flow host의 start 응답을 기다림) 때문에 true로 뒀다. agent_run과 tool_run만 도는 job이면 core만 쓴다"

  - id: job-run-started
    title: "시작한 queued job run을 running으로 적는다"
    actor: system
    entries: [route:job_runs/started]
    boundary: [jobs]
    code: [packages/core/jobs/due.ts]
    steps:
      - "machine 자격만 받는다. job run이 없으면 not_found, queued가 아니면 conflict"
      - "running으로 바꾸고 run, instance, session id와 started_at을 적는다"
    outcomes:
      - id: running
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "job run이 queued가 아님"
        observe: [response]
      - id: not_found
        code: not_found
        when: "job run이 없음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 job run이 깨져 읽지 못함(쓴 뒤 다시 읽는 것 포함)"
        observe: [response]
    crosses_process: false
    docs: [architecture/job.md]

  - id: job-run-ended
    title: "job run 줄을 done, failed, cancelled로 한 번만 닫는다"
    actor: system
    entries: [route:job_runs/ended]
    boundary: [jobs]
    code: [packages/core/jobs/due.ts]
    steps:
      - "machine 자격만 받는다. job run이 없으면 not_found, queued나 running이 아니면 conflict"
      - "입력의 state로 닫고 ended_at을 적는다. reason은 호출한 쪽이 준 값을 그대로 적는다(시작 실패의 `<code>: <message>`)"
    outcomes:
      - id: done
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: failed
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: cancelled
        observe: [ledger:job_runs, event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "job run이 이미 닫힘"
        observe: [response]
      - id: not_found
        code: not_found
        when: "job run이 없음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 job run이 깨져 읽지 못함(쓴 뒤 다시 읽는 것 포함)"
        observe: [response]
    crosses_process: false
    docs: [architecture/job.md]

  - id: job-run-end
    title: "실행 중인 job run 줄을 run이나 instance의 끝에 맞춰 닫는다"
    actor: system
    entries: [system:job-run-end, route:job_runs/open]
    uses: [route:job_runs/ended, route:runs/wait]
    pre: [job-timer:started]
    boundary: [jobs, runs, workflows]
    code: [packages/core/jobs/scheduler.ts, packages/core/main/daemon/wiring/jobs.ts]
    steps:
      - "바퀴마다 job_runs/open으로 running 줄을 모은다. workflow_start 줄은 instance 상태를 읽어 ended면 done, stopped면 cancelled로 닫는다"
      - "run 줄은 WaitRun이 끝 상태를 돌려주면 그 상태(done, failed, cancelled)로 닫는다. WaitRun은 60초씩 되풀이한다"
      - "lophn이 꺼지는 중이면 기다리는 것을 멈추고 줄을 둔다. 다음 켤 때 job-startup이 interrupted로 닫는다"
      - "이미 닫힌 줄은 conflict로 넘어간다. 켤 때 첫 바퀴는 run 상태를 읽지 않는다"
    outcomes:
      - id: ok
        when: "job_runs/open이 running 줄을 돌려줌(바퀴마다 한 번)"
        observe: [response]
      - id: open-failed
        code: internal
        when: "job_runs/open이 저장된 행을 읽지 못함. scheduler가 log:jobs에 남기고 그 바퀴의 닫기를 건너뜀"
        observe: ["log:jobs"]
      - id: done
        when: "run이 done으로 끝남, 또는 workflow instance가 ended"
        observe: [ledger:job_runs, event:StateChanged]
      - id: failed
        when: "run이 failed로 끝남. job run에는 reason을 적지 않고 run 기록에 error가 남는다"
        observe: [ledger:job_runs, event:StateChanged]
      - id: cancelled
        when: "run이 cancelled로 끝남, 또는 workflow instance가 stopped"
        observe: [ledger:job_runs, event:StateChanged]
      - id: left-open
        when: "WaitRun이 오류를 주거나(run이 없음 등) lophn이 꺼지는 중이라 기다림을 멈춤. 줄은 그대로 두고 다음 켤 때 job-startup이 닫는다"
        observe: [ledger:job_runs]
      - id: already-closed
        when: "줄이 이미 닫혔거나 지워져 conflict나 not_found. scheduler가 조용히 넘어간다"
        observe: [ledger:job_runs]
    crosses_process: true
    refs: [J3, J6]
    docs: [architecture/job.md, architecture/run.md]

  - id: job-activity
    title: "idle-exit 판정이 켜진 job이나 열린 job run이 있는지 읽는다"
    actor: system
    entries: [route:jobs/activity]
    boundary: [jobs]
    code: [packages/core/jobs/reads.ts, packages/core/main/daemon/wiring/idle.ts]
    steps:
      - "승인 여부와 상관없이 이 기계의 켜진 job이나 이 기계의 job의 queued·running 줄이 있는지 표 전체를 본다. 주인이 다른 job은 돌지 않으니 일로 세지 않는다"
    outcomes:
      - id: busy
        observe: [response]
      - id: idle
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "이 기계의 id(machine.json)를 읽지 못함"
        observe: [response]
    crosses_process: false
    docs: [architecture/job.md, architecture/platform.md]

  - id: workflow-rename
    title: project 안의 workflow 이름을 바꾸고 관련 기록·job·창 layout을 갱신한다
    actor: person
    entries: [route:workflows/rename]
