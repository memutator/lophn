id: claude-gui-offers-remote-control
title: Claude GUI의 `/` 목록에 `/remote-control`이 있지만 실행하면 거절 글만 나온다
kind: bug
status: fixed
topic: harness-gui
modules: [packages/shell/main]
now: |
  `packages/shell/main/extensions/bundled/harness-gui/claude.ts`의 `publishCommands`는 CLI가 준 command 가운데 터미널 전용(`terminalCommands`), `HIDDEN_COMMANDS`, `SCREEN_COMMANDS`에 없는 것을 모두 `/` 목록에 싣는다. `/remote-control`(별명 `/rc`)은 셋 어디에도 없어 목록에 뜨고, 고르면 `run_command`가 글로 CLI에 보낸다. SDK로 뜬 CLI는 이 command가 화면 panel을 여는 것이라 여기서는 쓸 수 없다는 글로 답하고, GUI는 그것을 알림 줄로 보인다. CLI의 답은 설치된 CLI의 글에서 읽었고 돌려서 보지는 않았다.
impact: |
  사람이 Claude Code의 remote control(다른 기기에서 이 session 이어 쓰기)을 GUI에서 켜려 하면 목록에는 있는데 켜지지 않는다. TUI로 바꿔야 쓸 수 있다는 것도 GUI는 말하지 않는다.
fix: |
  - 작음(추천): `remote-control`과 `rc`를 `HIDDEN_COMMANDS`에 넣어 목록에서 뺀다. 안 되는 것을 보이지 않는다. 기능은 TUI에서만 된다.
  - 중간: GUI에서 켜지게 만든다. SDK의 시작 설정(`remoteControlAtStartup`)이나 control 요청으로 켜고 상태와 링크를 화면에 보인다. 되는지는 실제 CLI로 녹화해 봐야 안다.
decided: |
  목록에서 숨긴다(`HIDDEN_COMMANDS`에 `remote-control`, `rc`). lophn에 폰으로 coding session을 보는 자기 길이 있어 겹친다. 사람이 Claude의 remote control을 GUI에서 쓰기를 원하면 되살려 만든다. (agent, 추천안으로 진행)
closed: |
  `remote-control`과 `rc`를 `HIDDEN_COMMANDS`에 넣어 `/` 목록에 뜨지 않는다.
guard: 없음
