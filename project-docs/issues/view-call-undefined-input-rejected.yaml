id: view-call-undefined-input-rejected
title: 화면이 값이 undefined인 칸을 넣어 operation을 부르면 desktop에서 늘 invalid_input이다
kind: bug
status: fixed
topic: app-call
modules: [packages/shell/main]
now: |
  앱 화면이 `lophnApp.callOperation("usage.sessions", { harnesses: undefined, search: undefined, offset: 0, limit: 50 })`처럼 값이 undefined인 칸을 넣어 부르면 desktop에서 `invalid_input: call is invalid`로 실패했다. IPC는 structured clone이라 그 칸이 shell main까지 그대로 오고, `packages/shell/main/app-frame/app-call.ts`의 `checkCall`이 input을 그대로 core 통로(`app_views.call`)에 넘겼다. RPC client(`packages/protocol/client/client.ts`의 `createRpcClient`)는 보내기 전에 route 입력 schema로 검사하는데 `input` 칸의 `jsonValueSchema`(canonical JSON)가 undefined를 거절한다. 요청은 core에 가지 않는다. 화면 view를 core view 표로 옮기면서 shell main에 있던 JSON 왕복이 빠진 뒤부터다. 폰 bridge(`packages/mobile/guest/bridge.ts`)는 JSON 왕복을 해서 같은 호출이 폰에서는 된다.
impact: |
  사람은 그 화면에서 "Couldn't load …"만 본다(Mahas의 세션 탭이 그랬다). 요청이 shell main에서 끝나 invocation, core trace, 앱 log 어디에도 남지 않아 앱 agent가 원인을 찾지 못한다. 같은 code가 폰에서는 되고 desktop에서만 실패한다.
closed: |
  `checkCall`이 input을 폰 bridge와 같은 규칙으로 JSON 값으로 만든다: 없으면 null, 그 밖에는 JSON 왕복(값이 undefined인 칸은 빠진다). JSON으로 못 만드는 값은 `invalid_input`이다.
guard: packages/shell/main/app-frame/app-call_test.ts
