id: always-on
version: 0.23.70
title: 사람이 표시한 기계에서 lophn이 로그인 때 뜨고 창 없이 계속 돌며, job은 만든 기계에서만 돈다
modules: [packages/core/always-on, packages/protocol/always-on, packages/protocol, packages/core/main, packages/core/jobs, packages/core/storage, packages/shell/main, packages/shell/renderer, packages/shell/ipc, packages/cli, packages/design, packages/mobile]
change: |
  - 늘 켜 둠 표시: `<data root>/always-on.json`(0600, temp에 쓰고 rename) `{machine, keep_running, keep_awake, service_env: {PATH, TMPDIR?}, updated_at}`. 기계 id가 다르면(복사한 data root) 꺼짐, 깨진 file도 꺼짐이고 덮지 않는다. memory route `always_on/status`·`always_on/set`(사람만)이 표시와 OS가 답한 사실(`start_at_login`, `login_reason`, `awake`, `awake_reason`, `mechanism`)을 같이 낸다. status는 부를 때마다 OS에 다시 묻는다. 켜면 env를 다시 잡아 표시를 쓰고 등록하며, 등록이 실패해도 표시는 남는다. 표시가 켜진 core는 idle-exit하지 않는다.
  - OS 등록: Linux systemd user unit `lophn-core-<key>.service`(`Restart=on-failure`, 실행 file이 없으면 돌지 않음), macOS LaunchAgent `dev.lophn.core.<key>.plist`(`KeepAlive`는 실패 때만, 실행 file이 없으면 0으로 끝남), Windows HKCU `Run` 값 `lophn-core-<key>`(`"<exe>" --core --home "<root>"`). Linux·macOS 항목은 core 입구를 바로 띄우고 env `LOPHN_SERVICE=1`·`LOPHN_LAUNCH_SHELL=1`과 켤 때 잡은 `PATH`(macOS는 `TMPDIR`)만 싣는다. OS 설정에서 끈 것(`systemctl --user disable`, launchd disabled, Startup apps의 끔)은 `off_in_system`으로 읽고 다시 켜지 않는다. 기동 때 맞추기가 빠지거나 낡은 등록을 다시 쓰고, 표시가 꺼졌거나 다른 기계의 것이면 남은 등록을 지운다.
  - keep-awake: 표시가 켜져 있을 때만 켜는 따로 스위치. core pid에 묶인 child(Linux `systemd-inhibit --what=sleep`, macOS `caffeinate -i -w`, Windows PowerShell `SetThreadExecutionState`)가 저절로 잠들기만 막는다.
  - core 입구: 설치 layout(platform root에 shell 소스가 없음)일 때만 OS port를 준다. 개발·test·boot core는 status가 `unavailable`·`development_build`이고 켜기가 `unavailable`이다. `LOPHN_SERVICE=1`인 core의 ready 전 실패는 exit 0(전에는 1), ready 뒤 비정상 끝은 그대로 0이 아니다. systemd가 띄운 Linux core는 앱을 띄울 때 `systemctl --user show-environment`에서 화면 env 여섯 이름을 가져온다.
  - 설치 묶음: NSIS 제거(업데이트가 아닐 때)가 `lophn-core-`로 시작하는 HKCU `Run`·StartupApproved 값을 지운다. 설치는 아무것도 등록하지 않는다.
  - desktop: Settings › Remote의 "This computer" 아래 "Keep running" 묶음(스위치 "Keep lophn running on this computer", "Keep this computer awake", OS가 답한 사실 한 줄과 Try again·Turn on again). tray의 "Start at login"과 autostart 모듈, `--tray`, macOS `wasOpenedAtLogin` 판정을 지웠다. `--core`는 Windows `Run` 값만 쓴다. 설치본 shell이 core에 붙은 뒤 옛 등록(Linux `autostart/lophn.desktop`의 `--core`·`--tray`, macOS·Windows login item)을 찾으면 표시를 켜고 OS 등록이 `registered`일 때만 옛 등록을 지우고, 그 사람에게 창이 있을 때 한 번 native 알림(Settings를 여는 단추)을 보인다.
  - job 주인 기계: ledger step `jobs.machine`(`ALTER TABLE jobs ADD COLUMN machine TEXT`, 행을 바꾸지 않음). job 기록에 `machine`(찍기 전 null)과 `runs_here`. 만들 때 이 기계 id를 찍고, 새 판의 첫 startup claim이 null인 job을 이 기계 것으로 찍는다. 다른 기계의 job은 차례를 만들지 않고, 넘기지 않고, event로 열리지 않고, [Start now]가 `conflict`이고, idle-exit의 일이 아니며 승인 대기·hold 목록에 오르지 않는다. 사람만 부르는 command `job.take_over`(route `jobs/take_over`)가 이 기계로 가져오고 주기 job은 지금부터 새로 센다. Jobs 탭은 "Belongs to another computer"와 [Run on this computer]를 보인다. `lophn job list` 도움말이 `runs_here`를 설명한다. 폰 sample data에 job 칸을 더했다.
why: |
  사람이 늘 켜 두려는 기계(미니 PC, 집 desktop)에서 옛 autostart는 Electron이 ensure만 하고 끝나 core가 crash하면 아무도 다시 띄우지 않았고, Linux XDG autostart는 화면 세션에서만 돌았다. idle-exit는 일 없는 core를 껐다. 그 사이 job과 폰이 사람이 올 때까지 멈춘다. 그리고 한 사람이 여러 기계를 쓰면 같은 job이 두 기계에서 돌아 같은 바깥 효과가 두 번 날 수 있다.
decisions:
  - text: "표시는 기계마다 하나이고, 켜면 그 기계에 로그인 시작을 등록하고 idle-exit를 끈다. 표시만 있고 수단이 없으면 거짓이다."
    by: person
  - text: "`platform.md` 지키는 것 14(\"OS service는 등록하지 않는다\")를 뒤집었다. 사람이 표시한 기계에서만 per-user 시작 항목을 등록하고, 설치 때와 개발·test core는 하지 않는다. 이유: 옛 autostart는 crash 뒤 다시 띄우지 않고 Linux XDG autostart는 화면 세션에서만 돈다."
    by: agent
  - text: "첫 판은 로그인 뒤에 뜬다. linger·LaunchDaemon·저장한 자격의 scheduled task는 쓰지 않는다(화면 없는 첫 설정과 같이 연다)."
    by: agent
  - text: "Windows는 scheduled task가 아니라 HKCU `Run` 값이다. 버린 길: scheduled task(env를 넘기지 못해 console 창이나 상주 Electron이 필요하고 로그온 trigger는 권한에 걸릴 수 있다). 잃는 것: Windows는 crash 뒤 다시 띄우지 않는다."
    by: agent
  - text: "등록·상태 읽기·고치기는 core가 한다. \"등록됨\"은 OS가 답한 것만이고, OS나 사람이 OS 설정에서 끈 것은 lophn에서 다시 켜기 전까지 켜지 않는다."
    by: agent
  - text: "표시는 기계 id와 같이 data root에 둔다. 복제된 root는 꺼짐으로 읽고 이 기계 OS에 남은 그 root의 등록을 지운다."
    by: agent
  - text: "옛 tray \"Start at login\"은 표시로 옮기고 지운다. 같은 일을 하는 스위치 둘을 두지 않고, 동작이 바뀐(idle-exit가 꺼진) 사람에게 한 번 알린다."
    by: agent
  - text: "`Stop lophn`은 표시한 기계에서도 core를 멈춘다. 정상 종료라 OS가 다시 띄우지 않는다."
    by: agent
  - text: "keep-awake는 따로 스위치이고 기본 꺼짐이며 표시가 켜져 있을 때만 켠다. 저절로 잠들기만 막는다."
    by: agent
  - text: "등록에 싣는 env는 켤 때 잡은 PATH(macOS는 TMPDIR)뿐이다. secret은 싣지 않고 새 secret 저장소를 만들지 않는다."
    by: agent
  - text: "OS port는 core 입구가 설치 layout일 때만 준다. 설치 묶음은 아무것도 등록하지 않고 Windows 제거만 `Run` 값을 지운다(업데이트 때는 아님)."
    by: agent
  - text: "job은 만든 기계에서만 돌고 옮기는 것은 사람의 take over뿐이다. 이미 있는 job은 첫 startup claim이 찍는다(schema step은 기계 id를 모른다)."
    by: agent
  - text: "다른 기계 job의 글은 \"another computer\"이고 이름은 화면 source의 선택 함수가 알 때만 보인다. 기계 기록을 다른 기계에 알리는 계획에 기대지 않는다."
    by: agent
follow_up: |
  - 한계: Windows는 crash 뒤 core를 다시 띄우지 않는다(`Run` 값은 로그인 때 한 번). 다음 로그인이나 앱·CLI가 띄운다.
  - 한계: 앱·CLI가 띄운 core는 OS 감독 밖이라 다음 로그인까지 crash 뒤 다시 뜨지 않는다.
  - 한계: 업데이트 뒤 service가 띄운 옛 판 core는 바로 갈아 띄우지 않는다. 앱을 열면 ensure가 갈아 띄우고 다음 로그인은 새 판이다.
  - 한계: deb·mac 앱을 지운 뒤 systemd unit과 LaunchAgent plist가 남는다. 실행 file이 없으면 아무것도 하지 않고 끝난다.
  - 확인 못 함: OS 쪽 전부를 실제 기계에서 돌려 보지 않았다(Linux도 실제 `systemctl --user` 등록은 하지 않았다. macOS·Windows는 누구도 돌리지 않았고 NSIS macro는 compile도 하지 않았다). 이슈 `always-on-os-side-unverified`.
  - 이슈 `windows-login-start-not-service`, `legacy-autostart-kept-without-systemd`, `keep-running-notice-waits-for-window`, `core-entry-own-stderr-logger`.
  - `app-folder-sync`: agent·기계 기록이 읽는 `always_on` 칸(계약 3)의 함수 등록이 남았다.
checklist:
  - "해야: Linux deb·macOS dmg·Windows NSIS 설치본마다 Settings › Remote에서 Keep lophn running on this computer를 켠 뒤 아래를 본다"
  - 로그아웃·로그인 뒤 창 없이 core가 돌고 Settings가 Starts when you log in이며 앱을 열면 그 core에 붙는다
  - 재부팅 뒤 앱을 열지 않아도 켜 둔 job이 제때 돈다
  - Stop lophn 뒤 core가 다시 뜨지 않다가 다음 로그인에 뜬다
  - OS 설정(macOS Login Items, Windows Startup apps, systemctl --user disable)에서 끄면 Settings가 꺼졌다고 알린다
  - 스위치를 끄면 OS 등록이 사라진다
  - Keep this computer awake를 켜면 저절로 잠들지 않는다(systemd-inhibit --list, pmset -g assertions, powercfg /requests)
  - Windows 제거 뒤 Run 값 lophn-core-*가 없고 업데이트 뒤에는 남는다
  - 옛 판에서 tray Start at login을 켜 둔 기계가 새 판에서 Keep running 켜짐으로 옮겨지고 한 번 알림이 뜬다
