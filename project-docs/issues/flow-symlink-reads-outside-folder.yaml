id: flow-symlink-reads-outside-folder
title: 'flow process가 workflow 폴더 안 symlink를 따라 폴더 밖을 읽는다'
kind: bug
status: fixed
topic: workflow
modules: [packages/core/main]
now: |
  `packages/core/main/flow-host/flags.ts`의 `flowFlags`는 `--allow-read=<workflow 폴더>,<data>/sdk` 하나만 준다. 앱의 `appFlags`(`packages/core/apps/permissions/flags.ts`)처럼 폴더 안 symlink마다 `--deny-read=<그 lexical 경로>`를 더하지 않는다. Deno는 허락한 폴더 안의 symlink를 따라가므로 폴더 밖을 가리키는 link가 있으면 flow가 그 대상을 읽는다. link를 만드는 길은 PM의 `shell.run`이다(`packages/core/agent-roles/tool-lists.ts`의 `WORK_TOOLS`, OS sandbox 없음, `project-docs/issues/place-session.md`). flow process 자신은 쓰기 허락이 없어 link를 만들지 못한다.
impact: |
  PM이 workflow 폴더에 밖을 가리키는 link를 두면, AI가 짠 `flow.ts`가 그 대상(사람의 파일, data root의 다른 project)을 읽어 `agent`·`tool` 입력이나 report 글로 내보낼 수 있다. 쓰기와 네트워크는 여전히 막혀 있다. PM이 `shell.run`으로 직접 읽는 것과 범위는 같다.
fix: |
  - launch 때 workflow 폴더를 훑어 실제 경로가 폴더 밖인 symlink마다 `--deny-read=<lexical 경로>`를 더한다. `appFlags`와 같은 꼴이다. 작음. 훑기와 launch 사이에 새로 생긴 link는 막지 못한다(앱의 `permissions.limit.symlink-changes`와 같은 한계).
  - `shell.run`을 빼거나 sandbox에 넣는 일(`place-session.md`)이 정해지면 link를 만드는 길이 닫힌다. 큼.

  추천: 첫째. flags 순수 함수와 그 위험 test(`flags_test.ts`)에 줄 하나를 더하는 크기다.
closed: |
  `packages/core/main/flow-host/host.ts`의 `launch`가 `flowArgv` 전에 workflow 폴더 전체를 훑어(`packages/core/apps/permissions/mod.ts`의 `realPathResolver`의 `linksIn`, 앱과 같은 것) 실제 경로가 폴더 밖이거나 풀리지 않는 link를 모으고, `packages/core/main/flow-host/flags.ts`의 `flowFlags`가 그 lexical 경로들로 `--deny-read`를 더한다(쉼표·제어 문자는 `ONE_ITEM`으로 거절). 훑기와 launch 사이에 새로 생긴 link는 막지 못한다(앱과 같은 한계, `project-docs/architecture/workflow.md` "flow").
guard: 'packages/core/main/flow-host/flags_test.ts의 test "flow flags deny reading outside symlinks and always cap memory"'
