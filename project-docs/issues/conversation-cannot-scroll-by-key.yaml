id: conversation-cannot-scroll-by-key
title: 대화를 key로 scroll할 수 없다
kind: bug
status: fixed
topic: agent-chat
modules: [packages/shell/ipc, packages/shell/renderer]
now: |
  `packages/protocol/shell/keybindings.ts`의 `agent.*` command에 scroll(한 화면 위·아래, 맨 위·맨 아래)이 없다. harness-gui manifest의 keymap도 같은 command만 다시 단다. 대화 scroll 칸(`message-list/thread-scroll.tsx` `ThreadScroll`)은 `tabIndex`가 없고 focus는 보통 입력칸에 있어, PageUp·PageDown은 입력칸 caret만 옮긴다. `message-list/follow.ts`는 그 key를 맨 아래 따라가기를 끄는 데만 본다.
impact: |
  사람이 긴 대화를 mouse 없이 올려 읽지 못한다. harness GUI를 CLI 대신 쓰는 사람이 가장 먼저 느낀다(CLI TUI는 key로 scroll한다).
fix: |
  `agent.scroll-page-up`·`scroll-page-down`·`scroll-top`·`scroll-bottom` command를 context `agentView`에 PageUp·PageDown·Ctrl+Home·Ctrl+End로 더하고, `agent-view.tsx` route가 `ThreadScroll`이 내놓는 scroll handle을 부른다. 위로 갈 때는 따라가기를 끈다. PageUp·PageDown은 tab·pane key(`Ctrl+PageUp`, `Alt+PageUp` 등)와 겹치지 않는다. 중간. 추천.
closed: |
  `agent.scroll-page-up`·`scroll-page-down`·`scroll-top`·`scroll-bottom`(PageUp·PageDown·Ctrl+Home·Ctrl+End, context `agentView`)이 `ThreadScroll`의 scroll handle을 부른다. 입력칸에 focus가 있어도 대화가 scroll된다. 층(rewind·자식 대화·권한)이 열려 있으면 그 층이 key를 받는다.
guard: 없음
