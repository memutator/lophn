group: agent-automation
journeys:

  # ---- session 열기와 대화 (나머지 journey의 출발점) ----

  - id: agent-open-session-and-chat
    title: "사람이 agent와 workspace를 골라 session을 열고 첫 메시지를 보낸다"
    actor: person
    goal: "사람이 Home에서 agent를 골라 session을 열고 메시지를 보내 turn이 돌고 답을 받는다"
    steps:
      - {do: "Home에서 New session으로 agent를 골라 session을 연다", screen: home-session, flow: session-open:ok}
      - {do: "메시지를 보낸다", screen: new-agent-conversation, flow: session-send:ok}
      - {do: "메시지 입력으로 turn의 mode가 attended로 정해진다", flow: turn-mode-decide:attended}
      - {do: "입력 하나를 turn으로 연다", flow: turn-pump-start:started}
      - {do: "agent가 답을 끝내 turn이 completed로 닫힌다", flow: turn-loop:completed}

  # ---- agent 정의 (사람과 agent) ----

  - id: agent-create-by-person
    title: "사람이 agent를 새로 만든다"
    actor: person
    goal: "사람이 Agents 화면에서 새 agent 정의를 저장하고 저장된 설정을 다시 연다"
    refs: [H11, P2, G1]
    steps:
      - {do: "탭 줄의 + menu에서 Agents를 눌러 그 workspace의 Agents 탭을 연다", screen: new-project-tab-menu, flow: agents-tab-open:opened}
      - {do: "Agents 목록을 읽는다", screen: new-project-agents, flow: agent-definition-read:ok}
      - {do: "New agent 폼에서 skill 목록을 본다", screen: agent-settings-create, flow: skills-list-read:ok}
      - {do: "이름, 지침, model을 채워 저장한다", screen: agent-settings-create, flow: agent-create:created}
      - {do: "저장된 agent 설정을 다시 연다", screen: agent-settings-agent, flow: agent-definition-read:ok}

  - id: agent-create-human-only-refused
    title: "agent가 사람만 정하는 칸을 넣어 정의를 만들려다 막힌다"
    actor: agent
    goal: "agent가 agent.create로 정의를 만들면서 apps 할당을 넣으면 거절되고, 할당 칸을 뺀 정의로 다시 만든다"
    refs: [G1, G2, P2]
    steps:
      - {do: "agent가 lophn agent create로 정의를 보내며 apps 할당을 넣는다", flow: agent-create:human-only-field}
      - {do: "agent가 할당 칸을 빼고 다시 만든다. 할당은 사람이 정한다", flow: agent-create:created}
      - {do: "agent가 새 agent의 명함을 읽어 부를 수 있는지 확인한다", flow: agent-card-read:ok}

  - id: agent-change-by-person
    title: "사람이 agent 정의를 고친다"
    actor: person
    goal: "사람이 agent의 model이나 지침을 고쳐 저장한다"
    refs: [H11, P2]
    steps:
      - {do: "agent 설정을 연다", screen: agent-settings-agent, flow: agent-definition-read:ok}
      - {do: "Model을 고르고 저장한다", screen: agent-settings-model-picker, flow: agent-change:saved}

  - id: agent-edit-any-from-home
    title: "사람이 Home에서 모든 agent를 보고 범위 agent를 고친다"
    actor: person
    goal: "workspace를 열지 않고 Home의 Agents 탭에서 전역과 project·앱 범위 agent를 한 목록으로 보고, 그 agent를 열어 고친다"
    refs: [H11, P2]
    steps:
      - {do: "탭 줄 + menu의 Agents로 Home의 Agents 탭을 연다", screen: new-project-tab-menu, flow: agents-tab-open:opened}
      - {do: "전역과 모든 workspace의 범위 agent가 범위 표시와 함께 한 목록에 있다", screen: agents-tab-home, flow: agent-definition-read:ok}
      - {do: "project 범위 agent를 열면 editor가 그 agent의 workspace로 열린다", screen: agents-tab-home-open-scoped, flow: agent-definition-read:ok}
      - {do: "고쳐 저장한다", screen: agents-tab-home-open-scoped, flow: agent-change:saved}

  - id: agent-change-stale-retry
    title: "낡은 화면으로 저장하면 충돌하고 다시 읽어 저장한다"
    actor: person
    goal: "다른 곳에서 정의가 바뀐 뒤 낡은 화면이 저장하면 hash 충돌로 막히고, 다시 읽은 정의에 고쳐 저장한다"
    refs: [H11]
    steps:
      - {do: "낡은 화면에서 저장한다", screen: agent-settings-agent, flow: agent-change:hash-changed}
      - {do: "화면이 정의를 다시 읽는다", screen: agent-settings-agent, flow: agent-definition-read:ok}
      - {do: "고친 내용을 다시 저장한다", screen: agent-settings-agent, flow: agent-change:saved}

  - id: agent-change-human-only-by-agent
    title: "agent가 자기 할당을 바꾸려다 막히고 사람에게 올린다"
    actor: agent
    goal: "agent가 agent.update로 자기 apps 할당을 바꾸려 하면 거절되고, 사람에게 질문으로 올린 뒤 사람이 할당을 정한다"
    refs: [G1, G2, C25]
    steps:
      - {do: "agent가 agent.update로 apps 칸을 바꾸려 한다", flow: agent-change:human-only-field}
      - {do: "agent가 ask로 사람에게 할당을 청하고 사람이 답한다", screen: new-agent-question, flow: tool-ask:submitted}
      - {do: "사람이 Grants에서 앱을 붙이고 뺄 tool을 고른다", screen: new-agent-grants-app, flow: assignment-set:saved}
    gaps:
      - "C25의 할당 제안 자체(이유와 함께 사람에게 제안하는 글)에 대응하는 flow가 없다. ask 질문 글로만 간다"

  - id: agent-profile-image-change
    title: "사람이 agent의 프로필 이미지를 바꾼다"
    actor: person
    goal: "사람이 이미지를 올리고 저장해 agent 프로필로 잇고, 화면이 그 이미지를 받아 보인다"
    refs: [H11]
    steps:
      - {do: "agent 설정에서 이미지를 고른다", screen: agent-settings-agent, flow: agent-profile-image-upload:stored}
      - {do: "저장해서 정의의 profile로 잇는다", screen: agent-settings-agent, flow: agent-change:saved}
      - {do: "화면이 이미지를 받아 보인다", flow: agent-profile-image-read:ok}

  - id: agent-delete-by-person
    title: "사람이 사람이 만든 agent를 지운다"
    actor: person
    goal: "사람이 agent 설정에서 agent 정의를 지운다"
    refs: [H11]
    steps:
      - {do: "agent 설정을 연다", screen: agent-settings-agent, flow: agent-definition-read:ok}
      - {do: "Delete로 지운다", screen: agent-settings-agent, flow: agent-delete:deleted}

  # ---- 앱 할당과 앱 tool 호출 ----

  - id: app-assign-to-agent
    title: "사람이 agent에게 앱을 붙이고 뺄 tool을 고른다"
    actor: person
    goal: "사람이 Grants 탭에서 agent에게 앱을 할당하고, 그 앱에서 뺄 tool을 정해 저장한다"
    refs: [H3, P4, C25]
    steps:
      - {do: "Grants 탭을 연다", screen: new-agent-grants, flow: assignment-read:ok}
      - {do: "앱을 펼쳐 뺄 tool의 Allowed를 끄고 저장한다", screen: new-agent-grants-app, flow: assignment-set:saved}

  - id: app-assign-stale-retry
    title: "낡은 할당 화면으로 저장하면 다시 읽고 저장한다"
    actor: person
    goal: "할당이 다른 곳에서 바뀐 뒤 낡은 화면이 저장하면 revision 충돌로 막히고, 다시 읽어 저장한다"
    refs: [H3]
    steps:
      - {do: "낡은 화면에서 Allowed를 바꿔 저장한다", screen: new-agent-grants-app, flow: assignment-set:conflict}
      - {do: "화면이 할당을 다시 읽는다", screen: new-agent-grants, flow: assignment-read:ok}
      - {do: "다시 고른 값을 저장한다", screen: new-agent-grants-app, flow: assignment-set:saved}

  - id: agent-app-tool-allowed
    title: "할당한 앱 tool은 묻지 않고 실행된다"
    actor: agent
    goal: "agent가 할당받은 앱 tool을 부르면 승인 카드 없이 실행되고 결과를 받는다"
    refs: [H3]
    steps:
      - {do: "agent가 할당된 앱 tool을 부른다", flow: tool-gate-check:run}
      - {do: "앱 tool의 결과를 받는다", flow: tool-call-execute:ok}

  - id: agent-app-tool-not-assigned
    title: "할당하지 않은 앱 tool은 실행 없이 막힌다"
    actor: agent
    goal: "agent가 할당 밖의 앱 tool을 부르면 실행되지 않고 이유를 tool 결과로 받는다"
    refs: [H3]
    steps:
      - {do: "agent가 할당 밖의 앱 tool을 부른다", flow: tool-gate-check:denied-not-assigned}
      - {do: "agent가 막힌 결과를 tool 결과로 받는다", flow: tool-call-execute:gate-denied}

  # ---- 앱 공유 요청 ----

  - id: app-share-request-approve
    title: "앱 workspace agent의 공유 요청을 사람이 승인한다"
    actor: agent
    goal: "앱 workspace의 agent가 그 앱을 다른 agent에게 공유하도록 청하고, 사람이 승인하면 받을 agent에 할당된다"
    refs: [C25, H3]
    steps:
      - {do: "앱 workspace의 agent가 lophn app share로 공유를 청한다", flow: share-request-open:opened}
      - {do: "대기 목록에서 열린 공유 요청을 읽는다", screen: new-waiting-list, flow: share-request-list:ok}
      - {do: "요청을 승인한다", flow: share-request-decide:approved}
    gaps:
      - "공유 요청 줄과 승인 단추를 그린 wireframe frame이 없다(new-waiting-list의 묶음 목록에 공유 요청이 보이는지 확인하지 못했다)"

  - id: app-share-request-reject
    title: "앱 공유 요청을 사람이 거절한다"
    actor: agent
    goal: "사람이 공유 요청을 거절하면 agent 정의는 바뀌지 않고 요청이 닫힌다"
    refs: [C25]
    steps:
      - {do: "앱 workspace의 agent가 공유를 청한다", flow: share-request-open:opened}
      - {do: "대기 목록에서 요청을 거절한다", screen: new-waiting-list, flow: share-request-decide:rejected}

  - id: app-share-with-activation-consent
    title: "앱 activation 동의와 함께 공유 요청을 승인한다"
    actor: agent
    goal: "앱 activation 동의 카드에서 허락하면 그 앱에 붙은 공유 요청도 같은 transaction에서 승인된다"
    refs: [H2, C25]
    steps:
      - {do: "앱 workspace의 agent가 공유를 청한다", flow: share-request-open:opened}
      - {do: "동의 카드에서 허락을 누르면 공유도 함께 승인된다", screen: new-waiting-first-activation, flow: share-request-consent:approved-with-consent}

  # ---- call (agent가 다른 session에 일을 맡김) ----

  - id: call-with-result
    title: "agent가 열린 session에 결과를 받는 일을 맡긴다"
    actor: agent
    goal: "agent가 열린 session을 골라 결과 call을 보내고, 받은 session이 답을 돌려주면 call이 닫힌다"
    refs: [R1, R2, T1, T11, T12]
    steps:
      - {do: "call 목록으로 부를 수 있는 열린 session을 고른다", flow: call-sendable-list:ok}
      - {do: "상대의 명함을 읽어 답 방식과 입력 modality를 본다", flow: agent-card-read:ok}
      - {do: "lophn call send를 reply result로 보낸다", screen: new-agent-call-open, flow: call-send:accepted}
      - {do: "받은 session이 입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "받은 session이 일을 끝낸다", flow: turn-loop:completed}
      - {do: "받은 session이 lophn call reply로 결과를 보낸다", screen: new-agent-call-replies, flow: call-reply:delivered}

  - id: call-handoff-none
    title: "답이 필요 없는 일을 handoff로 맡기고 사람이 이어 받는다"
    actor: agent
    goal: "agent가 답 없이 맡긴 일(reply none)을 받은 session이 끝내고, 사람이 그 session을 열어 이어 말한다"
    refs: [R2, T12]
    steps:
      - {do: "lophn call send를 reply none으로 보낸다", screen: new-agent-call-open, flow: call-send:accepted}
      - {do: "받은 session이 입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "받은 session이 일을 끝낸다", flow: turn-loop:completed}
      - {do: "사람이 Open conversation으로 받은 session에 이어 말한다", screen: new-agent-call-open, flow: session-send:ok}

  - id: call-conversation
    title: "대화로 주고받는 call의 상태를 사람이 읽는다"
    actor: agent
    goal: "agent가 reply conversation으로 보낸 call에 받은 쪽이 답하고, 사람이 보낸 쪽 대화에서 그 call 상태를 읽는다"
    refs: [R2, T14]
    steps:
      - {do: "lophn call send를 reply conversation으로 보낸다", flow: call-send:accepted}
      - {do: "받은 session이 입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "받은 session이 lophn call reply로 답한다. call은 열린 채 남는다", flow: call-reply:delivered}
      - {do: "사람이 보낸 쪽 대화의 call을 눌러 상태를 읽는다", screen: new-agent-call-replies, flow: call-state-read:ok}
    gaps:
      - "call-send의 outcome이 답 방식(none, result, conversation)을 나누지 않아 conversation 주고받기는 call-reply:delivered로만 보인다"

  - id: call-result-bare-receiver
    title: "bare agent가 끝낸 turn의 마지막 글이 result call의 답이 된다"
    actor: agent
    goal: "result call을 받은 bare agent가 turn을 끝내면 마지막 글이 call의 답으로 자동 전달된다"
    refs: [R2, T11]
    steps:
      - {do: "lophn call send를 reply result로 bare agent에게 보낸다", flow: call-send:accepted}
      - {do: "bare agent가 입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "bare agent가 turn을 끝낸다", flow: turn-loop:completed}
      - {do: "마지막 글이 call의 답으로 자동 전달된다", flow: bare-call-reply:replied}

  - id: call-cancel-late-reply
    title: "사람이 보낸 call을 취소하면 뒤늦은 답은 닫힘으로 돌아간다"
    actor: person
    goal: "사람이 기다리던 call을 취소하면 받은 쪽이 뒤늦게 답해도 답은 닫힘으로 돌아가고 call은 바뀌지 않는다"
    refs: [T18, R2]
    steps:
      - {do: "agent가 result call을 보내 기다린다", flow: call-send:accepted}
      - {do: "call 블록의 Cancel을 누른다", screen: new-agent-call-open, flow: call-cancel:cancelled}
      - {do: "받은 쪽이 취소 뒤에 답을 보낸다", flow: call-reply:closed}

  - id: call-to-closed-session
    title: "닫힌 session으로 보낸 call은 실패로 돌아온다"
    actor: person
    goal: "사람이 받을 session을 archive한 뒤 agent가 그 session으로 call을 보내면, 새로 열지 않고 실패가 돌아온다"
    refs: [T7, T9]
    steps:
      - {do: "받을 session을 archive한다", flow: session-archive:ok}
      - {do: "agent가 그 session으로 call을 보낸다", flow: call-send:failed-closed}

  - id: call-restart-recovered
    title: "lophn을 다시 켜면 잃은 call과 도는 turn이 닫힌다"
    actor: person
    goal: "lophn을 껐다 켜면 끝나지 못한 turn이 interrupted로 닫히고, 잃은 call은 이유와 함께 보낸 session에 알려진다"
    refs: [T9]
    steps:
      - {do: "lophn을 다시 켠다", flow: turn-restart:turns-interrupted}
      - {do: "잃은 call을 닫고 이유를 보낸 session에 알린다", flow: call-restart-recovery:recovered}

  # ---- team (spawn, 읽기, 끝내기, 팀원의 승인과 질문) ----

  - id: team-spawn-and-end
    title: "agent가 팀원을 열어 나눠 맡기고 끝난 팀원을 닫는다"
    actor: agent
    goal: "부모 agent가 팀원 session을 열어 일을 맡기고, 팀원이 팀을 읽어 결과를 돌려주면 부모가 그 팀원을 닫는다"
    refs: [G4, R1]
    steps:
      - {do: "lophn team spawn으로 팀원 session을 열고 첫 call을 보낸다", screen: new-agent-call-open, flow: team-spawn:spawned}
      - {do: "부모의 다음 turn 요청 끝에 team_changed 글이 붙는다", flow: team-changed-notice:notice-added}
      - {do: "팀원이 입력을 turn으로 연다", flow: turn-pump-start:started}
      - {do: "팀원이 lophn team read로 부모와 형제의 연락처를 읽는다", flow: team-read:ok}
      - {do: "팀원이 결과를 lophn call reply로 돌려준다", flow: call-reply:delivered}
      - {do: "부모가 끝난 팀원을 lophn team end로 닫는다", flow: team-end:ended}

  - id: team-spawn-full
    title: "팀 상한에 찬 상태에서 팀원을 더 열면 막힌다"
    actor: agent
    goal: "팀이 max_members에 찼으면 spawn이 막히고, 끝난 자손 하나를 닫은 뒤 다시 연다"
    refs: [G4]
    steps:
      - {do: "팀이 상한에 찬 상태에서 lophn team spawn을 부른다", flow: team-spawn:team-full}
      - {do: "부모가 열린 자손 하나를 lophn team end로 닫는다", flow: team-end:ended}
      - {do: "다시 lophn team spawn으로 팀원을 연다", flow: team-spawn:spawned}

  - id: team-child-shell-allowed
    title: "팀원의 shell 규칙 ask를 부모가 허락한다"
    actor: agent
    goal: "팀원의 shell 명령이 ask에 걸리면 사람 대신 부모에게 승인 call이 가고, 부모가 허락하면 명령이 실행된다"
    refs: [H4, R4, T4]
    steps:
      - {do: "부모가 lophn team spawn으로 팀원을 연다", flow: team-spawn:spawned}
      - {do: "팀원 turn이 attended로 열린다", flow: turn-mode-decide:attended}
      - {do: "팀원의 명령이 ask에 걸려 부모에게 승인 call이 올라간다", flow: team-ask-open:ok}
      - {do: "부모가 lophn call reply --allow로 허락한다", screen: new-agent-call-open, flow: call-reply:ask-answered}
      - {do: "허락이 팀원의 request를 once로 푼다", flow: team-child-approval-to-parent:parent-allowed}
      - {do: "gate가 허락을 받아 팀원의 명령을 실행한다", flow: tool-gate-check:run-after-allow}
      - {do: "명령이 끝나 결과가 돌아온다", flow: tool-shell-run:finished}
    gaps:
