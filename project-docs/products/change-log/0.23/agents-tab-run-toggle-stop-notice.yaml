id: agents-tab-run-toggle-stop-notice
version: 0.23.2
title: "Agents 탭을 + menu로 열고, 앱 실행을 App details에서 켜고 끄고, Stop lophn 무응답을 알린다"
modules: [packages/shell/renderer, packages/shell/main, packages/design]
checked: []
change: |
  전: Agents 탭(agent 목록과 정의 editor)은 대화의 권한 view의 Edit 링크로만 열렸다. `apps/enable_execution`·`apps/disable_execution`을 부르는 화면이 없어 사람이 앱을 멈추거나, 보관을 되살린 앱을 다시 돌릴 수 없었다. `Stop lophn`에서 control stop이 답하지 않으면 log 한 줄만 남기고 shell을 끝냈다.
  후: Home의 Agents 탭 목록은 전역과 모든 project·앱 범위 agent를 범위 표시와 함께 보인다(project·앱 탭은 그대로 범위 목록). 탭 줄 + menu에 Agents 항목이 있어 Home, project, 앱 workspace의 Agents 탭을 연다. App details 탭 위쪽에 Run 절이 생겨 상태(Running, Stopped, Not responding, Stopped after repeated crashes, Not ready)와 Switch를 보이고 Switch가 두 route를 부른다. 실패는 탭 위쪽 toast다. control stop이 답하지 않으면 shell을 끝내기 전에 native message box가 core가 남아 있을 수 있다고 알린다. wireframe frame `agents-tab-home-open-scoped`, `new-app-run-running`·`new-app-run-stopped`·`new-app-run-halted`를 더하고 `new-project-tab-menu`가 Agents를 보인다.
why: 사람이 agent를 고치고 앱 실행을 다루는 입구가 화면에 없어서(journey screen gap 조사).
decisions:
  - text: "Agents 탭의 입구는 + menu의 Agents 항목이다. 버린 길: 전역 all agents 화면이나 Settings › Agents 변경(사람이 정할 일), command palette 항목(command와 keybinding 표가 같이 늘어난다)."
    by: agent
  - text: "실행 켜고 끄기는 App details의 Run 절 Switch다. crash loop로 멈춘 앱은 켜진 채라 상태 글만 달리 보이고 껐다 켜라고 안내한다. 종료 기록이 10분 창에서 빠지기 전에는 껐다 켜도 다시 halted가 되고, 이 한계는 고치지 않고 flow의 unclear에 남겼다."
    by: agent
  - text: "Stop lophn 무응답 알림은 native dialog다. 버린 길: 끝내지 않고 재시도하기(답 없는 core 때문에 shell만 붙들린다)."
    by: agent
  - text: "Home의 Agents 탭이 모든 agent(전역과 workspace 범위)를 보이고 고친다. 범위 agent는 카드에 범위가 보이고 그 agent 자신의 workspace로 editor가 열린다. 버린 길: 다른 workspace의 lophn까지 싣기(Home lophn만 둔다), Settings › Agents에 목록 두기(바꾸지 않는다)."
    by: person
follow_up: |
  crash loop 창이 새 activation이나 Run 껐다 켜기에도 비워지지 않는 것과 창이 지나도 스스로 다시 뜨지 않는 것을 사람이 의도로 볼지 정한다(app-supervisor-reconcile unclear).
