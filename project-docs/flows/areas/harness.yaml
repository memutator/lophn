      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "이름을 runtime의 tab_name으로 싣는다. 빈 이름은 이름 없음이다. 알림 제목과 다른 화면의 탭 이름, Finished 줄이 이것을 쓴다"
    outcomes:
      - id: named
        observe: [response, event:TerminalRuntimeChanged]
      - id: not_found
        code: not_found
        when: "core가 그 터미널을 모른다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/terminal-agent.md]

  - id: terminals-rename-saved
    title: 사람이 저장한 coding agent session에 이름을 쓰고 고정한다
    actor: person
    entries: [route:terminals/rename_saved]
    boundary: [core]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/core/terminal-agents/service.ts
      - packages/core/terminal-agents/session-store.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
    steps:
      - "그 project에 저장한 session의 name을 쓰고 pinned로 둔다. name이 null이면 고정을 푼다. 이후 hook이 준 이름은 고정된 이름을 덮지 않는다"
      - "바뀐 목록을 주고 StateChanged{terminal_saved_sessions, id: project}를 낸다"
    outcomes:
      - id: renamed
        observe: ["disk:<data root>/terminal-agents/sessions/<project>.json", response, event:StateChanged]
      - id: not_found
        code: not_found
        when: "그 project에 그 session이 저장돼 있지 않다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "저장 file을 쓰지 못했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/terminal-agent.md]

  - id: terminal-agent-signal
    title: 터미널의 coding agent가 알릴 계기를 core가 event로 낸다
    actor: system
    entries: [system:terminal-agent-signal]
    boundary: [core, events]
    code:
      - packages/protocol/events/transient.ts
      - packages/core/terminal-agents/tracker.ts
      - packages/core/terminal-agents/service.ts
    steps:
      - "tracker가 권한 물음, 일 끝(main turn과 child가 다 끝나 1.5초 idle), 실패를 정한 순간 TerminalAgentSignaled {terminal, project, harness, kind, name, body}를 낸다. 보고 있는지는 보지 않는다"
      - "shell main이 이것을 듣고 보고 있지 않으면 toast나 OS 알림을 고른다. 못 본 끝(unseen)과 폰 push는 core가 같은 계기에 attention을 바로 불러 정한다. 새 turn과 터미널 끝에는 그 터미널의 못 본 끝을 지운다"
    outcomes:
      - id: signaled
        observe: [event:TerminalAgentSignaled]
    crosses_process: false
    docs: [architecture/terminal-agent.md, architecture/attention.md]

  # ---- Settings › Coding agents(coding_agents/*) ----
  - id: coding-agents-read
