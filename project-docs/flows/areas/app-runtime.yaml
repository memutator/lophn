      - "agent와 machine도 같은 route를 쓸 수 있다(session별 write 목록은 agent가 읽는다)."
    outcomes:
      - id: listed
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        observe: [response]
    crosses_process: false
    refs: [A2]

