    statement: 앱 사이 직접 호출은 인증된 부른 앱과 부모 호출 문맥을 대상 앱에 전달한다.
    acceptance:
      - 앱 A가 앱 B의 app-api를 부르면 B가 받은 호출에서 부른 앱이 A로 식별된다.
      - A가 다른 invocation 안에서 부르면 그 부모 invocation이 B의 호출에 연결된다.

  # 폐기: approvals req-1492가 호출마다 부른 앱의 grant로 판정한다.
  - id: req-0921
    status: rejected
    subject: app-runtime
    statement: 앱 A에 대한 허락은 A가 부른 앱 B를 거쳐 다른 앱 C로 위임되지 않고, 여러 앱의 자료를 연결해도 각 앱의 권한은 합쳐지지 않는다.
    acceptance:
      - B에서 C를 부르려면 B 자신의 선언과 허락이 있어야 하고, 없으면 거절된다.
      - A가 B를 거쳐 C의 app-api를 부르는 흐름에서 A가 C에 직접 접근하려 하면 A에게 C에 대한 허락이 없는 한 거절된다.

