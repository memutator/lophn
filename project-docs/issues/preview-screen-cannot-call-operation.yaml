id: preview-screen-cannot-call-operation
title: preview 화면은 operation을 부르지 못한다
kind: bug
status: open
topic: app-call
modules: [packages/shell/main, packages/core/apps]
now: |
  shell main의 화면 호출(`packages/shell/main/app-frame/app-call.ts`)은 view의 고정 선언을 `declaration-source.ts`로 읽는데, live release일 때만 읽는다. preview view에서는 `unavailable`이다. core의 `callPreview`는 person의 preview 호출을 받는다.
impact: |
  앱을 짓는 쪽이 preview에서 화면을 눌러 operation을 확인하지 못한다. agent는 `preview.call`로 부르지만 사람은 화면으로 확인할 길이 없다.
fix: |
  `declaration-source.ts`가 preview bundle의 선언도 읽고 호출 대상을 `{mode: "preview", app, process_nonce}`로 보낸다. 작다.
