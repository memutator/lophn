area: shell-workspace
flows:
  # ---- desk ----
  - id: desk-new
    title: "사람이 만든 desk를 하나 더 만든다"
    actor: person
    entries: [ui:desk-new]
    when: "DeskSwitcher의 New desk 단추나 desk.new 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/desk-switcher.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "newDesk가 desk-<시각>-<번호> key와 Desk N label로 addDesk를 부르고 그 desk를 고른다"
      - "desk가 200개(DESKS_MAX)면 addDesk가 layout을 그대로 돌려주고 setActiveDesk도 없는 key라 아무 일도 없다"
      - "commit이 layout을 저장하고, 보던 desk가 바뀌었으므로 syncDetached가 보이는 desk가 아닌 창을 숨긴다"
    uses: [ipc:shell:workspace-layout-save, ipc:shell:detached-show]
    outcomes:
      - id: created
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: unchanged
        when: "desk가 200개 상한이다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등 schema) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시해 화면은 바뀌고 파일은 그대로다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: desk-switch
    title: "보이는 desk를 바꾼다"
    actor: person
    entries: [ui:desk-switch]
    when: "DeskSwitcher 줄을 고르거나 desk.next, desk.prev, desk.nth 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "고른 key가 layout에 있으면 setActiveDesk로 active를 바꾸고 commit으로 저장한다"
      - "보이는 desk가 바뀌면 syncDetached가 가는 desk의 detached 창만 보이게 하고 나머지는 숨긴다(닫지 않는다)"
      - "가는 desk 창이 없으면 detached open으로 되살린다"
      - "고른 key가 layout에 없으면 workflow 이름일 때만 openWorkflow로 workflow 탭을 열어 그 desk를 만든다. 그 밖(desk.nth 번호에 desk가 없다)은 아무 일도 없다"
    uses: [ipc:shell:detached-show, ipc:shell:detached-open, ipc:shell:workspace-layout-save]
    outcomes:
      - id: switched
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: workflow-desk-opened
        when: "고른 key가 layout에 없는 workflow 이름이고 desk가 200개 미만이다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: unchanged
        when: "이미 보이는 desk이거나 desk.nth 번호에 desk가 없거나, layout에 없는 workflow인데 desk가 200개 상한이라 만들지 못했다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: forbidden
        code: forbidden
        when: "showOnly를 보낸 쪽이 desktop 창이 아니거나 detached 창이다(guard). project 창의 desk 전환에서는 일어나지 않는다"
        observe: ["response"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "workflow-desk-opened의 탭 열기 자체는 workflow-tab-open flow가 맡는다"

  - id: desk-rename
    title: "사람이 만든 desk의 이름을 바꾼다"
    actor: person
    entries: [ui:desk-rename]
    pre: [desk-new:created]
    when: "DeskSwitcher 줄의 연필이나 desk.rename 키. Main과 workflow desk는 막힌다"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/desk-switcher.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "desk.rename 키나 연필이 이름 입력을 연다. Main이나 workflow desk면 입력을 열지 않는다"
      - "확정하면 앞뒤 공백을 자르고, 빈 입력은 원래 이름으로 되돌린다. Esc는 취소다"
      - "renameDesk가 label만 바꾸고 key는 그대로 둔다(같은 이름이면 바뀌는 것이 없다). commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: renamed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: unchanged
        when: "빈 입력이나 지금과 같은 이름이라 바뀌는 것이 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: cancelled
        when: "Esc로 입력을 닫았다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: blocked
        when: "Main이거나 workflow desk라 입력을 열지 않는다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: desk-close
    title: "사람이 만든 desk를 끝내고 지운다"
    actor: person
    entries: [ui:desk-close]
    pre: [desk-new:created]
    when: "DeskSwitcher 줄의 x나 desk.close 키. Main과 workflow desk에서는 아무 일도 없다"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/desk-close-dialog.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "requestCloseDesk가 Main과 workflow desk를 거른 뒤 DeskCloseDialog를 띄운다. 탭, 터미널, float, 창 수와 저장 안 된 파일(이름과 경로)을 보인다"
      - "확인하면 finishDesk가 탭을 kind의 beforeClose(confirmed)로 하나씩 닫고 float과 detached 창을 닫는다"
      - "모두 닫히면 removeDesk로 desk만 지운다(보던 desk였으면 Main으로 간다)"
      - "거절되면 거기서 멈추고 desk는 남는다"
    uses: [ipc:shell:detached-close, ipc:shell:workspace-layout-save]
    outcomes:
      - id: asked
        observe: ["screen:shell-desk-close"]
      - id: removed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: stopped
        when: "저장 안 된 파일이나 kind의 beforeClose가 거절했다. 그 앞에 닫은 탭은 빠진 채로 남는다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: cancelled
        when: "dialog에서 Cancel"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: blocked
        when: "Main이거나 workflow desk이거나 그 key의 desk가 없다(finishDesk가 바로 돌아간다)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    risk: [data-loss]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: desk-workflow-merge
    title: "사라진 workflow의 desk를 Main에 합친다"
    actor: shell
    entries: [system:desk-workflow-merge]
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "project를 열 때와 desk 단추를 열 때 source.workflows로 workflow 목록을 읽는다. Home이면 읽지 않는다"
      - "읽는 사이 project가 바뀌었으면(shownProject) 결과를 버린다"
      - "읽기가 성공했고 목록에 없는 workflow desk가 있으면 mergeDeskIntoMain으로 Main에 합친다"
      - "tab은 Main 끝에 붙고 float과 detached는 상한이 남으면 그대로, 아니면 tab으로 간다"
      - "합쳐서 detached가 아니게 된 창은 닫고 layout을 저장한다(syncDetached가 보이는 창을 맞춘다)"
    uses: [ipc:shell:detached-close, ipc:shell:workspace-layout-save]
    outcomes:
      - id: merged
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: kept
        when: "읽기가 실패했거나 목록에 모든 workflow desk가 있다, Home이라 읽지 않았다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: discarded-stale
        when: "읽는 사이 project가 바뀌어 결과를 버렸다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "합친 layout을 main이 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  # ---- tab ----
  - id: tab-select
    title: "탭을 고른다"
    actor: person
    entries: [ui:tab-select]
    when: "탭 줄의 탭(group이면 누른 반쪽)을 누르거나 tab.next, tab.prev, tab.nth 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/tab-strip.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "탭 줄이 고를 key를 정한다. tab.nth 0은 마지막 탭이고 group이면 그 group의 focus다. 번호에 탭이 없으면 바뀌는 것이 없다"
      - "selectTab이나 stepTab이 selected를 바꾸고 focusTabBody로 그 본문에 focus를 준다"
      - "commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: selected
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "screen:shell-overflow", "screen:shell-overflow-end", "screen:shell-tab-long"]
      - id: unchanged
        when: "이미 고른 탭이거나 번호에 탭이 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: agents-tab-open
    title: "탭 줄 + menu의 Agents로 그 workspace의 Agents 탭을 연다"
    actor: person
    entries: [ui:agents-tab-open]
    when: "Home, project, 앱 workspace 모두 + menu에 Agents 항목이 있다. Agents 통로(source)가 없으면 항목이 없다"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/add-tab-menu.tsx
      - packages/shell/renderer/workspace/kinds/agents.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "Agents 항목이 openAgents를 부른다. 탭은 workspace에 하나라 key가 agents인 탭이 있으면 그 탭을 고르기만 하고 없으면 새로 연다"
      - "commit이 layout을 저장한다"
      - "탭 본문이 그 workspace의 agent 목록과 정의 editor를 보인다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: opened
        when: "Agents 탭이 없어 새로 열었거나 이미 있어 골랐다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "screen:new-project-agents"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md, architecture/agent-definition.md]

  - id: tab-close
    title: "탭을 닫는다"
    actor: person
    entries: [ui:tab-close]
    when: "탭의 x, 가운데 클릭, 탭 메뉴 Close, tab.close 키(group이면 고른 반쪽)"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/workspace/kinds/terminal.tsx
      - packages/shell/renderer/workspace/kinds/document-editor.tsx
    steps:
      - "close(key)가 layout에 없는 탭이면 아무 일도 없다. 있으면 kind의 beforeClose를 부른다. 살아 있는 터미널과 저장 안 된 파일은 확인을 기다린다"
      - "확인이 필요 없거나 승인되면 되살리기 목록에 넣고 removeTab으로 tabs, floats, detached에서 뺀다"
      - "확인을 기다리는 사이 탭이 사라졌으면 removeTab이 아무 일도 없다"
      - "취소하면 탭을 그대로 둔다"
      - "commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: closed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: confirmed-closed
        when: "확인 dialog에서 닫기를 골랐다(살아 있는 터미널 종료, 저장 안 된 파일 버리기)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:terminal"]
      - id: kept
        when: "확인에서 취소했거나 터미널 종료를 확인받지 못했다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: gone-meanwhile
        when: "탭이 layout에 없었거나 확인을 기다리는 사이 사라졌다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    risk: [data-loss]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "터미널과 파일 확인 dialog의 화면과 문구는 각 kind(harness, projects) 쪽 flow가 정한다. 여기는 닫기 길만 본다"
      - "확인 뒤 사라진 탭도 rememberClosed에 들어가 reopen 목록에 남는다(removeTab만 없는 탭을 무시한다). 의도인지 확인이 필요하다"

  - id: tab-reopen
    title: "닫은 탭을 다시 연다"
    actor: person
    entries: [ui:tab-reopen]
    pre: [tab-close:closed]
    when: "tab.reopen 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "이 창 메모리의 닫은 탭 목록에서 가장 최근 것을 꺼낸다. 저장하지 않아 앱을 다시 켜면 비어 있다"
      - "이미 layout에 있는 key는 건너뛰고 다음 것을 본다"
      - "openTab(preview 아님)으로 붙이고 focus를 준다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: reopened
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: nothing
        when: "목록이 비었거나 모두 이미 열려 있다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: tab-close-many
    title: "여러 탭을 한 번에 닫는다"
    actor: person
    entries: [ui:tab-close-many]
    when: "탭 메뉴의 Close others, Close others in pane, Close group, Close to the right, Close saved, Close all, 또는 tab.close-others, tab.close-right, tab.close-saved, tab.close-all, pane.close-others, pane.close-group 키"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/tabs-close-dialog.tsx
      - packages/shell/renderer/shell/desk-model.ts
    steps:
      - "closeTargets가 scope에 맞는 탭을 고른다. 닫을 탭이 없으면(예: 오른쪽에 탭이 없다, 닫을 저장된 탭이 없다) 아무 일도 없다"
      - "닫을 파일의 마지막 고침을 먼저 flush한 뒤, 살아 있는 터미널이나 저장 안 된 파일이 있으면 TabsCloseDialog 하나에 줄로 보인다. 없으면 dialog 없이 닫는다"
      - "확인하면 보인 파일의 남은 고침을 버리고(discard), 터미널은 되묻지 않고 탭마다 beforeClose를 거쳐 닫는다"
      - "확인 뒤 새로 저장 안 된 파일이 생겼으면 그 탭에서 다시 묻고, 거절하면 거기서 멈춘다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: closed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: asked
        observe: ["screen:shell-tabs-close"]
      - id: closed-after-confirm
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:terminal"]
      - id: stopped
        when: "확인 뒤 다시 묻는 파일을 거절했다. 그 전에 닫은 탭만 빠진다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: nothing
        when: "closeTargets가 빈 목록이다(닫을 탭이 없다)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    risk: [data-loss]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: tab-keep-open
    title: "미리보기 탭을 고정 탭으로 만든다"
    actor: person
    entries: [ui:tab-keep-open]
    when: "preview 탭의 메뉴 Keep open, preview 탭 더블클릭, tab.keep-open 키(preview 탭일 때만 키가 받는다)"
