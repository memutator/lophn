id: browser-favicon-late-state
version: 0.23.155
title: browser favicon을 늦게 도착한 state까지 살리고 큰 PNG는 32px로 줄인다
modules:
  - packages/shell/main
  - packages/shell/preload
  - packages/shell/renderer
change: |
  - `packages/shell/main/browser/favicon.ts`: `fetch`가 `Referer`를 실을 수 있게 넓히고, 48KB를 넘거나 content-type이 없는 이미지는 `FaviconResize`(nativeImage)로 32px PNG로 줄여 싣는다. 받는 byte 상한 2MiB, 결과 PNG 48KB, data URL 65536자는 그대로다. `text/html`·json·xml·javascript·css 응답은 디코딩하지 않는다. `firstFaviconData`가 `page-favicon-updated`가 준 후보를 앞에서부터 시도해 처음 성공한 것을 쓴다(같은 URL은 한 번만).
  - `packages/shell/main/browser/electron-view.ts`: favicon 세대 번호를 origin 변경과 새 favicon 알림마다 올리고, 마지막으로 성공한 값과 같으면 `onChange`를 부르지 않는다. page의 `Referer`를 favicon 요청에 싣는다.
  - `packages/shell/preload/browser-api.ts`: `subscribeState`가 구독 시점 이전에 도착한 마지막 state(view_session별 최신, 최대 200개)를 microtask로 재생한다. `<webview>`의 dom-ready 전에 main이 민 favicon을 놓치지 않기 위해서다. 재생은 창(browser API 하나) 단위다.
  - `packages/shell/renderer/app-frame/webview-host.tsx`: `onAnySession(listener)`를 더해 key별 구독 없이 모든 guest의 session 확정을 듣는다.
  - `packages/shell/renderer/workspace/workspace-window.tsx`: session을 아직 모르는 state를 최대 200개 쌓아 두고 session이 정해질 때 그 탭의 favicon을 적용한다. 같은 origin을 다시 여는 중 state에 favicon이 없으면 저장된 favicon을 지우지 않는다.
  - `packages/shell/renderer/browser/browser-tab.tsx`: 같은 origin으로 다시 읽는 중 favicon이 비어 온 state에서 이전 favicon을 유지한다.
  - `.ico`는 nativeImage가 이 Electron에서 디코딩하지 못한다. 실측으로 `createFromBuffer`가 ICO에서 항상 빈 image를 내고, 48KB 이하일 때만 그대로 통과한다. 인기 site 40곳의 favicon을 재 보면 48KB 초과는 없었다.
why: |
  접힌 float·다른 desk의 browser 탭은 `<webview>`가 mount되지 않아 dom-ready가 늦고, 그 사이 main이 민 favicon state를 아무도 받지 못해 아이콘이 기본으로 남았다. 새로고침·복원처럼 같은 origin을 다시 읽는 동안 favicon이 잠깐 사라지던 것도 같은 원인이다. 큰 favicon을 그대로 싣던 경로는 data URL 상한에 걸려 아이콘이 아예 없었다.
decisions:
  - text: "favicon 요청에 page의 `Referer`를 싣는다. 버린 길: Referer 없이 보내기(WAF가 favicon까지 Referer로 거르는 site가 있어 아이콘이 없다)."
    by: agent
  - text: "48KB를 넘는 `.ico`는 버린다. 버린 길: ICO 디코더를 shell main에 직접 쓰기(파일 형식 파서를 하나 더 유지해야 하고, 실제로는 48KB 넘는 favicon이 드물다)."
    by: agent
  - text: "state 재생은 preload의 `subscribeState`에서 창 단위로 한다. 버린 길: renderer마다 첫 state를 main에 다시 묻기(main에 조회 route를 하나 더 만들어야 한다)."
    by: agent
checklist:
  - "해야: 앱 다시 build"
  - 접힌 float의 browser 탭을 펴면 그 site icon이 바로 보이는지 본다
  - browser 탭 새로고침(Cmd/Ctrl+R) 중에 탭 아이콘이 깜빡 사라지지 않는지 본다
