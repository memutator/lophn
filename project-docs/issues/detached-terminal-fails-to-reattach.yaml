id: detached-terminal-fails-to-reattach
title: project를 떠났다 돌아온 detached terminal이 PTY에 다시 붙지 못한다
kind: bug
status: fixed
topic: workspace-layout
modules: [packages/shell/renderer, packages/shell/main]
now: |
  project 창을 닫거나 다른 공간으로 가면 `Workspace`가 `lophnDetached.close({ key: null })`로 detached 창을 조용히 닫는다(`renderer/workspace/workspace.tsx`). 다시 열면 저장된 값으로 `open({ transfer: null })`만 부른다. terminal 탭의 `terminal_ref`는 `transfer`로만 오고 detached 창의 `TerminalStore`(창마다 `sessionStorage`)는 창과 같이 사라졌으므로, 새 창의 `TerminalTab`(`renderer/terminal/terminal-tab.tsx`)은 runtime 없는 끝난 탭으로 그린다. 같은 실행 안이면 PTY는 terminal host에 그대로 돌고 있다.
impact: |
  같은 실행에서 project를 다시 열기만 해도 detached terminal의 출력과 돌던 명령(dev server, coding agent)에 다시 닿을 수 없다. PTY는 앱을 끌 때까지 남는다. docked·floated terminal은 같은 경우에 다시 붙는다.
fix: |
  (1) main이 조용히 닫은 detached 창 항목의 마지막 탭 값과 transfer를 (project, key)로 이 실행 동안 들고 있다가 같은 key의 `open({ transfer: null })`에 쓴다(중간). terminal의 마지막 `terminal_ref`·`generation`은 detached 창이 `changed`로 알리는 탭 값에 실어야 한다. (2) 떠날 때 detached 창을 닫지 않고 dock시킨다(작음, 대신 다시 열 때 창이 돌아오지 않는다). 추천: (1).
closed: |
  detached 창이 `changed`의 `resume`(kind의 `resume`, terminal은 PTY 참조)을 알리고 main이 `DetachedRegistry`에 이 실행 동안만 들고 있다가, project를 떠나며 조용히 닫힌 창의 값을 (project, key)로 남겨 같은 key의 `open({ transfer: null })`에 한 번 쓰고 지운다. 개별 close·dock·remove와 앱 종료에서도 지우고 디스크에는 쓰지 않는다.
guard: 없음
