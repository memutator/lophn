    docs: []
    unclear: []

  - id: secret-attach
    title: "목적지가 맞을 때만 secret 값을 요청에 붙인다"
    actor: system
    entries: [system:secret-attach]
    uses: [route:provider-credentials/refresh-result, route:issuer-requests/take, route:issuer-requests/done]
    pre: [route:secrets/put]
    boundary: [secrets, lophn-agent]
    code: [packages/core/secrets/file-attach.ts, packages/core/lophn-agent/secret-destinations.ts, packages/core/lophn-agent/run-loop/runtime-secret.ts, packages/core/main/agent-runtime/secret-link.ts]
    steps:
      - "agent runtime이나 앱 child가 supervision pipe로 이름, 목적지, operation을 청한다. child는 url과 method 모양을 먼저 보고 틀리면 invalid_input이다. child는 10초 답 시한을 건다. core는 같은 generation의 child만 받는다. 아니면 forbidden이다"
      - "core가 machine 자격과 process가 살아 있는지 본다. 어긋나면 forbidden이다"
      - "MCP OAuth 이름(mcp-oauth.)이면 등록된 켜진 서버의 이름과 origin을 대조하고 만료가 가까우면 갱신한다. 서버가 없거나 꺼졌거나 origin이 다르면 forbidden이다. 갱신이 재인증을 요구하면 forbidden이다. 닿지 못하고 만료면 unavailable이다. provider.<id> 이름이면 provider 갱신(provider-token-refresh)을 거친다. 그 결과가 conflict, forbidden, invalid_input이면 그 code를 그대로, 나머지는 unavailable로 답한다"
      - "이름 앞머리로 용도를 정한다. provider., mcp., mcp-oauth.는 외부 credential이고 앞머리가 없으면 앱 secret이다. provider-oauth.와 app-oauth.는 누구에게도 보내지 않는다(forbidden). 용도와 호출 종류가 맞지 않으면 forbidden이다(앱 secret을 앱 아닌 호출이 청함)"
      - "provider와 MCP는 그 이름을 쓰는 연결의 origin(https 또는 loopback http)과 목적지가 같을 때만 허용한다. 다르면 forbidden이다. 앱 secret은 apps의 grant 판정에 맡기고 거절이면 그 code를 낸다"
      - "secrets.json에서 값을 읽는다. 이름이 없으면 not-found, 못 읽으면 unavailable이다. 값을 알려진 값 registry가 전부 알고 있을 때만 준다. 모르면 unavailable이다(fail-closed)"
      - "통과하면 값을 transmit callback의 인자로만 주고 응답에는 전송 여부만 남긴다(sent). child는 10초 안에 답이 없으면 값 없이 unavailable로 실패한다. model 요청이 401을 받으면 child가 refresh 표시를 붙여 한 번만 다시 청한다. provider.<id> 이름이면 만료가 멀어도 갱신하고 새 값을 붙이고, 갱신할 것이 없는 이름(API key, MCP 이름)이면 값 없이 conflict로 답해 첫 401이 그대로 돌아간다"
    outcomes:
      - id: sent
        observe: ["request:destination"]
      - id: invalid_input
        code: invalid_input
        observe: ["response"]
        when: "child가 청한 url이나 method 모양이 맞지 않아 pipe로 보내기 전에 거절했다"
      - id: forbidden
        code: forbidden
        when: "generation이 바뀌었거나 child가 죽었다. machine 자격이나 process를 확인하지 못했다. 용도와 호출 종류가 맞지 않는다(app-oauth, provider-oauth 이름, 앱 secret을 앱 아닌 호출이 청함). 목적지가 허용 목록 밖이다(redirect로 host가 바뀐 것 포함). MCP 서버가 없거나 꺼졌다. provider가 없거나 회수됐다. 앱 secret의 grant가 거절했다. MCP 재인증이 필요하다. provider 갱신이 revoked였다"
        observe: ["response"]
      - id: conflict
        code: conflict
        observe: ["response"]
        when: "provider 갱신 기록이 두 번 다 revision 충돌이었다(갱신 쪽 code를 그대로 돌려준다). 또는 refresh 표시 요청인데 갱신할 수 없는 credential(API key, MCP 이름)이다"
      - id: not-found
        code: unavailable
        observe: ["response"]
        when: "secrets.json에 그 이름이 없다. core 안에서는 not_found인데 supervision 응답 경계에서 unavailable로 바뀐다"
      - id: unavailable
        code: unavailable
        observe: ["response"]
        when: "값을 읽지 못했다. 알려진 값 registry에 그 값이 없다(redaction이 준비되지 않았다). token 갱신이 닿지 못하고 실패했다(만료됨, 저장 실패 포함). 앱 secret의 grant 저장소를 열지 못했다. child 쪽에서 10초 답 시한이 지났다. child 쪽에서 pipe가 닫혔다"
    crosses_process: true
    risk: [secret, sandbox, permission]
    refs: []
    docs: [architecture/app-call.md]
    unclear:
      - "mcp. 이름의 oauth2 client_credential은 이 목적지 대조를 거치지 않는다. core가 직접 읽어 설정한 issuer의 token endpoint로 보낸다(mcp-auth-control.ts oauthServerOf)"
      - "앱 secret 목적지 판정은 apps의 allowance에 있어 이 flow의 outcome이 apps 쪽 grant 판정과 맞는지는 apps 영역에서 확인해야 한다"
      - "core가 pipe 메시지 모양을 읽지 못하면 답하지 않는다(runtime-secret의 answer가 undefined). child는 10초 뒤 unavailable을 받으며 원인을 구별하지 못한다"

  # ---- system 흐름 (provider 회수) ----

  - id: provider-disconnect-revoke
    title: "끊은 provider로 도는 turn을 멈춘다"
    actor: system
    entries: [system:provider-disconnect-revoke]
    boundary: [models, lophn-agent]
    code: [packages/core/lophn-agent/providers/watch.ts, packages/core/main/agent-runtime/product-driver.ts, packages/core/lophn-agent/run-loop/driver.ts]
    steps:
      - "agent runtime의 turn pump가 주기마다 core에서 provider 목록을 모든 페이지로 읽는다. 읽지 못하면 아는 목록을 바꾸지 않는다(read-failed)"
      - "처음 읽은 목록은 기준일 뿐이라 아무것도 회수하지 않는다(baseline). 그다음부터 앞 목록에서 사라진 provider마다 그 provider로 도는 turn이 쓸 수 있는지 본다"
      - "쓸 수 없으면(available false) model 호출을 중단하고 providerRevoked를 세운다. 그 turn은 configuration_unavailable로 끝난다(revoked). 사라진 provider가 없거나 그 turn이 아직 쓸 수 있으면 그대로 둔다(unchanged)"
    outcomes:
      - id: baseline
        observe: []
        when: "처음 읽은 목록이라 기준으로만 둔다"
      - id: unchanged
        observe: []
        when: "앞 목록에서 사라진 provider가 없거나, 사라진 provider로 도는 turn이 아직 쓸 수 있다"
      - id: read-failed
        code: unavailable
        observe: []
        when: "provider 목록을 읽지 못했다(core read 실패, 페이지 모양 이상)"
      - id: revoked
        observe: ["event:TurnEnded"]
        when: "사라진 provider로 도는 turn이 쓸 수 없어서 model 호출을 멈추고 configuration_unavailable로 끝났다"
    crosses_process: true
    risk: []
    refs: []
    docs: []
    unclear:
      - "Disconnect한 뒤 같은 id로 다시 Connect하면 두 훑기 사이에 목록에 계속 있어 회수되지 않는다. 사라진 것만 보므로 생기는 틈이다"
      - "providerRevoked 플래그를 보는 turn.ts의 다른 자리들(435, 562, 618 근처)의 종료 사유는 이 flow가 확인하지 않았다. configuration_unavailable은 abortEnd 경로(turn.ts 211)의 사유다"
