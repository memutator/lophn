id: font-picker-installed-search
version: 0.17.0
title: Settings › Appearance의 글꼴을 설치된 글꼴 목록에서 검색해 고르고 굵기도 고른다
modules: [packages/design, packages/core/config, packages/shell/renderer]
checked: []
change: |
  전: Font·Code font·Reading font는 preset이나 Custom을 고르고, Custom이면 설치된 글꼴 이름을 칸에 직접 썼다. 이름이 틀리거나 설치되지 않았어도 아무 말 없이 기본 글꼴로 넘어가 적용됐는지 알 수 없었다. 굵기는 고를 수 없었다.
  후:
  - 글꼴 칸은 design의 새 `SearchSelect`다. 열면 목록 위 검색 칸에 focus가 가고, preset 다음에 이 컴퓨터에 설치된 글꼴(Chromium `queryLocalFonts`)이 이름 순으로 온다. 앱에 실은 글꼴은 "Pretendard (built in)", "JetBrains Mono (built in)"으로 OS에 깐 같은 이름 글꼴과 구별한다.
  - 옆 Select가 그 글꼴에 있는 굵기(Thin~Black)를 고른다. 새 설정 `shell.font_weight`, `shell.code_font_weight`, `shell.reading_font_weight`(100~900, 기본 400)가 token `font.weight.regular`(UI 본문), 새 token `font.weight.mono`(code·pre·코드 편집기·xterm), `font.weight.reading`(문서 본문)을 덮는다. 강조·제목 굵기(medium, semibold)는 그대로다.
  - 저장된 이름이 설치돼 있지 않으면 목록에 Not installed를 붙여 두고, 줄 아래에 기본 글꼴을 쓴다고 알린다.
  - 이름을 직접 쓰는 칸과 그 오류 문구를 지웠다.
  옮기기: 없음. 저장 모양(`shell.font`의 custom과 `shell.font_custom` 이름)은 그대로라 예전에 쓴 이름은 목록에서 고른 값으로 이어진다. 새 굵기 설정은 없으면 기본값이다.
why: |
  사람이 글꼴 이름을 써 넣고도 적용됐는지 알 수 없었다. 다른 데스크탑 앱(ChatGPT 등)처럼 설치된 글꼴에서 고르고 굵기를 따로 고르게 했다.
decisions:
  - text: '굵기는 그 글꼴의 본문 굵기만 바꾸고 강조·제목은 원래대로 더 굵게 둔다. 버린 길: 모든 글자를 고른 굵기 하나로(위계가 사라진다).'
    by: agent
  - text: '글꼴 목록은 core가 아니라 renderer가 Local Font Access로 읽는다. desktop 창은 기본 session이라 권한 handler 없이 허용되고, Linux Electron 44에서 사람의 클릭 없이 읽힌다(이 컴퓨터에서 286 family를 확인했다). 버린 길: main에서 `fc-list`(Linux만 된다).'
    by: agent
  - text: '굵기는 style 이름과 PostScript 이름 끝을 같이 본다. 한국어 이름 글꼴은 style이 "굵은", "가는"처럼 OS 언어로 온다.'
    by: agent
  - text: '기본 글꼴과 OS stack(system, serif)의 굵기는 고정 목록이다: 실은 글꼴은 400~600, OS stack과 목록에 없는 이름은 400·700.'
    by: agent
