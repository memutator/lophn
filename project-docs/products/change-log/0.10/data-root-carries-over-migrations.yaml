id: data-root-carries-over-migrations
version: 0.10.2
title: "쓰던 data root가 새 판으로 이어진다: schema step은 id로 적용하고, data root 파일에도 migration step이 있다. 제품 판은 하나다"
modules: [packages/core/storage, packages/core/main, packages/coding-agent, packages/shell/main, tools]
checked: []
change: |
  전:
  - ledger 적용기는 step의 목록 위치를 판 번호로 썼다. 앞쪽 module에 step을 하나 더하면 뒤 step의 번호가 밀려 기존 ledger가 history_mismatch로 열리지 않았다.
  - ledger 밖 파일(agents/*.md, settings.json, secrets.json 등)의 모양을 바꿀 길이 없었다. 개발 data는 schema가 바뀌면 지웠다.
  - 제품 판이 packages/shell/main/package.json과 CLI의 상수 VERSION 두 곳에 있었다.
  후:
  - 적용기는 schema_migrations.step_id로 적용 여부를 본다. 기록에 없는 id만 차례로 적용하고, 같은 id의 SQL hash가 다르면 history_mismatch, 지금 목록에 없는 id가 적용돼 있으면 newer_schema다. 복구본은 전처럼 미적용 step이 있을 때 먼저 만든다.
  - wiring이 dataSteps({id, run(root)})를 낸다. core가 ledger migration 뒤에 <data root>/data-migrations.json에 없는 step만 돌리고 하나 끝날 때마다 기록한다. 새 data root는 돌리지 않고 모두 적용한 것으로 적는다. 기록에 모르는 id가 있으면 newer_schema로 거절한다.
  - 제품 판은 root package.json의 version 하나다. CLI lophn version이 그것을 읽고, .deb 이름과 Electron 앱 판도 같은 값이다.
  계약:
  - 생긴 것: Wiring.dataSteps, applyDataSteps, data root 파일 data-migrations.json.
why: |
  사람이 lophn을 실제로 쓰기 시작해 ~/.lophn을 지울 수 없다. 새 판을 깔아도 쓰던 data가 그대로 열려야 한다.
decisions:
  - text: "package마다 판을 두지 않는다. .deb 하나가 모든 package를 같은 commit에서 싣는다. 버린 길: package별 판. 맞춰 볼 상대가 없다."
    by: person
  - text: "앱 SDK 판은 이번에 다루지 않는다. 앱 SDK를 덜 써 봤다."
    by: person
  - text: "SDK 설치 사본, 앱 template, node shim은 전처럼 기동마다 설치본과 byte를 맞춰 다시 쓴다. harness hook은 PATH의 lophn을 부르므로 판이 바뀌어도 다시 놓지 않는다. 그래서 data step에 넣지 않았다."
    by: agent
  - text: "자동 업데이트는 두지 않는다. 배포 서버가 없고 .deb 설치는 root가 필요하다. 새 .deb을 apt install로 덮어 깐다. 사람과 agent가 함께 정했다."
    by: person
follow_up: |
  이미 낸 step의 SQL을 고치면 쓰던 ledger가 열리지 않으므로, 앞으로 표를 바꿀 때는 새 step을 더한다(AGENTS.md "호환성").
