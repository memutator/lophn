id: harness-gui-code-block-steer-timing
version: 0.22.0
title: "harness GUI: code block 줄바꿈과 shell 단추, steer, 줄 선 메시지 보존, 시간 박자, 탭 이름 깜빡임"
modules: [packages/shell/main, packages/shell/renderer, packages/design]
checked: []
change: |
  전: 답의 code block이 가로로 넘쳤다. composer에 shell 토글 단추가 있었다. 흐르는 글이 첫 조각 뒤 끝에 한꺼번에 보였다(throttle timer가 새 조각마다 지워졌다). GUI의 steer는 도는 Bash·subagent가 끝나야 닿았다. restart toggle이 GUI 줄의 메시지를 말없이 버렸다. 도는 시간들이 각자 다른 순간에 넘어가고 같이 띄운 subagent가 몇 초씩 달랐다. subagent의 background task가 root에 회색 안내 줄로 보였다. Default model에서 effort가 선택돼 있지 않았다. workspace에서 돌아오면 탭 이름이 잠깐 터미널 경로였다. 다시 뜬 CLI가 origin 없이 적은 task 알림이 사람 메시지로 보였다.
  후: chat code block은 줄바꿈한다. `!`로 시작하는 block에는 복사 단추 왼쪽에 shell 단추가 있어 그 글을 입력칸에 shell mode로 채운다(보내지 않는다). composer 토글과 key `conversation.button.shell-on`·`shell-off`는 지웠고 `conversation.button.fill-shell`을 더했다. `useThrottledLive`는 걸린 frame을 지우지 않고 약 40ms마다 최신 글을 그린다. Claude steer는 `q.backgroundTasks()`로 도는 tool을 background로 보낸다. toggle modal이 줄 선 메시지를 알리고(`terminal.dialog.stop-queued`) 그 글을 입력칸에 되돌리며, GUI 입력 글의 key는 터미널 ref에서 만든다. 도는 시간은 모두 같은 초 경계에서 넘어간다. Agent 줄은 실행이 시작될 때 생긴다. subagent 안의 task는 root에 안내를 내지 않는다. effort는 init이나 설정에서 실제 값을 보인다. 탭 이름은 agent TUI가 foreground일 때만 OSC 제목을 쓴다. `<task-notification>` 글은 받은 메시지다.
  옮기기: 없음.
why: |
  사람이 harness GUI를 써 보고 말했다(사람). streaming은 Claude·Codex·omp desktop 앱의 throttle(걸린 timer를 지우지 않음)을 참고했다.
