id: migration-primary-key-loss-parse
title: 'migration 단계마다 PRIMARY KEY 검사와 `-- loss:` 줄 파싱'
kind: defect
status: kept
topic: activation
modules: [packages/core/apps, packages/protocol]
now: |
  `data/worker/db.ts` `applyStep`이 단계 적용 뒤 새 표마다 `pragma table_info`로 PRIMARY KEY 칸 수를 세어 없으면 단계를 되돌리고 실패한다(`tablesWithoutPrimaryKey`). `protocol/apps/activation/migration-sql.ts` `lossOfStepSql`이 파일 머리 `-- loss:` 줄을 정규식으로 읽고 `releases/activation/desired.ts` `dataChangesOf`가 release 준비에서 부른다. 꼴이 틀리면 준비가 거절된다.
impact: |
  단계마다 검사와 파싱이 붙지만 둘 다 일을 한다. PRIMARY KEY가 없으면 SQLite session이 그 표를 기록하지 않아 rewind가 조용히 틀리고, loss 줄은 사람에게 묻는 판단의 유일한 출처다.
fix: |
  줄일 곳이 없다. 이유를 코드 주석(이미 있음)과 architecture 문서에 두고 이 절을 닫는다(kept). 추천.
closed: |
  남긴다. PRIMARY KEY가 없으면 rewind가 조용히 틀리고, loss 줄은 사람에게 묻는 근거다.
guard: 없음
