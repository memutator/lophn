      - id: name-exists
        code: conflict
        when: "to가 이미 있다(lstat이 잡는다). 그 자리의 내용은 그대로다"
        observe: ["disk:<to> (변화 없음)", "response"]
      - id: into-self
        code: invalid_input
        when: "폴더를 자기 안(하위 경로)으로 복사한다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "from이 디스크에 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 본문 main frame이 아니다(file IPC guard), 또는 from이나 to가 secrets.json이다, 또는 디스크 권한이 없다(EACCES·EPERM)"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "from이나 to가 절대 경로가 아니다, 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "그 밖의 디스크 오류다(공간 부족, 중간에 사라진 경로)"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    unclear:
      - "연결 폴더 밖 path도 복사한다(secrets.json만 거절한다). file-rename과 같은 범위다"

