id: runtime-deno-missing-place-folders
title: agent runtime process의 Deno 권한에 place 폴더가 없다
kind: bug
status: fixed
topic: workspace-session
modules: [packages/core/lophn-agent, packages/core/agent-workspaces]
now: 'file tool과 shell은 agent runtime process(`main/agent-runtime`) 안에서 돈다. 그 process의 권한은 `tools/runtime-permissions.ts`의 `agentRuntimePermissions`가 `placeFolders.read`·`write`를 `allow_read`·`allow_write`에 얹어 만들고, `supervision/security/launch-spec.ts`의 `launchArgv`가 `--no-prompt`와 `--allow-read`·`--allow-write` flag로 바꾼다. 그런데 `run-loop/runtime.ts`의 `specFor`는 늘 `placeFolders: { read: [], write: [] }`를 넘기고 다른 곳에서 채우지 않는다. turn의 `scope`(`agent-roles/place/place-data.ts`)가 폴더를 열어도 Deno 권한은 data root, skill root, socket뿐이라 `tools/file/read.ts`의 `Deno.readFile` 같은 호출은 `NotCapable`이다(같은 flag 조합으로 허락 밖 경로를 읽어 확인했다). 실제 turn을 돌려 보지는 않았다.'
impact: place 폴더가 data root 밖이면 PM, project Operator, App Engineer, 앱 Operator 모두 file tool과 shell로 그 폴더를 못 읽고 못 쓴다. agent가 project 일을 하지 못한다.
fix: 열린 project·앱 source 폴더 목록으로 `placeFolders`를 채우고, 목록이 바뀌면 runtime을 다시 띄운다(hosts·MCP가 바뀔 때와 같은 길, 중간). 폴더 목록 만드는 곳이 `rewind-glue.ts`의 `placeFoldersOf`와 `agent-roles/place/place-data.ts`로 둘이니 같은 규칙으로 합친다(위 "PM이 초안 폴더를 연 같은 turn에 쓰면 forbidden이다"와 같은 정리).
closed: '`run-loop/runtime.ts`가 `readPlaceFolders`로 Deno 권한의 place 폴더를 받는다. 조립(`wiring/lophn-agent-runtime.ts`)이 `runtimeFoldersOf`로 active project 폴더와 active 앱 source 전체의 합을 넘기고, 초안 폴더는 turn 중에 열리므로 `<data root>/projects` 상위째 쓰기를 연다. 목록이 바뀌면 hosts·MCP와 같은 1초 polling에서 child를 다시 띄운다(돌던 turn은 끊긴다). session마다의 범위는 file tool scope가 지킨다. 실제 turn으로는 확인하지 않았다(process를 건너는 확인은 E2E 몫).'
guard: packages/core/agent-roles/place/place-folders_test.ts
