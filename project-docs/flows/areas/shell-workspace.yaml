  - id: tab-float
    title: "탭을 떠 있는 패널로 띄운다"
    actor: person
    entries: [ui:tab-float]
    when: "탭 메뉴 Float, tab.float 키, palette의 Float tab"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/desk-model.ts
      - packages/shell/renderer/shell/float-layer.tsx
    steps:
      - "floatByKey가 float 층을 못 쟀으면 아무것도 하지 않는다"
      - "app_panel 탭은 마지막으로 연 자리(shell.app_launch의 rect)를 쓰고, 나머지는 float 층 가운데 60% 크기 자리를 쓴다"
      - "floatTab이 탭을 tabs에서 빼 floats 맨 위에 넣는다(float은 20개가 상한이고 그때는 그대로다)"
      - "commit이 layout을 저장한다"
    uses: [ipc:shell:workspace-layout-save]
    outcomes:
      - id: floated
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "screen:shell-tab-menu", "screen:shell-tab-menu-edge", "screen:new-float-terminal"]
      - id: unchanged
        when: "float 층 크기를 아직 못 쟀거나, float이 20개 상한이거나, key의 탭이 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  - id: tab-detach
    title: "탭을 OS 창으로 뗀다"
    actor: person
    entries: [ui:tab-detach]
    when: "탭 메뉴 Detach(또는 Move to new window), tab.detach 키(canDetach일 때만 키가 받는다)"
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/main/desktop/wiring/detached.ts
    steps:
      - "분리 통로(props.detached)가 없거나 탭이 없거나 이미 분리된 탭이거나 noDetach kind면 아무 일도 없다"
      - "detach가 kind의 transfer로 탭 값과 옮길 native view 묶음을 만든다. 편집기는 저장 안 된 글을 flush하고, 실패하면 null이다"
      - "transfer가 null이면 옮기지 않는다"
      - "detached open IPC로 main이 OS 창을 만들고 탭 값을 넘긴다. 실패하면 renderer는 값을 버리고 layout은 그대로다"
      - "창을 여는 사이 탭이 layout에서 사라졌으면 그 창을 detached close로 닫는다"
      - "성공한 뒤에야 layout에서 탭을 bounds를 가진 detached 항목으로 바꾼다. detachTab이 상한이면 layout은 그대로다"
      - "commit이 layout을 저장한다"
    uses: [ipc:shell:detached-open, ipc:shell:detached-close, ipc:shell:workspace-layout-save]
    outcomes:
      - id: detached
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: refused
        when: "transfer가 null이다(저장 안 된 글을 저장하지 못했다)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: open-failed
        code: unavailable
        when: "main이 창을 만들지 못했거나 view를 옮기지 못했다. 보낸 값이 틀리거나(invalid_input) 창 권한이 없는(forbidden) 경우도 renderer가 같게 버린다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "response"]
      - id: unchanged
        when: "분리 통로가 없거나, 탭이 없거나, 이미 분리된 탭이거나, noDetach kind라 메뉴에 없다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: closed-meanwhile
        when: "transfer나 창 열기를 기다리는 사이 탭이 layout에서 사라졌다. 이미 연 창은 detached close로 닫는다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "process:detached-window"]
      - id: detached-full
        when: "desk의 detached가 20개 상한이다. 창은 이미 열렸는데 detachTab이 layout을 그대로 둔다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "process:detached-window"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    risk: [data-loss]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "detached-full: api.open이 먼저 창을 열고 detachTab이 상한에서 layout을 안 바꿔, 탭이 tabs에 남은 채 창도 떠 있다. 창을 닫는 code가 없어 같은 탭이 두 자리에 남는다. 결함으로 보고 issue 후보로 올린다"

