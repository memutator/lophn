id: phone-guest-can-cover-app
title: 폰 화면(guest)이 React Native의 `Modal`을 직접 부르면 폰 앱 전체를 덮을 수 있다
kind: bug
status: fixed
topic: phone-screen
modules: [packages/mobile, packages/design/native]
now: |
  kit의 `Sheet`, `Menu`, `Drawer`는 guest 안에서 `Modal`을 쓰지 않고 `Screen` 안의 view로 그린다(`packages/design/native/overlay/sheet.tsx`의 `SheetLayer`). status bar도 막혀 있다(sandbox patch가 guest에서 `StatusBarManager`를 빼고 base가 `StatusBar`를 stub으로 바꾼다). 남은 길은 화면 source가 kit을 거치지 않고 React Native의 `Modal`을 직접 부르는 것이다. `Modal`은 폰 앱 전체의 window에 그려지고 sandbox의 허용 목록이 그것을 막지 않는다. 지침(`design-app` skill)은 `Modal`을 쓰지 말라고 한다.
impact: |
  AI가 쓴 폰 화면이 lophn 앱 전체를 덮는 화면을 그려 lophn 자신의 화면(승인, 설정)처럼 보이게 할 수 있다. 사용자 앱 코드는 AI가 쓴 것이라 lophn이 그 화면에서 사람을 속이는 길을 막아야 한다는 쪽이다(AGENTS.md의 막는 대상). 실제로 속이는 화면을 만들어 본 것은 아니고 덮을 수 있다는 것을 확인했다.
fix: |
  - 한 것: kit의 overlay를 화면 안으로 옮겼다. 앱 화면에서 폰의 뒤로 가기가 kit Sheet를 닫지 않게 됐다.
  - 중간(추천): sandbox library가 guest에 열어 주는 view 목록에서 `Modal`을 뺄 수 있는지 본다. 가능하면 화면 어디서든 덮을 수 없다.
  - 작음: release 준비가 폰 화면 source에서 `Modal` import를 찾아 거절한다. 이름을 바꿔 부르는 것은 못 잡는다.
closed: |
  guest React Native 래퍼에서 Modal을 제외하고 Android sandbox ViewManager에서 RCTModalHostView를 걸러 guest가 host 앱 전체를 덮지 못하게 막았다.
guard: packages/mobile/src/apps/guest/session.test.ts
