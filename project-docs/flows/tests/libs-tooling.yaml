group: libs-tooling
files:
  - path: packages/cli/commands/agent-models_test.ts
    covers: [agent-models-list:listed]
    note: 켠 model과 provider 목록의 교집합만 내고 provider 계정·credential·접속 metadata를 결과에서 뺀다. catalog 다음 page와 미확인 옵션도 함께 본다
  - path: packages/base/os/cmd-shim_test.ts
    covers: []
    note: Windows cmd launcher 인자 escape 문자열 helper

  - path: packages/base/os/socket-dir_test.ts
    covers: []
    note: control socket 폴더 경로 계산과 uid 검사(순수 helper)

  - path: packages/base/os/tree_test.ts
    covers: []
    note: 프로세스 트리 신호 helper. ok·absent·failed를 돌려주나 어느 flow outcome인지 적히지 않음

  - path: packages/base/redaction/product-redactor_test.ts
    covers:
      - workflow-start-agent:unavailable
      - workflow-start-flow:unavailable
      - workflow-instance-create:unavailable
      - workflow-report:unavailable
      - workflow-edit:unavailable
      - workflow-instance-apply:unavailable
      - workflow-flow-report:unavailable
      - queued-edit-record:unavailable
      - custom-reply-auto:unavailable
      - custom-call-reply:unavailable
    note: 알려진 값과 prefix credential 가림, 알려진 값을 다 모르면 null(fail-closed). null이 "글 redaction이 끝나지 않음" 갈래를 정하므로 그 unavailable을 덮는다. 너무 넓으면 줄일 것

  - path: packages/base/telemetry/telemetry_test.ts
    covers: [log-line-write:written, log-line-write:filtered]
    note: 첫 test는 error 한 줄을 쓰고 level 아래는 거르며 secret을 가린다. 둘째 test는 traceparent 파서 helper

  - path: packages/cli/connection/core_test.ts
    covers: [cli-core-connect:agent-shell, core-stop:forbidden]
    note: "자격 없는 lophn agent shell 안의 CLI는 control socket에 닿지도 core를 띄우지도 멈추지도 않고 forbidden이다"

  - path: packages/cli/commands/agent_test.ts
    covers: [cli-argv:invalid-input]
    note: agent.create와 agent.update 입력 schema가 사람 전용 칸(skip, mcp_servers, apps, permissions)을 CLI에서 먼저 거른다

  - path: packages/cli/commands/app_test.ts
    covers: []
    note: app.status 요약 글 formatting과 app.link_source의 상대 path 풀이. 결과 상태는 core 답이고 이 test는 글과 입력만 본다

  - path: packages/cli/commands/browser_test.ts
    covers: []
    note: "browser.snapshot이 page 글을 untrusted tag로 감싸고 글 안의 닫는 tag를 흉내 낸 것이 밖으로 나가지 못하는지만 본다. core는 가짜라 route outcome은 단정하지 않는다"

  - path: packages/cli/commands/call_test.ts
    covers: []
    note: call.send가 dedup과 idempotency key에 tool call id를 싣는지만 본다. core의 dedup 판정은 call-send가 core 쪽 test로 본다

  - path: packages/cli/commands/domain-names_test.ts
    covers: []
    note: 내장 명령 묶음이 앱 slug로 쓰이지 못하게 하는 registry 검사

  - path: packages/cli/commands/package_test.ts
    covers: [package-guide-read:ok]
    note: package.read의 guide 창 나누기와 이어 읽기(builtin과 사용자 package). 창 계산은 CLI 쪽

  - path: packages/cli/main_test.ts
    covers:
      - terminal-hook-forward:skipped
      - cli-argv:help
      - cli-argv:result
      - cli-core-connect:attached
      - cli-core-connect:joined-agent
      - cli-core-connect:joined-address
      - cli-core-connect:address-mismatch
      - cli-core-connect:core-unavailable
      - core-stop:stopped
      - core-stop:unavailable
      - core-stop:forbidden
      - run-read:ok
    note: "자격 경계 표. agent 자격은 identify가 알린 core에만 보내고, user 자격은 ensure 뒤 connect로 받는다. hook은 LPN_TERMINAL_HOOK이 없으면 조용히 끝난다. agent 자격이 401로 거절되면 user 자격을 받지 않는 것은 outcome이 없다"

  - path: packages/coding-agent/harnesses/codex-trust_test.ts
    covers: []
    note: Codex hook declaration hash 계산 helper

  - path: packages/coding-agent/harnesses/install_test.ts
    covers:
      - harness-hook-install:installed
      - harness-hook-install:unchanged
      - harness-hook-install:failed
      - harness-hook-install:conflict
      - harness-hook-uninstall:removed
      - harness-hook-uninstall:unchanged
      - harness-hook-uninstall:failed
      - harness-hook-check:ok
      - harness-hook-check:missing
      - harness-hook-check:unchanged
    note: "installGlobal과 uninstallGlobal의 판정(형식별 보존, 파싱 실패 failed, muse conflict, 지우기 뒤 흔적 없음, 읽은 뒤 다른 도구가 고친 설정을 다시 읽어 지킨다). dry_run 행 값 missing·unchanged는 harness-hook-check"

  - path: packages/coding-agent/harnesses/skill-copies_test.ts
    covers: [harness-sync-skills:synced]
    note: 표시 file이 있는 폴더만 덮고 지우며 사람 폴더와 폴더 밖 이름은 건너뛴다

  - path: packages/coding-agent/local/harness-run_test.ts
    covers: [harness-sync-skills:synced]
    note: "harness extension이 꺼지면 lophn-agent skill 사본만 지우고 사람 폴더는 둔다. 설정 file 쓰기는 symlink를 따라가 target을 바꾸고 mode를 지킨다"

  - path: packages/protocol/shell/keybindings_test.ts
    covers: [key-press:command-run, key-press:passed-on, key-overrides-main:applied, key-overrides-restore:restored]
    note: "key 표, chord, context 판정, 사람이 바꾼 key 저장, 겹침 보고 단위. key-press 판정, 사람이 바꾼 키(key-overrides-main·restore)"

  - path: packages/design/appearance_test.ts
    covers: [appearance-set:applied, appearance-set:ignored, theme-files:listed]
    note: 글꼴 이름·theme file 색·accent의 CSS 안전 검사(hex만 CSS에 쓴다), 목록 밖 값이면 appearance 전체 거절, 내장 theme과 보정한 accent의 대비

  - path: packages/design/components/reading/markdown/stream_test.ts
    covers: []
    note: 스트리밍 중인 markdown 표시와 parse cache 렌더 helper

  - path: packages/relay/relay_test.ts
    covers: []
    note: "증명하지 못한 control socket(증명 없음, 다른 key의 증명)에는 폰 연결이 이어지지 않는다. 폰 연결 둘의 message(data socket 전에 든 것 포함, 두 방향)가 서로의 data socket으로 가지 않고, 받는 쪽이 1 MiB를 넘게 밀리면 그 짝만 닫힌다"

  - path: packages/protocol/remote/channel_test.ts
    covers: []
    note: "Noise IK test vector(cacophony), responder가 받는 상대 공개 key와 큰 frame 나누기, 다른 key의 responder와 handshake 실패, record를 바꾸거나 빠뜨리거나 순서를 바꾸면 받는 쪽이 끊음"

  - path: packages/protocol/acp/reduce_test.ts
    covers: [acp-projection:ok, acp-read:reread]
    note: "Bus event를 acpUpdatesOf로 바꾸고 클라이언트 reducer로 접는다(두 번 접어도 같음, 항목 순번 순서). reread 판정은 acp-read:reread"

  - path: packages/protocol/apps/declaration/validate_test.ts
    covers: [declaration-check:passed, declaration-check:errors]
    note: 앱 선언 검증기. 이름 규칙, 중복, icon 경로·lucide 이름 거절과 정규형. events·subscriptions는 비면 칸이 없고 구독 handler 이름(on.<source>.<event>)이 operation·command와 겹치면 거절한다. 선언 ID와 입력 이름은 보존하고 CLI command·flag가 겹치면 slug 없이도 거절한다. 검사 결과 passed와 errors를 정한다

  - path: packages/protocol/coding-agent/headless/headless_test.ts
    covers: [harness-turn-run:configuration-unavailable]
    note: headless 출력 parser(helper)와 권한 표. deny를 옮길 수 없는 harness는 null이고 그때 configuration-unavailable이다. 전부 허락 flag가 없는 것도 본다

  - path: packages/protocol/coding-agent/hook-signal_test.ts
    covers:
      - terminal-agent-track:running
      - terminal-agent-track:waiting
      - terminal-agent-track:idle
      - terminal-agent-track:ignored
    note: harness hook payload를 신호로 판정한다. TurnStarted는 running, PermissionRequested는 waiting, TurnEnded는 idle, 상태를 안 바꾸는 신호는 ignored. 둘째 test는 harness 표 일관성 검사

  - path: packages/protocol/lophn-agent/call-policy_test.ts
    covers: [call-send:call-policy-refused, team-spawn:call-policy-refused]
    note: mayCall 권한 경계. private workspace와 workspace·agent 쌍 규칙, home lophn의 reply none 예외. call.send와 team.spawn이 같은 판정을 쓴다

  - path: packages/protocol/lophn-agent/mcp-settings_test.ts
    covers: [workspace-extension-change:invalid_input]
    note: MCP 서버 설정 schema. secret 이름은 mcp. 앞머리만, stdio env의 secret 거절

  - path: packages/protocol/lophn-agent/message-content_test.ts
    covers: []
    note: 저장 본문 codec round trip(queue 복원에 쓰는 helper). 결과 outcome을 정하지 않는다

  - path: packages/protocol/lophn-agent/model-picker_test.ts
    covers: []
    note: picker 목록 구성 helper(알려 준 목록, catalog, 사람이 적은 항목, 켠 model 거르기)

  - path: packages/protocol/projects/outline-markdown_test.ts
    covers: []
    note: markdown 목차 parser helper

  - path: packages/sdk/agent/agent_test.ts
    covers: [sdk-agent-session:reply-failed, sdk-agent-session:reply-value]
    note: parseReply가 답 꼴을 맞는지 본다(틀리면 error, 맞으면 value). 나머지는 type 동일성 검사와 message id helper

  - path: packages/sdk/cap-store/changeset_test.ts
    covers: [app-rewind-apply:cancelled-conflict, sdk-store-open:migration-invalid]
    note: "쓰기 구간 changeset 캡처(lophn_data_schema 표는 뺀다)는 outcome이 없다. changeset 충돌이면 하나도 적용하지 않고, PRIMARY KEY 없는 migration은 rollback한다"

  - path: tests/support/fake-oauth/issuer_test.ts
    covers: []
    note: 테스트용 fake OAuth 발급자 support

  - path: tests/support/fake-server/server_test.ts
    covers: []
    note: 테스트용 fake model server support. adapter parser를 쓰지만 제품 outcome은 아님

  - path: tests/support/fake-server/shape_test.ts
    covers: []
    note: fake server가 내는 SSE 모양이 fixture와 같은지 보는 support 검사

  - path: tools/check-deps_test.ts
    covers: []
    note: check 도구가 extension의 금지 import를 막는지 보는 검사 도구

  - path: tools/lucide-names_test.ts
    covers: []
    note: 앱 icon 선언 `lucide:<이름>`을 거르는 이름 목록이 shell의 lucide-react 이름과 같은지 보는 도구 test

  - path: tools/check-source_test.ts
    covers: []
    note: check 도구가 core main의 custom fetch와 DOM title 속성을 막는지 보는 검사 도구

  - path: tools/install-checklist_test.ts
    covers: []
    note: 설치 체크리스트가 깔린 판 초과 설치할 판 이하의 항목만 모으고 downgrade는 경고만 내는지 보는 도구 test

