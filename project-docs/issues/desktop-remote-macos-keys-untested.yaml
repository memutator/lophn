id: desktop-remote-macos-keys-untested
title: 다른 기계의 창에서 macOS·Windows의 단축키와 창 단추가 되는지 보지 못했다
kind: bug
status: open
topic: remote
modules: [packages/shell/main, packages/shell/renderer, packages/shell/preload]
now: |
  다른 기계의 창은 `preload-remote`로 단축키(`lophnShortcuts`), intent, 창 단추만 받고 이 컴퓨터의 창 목록(`ctx.windows`)에 들지 않는다. `packages/shell/main/desktop/wiring/desktop.ts`의 창 안 shortcut은 `ctx.topWindows`까지 찾아 그 창에도 보내지만, macOS는 shell renderer 자신의 키를 menu가 먼저 가져가 main이 삼키는 길이고 app menu의 항목(창 닫기, 새 창 등)이 어느 창에 가는지는 이 컴퓨터의 창 기준이다. 이 길은 Linux headless 실행으로만 보았고 macOS·Windows의 실제 창에서는 보지 못했다.
impact: |
  사람이 보는 동작(확인 못 함): macOS에서 다른 기계의 창에 focus가 있을 때 Cmd 키나 menu 항목이 그 창 대신 이 컴퓨터의 창에 가거나 아무 일도 하지 않을 수 있다.
fix: |
  - (작음, 추천) macOS·Windows 설치본에서 다른 기계의 창을 열고 팔레트, Home, 탭 닫기, 창 닫기·최소화, menu의 Close Window를 눌러 본다. 틀린 것이 나오면 menu 항목의 대상 창을 `ctx.topWindows`의 focus 창으로 고른다.
