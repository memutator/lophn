      - "지금 탭에서 도는 session은 live 줄 하나로만 남는다. 목록에서 고른 session을 여는 것은 terminal-open의 resume 값이다"
    outcomes:
      - id: listed
        observe: [response]
    crosses_process: false

  - id: terminal-agent-session-rename
    title: "사람이 저장한 session 이름을 정하거나 고정을 푼다"
