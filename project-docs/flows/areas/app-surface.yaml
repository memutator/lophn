        observe: [screen:app-space]
      - id: content-size-set
        observe: [screen:app-space]
      - id: ignored
        when: "이 entry의 page가 아니거나 크기 값이 맞지 않는다(응답 없이 버린다)"
        observe: []
    crosses_process: false
    docs: [architecture/app-call.md]

