id: builtin-skill-name-skipped-list
title: '끌 수 없는 내장 skill과 같은 이름의 사람 skill을 `skipped`에 남긴다'
kind: defect
status: kept
topic: agent-definition
modules: [packages/core/lophn-agent]
now: |
  `extensions/skills.ts`의 `mergeSkillLayers`가 끌 수 없는 내장 skill이 이미 있는 이름의 후보를 건너뛰면서 `skipped`에 `{path, reason}`을 넣는다. `skill-read.ts`가 이를 읽기 결과에 싣는다.
impact: |
  skipped 기록이 하나 더 있다. 이것이 없으면 사람이 만든 skill이 왜 안 보이는지 알 수 없다.
fix: |
  남길지 정한다. architecture 문서가 "끌 수 없는 내장 skill은 사람 skill이 같은 이름으로 덮지 못한다"를 지키는 규칙으로 두므로 이유를 알리는 것이 맞다. 추천: 남긴다.
closed: |
  architecture 문서가 끌 수 없는 내장 skill을 사람 skill이 같은 이름으로 덮지 못하게 지키는 규칙이라, 왜 안 보이는지 알리는 `skipped`가 필요하다.
guard: 없음
