    note: "명단으로 짓는 컴퓨터 목록 store(가짜 link, 실제 서명). root로 확인하지 못한 거절(빼기 없음, 모르는 컴퓨터가 서명한 빼기)로는 그 link만 멈추고(revoked) 컴퓨터 목록과 기기 key를 잊지 않으며, 저장한 컴퓨터가 서명한 빼기는 거절로 왔든 민 명단으로 왔든 목록·명단·key를 잊는다. 명단 전에 pairing한 컴퓨터는 서명 key를 join 답에서만 배우고(그 host key를 주장하는 명단만으로는 root가 아니다) 그 뒤 명단의 다른 컴퓨터가 reach로 목록에 뜨고 link가 열리며, 명단에서 빠지면 목록과 link에서 빠진다. sample 컴퓨터는 폰 dev build에서만 보인다"

