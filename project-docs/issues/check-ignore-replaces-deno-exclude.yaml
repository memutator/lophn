id: check-ignore-replaces-deno-exclude
title: "check의 test 단에 붙인 `--ignore`가 deno.json의 exclude를 지움"
kind: mistake
status: fixed
topic: mistakes
modules: [tools]
now: |
  brief가 "`deno.json`의 `test.exclude` 대신 `tools/check.ts`의 `deno test`에 `--ignore=tests/e2e,tests/live`를 붙인다"고 정했고 worker가 그대로 했다. Deno 2.9.7에서 CLI `--ignore`는 root `deno.json`의 `exclude`(`.claude`, `.dev-data`, `project-docs`, `packages/shell/main` …)에 더해지지 않고 그것을 대체한다. 그래서 `check:full`의 discovery가 `.dev-data/` 아래 임시 `*_test.ts`와 core가 깐 template의 test까지 찾았다. lead가 다음 task의 merge에서 worktree의 `.dev-data` file 때문에 full check가 실패해 찾았다.
impact: |
  main checkout에서 `check:full`을 돌리면 `.claude/worktrees/*`의 남의 test까지 돈다. data root에 깔린 template test가 실패하면 check가 이유 없이 빨개진다.
cause: |
  brief를 쓸 때 "`--ignore`는 discovery에서만 빼고 직접 준 인자는 돈다"까지만 확인하고 config exclude와 합쳐지는지는 보지 않았다. worker는 임시 file 확인을 `tests/` 안에서만 했다.
prevent: |
  코드 주석으로 둔다. 다시 생기면 check 자신을 보는 확인(`.dev-data`에 실패하는 임시 test를 두고 `check:full`)을 brief의 끝남 기준에 넣는다.
closed: |
  `tools/check.ts`의 test 단이 `--ignore`에 `DENO_EXCLUDED`(root `deno.json`의 exclude와 같은 목록)와 `NOT_IN_CHECK`를 같이 준다. 그 자리 주석이 "CLI --ignore는 root deno.json의 exclude를 대체한다"를 적는다.
guard: 없음
