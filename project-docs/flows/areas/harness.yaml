      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "보이는 칸은 focus와 상관없이 크기를 보낸다. 폰이 잡은 크기(remote_size)가 있으면 놓는다: 마지막에 잡은 쪽이 이긴다"
    outcomes:
      - id: resized
        observe: [response, event:TerminalRuntimeChanged]
      - id: not_found
        code: not_found
        when: "core가 그 터미널을 모른다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "지금 generation이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY host가 답하지 않았다(host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminals-watch
    title: 화면이 터미널의 날 출력을 받겠다고 lease를 켜고 갱신하고 끈다
    actor: person
    entries: [route:terminals/watch]
    uses: [route:terminals/snapshot, system:gateway-stream]
    boundary: [core, event-stream]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/protocol/events/transient.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "on이면 (principal, watcher)의 lease를 30초로 만들거나 갱신한다. 화면은 10초마다 같은 호출을 한다. off이거나 기한이 지나면 그 lease를 지운다"
      - "그 터미널에 lease가 하나라도 있는 동안 host가 묶은 출력 chunk 하나마다 TerminalOutputAppended {subject terminal:<ref>}를 Bus에 낸다. lease가 없으면 내지 않고 host의 화면만 이어진다"
      - "화면은 watch → snapshot{after_seq} → 받은 seq보다 큰 event만 쓴다(다른 generation은 버린다). seq가 건너뛰거나 Gateway가 다시 열리면 마지막 seq로 snapshot을 다시 읽는다. core는 터미널마다 queue를 두지 않는다"
    outcomes:
      - id: watching
        observe: [response, event:TerminalOutputAppended]
      - id: stopped
        when: "on이 false이거나 lease 기한이 지났다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "core가 그 터미널을 모른다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/terminal-agent.md, architecture/event.md]

  - id: terminals-name
    title: 화면이 탭 줄에 보이는 터미널 이름을 core에 둔다
    actor: person
