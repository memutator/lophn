  - id: provider-token-refresh
    title: "구독 로그인의 access token을 만료 전에 갱신한다"
    actor: system
    entries: [route:provider-credentials/refresh-result]
    uses: [route:provider-credentials/record-models, route:issuer-requests/take, route:issuer-requests/done]
    boundary: [models, secrets]
    code: [packages/core/lophn-agent/providers/oauth-refresh.ts, packages/core/lophn-agent/providers/oauth-secrets.ts, packages/core/main/daemon/wiring/lophn-agent-runtime.ts]
    steps:
      - "agent runtime이 provider.<id>의 값을 청하면 secret 부착(system:secret-attach)의 provider hook(prepareToken)이 부른다. provider 줄을 읽는다. 못 읽으면 provider-unreadable이다. 구독 OAuth가 아니거나 revoked면 갱신 없이 넘긴다. 만료까지 5분을 넘게 남았으면 갱신 없이 넘긴다(그때 provider-models 읽기를 뒤에 건다)"
      - "같은 provider의 갱신은 한 번에 하나다. 저장된 token과 meta를 읽는다. 없거나 깨졌으면 not-stored다. Antigravity 계정에 project가 없어도 not-stored다"
      - "요청 중에 401을 받은 child가 다시 청하면(refresh 표시) 만료가 멀어도 갱신한다. 저장하지 못한 채 회전한 refresh token이 메모리에 있으면 저장된 옛 것보다 그것을 먼저 쓴다"
      - "refresh_token grant를 발급자 요청 대기열(agent runtime)로 보낸다. 닿지 못했거나 응답이 이상하거나(WAF·proxy의 JSON 아닌 400·401 포함) 200이 아니면, token이 아직 만료 전이면 still-valid, 만료됐으면 unavailable(refresh-failed)이다"
      - "보낸 뒤 provider를 다시 읽어 logged_in_at이 같은지 본다. 바뀌었거나 다시 읽지 못했으면 connection-changed다"
      - "발급자의 오류 code가 invalid_grant, invalid_client, unauthorized_client면 credential을 revoked로 기록하고 forbidden이다(기록 revision이 바뀌었으면 한 번 다시 읽어 기록한다). 200이면 회전한 refresh token을 먼저, access token을 그다음 secrets.json에 쓴다(3번까지 재시도, 못 쓰면 store-failed). 그다음 refresh-result로 만료 시각을 기록한다(refreshed). 기록이 conflict가 아닌 이유로 실패하면 record-failed다"
    outcomes:
      - id: refreshed
        observe: ["ledger:provider_credentials", "ledger:providers", "disk:<root>/secrets.json", "request:issuer"]
      - id: not-due
        when: "만료까지 OAUTH_REFRESH_LEAD_MS(5분)보다 많이 남았다. 발급자에 가지 않고 저장된 access token을 그대로 secret 부착에 넘긴다. 목적지 요청에 실리는 것은 secret-attach:sent다"
        observe: ["request:destination"]
      - id: still-valid
        when: "발급자에 닿지 못했거나 응답이 이상하거나(JSON 아닌 400·401 포함) 200이 아니지만 지금 token이 아직 만료 전이다. 아무것도 기록하지 않고 token을 건넨다"
        observe: ["request:issuer"]
      - id: revoked
        code: forbidden
        when: "발급자가 오류 code invalid_grant, invalid_client, unauthorized_client로 grant를 거절했다(상태 번호는 보지 않는다). credential을 revoked로 기록하고 다시 로그인하라고 답한다"
        observe: ["ledger:provider_credentials", "ledger:providers", "request:issuer"]
      - id: not-stored
        code: unavailable
        when: "저장된 token이나 meta가 없거나 깨졌다, Antigravity 계정에 project가 없다. 발급자 요청 없이 막힌다"
        observe: ["response"]
      - id: provider-unreadable
        code: unavailable
        when: "갱신 전에 provider 줄을 읽지 못했다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "만료됐는데 발급자에 닿지 못했거나 응답이 이상해 갱신하지 못했다(refresh-failed)"
        observe: ["request:issuer", "response"]
      - id: store-failed
        code: unavailable
        when: "회전한 refresh token이나 access token을 secrets.json에 3번 다 쓰지 못했다. 회전한 refresh token은 메모리에 두고 다음 갱신이 먼저 쓴다(재시작하면 잃어 다시 로그인해야 한다)"
        observe: ["request:issuer", "response"]
      - id: connection-changed
        code: unavailable
        when: "발급자 응답을 기다리는 사이 Disconnect했거나 다시 로그인해 logged_in_at이 바뀌었다. 그 뒤 provider를 다시 읽지 못한 것도 여기다"
        observe: ["request:issuer", "response"]
      - id: record-failed
        code: unavailable
        when: "갱신 결과 기록이 conflict가 아닌 이유로 실패했다(ledger 쓰기 오류)"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "두 번 기록해도 revision이 맞지 않는다"
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "갱신 결과를 기록하려는 provider가 그 사이 지워졌다(record의 requireProvider). 두 번째 기록도 같다"
        observe: ["response"]
    crosses_process: true
    risk: [secret, data-loss]
    refs: []
    docs: []
    unclear:
      - "record가 not_found를 주면(provider가 그 사이 지워짐) 이 flow는 unavailable로 적었지만 code가 그대로 나간다. 삭제와 갱신이 겹치는 경우만 해당한다"
      - "구독 계정과 내장 API key provider의 model 목록은 token이나 key를 건넨 뒤 뒤에서 읽는다(readModelsWhenStale): 갱신 직후, 이 process에서 처음 쓸 때, 마지막으로 읽기 시작한 뒤 2시간이 지났을 때. 실패해도 2시간을 기다리고 앞 목록을 남긴다. 그 읽기는 이 flow의 갈래가 아니다"

