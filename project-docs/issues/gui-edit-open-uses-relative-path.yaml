id: gui-edit-open-uses-relative-path
title: GUI의 변경 파일 Open이 cwd 상대 경로로 열어 "못 연다"가 뜬다
kind: bug
status: fixed
topic: harness-gui
modules: [packages/shell/renderer, packages/shell/main]
now: |
  edit 카드의 Open은 `packages/shell/renderer/conversation/agent-thread.tsx`에서 `onOpenFile(entry.edit.path)`로 document 탭을 연다. ACP edit detail(`packages/protocol/acp/items.ts`)은 `document`(절대 경로)와 `path`(보이는 이름) 둘을 갖는데, harness-gui adapter는 `path`를 cwd 상대로 낸다(`claude.ts` `relative`, `codex.ts`, `opencode.ts`, `omp.ts`). document 탭의 file adapter(`packages/shell/main/editor/file-adapter.ts` `accept`)는 절대 경로가 아니면 `invalid_input`으로 거절한다. `thread-layout.ts`가 `document`를 entry에 옮기지만 읽는 곳이 없다. lophn agent는 core가 `document`와 `path`를 같은 경로로 내서 열린다.
impact: |
  GUI에서 agent가 고친 파일을 카드의 Open으로 열 수 없다. 카드에 보이는 경로가 맞아 사람은 원인을 모른다. Claude가 cwd 밖에서 고친 파일은 절대 경로라 열린다.
fix: |
  Open과 `EditCard`가 `entry.edit.document`를 쓴다. adapter마다 `document`가 절대 경로인지 fixture로 확인한다(omp는 `args.path`가 상대일 수 있다). 작음. 추천.
closed: |
  edit 카드의 Open이 절대 경로인 `entry.edit.document`로 연다. omp adapter는 상대 경로로 온 `args.path`를 cwd에 붙여 `document`를 절대 경로로 낸다.
guard: 없음
