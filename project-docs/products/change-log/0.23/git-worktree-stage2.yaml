id: git-worktree-stage2
version: 0.23.190
platform_note: none
title: "git worktree 2단계(화면): Source Control 패널·git_diff 탭·Explorer worktree 가지·worktree 창·열 때 고르기와 브랜치 꼬리표·Project settings › Worktrees"
