schema_version: 1
catalog: ../boundary-catalog.yaml
requirements:

  # 원인 구분

  - id: req-0450
    status: accepted
    subject: diagnostics
    statement: lophn 내부, SDK, desktop의 오류는 앱을 쓰던 중에 났어도 앱 문제로 돌리지 않고 lophn 자체의 진단으로 기록한다.
    acceptance:
      - 앱 코드 frame이 없는 내부 예외와 SDK 내부 오류를 일으키면 앱 문제는 생기지 않는다.
      - 디스크 부족과 손상된 저장소를 만들면 lophn 실패로 기록되고 앱 문제는 생기지 않는다.
      - 같은 오류가 진단에 오류 종류와 안전한 위치와 함께 남는다.

  # 폐기: req-0450에 합쳤다.
  - id: req-0451
    status: rejected
    subject: diagnostics
    statement: 디스크 부족과 저장소 손상은 lophn 자체의 실패로 기록하고 앱 문제로 돌리지 않는다.
    acceptance:
      - 디스크 부족과 손상된 저장소를 만들면 lophn 실패로 확인 가능한 이유와 함께 기록된다.
      - 같은 상황에서 앱 문제는 생기지 않는다.

  # 운영 log와 crash 기록

  - id: req-0452
    status: accepted
    subject: diagnostics
    statement: 운영 log와 crash 기록도 쓰기 전에 redaction을 거친다.
    acceptance:
      - token, 인증 header, 등록된 secret이 든 오류를 일으키면 log와 crash 기록에서 그 값이 가려진다.
    related:
      - base

  # 폐기: 기록이 redaction을 거치면 된다(req-0452). "담기지 않는다"는 없는 것을 찾는 확인이다.
  - id: req-0453
    status: rejected
    subject: diagnostics
    statement: 운영 log와 crash 기록은 process 메모리 덤프, stdout·stderr 원문, HTTP 덤프를 자동으로 담지 않는다.
    details:
      forbids:
        - crash 기록에 process 메모리 덤프, stdout·stderr 원문, HTTP 덤프를 자동으로 담는 것
    acceptance:
      - process를 crash시키고 stdout, stderr, HTTP 요청을 남긴 뒤 진단 자료를 보면 그 원문이 들어 있지 않다.

  # 폐기: log가 화면과 응답을 막지 않는 것은 당연한 구현 품질이다.
  - id: req-0454
    status: rejected
    subject: diagnostics
    statement: 운영 log는 비동기로 쓰고, log 출력이 막혀도 API와 app-api와 무관한 앱 응답이 기다리지 않는다.
    acceptance:
      - log 쓰기를 지연시키거나 실패시켜도 다른 API 응답과 앱 응답이 지연 없이 나간다.

  # 폐기: 세부다.
  - id: req-0455
    status: rejected
    subject: diagnostics
    statement: 운영 log의 기본 level은 info다.
    acceptance:
      - 처음 설치한 직후 적용 중인 level이 info이고 설정에서 조회된다.

  - id: req-0456
    status: accepted
    subject: diagnostics
    statement: 운영 log와 crash 기록은 용량 상한을 넘으면 오래된 것부터 지운다.
    acceptance:
      - 상한을 넘기면 가장 오래된 log만 지워지고 최근 진단은 조회된다.

  # 보안 사건

  # 폐기: 혼자 쓰는 desktop app에서 보는 사람이 정해져 있지 않고 과하다.
  - id: req-0457
    status: rejected
    subject: diagnostics
    statement: 인증 실패, Origin 거부, 권한 밖 접근, secret 사용 같은 보안 사건은 일반 진단과 구분해 찾을 수 있다.
    acceptance:
      - 각 사건을 일으키면 보안 진단으로 찾을 수 있다.
      - 그 기록에 범위 밖 대상과 secret 원문은 담기지 않는다.

  - id: req-0458
    status: accepted
    subject: diagnostics
    statement: 인증하지 않은 요청의 인증 실패와 거부는 용량이 제한된 운영 log에만 남기고, lophn 기록 저장소의 event로 만들지 않는다.
    acceptance:
      - 인증하지 않은 요청을 많이 보내면 lophn 기록의 event는 늘지 않는다.
      - 같은 요청으로 제한된 크기의 log만 남는다.

  # 상태 점검

  - id: req-0459
    status: accepted
    subject: diagnostics
    statement: 상태 점검은 구성 요소마다 지금 쓸 수 있는지, 안전한 불가 이유, 실제로 점검한 시각을 보여 준다.
    acceptance:
      - 구성 요소 하나를 쓸 수 없게 만들면 점검 결과에 그 요소의 불가 이유와 점검 시각이 나온다.

  # 폐기: 처음부터 맞는 권한으로 만들면 되고, 사후 감사는 과하다.
  - id: req-0460
    status: rejected
    subject: diagnostics
    statement: 보안 상태 점검은 실행 자격을 담은 저장소의 권한이 너무 열려 있는지 검사하고 안전한 결과로 보여 준다.
    acceptance:
      - 권한을 넓게 연 자격 저장소를 두고 점검하면 근거와 점검 시각이 나온다.
      - 점검 결과에 자격 값은 나오지 않는다.

  # 폐기: base req-0602가 쓰기 전에 key 패턴을 가린다. 이중 장치다.
  - id: req-0461
    status: rejected
    subject: diagnostics
    statement: 보안 상태 점검은 log에 남은 가리지 않은 key 패턴을 찾아 알려 준다.
    acceptance:
      - key 모양 값이 든 log를 두고 점검하면 위치와 점검 시각이 나온다.
      - 점검 결과에 의심 값의 원문은 나오지 않는다.

  # 폐기: req-1004와 같은 이유다. lophn이 읽기 전용 설치 사본에서 직접 복사한다.
  - id: req-0462
    status: rejected
    subject: diagnostics
    statement: 상태 점검은 release에 포함된 SDK와 설치된 같은 version SDK의 내용 hash가 다르면 package 이름과 version을 알려 준다.
    acceptance:
      - 설치된 SDK의 바이트를 바꾼 뒤 점검하면 어긋난 package의 이름과 version이 나온다.
      - 내용이 같으면 점검 결과에 불일치가 나오지 않는다.

  # 폐기: "너무 넓다"는 프로그램이 판정할 기준이 없다. 위험한 경로는 app-runtime이 승인 자체를 막는다.
  - id: req-0463
    status: rejected
    subject: diagnostics
    statement: 보안 상태 점검은 너무 넓은 grant를 찾아 안전한 결과로 보여 준다.
    acceptance:
      - 너무 넓은 grant를 둔 앱을 점검하면 그 grant의 근거와 점검 시각이 나온다.
      - 점검 결과에 secret이나 자격 값은 나오지 않는다.
    related:
      - app-runtime

  # 폐기: 사람이 앱마다 보고 승인한 grant를 사후 감사하는 것은 과하다.
  - id: req-0464
    status: rejected
    subject: diagnostics
    statement: 보안 상태 점검은 file과 network를 함께 허락받은 앱을 찾아 안전한 결과로 보여 준다.
    acceptance:
      - file과 network를 함께 허락받은 앱을 점검하면 그 앱과 근거, 점검 시각이 나온다.
      - 둘 중 하나만 허락받은 앱은 이 항목으로 나오지 않는다.
    related:
      - app-runtime

  # 폐기: "오래"의 기준이 없고, 사후 감사는 과하다.
  - id: req-0465
    status: rejected
    subject: diagnostics
    statement: 보안 상태 점검은 오래 쓰지 않은 grant를 찾아 안전한 결과로 보여 준다.
    acceptance:
      - 오래 쓰지 않은 grant를 둔 앱을 점검하면 그 grant와 마지막으로 쓴 시각, 점검 시각이 나온다.
      - 최근에 쓴 grant는 이 항목으로 나오지 않는다.
    related:
      - app-runtime
