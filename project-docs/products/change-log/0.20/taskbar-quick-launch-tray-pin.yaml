id: taskbar-quick-launch-tray-pin
version: 0.20.0
title: "작업 표시줄에 빠른 실행과 설정, tray popup pin"
modules: [packages/design, packages/shell/renderer, tools]
checked: []
change: |-
  전·후:
  - 작업 표시줄(`shell.taskbar` 켬)이 title bar 높이(`--space-10`)다. 왼쪽 끝, 열린 왼쪽 sidebar 폭만큼이 빠른 실행 단추 자리이고(`ShellFrame`의 `taskbarStart` slot), float chip은 tab 영역이 시작하는 x부터다. 설정 톱니는 맨 오른쪽, tray 뒤다. 작업 표시줄을 끄면 빠른 실행과 톱니는 전처럼 왼쪽 sidebar 아래다.
  - tray popup 머리 줄에 앱·화면 이름과 pin 단추("Keep open")가 있다. pin하면 바깥 누름, 창 blur, 다른 tray 항목 누름으로 닫히지 않고 Esc나 자기 항목을 다시 누르면 닫힌다. pin은 memory에만 있다.
  - tray popup의 세로 자리가 CSS로 작업 표시줄 바로 위(끄면 title bar 바로 아래)다. 열 때 잰 창 높이로 계산해 popup이 항목에서 떠 있던 것을 고쳤다.
why: |-
  빠른 실행과 설정을 작업 표시줄 한곳에 모으고, tray popup을 OS tray처럼 고정해 둘 수 있게 하려는 것이다.
decisions:
  - text: |-
      빠른 실행 단추와 설정을 작업 표시줄로 옮기고, chip은 tab 아래부터, 작업 표시줄을 높인다. tray popup에 OS tray 같은 pin을 둔다.
    by: person
