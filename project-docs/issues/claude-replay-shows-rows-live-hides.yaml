id: claude-replay-shows-rows-live-hides
title: Claude GUI에서 대화를 다시 열면 live에서는 안 보이던 task notification과 다른 agent의 메시지가 줄로 모두 보인다
kind: bug
status: open
topic: harness-gui
modules: [packages/shell/main]
now: |
  `packages/shell/main/extensions/bundled/harness-gui/claude.ts`의 live 길(`onMessage`의 `user`)은 content가 배열인 user 메시지만 그리고 글 하나짜리 user 메시지는 지나친다. background task와 subagent가 끝난 알림(`<task-notification>`), 다른 session이 보낸 메시지, lophn call은 transcript에 글 하나짜리 user 줄로 남는다. replay 길은 `<bash-input>`, compact 요약, `<command-name>`이 아닌 user 줄을 모두 그리고, `classifyReceived`(`received.ts`)가 받은 메시지로 가른 것은 "From program" 같은 받은 메시지 줄이 된다. task notification은 XML 원문이 그대로 보인다. 그래서 같은 대화가 live에서는 Agent 줄과 dock 상태로만 보이다가 resume이나 TUI↔GUI toggle 뒤에는 알림 줄이 task 수만큼 늘어난다. `classifyReceived`는 `lophn-call`·`lophn-reply`만 알아, 그 밖의 lophn 꼬리표(`packages/protocol/lophn-agent/input-tags.ts`의 notice, reaction, step, steer)가 든 줄은 replay에서 사람 메시지로 그려진다. replay가 task notification을 받은 메시지로 그리는 것은 닫은 이슈 `other-agent-message-drawn-as-user`가 일부러 정한 것이고 `claude_test.ts`가 그 줄을 본다. 사람이 본 것("resume하면 agent message가 다 보인다")이 이 줄들인지는 사람에게 확인하지 않았다. Codex와 omp는 live와 replay가 같은 규칙이고, OpenCode의 어긋남은 이슈 `opencode-foreign-call-drawn-as-user`다.
impact: |
  subagent나 background task를 많이 쓴 대화를 다시 열면 live에서 본 적 없는 XML 알림 줄이 대화 사이사이에 끼어 사람이 대화를 읽기 어렵다. 같은 대화가 여는 길에 따라 다르게 보인다.
fix: |
  - 작음(추천): replay에서 program이 낸 task notification을 줄로 그리지 않는다(상태는 Agent 줄과 task가 이미 보인다). 그 밖의 lophn 꼬리표도 `classifyReceived`가 가르거나 숨긴다. `claude_test.ts`의 그 줄 검사를 같이 고친다.
  - 중간: live와 replay가 무엇을 그릴지 고르는 함수 하나를 같이 쓴다. live stream에 task notification이 어떤 꼴로 오는지 녹화가 있어야 한다(실제 CLI 호출이라 사람에게 묻는다).
