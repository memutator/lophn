id: remote-use
version: 0.23.90
title: agent와 앱이 내 다른 컴퓨터의 앱 command를 부르고 그 앱의 event를 받는다. 터미널 입력 허락은 받는 컴퓨터가 정한다
modules: [packages/protocol, packages/core/remote, packages/core/apps, packages/core/approvals, packages/core/jobs, packages/core/events, packages/core/folder, packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/main, packages/core/storage, packages/cli, packages/remote-client, packages/sdk, packages/design, packages/shell/renderer, packages/shell/main, packages/mobile]
change: |
  전: 다른 컴퓨터로 가는 call에는 누가 시켰는지가 없었고 받는 컴퓨터는 모두를 "그 컴퓨터의 사람"으로 보았다. 터미널 입력 허락은 내 기기 명단 항목의 칸이라 명단의 컴퓨터 누구나 자기 허락을 스스로 켤 수 있었다. agent와 앱은 다른 컴퓨터의 앱을 부르지도 그 event를 받지도 못했다. 후: 요청한 쪽이 call에 실리고 받는 컴퓨터가 종류마다 다르게 대한다. 허락은 받는 컴퓨터가 자기에게서 켠 것만 선다. agent, 앱, 사람의 터미널이 다른 컴퓨터의 앱 command를 부르고, job과 앱이 그 앱의 event를 받는다.
  - "터미널 입력 허락은 각 컴퓨터의 것이다: 받는 컴퓨터의 ledger 표(`remote_grants`, 기기의 key로 찾는다. step `remote.grants`)에 있고 명단 항목은 허락을 싣지 않는다(새 statement는 칸이 없고 아무도 허락으로 읽지 않는다). 켜는 길은 사람이 그 컴퓨터에서 켜기(My devices의 스위치, 화면 없는 컴퓨터는 CLI `lophn remote terminal-input <dev_id> [--off]`), 그 컴퓨터가 낸 초대장으로 든 기기(초대장의 값), 그 컴퓨터가 초대장으로 들며 초대한 컴퓨터를 허락하는 합류 스위치(`roster/join`의 `terminal_input`, 기본 켬)다. 그래서 한 초대로 두 방향이 선다. `roster/set_terminal_input`은 이 컴퓨터의 표만 고치고 명단에 아무것도 서명하지 않는다. 허락이 명단 항목에 있어 컴퓨터가 자기 허락을 켤 수 있던 구멍(이슈 `roster-computer-self-grants-terminal-input`)이 닫혔다. 첫 기동은 옛 명단 항목에 켜져 있던 허락을 한 번 표로 옮긴다(표지 `remote_grants_seed`). 정해진 빼기로 빠진 기기와 `roster/forget_all`은 허락도 거둔다. 한 컴퓨터에서 켠 허락은 다른 컴퓨터에 서지 않는다."
  - "요청한 쪽이 컴퓨터끼리의 call frame에 실린다(`by`, remote protocol 판 5, 하한 5): `screen`(살아 있는 shell capability를 실은 `machines/call`), `terminal`(capability 없이 사람의 CLI token으로 부른 `machines/call`. 그 token을 쥔 lophn 터미널 탭의 coding agent도 같다), `agent {agent, session, name}`, `app {app}`. 보내는 컴퓨터의 core가 검증한 자격에서만 만들고 입력으로는 받지 않는다. 컴퓨터의 `by` 없는 frame은 그 컴퓨터의 core가 스스로 하는 일이라 폴더로 나르는 `carry/*`만 연다. 폰은 `by`를 싣지 않고 싣거나 컴퓨터가 `by` 없이 부르면 `invalid_input`이다."
  - "받는 컴퓨터가 요청한 쪽마다 여는 것: 기기 목록은 폰과 `screen`에 전부, `terminal`에는 `REMOTE_TERMINAL_DENIED`를 뺀 것이다. 그 목록은 터미널·page를 움직이는 `terminals/input|open`, `page_view/input|control|open`과 사람이 agent의 물음에 결정을 남기는 `turn_requests/decide`, `ask/answer`, `jobs/approve`, `jobs/decide_hold`, `activations/consent`, `share_requests/decide`, 그 입구 `acp/send`다. 사람의 route(secret, provider, 설정 쓰기, agent·project 만들고 고치기)와 확인이 필요한 command는 `by` 없는 폰이나 `screen`이고 그 컴퓨터를 허락했을 때만이다(`terminal`은 허락이 있어도 안 된다). `agent`와 `app`은 앱 목록·읽기(`apps/list|get|tools`)와 앱 command 입구 `apps/remote_call`의 넷뿐이고 private인 workspace의 앱은 목록에서 빠지고 읽으면 `not_found`다. `apps/remote_call`은 명단의 컴퓨터가 허락받았을 때만 받는다."
  - "다른 컴퓨터의 앱 command 부르기: agent는 사람이 부르는 컴퓨터에서 붙인 `(컴퓨터, 앱)` 할당 줄이 있을 때(정의 file의 사람만 쓰는 칸 `remote_apps`. 줄은 컴퓨터를 달고 읽는 쪽은 `(컴퓨터, 앱)`으로 가른다), 앱은 `app.call` grant가 그 앱을 덮을 때(SDK `connectCommands`의 `on`, broker 본문의 `machine`) 부른다. 사람의 터미널은 `lophn <앱> <command> --on <컴퓨터>`와 `lophn <명령> --on <컴퓨터>`다(`--on`은 core 명령에만 붙고 첫 해석 앞에서 뗀다. 앱 command는 최상위 입력 필드 `on`을 선언하지 못한다). 컴퓨터는 이름, `mch_`, `dev_`로 고르고 같은 이름이 둘이면 후보와 `invalid_input`이다. 부르는 컴퓨터는 보내기 전에 부른 쪽 workspace의 private, 받은 call을 다시 넘기지 않기, 할당과 grant를 본다. 받는 컴퓨터는 자기 data로 명단, 허락, `public` command, 대상 앱 workspace의 private을 다시 본다. 받는 컴퓨터는 caller `remote {machine, device, requester}`로 기록한다(ledger step `apps.invocations.remote-caller`, 옛 기록은 그대로 읽힌다). 받은 call은 다른 컴퓨터로 다시 넘기지 않는다. 다른 컴퓨터가 준 command 목록과 결과의 글은 다시 거른다(이름 규칙, schema 검사, 설명·schema·개수 상한, 컴퓨터 이름 표시)고 agent 한 turn에 한 번 짧은 시한으로 읽으며 닿지 않으면 \"지금 닿지 않는다\"다. 링크가 실패하면 `unavailable`의 `details.sent`가 그 call이 나갔는지 말하고 나간 뒤 잃은 호출은 `unknown`이다. 받는 컴퓨터가 낸 오류는 `details`까지 그대로 온다."
  - "다른 컴퓨터의 앱 event: job의 trigger(`machine`을 `mch_`로 풀어 `source_machine`으로 저장)와 앱의 구독 선언(`subscriptions[].machine`, 컴퓨터 이름)이 컴퓨터를 적을 수 있다. 이 컴퓨터의 core가 선언에서 계산한 컴퓨터마다 link에 core 구독자 하나로 `AppEventPublished`를 건다(화면의 구독자와 따로. 저장하지 않고 때마다 다시 계산한다). 받는 컴퓨터는 명단의 컴퓨터에게만, 앱이 선언해 밖에 낸 event 가운데 private이 아닌 workspace의 것이고 이 컴퓨터가 낸 것만 내준다(폰, 명단 밖 기기, `lophn`이 낸 event, 앱 화면 전용 event는 안 간다). 난 컴퓨터가 정한 id(`cross_id`)로 연결(live)과 늦은 길(`across_machines` event file) 가운데 먼저 온 것만 한 번 낸다. private은 구독을 거는 때와 event가 오는 때 둘 다 지금 정책으로 본다. 다른 컴퓨터의 event로 도는 handler는 받은 call로 센다: 세 번째 컴퓨터의 앱을 부르지 못하고 그 안에서 낸 event는 이 컴퓨터에만 머문다. job 승인 card, Jobs 목록, 고치기 창, 폰은 어느 컴퓨터의 event인지 이름으로 말하고 `job.list`는 다른 컴퓨터의 앱을 가리키는 job에 `source_gone`을 달지 않는다. 구독을 건 컴퓨터가 보내는 글은 크기를 먼저 보고 다시 읽어 앱이 낸 것이 아니면 버린다."
  - "화면: agent의 Grants에 \"Other computers\" 묶음이 서서 그 컴퓨터의 앱을 붙이고 command를 뺀다(그 컴퓨터의 core에서 읽고, 꺼졌으면 붙은 앱이 저장한 이름과 상태로 남고, 목록을 읽지 못한 것과 앱이 사라진 것을 가른다). App details의 Activity는 다른 컴퓨터가 부른 호출을 \"<컴퓨터> · 누가\"(화면, 터미널, agent의 이름, 앱)로 보이고 이름은 그 컴퓨터가 쓴 대로라고 말한다. 왼쪽 sidebar에서 판이 어긋난 컴퓨터의 줄은 Off 대신 \"Update lophn on …\"이다. 되돌리기 미리보기와 phone의 job 승인 card·목록·상세·검색은 컴퓨터를 이름으로 말한다(폰은 짝지은 컴퓨터의 이름, 짝짓지 않은 컴퓨터는 id). 그 때문에 renderer가 `machines/list`를 읽을 수 있다(전에는 거절되어 어디서나 id로 떨어졌다)."
  - "\"내 컴퓨터들\"(`computers`)로만 온 release는 그 release를 낸 컴퓨터를 이 컴퓨터가 허락했으면 묻지 않고 따라간다(그 기계의 컴퓨터 항목이 명단에 하나뿐이고 그 key가 이 컴퓨터의 허락 표에 있을 때). 허락하지 않은 컴퓨터의 것은 전처럼 늘 사람에게 묻는다. 허락이 명단 값이 아니라 이 컴퓨터의 표이므로 컴퓨터가 스스로 켠 허락으로는 이 길이 열리지 않는다."
  - "SDK(모두 breaking 아님, `migrate-sdk` 메모가 있다): `@lophn/cap-tool` 2.3.0은 `connectCommands(app, commands, {on})`로 다른 컴퓨터의 앱 command를 부르고 `AppCaller`에 `remote {machine, device, requester}`를 더하며 event caller가 `machine`을 싣는다(`remote` caller를 받는 handler는 `person`이나 `agent`처럼 다루거나 거절한다). `@lophn/declaration` 4.11.0은 구독 선언에 `machine`을 더한다(컴퓨터 이름. 다른 컴퓨터가 내주는 것은 그 컴퓨터가 선언해 낸 private 아닌 앱의 event뿐이고, 이름이 풀리지 않거나 이 컴퓨터면 구독은 오지 않고, 컴퓨터 이름을 바꾸거나 같은 이름을 다른 컴퓨터가 쓰면 구독이 멈추거나 이름을 따라 옮겨 간다). `@lophn/app-ui` 2.22.0과 `@lophn/app-ui-native` 1.9.0은 declaration 4.11.0을 peer로 맞출 뿐이다(화면은 다른 컴퓨터의 event를 받지 않는다). `design-app` 지침과 앱 template이 이 칸을 말한다."
why: |
  내 PC의 agent가 VM의 monitoring 앱 command를 부르고 그 앱이 낸 event로 내 PC의 job이 돌게 하려는 것이다. 사람은 터미널에서 다른 컴퓨터에 명령을 보내고 workspace의 private 설정이 컴퓨터 사이에도 선다. 앞선 독립 review가 찾은 것이 이 변경의 바닥이다: 받는 컴퓨터가 모두를 사람으로 보면 agent와 앱이 보낸 call이 사람의 route와 자동 확인을 받고, 허락이 명단의 칸이면 명단의 컴퓨터 하나가 자기 허락을 스스로 켜 다른 컴퓨터의 터미널과 secret과 설정에 닿는다. 그래서 요청한 쪽을 싣는 것과 허락을 받는 컴퓨터의 것으로 옮기는 것을 먼저 하고 그 위에 앱과 event를 올렸다. a2a(다른 컴퓨터의 agent에게 일 맡기기)와 꺼진 컴퓨터에 맡겨 두는 일은 이 변경 밖이다.
decisions:
  - text: remote는 다른 컴퓨터 앱의 command와 event를 쓰는 것이고 a2a(다른 컴퓨터의 agent에게 판단을 맡기기)는 따로다.
    by: person
  - text: 다른 컴퓨터의 앱을 부르는 허락은 지금의 approval과 다르지 않다. 부르는 컴퓨터에서 사람이 그 agent에 앱을 할당하면 그 앱의 command는 묻지 않고 돈다(승인 card에 컴퓨터를 싣지 않는다). 받는 컴퓨터는 부른 컴퓨터의 할당을 다시 따지지 않고 자기 것(명단, 허락, private, public command)만 본다. 사람 "기존의 approval이랑 크게 다를 게 없을 거 같은데".
    by: person
  - text: 구독하는 주체가 있다. job의 trigger와 앱의 구독 선언이 컴퓨터를 적으면 이 컴퓨터의 core가 구독자를 대신해 그 컴퓨터에 구독을 걸고 온 event를 이 컴퓨터에서 낸다. 사람 "구독하는 주체가 있을 거 아니야".
    by: person
  - text: private은 컴퓨터 사이에도 선다. 부르는 컴퓨터는 부른 쪽 workspace를, 받는 컴퓨터는 대상 앱의 workspace를 각자 자기 call 정책의 `private` 목록으로 보고 workspace 쌍 규칙은 컴퓨터 사이에 보지 않는다. 사람의 화면과 터미널은 private이어도 된다(2026-11-17).
    by: person
  - text: 터미널 입력 허락은 컴퓨터마다 받는 컴퓨터가 정한다. 명단은 누가 내 기기인지만 말한다. 버린 길 - 명단의 컴퓨터끼리는 온전히 믿는다고 두기(꺼 둔 스위치가 꺼져 있지 않다). 잃는 것 - 한 번 켜면 모든 컴퓨터에 서던 것이 없어져 컴퓨터마다 한 번씩 켠다(2026-11-19).
    by: person
  - text: 합류하는 컴퓨터가 초대한 컴퓨터를 그 컴퓨터에서 허락하는 스위치(기본 켬)를 둔다. 이유 - 한 초대로 두 방향이 서야 이미 하던 pairing이 이 변경으로 끊기지 않고, 허락은 여전히 받는 컴퓨터 앞의 사람이 켠다. 버린 길 - 초대한 컴퓨터가 합류하는 컴퓨터의 허락을 대신 서명하기(허락이 명단으로 돌아간다).
    by: agent
  - text: 첫 기동의 옮기기는 켜져 있던 허락을 모두 표로 옮긴다. 업데이트 전에 어떤 컴퓨터가 스스로 켠 허락도 들어 있으므로 업데이트 뒤에 사람이 컴퓨터마다 My devices를 보고 믿지 않는 기기를 끈다(체크리스트). 버린 길 - 옮기지 않기(기존 pairing이 모두 View only로 바뀐다), 옮길 때 서명한 컴퓨터를 가려내기(누가 켰는지 명단은 가르지 못한다).
    by: agent
  - text: shell에서 친 요청(`terminal`, `lophn … --on`)은 허락이 있어도 다른 컴퓨터의 터미널에 입력하거나 browser page를 다루거나 사람의 결정(승인, 질문 답, job 승인, 동의, 공유 요청)을 남기지 못한다. 이유 - lophn 터미널 탭의 coding agent가 사람과 같은 CLI token을 쥐어 사람이 친 것인지 가를 수 없다. 남는 것 - 그 컴퓨터를 허락한 상태에서 CLI token을 쥔 쪽은 `--on`으로 기기 목록의 읽기와 앱의 public command를 부를 수 있고 범위는 받는 컴퓨터의 허락 하나다. `lophn remote` 명단 명령을 터미널 탭에서 막는 것처럼 coding agent가 env를 지우면 지나가는 실수 막기일 뿐이다.
    by: agent
  - text: 컴퓨터의 `by` 없는 frame은 그 컴퓨터의 core 자신의 일로 두고 `carry/*`만 연다. 이유 - 시킨 사람이 없는 나르기를 `screen`이나 `terminal`로 꾸미면 그 종류의 권한이 샌다. 버린 길 - 나르기를 `terminal`로 보내기, 다섯째 종류.
    by: agent
  - text: "`agent`와 `app` 요청은 private인 workspace의 앱을 목록에서도 읽기에서도 보지 못한다(`not_found`). 이유 - 받는 컴퓨터가 \"불리지 않는다\"고 한 앱의 이름과 command 목록이 새면 안 된다."
    by: agent
  - text: 명단의 컴퓨터는 허락이 없어도 이 컴퓨터가 낸 앱 event(앱이 선언해 밖에 낸 것, private이 아닌 workspace의 것)를 연결이 붙어 있는 동안 받을 수 있다. 이유 - 앱이 밖에 알리는 값을 읽는 것은 허락 없이 보는 기기 목록(앱 목록, view)과 같은 급이고 앱 command를 부르는 것보다 약하다. 폰은 받지 못한다. `across_machines`를 요구하지 않는다.
    by: agent
  - text: 끊긴 동안의 event를 저장하는 대기열과 event 수의 상한은 만들지 않는다. 늦게 오는 것은 두 컴퓨터가 다 가진 앱의 `across_machines` event뿐이다. 대가 - 다른 컴퓨터에만 있는 앱의 event는 이 컴퓨터가 꺼졌거나 닿지 않는 동안 남지 않고 뚫리거나 잘못 짠 컴퓨터가 구독한 앱의 handler를 끝없이 돌릴 수 있다(이슈).
    by: agent
  - text: 다른 컴퓨터의 event로 도는 handler는 받은 call로 센다(세 번째 컴퓨터를 부르지 못하고 그 안에서 낸 event는 이 컴퓨터에만 간다). 이유 - 두 컴퓨터의 앱이 서로의 event와 call로 끝없이 부르는 고리를 끊는다. 대가 - 앱은 받은 호출이 낳은 event를 부른 컴퓨터에 알리지 못한다. job과 그 agent는 표시되지 않아 막히지 않는다(이슈).
    by: agent
  - text: 다른 컴퓨터가 준 command 목록과 결과의 글은 이 컴퓨터가 낸 선언처럼 믿지 않는다(다시 거르고 상한을 두고 짧은 시한으로 읽고 컴퓨터 이름을 단다). 요청한 쪽의 이름과 agent는 그 컴퓨터가 쓴 값이라 받는 컴퓨터는 그것으로 아무것도 정하지 않고 화면에는 그 컴퓨터가 알린 대로라고 보인다.
    by: agent
  - text: renderer가 `machines/list`를 읽게 한다(이름과 상태만 읽는 것이고 기기 목록과 preload가 이미 주던 값이다). `machines/call`과 `machines/watch`는 shell main만 부른다.
    by: agent
  - text: 요청한 쪽의 계약(`requester`, 컴퓨터 이름 풀기)은 `packages/protocol/machine`에 둔다. 이유 - 앱 호출, 명단, CLI가 다 쓰고 `remote` 안에 두면 import 고리가 생겨 예외가 필요했다. `use-contract`의 SDK 손 사본 부분은 따로 떼어 병렬로 지었다.
    by: agent
follow_up: |
  - 이 변경이 올린 이슈: `remote-command-shares-link-slots-and-deadline`, `remote-call-no-record-on-calling-computer`, `terminal-grant-is-one-switch`(사람이 정할 것이 있다), `remote-event-job-not-marked-remote`, `remote-events-no-rate-cap`, `private-job-remote-trigger-never-subscribes`, `roster-computer-without-invite-has-no-grants`, `subscription-names-computer-by-name`. 닫은 이슈는 `roster-computer-self-grants-terminal-input`이다. `roster-same-machine-two-keys-stalls-carry`는 그대로 열려 있고 같은 기계 id의 항목이 둘이면 허락한 컴퓨터로 세지 않아(따라가기는 묻는다) 감시와 이름이 첫 항목으로 가는 줄을 덧붙였다.
  - 실제 컴퓨터 둘로는 돌려 보지 않았다. 한 기계에서 개발 core 둘을 짝지어 본 것: 짝지을 때 허락이 서는 것, `--on`으로 앱 command를 허락을 켠 채와 끈 채 부르는 것과 private인 앱이 불리지 않는 것, 다른 컴퓨터의 앱을 할당한 agent가 그 command를 부르는 것, 0.23.90으로 만든 data root를 새 판으로 올리는 것(허락 옮기기, 호출 기록), 판이 다른 두 core(Update 안내와 붙지 못함). 실제 사람의 두 컴퓨터, 실제 model의 agent turn, 다른 컴퓨터의 event로 도는 job을 끝까지, 폰의 job 이름 표시는 보지 못했다.
  - 판 5 때문에 컴퓨터와 폰을 하나씩 올리는 사이에는 판이 다른 쪽이 붙지 못하고 서로 Update 안내를 보인다. 옛 판의 컴퓨터는 판 5 컴퓨터가 같이 보는 폴더에 쓴 명단 file을 읽지 못하고 통째로 버린다.
checklist:
  - "해야: 내 모든 컴퓨터와 폰을 이 판으로 함께 올린다 (remote protocol 판 5라 판이 다르면 붙지 못하고, 옛 lophn은 새 컴퓨터가 같이 보는 폴더에 쓴 명단 file을 읽지 못한다)"
  - "해야: 올린 뒤 컴퓨터마다 Settings › Remote › My devices를 열어 터미널 입력을 허락하면 안 되는 기기의 스위치를 끈다 (업데이트는 켜져 있던 허락을 모두 그대로 옮기고 그 안에는 컴퓨터가 스스로 켠 것도 있을 수 있다)"
  - 한 컴퓨터에서 허락한 폰이나 컴퓨터는 다른 컴퓨터에서 허락하지 않는다. 다른 컴퓨터에서 그 기기를 켜기 전에는 그 컴퓨터가 \"View only\"로 보이는지 본다
  - 두 컴퓨터를 초대와 합류로 짝지어 양쪽 방향의 허락이 켜져 있는지 보고, 한쪽 스위치를 끄면 다른 컴퓨터에서 그 컴퓨터가 View only가 되는지 본다
  - 한 컴퓨터의 터미널에서 `lophn <앱> <command> --on <다른 컴퓨터>`를 쳐 앱 command가 그 컴퓨터에서 도는지, 허락을 끄면 거절되는지 본다(터미널에서 부른 것은 private인 workspace의 앱에도 닿고, agent나 앱이 부른 것은 닿지 않는다)
  - agent의 Grants에서 Other computers의 앱을 붙이고 그 agent가 command를 부르는지, 그 앱의 Activity에 부른 컴퓨터와 agent 이름이 \"그 컴퓨터가 알린 대로\"로 보이는지 본다
  - 다른 컴퓨터의 앱 event를 trigger로 가진 job을 agent에게 만들게 해, 승인 card에 그 컴퓨터의 이름이 보이고 그 앱이 event를 낼 때 job이 도는지 본다
  - 컴퓨터 하나만 옛 판으로 두면 그 컴퓨터의 줄이 sidebar에서 Off 대신 \"Update lophn on …\"으로 보이는지 본다
