      - "project 창이 reattachTab으로 탭을 tabs에 돌려 놓는다. PTY와 편집 중 글은 다시 붙지 못한다"
      - "project 창이 없으면 아무 일도 없고 layout의 detached 항목이 남는다"
    outcomes:
      - id: docked-without-transfer
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: kept-no-window
        when: "project 창이 없다. layout의 detached 항목이 남는다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    risk: [data-loss]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "crash 때 저장 안 된 편집 내용이 이미 사라졌는지 코드로 확인이 필요하다"

  # ---- global floats ----
  - id: global-floats-save
    title: "전역 float 목록을 저장한다"
    actor: shell
    entries: [system:global-floats-save]
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/global-floats/store.ts
      - packages/shell/main/workspace/global-floats.ts
      - packages/shell/main/desktop/core/global-floats-ipc.ts
    steps:
      - "전역 float 목록이 바뀌면 store가 저장을 예약하고(SAVE_DELAY 뒤 flush) shell:global-floats-save로 보낸다"
      - "main이 보낸 쪽이 desktop 창이 아니면 거절한다"
      - "main이 schema(전역 float 20개 상한 포함, 탭은 workspace layout의 kind registry)로 검증해 원자 교체로 쓴다. 검증에 실패하면 파일은 그대로다"
      - "쓰기가 실패하면 파일은 그대로다. renderer는 결과를 무시한다"
    uses: [ipc:shell:global-floats-save]
    outcomes:
      - id: saved
        observe: ["disk:<data>/shell/global-floats.json"]
      - id: rejected
        code: invalid_input
        when: "schema가 거절했다(전역 float 20개 상한 포함)"
        observe: ["disk:<data>/shell/global-floats.json (변화 없음)"]
      - id: forbidden
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니다"
        observe: ["disk:<data>/shell/global-floats.json (변화 없음)"]
      - id: write-failed
        code: unavailable
        when: "파일을 쓰지 못했다"
        observe: ["disk:<data>/shell/global-floats.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]
    unclear:
      - "renderer의 flush는 결과를 버리고(catch) dirty를 먼저 지워 재시도가 없다. rejected·forbidden·write-failed면 화면의 전역 float과 파일이 어긋난다. 결함 후보로 issue를 올린다"

  - id: global-floats-read
    title: "전역 float 목록을 읽는다"
    actor: shell
    entries: [system:global-floats-read]
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/global-floats/store.ts
      - packages/shell/main/workspace/global-floats.ts
      - packages/shell/main/desktop/core/global-floats-ipc.ts
    steps:
      - "Desktop에 전역 float 층이 붙을 때 store.load가 shell:global-floats-read로 목록을 읽는다"
      - "처음 읽기 전에 바뀐 것은 읽은 목록 위에 얹는다"
      - "읽기가 실패하면(forbidden 포함) 빈 목록으로 시작한다"
      - "main은 판 2 파일의 float을 하나씩 검증해 모르는 kind나 틀린 탭은 그 float만 뺀다. renderer는 kind의 fromStored로 탭을 되살린다(터미널은 layout 복원과 같다)"
    uses: [ipc:shell:global-floats-read]
    outcomes:
      - id: loaded
        observe: ["response"]
      - id: empty
        when: "파일이 없거나 모양이 틀리거나 IPC가 실패(forbidden 포함)해 빈 목록으로 시작한다"
        observe: ["response"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  # ---- layout ----
  - id: layout-restore
    title: "workspace의 layout을 읽어 desk를 그린다"
    actor: shell
    entries: [system:layout-restore]
    boundary: [shell]
    code:
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/shell/layout-source.ts
      - packages/shell/main/workspace/workspace-layout-store.ts
      - packages/shell/main/workspace/workspace-layout.ts
      - packages/shell/main/desktop/core/layout-ipc.ts
    steps:
      - "WorkspaceWindow가 mount될 때(창을 열거나 workspace를 옮길 때) shell:workspace-layout-read로 그 workspace 파일을 읽는다. project 목록과 파일은 기다리지 않는다"
      - "값이 있으면 desk layout으로 쓴다. 없거나 읽기가 실패하면 freshLayout을 쓴다(Main 하나, 앱 workspace는 앱 화면 탭 하나)"
      - "보이는 desk의 detached 창을 transfer 없이 되살린다. 다른 desk의 창은 그 desk로 갈 때 연다"
      - "읽는 동안 card는 빈 채로 둔다"
    uses: [ipc:shell:workspace-layout-read, ipc:shell:detached-open]
    risk: [data-loss]
    outcomes:
      - id: restored
        observe: ["screen:shell-project", "screen:new-project-tabs"]
      - id: fresh-absent
        when: "그 workspace의 파일이 없다"
        observe: ["screen:shell-empty"]
      - id: fresh-corrupt
        when: "판이 다르거나(unsupported_schema) 손상(corrupt)됐다. 파일은 다음 저장 전까지 그대로다"
        observe: ["screen:shell-empty", "disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: read-failed
        code: unavailable
        when: "읽기 저장소가 오류를 냈다. 기본 layout으로 시작한다"
        observe: ["screen:shell-empty"]
      - id: read-refused
        code: invalid_input
        when: "입력이 틀렸다. 보낸 쪽이 desktop 창이 아니면 forbidden으로 같은 자리다. 기본 layout으로 시작한다"
        observe: ["screen:shell-empty"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "결함 후보: read-failed(IPC 오류)와 read-refused에서 기본 layout이 올라가고, 다음 commit(workspace-window.tsx:722-727)이 그 layout을 파일 위에 쓴다(:533-536). 읽기 한 번 실패로 사람의 layout이 덮인다. issue로 올린다. fresh-corrupt는 손상 파일이라 덮는 것이 의도인지 정한다"

  - id: layout-app-removed
    title: "앱을 지우면 그 앱 workspace의 layout과 전역 float을 지운다"
    actor: system
    entries: [system:layout-app-removed]
    boundary: [shell, app]
    code:
      - packages/shell/main/desktop/wiring/layout.ts
      - packages/shell/main/workspace/workspace-layout-store.ts
    steps:
      - "core가 앱을 영구히 지우면 AppRemoved 이벤트가 main에 온다"
      - "main이 그 앱 workspace의 layout 파일을 지운다. 파일이 없으면 그대로 성공이다"
      - "전역 float 목록에서 그 앱의 float을 지운다. 열린 창의 전역 float 층도 그 float을 닫는다"
    outcomes:
      - id: removed
        observe: ["disk:<data>/shell/workspaces/<app>.json (지워짐)", "disk:<data>/shell/global-floats.json"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "지우기가 실패할 때 처리(재시도, 남김)는 코드로 확인이 필요하다. outcome을 아직 쓰지 못했다"

  # ---- window state ----
  - id: window-state-save
