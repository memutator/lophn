      - "supervisor에 dataRoot가 없으면 written:false가 ok로 돌아오고 log 줄이 없다(assembly.ts). 실제 production 상태인지 확인이 필요하다."

  # ---------- 호출 ----------

  - id: app-command-call
    title: "앱 command를 부른다(agent, 다른 앱, job, flow)"
    actor: agent
    entries: [route:apps/call_tool]
    uses: [sdk:cap-tool/HandlerRejection]
    when: "kind가 command이고 대상이 운영 앱(live)일 때. preview 대상은 app-preview-command-call, 화면의 operation 호출은 app-operation-call이다"
    pre: [route:releases/activate]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/caller.ts, packages/core/apps/calls/gate.ts, packages/core/apps/calls/intake.ts, packages/core/apps/calls/forward.ts, packages/core/apps/calls/record.ts, packages/core/apps/calls/loop.ts, packages/core/apps/routes.ts]
    steps:
      - "core가 부른 쪽을 확인한다(verifyCaller). credential 종류와 caller 종류가 맞아야 하고, agent는 지금 도는 turn의 tool call이어야 하며, app은 활성 release와 지금 도는 부모 호출이어야 한다. program·flow·event는 core 안 연산이 만든 자격과 맞아야 한다(event는 구독 handler를 operation 자리의 `on.<source>.<event>`로 부르고 Gate는 묻지 않으며, 사람이 그 이름을 부르면 denied(not_declared)다. app-event-publish). preview 전용 credential은 live를 부르지 못한다(본문 검사보다 앞). target이 remote(다른 기계의 앱)이면 이 확인 바로 뒤에 갈린다: command가 아니거나 caller가 agent·app이 아니거나 받은 call을 돌리는 중인 앱(부모 호출이 remote)이면 forbidden이고, 아니면 이 기계의 앱처럼 조회·기록하지 않고 forward로 넘긴다: 부른 쪽 workspace의 private, 할당(agent는 그 컴퓨터에 할당한 (컴퓨터, 앱) 줄과 뺀 command)과 grant(앱의 app.call)를 보내기 전에 보고, 컴퓨터를 명단에서 풀어 그 컴퓨터의 기기 id로 apps/remote_call에 요청한 쪽(agent 또는 app)을 달아 보낸다. 이 기계에는 호출 기록을 남기지 않는다. caller 종류 remote는 받는 기계의 입구(app-remote-call)만 만든다."
      - "보관한 앱은 agent와 다른 컴퓨터의 요청(remote)에게 not_found, 사람과 app에게 denied(app_archived)다. 활성 release의 command 선언에서 찾고 없으면 denied(not_declared)다(기록 없음)."
      - "같은 앱이 호출 사슬에 다시 나오거나 깊이 8을 넘으면 handler에 가지 않고 denied(call_loop, call_too_deep)로 기록한다. 본문이 CALL_BODY_MAX_BYTES를 넘으면 invalid_input이고 기록은 남기지 않는다."
      - "막기(Gate): agent는 지금 할당(judge)으로 본다. 앱 workspace의 agent는 자기 앱이 할당에 자동으로 들어 있어(agentAssignment) 그 앱의 command는 할당 없이 통과하고, 다른 앱은 할당에 있어야 하며 deny로 뺀 command는 막힌다. app은 부른 앱의 active grant app.call이 그 tool을 덮는지로 본다. program은 판정 없이 통과하고, flow는 PM의 할당과 비공개 규칙을 본다. remote(다른 컴퓨터가 넘긴 호출)는 command가 내놓은 것이어야 하고, 요청한 쪽이 agent나 앱이면 대상 앱이 이 기계의 call 정책에서 private이 아니어야 한다(app-remote-call). 묻지 않는다. 막히면 denied(gate_blocked)다. 사람은 Gate를 거치지 않는다."
      - "write와 external이면 앱별 줄을 얻고 invocation 시작을 남긴다. read는 줄 없이 바로 간다. 성공한 read는 기록을 남기지 않는다."
      - "접수가 닫힌 동안(활성화나 rewind) 온 호출은 접수가 열릴 때까지 붙잡혔다가 그때의 활성 release로 정해 보낸다. 앱 process에 보낸다. 보내기 전에 막히면 denied(app_unavailable), 보냈는데 답이 없으면 unknown이다. 활성화 drain이 기다리던 호출을 끊으면 같은 답이 된다."
      - "응답의 결과와 changeset으로 invocation을 끝내고 부른 쪽에 succeeded, failed, denied, unknown 가운데 하나를 준다. 그 호출이 쓰려던 secret의 값이나 sign-in이 비어 있었으면(app-secret-value가 적은 빈 자리) failed 결과에 `missing: [{app, secret}]`을 싣는다. agent의 `lophn <slug> <command>`는 그 자리를 `lophn ask secret --app <id> --secret <name>` 문장과 함께 결과에 보인다. 앱이 쓴 오류 글과 따로 lophn이 쓴 것이다. changeset은 write 구간의 DB 변경이다(cap-store가 잡고 lophn_data_schema 표는 뺀다). frame 한도, release 상한, blob 준비 중 하나에 걸리면 changeset만 빼고 changeset_dropped로 알린다."
    outcomes:
      - id: succeeded
        when: "write나 external이 성공함(invocation을 남기고 write 구간의 changeset을 붙인다)"
        observe: [response, "ledger:invocations"]
      - id: succeeded-read
        when: "read가 성공함. 줄도 기록도 없고 응답의 invocation은 null이다"
        observe: [response]
      - id: succeeded-changeset-dropped
        when: "write나 external이 성공했는데 changeset을 못 붙임(summary.changeset_dropped: too_large는 앱 응답이 frame을 넘거나 changeset이 상한을 넘음, release_full은 release 안 changeset 상한, unavailable은 blob 준비 실패). 호출은 succeeded로 닫히고 changeset이 없어 rewind 계획은 reverts_db를 false로 본다"
        observe: [response, "ledger:invocations"]
      - id: failed
        when: "(값이나 sign-in이 없어 실패한 호출은 missing에 빈 자리가 실린다) 앱 child가 failed로 답함: 입력이 inputSchema와 맞지 않음(invalid_input), 선언이나 handler가 없음(not_found), 이 둘은 handler 전이다. handler가 일반 예외를 던짐(internal 'handler failed', 원문은 주지 않는다). 결과가 JSON이 아님(internal). 읽기 실패도 기록한다"
        observe: [response, "ledger:invocations"]
      - id: rejected
        when: "handler가 HandlerRejection(sdk:cap-tool)을 효과 전에 던짐. 그 코드(invalid_input·forbidden·conflict·unavailable 가운데 하나)와 200자 이하 문장을 그대로 준다. 기록은 failed다"
        observe: [response, "ledger:invocations"]
      - id: result-too-large
        when: "command 결과가 RESULT_MAX_BYTES(254 KiB)를 넘음. 앱 child가 internal 'result exceeds the size limit'로 바꾸고 changeset은 붙인다. operation은 OPERATION_RESULT_MAX_BYTES까지 받는다(app-operation-call)"
        observe: [response, "ledger:invocations"]
      - id: held-then-run
        when: "접수가 닫힌 동안 온 호출이 접수가 열린 뒤 그때의 활성 release로 실행됨. write면 기록의 release가 새 release다(read는 기록이 없다)"
        observe: [response, "ledger:invocations"]
      - id: denied-gate-blocked
        when: "할당이나 app.call grant가 그 tool을 덮지 않음, 또는 다른 컴퓨터가 넘긴 호출이 내놓지 않은 command를 부르거나 agent·앱이 요청한 호출의 대상 앱이 private임(사람은 Gate를 거치지 않는다). remote target은 agent에게 그 컴퓨터에 할당한 (컴퓨터, 앱) 줄이 없거나 뺀 command이거나 앱의 app.call grant가 그 앱을 덮지 않을 때 아무것도 보내지 않고 이 outcome이다"
        observe: ["ledger:invocations", response]
      - id: denied-call-loop
        when: "대상 앱이 이미 호출 사슬에 있음"
        observe: ["ledger:invocations", response]
      - id: denied-call-too-deep
        when: "호출 사슬 깊이가 8 이상"
        observe: ["ledger:invocations", response]
      - id: denied-app-unavailable
        when: "앱 process에 보내기 전에 막힘(read는 denied 기록, write는 failed 기록), 또는 대기 중이던 호출을 활성화 drain이 끊음"
        observe: [response, "ledger:invocations"]
      - id: denied-app-archived
        when: "보관한 앱을 사람이나 app이 부름(agent와 다른 컴퓨터의 요청에는 not_found). 기록은 남기지 않는다"
        observe: [response]
      - id: denied-not-declared
        when: "활성 release의 command 선언에 없음(기록 없음)"
        observe: [response]
      - id: unknown
        when: "보냈는데 응답을 받지 못함(응답이 없음, remote target은 다른 컴퓨터로 나간 뒤 link가 끊기거나 120초가 지남), 또는 활성화 drain이 보낸 뒤 호출을 끊음"
        observe: ["ledger:invocations", response]
      - id: forbidden
        code: forbidden
        when: "remote target을 command가 아닌 호출이나 agent·app이 아닌 caller가 부름, 받은 call을 돌리는 중인 앱이 remote target을 부름, remote target을 부른 agent나 앱의 workspace가 private임(다른 컴퓨터를 부르지 못한다), caller 종류 remote를 이 route로 부름(credential이 user·agent·app이라 종류가 다름. 받는 기계의 입구 app-remote-call만 만든다), caller 종류가 credential과 다름, agent의 tool call을 모름, preview 전용 credential이 live를 부름, program의 job run이 credential과 다름, flow의 instance가 credential과 다름, app 호출에서 credential의 app이 caller app과 다름, app 호출의 release가 활성 release가 아님, parent_invocation이 그 앱·release의 도는 호출이 아님(preview 쪽 거절은 app-preview-command-call)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "agent가 live 활성 release가 아닌 대상(release를 적은 것)을 부름, program·flow·app이 live가 아닌 대상을 부름, 본문이 CALL_BODY_MAX_BYTES 상한을 넘음(기록 없음), remote target의 컴퓨터가 이 컴퓨터이거나 같은 이름이 둘이다(details.candidates)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "agent나 다른 컴퓨터가 넘긴 호출이 보관한 앱을 부름, 또는 remote target의 컴퓨터가 명단에 없다"
        observe: [response]
      - id: dependency-failed
        when: "호출자 확인의 port(agentToolCall, activeRelease), 보관 여부나 선언 읽기, Gate의 할당·grant 읽기, 기록 쓰기(begin·finish)가 낸 오류 그대로"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "ledger writer를 쓸 수 없어 기록 begin·finish가 실패함(dispatch 뒤 service), 호출자 확인·보관 여부·선언 읽기가 unavailable로 실패함, 또는 remote target이 가는 컴퓨터와의 link가 없거나 멈췄거나 120초 안에 답이 없고 호출이 나가지 않았다(나간 뒤 답을 잃은 것은 unknown이다)"
        observe: [response]
    crosses_process: true
    risk: [permission, data-loss]
    refs: [P12, H3, J4]
    docs: [architecture/app-call.md]
    unclear:
      - "AGENT.md J4와 E10은 job의 앱 tool 차례를 만든 agent의 할당 안으로 제한하지만, architecture/app-call.md의 결정과 gate.ts의 callAllowed는 program을 판정 없이 통과시킨다. 어느 쪽이 맞는지 사람이 정한다."
      - "agent 호출의 gate(callAllowed의 agent 분기)는 할당(judge)만 보고 target의 public 여부를 보지 않는다(flow 분기는 본다). 비공개 규칙은 agent tool의 lophn 명령 해석 쪽에만 있는 것으로 보인다. 직접 app.call_tool로 부르는 길에서도 막히는지 확인이 필요하다."
      - "write가 앱 미기동으로 막히면 invocation의 ledger status는 failed인데 응답과 summary는 denied(app_unavailable)다(calls/service.ts execute). 의도인지 확인이 필요하다."

  - id: app-remote-call
    title: "다른 컴퓨터의 core가 넘긴 앱 command를 받는다"
    actor: system
    entries: [route:apps/remote_call]
    uses: [route:apps/call_tool]
    boundary: [app-runtime, core-api, remote]
    code: [packages/protocol/apps/calls/remote.ts, packages/core/remote/call.ts, packages/core/apps/calls/remote-entry.ts, packages/core/apps/calls/caller.ts, packages/core/apps/calls/gate.ts, packages/core/main/daemon/wiring/apps.ts]
    docs: [architecture/app-call.md, architecture/approval.md]
    steps:
      - "받는 기계의 remote call 처리(createRemoteCall)가 먼저 건다: call frame의 요청한 쪽(by)은 컴퓨터가 싣고 폰은 싣지 않는다(폰이 싣거나 컴퓨터가 by 없이 부르면 invalid_input. 컴퓨터의 by 없는 frame은 그 컴퓨터의 core가 스스로 하는 `carry/*`만 열린다). 요청한 쪽이 terminal이면 터미널 입력과 browser page 조작, agent가 물은 것에 사람의 결정을 남기는 route(REMOTE_TERMINAL_DENIED)는 허락이 있어도 forbidden이고, agent·앱의 요청은 앱 목록·읽기에서 private인 앱을 보지 못한다. 이 입구는 by가 있는 컴퓨터가 터미널 입력을 허락받았을 때만 handler에 닿는다(아니면 forbidden. 폰은 by가 없어 forbidden). by는 입력 body가 아니라 이 처리가 자격 옆에 실어 handler에 준다. body에 by를 실으면 route schema가 invalid_input으로 거절한다."
      - "handler는 이 기계의 자료로 다시 본다: device principal이 명단의 컴퓨터여야 하고(kind), 자격 옆에 요청한 쪽이 있어야 하고(HTTP API 같은 다른 길은 없다), 그 컴퓨터가 이 기계에서 터미널 입력을 허락받았어야 하고, 기기 id로 명단의 컴퓨터(machine, device)를 찾을 수 있어야 한다. 아니면 forbidden이다. 요청한 쪽의 name과 agent 글은 다른 컴퓨터가 쓴 표시값이라 아무것도 정하지 않는다."
      - "통과하면 handler가 caller `remote`(machine, device, requester)와 같은 값의 자격(actor remote)을 직접 만들어 앱 호출 경로(app-command-call)에 live 대상, kind command로 넘긴다. 받은 call은 다른 기계로 다시 넘기지 않는다. 호출 경로의 Gate가 command가 내놓은 것(public)인지, 요청한 쪽이 agent나 앱이면 대상 앱의 workspace가 이 기계의 call 정책에서 private이 아닌지 본다(사람의 화면과 터미널은 private도 부른다). 부른 컴퓨터의 할당이나 grant는 다시 따지지 않는다. 막히면 denied(gate_blocked)이고 기록이 남는다. 기록의 caller는 remote다."
    outcomes:
      - id: succeeded
        when: "허락받은 컴퓨터가 내놓은 command를 불러 앱이 처리함. 응답은 app-command-call과 같다(succeeded, failed, unknown 등을 outcome에 싣는다)"
        observe: [response, "ledger:invocations"]
      - id: denied
        when: "Gate가 막음(내놓지 않은 command, 또는 agent·앱이 요청한 call의 대상 앱이 private), 선언에 없음, 보관한 앱, 앱이 꺼져 있음 등 app-command-call의 denied 갈래(보관한 앱은 not_found)"
        observe: [response, "ledger:invocations"]
      - id: forbidden
        code: forbidden
        when: "폰이나 명단 밖 기기, 이 기계의 loopback·사람 token 같은 다른 길(요청한 쪽이 없음), 터미널 입력 허락이 없는 컴퓨터, 기기 id로 컴퓨터를 찾지 못함"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "컴퓨터가 by 없이 부름, 폰이 by를 실음, body가 schema와 맞지 않음(body에 by를 실은 것 포함), 대상이 live가 아님"
        observe: [response]
      - id: not-found
        code: not_found
        when: "보관한 앱을 부름(app-command-call과 같다)"
        observe: [response]
      - id: dependency-failed
        when: "호출 경로의 port(선언 읽기, 기록 쓰기)가 낸 오류 그대로"
        observe: [response]
    declared_only: [unauthorized, unavailable]
    crosses_process: true
    risk: [permission]

  - id: app-preview-command-call
    title: "앱 preview의 command를 기록과 Gate 없이 부른다"
    actor: agent
    uses: [route:apps/call_tool]
    when: "kind가 command이고 대상이 preview일 때. 부른 쪽은 그 앱 workspace의 agent나 사람이다"
    pre: [preview-start:started]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/caller.ts]
    steps:
      - "core가 부른 쪽을 확인한다(verifyCaller). preview 전용 credential은 사람만 쓴다. preview는 그 앱 workspace의 session이나 사람만 부를 수 있다."
      - "보관한 앱은 agent에게 not_found, 사람에게 denied(app_archived)다."
      - "지금 preview nonce의 선언에서 command를 찾는다. 없으면 denied(not_declared)다. preview DB는 일회용이라 rewind 대상이 아니고 release도 없어 기록을 남기지 않는다."
      - "본문 상한을 본 뒤 기록, Gate, 줄, 접수 대기 없이 preview 프로세스에 보낸다. 운영 앱의 drain과 정지에 걸리지 않는다. 보내지 못하면 denied(app_unavailable)다."
      - "답은 app-command-call과 같은 규칙으로 succeeded나 failed로 옮긴다. 답이 없으면 unknown이다."
    outcomes:
      - id: succeeded
        when: "preview 프로세스가 ok로 답함. invocation은 null이고 ledger 행이 없다"
        observe: [response]
      - id: failed
        when: "preview 프로세스가 failed로 답함(입력, handler 오류, 결과 상한 등 app-command-call의 failed와 같은 원인). 기록이 없다"
        observe: [response]
      - id: unknown
        when: "보냈는데 답을 받지 못함"
        observe: [response]
      - id: denied-not-declared
        when: "preview 선언에 없음, 또는 지금 preview nonce가 아님"
        observe: [response]
      - id: denied-app-unavailable
        when: "preview 프로세스에 보내기 전에 막힘"
        observe: [response]
      - id: denied-app-archived
        when: "보관한 앱을 사람이 부름(agent에게는 not_found)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "agent가 보관한 앱을 부름"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "본문이 CALL_BODY_MAX_BYTES를 넘음(기록 없음)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "preview를 그 앱 workspace가 아닌 session이 부름, preview 전용 credential이 사람이 아닌 caller를 부름, 그 밖의 caller 확인 거절(app-command-call과 같은 verifyCaller)"
        observe: [response]
      - id: dependency-failed
        when: "caller 확인의 port, 보관 여부 읽기, preview 선언 읽기가 낸 오류 그대로"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/app-call.md]

  - id: app-operation-call
    title: "앱 화면이 operation을 부른다"
    actor: person
    uses: [route:app_views/call, route:apps/call_tool]
    when: "kind가 operation이고 사람이 연 화면(live 또는 preview)의 호출이다"
    pre: [route:releases/activate]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/gate.ts, packages/core/apps/views/call.ts, packages/shell/main/app-frame/app-call.ts, packages/shell/main/app-frame/view-error.ts]
    steps:
      - "shell main이 페이지가 보낸 값에서 operation과 input만 꺼낸다. 객체가 아니거나 다른 칸이 있으면 core에 보내지 않는다. input은 JSON 값으로 만든다(없으면 null, 값이 undefined인 칸은 빠진다. 폰 bridge와 같다). 신원은 IPC를 보낸 view의 id 하나다."
      - "shell main이 그 view가 묶인 기계의 core에 app_views/call {view, operation, input}을 보낸다(다른 기계의 view는 그 기계의 machines/call로만 간다. 앱 preload의 다른 통로 agent·sessions·agents·projects도 같다). core가 operation 이름(빈 값, 앞뒤 공백, 제어 문자, 와일드카드 없음)과 input(JSON 값, 64 KiB 이하)을 본다(view-table-call)."
      - "core가 view에 묶인 release(preview는 preview bundle)의 선언에서 operation을 찾는다. 없으면(command 이름 포함, 이 앱 밖 포함) forbidden이다."
      - "core가 사람 자격으로 app.call_tool(kind operation)을 부른다. 대상은 view 표의 mode, app, release(또는 preview nonce)다. 사람의 호출은 Gate를 거치지 않는다."
      - "core의 답을 페이지 code로 옮긴다. 앱 handler의 실패는 앱이 정한 code와 message를 그대로 싣는다. 호출 경로가 오류로 끝나거나 끊기면 invalid_input은 invalid_input, forbidden·unauthorized는 forbidden, 그 밖은 unavailable이다(쓰기는 result unknown)."
      - "core가 view를 모르면(core 재시작, 표에서 내보냄) shell main이 unavailable로 답하고 같은 요청으로 view를 다시 묶는다(app-view-refresh)."
      - "결과가 operation 상한(CALL_RESULT_MAX_BYTES에서 1 KiB를 뺀 값)을 넘으면 unavailable로 바꾼다. invocation은 succeeded로 남는다. handler에 닿지 못했고 그 실패를 말하는 invocation도 없는 live 호출(선언에 없는 operation, 묶음을 잃은 view, 호출 경로 오류, 상한을 넘는 결과)은 core가 그 앱 log에 view_error call_rejected <operation>: <code>: <message> 한 줄을 쓴다. 같은 binding에서 같은 거절은 한 번만 쓴다. shell main이 core에 보내기 전에 거절한 호출(invalid_input)은 shell main이 같은 줄을 apps.log_view_error로 쓴다(view마다 60초에 20개 상한을 view 오류와 같이 쓴다). preview 화면의 호출은 쓰지 않는다."
    outcomes:
      - id: succeeded
        observe: [response, "ledger:invocations"]
      - id: failed
        when: "앱 handler가 오류를 냄(앱이 정한 code와 message를 그대로 싣는다)"
        observe: [response, "ledger:invocations"]
      - id: unknown
        code: unavailable
        when: "보냈는데 응답을 받지 못함(쓰기는 result unknown)"
        observe: ["ledger:invocations", response]
      - id: denied-gate-blocked
        code: forbidden
        when: "사람이 아닌 caller가 core route로 live operation을 부른 경우. 화면 입구에서는 나오지 않는다"
        observe: ["ledger:invocations", response]
      - id: denied-app-unavailable
        code: unavailable
        when: "앱 process에 보내기 전에 막힘, 또는 core가 denied(app_unavailable)로 답함"
        observe: [response, "ledger:invocations"]
      - id: denied-not-declared
        code: forbidden
        when: "call_tool이 활성 release의 operation 선언에서 찾지 못함(view 표의 선언 검사를 통과한 뒤라 드묾)"
        observe: [response]
      - id: denied-app-archived
        code: unavailable
        when: "보관한 앱. core가 사람에게 denied(app_archived)로 답하고 화면은 unavailable로 받는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "view에 묶인 선언에 없는 operation(command 이름 포함, 이 앱 밖 포함)이라 호출 경로에 보내지 않음"
        observe: [response]
      - id: core-refused
        code: forbidden
        when: "core가 호출자 확인에서 거절함(forbidden, unauthorized), 또는 다른 기계가 이 컴퓨터의 호출을 거절함(그 까닭을 그대로 싣는다)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "화면이 보낸 호출 모양이 맞지 않음(객체가 아님, 다른 칸, operation 이름, 64 KiB 초과, JSON이 아닌 값), 또는 core가 본문 상한을 넘는다고 거절함"
        observe: [response]
      - id: declaration-unavailable
        code: unavailable
        when: "view에 묶인 선언을 읽지 못함, 또는 view가 묶음을 잃음(앱 중지, 보관)"
        observe: [response]
      - id: core-call-failed
        code: unavailable
        when: "호출 경로가 그 밖의 오류로 끝나거나 끊김(쓰기는 result unknown), core 답이 맞지 않음(app response did not match), 또는 core가 그 view를 모름(다시 묶는다)"
        observe: [response]
      - id: result-too-large
        code: unavailable
        when: "앱이 성공했지만 결과가 operation 상한을 넘어 화면이 받지 못함(invocation은 succeeded로 남는다)"
        observe: [response, "ledger:invocations"]
    crosses_process: true
    risk: [permission, data-loss]
    refs: [P12]
    docs: [architecture/app-call.md]
    unclear:
      - "앱이 낸 failed의 code는 앱이 정한 문자열이 그대로 페이지에 간다(process-wire의 error code는 z.string). 일곱 code 밖일 수 있다."
      - "view 표의 coreFailure가 conflict를 'app view가 바뀜'으로 옮기지만 call_tool은 conflict를 내지 않는다. 그래서 이 flow에 conflict 갈래는 없다."

  - id: app-broker-apps-call
    title: "앱이 다른 앱의 command를 broker로 부른다"
    actor: app
    entries: [system:app-broker-apps-call]
    uses: [route:apps/call_tool]
    pre: [app-record-started:started]
    boundary: [app-runtime, app-capability]
    code: [packages/core/apps/permissions/broker/apps-call.ts, packages/core/apps/permissions/broker/server.ts]
    steps:
      - "앱 자식이 SDK로 broker의 apps/call에 target 앱, command, 입력, parent invocation을 보낸다. broker endpoint가 credential, 본문(JSON 객체, 1 MiB), process_nonce·mode가 연결과 같은지 먼저 본다."
      - "요청 모양을 검사한다. 자식이 운영 앱(live)이면서 release가 있어야 한다. preview 자식은 막힌다."
      - "core app.call_tool을 이 자식의 app credential로 부른다(caller kind app, 자식의 release, parent invocation). 판정과 기록은 app-command-call을 따른다."
      - "core의 결과를 그대로 앱에 돌려준다. core 응답 모양이 맞지 않으면 internal이다. core가 다른 오류로 답하면 그 오류를 그대로 돌려준다."
    outcomes:
      - id: forwarded
        when: "core가 succeeded, failed, denied, unknown 가운데 하나를 돌려줌(그대로 전달)"
        observe: [response, "ledger:invocations"]
      - id: invalid-input
        code: invalid_input
        when: "본문이 JSON 객체가 아니거나 1 MiB를 넘음, apps/call 모양이 맞지 않음, core가 입력이 frame 상한을 넘는다고 거절함"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "운영 자식이 아님(preview 자식, release 없음), 또는 core가 거절함(자식의 release가 활성 release가 아님, parent_invocation이 그 앱의 지금 도는 호출이 아님)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: internal
        code: internal
        when: "core 응답 모양이 맞지 않음"
        observe: [response]
      - id: core-failed
        when: "core가 낸 그 밖의 오류 그대로(호출자 확인의 port 실패, 기록 읽기·쓰기 실패 등)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    refs: [P12]

  # ---------- 호출 기록과 되돌리기 ----------

  - id: app-invocation-read
    title: "호출 기록을 목록이나 한 건으로 읽는다"
    actor: person
    entries: [route:apps/invocations, route:apps/invocation]
    boundary: [app-runtime]
    code: [packages/core/apps/invocations/reads.ts, packages/core/apps/invocations/store.ts]
    steps:
      - "목록은 app, session, turn, effect, status, reverted, mode, release 필터와 cursor(최대 200개)로 자른다. 범위 밖 앱의 기록은 뺀다. agent에게는 보관한 앱의 기록이 없다(archivedToAgent)."
      - "한 건은 범위 밖이거나 없으면 null이다. 없는 기록과 같은 모양이다."
      - "읽기만 한다. 기록을 남기지 않는다. 사람의 화면(App details의 Activity)과 agent의 CLI(`app.invocations`)가 같은 두 route를 쓴다."
    outcomes:
      - id: listed
        observe: [response]
      - id: found
        observe: [response]
      - id: missing
        when: "한 건이 없거나 범위 밖(invocation이 null)"
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 inv id 꼴이 아님"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, agent, machine)"
        observe: [response]
      - id: read-failed
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable), 저장된 invocation 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false
    refs: [A2, L7]
    docs: [architecture/app-call.md]

  - id: app-remote-calls-read
    title: "이 컴퓨터의 agent·앱이 다른 컴퓨터의 앱에 보낸 호출 기록을 읽는다"
    actor: person
    entries: [route:apps/remote_calls]
    boundary: [app-runtime]
    code: [packages/core/apps/calls/outbound.ts]
    steps:
      - "app, caller_app, session 필터와 cursor(rcl id, 최대 200개)로 부른 컴퓨터에 남긴 다른 컴퓨터 호출 기록을 새 것부터 읽는다."
      - "받는 컴퓨터가 꺼져 있어도 읽힌다. App details의 Activity가 로컬 invocation과 함께 보인다."
    outcomes:
      - id: listed
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 rcl id 꼴이 아님"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "user 밖의 actor(route actors는 user뿐)"
        observe: [response]
    crosses_process: false
    declared_only: [unauthorized, unavailable]
    docs: [architecture/app-call.md]

  - id: app-rewind-plan
    title: "앱 data를 고른 호출 시점으로 되돌릴 목록을 계산한다"
    actor: person
    entries: [route:apps/rewind_plan]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/plan.ts, packages/core/apps/rewind/reads.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 고른 invocation이 이 앱의 것인지, 활성 release의 live 기록인지 본다. 범위 밖 앱이면 없는 앱과 같다."
      - "고른 것이 write나 external이고, denied가 아니고, 아직 되돌리지 않은 것인지 본다. 아니면 invalid_input이다."
      - "그 invocation부터 최신까지 같은 release의 live 기록 가운데 write와 external(data_change 제외)을 모은다. 되돌린 기록은 뺀다."
      - "범위 안에 결과를 모른 채 changeset 없이 닫힌 write가 있으면 blocked(unrecoverable_write)를 함께 낸다. running 호출은 running:true로 들어가고 reverts_db는 true다."
      - "읽기만 한다. 실제 되돌리기는 app-rewind-apply가 한다."
    outcomes:
      - id: planned
        observe: [response]
      - id: planned-blocked
        when: "범위 안에 결과를 모르는 write가 있음"
        observe: [response]
      - id: not-pickable
        code: invalid_input
        when: "preview, 이전 release의 호출, data_change, read, denied, 이미 되돌린 호출, 활성 release 없음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "고른 invocation이 없거나 다른 앱의 것, 또는 앱이 범위 밖(없는 앱과 같음)"
        observe: [response]
      - id: read-failed
        when: "기록 읽기나 활성 release 조회가 실패함, 시작 시각이 없는 호출(internal)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable)"
        observe: [response]
    crosses_process: false
    unclear:
      - "호출 목록이 잘려 시작 호출이 빠지는 경우(list-incomplete)는 도달하지 않는다고 보고 outcome에서 뺐다. ledger.list에 limit이 없어 목록이 잘리지 않는다(store.ts). 방어 guard(plan.ts)는 남아 있다."
    docs: [architecture/app-call.md]

  - id: app-rewind-apply
    title: "사람이 고른 호출 시점부터 앱 data를 되돌린다"
    actor: person
    entries: [route:apps/rewind]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/run.ts, packages/core/apps/rewind/commands.ts, packages/core/apps/rewind/store.ts, packages/core/apps/rewind/plan.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 앱 범위 밖이면 없는 앱과 같다. 계획을 다시 만들고(계획의 not-pickable·not-found·read-failed를 그대로 준다), 결과를 모르는 write가 범위에 있거나(blocked) 이미 applying인 rewind가 있으면 conflict로 거절한다."
      - "app_rewinds에 applying 행을 쓰고(insertApplyingRewind) 그 앱의 접수를 닫는다. 새 호출은 붙잡아 둔다. 도는 호출은 멈추지 않는다."
      - "60초 안에 도는 호출이 끝나길 기다린다. 넘으면 cancelled(running calls did not finish)다."
      - "계획을 다시 계산하고 changeset을 가져와 최신부터 뒤집는다(base). changeset이 없는 항목은 조용히 건너뛴다. 계획이 바뀌었거나 뒤집지 못하면 cancelled다."
      - "뒤집은 changeset 전부를 한 요청으로 app process가 한 transaction에 적용한다. 충돌이나 process 문제면 통째로 취소한다. 보내지 못하면 cancelled(app_unavailable)다. 보낸 뒤 답을 잃으면(relay의 sent) 앱 DB가 되돌려졌는지 모르므로 unknown(app_unavailable)으로 끝내고 보낸 목록을 남긴다. reverted_by와 sync log 줄은 남기지 않고 앱 화면에 다시 읽으라고 알린다."
      - "적용되면 invocation에 reverted_by를 붙이고 rewind를 applied로 끝낸다. 붙이지 못하면 mark-reverted-failed다(app data는 이미 되돌아가 있다)."
      - "어느 길로 끝나도 접수를 다시 연다(finally). 응답은 ok로 rewind 행을 주고, status는 applied, cancelled, unknown 가운데 하나다."
    outcomes:
      - id: applied
        observe: ["ledger:app_rewinds", "ledger:invocations", "disk:apps/<app>/data", "event:AppViewChanged", response]
      - id: cancelled-running
        when: "도는 호출이 유예(60초) 안에 끝나지 않음. 응답은 ok이고 status가 cancelled다(reason code conflict)"
        observe: ["ledger:app_rewinds", response]
      - id: cancelled-conflict
        when: "drain 사이에 계획이 바뀜, 계획 재계산이 실패함, 결과를 모르는 write가 남아 있음(blocked), changeset을 읽거나 뒤집지 못함, app process가 conflict로 답함. 응답은 ok이고 status가 cancelled다"
        observe: ["ledger:app_rewinds", response]
      - id: cancelled-app-unavailable
        when: "app process에 적용 요청이 닿지 않음(supervisor가 답하지 않음, 앱이 돌지 않음, 연결을 받지 않음) 또는 앱이 거절 답(503, 400 등)을 줌. 응답은 ok이고 status가 cancelled다"
        observe: ["ledger:app_rewinds", response]
      - id: unknown-reply-lost
        when: "적용 요청을 보낸 뒤 답을 잃음(시간 초과, 답 상한 초과, 답 모양 불일치나 거절이 아닌 오류 답). 앱 DB가 되돌려졌는지 모른다. 응답은 ok이고 status가 unknown이며 invocations는 보낸 목록이다"
        observe: ["ledger:app_rewinds", "event:AppViewChanged", response]
      - id: mark-reverted-failed
        code: conflict
        when: "app process는 되돌렸지만 invocation에 reverted_by를 붙이지 못함. app_rewinds는 applying으로 남고 app data는 이미 되돌아가 있다(틀린 되돌리기)"
        observe: ["ledger:app_rewinds", "disk:apps/<app>/data", response]
      - id: finish-failed
        code: internal
        when: "rewind 행을 끝내지 못함(행이 없거나 깨짐, invalid stored rewind)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(dispatch가 forbidden으로 거른다), credential scope가 거절함"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 범위 밖이거나, 계획에서 고른 invocation이 없거나 다른 앱의 것"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "계획에서 고를 수 없는 호출(data_change, read, denied, 이미 되돌린 호출, 이전 release, preview, 활성 release 없음)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "결과를 모르는 write가 범위에 있음(blocked), 이미 applying인 rewind가 있음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "하위 read의 unavailable을 그대로 전달(권한 판정 port가 없거나 답이 맞지 않음)"
        observe: [response]
      - id: read-failed
        when: "계획 계산 중 기록 읽기나 활성 release 조회가 실패함, 진행 중 rewind 행이 깨짐(invalid stored rewind, internal)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]
    unclear:
      - "intake의 close·open은 앱마다 플래그 하나다(counter가 없다). rewind의 open이 activation이 닫은 접수를 다시 열 수 있다. 막는 장치가 다른 곳에 있는지 확인이 필요하다."
      - "insertApplyingRewind가 Result가 아닌 예외로 실패하면 internal로 올라가는지 확인이 필요하다."
      - "applying으로 남은 rewind가 core 재시작을 만나면 app-core-restart-recovery가 cancelled로 닫는다(같은 reason code)."

  - id: app-rewind-history-read
    title: "앱의 되돌리기 기록을 읽는다"
    actor: person
    entries: [route:apps/rewinds]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/reads.ts, packages/core/apps/rewind/store.ts]
    steps:
      - "앱 범위를 확인한다. 범위 밖이면 없는 앱과 같다. agent에게 보관한 앱은 없는 앱과 같다."
      - "app_rewinds 행을 invocation 필터, cursor, limit(기본 50, 최대 200)으로 읽는다. invocation 필터는 from_invocation이나 그 rewind의 invocations 목록에 든 id와 맞는다. 최신순이다. 다음 cursor는 마지막으로 준 id다."
      - "끝난 행은 불변이다. applying 행만 끝낼 때 바뀐다."
      - "사람 말고도 agent와 machine이 같은 route를 쓴다(session별 write 목록은 agent가 읽는다). app credential은 dispatch가 거른다."
    outcomes:
      - id: listed
        observe: [response]
      - id: not-found
        code: not_found
        when: "범위 밖 앱, 또는 agent에게 보관한 앱"
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 rwd id 꼴이 아님"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, agent, machine)"
        observe: [response]
      - id: read-failed
        when: "저장된 rewind 행이 깨짐(internal)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable)"
        observe: [response]
    crosses_process: false
    refs: [A2]

  # ---------- 폰 sync: 폰에서도 도는 앱(runs_on에 phone)의 hub ----------

  - id: app-sync-push
    title: "폰에서 한 변경을 컴퓨터 앱 DB에 차례로 적용하고 sync log에 남긴다"
    actor: person
    entries: [route:app_sync/push]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/sync/service.ts, packages/core/apps/sync/log.ts, packages/core/apps/calls/service.ts, packages/core/apps/runtime/entrypoint/control-server.ts, packages/core/apps/runtime/entrypoint/sync.ts]
    steps:
      - "짝지은 기기 자격(principal device:<id>)만 부른다. 앱의 활성 release가 없으면 not_found, 입력 release와 다르면 conflict(details.active_release), 선언이 runs_on에 phone이 없으면(sync만 있는 앱도) invalid_input이다."
      - "변경마다 차례로: 접수가 닫혀 있으면(rewind·activation) 기다리고, 앱의 write 줄을 잡은 뒤 release를 다시 보고, 같은 기기의 같은 변경 id가 sync log에 있으면 duplicate와 그 seq를 준다."
      - "아니면 invocation을 연다(caller person, view_session은 변경 id, device, effect write, operation은 폰이 준 이름, started_at은 폰의 값)."
      - "앱 process가 apps.sync_apply로 칸 단위 last-write-wins로 적용한다. invocation은 effective changeset(실제로 바뀐 것)으로 닫히고, sync log 줄은 폰이 보낸 원래 changeset과 hlc를 가리킨다(origin device). 줄마다 AppSyncChanged를 낸다."
      - "적용이 제약(UNIQUE·CHECK)에 걸리면 그 변경 하나를 건너뛴다(invocation failed, log 줄 skipped, 앱 problem). 나머지는 이어 간다."
      - "clock이 컴퓨터의 horizon 이하인데 row도 흔적도 없는 row를 건드리는 변경(흔적 정리 뒤에 온 옛 변경)은 적용하지 않고 bytes 그대로 held 줄로 남기고(invocation failed, error_code held) 폰에는 skipped로 답한다."
      - "앱 process가 없거나 적용이 오류면 그 변경과 남은 것을 멈추고 오류를 준다. 이미 된 것은 오류의 details.results에 있다. 변경 묶음을 앱 process에 보낸 뒤 답을 잃었으면(시간 넘김, 연결 끊김) 그 invocation은 실패가 아니라 결과 모름(unknown)으로 닫힌다. 보내지 못한 것과 보낸 뒤 잃은 것은 supervisor가 details.sent로 가른다. 폴더 적용, snapshot 합치기, held 다시 적용도 같은 규칙이다."
    outcomes:
      - id: applied
        when: "모든 변경이 applied, duplicate, skipped 가운데 하나로 끝남. 출력 seq는 push가 끝난 때 그 앱 log의 마지막 seq다"
        observe: ["ledger:invocations", "ledger:app_sync_log", "disk:apps/<app>/data", "event:AppSyncChanged", response]
      - id: duplicate
        when: "같은 기기가 같은 변경 id를 다시 보냄. 새 invocation도 log 줄도 없다"
        observe: [response]
      - id: skipped
        when: "적용이 제약에 걸려 그 변경 하나를 건너뜀(log 줄 skipped), 정리된 흔적과 부딪어 held 줄로 남김. 폰은 outbox에서 지운다"
        observe: ["ledger:invocations", "ledger:app_sync_log", response]
      - id: forbidden
        code: forbidden
        when: "기기 자격이 아님(사람 token, agent). route actors(user)가 아닌 자격은 dispatch가 거른다"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 활성 release가 없음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "입력 release가 활성이 아님(details.active_release, 줄을 잡은 뒤 activation이 바꾼 것도), 앱 process가 table·column이 안 맞는다고 답함. 폰은 새 snapshot을 받고 안 보낸 변경을 그 위에 다시 얹는다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "선언이 runs_on에 phone이 없음, 앱 process가 sync 앱이 아니라고 답함(not_sync), 깨진 changeset"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "앱 process가 없거나 준비 전, 도는 중 앱이 멈춰 호출이 정리됨(abandon, invocation unknown과 '다시 snapshot' 줄), invocation을 열거나 닫지 못함"
        observe: ["ledger:invocations", response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]
    unclear:
      - "앱이 commit한 뒤 core가 log 줄을 쓰기 전에 죽으면 다음 기동이 '다시 snapshot' 줄로 채운다(app-core-restart-recovery:sync-backfilled). 그 사이 이미 pull한 폰은 그 변경을 snapshot으로만 받는다."

  - id: app-sync-pull
    title: "폰이 sync log에서 자기 cursor 뒤의 변경을 받는다"
    actor: person
    entries: [route:app_sync/pull]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/sync/service.ts, packages/core/apps/sync/log.ts]
    steps:
      - "짝지은 기기 자격만 부른다. 앱이나 활성 release가 없으면 not_found다."
      - "release가 활성이 아니거나 after 뒤에 '다시 snapshot' 줄(activation이 옛 줄을 지움, 보낼 수 없는 변경, 결과 모르는 write)이 있으면 changes 없이 snapshot_needed다."
      - "after 뒤의 줄을 seq 순서로 읽어 changeset blob을 base64로 싣는다(max_bytes, 기본 8 MiB. 첫 줄은 커도 싣는다). origin은 computer·device·rewind·machine(다른 기계에서 폴더로 온 변경. 원래 changeset과 hlc)이다. 부른 기기 자신이 보낸 줄, skipped 줄, held 줄(정리된 흔적과 합칠 수 없어 적용하지 않은 변경. release가 바뀌어도 남는다)은 빼되 next는 넘긴다."
      - "읽는 사이 '다시 snapshot' 줄이나 다른 release의 줄을 만나면 거기서 멈춘다(more true). 다음 pull이 snapshot_needed를 알린다."
    outcomes:
      - id: ok
        observe: [response]
      - id: snapshot-needed
        when: "release가 활성이 아님, after 뒤에 '다시 snapshot' 줄이 있음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "기기 자격이 아님"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 활성 release가 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "changeset blob을 읽지 못함"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]

  - id: app-sync-snapshot
    title: "폰이 받을 컴퓨터 앱 DB 사본을 log seq에 맞춰 뜬다"
    actor: person
    entries: [route:app_sync/snapshot]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/sync/snapshots.ts, packages/core/apps/calls/service.ts, packages/core/apps/runtime/entrypoint/control-server.ts]
    steps:
      - "짝지은 기기 자격만 부른다. 앱·활성 release가 없거나 선언이 runs_on에 phone이 없으면 not_found다."
      - "접수가 열리기를 기다려 앱의 write 줄을 잡고, 그 앱 log의 마지막 seq를 읽고, 앱 process가 apps.snapshot으로 core 소유 임시 file(apps/<app>/sync-snapshots/<id>.sqlite)에 VACUUM INTO로 쓴다. 그 사이 온 write·push는 줄 뒤에서 기다려 사본에는 없고 seq 뒤에만 든다."
      - "크기·sha256과 만료(10분)를 core 메모리에 쥐고 불투명 id를 준다."
    outcomes:
      - id: written
        observe: ["disk:apps/<app>/sync-snapshots", response]
      - id: forbidden
        code: forbidden
        when: "기기 자격이 아님"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이나 활성 release가 없음, sync 앱이 아님(선언이나 앱 process의 not_sync), 기다리는 사이 activation이 바꾼 release가 sync 앱이 아님"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "앱 process가 없거나 준비 전, 기다리는 사이 write 줄이 정리됨(앱이 멈춤)"
        observe: [response]
    crosses_process: true
    docs: [architecture/app-call.md]

  - id: app-sync-snapshot-file
    title: "폰이 받은 snapshot 사본을 구간으로 읽는다"
    actor: person
    entries: [route:app_sync/snapshot_file]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/sync/snapshots.ts]
    steps:
      - "그 snapshot을 뜬 기기의 자격만 읽는다(다른 자격에는 없는 것과 같다). 만료된 것은 먼저 지운다."
      - "offset부터 length(최대 8 MiB)를 file에서 읽어 준다. 끝까지 읽은 file은 지운다. core는 DB를 열지 않고 bytes만 준다."
    outcomes:
      - id: served
        observe: [response]
      - id: not-found
        code: not_found
        when: "snapshot이 없음, 만료됨, 끝까지 읽혀 지워짐, core가 다시 떠 지워짐, 다른 기기의 것"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "offset이 file 끝을 넘음"
        observe: [response]
    crosses_process: false

  # ---------- 폰 host: 폰에서 도는 앱의 설치와 sync(폰 앱 안) ----------

  - id: phone-app-install
    title: "폰이 폰에서 도는 앱을 처음 설치한다(sync 앱은 컴퓨터 DB의 snapshot, standalone은 빈 DB에서 local migration)"
    actor: system
    entries: [system:phone-app-install]
    uses: [route:apps/phone_screens, route:apps/phone_file, route:apps/screen_file, route:app_sync/snapshot, route:app_sync/snapshot_file]
    boundary: [mobile, remote-protocol]
    code: [packages/mobile/src/apps/local/install.ts, packages/mobile/src/apps/local/transfer.ts, packages/mobile/src/apps/local/store.ts, packages/mobile/src/data/local-apps.ts]
    steps:
      - "컴퓨터에 닿은 동안 apps/phone_screens에서 runs_on에 phone이 있는 앱(backend가 있는 것)을 보면 설치되지 않은 것을 설치한다. 앱 화면을 열 때도 설치한다."
      - "files/apps/<computer>/<app>/에 installed.json이 없는 폴더(멈춘 설치)는 먼저 지운다."
      - "apps/phone_file로 backend.js와 migration file을, apps/screen_file로 화면마다 phone.js를 받아 manifest의 크기·sha256과 맞는 것만 release/<rel>/에 쓴다. backend.json은 마지막에 쓴다."
      - "sync 앱(runs_on에 computer와 phone): app_sync/snapshot을 8 MiB씩 snapshot_file로 받아 disk에 쓴 뒤 크기와 sha256을 disk에서 다시 확인하고 app.sqlite로 옮겨 adoptSnapshot(node는 기기 id, cursor는 snapshot의 seq)."
      - "standalone 앱(runs_on이 phone뿐): 빈 app.sqlite에 ensureSyncTables를 하고 release의 migration으로 0에서 data_schema까지 올린다."
      - "installed.json(release, kind, 화면, backend manifest, 마지막 맞춘 시각)을 마지막에 쓴다. 실패하면 폴더를 지우고 실패 상태로 둔다."
    outcomes:
      - id: installed
        observe: ["disk:files/apps/<computer>/<app>"]
      - id: failed
        when: "file이나 snapshot을 받지 못함, 크기·sha256이 다름, snapshot의 release가 목록과 다름(목록을 다시 읽는다), migration 실패. 폴더는 지워지고 다음 목록 읽기나 Try again에 다시 한다"
        observe: ["disk:files/apps/<computer>/<app>"]
    crosses_process: false
    risk: [data-loss]

  - id: phone-app-sync
    title: "폰이 sync 앱의 local 변경을 push하고 컴퓨터의 변경을 pull한다"
    actor: system
    entries: [system:phone-app-sync]
    uses: [route:app_sync/push, route:app_sync/pull]
    boundary: [mobile, remote-protocol]
    code: [packages/mobile/src/apps/local/sync.ts, packages/mobile/src/apps/local/store.ts, packages/mobile/src/data/local-apps.ts]
    steps:
      - "폰 앱이 앞에 있고 그 컴퓨터에 닿은 동안만 돈다. 계기: guest의 local 호출이 변경을 commit함(local_change), 연결됨, AppSyncChanged, syncNow. 앱마다 한 번에 하나다."
      - "push: host transaction 하나로 outbox의 clock 없는 줄을 commit 순서로 찍고, 256개·10 MiB씩 app_sync/push로 보낸다. 답(applied, duplicate, skipped)을 받은 줄만 outbox에서 지운다. 오류면 details.results의 줄만 지우고 나머지는 남는다."
      - "pull: cursor 뒤를 more가 false일 때까지 받는다. 묶음마다 host transaction 하나(foreign_keys off)에서 outbox 찍기, 변경 적용(칸 단위 last-write-wins), cursor 올리기를 한다. 도중에 오류면 묶음 전체가 rollback되고 cursor는 그대로다. 제약에 걸린 변경 하나는 건너뛴다."
      - "guest 호출은 host transaction이 끝날 때까지 기다린다(busy timeout). 들어온 변경은 호출 사이에만 들어간다."
      - "push와 pull이 둘 다 되면 installed.json의 마지막 맞춘 시각을 고친다. release 바뀜의 backup은 새 release에서 outbox가 비는 push가 된 뒤 지운다."
    outcomes:
      - id: synced
        observe: ["disk:files/apps/<computer>/<app>", "ledger:app_sync_log"]
      - id: offline
        when: "컴퓨터가 답하지 않거나 앱 process가 없음(unavailable). 상태는 그대로이고 다음 계기에 다시 한다"
        observe: ["disk:files/apps/<computer>/<app>"]
      - id: release-changed
        when: "push가 conflict(active_release)이거나 pull이 snapshot_needed. 목록을 다시 읽고 phone-app-release-change로 간다"
        observe: ["disk:files/apps/<computer>/<app>"]
      - id: failed
        when: "그 밖의 오류(outbox 줄 하나가 8 MiB를 넘음, 맞지 않는 변경). outbox와 cursor는 그대로이고 실패 상태다"
        observe: ["disk:files/apps/<computer>/<app>"]
    crosses_process: false
    risk: [data-loss]

  - id: phone-app-release-change
    title: "폰이 설치된 앱을 새 release(또는 같은 release의 새 snapshot)로 바꾼다"
    actor: system
    entries: [system:phone-app-release-change]
    uses: [route:apps/phone_file, route:apps/screen_file, route:app_sync/snapshot, route:app_sync/snapshot_file]
    boundary: [mobile, remote-protocol]
    code: [packages/mobile/src/apps/local/release.ts, packages/mobile/src/apps/local/store.ts, packages/mobile/src/apps/local/use-local-screen.ts]
    steps:
      - "계기: 목록의 release가 설치된 것과 다름, push의 conflict, pull의 snapshot_needed. 상태를 installing으로 두고 앱 화면의 guest가 내려가기를 기다린다."
      - "새 release의 file을 받는다. sync 앱은 outbox를 찍는다. app.sqlite를 WAL 밖으로 꺼내 app.before-<rel>.sqlite로 backup한다."
      - "sync 앱, outbox가 빔: 새 snapshot을 받아 adoptSnapshot한 file이 app.sqlite가 된다."
      - "sync 앱, outbox가 있음: backup 사본을 새 release의 migration으로 local migrate하고, 새 snapshot을 adopt하고, 남은 변경을 이름으로 다시 표현(reexpress)한 file이 app.sqlite가 된다. backup은 새 release의 첫 push가 될 때까지 남는다."
      - "standalone 앱: backup 사본을 local migrate한 file이 app.sqlite가 된다."
      - "모든 단계는 work/의 사본에서 하고 app.sqlite는 마지막 옮기기 전까지 그대로다. 옛 release 폴더와 남길 것 없는 backup은 바꾼 뒤 지운다."
    outcomes:
      - id: switched
        observe: ["disk:files/apps/<computer>/<app>"]
      - id: failed
        when: "file·snapshot을 받지 못함, migration이나 다시 표현이 실패함, snapshot의 release가 목록과 다름. app.sqlite와 outbox는 그대로이고 옛 release로 계속 열린다. 실패 상태로 두고 다음 계기에 다시 한다"
        observe: ["disk:files/apps/<computer>/<app>"]
    crosses_process: false
    risk: [data-loss]

  - id: phone-app-external
    title: "폰에서 도는 앱의 external operation은 outbox를 먼저 보낸 뒤 컴퓨터로 간다"
    actor: system
    entries: [system:phone-app-external]
    uses: [route:app_sync/push, route:app_views/call]
    boundary: [mobile, remote-protocol]
    code: [packages/mobile/src/apps/local/store.ts, packages/mobile/src/apps/local/use-local-screen.ts]
    steps:
      - "guest의 read·write operation은 늘 폰에서 돈다. external만 host의 call로 온다."
      - "컴퓨터에 닿지 않으면 보내지 않고 unavailable이다."
      - "그 앱의 차례에서 push를 한다. 실패하거나 outbox가 비지 않으면 보내지 않고 unavailable이다."
      - "push가 되면 컴퓨터에 열어 둔 view로 app_views/call을 보낸다. 결과로 컴퓨터에서 바뀐 것은 다음 pull로 온다."
    outcomes:
      - id: sent
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "컴퓨터에 닿지 않음, push 실패, 보내지 못한 변경이 남음. 호출은 컴퓨터로 가지 않는다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]

  - id: phone-app-prune
    title: "앱이 컴퓨터의 목록에서 빠지거나 컴퓨터를 지우면 폰이 그 앱 폴더를 지우되 컴퓨터에 안 간 변경과 standalone data는 남긴다"
    actor: system
    entries: [system:phone-app-prune]
    uses: [route:apps/phone_screens]
    boundary: [mobile]
    code: [packages/mobile/src/apps/local/prune.ts, packages/mobile/src/apps/local/store.ts, packages/mobile/src/data/local-stores.ts]
    steps:
      - "계기: 컴퓨터의 apps/phone_screens 목록에 폰에서 도는 앱이 더는 없음(앱이 보관·삭제·release 없음), 또는 Settings에서 컴퓨터를 지워 폰이 그 컴퓨터를 더는 pairing하지 않음. 앞의 계기는 그 앱의 guest가 mount되어 있지 않을 때만 처리한다."
      - "컴퓨터를 지운 계기는 그 컴퓨터의 폴더를 훑는다. installed.json이 없는 폴더(멈춘 설치)는 바로 지우고, 있는 앱은 아래 규칙으로 정리한다. 앱이 하나도 안 남으면 그 컴퓨터 폴더도 지운다."
      - "sync 앱: outbox를 읽어 비어 있을 때만 앱 폴더(app.sqlite, backup, release 폴더)를 지운다. 안 보낸 변경이 있으면 폴더와 data를 그대로 둔다(다시 같은 컴퓨터와 pairing하거나 앱이 목록에 돌아오면 다시 맞춘다)."
      - "standalone 앱: 컴퓨터가 그 data를 모르므로 자동으로 지우지 않는다. 컴퓨터의 목록에서 빠져도 폰의 목록에 남고 그대로 열린다."
    outcomes:
      - id: removed
        when: "outbox가 빈 sync 앱 폴더, 멈춘 설치의 폴더"
        observe: ["disk:files/apps/<computer>/<app>"]
      - id: kept
        when: "안 보낸 변경이 있는 sync 앱, standalone 앱, guest가 mount된 앱"
        observe: ["disk:files/apps/<computer>/<app>"]
    crosses_process: false
    risk: [data-loss]

  # ---------- 사용 관계, sdk 상태, 화면 파일 ----------

  - id: app-usage-read
    title: "다른 앱·project가 쓰는 앱 tool의 사용 관계를 읽는다"
    actor: agent
    entries: [route:apps/usage]
    boundary: [apps]
    code: [packages/core/apps/usage/reads.ts, packages/core/apps/usage/users.ts]
    steps:
      - "호출한 agent의 session workspace가 home이 아니거나 session을 모르면 forbidden이다(사용 관계는 home의 lophn만 읽는다)."
      - "app을 주면 그 앱이 없거나 agent에게 보관한 앱이면 not_found다(사람과 machine은 보관한 앱도 읽는다). 주지 않으면 활성 앱 전부다."
      - "invocation 기록에서 세며, 쓰는 쪽은 그 앱 command를 부른 session의 workspace다. home과 그 앱 자신의 workspace는 세지 않는다."
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent의 session이 home이 아니거나 session을 모름. app credential(route actors는 user, machine, agent)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "지정한 앱이 없거나, agent에게 보관한 앱"
        observe: [response]
      - id: read-failed
        when: "앱이나 invocation 기록 읽기가 실패함, 활성 declaration 읽기가 실패함"
        observe: [response]
    crosses_process: false

  - id: app-sdk-status-read
    title: "앱이 고정한 내장 SDK 판이 지원 하한과 지금 판에 비해 어떤지 읽는다"
    actor: agent
    entries: [route:apps/sdk_status]
    boundary: [sdk]
    code: [packages/core/apps/sdk-status/status.ts, packages/core/apps/sdk-status/review-store.ts, packages/core/apps/sdk-status/detect.ts, packages/core/apps/routes.ts]
    steps:
      - "보관하지 않고 켜진 release가 있는 앱만 싣는다. agent는 자기 범위의 앱만 본다. 범위 판정이 실패하면 그 앱은 목록에서 빠진다."
      - "앱 bundle 사본의 @lophn/* 고정 판을 지원 하한(lophn.supported_from)과 지금 판에 견준다(required, available, current). 설치된 SDK 부분만 본다."
      - "migrate-sdk 메모 file 이름은 고정 판 다음부터 지금 판까지 옛것부터 싣는다(notes). 마지막 결정(review)의 through와 고정 판 가운데 높은 쪽 다음부터 지금 판까지는 unreviewed로 따로 싣는다."
      - "앱마다 마지막 결정(decision, 시각, through, update의 판 올리기가 끝났는지(지금 pin과 through를 견줘 계산), 고른 기능과 state·한 줄 사유)를 싣는다. 앞선 결정의 기능이 아직 open이면 같이 싣는다. 결정이 없으면 null이다."
      - "지정한 앱이 범위 밖이면 빈 목록이 아니라 not_found다. 범위 판정 실패도 같은 not_found로 가려진다(routes.ts)."
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, machine, agent)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "지정한 앱이 없거나 보관했거나 범위 밖이다, 또는 범위 판정 실패가 같은 답으로 가려진다(켜진 release가 없는 앱은 빈 목록)"
        observe: [response]
      - id: read-failed
        when: "앱 목록이나 선언 읽기가 실패함(invalid stored app 등)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    unclear:
      - "route가 unavailable을 선언하지만 handler는 내지 않는다. 메인 스레드 sql read라 reader unavailable이 없고, 범위 판정 실패는 목록에서 빠지거나 not_found로 가려진다. 선언을 고칠 곳이다."
      - "bundle 파일 읽기의 예외(readdir·readFile, status.ts)는 Result가 아니라 throw로 올라간다. 어떤 code로 보이는지 확인이 필요하다."

  - id: app-phone-target-read
    title: "agent가 사람의 기준 폰(primary)의 이름, OS, 크기, DPR을 읽는다"
    actor: agent
    entries: [route:apps/phone_target]
    boundary: [app-runtime]
    code: [packages/core/apps/phone/target.ts]
    docs: [architecture/remote.md]
    steps:
      - "devices 표에서 is_primary인 기기의 os, width, height, dpr과 이름을 읽는다. 이름은 명단을 저장할 때 view의 이름을 둔 alias이고, 아직 없으면 폰이 알린 name이다. 기기 id와 공개 key는 싣지 않는다(agent가 기기 key를 보지 못하게 앱 쪽에 좁은 읽기를 둔다)."
      - "agent는 이 크기(CSS px, 폰 화면 전체)에 맞춰 폰 화면을 그린다. 기기가 없으면 사람에게 폰을 pairing하라고 말한다."
    outcomes:
      - id: found
        observe: [response]
      - id: no-device
        when: "pairing한 기기가 없다(device는 null)"
        observe: [response]
    crosses_process: false
    declared_only: [invalid_input, forbidden, unavailable]

  - id: app-phone-screens-list
    title: "폰이 받을 앱 화면 목록(manifest와 running)과 지금 도는 preview의 폰 화면을 읽는다"
    actor: person
    entries: [route:apps/phone_screens]
    boundary: [app-runtime]
    code: [packages/core/apps/phone/screens.ts, packages/core/apps/phone/files.ts, packages/core/apps/routes.ts, packages/core/main/daemon/wiring/apps.ts, packages/protocol/apps/phone.ts, packages/protocol/apps/phone-screen.ts, packages/protocol/apps/phone-backend.ts]
    docs: [architecture/remote.md]
    steps:
      - "메인 스레드 handler가 보관하지 않은 앱마다 active release 선언의 화면 가운데 places가 phone 하나인 것을 고른다. active release가 없는 앱과 phone 화면이 없는 앱은 싣지 않는다."
      - "화면마다 bundle 사본의 screens/<key>/phone.json을 읽어 phoneManifestSchema로 검사한다. 화면 폴더나 file이 bundle의 screens 폴더 밖(`..`, 밖을 가리키는 symlink)이면 없는 file이다. manifest가 없거나 틀린 화면은 오류 없이 뺀다."
      - "선언의 runs_on에 phone이 있는 앱은 bundle 사본의 phone/backend.json을 phoneBackendManifestSchema로 읽는다. 읽지 못하면(없음, 틀림) 그 앱의 화면을 모두 빼고 log 한 줄을 남긴다. phone이 없는 앱의 backend는 null이다."
      - "화면마다 app, 앱 이름, 선언의 icon(lucide 이름이나 null), screen, label, params, release, code_commit, bundle_hash(release 기록), manifest, runs_on(선언에 없으면 [computer]), backend, phone_capabilities(그 release의 선언 ∩ active phone.use grant, broker와 같은 effectiveScope. grant를 주거나 거두면 app_grants 변경으로 폰이 다시 읽는다), running을 낸다. running은 supervisor가 지금 관측한 live process가 그 release이고 ready이며 요청을 받는가다. 관측을 못 하면 false다."
      - "폰은 manifest를 `phoneCanRun`으로 자기 판과 맞춰 열지 말지 정하고, 화면 byte는 `apps/screen_file`(phone.js)로 받는다. 폰의 앱 목록에는 preview에만 폰 화면이 있는 앱도 들어 Home과 sidebar 줄에 Preview 표시가 붙고 바로 preview 화면을 열며, preview가 멈추면 빠진다."
      - "previews: 보관하지 않은 앱마다 그 앱의 preview가 ready인지 본다(preview service의 현재 preview와 supervisor 관측. 관측을 못 하면 없는 것이다). ready면 그 preview bundle 사본의 declaration.json을 읽어 places가 phone 하나인 화면을 고르고 live와 같은 규칙으로 manifest를 읽는다(사본 밖이거나 틀린 화면은 뺀다). 화면이 없는 preview는 싣지 않는다. active release가 없는 앱도 싣는다."
      - "preview마다 app, 앱 이름, icon, release(release 없이 띄웠으면 null), bundle_hash, process_nonce, phone_capabilities(preview 선언이 phone.use로 선언한 기능. preview에는 grant가 없고 선언하지 않은 기능은 폰이 live처럼 forbidden으로 거절한다), 화면(screen, label, params, manifest)을 낸다. 폰은 화면 byte를 `apps/screen_file`의 target {mode: preview, app, process_nonce}로 받고 view는 `app_views/open`의 mode preview로 연다. preview가 서고 멈출 때 app_runtime 변경이 나가 폰이 다시 읽는다."
    outcomes:
      - id: listed
        when: "읽힌 화면 목록과 previews(빈 목록도)를 돌려줬다. 빠진 앱·화면(backend manifest를 못 읽은 폰 앱 포함)이 있어도 오류가 아니다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 빈 객체가 아님"
        observe: [response]
      - id: internal
        code: internal
        when: "앱 목록이나 active 선언을 읽지 못함(store가 낸 internal 그대로)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "이 route의 actor 종류가 아니거나 credential scope에 이 operation이 없다(dispatch)"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    declared_only: [unavailable]
    unclear:
      - "protocol이 unavailable을 선언하지만 조립된 handler는 store 오류를 internal로 돌려주고 supervisor 관측 실패는 running false로 삼킨다. unavailable은 handler가 붙기 전(등록 때 unattachedRead)에만 난다"

  - id: app-phone-file-read
    title: "폰이 앱 backend와 migration file 하나를 받는다"
    actor: person
    entries: [route:apps/phone_file]
    boundary: [app-runtime]
    code: [packages/core/apps/phone/files.ts, packages/core/main/daemon/wiring/apps.ts, packages/protocol/apps/phone.ts]
    docs: [architecture/remote.md]
    steps:
      - "입력은 app, release, path다. 그 앱의 active release가 그 release가 아니면 not_found다."
      - "그 release의 bundle 사본의 phone/backend.json을 읽어 path가 phone/backend.js, phone/backend.json, 그 manifest가 적은 migrations/<from>-<to>.sql 가운데 하나인지 본다. 목록 밖(`..`, 다른 화면 file, node_modules, backend.js.map 포함)이면 not_found다. manifest가 없거나 틀려도 not_found다."
      - "목록 안의 path는 realpath로 풀어 bundle 사본 폴더 밖(밖을 가리키는 symlink)이면 not_found, 8 MiB를 넘는 file도 not_found다. 읽기만 한다."
      - "폰은 받은 byte를 manifest의 size·sha256으로 확인한다."
    outcomes:
      - id: served
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않음(dispatch)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "그 release가 그 앱의 active release가 아님, backend.json이 없거나 틀림, path가 목록 밖, file이 없거나 bundle 밖을 가리키거나 8 MiB를 넘음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 credential이 아님(route actors는 user만)"
        observe: [response]
      - id: read-failed
        when: "active release 선언 조회(loadActiveDeclaration)가 낸 오류 그대로(invalid stored app 등)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    risk: [sandbox]
    unclear:
      - "route가 unavailable을 선언하지만 handler는 내지 않는다. bundle 조회 실패는 not_found로 가려진다."

  - id: app-sdk-decide
    title: "home lophn이 앱 하나의 SDK 업데이트 결정을 기록하고 update면 그 앱의 lophn에게 같은 동작으로 맡긴다"
    actor: agent
    entries: [route:apps/sdk_decide]
    uses: [route:apps/sdk_review_record, route:apps/sdk_status]
    boundary: [sdk, app-runtime]
    code: [packages/core/apps/sdk-status/decide.ts, packages/core/apps/sdk-status/status.ts, packages/core/main/daemon/wiring/apps.ts]
    steps:
      - "메인 스레드 handler가 입력을 검사하고 호출 agent의 session·turn을 credential에서 읽는다. 앱의 지금 판을 읽어(app-sdk-status-read와 같은 읽기) 보관한 앱과 켜진 release가 없는 앱은 not_found로 닫는다."
      - "leave는 required SDK가 있는 앱에 낼 수 없고 기능을 달 수 없다. update는 모든 SDK가 지금 판이고 기능도 없으면 낼 수 없다. 기능의 근거 메모는 그 앱의 notes나 unreviewed에 있는 file이어야 한다."
      - "program이 through(SDK → 지금 판)와 handoff 글(옮길 SDK의 고정 판 → 목표 판과 메모 file, migrate-sdk를 따르라는 글, 기능마다 ID와 제안 글)을 채운다. agent 입력으로 받지 않는다. 기능 ID는 handler가 정한다."
      - "machine 자격의 internal command(app-sdk-review-record)로 낸다. 글은 call 본문과 같은 길로 redaction과 blob 준비를 거친다."
    outcomes:
      - id: recorded
        when: "leave는 review 한 줄, update는 review와 feature(open)와 handoff call(reply none)이 한 tx에 남는다"
        observe: [ledger:sdk_reviews, ledger:sdk_features, ledger:agent_calls, response]
      - id: forbidden
        code: forbidden
        when: "agent turn의 credential이 아니다(route actors는 agent)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 보관했거나 켜진 release가 없다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 모양이 틀림, required SDK가 있는 앱의 leave, leave에 기능, 할 일이 없는 update(모든 SDK가 지금 판이고 기능이 없음), 그 앱의 메모가 아닌 근거 메모"
        observe: [response]
      - id: handoff-refused
        when: "handoff call이 거절되거나 배달되지 못했다(call 정책·private 예외, 명함 검사, 받는 곳이 없거나 닫힘). 그 오류가 그대로 돌아가고 review와 feature도 남지 않는다"
        observe: [response]
      - id: status-read-failed
        when: "앱 목록이나 선언 읽기가 실패함"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/ui-kit.md, architecture/agent-call.md]
    declared_only: [conflict, unavailable]
    unclear:
      - "call 거절은 router가 낸 code가 그대로 온다(forbidden, not_found, conflict, unavailable). 정확한 code 목록은 app-sdk-review-record 쪽이 소유한다."

  - id: app-sdk-review-record
    title: "core 안 machine이 SDK 결정과 고른 기능, handoff call을 한 tx에 남긴다"
    actor: system
    entries: [route:apps/sdk_review_record]
    boundary: [sdk, app-runtime]
    code: [packages/core/apps/sdk-status/commands.ts, packages/core/apps/sdk-status/review-store.ts, packages/core/router/commands.ts]
    steps:
      - "machine 자격만 받는다. 앱이 없거나 보관했으면 not_found다."
      - "update면 호출한 home session의 이름으로 그 앱의 lophn에게 reply none call을 Router로 보낸다. call 정책(private 예외 포함)과 명함 검사가 call.send와 같다. call이 거절되거나 배달 실패면 오류를 돌려 tx를 되돌린다."
      - "call이 닿으면 review(through, call ID)와 feature(처음 state open)를 쓴다. leave는 review만 쓴다."
    outcomes:
      - id: recorded
        observe: [ledger:sdk_reviews, ledger:sdk_features, ledger:agent_calls, response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아니다, 또는 Router가 call을 거절한다(call 정책)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 보관했다, 또는 받는 agent·workspace가 풀리지 않는다"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "update에 본문이 없다, leave에 기능이 있다, 또는 명함이 받지 못하는 본문"
        observe: [response]
      - id: handoff-undelivered
        code: conflict
        when: "받는 session이 닫혀 있다 등 배달 실패(fail_reason closed). 다른 배달 실패는 unavailable"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/ui-kit.md, architecture/agent-call.md]

  - id: app-sdk-feature
    title: "앱 lophn이 home이 넘긴 기능 하나의 결과(done, changed, skipped)와 한 줄 사유를 낸다"
    actor: agent
    entries: [route:apps/sdk_feature]
    boundary: [sdk, app-runtime]
    code: [packages/core/apps/sdk-status/commands.ts, packages/core/apps/sdk-status/review-store.ts]
    steps:
      - "기능이 속한 앱을 찾고 호출한 agent가 그 앱을 다룰 수 있는지 authorizeApp으로 본다. 앱 workspace의 agent는 자기 앱의 기능만 고친다."
      - "state와 한 줄 사유, 시각을 바꾼다. 처음 state는 open이다."
    outcomes:
      - id: reported
        observe: [ledger:sdk_features, response]
      - id: not-found
        code: not_found
        when: "기능이 없거나, 다른 앱의 기능이거나, 보관한 앱의 기능이다(없는 기능과 같은 답)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "그 앱을 다룰 자격이 없다(authorizeApp)"
        observe: [response]
    crosses_process: false
    risk: [permission]
    docs: [architecture/ui-kit.md]

  - id: app-screen-file-read
    title: "앱 화면의 bundle 파일 한 개를 내준다"
    actor: shell
    entries: [route:apps/screen_file]
    boundary: [app-runtime]
    code: [packages/core/apps/screens/serve.ts, packages/core/apps/routes.ts]
    steps:
      - "shell main이 lophn-app:// 요청을 화면 byte로 바꾸려고 부른다. 대상은 view가 묶인 release다."
      - "화면 이름과 path를 검사한다(빈 값, '.', '..', '/'나 '\\' 포함, 상대 경로가 아니거나 콜론 포함은 거절)."
      - "bundle 사본의 screens/<screen>/<path>를 realpath로 풀어 그 screen 폴더 밖이면 not_found다. 폴더는 8 MiB를 넘는 파일을 조용히 not_found로 답한다."
      - "preview 대상은 그 앱의 지금 preview가 연 bundle 사본에서 읽는다. nonce가 지금 preview의 것이 아니면(멈춘 preview, 다른 앱) 사본을 찾지 못해 not_found다."
      - "파일을 읽기만 하고 형식으로 Content-Type을 정한다."
    outcomes:
      - id: served
        observe: [response]
      - id: invalid-path
        code: invalid_input
        when: "화면 이름이 빈 값이거나 '.', '..'이거나 '/'·'\\'를 포함함, path가 상대 경로가 아니거나 ':'를 포함함"
        observe: [response]
      - id: not-found
        code: not_found
        when: "파일이 없음, 그 screen 폴더 밖을 가리킴, 8 MiB를 넘는 파일(조용히 막음), preview 대상인데 그 nonce가 그 앱의 지금 preview가 아님, 활성 release가 없거나 다른 앱의 release"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 credential이 아님(route actors는 user만)"
        observe: [response]
      - id: read-failed
        when: "bundle 사본 조회(loadRelease)가 낸 오류 그대로(invalid stored app 등)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    unclear:
      - "route가 unavailable을 선언하지만 handler는 내지 않는다. file stream handler는 apps wiring이 늘 등록하고, bundle 조회 실패는 not_found나 internal이다. 선언을 고칠 곳이다."
    risk: [sandbox]

  # ---------- 파일 접근: broker를 거치지 않는다 ----------

  - id: app-file-access
    title: "앱 child가 SDK cap-fs로 파일을 읽고 쓴다(broker를 거치지 않는다)"
    actor: app
    entries: [system:app-file-access]
    uses: [sdk:cap-fs/readFile, sdk:cap-fs/readTextFile, sdk:cap-fs/writeFile, sdk:cap-fs/writeTextFile, sdk:cap-fs/watch, release-prepare:failed-release]
    boundary: [app-capability, app-runtime]
    code: [packages/sdk/cap-fs/fs.ts, packages/sdk/cap-fs/declaration.ts, packages/core/apps/releases/sdk-permissions.ts]
    steps:
      - "앱 code가 cap-fs의 readFile·readTextFile·writeFile·writeTextFile·watch를 부르면 앱 child 안의 node:fs가 바로 연다. 경로는 절대 경로로 풀 뿐 폴더 경계, symlink, 선언, grant를 검사하지 않는다."
      - "core로 가는 broker route가 없다. 실행 범위(effective.ts)는 fs.read·fs.write를 계산하지만 이를 판정하는 호출이 없다. 실행 때 broker가 막는 것은 net·secret·notify·앱 호출이다."
      - "OS가 그 user에게 허락한 파일이면 어디든 읽고 쓴다. 앱 log와 호출 기록에는 남지 않는다."
      - "OS 오류는 CapabilityError로 바꿔 던진다. ENOENT는 not_found, createNew의 EEXIST는 conflict, 그 밖은 unavailable이다. forbidden은 나오지 않는다."
      - "release 준비는 선언에 fs.read나 fs.write 종류가 있는지만 본다(release-prepare의 failed-release). 경로와 실제 쓰임은 보지 않는다."
    outcomes:
      - id: accessed
        when: "OS가 허락해 읽기, 쓰기, 감시 시작이 됨. 선언과 grant는 보지 않는다"
        observe: ["disk:<path>", response]
      - id: not-found
        code: not_found
        when: "OS가 파일을 찾지 못함(ENOENT)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "createNew로 쓰는데 파일이 이미 있음(EEXIST)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "그 밖의 OS 오류(EACCES, EPERM, EISDIR 등)"
        observe: [response]
      - id: watch-no-path
        code: invalid_input
        when: "watch에 경로가 하나도 없음"
        observe: [response]
      - id: watch-ended-by-error
        when: "감시 중 watcher가 error를 내거나 handler가 던져 done이 거절됨. 감시는 닫힌다"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/app-call.md, architecture/package.md]
    unclear:
      - "architecture/package.md는 '실행 때 막는 것은 broker다'라고 쓴다. cap-fs는 broker route가 없어 실행 때 막지 않는다. app-call.md(cap-fs는 OS가 허락하는 파일을 어디든 읽고 쓴다)는 실제 동작과 맞다. 두 문서 가운데 정본을 사람이 정하거나, cap-fs에 broker 검사를 넣을지 정한다."
      - "앱 child는 lophn과 같은 OS user로 뜨고 Node 권한 flag가 없다(processes/spawn.ts). 그래서 secrets.json 같은 data root 파일도 OS 권한만 있으면 닿는다(코드 읽기로 본 것이고 실행으로 확인하지 않았다)."
      - "permissions/model.ts의 경로 판정(isSameOrInside)과 adapters/realpath.ts(realPathResolver)는 export만 있고 production 호출이 없다. 경로 검사를 넣을 때 쓸 재료인지 확인이 필요하다."

  # ---------- grant ----------

  - id: app-grant-list
    title: "앱 grant를 읽는다"
    actor: person
    entries: [route:app_grants/list]
    boundary: [app-runtime]
    code: [packages/core/apps/permissions/reads.ts, packages/core/apps/permissions/store.ts]
    steps:
      - "앱을 주면 범위 밖이거나 없는 앱은 not_found다. 주지 않으면 범위 안 앱의 grant를 모두 준다. agent에게 보관한 앱의 grant는 보이지 않는다(not_found로 빠진다)."
      - "상태(active, revoked)와 cursor로 자른다. 읽기만 한다."
      - "supervisor의 broker도 요청마다 같은 route를 부른다(scope 계산의 입력이다). 판정 없이 값만 읽으므로 broker flow가 uses로 가리킨다. shell main의 app frame도 fetch host를 읽는다."
    outcomes:
      - id: listed
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 깨졌거나, app·status·limit이 처음 조회와 다르거나, 끝을 넘음"
        observe: [response]
      - id: read-failed
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable), grant 읽기나 행 읽기가 실패함(internal)"
        observe: [response]
    crosses_process: false

  - id: app-grant-revoke
    title: "사람이 앱 grant를 거둔다"
    actor: person
    entries: [route:app_grants/revoke]
    boundary: [app-runtime]
    code: [packages/core/apps/permissions/commands.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 없거나 범위 밖이거나 이미 거둔 grant는 같은 conflict로 답한다."
      - "앱 process가 떠 있어도 막지 않고 grant 행을 바로 revoked로 바꾼다. broker가 요청마다 선언 ∩ active grant를 다시 읽으므로 다음 요청부터 거절되고, 이미 시작한 요청은 끝까지 간다. event는 남기지 않는다. secret 값은 지우지 않는다. reason 입력은 저장하지 않는다."
    outcomes:
      - id: revoked
        observe: ["ledger:grants"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-active
        code: conflict
        when: "grant가 없음, 앱이 없음, 범위 밖(authorizeApp의 forbidden·not_found), 이미 거둠"
        observe: [response]
      - id: dependency-unavailable
        code: unavailable
        when: "권한 판정 port가 없거나 답이 맞지 않음(app dependency unavailable)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 grant나 앱 행이 깨졌거나, 갱신이 행을 바꾸지 못함"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [H2]
    unclear:
      - "reason 입력을 handler가 무시한다(commands.ts). 저장되는 곳이 있는지 확인이 필요하다."

  # ---------- secret과 OAuth ----------

  - id: app-secret-value
    title: "supervisor가 앱 외부 요청에 붙일 secret 값을 한 번 받는다"
    actor: system
    entries: [route:apps/secret_value]
    pre: [app-record-started:started]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/permissions/secret-value.ts, packages/core/apps/permissions/secret-allowance.ts, packages/core/apps/oauth/service.ts, packages/core/main/app-supervisor/secret-delivery.ts]
    steps:
      - "supervisor가 machine 자격으로 부른다. 부른 자식이 지금 보는 live 자식과 release, process nonce가 같아야 한다(아니면 forbidden)."
      - "목적지(scheme, host, port)를 확인한다. http는 loopback host만이다."
      - "현재 선언 ∩ active grant로 secret.use와 목적지의 net.fetch 허락을 다시 판정한다. 선언에 없거나 grant가 없으면 forbidden이다. 이 판정은 파일 값 읽기보다 먼저다."
      - "OAuth secret이면 access token을 쓸 수 있게 한다. 만료 5분 전부터 발급자에게 refresh를 대기열로 부른다. 발급자가 거절하면 token을 지우고 sign-in이 필요하다. 닿지 못했는데 token이 만료됐으면 unavailable이다. 닿지 못했어도 token이 아직 유효하면 그대로 쓴다."
      - "값을 못 주었는데 이유가 값 없음(not_found)이나 OAuth sign-in 필요(conflict)이고 입력에 invocation이 있으면, 그 invocation의 빈 자리 {app, secret}을 core 메모리에 적어 둔다(app-command-call의 failed가 싣는다). 값은 어디에도 없다."
      - "secrets 파일에서 값을 읽는다. 값이 없으면 not_found다. 알려진 값 registry가 그 값을 알 때만 값을 응답 본문으로 준다. 값은 ledger, event, log, 오류에 남지 않는다."
    outcomes:
      - id: delivered
        observe: [response]
      - id: delivered-after-refresh
        observe: [response, "disk:secrets.json"]
      - id: refresh-rejected
        code: conflict
        when: "발급자가 400, 401, invalid_grant로 refresh를 거절함, 또는 token이 만료됐는데 refresh token이 없음, 또는 client 설정이 바뀜. token을 지우고 재인증을 요구한다"
        observe: [response, "disk:secrets.json"]
      - id: forbidden
        code: forbidden
        when: "machine이 아님(route actors), 부른 자식이 지금 live 자식이 아님(mode, release, nonce 다름 또는 프로세스가 살아 있지 않음), 목적지가 잘못됨(http는 loopback만), 이름이 예약된 네임스페이스(app-oauth., provider-oauth.)나 provider·mcp 이름, 선언이나 grant가 없음(이름이 선언에 없음, release 다름, 목적지 허락 없음)"
        observe: [response]
      - id: sign-in-required
        code: conflict
        when: "client id가 없음, 또는 저장된 token이 없음"
        observe: [response]
      - id: secret-missing
        code: not_found
        when: "선언된 이름인데 secrets 파일에 값이 없음"
        observe: [response]
      - id: not-deliverable
        code: unavailable
        when: "값이 비었거나 registry가 모르는 값, 또는 발급자에 닿지 못하고 token이 만료됨(refresh 대기 시간 초과)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 모양이 맞지 않음"
        observe: [response]
      - id: dependency-failed
        when: "supervisor 관측 질의가 실패함, 선언이나 grant 읽기가 실패함, secrets 파일 읽기나 token vault 읽기·저장이 실패함, ledger 연결이 열리지 않음(그 오류 그대로)"
        observe: [response]
    crosses_process: true
    risk: [secret, permission]
    refs: [H10]
    docs: [architecture/app-call.md]
    unclear:
      - "OAuth 실패 이유(callback_timeout, refresh_rejected 등)는 메모리 map에만 있어 core가 다시 켜지면 사라진다(이슈 oauth-failure-reason-lost-on-restart). sign-in-required의 이유 글도 같다."
      - "invalid_input이 refresh 경로에서 바깥으로 나오는지는 코드상 없어 보인다(unavailable이나 ok로 바뀐다). 확인이 필요하다."

  - id: app-broker-secret-use
    title: "앱 SDK가 secret을 외부 요청에 붙이려고 broker에 알린다"
    actor: app
    entries: [system:app-broker-secret-use]
    uses: [app-secret-value:delivered, app-secret-value:sign-in-required, sdk:cap-secret/useSecret, route:apps/tools, route:app_grants/list]
    pre: [app-record-started:started]
    boundary: [app-capability, secrets]
    code: [packages/core/apps/permissions/broker/secrets.ts, packages/core/apps/permissions/broker/access.ts, packages/core/main/app-supervisor/secret-delivery.ts]
    steps:
      - "앱의 useSecret이 이름, 목적지(scheme, host, port), command, 입력 hash를 broker의 secrets/use에 보낸다. 값은 앱에 오지 않는다. 모양이 틀리면 invalid_input이다(broker 본문 검사 포함)."
      - "운영 자식(live)이고 release가 지금 release와 같아야 한다. 아니면 forbidden(secret.use)이다. http는 loopback host만이다(아니면 forbidden net.fetch)."
      - "현재 실행 범위(선언 ∩ grant)를 core에서 읽는다(apps/tools, app_grants/list). 읽기가 실패하면 access-unavailable이다. 범위에서 command가 release의 tool 목록에 있고 secret.use 허락이 있어야 한다. 없으면 forbidden(secret.use)이다."
      - "목적지가 net.fetch 허락(플랫폼 port 제외)에 들어야 한다. 없으면 forbidden(net.fetch)이다."
      - "supervisor가 app-secret-value로 값을 받아 같은 invocation의 같은 (host, port) 요청에만 Bearer로 붙인다(60초). 앱에는 used만 돌려준다."
    outcomes:
      - id: used
        observe: [response]
      - id: refused-secret
        code: forbidden
        when: "secret.use 허락이 없거나 command가 tool 목록에 없음, 운영 자식이 아님(preview나 release 없음), 자식 release가 현재 release와 다름, 앱이나 release를 모르거나 바뀜, core가 secret 값을 forbidden으로 거절함"
        observe: [response]
      - id: refused-destination
        code: forbidden
        when: "목적지가 net.fetch 허락에 없음, http인데 loopback이 아님"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "본문 모양이 맞지 않음(이름, 목적지, command, 입력 hash), host가 정확한 host가 아님, 진행 중 invocation이 없음, 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: sign-in-required
        code: conflict
        when: "OAuth secret의 sign-in이 필요함(app-secret-value의 sign-in-required나 refresh-rejected 전달)"
        observe: [response]
      - id: secret-missing
        code: not_found
        when: "그 이름의 값이 저장되지 않음(core의 not_found 전달)"
        observe: [response]
      - id: undeliverable
        code: unavailable
        when: "core가 값을 낼 수 없음(비었거나 모르는 값, 발급자에 닿지 못함), core 연결이 없거나 닿지 않음, core 답이 맞지 않음"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(core 연결 없음, 닿지 않음, 선언이나 grant 읽기 실패, grant가 너무 많음)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [secret, sandbox, permission]
    refs: [H10]
    docs: [architecture/app-call.md]

  - id: app-oauth-client-set
    title: "앱 OAuth 서비스의 client id를 넣는다"
    actor: person
    entries: [route:apps/oauth_client_set]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). client id는 공백과 제어 문자가 없는 1~200자 글이다."
      - "현재 선언에 이 이름의 oauth 블록이 있어야 한다. grant는 여기서 보지 않는다."
      - "app-oauth.<이름>.client_id 자리에 저장한다. client secret은 보호된 입력 창이 따로 넣는다."
    outcomes:
      - id: stored
        observe: ["disk:secrets.json"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: invalid-client-id
        code: invalid_input
        observe: [response]
      - id: not-found
        code: not_found
        when: "현재 선언에 이 이름의 oauth 블록이 없음, 또는 앱에 활성 release가 없음"
        observe: [response]
      - id: declared-read-failed
        when: "선언이나 grant 읽기가 internal로 실패함"
        observe: [response]
      - id: store-failed
        when: "secrets 저장소에 쓰지 못함(그 오류 그대로)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "선언 읽기의 ledger 연결을 열 수 없음(declared). 선언이나 grant 읽기가 internal로 실패한 것은 declared-read-failed"
        observe: [response]
    crosses_process: false

  - id: app-oauth-sign-in
    title: "사람이 앱 OAuth sign-in을 시작하거나 취소한다"
    actor: person
    entries: [route:apps/oauth_begin, route:apps/oauth_cancel]
    pre: [app-oauth-client-set:stored]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "begin: 사람만 부른다(route actors가 dispatch에서 거른다). 순서는 선언에 oauth 블록이 있는지, 이 secret의 grant가 허락됐는지, client id가 있는지, 이미 기다리는 시도가 없는지, loopback callback 자리를 열 수 있는지 순이다. 기다리는 시도가 있으면 제한 시간이 지난 것은 먼저 정리해 막지 않는다."
      - "PKCE authorize URL을 만든다. authorize endpoint가 URL이 아니거나 허용되지 않으면 invalid_input이다. 이 URL을 돌려주면 시도가 백그라운드로 돌고 결과는 app-oauth-callback이 받는다. 실패하면 열어 둔 listener를 닫는다."
      - "URL을 돌려준다. shell이 OS browser로 연다. 결과는 callback(app-oauth-callback)이 받고 화면은 oauth_state로 읽는다."
      - "cancel: 이름으로 진행 중인 시도를 버린다. app은 보지 않으며 선언과 grant 판정도 하지 않는다. 진행 중인 시도가 없었으면 cancelled가 false다."
    outcomes:
      - id: url-returned
        observe: [response]
      - id: cancelled
        observe: [response]
      - id: nothing-to-cancel
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine), 또는 이 secret의 grant가 허락되지 않음"
        observe: [response]
      - id: no-client-id
        code: invalid_input
        when: "client id가 없음"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 모양이 맞지 않음, 또는 authorize endpoint가 URL이 아니거나 허용되지 않음"
        observe: [response]
      - id: not-declared
        code: not_found
        when: "선언에 oauth 블록이 없음, 또는 앱에 활성 release가 없음"
        observe: [response]
      - id: already-in-progress
        code: conflict
        when: "이 secret으로 기다리는 시도가 이미 있음(begin만)"
        observe: [response]
      - id: listener-unavailable
        code: unavailable
        when: "loopback callback 자리를 열지 못함"
        observe: [response]
      - id: declared-read-failed
        when: "선언이나 grant 읽기가 실패함"
        observe: [response]
    crosses_process: false
    risk: [secret, permission]
    refs: [H10]
    unclear:
      - "sign-in 시도와 실패·token 이름이 secret 이름으로만 나뉜다. 두 앱이 같은 secret 이름을 쓰면 시도가 섞인다(service.ts). 의도인지 확인이 필요하다."
      - "listener는 port 0으로 열려 callback 포트 충돌(conflict)은 거의 없다고 보지만, 확인이 필요하다."

  - id: app-oauth-callback
    title: "브라우저의 sign-in 응답을 받아 token으로 바꿔 보관한다"
    actor: system
    entries: [system:app-oauth-callback, route:apps/oauth_callback]
    boundary: [secrets, app-runtime]
    code: [packages/core/lophn-agent/extensions/mcp-auth.ts, packages/core/lophn-agent/extensions/callback-handoff.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/apps/oauth/service.ts]
    steps:
      - "sign-in을 시작하면 core가 loopback callback을 background로 기다린다. 사람이 browser에서 허락한다. 기다리는 시간은 5분이고 타이머와 지연 검사로 본다."
      - "callback이 두 번째로 오면 409로 답하고 계속 기다린다. code나 state가 없으면 400으로 답하고 계속 기다린다."
      - "callback의 state가 시작할 때 것과 다르면 state_mismatch로 끝낸다. 발급자가 error 파라미터로 돌려보내면 exchange_failed로 끝낸다."
      - "authorization code를 token으로 바꾼다(PKCE). token endpoint가 오류를 주거나, JSON이 아니거나, access_token이 없으면 exchange_failed다. 기다리는 시간을 넘기면 callback_timeout이다. 시도가 사라지면 cancel이나 sign-out이 막은 것이므로 cancelled다."
      - "access token은 선언한 이름에, refresh와 meta는 app-oauth.<이름>.refresh|meta에 둔다. 보관이 실패하면 store_failed다."
      - "성공하면 signed_in이다. 상태는 메모리에 있고 화면은 oauth_state로 읽는다. 실패 상태도 메모리 report다(화면 read로 보인다)."
    outcomes:
      - id: signed-in
        observe: ["disk:secrets.json", "response:apps/oauth_state"]
      - id: failed-callback-timeout
        when: "5분 안에 callback이 없음. 그 뒤에 도착한 callback은 거절된다(state는 callback_timeout으로 남는다)"
        observe: ["response:apps/oauth_state"]
      - id: failed-state-mismatch
        when: "callback의 state가 시작할 때 것과 다름"
        observe: ["response:apps/oauth_state"]
      - id: failed-exchange
        when: "발급자가 redirect에 error 파라미터를 붙여 돌려보냄, token endpoint가 오류·JSON 아님·access_token 없음 중 하나로 답함, 또는 code 교환이 실패함"
        observe: ["response:apps/oauth_state"]
      - id: failed-store
        when: "token 보관이 실패함(store_failed). 실패 상태가 메모리에 남는다"
        observe: ["disk:secrets.json", "response:apps/oauth_state"]
      - id: cancelled
        when: "기다리는 중 cancel이나 sign-out이 와서 로그인이 취소됨. 상태는 none으로 돌아간다"
        observe: ["response:apps/oauth_state"]
      - id: callback-ignored
        when: "두 번째 callback(409), code나 state가 빈 요청(400). 계속 기다린다"
        observe: [response]
      - id: handoff-invalid-input
        code: invalid_input
        when: "원격 callback 입력 모양이 맞지 않거나 state·path가 이 시도의 것이 아니다"
        observe: [response]
      - id: handoff-forbidden
        code: forbidden
        when: "사람이 아니거나 터미널 입력 허락이 없는 기기다(dispatch)"
        observe: [response]
      - id: handoff-not-found
        code: not_found
        when: "선언에 oauth 블록이 없거나 앱에 활성 release가 없다"
        observe: [response]
      - id: handoff-conflict
        code: conflict
        when: "기기가 시작한 진행 중인 시도가 없거나 이미 callback을 받았다"
        observe: [response]
    crosses_process: false
    risk: [secret]
    refs: [H10]
    docs: [architecture/app-call.md]
    unclear:
      - "실패 이유는 메모리 failures map에만 있어 core가 다시 켜지면 사라진다(이슈 oauth-failure-reason-lost-on-restart)."
      - "실패와 취소의 결과는 push 화면이 없고 oauth_state read로 보인다. observe를 response:apps/oauth_state로 적었다. 화면 frame을 쓸지는 정하지 않았다."

  - id: app-oauth-sign-out
    title: "사람이 앱 OAuth sign-in을 지운다"
    actor: person
    entries: [route:apps/oauth_sign_out]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 선언과 grant는 보지 않는다. 진행 중인 sign-in 시도를 버린다. 실패 이유도 지운다."
      - "access token, refresh, meta를 지운다. client id와 client secret은 남긴다. 셋 가운데 하나라도 지우지 못하면 일부만 지워질 수 있다."
      - "다음 secret 전송은 sign-in-required가 된다(app-secret-value)."
    outcomes:
      - id: signed-out
        observe: ["disk:secrets.json"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "secret 저장소를 쓰지 못함(셋 중 일부만 지워질 수 있다)"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [H10]

  - id: app-oauth-state
    title: "앱 OAuth 상태를 읽는다"
    actor: person
    entries: [route:apps/oauth_state]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "지금 release 선언에서 oauth 블록이 있는 secret마다 한 줄을 만든다."
      - "상태는 none, in_progress, signed_in, failed 가운데 하나다. failed면 이유가 있다. 값은 없다. expired는 읽을 때 계산한다."
      - "report는 실패하지 않는다. 저장소 읽기가 실패하면 그 secret은 none으로 보인다. 상태는 메모리 report라 core가 다시 켜지면 failed 이유가 사라진다(이슈 oauth-failure-reason-lost-on-restart)."
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: read-failed
        when: "선언이나 grant 읽기가 internal로 실패함"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "선언 읽기의 ledger 연결을 열 수 없음(declared). 선언이나 grant 읽기가 internal로 실패한 것은 read-failed"
        observe: [response]
    crosses_process: false
    declared_only: [not_found]
    unclear:
      - "route가 not_found를 선언하지만 handler는 내지 않는다. release가 없으면 빈 목록을 ok로 준다. 선언을 고칠 곳이다."

  # ---------- broker: net, notify, problem ----------

  - id: app-broker-net-fetch
    title: "앱 SDK의 외부 HTTP 요청을 supervisor broker가 보낸다"
    actor: app
    entries: [system:app-broker-net-fetch]
    uses: [route:apps/tools, route:app_grants/list, sdk:cap-net/netFetch]
    pre: [app-record-started:started]
    boundary: [app-capability, app-runtime]
    code: [packages/core/apps/permissions/broker/net-fetch.ts, packages/core/apps/permissions/broker/access.ts, packages/core/apps/permissions/effective.ts]
    steps:
      - "앱의 netFetch가 host, port, method, path, header, 본문을 broker의 net/fetch에 보낸다."
      - "입력 모양을 검사한다. Authorization, Cookie, Host 같은 header와 GET, HEAD의 본문은 schema가 거절한다. host는 정확한 host여야 한다. 이 검사는 grant 판정보다 먼저다. method, path, host의 세부 검사는 grant 판정 뒤다. 그래서 허락 밖이면 forbidden이 먼저다."
      - "운영 자식이고 지금 release의 command 목록에 있으며 (host, port)가 선언 ∩ grant(플랫폼 port 제외)에 있어야 한다. 아니면 forbidden(net.fetch)이다. 현재 범위를 core에서 읽지 못하면 access-unavailable이다."
      - "요청을 보낸다. redirect는 한 단계마다 같은 검사를 다시 받는다. https에서 http로 내려가거나 grant 밖이면 거절한다. 응답이 non-2xx여도 fetched다(상태 코드는 앱에 그대로 준다)."
      - "같은 invocation에서 app-broker-secret-use가 받아 둔 값이 있고 그 목적지(host·port)가 이 요청과 같을 때만 Bearer로 붙인다. redirect의 다음 hop은 목적지가 바뀌면 값을 다시 찾으므로 다른 목적지에는 붙지 않는다. 응답은 1 MiB 이하의 글이나 JSON만 앱에 준다."
    outcomes:
      - id: fetched
        when: "요청이 나감(non-2xx 포함). 같은 invocation의 secret이 이 (host, port)에 있으면 Authorization을 붙이고, 없거나 목적지가 다른 redirect hop에는 붙이지 않는다"
        observe: ["request:external-host", response]
      - id: refused
        code: forbidden
        when: "선언 ∩ grant 밖, command 아님, 운영 자식 아님(preview나 release 없음), 자식 release가 현재 release와 다름, 현재 범위를 모름, redirect가 grant 밖, https에서 http로 내려감(details.permission은 net.fetch)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "schema가 거절함(금지 header, GET·HEAD 본문, 본문 base64 아님, 본문 10 MiB 초과, header 수 초과), method 지원 안 함, path가 절대 경로가 아니거나 목적지를 벗어남, host가 정확한 host가 아님, 본문이 net/fetch 상한(base64 10 MiB와 여유 64 KiB)을 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: request-failed
        code: unavailable
        when: "연결 실패, 30초 timeout, redirect 대상이 없거나 URL이 아니거나 Location이 없음, redirect가 너무 많음, 응답이 1 MiB를 넘음"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(apps/tools, app_grants/list)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [sandbox, permission, secret]

  - id: app-broker-notify
    title: "앱이 사람에게 알림, tray 값, 위젯 값을 보낸다"
    actor: app
    entries: [system:app-broker-notify]
    uses: [route:notices/post, route:app_tray/set, route:app_widget/set, route:apps/tools, route:app_grants/list]
    pre: [app-record-started:started]
    boundary: [app-capability, app-runtime]
    code: [packages/core/apps/permissions/broker/notify.ts, packages/core/apps/permissions/broker/access.ts]
    steps:
      - "앱의 notify, setTray, setWidget이 broker의 notify/send, notify/tray, notify/widget에 보낸다. 입력 모양을 먼저 검사한다(schema)."
      - "운영 자식이고 release가 지금 release와 같아야 한다. 현재 선언 ∩ grant에 notify.send가 있어야 한다. 아니면 forbidden이다. 현재 범위를 읽지 못하면 access-unavailable이다."
      - "알림은 core notices.post를, tray는 app_tray.set을, 위젯은 app_widget.set을 그 자식의 app credential로 부른다. 앱은 내용만 정하고 앱 이름은 자식 연결이 정한다. tray와 위젯은 notify.send 허락을 같이 쓴다."
      - "같은 key의 알림은 기존 것을 바꾸고 안 읽음으로 되돌린다. 앱마다 상한을 넘으면 가장 오래된 알림을 지우고 NoticeClosed를 보낸다. tray 값이 null이면 tray를 비운다. StateChanged(tray)는 둘 다 보낸다(tray 값은 메모리에만 있다). 위젯 값이 null이면 그 위젯 값을 지우고 StateChanged(widgets)가 난다(위젯 값도 메모리에만 있다)."
      - "받는 쪽은 사람뿐이다. agent나 core 로직에 사실을 보내는 길이 아니다."
    outcomes:
      - id: notified
        observe: ["event:NoticePosted", "ledger:notices"]
      - id: tray-set
        when: "tray 값을 정하거나 지움(null)"
        observe: ["event:StateChanged"]
      - id: widget-set
        when: "위젯 값을 정하거나 지움(null)"
        observe: ["event:StateChanged"]
      - id: refused
        code: forbidden
        when: "notify.send 허락이 없음, 운영 자식이 아님(preview나 release 없음), 자식 release가 현재 release와 다름, active release가 없음, 현재 범위를 모름"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "notify, tray, 위젯 입력 모양이 맞지 않음, 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(apps/tools, app_grants/list)"
        observe: [response]
      - id: core-refused
        when: "notices.post, app_tray.set, app_widget.set이 낸 오류 그대로(not_found: 앱 없음, conflict: 보관한 앱, invalid_input: 선언하지 않은 위젯 key 포함, forbidden, unauthorized, unavailable: credential 없음·core에 닿지 않음)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [permission]

  - id: app-broker-phone
    title: "앱 backend가 broker를 거쳐 사람의 폰에 기능 하나를 묻는다"
    actor: app
