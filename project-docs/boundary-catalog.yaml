# lophn — Boundary Catalog
#
# 목적: 여러 문서가 같이 가리키는 ID 목록이다. lophn의 추상화가 어떻게 나뉘었는지와 그 사이의 공개 계약을 정한다.
# 용어: place는 agent가 놓이는 project 또는 앱이다.
# 이 파일은 사람이 읽는 원본이다. 세부 동작과 규칙은 각 문서가 자기 관심사에 맞게 쓰고, 코드 위치(폴더·package·process)는 이 파일이 정하지 않는다.
#
# 1. 최상위 구조
# - schema_version은 이 YAML 형식의 버전이다.
# - system은 제품 식별 metadata다. elements·interfaces도 목록 이름이며 참조 대상 ID가 아니다.
# - elements에는 interface를 뺀 책임·구현·도구·외부 역할을 둔다. 실제 구성은 children으로 묶는다.
# - interfaces에는 kind: interface인 공개 계약만 flat 목록으로 둔다. 정의자·제공자·사용자를 ID로 잇는다.
# - 독립된 최상위 요소는 여러 개일 수 있다. 모든 요소를 품는 가상의 root는 만들지 않는다.
#
# 2. 계층의 뜻과 작성 규칙
# - 요소는 추상화 단위다. 기능·화면 부품·연산·파일마다 요소를 만들지 않는다.
# - children은 부모 책임을 이루는 실제 포함 관계다. 각 요소는 파일 전체에서 한 번만 선언한다.
# - 같은 종류, 호출·사용 관계, 같은 배포물이라는 이유만으로 자식에 넣지 않는다.
# - 여러 요소가 함께 쓰는 요소는 공통 부모를 꾸며 넣거나 복제하지 않고 따로 선언한 뒤 ID로 가리킨다.
# - 깊이는 구성의 세부 정도다. kind·추상화 수준·폴더·package·process·배포 단위를 강제하지 않는다.
# - 포함 관계의 원본은 children 하나다. 같은 관계를 part_of나 parent 칸에 다시 적지 않는다.
#
# 3. 공통 칸과 kind
# - 필수 칸: id, kind, description. description은 그 요소가 무엇인지 한 문장으로 쓴다. 규칙·세부 동작은 쓰지 않는다.
# - subsystem: 관련 책임을 맡는 큰 경계. application: 사람·자동화가 실행하는 진입점.
# - component: 내부 책임 단위 또는 adapter. library: 공개 사용면을 가진 재사용 정의·기능.
# - extension: 공개 확장 계약을 따르는 독립 구현. interface: 구현과 따로 식별하는 공개 계약.
# - guidance: agent·개발자가 읽는 작업 지침. bundle: 도구·지침·설정의 배포 구성. actor: 외부 사용 역할.
# - kind는 요소의 종류다. 같은 kind를 한 부모에 모으거나 같은 깊이에 둘 필요는 없다.
#
# 4. interface 전용 칸 — 모두 필수
# - interface_type: api는 공개 기능 호출, spi는 확장·adapter 구현을 잇는 계약,
#   protocol은 메시지·process 입출력의 교환 계약이다. api의 실제 전송 방식은 구현 선택이다.
# - defined_by: 계약 정의와 버전을 맡는 요소 ID 하나. 실제 동작을 구현하는 제공자와 구분한다.
# - provided_by: 그 동작을 구현하거나 endpoint를 여는 요소 ID 목록.
# - used_by: 직접 부르거나 소비하는 요소 또는 외부 actor의 ID 목록. 간접 사용자까지 적지 않는다.
# - 제공자가 여럿이면 대체 adapter·fixture일 수 있다. 동시에 모두 돈다는 뜻이 아니다.
#
# 5. 포함과 별개인 참조
# - depends_on: interface가 아닌 요소가 밝힐 필요가 있는 공개 library·interface의 소스 의존 ID 목록.
#   모든 내부 import를 적지 않으며 private 내부 사용을 허락하는 칸이 아니다.
# - provided_by·used_by는 실행 때의 협력 관계다. 구현 사이의 소스 의존과 같게 보지 않는다.
# - interface의 제공·사용 관계를 기준으로 삼고 각 구현에 provides·uses를 다시 적지 않는다.
# - bundles: kind: bundle에만 쓴다. 배포물 또는 설치·연결 설정을 함께 주는 요소 ID 목록이다.
#   배포에 함께 들어간다고 그 요소의 책임이나 실행 의존이 바뀌지 않는다.
#
# 6. ID와 다른 문서의 연결
# - ID는 elements의 모든 깊이와 interfaces 전체에서 하나뿐인 영어 kebab-case다. 위치와 무관하게 가리킨다.
# - ID에 계층 경로를 넣지 않는다. 같은 책임이면 구현을 바꾸거나 계층을 옮겨도 ID를 그대로 둔다.
# - 다른 뜻에 쓰던 ID를 다시 쓰지 않는다.
# - module-catalog.yaml과 project-docs/architecture/가 이 ID를 가리킨다. 어떻게 가리키는지는 각 문서 형식이 정한다.
# - 부모 ID를 가리킨 것이 모든 자식을 가리킨다는 뜻은 아니다. 메서드·단추·event마다 ID를 늘리지 않는다.
#
# 7. 읽기와 검사
# - 도구는 elements를 재귀로 돈 결과와 interfaces를 합쳐 ID index 하나를 만든다.
# - 부모 정보나 flat 목록은 필요할 때 순회 중에 파생한다. 파생 정보를 원본과 이중으로 두지 않는다.
# - 모든 참조 ID가 있는지, ID가 겹치지 않는지, 계층이 순환하지 않는지, kind별 칸이 맞는지 검사한다(tools/check-modules.ts).

schema_version: 1
system: lophn
description: 여러 문서가 같이 가리키는 lophn의 추상화 경계와 공개 계약.
elements:

  - id: protocol
    kind: library
    description: process와 화면 사이에서 주고받는 것의 정의와 그 client.
    depends_on:
      - base

  - id: base
    kind: library
    description: 여러 package가 같이 쓰는 공용 구현.

  - id: core
    kind: subsystem
    description: lophn의 domain 로직과 그 바닥.
    depends_on:
      - protocol
      - base
    children:

      - id: projects
        kind: subsystem
        description: project place와 그 폴더의 파일(문서).
        children:

          - id: contexts
            kind: component
            description: project 파일 위의 결정적 도메인 계약과 검색 script.

      - id: apps
        kind: subsystem
        description: 사람이 만들고 쓰는 앱.
        children:

          - id: app-releases
            kind: component
            description: 앱의 정의와 판.

          - id: app-runtime
            kind: component
            description: 앱의 실행과 capability.

          - id: app-data
            kind: component
            description: 앱의 업무 data.

          - id: package-registry
            kind: component
            description: lophn이 가진 package와 버전의 목록, 읽기 전용 설치 사본, 사용자 package 받기.

          - id: app-tickets
            kind: component
            description: 앱을 만들거나 고치는 작업 카드와 그 claim.

      - id: problems
        kind: subsystem
        description: 앱 문제의 감지, 증거, 확인, 닫기.

      - id: lophn-agent
        kind: subsystem
        description: lophn 안의 agent를 정의하고 돌리는 harness.
        children:

          - id: agents
            kind: component
            description: place에 놓인 agent와 그 설정.

          - id: agent-roles
            kind: component
            description: role마다의 prompt, tool 범위, 명령.

          - id: agent-sessions
            kind: component
            description: agent session과 그 연산.

          - id: run-loop
            kind: component
            description: agent run의 실행.

          - id: agent-tools
            kind: component
            description: agent tool과 그 허락 판정.

          - id: models
            kind: component
            description: model catalog와 provider 연결.

      - id: events
        kind: component
        description: domain event의 기록과 배달.

      - id: storage
        kind: component
        description: lophn 기록의 로컬 저장.

      - id: server
        kind: component
        description: core daemon의 입구.

      - id: supervision
        kind: component
        description: core가 띄우는 child process의 감독.

      - id: approvals
        kind: component
        description: 사람에게 묻고 결정을 받는 장치.

      - id: config
        kind: component
        description: 층이 있는 설정 장치.

      - id: secrets
        kind: component
        description: secret 보관.

      - id: diagnostics
        kind: component
        description: lophn 자체의 운영 log, crash 기록, 상태 점검.

  - id: shell
    kind: application
    description: 사람이 쓰는 desktop app.
    depends_on:
      - protocol
      - base
      - design
      - coding-agent-harness-api

  - id: coding-agent
    kind: subsystem
    description: 사람이 쓰던 coding agent를 lophn에 잇는 쪽.
    depends_on:
      - protocol
      - base
    children:

      - id: coding-agent-cli
        kind: application
        description: coding agent가 쓰는 lophn 명령행.

  - id: design
    kind: library
    description: lophn 화면과 사용자 앱이 같이 쓰는 UI kit.

  - id: sdk
    kind: library
    description: 사용자 앱이 import하는 입구.
    depends_on:
      - protocol
      - design

  - id: app
    kind: extension
    description: 사용자가 만든 앱 하나.
    depends_on:
      - sdk

  - id: user-package
    kind: extension
    description: App Engineer가 올린 사용자 package.
    depends_on:
      - sdk

  - id: person
    kind: actor
    description: lophn을 쓰는 사람.

  - id: external-coding-agent
    kind: actor
    description: 사람이 쓰던 coding agent.

interfaces:

  - id: core-api
    kind: interface
    description: core daemon의 로컬 API.
    interface_type: api
    defined_by: protocol
    provided_by:
      - server
    used_by:
      - shell
      - coding-agent
      - run-loop
      - agent-tools
      - app-runtime

  - id: event-stream
    kind: interface
    description: core가 확정한 event의 stream.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - events
      - server
    used_by:
      - shell

  - id: child-supervision-protocol
    kind: interface
    description: core daemon과 child process 사이의 감독 계약.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - supervision
    used_by:
      - run-loop
      - app-runtime
      - app-releases
      - problems

  - id: agent-tool-spi
    kind: interface
    description: domain이 agent tool을 등록하는 계약.
    interface_type: spi
    defined_by: agent-tools
    provided_by:
      - projects
      - apps
      - problems
    used_by:
      - run-loop

  - id: app-spi
    kind: interface
    description: 앱이 구현하는 확장 계약.
    interface_type: spi
    defined_by: protocol
    provided_by:
      - app
    used_by:
      - app-releases
      - app-runtime

  - id: app-capability
    kind: interface
    description: 앱이 lophn에게 받아 쓰는 능력(파일, network, secret 등)을 청하는 계약.
    interface_type: api
    defined_by: protocol
    provided_by:
      - app-runtime
    used_by:
      - sdk

  - id: app-direct-protocol
    kind: interface
    description: core를 지나지 않고 app-api를 부르는 계약.
    interface_type: protocol
    defined_by: protocol
    provided_by:
      - app-runtime
    used_by:
      - sdk

  - id: package-spi
    kind: interface
    description: package 한 버전의 계약.
    interface_type: spi
    defined_by: package-registry
    provided_by:
      - sdk
      - user-package
    used_by:
      - package-registry
      - app-releases

  - id: sdk-api
    kind: interface
    description: 사용자 앱과 package가 import하는 API.
    interface_type: api
    defined_by: sdk
    provided_by:
      - sdk
    used_by:
      - app
      - user-package

  - id: design-api
    kind: interface
    description: UI kit의 공개 API.
    interface_type: api
    defined_by: design
    provided_by:
      - design
    used_by:
      - shell
      - sdk

  - id: coding-agent-harness-api
    kind: interface
    description: coding agent를 찾고 띄우는 API.
    interface_type: api
    defined_by: coding-agent
    provided_by:
      - coding-agent
    used_by:
      - shell

  - id: coding-agent-cli-interface
    kind: interface
    description: lophn 명령행의 계약.
    interface_type: protocol
    defined_by: coding-agent
    provided_by:
      - coding-agent-cli
    used_by:
      - external-coding-agent
