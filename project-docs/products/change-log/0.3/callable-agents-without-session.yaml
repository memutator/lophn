id: callable-agents-without-session
version: 0.3.0
title: '부를 수 있는 agent 목록에 session 없는 상대도 싣는다'
modules: [packages/core/agent-workspaces, packages/core/approvals, packages/protocol]
checked: [architecture-approval, architecture-agent-call, architecture-layers]
change: |
  전: place prompt의 "Agents you can call"은 이미 session이 있는 agent만 실었다. 새 world에서는 넘길 상대(그 앱의 App Engineer, 다른 project의 Project Manager, lophn)가 없거나 절 자체가 없어 agent가 call을 하지 않았다(eval O4, A12, A14-other, C9-other).
  후: lophn, 활성 project마다 Project Manager, 활성 앱마다 App Engineer, 정의에 문제가 없는 Operator를 session이 없어도 싣는다. 자기 grant에 `excluded`인 상대는 뺀다. agent가 자기 grant를 읽도록 `GetAgentGrant`에 agent actor를 열었고, 남의 grant는 `forbidden`이다.
why: |
  첫 eval experiment `call-list-without-session`(`tests/eval/experiments/call-list-without-session/`)이 O4를 0/1에서 3/3으로 고치고 guard를 나빠뜨리지 않았다.
decisions:
  - text: 'experiment 판정은 `reject`(target A14-other와 미리 쓴 case가 떨어졌다)였지만 사람이 고침을 넣기로 했다.'
    by: person
  - text: 'grant로 막힌 상대는 session이 있든 없든 목록에서 뺀다. 그래서 agent에게 자기 grant 읽기를 열었다.'
    by: person
follow_up: |
  App Engineer 자격의 `appList`가 자기 앱만 돌려줘 다른 앱의 App Engineer가 목록에 없다(A14-other). Project Manager(C9-other)와 App Engineer(A12)는 상대가 보여도 넘기지 않는다. 열린 이슈: `project-docs/issues/approval.md`(grant read의 `sessions` 직접 읽기), `project-docs/issues/eval.md`.
