id: startup-program-notice-no-toast
title: 기동 때 쓴 program 기록의 toast가 뜨지 않는다
kind: bug
status: open
topic: shell
modules: [packages/shell/main, packages/core/main]
now: |
  `noticesWiring.afterReady`가 쓰는 program 기록(`sdk_update_needed`)의 `NoticePosted`는 shell main이 받지 못한다. core는 `afterReady`를 돌린 뒤에 `control.ready`를 부르고(`packages/core/main/daemon/core.ts`), shell은 control이 ready를 낸 뒤에야 붙어 구독을 연다. event에는 다시 보내기가 없어 그 사이에 나간 것은 놓친다. core가 다시 뜬 뒤 shell이 다시 붙을 때도 같다. 놓친 알림은 다시 띄우지 않는다. 배지는 안 읽은 기록을 세므로 사람이 아예 못 보지는 않는다.
impact: |
  기동 중에 쓴 필수 알림(SDK 업데이트 필요)은 toast·OS 알림이 없다. 배지와 History로만 보인다.
fix: |
  - 기동 뒤 Gateway가 붙으면 안 읽은 급한 program 줄(`sdk_update_needed`, `app_unavailable`)을 `notices.open`으로 읽어 toast로 한 번 보인다(작음).
  - 추천: 이것. 배지가 있으니 급하지는 않다.
