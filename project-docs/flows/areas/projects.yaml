        when: "project id가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니다(agent·app·machine), 또는 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "TargetAuthorization 판정을 얻지 못했다"
        observe: ["response"]
      - id: internal
        code: internal
