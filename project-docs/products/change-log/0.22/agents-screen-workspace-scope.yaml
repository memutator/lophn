id: agents-screen-workspace-scope
version: 0.22.0
title: "Agents 화면이 agent의 workspace 범위를 보이고 고른다"
modules: [packages/shell/renderer, packages/design]
checked: [context-component-registry, architecture-terminal-agent, architecture-browser-tab, architecture-keybindings, architecture-agent-chat, architecture-acp, architecture-artifact, architecture-workspace-layout, architecture-ui-kit, architecture-appearance, tool-worktree-prep, tool-dev, tool-package, skill-ui-design, tool-wireframes]
change: |
  전: Agents 탭은 모든 agent를 한 목록에 섞어 보였고 범위 표시가 없었다. 다른 workspace의 범위 agent도 목록에 있었지만 열면 `not_found`였다. 사람 화면에서 만든 agent는 늘 전역이었다(0.20.0의 "범위 고르기 없음"). 명함 runtime 줄은 `bare`가 아니면 harness agent(`claude-code`·`codex`·`opencode`)도 모두 `lophn`으로 보였다.
  후:
    - workspace Agents 탭과 sidebar 목록은 전역 agent와 그 workspace 범위 agent만 보인다. home은 전역만 보인다.
    - 목록 카드, 명함, 편집기에 범위를 `All of lophn` / `<name> · project` / `<name> · app`으로 보인다.
    - 새 agent는 편집기의 Workspace 칸에서 범위를 고른다. 기본은 화면을 연 workspace이고 전역으로 바꿀 수 있다. home·Settings에서는 전역뿐이다. 저장한 agent의 범위는 읽기 전용이다(core는 그대로 `not_allowed`로 막는다).
    - 명함 runtime 줄은 runtime 값을 그대로 보인다.
    - `agent-definition.md`·`agent-call.md`를 코드에 맞췄다: 앱 삭제는 그 앱 범위 정의를 지운다, 앱 command는 `tools[]`가 아니라 `lophn <slug> <command>`로 부른다, `coding_agent` 받는 곳은 없다.
    - 쓰지 않던 i18n key `agents.label.workspace-choice`를 지웠다.
  검증: task의 full check, core 두 번 기동, renderer build. 화면은 type check와 wireframes smoke로만 봤고 실제 앱에서 눌러 보지 않았다.
why: |
  목록이 workspace 범위를 가리지 않고 섞어 보여, 다른 workspace의 agent를 열면 실패했다. 범위를 보이고 새 agent의 범위를 고르게 한다.
decisions:
  - text: |
      목록 거르기는 renderer가 `agents.list` 결과에서 한다. core는 workspace를 안 주면 좁히지 않고 home에도 거르기가 필요해서다. core는 바꾸지 않았다.
    by: agent
  - text: |
      CLI `lophn agent create`의 범위, 만든 뒤 범위 바꾸기는 범위 밖이다.
    by: person
