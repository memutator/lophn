    steps:
      - "machine 자격이 아니면 forbidden이다(requireMachine). 같은 model 호출, response key, 시도 번호가 이미 있으면 conflict다"
      - "입력 blob 참조를 같은 transaction에 등록한다(준비 참조가 거절되면 행도 남지 않는다)"
      - "runtime이 tool 호출 행을 requested로 쓰고 ToolCallRequested를 낸다"
    outcomes:
      - id: requested
        observe: [ledger:tool_calls, ledger:blob_refs, event:ToolCallRequested]
