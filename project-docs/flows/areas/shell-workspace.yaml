    actor: person
    entries: [ui:float-to-desk]
    when: "전역 float bar의 Move to this desk 단추(이 desk가 등록된 창에서, kind가 anyWorkspace이거나 float의 workspace가 이 창의 workspace일 때만)"
    boundary: [shell]
    code:
      - packages/shell/renderer/shell/global-floats/global-floats.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "moveToDesk가 본문이 알린 host로 kind의 transfer를 받는다. null이면 옮기지 않는다"
      - "받는 창의 globalToFloat이 float 층을 못 쟀으면 false다"
      - "같은 탭의 float을 이 desk에 열고(앱 panel만 새 key) rect를 float 층 안으로 가두며 고정은 유지한다. 이 창 host로 kind의 receive를 부른다"
      - "이 desk에 더 둘 수 없으면(float 20개 상한, 같은 key의 탭이 이미 있음) false를 돌려주고 옮기지 않는다"
      - "성공하면 moveToDesk가 전역 목록에서 그 float을 뺀다. 그릇이 달라 page는 다시 load된다"
      - "moveToDesk는 등록된 desk가 없으면 아무 일도 하지 않는다"
    uses: [ipc:shell:global-floats-save, ipc:shell:workspace-layout-save]
    outcomes:
      - id: moved
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "disk:<data>/shell/global-floats.json"]
      - id: refused
        when: "float 층을 못 쟀거나, 이 desk에 float 20개 상한이라 더 둘 수 없거나, 같은 key의 탭이 이미 있거나, 등록된 desk가 없거나, transfer가 null이다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)", "disk:<data>/shell/global-floats.json (변화 없음)"]
      - id: save-refused
        code: invalid_input
        when: "main이 desk layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: false
    docs: [architecture/workspace-layout.md]

  # ---- detached ----
  - id: detached-dock
    title: "분리된 창을 project 창의 탭으로 되돌린다"
    actor: person
    entries: [ui:detached-dock]
    when: "분리된 창의 Dock 단추, 창의 x(dock-request를 거쳐 같은 흐름)"
    boundary: [shell]
    code:
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/main/desktop/wiring/detached.ts
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "분리된 창이 탭 값과 transfer(view 묶음)를 main에 보낸다"
      - "main이 보낸 창이 detached 창이 아니거나 그 창의 항목이 없으면 거절한다. 탭 key가 창과 다르거나 view가 그 창의 것이 아니어도 거절한다"
      - "main이 view를 project 창으로 옮기고 docked 이벤트를 보낸 뒤 창을 닫는다. project 창이 없거나 view를 못 옮기면 창은 그대로 남는다"
      - "project 창이 reattachTab으로 탭을 tabs 끝에 넣고 고르며, kind의 receive가 transfer를 받는다. 그 탭이 layout에 없으면 docked를 버린다"
    uses: [ipc:shell:detached-dock, ipc:shell:workspace-layout-save]
    outcomes:
      - id: docked
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: not-detached
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니거나 detached 창이 아니다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "보낸 창의 detached 항목이 없다"
        observe: ["response"]
      - id: invalid
        code: invalid_input
        when: "탭 key가 창과 다르거나, transfer의 view가 그 창의 것이 아니거나, 스키마가 틀리다"
        observe: ["response"]
      - id: refused
        code: unavailable
        when: "project 창이 없거나 view를 옮기지 못했다. 창은 그대로 남는다"
        observe: ["process:detached-window"]
      - id: dropped-by-project
        when: "project 창이 그 탭을 layout에서 이미 모른다. main은 창을 닫아 탭 값이 버려진다"
        observe: ["process:detached-window"]
    risk: [data-loss]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "dropped-by-project: main은 docked를 보낸 뒤 창을 닫는데 renderer가 탭을 찾지 못하면 값이 사라진다. 실제로 그런 순서가 생기는지 코드로 확인이 필요하다"

  - id: detached-open-tab
    title: "분리된 창 안에서 연 탭을 project 창에 붙인다"
    actor: person
    entries: [ui:detached-open-tab]
    when: "분리된 창 안에서 agent 새 탭 등 탭을 여는 요청"
    boundary: [shell]
    code:
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "분리된 창의 openTab이 detached openTab IPC로 project 창에 open-tab 이벤트를 보낸다"
      - "project 창은 distinctAgentTab으로 key를 정해 openTab으로 붙인다. 이미 어느 desk에 있으면 그 자리로 가서 고르고, 분리된 탭이면 그 창을 앞으로 가져온다"
      - "project 창은 그 창을 앞으로 가져온다"
    uses: [ipc:shell:detached-open-tab, ipc:shell:workspace-layout-save]
    outcomes:
      - id: opened-in-project
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: focused-existing
        when: "같은 탭이 이미 어느 desk에 있다. 그 자리로 가서 고르거나(분리된 탭이면 창을 앞으로 가져온다)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: not-detached
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니다(guard)"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "보낸 detached 창의 항목이 없다"
        observe: ["response"]
      - id: save-refused
        code: invalid_input
        when: "main이 layout을 거절했다(탭 1200 상한 등) 또는 쓰지 못했다(unavailable). renderer는 결과를 무시한다"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: detached-tab-changed
    title: "분리된 창의 탭 값이 바뀌면 main에 알리고 project 창의 layout에 반영한다"
    actor: person
    entries: []
    uses: [ipc:shell:detached-changed, ipc:shell:workspace-layout-save]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/renderer/workspace/detached/detached-space.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
    steps:
      - "분리된 창의 patchTab이 탭 값을, 터미널 참조가 바뀌면 resume을 main에 보낸다"
      - "main은 보낸 창이 detached 창이고 항목이 있으면 그 항목의 탭 값을 바꾸고, resume이 있으면 창 항목에 든다(디스크에는 쓰지 않는다)"
      - "main이 project 창에 changed를 보낸다. project 창은 layout의 detached에서 그 key의 탭 값을 바꾸고 저장한다"
    outcomes:
      - id: sent
        observe: ["response"]
      - id: patched
        observe: ["disk:<data>/shell/workspaces/<workspace>.json"]
      - id: ignored-by-project
        when: "project 창의 layout에 그 탭이 없거나 detached가 아니다(docked나 closed가 먼저 왔다)"
        observe: ["disk:<data>/shell/workspaces/<workspace>.json (변화 없음)"]
      - id: not-detached
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니거나 project 창이다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "보낸 detached 창의 항목이 없다"
        observe: ["response"]
      - id: invalid
        code: invalid_input
        when: "탭 key나 kind가 schema에 맞지 않다, 또는 resume이 JSON이 아니다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]

  - id: detached-tab-remove
    title: "분리된 창 안의 탭이 제 탭을 닫아 창과 layout 항목을 뺀다"
    actor: person
    entries: []
    uses: [ipc:shell:detached-remove, ipc:shell:workspace-layout-save]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/detached/ipc.ts
      - packages/shell/renderer/workspace/detached/detached-space.tsx
      - packages/shell/renderer/workspace/workspace-window.tsx
    when: "분리된 창 안의 kind가 removeTab으로 제 key를 뺀다(agent 탭의 닫기, browser의 닫기 요청, 편집기에서 파일을 지운 뒤, app 패널의 닫기)"
    steps:
      - "분리된 창 본문의 removeTab은 제 key일 때만 remove를 보낸다"
      - "main은 project 창에 closed를 보내고, 들어 둔 PTY 참조를 버린 뒤 창을 조용히 닫는다"
      - "project 창은 layout의 detached 항목을 뺀다. 되살리기 목록에는 넣지 않는다"
    outcomes:
      - id: closed
        observe: ["disk:<data>/shell/workspaces/<workspace>.json", "process:detached-window"]
      - id: not-detached
        code: forbidden
        when: "보낸 쪽이 desktop 창이 아니거나 project 창이다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "보낸 detached 창의 항목이 없다"
        observe: ["response"]
    crosses_process: true
    docs: [architecture/workspace-layout.md]
    unclear:
      - "분리된 창에서 닫은 탭은 되살리기 목록(tab-reopen)에 들어가지 않는다. project 창이 closeDetached만 부른다. 의도인지 확인이 필요하다"

  - id: detached-window-moved
    title: "분리된 창을 옮기거나 크기를 바꾸면 layout의 자리를 저장한다"
    actor: person
    entries: [ui:detached-move]
