      - id: name-exists
        code: conflict
        when: "to가 이미 있다(같은 이름의 파일이나 폴더)"
        observe: ["disk:<from> (변화 없음)", "response", "screen:new-explorer-name-exists"]
      - id: into-self
        code: invalid_input
        when: "폴더를 자기 안(하위 폴더)으로 옮긴다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "from이 디스크에 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 본문 main frame이 아니다(file IPC guard), 또는 from이나 to가 secrets.json이다, 또는 디스크 권한이 없다(EACCES·EPERM)"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "from이나 to가 절대 경로가 아니다, 또는 입력이 schema와 다르다"
        observe: ["response"]
      - id: tab-save-refused
        when: "옮길 path(폴더면 아래)의 열린 탭에 저장 안 된 글이 있고 사람이 취소했다. IPC를 보내지 않는다"
        observe: ["disk:<from> (변화 없음)"]
      - id: unavailable
        code: unavailable
        when: "그 밖의 디스크 오류다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    unclear:
      - "같은 이름 확인(lstat)과 rename 사이에 생긴 파일은 POSIX rename이 덮는다. 드문 경쟁이지만 data-loss 경계라 확인이 필요하다"
      - "연결 폴더 밖 path도 옮긴다(secrets.json만 거절). 설계 의도인지 확인이 필요하다"

  - id: file-delete
    title: "Files panel에서 파일이나 폴더를 휴지통으로 보낸다"
    actor: person
    uses: [ipc:shell:file-delete]
    boundary: [shell]
    code:
      - packages/shell/main/editor/file-adapter.ts
      - packages/shell/main/desktop/wiring/editor.ts
      - packages/shell/renderer/workspace/workspace-window.tsx
      - packages/shell/renderer/workspace/sidebar/explorer.tsx
    steps:
      - "Explorer의 Move to Trash나 Delete 키가 확인 dialog를 띄운다. 확인하면 trashFile이 열린 탭의 저장 안 된 글을 먼저 묻는다"
      - "main은 보낸 창과 입력을 본다. path가 디스크에 없으면 not_found다. secrets.json이면 거절한다"
      - "OS 휴지통으로 보낸다. Linux는 gio trash를 먼저 쓰고 안 되면 Electron shell.trashItem을 쓴다. 비어 있지 않은 폴더도 통째로 간다. 영구 삭제로는 가지 않는다"
      - "휴지통을 못 쓰면 아무것도 지우지 않고 unavailable이다. dialog는 실패 문구를 보이고 닫기만 남긴다"
      - "성공하면 그 path(폴더면 아래 전부)의 열린 탭을 닫고 tree를 다시 읽는다"
    outcomes:
      - id: trashed
        observe: ["disk:<path> (OS 휴지통에 있음)", "response", "screen:new-explorer-root"]
      - id: not-found
        code: not_found
        when: "path가 디스크에 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "휴지통으로 보내지 못했다(gio와 Electron 둘 다 실패). 영구 삭제로 되돌아가지 않는다"
        observe: ["disk:<path> (변화 없음)", "response", "screen:new-file-delete"]
      - id: tab-save-refused
        when: "지울 path(폴더면 아래)의 열린 탭에 저장 안 된 글이 있고 사람이 취소했다. IPC를 보내지 않는다"
        observe: ["disk:<path> (변화 없음)"]
      - id: forbidden
        code: forbidden
        when: "보낸 창이 desktop 본문 main frame이 아니다(file IPC guard), 또는 secrets.json이다"
        observe: ["response"]
      - id: invalid-path
        code: invalid_input
        when: "절대 경로가 아니다, 또는 입력이 schema와 다르다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    unclear:
      - "IPC는 연결 폴더 밖 path(데이터 root의 파일 포함)도 받고 secrets.json만 거절한다. Explorer는 연결 폴더 안 줄만 보내므로 실제로는 밖이 나오지 않는다. 설계 의도인지 확인이 필요하다"

