      boundaries: [core, lophn-agent, agent-workspaces, agent-tool-spi]
      note: architecture/layers.md의 규칙이나 예외가 바뀔 때.

  - id: tool-check-source
    kind: tool
    roles: [worker]
    description: 주석과 test 이름의 요구 ID, task 번호, TODO·FIXME, 옛 말, core main graph의 bare fetch(`EXTERNAL_FETCH`), shell이 문자열로 부르는 route 가운데 `SHELL_ROUTES`에 없는 것(`SHELL_ROUTE`)을 잡는다. check의 source 단계.
    path: tools/check-source.ts
    run: npm run check
    change_reasons:
      paths: [packages/shell/main/desktop/core/routes.ts]
      note: 쓰지 않기로 한 말이나 꼴이 늘 때. shell이 core route를 부르는 꼴이 바뀔 때.

  - id: tool-check-sdk-notes
    kind: tool
    roles: [worker]
    description: 내장 SDK와 지원 소스(`@lophn/ui`·`@lophn/i18n`)의 지금 판과 지원 하한(`lophn.supported_from`)마다 `migrate-sdk` skill의 메모 file이 있는지, 메모 이름과 `Previous:` 사슬이 맞는지 본다. 없으면 더할 file 이름을 알려 준다. check의 sdk notes 단계.
    path: tools/check-sdk-notes.ts
    run: npm run check
    change_reasons:
      paths: [packages/core/agent-workspaces/skills/migrate-sdk/, packages/core/apps/packages/vendor.ts]
      note: 메모 file의 꼴이나 지원 소스 목록이 바뀔 때.

  - id: tool-dev
    kind: tool
    roles: [worker, designer]
    description: 개발용 실행. core와 shell을 같이, core만, 또는 mock source로 shell만 띄운다. data root는 .dev-data/.
    path: tools/dev.ts
    run: npm run dev / npm run dev:core / npm run dev:mock
    change_reasons:
      boundaries: [core, shell]

  - id: tests-support
    kind: tool
    roles: [worker]
    description: test의 띄우기와 연결. loop(scripted model), wire(녹화 재생 fetch), fake-server(core E2E와 dev의 provider, 함수 대답과 줄), core(daemon을 pipe로 띄우기, session helper, 묻게 하는 shell 명령), gateway(shell의 Gateway 역할), app(template 앱을 App Engineer의 release 길로 띄우기, patch, e2e:deps), fake-oauth(발급자), annotation. flow의 단계는 test file에 쓴다.
    path: tests/support/
    run: test file이 import한다(직접 돌리지 않는다)
    change_reasons:
      boundaries: [run-loop, models, server, supervision, app-releases, external-coding-agent, app-runtime]

  - id: tool-move-files
    kind: tool
    roles: [worker]
    description: mapping대로 파일과 폴더를 옮기고 옮긴 자리를 가리키는 import와 설정 경로를 고친다. 리팩터링에서 module을 옮길 때.
    path: tools/move-files.ts
    run: node tools/move-files.ts <mapping.json> [--dry-run]
    change_reasons:
      note: import나 설정 경로의 꼴이 바뀔 때.

  - id: tool-package
    kind: tool
    roles: [worker]
    description: OS마다 설치 묶음(Linux .deb, macOS dmg, Windows NSIS, --dir은 풀린 앱까지)을 만들고(tools/package/), Linux 설치본을 실제로 확인한다(verify-linux-install.ts).
    path: tools/package/main.ts
    run: node tools/package/main.ts [--target linux|mac|win] [--dir] / node tools/verify-linux-install.ts
    change_reasons:
      boundaries: [shell, core, coding-agent-cli]

  - id: tool-models-snapshot
    kind: tool
    roles: [worker]
    description: 판을 낼 때 models.dev api.json을 실행 때 갱신과 같은 변환(modelsDevEntries)으로 바꿔 동봉 model catalog snapshot을 새로 쓴다. models.dev에 없는 정의의 항목은 옮긴다.
    path: tools/models-snapshot.ts
    run: node tools/models-snapshot.ts [--from <api.json>]
    change_reasons:
      boundaries: [models]

  # ── runner ──

  - id: skill-eval-run
    kind: skill
    roles: [runner]
    description: eval CLI를 돌리고 진행을 보고, judge 채점을 새 subagent(haiku-xhigh)에게 시켜 넣고, 멈춘 run을 알아채고, run.md를 쓰는 절차.
    path: .claude/skills/eval-run/
    change_reasons:
      paths: [tests/eval/run.ts, package.json, tests/eval/experiment/spec/types.ts]
      note: eval CLI의 인자, stdout 줄, 채점 절차가 바뀔 때.

  # ── experimenter ──

  - id: skill-eval-experiment
    kind: skill
    roles: [experimenter]
    description: experiment 판정을 해석하고 떨어진 trial의 원인(model, 제품, judge)을 가르고, 의심스러운 judge 판단을 적고, 다음 spec 초안을 쓰는 절차와 report.md 꼴.
    path: .claude/skills/eval-experiment/
    change_reasons:
      paths: [tests/eval/run.ts, package.json, tests/eval/experiment/spec/types.ts]
      note: 판정 규칙이나 result.json의 칸이 바뀔 때.

  # ── designer ──

  - id: skill-ui-design
    kind: skill
    roles: [designer]
    description: wireframe gallery(Kit·Screens·Drafts)와 화면 모양을 고치는 절차, component를 어디 두나, 모든 화면의 규칙.
    path: .claude/skills/ui-design/
    change_reasons:
      boundaries: [shell, design, design-api]
      paths: [tools/wireframes/, tools/check-kit.ts]

  - id: tool-wireframes
    kind: tool
    roles: [designer]
    description: wireframe gallery를 build한다. Kit 묶음은 design component를 분류별로, Screens는 renderer 화면을, Drafts는 승인 전 실험을 그린다. 화면 task의 본보기가 여기서 나온다.
    path: tools/wireframes/
    run: npm run wireframes
    change_reasons:
      boundaries: [design, shell]
      paths: [tools/check-kit.ts]

