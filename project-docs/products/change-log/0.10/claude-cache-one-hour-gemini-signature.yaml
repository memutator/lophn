id: claude-cache-one-hour-gemini-signature
version: 0.10.2
title: "Claude 구독 cache를 1시간으로 두고 대화 쪽 cache 경계를 둘로, Gemini thought signature를 돌려보낸다"
modules: [packages/core/lophn-agent, tests]
checked: []
change: |
  전:
  - Anthropic 요청의 cache 표시는 system 층 셋(place 종류, 지침, place 정보)과 대화 끝 하나였다. 표시는 모두 5분 수명이었다.
  - Antigravity(Gemini) 요청은 thought signature를 버리고 첫 functionCall에 서명 검사를 건너뛰는 표시만 실었다.
  후:
  - system 표시는 place 종류와 place 정보 둘이고, 대화 쪽은 마지막 message와 그 앞 user message 둘이다. 넷을 넘지 않도록 system·tools가 쓴 표시를 뺀 남은 자리만 쓴다.
  - Claude 구독(Claude Code profile)은 모든 표시를 1시간 수명으로 보낸다. API key 요청은 5분 그대로다.
  - Gemini functionCall의 thought signature를 tool call에 실어 같은 turn의 다음 요청에 그대로 돌려보낸다. 앞 turn의 functionCall에는 전처럼 건너뛰는 표시를 단다.
  계약:
  - 바뀐 것: HistoryPart의 tool_use에 signature?, adapter ToolCall에 signature?. 저장한 이력과 model call blob 모양은 그대로다.
  - 바뀐 것: assembleTurnPrompt의 cache_boundaries가 둘(place_kind, place)이다.
why: |
  Anthropic은 표시마다 앞쪽 20 block까지만 찾는다. 대화 쪽 표시가 하나면 한 call에 tool 결과가 많이 늘었을 때 앞 call의 cache를 못 찾는다. 5분 수명은 긴 tool 실행이나 사람의 답을 기다리는 사이에 끝난다. omp와 Claude Code가 이 둘을 같은 방식으로 다룬다.
decisions:
  - text: "omp를 따라 system 하나·tool 하나 대신 system 둘을 둔다. lophn의 tools는 session 동안 고정이라 place 종류 표시가 함께 덮는다."
    by: agent
  - text: "Gemini 서명은 저장하지 않는다. 같은 turn의 model은 고정이라 그 안에서만 돌려보내면 다른 model의 서명을 보낼 일이 없다."
    by: agent
  - text: "1시간 수명은 구독 요청에만 둔다. API key는 쓰기 요금이 2배라 Claude Code도 5분이다. omp 방식은 사람이 골랐고, 구독에만 두는 것은 agent가 정했다."
    by: person
follow_up: |
  실제 Claude·Antigravity 호출로 cache 읽기가 오르는지 아직 확인하지 않았다.
