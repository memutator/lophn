id: phone-cannot-open-terminal-tab
title: 폰에서 컴퓨터에 터미널 탭을 새로 열 수 없다
kind: bug
status: open
topic: remote
modules: [packages/mobile, packages/core/coding-relay, packages/shell/main]
now: |
  폰이 컴퓨터에 새로 여는 것은 coding agent session뿐이다(`coding_sessions/open {project, harness, resume?}`, `packages/shell/main/terminal/coding-open.ts`가 터미널 탭을 열어 GUI로 띄운다). harness 없이 shell만 도는 터미널 탭을 여는 route와 화면이 없다. 폰이 보는 터미널도 coding session의 터미널뿐이다(`terminal_view/*`).
impact: |
  사람이 밖에서 폰으로 컴퓨터의 project 폴더에서 명령 하나를 돌려 보려 해도(build, git 상태, server 띄우기) 터미널을 열 길이 없다. coding agent에게 시키거나 컴퓨터 앞에 가야 한다.
fix: |
  - 중간(추천): 폰의 새 session 고르기에 Terminal 항목을 두고, 고르면 컴퓨터의 그 project에 터미널 탭을 열어 폰의 터미널 화면으로 간다. 여는 길은 coding session 열기와 같은 host 요청을 harness 없이 쓰고, 폰의 터미널 목록과 `terminal_view`가 coding session이 아닌 터미널도 받게 한다. 입력은 지금처럼 컴퓨터에서 그 기기에 허락했을 때만 된다(허락이 없으면 열어도 보기만 한다는 것을 화면이 말한다).
decided: |
  사람이 정했다: 폰에서 터미널 탭을 스스로 열 수 있어야 한다.
