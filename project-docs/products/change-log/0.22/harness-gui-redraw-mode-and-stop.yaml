id: harness-gui-redraw-mode-and-stop
version: 0.22.0
title: "harness GUI: 입력·streaming 다시 그리기 줄이기, Claude 처음 mode와 model 이름, `!` 명령 멈춤"
modules: [packages/protocol, packages/core/main, packages/shell/main, packages/shell/renderer]
checked: []
change: |
  전: 글자 하나 칠 때마다 창의 모든 채팅 화면과 대화 전체가 다시 그려졌다. 긴 대화에서 흐르는 글이 끝에 한꺼번에 보였다. Claude GUI는 첫 turn 전까지 mode를 몰라 "Ask before edit"를, model은 "Default"를 보였다. turn 밖에서 도는 `!` 명령을 멈출 길이 없었다.
  후: `DraftStore`는 session마다 구독한다(`subscribe(session, …)`, `version(session)`). `AgentThread`는 memo되고 정해진 줄은 cache해 흐르는 글은 열린 꼬리만 다시 그린다. Claude는 처음부터 설정의 `permissions.defaultMode`(resume이면 transcript의 마지막 mode)를 보이고 "Default" 줄은 실제 model 이름이다. ACP 입력 `stop_shell {item}`이 생겼고 "You ran" 줄이 도는 동안 Stop 단추가 그 명령만 멈춘다(Claude는 그 process, omp `abort_bash`, Codex는 그 turn interrupt, OpenCode `DELETE /api/shell/:id`). lophn core는 `stop_shell`에 `unavailable`이다.
  옮기기: 없음.
why: |
  사람이 harness GUI를 써 보고 말했다(사람).
decisions:
  - text: |
      streaming 끊김은 측정하지 못하고 다시 그리기 비용으로 추정해 줄였다. 남으면 profile한다.
    by: agent
  - text: |
      Codex에는 shell 하나만 멈추는 API가 없어 agent turn 중에 친 `!`의 Stop은 그 turn을 멈춘다.
    by: agent
