id: chat-performance-virtualized-conversation
version: 0.22.0
title: "채팅 화면 성능, Claude steer detach, streaming markdown, 대화 가상화"
modules: [packages/shell/main, packages/shell/renderer, packages/design]
checked: []
change: |
  전: 긴 대화에서 글 조각마다 대화의 모든 markdown이 다시 그려지고(Context 값 `fillShell`을 render마다 새로 만듦), 조각 묶음마다 동기 commit이 나고, 흐르는 글 전체를 매번 다시 parse해 streaming·Working 반짝임·입력이 끊겼다. Claude GUI의 steer는 도는 Bash가 끝나야 닿았다. 흐르는 글에서 덜 쓴 표·link·`**`가 튀었고, 자라는 code block은 commit마다 통째로 다시 칠했다. 대화의 모든 줄을 DOM에 그렸다.
  후: `fillShell`은 memo다. 글 조각은 store가 약 40ms로 묶어 알리고(`useThrottledLive`는 지움), 흐르는 글은 끝난 덩어리(memo)와 꼬리로 나눈다(`splitLive`). Claude steer는 `next`로 넣고 3초 넘게 돈 root Bash·PowerShell·Agent·Task를 tool_use id로 `backgroundTasks(id)`한다(지금 보내기는 `now`와 바로 detach). 흐르는 꼬리는 덜 쓴 표·제목·목록 표시·link를 감추고(`@lophn/ui/reading` `Markdown`의 선택 칸 `streaming`), parse 결과를 cache한다. 자라는 code block은 Shiki grammar state로 새 줄만 칠하고 끝난 결과를 cache한다(`Highlighter.highlight`의 선택 인자 `{key, partial}`). 대화는 가상화한다. 측정(gallery `harness-gui-perf`, CPU 4배 느리게): 15초 streaming이 30.6초→14.8초, 50ms 넘는 frame 42→0, 200 turn 대화의 main thread 바쁜 시간 78.8초→7.2초.
  옮기기: 없음. `@lophn/ui`는 선택 칸만 더해 판(1.1.0)을 그대로 둔다.
why: |
  사람이 긴 대화에서 streaming·입력이 끊긴다고 말했다(사람). Claude·Codex·omp desktop, t3code, emdash, happy를 참고하고 headless Chrome으로 재며 고쳤다.
decisions:
  - text: |
      Claude steer는 Claude desktop과 같은 detach다. id 없는 `backgroundTasks()`와 control 요청 `interrupt {send_now}`는 녹화에서 각각 tool을 풀지 못하거나 멈췄다.
    by: agent
  - text: |
      `@lophn/ui` 판은 올리지 않는다. 선택 칸 추가이고 이 판에 component를 더해 온 관행을 따른다.
    by: agent
