id: retired-skill-copies-left-in-home
title: 지운 배포 skill의 얇은 사본이 사람 home에 남는다
kind: bug
status: fixed
topic: coding-agent
modules: [packages/coding-agent, packages/protocol]
now: '`lophn harness install`은 `CODING_SKILL_NAMES`(`packages/protocol/coding-agent/harness-adapter.ts`)에 든 이름마다 `<home>/<skillDir>/<name>/SKILL.md`에 얇은 skill을 쓰기만 하고, 목록에서 빠진 이름의 사본은 지우지 않는다(`packages/coding-agent/harnesses/install.ts`의 `installSkill`). `lophn-repair`를 목록과 원본에서 지웠으므로, 앞서 설치한 사람의 `~/.claude/skills/lophn-repair/SKILL.md`가 그대로 남는다. 그 skill은 "`lophn guide lophn-repair`의 출력을 따른다"뿐인데, 이 이름은 이제 `guide` 입력 검사에서 거절된다.'
impact: 그 사람의 coding agent는 어느 폴더에서든 `lophn-repair` skill을 목록에서 보고, 고르면 거절만 받는다. `ae-builds`가 `lophn-build-app`을 지우면 같은 일이 한 번 더 난다.
fix: |
  - 설치가 lophn이 쓴 얇은 사본(내용이 `thinSkill`의 꼴) 가운데 목록에 없는 이름을 지운다(작음). 사람이 고친 사본은 내용이 달라 남는다. 추천. `lophn-build-app`을 지우는 계획에서 같이 한다.
  - 그대로 두고 사람이 지운다(없음. 사람이 알아야 한다).
closed: 배포 skill(`lophn-build-app`)과 `CODING_SKILL_NAMES`를 지웠다. `lophn harness install`은 skill을 놓지 않고 `RETIRED_SKILL_NAMES`(`lophn-build-app`, `lophn-repair`)의 사본 가운데 폴더에 `SKILL.md` 하나뿐이고 글이 lophn이 쓰던 꼴과 byte까지 같은 것만 지운다. 설치는 coding session을 열 때만 저절로 돌고 지금은 여는 길이 없어, 옛 사본이 있는 사람은 `lophn harness install`을 한 번 돌려야 한다.
guard: '`packages/coding-agent/harnesses/install_test.ts`의 "설치는 lophn이 놓은 지운 skill의 얇은 사본만 지우고, 사람이 고친 사본, 다른 file이 더 든 폴더, 다른 이름의 skill 폴더는 남긴다"'
