id: view-call-undefined-input
version: 0.23.69
title: 화면이 값이 undefined인 칸을 넣어 부른 operation이 desktop에서 거절되던 것을 고치고, 거절된 화면 호출을 앱 log에 남긴다
modules: [packages/shell/main, packages/core/apps, packages/protocol]
change: |
  - desktop의 앱 화면이 `callOperation`에 값이 undefined인 칸이 든 입력을 주면 `invalid_input: call is invalid`로 실패했다(요청이 core에 가지 않았다). 이제 shell main이 입력을 JSON 값으로 만들어 보낸다: 입력이 없으면 null, 값이 undefined인 칸은 빠진다. 폰 bridge와 같은 규칙이다.
  - 앱 handler에 닿지 못했고 그 실패를 말하는 invocation도 없는 live 화면 호출은 그 앱 log에 `view_error call_rejected <operation>: <code>: <message>` 한 줄로 남는다(선언에 없는 operation, 묶음을 잃은 view, 호출 경로 오류, 상한을 넘는 결과, shell main의 입력 거절). 전에는 어디에도 남지 않았다.
  - 계약: `app.log_view_error` 입력의 `observation`에 `call_rejected`가 더해졌다(host가 쓴다. page가 보내는 값은 그대로 셋이다). 그 밖의 route와 schema는 그대로다.
why: |
  화면 view를 core view 표로 옮기면서 shell main의 JSON 왕복이 빠졌고, core 통로의 client 쪽 입력 검사(canonical JSON)가 undefined 값을 거절했다. Mahas의 세션 탭처럼 고르지 않은 거르기 값을 undefined로 넘기는 화면이 모두 "Couldn't load"가 됐다. 그 실패가 invocation에도 앱 log에도 없어서 앱 agent가 원인을 찾지 못했다.
decisions:
  - text: >-
      입력은 shell main에서 정규화한다. 버린 길: preload에서 하기(page와 같은 process라 main이 다시 봐야 한다), canonical JSON 검사를 undefined에 너그럽게 하기(hash의 근거가 되는 검사라 느슨하게 하지 않는다).
    by: agent
  - text: >-
      거절은 invocation이 아니라 앱 log 줄로 남긴다. 앱 agent가 이미 읽는 자리이고 invocation 표의 status와 rewind 판정을 건드리지 않는다. 같은 binding에서 같은 거절은 한 번만 써서 되풀이해 부르는 화면이 log를 채우지 않게 했다. 버린 길: 거절도 invocation으로 남기기(표와 rewind 대상 판정이 같이 바뀐다).
    by: agent
checklist:
  - Mahas 앱의 세션 탭을 열어 목록이 뜨는지 본다
