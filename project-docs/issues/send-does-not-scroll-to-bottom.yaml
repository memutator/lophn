id: send-does-not-scroll-to-bottom
title: 메시지를 보내도 대화가 맨 아래로 가지 않는다
kind: bug
status: fixed
topic: agent-chat
modules: [packages/shell/renderer]
now: |
  `ThreadScroll`(`message-list/thread-scroll.tsx`)은 `following`이 켜져 있을 때만 맨 아래로 간다. `following`을 다시 켜는 것은 맨 아래 여유(`BOTTOM_SLACK`) 안으로 scroll해 내려오기, "최신으로" 버튼, 처음 그리기뿐이다(`follow.ts`). 보내기(`agent-view.tsx` `dispatch` → `agent-thread.tsx`의 `outgoing` 줄)는 `following`을 건드리지 않는다. 조금이라도 올려 읽었거나 저장된 읽던 위치로 탭을 다시 열었으면, 보낸 메시지가 화면 밖에 붙고 화면은 그대로다.
impact: |
  사람이 보낸 메시지와 그 답을 보려면 손으로 내려가야 한다. lophn agent와 harness GUI 모두다.
fix: |
  사람이 보내기를 하면 `ThreadScroll`이 따라가기를 켜고 맨 아래로 간다(예: `outgoing.id`를 prop으로 받아 바뀌면 "최신으로"와 같은 길). 작음. 추천.
closed: |
  `ThreadScroll`이 `sent`(보낸 말의 id)가 바뀌면 "최신으로" 단추와 같은 `jump()`로 따라가기를 켜고 맨 아래로 간다.
guard: 없음
