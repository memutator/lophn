id: artifact-delete
version: 0.23.16
title: sidebar Artifacts 목록에서 artifact를 지울 수 있다
modules: [packages/shell/ipc, packages/shell/main, packages/shell/preload, packages/shell/renderer, packages/design]
change: |
  - project sidebar의 Artifacts 줄에 마우스를 올리거나 focus하면 휴지통이 보인다. 누르면 확인 dialog가 뜨고, 지우면 `artifacts/<name>/` 폴더가 사라진다. 지운 폴더는 rewind로 되살릴 수 없다.
  - shell IPC `shell:artifact-delete`(`{project, name}`)를 더했다. main은 이름을 slug로 다시 검사하고, 대상이 symlink가 아닌 폴더이고 realpath가 그 project의 artifacts 폴더 바로 안일 때만 재귀로 지운다. 폴더 안의 symlink는 따라가지 않고 link만 지운다.
  - 그 artifact를 연 탭은 main이 view를 버리고 `removed` event를 밀어 폴더 없음 안내(Try again)로 바뀐다.
why: |
  사람이 쓸모없는 artifact를 지우려면 agent에게 시키거나 파일 관리자를 열어야 했다.
decisions:
  - text: >-
      화면에서 지우는 단추를 둔다. 이전 결정("두지 않는다", 2026-10-19)을 뒤집는다. 대신 확인 dialog와 폴더 밖을 건드리지 않는 위험 test를 같이 넣었다.
    by: person
  - text: >-
      열린 탭을 폴더 없음으로 바꾸는 길은 main이 view를 버리며 `removed` event를 미는 것이다. 버린 안: 탭이 watch를 따라 다시 열기(폴더가 사라지면 watch가 조용히 멈추고 알릴 길이 없다).
    by: agent
  - text: >-
      앱의 artifact는 지우지 않는다(앱 sidebar 목록이 없다).
    by: agent
