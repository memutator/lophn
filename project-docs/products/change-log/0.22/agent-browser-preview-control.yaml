id: agent-browser-preview-control
version: 0.22.0
title: "agent가 자기가 연 browser 탭과 앱 preview를 보고 다룬다"
modules: [packages/protocol, packages/core/host-queue, packages/core/apps, packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/config, packages/core/main, packages/core/storage, packages/cli, packages/coding-agent, packages/shell/main, packages/shell/ipc, packages/shell/preload, packages/shell/renderer, packages/design, tools]
checked: [tool-check, architecture-layers, architecture-event, architecture-approval, architecture-testing, architecture-activation, architecture-package, architecture-workspace-session, architecture-run, architecture-workflow, architecture-agent-definition, architecture-extension, architecture-keybindings, architecture-agent-chat, architecture-acp, architecture-artifact, architecture-ui-kit, architecture-appearance, tool-worktree-prep, tool-test-live, tool-check-deps, tool-dev, tests-support, tool-package, tool-models-snapshot, skill-ui-design]
change: |
  전: agent는 탭을 열고 자기가 연 browser 탭의 url·title·loading만 읽었다. page를 보지도 누르지도 못했다. 앱 preview는 core에만 있고 shell에서 여는 곳이 없었다(preview view의 화면 file도 core가 내주지 않았다). 사람 token(터미널의 coding agent)은 `tab` 명령을 부르지 못했다. host queue는 shell main이 1초마다 가져갔다.
  후:
    - preview 탭: 탭 kind `app_preview`(layout에 저장 안 함, 안내 줄, [Stop], 멈춘 뒤 "No preview is running."). `lophn preview start`가 ready 뒤 그 탭을 연다. `lophn tab open --preview <app> [--device <name>]`은 그 앱 workspace의 session과 사람 token만 연다(다른 workspace는 `not_found`, 돌고 있는 preview가 없으면 `conflict`). 앱마다 탭 하나이고 다시 열면 주인이 바뀐다. 앱 화면 탭 toolbar의 [Preview]. core가 preview 대상의 화면 file을 그 preview의 bundle에서 내준다.
    - preview annotation: release 대신 `preview_bundle`(bundle hash)을 싣는다. 받는 tag `preview="…"`와 본문 `Preview:` 줄.
    - host queue long-poll: `host/take`가 요청을 5초까지 기다린다. 기다리는 동안 shell이 붙어 있는 것으로 본다.
    - `lophn browser snapshot|act|navigate|screenshot|evaluate|logs|wait`: 요청 `browser_call`이 extension tool 호출과 같은 결과 길(`host/done`)을 쓴다. 기한 30초(`unavailable`). shell main이 `webContents.debugger`(CDP)로 실행한다: accessibility snapshot과 탭마다 이어지는 ref(`e12`, 낡으면 `conflict`), `Input.*`, screenshot, evaluate, console, wait, dialog 자동 닫기. DevTools가 열려 있으면 `conflict`. 다루는 것은 `tab open`으로 연 탭(주인만)이고 사람이 손으로 연 탭과 앱 live 화면은 닿지 않는다. agent가 뒤에 연 탭도 고르지 않고 다룬다.
    - take control: agent가 다루는 탭 머리에 "Agent is controlling this tab"과 [Take control]. 사람이 가져가면 agent의 act·navigate·evaluate는 `conflict`, 읽기는 된다.
    - page 글은 `<lophn-untrusted source="browser.<명령>">`로 감싼다(lophn agent는 tool 이름 규칙, binary는 찍는 글). tag와 escape 코드는 protocol `input-tags.ts` 하나로 옮겼다.
    - screenshot: lophn agent는 image content, binary는 `--out` 또는 `<tmpdir>/lophn-screenshots/<tab>-<ms>.png`에 쓰고 path를 찍는다.
    - 사람 token: `tab open --url|--preview`, `tab close`, `browser *`. 주인은 "person". `--url` 탭의 workspace는 `--workspace` → env `LOPHN_WORKSPACE`(project 터미널에 shell이 넣는다) → home.
    - 기기 emulation: Settings > Browser에 기기 등록(설정 `shell.devices`), preview 탭의 기기 고르기와 phone frame, 크기·DPR·touch·user agent.
    - 공유 skill `lophn-agent`에 탭·preview·browser 쓰는 법.
  저장 모양: ledger step `apps.annotations.preview-bundle`(`annotations.preview_bundle`, 옛 행은 null). 새 설정 key `shell.devices`(기본 `[]`).
  옮기기: ledger step이 자동으로 돈다. 설정은 기본값이 있어 옮길 것이 없다.
why: |
  agent가 자기가 연 탭의 주소만 읽을 수 있어 page를 보고 다루는 일을 할 수 없었고, 사람 token의 `tab` 명령도 막혀 있었다.
decisions:
  - text: |
      CLI + skill이다. `lophn browser`를 본체에 두고 extension tool로 만들지 않는다. lophn agent, harness agent, 터미널의 coding agent가 같은 구현을 쓴다.
    by: person
  - text: |
      host queue는 long-poll로 바꾸고 browser 호출은 `tool_call`의 결과 길을 같이 쓴다. 새 통로는 없다.
    by: person
  - text: |
      preview를 시작하면 사람 화면에 탭을 저절로 연다. 여는 것은 `preview start` 명령이 같은 자격으로 `tabs/open`을 부르는 것이다.
    by: person
  - text: |
      agent가 연 browser 탭도 사람의 browser 탭과 같은 partition을 써서 사람의 로그인을 쓴다.
    by: person
  - text: |
      `evaluate`는 browser 탭에도 준다.
    by: agent
  - text: |
      앱은 preview만 다룬다. live 화면은 sender view 신원으로 operation 막기를 건너므로 다루지 않는다.
    by: agent
  - text: |
      long-poll 기다림 5초(TUI hold 갱신 10초보다 짧게), browser 호출 기한 30초, wait 기본 10초·최대 25초.
    by: agent
  - text: |
      기기 목록은 사람이 등록한 기기뿐이고 emulation은 shell 본체의 preview 탭에 둔다.
    by: person
  - text: |
      다루는 동안 숨은 탭은 창 오른쪽 아래 1px만 걸쳐 그리기를 이어 간다(다른 내용 뒤에 두면 Chromium이 그리기를 멈춘다).
    by: agent
follow_up: |
  실제로 보이는 창에서의 입력·1px·기기 frame은 사람이 아직 보지 않았다(확인은 headless Electron). 기기를 건 뒤 DevTools를 열면 emulation이 말없이 풀린다(`project-docs/issues/browser-tab.md`). 앱 agent 지침 `packages/core/agent-workspaces/prompts/app.md`의 `preview start` 설명에 탭이 열린다는 것은 wrap에서 더했다.
