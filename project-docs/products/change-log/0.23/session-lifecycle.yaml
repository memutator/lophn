id: session-lifecycle
version: 0.23.27
title: "session lifecycle: 앱이 agent session 목록·상태를 읽고 멈추고 session.* event를 듣는다"
modules: [packages/protocol, packages/core/lophn-agent, packages/core/main, packages/core/apps, packages/core/host-queue, packages/sdk, packages/shell/main, packages/shell/preload, packages/shell/ipc, packages/shell/terminal-host, packages/shell/renderer, packages/design, packages/core/agent-workspaces]
checked: []
change: |
  전: 앱은 "어느 session이 돌고 있나, 무엇이 사람을 기다리나"를 물을 길이 없었다. 상태를 내는 곳이 넷(session snapshot, ListSendableSessions의 describe, ACP turn phase, 터미널 tracker)이라 뜻이 조금씩 달랐다. `shell.run`의 child env에는 session id가 없었다.
  후:
  - session 상태 파생을 한 곳(`lophn-agent/session/state.ts`)으로 모았다. `ListSessionSnapshots`와 Router의 call 대상 상태(`ListSendableSessions`)가 그 함수를 쓴다(기다림을 메모리로 보는 쪽과 ledger의 tool call로 보는 쪽은 같은 함수의 두 입력). ACP turn phase와 터미널 tracker는 따로 둔다(화면 투영, 터미널 hook의 상태).
  - core가 발행자 `lophn`으로 `session.started|running|waiting|idle|ended`를 낸다. Bus의 agent event(session 시작·끝, turn, 요청, 질문)를 받아 상태를 다시 파생해 바뀐 때만 낸다. 앱 event의 전달 길(`createEventDelivery`)을 그대로 쓴다. payload는 session 한 줄(id, kind lophn|harness|terminal, agent, harness, workspace, 제목, 상태, waiting_for, 마지막 활동, spawned_by, cwd, 폴더, terminal 정보)이고 protocol(`session-lifecycle.ts`)에 있다.
  - 가시성은 call 정책이다. 앱은 그 앱 workspace에 사는 agent가 call로 닿을 수 있는 workspace의 session만 목록과 event로 본다. `mayCall`에서 agent 쌍 규칙을 뺀 `mayReachWorkspace`를 떼어 앱이 쓴다(가짜 agent를 세우지 않는다). event 전달과 앱 화면 event(`AppEventPublished`의 `audience`)가 이것으로 거른다.
  - route `app_sessions.list|status|stop`(actor app·user): 앱 process는 broker(`/_lophn/broker/sessions/*`)를 지나고(자식 credential 허용 목록에 추가) 앱 화면은 `lophnApp.sessions`(IPC `app:sessions-*`)로 shell main이 sender view의 앱을 싣고 사람 자격으로 부른다. `stop`은 시야 안 모든 session에 열린다: lophn runtime은 StopTurn(model 요청과 도는 `shell.run`을 process group째 끊음), harness runtime은 turn이 닫히면 host가 CLI group을 끊는다(SIGTERM, 3초 뒤 남으면 SIGKILL을 더했다), 터미널 탭은 harness의 끊기 key를 친다(key가 없으면 unavailable). 앱이 멈춘 것은 program 기록 `session_stopped_by_app`(Inbox History)으로 남는다.
  - 터미널 coding agent: shell main이 지금의 집합(탭, project, harness, 상태, CLI session id, 제목, cwd, PTY shell pid)을 `terminal_sessions.report`로 통째로 알린다(바뀔 때와 5초마다). core는 메모리에만 두고 shell이 붙어 있지 않으면 비운다. stop은 host queue의 새 요청 `terminal_interrupt`로 shell main에 넘긴다. `TerminalRuntime`에 `shell_pid`를 더했다. CLI 자신의 pid, process 목록, git 정보, process kill은 주지 않는다.
  - `LOPHN_SESSION_ID`: `shell.run`의 child env(허용 목록의 일부러 연 하나의 예외, 부모 env에서는 물려받지 않음), 사람의 `!` 명령, headless harness CLI의 spawn env에 넣었다. 터미널 env는 바깥 `LOPHN_*`를 지우는 그대로다(터미널 탭은 core session이 아니다).
  - SDK: `@lophn/agent` 1.11.0이 화면용 `useSessions`와 React 없는 앱 process 입구 `@lophn/agent/process`(`sessions.list|status|stop`)를 더한다. `design-app` skill에 shell pid 밑 process tree 따라가기와 `LOPHN_SESSION_ID`로 찾기 예를 더했다. `workspace-session.md`에 event 목록과 harness 비교를, `terminal-agent.md`·`coding-agent.md`·`event.md`·`app-call.md`에 바뀐 길을 적었다.
  - 구독 handler 등록은 필수가 아니다(ready probe가 선언한 구독 handler를 missing으로 세지 않는다. core는 probe가 알린 등록 이름으로 handler가 없는 앱 process에는 event를 보내지 않는다). 터미널 stop은 running·waiting일 때만 끊기 key를 치고 기록도 남긴다. lophn event는 구독자가 없으면 session 한 줄도 발행 기록도 만들지 않는다.
  - 앞 단계(앱 event) 고침: bundle의 선언 handler 목록(activation·preview)이 구독 handler를 빠뜨려 구독을 선언한 앱이 release되지 않던 것, 구독 handler 안에서 낸 event가 고리를 이루던 것(event가 chain을 싣고 가 끊고 발행 기록 `refused`에 센다), 발행 기록의 `delivered`를 `reachable`로 바꾼 것을 같은 branch에서 고쳤다.
why: 구독 한도에서 도는 coding agent를 멈추거나 process를 감시하는 앱이 lophn만 아는 것(session 목록과 상태)을 읽고 멈출 길이 필요했다. session lifecycle을 SDK에 따로 짓지 않고 core가 event의 첫 발행자가 된다.
decisions:
  - text: "session 상태 파생을 한 곳으로 모은다. 기다림의 출처(메모리, ledger)는 입력만 다르다. 버린 길: 넷을 모두 바꾸기(ACP phase와 터미널 tracker는 다른 일이다)."
    by: agent
  - text: "가시성은 call 정책(`mayReachWorkspace`)이다. 새 permission이나 정책을 만들지 않는다. 팀 규칙은 앱에 적용하지 않는다."
    by: person
  - text: "터미널 session id는 `term:<탭>`이고 상태는 shell main이 통째로 알린다. core는 메모리에만 두고 shell이 떨어지면 비운다. 버린 길: core에 hook을 보내는 새 길(터미널이 shell의 것이라는 결정과 부딪힌다), 변경분만 알리기(어긋남)."
    by: agent
  - text: "stop은 시야 안 모든 session에 열고 멈춘 앱을 사람이 볼 수 있게 program 기록으로 남긴다. 새 StopTurn reason은 만들지 않았다(turn 행에 앱을 적으면 schema step이 든다)."
    by: agent
  - text: "`LOPHN_SESSION_ID`를 shell.run과 harness CLI env에 넣는다(allowlist의 하나뿐인 `LOPHN_` 예외)."
    by: person
  - text: "session API는 `@lophn/agent`에 둔다. 앱 process 쪽은 React 없는 entry `@lophn/agent/process`로 둔다(package `exports`에 subpath)."
    by: agent
follow_up: |
  - 다음 단계(앱의 A2A와 ACP): 보낸 쪽 `app`, 앱이 여는 session, ACP가 시야 안 session에 붙기. session 목록의 `session` id와 가시성 함수가 그 기반이다.
