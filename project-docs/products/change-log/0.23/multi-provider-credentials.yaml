id: multi-provider-credentials
version: 0.23.110
title: provider당 다중 credential(다계정 OAuth·다중 API key) 등록과 활성 전환, 계정·키 마스킹 표시를 지원한다
modules: [packages/protocol, packages/core/lophn-agent, packages/design, packages/shell/ipc, packages/shell/renderer]
change: |
  - protocol: `crd` ID prefix와 `ProviderCredential`의 `id`, `active`, `label`, `key_hint`, `ProviderRecord.credentials[]`를 추가했다. `providers/add-credential`, `providers/activate-credential`, `providers/remove-credential` command를 열고, `providers/connect-key`와 `providers/sign-in`이 기존 연결된 `{ provider }`에 추가 등록하는 입력을 받도록 확장했다.
  - core: `provider_credentials` PK를 `id(crd_…)`로 옮기는 schema step(`lophn-agent.harness-provider.multi-credentials`)과 기존 `secrets.json` 키(`provider.<pvd_ULID>` → `provider.crd_<ULID>`) 및 기존 API key의 `key_hint`를 옮기는 dataStep(`lophn-agent.provider-credentials-secrets`)을 추가했다. 같은 OAuth 계정 재로그인은 중복 생성 대신 기존 행을 갱신(upsert)하며, 활성 credential 전환·승계 시 OpenAI(Codex vs API)처럼 kind에 따라 달라지는 endpoint도 함께 맞춘다. 비활성 credential의 secret은 endpoint 부착에서 막고, OAuth refresh는 credential ID 단위로 직렬화한다.
  - shell: Settings › Providers의 연결된 provider 카드 안에 등록된 credential 목록을 표시한다(OAuth 제품명·이메일·조직명, API key 마스킹 힌트·라벨, `Active` 표시, `[Use]`, `[Remove]`, `[+ Add account or key]`).
why: |
  provider당 credential이 1개로 고정돼 있어 다계정 OAuth나 여러 API key를 등록해 오갈 수 없었고, 화면에서도 OAuth인지 API key인지, 어떤 계정·키가 연결돼 있는지 구분되지 않았다.
decisions:
  - text: >-
      provider당 여러 credential을 두고 활성 1개를 사람이 수동으로 선택하는 방식(방향 A)으로 갔다. 버린 길: 429/쿼터 소진 시 자동 rotation(구독 OAuth에서 유료 API key로 의도치 않게 넘어가거나 prompt cache가 깨지는 위험).
    by: person
  - text: >-
      마지막 남은 credential은 `providers/remove-credential`에서 `conflict`로 막고 확인 창이 붙은 `providers/disconnect`로만 끊게 했다.
    by: agent
