  - path: tests/e2e/shell-rule_test.ts
    covers: [turn-request-decide:always, tool-gate-check:run-after-allow, tool-gate-check:run, tool-gate-check:denied-shell-rule, tool-shell-run:finished, tool-call-execute:ok, tool-call-execute:gate-denied, settings-read:ok, session-change-skip:ok, turn-mode-decide:skip, core-boot:ready]
