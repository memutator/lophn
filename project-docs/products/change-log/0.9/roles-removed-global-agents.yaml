id: roles-removed-global-agents
version: 0.9.0
title: 'role이 없어지고, agent 정의는 전역이며 session이 place를 갖는다'
modules: [packages/protocol, packages/sdk, packages/coding-agent, packages/core/agent-workspaces, packages/core/lophn-agent, packages/core/router, packages/core/runs, packages/core/jobs, packages/core/workflows, packages/core/apps, packages/core/approvals, packages/core/projects, packages/core/server, packages/core/storage, packages/core/main, packages/design, packages/shell/main, packages/shell/renderer, tools, tests]
checked: [architecture-approval, architecture-artifact, architecture-testing, architecture-ui-kit, skill-ui-design, skill-write-test, tool-wireframes, tool-check-deps, tool-dev, tool-move-files, tests-support, tool-check, architecture-workspace-layout, architecture-appearance, tool-context-review, tool-worktree-prep, tool-check-source, tool-models-snapshot]
change: |
  전:
  - agent는 role 넷이었다: lophn, Project Manager(project마다 하나), App Engineer(앱마다 하나), Operator(사람이 만들고 project나 앱에 놓음). role이 tool 목록, 지침, 내장 skill, credential 상한, file 범위, 정의 자리를 정했다. project를 등록하면 PM이, 앱을 만들면 AE가 저절로 생겼다.
  - 정의는 role마다 자리와 꼴이 달랐다(lophn `<data>/agents/lophn.md`, PM·AE는 그 그릇 아래, Operator는 놓인 place 아래). route도 `CreateOperator`, `ChangeOperator`, `DeleteOperator`, `ChangeBuiltinAgent`, `agent-definitions/*`로 갈렸다.
  - session은 `(role, place, operator)`로 정체가 정해졌고, call·job·workflow·CLI `run`의 주소는 `{role, place?, name?}`(`pm:`, `ae:`, `operator:`)였다. 앱 일은 그 앱의 AE에게, kind는 PM에게 넘겨야 했다.
  - 화면은 role label(Project Manager, App Engineer, Operator)을 보였고 sidebar와 앱 agent select가 role로 갈렸다.
  - 여는 길이 없는 coding session 층(`core/apps/coding/`, `coding_sessions` 표 셋, coding MCP endpoint, `coding_agent` actor와 `cac` id, `project.resolve_cwd`)이 남아 있었다.
  후:
  - agent는 lophn과 사람이 만든 agent다. 정의는 꼴이 하나이고 전역(`<data>/agents/<id>.md`)에 있다. lophn은 고정 id `lophn`의 내장 정의라 이름과 profile을 바꾸거나 지우면 `forbidden`이다. agent 이름은 전역에 하나이고 `lophn`은 예약이다. route는 `agents/{list,read,create,change,delete}`와 profile 이미지 둘, 할당은 `agent_assignments/{get,set}`(`{agent: AgentId}`)이다. 등록할 때 agent를 만들지 않는다.
  - session의 정체는 (agent id, place)다. place는 없음(home), project, app이고 열 때 정해 바꾸지 않는다. tool 목록, 지침(`agent-places/prompts/{home,project,app}.md`), 내장 skill, credential 상한, file 범위는 session의 place 종류가 정한다. 받는 domain은 정의의 `domains`(비면 그 place 그릇의 active domain 전부)와 place로 정하고 home은 0개다.
  - `operator.create`·`operator.update` tool은 `agent.create`·`agent.update`가 되어 세 place 종류 모두에 든다. 할당, 정의 층 MCP server, skip은 여전히 사람만 정한다.
  - 주소는 agent 이름과 place다: call의 `to`는 `{session}`이나 `{agent, place?}`(+ `fallback`), workflow 참가자는 `{agent, place?}`·`human`·`harness`, job 대상과 만든 쪽은 (agent, place), CLI `lophn run`은 agent 이름과 `--project`·`--app`이다. domain 일과 주인 없는 artifact annotation은 주인 그릇 place의 lophn session이 받고, 앱 화면 annotation은 앱 agent select가 고른 agent의 그 앱 place session이 받는다. flow의 앱 tool 호출은 `workflow.yaml`의 `agent`(없으면 lophn)의 할당과 그 project에서 받는 domain으로 거른다.
  - module `packages/core/agent-roles`는 `packages/core/agent-places`, boundary ID `agent-roles`는 `agent-places`다. 내장 skill `guide-roles-and-assignments`는 `guide-agents-and-assignments`, prompt 층 이름 `role`은 `place_kind`다.
  - 화면: Agents 탭은 전역 목록 하나이고 편집 화면도 하나다(lophn은 이름과 profile이 잠기고 지우기가 없다). project sidebar와 앱 agent select는 모든 agent를 보이고 고르면 그 place의 session을 연다. role label과 coding session 문구 key를 지웠다.
  - schema: `sessions`는 `agent` 열을 갖고 `role`·`operator` 열이 없다. `jobs`의 만든 쪽, `runs.agent_key`, `agent_assignments.agent`, `agent_calls."to"`, `workflow_instances.participants`가 새 꼴이다. `messages.from_kind`에 `coding_agent`가 없다. coding 표 셋을 지웠다.
  - coding session 층, `coding_agent` actor와 `cac` id 접두, `project.resolve_cwd`와 credential 조건 `cwd`를 지웠다. actor 종류는 `user`, `agent`, `app`, `machine`이다. 사람이 연 터미널의 hook, 탭 icon·점, 알림, Settings › Coding agents의 감지·설치는 그대로다(`architecture/terminal-agent.md`).
  - eval scenario는 말 상대의 place 종류(`home`, `project`, `app`)로 묶였다(8개). 진짜 model은 정의가 아니라 `real` 참가자의 session에 붙인다. L8, C9-other, O7은 지웠고 O6은 "project place의 agent가 `kinds.yaml`을 직접 고친다"로 뒤집었다(AGENT.md C1, 사람이 2026-10-29에 확정). 재료 `operators-home`은 `agents-home@1`이 되었다. 돌리지는 않았다.
why: |
  Project Manager, App Engineer, Operator는 소프트웨어 공학의 말이라 `PRODUCT.md`가 사람에게서 감추려는 것이다. role 사이 넘기기는 맥락을 끊고 turn을 늘렸다(Operator가 버그를 만나면 AE에게, kind를 바꾸려면 PM에게 call). agent 사이의 차이는 이미 place 종류(credential 조건)와 정의의 `domains`·할당이 만들고 있었고, place가 하는 일은 모두 "session이 어디서 일하나"의 일이다. Claude Code, Codex, OpenCode도 agent 설정은 전역이고 작업 폴더는 session마다다.
decisions:
  - text: |
      role을 없앤다. lophn과 agent만 남기고 Operator를 agent로 부른다.
    by: person
  - text: |
      agent는 place에 놓이지 않는다. session이 place를 갖는다.
    by: person
  - text: |
      agent 정의에 권한 칸을 두지 않는다. 차이는 session의 place 종류와 정의의 domains, skills, 할당이 만든다. 버린 길: 짓기 가능·domain 고치기 가능 같은 칸(role이 칸 이름만 바꿔 돌아온다).
    by: person
  - text: |
      등록할 때 agent를 만들지 않는다. 새 앱은 home의 lophn이 등록하고 그 앱 place의 lophn session에 맡긴다.
    by: person
  - text: |
      coding agent 연결 장치의 coding session 층을 지운다. 사람이 연 터미널의 agent 층은 남긴다.
    by: person
  - text: |
      정의 꼴은 지금 Operator 꼴 하나다. 정의가 전역이면 built-in 꼴과 Operator 꼴을 가를 이유가 없다.
    by: agent
  - text: |
      lophn은 고정 id의 내장 정의이고 새 agent 값의 type은 `AgentId`(`lophn` 또는 `agt_…`)다. role union이 없으면 lophn만 가를 이유가 id 하나로 충분하다.
    by: agent
  - text: |
      agent 이름은 전역에 하나이고 `lophn`은 예약이다. 주소가 이름이라 겹치면 받는 agent가 하나로 정해지지 않는다.
    by: agent
  - text: |
      `agent.create`·`agent.update`는 세 place 종류 목록에 모두 들고 `operatorPlaceAllowed`는 지운다. 정의가 place에 속하지 않으니 검사할 그릇이 없다.
    by: agent
  - text: |
      place 종류별 지침·tool 목록·내장 skill은 지금 role의 것에서 시작한다(home ← lophn, project ← PM, app ← AE). 짓기 절차를 app 지침에 그대로 두면 짓기 품질이 지금과 같다.
    by: agent
  - text: |
      credential 상한은 place 종류 목록의 route 합이고 조건은 session place에서 나온다. file 범위는 place 종류로 정하고 domain 폴더는 받은 domain의 것으로 좁힌다.
    by: agent
  - text: |
      받는 domain: `domains`가 비면 place 그릇의 active domain 전부, 있으면 그 가운데 place 그릇의 것만(0개일 수 있다), home은 0개다. 정의가 전역이라 "고르지 않음"과 "여기엔 해당 없음"을 갈라야 한다.
    by: agent
  - text: |
      domain 일을 받는 쪽은 주인 그릇 place의 lophn session이다. lophn은 늘 있는 agent라 받을 agent가 없어 실패하는 일이 없다. project 파일에 단 annotation도 그 project place의 lophn session이 받는다.
    by: agent
  - text: |
      앱 화면 annotation은 앱 agent select가 고른 agent의 그 앱 place session으로 간다. 앱마다 정해진 AE가 없으니 사람이 보고 있는 agent가 받는다.
    by: agent
  - text: |
      workflow 참가자는 `{agent, place?}`, `human`, `harness`이고 place가 없으면 instance의 project다. flow의 앱 tool 호출은 `workflow.yaml`의 `agent`(기본 lophn)의 할당과 받는 domain으로 거른다.
    by: agent
  - text: |
      job을 만든 쪽은 (agent, place)이고 agent는 같은 쌍이 만든 job만 다룬다. CLI `lophn run`은 agent 이름과 `--project`·`--app`을 받는다.
    by: agent
  - text: |
      project sidebar와 앱 agent select는 모든 agent를 보인다(가장 단순하다). 많아져 불편하면 그때 줄인다.
    by: agent
  - text: |
      계약은 일부만 옛 꼴 옆에 두었다(agent 정체, 정의, 할당, session 열기, call 주소). event, snapshot, run, job, workflow는 소유 task가 제자리에서 바꿨다. wave 2를 main에 올리지 않고 wave 3과 함께 올렸다. 옛 route를 부르는 화면·알림·e2e·eval·CLI가 wave 3까지 남아 e2e가 깨지기 때문이다.
    by: agent
  - text: |
      이름에서 role 낱말을 뺐다(`guide-agents-and-assignments`, prompt 층 `place_kind`, module `agent-places`). 끝남 grep이 role이라는 뜻을 남기지 않는다.
    by: agent
  - text: |
      `coding_agent` actor와 `cac` id 접두는 죽은 코드라 지웠다. trace와 usage의 role 거르기도 대신할 것 없이 지웠다.
    by: agent
  - text: |
      domain 지도의 할당 기준 사용 관계는 정의에서 `domains`를 직접 고른 agent의 것만 센다. 고르지 않은 agent를 할당만으로 세면 모든 domain을 쓰는 것처럼 나온다. place 정보의 agent 목록은 이름만 싣는다.
    by: agent
  - text: |
      role이 주제인 test는 지웠고(`operator_test`, `pm-tools_test`, `operator-place_test`), 그 안의 권한 경계 검사(뺀 tool, 할당 없는 agent, 도중 할당 변경, domain 좁히기, 만들기 tool이 할당·MCP·skip을 못 줌, route 상한이 자기 tool을 막던 bug)는 `app-call_test`와 `session_test`로 옮겼다. 새 e2e는 만들지 않았다.
    by: agent
  - text: |
      eval: 진짜 model은 정의가 아니라 시험하는 session에 붙인다. 정의에 붙이면 call로 열린 같은 lophn의 다른 place session도 model을 받는다. `tests/eval/registry/`와 지난 기록(`runs/`, scorecard, `experiments/`)은 고치지 않았다. 다음 진짜 run이 새 이름(`instruction:home|project|app`, `tool:agent.create|update`)의 항목을 만든다.
    by: agent
  - text: |
      wave 3 일부와 wave 4는 worker 없이 lead가 직접 했다.
    by: person
follow_up: |
  - 개발 data(`.dev-data/`)는 지우고 새로 만든다(schema가 바뀌었다). 사람의 `~/.lophn`에 있는 옛 role 정의·session은 읽지 않는다.
  - 제품 문서는 planner가 `wrap-plan`으로 고친다: `PRODUCT.md` 3·6절, `products/AGENT-ROLE.md` → `products/AGENT.md`, `context-component-registry.yaml`의 그 path와 `wrap-plan` skill의 언급.
  - 알려진 미완: 런처 패널이 lophn 전용이라 사람이 만든 agent의 home session이 lophn 얼굴로 보인다(`issues/shell.md`). 전역 skills 목록이 다른 place의 skill을 잃는다(`issues/agent-definition.md`).
