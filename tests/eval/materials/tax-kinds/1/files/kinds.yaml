kinds:
  - name: receipt
    summary: A receipt kept for the tax return
    files: [receipts/*.md]
    key: slug
    fields:
      slug: { type: string, required: true, pattern: "^[a-z0-9-]+$" }
      store: { type: string, required: true }
      amount: { type: number, required: true }
      date: { type: date, required: true }
