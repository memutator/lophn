id: successful-tool-call-stays-requested
title: 성공한 tool call이 ledger에 `requested`로 남는다
kind: bug
status: fixed
topic: workspace-session
modules: [packages/core/lophn-agent]
now: '`packages/core/lophn-agent/run-loop/core-ports.ts`의 `attemptTool`은 `record`(state `requested`) 뒤 tool을 실행하고 곧바로 `finishToolCall`을 `{state_seq: "0"}`로 부른다. 그 사이 `decideToolCall`·`startToolCall`을 부르지 않는다(production 코드에서 두 command를 부르는 곳이 없다. `run-loop/runtime-access.ts`의 허용 목록에만 있다). `packages/core/lophn-agent/tools/commands.ts`의 finish는 `requested`에서 success로 끝내기를 `conflict("a requested call cannot finish as success")`로 거절하고, `attemptTool`은 그 결과를 보지 않는다. failure·not_executed는 requested에서 끝낼 수 있어 기록된다. 그래서 성공한 call만 `state: requested`, `decision: null`, `outcome: null`, `output: null`로 남는다. `tests/e2e/file-write_test.ts`와 `tests/e2e/approval_test.ts`가 재현한다(disk에는 file이 쓰였고 model의 다음 요청에도 success 결과가 간다).'
impact: rewind preview의 `externalFacts`(`session/rewind/preview.ts`)는 `outcome.kind = 'success'`인 external call만 세므로, 성공한 외부 요청이 "되돌릴 수 없는 효과"로 사람에게 보이지 않는다. 성공한 tool 결과 blob(`tool_call_output`)이 ledger에 이어지지 않아 `turn-body-reads.ts`로 결과를 다시 읽을 수 없고, observability(`observability/reads.ts`)가 성공한 call을 미완으로 보여 준다.
fix: |
  - decide·start를 부른다(작음): `attemptTool`이 record 뒤 이미 내린 결정으로 `decideToolCall`을, 실행 직전에 `startToolCall`을 부르고, finish의 `compare`를 그 뒤 `state_seq`로 준다. 셋 중 하나라도 실패하면 버리지 않고 uncertain으로 닫는다.
  - finish가 requested에서 success를 받게 한다(작음): decision과 started_at이 비어 command의 상태 전이와 어긋난다.
  - 추천: decide·start를 부른다. command 쪽 규칙이 설계다.
closed: '`attemptTool`(`run-loop/core-ports.ts`)이 Gate 판정 뒤 handler가 돌기 직전에 `decideToolCall`(allow, reason `gate_run`·`no_gate`)과 `startToolCall`을 부르고, finish의 `compare`를 그 뒤 `state_seq`로 준다. 셋 중 하나가 실패하면 그 call을 uncertain으로 닫는다. Gate가 거절하거나 실행하지 않은 call은 전처럼 finish만 한다.'
guard: tests/e2e/file-write_test.ts, tests/e2e/approval_test.ts
