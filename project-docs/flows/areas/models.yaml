      - "같은 id가 있으면 conflict다. api_key면 credential 이름이 provider.<id>여야 한다. 다른 이름이면 invalid_input이다(다른 이름의 secret이 endpoint로 가는 것을 막는다)"
      - "같은 id가 없으면 provider 줄과 credential 줄을 함께 쓴다. revision은 1이고 연결 시각을 남긴다. 저장 모양 검사에 걸리면 internal이다"
