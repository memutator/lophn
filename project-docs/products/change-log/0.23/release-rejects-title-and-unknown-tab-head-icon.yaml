id: release-rejects-title-and-unknown-tab-head-icon
version: 0.23.2
title: "release 준비가 title 속성과 목록에 없는 tab-head icon 이름을 거절한다"
modules: [packages/core/apps, packages/sdk, packages/core/agent-workspaces]
checked: []
change: |
  전: 앱 agent가 소문자 JSX 요소에 HTML `title=`을 달아 브라우저 기본 tooltip이 떠도, `useTabHead` action의 `icon`에 목록에 없는 이름(`"reload"`)을 써도 release가 그대로 나갔다(build는 esbuild라 type을 보지 않고, shell은 모르는 icon을 조용히 버린다).
  후: release 준비가 commit한 source(`node_modules`와 `.lophn/sdk/` 제외)를 훑어 거절한다. 결과는 status failed, stage build이고 reason이 file:line을 말한다.
  - `.tsx`·`.jsx`의 소문자 intrinsic 요소(`<button title=…>`)의 `title` 속성 -> `@lophn/ui/overlay`의 `Tooltip`을 쓰라고 안내한다. `<iframe title>`, 대문자 component의 prop, SVG `<title>` 요소는 거절하지 않는다.
  - `@lophn/app-ui`를 가져오고 `useTabHead`를 쓰는 파일의 `actions: [` 배열 아래 object에서 문자열 literal `icon`이 `TAB_HEAD_ICONS`(shell과 같은 상수)에 없으면 허용 이름을 열거해 거절한다.
  SDK: `@lophn/app-ui` 2.12.0(guide에 Tooltip 한 줄과 icon 거절 한 줄), `design-app` skill에 Tooltip 한 줄. `migrate-sdk`의 `app-ui-2.12.0.md`가 Instruction diff를 싣는다. 앱은 source에서 `title=`을 `Tooltip`으로, 목록 밖 icon을 목록의 이름으로 바꾼다. 저장 data는 바뀌지 않는다.
why: 앱 agent가 되풀이하는 두 실수를 release 전에 잡는다.
decisions:
  - text: >-
      JS parser 없이 가볍게 훑는다(typescript 7은 JS AST API가 없다). 놓치는 쪽을 택해, 모양이 분명하지 않은 것(`icon: cond ? "a" : "b"`, 변수로 만든 actions)은 넘긴다. 버린 길: 새 parser 의존성 추가.
    by: agent
  - text: >-
      지침은 `design-app`과 app-ui guide 둘 다에 한 줄씩 둔다. Tooltip은 `@lophn/ui` 부품이지만 판은 app-ui 하나만 올린다. 버린 길: `@lophn/ui`를 올리기(app-ui pin까지 따라 올라간다).
    by: agent
