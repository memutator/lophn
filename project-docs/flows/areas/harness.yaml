    boundary: [host-queue-interface, host-queue-core, harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/shell/main/terminal/harness-tui.ts
    steps:
      - "host-tab-open과 같은 판정을 거친다. 사람 token이면 invalid_input, session이 없거나 닫혔거나 다른 workspace면 not_found"
      - "harness session이 아니거나 project workspace가 아니면 invalid_input. home과 app은 터미널이 없다"
      - "CLI session id가 아직 없으면(첫 turn 전) conflict. turn이 돌거나 이미 hold되어 있어도 conflict"
      - "통과하면 그 자리에서 30초 hold를 예약하고 resume 값(adapter id, CLI session id)을 tab_open 요청에 싣는다"
      - "shell host가 터미널 탭을 열고 CLI resume 명령을 친다. 탭이 있는 동안 그 session의 headless turn은 시작하지 않는다"
    outcomes:
      - id: accepted
        observe: [response, process:cli-tui]
      - id: not_found
        code: not_found
        when: "호출 session이나 대상 session이 없거나 닫혔거나 다른 workspace다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "대상이 harness session이 아니거나 project workspace가 아니다. 또는 사람 token이 불렀다(사람 token은 browser·preview·artifact 탭만 연다)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "CLI session id가 없거나, turn이 돌거나, 이미 hold되어 있다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "TUI가 끝내 뜨지 않으면 사람이 탭을 닫을 때까지 hold가 남는다. 그 release 경로는 system:harness-tui-hold가 맡는다"

  - id: host-tab-close
    title: agent나 사람 token이 자기가 연 탭을 닫는다
    actor: agent
