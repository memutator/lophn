id: installed-app-declared-dependencies
version: 0.10.3
title: "설치본에서 앱이 뜬다: package 의존을 package.json에 선언하고, 설치본 workspace를 선언에서 정한다"
modules: [packages/core/apps, packages/protocol, packages/sdk, tools]
checked: []
change: |
  전:
  - .deb 설치본에서 모든 앱의 release 준비가 handlers: exited before ready로 끝났다. 앱 진입점이 @lophn/cap-problem을 이름으로 불러오는데 설치본 platform/node_modules/@lophn에 그 link가 없어, 앱 process가 Cannot find package '@lophn/cap-problem'로 바로 죽었다. preview 자식의 stderr는 버려서 log에 남지 않았다.
  - 원인: tools/package-linux.ts가 설치본 workspace를 base, protocol, core, coding-agent로 손으로 적었고, core의 package.json은 쓰는 @lophn/*를 선언하지 않았다. dev에서는 root workspace가 모든 package를 끌어올려 우연히 풀렸다. 진입점이 이름을 변수에 넣어 import()해 type check와 lint도 보지 못했다.
  후:
  - 앱 진입점은 createExceptionObserver를 @lophn/cap-problem에서 정적으로 import한다. check-deps는 core 중 apps/runtime/entrypoint만 이 SDK를 쓰게 둔다.
  - 각 package의 package.json이 쓰는 workspace package를 선언한다(core, coding-agent, protocol, cap-problem, shell renderer, wireframes. shell preload는 electron peer). Biome noUndeclaredDependencies가 선언 없는 bare import를 막는다.
  - package-linux는 package-lock.json에서 core와 coding-agent의 @lophn 의존을 따라가 설치본 workspace를 정한다. 지금은 base, coding-agent, core, protocol, sdk/cap-problem이다.
  - verify-linux-install이 설치된 Electron의 Node로 앱 진입점을 import해 본다.
  - SDK 설치 사본은 vendor로 담은 package(@lophn/protocol)를 사본 package.json 의존에서 뺀다. cap-problem 사본은 전과 같은 모양이다.
why: |
  사람의 my-usage 앱이 미리보기와 운영 배포 모두 뜨지 않았다. 설치본은 이 판에서 어떤 앱도 띄우지 못했다.
decisions:
  - text: "설치본 workspace 목록에 하나를 더하거나 진입점을 상대 경로로 바꾸지 않고, 선언을 정본으로 둔다. 손 목록은 선언과 다시 어긋난다."
    by: person
  - text: "상대 경로로 다른 package를 import하는 곳(core → base·protocol 등)은 이번에 바꾸지 않는다. 그 package도 이제 선언돼 설치본에 실리고, 바꾸면 범위가 크다."
    by: agent
follow_up: |
  설치본을 다시 만들어 깔고(dpkg -i), my-usage release를 다시 준비한다.
