id: multi-device-fixes
version: 0.23.88
title: 올라간 multi-device 일들의 review에서 확인한 구멍을 닫는다(터미널 입력 자격, 명단의 믿음 규칙, 기기 허락의 가장자리, git을 읽지 못한 project의 id)
modules: [packages/protocol, packages/core/remote, packages/core/terminals, packages/core/terminal-agents, packages/core/extensions, packages/core/projects, packages/core/secrets, packages/core/config, packages/core/lophn-agent, packages/core/apps, packages/core/storage, packages/core/main, packages/remote-client, packages/cli, packages/shell/main, packages/shell/ipc, packages/shell/preload, packages/shell/renderer, packages/design, packages/mobile, tools]
change: |
  review(`reports/multi-device/review-*.md`)가 code에서 확인한 것을 고쳤다.
  - "터미널: `terminals/open`의 `command`·`resume`은 `terminals/input`과 같은 자격을 본다. 터미널 입력 허락이 없는 기기는 빈 터미널만 연다(전에는 허락 없이 한 줄을 돌릴 수 있었다). 허락받은 기기는 그 기계의 어느 터미널에나 친다. 터미널의 질의 응답은 그 창이 그 터미널을 보이고 있을 때만 core로 간다(새 IPC `shell:terminal-shown`, 창마다 보이는 화면 수를 센다). extension이 띄우는 CLI는 core의 내부 env(`LOPHN_*`, `ELECTRON_*`, `NODE_CHANNEL_FD`)를 물려받지 않는다. 모르는 `resume.harness`(`toString` 같은 이름 포함)는 internal 오류 대신 거절된다. mac packaging이 node-pty의 `spawn-helper`에 실행 권한(0755)을 준다. core의 run 폴더 정리가 옛 판 shell이 남긴 죽은 `shell-<pid>` 폴더도 지운다. Agent SDK 의존이 shell main에서 core로 옮겨졌다."
  - "다른 기계 부르기: `machines/call`·`machines/watch`는 입력의 `shell_capability`가 이 core가 shell main에 준 살아 있는 capability일 때만 넘기고, capability는 다른 기계로 보내지 않는다(`createMachineRoutes`를 remote wiring이 쓴다). 사람의 CLI token으로는 다른 기계를 부르지 못한다(전에는 허락받은 컴퓨터를 거쳐 다른 기계의 사람 route와 자동 확인에 닿았다)."
  - "기기 허락의 가장자리: 기기 자격은 `secrets/put|delete`로 site login vault(`login.`) 이름을 쓰거나 지우지 못하고, `settings/update`로 `remote.*`를 바꾸지 못하며(같이 보낸 다른 바꿈도 쓰지 않는다), browser로 돌아와야 하는(loopback) 구독 로그인을 시작하지 못한다(device code만). 기기가 시작한 구독 로그인은 끝나기 전에 그 기기의 터미널 입력 허락이 꺼지면 provider를 잇지 않고 token을 버린다. 사람 route와 확인 붙이기는 actor user인 기기 자격에만 한다. 기기 호출의 오류가 `details`를 싣는다(이슈 `remote-call-errors-drop-details`). agent의 provider 요청으로 잇는 provider도 key 연결과 같은 id 규칙을 쓴다(끊은 정의를 다시 이으면 같은 id). 기동 때 연결 중에 죽어 남은 임시 provider secret(`provider.<id>.new.*`)을 지운다."
  - "명단: 쓰인 초대장은 그것으로 든 기기를 빼도 쓰인 것이다. 빼기는 body의 key와 서명 key로만 빼고 id는 읽지 않는다(남의 id를 실은 빼기가 그 기기를 지우지 못한다). 서명자의 host key는 그 서명 key로 스스로 서명한 항목에서만 얻는다. 지금 믿지 않는 쪽(모르는 서명자, 빠졌거나 엇갈린 서명자)이 서명한 것은 `ROSTER_UNKNOWN_MAX`(512) 상한 아래에만 남고 믿는 컴퓨터의 것을 밀어내지 못한다. 어느 항목에도 없는 key의 빼기도 버리지 않고 상한 안에 둔다(버리면 닿은 순서가 엇갈림의 결과를 바꾼다). 엇갈린 빼기에 걸린 key는 `roster/list`에 `disputed`와 `key`로 보이고 사람이 `roster/remove {key}`로 다시 빼면 그 컴퓨터의 빼기가 되어 풀린다(`roster/remove`는 `{id}`나 `{key}` 하나를 받고, id가 두 줄에 맞으면 `conflict`, 이 컴퓨터의 key나 서명 key면 `invalid_input`). 엇갈린 줄의 이름과 id는 지금 믿는 서명자가 서명한 항목에서, 없으면 그 key를 뺀 빼기가 말하는 서명 key로 스스로 서명한 항목에서만 온다. 컴퓨터는 `roster/leave`를 부르지 못한다. 폰의 view: 저장한 컴퓨터가 서명한 빼기는 다른 저장한 컴퓨터가 서명한 빼기가 그것을 공격하지 않는 한 처음부터 효력이 있다. 폰에는 정해지지 않은 빼기에서 빠지지 않는 예외가 없고, 엇갈린 저장한 컴퓨터는 지우지 않고 `disputed`로 남겨 잘린 것으로 보이며 붙지 않는다(그 `request`에 답하지 않고 위젯 갱신도 묻지 않는다). 저장한 컴퓨터는 정해진 빼기로만 지운다. `lophn remote devices`가 key와 `disputed`를 보이고, lophn 터미널 탭 안(`LOPHN_SESSION_ID`가 `term:`)에서는 `lophn remote invite|join|remove`가 core에 붙기 전에 `forbidden`이다. remote protocol 판 4(하한 4)."
  - "저장: 폰 하나의 id 둘을 모으는 고침은 명단을 저장할 때마다 `shell.devices`에 다시 적용된다. `roster/store`가 view의 기기 이름을 기기 행의 `alias`에 두어 앱이 받는 폰 target의 이름과 기기 표 읽기가 명단의 이름이다. 기기 행은 정해진 빼기가 뺀 key와 서명한 항목이 남지 않은 key에서만 지운다(엇갈림으로 빠진 폰의 행은 남는다)."
  - "project: git이 답하지 않는데 폴더나 그 위에 `.git`이 있으면 그 project의 저장소 종류와 id를 쓰지 않는다(`unavailable`). data step `projects.born-identity`도 그런 project를 건너뛴다. `DataStep.run`은 deps를 꼭 받는다."
  - "기록: 옛 shell 경로를 가리키던 이슈 일곱의 path를 지금 code에 맞췄고, core로 옮기며 풀린 `gui-handoff-copies-adapter-table`(handoff 표가 protocol 한 곳)과 `shell-copies-protocol-types-for-tsconfig`(베낀 type이 없어짐)를 fixed로 닫았다. flow catalog, boundary·module catalog의 옛 shell 의존과 harness host 설명을 고쳤다."
why: |
  순서 1~3(가리키는 법, `device-roster`, `core-terminals`, `core-setup`)을 올린 뒤의 review가 권한 경계가 뚫린 곳과 명단 규칙의 구멍을 찾았다. 다음 계획(`one-screen`, `carry-paths`, `remote-use`)이 이 위에 서고, `carry-paths`는 폰과 폴더로 명단 항목을 나르므로 먼저 닫았다.
decisions:
  - text: "터미널 입력을 허락받은 기기는 그 기계의 어느 터미널에나 친다. 보이는 터미널로 좁히지 않는다. 그 허락이 그 기계를 온전히 다루는 권한이다."
    by: agent
  - text: "다른 기계를 부르는 route는 그 기계의 화면(shell)만 부른다. CLI에서 다른 기계를 부르는 것은 `remote-use`가 요청한 쪽을 실어서 연다."
    by: agent
  - text: "허락이 있어도 기기에 열지 않는 것: 기기·명단 관리, `remote.*` 설정, site login vault 이름. provider의 key와 token 이름은 막지 않는다(허락받은 기기는 key를 바꾸고 끊을 수 있어 더 열리는 것이 없다)."
    by: agent
  - text: "명단의 컴퓨터는 서로 대등하다. 어느 컴퓨터나 항목에 서명하므로 컴퓨터 하나가 뚫리면 명단 전체가 뚫린 것으로 본다. 컴퓨터의 터미널 입력 허락은 정직한 code에만 묶이고, 폰의 허락은 폰이 서명하지 못하므로 지켜진다. 고치지 않고 `architecture/remote.md`에 적었다(사람이 고른 방식 1의 성질)."
    by: agent
  - text: "엇갈린 빼기는 사람이 그 컴퓨터에서 다시 빼서 푼다. 시각 없이는 누가 먼저 뺐는지 가릴 수 없다. 버린 길: 폰이 저장한 컴퓨터들의 다수결이나 만장일치를 따르기(도둑이 믿는 동안 들인 가짜 컴퓨터로 폰을 가져간다. review에서 확인), 엇갈린 컴퓨터에 명단만 받으러 붙기(그 연결이 그 컴퓨터의 요청에 답한다)."
    by: agent
  - text: "폰에서는 저장한 컴퓨터가 서명한 빼기가 다른 저장한 컴퓨터의 맞빼기가 없으면 효력이 있다. 이것이 없으면 도둑의 맞빼기 하나로 모든 폰이 정직한 컴퓨터와 영영 끊겼다. 도둑의 컴퓨터를 저장한 폰이 멈추거나 따르는 경우는 이슈 `phone-roster-dispute-saved-thief`로 남겼고 다시 들이기가 푸는 길이다."
    by: agent
  - text: "core가 죽을 때 남는 extension CLI는 이 일에서 고치지 않았다. Linux에서 남는 것을 확인해 이슈 `extension-cli-outlives-core-crash`로 올렸다. 버린 길: 모든 harness CLI 앞에 watchdog process를 끼우기(adapter의 stdio 길을 다 바꾼다)."
    by: agent
follow_up: |
  - 열린 이슈: `project-born-identity-before-git-read`(이 고침 전에 git project에 잘못 붙은 id), `dev-terminal-cli-reaches-real-root`, `extension-cli-outlives-core-crash`.
  - 명단의 남은 한계: `phone-roster-dispute-saved-thief`(도둑의 컴퓨터를 저장한 폰), `roster-disputed-rows-same-name`(이름이 같은 엇갈린 두 줄), `roster-capped-slots-held-by-removed-signer`(빠진 서명자의 쓰레기가 상한을 채움), `roster-full-frame-view-slow`(상한까지 찬 frame의 첫 view, 폰에서 재지 않음). 나머지는 `architecture/remote.md` "열린 것".
checklist:
  - "해야: 폰 앱을 update한다 (remote protocol 판 4. 판이 다른 기기는 붙지 못한다)"
  - "해야: 내 컴퓨터들을 모두 이 판으로 올린다 (판이 섞이면 서로 붙지 못한다)"
  - mac 설치본에서 터미널 탭이 열리는지 본다 (packaging이 실행 권한을 주게 고쳤고 mac에서 돌려 보지 못했다)
  - 터미널 입력 허락을 끈 폰에서 새 터미널은 열리지만 명령을 실어 여는 것(coding agent 새 session)은 거절되는지 본다
  - 컴퓨터 둘과 폰 하나로 초대하고 빼 본다. 한 컴퓨터에서 뺀 기기가 다른 컴퓨터의 My devices에서도 빠지는지 본다
  - 엇갈린 기기가 생기면(두 컴퓨터가 서로 뺐다) My devices의 "Disputed" 줄에서 믿지 않는 쪽을 다시 빼고 다른 쪽이 돌아오는지 본다
