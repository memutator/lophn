      - "같은 탭 key의 창이 있으면 앞으로 가져온다"
      - "없으면 opener 창 가운데 features 크기로 새 detached 창을 열고 popup view를 그 창으로 옮긴다(window.opener를 지킨다)"
      - "보낸 창이 detached였으면 project 창에 opened 이벤트를 보내고, project 창이 layout에 detached 항목을 더해 저장한다"
