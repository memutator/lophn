  - path: packages/protocol/apps/sync/converge_test.ts
    covers: []
    note: "sync core 수렴. 같은 base의 컴퓨터·폰과 두 순서로 받은 replica 둘의 data dump와 clock dump가 같다(같은 칸, 다른 칸, 두 번 적용, delete와 update, 한 id의 insert, 묘비와 insert, 값 type, PK 셋). 폰 write가 clock 없이 outbox에 있을 때 들어온 변경도 찍기 먼저라 수렴한다. delete·다시 insert·칸 update가 두세 node에서 섞여도 받는 모든 순서에서 같고, delete보다 새 칸 값은 row가 돌아올 때 남는다. 시계가 뒤로 가도 clock은 늘고, 앞선 clock 판정(clockAhead)과 decodePk가 encodePk의 반대다. 아직 sync route가 없어 outcome이 없다"

