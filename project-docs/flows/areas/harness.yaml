  # ---- agent가 연 browser·preview·artifact 탭을 CDP로 다루는 호출 ----
  - id: host-browser-inspect
    title: agent나 사람 token이 자기가 연 browser·preview·artifact 탭의 접근성 tree, screenshot, console 줄을 읽는다
    actor: agent
    entries: [route:browser/snapshot, route:browser/screenshot, route:browser/logs]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/queue.ts
      - packages/protocol/lophn-agent/host-queue.ts
      - packages/shell/main/browser/agent/driver.ts
    steps:
      - "agent 자격의 session이나 사람 token이 부른다. 남이 연 탭이거나 없는 탭이거나 session·agent 탭이면 not_found다(주인 대조가 shell 판정보다 앞선다)"
      - "shell이 붙어 있지 않으면(/host-link 연결이 없으면) unavailable이다"
      - "browser_call 요청을 queue에 넣고 shell main의 결과를 기다린다. 1초마다 shell이 떨어졌는지와 30초 기한을 본다"
      - "shell이 done에 실은 결과의 글 조각은 caller에 가기 전에 core의 known-value redaction을 거친다(act, navigate, evaluate, wait도 같다). 알려진 값을 아직 다 모르면 unavailable이다. 그 뒤 모양으로 펴 돌려준다: snapshot과 logs는 글, screenshot은 PNG 하나. 모양이 맞지 않으면 internal"
      - "shell 쪽 실패(탭이 창에 없음, DevTools 열림, page 무응답)는 browser-call-run의 code 그대로다"
    outcomes:
      - id: ok
        when: "snapshot은 접근성 tree 글, screenshot은 PNG, logs는 최근 200줄이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 사람이 손으로 연 탭이거나 없는 탭(닫혔거나 page가 없어져 표에서 빠진 탭, shell이 없을 때의 browser 탭 포함)이거나 session·agent 탭이다. 같은 고정 문장이고 model이 그대로 받아 탭을 다시 열게 한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나(preview·artifact 탭), 호출 도중 떨어졌거나, 30초 기한이 지났거나, 탭이 창에 열려 있지 않거나(preview·artifact 탭, browser 탭은 page가 막 사라진 틈), page가 답하지 않거나, 가려진 탭이라 screenshot이 그려지지 않았다(최소화하거나 숨긴 창 포함), 알려진 secret 값을 아직 다 모르는 동안이라 redaction을 끝내지 못했다. queue가 가득 차도 같다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 탭에 DevTools가 열려 있거나 다른 debugger가 붙어 있다"
        observe: [response]
      - id: internal
        code: internal
        when: "shell 결과에 글이나 이미지가 없다(core가 모양을 펴지 못한다). shell의 예상 밖 예외도 같다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]

  - id: host-browser-wait
    title: agent나 사람 token이 자기가 연 탭에서 text나 url이 맞기를 기다린다
    actor: agent
    entries: [route:browser/wait]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/shell/main/browser/agent/driver.ts
    steps:
      - "host-browser-inspect와 같이 주인을 대조한다. text와 url 가운데 정확히 하나가 아니면 invalid_input이다"
      - "shell이 붙어 있으면 timeout_ms(기본 10초, 최대 25초) 안에 맞기를 기다리는 browser_call을 넣는다"
      - "shell이 200ms마다 page를 보고, 맞으면 그때의 url과 title(열린 dialog를 닫았으면 그 내용)을 돌려준다"
      - "시간 안에 맞지 않으면 unavailable이다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 사람이 손으로 연 탭이거나 없는 탭(닫혔거나 page가 없어져 표에서 빠진 탭, shell이 없을 때의 browser 탭 포함)이거나 session·agent 탭이다. 같은 고정 문장이고 model이 그대로 받아 탭을 다시 열게 한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "text와 url을 둘 다 주었거나 둘 다 주지 않았다"
        observe: [response]
      - id: timeout
        code: unavailable
        when: "timeout_ms 안에 조건이 맞지 않았다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나(preview·artifact 탭), 호출 도중 떨어졌거나, 30초 기한이 지났거나, 탭이 창에 열려 있지 않거나(preview·artifact 탭, browser 탭은 page가 막 사라진 틈), page가 답하지 않는다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 탭에 DevTools가 열려 있거나 다른 debugger가 붙어 있다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md]

  - id: host-browser-act
    title: agent나 사람 token이 자기가 연 탭에서 조작하거나 이동하거나 script를 돌린다
    actor: agent
    entries: [route:browser/act, route:browser/navigate, route:browser/evaluate]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/host-queue.ts
      - packages/shell/main/browser/agent/driver.ts
      - packages/shell/main/browser/agent/keys.ts
    steps:
      - "host-browser-inspect와 같이 주인을 대조한다. act는 type별 칸을 다시 검사하고, navigate는 preview·artifact 탭이면 거절하고 url이 http·https·about:blank인지 본다"
      - "shell이 붙어 있으면 browser_call을 넣고 결과를 기다린다. 사람이 그 탭을 가져가(take control) 있으면 shell이 conflict로 거절한다"
      - "act는 ref가 가리키는 node에 click, type, fill, press, hover, select, scroll을 하고 page가 가라앉기를 기다린 뒤 url, title을 돌려준다. 낡은 ref는 conflict다"
      - "act fill_login은 login id가 있는지 core가 먼저 본다(없으면 not_found). queue 항목에는 login id만 싣는다. field가 username이면 core가 metadata의 글을 fill로 바꿔 넣고, password·totp는 shell main이 값을 받아 친다(browser-call-run). 결과는 url, title과 filled: true이고 값은 없다"
      - "navigate는 이동하고 가라앉기를 기다린다. evaluate는 page에서 식을 돌려 JSON 값을 돌려준다. page 안의 예외는 오류가 아니라 exception 글이다"
    outcomes:
      - id: ok
        when: "act와 navigate는 url과 title(닫은 dialog가 있으면 그 내용), evaluate는 value다"
        observe: [response]
      - id: exception
        when: "evaluate한 식이 page 안에서 예외를 냈거나 값이 너무 크다. 오류가 아니라 응답의 exception 글이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 사람이 손으로 연 탭이거나 없는 탭(닫혔거나 page가 없어져 표에서 빠진 탭, shell이 없을 때의 browser 탭 포함)이거나 session·agent 탭이거나, fill_login의 login id가 없다. 같은 고정 문장이고 model이 그대로 받아 탭을 다시 열게 한다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사). fill_login의 값을 받을 때 frame의 origin이 저장된 origin과 다르거나 origin이 없는 frame이어도 같다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "act의 type에 맞지 않는 칸, preview·artifact 탭의 navigate, http·https·about:blank 밖의 url, 모르는 key 이름, ref의 node가 그 조작을 받지 못한다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "낡은 ref(새 snapshot이나 main frame 이동 뒤), 사람이 그 탭을 가져가 있음, DevTools가 열려 있거나 다른 debugger가 붙어 있다, fill_login이 치는 동안 그 frame이 이동했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나(preview·artifact 탭), 호출 도중 떨어졌거나, 30초 기한이 지났거나, 탭이 창에 열려 있지 않거나(preview·artifact 탭, browser 탭은 page가 막 사라진 틈), page가 답하지 않거나, 이동이 실패했다"
        observe: [response]
      - id: internal
        code: internal
        when: "shell 결과를 JSON으로 펴지 못한다. shell의 예상 밖 예외도 같다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]

  - id: host-phone-drive
    title: agent나 사람 token이 자기가 연 phone 탭의 폰 화면을 snapshot·screenshot·read·wait·act로 보고 다룬다
    actor: agent
    uses: [route:browser/snapshot, route:browser/screenshot, route:browser/read, route:browser/wait, route:browser/act, route:browser/navigate, route:browser/evaluate, route:browser/logs]
    pre: [host-phone-tab-open:accepted]
    when: "탭이 phone 탭일 때. shell queue를 거치지 않고 core가 폰 link(drive.*)로 묻는다"
    boundary: [host-queue-interface, host-queue-core, remote]
    code:
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/core/host-queue/phone.ts
      - packages/core/host-queue/queue.ts
      - packages/core/apps/views/mod.ts
      - packages/core/remote/phone-link.ts
      - packages/protocol/phone/drive.ts
    steps:
      - "host-browser-inspect와 같이 주인을 대조한다(남의 탭·없는 탭은 같은 not_found 문장). shell이 붙어 있는지는 보지 않는다"
      - "navigate, evaluate, logs, wait --url, act hover·select·fill_login, Enter 밖의 press는 폰에 묻지 않고 invalid_input(phone 탭이 되는 것을 적은 정한 문장)이다"
      - "부를 때마다 view 표에서 kind phone인 기기가 연 그 앱의 preview view(탭에 screen이 있으면 그 화면의 것) 가운데 가장 최근 쓴 것을 고른다. 없으면 폰에 묻지 않고 unavailable(notShowing)이다. read는 여기서 폰에 묻지 않고 {url: phone://<app>/<screen>, title: <screen>, loading: false}를 돌려준다"
      - "act는 마지막 snapshot이 지금 고른 view(같은 기기, 같은 view id)의 것이고 ref가 그 표에 있어야 한다. 아니면 폰에 묻지 않고 conflict(staleRef)다"
      - "그 기기에 ctx.phoneLink.call로 drive.snapshot·act·screenshot·wait를 묻는다. 입력에 view와 by(session agent의 보이는 이름, 사람 token이면 Someone on your computer)를 싣고, act에는 마지막 snapshot id와 node를 싣는다. deadline은 kind의 값, wait는 timeout_ms+5초다. 답은 kind의 output schema로 검사한다"
      - "snapshot은 탭마다 늘기만 하는 counter로 node마다 eN ref를 매기고 첫 줄 `screen <key> <w>x<h>dp`, 줄마다 desktop과 같은 말에 flag를 더해 쓴다(60000자에서 자르고 [truncated]). 그 ref 표가 탭의 마지막 표가 된다. screenshot은 기본 JPEG이고 media_type은 폰이 준 값이다. wait는 found가 false면 desktop wait와 같은 unavailable 문장이다. act·wait는 read와 같은 url·title을 돌려준다. snapshot 글과 url·title은 caller에 가기 전에 known-value redaction을 거친다(알려진 값을 아직 다 모르면 unavailable)"
      - "폰 오류는 이유로 정한 문장으로 바뀐다: phone_unreachable·no_preview → notShowing, phone_in_background·screen_off → notInFront, covered → covered(앱은 앞에 있는데 sheet·dialog·notification shade가 덮었다), unsupported → tooOld, timeout → timedOut(모두 unavailable). taken_over → takenOver, stale_ref → staleRef, off_screen → offScreen(모두 conflict). 그 밖은 code와 message를 그대로 둔다"
    outcomes:
      - id: ok
        when: "snapshot은 글, screenshot은 이미지, read·act·wait는 url과 title이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 없는 탭이다(host-browser-inspect와 같은 문장)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
      - id: unsupported
        code: invalid_input
        when: "phone 탭이 하지 않는 호출이나 act(navigate, evaluate, logs, wait --url, hover, select, fill_login, Enter 밖의 press)이거나 act·wait의 칸이 틀리다"
        observe: [response]
      - id: not-showing
        code: unavailable
        when: "기기가 연 그 앱의 preview view가 없거나, 폰이 연결되지 않았거나 그 view가 닫혔다고 답했다"
        observe: [response]
      - id: phone-unavailable
        code: unavailable
        when: "폰 앱이 앞에 없거나 화면이 꺼졌다, 무언가가 preview를 덮었다(covered), 폰 앱이 drive.*를 모른다, 폰이 기한 안에 답하지 않았다, wait의 글이 시간 안에 나오지 않았다, redaction을 끝내지 못했다"
        observe: [response]
      - id: stale-ref
        code: conflict
        when: "ref가 마지막 snapshot의 것이 아니거나 그 snapshot이 지금 고른 view의 것이 아니다(폰에 묻지 않는다), 폰이 그 snapshot을 낡았다고 답했다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "사람이 폰에서 take control 중이라 act를 거절했다, node를 화면 안으로 들이지 못했다"
        observe: [response]
      - id: internal
        code: internal
        when: "폰의 답이 그 kind의 output schema에 맞지 않는다"
        observe: [response]
    crosses_process: true
    risk: [sandbox, permission, secret]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: input-request-ask
    title: agent가 탭의 입력 칸(login)이나 secret 자리(provider key, custom provider, 앱 secret, MCP server)나 로그인 자리를 가리켜 사람에게 값을 넣거나 로그인해 달라고 요청하고 끝날 때까지 기다린다
    actor: agent
    entries: [route:input_request/ask]
    uses: [host-link:open, host-link:done, system:browser-call-run]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core, shell, secrets]
    code:
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/core/main/daemon/wiring/secret-slot.ts
      - packages/core/lophn-agent/tools/questions/wait.ts
      - packages/protocol/lophn-agent/input-request.ts
      - packages/protocol/lophn-agent/custom-provider.ts
      - packages/cli/commands/login.ts
      - packages/cli/commands/ask.ts
    steps:
      - "agent 자격(session 조건 있음)만 부른다. 사람이 없는 turn(unattended)이면 탭이나 자리를 보기 전에 {unattended: true}를 돌려준다"
      - "kind secret: agent는 secret 이름이 아니라 자리를 넘기고 core가 자리를 풀어 요청을 secret(값 넣기)이나 sign_in(로그인)으로 만든다. provider 자리(내장 정의 key)는 home session만 청한다. 정의가 API key를 가졌으면 기본이 API key이고(같은 정의의 provider가 이미 있으면 그 `provider.<id>`의 값 바꾸기, 없으면 새 id를 만들어 값 저장 뒤 보낼 연결 입력을 요청에 싣는다), sign_in을 주었거나 구독 로그인뿐인 정의면 로그인이다(이미 연결된 provider면 conflict). custom provider 자리(display_name, base_url, protocol)도 home만이고 Settings의 Custom 연결과 같은 규칙으로 주소를 검사한다: https 주소만(이 컴퓨터의 http 주소는 key가 없어 요청으로 만들 수 없다). 정의 key는 display_name에서 core가 만들고 내장 정의 key와 겹치면 안 된다. 앱 자리(app id와 이름)는 그 앱 workspace의 session이나 home session만 청하고, 그 앱의 active grant에 그 이름의 secret.use가 있어야 한다(OAuth를 선언했으면 로그인이고 client id가 아직 없으면 conflict). MCP server 자리(이름, 고를 때 part)는 등록된 server 중 이 session이 닿는 층만 본다: home은 전역·Home 층·자기 agent 정의 층, project·앱 session은 자기 agent 정의 층과 자기 workspace 층. 같은 이름이면 agent 층 > workspace 층 > 전역이 이긴다. http server가 가리키는 `mcp.` secret(header, bearer·api_key credential, oauth2 client credential)과 oauth2 로그인이 청할 것이고 stdio·청할 것 없는 server는 not_found, 청할 것이 여럿인데 part가 없거나 틀리면 invalid_input이 고를 목록을 준다. card에 보일 목적지(provider endpoint, 앱의 net.fetch grant, MCP server 주소나 발급자 origin)와 로그인 target은 core가 정의·선언·설정에서 읽는다. 요청을 같은 대기열에 세운다"
      - "kind login: 탭의 주인을 대조한다(host-browser-inspect와 같다). 남의 탭이면 not_found다"
      - "shell main에 browser_call frame_origin을 넣어 ref 요소가 든 frame의 origin을 CDP로 잰다(browser-call-run). agent가 적은 글이 아니고 최상위 URL도 아니다. 그 frame이 origin을 못 내면 forbidden이다"
      - "요청(mode, label, 잰 origin, 탭 제목)을 `ask`와 같은 session별 대기열에 세운다. 앞 질문이나 요청이 풀리면 열리고 QuestionAsked가 나간다. 대화는 질문 내용이 없는 대기 항목으로 보고 card를 그린다(input-request-card)"
      - "사람이 보호 창에서 끝내면(input-request-finish) 결과를 돌려준다: save는 {login: id}, once는 {filled: true}, secret은 {stored: true}, sign_in은 {signed_in: true}(card의 로그인이 끝난 뒤). Cancel, turn 끝, session 닫힘, 사람의 메시지는 {cancelled: true}다"
    outcomes:
      - id: saved
        when: "mode save를 사람이 보호 창에서 저장했다"
        observe: [response, "event:QuestionResolved"]
      - id: filled
        when: "mode once의 값을 shell main이 ref 칸에 쳤다(값은 응답에 없다)"
        observe: [response, "event:QuestionResolved"]
      - id: stored
        when: "secret 자리의 값을 사람이 보호 창에서 넣었다(새 provider 자리면 연결까지 됐다). 값은 응답에 없다"
        observe: [response, "event:QuestionResolved"]
      - id: signed-in
        when: "sign_in 요청의 로그인(구독 provider, 앱 OAuth, MCP OAuth)을 사람이 끝냈다. token은 응답에 없다"
        observe: [response, "event:QuestionResolved"]
      - id: cancelled
        when: "사람이 Cancel했거나 turn이 끝났거나 session이 닫혔거나 사람이 메시지를 보냈다"
        observe: [response, "event:QuestionResolved"]
      - id: unattended
        when: "사람이 없는 turn이다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "남의 탭이거나 없는 탭이거나 session·agent 탭이다. secret 자리가 없다(모르는 provider 정의, 없는 앱, 그 앱이 허락받지 않은 secret 이름, 설정에 없거나 이 session이 닿지 않는 층의 MCP server, 청할 것이 없는 MCP server)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent 자격이 아니거나 session이 없다. ref의 frame이 origin을 내지 못한다. home이 아닌 session이 provider·custom provider 자리를, 그 앱이나 home이 아닌 session이 앱 자리를 청했다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "낡은 ref, 사람이 그 탭을 가져가 있음, once를 칠 때 frame origin이 card에 보인 것과 달라졌거나 치는 동안 frame이 이동했다. 이미 다른 방식으로 연결된 provider에 요청했다(key로 연결된 provider에 로그인, 로그인으로 연결된 provider에 key). 앱 OAuth의 client id가 아직 없다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "shell이 붙어 있지 않거나 탭이 창에 열려 있지 않거나 origin 재기가 기한을 넘겼다. once 값을 알려진 값으로 올리지 못했다. 값은 저장했지만 provider 연결이 실패했다(값은 지운다. core가 낸 code를 그대로 돌려줘 다른 code일 수 있다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "ref나 mode 모양이 틀리다. kind login의 탭이 phone 탭이다. 로그인이 없는 정의에 sign_in을 청했거나 연결할 수 없는 정의다. custom provider의 주소가 https가 아니거나 이름이 내장 정의와 겹친다. MCP server가 청할 것이 여럿인데 part를 안 줬거나 목록에 없다"
        observe: [response]
    crosses_process: true
    risk: [secret, permission]
    docs: [architecture/browser-tab.md]
    unclear:
      - "한 번 넣은 값은 그 session이 끝날 때까지 알려진 값(redaction 입력)으로 붙든다. core가 재시작하면 기다림과 함께 사라진다"

  - id: input-request-card
    title: 사람이 대화의 입력 요청 card(login, secret, sign_in)를 읽거나 Cancel하거나 로그인한다
    actor: person
    entries: [route:input_request/read, route:input_request/cancel]
    boundary: [shell, host-queue-core]
    code:
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/shell/renderer/conversation/input-request-card/input-request-card.tsx
      - packages/shell/renderer/conversation/agent-tab-core-source-request.ts
      - packages/shell/renderer/desktop/settings/sign-in.ts
    steps:
      - "열린 요청이 있으면 대화가 질문 내용이 없는 대기 항목을 읽어 card를 그린다. login은 agent 이름, 탭 제목, shell main이 잰 origin(크게), mode다. secret은 agent 이름, 대상(provider, 앱, MCP server 이름), core가 읽은 목적지(크게), secret 이름, 이미 값이 있으면 바꾼다는 안내다. sign_in은 agent 이름, 대상, 로그인하는 곳(발급자 origin이나 endpoint)이다. 사람이 아닌 actor는 forbidden이다"
      - "card의 [Enter]는 session과 tool call만 shell main에 보내 보호 창을 연다(secret-input). 창은 이 클릭으로만 열린다. agent는 열 수 없다"
      - "sign_in의 [Sign in]은 card가 view의 target(core가 읽은 값)으로 지금 화면의 로그인 흐름을 돌린다: 구독 provider는 providers/sign-in {request}로 core가 로그인을 시작하고 기다리며 card는 OS browser를 열고(device code면 card에 code) providers/sign-in-state를 따라간다. 요청은 core가 signed_in이나 오류로 끝낸다(provider-login-finish). 앱 OAuth는 apps/oauth_begin → browser → oauth_state를 본다, MCP는 agent-mcp-auth/begin → browser → complete. 이 둘은 끝나면 card가 input_request/done {signed_in}을 부르고 실패하면 {error}를 부른다(input-request-finish). 로그인 중 [Cancel]은 시작한 로그인을 닫고 요청을 접는다"
      - "[Cancel]은 요청을 {cancelled: true}로 푼다. 이미 풀렸으면 not_found다"
    outcomes:
      - id: read
        observe: [response]
      - id: cancelled
        observe: [response, "event:QuestionResolved"]
      - id: not_found
        code: not_found
        when: "요청이 열려 있지 않다(풀렸거나 줄에 서 있고 아직 열리지 않았다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token이 아니다"
        observe: [response]
    crosses_process: true
    risk: [secret]
    docs: [architecture/browser-tab.md]

  - id: input-request-finish
    title: shell main이 보호 창의 입력으로, 대화 card가 로그인 결과로 입력 요청을 끝낸다(login 저장, once 값 붙들기, 결과 알리기)
    actor: shell
    entries: [route:input_request/hold, route:input_request/done]
    uses: [route:logins/save, route:secrets/put]
    boundary: [shell, secrets]
    code:
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/core/secrets/secret-store.ts
      - packages/shell/main/secret-input/request.ts
    steps:
      - "save: 창이 label, username, password, 선택 TOTP를 받는다. main이 logins/save(origin은 요청 때 잰 값)와 secrets/put으로 login.<id>.password·totp를 넣고 done {login}을 보낸다. 값을 넣지 못하면 방금 만든 login을 지우고 창에 오류를 보인다"
      - "once: main이 값을 hold로 core에 올려 그 session이 끝날 때까지 알려진 값으로 붙든다(파일·ledger에는 쓰지 않는다). 그 뒤 browser driver가 ref 칸이 든 frame의 origin을 다시 재서 card에 보인 것과 같을 때만 값을 친다. 다르거나 치는 동안 frame이 이동하면 치지 않고(또는 멈추고) done {error: conflict}를 보낸다. 성공이면 done {filled: true}다"
      - "secret 요청은 이 route가 아니라 input_request/answer_secret이 끝낸다(input-request-answer-secret)"
      - "sign_in: 보호 창이 아니라 대화 card의 로그인 흐름(input-request-card)이 끝나면 renderer가 done {signed_in}이나 {error}를 부른다(앱·MCP. 구독 provider는 core가 끝낸다). signed_in은 sign_in 요청에만, sign_in 요청은 signed_in이나 error만 받는다(아니면 invalid_input)"
      - "hold는 사람 token의 shell main만 부른다(renderer 통로에 없다). done은 사람 token(shell main, sign_in은 renderer)이 부른다. 열린 요청이 아니면 not_found다. hold는 once 요청에만 된다"
      - "붙든 값은 session이 끝나면 놓는다(SessionEnded)"
    outcomes:
      - id: held
        when: "once 값이 알려진 값으로 올랐다"
        observe: [response]
      - id: done
        when: "결과(login, filled, signed_in, error)를 기다리던 agent에게 돌려줬다"
        observe: [response, "event:QuestionResolved"]
      - id: not_found
        code: not_found
        when: "요청이 열려 있지 않다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "once가 아닌 요청에 hold를 불렀다. 요청 종류에 맞지 않는 결과로 done을 불렀다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "값을 알려진 값으로 올리지 못했다(reader에 닿지 않음)"
        observe: [response]
    crosses_process: true
    risk: [secret]
    docs: [architecture/browser-tab.md]

  - id: input-request-answer-secret
    title: 사람이 보호 입력에 넣은 값으로 agent의 secret 요청에 답한다(값 저장, 새 provider면 잇기)
    actor: person
    entries: [route:input_request/answer_secret]
    uses: [route:providers/connect]
    boundary: [secrets, models]
    code:
      - packages/core/lophn-agent/providers/connect-key.ts
      - packages/core/main/daemon/wiring/input-request.ts
      - packages/shell/main/secret-input/submit.ts
    steps:
      - "desktop은 보호 창(shell main), 폰은 native 입력이 값을 upload로 core에 바로 보낸다. 값은 화면 상태·IPC 결과·log에 남지 않는다. 사람 token(기기 포함)이 아니면 forbidden이다"
      - "입력과 body를 본다(길이, UTF-8). 열린 요청이 아니면 not_found, secret 요청이 아니면 invalid_input이다"
      - "view에 connect가 없으면 core가 자리에서 정한 이름에 값을 넣고 {stored: true}로 요청을 끝낸다. 넣지 못하면 unavailable이고 요청은 열린 채다(사람이 다시 넣는다)"
      - "새 provider 자리면 provider-connect-key와 같은 두 걸음이다: 값을 임시 이름에 넣고(못 넣으면 unavailable, 요청은 열림) 부른 사람의 context로 ConnectProvider를 보낸다. 연결이 실패하면 값을 남기지 않고 요청을 그 오류로 끝낸다. 결과는 {}다"
    outcomes:
      - id: stored
        observe: ["disk:<root>/secrets.json", response, "event:QuestionResolved"]
      - id: connect-failed
        when: "새 provider 자리의 연결이 실패했다. 값은 남지 않고 agent에게 그 오류가 간다. route 결과는 {}다"
        observe: [response, "event:QuestionResolved"]
      - id: not_found
        code: not_found
        when: "요청이 열려 있지 않다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "입력이나 body가 맞지 않는다. secret 요청이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "값을 secrets.json에 넣지 못했다. 요청은 열린 채다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 token이 아니다"
        observe: [response]
    crosses_process: false
    risk: [secret]
    docs: [architecture/agent-definition.md]

  - id: browser-call-run
    title: shell main이 browser_call을 그 탭의 page에 CDP로 돌려 결과를 done에 싣는다
    actor: shell
    entries: [system:browser-call-run]
    uses: [host-link:open, host-link:done]
    boundary: [shell, host-queue-interface]
    code:
      - packages/shell/main/browser/agent/driver.ts
      - packages/shell/main/browser/agent/control.ts
      - packages/shell/main/browser/agent/page.ts
      - packages/shell/main/browser/agent/electron-page.ts
      - packages/shell/main/browser/agent/snapshot.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/main/desktop/core/connection.ts
    steps:
      - "/host-link가 browser_call을 주면 창에 보내지 않고 shell main이 따로 돌린다. 끝나면 결과나 오류를 response에 싣는다. 호출마다 그 page를 가진 창에 알려 쓴 때를 센다(창마다 12개 상한에서 오래 쓰지 않은 것부터 놓는다)"
      - "창이 bind로 알린 view session에서 page를 찾는다. host browser 탭은 그 workspace가 mount되지 않아도 창 단위로 bind한다. browser 탭은 browser partition의 webview guest, preview 탭은 mode가 preview인 앱 view, artifact 탭은 artifact view registry에 붙은 guest다. 앱 live view는 어떤 경우에도 고르지 않는다. 없으면 unavailable"
      - "그 탭을 agent가 다루는 중으로 적는다. 사람이 take control 중이면 act, navigate, evaluate는 conflict이고 읽기(snapshot, screenshot, logs, wait)는 된다"
      - "DevTools가 열려 있거나 다른 debugger가 붙어 있으면 붙지 않고 conflict다. 붙으면 DOM, Accessibility 등 domain을 켠다"
      - "snapshot마다 ref를 새로 매긴다. 새 snapshot이나 main frame 이동 뒤 옛 ref는 conflict다. `type=password` 칸의 value는 찍지 않는다(값이 있으면 ••••, 비었으면 생략)"
      - "act fill_login(password·totp)은 ref node가 든 frame을 DOM tree에서 찾아 그 frame의 origin을 CDP로 잰다(최상위 URL이 아니다). 그 origin으로 core logins/release를 shell capability로 불러 값을 받고, 지금 fill과 같이 다 지우고 한 글자씩 친다. 치는 동안 그 frame이나 최상위가 이동하거나 frame이 떨어지면 멈추고 conflict다. 값은 log·오류·결과에 싣지 않는다. frame_origin(login 요청의 origin 재기)은 같은 재기로 origin과 page 제목만 돌려주고, 보호 창의 한 번 넣기(typeOnce, core queue를 지나지 않는다)는 값을 치기 전에 다시 재서 card에 보인 origin과 다르면 치지 않고 conflict다"
      - "page가 CALL 기한 안에 답하지 않으면 unavailable이다. page 안의 예외(evaluate)는 오류가 아니라 exception 결과다"
    outcomes:
      - id: done
        when: "snapshot, act, navigate, screenshot, evaluate, logs, wait의 결과(content)를 done에 실었다. evaluate가 page 예외로 끝난 것도 여기다"
        observe: [response]
      - id: tab-not-open
        code: unavailable
        when: "bind된 view session이 없거나 page가 닫혔거나 browser·preview 종류가 맞지 않는다(앱 live view 포함). browser 탭이면 \"page가 사라졌다, tab open --url로 다시 열라\"는 고정 문장이고, preview·artifact 탭이면 그 workspace를 띄운 창이 없다는 문장이다"
        observe: [response]
      - id: person-holds
        code: conflict
        when: "사람이 그 탭을 가져가 있는데 act, navigate, evaluate가 왔다"
        observe: [response]
      - id: debugger-busy
        code: conflict
        when: "DevTools가 열려 있거나 우리 것이 아닌 debugger가 붙어 있다"
        observe: [response]
      - id: stale-ref
        code: conflict
        when: "act가 가리킨 ref가 현재 snapshot에 없다"
        observe: [response]
      - id: login-frame-moved
        code: conflict
        when: "fill_login이 치는 동안 그 frame이나 최상위가 이동했거나 frame이 떨어졌다. 그 뒤 글자는 치지 않는다"
        observe: [response]
      - id: login-refused
        code: forbidden
        when: "frame의 origin이 저장된 login의 origin과 글자 그대로 같지 않거나, origin이 없는 frame이다(core logins/release의 거절). login이 없으면 not_found, core가 닿지 않으면 unavailable로 그 code 그대로다"
        observe: [response]
      - id: rejected
        code: invalid_input
        when: "preview·artifact 탭의 navigate, 허용하지 않는 url, 모르는 key, ref의 node가 그 조작을 받지 못해 page 함수가 던짐, wait에 text와 url이 둘 다/둘 다 없음"
        observe: [response]
      - id: timeout
        code: unavailable
        when: "page가 기한 안에 답하지 않았거나, wait 조건이 시간 안에 맞지 않았거나, 이동이 실패했거나, 가려진 탭이라 screenshot이 그려지지 않았다"
        observe: [response]
      - id: internal
        code: internal
        when: "CallError가 아닌 예외가 났다"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/browser-tab.md, architecture/workspace-layout.md]

  # ---- shell 쪽 timer와 core 쪽 lease ----
  - id: harness-turn-run
    title: harness 입력을 headless CLI로 실행해 turn을 끝까지 돌린다
    actor: shell
    entries: [system:harness-turn-run]
    uses:
      - harness-take:input
      - harness-turn-start:started
      - harness-turn-record:recorded
      - harness-session-bind:bound
      - harness-turn-finish:finished
      - route:turns/read
      - route:agents/read
      - route:projects/get
      - route:apps/get
    boundary: [shell-extension, harness-host-interface]
    code:
      - packages/core/extensions/bundled/harness/host.ts
      - packages/protocol/coding-agent/headless/
      - packages/protocol/coding-agent/harness-adapter.ts
    steps:
      - "extension harness가 1초마다 tick한다. take로 입력을 보고(없으면 끝), start_turn으로 turn을 연다. 둘 중 하나가 거절하면 이번 tick을 끝낸다"
      - "cwd를 고른다. home은 harness-home의 빈 폴더, project와 app은 첫 폴더다. 없으면 configuration-unavailable"
      - "agent 정의의 deny를 그 CLI의 권한 표현으로 옮긴다. 옮길 수 없으면 configuration-unavailable. git 저장소 안의 하위 폴더면 띄우지 않는다"
      - "headless CLI(claude -p, codex exec, opencode run)를 cwd와 turn 자격 env로 띄우고 stdin을 닫는다. 이어 갈 id가 없고 fork_external_session_id가 있으면 claude(--resume --fork-session)와 opencode(--session --fork)는 원본 session에서 갈라 시작하고 codex는 새로 시작한다"
      - "줄마다 parser로 읽어 글과 harness_tool은 record로, CLI session id는 set_external_id로 보낸다"
      - "1초마다 turns/read로 core가 turn을 닫았는지 본다. 닫혔으면(멈춤) process를 죽이고 더 기록하지 않는다"
      - "process가 끝나면 글이 있으면 completed, 없으면 no-answer, 실패는 실패 글을 record한 뒤 model-error나 target-unavailable로 finish한다"
    outcomes:
      - id: idle
        when: "take가 입력을 주지 않았다. 이번 tick에 할 일이 없다"
        observe: [response]
      - id: not-started
        when: "take가 실패했거나 start_turn이 거절했다(설정이 꺼짐, queue 머리가 아님, 다른 turn이 돎 등). turn이 열리지 않았다"
        observe: [response]
      - id: completed
        observe: [ledger:turns, event:TurnEnded]
      - id: model-error
        when: "CLI가 end event로 실패를 알리거나 0이 아닌 exit code로 끝났다"
        observe: [ledger:messages, ledger:turns, event:TurnEnded]
      - id: target-unavailable
        when: "CLI를 띄우지 못했거나(headless를 지원하지 않는 CLI 포함) 신호로 끝났다. agent 정의를 읽지 못했다. extension이 꺼지며 process를 끊었다. 실행 중 예외가 났다"
        observe: [ledger:messages, ledger:turns, event:TurnEnded]
      - id: configuration-unavailable
        when: "cwd가 없거나 deny를 옮길 수 없거나 빈 입력이거나 git 최상위가 아니다"
        observe: [ledger:messages, ledger:turns, event:TurnEnded]
      - id: no-answer
        when: "글 없이 끝났다"
        observe: [ledger:turns, event:TurnEnded]
      - id: stopped-by-core
        when: "사람의 멈춤이나 재시작으로 core가 turn을 이미 닫았다(turns/read가 finished). 또는 record가 conflict를 받았다. finish를 부르지 않는다"
        observe: [ledger:turns]
    crosses_process: true
    risk: [sandbox, secret]
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "extension 종료(stop) 때 실행 중 turn은 target-unavailable로 finish한다. 설정이 꺼진 뒤의 finish는 core가 conflict로 거절할 수 있다"

  - id: host-queue-poll
    title: shell main이 /host-link로 받은 host 요청을 창에 열거나 browser 호출을 돌린다
    actor: shell
    entries: [system:host-queue-poll]
    uses: [host-link:open, host-link:closed]
    boundary: [host-queue-interface, shell]
    code:
      - packages/shell/main/desktop/core/host-link.ts
      - packages/shell/main/desktop/wiring/surface.ts
      - packages/shell/ipc/surface.ts
    steps:
      - "Gateway가 처음 ready가 되면 사람 token으로 /host-link를 열고 hello에 보이는 workspace를 싣는다. 끊기면 1초에서 30초까지 두 배씩 늘려 다시 붙고 hello부터 다시 보낸다. core가 다시 떠 주소나 token이 바뀌면 Gateway ready 때 새 값으로 바로 붙는다"
      - "보이는 workspace를 창이 알릴 때와 1초마다 보고, 바뀌었으면 visible을 보낸다"
      - "request가 오면 종류마다 단 처리기로 돌린다. browser_call이면 browser driver를 따로 돌리고 끝나면 결과를 response에 싣는다. 처리기가 없는 종류는 unavailable로 답한다"
      - "탭 요청은 받은 차례로 하나씩 그 workspace를 보이는 창 가운데 focus를 가장 최근에 받은 하나에만 push하고 창의 ack를 1.5초 기다린다(두 창이 같은 탭을 열지 않는다). browser 탭 열기는 보이는 창이 없으면 가장 최근 일반 창에 보내고, 일반 창이 하나도 없으면 focus 없이 하나 연다(desktop-window-open-inactive). browser 탭 닫기는 page를 가진 창에 보낸다"
      - "ack가 오면 response done. browser 탭 열기는 ack 뒤 page가 붙는(bind) 때 done으로 core에 답한다(page를 둘 창이 닫히면 오류로 답한다). 창이 없거나 ack가 없으면 1초 쉰 뒤 retry로 답한다(core가 바로 다시 밀지 않게). 창을 끝내 만들지 못한 browser 탭 열기는 retry가 아니라 unavailable로 답한다"
      - "창이 알린 host 탭의 browser 상태와 닫힘은 report frame으로 올린다. 연결이 끊긴 동안의 답과 보고는 버린다(core가 결과 요청을 이미 unavailable로 끝냈고 탭 요청은 다시 민다)"
    outcomes:
      - id: offered
        observe: [screen:project-terminal]
      - id: retry
        when: "창이 없거나, 창이 1.5초 안에 ack하지 않았거나, 창이 열지 못했다고 답했다(browser 탭 열기는 창을 열어 보고도 없을 때만 오류로 끝난다)"
        observe: [response]
      - id: browser-open-answered
        when: "browser 탭 열기를 창이 ack했고 page가 bind되어 done으로 답했다. 일반 창이 없었으면 focus 없이 창을 열고 거기 보냈다"
        observe: [response, "process:창의 pool에 page가 있다"]
      - id: browser-open-failed
        when: "browser 탭 열기에 받을 창을 만들지 못했거나 page를 둘 창이 답하기 전에 닫혔다. unavailable과 고정 문장으로 done한다"
        observe: [response]
      - id: browser-call
        when: "browser_call 요청이다. browser driver(browser-call-run)를 따로 돌리고 끝나면 response에 결과를 싣는다"
        observe: [response]
      - id: unhandled
        when: "이 shell에 처리기가 없는 종류의 요청이다. unavailable로 답한다"
        observe: [response]
      - id: reconnect
        when: "연결이 열리지 않았거나 끊겼다. 1초에서 30초까지 두 배씩 늘려 다시 붙는다. 끊긴 연결로 받은 요청의 답은 보내지 않는다"
        observe: [response]
    crosses_process: true
    docs: [architecture/coding-agent.md, architecture/workspace-layout.md]
    unclear:
      - "offered 결과 화면은 프레임 project-terminal로 근사했다. agent가 연 탭의 정확한 프레임은 확인하지 않았다"

  - id: harness-tui-hold
    title: core가 resume으로 연 터미널이 쥔 harness session의 hold를 연장하거나 푼다
    actor: system
    entries: [system:harness-tui-hold]
    uses: [harness-tui-open:accepted, coding-session-open:opened]
    boundary: [harness-host-core, host-queue-core, core]
    code:
      - packages/core/host-queue/hold.ts
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/terminal-agents/hold.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
    steps:
      - "tabs/open의 tui나 coding_sessions/open의 resume 판정을 통과하면 그 자리에서 30초 예약한다(첫 heartbeat까지의 틈)"
      - "core가 resume으로 연 터미널이 쥔 session 목록을 쥔 것이 바뀔 때와 3초마다 heartbeat로 넣는다. 목록에 실린 session은 10초로 연장한다. core가 끝나면 갱신이 멈춰 10초 뒤 풀린다"
      - "TUI로 연 터미널은 그 harness가 foreground에 보인 뒤 떠나면(tracker) 놓는다. 터미널이 끝나면(process가 끝났거나 PTY host가 사라졌다) 놓는다. 한 번 목록에 실렸던 session이 빠지면 바로 푼다"
      - "폰이 resume으로 되살린 coding session(coding-session-open)은 그 터미널이 끝날 때까지 쥔다. 사람이 그 채팅을 터미널로 바꿔 GUI handle이 닫혀도 같은 CLI session을 TUI가 이어 쓰므로 놓지 않는다"
      - "한 번도 실리지 않은 session은 30초 뒤 만료된다"
      - "hold된 동안 harness/take는 그 session을 건너뛰고 harness/start_turn은 conflict다"
    outcomes:
      - id: extended
        when: "heartbeat 목록에 실렸다. 10초로 연장한다"
        observe: [response]
      - id: released
        when: "한 번 실렸던 session이 목록에서 빠졌다"
        observe: [response]
      - id: expired
        when: "예약 30초 안에 한 번도 실리지 않았다. 또는 heartbeat가 끊겨 연장된 시각을 넘었다"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [P6]
    docs: [architecture/coding-agent.md]

  - id: harness-queue-restore
    title: core가 다시 떠서 접수만 된 harness 입력을 queue에 되돌린다
    actor: system
    entries: [system:harness-queue-restore]
    boundary: [harness-host-core]
    code:
      - packages/core/main/daemon/wiring/harness.ts
      - packages/core/lophn-agent/session/message-commands.ts
    steps:
      - "core 기동 때 harness wiring의 start가 ledger에서 아직 시작하지 않은 사람 메시지를 찾는다"
      - "session이 입력을 받고 harness이면 harness queue에 다시 넣는다. 본문은 take가 기록에서 읽는다"
      - "닫혔거나 보관되었거나 harness가 아니면 건너뛴다"
      - "돌던 turn은 router가 interrupted(restarted)로 먼저 닫는다. 그 뒤의 harness-turn-finish는 conflict다"
    outcomes:
      - id: queued
        observe: [response]
      - id: skipped
        when: "session이 닫혔거나 보관되었거나 harness가 아니다"
        observe: [response]
      - id: unopened
        when: "ledger를 열지 못했다. 아무것도 다시 넣지 않고 기동을 이어 간다"
        observe: []
    crosses_process: false
    refs: [P6]
    docs: [architecture/coding-agent.md]
    unclear:
      - "start()는 core 기동 때 한 번 돈다. 설정을 껐다 켰을 때 queue가 비고 start()가 다시 도는지는 확인하지 못했다"

  # ---- 터미널 탭의 coding agent: hook과 상태 ----
  - id: terminal-hook-forward
    title: harness hook이 부른 lophn hook을 터미널 hook socket으로 보낸다
    actor: coding-agent
    entries: [cli:hook]
    boundary: [coding-agent, coding-agent-cli]
    code:
      - packages/coding-agent/local/hook.ts
      - packages/protocol/coding-agent/terminal-hook.ts
      - packages/protocol/coding-agent/hook-signal.ts
    steps:
      - "harness의 전역 hook이 lophn hook <harness> <event>를 부르고 JSON을 stdin으로 준다"
      - "LPN_TERMINAL_HOOK이 없으면 stdin을 읽지 않고 harness가 요구하는 stdout만 내고 끝낸다"
      - "stdin은 1 MiB까지 1초 안에 읽고(닫히지 않는 stdin이면 포기하고 성공으로 끝낸다) 최상위 글 field를 4096자로 자른다. event가 lophn-gui면 호출한 cwd를 더한다"
      - "payload가 64 KiB를 넘거나 JSON이 깨졌으면 버린다"
      - "터미널 socket에 {v, key, harness, event, payload} 한 줄을 쓰고 답 없이 닫는다. 1초 안에 못 쓰면 버린다. 실패해도 성공으로 끝낸다"
    outcomes:
      - id: sent
        when: "줄을 터미널 socket에 썼다"
        observe: [response]
      - id: skipped
        when: "LPN_TERMINAL_HOOK이 없거나 맞지 않다. stdin을 읽지 않는다"
        observe: [response]
      - id: dropped
        when: "stdin이 1 MiB를 넘었거나 1초 안에 끝나지 않았다, JSON이 깨졌다, payload가 64 KiB를 넘었다, 줄이 계약에 맞지 않다, socket에 1초 안에 못 썼다(stdin 읽기와 쓰기가 1초를 나눠 쓴다. 실패도 성공으로 끝난다)"
        observe: [response]
    crosses_process: false
    refs: [P6]
    docs: [architecture/terminal-agent.md, architecture/coding-agent.md]

  - id: harness-gui-open
    title: 터미널 탭에서 claude gui 등을 치면 탭을 GUI 채팅 화면으로 바꾼다
    actor: person
    uses: [cli:hook]
    when: "hook event가 lophn-gui일 때"
    boundary: [shell-extension, shell]
    code:
      - packages/core/terminal-agents/gui.ts
      - packages/core/extensions/bundled/harness-gui/index.ts
      - packages/core/extensions/bundled/harness-gui/adapter.ts
      - packages/shell/renderer/terminal/terminal-gui.tsx
      - packages/core/terminal-agents/gui.ts
      - packages/core/extensions/bundled/harness-gui/index.ts
    steps:
      - "사람이 터미널에서 claude gui, codex gui, opencode gui, omp gui, agy gui(gui --resume id 포함)를 친다. 셸 함수가 lophn hook으로 resume 값을 보낸다"
      - "core가 key로 터미널을 찾는다. harness가 GUI를 지원하고 터미널이 살아 있을 때만 extension의 onTab.gui를 부른다. 아니면 무시한다"
      - "extension이 꺼져 있으면 core가 TerminalGuiOff {terminal}을 내고 끝낸다. 붙은 shell main이 그 터미널 탭을 고른 창(모르면 최근 창)에 extension-settings intent를 보내 Settings › Extensions를 연다(desktop-window-intent). 붙은 shell이 없으면 아무 일도 없다"
      - "이미 그 터미널에 GUI를 여는 중이면 이 요청은 아무 일도 하지 않는다"
      - "TUI가 떠 있으면 adapter.exitTui로 끄고 5초 안에 foreground가 shell이 되기를 기다린다. 못 기다리면 실패"
      - "extension spawner가 사람의 login env를 읽기를 기다린 뒤(최대 5초) adapter.start로 CLI를 그 env와 탭 폴더에서 띄우고 ACP handle을 만든다. 시작하는 사이 탭이나 터미널이 닫혔으면 CLI를 세운다. adapter나 TUI 끄기가 던지면 internal 실패로 turn 오류를 보인다"
      - "탭을 가진 창에 GUI 열림을 push하고 1.5초 안에 ack가 와야 탭이 GUI view가 된다. 없으면 handle을 닫는다. core가 연 터미널은 core의 GUI handle(terminal-agents)이 받는다. 창의 ack는 없고 handle은 창과 상관없이 core에 있다"
    outcomes:
      - id: opened
        observe: [screen:harness-gui-terminal-tab]
      - id: already-open
        when: "그 터미널에 handle이 이미 있다. view만 gui로 바꾼다"
        observe: [screen:harness-gui-terminal-tab]
      - id: already-opening
        when: "같은 터미널의 GUI 열기가 아직 도는 중이다. 이 요청은 아무 일도 하지 않는다"
        observe: [response]
      - id: ack-timeout
        when: "탭을 가진 창이 1.5초 안에 ack하지 않았다. handle을 닫는다"
        observe: [screen:project-terminal]
      - id: extension-off
        when: "harness-gui extension이 꺼져 있다. 창이 Settings › Extensions를 연다"
        observe: [event:TerminalGuiOff, process:settings-window]
      - id: start-failed
        when: "adapter.start나 exitTui가 실패했다(던진 것은 internal로 보인다), 또는 exitTui 뒤 5초 안에 shell이 foreground가 되지 않았다. GUI view에는 실패한 turn으로 보인다"
        observe: [screen:harness-gui-terminal-tab]
      - id: terminal-gone
        when: "adapter가 시작하는 사이 터미널이 끝났다. handle을 닫아 CLI를 세운다"
        observe: [process:cli-gui]
      - id: ignored
        when: "탭 runtime이 없거나, GUI를 지원하지 않는 harness거나, payload가 틀렸다"
        observe: [response]
    crosses_process: true
    refs: [P6]
    docs: [architecture/harness-gui.md]
    unclear:
      - "Settings › System › Extensions 화면에는 wireframe frame이 없다. extension-off의 observe는 process:settings-window로 적었다"

  - id: terminal-agent-track
    title: 터미널 탭의 coding agent 상태(running, waiting, idle, unknown)를 core가 정하고 창의 탭 점이 따른다
    actor: system
    entries: [system:terminal-agent-track]
    uses: [cli:hook, route:terminals/list]
    boundary: [core, coding-agent, shell]
    code:
      - packages/core/terminal-agents/tracker.ts
      - packages/core/terminal-agents/osc-title.ts
      - packages/core/terminal-agents/ingress.ts
      - packages/core/terminal-agents/service.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/protocol/coding-agent/hook-signal.ts
      - packages/shell/renderer/terminal/store.ts
    steps:
      - "core가 hook 줄을 socket에서 받아 key로 터미널을 찾는다. 모르는 key, 상한을 넘는 줄, 깨진 줄은 버린다. lophn-gui는 harness-gui-open으로 넘긴다"
      - "PTY host가 1초마다 보내는 foreground argv로 harnessOfProcess가 harness를 고른다. 다른 harness의 hook은 버린다"
      - "TurnStarted는 running, PermissionRequested는 waiting(수를 센다), TurnEnded는 main turn을 끝내고 권한 수를 0으로 둔다. ChildStarted·ChildEnded는 child 집합을 바꾼다. SessionEnded는 unknown이다"
      - "보이는 상태는 권한 물음이 있으면 waiting, main turn이나 child가 있으면 running, 아니면 idle이다. hook을 한 번도 못 들었으면 unknown이다"
      - "Esc나 Ctrl-C를 사람이 치면 끊김 hook이 없는 harness에 한해 unknown으로 짐작(guessed)한다. 뒤따르는 PermissionResolved가 오면 running으로 되돌린다"
      - "child는 10분 동안 신호가 없으면 뺀다. foreground를 떠나면 집합을 비운다. PTY 출력의 OSC 0·2 터미널 제목은 core가 읽어(상태 글리프를 뗀다) agent의 screen_title로 싣는다"
      - "상태나 제목이 바뀌면 core가 agent를 runtime에 실어 TerminalRuntimeChanged로 낸다. 창의 터미널 store가 받아 탭 점과 이름을 바꾸고, 붙거나 다시 붙은 창은 `terminals/list`로 지금 값을 한 번 읽는다"
    outcomes:
      - id: running
        observe: [screen:project-terminal]
      - id: waiting
        observe: [screen:project-terminal]
      - id: idle
        observe: [screen:project-terminal]
      - id: unknown
        when: "hook을 한 번도 못 들었다. 또는 사람이 Esc·Ctrl-C로 끊어 짐작(guessed)했다"
        observe: [screen:project-terminal]
      - id: left
        when: "foreground가 harness가 아닌 process로 바뀌었다. agent가 탭에서 빠진다"
        observe: [screen:project-terminal]
      - id: terminal-ended
        when: "터미널이 끝났다. 그 탭의 agent가 빠진다"
        observe: [screen:project-terminal]
      - id: gui-routed
        when: "lophn-gui 줄이라 harness-gui-open이 이어 받는다. hook에는 답이 없다"
        observe: [response]
      - id: ignored
        when: "key나 harness가 맞지 않거나, 줄이 상한을 넘거나 깨졌거나, 터미널이 이미 끝났거나, 상태를 바꾸지 않는 신호다"
        observe: [screen:project-terminal]
    crosses_process: true
    refs: [P6]
    docs: [architecture/terminal-agent.md]

  - id: terminal-agent-notice
    title: 터미널 탭의 turn 끝과 권한 물음을 core가 알리고 shell main이 toast나 OS 알림을 고른다
    actor: shell
    entries: [system:terminal-agent-notice]
    uses: [ipc:shell:terminal-reveal, system:terminal-agent-signal]
    boundary: [shell]
    code:
      - packages/shell/main/desktop/wiring/terminal.ts
      - packages/shell/main/desktop/wiring/notice.ts
      - packages/shell/main/notice/rule.ts
      - packages/core/terminal-agents/tracker.ts
    steps:
      - "core의 tracker가 turn 끝(완료나 실패)이나 권한 물음을 알릴 계기로 정하면 TerminalAgentSignaled를 낸다(terminal-agent-signal). 못 본 끝과 push는 core가 정한다"
      - "shell main이 Gateway로 받아 판정한다. 그 터미널을 focus 표에서 focus를 가진 창이 보이고 있으면 띄우지 않는다"
      - "lophn 창에 focus가 있는데 그 탭이 안 보이면 그 창의 toast, 어느 창에도 focus가 없으면 OS 알림이다. 제목은 탭 이름(없으면 제품 이름)과 시작 폴더다. 누르면 탭이 있는 창을 앞으로 가져와 탭을 고른다(terminal-reveal)"
      - "알림 본문은 hook payload가 준 마지막 답이나 오류 글, 권한 물음의 요약만 쓴다. transcript는 읽지 않는다"
    outcomes:
      - id: signaled
        when: "core가 계기를 알렸다(보고 있어도 알린다)"
        observe: []
      - id: mark-dismissed
        when: "core가 새 turn이나 터미널 끝으로 그 터미널의 못 본 끝을 지웠다"
        observe: []
      - id: toast
        observe: [screen:new-waiting-toasts, screen:new-waiting-finished]
      - id: os-notification
        observe: [process:os-notification, screen:new-waiting-finished]
      - id: silent-watched
        when: "그 탭을 사람이 보고 있다"
        observe: [screen:new-waiting-finished]
      - id: silent-stopped
        when: "사람이 끊은 turn이거나 /clear, compact다. core가 내지 않는다"
        observe: [screen:new-waiting-finished]
      - id: cancelled
        when: "1.5초 안에 다시 running이나 waiting이 되었다. 또는 turn 끝 뒤 child가 남아 있다. core가 내지 않는다"
        observe: [screen:new-waiting-finished]
    crosses_process: true
    docs: [architecture/terminal-agent.md]
    unclear:
      - "toast 화면은 프레임 new-waiting-toasts로 근사했다. 정확한 프레임 정합성은 확인하지 않았다"

  - id: terminal-hook-install
    title: 사람 터미널에서 harness를 처음 알아보면 core가 hook 설치를 묻고 그 터미널의 탭이 있는 창이 답한다
    actor: system
    entries: [system:terminal-hook-install]
    uses: [cli:harness.install, cli:harness.sync_skills, route:coding_agents/hook_answer]
    boundary: [core, coding-agent, shell]
    code:
      - packages/core/terminal-agents/hook-install.ts
      - packages/core/terminal-agents/hook-ask.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/shell/renderer/desktop/hook-prompt/hook-prompt-host.tsx
    steps:
      - "사람 터미널에서 harness를 foreground로 처음 알아본 때 harness마다 core 실행당 한 번 돈다"
      - "lophn harness install을 dry_run으로 불러 hook과 옛 skill 상태를 본다. 둘 다 missing이 아니면 끝난다"
      - "missing이고 desktop 앱이 붙어 있으면 core가 HookInstallAsked(harness 이름, 하는 일, 쓸 file 목록)를 낸다. 그 터미널의 탭이 있는 창이 dialog로 묻고 `coding_agents/hook_answer`로 답한다(coding-agents-hook-ask). 앱이 붙어 있지 않거나 붙은 link가 닫히면 거절이다"
      - "거절이면 이 core 실행에서는 다시 묻지 않는다"
      - "허락하면 lophn harness install을 실행하고 HookInstallFinished를 낸다. 허락한 창이 성공은 toast 하나, 실패는 까닭과 file을 담은 dialog로 보인다"
      - "놓은 뒤 공유 skill 사본을 맞춘다(harness sync-skills). 묻기나 놓기가 실패해도 터미널은 그대로 돈다"
    outcomes:
      - id: skipped
        when: "hook 자리가 없는 harness이거나, CLI 경로를 모르거나, 이 실행에서 이미 물었다, 같은 harness를 묻는 중이다"
        observe: [response]
      - id: dry-run-failed
        when: "dry_run 결과를 읽지 못했다(CLI 실패, 형식이 맞지 않음, 예외). 아무것도 묻지 않는다"
        observe: [response]
      - id: not-needed
        observe: [response]
      - id: declined
        when: "앱이 붙어 있지 않거나, 답 전에 link가 닫혔거나, 사람이 거절했다. 이 실행에서는 다시 묻지 않는다"
        observe: [response]
      - id: installed
        observe: [disk:"<harness 전역 설정 file>", screen:new-waiting-toasts]
      - id: failed
        when: "허락했는데 install이 실패했다(CLI 오류, 실패한 hook이나 skill, 예외). 까닭을 담은 dialog를 보인다"
        observe: [screen:settings-coding]
    risk: [data-loss, permission]
    crosses_process: true
    refs: [P6]
    docs: [architecture/terminal-agent.md, architecture/coding-agent.md]
    unclear:
      - "실패 dialog는 wireframe 프레임이 없다. observe의 screen:settings-coding은 근사다"
      - "물은 터미널의 탭이 어느 창에도 없으면(폰이 연 터미널) 아무 창도 묻지 않아 link가 닫힐 때까지 답이 없다"

  - id: terminal-agent-identity
    title: hook이 session id를 알려 준 coding agent session의 identity를 core가 project 파일에 남긴다
    actor: system
    entries: [system:terminal-agent-identity]
    uses: [route:terminals/saved_sessions]
    boundary: [core]
    code:
      - packages/core/terminal-agents/session-store.ts
      - packages/core/terminal-agents/sessions-move.ts
    steps:
      - "hook이 session id를 알린 session의 identity를 만든다(harness, session id, folder, cwd, 첫 prompt, harness가 붙인 이름, 시각)"
      - "project별 파일 <data root>/terminal-agents/sessions/<project>.json에 원자 교체로 쓴다. 상태(running 등)는 저장하지 않는다"
      - "같은 session은 갱신하고, 50개를 넘으면 가장 오래된 것부터 뺀다"
      - "저장본 목록은 `terminals/saved_sessions`로 읽는다. 옛 <data root>/shell/agent-sessions/는 data step terminal-agents.sessions-move가 내용과 mode 그대로 옮긴다"
    outcomes:
      - id: saved
        observe: ["disk:<data root>/terminal-agents/sessions/<project>.json"]
      - id: failed
        when: "파일을 쓰지 못했다. log를 남기고 넘어가 목록은 그대로다"
        observe: [log:core]
    crosses_process: false
    docs: [architecture/terminal-agent.md]

  # ---- harness GUI: 사람이 채팅 화면에서 하는 일 ----
  - id: harness-gui-toggle
    title: 터미널 탭 머리의 toggle로 GUI와 TUI를 오간다
    actor: person
    uses: [route:coding_sessions/switch, route:coding_sessions/switch_plan]
    boundary: [shell-extension, shell]
    code:
      - packages/shell/renderer/terminal/terminal-gui.tsx
      - packages/protocol/coding-agent/relay.ts
      - packages/core/terminal-agents/gui.ts
      - packages/core/extensions/bundled/harness-gui/index.ts
    steps:
      - "탭의 단추와 ⋯ 메뉴의 Open as chat·Open in terminal은 그 터미널의 coding session(`coding_sessions/list`)이 있을 때 선다. 바꿀 수 없으면(switch.blocked) 단추가 disabled이고 이유가 tooltip이다"
      - "handoff가 shared(Codex, OpenCode)면 묻지 않는다. restart(Claude, omp, Antigravity)면 `coding_sessions/switch_plan`으로 멈출 일(도는 turn, task, 줄 선 메시지)을 읽어 modal(harness-gui-restart-modal)로 확인받는다"
      - "확인하면 `coding_sessions/switch{to, confirmed, key}`를 부른다(coding-session-switch). core가 CLI를 끄고 다른 쪽으로 다시 띄우거나 view만 바꾸고, 목록이 바뀌면 모든 창(과 폰)의 탭이 따라간다"
      - "GUI에서 TUI로 가며 줄에 남은 메시지의 글은 입력칸에 되돌려 놓는다(첨부는 잃는다)"
    outcomes:
      - id: to-tui
        observe: [process:cli-tui, screen:project-terminal]
      - id: tui-without-handle
        when: "그 터미널에 handle이 없다. view만 tui로 바꾼다"
        observe: [screen:project-terminal]
      - id: to-gui
        observe: [screen:harness-gui-terminal-tab]
      - id: no-session
        when: "TUI의 CLI session id를 아직 모른다(hook이 안 왔다)"
        observe: [screen:terminal-open-chat-disabled]
      - id: not-running
        when: "그 터미널에 지원하는 coding agent가 떠 있지 않다"
        observe: [screen:terminal-open-chat-disabled]
      - id: extension-off
        when: "harness-gui extension이 꺼져 있다. 단추가 disabled이고 이유가 그것이다"
        observe: [screen:terminal-open-chat-disabled]
      - id: failed
        when: "core가 바꾸지 못했다(CLI가 끝나지 않음, adapter 시작 실패). toast로 까닭을 보인다"
        observe: [screen:harness-gui-terminal-tab]
    crosses_process: true
    refs: [P6]
    docs: [architecture/harness-gui.md]

  - id: harness-gui-input
    title: GUI 채팅 화면에서 보낸 입력을 CLI에 넘긴다
    actor: person
    uses: [route:acp/send]
    boundary: [shell-extension, shell, acp]
    code:
      - packages/shell/renderer/conversation/agent-tab-gui-source.ts
      - packages/shell/renderer/terminal/terminal-gui.tsx
      - packages/core/terminal-agents/gui.ts
      - packages/core/extensions/bundled/harness-gui/adapter.ts
    steps:
      - "GUI 화면에서 사람이 보낸 입력(ACP input)을 renderer가 그 coding session으로 `acp/send`에 준다"
      - "core가 그 session의 handle을 찾아 input으로 넘긴다. 없으면 거절이다. adapter가 입력을 CLI 호출로 옮기고 ACP update를 AcpUpdated로 돌려 화면이 그린다"
      - "GUI의 CLI session은 lophn ledger에 기록하지 않는다. 지난 대화는 CLI session 목록에서 읽는다"
    outcomes:
      - id: sent
        observe: [process:cli-run, screen:harness-gui-terminal-tab]
      - id: refused
        when: "handle이 없거나 입력이 맞지 않다"
        observe: [response]
    crosses_process: true
    docs: [architecture/harness-gui.md]

  # ---- 폰의 coding session: host가 올린 GUI 대화를 core가 사본으로 낸다 ----
  - id: coding-session-sync
    title: core가 GUI handle의 대화 갱신을 redaction을 거쳐 내고 coding session 목록이 바뀌면 알린다
    actor: system
    entries: [system:coding-session-sync]
    boundary: [core, acp]
    code:
      - packages/core/terminal-agents/coding-sessions.ts
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/core/main/daemon/wiring/session-lifecycle.ts
    steps:
      - "harness-gui가 터미널에 handle을 열면 core가 그 handle에 붙어 20ms 묶음의 updates를 받는다. tool 본문은 뺀다(사람이 친 명령은 명령 글만 남는다)"
      - "updates는 제품 redactor로 모든 글을 거른 뒤 하나씩 AcpUpdated {session: ses_<터미널 ULID>, update}로 Bus에 낸다. 알려진 secret을 아직 다 모르면 내지 않고 StateChanged {coding_sessions, id: session}만 내 화면이 snapshot을 다시 읽게 한다"
      - "handle이 열리거나 닫히면 StateChanged {coding_sessions, id: session}을 낸다. tracker의 agent, GUI view, 터미널 runtime, `/host-link` 연결이 바뀌어 목록이 달라지면 StateChanged {coding_sessions}를 내고 같은 목록을 session lifecycle 표에 넘긴다"
    outcomes:
      - id: folded
        observe: [event:AcpUpdated, event:StateChanged]
      - id: withheld
        when: "알려진 secret을 아직 다 모른다(갱신을 내지 않는다)"
        observe: [event:StateChanged]
      - id: cleared
        when: "handle이 닫혔다(터미널이 끝났거나 restart, TUI로 바꿨다)"
        observe: [event:StateChanged]
    crosses_process: false
    risk: [secret]
    docs: [architecture/harness-gui.md, architecture/acp.md]

  - id: coding-sessions-read
    title: 화면과 폰이 컴퓨터의 coding session 목록, view 바꾸기 계획, CLI의 지난 session, rewind 미리보기를 읽는다
    actor: person
    entries: [route:coding_sessions/list, route:coding_sessions/switch_plan, route:coding_sessions/cli_sessions, route:coding_sessions/rewind_preview]
    boundary: [core, acp]
    code:
      - packages/core/terminal-agents/coding-sessions.ts
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/protocol/coding-agent/relay.ts
    steps:
      - "list는 core가 가진 터미널 가운데 coding agent가 도는 것(tracker가 runtime에 실은 agent나 GUI handle)마다 한 줄이다(project로 거를 수 있다). GUI view의 줄은 handle의 제목·CLI session·turn 단계를 쓴다. 목록은 shell 연결과 상관없고 shell은 /host-link가 열려 있으면 attached다"
      - "switch는 GUI면 null이다. TUI면 Windows는 unsupported_os, GUI handle이 있으면 null, foreground TUI나 handoff가 없으면 not_running, CLI session id가 없으면 no_session이다"
      - "switch_plan은 TUI면 to gui(도는 turn은 목록의 running), GUI면 to tui(handle의 도는 turn, 도는 task 수, 줄 선 메시지 수)다"
      - "cli_sessions는 그 터미널의 GUI run이 이 폴더에서 가진 지난 CLI session(최근 순), rewind_preview는 그 사람 메시지로 rewind하면 되돌아갈 file이다. handle이나 run이 없으면 빈 목록과 null이다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "switch_plan·cli_sessions·rewind_preview의 session이 목록에 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    docs: [architecture/harness-gui.md]

  - id: coding-session-switch
    title: 사람이 확인한 뒤 coding session의 터미널을 chat과 TUI 사이에서 바꾼다
    actor: person
    entries: [route:coding_sessions/switch]
    boundary: [core, extension-host]
    code:
      - packages/core/terminal-agents/coding-sessions.ts
      - packages/core/terminal-agents/gui.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/core/extensions/bundled/harness-gui/index.ts
    steps:
      - "입력에 confirmed: true가 없으면 schema에서 invalid_input이고 view를 바꾸지 않는다. 사람 자격만 부른다"
      - "같은 key는 한 번만 바꾼다(바꾸는 중이거나 성공한 것의 답을 준다. 실패한 key는 잊어 다시 부를 수 있다)"
      - "session이 목록에 없으면 not_found, 이미 그 view면 conflict, Windows면 unavailable(unsupported_os)이다"
      - "to gui: handle이 있으면(shared 대화) view만 바꾼다. 없으면 foreground TUI가 GUI가 되는 harness이고 session id를 알아야 한다(아니면 invalid_input의 not_running, no_session). harness-gui가 꺼져 있으면 unavailable(extension_off)이다. extension은 TUI를 먼저 끈 뒤 adapter를 시작하고, run이 서지 않으면 core가 handle을 닫아 unavailable(failed)이며 TUI는 그대로 남는다"
      - "to tui: extension이 TUI로 돌린다(restart는 handle을 닫고, shared는 handle을 남기고 view만 바꾼다). 던지면 unavailable(failed)이다"
      - "바뀌면 StateChanged {coding_sessions}가 나간다(coding-session-sync)"
    outcomes:
      - id: switched
        observe: [event:StateChanged, response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다(다시 바꾸지 않는다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "confirmed: true가 없다, 입력 schema가 틀렸다, 또는 no_session·not_running이다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "session이 목록에 없다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "이미 그 view다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "extension_off·unsupported_os·failed다"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]

  - id: coding-session-open
    title: 폰이 컴퓨터의 project에 coding session을 새 터미널의 chat으로 연다(창이 없어도 열린다)
    actor: person
    entries: [route:coding_sessions/open]
    boundary: [core, host-queue-core]
    code:
      - packages/core/terminal-agents/open.ts
      - packages/core/terminal-agents/hold.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
      - packages/core/terminals/service.ts
    steps:
      - "같은 key는 한 번만 연다(여는 중이거나 성공한 것의 답을 준다. 실패한 key는 잊는다). 사람 자격만 부른다"
      - "harness가 GUI가 되는 coding agent(claude, codex, opencode, omp)가 아니면 invalid_input이다"
      - "harness-gui가 꺼져 있으면 터미널을 열지 않고 unavailable(details.reason extension_off)이다. 폰은 extension이 꺼졌다고 보인다"
      - "resume이면 ledger session이 없거나 그 project의 것이 아니면 not_found, harness agent session이 아니거나 harness가 다르거나 CLI session id가 없으면 invalid_input, 목록에 같은 CLI session이 있으면 conflict다. 그 뒤 TUI hold를 건다: TUI로 열려 있거나 headless turn이 돌면 conflict다"
      - "core가 그 project에 새 터미널을 열고 사람이 치는 것과 같은 `<harness> gui`(resume이면 --resume <cli_session>)를 친다. 터미널의 shell 함수가 hook socket으로 GUI를 청하면 harness-gui-open이 이어 받는다. tab_open(target terminal {terminal_ref})을 넣어 그 project를 보이는 창이 있으면 탭으로 보인다"
      - "연 터미널의 session(ses_<터미널 ULID>)으로 답한다. resume이면 그 터미널이 끝날 때까지 그 ledger session을 쥔다(harness-tui-hold)"
    outcomes:
      - id: opened
        observe: [process:pty, response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다(다시 열지 않는다)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "입력 schema가 틀렸다, GUI가 되지 않는 harness다, resume session이 harness agent session이 아니거나 harness가 다르거나 CLI session id가 없다, 또는 project에 등록 폴더가 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "resume session이 ledger에 없거나 그 project의 것이 아니다, 또는 project가 없다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "그 CLI session이 이미 컴퓨터의 터미널에서 돈다, TUI로 열려 있다, 또는 headless turn이 돈다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "harness-gui가 꺼져 있다(details.reason extension_off, 터미널을 열지 않는다), 또는 PTY를 띄우지 못했다(spawn_failed, host_lost)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/harness-gui.md]
    unclear:
      - "GUI adapter가 시작하지 못해도 열기는 성공이고 그 터미널에 실패가 보인다"

  - id: coding-session-input
    title: 화면과 폰이 coding session의 대화를 읽고 입력을 그 터미널의 GUI handle에 넘긴다
    actor: person
    uses: [route:acp/snapshot, route:acp/send]
    when: "session이 core의 GUI handle에 있다(ledger session이 아니다)"
    boundary: [acp, core]
    code:
      - packages/core/main/daemon/wiring/acp.ts
      - packages/core/terminal-agents/coding-sessions.ts
      - packages/core/terminal-agents/gui.ts
    steps:
      - "acp/snapshot은 handle의 상태에서 tool 본문을 빼고 제품 redactor로 모든 글을 거른 것이다. 알려진 secret을 아직 다 모르면 unavailable이다"
      - "acp/send는 입력 전체를 handle에 넘긴다(adapter가 CLI로 보낸다). core는 ledger에 쓰지 않는다. 승인 card의 decide도 handle로 가고 core의 turn_requests는 건드리지 않는다"
      - "key가 있는 입력(send의 id와 key, stop·set_model 등의 key)은 session마다 200개를 기억해 같은 것은 다시 넘기지 않는다"
      - "handle이 없으면 ledger 길(acp-read, acp-send)로 가고 그 session은 ledger에 없어 not_found다"
    outcomes:
      - id: sent
        observe: [process:cli-gui, response]
      - id: deduplicated
        when: "같은 key의 입력을 다시 보냈다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "handle이 없다(닫혔다). ledger 길로 가고 그 session은 ledger에 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "입력이 ACP 입력 schema에 맞지 않는다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "snapshot: 알려진 secret을 아직 다 모른다"
        observe: [response]
    crosses_process: true
    risk: [data-loss, secret]
    docs: [architecture/harness-gui.md, architecture/acp.md]

  # ---- 폰의 raw 터미널 화면: host가 밀어 올린 최신 화면을 core가 들고 폰이 읽는다 ----
  - id: terminal-view-screen
    title: core가 보는 중인 터미널의 최신 화면을 PTY host에서 읽어 메모리에 두고 바뀌었다고 알린다
    actor: system
    entries: [system:terminal-view-screen]
    boundary: [core]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/core/terminals/service.ts
    steps:
      - "lease가 있는 터미널만 250ms마다 PTY host가 파싱해 둔 화면(lease들의 tail 최대)을 읽어 최신 화면으로 바꾼다(옛 것을 대신한다)"
      - "seq·generation·크기가 바뀌었으면 TerminalScreenChanged {terminal, seq}를 subject terminal:<ref>로 Bus에 낸다. 화면 내용은 싣지 않고 폰이 terminal_view/snapshot을 다시 읽는다"
      - "터미널이 coding session 목록에서 빠지면 그 터미널의 화면과 lease와 입력 key를 지운다"
      - "마지막 lease가 끝나면 읽기를 멈추고 화면을 지우며, 폰이 PTY 크기를 잡았으면 그 표지를 놓아 desktop 탭이 자기 크기로 되돌린다. lease는 5초마다 기한(30초)을 본다"
    outcomes:
      - id: changed
        observe: [event:TerminalScreenChanged]
      - id: dropped
        when: "lease가 없거나 목록에 없는 터미널이다(읽지 않는다)"
    crosses_process: true
    risk: [secret]
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  - id: terminal-view-watch
    title: 폰이 coding session 터미널을 보겠다고 lease를 켜고 갱신하고 끈다
    actor: person
    entries: [route:terminal_view/watch]
    boundary: [core]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/protocol/coding-agent/terminal-view.ts
    steps:
      - "on이면 이 principal과 터미널의 lease를 30초로 만들거나 갱신한다(폰이 10초마다 같은 호출을 한다). tail은 viewport 위 scrollback 줄 수로 0~500이고 없으면 100이다. 터미널이 coding session 목록에 없고 폰이 연 터미널(기기가 부른 terminals/open)도 아니면 not_found다"
      - "켜면 화면을 한 번 읽고 lease가 있는 동안 계속 읽는다(terminal-view-screen). 폰이 연 터미널을 PTY host가 모르면 그 터미널을 잊는다. 읽기의 not_found·invalid_input·conflict는 그대로, 그 밖의 code는 unavailable로 준다"
      - "off이거나 기한이 지나 마지막 lease가 끝나면 읽기를 멈추고 폰이 잡은 PTY 크기를 놓는다"
    outcomes:
      - id: watching
        observe: [event:TerminalScreenChanged, response]
      - id: stopped
        when: "on이 false이거나 lease 기한이 지났다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "터미널이 coding session 목록에 없고 폰이 연 터미널도 아니다, 또는 PTY host가 그 터미널을 모른다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY host가 답하지 않았다(host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  - id: terminal-view-snapshot
    title: 폰이 보는 중인 터미널의 지금 화면과 입력 가능 여부를 읽는다
    actor: person
    entries: [route:terminal_view/snapshot]
    boundary: [core]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/protocol/coding-agent/terminal-view.ts
    steps:
      - "화면은 core가 PTY host에서 읽은 최신 것 그대로다(generation, seq, columns, rows, cursor, scrollback, lines). input은 부른 principal이 이 터미널에 칠 수 있는가(terminalInputGrant: 기기 device:<id>이고 그 기기의 terminal_input이 켜져 있다)이다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "터미널이 coding session 목록에 없고 폰이 연 터미널도 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "아직 화면이 오지 않았다(watch 직후)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: false
    risk: [secret]
    docs: [architecture/remote.md, architecture/terminal-agent.md]

  - id: terminal-view-resize
    title: 폰이 보는 터미널의 PTY 크기를 자기 화면의 열과 줄 수로 잡는다
    actor: person
    entries: [route:terminal_view/resize]
    boundary: [core]
    code:
      - packages/core/terminal-view/view.ts
      - packages/core/main/daemon/wiring/terminal-view.ts
      - packages/protocol/coding-agent/terminal-view.ts
      - packages/core/terminals/service.ts
      - packages/mobile/src/data/terminal.ts
      - packages/mobile/src/screens/terminal/index.tsx
    steps:
      - "폰은 터미널 화면을 열 때(watch를 새로 잡을 때마다), 화면을 누를 때, 자기가 크기를 쥔 동안 화면 크기가 바뀔 때(keyboard, 회전) 자기 화면의 열(10~512)과 줄(4~256)로 부른다. lease 갱신은 부르지 않는다"
      - "터미널이 coding session 목록에 없고 폰이 연 터미널도 아니면 not_found, 이 principal이 그 터미널의 lease를 갖지 않으면 conflict다"
      - "그 터미널의 지금 generation으로 PTY 크기를 폰 크기 표지(remote_size)와 함께 잡는다. 터미널의 not_found·invalid_input·conflict는 그대로, 그 밖의 code는 unavailable로 준다. 마지막에 잡은 쪽이 이긴다: desktop 탭은 사람이 그 탭을 고르거나 누르면 칸 크기로 다시 잡고, lease가 모두 끝나면 core가 폰의 크기 표지를 놓아 탭이 칸에 다시 맞춘다"
    outcomes:
      - id: resized
        observe: [event:TerminalRuntimeChanged, response]
      - id: not_found
        code: not_found
        when: "터미널이 coding session 목록에 없고 폰이 연 터미널도 아니다, 또는 PTY host가 그 터미널을 모른다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "이 principal이 그 터미널을 보고 있지 않다(lease가 없다)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY host가 답하지 않았거나 크기 바꾸기를 거절했다(터미널이 돌지 않는다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/remote.md, architecture/terminal-agent.md]
    unclear:
      - "invalid_input은 선언만 있고 입력 schema 밖에서는 내지 않는다"

  # ---- 멀리서 page 보기: host가 민 최신 frame을 core가 들고 사람의 다른 기기가 읽고 다룬다(page_view/*) ----
  - id: page-view-frame
    title: core가 보는 중인 browser 탭의 최신 frame과 상태를 host에서 받아 메모리에 두고 바뀌었다고 알린다
    actor: system
    entries: [system:page-view-frame]
    boundary: [core, host-queue-interface]
    code:
      - packages/core/host-queue/page-view.ts
      - packages/core/host-queue/queue.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/host-link/frames.ts
    steps:
      - "host가 /host-link로 page_frame(JPEG 한 장과 host seq)이나 page_state(painting, agent, held)를 보낸다. core는 lease가 있고 표에 있는 browser 탭이면 그 탭의 최신 frame이나 상태로 바꾸고(옛 것을 대신한다) view seq를 올린다"
      - "PageViewChanged {tab, seq}를 subject page:<tab>로 Bus에 낸다. frame은 싣지 않고 보는 쪽이 page_view/snapshot을 다시 읽는다"
      - "browser 탭이 표에 생기거나 빠지거나 renderer가 그 상태(url·title·loading)를 알리면 StateChanged browser_pages를 내고, 표에서 빠진 탭의 lease·frame·입력 key를 지운다"
      - "lease는 5초마다 기한(30초)을 본다. 마지막 lease가 끝나면 그 탭의 frame을 지우고 host에 page_stream {on: false}를 보낸다. 연결이 다시 열리면 살아 있는 lease마다 page_stream {on: true}를 다시 보낸다"
    outcomes:
      - id: changed
        observe: [event:PageViewChanged]
      - id: dropped
        when: "lease가 없거나 표에 없는 탭의 frame·상태다(버린다)"
      - id: listed
        when: "browser 탭 표가 바뀌었다"
        observe: [event:StateChanged]
    crosses_process: true
    risk: [secret]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: page-view-list
    title: 사람의 기기가 이 기계의 core가 아는 browser 탭 목록을 읽는다
    actor: person
    entries: [route:page_view/list]
    boundary: [core]
    code:
      - packages/core/host-queue/page-view.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/page-view.ts
    steps:
      - "core 표의 browser 탭(agent가 tab open --url로 연 탭과 사람이 page_view/open으로 연 탭)마다 tab, url, title, loading, by(연 agent의 이름, 사람이 연 탭은 null)를 낸다. url·title은 redaction을 지난다. renderer가 아직 상태를 알리지 않은 탭은 url·title이 빈 글이고 loading이 true다. 목록이나 url·title이 바뀌면 StateChanged browser_pages가 난다"
    outcomes:
      - id: ok
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "알려진 secret을 아직 다 몰라 url·title을 가리지 못했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch와 page view 둘 다). agent 자격은 자기 탭도 이 길로 보지 못한다"
        observe: [response]
    crosses_process: false
    risk: [secret]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: page-view-snapshot
    title: 사람의 기기가 보는 browser 탭의 최신 frame과 상태를 읽는다
    actor: person
    entries: [route:page_view/snapshot]
    boundary: [core, host-queue-interface]
    code:
      - packages/core/host-queue/page-view.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/page-view.ts
    steps:
      - "core가 그 탭에 든 최신 frame 하나(JPEG, viewport CSS px 크기, 아직 없거나 lease가 없으면 null)와 seq, 상태(painting, agent, held, url, title, loading, by)를 낸다. host 상태를 아직 못 받았으면 painting true, agent·held false다. painting이 false면 그 page를 그리지 않는 것이다(창이 최소화되거나 숨겨짐). url·title은 redaction을 지나고 그림은 가리지 않는다(screenshot과 같다)"
      - "control은 부른 principal이 이 탭을 다룰 수 있는가다: 기기 device:<id>이고 그 기기의 터미널 입력 허락이 켜져 있어야 한다"
      - "내준 frame의 host seq를 아직 알리지 않았으면 host에 page_read {tab, seq}를 연결 요청으로 보낸다(실패는 버린다). host는 그것이 오기 전에는 그 탭의 다음 frame을 보내지 않는다"
    outcomes:
      - id: ok
        observe: [request:shell, response]
      - id: not_found
        code: not_found
        when: "core 표의 browser 탭이 아니다(없는 탭, 닫힌 탭, browser 탭이 아닌 탭)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "알려진 secret을 아직 다 몰라 url·title을 가리지 못했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch와 page view 둘 다). agent 자격은 다른 session이 연 탭도 자기 탭도 읽지 못한다"
        observe: [response]
    crosses_process: false
    risk: [secret]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: page-view-watch
    title: 사람의 기기가 browser 탭을 보겠다고 lease를 켜고 갱신하고 끈다
    actor: person
    entries: [route:page_view/watch]
    boundary: [core, host-queue-interface]
    code:
      - packages/core/host-queue/page-view.ts
      - packages/core/host-queue/queue.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/page-view.ts
      - packages/protocol/lophn-agent/host-queue.ts
      - packages/protocol/host-link/frames.ts
    steps:
      - "on이면 이 principal과 탭의 lease를 30초로 만들거나 갱신한다(보는 쪽이 10초마다 같은 호출을 한다). core 표의 browser 탭이 아니면 not_found다"
      - "탭에 첫 lease가 생기면 core가 host에 page_stream {on: true}를 연결 요청으로 보낸다(켜고 끄는 요청은 탭마다 한 줄로 서서 순서가 뒤집히지 않는다). host는 지금 frame 하나와 page_state를 보내고, 그 뒤로 page가 바뀔 때마다 page_frame을 민다(page-view-frame). host에 닿지 않아도 lease는 남아 연결이 다시 열리면 켠다"
      - "host의 not_found·invalid_input·conflict·unavailable은 그대로, 그 밖의 code는 unavailable로 준다"
      - "off이거나 기한이 지나 마지막 lease가 끝나면 그 탭의 frame을 지우고 page_stream {on: false}로 끈다. 보는 쪽이 없으면 host는 frame을 만들지 않는다. off는 탭이 없어도 성공이다"
    outcomes:
      - id: watching
        observe: [event:PageViewChanged, request:shell, response]
      - id: stopped
        when: "on이 false이거나 lease 기한이 지났다"
        observe: [request:shell, response]
      - id: not_found
        code: not_found
        when: "core 표의 browser 탭이 아니다, 또는 host가 그 page를 모른다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "page를 든 host가 연결되어 있지 않거나, 답하기 전에 끊겼거나, 기한(5초) 안에 답하지 않았다"
        observe: [response]
      - id: host-rejected
        code: conflict
        when: "host가 conflict로 거절했다(그대로 준다)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch와 page view 둘 다)"
        observe: [response]
    crosses_process: true
    risk: [secret]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: page-view-input
    title: 사람의 기기가 보는 browser 탭에 pointer·scroll·글·key·주소 이동·뒤로·다시 읽기를 넣는다
    actor: person
    entries: [route:page_view/input]
    boundary: [core, host-queue-interface]
    code:
      - packages/core/host-queue/page-view.ts
      - packages/core/main/daemon/wiring/host-queue.ts
      - packages/protocol/lophn-agent/page-view.ts
      - packages/protocol/lophn-agent/host-queue.ts
    steps:
      - "사람 자격이어야 하고 기기 device:<id>의 터미널 입력 허락이 켜져 있어야 한다(로그인된 browser를 다루는 것은 터미널에 치는 것만큼 센 권한이다). 아니면 host에 아무것도 보내지 않는다"
      - "core 표의 browser 탭이 아니면 not_found, 이 principal이 그 탭의 lease를 갖지 않으면 conflict다(좌표는 본 frame에 대한 것이다)"
      - "같은 key는 탭마다 200개를 기억해 한 번만 넣는다(보내는 중이거나 성공한 것의 답을 준다. 실패한 key는 잊는다)"
      - "core가 host에 page_input {tab, input}을 연결 요청으로 보내고 host가 CDP Input.*으로 넣는다. 좌표는 보는 쪽이 본 frame의 page CSS px다. 연결이 없거나 끊기면 넣지 않고 다음 연결로 다시 보내지 않는다(늦은 입력이 page에 들어가지 않게). host의 not_found·invalid_input·conflict·unavailable은 그대로, 그 밖은 unavailable이다"
    outcomes:
      - id: sent
        observe: [request:shell, response]
      - id: not_found
        code: not_found
        when: "core 표의 browser 탭이 아니다, 또는 host가 그 page를 모른다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "이 principal이 그 탭을 보고 있지 않다(lease가 없다), 또는 host가 conflict로 거절했다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "page를 든 host가 연결되어 있지 않거나, 답하기 전에 끊겼거나, 기한(10초) 안에 답하지 않았다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch와 page view 둘 다: agent 자격), 또는 터미널 입력 허락이 없는 기기다(기기가 아닌 사람 token 포함)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  - id: page-view-control
    title: 사람의 기기가 agent가 다루는 browser 탭을 멀리서 가져오거나 돌려준다
    actor: person
