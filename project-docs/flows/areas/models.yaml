area: models
flows:

  # ---- 설정 file (settings.json) ----

  - id: settings-read
    title: "설정 선언과 사람이 고른 값을 읽는다"
    actor: person
    entries: [route:settings/list]
    boundary: [config]
    code: [packages/core/config/routes.ts, packages/core/config/store.ts]
    steps:
      - "요청의 key 목록으로 선언(registry)을 거르고 없으면 전부 낸다"
      - "선언의 type을 JSON Schema로 바꾸고 기본값과 사람이 고른 값(chosen)을 붙인다. 파일에 없는 값은 chosen이 없다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다"
        observe: ["response"]
    crosses_process: false
    refs: []
    docs: []
    unclear: []

  - id: settings-update
    title: "설정 값을 바꾼다"
    actor: person
    entries: [route:settings/update]
    boundary: [config]
    code: [packages/core/config/store.ts, packages/core/config/routes.ts, packages/core/config/registry.ts]
    steps:
      - "선언에 없는 key나 타입·범위가 틀린 값이 하나라도 있으면 아무것도 쓰지 않고 rejected 목록을 돌려준다"
      - "쓰기 직전에 settings.json을 다시 읽고 그 raw object에서 바뀐 key만 덮는다. 선언을 지운 key나 모르는 key는 파일에 남는다"
      - "같은 폴더의 임시 파일(0600)에 쓰고 rename한다. 값이 실제로 바뀐 key가 있을 때만 SettingsChanged를 낸다"
    outcomes:
      - id: changed
        observe: ["disk:<root>/settings.json", "event:SettingsChanged", "response"]
      - id: unchanged
        when: "바꿀 값이 지금 값과 같거나 없는 key를 unset했다"
        observe: ["response"]
      - id: rejected
        when: "선언에 없는 key나 틀린 값이 있다. ok 응답의 rejected 목록이고 아무것도 쓰지 않는다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "settings.json이 JSON이 아니거나 읽지 못해 쓰지 않는다. 임시 파일 쓰기나 rename이 실패해도 파일은 그대로다"
        observe: ["response", "log:settings"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다(같은 key가 두 번 들어옴 포함)"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    refs: []
    docs: []
    unclear:
      - "settings.json 쓰기에는 revision 비교가 없다. 두 창이 같은 key를 바꾸면 마지막 쓰기가 이긴다. 목록 전체를 한 key에 싣는 화면(MCP 서버 배열)은 읽은 뒤 쓰기 사이에 다른 창이 바꾼 값을 지울 수 있다"

  - id: settings-file-watch
    title: "손으로 고친 settings.json을 다시 읽는다"
    actor: system
    entries: [system:settings-file-watch]
    boundary: [config]
    code: [packages/core/config/store.ts, packages/core/main/daemon/wiring/config.ts]
    steps:
      - "기동 때 settings.json을 한 번 읽어 chosen 값을 맞춘다. 선언에 없는 key나 틀린 값은 log만 남기고 그 key만 무시한다"
      - "폴더 watch가 settings.json 신호를 받으면 100ms 묶음으로 한 번 다시 읽는다"
      - "내용이 마지막으로 읽거나 쓴 것과 같으면 무시한다. 자기 쓰기에는 반응하지 않는다"
      - "값이 달라진 key만 SettingsChanged로 낸다"
    outcomes:
      - id: changed
        observe: ["event:SettingsChanged"]
      - id: rejected-key
        when: "선언에 없는 key나 틀린 값이 있다. 그 key만 기본값으로 두고 나머지는 적용한다"
        observe: ["log:settings"]
      - id: broken-json
        when: "JSON이 깨졌거나 object가 아니다. 이전 값을 그대로 두고 쓰기도 거절된다(사람이 고칠 때까지)"
        observe: ["log:settings"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear: []

  # ---- MCP 서버 로그인 (agent-mcp-auth) ----

  - id: mcp-auth-begin
    title: "MCP 서버 로그인을 시작하고 browser에 열 주소를 받는다"
    actor: person
    entries: [route:agent-mcp-auth/begin]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-auth-control.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/lophn-agent/extensions/mcp-auth.ts]
    steps:
      - "이름과 소유자(전역, project, agent 정의)로 등록된 http oauth2 서버를 찾는다. 사람이 적은 client_id가 등록한 것과 같아야 한다"
      - "발급자 metadata에서 끝점을 찾는다. authorization 끝점이 https가 아니면 거절한다"
      - "등록된 callback port에 127.0.0.1 listener를 열고 PKCE verifier와 state를 만든다"
      - "authorization 주소와 callback port를 돌려준다. 시작 값은 메모리에만 있고 5분 시한이 걸린다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "그 소유자에 등록되지 않은 서버다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "소유자를 둘 다 적었거나 oauth2 서버가 아니거나 client_id가 등록한 것과 다르거나 끝점이 https가 아니다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "이미 진행 중인 시작이 있거나 callback port를 다른 프로그램이 쓰고 있다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "loopback callback port를 열 수 없다(EADDRINUSE가 아닌 listen 실패)"
        observe: ["response"]
    crosses_process: false
    refs: []
    docs: [architecture/agent-definition.md]
    unclear: []

  - id: mcp-auth-finish
    title: "MCP 서버 로그인의 callback을 받아 token을 보관한다"
    actor: person
    entries: [route:agent-mcp-auth/complete]
    boundary: [lophn-agent, secrets]
    code: [packages/core/lophn-agent/extensions/mcp-auth.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/lophn-agent/extensions/mcp-oauth-vault.ts]
    steps:
      - "진행 중인 로그인을 찾는다. 시작하지 않았으면 conflict다"
      - "callback을 기다린다(시한 5분). 돌아온 state가 시작의 것과 다르면 세션을 닫고 거절한다"
      - "token endpoint에 code를 교환한다. core가 발급자에 직접 보낸다"
      - "refresh, access, 접근 meta를 secrets.json의 mcp-oauth.<소유자>.<서버> 이름들에 보관한다. 설정 파일에는 쓰지 않는다"
    outcomes:
      - id: completed
        observe: ["disk:<root>/secrets.json", "response"]
      - id: no-session
        code: conflict
        when: "시작하지 않은 상태에서 완료를 불렀다"
        observe: ["response"]
      - id: cancelled
        code: conflict
        when: "사람이 그만둔 뒤에 callback이 돌아왔다"
        observe: ["response"]
      - id: state-mismatch
        code: invalid_input
        when: "callback의 state가 시작의 state와 다르다. 실패 사유로 state_mismatch를 남긴다"
        observe: ["response"]
      - id: timed-out
        code: unavailable
        when: "5분 안에 callback이 없었거나 시한이 지난 뒤 돌아왔다"
        observe: ["response"]
      - id: exchange-rejected
        code: forbidden
        when: "발급자가 code 교환을 거절했다. 실패 사유 exchange_failed"
        observe: ["response"]
      - id: exchange-failed
        code: unavailable
        when: "발급자에 닿지 못했거나 token 응답이 JSON·객체·access_token 꼴이 아니다"
        observe: ["response"]
      - id: store-failed
        code: unavailable
        when: "token을 secrets.json에 쓰지 못했다. 실패 사유 store_failed"
        observe: ["response", "log:secrets"]
      - id: not_found
        code: not_found
        when: "등록하지 않은 서버다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "서버 이름이 맞지 않거나 소유자(workspace, agent)를 둘 다 적었다"
        observe: ["response"]
    crosses_process: false
    risk: [secret]
    refs: []
    docs: [architecture/agent-definition.md]
    unclear: []

  - id: mcp-auth-state
    title: "MCP 서버마다 로그인 상태를 읽는다"
    actor: person
    entries: [route:agent-mcp-auth/state]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-auth-control.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "요청한 (이름, 소유자)를 등록된 서버에서 찾는다. 없거나 OAuth가 아니면 none이다"
      - "진행 중인 로그인, 마지막 실패, 보관한 token이 지금 설정(발급자, URL, client)과 맞는지로 상태를 정한다"
      - "token, verifier, state 값은 답에 싣지 않는다"
    outcomes:
      - id: none
        when: "서버가 없거나 OAuth가 아니거나 로그인하지 않았거나 설정이 바뀌어 옛 token을 쓰지 않는다. 서버마다의 output 상태다"
        observe: ["response"]
      - id: in-progress
        when: "사람이 browser에서 돌아오기를 기다린다. 서버마다의 output 상태다"
        observe: ["response"]
      - id: signed-in
        when: "쓸 수 있는 token이 있다. 서버마다의 output 상태다"
        observe: ["response"]
      - id: failed
        when: "마지막 시도나 갱신이 실패했다. reason(callback_timeout, state_mismatch, exchange_failed, refresh_rejected, expired, store_failed)을 같이 낸다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "한 서버에 소유자 둘을 함께 적었다"
        observe: ["response"]
    crosses_process: false
    risk: []
    refs: []
    docs: [architecture/agent-definition.md]
    unclear: []

  - id: mcp-auth-cancel
    title: "기다리는 MCP 서버 로그인을 그만둔다"
    actor: person
    entries: [route:agent-mcp-auth/cancel]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-auth-control.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "기다리는 로그인의 세션을 끊고 callback listener를 닫는다. 설정에서 지워진 서버의 로그인도 그만둘 수 있다"
      - "이미 보관한 token은 건드리지 않는다"
    outcomes:
      - id: cancelled
        observe: ["response"]
      - id: nothing-to-cancel
        when: "진행 중인 로그인이 없다. 아무것도 바뀌지 않는다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "소유자를 둘 다 적었거나 이름이 맞지 않는다"
        observe: ["response"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear: []

  # ---- MCP tool 목록과 연결 ----

  - id: mcp-tools-list
    title: "Grants 화면에 서버별 MCP tool 목록을 보인다"
    actor: person
    entries: [route:agent-mcp-tools/list, route:agent-mcp-tools/request-take]
    uses: [route:agent-mcp-tools/request-done]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-tool-requests.ts, packages/core/lophn-agent/extensions/mcp-toolkit.ts, packages/core/main/agent-runtime/mcp-tools-pump.ts]
    steps:
      - "core가 요청을 작업 메모리 대기열에 놓고 15초를 기다린다. 대기열은 ledger에 쓰지 않는다"
      - "agent runtime의 pump가 request-take로 가져가 workspace와 agent가 정하는 서버 집합을 읽는다"
      - "서버마다 설정 검사를 거쳐 연결하고 tools/list를 읽는다. 끈 서버는 연결하지 않는다"
      - "결과는 request-done으로 돌아와 list가 깨어난다. 기한 안에 답이 없으면 대기열에서 빠진다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: disabled
        when: "서버가 설정에서 꺼져 있다. 서버마다의 output reason이다"
        observe: ["response"]
      - id: sign-in-required
        when: "OAuth 로그인이 필요한 서버다. 서버마다의 output reason이다"
        observe: ["response"]
      - id: unreachable
        when: "연결이나 목록 읽기가 실패했거나 서버별 상한을 넘었다. 서버마다의 output reason이다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "15초 안에 runtime이 답하지 않았다(runtime이 없거나 서버가 느림)"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "입력 모양이 맞지 않는다"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: [H3]
    docs: [architecture/agent-definition.md]
    unclear: []

  - id: mcp-tools-answer
    title: "runtime이 읽은 MCP tool 목록을 core의 대기 요청에 돌려준다"
    actor: system
    entries: [route:agent-mcp-tools/request-done]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-tool-requests.ts, packages/core/main/agent-runtime/mcp-tools-pump.ts]
    steps:
      - "agent runtime의 pump가 서버를 다 읽고 request-done으로 결과를 보낸다. 읽다 던지면 답하지 않는다"
      - "아직 기다리는 요청이면 결과 모양을 검사해 list에 넘기고 accepted true를 답한다"
      - "기한이 지났거나 모르는 요청이면 늦은 답으로 버린다"
    outcomes:
      - id: accepted
        observe: ["response"]
      - id: late
        when: "기한이 지났거나 모르는 요청이다. accepted false다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "결과 모양이 MCP tool 목록 schema와 맞지 않는다"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: []
    docs: []
    unclear: []

  - id: mcp-server-connect
    title: "턴이 시작할 때 설정한 MCP 서버에 붙어 tool을 쓴다"
    actor: system
    entries: [system:mcp-server-connect]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/mcp-toolkit.ts, packages/core/lophn-agent/extensions/mcp-config.ts, packages/core/lophn-agent/extensions/mcp-snapshot.ts]
    steps:
      - "turn 준비가 전역, project, agent 정의 층을 차례로 덮어 이 agent가 쓸 서버를 정한다. 층이 끈 서버와 skip한 서버는 뺀다"
      - "설정 검사에서 틀린 서버는 연결하지 않고 나머지는 그대로 둔다"
      - "서버마다 연결을 얻고 tools/list를 읽는다. 하나라도 실패하면 그 서버는 failed다"
      - "oauth2 서버는 요청마다 core에 접근 token을 청한다. 만료가 가까우면 core가 refresh한다. 발급자가 거절하면 token을 지우고 로그인이 필요해지고, 발급자에 닿지 못했거나 응답이 이상하면 아직 유효한 token은 그대로 쓰고 아니면 연결 실패다"
      - "tool 호출마다 지금 설정을 다시 읽는다. 사람이 끈 서버나 지워진 서버의 호출은 거절한다"
    outcomes:
      - id: attached
        observe: ["request:mcp-server"]
      - id: unreachable
        when: "연결하지 못했거나 목록을 읽지 못했다. 그 서버의 tool은 이 turn에 실리지 않는다"
        observe: ["request:mcp-server"]
      - id: sign-in-required
        when: "OAuth 토큰이 없거나 거절되어 로그인이 필요하다. 그 서버의 tool은 이 turn에 실리지 않는다"
        observe: ["request:mcp-server"]
      - id: call-rejected
        code: unavailable
        when: "도는 turn 안에서 사람이 서버를 끄거나 지웠거나 서버 설정을 찾지 못한다. 호출이 거절된다"
        observe: ["response"]
    crosses_process: true
    risk: [sandbox]
    refs: [H3]
    docs: [architecture/agent-definition.md]
    unclear:
      - "revokeServer를 부르는 곳이 저장소에 없다. 도는 turn을 서버 제거로 끊는 경로는 없고 다음 tool 호출부터 막힌다"

  # ---- project 층 MCP 설정 ----

  - id: project-extension-read
    title: "project 층의 MCP 서버와 끈 항목을 읽는다"
    actor: person
    entries: [route:project-extension-settings/read]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/project-settings.ts]
    steps:
      - "project가 있는지 본다"
      - "projects 폴더의 extensions.json을 읽어 hash와 내용을 낸다. 파일이 없으면 빈 값과 hash null이다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: not_found
        code: not_found
        when: "project가 없다"
        observe: ["response"]
      - id: invalid_input
        code: invalid_input
        when: "파일이 틀린 모양이다(사람이 손으로 고친 경우)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "파일을 읽지 못했다"
        observe: ["response"]
    crosses_process: false
    risk: []
    refs: []
    docs: []
    unclear: []

  - id: project-extension-change
    title: "project 층의 MCP 서버와 끈 항목을 통째로 바꾼다"
    actor: person
    entries: [route:project-extension-settings/change]
    boundary: [lophn-agent]
    code: [packages/core/lophn-agent/extensions/project-settings.ts, packages/core/lophn-agent/extensions/mcp-config.ts]
    steps:
      - "project가 있는지 보고 파일을 다시 읽어 hash가 요청의 compare hash와 같은지 본다. 다르면 conflict다"
      - "MCP 서버 설정 검사를 건다: http는 https나 loopback, stdio는 절대 경로, auth 헤더와 추가 헤더의 이름 충돌, secret 이름은 mcp. 앞머리"
      - "입력 전체로 extensions.json을 원자적으로 쓴다. 입력에 빠진 서버와 항목은 지워진다"
      - "새 hash를 돌려준다. 이 route는 event를 내지 않는다"
    outcomes:
      - id: ok
        observe: ["disk:<root>/projects/<prj>/extensions.json", "response"]
      - id: not_found
        code: not_found
        when: "project가 없다"
        observe: ["response"]
      - id: conflict
        code: conflict
