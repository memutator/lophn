id: ledger-question-path-removed
version: 0.2.0
title: "쓰이지 않던 ledger 질문 길을 지움"
modules: [packages/core/lophn-agent, packages/core/storage, packages/core/main, packages/protocol, tools]
checked: [architecture-event, architecture-agent-call, boundary-catalog, tool-check]
change: |
  전: `ask` tool은 메모리 기다림(`packages/core/lophn-agent/tools/questions/wait.ts`)을 쓰는데, 그 옆에 부르는 곳 없는 ledger 질문 길(질문 표 둘, route `CreateQuestionGroup`·`AnswerQuestionGroup`·`AnswerQuestionAction`·`DeferQuestionGroup`·`CancelQuestionGroup`·`ExpireQuestionGroup`·`ApplyQuestionOption`·`ReadQuestionGroup`·`ListQuestionGroups`·`ReadQuestionText`, event `QuestionCreated` 등, 선택지 고정 action, 보호 설정, 자유 답 검사, 글 blob)이 등록돼 있었다. ledger에는 그 길 전용 `Tx.callChosenOption`, `questionOption` port, `question_evidence` 표가, protocol에는 handler 없는 `ApplySettings`가 있었다.
  후: 위 것을 모두 지웠다. `ask` 길(`ask-tool.ts`, `wait.ts`, bus event `QuestionAsked`·`QuestionResolved`)은 그대로다. machine credential의 operation에서 질문 route와 선택지 action operation이 빠졌다.
why: |
  죽은 길이 harness 안의 domain 섞임과 agent credential의 넓은 상한으로 보였다.
decisions:
  - text: |-
      선택지에 동작을 묶는 기능은 살리지 않는다. 필요해지면 그때의 `ask` 모양에 맞춰 새로 짠다(앞 항목의 사람 결정).
    by: person
  - text: |-
      그 길에만 붙은 ledger 장치와 `ApplySettings`도 같은 schema 변경에서 지웠다.
    by: agent
follow_up: |-
  schema가 바뀌었다(질문 표 둘과 `question_evidence`). 개발 data(`.dev-data/`)는 지우고 새로 만든다.
