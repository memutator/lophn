    paths: [packages/core/lophn-agent/]
  - id: core-apps
    paths: [packages/core/apps/]
  - id: core-extensions
    paths: [packages/core/extensions/]
  - id: core-rest
    paths: [packages/core/]
  - id: shell
    paths: [packages/shell/]
  - id: mobile
    paths: [packages/mobile/]
  - id: libs-tooling
    paths: [packages/, tests/, tools/]

journey_groups:
  - id: setup
    title: 처음 켜기와 설정(provider, model, 설정, extension, 단축키, 모양)
  - id: app
    title: 앱 기획, 짓기, 올리기, 쓰기, 고치기, 되돌리기, package
  - id: project-work
    title: project 일(폴더, 문서, artifact, browser, 터미널과 coding agent, harness GUI, desk와 탭)
  - id: agent-automation
    title: agent 만들기와 할당, call과 team, 승인, workflow, job, run, session rewind
  - id: phone
    title: 다른 기기에서 보기(폰 앱의 pairing, 승인·질문 답하기, 알림 받고 눌러 답하기, project file 읽기, job 켜고 끄기, 명단에서 나가고 새 초대장으로 다시 들기, 컴퓨터의 agent browser page 보고 다루기. desktop에서 다른 컴퓨터의 lophn을 그 컴퓨터의 창으로 보기)
