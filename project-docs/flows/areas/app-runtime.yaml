  - id: app-operation-call
    title: "앱 화면이 operation을 부른다"
    actor: person
    uses: [route:apps/call_tool]
    when: "kind가 operation이고 대상이 운영 앱(live)일 때. 사람이 연 화면의 호출이다"
    pre: [route:releases/activate]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/gate.ts, packages/shell/main/app-frame/app-call.ts]
    steps:
      - "shell main이 페이지가 보낸 {operation, input}을 검사한다. 필드 두 개만, operation 이름(빈 값, 앞뒤 공백, 제어 문자, 와일드카드 없음), JSON 값만 받고 64 KiB 이하다. 어긋나면 core에 보내지 않는다."
      - "shell main이 그 view의 고정 선언을 읽는다(live는 활성 release 선언, preview는 읽지 못해 unavailable). 선언을 읽지 못하면 unavailable이다. 선언의 operation에 없으면(command 이름 포함, 이 앱 밖 포함) forbidden이다."
      - "shell main이 사람 자격으로 app.call_tool(kind operation)을 보낸다. 대상은 view에서 정한 mode, app, release(또는 preview nonce)다. 사람의 호출은 Gate를 거치지 않는다."
      - "core의 답을 페이지 code로 옮긴다. 앱 handler의 실패는 앱이 정한 code와 message를 그대로 싣는다. core 호출이 오류로 끝나거나 끊기면 invalid_input은 invalid_input, forbidden·unauthorized는 forbidden, 그 밖은 unavailable이다(쓰기는 result unknown)."
      - "결과가 operation 상한(CALL_RESULT_MAX_BYTES에서 1 KiB를 뺀 값)을 넘으면 unavailable로 바꾼다. invocation은 succeeded로 남는다."
    outcomes:
      - id: succeeded
        observe: [response, "ledger:invocations"]
      - id: failed
        when: "앱 handler가 오류를 냄(앱이 정한 code와 message를 그대로 싣는다)"
        observe: [response, "ledger:invocations"]
      - id: unknown
        code: unavailable
        when: "보냈는데 응답을 받지 못함(쓰기는 result unknown)"
        observe: ["ledger:invocations", response]
      - id: denied-gate-blocked
        code: forbidden
        when: "사람이 아닌 caller가 core route로 live operation을 부른 경우. 화면 입구에서는 나오지 않는다"
        observe: ["ledger:invocations", response]
      - id: denied-app-unavailable
        code: unavailable
        when: "앱 process에 보내기 전에 막힘, 또는 core가 denied(app_unavailable)로 답함"
        observe: [response, "ledger:invocations"]
      - id: denied-not-declared
        code: forbidden
        when: "core가 활성 release의 operation 선언에서 찾지 못함(shell의 선언 검사를 통과한 뒤라 드묾)"
        observe: [response]
      - id: denied-app-archived
        code: unavailable
        when: "보관한 앱. core가 사람에게 denied(app_archived)로 답하고 화면은 unavailable로 받는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "view의 고정 선언에 없는 operation(command 이름 포함, 이 앱 밖 포함)이라 core에 보내지 않음"
        observe: [response]
      - id: core-refused
        code: forbidden
        when: "core가 호출자 확인에서 거절함(forbidden, unauthorized)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "화면이 보낸 호출 모양이 맞지 않음(필드, operation 이름, 64 KiB 초과, JSON이 아닌 값), 또는 core가 본문 상한을 넘는다고 거절함"
        observe: [response]
      - id: declaration-unavailable
        code: unavailable
        when: "view의 선언을 읽지 못함(preview 대상 포함)"
        observe: [response]
      - id: core-call-failed
        code: unavailable
        when: "core 호출이 그 밖의 오류로 끝나거나 끊김(쓰기는 result unknown), 또는 core 답이 맞지 않음(app response did not match)"
        observe: [response]
      - id: result-too-large
        code: unavailable
        when: "앱이 성공했지만 결과가 operation 상한을 넘어 화면이 받지 못함(invocation은 succeeded로 남는다)"
        observe: [response, "ledger:invocations"]
    crosses_process: true
    risk: [permission, data-loss]
    refs: [P12]
    docs: [architecture/app-call.md]
    unclear:
      - "preview 화면의 operation 호출은 shell main의 declaration-source가 live 선언만 읽어 unavailable이다(이슈 preview-screen-cannot-call-operation). 이 flow는 live만 다룬다."
      - "앱이 낸 failed의 code는 앱이 정한 문자열이 그대로 페이지에 간다(process-wire의 error code는 z.string). 일곱 code 밖일 수 있다."
      - "shell의 coreFailure가 conflict를 'app view가 바뀜'으로 옮기지만 call_tool은 conflict를 내지 않는다. 그래서 이 flow에 conflict 갈래는 없다."

  - id: app-broker-apps-call
    title: "앱이 다른 앱의 command를 broker로 부른다"
    actor: app
    entries: [system:app-broker-apps-call]
    uses: [route:apps/call_tool]
    pre: [app-record-started:started]
    boundary: [app-runtime, app-capability]
    code: [packages/core/apps/permissions/broker/apps-call.ts, packages/core/apps/permissions/broker/server.ts]
    steps:
      - "앱 자식이 SDK로 broker의 apps/call에 target 앱, command, 입력, parent invocation을 보낸다. broker endpoint가 credential, 본문(JSON 객체, 1 MiB), process_nonce·mode가 연결과 같은지 먼저 본다."
      - "요청 모양을 검사한다. 자식이 운영 앱(live)이면서 release가 있어야 한다. preview 자식은 막힌다."
      - "core app.call_tool을 이 자식의 app credential로 부른다(caller kind app, 자식의 release, parent invocation). 판정과 기록은 app-command-call을 따른다."
      - "core의 결과를 그대로 앱에 돌려준다. core 응답 모양이 맞지 않으면 internal이다. core가 다른 오류로 답하면 그 오류를 그대로 돌려준다."
    outcomes:
      - id: forwarded
        when: "core가 succeeded, failed, denied, unknown 가운데 하나를 돌려줌(그대로 전달)"
        observe: [response, "ledger:invocations"]
      - id: invalid-input
        code: invalid_input
        when: "본문이 JSON 객체가 아니거나 1 MiB를 넘음, apps/call 모양이 맞지 않음, core가 입력이 frame 상한을 넘는다고 거절함"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "운영 자식이 아님(preview 자식, release 없음), 또는 core가 거절함(자식의 release가 활성 release가 아님, parent_invocation이 그 앱의 지금 도는 호출이 아님)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: internal
        code: internal
        when: "core 응답 모양이 맞지 않음"
        observe: [response]
      - id: core-failed
        when: "core가 낸 그 밖의 오류 그대로(호출자 확인의 port 실패, 기록 읽기·쓰기 실패 등)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    refs: [P12]

  # ---------- 호출 기록과 되돌리기 ----------

  - id: app-invocation-read
    title: "호출 기록을 목록이나 한 건으로 읽는다"
    actor: agent
    entries: [route:apps/invocations, route:apps/invocation]
    boundary: [app-runtime]
    code: [packages/core/apps/invocations/reads.ts, packages/core/apps/invocations/store.ts]
    steps:
      - "목록은 app, session, turn, effect, status, reverted, mode, release 필터와 cursor(최대 200개)로 자른다. 범위 밖 앱의 기록은 뺀다. agent에게는 보관한 앱의 기록이 없다(archivedToAgent)."
      - "한 건은 범위 밖이거나 없으면 null이다. 없는 기록과 같은 모양이다."
      - "읽기만 한다. 기록을 남기지 않는다. 사람의 화면도 같은 두 route를 쓸 수 있다."
    outcomes:
      - id: listed
        observe: [response]
      - id: found
        observe: [response]
      - id: missing
        when: "한 건이 없거나 범위 밖(invocation이 null)"
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 inv id 꼴이 아님"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, agent, machine)"
        observe: [response]
      - id: read-failed
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable), 저장된 invocation 행이 깨짐(internal)"
        observe: [response]
    crosses_process: false
    refs: [A2, L7]
    docs: [architecture/app-call.md]

  - id: app-rewind-plan
    title: "앱 data를 고른 호출 시점으로 되돌릴 목록을 계산한다"
    actor: person
    entries: [route:apps/rewind_plan]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/plan.ts, packages/core/apps/rewind/reads.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 고른 invocation이 이 앱의 것인지, 활성 release의 live 기록인지 본다. 범위 밖 앱이면 없는 앱과 같다."
      - "고른 것이 write나 external이고, denied가 아니고, 아직 되돌리지 않은 것인지 본다. 아니면 invalid_input이다."
      - "그 invocation부터 최신까지 같은 release의 live 기록 가운데 write와 external(data_change 제외)을 모은다. 되돌린 기록은 뺀다."
      - "범위 안에 결과를 모른 채 changeset 없이 닫힌 write가 있으면 blocked(unrecoverable_write)를 함께 낸다. running 호출은 running:true로 들어가고 reverts_db는 true다."
      - "읽기만 한다. 실제 되돌리기는 app-rewind-apply가 한다."
    outcomes:
      - id: planned
        observe: [response]
      - id: planned-blocked
        when: "범위 안에 결과를 모르는 write가 있음"
        observe: [response]
      - id: not-pickable
        code: invalid_input
        when: "preview, 이전 release의 호출, data_change, read, denied, 이미 되돌린 호출, 활성 release 없음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "고른 invocation이 없거나 다른 앱의 것, 또는 앱이 범위 밖(없는 앱과 같음)"
        observe: [response]
      - id: read-failed
        when: "기록 읽기나 활성 release 조회가 실패함, 시작 시각이 없는 호출(internal)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable)"
        observe: [response]
    crosses_process: false
    unclear:
      - "호출 목록이 잘려 시작 호출이 빠지는 경우(list-incomplete)는 도달하지 않는다고 보고 outcome에서 뺐다. ledger.list에 limit이 없어 목록이 잘리지 않는다(store.ts). 방어 guard(plan.ts)는 남아 있다."
    docs: [architecture/app-call.md]

  - id: app-rewind-apply
    title: "사람이 고른 호출 시점부터 앱 data를 되돌린다"
    actor: person
    entries: [route:apps/rewind]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/run.ts, packages/core/apps/rewind/commands.ts, packages/core/apps/rewind/store.ts, packages/core/apps/rewind/plan.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 앱 범위 밖이면 없는 앱과 같다. 계획을 다시 만들고(계획의 not-pickable·not-found·read-failed를 그대로 준다), 결과를 모르는 write가 범위에 있거나(blocked) 이미 applying인 rewind가 있으면 conflict로 거절한다."
      - "app_rewinds에 applying 행을 쓰고(insertApplyingRewind) 그 앱의 접수를 닫는다. 새 호출은 붙잡아 둔다. 도는 호출은 멈추지 않는다."
      - "60초 안에 도는 호출이 끝나길 기다린다. 넘으면 cancelled(running calls did not finish)다."
      - "계획을 다시 계산하고 changeset을 가져와 최신부터 뒤집는다(base). changeset이 없는 항목은 조용히 건너뛴다. 계획이 바뀌었거나 뒤집지 못하면 cancelled다."
      - "뒤집은 changeset 전부를 한 요청으로 app process가 한 transaction에 적용한다. 충돌이나 process 문제면 통째로 취소한다. 보내지 못하면 cancelled(app_unavailable)다."
      - "적용되면 invocation에 reverted_by를 붙이고 rewind를 applied로 끝낸다. 붙이지 못하면 mark-reverted-failed다(app data는 이미 되돌아가 있다)."
      - "어느 길로 끝나도 접수를 다시 연다(finally). 응답은 ok로 rewind 행을 주고, status는 applied 또는 cancelled다."
    outcomes:
      - id: applied
        observe: ["ledger:app_rewinds", "ledger:invocations", "disk:apps/<app>/data", "event:AppViewChanged", response]
      - id: cancelled-running
        when: "도는 호출이 유예(60초) 안에 끝나지 않음. 응답은 ok이고 status가 cancelled다(reason code conflict)"
        observe: ["ledger:app_rewinds", response]
      - id: cancelled-conflict
        when: "drain 사이에 계획이 바뀜, 계획 재계산이 실패함, 결과를 모르는 write가 남아 있음(blocked), changeset을 읽거나 뒤집지 못함, app process가 conflict로 답함. 응답은 ok이고 status가 cancelled다"
        observe: ["ledger:app_rewinds", response]
      - id: cancelled-app-unavailable
        when: "app process에 적용 요청을 보내지 못함, 또는 적용 답이 오류·모양 불일치(supervisor가 답하지 않음, 시간 초과, 앱의 503이나 400 등). 응답은 ok이고 status가 cancelled다"
        observe: ["ledger:app_rewinds", response]
      - id: mark-reverted-failed
        code: conflict
        when: "app process는 되돌렸지만 invocation에 reverted_by를 붙이지 못함. app_rewinds는 applying으로 남고 app data는 이미 되돌아가 있다(틀린 되돌리기)"
        observe: ["ledger:app_rewinds", "disk:apps/<app>/data", response]
      - id: finish-failed
        code: internal
        when: "rewind 행을 끝내지 못함(행이 없거나 깨짐, invalid stored rewind)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(dispatch가 forbidden으로 거른다), credential scope가 거절함"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 범위 밖이거나, 계획에서 고른 invocation이 없거나 다른 앱의 것"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "계획에서 고를 수 없는 호출(data_change, read, denied, 이미 되돌린 호출, 이전 release, preview, 활성 release 없음)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "결과를 모르는 write가 범위에 있음(blocked), 이미 applying인 rewind가 있음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "하위 read의 unavailable을 그대로 전달(권한 판정 port가 없거나 답이 맞지 않음)"
        observe: [response]
      - id: read-failed
        when: "계획 계산 중 기록 읽기나 활성 release 조회가 실패함, 진행 중 rewind 행이 깨짐(invalid stored rewind, internal)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]
    unclear:
      - "intake의 close·open은 앱마다 플래그 하나다(counter가 없다). rewind의 open이 activation이 닫은 접수를 다시 열 수 있다. 막는 장치가 다른 곳에 있는지 확인이 필요하다."
      - "insertApplyingRewind가 Result가 아닌 예외로 실패하면 internal로 올라가는지 확인이 필요하다."
      - "applying으로 남은 rewind가 core 재시작을 만나면 app-core-restart-recovery가 cancelled로 닫는다(같은 reason code)."

  - id: app-rewind-history-read
    title: "앱의 되돌리기 기록을 읽는다"
    actor: person
    entries: [route:apps/rewinds]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/rewind/reads.ts, packages/core/apps/rewind/store.ts]
    steps:
      - "앱 범위를 확인한다. 범위 밖이면 없는 앱과 같다. agent에게 보관한 앱은 없는 앱과 같다."
      - "app_rewinds 행을 invocation 필터, cursor, limit(기본 50, 최대 200)으로 읽는다. invocation 필터는 from_invocation이나 그 rewind의 invocations 목록에 든 id와 맞는다. 최신순이다. 다음 cursor는 마지막으로 준 id다."
      - "끝난 행은 불변이다. applying 행만 끝낼 때 바뀐다."
      - "사람 말고도 agent와 machine이 같은 route를 쓴다(session별 write 목록은 agent가 읽는다). app credential은 dispatch가 거른다."
    outcomes:
      - id: listed
        observe: [response]
      - id: not-found
        code: not_found
        when: "범위 밖 앱, 또는 agent에게 보관한 앱"
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 rwd id 꼴이 아님"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, agent, machine)"
        observe: [response]
      - id: read-failed
        when: "저장된 rewind 행이 깨짐(internal)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable)"
        observe: [response]
    crosses_process: false
    refs: [A2]

  # ---------- 사용 관계, sdk 상태, 화면 파일 ----------

  - id: app-usage-read
    title: "다른 앱·project가 쓰는 앱 tool의 사용 관계를 읽는다"
    actor: agent
    entries: [route:apps/usage]
    boundary: [apps]
    code: [packages/core/apps/usage/reads.ts, packages/core/apps/usage/users.ts]
    steps:
      - "호출한 agent의 session workspace가 home이 아니거나 session을 모르면 forbidden이다(사용 관계는 home의 lophn만 읽는다)."
      - "app을 주면 그 앱이 없거나 agent에게 보관한 앱이면 not_found다(사람과 machine은 보관한 앱도 읽는다). 주지 않으면 활성 앱 전부다."
      - "invocation 기록에서 세며, 쓰는 쪽은 그 앱 command를 부른 session의 workspace다. home과 그 앱 자신의 workspace는 세지 않는다."
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent의 session이 home이 아니거나 session을 모름. app credential(route actors는 user, machine, agent)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "지정한 앱이 없거나, agent에게 보관한 앱"
        observe: [response]
      - id: read-failed
        when: "앱이나 invocation 기록 읽기가 실패함, 활성 declaration 읽기가 실패함"
        observe: [response]
    crosses_process: false

  - id: app-sdk-status-read
    title: "앱이 고정한 내장 SDK 판이 지원 하한과 지금 판에 비해 어떤지 읽는다"
    actor: agent
    entries: [route:apps/sdk_status]
    boundary: [sdk]
    code: [packages/core/apps/sdk-status/status.ts, packages/core/apps/sdk-status/detect.ts, packages/core/apps/routes.ts]
    steps:
      - "보관하지 않고 켜진 release가 있는 앱만 싣는다. agent는 자기 범위의 앱만 본다. 범위 판정이 실패하면 그 앱은 목록에서 빠진다."
      - "앱 bundle 사본의 @lophn/* 고정 판을 지원 하한(lophn.supported_from)과 지금 판에 견준다(required, available, current). 설치된 SDK 부분만 본다."
      - "migrate-sdk 메모 file 이름은 고정 판 다음부터 지금 판까지 옛것부터 싣는다."
      - "지정한 앱이 범위 밖이면 빈 목록이 아니라 not_found다. 범위 판정 실패도 같은 not_found로 가려진다(routes.ts)."
    outcomes:
      - id: listed
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "app credential(route actors는 user, machine, agent)"
        observe: [response]
      - id: not-found
        code: not_found
        when: "지정한 앱이 없거나 보관했거나 범위 밖이다, 또는 범위 판정 실패가 같은 답으로 가려진다(켜진 release가 없는 앱은 빈 목록)"
        observe: [response]
      - id: read-failed
        when: "앱 목록이나 선언 읽기가 실패함(invalid stored app 등)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    unclear:
      - "route가 unavailable을 선언하지만 handler는 내지 않는다. 메인 스레드 sql read라 reader unavailable이 없고, 범위 판정 실패는 목록에서 빠지거나 not_found로 가려진다. 선언을 고칠 곳이다."
      - "bundle 파일 읽기의 예외(readdir·readFile, status.ts)는 Result가 아니라 throw로 올라간다. 어떤 code로 보이는지 확인이 필요하다."

  - id: app-screen-file-read
    title: "앱 화면의 bundle 파일 한 개를 내준다"
    actor: shell
    entries: [route:apps/screen_file]
    boundary: [app-runtime]
    code: [packages/core/apps/screens/serve.ts, packages/core/apps/routes.ts]
    steps:
      - "shell main이 lophn-app:// 요청을 화면 byte로 바꾸려고 부른다. 대상은 view가 묶인 release다."
      - "화면 이름과 path를 검사한다(빈 값, '.', '..', '/'나 '\\' 포함, 상대 경로가 아니거나 콜론 포함은 거절)."
      - "bundle 사본의 screens/<screen>/<path>를 realpath로 풀어 그 screen 폴더 밖이면 not_found다. 폴더는 8 MiB를 넘는 파일을 조용히 not_found로 답한다."
      - "preview 대상은 그 앱의 지금 preview가 연 bundle 사본에서 읽는다. nonce가 지금 preview의 것이 아니면(멈춘 preview, 다른 앱) 사본을 찾지 못해 not_found다."
      - "파일을 읽기만 하고 형식으로 Content-Type을 정한다."
    outcomes:
      - id: served
        observe: [response]
      - id: invalid-path
        code: invalid_input
        when: "화면 이름이 빈 값이거나 '.', '..'이거나 '/'·'\\'를 포함함, path가 상대 경로가 아니거나 ':'를 포함함"
        observe: [response]
      - id: not-found
        code: not_found
        when: "파일이 없음, 그 screen 폴더 밖을 가리킴, 8 MiB를 넘는 파일(조용히 막음), preview 대상인데 그 nonce가 그 앱의 지금 preview가 아님, 활성 release가 없거나 다른 앱의 release"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 credential이 아님(route actors는 user만)"
        observe: [response]
      - id: read-failed
        when: "bundle 사본 조회(loadRelease)가 낸 오류 그대로(invalid stored app 등)"
        observe: [response]
    crosses_process: false
    declared_only: [unavailable]
    unclear:
      - "route가 unavailable을 선언하지만 handler는 내지 않는다. file stream handler는 apps wiring이 늘 등록하고, bundle 조회 실패는 not_found나 internal이다. 선언을 고칠 곳이다."
    risk: [sandbox]

  # ---------- 파일 접근: broker를 거치지 않는다 ----------

  - id: app-file-access
    title: "앱 child가 SDK cap-fs로 파일을 읽고 쓴다(broker를 거치지 않는다)"
    actor: app
    entries: [system:app-file-access]
    uses: [sdk:cap-fs/readFile, sdk:cap-fs/readTextFile, sdk:cap-fs/writeFile, sdk:cap-fs/writeTextFile, sdk:cap-fs/watch, release-prepare:failed-release]
    boundary: [app-capability, app-runtime]
    code: [packages/sdk/cap-fs/fs.ts, packages/sdk/cap-fs/declaration.ts, packages/core/apps/releases/sdk-permissions.ts]
    steps:
      - "앱 code가 cap-fs의 readFile·readTextFile·writeFile·writeTextFile·watch를 부르면 앱 child 안의 node:fs가 바로 연다. 경로는 절대 경로로 풀 뿐 폴더 경계, symlink, 선언, grant를 검사하지 않는다."
      - "core로 가는 broker route가 없다. 실행 범위(effective.ts)는 fs.read·fs.write를 계산하지만 이를 판정하는 호출이 없다. 실행 때 broker가 막는 것은 net·secret·notify·앱 호출이다."
      - "OS가 그 user에게 허락한 파일이면 어디든 읽고 쓴다. 앱 log와 호출 기록에는 남지 않는다."
      - "OS 오류는 CapabilityError로 바꿔 던진다. ENOENT는 not_found, createNew의 EEXIST는 conflict, 그 밖은 unavailable이다. forbidden은 나오지 않는다."
      - "release 준비는 선언에 fs.read나 fs.write 종류가 있는지만 본다(release-prepare의 failed-release). 경로와 실제 쓰임은 보지 않는다."
    outcomes:
      - id: accessed
        when: "OS가 허락해 읽기, 쓰기, 감시 시작이 됨. 선언과 grant는 보지 않는다"
        observe: ["disk:<path>", response]
      - id: not-found
        code: not_found
        when: "OS가 파일을 찾지 못함(ENOENT)"
        observe: [response]
      - id: conflict
        code: conflict
        when: "createNew로 쓰는데 파일이 이미 있음(EEXIST)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "그 밖의 OS 오류(EACCES, EPERM, EISDIR 등)"
        observe: [response]
      - id: watch-no-path
        code: invalid_input
        when: "watch에 경로가 하나도 없음"
        observe: [response]
      - id: watch-ended-by-error
        when: "감시 중 watcher가 error를 내거나 handler가 던져 done이 거절됨. 감시는 닫힌다"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/app-call.md, architecture/package.md]
    unclear:
      - "architecture/package.md는 '실행 때 막는 것은 broker다'라고 쓴다. cap-fs는 broker route가 없어 실행 때 막지 않는다. app-call.md(cap-fs는 OS가 허락하는 파일을 어디든 읽고 쓴다)는 실제 동작과 맞다. 두 문서 가운데 정본을 사람이 정하거나, cap-fs에 broker 검사를 넣을지 정한다."
      - "앱 child는 lophn과 같은 OS user로 뜨고 Node 권한 flag가 없다(processes/spawn.ts). 그래서 secrets.json 같은 data root 파일도 OS 권한만 있으면 닿는다(코드 읽기로 본 것이고 실행으로 확인하지 않았다)."
      - "permissions/model.ts의 경로 판정(isSameOrInside)과 adapters/realpath.ts(realPathResolver)는 export만 있고 production 호출이 없다. 경로 검사를 넣을 때 쓸 재료인지 확인이 필요하다."

  # ---------- grant ----------

  - id: app-grant-list
    title: "앱 grant를 읽는다"
    actor: person
    entries: [route:app_grants/list]
    boundary: [app-runtime]
    code: [packages/core/apps/permissions/reads.ts, packages/core/apps/permissions/store.ts]
    steps:
      - "앱을 주면 범위 밖이거나 없는 앱은 not_found다. 주지 않으면 범위 안 앱의 grant를 모두 준다. agent에게 보관한 앱의 grant는 보이지 않는다(not_found로 빠진다)."
      - "상태(active, revoked)와 cursor로 자른다. 읽기만 한다."
      - "supervisor의 broker도 요청마다 같은 route를 부른다(scope 계산의 입력이다). 판정 없이 값만 읽으므로 broker flow가 uses로 가리킨다. shell main의 app frame도 fetch host를 읽는다."
    outcomes:
      - id: listed
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "cursor가 깨졌거나, app·status·limit이 처음 조회와 다르거나, 끝을 넘음"
        observe: [response]
      - id: read-failed
        when: "범위 판정 port가 없거나 답이 맞지 않음(app dependency unavailable), grant 읽기나 행 읽기가 실패함(internal)"
        observe: [response]
    crosses_process: false

  - id: app-grant-revoke
    title: "사람이 앱 grant를 거둔다"
    actor: person
    entries: [route:app_grants/revoke]
    boundary: [app-runtime]
    code: [packages/core/apps/permissions/commands.ts]
    steps:
      - "사람만 부른다(route actors가 dispatch에서 거른다). 없거나 범위 밖이거나 이미 거둔 grant는 같은 conflict로 답한다."
      - "앱의 마지막 process 사실이 AppStarted이면(AppStopped가 뒤에 없으면) unavailable로 막는다. 종료가 확인돼야 거둘 수 있다."
      - "확인되면 grant 행을 revoked로 바꾼다. event는 남기지 않는다. secret 값은 지우지 않는다. reason 입력은 저장하지 않는다."
    outcomes:
      - id: revoked
        observe: ["ledger:grants"]
      - id: forbidden
        code: forbidden
        when: "사람이 아님(agent, app, machine)"
        observe: [response]
      - id: not-active
        code: conflict
        when: "grant가 없음, 앱이 없음, 범위 밖(authorizeApp의 forbidden·not_found), 이미 거둠"
        observe: [response]
      - id: process-running
        code: unavailable
        when: "마지막 process 사실이 AppStarted임(자식 종료가 확인되지 않음), 또는 권한 판정 port가 없거나 답이 맞지 않음(app dependency unavailable)"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 grant나 앱 행이 깨졌거나, 갱신이 행을 바꾸지 못함"
        observe: [response]
    crosses_process: false
    risk: [permission]
    refs: [H2]
    unclear:
      - "process-running일 때 자식을 멈추는 주체가 코드에 없다. commands.ts 주석이 말하는 GrantApplier는 현재 코드에 없다. 실행을 끄면(app-execution-disable) reconcile이 멈추고 AppStopped가 남는다."
      - "예상 밖 종료, crash loop 멈춤, core 재시작 뒤에는 AppStopped가 남지 않는다. stopTracked는 자식이 없으면 record_stopped를 건너뛰므로 실행을 꺼도 마지막 사실이 AppStarted로 남아 revoke가 계속 unavailable일 수 있다(코드 읽기로 본 것이고 실행으로 확인하지 않았다). 화면의 revoking 상태가 이 경우를 어떻게 보이는지 확인이 필요하다."
      - "reason 입력을 handler가 무시한다(commands.ts). 저장되는 곳이 있는지 확인이 필요하다."

  # ---------- secret과 OAuth ----------

  - id: app-secret-value
    title: "supervisor가 앱 외부 요청에 붙일 secret 값을 한 번 받는다"
    actor: system
    entries: [route:apps/secret_value]
    pre: [app-record-started:started]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/permissions/secret-value.ts, packages/core/apps/permissions/secret-allowance.ts, packages/core/apps/oauth/service.ts, packages/core/main/app-supervisor/secret-delivery.ts]
    steps:
      - "supervisor가 machine 자격으로 부른다. 부른 자식이 지금 보는 live 자식과 release, process nonce가 같아야 한다(아니면 forbidden)."
      - "목적지(scheme, host, port)를 확인한다. http는 loopback host만이다."
      - "현재 선언 ∩ active grant로 secret.use와 목적지의 net.fetch 허락을 다시 판정한다. 선언에 없거나 grant가 없으면 forbidden이다. 이 판정은 파일 값 읽기보다 먼저다."
      - "OAuth secret이면 access token을 쓸 수 있게 한다. 만료 5분 전부터 발급자에게 refresh를 대기열로 부른다. 발급자가 거절하면 token을 지우고 sign-in이 필요하다. 닿지 못했는데 token이 만료됐으면 unavailable이다. 닿지 못했어도 token이 아직 유효하면 그대로 쓴다."
      - "secrets 파일에서 값을 읽는다. 값이 없으면 not_found다. 알려진 값 registry가 그 값을 알 때만 값을 응답 본문으로 준다. 값은 ledger, event, log, 오류에 남지 않는다."
    outcomes:
      - id: delivered
        observe: [response]
      - id: delivered-after-refresh
        observe: [response, "disk:secrets.json"]
      - id: refresh-rejected
        code: conflict
        when: "발급자가 400, 401, invalid_grant로 refresh를 거절함, 또는 token이 만료됐는데 refresh token이 없음, 또는 client 설정이 바뀜. token을 지우고 재인증을 요구한다"
        observe: [response, "disk:secrets.json"]
      - id: forbidden
        code: forbidden
        when: "machine이 아님(route actors), 부른 자식이 지금 live 자식이 아님(mode, release, nonce 다름 또는 프로세스가 살아 있지 않음), 목적지가 잘못됨(http는 loopback만), 이름이 예약된 네임스페이스(app-oauth., provider-oauth.)나 provider·mcp 이름, 선언이나 grant가 없음(이름이 선언에 없음, release 다름, 목적지 허락 없음)"
        observe: [response]
      - id: sign-in-required
        code: conflict
        when: "client id가 없음, 또는 저장된 token이 없음"
        observe: [response]
      - id: secret-missing
        code: not_found
        when: "선언된 이름인데 secrets 파일에 값이 없음"
        observe: [response]
      - id: not-deliverable
        code: unavailable
        when: "값이 비었거나 registry가 모르는 값, 또는 발급자에 닿지 못하고 token이 만료됨(refresh 대기 시간 초과)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "입력 모양이 맞지 않음"
        observe: [response]
      - id: dependency-failed
        when: "supervisor 관측 질의가 실패함, 선언이나 grant 읽기가 실패함, secrets 파일 읽기나 token vault 읽기·저장이 실패함, ledger 연결이 열리지 않음(그 오류 그대로)"
        observe: [response]
    crosses_process: true
    risk: [secret, permission]
    refs: [H10]
    docs: [architecture/app-call.md]
    unclear:
      - "OAuth 실패 이유(callback_timeout, refresh_rejected 등)는 메모리 map에만 있어 core가 다시 켜지면 사라진다(이슈 oauth-failure-reason-lost-on-restart). sign-in-required의 이유 글도 같다."
      - "invalid_input이 refresh 경로에서 바깥으로 나오는지는 코드상 없어 보인다(unavailable이나 ok로 바뀐다). 확인이 필요하다."

  - id: app-broker-secret-use
    title: "앱 SDK가 secret을 외부 요청에 붙이려고 broker에 알린다"
    actor: app
    entries: [system:app-broker-secret-use]
    uses: [app-secret-value:delivered, app-secret-value:sign-in-required, sdk:cap-secret/useSecret, route:apps/tools, route:app_grants/list]
    pre: [app-record-started:started]
    boundary: [app-capability, secrets]
    code: [packages/core/apps/permissions/broker/secrets.ts, packages/core/apps/permissions/broker/access.ts, packages/core/main/app-supervisor/secret-delivery.ts]
    steps:
      - "앱의 useSecret이 이름, 목적지(scheme, host, port), command, 입력 hash를 broker의 secrets/use에 보낸다. 값은 앱에 오지 않는다. 모양이 틀리면 invalid_input이다(broker 본문 검사 포함)."
      - "운영 자식(live)이고 release가 지금 release와 같아야 한다. 아니면 forbidden(secret.use)이다. http는 loopback host만이다(아니면 forbidden net.fetch)."
      - "현재 실행 범위(선언 ∩ grant)를 core에서 읽는다(apps/tools, app_grants/list). 읽기가 실패하면 access-unavailable이다. 범위에서 command가 release의 tool 목록에 있고 secret.use 허락이 있어야 한다. 없으면 forbidden(secret.use)이다."
      - "목적지가 net.fetch 허락(플랫폼 port 제외)에 들어야 한다. 없으면 forbidden(net.fetch)이다."
      - "supervisor가 app-secret-value로 값을 받아 같은 invocation의 같은 (host, port) 요청에만 Bearer로 붙인다(60초). 앱에는 used만 돌려준다."
    outcomes:
      - id: used
        observe: [response]
      - id: refused-secret
        code: forbidden
        when: "secret.use 허락이 없거나 command가 tool 목록에 없음, 운영 자식이 아님(preview나 release 없음), 자식 release가 현재 release와 다름, 앱이나 release를 모르거나 바뀜, core가 secret 값을 forbidden으로 거절함"
        observe: [response]
      - id: refused-destination
        code: forbidden
        when: "목적지가 net.fetch 허락에 없음, http인데 loopback이 아님"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "본문 모양이 맞지 않음(이름, 목적지, command, 입력 hash), host가 정확한 host가 아님, 진행 중 invocation이 없음, 본문이 1 MiB를 넘음, JSON이 아님, JSON 객체가 아님"
        observe: [response]
      - id: sign-in-required
        code: conflict
        when: "OAuth secret의 sign-in이 필요함(app-secret-value의 sign-in-required나 refresh-rejected 전달)"
        observe: [response]
      - id: secret-missing
        code: not_found
        when: "그 이름의 값이 저장되지 않음(core의 not_found 전달)"
        observe: [response]
      - id: undeliverable
        code: unavailable
        when: "core가 값을 낼 수 없음(비었거나 모르는 값, 발급자에 닿지 못함), core 연결이 없거나 닿지 않음, core 답이 맞지 않음"
        observe: [response]
      - id: access-unavailable
        code: unavailable
        when: "현재 실행 범위 읽기 실패(core 연결 없음, 닿지 않음, 선언이나 grant 읽기 실패, grant가 너무 많음)"
        observe: [response]
      - id: unauthorized
        code: unauthorized
        when: "credential이 틀림, 또는 본문의 process_nonce·mode가 연결과 다름"
        observe: [response]
      - id: broker-closing
        code: unavailable
        when: "회수·교체를 시작한 연결이라 새 요청을 받지 않음(broker is closing)"
        observe: [response]
      - id: handler-threw
        code: internal
        when: "처리기가 예외를 던짐"
        observe: [response]
    crosses_process: true
    risk: [secret, sandbox, permission]
    refs: [H10]
    docs: [architecture/app-call.md]

