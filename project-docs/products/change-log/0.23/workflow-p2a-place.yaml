id: workflow-p2a-place
version: 0.23.142
title: workflow_origin이 있는 GUI 팀원·터미널 탭을 원 workflow의 workspace와 workflow desk에 연다
modules:
  - packages/core/terminal-agents
  - packages/core/host-queue
  - packages/core/main
  - packages/shell/main
  - packages/shell/renderer
change: |
  - `wiring/harness.ts` `describe()`가 `sessions.workflow_origin`을 파싱해 반환하고, `member.ts` → `open.ts` → `wiring/terminal-agents.ts`가 PTY는 실행 project에 유지하면서 `workflow_origin`이 있을 때 `queue.openTab`에 원 workflow의 `workspace`·`desk: { workflow }`·`group: "<instance>:<step>"`을 싣는다.
  - `core/host-queue/queue.ts`, `wiring/host-queue.ts`, `shell/main/desktop/wiring/surface.ts`, `shell/renderer/workspace/use-surface-requests.ts`, `kinds/host.ts`에 `desk`와 `group` 전달을 잇고, `wiring/host-queue.ts`의 `coding`/`tui` 터미널 탭 열기도 `workflow_origin`의 workspace·desk·group을 반영한다.
  - `workspace-window.tsx`의 `openTab`이 존재하지 않는 workflow desk 이름으로 탭을 열 때 `addDesk(all, desk, desk, desk)`로 그 workflow desk를 만들어 Main으로 떨어지지 않게 한다(`select: false`이면 보는 desk를 바꾸지 않는다).
  - `kinds/terminal.tsx`가 `project_folder`(`<project>_<index>`)에서 실제 실행 project를 풀어 attach·재시작·세션 이름 고정을 깨뜨리지 않고, 다른 project 폴더의 터미널 탭 제목·tooltip에 폴더 이름(`· <folder>`)을 구분해 보인다.
why: |
  실행 cwd가 다른 project인 workflow 참가자 세션의 터미널 탭이 다른 workspace나 Main desk에 흩어지지 않고, PTY 실행 환경은 유지한 채 원 workflow의 desk에 모이게 하기 위함이다.
decisions:
  - text: "cross-project 터미널의 실제 project는 layout에 저장되는 `project_folder`(`<project>_<index>`)에서 읽고, 탭 줄·tooltip 구분은 `TabKindDef.titleOf`로 `· <folder>`를 붙인다(저장되는 `tab.title`은 오염시키지 않는다). 버린 길: layout schema에 별도 `project` 필드 추가."
    by: agent
