area: projects

flows:

  # ---- project API (core) ----

  - id: project-register
    title: "project를 등록한다"
    actor: person
    entries: [route:projects/create]
    uses: [route:projects/record_identity]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/core/main/daemon/wiring/projects.ts
      - packages/protocol/projects/project-api.ts
    steps:
      - "사람이 더할 때는 core의 projects/add가 부른 사람의 자격으로 낸다(project-add). clone한 저장소는 core가 machine:projects-clone 자격으로 낸다. user도 그 machine 자격도 아니면 forbidden으로 거절한다"
      - "등록 폴더 목록이 같은 path이거나 서로 겹치면 거절한다(validateFolderRoots)"
      - "TargetAuthorization port로 생성 자격을 본다. port가 없거나 판정이 실패하면 fail-closed로 막는다"
      - "같은 id나 같은 name(slug)의 project가 있으면 conflict로 거절한다"
      - "기계를 넘는 id를 정한다: clone(machine:projects-clone)은 다른 기계에서 들고 온 identity를 쓰고, 아니면 tx.newId로 새 pri_를 낸다. user가 identity를 주면 invalid_input이다. 이 기계의 다른 project(보관 포함)가 그 id를 지금이나 옛 identity로 가지면 conflict(details.reason identity_in_use)다"
      - "projects와 project_folders에 revision 1로 넣고(repo·remote는 null), 폴더마다 디스크 존재 여부(found)를 붙여 record를 돌려준다"
      - "commit되고 replay가 아니면 core가 첫 폴더의 git 여부와 remote를 읽어 project.record_identity로 적는다(project-identity-record). 읽기가 실패해도 log 한 줄이고 응답은 그대로다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: id-conflict
        code: conflict
        when: "같은 id의 project가 이미 있다"
        observe: ["response"]
      - id: name-conflict
        code: conflict
        when: "같은 name의 project가 이미 있다"
        observe: ["response"]
      - id: identity-in-use
        code: conflict
        when: "clone이 들고 온 id를 이 기계의 다른 project가 지금이나 옛 identity로 갖는다"
        observe: ["response"]
      - id: folders-overlap
        code: invalid_input
        when: "등록 폴더가 같거나 서로 겹친다, 또는 폴더 경로가 canonical root 모양이 아니다(validateFolderRoots)"
        observe: ["response"]
      - id: identity-by-person
        code: invalid_input
        when: "user가 identity를 주었다. 다른 기계의 id를 들고 오는 것은 clone뿐이다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor도 machine:projects-clone 자격도 아니다, 또는 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: authorization-unavailable
        code: unavailable
        when: "TargetAuthorization port가 없거나 Promise·잘못된 값을 돌려줘 막았다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "같은 id의 project를 읽는 중 깨진 저장을 만났다, 또는 folder resolver port가 붙지 않았다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    refs: [P5, P10]

  - id: project-add
    title: "사람이 이름과 폴더로 project를 더한다. id와 slug는 core가 만든다"
    actor: person
    entries: [route:projects/add]
    uses: [route:projects/create]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/add.ts
      - packages/core/main/daemon/wiring/projects.ts
      - packages/protocol/projects/add-api.ts
    steps:
      - "사람만 부른다(등록 dialog, 다른 기기의 창. 이 컴퓨터의 창 등록 dialog는 연결되어 사람의 route를 허락한 다른 기계를 맨 위에서 골라 그 기계에 부르고, 폴더는 그 기계의 폴더 목록 dialog에서 고른다). agent·app은 dispatch가 forbidden으로 거절한다"
      - "core가 prj_ id를 만들고 title에서 slug를 만든다(소문자 영숫자와 -, 글자로 시작, 63자까지. 비면 project)"
      - "project.create를 부른 사람의 자격으로 낸다(project-register). name이 겹쳐 conflict면 -2부터 번호를 붙여 다섯 번까지 해 보고, 다른 실패는 그대로 돌려준다"
      - "등록되면 project.create 뒤의 git 여부와 remote 읽기가 그대로 돈다. 사람의 저장소에 아무것도 쓰지 않는다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: name-taken
        code: conflict
        when: "title에서 만든 slug와 -2부터 -5까지가 모두 이미 있다"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "입력이 schema에 맞지 않다, 또는 project.create가 폴더가 같거나 겹친다고 거절했다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니다(dispatch), 또는 부른 사람의 자격으로 project.create를 낼 수 없다(TargetAuthorization, 기기 scope)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "project.create의 TargetAuthorization port가 없거나 판정이 실패했다, 또는 writer가 닫혔다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    docs: [architecture/project-identity.md]

  - id: project-browse
    title: "다른 기기가 이 기계의 폴더를 고르도록 사람의 home 아래 폴더 목록을 읽는다"
    actor: person
    entries: [route:projects/browse]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/browse.ts
      - packages/core/main/daemon/wiring/projects.ts
      - packages/protocol/projects/add-api.ts
    steps:
      - "사람만 부른다. agent·app은 dispatch가 forbidden으로 거절한다"
      - "home은 core가 켜질 때 homeOf(env, platform)을 realpath한 값이다. 없거나 풀지 못하면 unavailable이다"
      - "path(없으면 home)를 realpath한다. 없으면 not_found다. realpath가 home과 같거나 home 아래가 아니면(.., home 밖 절대 path, home 밖을 가리키는 symlink) 읽지 않고 forbidden이다"
      - "폴더가 아니면 invalid_input이다. 목록은 폴더와, realpath가 home 아래 폴더인 symlink만 싣는다(숨은 폴더 포함). path는 모두 realpath이고 이름순으로 500개까지 싣고 넘으면 truncated다. home에서는 parent가 null이다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니다(dispatch), 또는 path의 realpath가 home 밖이다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "path가 없다"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "path가 폴더가 아니다, 또는 정규화된 절대 path가 아니다(schema)"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "이 기계에 home이 없거나 realpath하지 못했다, 또는 폴더를 읽지 못했다(권한 등)"
        observe: ["response"]
    crosses_process: false
    risk: [sandbox]
    docs: [architecture/project-identity.md]

  - id: project-edit
    title: "project의 이름, 제목, 목적, 폴더 목록을 고친다"
    actor: person
    entries: [route:projects/update]
    uses: [route:projects/record_identity]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/core/main/daemon/wiring/projects.ts
    steps:
      - "project를 읽는다. 없으면 not_found로 거절한다"
      - "폴더 목록을 바꾸면 같은 path나 겹침을 본다(validateFolderRoots)"
      - "TargetAuthorization으로 바꾸기 전 project와 바뀐 뒤 후보를 함께 판정한다"
      - "base_revision이 현재 revision과 다르면 conflict, 실제로 바뀐 칸이 없으면 invalid_input이다"
      - "다른 project가 같은 name을 쓰면 conflict로 거절한다"
      - "projects의 metadata와 folder를 쓰고 revision을 올린다"
      - "input에 folders가 있고 commit되고 replay가 아니면 core가 첫 폴더의 git 여부와 remote를 다시 읽어 project.record_identity로 적는다(project-identity-record). 읽기가 실패해도 log 한 줄이고 응답은 그대로다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: folders-overlap
        code: invalid_input
        when: "바꾼 폴더 목록이 같거나 서로 겹친다, 또는 폴더 경로가 canonical root 모양이 아니다"
        observe: ["response"]
      - id: no-change
        code: invalid_input
        when: "보낸 칸이 지금 값과 모두 같다"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: name-conflict
        code: conflict
        when: "다른 project가 같은 name을 쓰고 있다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 바꾸기 전이나 바뀐 뒤 상태를 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    refs: [P10]

  - id: project-relink-folder
    title: "찾을 수 없게 된 등록 폴더를 새 위치로 잇는다"
    actor: person
    entries: [route:projects/relink_folder]
    uses: [route:projects/record_identity]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/core/main/daemon/wiring/projects.ts
    steps:
      - "project와 folder_path가 등록돼 있는지 본다. 없으면 not_found로 거절한다"
      - "new_path가 folder_path와 같으면 거절하고, 바꾼 목록이 다른 폴더와 겹치면 conflict로 거절한다"
      - "TargetAuthorization으로 판정하고 base_revision을 맞춘다"
      - "new_path가 디스크에 있는지 folder resolver로 본다"
      - "folder 설명은 그대로 두고 path만 바꿔 projects와 project_folders에 쓰고 revision을 올린다"
      - "commit되고 replay가 아니면 core가 첫 폴더의 git 여부와 remote를 다시 읽어 project.record_identity로 적는다(project-identity-record). 읽기가 실패해도 log 한 줄이고 응답은 그대로다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "ledger:project_folders", "response"]
      - id: not-found
        code: not_found
        when: "project가 없거나 folder_path가 그 project의 등록 폴더가 아니다"
        observe: ["response"]
      - id: same-path
        code: invalid_input
        when: "new_path가 folder_path와 같다"
        observe: ["response"]
      - id: overlaps
        code: conflict
        when: "new_path가 같은 project의 다른 등록 폴더와 같거나 겹친다, 또는 new_path가 canonical root 모양이 아니다(validateFolderRoots 실패는 모두 conflict다)"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: new-path-missing
        code: invalid_input
        when: "new_path가 디스크에 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-archive
    title: "project를 보관한다"
    actor: person
    entries: [route:projects/archive]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
    steps:
      - "project를 읽는다. 없으면 not_found로 거절한다"
      - "TargetAuthorization으로 status만 바뀐 후보를 판정한다"
      - "base_revision과 현재 status(active)를 맞춘다"
      - "projects의 status를 archived로 쓰고 revision을 올린다. 폴더의 파일은 건드리지 않는다"
    outcomes:
      - id: archived
        observe: ["ledger:projects", "response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: status-changed
        code: conflict
        when: "이미 보관돼 있다(status가 active가 아니다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-unarchive
    title: "보관한 project를 다시 연다"
    actor: person
    entries: [route:projects/unarchive]
    uses: [route:projects/record_identity]
    pre: [project-archive:archived]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/core/main/daemon/wiring/projects.ts
    steps:
      - "project를 읽는다. 없으면 not_found로 거절한다"
      - "TargetAuthorization으로 status만 바뀐 후보를 판정한다"
      - "base_revision과 현재 status(archived)를 맞춘다"
      - "projects의 status를 active로 쓰고 revision을 올린다"
      - "commit되고 replay가 아니면 core가 첫 폴더의 git 여부와 remote를 다시 읽어 project.record_identity로 적는다(project-identity-record). 읽기가 실패해도 log 한 줄이고 응답은 그대로다"
    outcomes:
      - id: unarchived
        observe: ["ledger:projects", "response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다르다"
        observe: ["response"]
      - id: status-changed
        code: conflict
        when: "보관돼 있지 않다(status가 archived가 아니다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니거나 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, folder resolver port가 붙지 않았다, 갱신한 행이 없었다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: project-identity-record
    title: "폴더에서 읽은 git 여부와 remote를 ledger에 적는다"
    actor: system
    entries: [route:projects/record_identity]
    pre: [project-register:ok]
    boundary: [projects]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/core/projects/registry/contexts.ts
      - packages/protocol/projects/identity-api.ts
      - packages/protocol/projects/identity.ts
    steps:
      - "core가 machine:projects-identity 자격으로 부른다. 다른 자격이면 forbidden으로 거절한다"
      - "project가 없으면 not_found, TargetAuthorization이 거절하면 막는다"
      - "found가 false(폴더를 읽지 못함)면 아무것도 바꾸지 않고 지금 record를 돌려준다"
      - "repo와 remote를 받은 값으로 바꾼다. identity는 바꾸지 않는다(id는 등록할 때 ledger에서 났다). 폴더나 그 위에 .git이 있는데 git이 답하지 않으면 읽는 쪽이 unavailable로 멈추고 이 command를 부르지 않는다(project-identity-read:git-unreadable)"
      - "revision은 올리지 않고 project_folders·session 같은 다른 표는 건드리지 않는다. 그 project의 projects change를 낸다"
    outcomes:
      - id: recorded
        observe: ["ledger:projects", "response"]
      - id: kept
        when: "found가 false라 아무것도 바꾸지 않았다"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "입력이 strict schema에 맞지 않는다(id 꼴, remote key·url 길이)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "machine:projects-identity 자격이 아니다, 또는 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "TargetAuthorization 판정을 얻지 못했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, 또는 folder resolver port가 붙지 않았다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    docs: [architecture/project-identity.md]

  - id: project-identity-startup
    title: "core가 켜질 때 active project의 git 여부와 remote를 다시 읽어 ledger를 맞춘다"
    actor: system
    entries: [system:project-identity-startup]
    uses: [route:projects/record_identity]
    boundary: [projects]
    code:
      - packages/core/main/daemon/wiring/projects.ts
      - packages/core/projects/identity/service.ts
      - packages/core/projects/identity/inspect.ts
    steps:
      - "control의 ready 뒤에 돈다. 기동을 기다리게 하지 않는다"
      - "ledger의 active project를 넷씩 나눠 첫 폴더의 git 여부와 remote를 읽고 project.record_identity로 적는다(project-identity-read와 같은 읽기. 폴더가 없는 project는 repo none으로 적는다). 꺼진 사이 바뀐 remote를 따라간다. watcher는 없다"
      - "사람의 저장소에 쓰지 않는다"
      - "project 하나의 읽기가 실패하면 log 한 줄을 남기고 다음 project로 간다. 종료가 시작되면 남은 것을 읽지 않고 멈추고, 종료는 읽는 중인 것이 끝나기를 기다린다"
    outcomes:
      - id: reconciled
        observe: ["ledger:projects", "event:StateChanged"]
      - id: read-failed
        when: "ledger를 열지 못했거나 project 하나의 폴더·git 읽기(.git이 있는데 git이 답하지 않음 포함)나 record_identity가 실패했다. 실패한 project는 적지 않는다"
        observe: ["log:projects-identity"]
    crosses_process: false
    docs: [architecture/project-identity.md]

  - id: projects-born-identity
    title: "이 판 전에 등록해 id가 없는 project에 ledger에서 난 id를 준다(data step 둘)"
    actor: system
    entries: [system:projects-born-identity]
    pre: [system:ledger-migrate]
    boundary: [projects]
    code: [packages/core/main/daemon/wiring/projects.ts, packages/core/projects/registry/store.ts, packages/core/storage/migration/data-steps.ts]
    docs: [architecture/project-identity.md]
    steps:
      - "data step projects.born-identity(앞 판이 git이 아닌 project에 id를 주던 step)와 projects.identity-for-all이 같은 일을 한다. 한 root에서 아직 돌지 않은 것만 돈다"
      - "ledger(`<root>/lophn.db`)를 열어 identity가 없는 project마다(git이든 아니든, 폴더가 없든, 보관했든) data step이 받은 IdSource로 새 pri_를 적는다. 이미 가진 id(옛 판에서 저장소 file에서 온 것 포함)와 다른 칸은 그대로다. 다시 돌아도 같다"
      - "runtime이 열리기 전에 돌아 writer와 겹치지 않는다. event를 내지 않는다"
    outcomes:
      - id: assigned
        observe: ["ledger:projects"]
        when: "id가 없는 project가 있어 id를 주었다(없으면 아무것도 쓰지 않는다)"
      - id: failed
        code: unavailable
        observe: ["process:stdout start_failed other"]
        when: "ledger를 열지 못했거나 쓰지 못했다. 던진 원인을 message에 싣는다"
    crosses_process: false
    risk: [data-loss]

  - id: project-identity-read
    title: "project 폴더를 다시 읽어 기계를 넘는 id와 다른 컴퓨터와 맞춰지는 상태를 본다"
    actor: person
    entries: [route:projects/identity]
    uses: [route:projects/record_identity]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/identity/service.ts
      - packages/core/projects/identity/inspect.ts
      - packages/core/projects/identity/git.ts
      - packages/core/main/daemon/wiring/projects.ts
    steps:
      - "user·agent가 부른다. 그 밖의 actor는 dispatch가 forbidden으로 거절한다"
      - "ledger에서 project를 읽는다. 없으면 not_found다"
      - "첫 폴더가 있으면 읽는다: 폴더가 없으면 found false, git work tree가 아니라는 답이면 폴더와 그 위 폴더에 .git(폴더든 file이든)이 있는지 본다. 있으면 git을 읽지 못한 것이라 unavailable이고 아무것도 적지 않는다. 없을 때만 repo none이다. git이면 fetch remote로 remote key(하위 폴더는 #<subpath>)를 낸다. git은 읽기만 한다(GIT_OPTIONAL_LOCKS=0)"
      - "읽은 값을 project.record_identity로 적고(project-identity-record) 그 record로 상태를 만든다. 폴더가 없는 project는 repo none으로 적는다(found는 false로 돌려준다)"
      - "같은 remote key를 가진 이 기계의 다른 project 가운데 자동 match에 드는 것(active, git, 나누지 않음, private workspace 아님)이 있으면 same_repository에 둔다. private workspace면 private이 참이다"
    outcomes:
      - id: ok
        observe: ["ledger:projects", "response", "event:StateChanged"]
      - id: same-repository
        when: "같은 저장소의 다른 active project가 이 기계에 있다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user·agent actor가 아니다(dispatch의 actor 검사), 또는 record_identity가 machine 자격을 거절했다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "ledger를 열지 못했다, git이나 폴더 읽기가 던졌다(권한, 10초 timeout), 또는 writer가 record_identity를 받지 못했다"
        observe: ["response"]
      - id: git-unreadable
        code: unavailable
        when: "폴더나 그 위에 .git이 있는데 git이 work tree가 아니라고 답했다(git이 PATH에 없다, dubious ownership, 깨진 저장소). ledger의 repo를 바꾸지 않는다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss]
    docs: [architecture/project-identity.md]

  - id: project-identity-link
    title: "git이 아닌 project에 다른 기계의 같은 project의 기계를 넘는 id를 적어 잇는다"
    actor: person
    entries: [route:projects/link_identity]
    pre: [project-register:ok]
    boundary: [projects, core-api]
    code:
      - packages/core/projects/registry/commands.ts
      - packages/core/projects/registry/store.ts
      - packages/protocol/projects/identity-api.ts
      - packages/shell/renderer/desktop/workspaces/projects/link-dialog.tsx
      - packages/shell/renderer/workspace/sidebar/clone-note.tsx
      - packages/shell/renderer/workspace/sidebar/workspace-left-sidebar.tsx
    steps:
      - "사람만 부른다: 이 컴퓨터 창의 왼쪽 sidebar에서 이 컴퓨터에 없는 git이 아닌 project 줄의 [Link…]가 잇기 dialog를 열고, 사람이 이 컴퓨터의 git이 아닌 project(보관하지 않았고 아직 그 id가 아닌 것)를 고른다. user actor가 아니면 forbidden이다"
      - "project가 없으면 not_found, TargetAuthorization이 거절하면 막는다. 이미 그 id면 아무것도 바꾸지 않고 지금 record를 돌려준다"
      - "repo가 none이 아니면(git이거나 아직 폴더를 읽지 못했다) conflict(details.reason git_project)로 거절한다. git project는 저장소로 자동으로 맞춰진다"
      - "이 기계의 다른 project(보관 포함)가 그 id를 identity나 former_identities로 가지면 conflict(details.reason identity_in_use)로 거절한다"
      - "identity를 그 id로 적고 옛 identity를 former_identities 끝에 더한다(같은 값은 한 번, 지금 값은 빼고, 16개까지). revision은 올리지 않는다. projects change를 낸다"
      - "적은 id는 다음 다시 읽기(project-identity-record)에서도 남는다: 다시 읽기는 identity를 바꾸지 않는다"
    outcomes:
      - id: linked
        observe: ["ledger:projects", "response"]
      - id: already
        when: "project가 이미 그 id를 갖는다"
        observe: ["response"]
      - id: git-project
        code: conflict
        when: "project의 repo가 none이 아니다(git project, 또는 아직 폴더를 읽지 못함)"
        observe: ["response"]
      - id: identity-in-use
        code: conflict
        when: "이 기계의 다른 project(보관 포함)가 그 id를 지금이나 옛 identity로 갖는다"
        observe: ["response"]
      - id: invalid-input
        code: invalid_input
        when: "입력이 strict schema에 맞지 않는다(prj_·pri_ id 꼴)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user actor가 아니다(agent·app·machine), 또는 TargetAuthorization이 거절했다"
        observe: ["response"]
      - id: not-found
        code: not_found
        when: "project id가 없다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "TargetAuthorization 판정을 얻지 못했다"
        observe: ["response"]
      - id: internal
        code: internal
        when: "project를 읽는 중 깨진 저장을 만났다, 또는 folder resolver port가 붙지 않았다"
        observe: ["response"]
    crosses_process: false
    risk: [data-loss, permission]
    docs: [architecture/project-identity.md]

  - id: project-identity-renew
    title: "project에 새 id를 주어 다른 컴퓨터의 같은 저장소와 나눈다([Separate project])"
    actor: person
