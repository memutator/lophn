      - "취소 알림 글을 blob으로 준비한다(끝내지 못하면 여기서 unavailable이다)."
      - "보낸 session의 call만 취소한다. 끝난 call은 그대로 돌려준다. 받는 쪽에는 취소 알림이 간다."
    outcomes:
