id: agent-browser-page-duplicated-across-windows
title: 두 창이 같은 workspace를 mount하면 agent가 연 browser page가 창마다 하나씩 생긴다
kind: bug
status: open
topic: workspace-layout
modules: [packages/shell/main, packages/shell/renderer]
now: |
  agent가 `lophn tab open --url`로 연 탭은 layout에 `host:<tab>` 탭으로 남고, workspace를 mount하는 창은 layout의 탭마다 `<webview>`를 만든다. 그래서 같은 workspace를 두 창이 mount하면 창마다 자기 page를 만든다. shell main은 나중에 bind한 창을 agent가 다루는 page로 삼고(`packages/shell/main/desktop/wiring/surface.ts`의 `bound`), 그 workspace를 보이지 않는 옛 창은 `releaseOld`가 자기 page를 놓게 한다. 둘 다 그 workspace를 보이면 놓지 않는다(코드 주석의 "알려진 한계"). 둘 다 같은 url을 load하고 둘 다 사는 동안 page가 둘이다.
impact: |
  - 사람이 그 workspace를 두 창에서 열어 둔 동안 같은 주소를 두 번 load한다. 로그인한 site에서 한 번만 써야 하는 링크나 요청이 두 번 간다.
  - agent는 나중에 붙은 창의 page만 다룬다. 사람이 다른 창의 page에서 입력하거나 take control을 해도 agent가 다루는 page가 아니라 둘이 어긋난다.
fix: |
  - (작음, 추천) 같은 탭을 이미 어느 창이 bind했으면 두 번째 창은 그 탭의 `<webview>`를 만들지 않고 "다른 창에 있음"을 보인다. 사람이 그 창으로 가면 그때 놓는다. 잃는 것: 두 번째 창에서는 그 탭이 비어 있다.
  - (중간) page를 한 창에 두고 다른 창에서 볼 때 다시 load한다(`<webview>`는 창 사이로 옮기지 못한다).
  두 창이 같은 workspace를 보이는 일이 드물어 쓰는 쪽이 늘 때 한다.
