id: sync-tables-destinations
version: 0.23.126
title: "한 앱이 표마다 다른 destination으로 data를 보내고, destination마다 따로 내보내고 읽는다(roadmap sync-tables 2단계)"
modules: [packages/base, packages/protocol, packages/protocol/apps/sync, packages/sdk, packages/cli, packages/core/apps, packages/core/apps/sync, packages/core/apps/update-state, packages/core/folder, packages/core/agent-workspaces, packages/core/main, packages/shell/renderer]
checked: [boundary-catalog]
change: |
  전: 선언 `sync`의 값은 모두 같은 destination이어야 했다. 내보내기·읽기는 앱마다 stream 하나, 읽기 cursor·held·기록 사본은 (앱, 출처)마다였다. 이름 붙인 destination만 쓰는 앱은 `computers`에 source와 앱 기록을 쓰지 않았다.
  후:
  - 선언: 표마다 다른 destination을 적을 수 있다. `runs_on`에 phone이 든 앱은 destination 하나까지(`invalid_input` "an app that runs on the phone sends its tables to one destination …"). release 준비는 보내는 표끼리 destination이 다른 foreign key를 거절한다. 1단계의 trigger·FK 규칙은 그대로다. `syncPlanOf`는 destination → 표 집합을 돌려준다(옛 `sync_to`는 그 destination에 모든 표).
  - sync log: `app_sync_log.destination`. 폰 앱이 아닌 앱의 write·rewind는 destination마다 줄 하나(그리 가는 표의 구간만)로 나뉜다. 폰 앱의 줄, '다시 snapshot' 줄, 건너뛴 줄은 destination이 없고 모든 stream의 것이다. 한 write의 줄은 한 transaction에 같이 든다(blob은 그 앞에 모두 준비한다): 사이에서 죽으면 줄이 하나도 없어 core가 뜰 때의 메우기가 모든 destination의 '다시 snapshot' 줄을 남긴다. 다른 기계에서 받은 줄과 held 줄은 그 변경이 온 destination을 적는다(이 기계가 held로 둔 자기 줄은 held가 될 때 가던 destination). 자기 held 변경이 막는 snapshot은 줄에 적힌 destination이 아니라 지금 활성 release가 그 변경이 건드린 표를 보내는 destination의 것이다(release가 표를 옮기면 새 destination이 막힌다).
  - 내보내기·읽기: (앱, destination)마다 stream 하나. 내보내기는 그 destination의 줄과 destination이 없는 줄만 보고, hold·held·snapshot 막기·오류·물러남이 destination마다 따로다(folder wiring의 lane도 `export:<app>:<destination>`, 앱 기록·source 쓰기도 `app:<app>:<destination>`이라 없는 destination의 물러남이 `computers`의 manifest를 늦추지 않는다). 앱 process control `apps.snapshot`(for folder)과 `apps.snapshot_merge`에 `destination`: 사본은 그리 보내는 표만 담고 합치기·없는 row 지우기도 그 표만이다. 받은 changes file은 이 기계 선언이 그 destination으로 보내는 표의 구간만 적용한다.
  - 흔적 정리: 앱 DB에 하나. 경계는 그 앱이 data를 주고받는 모든 destination의 알려진 기계와 자기 stream의 settled로 정하고(`sync_to`가 그 destination이 아닌 기록, 곧 source와 기록만 싣는 기록은 빼고. 읽기 목록·따라잡기도 같다), horizon은 그 앱의 모든 data stream 행과 표를 받는 destination의 앱 기록에 싣는다. hold 규칙은 stream마다 그 destination 상대의 horizon만 본다.
  - source·앱 기록: `private`이 아닌 앱은 늘 `computers`에, 그리고 표를 보내는 destination 모두에 source bundle, `@me/*` package file, `app.json`을 쓴다. `app.json`은 destination마다 그 stream의 data head·read·settled를 싣고 `sync_to`는 그 destination이 표를 받으면 그 이름, 아니면 null이다(null이면 `settled`·`horizon`도 null). 따라가기가 고르는 다른 기계의 release는 기계마다 가장 늦게 쓴 앱 기록 하나로 읽는다(`apps/update_state`와 같다). source 받기 cursor는 (출처, destination)마다다.
  - event: `across_machines` event file을 그 앱이 표를 보내는 destination마다 쓴다(받는 쪽은 id로 한 번만 낸다).
  - ledger: schema step `apps.sync-log.destination`(칸 더하기, 기존 change·held 줄은 그 줄 release 선언의 destination, 폰 앱의 줄은 NULL)과 `folder.destination`(`folder_reads`·`folder_held`·`folder_records`를 destination이 든 key로 다시 만든다. data cursor와 held는 그 앱 활성 release 선언의 destination, source cursor는 그 출처 기록 사본을 읽은 destination, 그 밖은 `computers`. 빚진 "없는 row 지우기" 표시를 `folder_reads.error` 안 JSON에서 칸 `absent`·`absent_caught_up_at`으로 옮기고 쓰지 않던 `bundle_hash`를 뺀다). held 사본의 새 자리는 `folder-held/<app>/<destination>/<출처>/`이고 옛 사본은 행이 든 path 그대로다. `FOLDER_FORMAT`은 그대로다.
  - 받은 held: 다른 기계의 snapshot 합치기가 정리된 흔적과 부딪는 row를 held로 낼 때 그 줄에 id(앱, destination, snapshot 번호, row bytes의 sha256)를 달고 이미 있는 id는 건너뛰며 한 transaction에 넣는다. 전에는 id 없이 넣어 sync log의 CHECK에 걸렸고, 읽기가 그 출처의 snapshot을 끝없이 다시 합치며 그 stream이 멈췄다(`app_not_running` "ledger에 기록할 수 없다"로 보였다. 1단계부터 있던 길인데 표를 그 기계에 없던 destination으로 옮기면 늘 난다). 앱의 ledger 쓰기 연결이 저장소 탓이 아닌 throw를 `internal`과 그 까닭으로 돌려준다(읽기에는 `apply_failed`).
  - 앱이 뜸: 앱 process가 새로 떠 시작 사실을 남기면 folder가 그 앱의 내보내기 lane 가운데 앱이 없어서(`app_not_running`) 물러난 것과 읽기 stream 가운데 같은 까닭으로 물러난 것의 물러남을 지우고 바로 다시 돈다(다른 오류의 물러남은 그대로). 전에는 core를 다시 켠 뒤 앱이 뜨기 전의 첫 시도가 물러나 snapshot과 읽기가 몇 분 늦었다. folder wiring이 apps에 내는 hook `folderAppStarted`.
  - 표가 stream을 떠날 때: 그저 뒤처진 받는 기계는 출처의 file을 번호 순서로 다 읽는다. 받는 기계가 먼저 새 release가 되어 옛 release file을 held로 두었으면 출처의 새 release snapshot이 그 held를 지우고 그 snapshot은 떠난 표를 싣지 않는다: 그 표 변경은 출처와 받는 기계가 그 표의 새 destination을 다 가질 때만 그 snapshot으로 온다.
  - 읽기 계약: `machine/environment`의 앱 칸 `sends_to`·`destination`·`export`·`imports` → `destinations: [{name, tables, state, export, imports}]`. `carry/status`의 앱 칸 `destination` → `destinations`. `apps/update_state`에 `destinations`와 held마다 `destination`. `machine/environment`의 destination마다 `machines`는 그 destination에서 기록을 읽은 다른 기계 수이고(기계마다 기록을 읽은 destination을 모두 센다), 기계마다 `destinations`도 그 목록이다. 이 기계에 없는 destination(`not_set_here`)의 `export`는 null이다. `apps/sync_held` list에 줄마다 `destination`(CLI `lophn app sync-held` 도움말이 말한다). Settings › Sync의 앱 줄이 destination 목록을 보인다.
  - SDK: `@lophn/declaration` 5.2.0(minor, 표마다 destination), `@lophn/app-ui` 2.25.1과 `@lophn/app-ui-native` 1.11.1(pin만). `migrate-sdk` 메모 `declaration-5.2.0.md`(Instruction diff), `app-ui-2.25.1.md`, `app-ui-native-1.11.1.md`. 지원 하한은 그대로다. `design-app`의 `folder-sync.md`, declaration guide, `connect-computers`가 표마다 destination과 두 규칙, `destinations` 읽기를 말한다.
why: |
  사람은 앱 안의 data마다 길을 정하길 원했다(집계는 컴퓨터끼리, 오래된 원본은 cloud 폴더로). 1단계는 보내지 않는 표만 뺐고 한 앱의 보내는 표는 destination 하나였다. 또 이름 붙인 destination만 쓰는 앱이 `computers`에 나가지 않아 `app-source-share-without-sync`의 결정과 어긋났다.
decisions:
  - text: "stream은 (앱, destination)마다이고 sync log 줄도 destination마다 나눈다(폰 앱의 줄은 나누지 않는다). 버린 길: 줄 하나에 두고 내보낼 때만 destination마다 거르기(hold가 줄째로 바뀌어 다른 destination의 변경까지 held가 되고 그 snapshot을 막는다)."
    by: agent
  - text: "흔적 정리와 horizon은 앱 DB에 하나이고 그 앱이 data를 주고받는 모든 destination의 상대를 기다린다. `computers`에 source와 기록만 쓰는 상대의 기록(settled 없음)은 세지 않는다: 세면 그런 앱은 늘 90일 쪽으로만 정리된다. 대가: 가장 느린 상대가 모든 표의 흔적을 90일까지 붙든다."
    by: agent
  - text: "표를 destination X에서 Y로 옮긴 release는 다른 release 바뀜과 같다: 새 release의 첫 file이 stream마다 snapshot이고 다른 기계는 따라올 때까지 held로 둔다. 그 표는 계속 보내던 표라 row·칸 clock이 남아 Y의 snapshot이 칸 단위로 합쳐진다(로컬에서 다시 올린 표의 '가장 늦게 시작한 컴퓨터가 이긴다'와 다르다). X에 남은 옛 release 변경은 그 출처가 올라온 뒤 X에 쓰는 snapshot이 덮고 옛 고침은 Y의 snapshot으로 온다. Y가 없는 기계는 그 표를 더 받지 않는다."
    by: agent
  - text: "기록 사본은 destination마다 둔다. 기계 기록은 기계마다 가장 큰 revision을, 활성 release·source처럼 destination과 상관없는 앱 기록 칸은 가장 늦은 `updated_at` 사본을 읽는다(revision은 destination마다 따로 센다)."
    by: agent
  - text: "ledger step은 기존 data cursor와 held를 그 앱 활성 release 선언의 destination으로, source cursor를 기록 사본을 읽은 destination으로 채운다. log 줄은 그 줄 release의 선언으로 채운다(앞 release가 다른 destination이었던 줄도 맞는 stream이 맡는다)."
    by: agent
  - text: "빚진 '없는 row 지우기' 표시를 이 step에서 `folder_reads.error` JSON 밖 제 칸으로 옮겼다(이슈 `folder-absent-pass-mark-in-error-column`이 다음 folder 표 step에 같이 하기로 한 것)."
    by: agent
  - text: "`private`이 아닌 앱은 늘 `computers`와 표를 보내는 destination 모두에 source와 앱 기록을 쓴다. 대가: 이름 붙인 destination만 쓰던 앱은 이 판 뒤 첫 내보내기에 `computers`로 source 전체 bundle을 한 번 쓴다."
    by: agent
  - text: "한 write를 destination마다 나눈 줄은 한 transaction에 넣는다. 버린 길: 메우기가 invocation마다 destination별 줄을 견주기(그 write의 changeset을 다시 나눠야 하고 rewind 줄은 invocation이 없다)."
    by: agent
  - text: "자기 held 변경이 snapshot을 막는 destination은 held 줄의 changeset이 건드린 표를 지금 활성 release가 보내는 곳으로 정한다(snapshot을 쓰려 할 때 held 줄의 bytes를 읽어 거른다). 버린 길: release가 바뀔 때와 ledger step에서 held 줄의 destination을 다시 적기(한 줄이 새 release에서 두 destination의 표를 건드리면 하나만 적을 수 있다). ledger step `apps.sync-log.destination`은 그래서 그대로다."
    by: agent
  - text: "표를 옮겨 이 기계의 활성 release가 더는 쓰지 않는 destination에 남은 다른 release의 held file(읽는 쪽)은 지우지 않고 남긴다(update_state와 environment의 held에 보인다). 그것이 다른 destination의 snapshot에 덮였는지 싸게 알 길이 없어, 사람이 정하지 않은 것을 지우지 않는다. 따라가기의 release 목록은 기계마다 가장 새 기록 하나로 읽어 그런 destination의 옛 기록이 옛 release를 내놓지 않는다."
    by: agent
  - text: "출처의 새 release snapshot이 다른 release라 둔 held를 지울 때, 그 snapshot이 싣지 않는 표(그 release가 다른 destination으로 옮긴 표)의 변경을 따로 적용하거나 남기지 않는다. 그 held file은 다른 release의 schema라 적용할 길이 그 release가 되는 것뿐이다. 대가: 출처나 받는 기계가 그 표의 새 destination을 갖지 않으면, 받는 기계가 새 release가 되기 전에 적용하지 못한 출처의 옛 release 변경(그 표)은 그 받는 기계에 오지 않는다. 그저 뒤처진 받는 기계는 file을 번호 순서로 다 읽어 잃지 않는다."
    by: agent
  - text: "roadmap `sync-tables`는 다 했으므로 지웠다. 하지 않는 것(칸·줄별 정책, 폰 사본의 표별 정책, 표마다 길을 고르는 화면)은 `folder-sync.md`의 비목표로 남는다."
    by: agent
follow_up: |
  앱 file(사진·file bytes)은 여전히 컴퓨터 사이로 가지 않는다(row만 간다. `app-file.md`).
checklist:
  - "해야: lophn을 다시 build하고 설치한다"
  - "폴더로 맞추던 앱이 업데이트 뒤에도 그대로 맞춰지는지(`lophn machine environment`의 그 앱 `destinations[].imports`의 cursor가 업데이트 전과 같고 export에 오류가 없는지) 본다"
