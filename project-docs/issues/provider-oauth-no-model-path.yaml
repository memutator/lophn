id: provider-oauth-no-model-path
title: "provider OAuth 로그인 길은 있지만 그 credential로 model을 부르는 길이 없다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/lophn-agent, packages/protocol, packages/shell/renderer]
now: |
  provider 정의의 `auth_kinds`에 `oauth`가 있고(`packages/protocol/lophn-agent/provider-values.ts`), core에 로그인 흐름(`packages/core/lophn-agent/providers/oauth.ts`, `providers/login.ts`)이, 설정 화면에 `signIn`(`settings/providers/core-source.ts`)이 있다. 그러나 붙여 넣기 창을 여는 `settings/core-call.ts`의 `windowSecretOpener`가 preload에 없는 `lophnShell.openConfirmation`을 찾아 창이 열리지 않고(preload는 `openSecretInput`만 낸다), agent runtime의 secret 전달(`run-loop/runtime-secret.ts`)은 `provider.`·`mcp.`·`mcp-oauth.` 이름만 보낸다. OAuth token이 model 호출에 실리는 길이 없다.
impact: |
  사람이 구독 계정(OAuth)으로 provider를 연결할 수 없다. 화면에는 sign in 단추가 보인다.
fix: |
  - 살린다(큼): 붙여 넣기 창을 `openSecretInput` 길로 고치고, token을 `secrets.json`에 두고, runtime이 provider 호출에 token을 싣고 갱신(`RefreshProviderCredential`)을 잇는다.
  - 지운다(중간): OAuth 정의와 로그인 흐름, 화면의 sign in을 지운다. API key와 loopback provider만 남는다.
  - 추천: 사람이 구독 OAuth를 제품에 둘지 정한 뒤 그대로 한다. 둘 생각이 없으면 지운다.
decided: |
  구독 계정 OAuth를 제품에 둔다. ChatGPT(공식 Sign in with ChatGPT)와 SuperGrok(device code)만 두고 Claude는 두지 않는다(Anthropic 금지). (사람, Claude 제외는 agent)
closed: |
  로그인이 끝나면 core(`providers/login.ts`)가 token을 `provider.<id>`·`.refresh`·`.meta`에 저장하고 ConnectProvider(`auth_kind: oauth`, `expires_at`)를 부른다. 화면은 begin → OS browser → interval마다 complete이고 붙여넣기 창은 없다. `models/resolve.ts`가 OAuth를 Bearer로 싣고, runtime이 token을 청할 때 core(`providers/oauth-refresh.ts`)가 만료 5분 전이면 갱신한다. 발급자 호출은 MCP와 같은 대기열(`issuer-requests.ts`)로 runtime이 보낸다. gate 셋(`LOPHN_LIVE_PROVIDER`, `verified_for_lophn`, wiring의 http 없음)은 지웠다.
guard: "packages/core/lophn-agent/providers/login_test.ts, packages/core/lophn-agent/providers/oauth-refresh_test.ts, packages/core/lophn-agent/providers/secret-refs_test.ts"
