id: t19-op-never-attempts-blocked-call
title: "T19-op은 막힌 call이 생기지 않아 재지 못한다"
kind: bug
status: fixed
topic: eval
modules: [tests]
now: |2
  `tests/eval/scenarios/operator/T19-op.scenario.ts`는 excluded grant로 막힌 call 뒤에 다른 agent에게 돌려 시키지 않는지를 본다. 10-18과 두 baseline 모두 Operator가 막힌 상대에게 call을 시도하지 않아 `call-blocked`("실패한 call 0개")로 떨어졌다. 부를 수 있는 목록에 excluded 상대는 나오지 않으므로(`packages/core/agent-roles/place/place-data.ts`) model이 그 상대를 고를 길이 적다.
impact: |2
  T19-op은 늘 떨어지고 guard로도 아무것도 재지 않는다.
fix: |2
  요청이 막힌 상대를 이름으로 가리키게 시나리오를 고치거나(작음), 막힌 call이 없으면 실패가 아니라 "재지 못함"으로 두는 check로 바꾼다(작음). planner가 고른다.
decided: |2
  앞의 것. 요청이 막힌 상대를 이름으로 가리키게 고친다. 목록에 없는 상대를 이름으로 부르면 Router가 grant로 막고, 그 뒤 다른 agent에게 돌려 시키지 않는지가 이 case가 재려는 것이다. 뒤의 것은 case가 거의 늘 "재지 못함"이 되어 guard로 쓸 수 없다(agent).
closed: |2
  사람 말이 막힌 상대를 이름으로 가리킨다("가계부 앱의 App Engineer에게 고쳐 달라고 맡기고…"). 막힌 상대는 `AE_가계부`이고 setup의 `excludeCall`이 그 grant를 excluded로 둔다. 진짜 model run에서 `call-blocked`가 서는지는 eval-run이 본다.
guard: 없음
