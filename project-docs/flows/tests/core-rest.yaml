    note: "createRemoteCall을 실제 CredentialRegistry·ConfirmationRegistry와 가짜 handler·writer(확인을 executor처럼 예약·소비)로 돌린다. 터미널 입력 허락이 없는 기기의 secrets/put, providers/connect-key, input_request/answer_secret, providers/disconnect, settings/update, agents/create, projects/create는 forbidden이고 handler·writer에 닿지 않으며 값이 오류에 없다. 허락받은 기기는 같은 표가 닿고 providers/disconnect는 core가 붙인 handle을 소비한다. 허락받은 기기도 허락이 있어도 열지 않는 표(roster, logins, 목록 밖 devices, machines, MCP 로그인 시작, change-skip)와 vault 이름의 secrets/put은 forbidden이고 아무것도 닿지 않는다. 기기 route 목록 둘(REMOTE_ALLOWED_ROUTES, REMOTE_PERSON_ROUTES)은 겹치지 않고 사람이 부를 수 있는 route만 든다. handler 오류의 details가 기기의 결과에 그대로 온다. agent 자격은 targets를 넓혀도 actor 검사에 막혀 secrets/put과 providers/disconnect가 forbidden이고 handle이 생기지 않는다(principal user인 사람 자격도). machines/call의 요청한 쪽은 core가 자격에서 정한다: 살아 있는 capability는 screen, capability 없는 사람 token은 terminal, 죽은 capability는 forbidden이고 link에 보내지 않으며 입력의 by나 capability는 다른 기계로 가지 않는다. 이 컴퓨터를 고르면 invalid_input이고 구독(machines/watch)은 capability가 없거나 죽었으면 forbidden이다. machines/app_tools는 session 없는 agent로 묻고 닿지 않는 앱은 view null이며 private workspace의 agent에는 앱을 비우고, 다른 컴퓨터가 준 command 목록은 다시 걸러 틀린 것은 빼고 긴 설명은 자른다. 명단의 컴퓨터 목록은 컴퓨터만 담고 이 컴퓨터를 self로 표시한다"

