id: reader-queue-refuses-window-burst
title: 창이 한 번에 read를 8개 넘게 부르면 core가 나머지를 unavailable로 거절해 "Couldn't load this conversation"이 선다
kind: bug
status: fixed
topic: platform
modules: [packages/core/storage, packages/shell/renderer]
now: |
  `packages/core/storage/ledger/reader-pool.ts`의 `read`는 caller(principal)마다 줄이 8개(`queues.get(ctx.principal)?.length >= 8`)이거나 전체 64개면 기다리게 하지 않고 바로 `unavailable`("reader가 현재 요청을 처리할 수 없다")을 돌려준다. desktop 창은 workspace를 바꾸거나 session을 열 때 sessions/list, projects/list, apps/list, releases/list_records, jobs/list, agent_assignments/get, acp/snapshot 등을 한꺼번에 부르고, 한 창의 호출은 모두 같은 사람 자격이라 같은 줄에 선다. 개발 core에서 이 컴퓨터의 창이 `projects/list` 20개를 동시에 부르면 5개가 unavailable였고, Home과 project 사이를 오간 뒤 session을 열면 "Couldn't load this conversation. Try again."이 섰다(Try again을 누르면 읽힌다). 다른 기계의 창은 remote client가 한 연결의 call을 8개로 막아 피한다.
impact: |
  사람이 보는 동작: 이 컴퓨터의 창에서 workspace를 오가면 가끔 대화나 목록이 "읽지 못함"으로 서고 사람이 Try again을 눌러야 한다. 창이 여럿이면(같은 사람 자격) 더 잦다.
fix: |
  - (작음, 추천) reader pool이 caller 줄이 차면 거절하지 않고 짧게(예: read timeout 안에서) 기다리게 한다. 전체 상한 64는 그대로 둔다. 잃는 것: 한 caller가 몰아 부르면 그 caller의 응답이 늦다(다른 caller는 공정 순서로 그대로다).
  - (작음) shell main의 core client가 창마다 동시 read 수를 막는다(remote client와 같은 방법). 잃는 것: CLI·앱 등 다른 caller는 그대로 거절을 받는다.
closed: |
  caller의 read 줄이 8개로 찼을 때 새 read를 거절하지 않고 2초(`READ_TIMEOUT_MS`)까지 잡아 두었다가 자리가 나면 줄에 넣는다(`reader-pool.ts`). 전체 64개 상한은 그대로다.
guard: 없음
