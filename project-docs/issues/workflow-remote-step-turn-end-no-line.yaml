id: workflow-remote-step-turn-end-no-line
title: 다른 컴퓨터가 가져간 workflow step의 turn이 실패·멈춤·재시작으로 끝나면 시작한 컴퓨터에 줄이 남지 않는다
kind: bug
status: open
topic: workflow
modules: [packages/core/lophn-agent, packages/core/router, packages/core/workflows, packages/shell/renderer]
now: |
  workflow step을 다른 컴퓨터의 agent에게 넘기면(`on: <컴퓨터>`) 시작한 컴퓨터에는 보낸 쪽이 program인 call 행 하나가 남고, 받은 컴퓨터는 그 step을 step 입력으로 넣는다(`project-docs/architecture/workflow.md` 지키는 것 47~52).

  받은 컴퓨터가 step을 가져간 뒤(turn이 시작된 뒤) 그 turn이 실패하거나, 사람이 멈추거나, 그 컴퓨터가 재시작해 끊기면 시작한 컴퓨터로 가는 것이 없다. turn이 끝날 때 call을 실패로 닫는 `abandonTurnCall`(`packages/core/lophn-agent/run-loop/commands.ts`)은 `messages`에서 `reply is not null`인 입력만 고르는데 step 입력은 `reply`가 null이다. 가져가기 전의 재시작은 `lophn_restarted` 실패 mail이 가서 `not_handed`(`remote_failed`) 줄이 남는다.

  그래서 시작한 컴퓨터의 instance는 그 step이 넘겨진 채(call 행 `accepted`, `delivery` `running`) 그대로 서 있고 줄 하나 없이 기다린다. 같은 일이 이 컴퓨터의 step에서 나면 재시작은 `lophn_restarted` 줄을 남긴다(지키는 것 30). 실패하거나 멈춘 turn은 이 컴퓨터의 step에서도 줄이 없다.

  일부러 닫지 않았다: 그 turn에서 step의 call을 닫으면, 사람이 그 컴퓨터의 session을 다시 밀어 agent가 낸 report가 `conflict`로 거절된다.
impact: |
  사람이 다른 컴퓨터에 넘긴 step이 멈춘 것을 시작한 컴퓨터에서 알 수 없다. run은 도는 것처럼 보이고, 사람이 그 컴퓨터의 session을 열어 봐야 turn이 끊긴 것을 안다. 자리를 비운 사이 그 컴퓨터가 update로 재시작하면 workflow가 사람이 알아챌 때까지 선다.
fix: |
  - (했다) run 화면이 다른 컴퓨터로 넘긴 step에 컴퓨터 이름과 배달 상태를 보인다. 줄은 여전히 없지만 사람이 어느 컴퓨터를 봐야 하는지 안다. 그 컴퓨터의 session을 이 창에서 여는 길은 없다.
  - (중간, 추천) 받은 컴퓨터가 가져간 step의 turn이 report 없이 끝나면 program이 쓴 진행 줄 하나를 시작한 컴퓨터로 보낸다(step은 열어 둔다). report mail의 `next` 없는 꼴을 program이 쓰는 길이 하나 더 생기고, 줄의 `by`에 program 갈래가 필요하다. 잃는 것: mail 갈래 하나와 줄 종류 하나.
  - (버림) 그 turn에서 step을 닫기. 뒤의 report가 거절되고 이 컴퓨터의 step과 다르게 된다.
decided: |
  step은 닫지 않는다(agent). run 화면의 표시는 했다. 사람이 끊긴 step을 놓치는 일이 실제로 생기면 진행 줄 안을 한다.
