id: workflow-rename-merges-desk-into-main
title: workflow 폴더 이름을 바꾸면 그 desk가 Main으로 합쳐진다
kind: bug
status: fixed
topic: workspace-layout
modules: [packages/shell/renderer, packages/core/workflows]
now: |
  desk key가 workflow 이름이다. `packages/shell/renderer/workspace/workspace-window.tsx`의 `mergeVanished`가 workflow 목록을 읽을 때마다 목록에 없는 desk를 `mergeDesks`(`mergeDeskIntoMain`)로 Main에 합친다. 이름을 바꾼 workflow는 옛 이름이 목록에서 사라져 합쳐지고, 새 이름은 빈 새 desk가 된다. workflow 이름을 바꾸는 화면이나 명령은 없다. 폴더(`workflows/<name>/`)를 손으로 옮기거나 agent가 file로 옮길 때만 난다.
impact: |
  그 workflow desk에 늘어놓은 탭 배치(group, floated, detached)가 Main에 섞인다. 탭은 잃지 않는다.
fix: |
  core `workflows/rename` command가 폴더·ledger(`workflow_instances`, `flow_sdk_reviews`, `jobs`, `sessions.workflow_origin`)·layout file을 갱신하고 transient `WorkflowRenamed` event를 발행한다. shell renderer는 `WorkflowRenamed`를 받아 목록 갱신 전에 desk key와 `workflow:<from>` 탭을 `renameWorkflowDesk`로 원자적으로 옮겨 `mergeVanished`가 Main으로 합치지 않게 한다.
closed: |
  cascade 구현에서 `WorkflowRename`·`WorkflowRenamed`와 `renameWorkflowDesk`로 해결했다.
guard: packages/shell/renderer/shell/desk-model_test.ts
