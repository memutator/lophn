id: sync-apply-timeout-closes-as-failed
title: 변경 묶음 적용의 답을 잃으면 invocation이 실패로 닫혀 적용된 변경의 changeset을 Activity가 잃는다
kind: bug
status: open
topic: app-sync
modules: [packages/core/apps]
now: |
  폴더 file 하나(`applyChanges`)와 폰 변경 하나(`applyPhone`)는 `packages/core/apps/calls/service.ts`에서 invocation을 연 뒤 `deps.link.syncApply`를 부른다. relay(`packages/core/apps/runtime/supervisor/relay.ts`의 `toLive`)는 보낸 뒤 60초(`APPLY_TIMEOUT_MS`)가 지나거나 연결이 끊기거나 답이 상한을 넘은 경우(`lost`)와 보내지 못한 경우(`not_sent`)를 모두 `unavailable`로 돌려주고, service는 `!applied.ok`면 `closeFailed`로 연 invocation을 모두 실패로 닫는다. 앱 process는 그 묶음을 한 transaction으로 이미 commit했을 수 있다. 다음 시도는 sync log에 줄이 없어 같은 변경을 다시 적용하지만 칸 단위 규칙상 바뀌는 것이 없어 effective가 빈 성공으로 남는다.
impact: |
  큰 폴더 file(최대 1,000개·16 MiB)이나 느린 기계에서 다른 기계·폰의 변경이 DB에 들어갔는데 Activity에는 changeset 없는 실패와 빈 성공만 남는다. 그 변경은 rewind로 되돌릴 수 없고, 결과 모름이었다면 막혔을 rewind 범위가 막히지 않아 rewind가 그 변경을 모른 채 앞뒤를 되돌린다.
fix: |
  - 작음(추천): relay가 `lost`와 `not_sent`를 가르게 하고(호출 길의 `sent`처럼) service가 보낸 뒤 잃은 답은 결과 모름(`closeUnknown`)으로 닫는다. abandon 길이 이미 그렇게 한다. rewind는 결과 모름이 든 범위를 막으므로 사람은 그 사실을 본다.
  - 중간: 앱 process가 변경 id마다 결과를 남겨 다시 물을 수 있게 한다.
