# 저장소 root에서 deploy한다: README.md.
app = "lophn-relay"
primary_region = "nrt"

[http_service]
  internal_port = 8080
  force_https = true
  # WebSocket이 오래 붙어 있어야 해서 machine을 멈추지 않는다.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  # machine은 1대여야 한다(README). relay는 core 자리를 process 메모리에만 둔다.

  # 기본 한도(25)는 연결 수라 core 몇 개와 그 폰이면 찬다.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
