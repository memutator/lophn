  - {entry: "key:agent.find", reason: "열린 대화 줄의 DOM 글을 훑어 칠하는 화면 찾기다(창 메모리). 세션 간 검색은 session-message-search다"}
  - {entry: "key:agent.jump-previous", reason: "대화 목차에서 앞 사람 글로 scroll한다. 제품 상태를 바꾸지 않는다"}
  - {entry: "key:agent.jump-next", reason: "대화 목차에서 다음 사람 글로 scroll한다. 제품 상태를 바꾸지 않는다"}
