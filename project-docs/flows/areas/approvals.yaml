area: approvals
flows:
  - id: tool-gate-check
    title: 실행 전 tool 호출을 판정하고 shell 규칙 ask면 사람에게 묻는다
    actor: agent
    entries: [route:tool_gate/check]
    boundary: [approvals, agent-tools]
    code: [packages/core/lophn-agent/tool-judgment/, packages/core/main/daemon/wiring/approvals.ts, packages/core/approvals/, packages/core/lophn-agent/tools/work.ts]
    steps:
      - "runtime이 gate가 걸린 tool(shell.run, app command, MCP tool)을 실행하기 직전에 `tool_gate/check`를 부른다. credential의 session·turn이 입력과 같아야 한다."
      - "core가 session의 agent·workspace·`spawned_by`·`skip`과 turn의 `mode`를 읽는다. 못 읽으면 판정하지 않는다."
      - "`judge`가 할당 없는 앱 tool은 `not_assigned`, 할당에서 뺀 tool은 `removed`, shell 규칙 floor와 deny 줄은 `shell_rule`로 실행 없이 이유를 돌려준다."
      - "shell 규칙이 `ask`를 내고 mode가 attended이거나 팀 자식(`toParent`)이면 turn request를 메모리에 열고 기다린다. unattended와 skip은 묻지 않고 run이다."
      - "app tool과 MCP tool은 판정이 늘 run이다(외부 효과 묻기가 꺼져 있다)."
      - "사람이 `turn_requests/decide`로 once나 always를 고르면 기다리던 call이 입력을 그대로 실행한다(다시 판정하지 않는다). reject면 `the person rejected this tool call: <이유>`를 받는다."
      - "기다림이 turn 끝, session 닫힘, 재시작으로 풀리면 cancelled를 받는다(`turn-request-cancel`)."
    outcomes:
      - id: run
        when: "할당과 규칙에 걸리지 않음, 또는 unattended·skip이라 묻지 않음"
        observe: ["response"]
      - id: run-after-allow
        when: "사람이 once나 always로 허락한 뒤 실행"
        observe: ["event:TurnRequestClosed", "response"]
      - id: denied-not-assigned
        when: "할당하지 않은 앱의 tool"
        observe: ["response"]
      - id: denied-removed
        when: "할당에서 뺀 command"
        observe: ["response"]
      - id: denied-shell-rule
        when: "shell 규칙 floor나 deny 줄이 명령(또는 조각)에 맞음. 맞은 pattern을 싣는다"
        observe: ["response"]
      - id: rejected-by-person
        when: "승인 카드에서 사람이 거절함"
        observe: ["event:TurnRequestClosed", "response"]
      - id: cancelled
        when: "기다리던 turn이 끝났거나 session이 닫혔거나 core가 내려감"
        observe: ["event:TurnRequestClosed", "response"]
      - id: forbidden
        code: forbidden
        when: "credential이 묶은 session·turn이 입력과 다름"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "할당이나 session·turn 값을 읽지 못함"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    refs: ["H3", "H4", "P4"]
    docs: [architecture/approval.md, architecture/agent-call.md]
    unclear:
      - "app tool과 MCP tool은 판정이 늘 run이라(ASK_EXTERNAL_WHEN_ATTENDED가 꺼짐) 이 flow가 묻는 것은 shell 규칙뿐이다. 외부 효과를 다시 묻으려면 판정 상수를 켠다. 사람이 정할 일이다."
      - "MCP server를 끈 것이 막히는 곳은 판정이 아니라 연결 call(packages/core/lophn-agent/extensions/mcp-toolkit.ts)이다. models 영역의 flow가 맡는다."
      - "forbidden과 unavailable은 sessionOf·modeOf의 읽기 오류를 그대로 돌려주므로, 그 읽기가 낼 수 있는 code를 이 flow 안에서 더 좁히지 못했다."

  - id: turn-request-decide
    title: 사람이 대기 중인 shell 규칙 승인 request를 once, always, reject로 결정한다
    actor: person
    entries: [route:turn_requests/decide]
    pre: [route:tool_gate/check]
    boundary: [approvals, acp]
    code: [packages/core/approvals/turn-requests.ts, packages/core/approvals/approvals.ts, packages/core/main/daemon/wiring/approvals.ts, packages/shell/renderer/desktop/connection/waiting/decide.ts]
    steps:
      - "사람 자격만 받는다. agent, 앱, MCP server는 스스로 허락할 수 없다. 입력이 결정 형식이 아니면 invalid_input이다."
      - "메모리에서 session과 id가 맞는 request를 찾는다. 없거나 다른 session의 것이거나 팀 자식(`to_parent`)의 request면 not_found다(사람에게 카드가 없다)."
      - "이미 닫힌 request면 conflict다."
      - "reject면 이유 한 줄과 함께 닫는다. 기다리던 call은 거절 결과를 받는다."
      - "always면 request의 `always_patterns`를 shell 규칙 allow 줄로 설정 `approvals.shell_rules`에 더한다. project workspace면 그 project 층, 아니면 전역 층이다. 저장이 실패하면 internal이고 request는 다시 열린다."
      - "once나 always면 기다리던 call이 입력을 그대로 실행한다. TurnRequestClosed(allow)를 Bus로 낸다."
    outcomes:
      - id: once
        observe: ["event:TurnRequestClosed", "response"]
      - id: always
        when: "always_patterns가 있고 shell 규칙 저장에 성공"
        observe: ["disk:settings.json", "event:TurnRequestClosed", "response"]
      - id: reject
        when: "사람이 거절함(이유는 한 줄, 없을 수 있음)"
        observe: ["event:TurnRequestClosed", "response"]
      - id: not-found
        code: not_found
        when: "request가 없거나 다른 session의 것이거나 팀 자식의 request"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "이미 결정되었거나 닫힌 request"
        observe: ["response"]
      - id: always-without-pattern
        code: invalid_input
        when: "always를 골랐는데 always_patterns가 비었거나 그 kind에 always 처리기가 없음. 규칙은 쓰지 않는다"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "사람 자격이 아님"
        observe: ["response"]
      - id: internal
        code: internal
        when: "always의 shell 규칙을 저장하지 못함"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    refs: ["H4", "R4"]
    docs: [architecture/approval.md]
    unclear:
      - "always 저장 중에 turn이 끝나면 request는 cancelled로 닫히는데 규칙은 이미 저장되고 응답은 conflict다(turn-requests.ts decide의 await 뒤 확인). 이 규칙을 남길지는 정하지 못했다."

  - id: turn-request-cancel
    title: turn이 끝나거나 session이 닫히거나 core가 내려가면 기다리던 승인 request를 cancelled로 닫는다
    actor: system
    entries: [system:turn-request-cancel]
    boundary: [approvals, router]
    code: [packages/core/main/daemon/wiring/approvals.ts, packages/core/approvals/turn-requests.ts]
    steps:
      - "Bus가 TurnEnded를 내면 그 session에 열린 turn request를 모두 cancelled(turn_ended)로 닫는다. SessionEnded면 session_closed다."
      - "core가 내려갈 때(closeIntake) 이 기동에서 request를 연 session의 메모리 request를 restart로 닫는다."
      - "같은 구독이 그 session의 질문 대기도 cancelled로 푼다(QuestionResolved). 질문 쪽 결과는 turns 영역이다."
      - "닫힌 request를 기다리던 call은 `the request was cancelled (<cause>)` 결과로 끝난다. 거절과 구별된다."
      - "팀 자식의 request가 부모 답 없이 닫히면 부모에게 간 ask call을 자식 이름으로 취소한다(`calls/ask-withdraw`)."
      - "닫힐 때마다 TurnRequestClosed(cancelled)를 Bus로 낸다."
    outcomes:
      - id: cancelled-turn-ended
        observe: ["event:TurnRequestClosed", "response"]
      - id: cancelled-session-closed
        observe: ["event:TurnRequestClosed", "response"]
      - id: cancelled-restart
        when: "core가 정상 종료(closeIntake)하면서 기다리던 request"
        observe: ["event:TurnRequestClosed", "response"]
    crosses_process: false
    risk: []
    refs: ["H4"]
    docs: [architecture/approval.md, architecture/workspace-session.md]
    unclear:
      - "비정상 종료(crash)에서는 request가 메모리와 함께 사라져 TurnRequestClosed가 나가지 않는다. 기다리던 turn을 회복하는 쪽은 turns 영역이라 확인하지 못했다."
      - "TurnEnded는 turn 하나가 아니라 그 session의 request 전부를 닫는다(한 session에 turn 하나가 도는 전제에 기댄다)."

  - id: team-child-approval-to-parent
    title: 팀 자식의 shell 규칙 ask를 사람 대신 부모 session에 올려 부모의 답으로 푼다
    actor: agent
    uses: [route:calls/ask-open, route:calls/ask-withdraw, route:calls/reply]
    pre: [route:tool_gate/check]
    when: "spawned_by가 있고 skip이 꺼진 session의 shell 규칙 ask (skip이 켜지면 run이다)"
    boundary: [approvals, router]
    code: [packages/core/main/daemon/wiring/approvals.ts, packages/core/approvals/turn-requests.ts, packages/core/router/]
    steps:
      - "자식의 shell 규칙 ask는 사람 대신 부모에게 가는 result call(`calls/ask-open`)로 연다. call 본문은 명령 글(또는 tool 이름)뿐이고 agent가 쓴 설명은 싣지 않는다."
      - "이 request에는 카드도 always도 없다(always_patterns가 비어 있다). 자식 turn은 turn request로 기다린다."
      - "부모가 `lophn call reply <call> --allow` 또는 `--reject --body <이유>`로 답하면 once 허락이나 거절이 그 request를 푼다. 부모의 답은 always가 될 수 없다."
      - "부모가 끝나 call이 receiver_ended로 닫히면 `the parent session ended without answering` 거절이다. 처음부터 닿지 않으면 `the request could not reach the parent session` 거절이다."
      - "자식 request가 부모 답 없이 다른 이유(turn 끝, session 닫힘)로 닫히면 core가 ask call을 취소한다. 부모의 늦은 답은 closed true다."
    outcomes:
      - id: parent-allowed
        observe: ["event:TurnRequestClosed", "ledger:messages", "response"]
      - id: parent-rejected
        when: "부모가 --reject로 답함. 이유는 한 줄로 자식에게 간다"
        observe: ["event:TurnRequestClosed", "ledger:messages", "response"]
      - id: parent-ended
        when: "부모 session이 답 없이 끝남"
        observe: ["response"]
      - id: parent-unreachable
        when: "처음부터 부모에게 call이 닿지 않음"
        observe: ["response"]
      - id: withdrawn
        when: "자식 turn이 끝나거나 session이 닫혀 부모의 call을 취소함"
        observe: ["ledger:messages", "response"]
    crosses_process: true
    risk: [permission]
    refs: ["R4", "H4", "T4"]
    docs: [architecture/approval.md, architecture/agent-call.md]

  - id: team-child-question-to-parent
    title: 팀 자식의 질문(ask)을 부모 session에 올려 부모의 답으로 푼다
    actor: agent
    uses: [route:ask/wait, route:calls/ask-open, route:calls/ask-withdraw, route:calls/reply]
    when: "spawned_by가 있는 session의 ask tool (mode와 skip에 상관없이 부모에게 간다)"
    boundary: [approvals, router]
    code: [packages/core/main/daemon/wiring/approvals.ts, packages/core/lophn-agent/tools/questions/, packages/core/router/]
    steps:
      - "자식의 ask tool 질문은 mode와 skip에 상관없이 부모에게 간다. 질문 목록을 적은 call(`calls/ask-open`)을 부모에게 보낸다."
      - "자식 turn은 질문 대기에서 기다린다. 질문 대기는 부모의 답이 풀거나 아래 경우에 풀린다."
      - "부모가 `lophn call reply <call> --body <답>`로 답하면 parent_reply로 풀린다."
      - "사람이 자식 session에 메시지를 보내면 질문은 human_message로 풀리고, 부모의 call은 `calls/ask-withdraw`로 취소된다."
      - "부모가 답 없이 끝나거나 call이 닿지 않으면 cancelled로 풀린다. 자식 turn이 끝나거나 session이 닫혀도 cancelled다."
    outcomes:
      - id: parent-reply
        observe: ["event:QuestionResolved", "ledger:messages", "response"]
      - id: human-message
        when: "사람이 자식 session에 보낸 메시지가 질문을 풂"
        observe: ["event:QuestionResolved", "response"]
      - id: cancelled-parent-gone
        when: "부모 session이 답 없이 끝났거나 부모에게 call이 닿지 않음"
        observe: ["response"]
      - id: cancelled-turn-ended
        when: "자식 turn이 끝나거나 session이 닫힘"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: ["R4", "T4"]
    docs: [architecture/approval.md, architecture/agent-call.md]
    unclear:
      - "질문 대기 자체(QuestionWait, 질문 tool의 입구 route:ask/wait)는 turns 영역이다. 이 flow는 팀 자식일 때 부모로 가는 분기만 본다."

  - id: ask-unattended-returns
    title: 사람이 없는 turn의 ask tool은 기다리지 않고 unattended를 돌려준다
    actor: agent
    uses: [route:ask/wait]
    when: "spawned_by가 없는 session이고 turn이 unattended인 ask tool"
    boundary: [approvals, run-loop]
    code: [packages/core/main/daemon/wiring/approvals.ts, packages/protocol/lophn-agent/ask-tool.ts]
    steps:
      - "ask 입구(`askWaitHandler`)는 먼저 호출한 credential이 입력의 session·turn과 같은지 본다. 다르면 forbidden이다."
      - "session과 turn을 읽는다. 읽지 못하면 그 오류가 그대로 간다."
      - "팀 밖 session의 turn이 unattended면 기다림 없이 바로 돌려준다."
      - "질문은 열리지 않아 카드도 대기 목록도 생기지 않는다. 사람이 없으므로 질문을 보낼 곳이 없다."
      - "agent는 unattended 결과를 받고 스스로 정한다."
      - "attended turn의 ask는 이 흐름이 아니다. 사람이 답하는 질문 대기는 turns 영역이다."
    outcomes:
      - id: unattended
        observe: ["response"]
      - id: other-turn
        code: forbidden
        when: "credential이 다른 session이나 turn에 묶임"
        observe: ["response"]
      - id: lookup-failed
        when: "session이나 turn을 읽지 못함. 읽기의 오류 code가 그대로 간다"
        observe: ["response"]
    crosses_process: true
    risk: []
    refs: ["T4", "W4"]
    docs: [architecture/approval.md]

  - id: extension-tool-judge
    title: shell extension tool 호출을 agent 정의의 extensions와 켜진 catalog로 판정한다
    actor: agent
    uses: [route:extension_tools/call]
    boundary: [approvals, agent-tools]
    code: [packages/core/main/daemon/wiring/extension-tools.ts, packages/core/approvals/gate/judge.ts, packages/core/approvals/approvals.ts, packages/core/main/daemon/wiring/harness-credential.ts]
    steps:
      - "extension tool은 tool 정의에 gate가 없고, `extension_tools/call` 입구가 판정한다. lophn runtime과 harness CLI가 같은 길을 거친다. session과 turn에 묶인 agent 자격이 아니면 forbidden이다."
      - "이름으로 extension과 tool을 가른다. extension 이름 형식이 아니면 not_found다. 그 session을 읽어 agent와 workspace를 얻는데 읽기가 실패하면 그 오류가 그대로 간다."
      - "`judge`가 agent 정의를 읽어(실패하면 그 오류가 그대로 간다) `extensions`에 없으면 not_assigned, 켜진 extension의 catalog에 tool이 없으면(꺼짐, 목록에서 빠짐) removed, 아니면 run이다."
      - "묻지 않는다. 할당이 허락이라 결과를 `<lophn-untrusted>`로 감싸지 않는다."
      - "run이면 shell이 붙어 있을 때 이 호출만 쓰는 agent 자격을 내고(실패하면 그 오류가 간다) shell host queue로 넘겨 shell main의 결과를 기다린다. 붙어 있지 않으면 unavailable이다. 기다리는 동안 shell이 떨어지거나 core가 내려가면 unavailable로 끝난다. 끝나면 그 자격을 거둔다."
    outcomes:
      - id: not-agent-session
        code: forbidden
        when: "agent 자격이 아니거나 session·turn 조건이 없음"
        observe: ["response"]
      - id: not-extension-tool
        code: not_found
        when: "extension tool 이름 형식이 아님"
        observe: ["response"]
      - id: lookup-failed
        when: "session이나 agent 정의를 읽지 못함. 읽기의 오류 code가 그대로 간다"
        observe: ["response"]
      - id: not-assigned
        code: forbidden
        when: "agent 정의의 extensions에 없는 extension"
        observe: ["response"]
      - id: removed
        code: forbidden
        when: "extension이 꺼졌거나 catalog에서 tool이 빠짐"
        observe: ["response"]
      - id: host-not-attached
        code: unavailable
        when: "판정은 run이지만 shell이 host queue에 붙어 있지 않음"
        observe: ["response"]
      - id: credential-failed
        when: "이 호출만 쓰는 agent 자격을 내거나 ledger에 기록하지 못함. 오류 code가 그대로 간다"
        observe: ["response"]
      - id: handed-to-host
        when: "판정이 run이고 shell main이 결과(content)를 돌려줌"
        observe: ["response"]
      - id: host-failed
        when: "shell main의 handler가 오류를 돌려주거나 기다리는 중 shell이 떨어져 unavailable로 끝남"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    refs: ["H3"]
    docs: [architecture/approval.md, architecture/agent-definition.md]

  - id: app-call-assignment-judge
    title: agent나 flow가 앱 command를 부를 때 그 호출자의 할당으로 막는다
    actor: agent
    uses: [route:apps/call_tool]
    boundary: [approvals, app-runtime]
    code: [packages/core/apps/calls/gate.ts, packages/core/apps/calls/service.ts, packages/core/approvals/gate/judge.ts]
    steps:
      - "사람이 부른 호출과 program(job의 tool run)의 호출은 판정하지 않는다. job 등록 승인이 허락이다."
      - "agent 호출자는 그 agent의 지금 할당으로 `judge`(app_tool, attended)를 본다. deny면 막는다. ask가 나와도 묻지 않고 지나간다."
      - "flow 호출자(flow instance)는 그 project PM의 지금 할당으로 `judge`(unattended)를 본다. 공개(public) command가 아니면 PM이 그 앱 workspace에 있을 때만 허락한다."
      - "막히면 그 호출은 denied(gate_blocked, `the call is not granted`)로 기록되고 호출자에게 그대로 간다. app 호출자는 부른 앱의 active grant `app.call`로 보므로 이 flow가 아니다(app-runtime)."
    outcomes:
      - id: passed
        when: "판정을 통과해 실행 쪽으로 넘어감(할당 있음, 사람이나 program 호출, flow의 공개 command나 PM의 앱 workspace)"
        observe: ["response"]
      - id: gate-blocked
        when: "agent의 할당에 없거나 뺀 tool이거나, flow가 비공개 command를 다른 workspace에서 부름"
        observe: ["response"]
    crosses_process: true
    risk: [permission]
    refs: ["H3", "E11", "J4"]
    docs: [architecture/app-call.md, architecture/approval.md]
    unclear:
      - "gate_blocked 호출을 invocation 기록에 어떻게 남기는지는 apps 영역이라 확인하지 않았다."

  - id: assignment-read
    title: 사람이 agent의 앱 할당(apps와 뺀 command)을 읽는다
    actor: person
    entries: [route:agent_assignments/get]
    boundary: [approvals, agents]
    code: [packages/core/approvals/assignment/reads.ts, packages/core/main/daemon/wiring/assignment-file.ts]
    steps:
