      - "고르면 focus 표에 이 창과 그 터미널 generation을 적는다. 이 표가 입력·다시 시작의 자격과 알림의 '보고 있음'이다"
      - "떠나면 표에서 뺀다. 이후 입력 검사가 이 창의 입력을 거절한다"
