id: sdk-missing-from-catalog-guide
title: "sdk package가 catalog에 없어 `package show`가 coding agent에게 SDK guide를 주지 못한다"
kind: bug
status: fixed
topic: platform
modules: [packages/core/apps, packages/coding-agent]
now: |
  core 기동이 `packages/sdk/*`와 지원 소스를 `<dataRoot>/sdk/<이름 뒤쪽>/<판>`에 설치 사본으로 푼다(`apps/packages/install.ts`의 `installSdkCopies`). 사본에는 `guide.md`가 들어 있지만 package catalog에는 등록하지 않는다(`register_version`·guide blob 준비를 되살리지 않았다). 그런데 coding agent skill `packages/coding-agent/guides/skills/lophn-build-app/SKILL.md`는 새 code를 쓰기 전에 `package list`, `package show`로 의존 package의 API와 예제를 읽으라고 하고, `@lophn/app-ui`의 guide도 `package show`로 읽으라고 한다. 등록이 없어 둘 다 빈 결과다.
impact: |
  coding agent가 앱을 만들 때 SDK(`@lophn/app-ui`, `@lophn/blueprint`, `cap-*`)의 API와 예제를 읽지 못하고 짐작으로 쓴다. 사람은 틀린 import·호출로 build와 release 준비가 실패하는 앱을 받는다.
fix: |
  - 기동 설치가 사본을 푼 뒤 같은 byte로 `register_version`을 낸다(중간). `apps/packages/commands.ts`는 같은 name·version의 bundle hash가 다르면 `conflict`("published version bytes are immutable")로 거절하므로, 개발 중 `packages/sdk/*` 소스를 고치고 다시 띄우면 기동이 막힌다. 내장 sdk만 같은 판 덮어쓰기를 허락하거나 판에 소스 hash를 붙여야 한다.
  - skill이 `package show` 대신 설치 사본의 `guide.md`(`<dataRoot>/sdk/<이름 뒤쪽>/<판>/guide.md`)를 읽게 한다(작음). agent가 data root 안 사본을 읽을 수 있어야 한다.
  - 추천: 둘째. catalog는 사용자 package(@me) 몫으로 두고, 내장 sdk는 설치 사본이 정본이다.
closed: |
  둘째 안으로 고쳤다. `packages/coding-agent/guides/skills/lophn-build-app/SKILL.md`가 내장 SDK는 앱 `.lophn/import-map.json`이 가리키는 설치 사본 폴더의 `guide.md`를 읽게 하고, `package list`·`package show`는 사용자 package 몫으로 둔다. 설치 사본에는 각 sdk의 `guide.md`가 `mod.ts`와 같은 폴더에 들어 있다(`installSdkCopies`가 폴더째 복사한다).
guard: 없음
