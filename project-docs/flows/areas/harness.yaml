      - "탭을 표에서 빼고 tab_close 요청을 그 탭의 workspace로 넣는다. browser 탭의 닫기는 workspace를 가리지 않고 아무 shell이 가져가고, shell main이 그 page를 가진 창(bind 전이면 열기를 보낸 창)에 보낸다"
      - "화면에서 닫는 것은 shell main이 /host-link로 받아 한다. 터미널 탭을 닫으면 PTY도 닫힌다"
    outcomes:
      - id: accepted
        observe: [response]
      - id: not_found
        code: not_found
        when: "탭이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "주인이 다른 탭이거나, agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: false
    docs: [architecture/terminal-agent.md, architecture/workspace-layout.md]

  - id: host-tab-show
    title: agent나 사람 token이 자기가 연 접힌 탭을 사람에게 편다
    actor: agent
    entries: [route:tabs/show]
    pre: [host-tab-open:accepted]
    boundary: [host-queue-interface, host-queue-core]
    code:
      - packages/core/host-queue/queue.ts
      - packages/core/main/daemon/wiring/host-queue.ts
    steps:
      - "agent 자격의 session이나 사람 token이 부른다. 사람 token의 주인은 모두 person이다"
      - "탭이 없으면 not_found. 주인이 다른 탭이면 forbidden"
      - "탭은 표에 그대로 두고 tab_show 요청을 그 탭의 workspace로 넣는다. 접힌 float을 그 자리에서 펴는 것은 shell main이 /host-link로 받아 하고, float이 아니거나 이미 펴져 있으면 할 일이 없다"
    outcomes:
      - id: accepted
        observe: [response]
      - id: not_found
        code: not_found
        when: "탭이 없다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "주인이 다른 탭이거나, agent 자격도 사람 token도 아니거나 agent 자격에 session이 없다(부르는 쪽 검사)"
        observe: [response]
    crosses_process: false
    docs: [architecture/browser-tab.md]

  - id: host-browser-read
    title: agent나 사람 token이 자기가 연 browser 탭의 url, title, loading을 읽는다
    actor: agent
    entries: [route:browser/read]
    pre: [host-link:tab-state]
    boundary: [host-queue-interface, host-queue-core]
    code:
