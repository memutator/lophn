id: ask-wait-fails-after-five-minutes
title: lophn-agent turn에서 사람에게 한 질문(ask)이 5분쯤 답이 없으면 "tool is unavailable"로 실패해 turn이 끝난다
kind: bug
status: open
topic: approval
modules: [packages/core/main, packages/core/lophn-agent]
now: |
  `ask`는 core가 기다림을 쥐고 agent runtime이 긴 호출 하나로 결과를 받는다(`packages/core/main/agent-runtime/product-driver.ts`의 `questions.ask` → `askWait` route). 그 호출은 `packages/core/main/agent-runtime/core-http.ts`의 `post`(`agentCall`)가 전역 `fetch`로 보내고, timeout 옵션이 없다. fetch가 던지면 어떤 예외든 `unavailable`("core is not reachable")이 된다. `packages/core/lophn-agent/tools/work.ts`가 `unavailable`을 model에 보이는 고정 문장 "tool is unavailable"(`FAILURE_SUMMARIES`)로 바꾼다.
  재현(보았다, 2026-11-21): 앱 session이 `/update-apps`로 시작했고 사람이 다른 탭에 있었다. `ask`에 5분쯤 답이 없자 model이 "tool is unavailable"을 받았고, 다시 물었지만 같은 실패여서 turn이 끝났다.
  원인은 확인하지 않았다(추정). Node의 fetch는 기본 headers timeout이 300초라 응답 header가 5분 안에 오지 않으면 던진다. 위 증상의 시각과 맞는다. 같은 `post`가 `toolGateCheck`(Gate 승인 기다림)도 나르므로 승인 카드에 5분 넘게 답이 없을 때도 같게 실패할 수 있다. 둘 다 `HUMAN_WAIT_ROUTES`(`lophn-agent/run-loop/runtime-access.ts`)다.
  `architecture/approval.md`는 "timeout은 두지 않는다. attended에서는 대기 목록에 남고…"라고 정한다. 지금 동작은 그 설계와 다르다.
impact: 사람이 자리를 비우거나 다른 탭에 있는 동안 agent가 물은 질문(앱 update, 승인)은 5분이면 실패로 끝난다. agent는 이유를 모르고(고정 문장 하나) 다시 물어도 같게 실패해 turn이 끝나고, 사람은 돌아와서 대기 목록에 남았어야 할 질문 대신 끝난 turn을 본다. data를 잃지는 않지만 `/update-apps`처럼 사람의 답을 받으며 긴 일을 하는 turn이 거기서 끊긴다.
fix: |
  먼저 원인을 확인한다(`ask`를 5분 넘게 두고 core-http의 던진 예외를 log로 본다). 확인되면 안은 둘이다.
  - 작음, 추천: 사람 결정을 기다리는 route(`HUMAN_WAIT_ROUTES`)의 호출만 headers timeout 없이 보낸다(그 호출의 dispatcher 또는 `fetch` 옵션). 나머지 호출의 timeout은 그대로 둔다. 기다림이 진짜 끊긴 것(core 종료)은 연결이 끊겨 그대로 `unavailable`이다.
  - 중간: 기다림을 긴 호출 하나가 아니라 짧은 호출의 반복(long poll)으로 바꾼다. 연결 하나가 5분을 넘기지 않지만 route와 core 쪽 기다림 모양이 바뀐다.
  고치면 이 이슈의 재현을 사람이 확인하고, 두 번 이상 고친 bug가 되지 않게 timeout 경계를 보는 test 하나를 둔다.
