  # ---- tool 호출 기록과 실행 ----
  - id: tool-call-batch
    title: model 응답의 tool 호출 묶음을 순서와 병렬 규칙으로 실행하고 결과를 모은다
    actor: agent
    entries: [system:tool-batch]
    uses: [tool-call-request:requested, tool-call-enter:decided, tool-call-enter:started, tool-call-finish:finished]
    boundary: [agent-tool-spi, run-loop]
    code: [packages/core/lophn-agent/run-loop/tool-batch.ts, packages/core/lophn-agent/run-loop/retry.ts, packages/core/lophn-agent/run-loop/core-ports.ts]
    steps:
      - "model 응답의 tool 호출을 요청 순서대로 풀고 lophn 명령이면 그 명령의 호출로 풀어 실행 대상을 정한다. 모든 호출이 read이면 병렬로, 아니면 하나씩 한다. 결과는 언제나 요청 순서다"
      - "시작 직전마다 멈춤, 한도, provider 회수, 새 입력을 다시 본다. 막히면 not_executed로 닫는다. 없는 tool이나 JSON 객체가 아닌 인자는 실행하지 않고 failure로 닫는다(기록 행 없음)"
      - "요청 행을 쓰고 결정과 시작을 남긴 뒤 handler를 돌린다. 요청 행 쓰기가 실패해도 호출은 기록 없이 실행된다. 결정이나 시작 기록이 실패하면 handler를 돌리지 않고 불명확으로 닫는다"
      - "read tool이 일시 실패(unavailable, internal, uncertain)면 1초(±10%) 뒤 한 번 다시 부른다. write와 external은 다시 부르지 않는다"
      - "write나 external이 실패하거나 불명확이면 뒤 호출은 earlier_call_failed로 미실행 처리한다"
      - "중단 뒤 grace 안에 답이 없으면 abort_unconfirmed로 불명확 처리하고 늦은 결과는 기록을 나중에 보완한다"
      - "handler가 던지거나 결과를 저장하지 못하면 finish를 uncertain으로 쓰고 닫는다"
    outcomes:
      - id: success
        observe: [ledger:tool_calls, event:ToolCallStarted, event:ToolCallFinished, event:ToolCallEnded, response]
        when: tool이 성공했다
      - id: failure
        observe: [ledger:tool_calls, event:ToolCallFinished, event:ToolCallEnded, response]
        when: tool이 실패로 끝났다(인자 오류가 아닌 handler 실패)
      - id: not-found
        observe: [response]
        when: tool 이름이 없다. 행을 남기지 않고 model에 failure를 준다
      - id: invalid-input
        observe: [response]
        when: 인자가 JSON 객체가 아니다. 행을 남기지 않고 failure를 준다
      - id: not-executed
        observe: [response]
        when: 시작 전에 멈춤, 새 입력, 한도, 회수, 앞 호출 실패로 막혔다
      - id: uncertain
        observe: [ledger:tool_calls, event:ToolCallEnded, response]
        when: "중단 뒤 답이 없었거나, handler가 던졌거나, 결과를 저장하지 못했거나 결과 기록을 남기지 못해 불명확으로 닫았다, 결정이나 시작 기록이 실패해 handler를 돌리지 않고 닫았다"
      - id: unrecorded-run
        observe: [event:ToolCallStarted, response]
        when: "요청 행을 쓰지 못했다. 호출은 기록 없이 그대로 실행되고 결정·시작·끝 기록도 남지 않는다"
      - id: retried
        observe: [ledger:tool_calls, response]
        when: 읽기 tool의 일시 실패 뒤 한 번 다시 불렀다(attempt 1, retry_of 연결)
    crosses_process: true
    risk: []
    refs: [H3]
    docs: [architecture/approval.md, architecture/agent-chat.md]
    unclear:
      - "tool 실행 결과가 파일 쓰기처럼 되돌릴 수 없는 일이면 그 안전은 agent-tools와 approvals 쪽 flow가 맡는다. 이 flow는 순서와 재시도만 맡는다"

