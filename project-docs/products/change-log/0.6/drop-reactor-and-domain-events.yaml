id: drop-reactor-and-domain-events
version: 0.6.0
title: "Reactor와 domain event를 지우고, release 준비가 떨어진 이유가 고칠 곳을 가리킨다"
modules: [packages/core/events, packages/core/storage, packages/core/router, packages/core/main, packages/core/lophn-agent, packages/core/apps, packages/core/server, packages/core/supervision, packages/protocol, packages/shell/renderer, packages/shell/main, packages/design, tools]
checked: [tool-check, architecture-layers, architecture-approval, architecture-activation, architecture-app-call, architecture-agent-definition, architecture-browser-tab, architecture-artifact, architecture-workspace-layout, architecture-ui-kit, architecture-appearance, tool-context-review, tool-worktree-prep, tool-test-live, tool-check-deps, tool-dev, tool-models-snapshot, skill-ui-design]
change: |
  전:
  - commit 뒤 domain event를 Bus로 내는 publisher와 Reactor(cursor `subscriber_cursors`와 `AdvanceSubscriberCursor`, 멱등 key, 5초 poll과 backoff)가 있었다. `DOMAIN_EVENTS`에는 정의만 있는 `CodingSessionEnded` 하나가 남아 있었고, 부르는 곳 없는 `SendReactionCall`(`calls/react`)과 Diagnostics의 `events` 점검(Event stream)이 있었다.
  - program이 보낸 입력의 보낸 쪽은 `{kind: "program", event_seq}`였고(늘 `"0"`), `<lophn-reaction>` tag에 `seq` 속성이 있었다. session에 늘 null인 `opening_context`(`opening_source_seq`, `opening_target`)가 있었다. 대화의 보낸 쪽 chip에 실제 data가 만들지 않는 `reaction` 갈래가 있었다.
  - test runner를 지운 뒤 runtime mode `"test"`, data job kind `test`, identity의 `test_runner_only`·`test_runner`, `applyMemoryLimit`, core env `DBUS_SESSION_BUS_ADDRESS`, team 등록의 `workers`와 wiring의 `Built.workers`가 남아 있었다.
  - `release.prepare`가 떨어지면 reason이 일반 글이었다. migration은 "a step failed and was rolled back …", build는 code(`blueprint_eval_failed` 등)만, handlers는 "handler or schema mismatch"만 실었다.
  후:
  - Reactor, cursor, 멱등 key, commit publisher, domain event의 type과 schema(`packages/protocol/events/domain.ts`), route `calls/react`와 `events/advance-cursor`, `Tx.advanceSubscriberCursor`, `CommandSuccess.wake`가 없다. Bus는 agent event와 남지 않는 event만 싣는다. `events` 표와 `tx.emit`(기록 event)은 남는다. command의 compare는 객체인지만 executor가 보고 기준은 handler가 본다. Diagnostics 구성 요소에 `events`가 없다.
  - program 입력의 보낸 쪽은 `{kind: "program"}`이고 받은 메시지 기록의 `from_ref`는 null이다. 태그 글은 `from="program"`, `<lophn-reaction event="…">`다. 입력 종류 `reaction`과 받은 메시지의 `event` 칸은 남는다(남은 쓰임은 coding session 끝 알림). session 읽기와 `openAgentSession`·`openSession` 입력에 `opening_context`가 없다. 대화의 보낸 쪽 chip은 agent, coding, program 셋이다.
  - lophn runtime mode는 `"live" | "preview"`다. SDK host(`cap-store`, `cap-net`, `cap-secret`)와 `cap-tool` context는 앱 자신의 test를 위해 `"test"`를 그대로 받는다. data job kind는 `inspect`, `backup`, `migrate`, `restore`다. 위의 죽은 갈래가 모두 없다.
  - `release.prepare`의 reason이 고칠 곳을 가리킨다. migration은 실패한 단계(`from-to`)와 SQLite 오류 글(한 줄 300자), build는 blueprint 평가·화면 build·의존 받기가 실패하면 deno stderr의 앞 5줄 500자(색 escape와 staging 경로를 지움), handlers는 handler 없는 tool과 선언 없는 tool(각 5개와 "and N more"), data schema 차이를 싣는다. 결과의 모양(`{status: "failed", stage, reason}`)은 그대로다.
  - schema step을 그 자리에서 고쳤다(ledger `common-tables`의 `subscriber_cursors`, `lophn-agent.sessions.tables`, `apps.invocations.tables`). 옛 data root(main checkout의 `.dev-data` 포함)는 `history_mismatch`로 뜨지 않으니 지우고 새로 만든다.
  닫은 이슈: activation "release 준비가 떨어진 이유가 고칠 곳을 가리키지 않는다"(고침), code-health "test runner를 지운 뒤 test 자식의 갈래가 남았다"(고침), platform "events 점검이 Reactor backoff를 보지 못한다"(고침. 점검과 Reactor가 없어졌다).
why: |
  반응할 domain event가 없어졌다. 뒤에 꼭 움직여야 하는 일은 그 일을 아는 command가 같은 tx에서 하고(맡긴 coding session의 끝), 꺼진 사이의 것은 owner의 켤 때 복구(Router `RecoverCalls`)가 닫는다. release 준비가 떨어진 이유가 일반 글이면 App Engineer는 어디를 고칠지 모른 채 다시 짓는다.
decisions:
  - by: agent
    text: |-
      남은 domain event와 Reactor, Diagnostics의 `events` 점검을 지우고 대신할 것을 두지 않는다. ledger 읽기는 `ledger` 점검이 본다.
  - by: agent
    text: |-
      입력 종류 `reaction`, `<lophn-reaction>` tag, `messages.event`는 남기고 `seq`만 지운다. 이름은 coding agent 연결의 크기를 정할 때 같이 본다(`project-docs/products/roadmap/problem-ticket.md` "정할 것" 1).
  - by: agent
    text: |-
      session을 여는 길은 사람과 Router 둘이다. 값을 넣는 곳이 없던 session의 `opening_context`를 지운다.
  - by: agent
    text: |-
      lophn runtime mode에서 `"test"`를 지우고 SDK host의 `"test"`는 남긴다. 앱이 자기 test에서 임시 DB를 여는 공개 입력이다.
  - by: agent
    text: |-
      release 준비 reason에 덧붙이는 글은 오류 한 줄 300자, deno stderr 앞 5줄 500자, tool 이름 5개로 자른다. build는 blueprint 평가에 더해 화면 build와 의존 받기도 같은 꼴로 붙인다.
  - by: agent
    text: |-
      되돌린 migration의 결과는 type으로 실패한 단계를 늘 싣고(`restored: true`면 `failed`가 있다), 준비 검사는 `restored`만 보고 떨어뜨린다.
  - by: agent
    text: |-
      activation의 `migration_failed` summary는 이번에 바꾸지 않는다. data job protocol과 activation port를 같이 바꿔야 한다.
follow_up: |
  - activation "activation의 migration 실패 이유가 실패한 단계와 SQLite 오류 글을 싣지 않는다".
  - code-health "API server의 worker route 통로가 남았다".
  - check 밖(사람이 다시 쓴다): `tests/eval/registry/instruction/*.json`의 `<lophn-reaction>` 설명, `tests/support/app/patch-restart.ts`·`patch-net.ts`·`sample/src/items.ts.tmpl`의 mode `"test"` 주석.
