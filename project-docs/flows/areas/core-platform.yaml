  - id: remote-listener
    title: "설정 remote.enabled를 따라 폰이 붙는 listener와 relay 연결을 열고 닫는다"
    actor: system
    entries: [system:remote-listener]
    boundary: [core, server]
    code: [packages/core/main/daemon/wiring/remote.ts, packages/core/remote/listener.ts, packages/core/remote/relay-client.ts, packages/core/remote/host-key.ts, packages/core/main/daemon/wiring/idle.ts]
    docs: [architecture/platform.md]
    steps:
      - "기동 때와 StateChanged(settings)의 id가 remote.enabled·remote.port·remote.relay(또는 null)일 때 remote wiring이 listener와 relay 연결을 맞춘다. 맞추기는 하나씩 돈다"
      - "켜져 있으면 `<root>/remote/host-key.json`(0600)을 읽거나 없으면 만들고, 모든 interface의 remote.port에 WebSocket listener(path /remote)를 연다"
      - "켜져 있고 remote.relay가 비어 있지 않으면 relay의 /v1/host?key=<core key>에 control socket을 건다. challenge에 core static key로 만든 proof로 답하고 ready를 받으면 connected다. listener를 열지 못해도 relay는 따로 돈다"
      - "relay가 connected {conn}을 알리면 /v1/data?conn=<conn>에 data socket을 열어 listener의 연결과 같이 remote-connection에 넘긴다"
      - "control socket이 끊기면 1초에서 두 배씩 30초까지 기다렸다 다시 건다. control socket은 20초마다 ping하고 60초 동안 아무것도 오지 않으면 끊는다"
      - "꺼지면 붙은 연결에 closed(shutdown)을 보내고 listener와 relay 연결을 닫는다. port나 relay가 바뀌면 그것만 다시 연다. 꺼져 있으면 loopback 밖 listener와 relay 연결이 없다"
      - "켜져 있는 동안 idle-exit는 일이 있는 것으로 센다"
    outcomes:
      - id: listening
        observe: ["process:remote.port에서 듣는다", "disk:<root>/remote/host-key.json"]
      - id: closed
        when: "remote.enabled가 꺼졌거나 port가 바뀌어 다시 연다"
        observe: ["process:listener 없음"]
      - id: relay-connected
        when: "remote.relay가 있고 relay가 core key 증명을 받았다. 폰 연결마다 data socket을 연다"
        observe: ["response"]
      - id: relay-retry
        when: "relay에 닿지 못했거나 control socket이 끊겼다. remote_relay/status가 connecting이다"
        observe: ["response"]
      - id: open-failed
        when: "host key file을 못 읽거나 port를 열지 못했다. core는 그대로 돈다"
        observe: ["log:remote listener_failed"]
    crosses_process: false
    risk: [permission]

  - id: remote-connection
    title: "폰 연결 하나를 handshake하고, 등록된 기기면 그 자격으로 route와 event를 잇는다"
    actor: system
    entries: [system:remote-connection, route:devices/connected]
    uses: [route:devices/list]
    boundary: [core, server, event-stream]
    code: [packages/core/remote/host.ts, packages/core/remote/call.ts, packages/core/server/identity/registry.ts, packages/core/main/daemon/wiring/remote.ts]
    docs: [architecture/approval.md, architecture/event.md]
    steps:
      - "기기로 붙지 않은 연결(handshake 중과 pairing 전)이 이미 8개면 새 socket을 받자마자 닫는다"
      - "연결마다 Noise IK responder handshake와 hello를 한다. 10초 안에 끝나지 않으면 닫는다. 기기로 붙기 전에는 frame이 4 KiB까지다"
      - "받은 공개 key(base64url)를 devices/list로 찾는다. 없으면 pair 말고 어떤 frame이 와도 연결을 닫고, 60초 안에 pairing하지 못해도 닫는다(remote-pair). 있으면 frame 상한을 16 MiB로 올린다"
      - "등록된 기기면 actor user, principal device:<id>, scope가 REMOTE_ALLOWED_ROUTES인 자격을 core 한 번에 하나 발급해 ledger에 기록한다. 발급 뒤 key를 다시 찾아 그 사이 끊긴 기기면 자격을 거두고 닫는다. devices/connected로 마지막 연결 시각을 적는다. event 연결 한도는 principal마다다"
      - "call은 자격을 다시 보고 scope로 거른 뒤 HTTP와 같은 dispatchHttp를 탄다. 입장 한도는 remote만의 것이고 principal마다 선다"
      - "frame은 JSON뿐이라 bytes는 base64로 싣는다. upload route는 body {input, base64}를 HTTP upload 요청으로 바꾸고(한도는 route의 max_bytes), file route의 답은 {content_type, base64}다. file은 8 MiB까지다"
      - "watch는 Gateway session과 같은 Bus 구독이되 REMOTE_ALLOWED_EVENTS의 type만 보낸다(조건에 types가 없어도). 느린 연결은 Gateway와 같은 한도로 closed(slow_consumer)를 받고 닫힌다"
    outcomes:
      - id: handshake-timeout
        when: "handshake나 hello가 10초 안에 끝나지 않았다"
        observe: ["process:연결 닫힘"]
      - id: unattached-full
        when: "기기로 붙지 않은 연결이 이미 8개다"
        observe: ["process:연결 닫힘"]
      - id: pairing-timeout
        when: "등록되지 않은 key가 60초 안에 pairing하지 못했다"
        observe: ["process:연결 닫힘"]
      - id: frame-too-large
        when: "기기로 붙기 전 4 KiB보다 큰 frame이 왔다"
        observe: ["process:연결 닫힘"]
      - id: revoked-while-attaching
        when: "key를 찾은 뒤 자격을 받기 전에 기기가 끊겼다"
        observe: ["process:연결 닫힘"]
      - id: unpaired-refused
        when: "등록되지 않은 key의 연결이 pair 아닌 frame(call, watch)을 보냈다"
        observe: ["response"]
      - id: call-ok
        observe: ["response"]
      - id: call-forbidden
        code: forbidden
        when: "route가 REMOTE_ALLOWED_ROUTES 밖이다(사람 token이 부를 수 있는 route여도)"
        observe: ["response"]
      - id: call-unauthorized
        code: unauthorized
        when: "기기를 끊어 자격이 거둬졌다"
        observe: ["response"]
      - id: call-not-found
        code: not_found
        when: "없는 route다"
        observe: ["response"]
      - id: call-bytes
        when: "file route는 {content_type, base64}로 답하고, upload route는 body의 base64를 bytes로 handler에 넘긴다"
        observe: ["response"]
      - id: upload-body-invalid
        code: invalid_input
        when: "upload route의 body에 문자열 base64가 없다"
        observe: ["response"]
      - id: file-too-large
        code: invalid_input
        when: "file route가 내줄 file이 8 MiB를 넘는다"
        observe: ["response"]
      - id: watch-ready
        observe: ["response", "event:StateChanged"]
      - id: slow-consumer
        when: "보내지 못한 byte가 Gateway 한도를 넘었다"
        observe: ["response"]
      - id: connected-missing
        code: not_found
        when: "devices/connected 사이 기기가 지워졌다. 연결은 막지 않는다"
        observe: ["log:remote connected_not_saved"]
    crosses_process: false
    risk: [permission]
    declared_only: [unavailable]
    unclear:
      - "devices/connected의 unavailable(writer)은 log로만 남고 연결을 막지 않는다. 부르는 쪽에 돌아가지 않는다"

  - id: remote-pair
    title: "폰이 QR의 code로 pair해 기기로 등록된다"
    actor: system
    entries: [route:devices/register]
    pre: [route:pairing/start]
    boundary: [core, server]
    code: [packages/core/remote/host.ts, packages/core/remote/pairing.ts, packages/core/remote/devices.ts, packages/core/main/daemon/wiring/remote.ts]
    docs: [architecture/approval.md]
    steps:
      - "등록되지 않은 key의 연결이 pair {code, name, os, width, height, dpr}를 보낸다"
      - "code가 지금 code와 같고 300초 안이면 쓴다(한 번만). 틀리면 unauthorized result이고 연결마다 5번째 틀리면 연결을 닫는다"
      - "core 안 machine 자격이 devices/register로 기기를 등록한다. 새 기기가 기준이 되고 다른 기기의 기준은 내린다"
      - "설정 shell.devices에 device(기기 id)를 단 항목을 더한다. 이름이 다른 항목과 겹치면 \" 2\", \" 3\"을 붙인다. device가 없는 항목(사람이 넣은 것)은 건드리지 않는다"
      - "그 연결을 바로 기기로 붙이고 같은 id의 result {device}로 답한다"
    outcomes:
      - id: paired
        observe: ["ledger:devices", "disk:<root>/settings.json", "response"]
      - id: wrong-code
        code: unauthorized
        when: "code가 틀렸거나 300초가 지났거나 이미 썼거나 새 pairing/start가 대신했다"
        observe: ["response"]
      - id: too-many-tries
        when: "한 연결에서 5번 틀렸다"
        observe: ["response"]
      - id: conflict
        code: conflict
        when: "같은 공개 key가 이미 등록돼 있다"
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "ledger writer를 쓸 수 없다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]
    declared_only: [forbidden]
    unclear:
      - "devices/register의 forbidden(machine 아닌 actor)은 core 안 machine 자격만 부르므로 나지 않는다"

  - id: remote-pairing-start
    title: "사람이 QR에 실을 pairing code와 주소를 받는다"
    actor: person
    entries: [route:pairing/start]
    boundary: [core-api, server]
    code: [packages/core/main/daemon/wiring/remote.ts, packages/core/remote/pairing.ts]
    steps:
      - "새 1회용 code(128-bit, 300초, 메모리에만)를 만들고 앞 code를 무효로 한다"
      - "loopback과 link-local이 아닌 interface 주소, remote.port, core 공개 key(base64url), code, 끝 시각을 돌려준다. relay 연결을 걸었으면 relay 주소(설정 remote.relay)도 싣는다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: unavailable
        code: unavailable
        when: "remote listener도 relay 연결도 없다(remote.enabled가 꺼졌거나 host key를 못 읽었거나, listener를 열지 못했고 relay 설정이 없다)"
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user 아닌 actor다. 기기 자격도 route 목록 밖이라 forbidden이다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: remote-relay-status
    title: "사람이 relay 연결 상태를 본다"
    actor: person
    entries: [route:remote_relay/status]
    boundary: [core-api, server]
    code: [packages/core/main/daemon/wiring/remote.ts]
    steps:
      - "설정 remote.relay의 주소(비었으면 null)와 relay control socket 상태를 돌려준다. remote가 꺼졌거나 relay 설정이 없으면 off, 증명을 받기 전이나 다시 거는 중이면 connecting, ready를 받았으면 connected다"
    outcomes:
      - id: ok
        observe: ["response"]
      - id: forbidden
        code: forbidden
        when: "user 아닌 actor다. 기기 자격도 route 목록 밖이라 forbidden이다"
        observe: ["response"]
    crosses_process: false
    risk: [permission]

  - id: remote-ui-manifest
    title: "폰이 remote 화면 bundle의 file 목록과 hash를 읽는다"
    actor: person
    entries: [route:remote_ui/manifest]
    boundary: [core-api, server]
    code: [packages/core/remote/ui-bundle.ts, packages/core/main/daemon/wiring/remote.ts]
    steps:
