id: hook-uninstall-and-status-batch
version: 0.9.0
title: 'Settings › Coding agents에서 hook을 지울 수 있고, hook 상태를 process 하나로 읽으며, Settings sidebar가 project 창 sidebar와 같은 꼴이다'
modules: [packages/protocol, packages/coding-agent, packages/shell/main, packages/shell/ipc, packages/shell/preload, packages/shell/renderer, packages/design]
checked: []
change: |
  전:
  - Settings › Coding agents의 hook 칸에는 [Install hooks]만 있었다. 놓인 hook을 지우는 길이 없었다.
  - hook 상태는 shell main이 harness마다 `lophn harness install --dry_run` process를 띄워 읽었다(25개). 화면이 열릴 때와 창이 focus를 다시 받을 때마다 CPU 약 10초가 들었고, hook 칸이 늦게 찼다.
  - 검색 칸이 표 테두리에 붙어 있었다.
  - Settings sidebar는 묶음 제목 아래 항목을 줄지은 따로 만든 목록이었고, 위쪽 바에 접기 단추가 있었다.
  후:
  - 놓인 제품에 [Uninstall hooks]가 있다. CLI `lophn harness uninstall`(입력 `{harness}`, 출력 `{hook: removed|unchanged|not_supported|failed, files}`)이 우리 항목만 지운다. 규칙은 `architecture/coding-agent.md`다. IPC op `uninstall_hooks`, `CodingApi.uninstallHooks`가 생겼다.
  - CLI `lophn harness status`(입력 `{command?}`, 출력 harness마다 `{harness, skill, hook, files}`)가 모든 harness의 dry_run을 한 process에서 돈다. shell main의 hook 상태는 이 호출 한 번이다(약 0.25초).
  - 검색 칸과 표 사이, 표와 아래 안내 사이를 띄웠다.
  - Settings sidebar는 project 창 sidebar의 panel 꼴(`project-sidebar.module.css`)이다. 묶음(General, Agents, System)마다 제목과 항목 줄을 모두 놓는다. 위쪽 바의 단추로 접으면 항목 아이콘만 project 창의 `ActivityBar` 꼴로 남는다.
why: |
  사람이 hook을 지우는 길을 요청했다. 화면에 들어갈 때 느린 원인은 harness마다 띄우던 process였다. sidebar는 사람이 shell sidebar 꼴로 바꾸되 묶음을 아이콘으로 나누지 말고 모두 줄지어 놓으라고 했다.
decisions:
  - text: |
      지우기는 놓을 때처럼 묻지 않는다. 누른 것이 허락이고 다시 놓을 수 있다.
    by: agent
  - text: |
      Codex에서 우리 group을 지우면 뒤 group의 trust 기록 key를 당겨진 위치로 옮긴다. 버린 길: 우리 기록만 지우기(다른 도구의 hook을 Codex가 조용히 건너뛴다).
    by: agent
  - text: |
      Settings sidebar는 묶음을 activity bar 아이콘으로 나누지 않고 panel에 모두 줄지어 놓는다.
    by: person
