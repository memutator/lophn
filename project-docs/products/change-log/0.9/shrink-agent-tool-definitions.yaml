id: shrink-agent-tool-definitions
version: 0.9.0
title: 'agent tool 정의의 반복과 home의 실행 불가능한 kind tool을 줄인다'
modules: [packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/jobs, packages/core/workflows, packages/core/apps]
checked: [architecture-agent-definition]
change: |
  - home은 작업 domain이 없어 항상 실패하던 `kind.list`·`kind.check`를 받지 않는다. project·app의 kind 조회·검사는 그대로다.
  - `kind.list`는 model에 조건 한 층과 중첩 모양을 보여주고 실행 때 기존 전체 schema로 검사한다. all/any/not, 3층 제한, 조건 수 제한, 정렬·집계·page 기능은 유지한다.
  - 생성한 tool schema의 `$schema` 표시와 job·workflow·call·ask·skill·app log 설명의 반복을 줄인다. 명시한 앱·MCP input schema는 그대로 보낸다. 입력 검증·권한·Gate·실행 효과·재시도 규칙은 바꾸지 않는다.
  - 같은 tokenizer의 정의 비교치: deferral 없는 home 11,275 → 7,275, project 10,826 → 7,791, app 12,670 → 9,410 token. 기존 Anthropic deferral을 쓰는 project는 7,633 → 5,168 token이다. lazy loading 공통화는 후속 작업이다.
why: |
  설명문을 줄이는 것만으로는 중첩 조건 schema의 반복과 실행할 수 없는 tool 노출이 남는다. 기능과 실행 검증을 유지하면서 model이 읽는 정의를 줄였다. 수치는 API 청구량이나 실제 model 성공률의 실측이 아니다.
