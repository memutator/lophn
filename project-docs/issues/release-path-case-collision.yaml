id: release-path-case-collision
title: release 안 두 file의 path가 대소문자나 Unicode 정규화만 달라도 macOS·Windows의 받는 컴퓨터에서 서로를 덮는다
kind: bug
status: open
topic: folder-sync
modules: [packages/core/folder, packages/protocol, packages/protocol/folder]
now: |
  `computers` 폴더의 받는 자리(`packages/core/folder/replica.ts`)는 서명한 목록 사슬이 싣는 path를 글자 그대로 file 이름으로 쓴다. path 검사(`isSafeRelativePath`, `packages/protocol/folder/layout.ts`)와 manifest·`release.json` 검증(`packages/protocol/remote/carry.ts`)은 대소문자를 접거나 정규화한 path가 겹치는지 보지 않는다(grep으로 확인: `toLowerCase`·`normalize`가 이 길에 없다). Linux에서 만든 release 안에 `A.js`와 `a.js`(또는 NFC와 NFD로 쓴 같은 이름)가 둘 다 있으면 macOS·Windows의 받는 컴퓨터에서는 둘이 한 file이다. 두 번째로 쓴 file이 첫째를 덮고, 받는 자리는 덮인 path가 목록의 크기·sha256과 다르니 다시 바라 서로를 덮으며 받기를 되풀이한다. 사람의 폴더 거울은 이미 이 되풀이를 8번에서 끊는다(`mirror.ts`).
impact: |
  그런 release(와 source)를 낸 컴퓨터의 사람은 문제가 없지만, macOS·Windows 컴퓨터는 그 release를 완전히 받지 못해 take-in과 따라가기가 `release_incomplete`로 멈추고 같은 file을 계속 다시 받는다. 데이터를 잃지는 않지만 그 앱은 그 컴퓨터에 들어오지 못한다. node_modules에 이름만 대소문자가 다른 file이 있는 package가 드물게 있다.
fix: |
  - 작음(추천): release를 내는 쪽의 `release.json`과 목록을 쓸 때, 같은 폴더 안에서 대소문자를 접거나 NFC로 정규화한 path가 겹치는 file이 있으면 그 release를 `computers`에 내지 않고 stream 오류로 보인다. 받는 쪽도 같은 검사로 그런 목록을 거절한다.
  - 중간: 받는 자리가 OS를 보고 겹침이 있을 때만 거절한다. 어느 컴퓨터는 받고 어느 컴퓨터는 못 받아 사람이 이유를 알기 어렵다.
