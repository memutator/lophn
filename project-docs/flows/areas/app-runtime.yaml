area: app-runtime

flows:

  # ---------- 앱 등록과 정보 ----------

  - id: app-create
    title: "새 앱을 등록하고 source 폴더를 깐다"
    actor: person
    entries: [route:apps/create]
    uses: [route:apps/connect_source]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/registration/source-folder.ts]
    steps:
      - "사람(agent는 whole scope 요청만)이 slug, 이름, 설명으로 등록을 청한다. 미리 정한 id는 사람만 쓴다."
      - "내장 명령 이름(RESERVED_APP_SLUGS), slug 중복, id 중복을 거른다."
      - "같은 transaction에서 AppCreated event와 apps 행을 쓴다(source_path null, run_enabled false, status active)."
      - "commit 뒤 source-folder writer가 apps/<id>/source에 template을 깔고 commit한 뒤, machine 자격으로 connect_source를 부른다."
      - "깔기나 잇기가 실패해도 create는 ok다. 앱은 source_path null로 남고 core log에 source_folder_unprepared가 남는다."
    outcomes:
      - id: linked
        observe: ["ledger:apps", "event:AppCreated", "disk:apps/<app>/source"]
      - id: unlinked
        when: "source 깔기나 잇기가 실패함(create는 이미 commit됨)"
        observe: ["ledger:apps", "event:AppCreated", "log:core"]
      - id: forbidden
        code: forbidden
        when: "사람도 agent도 아님, agent가 앱 범위 조건을 가짐, 사람이 아닌데 id를 미리 정함"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "slug가 내장 명령 이름과 같음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "slug나 미리 정한 id가 이미 있음"
        observe: [response]
    crosses_process: false
    refs: [P5, L4]
    docs: [architecture/app-call.md]

  - id: app-connect-source
    title: "앱의 source 폴더를 잇는다"
    actor: person
    entries: [route:apps/connect_source]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/registration/source-folder.ts]
    steps:
      - "호출한 쪽이 사람, 그 앱 workspace의 agent, core 안 machine(앱 생성 직후)인지 본다. agent는 자기 session의 앱만 잇는다."
      - "폴더가 있고 git 저장소의 맨 위이며 commit이 있는지 writer 앞에서 확인한다(git은 외부 CLI라 process로 세지 않는다)."
      - "범위 밖 앱은 revision 비교보다 먼저 없는 앱과 같이 닫고, base_revision이 다르면 conflict다."
      - "source_path만 바꾼다. active_release, run_enabled, status는 그대로다."
      - "AppSourceConnected event를 쓰고 apps 행을 바꾼다."
    outcomes:
      - id: connected
        observe: ["ledger:apps", "event:AppSourceConnected"]
      - id: invalid-folder
        code: invalid_input
        when: "폴더가 없음, git 저장소가 아님, 저장소 맨 위가 아님, commit이 없음"
        observe: [response]
      - id: git-failed
        code: unavailable
        when: "git 실행이 실패함"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent가 자기 session의 앱이 아닌 앱을 잇려 함"
        observe: [response]
      - id: not-found
        code: not_found
        when: "앱이 없거나 범위 밖임"
        observe: [response]
      - id: revision-changed
        code: conflict
        when: "base_revision이 현재 revision과 다름"
        observe: [response]
    crosses_process: false
    risk: [sandbox]
    refs: [A17]

  - id: app-rename
    title: "앱 이름을 바꾼다"
    actor: person
    entries: [route:apps/rename]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다. 범위 밖 앱은 없는 앱과 같이 닫는다."
      - "base_revision이 현재 revision과 같은지 본다."
      - "AppRenamed event를 쓰고 apps 행의 이름과 revision을 바꾼다. revision이 바뀌어 supervisor는 다음 sweep에 같은 상태로 맞추며 자식을 다시 띄우지는 않는다."
    outcomes:
      - id: renamed
        observe: ["ledger:apps", "event:AppRenamed"]
      - id: not-found
        code: not_found
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
    crosses_process: false

  - id: app-edit-folders
    title: "앱에 더한 폴더 목록을 통째로 바꾼다"
    actor: person
    entries: [route:apps/edit_folders]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다. 폴더끼리, 그리고 source 폴더와 겹치면 거절한다(같은 파일이 두 root로 잡히면 rewind 기록이 갈린다)."
      - "base_revision을 비교한다."
      - "AppFoldersEdited event를 쓰고 apps 행과 app_folders 표를 바꾼다."
    outcomes:
      - id: edited
        observe: ["ledger:apps", "ledger:app_folders", "event:AppFoldersEdited"]
      - id: overlapping
        code: invalid_input
        when: "폴더가 반복되거나 source와 겹침"
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
    crosses_process: false
    risk: [sandbox]

  - id: app-set-icon
    title: "사람이 올린 앱 icon을 정하거나 지운다"
    actor: person
    entries: [route:apps/set_icon]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다. icon이 있으면 올린 형식과 크기를 검사한다."
      - "범위 밖 앱은 없는 앱과 같이 닫는다."
      - "app_icons 표를 쓴다. revision과 event는 바뀌지 않는다."
    outcomes:
      - id: uploaded
        observe: ["ledger:app_icons"]
      - id: cleared
        when: "icon을 null로 보냄"
        observe: ["ledger:app_icons"]
      - id: invalid-icon
        code: invalid_input
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
    crosses_process: false

  - id: app-archive
    title: "앱을 보관한다"
    actor: person
    entries: [route:apps/archive]
    boundary: [apps, app-runtime]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/runtime/supervisor/supervisor.ts]
    steps:
      - "사람만 부른다. base_revision과 현재 status(active)를 본다."
      - "같은 transaction에서 status를 archived로, run_enabled를 false로 바꾸고 AppArchived event를 쓴다."
      - "그 앱의 notice를 지운다(clearAppNotices)."
      - "돌고 있는 자식은 다음 supervisor reconcile이 user_stop으로 멈춘다(app-supervisor-reconcile의 stopped). 이 command는 멈춤을 기다리지 않는다."
      - "agent에게 그 앱은 없는 앱이 된다(authorizeApp의 archived 필터)."
    outcomes:
      - id: archived
        observe: ["ledger:apps", "event:AppArchived", "ledger:notices"]
      - id: not-active
        code: conflict
        when: "status가 active가 아님"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
    crosses_process: false

  - id: app-unarchive
    title: "보관한 앱을 되살린다"
    actor: person
    entries: [route:apps/unarchive]
    boundary: [apps]
    code: [packages/core/apps/registration/commands.ts]
    steps:
      - "사람만 부른다. base_revision과 status(archived)를 본다."
      - "status를 active로 바꾸고 AppUnarchived event를 쓴다. run_enabled는 false로 남는다(되살리기가 실행 재개의 동의가 아니다)."
    outcomes:
      - id: unarchived
        observe: ["ledger:apps", "event:AppUnarchived"]
      - id: not-archived
        code: conflict
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
    crosses_process: false

  - id: app-delete
    title: "보관한 앱을 영구히 지운다"
    actor: person
    entries: [route:apps/delete]
    pre: [app-archive:archived]
    boundary: [apps, app-runtime]
    code: [packages/core/apps/registration/commands.ts, packages/core/apps/registration/delete.ts, packages/core/main/daemon/wiring/apps-delete.ts]
    steps:
      - "사람만 부른다. 앱이 보관 상태이고 base_revision이 맞아야 한다. 활성 앱이면 conflict다."
      - "보관한 앱의 preview를 먼저 멈추고, 살아 있는 supervisor 자식(멈추는 중 포함)이 있으면 지우지 않고 unavailable로 끝낸다."
      - "같은 transaction에서 그 앱 workspace의 session을 session.delete와 같은 규칙으로 지우고, 앱 범위 agent 정의와 다른 agent의 할당, job, 공유 요청을 지운다."
      - "blob 참조, annotation, notice를 지운 뒤 erase window 안에서 apps, releases, grants, invocations, app_rewinds, 활성화 요청·동의, 데이터 기록, 폴더·icon 표를 지운다."
      - "commit 뒤 apps/<id> 폴더를 지우고(읽기 전용 폴더도), session의 tool-results와 되돌리기 저장소를 지우고, 설정에서 이 앱을 가리키는 것을 뺀다. 실패는 log만 남긴다."
      - "남지 않는 event AppRemoved를 내 shell이 browser 저장소와 layout을 정리하게 한다. AppDeleted event는 남는다."
    outcomes:
      - id: deleted
        observe: ["ledger:apps", "ledger:invocations", "ledger:releases", "ledger:grants", "ledger:app_rewinds", "ledger:app_folders", "ledger:activation_requests", "ledger:activation_consents", "event:AppDeleted", "event:AppRemoved", "disk:apps/<app>/"]
      - id: not-archived
        code: conflict
        when: "status가 archived가 아님(only an archived app can be deleted)"
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: still-running
        code: unavailable
        when: "그 앱의 자식 process가 아직 살아 있음(멈추는 중 포함)"
        observe: [response, "ledger:apps"]
      - id: not-found
        code: not_found
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "agent나 app이 부름(route는 user만 받는다)"
        observe: [response]
    crosses_process: true
    risk: [data-loss]
    docs: [architecture/app-call.md]

  - id: app-read
    title: "앱 목록과 한 앱을 읽는다"
    actor: person
    entries: [route:apps/list, route:apps/get]
    boundary: [apps]
    code: [packages/core/apps/registration/reads.ts]
    steps:
      - "목록은 status 필터와 cursor로 자르고 범위 밖 앱은 뺀다. agent에게는 보관한 앱이 없다(authorizeApp)."
      - "한 앱은 없거나 범위 밖이면 not_found다. agent workspace data도 같은 두 route를 쓴다."
      - "읽기만 하므로 기록을 남기지 않는다."
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid-cursor
        code: invalid_input
        when: "목록 cursor가 status나 limit과 맞지 않거나 끝을 넘음"
        observe: [response]
      - id: not-found
        code: not_found
        when: "get의 앱이 없거나 범위 밖임"
        observe: [response]
    crosses_process: false

  # ---------- 실행 상태 ----------

  - id: app-execution-enable
    title: "앱 실행을 켠다"
    actor: person
    entries: [route:apps/enable_execution]
    pre: [route:releases/activate]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "사람만 부른다. base_revision이 맞고, status가 active이고, 활성 release가 있어야 한다."
      - "run_enabled를 true로 바꾸고 AppExecutionEnabled event를 쓴다."
      - "자식은 여기서 띄우지 않는다. 다음 supervisor reconcile(1초 sweep)이 띄운다(app-supervisor-reconcile의 started)."
    outcomes:
      - id: enabled
        observe: ["ledger:apps", "event:AppExecutionEnabled"]
      - id: not-found
        code: not_found
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
      - id: archived
        code: conflict
        when: "보관한 앱은 실행을 켤 수 없다"
        observe: [response]
      - id: no-active-release
        code: invalid_input
        observe: [response]
    crosses_process: false
    risk: [sandbox]

  - id: app-execution-disable
    title: "앱 실행을 끈다"
    actor: person
    entries: [route:apps/disable_execution]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "사람만 부른다. base_revision을 비교한다. 활성 release가 없어도 끌 수 있다."
      - "run_enabled를 false로 바꾸고 AppExecutionDisabled event를 쓴다."
      - "도는 자식은 다음 reconcile이 user_stop으로 멈춘다. OS 종료를 확인하면 record_stopped가 AppStopped를 남긴다(app-supervisor-reconcile, app-record-stopped)."
    outcomes:
      - id: disabled
        observe: ["ledger:apps", "event:AppExecutionDisabled"]
      - id: not-found
        code: not_found
        observe: [response]
      - id: revision-changed
        code: conflict
        observe: [response]
    crosses_process: false

  - id: app-runtime-read
    title: "앱의 지금 실행 상태를 읽는다"
    actor: agent
    entries: [route:apps/runtime]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/reads.ts, packages/core/apps/runtime/model.ts]
    steps:
      - "앱 행(활성 release, status, run_enabled)과 supervisor의 현재 관측을 합쳐 상태를 계산한다. 상태는 저장하지 않는다."
      - "활성 release가 없으면 preparing, 보관했거나 실행을 껐으면 stopped다. 실행인데 관측이 없으면 unavailable(no_observation)이다."
      - "관측이 현재 release이고 ready이며 accepting이면 running이다. 과거 event로 살아 있다고 추정하지 않는다."
      - "사람의 화면과 agent runtime(허락 뒤 nonce 재검사, machine 자격)도 같은 route를 쓴다."
    outcomes:
      - id: state-running
        observe: [response]
      - id: state-stopped
        observe: [response]
      - id: state-preparing
        observe: [response]
      - id: state-unavailable
        observe: [response]
      - id: not-found
        code: not_found
        when: "없는 앱이거나 agent에게 보관한 앱"
        observe: [response]
    crosses_process: true
    refs: [A2, L7, E2]

  # ---------- 감독: supervisor가 자식을 띄우고 멈추고 다시 띄운다 ----------

  - id: app-supervisor-reconcile
    title: "supervisor가 앱 자식을 원하는 상태에 맞춰 띄우거나 멈춘다"
    actor: system
    entries: [system:app-supervisor-reconcile]
    uses: [app-record-started:started, app-record-stopped:stopped, app-record-unavailable:recorded, app-record-unavailable:halted]
    boundary: [app-runtime, child-supervision-protocol]
    code: [packages/core/apps/runtime/supervisor/supervisor.ts, packages/core/apps/control.ts, packages/core/main/app-supervisor/assembly.ts, packages/core/apps/runtime/processes/spawn.ts]
    steps:
      - "core가 기동하면 appsControl.start가 1초 sweep을 켠다. sweep은 활성 release가 있는 앱마다 원하는 상태(release, bundle hash, 실행 여부, 보관 여부)를 supervisor에 reconcile로 알린다. activation 쪽의 sweep도 같은 reconcile을 부르며 그 흐름은 app-release area가 쓴다."
      - "원하는 상태가 실행이 아니거나 보관이면 돌고 있는 자식을 user_stop으로 멈추고 OS 종료를 확인한다(record_stopped)."
      - "같은 release와 bundle의 자식이 이미 돌면 아무것도 하지 않는다. activation이 그 앱을 붙들고 있으면(pause) 건드리지 않는다."
      - "실행이면 app credential을 발급받아 자식 process를 띄운다. 발급이 실패하면 start_failed다."
      - "자식이 ready 통로로 hash, handler, schema, 연결을 probe한다(30초 안에). 맞지 않거나 시간을 넘기면 start_failed로 자식을 끝낸다."
      - "통과하면 open하고 record_started로 AppStarted를 남긴다. start_failed는 자동으로 다시 하지 않고 다음 reconcile까지 unavailable로 둔다."
    outcomes:
      - id: started
        observe: ["process:app-child", "event:AppStarted"]
      - id: start-failed
        when: "credential 발급 실패, ready timeout, bundle hash 불일치, handler나 data schema 불일치, open 실패"
        observe: ["process:app-child", "event:AppUnavailable", "log:app", "ledger:notices"]
      - id: stopped
        when: "실행이 꺼졌거나 보관됨. AppStopped는 그 자식이 AppStarted를 남겼을 때만 남는다"
        observe: ["process:app-child", "event:AppStopped"]
      - id: halted-crash-loop
        when: "reconcile이 왔을 때 창 안 예상 밖 종료가 한도를 넘어 있음"
        observe: ["event:AppUnavailable", "event:AppRestartHalted"]
      - id: held-by-activation
        when: "activation이 그 앱을 붙들고 있음(pause)"
        observe: ["process:app-child"]
    crosses_process: true
    risk: [sandbox]
    refs: [E2]
    docs: [architecture/activation.md, architecture/app-call.md]
    unclear:
      - "start_failed 뒤 자동 재시도가 없다(다음 reconcile까지 unavailable). activation 실패는 다시 하지 않는다는 규칙과 같은지, 일반 앱 시작에도 그 뜻인지 확인이 필요하다."

  - id: app-record-started
    title: "자식이 열렸음을 기록한다(AppStarted)"
    actor: system
    entries: [route:apps/record_started]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts, packages/core/apps/routes.ts]
    steps:
      - "supervisor가 probe와 open을 끝낸 뒤 machine 자격으로 record_started를 부른다. attestation의 release가 있어야 한다."
      - "같은 release, 자식 nonce, 시작 종류의 관측이 이미 있으면 event를 다시 쓰지 않는다."
      - "새 관측이면 AppStarted(release, process_nonce, data_schema)를 쓴다."
      - "시작 때 DB가 바뀌었으면(start_changeset) withStartInvocation이 start invocation을 쓰고 changeset을 붙인다. 이전 시작 release가 같으면 restart, 다르면 activation이다."
    outcomes:
      - id: started
        when: "새 관측"
        observe: ["event:AppStarted", "ledger:invocations"]
      - id: replayed
        when: "같은 관측의 재전송"
        observe: [response]
      - id: no-release
        code: invalid_input
        observe: [response]
      - id: not-registered
        code: invalid_input
        observe: [response]
    crosses_process: true

  - id: app-record-stopped
    title: "자식이 종료됐음을 기록한다(AppStopped)"
    actor: system
    entries: [route:apps/record_stopped]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "supervisor가 자식의 OS 종료를 확인한 뒤 machine 자격으로 record_stopped를 부른다. core가 꺼질 때는 남기지 않는다."
      - "같은 release와 nonce의 AppStopped가 없으면 쓴다."
      - "관측 없이 상태를 계산해 돌려준다."
    outcomes:
      - id: stopped
        observe: ["event:AppStopped"]
      - id: replayed
        observe: [response]
      - id: not-registered
        code: invalid_input
        observe: [response]
    crosses_process: true

  - id: app-record-unavailable
    title: "앱이 쓸 수 없게 됐음을 기록한다(AppUnavailable)"
    actor: system
    entries: [route:apps/record_unavailable]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/commands.ts]
    steps:
      - "supervisor가 start_failed, 예상 밖 종료, crash loop 멈춤을 machine 자격으로 알린다."
      - "마지막 근거와 같으면 event를 다시 쓰지 않는다."
      - "새 근거면 AppUnavailable을 쓰고, 앱마다 현재 상태 한 줄인 program notice(app_unavailable)를 같은 transaction에 남긴다."
      - "근거가 crash_loop이면 commit 뒤 남지 않는 event AppRestartHalted를 내 shell이 사람에게 자동 재시작이 멈췄음을 알린다."
    outcomes:
      - id: recorded
        when: "crash_loop이 아닌 새 근거(unexpected_exit, start_failed 등)"
        observe: ["event:AppUnavailable", "ledger:notices"]
      - id: halted
        when: "새 근거가 crash_loop"
        observe: ["event:AppUnavailable", "event:AppRestartHalted", "ledger:notices"]
      - id: same-reason
        when: "마지막 근거와 같음"
        observe: [response]
      - id: not-registered
        code: invalid_input
        observe: [response]
    crosses_process: true

  - id: app-child-exit
    title: "앱 자식이 예상 밖으로 끝나면 다시 띄우거나 자동 재시작을 멈춘다"
    actor: system
    entries: [system:app-child-exit]
    uses: [app-record-unavailable:recorded, app-record-unavailable:halted, app-supervisor-reconcile:started]
    boundary: [app-runtime, child-supervision-protocol]
    code: [packages/core/apps/runtime/supervisor/supervisor.ts, packages/core/apps/runtime/supervisor/restart-policy.ts, packages/core/apps/runtime/processes/terminate.ts]
    steps:
      - "자식이 끝나면 supervisor가 OS 종료를 확인하고 exit 사실을 남긴다. 정지를 요청해 끝난 종료는 여기서 아무것도 하지 않는다."
      - "종료 코드가 0이 아니면 예상 밖 종료로 세고 10분 창 안의 종료 수에 넣는다."
      - "창 안 종료가 한도(5)를 넘으면 자동 재시작을 멈추고 record_unavailable(crash_loop)을 부른다."
      - "아니면 record_unavailable(unexpected_exit)을 부르고 backoff(1초, 2초, 4초 … 최대 5분) 뒤 reconcile로 다시 띄운다."
      - "시작 실패(start_failed)는 예상 밖 종료로 세지 않는다."
    outcomes:
      - id: restarted
        observe: ["event:AppUnavailable", "log:app", "process:app-child"]
      - id: halted
        observe: ["event:AppUnavailable", "event:AppRestartHalted", "log:app"]
      - id: exit-zero-ignored
        when: "종료 코드가 0인 예상 밖 종료. AppUnavailable도 재시작도 없다. 앱 log에는 unexpected_exit 한 줄만 남는다(crash.ts는 code 0도 센다)"
        observe: ["log:app", "process:app-child"]
    crosses_process: true
    refs: [E2]
    docs: [architecture/app-call.md]
    unclear:
      - "종료 코드 0으로 예상 밖 종료한 앱은 AppUnavailable도 재시작도 없다(supervisor.ts onChildExit가 unexpected()를 거른다). 의도인지, 그러면 app이 멈춘 채 남는 것이 맞는지 확인이 필요하다."
      - "crash loop로 멈춘 앱은 자동으로 풀리지 않는다. 다음 reconcile이 와야 apply가 창을 다시 보는데, reconcile은 실행 켜기·끄기, 이름·폴더 바꾸기처럼 revision이 바뀔 때만 온다(코드 읽기로 본 것이고 실행으로 확인하지 않았다)."
      - "예상 밖 종료 뒤에는 record_stopped가 없어 마지막 process 사실이 AppStarted로 남는다. 그래서 grant revoke가 process-running으로 막힌다(app-grant-revoke의 unclear 참고)."

  - id: app-core-restart-recovery
    title: "core가 다시 켜질 때 끝내지 못한 호출과 rewind를 닫는다"
    actor: system
    entries: [system:app-core-restart-recovery]
    boundary: [app-runtime, app-data]
    code: [packages/core/apps/invocations/restart.ts, packages/core/apps/rewind/store.ts, packages/core/main/daemon/wiring/apps.ts]
    steps:
      - "apps wiring이 start될 때 running으로 남은 invocation을 찾는다."
      - "각각을 unknown(summary reason core_restarted, observation result_not_observed, 근거 열)으로 닫는다. changeset은 붙이지 않는다."
      - "applying으로 남은 rewind는 cancelled(reason core_restarted)로 닫는다. 접수 닫힘은 메모리라 재시작하면 열려 있다."
      - "이전 core의 앱 process는 이미 없으므로 같은 호출을 다시 부르지 않는다."
    outcomes:
      - id: invocations-unknown
        observe: ["ledger:invocations"]
      - id: rewind-cancelled
        observe: ["ledger:app_rewinds"]
    crosses_process: false

  # ---------- 앱 log ----------

  - id: app-log-write
    title: "supervisor가 앱 log 한 줄을 쓴다"
    actor: system
    entries: [system:app-log-write]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/observations/log-file.ts, packages/core/apps/runtime/observations/stream-decoder.ts, packages/core/apps/runtime/view-errors.ts, packages/core/main/app-supervisor/log-redact.ts]
    steps:
      - "앱 stdout·stderr 줄, reportProblem 줄, 잡히지 않은 예외(원래 source 줄로 푼 frame), 화면 오류, process_exit 근거를 줄 하나로 만든다. 의도한 정지와 preview 자식의 출력은 쓰지 않는다."
      - "줄마다 redaction을 먼저 하고 300자로 자른다. 머리의 [inv=<id>]는 떼어 invocation 칸에 둔다."
      - "app.log에 JSON Lines 한 줄을 붙인다. 붙이면 8 MiB를 넘을 때 app.log를 app.log.1로 옮기고(앞 .1은 버린다) 새 app.log에 쓴다."
      - "쓰기 실패는 버리고 supervisor는 계속 돈다. 다음 줄에서 다시 쓴다."
    outcomes:
      - id: written
        observe: ["log:app", "disk:apps/<app>/logs/app.log"]
      - id: rotated
        when: "쓰기 전에 app.log를 app.log.1로 옮김"
        observe: ["log:app", "disk:apps/<app>/logs/app.log.1"]
      - id: dropped
        when: "쓰기 실패로 줄이 버려짐"
        observe: ["disk:apps/<app>/logs/app.log"]
      - id: line-too-long
        when: "줄 하나가 16 KiB를 넘음. redaction 전에 자를 수 없어 다음 줄바꿈까지 통째로 버린다(stdout·stderr만)"
        observe: ["disk:apps/<app>/logs/app.log"]
      - id: not-logged
        when: "의도한 정지, preview 자식의 출력, preview 화면 오류"
        observe: ["log:app"]
    crosses_process: true
    risk: [secret]
    refs: [A15]
    docs: [architecture/app-call.md]

  - id: app-log-read
    title: "앱 log의 최근 줄을 읽는다"
    actor: agent
    entries: [route:apps/logs]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/reads.ts, packages/core/apps/runtime/observations/log-file.ts]
    steps:
      - "core가 app.log.1과 app.log를 직접 읽는다. supervisor를 거치지 않아 멈춘 앱이나 crash loop 앱도 읽힌다."
      - "줄을 JSON으로 풀고 깨진 줄은 건너뛴다. invocation, since(포함), until(제외)로 거른다."
      - "맞는 줄 가운데 가장 최근 limit줄(기본 200, 최대 1000)을 오래된 것부터 준다."
      - "알려진 secret 값으로 한 번 더 지운다. 하나라도 안전하게 만들지 못하면 읽기 전체가 unavailable이다."
    outcomes:
      - id: read
        observe: [response]
      - id: not-found
        code: not_found
        when: "범위 밖이거나 agent에게 보관된 앱"
        observe: [response]
      - id: unsafe-line
        code: unavailable
        when: "redaction으로 안전하게 만들지 못한 줄이 있음"
        observe: [response]
    crosses_process: false
    risk: [secret]
    refs: [A2, L7]
    docs: [architecture/app-call.md]

  - id: app-view-error-log-write
    title: "앱 화면의 처리되지 않은 오류를 앱 log에 쓴다"
    actor: shell
    entries: [route:apps/log_view_error]
    boundary: [app-runtime]
    code: [packages/core/apps/runtime/view-errors.ts, packages/protocol/apps/app-log.ts]
    steps:
      - "shell main이 앱 화면의 오류를 sender view로 앱과 release, mode를 정해 사람 token으로 부른다."
      - "preview 화면의 오류는 log에 쓰지 않는다."
      - "live면 supervisor에 appendLog를 넘겨 view_error <observation> <name>: <message> 한 줄을 쓰게 한다."
    outcomes:
      - id: written
        observe: ["log:app"]
      - id: not-written-preview
        when: "preview 화면의 오류라 쓰지 않음"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "supervisor가 답하지 않거나 답이 맞지 않음"
        observe: [response]
    crosses_process: true
    refs: [A15]

  # ---------- 호출 ----------

  - id: app-command-call
    title: "앱 command를 부른다(agent, 다른 앱, job, flow)"
    actor: agent
    entries: [route:apps/call_tool]
    when: "kind가 command이고 대상이 운영 앱(live)일 때. 화면의 operation 호출은 app-operation-call이다"
    pre: [route:releases/activate]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/caller.ts, packages/core/apps/calls/gate.ts, packages/core/apps/calls/intake.ts, packages/core/apps/calls/record.ts, packages/core/apps/calls/loop.ts, packages/core/apps/routes.ts]
    steps:
      - "core가 부른 쪽을 확인한다(verifyCaller). credential 종류와 caller 종류가 맞아야 하고, agent는 지금 도는 turn의 tool call이어야 하며, app은 활성 release와 지금 도는 부모 호출이어야 한다. program과 flow는 core 안 run 연산이 만든 자격과 맞아야 한다."
      - "보관한 앱은 agent에게 not_found, 사람에게 denied(app_archived)다. 활성 release의 command 선언에서 찾고 없으면 denied(not_declared)다."
      - "같은 앱이 호출 사슬에 다시 나오거나 깊이 8을 넘으면 handler에 가지 않고 denied(call_loop, call_too_deep)로 기록한다."
      - "막기(Gate): agent는 지금 할당(judge)으로, app은 부른 앱의 active grant app.call이 그 tool을 덮는지로 본다. program은 판정 없이 통과하고, flow는 PM의 할당과 비공개 규칙을 본다. 묻지 않는다. 막히면 denied(gate_blocked)다."
      - "write와 external이면 앱별 줄을 얻고 invocation 시작을 남긴다. read는 줄 없이 바로 간다. 성공한 read는 기록하지 않는다."
      - "앱 process에 보낸다. 보내기 전에 막히면 denied(app_unavailable), 보냈는데 답이 없으면 unknown이다."
      - "응답의 결과와 changeset으로 invocation을 끝내고 부른 쪽에 succeeded, failed(앱 handler 오류), denied, unknown 가운데 하나를 준다."
    outcomes:
      - id: succeeded
        observe: [response, "ledger:invocations"]
      - id: failed
        when: "앱 handler가 오류를 냄(읽기도 실패는 기록한다)"
        observe: [response, "ledger:invocations"]
      - id: denied-gate-blocked
        when: "할당이나 app.call grant가 그 tool을 덮지 않음"
        observe: ["ledger:invocations", response]
      - id: denied-call-loop
        when: "대상 앱이 이미 호출 사슬에 있음"
        observe: ["ledger:invocations", response]
      - id: denied-call-too-deep
        when: "호출 사슬 깊이가 8 이상"
        observe: ["ledger:invocations", response]
      - id: denied-app-unavailable
        when: "앱 process에 보내기 전에 막힘"
        observe: [response, "ledger:invocations"]
      - id: denied-not-declared
        when: "활성 release의 command 선언에 없음(기록 없음)"
        observe: [response]
      - id: unknown
        when: "보냈는데 응답을 받지 못함(connection_lost, core_restarted, timeout, unavailable)"
        observe: ["ledger:invocations", response]
      - id: forbidden
        code: forbidden
        when: "caller 종류가 credential과 다름, agent의 tool call을 모름, preview를 그 앱 workspace가 아닌 session이 부름"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "agent가 live 활성 release가 아닌 대상을 부름, program이나 flow가 live가 아닌 대상을 부름, 본문이 frame 상한을 넘음"
        observe: [response]
      - id: not-found
        code: not_found
        when: "agent가 보관한 앱을 부름"
        observe: [response]
    crosses_process: true
    risk: [permission, data-loss]
    refs: [P12, H3, J4]
    docs: [architecture/app-call.md]
    unclear:
      - "AGENT.md J4와 E10은 job의 앱 tool 차례를 만든 agent의 할당 안으로 제한하지만, architecture/app-call.md의 결정과 gate.ts의 callAllowed는 program을 판정 없이 통과시킨다. 어느 쪽이 맞는지 사람이 정한다."
      - "agent 호출의 gate는 할당(judge)만 보고 다른 앱의 비공개 command를 따로 막지 않는다. 비공개 규칙은 agent tool의 lophn 명령 해석 쪽에만 있는 것으로 보인다. 직접 app.call_tool로 부르는 길에서도 막히는지 확인이 필요하다."
      - "write가 앱 미기동으로 막히면 invocation의 ledger status는 failed인데 응답과 summary는 denied(app_unavailable)다(calls/service.ts execute). 의도인지 확인이 필요하다."

  - id: app-operation-call
    title: "앱 화면이 operation을 부른다"
    actor: person
    uses: [route:apps/call_tool]
    when: "kind가 operation이고 대상이 운영 앱(live)일 때. 사람이 연 화면의 호출이다"
    pre: [route:releases/activate]
    boundary: [app-runtime, core-api]
    code: [packages/core/apps/calls/service.ts, packages/core/apps/calls/gate.ts, packages/shell/main/app-frame/app-call.ts]
    steps:
      - "shell main이 화면의 호출 모양(필드, operation 이름, 64 KiB, JSON 값)과 그 view의 고정 선언에 operation이 있는지 본다. 어긋나면 core에 보내지 않는다."
      - "shell main이 화면의 호출을 사람 자격으로 app.call_tool(kind operation)에 넘긴다. operation 선언은 활성 release에서 찾는다."
      - "operation은 사람과 그 앱 workspace session의 preview만 부른다. 다른 caller가 live operation을 부르면 handler에 보내기 전에 denied(gate_blocked)로 막힌다."
      - "사람의 호출은 Gate를 거치지 않고, 줄, invocation 기록, 직렬화는 command와 같이 거친다."
      - "응답의 결과와 changeset을 invocation에 붙여 화면에 돌려준다. 결과 상한은 operation 상한(CALL_RESULT_MAX_BYTES에서 1 KiB를 뺌)이다."
    outcomes:
      - id: succeeded
        observe: [response, "ledger:invocations"]
      - id: failed
        when: "앱 handler가 오류를 냄"
        observe: [response, "ledger:invocations"]
      - id: unknown
        when: "보냈는데 응답을 받지 못함"
        observe: ["ledger:invocations", response]
      - id: denied-gate-blocked
        when: "사람이 아닌 caller가 live operation을 부름(이 입구를 쓰는 다른 caller의 경우)"
        observe: ["ledger:invocations", response]
      - id: denied-app-unavailable
        when: "앱 process에 보내기 전에 막힘"
        observe: [response, "ledger:invocations"]
      - id: denied-not-declared
        when: "활성 release의 operation 선언에 없음"
        observe: [response]
      - id: denied-app-archived
        when: "보관한 앱. 사람(화면)에게는 not_found가 아니라 denied(app_archived)다. 화면은 unavailable로 받는다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "view의 고정 선언에 없는 operation(command 이름 포함)이라 core에 보내지 않음"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        when: "화면이 보낸 호출 모양이 맞지 않음(필드, operation 이름, 64 KiB 초과, 비 JSON 값), 또는 core에 보낸 본문이 frame 상한을 넘음"
        observe: [response]
      - id: declaration-unavailable
        code: unavailable
        when: "view의 선언을 읽지 못함"
        observe: [response]
      - id: core-call-failed
        code: unavailable
        when: "core 호출이 오류로 끝나거나 끊김. 쓰기는 result unknown이다"
        observe: [response]
      - id: result-too-large
        code: unavailable
        when: "앱이 성공했지만 결과가 operation 상한을 넘어 화면이 받지 못함(invocation은 succeeded로 남는다)"
        observe: [response, "ledger:invocations"]
    crosses_process: true
    risk: [permission, data-loss]
    refs: [P12]
    docs: [architecture/app-call.md]
    unclear:
      - "preview 화면의 operation 호출은 shell main의 declaration-source가 live 선언만 읽어 unavailable이다(issues/app-call.md 'preview 화면은 operation을 부르지 못한다'). 이 flow는 live만 다룬다."

  - id: app-broker-apps-call
    title: "앱이 다른 앱의 command를 broker로 부른다"
    actor: app
    entries: [system:app-broker-apps-call]
    uses: [route:apps/call_tool]
    pre: [app-record-started:started]
    boundary: [app-runtime, app-capability]
    code: [packages/core/apps/permissions/broker/apps-call.ts, packages/core/apps/permissions/broker/server.ts]
    steps:
      - "앱 자식이 SDK로 broker의 apps/call에 target 앱, command, 입력, parent invocation을 보낸다. broker endpoint가 credential, 본문(JSON 객체, 1 MiB), process_nonce·mode가 연결과 같은지 먼저 본다."
      - "요청 모양을 검사한다. 자식이 운영 앱(live)이면서 release가 있어야 한다. preview 자식은 막힌다."
      - "core app.call_tool을 이 자식의 app credential로 부른다(caller kind app, 자식의 release, parent invocation). 판정과 기록은 app-command-call을 따른다."
      - "core의 결과를 그대로 앱에 돌려준다. core 응답 모양이 맞지 않으면 internal이다."
    outcomes:
      - id: forwarded
        when: "core가 succeeded, failed, denied, unknown 가운데 하나를 돌려줌(그대로 전달)"
        observe: [response, "ledger:invocations"]
      - id: invalid-input
        code: invalid_input
        when: "본문이 JSON 객체가 아니거나 1 MiB를 넘음, apps/call 모양이 맞지 않음, core가 입력이 frame 상한을 넘는다고 거절함"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "운영 자식이 아님(preview 자식, release 없음), 또는 core가 거절함(자식의 release가 활성 release가 아님, parent_invocation이 그 앱의 지금 도는 호출이 아님)"
