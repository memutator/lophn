id: terminal-colors-without-webgl
version: 0.9.0
title: 'GPU를 못 쓸 때도 터미널 색이 나온다'
modules: [packages/shell/main, packages/shell/renderer, packages/design]
checked: [skill-ui-design]
change: |
  전: 터미널이 WebGL context를 잃으면(GPU process가 죽음, 한 창에 WebGL context 16개 초과 등) xterm DOM renderer로 돌아가고 앱을 다시 켤 때까지 그대로였다. DOM renderer는 truecolor를 `style` 속성으로 칠하는데 shell CSP(`style-src 'self'`)가 막아 Claude Code 글자가 모두 흰색이었다. 사람이 개발 앱에서 다시 봤고, 같은 모양을 WebGL context를 강제로 잃게 해 재현했다.
  후:
  - shell CSP에 `style-src-attr 'unsafe-inline'`을 더했다(`packages/shell/main/desktop/shell-protocol.ts`). `style` 속성은 허용하고, inline `<style>` 요소와 script는 그대로 막는다. DOM renderer에서도 truecolor가 나온다.
  - context를 잃은 터미널은 다음 `fit`·`focus` 때 WebGL renderer를 다시 붙인다(탭으로 돌아올 때, 칸 크기가 바뀔 때). GPU를 아예 못 쓰게 된 창이면 DOM renderer로 남고 색은 나온다.
why: |
  다른 터미널은 GPU가 없어도 색을 그린다. 앞 판은 "평소에는 WebGL이니 DOM renderer는 흰색이어도 된다"고 정했는데, WebGL을 잃는 일은 GPU와 상관없는 lophn 쪽 사정(context 수)으로도 생기고 한 번 잃으면 돌아오지 않았다.
decisions:
  - text: |
      `style` 속성만 연다. VS Code는 `style-src 'unsafe-inline'`으로 `<style>` 요소까지 연다. 터미널에 필요한 것은 속성뿐이고, CodeMirror·xterm의 `<style>`은 이미 constructable stylesheet로 옮긴다. 이 줄이 막던 것은 agent 답·파일·인터넷 글에 숨은 모양 지시로 화면을 속이는 일이고 script는 계속 막힌다.
    by: person
  - text: |
      WebGL을 잃은 이유를 기록하는 일은 하지 않는다. 색이 나오면 남는 차이는 그리기 속도뿐이다. 터미널이 눈에 띄게 느려지면 그때 원인을 찾는다.
    by: person
