    code:
      - packages/protocol/coding-agent/coding-agents.ts
      - packages/core/terminal-agents/coding-connection.ts
      - packages/core/terminal-agents/hook-install.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
    steps:
      - "list는 처음 한 번만 core가 사람의 env로 lophn harness detect를 부르고 이후는 성공한 마지막 결과다. 실패하면 모든 harness가 unknown이다"
      - "hook_status는 lophn harness status를 dry run으로 불러 harness마다 installed·missing·unsupported·failed를 준다. 아무것도 쓰지 않는다"
    outcomes:
      - id: ok
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
