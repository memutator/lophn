id: coding-switch-confirms-stale-plan
title: 폰이 채팅과 터미널 사이 바꾸기를 확인한 뒤에 다른 기기가 시작한 turn이 말없이 끊긴다
kind: bug
status: open
topic: remote
modules: [packages/core/coding-relay, packages/protocol, packages/mobile]
now: |
  폰은 바꾸기 전에 `coding_sessions/switch_plan`으로 무엇이 멈추는지(도는 turn, background task, 줄 선 메시지)를 읽어 사람에게 보이고, 사람이 누르면 `coding_sessions/switch`를 `confirmed: true`로 부른다(`packages/protocol/coding-agent/relay.ts`). relay(`packages/core/coding-relay/relay.ts`의 `switch`)는 그 사이 계획이 달라졌는지 보지 않는다. 폰이 계획을 읽은 뒤 다른 기기가 turn을 시작하거나 메시지를 줄 세웠어도 그대로 끊는다.
impact: |
  컴퓨터 앞의 사람이나 다른 폰이 방금 시킨 일이 아무 안내 없이 멈추고 줄 선 메시지가 사라진다. 확인한 사람은 "멈출 것 없음"을 보고 눌렀다.
fix: |
  - 작음(추천): 폰이 본 계획(`stops`)을 `switch`에 같이 싣고, relay가 지금 계획과 다르면 `conflict`로 답해 폰이 새 계획을 다시 보이게 한다.
