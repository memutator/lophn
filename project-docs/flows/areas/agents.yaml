  - id: custom-call-reply
    title: custom agent가 끝낸 turn의 마지막 글을 result call의 답으로 보낸다
    actor: system
    entries: [system:custom-call-reply]
    uses: [route:calls/auto-reply]
    boundary: [router, run-loop]
    code: [packages/core/main/daemon/wiring/custom-reply.ts]
    steps:
      - TurnEnded(commit 뒤)가 오면 wiring이 그 turn을 읽는다
      - 끝 상태가 completed이고, 입력이 result call이고, 그 call이 아직 이 session이 받은 accepted이고, turn의 resolved runtime이 custom이거나 harness session의 turn인지 본다
      - 마지막 agent 메시지 글이 비지 않았으면 redaction을 거쳐 calls/auto-reply로 답한다. agent의 reply와 같은 규칙이다. 본문 준비와 route의 오류 갈래는 custom-reply-auto가 정한다
      - 그 밖(멈춤, 실패, 빈 글, conversation이나 none call, 이미 reply로 답함)은 보내지 않고 call은 accepted로 남는다
    outcomes:
      - id: replied
        observe: [ledger:agent_calls, event:MessageReceived]
        when: calls/auto-reply가 ok로 답해 메시지가 갔다. route의 나머지 갈래(not_found, forbidden, conflict, unavailable)는 custom-reply-auto의 outcome이라 여기 반복하지 않는다
      - id: not-sent
        observe: [ledger:agent_calls]
        when: 위 조건 가운데 하나라도 맞지 않는다(멈춤, 실패, conversation이나 none call, custom도 harness도 아닌 runtime, 빈 글, 이미 reply로 답함). call은 archive나 지움 때 receiver_ended로 닫힌다
      - id: unavailable
        code: unavailable
        when: redaction이 끝나지 않았다(알려진 값을 다 모름, fail-closed). calls/auto-reply를 부르지 않는다. log로 남고 call은 accepted로 남는다
        observe: [ledger:agent_calls, log:custom-reply]
      - id: read-failed
        when: wiring이 turn, 받은 메시지, call 행, turn의 정의 값을 읽지 못했다. calls/auto-reply를 부르지 않는다. log로 남고 call은 accepted로 남는다
        observe: [log:custom-reply, ledger:agent_calls]
    crosses_process: true
    unclear:
      - redaction을 wiring이 거는지 custom-reply-auto(route)가 거는지 두 flow의 설명이 다르다. sessions와 맞출 것
    refs: [T11]
    docs: [architecture/agent-call.md]

  - id: call-restart-recovery
    title: lophn을 켤 때 잃어버린 call과 도는 turn을 닫는다
    actor: system
    entries: [system:call-restart-recovery]
    uses: [route:calls/recover]
    boundary: [router, run-loop, agent-sessions]
    code: [packages/core/main/daemon/wiring/router.ts, packages/core/router/commands.ts]
    steps:
      - agent runtime이 turn을 읽기 전에 core가 calls/recover를 machine 자격으로 부른다(wiring start)
      - queue와 call 줄이 메모리라서 accepted인데 아직 가져가지 않은 call을 failed(lophn_restarted)로 닫는다. 팀의 ask call은 부모가 가져갔어도 닫는다
      - 보낸 session이 살아 있고 실패 글의 blob이 준비됐으면 이유를 새 입력으로 돌려준다. 자식 ask call은 자식에게 알리지 않는다
      - 같은 시점에 도는 turn은 interrupted로 닫는다
    outcomes:
      - id: recovered
        observe: [ledger:agent_calls, ledger:turns, event:MessageReceived]
        when: calls/recover가 ok로 답했다. 잃은 call을 이유와 함께 닫았는지, 알림 없이 닫았는지는 calls-recover-on-start의 ok가 정한다. route의 실패 갈래도 그 flow의 outcome이다
      - id: recovery-failed
        observe: [log:router]
        when: calls/recover가 오류를 돌려줬다(route의 forbidden·unavailable 등). wiring은 기동을 이어 가고 close_lost_calls_failed log만 남긴다
    crosses_process: false
    refs: [T9]
    docs: [architecture/agent-call.md, architecture/workspace-session.md]
    unclear:
      - 접수만 되고 turn이 가져가지 않은 사람 메시지를 queue에 되돌리는 일(같은 start)은 turns area의 input-requeued다

  - id: team-changed-notice
    title: 팀이 바뀌면 다음 turn 끝에 team_changed 글을 붙인다
    actor: system
    entries: [system:team-changed-notice]
    uses: [route:team/read]
    boundary: [router, run-loop]
    code: [packages/core/lophn-agent/prompt-assembly/turn-prompt.ts, packages/protocol/lophn-agent/team.ts]
    steps:
      - turn을 준비할 때 지금 팀(부모, 형제, 자식의 handle과 session 줄)을 그 session이 앞서 본 팀(SeenBasis.team)과 비교한다
      - 다르면 고정 글 team_changed를 이 turn 요청의 대화 끝에 붙인다
      - queue에 입력으로 넣지 않으므로 쉬던 session을 깨우지 않는다. 이력에는 저장하지 않는다
    outcomes:
      - id: notice-added
        observe: [request:model]
      - id: unchanged
        observe: [request:model]
        when: 팀이 앞서 본 것과 같다. notice를 붙이지 않는다. 앞선 기준(seen)이 없는 turn도 붙이지 않는다
    crosses_process: false
    refs: [G4]
    docs: [architecture/agent-call.md]
    unclear:
      - turn 준비(prompt-assembly)는 turns area의 module이다. 이 flow가 turns의 prompt flow와 겹치면 turns 쪽에서 uses로 잇는다

  - id: agent-definition-data-steps
    title: 옛 agent 정의 file을 새 모양으로 옮긴다(data step)
    actor: system
    entries: [system:agent-definition-data-steps]
    boundary: [agents, storage]
    code: [packages/core/lophn-agent/agents/handle-step.ts, packages/core/lophn-agent/agents/runtime-custom-step.ts, packages/core/lophn-agent/agents/tools-no-commands-step.ts, packages/core/lophn-agent/agents/domains-field-step.ts, packages/core/lophn-agent/agents/skills-off-step.ts]
    steps:
      - 기동 때 data step agents.handle이 먼저 돈다. name을 handle로 채운다(handle이 있거나 name이 없으면 두고 고치지 않는다)
      - "agents.runtime-custom이 frontmatter의 `runtime: bare`를 `runtime: custom`으로 옮긴다(그 한 줄만 고친다)"
      - "agents.tools-no-commands가 정의 `tools`에서 lophn 명령·앱 command 이름(내장 tool, MCP, extension tool이 아닌 것)을 뺀다. 다 빠지면 칸을 지운다"
      - agents.drop-domains가 옛 domains 칸을 지운다
      - agents.skills-off가 옛 skills를 skills_off로 옮긴다. 옮기기 전에 받던 skill이 그대로 받아지도록 끈 이름을 적는다
      - 정의마다 새 모양만 schema로 검사해 다시 쓴다. 칸이 없는 파일이나 깨진 파일은 건드리지 않는다
    outcomes:
      - id: migrated
        observe: [disk:agents/<id>.md]
        when: 옛 칸이 있는 정의 file을 다시 썼다
      - id: untouched
        observe: [disk:agents/<id>.md]
        when: 옛 칸이 없거나 file이 깨져 그대로 두었다
      - id: unavailable
        code: unavailable
        when: 정의 file을 읽거나 쓰지 못해 step이 실패했다. 기동을 거절하는지는 core-platform의 data step 적용이 정한다
        observe: [log:core]
    crosses_process: false
    risk: [data-loss]
    refs: [P2]
    docs: [architecture/agent-definition.md]
    unclear:
      - data step 실행기(기동 거절, 적용 기록)는 core-platform area의 것이다. 여기서는 step 내용만 적었다
