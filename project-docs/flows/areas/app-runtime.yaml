      - id: forbidden
        code: forbidden
        when: "user가 아닌 credential(agent, app, machine). route actors는 user만"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "supervisor가 준비되지 않음, 5초 안에 답이 없음, 보내지 못함, 답을 기다리는 중 연결이 끊김, 답이 맞지 않음"
