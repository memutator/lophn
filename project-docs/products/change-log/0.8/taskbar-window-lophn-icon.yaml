id: taskbar-window-lophn-icon
version: 0.8.0
title: '작업 표시줄과 창이 lophn 아이콘을 보인다'
modules: [packages/shell/main, packages/base]
checked: [architecture-browser-tab, architecture-artifact, architecture-workspace-layout, architecture-appearance, tool-worktree-prep, tool-dev, skill-ui-design, tool-wireframes]
change: |
  전:
  - lophn 아이콘은 tray에만 있었다. desktop 창과 앱 창의 `BrowserWindow`에 `icon`이 없었다.
  - 설치본 `lophn.desktop`의 `StartupWMClass=lophn`이 Electron의 X11 WM_CLASS(shell main `package.json`의 `name`, `lophn-shell-main`)와 달라 작업 표시줄이 창을 desktop 항목에 잇지 못했다. Wayland app_id를 정하는 `desktopName`도 없었다.
  후:
  - desktop 창과 앱 창이 tray와 같은 `icon.png`를 쓴다(`ShellContext.appIcon`, `tray.ts`의 `appIconPath`).
  - `lophn.desktop`은 `StartupWMClass=lophn-shell-main`이고 shell main `package.json`에 `"desktopName": "lophn.desktop"`이 생겼다.
why: |
  설치본의 작업 표시줄에 lophn 아이콘이 보이지 않았다. 그림은 lophn-legacy와 같아 바꿀 것이 없었고 잇는 곳이 빠져 있었다.
decisions:
  - text: '앱 이름은 그대로 두고 `.desktop`을 앱 이름에 맞춘다. 버린 길: `package.json` `name`을 `lophn`으로 바꾸기. userData 폴더가 옮겨져 `persist:` partition(앱 view, browser 탭의 로그인)이 사라진다.'
    by: agent
follow_up: |
  browser DevTools 창과 앱마다 만드는 `.desktop` 항목에는 아직 `Icon`이 없다.
