id: ui-kit-one-package
version: 0.2.0
title: "UI kit를 하나로 모음: design은 `@lophn/ui`, 앱 bridge UI는 `@lophn/app-ui`, gallery가 정본"
modules: [packages/design, packages/sdk, packages/shell/renderer, packages/core/apps, packages/coding-agent, tools]
checked: [architecture-activation, architecture-app-call, architecture-coding-agent, architecture-annotation, tool-worktree-prep, tool-dev]
change: |
  전:
  - `packages/design`(`@lophn/design`)의 `components/`에 component 약 40개가 평평하게 있고, barrel 하나(`@lophn/design/components`)로 나갔다. chart는 따로 `@lophn/chart`였다.
  - 앱에는 sdk `ui-*` 10개와 `@lophn/tokens`로 나갔다. 대부분 design을 골라 재export했다. 범용 부품(AppShell, Sidebar, FilterBar, ReadState, ToastProvider)이 sdk에 있었고, lophn 전용 부품(Avatar, VendorIcon, TabStrip)이 design에 있었다.
  - gallery(`tools/wireframes`)에는 실제 component를 흉내 낸 CSS 사본이 있었다(Avatar, project 창 틀, 경로 palette, Menu·Dialog·Sheet·Palette). page는 "지금 화면·새 설계" badge와 `ScreenId`·`SCREENS`·page 목록에 세 번 적혔다.
  후:
  - design package 이름은 `@lophn/ui`다. component는 분류 폴더 8개(primitives, input, layout, navigation, data, feedback, overlay, reading)와 `_shared`에 있다. sub-path(`@lophn/ui/<분류>`, `@lophn/ui/shared`, `@lophn/ui/tokens.css`, `@lophn/ui/base.css`)로 import한다. 분류 `mod.ts`의 export마다 "언제 쓰나" 한 줄이 있다. chart는 `@lophn/ui/data`다.
  - sdk의 UI는 `@lophn/app-ui` 하나다(AppApiButton, useAppApi, AppErrorBoundary). sdk `ui-*` 10개와 `@lophn/tokens`, `@lophn/design`, `@lophn/chart` 이름은 없다. 앱 template, `FIXED_UI_DEPENDENCIES`(`@lophn/blueprint`, `@lophn/ui`, `@lophn/app-ui`, `@lophn/wording`, react, react-dom), `lophn-build-app` skill이 새 이름을 쓴다. template에 d3 pin 넷이 더해졌다(`@lophn/ui/data`가 사본 안에서 import한다).
  - Avatar, VendorIcon, TabStrip은 `packages/shell/renderer/parts/`로 옮겼다. 쓰는 곳이 gallery뿐이던 Chip, AuthorMark, LauncherFrame, OverviewFrame, `folderOpenIcon`과 wording key `common.author.label`, `common.label.more-waiting`은 지웠다.
  - gallery는 Kit(분류마다 page 하나, 모든 component를 실제 component로 상태별로), Screens(제품 영역 9개), Drafts(승인 전 실험) 묶음이다. `pages/kit/`, `pages/screens/`, `mock/`, `drafts/`로 나뉜다. page는 영역 file 한 곳에 적고 badge는 없다. page id는 그대로다.
  - `deno task check`의 step `kit`(`tools/check-kit.ts`)이 셋을 본다: wireframes의 CSS는 `drafts/`와 gallery 틀 둘에만 있다, 분류 `mod.ts`의 component가 모두 kit page에 나온다, design component가 분류 폴더 안에 있고 한 줄 문서가 있다.
why: |
  wireframe gallery를 정본으로 사람이 component를 보고 승인하고, 범용 component는 한 곳에서 lophn 화면과 사용자 앱에 같이 나가게 하려고. agent는 분류 이름 8개로 재사용할 component를 찾는다.
decisions:
  - text: |-
      범용인지는 "사용자 앱도 그대로 쓸 만한가"로 가른다. lophn만의 뜻(session, agent, harness·provider)이 박힌 것은 renderer, lophn과의 약속(app-api, `lophn:render-error`)을 아는 것은 sdk, 쓰는 곳이 gallery뿐인 것은 지운다. component마다의 분류와 범용·전용은 이 기준으로 정했다(TabStrip·Avatar·VendorIcon은 renderer, FileIcon은 design primitives, Toast·ToastProvider는 overlay).
    by: agent
  - text: |-
      남는 sdk UI package 이름은 `@lophn/app-ui`다. `@lophn/tokens`도 재export뿐이라 지웠다.
    by: agent
  - text: |-
      gallery 안 Orders 앱 view는 사용자 앱이 그리는 그림이라 design `Table`로 바꾸지 않고 CSS째 `drafts/`에 둔다. 버린 길: `Table`에 사용자 정의 칸을 더한다(kit API가 넓어진다).
    by: agent
  - text: |-
      `pm-session`(Contexts 화면)의 글 링크는 renderer에 같은 component가 없어 `drafts/link.tsx`를 쓴다.
    by: agent
  - text: |-
      사람의 gallery `pages/kit` 승인은 이 항목을 쓸 때 아직 받지 않았다. 다르게 보면 그 component만 옮긴다.
    by: person
follow_up: |-
  - 앱 template의 import 이름이 바뀌었다. 옛 template으로 만든 개발 앱은 지우고 다시 만든다.
  - data root에 sdk 사본과 앱 template을 까는 코드가 없고, release bundle이 npm package를 두 번 담아 file 수 상한에 걸린다(`issues/platform.md`). 설치 사본에서 `@lophn/ui/<분류>`가 풀리는 것은 사본을 손으로 깔아 확인했다.
