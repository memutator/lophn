id: phone-sidebar-sessions-and-dots-differ-from-desktop
title: 폰의 sidebar가 보이는 session, 그 순서, 상태 점이 desktop과 다르다
kind: bug
status: open
topic: remote
modules: [packages/mobile, packages/shell/renderer]
now: |
  폰은 자기 규칙을 따로 가진다(`packages/mobile/src/data/workspaces.ts`의 `workspacesOf`, `parts/session-dot.ts`). desktop의 규칙은 `packages/shell/renderer/shell/left-sidebar-workspaces.ts`의 `sidebarWorkspaces`와 `parts/agent-session/agent-session.tsx`의 `activityDot`이고 `architecture/workspace-layout.md`가 적는다. 다른 점:
  - 지금 목록에 드는 것: desktop은 탭이 열렸거나 상태 점이 있는 session(도는 중, 기다리는 중, 못 본 turn 끝)이다. 폰은 쉬지 않는 session과 쉰 지 하루 안의 session이다. 1~7일은 Recent, 더 오래된 것은 뺀다.
  - Recent: desktop은 보고 있는 workspace 아래에 접힌 Recent를 둔다. 폰의 sidebar는 Recent를 그리지 않고 project·앱의 Sessions 탭과 검색에만 있다.
  - 순서: desktop은 만든 순으로 자리를 지킨다. 폰은 최근 움직인 순이라 줄이 오르내린다.
  - 끝난 session: 폰은 끝난 이유가 있는 session(archived, exited, lophn이 멈춤)을 sidebar, Recent, 검색에서 모두 뺀다. desktop은 Recent로 보낸다.
  - 상태 점: desktop은 도는 중이 ink 색으로 숨 쉬는 점, 못 본 turn 끝이 초록, 끝남이 회색이다. 폰은 도는 중이 초록 점이고 못 본 turn 끝과 끝남은 점이 없다. 폰 code는 `SessionEntry.unseen`을 읽지 않고 대화를 봐도 `unseen/dismiss`를 부르지 않는다. `SESSION_DOT`의 `failed`(빨강)는 만드는 곳이 없다.
  - 기다림: 폰은 Inbox에 기다리는 것이 있으면 session 상태보다 먼저 기다림으로 보인다.
  - 그 밖: desktop의 desk 묶음, 새 session draft 줄, 사람 차례인 workflow 줄, 저장된 터미널 coding session이 폰에는 없다(폰은 layout을 읽지 못하고 live 터미널만 안다).
impact: |
  같은 session이 desktop과 폰에서 다른 자리에 있고, 폰에서는 초록 점이 "도는 중"인데 desktop에서는 "끝났고 아직 안 봄"이라 같은 색이 반대 뜻이다. 폰에서는 방금 끝난 일을 점으로 알 수 없고, 폰에서 대화를 봐도 desktop의 못 본 점이 지워지지 않는다. 끝난 session은 폰에서 찾을 수 없다.
fix: |
  - 중간(추천): 폰이 desktop 규칙의 탭 없는 경우를 쓴다. 지금 목록은 도는 중·기다리는 중·못 본 turn 끝, 나머지는 7일 안 Recent(끝난 것 포함), 만든 순으로 자리를 지킨다. sidebar에 접힌 Recent를 그린다. 점은 `activityDot`과 같은 뜻과 색으로 맞추고 `unseen`을 읽고 대화를 보면 `unseen/dismiss`를 부른다. 고르기와 순서의 순수 함수를 DOM 없는 file로 꺼내 desktop과 폰이 같이 쓴다(이슈 `phone-copies-desktop-pure-helpers`와 같은 방법). 죽은 `failed`를 지운다.
  - 작음: 점의 뜻과 색만 맞추고(`unseen` 읽기 포함) 목록 규칙은 그대로 둔다.
decided: |
  desktop의 규칙을 따른다(사람: sidebar에서 session이 보이는 규칙과 indicator가 desktop과 다르다). desk 묶음, draft 줄, 저장된 터미널처럼 폰이 layout을 읽지 못해 생기는 차이는 이 이슈에서 다루지 않는다.
