id: phone-carry-keep-ignores-unsaved-computers
title: 폰이 나르는 file을 지우는 규칙이 폰이 저장하지 않은 명단의 컴퓨터를 세지 않는다
kind: bug
status: fixed
topic: folder-sync
modules: [packages/mobile]
now: |
  `prune`(`packages/mobile/src/apps/carry/carry.ts`)은 "폰이 아는 모든 컴퓨터가 그 file이 실린 manifest를 갖고 바라지 않으면" file을 지운다. 그 "모든 컴퓨터"는 `followCarry`(`packages/mobile/src/data/local-stores.ts`)가 `carry.roster`로 넘기는, 폰이 저장한 컴퓨터 가운데 기계 id가 있고 엇갈리지(`disputed`) 않은 것뿐이다. 명단에는 있지만 폰이 아직 저장하지 않은 컴퓨터(폰에 아직 이 컴퓨터의 주소와 기계 id가 오지 않았거나 그 컴퓨터에 폰이 붙은 적이 없다)는 세지 않는다.
impact: |
  명단에 든 세 번째 컴퓨터를 폰이 모르는 동안, 폰은 아는 컴퓨터가 다 받았다고 보고 그 file을 지운다. 세 번째 컴퓨터는 그 file을 폰으로 받지 못하고 연결이나 사람의 폴더로 닿을 때까지 기다린다. 데이터를 잃지는 않지만 폰이 맡던 길 하나가 그 컴퓨터에는 없어진다.
fix: |
  - 작음(추천): 폰이 든 명단(`roster.json`, 폰이 컴퓨터에서 받는 명단 statement)의 컴퓨터 기계 id를 `carry.roster`에 같이 넘겨 저장하지 않은 컴퓨터도 센다. 오래 닿지 않는 컴퓨터가 file을 붙들지 않게 나이 한도(30일)는 그대로 둔다.
  - 큼: 폰이 각 컴퓨터에 보낸 file을 기록한다. 지금 규칙으로 충분해 추천하지 않는다.
closed: |
  carry 보관 판단이 로컬 저장 목록뿐 아니라 명단(roster.json)의 아직 저장되지 않은 신뢰 컴퓨터도 함께 센다.
guard: packages/mobile/src/apps/carry/carry.test.ts
