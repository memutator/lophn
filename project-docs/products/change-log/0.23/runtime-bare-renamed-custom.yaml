id: runtime-bare-renamed-custom
version: 0.23.10
title: agent runtime `bare`를 `custom`으로 바꾼다
modules: [packages/protocol, packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/main, packages/core/router, packages/shell/renderer, packages/design, packages/cli, packages/sdk, tools]
change: |
  - agent 정의의 `runtime` 값이 `lophn | custom | claude-code | codex | opencode`다. `bare`는 없어졌고 옛 이름 읽기는 없다. 뜻은 그대로다: system은 정의 본문뿐이고 사람이 고른 tool·skill만 싣고 상한은 lophn과 같다.
  - 저장된 정의는 data step `agents.runtime-custom`이 기동 때 frontmatter의 `runtime: bare` 한 줄을 `runtime: custom`으로 옮긴다(`agents.handle` 바로 뒤, 정의를 schema로 읽는 다른 step보다 앞).
  - 편집기 Runtime 항목은 "Custom"이다(i18n `agents.label.runtime-custom`, `agents.notice.skills-custom-pick`). CLI `agent create` 도움말, wireframe(`agent-settings-custom`)과 fake data도 같다.
  - core wiring `bare-reply`는 `custom-reply`(machine 자격 `machine:custom-reply`, 로그 component `custom-reply`)다. flow id `bare-call-reply`, `bare-reply-auto`, `tool-list-assembly:bare-narrowed`도 custom으로 옮겼다.
  - 앱 agent가 읽는 지침(`@lophn/agent` guide, `design-app` skill, 앱 template)이 "custom agent"를 말한다. `@lophn/agent` 1.7.0(minor)과 `migrate-sdk` 메모 `agent-1.7.0.md`.
  - 앱 목록 예산 단계 `bare`(workspace 정보의 full/short/bare)는 다른 개념이라 그대로다.
why: |
  runtime 하나에 이름이 둘(제품 말과 코드 말)이면 안 된다. "bare"는 "아무것도 없다"로 읽혀 사람이 고르는 것만 싣는다는 뜻이 전해지지 않는다. 사람이 이름을 custom으로 정했다.
decisions:
  - text: >-
      runtime `bare`를 `custom`으로 바꾼다. 한 개념에 한 이름이라서다. 버린 길: 옛 이름을 별칭으로 계속 읽기(호환 장치를 만들지 않는 규칙, 옛 이름이 저장 파일에 남는다). 저장된 파일은 data step으로 옮긴다.
    by: person
  - text: >-
      이미 낸 change-log 항목과 닫힌 이슈는 옛 이름 그대로 둔다(기록). 열린 이슈 `bare-agent-must-pick-workflow-report`는 id를 바꾸지 않고(README 규칙) 글만 custom으로 고쳤다.
    by: agent
checklist:
  - Agents 화면에서 옛 bare agent가 Runtime "Custom"으로 열리고 저장되는지 본다
