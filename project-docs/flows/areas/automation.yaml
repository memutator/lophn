      - "at이 있으면 every가 d 단위여야 한다. 아니면 invalid_input. event job은 every나 at을 받지 않는다(때는 승인한 값이라 새 job으로 만든다)"
      - "주기나 시각이 바뀌거나 꺼진 job이 켜지면 지금 뒤의 첫 차례로 다시 센다. 놓친 것으로 치지 않는다"
      - "승인 전 job이면 next_due_at은 null로 둔다. 할 일(action)은 바꾸지 못한다"
    outcomes:
      - id: updated
        observe: [ledger:jobs, event:StateChanged, response, screen:jobs-tab-edit]
