id: app-test-check-detail-unreadable
title: app test 검사별 detail을 아무도 읽지 못한다
kind: defect
status: kept
topic: activation
modules: [packages/core/storage]
now: |
  검사마다의 이유와 증거는 verification의 `observations` blob에 있다. 그 칸은 `general_read: false`로 등록돼(`packages/core/problems/tests/blobs.ts`의 `TEST_BLOB_FIELDS`) `blob.read`가 어느 actor에게도 주지 않는다(`packages/core/storage/blobs/refs.ts`의 `generalReadAllowed`). `GetVerification`의 `detail: true`는 별도 권한을 보지만(`packages/core/problems/tests/reads.ts`의 `readVerification`) 허락돼도 hash만 든 같은 Verification을 돌려준다. 그래서 detail은 disk에서만 읽힌다.
impact: |
  검사가 떨어진 이유를 coding agent와 사람이 화면·CLI로 볼 수 없다. 계획 `rewind-check` 진단은 data root의 blob 파일을 직접 열어 원인을 찾았다. fail 이유 한 줄에 검사별 이유를 실어 지금 필요한 만큼은 보인다. 증명 못 한 write tool도 같은 까닭에 core가 app test pass 이유 한 줄을 parse해 읽는다(`packages/core/problems/tests/unproven.ts`의 `unprovenOfReason`).
fix: |
  - 그대로 둔다(비용 0). fail 이유 한 줄이 검사별 이유를 싣는다. 추천.
  - `detail: true`가 허락된 자격에 observations 내용을 싣는다(작음~중간. 그 blob에 앱 출력이 들어 있어 누가 읽을지 정해야 한다).
closed: |
  남긴다. 검사가 떨어지면 fail 이유 한 줄이 검사별 이름과 이유(`필수 검사 N개가 통과하지 못했다: <검사>(<이유>)`, `app-test/judge.ts`의 `judgeAppTest`)를 싣고 coding agent와 사람은 그 줄을 읽는다. 증명 못 한 write tool도 pass 이유 한 줄에 실려 core가 그 줄을 읽는다(`unprovenOfReason`). observations blob의 원문(앱 출력이 든다)은 읽을 사람이 필요해질 때 `detail: true` 자격과 함께 정한다.
guard: 없음
