id: image-only-pending-message-blank
title: 일하는 중 보낸 이미지만 든 사람 메시지가 대기 줄에서 빈 줄로 보인다
kind: bug
status: fixed
topic: shell
modules: [packages/shell/renderer, packages/core/lophn-agent]
now: |
  `MessageReceived` event의 `body`는 글 block만 이은 글이다(`packages/core/lophn-agent/run-loop/work.ts`의 `blocksText(input.body)`). live 경로(`packages/shell/renderer/conversation/agent-tab-data.ts`)는 그 글로 대기 메시지의 `summary`를 채운다. 그래서 agent가 일하는 중에 이미지만 붙여 보낸 메시지는 snapshot을 다시 읽기 전까지 대기 줄이 비어 있다. snapshot 경로는 본문 part로 `[image]`를 보인다.
impact: |
  사람은 방금 보낸 메시지가 대기 줄에 빈 줄로 보여 무엇을 보냈는지 알아보지 못한다. 데이터는 잃지 않는다.
fix: |
  - event의 `body`를 `blocksSummary(input.body)`로 채운다(작음, core 한 줄). live 메시지 목록도 본문을 읽기 전까지 `[image]`를 보인다.
  - event에 block을 싣는다(중간, event 계약이 바뀐다).
  - 추천: 앞의 것.
closed: |
  `MessageReceived`의 `body`는 block 배열이고(`packages/protocol/events/agent.ts`) `run-loop/work.ts`가 그대로 싣는다. 대기 줄의 `summary`는 `conversation/thread-layout.ts`가 `blocksSummary(queued.content)`로 채워 이미지만 든 메시지도 `[image]`로 보인다.
guard: 없음
