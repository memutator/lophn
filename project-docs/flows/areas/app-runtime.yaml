  - id: app-oauth-sign-in
    title: "사람이 앱 OAuth sign-in을 시작하거나 취소한다"
    actor: person
    entries: [route:apps/oauth_begin, route:apps/oauth_cancel]
    pre: [app-oauth-client-set:stored]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "begin: 사람만 부른다. 선언에 oauth 블록이 있고 사람이 이 secret의 grant를 허락했어야 한다(아니면 forbidden)."
      - "client id가 있어야 한다. loopback callback 자리를 열고 PKCE authorize URL을 만든다."
      - "URL을 돌려준다. shell이 OS browser로 연다. 결과는 callback(app-oauth-callback)이 받고 화면은 oauth_state로 읽는다."
      - "cancel: 진행 중인 시도를 버린다. 진행 중인 시도가 없었으면 cancelled가 false다."
    outcomes:
      - id: url-returned
        observe: [response]
      - id: cancelled
        observe: [response]
      - id: nothing-to-cancel
        observe: [response]
      - id: not-granted
        code: forbidden
        when: "이 secret의 grant가 허락되지 않음"
        observe: [response]
      - id: no-client-id
        code: invalid_input
        when: "client id가 없음"
        observe: [response]
      - id: not-declared
        code: not_found
        observe: [response]
      - id: listener-unavailable
        code: unavailable
        when: "loopback callback 자리를 열지 못함"
        observe: [response]
    crosses_process: false
    risk: [secret, permission]
    refs: [H10]

  - id: app-oauth-callback
    title: "브라우저의 sign-in 응답을 받아 token으로 바꿔 보관한다"
    actor: system
    entries: [system:app-oauth-callback]
    boundary: [secrets, app-runtime]
    code: [packages/core/lophn-agent/extensions/mcp-auth.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts, packages/core/apps/oauth/service.ts]
    steps:
      - "sign-in을 시작하면 core가 loopback callback을 background로 기다린다. 사람이 browser에서 허락한다."
      - "callback의 state가 시작할 때 것과 다르면 state_mismatch로 끝낸다."
      - "authorization code를 token으로 바꾼다(PKCE). 실패하면 exchange_failed, 기다리는 시간을 넘기면 callback_timeout이다."
      - "access token은 선언한 이름에, refresh와 meta는 app-oauth.<이름>.refresh|meta에 둔다. 보관이 실패하면 store_failed다."
      - "성공하면 signed_in이다. 상태는 메모리에 있고 화면은 oauth_state로 읽는다."
    outcomes:
      - id: signed-in
        observe: ["disk:secrets.json"]
      - id: failed-callback-timeout
        observe: [response]
      - id: failed-state-mismatch
        observe: [response]
      - id: failed-exchange
        observe: [response]
      - id: failed-store
        observe: ["disk:secrets.json"]
    crosses_process: false
    risk: [secret]
    refs: [H10]
    docs: [architecture/app-call.md]
    unclear:
      - "실패 이유는 메모리 failures map에만 있어 core가 다시 켜지면 사라진다(issues/app-call.md 첫 항목)."

  - id: app-oauth-sign-out
    title: "사람이 앱 OAuth sign-in을 지운다"
    actor: person
    entries: [route:apps/oauth_sign_out]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts]
    steps:
      - "사람만 부른다. 진행 중인 sign-in 시도를 버린다."
      - "access token, refresh, meta를 지운다. client id와 client secret은 남긴다."
      - "다음 secret 전송은 sign-in-required가 된다(app-secret-value)."
    outcomes:
      - id: signed-out
        observe: ["disk:secrets.json"]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "secret 저장소를 쓰지 못함"
        observe: [response]
    crosses_process: false
    risk: [data-loss]
    refs: [H10]

  - id: app-oauth-state
    title: "앱 OAuth 상태를 읽는다"
    actor: person
    entries: [route:apps/oauth_state]
    boundary: [secrets, app-runtime]
    code: [packages/core/apps/oauth/service.ts, packages/core/lophn-agent/extensions/mcp-oauth.ts]
    steps:
      - "지금 release 선언에서 oauth 블록이 있는 secret마다 한 줄을 만든다."
      - "상태는 none, in_progress, signed_in, failed 가운데 하나다. failed면 이유가 있다. 값은 없다."
      - "상태는 메모리 report라 core가 다시 켜지면 failed 이유가 사라진다(issues/app-call.md)."
    outcomes:
      - id: listed
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: not-found
        code: not_found
        observe: [response]
    crosses_process: false

  # ---------- broker: net, notify, problem ----------

  - id: app-broker-net-fetch
    title: "앱 SDK의 외부 HTTP 요청을 supervisor broker가 보낸다"
    actor: app
    entries: [system:app-broker-net-fetch]
    uses: [route:app_grants/list, sdk:cap-net/netFetch]
    pre: [app-record-started:started]
    boundary: [app-capability, app-runtime]
    code: [packages/core/apps/permissions/broker/net-fetch.ts, packages/core/apps/permissions/broker/access.ts, packages/core/apps/permissions/effective.ts]
    steps:
      - "앱의 netFetch가 host, port, method, path, header, 본문을 broker의 net/fetch에 보낸다."
      - "입력 모양을 검사한다. Authorization, Cookie, Host 같은 header와 GET, HEAD의 본문은 schema가 거절한다. host는 정확한 host여야 한다."
      - "운영 자식이고 지금 release의 command 목록에 있으며 (host, port)가 선언 ∩ grant(플랫폼 port 제외)에 있어야 한다. 아니면 forbidden(net.fetch)이다."
      - "요청을 보낸다. redirect는 한 단계마다 같은 검사를 다시 받는다. https에서 http로 내려가거나 grant 밖이면 거절한다."
      - "secret이 필요하면 secret 흐름이 같은 요청에 붙인다. 응답은 1 MiB 이하의 글이나 JSON만 앱에 준다."
    outcomes:
      - id: fetched
        observe: ["request:external-host", response]
      - id: refused
        code: forbidden
        when: "선언 ∩ grant 밖, command 아님, 운영 자식 아님, redirect가 grant 밖, https에서 http로 내려감(details.permission은 net.fetch)"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
      - id: request-failed
        code: unavailable
        when: "연결 실패, redirect 대상이 없거나 너무 많음, 응답이 너무 큼"
        observe: [response]
    crosses_process: true
    risk: [sandbox, permission]

  - id: app-broker-notify
    title: "앱이 사람에게 알림이나 tray 값을 보낸다"
    actor: app
    entries: [system:app-broker-notify]
    uses: [route:notices/post, route:app_tray/set, route:app_grants/list]
    pre: [app-record-started:started]
    boundary: [app-capability, app-runtime]
    code: [packages/core/apps/permissions/broker/notify.ts, packages/core/apps/permissions/broker/access.ts]
    steps:
      - "앱의 notify나 setTray가 broker의 notify/send나 notify/tray에 보낸다."
      - "운영 자식이고 현재 선언 ∩ grant에 notify.send가 있어야 한다. 아니면 forbidden이다."
      - "알림은 core notices.post를, tray는 app_tray.set을 그 자식의 app credential로 부른다. 앱은 내용만 정하고 앱 이름은 자식 연결이 정한다."
      - "받는 쪽은 사람뿐이다. agent나 core 로직에 사실을 보내는 길이 아니다."
    outcomes:
      - id: notified
        observe: ["event:NoticePosted", "ledger:notices"]
      - id: tray-set
        observe: ["event:AppTrayChanged"]
      - id: refused
        code: forbidden
        when: "notify.send 허락이 없음, 운영 자식이 아님"
        observe: [response]
      - id: invalid-input
        code: invalid_input
        observe: [response]
    crosses_process: true
    risk: [permission]

  - id: app-broker-problem
    title: "앱이 잡은 예외를 앱 log에 쓴다"
    actor: app
    entries: [system:app-broker-problem]
    uses: [sdk:cap-problem/createExceptionObserver, sdk:cap-problem/reportProblem]
    boundary: [problems, app-runtime]
    code: [packages/core/apps/permissions/broker/problems.ts, packages/core/main/app-supervisor/log-redact.ts]
    steps:
      - "앱 SDK의 exception observer가 잡히지 않은 예외를 broker의 observe-exception에 보낸다. reportProblem은 stdout 줄로 남고 supervisor가 app-log-write로 쓴다."
      - "본문 모양을 검사한다. grant 판정은 없다. 앱은 자기 log에만 쓴다."
      - "stack을 봉인 bundle의 source map으로 원래 source 줄로 푼 뒤 쓴다."
      - "exception <name>: <message> 한 줄과 frame마다 '  at <path>:<line>:<column>' 줄을 같은 invocation으로 붙인다."
    outcomes:
      - id: written
        observe: ["log:app"]
      - id: invalid-input
        code: invalid_input
        observe: [response]
    crosses_process: true
    refs: [A15]

