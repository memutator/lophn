      - id: unavailable
        code: unavailable
        when: "page를 든 host가 없고 띄울 길이 없거나 띄우지 못했다, 또는 기한 안에 page를 만들지 못했다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch와 page view 둘 다: agent 자격), 또는 터미널 입력 허락이 없는 기기다(기기가 아닌 사람 token 포함)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/browser-tab.md, architecture/remote.md]

  # ---- core가 가진 터미널(terminals/*): desktop 화면과 폰이 같이 쓴다 ----
  - id: terminals-read
    title: 화면이 core가 가진 터미널 목록, 다시 붙을 때의 화면, 저장한 coding agent session을 읽는다
    actor: person
    entries: [route:terminals/list, route:terminals/snapshot, route:terminals/saved_sessions]
    boundary: [core]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
      - packages/core/terminal-agents/session-store.ts
      - packages/core/main/daemon/wiring/terminal-agents.ts
    steps:
      - "list는 core가 가진 터미널의 runtime이다(project로 거를 수 있다). 창이 없을 때 연 터미널도 있다"
      - "snapshot은 PTY host가 파싱해 둔 화면이다. after_seq 뒤 출력이 있으면 화면을 직렬화한 chunk 하나와 그 화면이 담은 마지막 seq, 없으면 빈 output이다. 화면은 이 seq 뒤 TerminalOutputAppended만 이어 쓴다"
      - "saved_sessions는 그 project에서 hook이 session id를 알려 준 coding agent session, 새것부터다"
    outcomes:
      - id: ok
        observe: [response]
      - id: not_found
        code: not_found
        when: "snapshot의 터미널을 core가 모른다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "snapshot에 PTY host가 답하지 않았다(host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminals-open
    title: 사람의 화면이나 폰이 project 폴더에 터미널을 연다(창이 없어도 열린다)
    actor: person
    entries: [route:terminals/open]
    boundary: [core, host-queue-interface]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "같은 key는 같은 답이다(PTY를 다시 열지 않는다)"
      - "project의 등록 폴더를 다시 읽고 cwd가 그 안인지 본다. folder_ref는 core가 정한다(<project>_<index>)"
      - "core의 PTY host에 터미널을 연다. env에 LOPHN_WORKSPACE, LOPHN_SESSION_ID(term:<터미널>), 사람의 login env와 lophn 경로, 터미널마다 더하는 env(hook, browser bridge)를 싣는다"
      - "command나 resume이 있으면 첫 출력 뒤 300ms 잠잠할 때(늦어도 5초) 한 번 친다. 친 것이 거절돼도 열기는 실패가 아니다"
      - "tab이 있으면 host queue에 그 project의 tab_open {terminal: {terminal_ref}}를 넣는다. 그 project를 보이는 창이 없으면 탭은 기다리고 터미널은 그대로 돈다"
    outcomes:
      - id: opened
        observe: [response, event:TerminalRuntimeChanged]
      - id: tab-queued
        when: "tab을 주었다"
        observe: [request:shell, response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다"
        observe: [response]
      - id: not_found
        code: not_found
        when: "project가 없다"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "폴더가 없거나(no_folder), 폴더가 아니거나(not_directory), cwd가 등록 폴더 밖이거나 읽지 못한다(unreadable). details.reason이 이유다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY를 띄우지 못했거나(spawn_failed) PTY host가 답하지 않았다(host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminals-close
    title: 화면이 터미널을 끝낸다
    actor: person
    entries: [route:terminals/close]
    boundary: [core]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "지금 generation의 터미널만 끝낸다. PTY host가 SIGHUP 뒤 SIGKILL까지 보내고 exited runtime을 준다"
      - "터미널마다 더했던 env(hook key, bridge)는 그 터미널이 끝나면 거둔다"
    outcomes:
      - id: closed
        observe: [response, event:TerminalRuntimeChanged]
      - id: not_found
        code: not_found
        when: "core가 그 터미널을 모른다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "지금 generation이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "끝난 것을 확인하지 못했거나(kill_unconfirmed) PTY host가 답하지 않았다(host_lost)"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
    crosses_process: true
    docs: [architecture/terminal-agent.md]

  - id: terminals-restart
    title: focus한 창의 사람이 같은 터미널의 shell을 다시 띄운다
    actor: shell
    entries: [route:terminals/restart]
    boundary: [core]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "shell main이 focus 검사를 한 뒤 control connect {client: shell}이 준 capability를 실어 부른다. 살아 있는 capability가 아니면 거절한다"
      - "지금 generation의 터미널을 같은 env로 다시 띄운다. generation이 오르고 옛 출력은 버린다"
    outcomes:
      - id: restarted
        observe: [response, event:TerminalRuntimeChanged]
      - id: forbidden
        code: forbidden
        when: "shell_capability가 살아 있는 값이 아니다, 또는 사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "core가 그 터미널을 모른다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "지금 generation이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY를 띄우지 못했거나(spawn_failed) PTY host가 답하지 않았다(host_lost)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/terminal-agent.md]

  - id: terminals-input
    title: focus한 창의 사람이나 입력을 허락받은 기기가 터미널에 친다
    actor: person
    entries: [route:terminals/input]
    boundary: [core]
    code:
      - packages/protocol/coding-agent/terminals.ts
      - packages/core/terminals/routes.ts
      - packages/core/terminals/service.ts
      - packages/core/main/daemon/wiring/terminals.ts
    steps:
      - "부른 principal이 기기면 그 기기의 터미널 입력 허락(terminalInputGrant)이 있어야 한다. 기기가 아니면 살아 있는 shell_capability(focus 검사를 거친 shell main)가 있어야 한다. 둘 다 아니면 PTY에 아무것도 가지 않는다. agent 자격은 dispatch가 막는다"
      - "generation을 주면 지금 generation일 때만 친다. 같은 key는 터미널마다 기억해 한 번만 친다"
      - "respond가 아니면 사람 입력이라 tracker가 끊기 key를 본다. respond(xterm의 질의 답)는 사람 입력으로 세지 않는다"
    outcomes:
      - id: sent
        observe: [response]
      - id: deduplicated
        when: "같은 key를 다시 보냈다"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "입력 허락이 없는 기기다, 기기가 아닌데 살아 있는 shell_capability가 없다, 또는 사람 자격(actor user)이 아니다(dispatch)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "core가 그 터미널을 모른다"
        observe: [response]
      - id: conflict
        code: conflict
        when: "준 generation이 지금 것이 아니다"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "PTY host가 답하지 않았다(host_lost)"
        observe: [response]
    crosses_process: true
    risk: [permission]
    docs: [architecture/terminal-agent.md, architecture/remote.md]

  - id: terminals-resize
    title: 화면이 보이는 칸의 크기를 PTY에 준다(폰이 잡은 크기를 놓는다)
    actor: person
    entries: [route:terminals/resize]
    boundary: [core]
    code:
