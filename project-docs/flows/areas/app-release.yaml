      - "복구본을 만든 시도면 복원 기록이 있어야 닫는다. 없으면 conflict다. 데이터가 바뀐 채 닫지 않는다"
      - "release를 failed로 바꾸고 실패 근거(code, summary, 복원 여부)를 남긴다"
      - "이 release의 돌아가기 요청 행(activation_requests)을 지운다"
      - "release_failed 알림을 같은 tx에 남긴다. 복원했으면 이전 release가 돌아왔다는 말을 붙인다"
