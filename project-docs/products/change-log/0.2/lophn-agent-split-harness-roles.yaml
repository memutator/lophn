id: lophn-agent-split-harness-roles
version: 0.2.0
title: "lophn-agent를 harness, role 층, domain tool로 나눔"
modules: [packages/core/lophn-agent, packages/core/agent-workspaces, packages/core/apps, packages/core/projects, packages/core/main, packages/protocol, tools]
checked: [architecture-approval, architecture-activation, architecture-agent-call, architecture-app-call, architecture-coding-agent, tool-dev, tool-context-review]
change: |
  전: `packages/core/lophn-agent` 한 module에 harness(loop, tool registry, prompt 조립 틀), 범용 tool, lophn domain(role별 tool 목록과 prompt, place 규칙, domain tool 정의)이 섞여 있었다. tool 하나를 더하려면 중앙 `protocol/lophn-agent/tool-catalog.ts`(`TOOL_INPUTS`, role 목록)와 `tools/bundles/`, `tools/builtin.ts`를 같이 고쳤다. `lophn-agent/register.ts`가 projects·apps 표를 SQL로 직접 읽었고 `lophn-agent>projects` 층 예외가 있었다.
  후:
  - domain tool 정의는 domain에 있다: `apps/agent-tools/`(ticket, app, package, release, visual), `problems/agent-tools.ts`. 입력 schema는 정의 옆에 두고, 정의 file은 protocol, base, `lophn-agent/tools/spi.ts`만 import한다.
  - 새 core module `agent-roles`(role 층)가 role별 tool 목록과 `TOOL_ORDER`, role 규칙이 든 tool 13개(guide, settings, instructions, operator, context, glossary), credential의 role 몫, role prompt·guide와 `PRODUCT_INSTRUCTIONS`, place 정보, role 명령, Operator place 규칙, file tool hook(`LOPHN.md` Gate, rewind 기록), 앱 등록 때 built-in agent 만들기를 갖는다.
  - harness는 role 이름과 domain route를 모르고 조립이 넘긴 것으로 돈다: tool 정의 목록(`main/agent-tools.ts`), role tool 목록, role prompt, place 재료, credential 상한, `FileHooks`. reader·writer Worker가 싣는 팀 file은 `main/daemon/wiring/lophn-agent-team.ts`이고 projects·apps의 `lookups.ts`와 role 명령을 `register.ts` factory에 꽂는다.
  - `tools/check-deps.ts`가 층을 지킨다: harness → role 층·domain 금지, role 층 ↔ domain 금지(rule `core-layer`), harness 폴더의 domain protocol import와 role 이름(rule `harness-domain`, 남은 25개 file은 `HARNESS_LEFTOVERS`로 이유와 함께 면제), tool 정의 file의 import 범위(rule `tool-file`). `lophn-agent>projects` 예외는 없어졌다.
  - agent가 보는 tool 이름, 입력 schema, 순서, role별 목록, prompt 글, credential 상한은 같다. task마다 role 4개 × model 입력 둘의 tool snapshot과 prompt bytes를 전후로 비교했다.
why: |
  빨리 변하는 agent 기술(provider, tool calling, caching)과 천천히 변하는 업무 규칙을 가르고, domain tool 하나를 그 domain과 protocol, role 목록 한 줄에서 끝내려고. 동작 변화 둘(credential 상한을 route 이름으로, 정의 hash)은 `agent-credential-route-names` 항목에 있다.
decisions:
  - text: |-
      role 층은 `lophn-agent` 안 하위 폴더가 아니라 새 module `packages/core/agent-roles`다. 하위 폴더면 check가 harness와 role 층을 path로밖에 못 가른다. 이름은 이미 있던 boundary `agent-roles`를 썼다(가칭 `agents`는 이미 있는 boundary와 겹친다).
    by: agent
  - text: |-
      context·glossary tool은 projects가 아니라 role 층에 둔다. role마다 보이는 context를 가르는 규칙 자체이고 prompt 조립을 쓴다. 그래서 `agent-tool-spi`의 provided_by는 `apps`, `problems`, `agent-roles`다.
    by: agent
  - text: |-
      `ToolContext`의 `role`·`place`·`agent`·`router`는 묶지 않는다. 범용 `call` tool과 Gate intent가 읽고, type은 protocol의 것이라 harness가 role 이름 문자열을 갖게 되지는 않는다.
    by: agent
  - text: |-
      lophn tool과 coding agent CLI를 한 정의로 내지 않는다. 둘은 이미 같은 route를 쓰고, 감싸는 코드를 합치면 CLI 출력·인증과 얽혀 일이 커진다.
    by: agent
  - text: |-
      `tools/questions/`와 `extensions/`의 domain 섞임, `projects>apps` 예외는 이번에 손대지 않았다.
    by: agent
  - text: |-
      못 옮긴 harness file은 예외 목록으로 드러내고 새 위반만 막는다. 다른 module의 표를 SQL로 직접 읽게 바꾸지 않는다.
    by: agent
follow_up: |-
  남은 harness file 25개와 `instructions/files.ts`의 숨은 SQL은 `issues/layers.md`. 개발 data는 지우지 않아도 된다(schema 변경 없음).
