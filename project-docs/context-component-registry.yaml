# lophn — Context Component Registry
#
# 이 저장소에서 일하는 agent에게 주는 context 조각의 목록이다. 조각마다 무엇이고 어디 있고, 누가 쓰고,
# 무엇이 바뀌면 이 조각도 바뀌어야 하는지를 적는다. 조각은 그것을 읽는(tool이면 돌리는) role의 절에 둔다.
#
# 흐름: plan(범위를 catalog ID로) → implement(commit이 path를 바꿈) → changelog(바뀐 module을 판마다)
#       → 이 목록에서 change_reasons가 걸린 조각을 다시 본다.
#       (changelog = project-docs/products/change-log/<x.y>/<id>.yaml)
#
# - roles: 이 저장소의 agent role(planner, lead, worker 등). lophn 제품 안의 agent가 아니다.
# - components: 조각. 첫 role의 절에 둔다.
#   - id: 영어 kebab-case. 파일 전체에서 하나.
#   - kind: 꼴과 실리는 방식. instruction(늘 실리는 지침), skill(작업 종류에 따라 실림), doc(필요할 때 읽는 설명),
#     catalog(ID 목록), record(쌓이고 닫히는 기록), plan(진행 중인 계획), tool(agent가 돌리는 script·CLI·npm script).
#   - roles: 이 조각을 읽는(돌리는) role. 첫 것이 주로 읽는 role이고 그 절에 둔다. 쓰는 쪽이 아니라 읽는 쪽이다.
#     worker는 lead가 넘긴 것(worker-prompt, task-brief)과 거기서 가리키는 것을 읽는다.
#   - path: 저장소 root 기준. 폴더면 끝에 /.
#   - run: tool만. agent가 치는 명령 한 줄.
#   - change_reasons: 이 조각을 바꾸게 만드는 변경. 이 조각이 무엇에 기대어 쓰였는지다.
#     - boundaries: boundary-catalog ID. 이 ID의 코드(module-catalog의 path)나 계약이 바뀌면 이 조각도 바뀌어야 한다.
#     - paths: catalog 밖의 path. 바뀌면 이 조각도 바뀌어야 한다.
#     - note: 위 둘로 못 적는 변경 한 줄(사람의 결정 등).
#     부모 ID는 자식을 포함하지 않는다. 넓게 걸면 늘 걸려서 아무도 보지 않는다.

schema_version: 2

roles:

  - id: all
    description: 이 저장소에서 일하는 모든 agent.

  - id: planner
    description: 사람과 무엇을 할지 정한다. 제품 범위, 이슈의 결정, 로드맵, change-log의 결정, release notes, context 유지보수.

  - id: lead
    description: 계획 하나를 task로 나눠 worker에게 맡기고, review해 main에 합치고, 이슈와 상태를 고친다.

  - id: worker
    description: task brief 하나를 받아 코드를 고치고 check를 통과시킨다.

  - id: designer
    description: wireframe gallery와 화면 모양, 화면 문구를 고친다.

  - id: runner
    description: eval experiment나 npm run eval을 돌리고, judge 채점을 item마다 새 subagent에게 시키고, run.md에 사실을 적는다.

  - id: experimenter
    description: eval experiment의 판정을 해석하고 원인을 가르고, 의심스러운 judge 판단을 짚고, 다음 spec 초안을 쓴다.

components:

  # ── all ──

  - id: agents-md
    kind: instruction
    roles: [all]
    description: 모든 작업에 실리는 저장소 지침. 속도, 위협 원칙, 문서 표, 코드 규칙, 사람에게 묻는 것.
    path: AGENTS.md
    change_reasons:
      paths: [package.json, tools/check.ts]
      note: 사람에게 묻는 것, worker model, 끝남 기준이 바뀔 때.

  - id: tool-check
    kind: tool
    roles: [all]
    description: 바뀐 package만 골라 fmt, lint, deps, source, modules, type check, style, kit, shell(fmt, lint, main, main test), test, token 생성물 비교를 돈다. docs(문서 속 path)와 records(이슈·change-log·architecture 문서 꼴)는 늘 돈다. 끝내기 전에 돌린다. 전체는 check:full.
    path: tools/check.ts
    run: npm run check
    change_reasons:
      paths: [package.json, tools/]
      note: check 단계를 더하거나 뺄 때.

  - id: tool-doctor
    kind: tool
    roles: [all]
    description: 개발 환경을 스스로 진단한다. Node·npm·git·Electron·sandbox, .env, telemetry env, dependency·binary, dev data root·port, core /readyz, 바깥 연결을 보고, --fix로 안전한 것만 고친다.
    path: tools/doctor/
    run: npm run doctor
    change_reasons:
      paths: [package.json, package-lock.json, tools/dev.ts, .env.example]
      note: check 목록이나 fix가 바뀔 때.

  # ── planner ──

  - id: product
    kind: doc
    roles: [planner]
    description: lophn이 무엇이고 무엇이 아닌가.
    path: project-docs/PRODUCT.md
    change_reasons:
      note: 제품 범위나 하지 않는 것이 바뀔 때. 코드 변경으로는 걸지 않는다.

  - id: agent-policy
    kind: doc
    roles: [planner]
    description: lophn 제품 안의 agent와 workspace, workspace마다의 책임, session 사이 call과 사람에게 올림의 정책.
    path: project-docs/products/AGENT.md
    change_reasons:
      boundaries: [agents, agent-workspaces, router, workflows, jobs]

  - id: roadmap
    kind: doc
    roles: [planner, lead]
    description: 아직 계획으로 열지 않은 큰 일. 주제 하나에 md 하나.
    path: project-docs/products/roadmap/
    change_reasons:
      note: 큰 일을 계획으로 열거나 버릴 때.

  - id: issues
    kind: record
    roles: [planner, lead]
    description: bug, defect, mistake. 이슈 하나가 yaml file 하나(`<id>.yaml`), 닫아도 두고 `status`(open, fixed, kept)만 바꾼다. 칸마다 지금·영향·고치려면·정할 것·정한 것·닫은 것. 목록은 `node tools/records.ts issues`.
    path: project-docs/issues/
    change_reasons:
      note: 이슈를 찾거나 고치거나 정할 때. 이슈의 modules가 바뀐 module을 가리키면 다시 본다.

  - id: changelog
    kind: record
    roles: [planner, lead]
    description: "일 하나가 바꾼 동작·계약과 결정을 바뀐 module과 함께 남긴 내부 기록. `<x.y>/<id>.yaml` 항목 하나가 일 하나, 결정은 `by: person | agent`. PATCH 판은 `packages/`를 바꾼 일을 올리는 agent가 올린다."
    path: project-docs/products/change-log/
    change_reasons:
      note: 동작이나 계약이 바뀌는 일, 결정이 있는 일이 끝날 때. 올라간 항목은 고치지 않고 틀렸으면 바로잡는 항목을 새로 쓴다.

  - id: release-notes
    kind: record
    roles: [planner]
    description: 사람이 읽는 판 요약(영어, 외부용). release(MINOR·MAJOR)할 때 지난 release 뒤 change-log 항목으로 `<x.y.z>.md` 초안을 쓰고 사람이 확인한다.
    path: project-docs/products/release-notes/
    change_reasons:
      note: 사람이 release를 말할 때. 코드 변경으로는 걸지 않는다.

  - id: boundary-catalog
    kind: catalog
    roles: [planner, lead]
    description: 경계와 공개 계약의 ID. 저장소의 메타데이터 축.
    path: project-docs/boundary-catalog.yaml
    change_reasons:
      paths: [packages/protocol/]
      note: 경계가 생기거나 없어지거나 계약의 정의·제공·사용 쪽이 바뀔 때.

  - id: module-catalog
    kind: catalog
    roles: [planner, lead]
    description: 코드 module path ↔ boundary ID.
    path: project-docs/module-catalog.yaml
    change_reasons:
      note: module 폴더가 생기거나 옮겨질 때. tools/check-modules.ts가 잡는다.

  - id: flow-catalog
    kind: catalog
    roles: [planner, lead, worker]
    description: lophn의 모든 동작. entry(route·CLI·tool·단축키·IPC·SDK·skill·control)를 소유하는 flow와 outcome, journey, 사용자 예(scenario), test file이 덮는 outcome. coverage를 잰다.
    path: project-docs/flows/
    change_reasons:
      paths: [packages/protocol/, packages/cli/commands/, packages/shell/ipc/, packages/sdk/, packages/core/agent-workspaces/skills/]
      note: entry나 test file을 더하거나 지울 때, 동작의 끝 갈래가 바뀔 때. tools/flows.ts check가 잡는다.

  - id: tool-flows
    kind: tool
    roles: [planner, lead]
    description: code에서 entry를 뽑고(entries), flow catalog의 참조와 빠짐, scenario 꼴을 보고(check), coverage를 잰다(report). frames --unused는 catalog가 가리키지 않는 wireframe frame. index는 prompt에 붙일 flow 목록, sample은 review용 표본.
    path: tools/flows.ts
    run: node tools/flows.ts report
    change_reasons:
      note: flow catalog의 꼴이나 entry 종류가 바뀔 때.

  - id: context-component-registry
    kind: catalog
    roles: [planner]
    description: 이 목록.
    path: project-docs/context-component-registry.yaml
    change_reasons:
      paths: [AGENTS.md, .claude/skills/, project-docs/, tools/]

  - id: tool-check-modules
    kind: tool
    roles: [planner]
    description: boundary-catalog의 ID·참조·칸과 module-catalog의 path·boundary·빠진 폴더를 본다. check의 modules 단계.
    path: tools/check-modules.ts
    run: node tools/check-modules.ts
    change_reasons:
      note: 두 catalog의 꼴이 바뀔 때.

  - id: tool-records
    kind: tool
    roles: [planner, lead, worker]
    description: issue·change-log yaml의 칸·id·modules·판 규칙(package.json 판의 항목이 있고 더 높은 판은 없다)과 architecture 문서의 꼴(필수 절, code path 금지)을 보고(check), 이슈와 항목의 목록을 낸다(issues, changes). check의 records 단계.
    path: tools/records.ts
    run: node tools/records.ts check
    change_reasons:
      paths: [project-docs/issues/README.md, project-docs/products/change-log/README.md, project-docs/architecture/README.md]
      note: 이슈·항목·architecture 문서의 꼴이 바뀔 때.

  - id: tool-check-docs
    kind: tool
    roles: [planner]
    description: AGENTS.md, .claude/skills/, project-docs/(change-log, release-notes, issues, plan/, products/roadmap/ 제외)의 backtick 저장소 path와 이 registry의 path·boundary·role이 있는지 본다. check의 docs 단계.
    path: tools/check-docs.ts
    run: node tools/check-docs.ts
    change_reasons:
      note: 문서나 registry의 꼴이 바뀔 때.

  - id: architecture-layers
    kind: doc
    roles: [planner, lead]
    description: 코드를 어떤 층과 조각으로 나누고 누가 누구를 import해도 되는지의 설계. 규칙이 막으려는 것과 check가 못 막는 곳.
    path: project-docs/architecture/layers.md
    change_reasons:
      boundaries: [core, lophn-agent, agent-workspaces, agent-tool-spi]
      paths: [tools/check-deps.ts]
      note: core module이 생기거나 층을 옮길 때.

  - id: architecture-event
    kind: doc
    roles: [planner, lead]
    description: 일어난 일의 세 부류(같은 tx에서 이어 할 일, ledger 기록 event, 메모리 Bus로 화면에 알리는 일)와 Bus·Gateway, 화면이 event를 받는 약속의 설계.
    path: project-docs/architecture/event.md
    change_reasons:
      boundaries: [events, storage, router, event-stream]

  - id: architecture-approval
    kind: doc
    roles: [planner, lead]
    description: '"해도 되나"를 정하는 설계: 시킨 것이 승낙이고 할당이 허락이라는 원칙, 판정(Gate), 사람에게 묻는 길 하나(turn 안 request), turn mode, shell 규칙, 앱 공유 요청, 팀 자식의 물음.'
    path: project-docs/architecture/approval.md
    change_reasons:
      boundaries: [approvals, agent-tools, agent-workspaces, jobs]
      paths: [packages/core/approvals/share-requests/, packages/core/main/daemon/wiring/assignment-file.ts, packages/core/main/daemon/wiring/share-requests.ts]

  - id: architecture-testing
    kind: doc
    roles: [planner, lead, worker]
    description: test 층 다섯과 가짜 셋이 무엇을 진짜·가짜로 두는지, 적게 쓰고 깨지면 곤란한 것만 가장 싼 층에서 본다는 원칙과 시간 예산의 설계. 운용은 write-test reference.
    path: project-docs/architecture/testing.md
    change_reasons:
      paths: [tests/support/, tools/check.ts, project-docs/plan/tools/lead/land.sh, package.json]
      boundaries: [app-releases, external-coding-agent, app-runtime]

  - id: architecture-eval
    kind: doc
    roles: [planner, lead, worker]
    description: "진짜 model로 agent의 판단을 재는 층의 설계: 시나리오가 world를 되살려 채점하는 흐름, 지키는 것(model·key·수치 규칙, 비용 상한), experiment의 판정 규칙. 돌리는 법은 eval-run reference."
    path: project-docs/architecture/eval.md
    change_reasons:
      paths: [tests/eval/, tests/support/core/]
      boundaries: [agent-tools, agent-workspaces, models]

  - id: architecture-activation
    kind: doc
    roles: [planner, lead]
    description: "앱 release를 켜는 순간의 설계: 켜는 계기, 사람에게 묻는 조건, 바꾸는 순서와 실패 때 앱이 반쯤 바뀐 채 남지 않게 되돌리는 약속."
    path: project-docs/architecture/activation.md
    change_reasons:
      boundaries: [app-releases, app-runtime, app-data]

  - id: architecture-agent-call
    kind: doc
    roles: [planner, lead]
    description: "agent 사이의 일 맡기기와 답하기를 하나의 봉투(call)로 푸는 설계: 받는 곳과 답 방식, 기다리지 않는 보낸 쪽, 실패, spawn과 팀 자식의 물음."
    path: project-docs/architecture/agent-call.md
    change_reasons:
      boundaries: [router, agent-sessions]

  - id: architecture-app-call
    kind: doc
    roles: [planner, lead]
    description: "사람, agent, 앱, job, flow가 앱의 operation과 command를 부르는 길의 설계: 같은 판정·기록·직렬화, changeset과 rewind, 앱 log, 공유 skill 읽기."
    path: project-docs/architecture/app-call.md
    change_reasons:
      boundaries: [app-runtime, app-data, app-capability]
      paths: [packages/protocol/apps/calls/, packages/core/apps/calls/, packages/core/apps/screens/skills.ts, packages/core/apps/releases/public-tools.ts]

  - id: architecture-package
    kind: doc
    roles: [planner, lead]
    description: "내장 SDK와 사용자 package의 설계: 정확한 판 고정, 읽기 전용 설치 사본·앱 사본, release 봉인, publish 순서, bundle blob 복구, permission 대조."
    path: project-docs/architecture/package.md
    change_reasons:
      boundaries: [package-registry, user-package, app-releases]
      paths: [packages/protocol/apps/packages.ts, packages/protocol/apps/package-routes.ts, packages/core/apps/packages/, packages/core/apps/releases/sdk-permissions.ts, packages/core/main/daemon/wiring/sdk-install.ts]

  - id: architecture-app-notice
    kind: doc
    roles: [planner, lead]
    description: "사람에게 알리는 기록(notices)의 설계: app·program 출처, 휘발·영구, 같은 key 대신하기, 남기는 기간, Inbox 줄과 toast, SDK 갱신 알림과 맡기기."
    path: project-docs/architecture/app-notice.md
    change_reasons:
      boundaries: [app-runtime]
      paths: [packages/protocol/apps/notice.ts, packages/core/apps/notices/, packages/sdk/cap-notify/, packages/core/apps/permissions/broker/notify.ts]

  - id: architecture-workspace-session
    kind: doc
    roles: [planner, lead]
    description: "agent가 놓이는 workspace(Home, project, 앱)와 session의 설계: 수명, fork·rewind가 가져가는 것, workspace마다의 file 범위와 지침 층, 이미지 묶음."
    path: project-docs/architecture/workspace-session.md
    change_reasons:
      boundaries: [agents, agent-workspaces, agent-sessions]
      paths: [packages/protocol/lophn-agent/workspaces.ts]

  - id: architecture-run
    kind: doc
    roles: [planner, lead]
    description: "화면 없이 부르는 agent 호출과 앱 tool 호출(run)의 설계: 기록 한 행, 끝을 아는 법, 취소, 켤 때 복구, CLI와 자격."
    path: project-docs/architecture/run.md
    change_reasons:
      boundaries: [runs, agent-sessions, router, coding-agent-cli, coding-agent-cli-interface]

  - id: architecture-workflow
    kind: doc
    roles: [planner, lead]
    description: "workflow(agent step을 넘기는 일, flow code가 도는 일)의 설계: instance와 줄, 넘기기와 step 입력, 켤 때와 멈춤, 쓰기 범위, workflow artifact와 kit, `workflow.check`."
    path: project-docs/architecture/workflow.md
    change_reasons:
      boundaries: [workflows, router, agent-workspaces, coding-agent-cli]
      paths: [packages/shell/renderer/workflow/, packages/shell/renderer/workspace/kinds/workflow.tsx, packages/shell/renderer/workspace/sidebar/workflow-panel.tsx, packages/shell/renderer/artifact-kit/, packages/core/main/daemon/wiring/workflows.ts, packages/core/main/daemon/wiring/workflows-files.ts, packages/core/main/daemon/wiring/flows.ts, packages/core/main/flow-host/, packages/sdk/flow/]

  - id: architecture-job
    kind: doc
    roles: [planner, lead]
    description: "정해진 때 도는 일(job)과 scheduler의 설계: 놓친 차례 정책, 겹침, hold, 서머타임, 승인, 켤 때 복구, 사람의 job 화면."
    path: project-docs/architecture/job.md
    change_reasons:
      boundaries: [jobs]
      paths: [packages/core/main/daemon/wiring/jobs.ts, packages/core/main/daemon/wiring/jobs-registration.ts, packages/shell/renderer/desktop/jobs/, packages/shell/renderer/workspace/sidebar/job-panel.tsx, packages/shell/renderer/desktop/connection/waiting/cards/job-hold-card.tsx]

  - id: architecture-agent-definition
    kind: doc
    roles: [planner, lead]
    description: "agent 정의와 turn마다의 prompt 조립 설계: 정의·지침·tool·memory·skill·workspace 정보 층, Home·project·앱의 같은 층, model 호출(provider, OAuth, 입력 예산, compaction)."
    path: project-docs/architecture/agent-definition.md
    change_reasons:
      boundaries: [agent-workspaces, agent-tools, run-loop, models, agent-tool-spi]
      paths: [packages/protocol/lophn-agent/workspaces.ts, packages/core/agent-workspaces/workspace/data-folder.ts, packages/core/lophn-agent/agents/layers.ts, packages/core/lophn-agent/tools/memory/, packages/core/lophn-agent/tools/bundles/memory.ts]
      note: lophn id 규칙, Home 그릇 자리(`<data>/home/`), memory 파일 자리(`<data>/agent-memory/`)와 `agent.memory` tool이 바뀔 때.

  - id: architecture-coding-agent
    kind: doc
    roles: [planner, lead]
    description: "사람이 쓰는 coding agent(harness)와 lophn을 잇는 설계: CLI 표, 제품 감지와 hook 설치, 공유 skill 사본, harness가 runtime인 lophn agent와 TUI 탭."
    path: project-docs/architecture/coding-agent.md
    change_reasons:
      boundaries: [coding-agent, coding-agent-cli, coding-agent-harness-api, coding-agent-cli-interface]
