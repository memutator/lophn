id: private-job-remote-trigger-never-subscribes
title: private인 workspace에서 만든 job이 다른 컴퓨터의 event를 trigger로 가져도 저장되고 구독이 걸리지 않아 말없이 돌지 않는다
kind: bug
status: open
topic: job
modules: [packages/core/jobs, packages/core/remote, packages/core/main]
now: |
  `packages/core/jobs/commands.ts`는 trigger에 `machine`이 있는 job을 이 컴퓨터의 선언과 정책을 보지 않고 저장한다(주석: private인 workspace의 job은 core의 구독이 거른다). `packages/core/remote/subscriptions.ts`의 `compute`가 만든 workspace가 private인 job을 건너뛰고(`deps.isPrivate(job.workspace)`) 로그도 남기지 않는다. 사람이 승인하면 job은 켜진 채로 목록에 서고 `fired_count`는 0으로 남는다.
impact: |
  private workspace의 agent가 다른 컴퓨터의 event로 돌 job을 만들고 사람이 승인해도 그 job은 절대 돌지 않는다. 목록에는 정상으로 보여 사람이 이유를 찾지 못한다.
fix: |
  - (작음, 추천) 만들 때 job의 workspace가 private이고 trigger에 컴퓨터가 있으면 `forbidden`으로 거절한다(private인 workspace의 agent는 다른 컴퓨터를 부르지 못한다는 규칙과 같다). 이미 저장된 것은 목록에 "never subscribes" 표시를 단다.
  - (작음) 그대로 두고 Jobs 목록에 이유를 보인다.
