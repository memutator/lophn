  - path: packages/protocol/remote/roster_test.ts
    covers: [remote-join:untrusted, remote-join:expired, remote-join:removed, remote-join:taken, roster-remove:disputed, roster-commit:unknown-capped]
    note: "내 기기 명단의 순수 함수(rosterView, mergeRoster, checkInvited, rosterPending). 믿는 컴퓨터의 서명이 없는 항목·남의 key로 서명한 위조·host key만 훔친 root 행세는 들지 않고, 초대장은 서명자를 모름·kind가 다름(터미널 허락은 항목이나 초대의 검증에 들지 않는다)·7일보다 먼 수명·닿은 때가 수명 뒤·옛 rev나 남겨 둔 초대 서명 statement가 이미 씀·뺀 key·id·서명 key·다른 기기의 id·다른 컴퓨터의 서명 key면 거절(같은 key는 다시 받음). 빼기보다 늦게 온 새 rev·같은 key의 새 id·뺀 서명 key를 단 새 host key가 빼기를 되돌리지 못함. 뺀 컴퓨터가 빠진 뒤 서명한 항목은 효력이 없음. 빼기끼리는 grounded labelling: 빠진 컴퓨터의 빼기는 대상 컴퓨터의 빼기를 막지 못하고, 서로 뺀 두 컴퓨터는 각자 상대만 빼고 구경꾼은 둘 다 빼며, 도둑 신원 둘(Q2T)은 어느 root에서나 둘만 빠지고, 고리(Q1T)는 root가 자기 판단을 믿고 구경꾼은 자기만 남김(정해지지 않은 빼기는 settled가 아님). 고정 seed 무작위 명단 25개로 순서와 keep 재계산이 같은 view임을 봄. 어느 순서로 합쳐도, keep만으로 다시 계산해도 같은 view(접기, 같은 rev의 두 본문 가운데 글이 작은 쪽, dual boot의 초대 서명 statement와 pending, 스스로 서명한 새 rev의 사슬, 옛 rev의 쓰인 초대, 빠진 컴퓨터의 빼기, id·초대 충돌은 둘 다 뺌). join frame이 이 판정(checkInvited)으로 거절하는 갈래를 덮는다. 쓰인 초대장은 그것으로 든 기기를 빼도 쓰인 것이고, 남의 id를 실은 빼기는 그 id의 기기를 지우지 못하며, 엇갈린 빼기에 걸린 key를 root가 다시 빼면 그 key만 빠지고 뺀 쪽이 돌아온다(빠진 서명자가 단 id·이름·서명 key는 엇갈린 줄을 바꾸지 못한다). 모르는 서명자와 빠진 서명자의 것은 ROSTER_UNKNOWN_MAX 아래에만 남고 믿는 컴퓨터의 빼기는 저장된다. 폰(root가 저장한 컴퓨터들)은 저장한 컴퓨터의 빼기를 따르고, 저장한 다른 컴퓨터가 맞서면 아무 빼기도 정해지지 않는다"

