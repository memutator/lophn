id: app-off-screen-turn-on
version: 0.23.69
title: 꺼진 앱의 화면 자리가 이유를 말하고 켜는 버튼을 둔다
modules: [packages/shell/renderer, packages/design]
change: |
  - 꺼졌거나 아직 뜨는 중인 앱의 화면을 열면 "Couldn't load <앱>"과 앱이 켜질 때까지 계속 실패하는 Reload만 보였다. 이제 꺼진 앱은 "This app is turned off, so its screen can't open. Turn it on to use it."와 [Turn on]을 보이고, 켜면 탭을 닫았다 열지 않아도 화면이 열린다. 뜨는 중이면 "This app is starting…"을 보이다가 running이 되면 스스로 연다. crash loop로 멈춘 앱은 그 안내 글을 보인다.
  - 같은 안내를 앱 workspace의 화면 탭, project 안의 앱 panel 탭, sidebar panel, tray popup이 같이 쓴다. [Turn on]은 app detail의 Run switch와 같은 길(`app.enable_execution`)이다.
  - 앱 화면 탭의 "This app's screen can't open here yet."은 선언에 tab 자리 화면이 없을 때만 보인다. 화면 선언을 읽지 못한 것은 재시도 버튼이 있는 오류 화면이다(전에는 같은 글로 막혀 탭을 다시 열어야 했다).
  - 계약(route, IPC, schema)은 그대로다.
why: |
  사람이 왜 안 열리는지 알 수 없었고 켜려면 app detail을 찾아가야 했다.
decisions:
  - text: >-
      안내는 EmbeddedView를 쓰는 자리들이 같이 쓰는 component 하나다. chat의 앱 card와 앱 전용 창은 이번에 바꾸지 않았다(card는 자기 실패 처리가 따로 있고, 전용 창은 실행 상태를 읽을 source가 없다).
    by: agent
  - text: >-
      running인데 열기가 또 거절되면 한 번만 다시 열고 그 뒤에는 재시도 버튼이 있는 오류 화면으로 둔다. 버린 길: 열릴 때까지 되풀이(되풀이가 끝나지 않을 수 있다).
    by: agent
checklist:
  - "꺼 둔 앱(Agent Monitor 같은 것)의 탭을 열어 꺼졌다는 글과 [Turn on]이 보이고, 누르면 화면이 열리는지 본다"
  - "project 안에 탭으로 연 앱 화면, sidebar의 앱, tray popup에서도 꺼진 앱이 같은 안내를 보이는지 본다"
