area: automation
flows:
  # ---- workflow ----
  - id: workflow-start-agent
    title: "agent kind workflow를 사람이 시작한다"
    actor: person
    entries: [route:workflows/start]
    uses: [route:workflow_instances/create]
    when: "workflow의 kind가 agent일 때. flow kind는 workflow-start-flow"
    boundary: [core-api, workflows]
    code: [packages/core/workflows/service.ts, packages/core/workflows/plan.ts, packages/core/workflows/declaration.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "project 이름과 workflow 이름으로 project id와 선언(workflow.yaml)을 푼다. 선언이 틀리면(invalid_inputs 포함) conflict로 거절한다. workflows 폴더를 못 읽으면 unavailable"
      - "선언에 inputs가 있으면 validateWorkflowInputs로 검증하고(type이 agent인 필드가 있으면 project에서 호출 가능한 agent 목록으로 검사, when 조건으로 숨겨진 필드는 건너뜀) 실패하면 invalid_input으로 거절한다"
      - "step을 고르지 않으면 선언의 첫 step, 골랐으면 그 step을 찾는다. 없으면 not_found"
      - "선언의 참가자에서 읽는 칸(agent, workspace, on, kind)과 StartWorkflow의 선택 `participant_modes`(없으면 `approvals.workflow_modes` 기억 값)를 instance(`participant_modes_json`)로 옮긴다. sub-workflow는 부모 instance 단계와 `min`으로 상한을 둔다. 참가자 담당을 풀어(plan.ts) 받을 session(해당 participant 권한 단계 반영)과 step 메시지 본문을 command 앞에서 정한다. 검증된 inputs가 비어 있지 않으면 첫 step 본문에 Inputs: 섹션을 주입한다. on이 있으면 명단의 그 컴퓨터로 넘길 step call이다"
      - "CreateWorkflowInstance 전에 시작 입력 글, inputs 안 모든 문자열(재귀), handoff 본문을 redaction한 뒤 instance 행(inputs_json 포함)과 started 줄을 쓰고 Router에 step 메시지를 넣는다"
      - "담당을 못 풀면 넘기지 않고 not_handed 줄만 남긴다. instance는 running 그대로다"
    outcomes:
      - id: handed
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: not-handed
        when: "instance는 만들었지만 첫 step을 넘기지 못함(unknown_participant, no_with, unresolved, on이 명단의 다른 컴퓨터로 풀리지 않으면 unknown_computer)"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: invalid_input
        code: invalid_input
        when: "선언된 inputs 검증 실패(필수 누락, 타입·범위·옵션 불일치, 호출 불가 agent)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "project, workflow 폴더, step 이름이 없음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "선언이 틀려 시작할 수 없음(no_declaration, invalid_yaml, invalid_declaration, invalid_inputs)"
        observe: [response, screen:workflow-tab-invalid]
      - id: unavailable
        code: unavailable
        when: "ledger나 workflows 폴더를 못 읽음, 본문 redaction이 끝나지 않거나 blob을 못 준비함. instance 행도 줄도 남지 않는다"
        observe: [response, screen:workflow-start-failed]
    crosses_process: false
    refs: [W1, W2, W4, E9, H7]
    docs: [architecture/workflow.md]

  - id: workflow-start-flow
    title: "flow kind workflow를 사람이 시작해 code process를 띄운다"
    actor: person
    uses: [route:workflows/start, route:workflow_instances/create, route:workflow_instances/apply]
    when: "workflow의 kind가 flow일 때. agent kind는 workflow-start-agent"
    boundary: [core-api, workflows]
    code: [packages/core/workflows/service.ts, packages/core/main/flow-host/host.ts, packages/core/main/daemon/wiring/flows.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "선언에 inputs가 있으면 validateWorkflowInputs로 검증하고 실패하면 invalid_input으로 거절한다"
      - "선언의 kind가 flow면 step 입력을 받지 않는다. step이 오면 invalid_input으로 거절한다"
      - "시작 입력 글과 inputs 안 문자열을 재귀 redaction해 instance 행(inputs_json 포함)을 running으로 만들고 step이 없는 started 줄을 쓴다(넘기지 않아 handed는 null)"
      - "launch가 agent 칸을 한 번 풀고 설치된 @lophn/flow의 entry.ts로 flow.ts를 process 하나로 띄운다. V8 heap은 512 MiB로 묶는다(넘으면 process가 죽고 workflow-flow-exit로 간다)"
      - "stdin으로 start(instance, 입력 글, redaction된 inputs)를 보내고 시작은 성공으로 답한다"
      - "띄우지 못하면 program_exited 줄(code null, 이유)을 남기고 instance를 ended로 닫는다. 끝은 workflow-flow-exit가 맡는다"
    outcomes:
      - id: running
        observe: [ledger:workflow_instances, ledger:workflow_lines, "process:flow-host", event:StateChanged, response]
      - id: launch-failed
        when: "process를 띄우지 못함(flow host가 없음, agent 이름을 못 풀음, SDK 설치 사본이나 link가 없음, log 폴더 준비 실패, spawn 실패, start를 쓰지 못함). 응답은 ended인 instance다"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response, screen:workflow-start-failed]
      - id: invalid_input
        code: invalid_input
        when: "flow kind인데 step을 주거나 선언된 inputs 검증에 실패함"
        observe: [response]
      - id: not_found
        code: not_found
        when: "project나 workflow 폴더가 없음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "선언이 틀리거나 flow.ts가 없어 시작할 수 없음(invalid_inputs, no_flow_file 포함)"
        observe: [response, screen:workflow-tab-invalid]
      - id: unavailable
        code: unavailable
        when: "ledger나 workflows 폴더를 못 읽음, 본문 redaction이나 blob 준비가 실패함. instance 행을 쓰기 전에 멈춘다"
        observe: [response]
    crosses_process: true
    risk: [sandbox]
    refs: [E11, H7, W6]
    docs: [architecture/workflow.md]
    unclear:
      - "flow process는 권한 제한 없이 뜬다(사람이 정한 것, AI가 짠 code). 그래서 sandbox로 달았다. 제한이 없다는 사실 자체가 risk인지 사람이 확인할 것"

  - id: workflow-instance-create
    title: "workflow instance 행을 만들고 첫 step을 넘긴다(시작 기록)"
    actor: system
    entries: [route:workflow_instances/create]
    boundary: [workflows, router]
    code: [packages/core/workflows/commands.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "machine 자격만 받는다. instance id가 이미 있으면 conflict"
      - "instance 행과 started 줄을 같은 tx에 쓴다. 본문과 받는 곳은 호출한 쪽이 정해 넘긴 handoff 그대로 쓴다"
      - "handoff가 있으면 Router에 step 메시지를 넣고 handed 줄, 못 넣으면 not_handed 줄을 쓴다. 다른 컴퓨터의 참가자(on)면 step call mail을 outbox에 넣고 보낸 쪽 program인 call 행을 쓴 뒤 receiver 없이 remote(machine, computer, call)를 실은 handed 줄을 쓴다"
      - "Router가 err를 주면 tx 전체가 되돌아가 줄도 행도 남지 않는다"
    outcomes:
      - id: handed
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: not-handed
        when: "handoff가 있으나 담당을 못 풀거나(on이 명단의 다른 컴퓨터로 풀리지 않으면 unknown_computer, private project에서 다른 컴퓨터로 넘기려 하면 unresolved) Router가 실패로 돌려줌(not_handed 줄)"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: recorded
        when: "flow kind(handoff가 null). 넘기지 않는 started만 남는다"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "instance id가 이미 있음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "Router가 err를 줌(Router 미배선 등)이나 본문 redaction·blob 준비가 실패함. tx 전체가 되돌아가 줄도 행도 남지 않는다"
        observe: [response]
    crosses_process: false
    declared_only: [not_found]
    unclear:
      - "route가 not_found를 선언하지만 handler는 내지 않는다. 시작 주체는 program이라 Router가 못 푼 담당은 err가 아니라 not_handed 줄로 남고, instance id 중복은 conflict다. 선언을 고칠 곳이다."
    refs: [W1]
    docs: [architecture/workflow.md]

  - id: workflow-report
    title: "참가자가 step 결과를 report하고 next step이나 end로 넘긴다"
    actor: agent
    entries: [route:workflows/report]
    uses: [route:workflow_instances/apply]
    pre: [route:workflows/start]
    boundary: [core-api, workflows, router]
    code: [packages/core/workflows/service.ts, packages/core/workflows/commands.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "다른 컴퓨터에서 받은 step이면(그 session이 그 instance·step의 step 입력을 받았다) 이 컴퓨터에는 instance가 없다. 글을 redaction해 calls/step-report로 그 call의 reply mail을 내고 line 없이 답한다. 그 session이 받지 않은 step은 이 컴퓨터의 instance를 찾아 not_found다"
      - "report의 글과 선택적 refs·data 안 문자열을 redaction한 뒤, next가 step이면 받는 곳과 step 메시지 본문을 command 앞에서 정한다"
      - "ApplyWorkflowChange가 report 줄(선택적 refs·data 포함)을 쓴다. instance가 stopped면 줄만 남고 넘기지 않는다"
      - "next가 step이면 그 담당에게 넘기고 handed 줄과 current를 남긴다. 못 넘기면 not_handed 줄"
      - "next가 end면 ended 줄로 닫는다. next가 없으면 진행 글이라 상태를 바꾸지 않는다"
      - "같은 instance를 동시에 고쳐 state_seq가 어긋나면 다시 읽어 최대 3번까지 건다"
    outcomes:
      - id: handed
        when: "next가 step이고 그 담당에게 넘김"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: not-handed
        when: "next step의 담당을 못 풀음(unknown_participant, no_with, unresolved)"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: recorded
        when: "next가 없는 진행 글. 상태와 current는 그대로"
        observe: [ledger:workflow_lines, event:StateChanged, response]
      - id: ended
        when: "next가 end. running이었으면 ended로 닫힌다"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: after-stop
        when: "instance가 stopped. 줄만 남고 handed는 null"
        observe: [ledger:workflow_lines, event:StateChanged, response]
      - id: sent-remote
        when: "다른 컴퓨터에서 받은 step의 report. 시작한 컴퓨터로 reply mail이 가고 line은 null이다"
        observe: [ledger:mail_outbox, ledger:agent_calls, response]
      - id: not_found
        code: not_found
        when: "instance가 없음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "state_seq가 3번 다시 읽어도 어긋남"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "본문 redaction이 끝나지 않거나 blob을 못 준비함. 줄도 남지 않는다"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    refs: [W1, W3, E9]
    docs: [architecture/workflow.md]

  - id: workflow-edit
    title: "참가자가 instance의 step을 고치고 필요하면 지금 넘긴다"
    actor: agent
    entries: [route:workflows/edit]
    uses: [route:workflow_instances/apply]
    pre: [route:workflows/start]
    boundary: [core-api, workflows, router]
    code: [packages/core/workflows/commands.ts, packages/core/workflows/service.ts]
    steps:
      - "instance가 stopped면 conflict로 거절한다"
      - "add_step, update_step, remove_step은 instance의 step 목록만 고친다. 이름이 겹치면 conflict, 없는 이름이면 not_found. 누가 고칠지는 보지 않는다"
      - "end는 running이면 ended 줄로 닫는다"
      - "hand_now는 글(지정한 글, 없으면 마지막 report 글, 없으면 시작 입력)로 step 담당에게 다시 넘긴다. 못 넘기면 not_handed 줄"
      - "edit 줄에 누가 어떤 입력으로 고쳤는지 남는다(by, detail)"
    outcomes:
      - id: edited
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: ended
        when: "op가 end. running이었으면 ended 줄을 남긴다"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: handed
        when: "hand_now로 step 메시지를 넘김"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: not-handed
        when: "hand_now의 step 담당을 못 풀음"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "instance가 stopped이거나 add_step의 이름이 이미 있음, 또는 state_seq가 3번 다시 읽어도 어긋남"
        observe: [response]
      - id: not_found
        code: not_found
        when: "update_step, remove_step의 이름이나 add_step의 after 이름이 없음, 또는 instance가 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "hand_now 글의 redaction이 끝나지 않거나 blob을 못 준비함"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    refs: [W3, W5, E9]
    docs: [architecture/workflow.md]

  - id: workflow-retry
    title: "사람이 막힌 workflow step을 같은 session에서 이어서 다시 시도한다"
    actor: person
    entries: [route:workflows/retry]
    uses: [route:workflow_instances/apply]
    boundary: [core-api, workflows, router]
    code: [packages/protocol/workflows/routes.ts, packages/core/workflows/service.ts, packages/core/workflows/commands.ts, packages/core/workflows/plan.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "running이면서 대상 step(기본은 현재 막힌 step)이 blocked 상태(step_stalled, not_handed, lophn_restarted 또는 실패한 turn)인지 확인한다(stopped나 정상 working이면 conflict)"
      - "retried 줄을 쓰고 기록된 같은 session이 있으면 그 session에만 이어서 하라는 입력을 넣는다(fallback: new 없음 — 닫힌 session이면 conflict로 tx를 되돌린다)"
      - "아직 session이 열리기 전(not_handed)이면 넘기기를 다시 시도해 handed(cause: retry)나 not_handed 줄을 남긴다"
    outcomes:
      - id: retried
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "instance가 running이 아니거나 해당 step이 blocked 상태가 아니거나 기록된 session이 이미 닫혔음"
        observe: [response]
      - id: not_found
        code: not_found
        when: "instance나 step이 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "입력을 넣거나 redaction·blob 준비를 끝내지 못함"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    docs: [architecture/workflow.md]

  - id: workflow-step-stalled
    title: "local non-human step의 turn이 완료 report 없이 끝나고 열린 하위 call도 없으면 step_stalled 줄을 남긴다"
    actor: system
    entries: [system:workflow-step-stalled]
    uses: [route:workflow_instances/apply]
    boundary: [workflows, router]
    code: [packages/core/workflows/service.ts, packages/core/workflows/commands.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "workflows wiring이 Bus의 TurnEnded를 구독한다(restarted 종료는 workflow-restart가 맡는다)"
      - "running instance의 현재 step 담당 session이 turn을 마쳤을 때 human_turn step, 이미 완료 report(next 있음)나 stall·restart 기록이 있는 시도, 열린 outgoing agent_calls가 남아 있는 session은 건너뛴다"
      - "조건에 맞으면 넘김·retry 시도당 최대 1회 step_stalled 줄(실패·중단 turn이면 redaction된 reason·message 포함)을 남긴다"
    outcomes:
      - id: stalled
        observe: [ledger:workflow_lines, event:StateChanged]
      - id: skipped
        when: "human step이거나 이미 완료·stall 기록됨, 열린 agent_calls가 남아 있음, 또는 읽고 쓰기에 실패함"
        observe: [ledger:workflow_lines]
    crosses_process: false
    docs: [architecture/workflow.md]

  - id: workflow-resume
    title: "사람이 멈춘 flow workflow instance를 replay로 이어 간다"
    actor: person
    entries: [route:workflows/resume]
    uses: [route:workflow_instances/apply]
    boundary: [core-api, workflows]
    code: [packages/protocol/workflows/routes.ts]
    steps:
      - "running이면서 계산 상태가 blocked인 flow instance인지 확인한다(아니면 conflict)"
      - "use_latest_code가 true면 최신 flow code로 code_snapshot을 갱신하고 code_updated 줄을 남긴다"
      - "고정된 code_snapshot으로 flow process를 다시 띄워 저장된 checkpoint로 replay한다"
    outcomes:
      - id: resumed
        observe: [ledger:workflow_instances, ledger:workflow_lines, "process:flow-host", event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "instance가 running이 아니거나 flow instance가 아니거나 blocked 상태가 아님"
        observe: [response]
      - id: not_found
        code: not_found
        when: "instance가 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "code snapshot을 준비·복원하거나 flow process를 띄우지 못함"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: true
    docs: [architecture/workflow.md]

  - id: workflow-checkpoint-upsert
    title: "durable workflow 실행의 checkpoint를 2단계(started -> completed|failed|interrupted)로 저장한다"
    actor: system
    entries: [route:workflow_checkpoints/upsert]
    boundary: [workflows]
    code: [packages/protocol/workflows/commands.ts, packages/core/workflows/checkpoint-schema.ts]
    steps:
      - "machine 자격만 받는다. 대상 instance가 없으면 not_found"
      - "(instance, key) checkpoint 행을 삽입하거나 갱신하고 StateChanged(workflow_instances)를 낸다"
    outcomes:
      - id: upserted
        observe: [ledger:workflow_checkpoints, event:StateChanged, response]
      - id: not_found
        code: not_found
        when: "instance가 없음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: conflict
        code: conflict
        when: "checkpoint 상태 전이가 충돌함"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "ledger에 쓰지 못함"
        observe: [response]
    crosses_process: false
    docs: [architecture/workflow.md]

  - id: workflow-stop
    title: "사람이 instance를 멈춘다"
    actor: person
    entries: [route:workflows/stop]
    uses: [route:workflow_instances/apply, route:turns/stop, route:runs/cancel]
    boundary: [core-api, workflows, runs]
    code: [packages/core/workflows/service.ts, packages/core/main/daemon/wiring/workflows.ts, packages/core/main/flow-host/host.ts]
    steps:
      - "stopped 줄을 쓰고 instance를 stopped로 닫는다(by user). 이미 stopped면 conflict"
      - "그 instance가 다른 컴퓨터로 넘긴 열린 step call을 같은 tx에서 취소한다(낼 call mail을 지우고 cancel mail을 낸다)"
      - "그 instance의 handed 줄에 있는 이 컴퓨터의 session마다 도는 turn을 멈춘다(best-effort)"
      - "flow process가 있으면 죽이고, 그 instance가 연 run을 cancelOfInstance로 취소한다"
      - "멈춘 뒤 늦게 온 report와 program_exited는 줄만 남고 다시 running이 되지 않는다"
    outcomes:
      - id: stopped
        observe: [ledger:workflow_instances, ledger:workflow_lines, ledger:runs, ledger:agent_calls, ledger:mail_outbox, "process:flow-host", event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "이미 stopped, 또는 state_seq가 3번 다시 읽어도 어긋남"
        observe: [response, screen:workflow-start-failed]
      - id: not_found
        code: not_found
        when: "instance가 없음"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: true
    refs: [H7]
    docs: [architecture/workflow.md]

  - id: workflow-check
    title: "agent가 쓴 flow.ts를 실행 없이 type check한다"
    actor: agent
    entries: [route:workflows/check]
    boundary: [core-api, workflows]
    code: [packages/core/main/flow-host/check.ts, packages/core/main/flow-host/sdk-link.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "project와 workflow 폴더의 flow.ts를 찾는다. 없으면 errors에 flow.ts is missing을 싣는다"
      - "@lophn/flow 설치 사본을 projects/node_modules에 symlink로 잇는다. 이미 같은 곳이면 그대로 두고, launch와 같은 link를 쓴다(sdk-link.ts)"
      - "platform의 tsc --noEmit을 임시 tsconfig로 돌려 오류 줄을 최대 20개 돌려준다. flow.ts는 실행하지 않는다"
      - "30초가 지나면 SIGTERM으로 끊고 그때까지의 출력으로 errors를 만든다. 끝나지 않았다고 unavailable로 답하지 않는다"
    outcomes:
      - id: passed
        when: "tsc 오류가 없음. errors는 빈 목록"
        observe: [response]
      - id: has-errors
        when: "tsc 오류가 있거나 flow.ts가 없거나 30초가 지나 끊김(그때 errors는 tsc 오류 줄이 있으면 그것, 없으면 출력 첫 줄이고 출력도 없으면 failed)"
        observe: [response]
      - id: not_found
        code: not_found
        when: "project가 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "typescript나 @types/node가 없음, @lophn/flow 사본 연결이 실패함, tsc를 띄우지 못함(spawn 오류), ledger를 못 읽음"
        observe: [response]
    crosses_process: false
    refs: [C29]
    docs: [architecture/workflow.md]

  - id: workflow-list
    title: "workflow 목록과 시작할 수 있는지를 읽는다"
    actor: person
    entries: [route:workflows/list]
    boundary: [core-api, workflows]
    code: [packages/core/workflows/service.ts, packages/core/workflows/declaration.ts, packages/core/main/daemon/wiring/workflows-files.ts]
    steps:
      - "project 이름이나 id를 풀고 없으면 not_found"
      - "project를 주지 않으면 agent가 project workspace에서 부른 것만 그 project로 채운다. 아니면 invalid_input"
      - "project의 workflows 폴더를 읽어 선언마다 kind, startable, problem(invalid_inputs 포함), inputs, outputs를 붙여 돌려준다"
      - "project workspace에서 호출 가능한 agent 목록(agents/cards)을 callable_agents로 함께 돌려준다"
      - "목록의 step에는 prompt, in, out을 싣지 않는다"
    outcomes:
      - id: ok
        observe: [response, screen:workflow-tab-empty, screen:new-sidebar-workflows-empty]
      - id: invalid_input
        code: invalid_input
        when: "project를 주지 않았고 호출한 agent가 project workspace에 없음"
        observe: [response]
      - id: not_found
        code: not_found
        when: "project가 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "ledger로 project를 못 풀거나 workflows 폴더를 못 읽음"
        observe: [response]
    crosses_process: false
    refs: [C29]
    docs: [architecture/workflow.md]
    unclear:
      - "ListWorkflows는 renderer가 클릭으로 부르고 agent도 workflow.list tool로 부른다. actor는 renderer 기준 person으로 두고 agent 경로는 steps로 설명했다"

  - id: workflow-instance-read
    title: "workflow instance 하나나 목록을 읽는다"
    actor: person
    entries: [route:workflow_instances/read, route:workflow_instances/list]
    boundary: [core-api, workflows]
    code: [packages/core/workflows/reads.ts, packages/core/workflows/store.ts]
    steps:
      - "read는 instance 행(저장된 inputs 포함), step마다 가장 나중 report, 줄 200개씩(cursor)을 준다"
      - "list는 project(와 workflow, state)로 거르고 새것이 앞이며 50개씩, 줄마다 마지막 줄과 저장된 inputs를 붙인다"
    outcomes:
      - id: ok
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "read의 cursor가 seq 꼴이 아님"
        observe: [response]
      - id: not_found
        code: not_found
        when: "read의 instance가 없음"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance, 마지막 report, 줄, 목록 행이 깨져 읽지 못함(read와 list 모두)"
        observe: [response]
    crosses_process: false
    docs: [architecture/workflow.md]

  - id: workflow-instance-apply
    title: "instance의 상태와 줄을 한 tx로 바꾼다(모든 참가자와 시스템의 쓰기 입구)"
    actor: system
    entries: [route:workflow_instances/apply]
    boundary: [workflows, router]
    code: [packages/core/workflows/commands.ts, packages/core/workflows/service.ts]
    steps:
      - "machine 자격만 받는다. state_seq가 읽은 값과 다르면 conflict로 되돌린다(service가 다시 읽어 최대 3번 건다)"
      - "change(report, edit, stop, lophn_restarted, program_exited, flow_restarted, step_stalled, retried)대로 줄을 쓰고 상태를 옮긴다. stopped면 넘기지 않는다"
      - "handoff가 있으면 Router에 넣고 handed나 not_handed 줄을 남긴다. Router가 err를 주면 tx 전체를 되돌린다"
      - "commit 뒤 StateChanged(workflow_instances)를 한 번 낸다"
    outcomes:
      - id: applied
        when: "줄과 상태만 쓰고 넘기지 않음"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: handed
        when: "넘김 성공"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: not-handed
        when: "넘기려 했지만 담당을 풀지 못함"
        observe: [ledger:workflow_instances, ledger:workflow_lines, event:StateChanged, response]
      - id: conflict
        code: conflict
        when: "state_seq가 바뀌었거나 stopped인데 edit·stop을 요청함"
        observe: [response]
      - id: not_found
        code: not_found
        when: "instance가 없거나 고치기 대상 step이 없음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "Router가 err를 줌(Router 미배선 등)이나 본문 redaction·blob 준비가 실패함. tx 전체가 되돌아간다"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    refs: [W1, W2]
    docs: [architecture/workflow.md]

  - id: workflow-restart
    title: "켤 때 끊긴 workflow instance를 줄로 남긴다(다시 넘기지 않는다)"
    actor: system
    entries: [system:workflow-restart]
    uses: [route:workflow_instances/apply]
    boundary: [workflows, router]
    code: [packages/core/workflows/service.ts, packages/core/main/daemon/wiring/workflows.ts]
    steps:
      - "router가 돌던 turn을 닫은 뒤 running인 instance마다 reconcile한다(wiring의 start)"
      - "started 줄의 step이 null인 flow instance는 다시 띄우지 않고 flow_restarted로 닫는다(lophn_restarted 줄, ended)"
      - "agent instance는 가장 나중 handed 줄의 session에서 그 step의 메시지 turn을 찾는다. 가져가지 않았거나 restart로 끊겼으면 lophn_restarted 줄(step, receiver)을 남긴다"
      - "같은 step에 이미 lophn_restarted나 report가 있으면 다시 남기지 않는다. 상태와 current는 바꾸지 않는다"
    outcomes:
      - id: flow-closed
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged]
      - id: step-lost
        observe: [ledger:workflow_lines, event:StateChanged]
      - id: kept
        when: "turn이 끝났거나 도는 중이거나 이미 기록됨. 넘긴 줄이 없거나 step 메시지를 session에서 찾지 못해도 줄을 남기지 않는다"
        observe: [ledger:workflow_lines]
      - id: skipped
        when: "instance나 turn을 읽거나 줄을 쓰지 못함. log:workflows에 남고 instance는 그대로 둔다"
        observe: ["log:workflows"]
    crosses_process: false
    refs: [W5, W6]
    docs: [architecture/workflow.md]

  - id: workflow-flow-agent-run
    title: "flow code의 agent(...) 요청을 run으로 열고 답을 돌려준다"
    actor: system
    entries: [system:flow-agent-request]
    uses: [route:runs/start, route:runs/create, route:runs/settle]
    pre: [workflow-start-flow:running]
    boundary: [child-supervision-protocol, runs, run-loop]
    code: [packages/core/main/flow-host/host.ts, packages/core/main/flow-host/channel.ts, packages/core/runs/service.ts, packages/protocol/workflows/flow-wire.ts]
    steps:
      - "flow process의 stdout 한 줄을 읽어 agent 요청인지 보고 칸이 틀리면 invalid_input 응답을 쓴다. process는 살린다"
      - "RunService.start에 origin(instance와 creator)을 붙여 run을 연다. agent 칸이 없으면 instance의 project workspace다"
      - "run이 running인 동안 WaitRun을 60초씩 되풀이해 기다린다. 응답 전에 process가 끝났거나 lophn이 꺼지는 중이면 응답을 쓰지 않는다"
      - "done이면 result를, failed면 run의 error.reason을, cancelled면 cancelled를 같은 id의 응답으로 돌려준다"
    outcomes:
      - id: answered
        observe: [response, ledger:runs]
      - id: run-failed
        when: "run이 failed로 끝남. reason은 run의 error.reason(invalid_output, no_answer, turn_failed, turn_interrupted, lophn_restarted 등)"
        observe: [response, ledger:runs]
      - id: cancelled
        when: "run이 cancelled로 끝남(instance 멈춤의 cancelOfInstance 포함)"
        observe: [response, ledger:runs]
      - id: not_found
        code: not_found
        when: "agent 주소를 풀지 못해 run을 열지 못함(runs.start의 not_found)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "요청 칸이 틀림(process는 살아 있음), 또는 schema를 읽지 못하거나 prompt가 메시지 한도를 넘음(runs.start의 invalid_input)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "run을 여는 중 ledger를 못 읽음(runs.start의 unavailable)"
        observe: [response]
      - id: dropped
        when: "응답 전에 process가 끝났거나 lophn이 꺼지는 중이라 응답을 쓰지 않음. run 정리는 workflow-flow-exit가 맡는다"
        observe: [ledger:runs]
    crosses_process: true
    refs: [R8, E11]
    docs: [architecture/workflow.md, architecture/run.md]
    unclear:
      - "guard로 잡힌 throw는 internal로 답하지만(host.ts의 guard) 갈래로 쓰지 않았다. 코드 결함 경로다"

  - id: workflow-flow-tool-run
    title: "flow code의 tool(...) 요청을 앱 tool 호출 run으로 열고 결과를 돌려준다"
    actor: system
    entries: [system:flow-tool-request]
    uses: [route:runs/start, route:runs/create, route:runs/settle]
    pre: [workflow-start-flow:running]
    boundary: [child-supervision-protocol, runs, app-runtime, approvals]
    code: [packages/core/main/flow-host/host.ts, packages/core/main/daemon/wiring/runs.ts, packages/core/runs/service.ts]
    steps:
      - "요청의 app(id, slug, 이름)과 tool 이름으로 tool run을 연다(origin은 instance와 creator)"
      - "앱 호출 경로를 flow caller로 부른다. creator agent의 지금 할당과 비공개 command 거르기가 허락을 정한다. 막히면 tool_denied"
      - "호출은 기다리지 않고 run을 running으로 돌려준다. host가 WaitRun으로 끝을 기다려 응답을 쓴다"
    outcomes:
      - id: answered
        observe: [response, ledger:runs]
      - id: run-failed
        when: "run이 failed로 끝남. reason은 tool_failed, tool_denied, tool_unknown"
        observe: [response, ledger:runs]
      - id: cancelled
        when: "run이 cancelled로 끝남"
        observe: [response, ledger:runs]
      - id: not_found
        code: not_found
        when: "app을 풀지 못함(runs.start의 not_found)"
        observe: [response]
      - id: invalid_input
        code: invalid_input
        when: "요청 칸이 틀림(process는 살아 있음)"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "run을 여는 중 ledger를 못 읽음(runs.start의 unavailable)"
        observe: [response]
      - id: dropped
        when: "응답 전에 process가 끝났거나 lophn이 꺼지는 중이라 응답을 쓰지 않음"
        observe: [ledger:runs]
    crosses_process: true
    risk: [permission]
    refs: [E11, R8]
    docs: [architecture/workflow.md, architecture/run.md]
    unclear:
      - "permission은 caller 종류(flow caller가 creator의 할당을 고름)를 정하는 판정으로 달았다. 실제 Gate 판정은 app-call 쪽이라 이 flow의 일인지 확인할 것"

  - id: workflow-flow-report
    title: "flow code의 report를 줄로 남기고 next가 end면 닫는다"
    actor: system
    entries: [system:flow-report-request]
    uses: [route:workflow_instances/apply]
    pre: [workflow-start-flow:running]
    boundary: [child-supervision-protocol, workflows]
    code: [packages/core/main/flow-host/host.ts, packages/core/workflows/commands.ts, packages/core/workflows/service.ts]
    steps:
      - "flow process가 보낸 report(step, text, next)를 redaction을 거쳐 report 줄로 남긴다. program의 report는 넘기지 않는다"
      - "running이면 current를 그 step으로 옮긴다. next가 end면 ended 줄로 닫는다"
      - "stopped나 ended인 instance면 줄만 남기고 다시 running으로 돌리지 않는다"
      - "step 이름이 선언에 있는지는 보지 않는다. 성공 응답은 result가 null이다"
    outcomes:
      - id: recorded
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: ended
        when: "next가 end이고 running이었음"
        observe: [ledger:workflow_lines, ledger:workflow_instances, event:StateChanged, response]
      - id: late
        when: "instance가 stopped나 ended. 줄만 남는다"
        observe: [ledger:workflow_lines, event:StateChanged, response]
      - id: invalid_input
        code: invalid_input
        when: "report 칸이 틀림(step, text 8 KiB 초과 등). process는 살아 있음"
        observe: [response]
      - id: not_found
        code: not_found
        when: "instance가 없음"
        observe: [response]
      - id: conflict
        code: conflict
        when: "state_seq가 3번 다시 읽어도 어긋남"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "본문 redaction이 끝나지 않거나 blob을 못 준비함. 줄도 남지 않는다"
        observe: [response]
      - id: internal
        code: internal
        when: "저장된 instance나 줄이 깨져 읽지 못함"
        observe: [response]
    crosses_process: false
    refs: [W6, E11]
    docs: [architecture/workflow.md]

  - id: workflow-flow-exit
    title: "flow process가 끝나면 그 instance의 run을 취소하고 끝 code와 stderr 끝 줄을 남긴다"
    actor: system
    entries: [system:flow-process-exit]
    uses: [route:runs/settle, route:workflow_instances/apply]
    pre: [workflow-start-flow:running]
    boundary: [child-supervision-protocol, workflows, runs]
    code: [packages/core/main/flow-host/host.ts, packages/core/main/flow-host/channel.ts, packages/core/runs/service.ts]
    steps:
      - "process exit을 기다리고 stdout과 stderr의 마지막 data를 다 읽은 뒤에 본다(exit이 먼저 올 수 있다)"
      - "통로가 깨졌으면(JSON 아님, id 없음, 1 MiB 넘음) host가 process를 끝내고 같은 길로 온다"
      - "그 instance가 연 running run을 cancelOfInstance로 모두 취소한다"
      - "program_exited 줄(code, stderr 끝 10줄을 줄마다 500자로)을 남기고 running이면 ended로 닫는다. 신호로 죽으면 code는 null"
      - "core가 꺼지는 중이면 줄을 쓰지 않는다. instance는 running으로 남아 다음 켤 때 workflow-restart가 닫는다"
    outcomes:
      - id: ended
        when: "instance가 running. program_exited 줄을 남기고 ended로 닫는다"
        observe: [ledger:workflow_lines, ledger:workflow_instances, ledger:runs, event:StateChanged, "disk:flows/<instance>.log"]
      - id: after-stop
        when: "instance가 이미 stopped나 ended. program_exited 줄만 남고 상태는 그대로"
        observe: [ledger:workflow_lines, event:StateChanged]
      - id: record-failed
        when: "program_exited 쓰기가 실패함(state_seq 3번 어긋남 등). 줄도 끝도 없이 running으로 남고 log에 program_exited failed가 남는다. 다음 켤 때 workflow-restart가 닫는다"
        observe: [ledger:workflow_instances, "disk:flows/<instance>.log"]
      - id: left-running
        when: "lophn이 꺼지는 중이라 줄을 쓰지 않는다. instance는 running 그대로"
        observe: [ledger:workflow_instances]
    crosses_process: false
    refs: [E11]
    docs: [architecture/workflow.md]
