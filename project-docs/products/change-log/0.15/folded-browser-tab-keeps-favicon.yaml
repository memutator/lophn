id: folded-browser-tab-keeps-favicon
version: 0.15.0
title: 접힌 browser 탭이 favicon을 잃지 않는다
modules: [packages/shell/renderer, packages/shell/main]
checked: []
change: |
  전: 접힌 browser 탭 칩의 favicon이 자주 기본(지구) 아이콘으로 돌아갔다. 접힌 float과 다른 desk의 탭은 mount되지 않아 page state push를 받는 곳이 없었고, main은 favicon을 바뀔 때만 민다. favicon은 layout에 저장하지 않았고 webview는 place 창마다 새로 만들어서, place를 옮겼다 오거나 다시 띄우면 접힌 탭은 펴기 전까지 page가 없어 favicon을 다시 받지 못했다.
  후:
  - place 창이 browser state push를 직접 받아, mount되지 않은 탭의 `fields.favicon`도 갱신한다(`WebviewHost.keyOf`로 session → 탭 key).
  - browser 탭 layout이 `favicon`을 저장한다. `data:image/`로 시작하는 65536자까지만 받고, 맞지 않는 값은 renderer가 빼고 저장한다.
  계약: browser 탭 layout에 선택 칸 `favicon`이 생겼다. 옛 layout 파일은 그대로 읽힌다.
why: |
  사람이 접힌 browser의 favicon이 계속 날아간다고 했다(2026-11-02). 앞서 고친 다시 mount될 때 이어 받기는 이 두 경우를 막지 못했다.
decisions:
  - text: |
      favicon을 layout에 저장한다. 0.4.0에서 저장하지 않기로 한 것을 뒤집는다. 접힌 탭은 펴기 전까지 page가 없어 저장한 값 말고는 출처가 없다.
    by: agent
