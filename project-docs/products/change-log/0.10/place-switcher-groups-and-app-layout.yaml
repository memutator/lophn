id: place-switcher-groups-and-app-layout
version: 0.10.3
title: "place switcher를 Projects/Apps 두 묶음의 높은 줄로 바꾸고, 앱 place의 오른쪽 패널 모양을 앱마다 기억한다"
modules: [packages/shell/renderer, packages/design]
checked: []
change: |
  전:
  - 상단 바 switcher는 이름과 chevron만 있었다. 열면 Recent 묶음과 전체 목록에 같은 place가 두 번 나왔다. 런처 카드는 폴더·창 아이콘 하나로 모두 같아 보였다.
  - 앱 place는 오른쪽 패널의 열림, 고른 탭, 보던 agent와 session을 mount 때마다 잃었다. project place는 layout file에 저장한다.
  후:
  - trigger는 지금 place 이름과 chevron 한 줄이다. 목록은 Projects와 Apps 두 묶음이고 묶음 안은 최근에 연 순서다. Recent 묶음은 없다. 줄은 40px(일반 menu 줄 32px)이고 menu는 trigger 폭(192px 이상)을 따른다.
  - 목록 줄과 런처 카드(Projects, Apps, Archived)에 place 표식(PlaceMark)이 붙는다. 이미지가 있으면 그 이미지, 없으면 첫 글자와 id로 정한 8색 배경이다. project는 둥근 사각형, app은 원이다. 상단 바 trigger에는 표식이 없다.
  - 앱 place의 패널 열림, 고른 탭, details 탭, 보던 agent와 session을 앱마다 localStorage(lophn.app-layout.<app>)에 기억한다. manage pane은 저장하지 않고 새 session 요청은 저장값보다 먼저다.
why: |
  place가 몇 개뿐인데 목록이 중복되어 읽기 어려웠다. 앱과 project를 오가면 앱 쪽 화면이 매번 처음으로 돌아가 전환이 불편했다.
decisions:
  - text: "검색 입력은 두지 않는다. place가 적다. 버린 길: 검색 popover, 종류 라벨을 윗줄에 둔 두 줄 trigger(상단 바 36px 안에서 trigger가 42px가 되어 삐져나왔다), 분류 탭, 두 열, 타일, 항상 보이는 탭."
    by: person
  - text: "상태 점과 보조 문구는 넣지 않는다."
    by: person
  - text: "CatalogSource의 항목에 icon(이미지 src)을 받을 자리만 두었다. core가 project와 앱의 이미지를 아직 주지 않아 지금은 모두 첫 글자 표식이다."
    by: agent
  - text: "앱 place layout은 파일이 아니라 localStorage에 둔다. 폭(panel-width.ts)과 같은 방식이고 다른 기기와 맞출 값이 아니다."
    by: agent
  - text: "앱 place에서는 place menu가 열려 있는 동안 앱 view를 숨긴다(shown={!placeOpen}). DOM menu가 native view 밑에 깔려 안 보였다. browser 탭이 menu가 열린 동안 native view를 숨기는 것과 같다. 같은 문제가 앱 위쪽 바의 Agent select에도 있을 수 있으나 이번에는 고치지 않았다."
    by: agent
follow_up: |
  project와 앱이 이미지를 갖게 되면 core-catalog.ts가 icon을 채운다.
