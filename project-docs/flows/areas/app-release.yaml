  - id: activation-complete
    title: 새 release를 운영 active 참조로 확정한다
    actor: system
    entries: [route:activations/complete]
    pre: [activation-start:started]
    boundary: [app-releases, app-runtime, app-data]
    code:
      - packages/core/apps/releases/commands.ts
      - packages/core/apps/releases/activation/state.ts
      - packages/core/apps/permissions/
      - packages/core/apps/data/
    steps:
      - "machine 자격이 아니면 forbidden이다. release가 없거나 범위 밖이면 conflict다(없는 것과 같은 답)"
      - "시도가 진행 중이 아니거나 시도 id가 다르면 conflict다. 시도 id가 같은 active 재전송은 저장된 결과를 같은 답으로 돌려준다"
      - "현재 활성 release가 시도를 시작할 때와 같은지 본다. 다르면 conflict다"
      - "실제 data 결과가 같은 시도의 것이고 release schema이며 무결성이 있는지, 변경이 기록돼 있는지 보고, 준비 확인(release·bundle·schema·tool 목록)이 선언과 같은지 본다. 같은 시도가 아니면 conflict, 어긋나면 unavailable이다"
      - "한 tx에서 active 참조를 세우고 이전 release를 superseded로 바꾸고, 앱 이름·설명을 새 선언 값으로 바꾼다. run_enabled는 첫 성공일 때만 true로 둔다"
      - "앱 grant를 새 선언 사실에 맞춘다. 늘어난 것은 허락된 것만 두고, 더는 요구하지 않는 grant는 거둔다. 복구본을 지우고 이 앱의 돌아가기 요청 행을 지운다"
      - "release_activated 또는 release_rolled_back 알림을 같은 tx에 남긴다"
    outcomes:
      - id: active
        when: "commit됐다. 같은 시도의 재전송도 저장된 결과를 같은 답으로 돌려준다"
        observe: ["ledger:releases", "ledger:apps", "ledger:grants", "ledger:app_data_records", "ledger:notices", "ledger:activation_requests"]
      - id: conflict
        code: conflict
        when: "진행 중인 시도가 없음, 시도 id가 다름, 활성 release가 바뀜, release가 없거나 범위 밖(absent는 conflict), 데이터 결과가 다른 시도 것, 저장된 선언이 없음"
        observe: [response]
      - id: unavailable
        code: unavailable
        when: "data가 release schema가 아니거나 무결성이 없음, data 변경이 기록되지 않음, 준비 확인이 선언과 다름, 이름·설명이 검증을 통과하지 못함, 권한 판정 port가 답하지 않음"
        observe: [response]
      - id: forbidden
        code: forbidden
        when: "machine 자격이 아님"
        observe: [response]
      - id: internal
        code: internal
        when: "저장 행을 읽지 못함, 앱 grant 맞추기나 복구본 정리, 알림 기록이 실패함(store·grant·notice가 낸 오류 그대로)"
        observe: [response]
    crosses_process: false
    risk: [data-loss, permission]
    refs: [A9, H2]
    docs: [architecture/activation.md]

