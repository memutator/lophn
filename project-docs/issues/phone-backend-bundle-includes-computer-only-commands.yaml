id: phone-backend-bundle-includes-computer-only-commands
title: 폰 backend가 operation과 command를 한 bundle로 묶어서, 컴퓨터에서만 쓰는 command의 `node:` import가 두 곳에서 도는 앱의 준비를 실패시킨다
kind: defect
status: open
topic: app-sync
modules: [packages/core/apps]
now: |
  release 준비는 `runs_on`에 `phone`이 있는 앱의 `main`을 한 bundle(`phone/backend.js`)로 묶는다(`packages/core/apps/releases/phone-backend/build.ts`). `main`이 command handler까지 등록하므로 command가 `node:fs`나 `@lophn/cap-fs`를 import하면 폰에서 돌지도 않는 그 import 때문에 준비가 `a backend that runs on the phone cannot import ...`로 실패한다(`importGuard`). load 검사는 operation과 command를 모두 선언과 맞추게 한다(`load-check.ts`). 폰은 command와 구독을 부르지 못한다. 지침은 이 한계를 말한다(`design-app`의 `phone-apps.md`: 양쪽이 한 bundle이라 컴퓨터에서만 도는 command도 `node:`를 import하지 못한다).
impact: |
  폰에서도 도는 앱은 컴퓨터에서만 도는 command에서도 `node:` module, `@lophn/cap-fs`, `@lophn/flow`를 쓰지 못한다. 파일을 읽는 command가 필요한 앱은 폰에서 돌리기를 포기하거나 그 기능을 다른 앱으로 떼야 한다.
fix: |
  - 중간(추천): 앱이 폰 entry(`phone-main`)를 따로 둘 수 있게 하고 없으면 지금처럼 `main`을 쓴다. 선언의 handler 집합 검사는 폰 entry가 operation만 맞게 한다. SDK와 template 지침이 늘어난다. 그런 앱이 실제로 필요해질 때 한다.
