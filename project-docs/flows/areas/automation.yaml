      - "approve면 approved_at을 적고(`workflow_start`면 현재 해석된 participant별 권한 단계를 `approved_modes_json`에 스냅샷한다), 켜져 있으면 지금부터 센 첫 차례를 next_due_at에 잡는다. 기다린 동안은 놓친 것으로 치지 않는다"
