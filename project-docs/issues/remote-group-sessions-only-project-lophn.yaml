id: remote-group-sessions-only-project-lophn
title: 다른 기계의 창의 "Also on this computer" popover가 그 project lophn agent의 session만 보이고 다른 agent의 session을 빠뜨린다
kind: bug
status: open
topic: project-identity
modules: [packages/shell/renderer, packages/shell/ipc]
now: |
  `packages/shell/renderer/desktop/workspaces/projects/remote-group.tsx`의 `SideBySide`는 두 기계 모두 `sessionsInput(project)`로 `ListSessions`를 한 번 부른다. 그 입력의 `agent`는 `lophnIdOf({ kind: "project", id })`(그 project의 lophn agent) 하나라, 같은 project workspace에 둔 다른 agent의 session은 어느 쪽 목록에도 들지 않는다. `ListSessions`(`packages/protocol/lophn-agent/agent-sessions.ts`의 `workspaceSessionList`)는 `agent`가 필수다. 이 컴퓨터 쪽은 `shell:machines-this-read`가 `project.list`·`ListSessions`만 넘기므로(`packages/shell/ipc/machines.ts`의 `THIS_COMPUTER_READS`) 그 workspace의 agent 목록(`ListAgents`)도 읽을 수 없다.
impact: |
  사람이 보는 동작: project에서 주로 다른 agent(사람이 만든 agent)와 일하는 사람은 popover에서 "No sessions"나 일부만 보고, 두 기계 가운데 어디서 그 일을 이어야 할지 알 수 없다. M의 창의 다른 곳(그 agent의 탭)에서는 보이는 session이라 목록이 틀렸다고 느낀다.
fix: |
  - (중간, 추천) 두 기계에서 그 project workspace의 agent 목록을 읽어(`ListAgents { workspace }`, 이 컴퓨터 쪽은 `THIS_COMPUTER_READS`에 `ListAgents`를 더하고 machine-route 위험 test 표에 줄을 더한다) agent마다 `ListSessions`를 부르고 합쳐 최근 순으로 자른다. 줄에 agent 이름을 붙인다. 잃는 것: 읽기 횟수가 agent 수만큼 는다.
  - (중간) `ListSessions`의 `agent`를 선택으로 바꿔 workspace의 모든 agent session을 한 번에 돌린다. 잃는 것: 이 route를 쓰는 모든 곳의 계약이 바뀐다.
