id: shortcuts-widened-app-panel-keys
version: 0.18.0
title: "단축키: tab·split·desk·float의 일과 새 탭을 키로, 겹침을 보고 풀고, 앱 panel을 키로 연다"
modules: [packages/shell/ipc, packages/shell/main, packages/shell/preload, packages/shell/renderer, packages/core/config, packages/design]
checked: [architecture-keybindings]
change: |
  전: 작업대 단축키 표는 18 command(tab 이동·닫기·다시 열기·옮기기, n번째 tab, 칸 focus, Split right, sidebar, Explorer, Search, 터미널 focus, Open a file)였다. context menu의 Close others·Unsplit·Close group·Float·Detach, desk 바꾸기·만들기, + menu의 새 탭은 키가 없었다. main이 renderer로 보내는 키는 command 이름이라 번호를 실을 수 없었다. Settings › Keyboard는 이미 쓰는 키를 거절만 했고 저장된 키끼리의 겹침은 보이지 않았다. 앱 panel 화면을 키로 여는 길이 없었다. menu와 tooltip은 키를 보이지 않았다.
  후:
  - 표가 59 command다. 줄마다 section(Tabs, Split, Desks, Floating, Open, View, Apps)이 있다. 새 기본 키: `Ctrl/Cmd+T` browser, `Ctrl/Cmd+N` 새 lophn session, `Ctrl/Cmd+O` 파일 열기, `` Ctrl+Shift+` `` 새 터미널, `Ctrl/Cmd+Shift+\` 아래로 split, `Ctrl/Cmd+Alt+Shift+화살표` 옆 칸과 바꾸기, `Alt+PageUp/Down` 한 칸에 쌓인 tab 돌려 보기, `Ctrl/Cmd+Shift+N` 새 desk, `Ctrl/Cmd+Alt+PageUp/Down` desk 앞·뒤, `Ctrl+Shift+1~9` n번째 desk, `Ctrl/Cmd+Alt+B` 오른쪽 sidebar, 이동 기록 뒤로·앞으로(other `Ctrl+Alt+-`·`Ctrl+Shift+-`, mac `Ctrl+-`·`Ctrl+Shift+-`), `Ctrl/Cmd+,` Settings, Copy path(`Alt+Shift+C`, mac `Cmd+Alt+C`)와 Copy relative path. 드물거나 지우는 일(Close others·right·saved·all, Rename, Keep open, Reveal, Move out of pane, Remove from split, Unsplit, Close group, Float, Detach, Dock, Minimize floats, desk 이름 바꾸기·닫기, Inbox, Jobs)은 키 없이 표에 있다.
  - context menu(tab 줄 오른쪽 클릭, card 머리 ⋯), + menu, 빠른 실행 Terminal·Browser·Search·고정 앱과 New session tooltip, 팔레트 행동 행, desk 목록의 New desk가 그 일의 키를 보인다(design `MenuItem.shortcut`, `useKeyLabel`). Settings에서 키를 바꾸면 바로 따라 바뀐다.
  - 앱 단축키: Settings › Keyboard › Apps에 설치된 앱의 panel 화면마다 줄이 있다. 키를 달면(`app.panel:<app>:<surface>`) 고정과 상관없이 그 화면을 연다. 지운 앱의 키는 "없는 앱" 줄로 남아 지울 수 있다.
  - browser page·앱 view에 focus가 있어도 main이 먼저 받는 키: tab 이동·닫기·다시 열기, 새 browser, desk 앞·뒤·n번째, 모든 앱 단축키.
  - Settings › Keyboard: section 묶음, 키 없는 줄의 Not set, 맨 위의 겹친 키 수와 "Show conflicts only", 겹친 줄의 상대 이름과 Remove. 이미 쓰는 키를 누르면 거절 대신 "<키> is used by <이름>. [Replace] [Cancel]"이고 Replace는 다른 줄에서 그 키만 빼고 이 줄에 단다. 글자 편집 키(`Ctrl/Cmd+A·C·V·X·Z`, redo)와 OS 키(`Cmd+Q·H·M·Tab·Space`, `Cmd+Shift+3·4·5`, `Alt+F4`, `Alt+Tab`)는 달 수 없다.
  - 그 place에 그 일이 없으면 키를 삼키지 않는다(Home의 터미널·Explorer·desk, group이 아닐 때 칸 키, float이 없을 때 float 키, 이동 기록이 없을 때 뒤로·앞으로).
  - 계약: main → renderer `shell:shortcut`의 payload가 binding id 글자다(`tab.close`, `desk.nth:3`, `app.panel:<app>:<surface>`). `MainCommand`·`isMainCommand`는 없다. core 설정 `shell.keybindings`의 key 길이 상한이 160, 항목 수 상한이 256이다.

  검증: unit test(기본 표의 겹침 없음과 RESERVED, `app.panel` id 읽기, 저장 값의 겹침, binding id payload 검사, Replace가 다른 줄에서 그 키만 빼기), `check:full`, core 두 번 기동, renderer build. Electron 창에서 키를 눌러 보지는 않았다.
why: |
  사람이 tab·split·group·desk가 다른 앱과 달라 context menu에만 있는 일이 많으니 단축키를 크게 넓히고, 사람이 고치고, 겹침을 알아채고, 빠른 실행 앱도 키로 열게 해 달라고 했다(사람 2026-11-05).
decisions:
  - text: |
      자주 쓰고 이름난 키가 있는 것(VS Code·Chrome)만 기본 키를 준다. 나머지는 Settings에서 단다.
    by: agent
  - text: |
      Linux·Windows의 `Ctrl+Alt+숫자`는 AltGr 배열에서 `{ [ ] @`를 쳐서 쓰지 않는다. desk 번호는 `Ctrl+Shift+숫자`다.
    by: agent
  - text: |
      편집기의 `Shift+Mod+\`(괄호 짝으로 가기)는 아래로 split이 가린다. Linux 터미널의 `Alt+PageUp/Down`은 쌓인 tab 돌려 보기가 가져간다.
    by: agent
  - text: |
      앱 단축키는 표 밖의 동적 binding으로 같은 `shell.keybindings`에 저장한다. 겹침 판정과 main 통로를 그대로 쓴다.
    by: agent
  - text: |
      겹치면 표 순서가 앞인 binding이 받는다(전과 같다). 이미 쓰는 키는 거절하지 않고 Replace를 준다.
    by: agent
  - text: |
      `inbox.open`·`jobs.open`은 왼쪽 sidebar overlay가 아니라 Inbox·Jobs 탭을 연다. overlay 상태가 sidebar component 안에만 있다.
    by: agent
follow_up: |
  사람이 Electron에서 볼 것: browser 탭 page에 focus가 있을 때 `Ctrl+T`·`Ctrl+Alt+PageDown`·앱 단축키, Linux 터미널에서 `Ctrl+T`·`Ctrl+N`·`Ctrl+O`가 shell로 가는지, Replace 뒤 창을 다시 열어도 키가 남는지, mac의 `Ctrl+Shift+숫자`·`` Ctrl+Shift+` ``가 OS 키와 겹치지 않는지. 열린 이슈는 `project-docs/issues/keybindings.md`에 하나다.
