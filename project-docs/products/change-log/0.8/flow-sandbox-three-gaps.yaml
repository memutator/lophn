id: flow-sandbox-three-gaps
version: 0.8.0
title: 'flow process sandbox의 틈 셋을 막았다'
modules: [packages/core/main, packages/sdk, packages/core/agent-workspaces]
checked: [architecture-layers, architecture-app-call, tool-check-deps, context-component-registry, architecture-approval, architecture-testing, architecture-eval, architecture-activation, architecture-agent-call, architecture-run, architecture-agent-definition, architecture-annotation, architecture-artifact, architecture-ui-kit, tool-e2e, tool-test-live, tool-dev, tests-support, tool-models-snapshot]
change: |
  전:
  - flow process는 workflow 폴더 안 symlink를 따라 폴더 밖을 읽을 수 있었다.
  - memory 한도가 없었다.
  - `flow.ts`가 `Deno.stdout.write`로 쓰면 core와의 통로가 깨져 host가 process를 끝냈다.
  후:
  - launch 때 host가 workflow 폴더 전체를 훑어(앱과 같은 `realPathResolver`의 `linksIn`) 실제 경로가 폴더 밖이거나 풀리지 않는 symlink마다 `--deny-read=<lexical 경로>`를 더한다(`packages/core/main/flow-host/flags.ts`의 `flowFlags`).
  - `--v8-flags=--max-old-space-size=512`를 늘 더한다. 넘으면 process가 죽고 `program_exited` 줄에 끝 code와 stderr 끝이 남는다.
  - `packages/sdk/flow/wire.ts`가 원래 `Deno.stdout.write`를 잡아 두고 통로는 그것만 쓴다. `entry.ts`는 `flow.ts`를 import하기 전에 `Deno.stdout.write`·`writeSync`를 stderr로 돌린다.
  - SDK `guide.md`와 PM skill `guide-workflows`가 memory 한도, 폴더 밖 symlink, stdout 돌리기를 말한다.
why: |
  flow는 AI가 짠 code라 앱과 같은 sandbox 경계를 지켜야 한다. 계획 `flow`가 알고 넘긴 틈 셋이다.
decisions:
  - text: '훑기와 launch 사이에 새로 생긴 link는 막지 못한다. 앱의 `permissions.limit.symlink-changes`와 같은 한계다.'
    by: agent
  - text: 'memory는 512 MiB다. flow는 agent와 앱 tool을 부르는 순서를 짜는 code라 넉넉하다.'
    by: agent
  - text: 'CPU 한도는 OS 한도(`prlimit`)가 필요해 두지 않았다. 앱의 한도를 정할 때 같이 정한다. 시간 한도는 계획 `flow`대로 두지 않는다.'
    by: agent
  - text: '`Deno.stdout.writable` stream은 돌리지 않는다. 실수로 부를 만한 길은 `write`와 `writeSync`다.'
    by: agent
  - text: '진짜 flow process를 띄우는 test는 두지 않았다. worker가 SDK entry를 따로 돌려 `Deno.stdout.write`·`writeSync`·`console.log`가 stderr로 가고 stdout에는 통로 줄만 남는 것을, lead가 `flowFlags`의 flag 그대로 `deno run`을 돌려 폴더 안 link는 읽히고 폴더 밖 link는 `NotCapable`이며 heap 한도가 512 MiB 근처로 줄어든 것을 손으로 확인했다.'
    by: agent
follow_up: |
  - `project-docs/issues/workflow.md`의 열린 이슈: flow process에 CPU 한도가 없다.
