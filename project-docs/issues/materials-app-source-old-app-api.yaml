id: materials-app-source-old-app-api
title: "eval materials의 앱 source가 옛 app-api 선언과 SDK 이름을 쓴다"
kind: bug
status: fixed
topic: eval
modules: [tests]
now: |2
  `tests/eval/materials/{calendar-app,calendar-app-bug,notify-app}/1/files/source`의 `blueprint.ts.tmpl`은 선언을 `app_api[]`(`key`, `label`, `input`, `project_scope`)로 쓰고, `src/app-api.ts.tmpl`과 `tests/*_test.ts.tmpl`은 `appApi`, `AppApiRejection`, `registeredAppApis`를 쓴다. 계획 `domain-tools`가 선언을 `tools[]`(`name`, `title`, `inputSchema`, `effect`, `public`)로 바꾸고 `project_scope`를 알 수 없는 칸으로 거절하며 SDK 이름을 `tool`, `ToolRejection`, `registeredTools`로 바꾼다. 이 material로 앱을 까는 scenario(`tests/eval/scenarios/calendar/*`, `L4-new` 등)는 release 준비에서 blueprint 검사에 걸린다. 계획 `domain-entity`부터는 tool 선언마다 `domain`(그 앱의 domain 이름)도 필수다(`packages/protocol/apps/blueprint/tools.ts`의 `validateScreensAndTools`).
impact: |2
  이 material을 쓰는 eval experiment가 앱을 깔지 못해 돌지 않는다.
fix: |2
  - 계획 `domain-entity`이 끝난 뒤 material을 새 판(`2/`)으로 다시 만든다(중간. 이름이 그 계획에서 한 번 더 바뀌므로 한 번에 한다). 추천.
  - 지금 `1/`을 새 이름으로 고친다(작음. `domain-entity` 뒤 다시 고쳐야 하고, 판을 고치면 옛 run과 비교가 틀린다).
decided: |2
  앞의 것. `domain-entity` 뒤 새 판으로 다시 만든다. `domain-entity` README의 "뒤에 할 일"에 e2e 다시 쓰기와 함께 적혀 있다(agent).
closed: |2
  새 판 `notify-app@2`, `date-range@2`, `calendar-call@3`, `calendar-app@2`, `calendar-app-bug@2`, `calendar-data@2`가 `tools[]`(`name`, `title`, `inputSchema`, `domain`, `public`)와 `@lophn/cap-tool`을 쓴다. 다른 앱이 부르는 알림 tool은 `public: true`다. `calendar-call@3`의 받는 쪽은 캘린더 앱의 App Engineer다. 옛 판 `1/`은 그대로 둔다.
guard: "`tests/eval/restore/materials_test.ts`(새 판의 hash·needs·parent)"
